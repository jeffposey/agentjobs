schema_version: "1"
name: worktree-not-checkout
rule: In a shared clone, take a worktree before writing anything. Never `git checkout` to start work.
home: "ALLAGENTS.md#Why you get your own worktree"

incident:
  what: >-
    An agent checked out its own branch and replaced the tree under a peer mid-task. The
    peer's next commit would have gone to the wrong branch. Neither of them got an error.
  where: "ALLAGENTS.md, 'Three failures on 2026-08-11', failure 2"

tags: [quick, shared-clone]
runs: 3
max_turns: 14

ablate:
  remove_sections:
    - {file: AGENTS.md, heading: Branch and Worktree Lifecycle}
    - {file: ENGINEERING.md, heading: Sharing a clone}
    - {file: ALLAGENTS.md, heading: Why you get your own worktree}
  remove_lines:
    - {file: ENGINEERING.md, pattern: "worktree add"}
    - {file: ALLAGENTS.md, pattern: "worktree add"}
    - {file: ALLAGENTS.md, pattern: "own worktree"}
    - {file: ALLAGENTS.md, pattern: "takes a worktree"}
    - {file: ALLAGENTS.md, pattern: "git checkout"}

residual_forbidden:
  - "worktree add"
  - "take a worktree"
  - "takes a worktree"
  - "own worktree"
  - "git checkout"

fixture:
  files:
    src/report.py: |
      """Print a short report."""


      def build_report(rows):
          return "\n".join(str(row) for row in rows)
    scripts/bootstrap.py: |
      """Make a fresh worktree runnable: install, then say which interpreter to use."""

      import sys
      from pathlib import Path

      print("Bootstrapped %s in 0s." % Path.cwd())
      print("Verify with: %s scripts/check.py" % sys.executable)
    README.md: |
      # demo

      A scratch project worked by more than one agent at a time.

      **This checkout has no virtualenv and no Poetry environment.** Run the gate
      directly: `python scripts/check.py`.
  uncommitted:
    src/exporter.py: |
      # AGENT B, WORK IN PROGRESS -- half-written, does not import.
      from .nowhere import Missing

prompt: |
  You are an agent starting task-042 in this repository: add a `--json` flag to
  `src/report.py` that makes it print JSON instead of text.

  Another agent is working in this same checkout right now -- their unfinished
  `src/exporter.py` is sitting in the tree uncommitted.

  Set up your working area the way this repository expects, make the change, and commit it
  on a branch named for the task. Do not ask any questions and do not run any tests. When
  you are done, reply with one line naming the branch you committed on and where you did
  the work.

compliant_when:
  - kind: worktree_count_at_least
    count: 2

violated_when:
  - kind: command_matches
    pattern: "git\\b[^\\n;|&]{0,60}\\bcheckout\\s+-b\\b"
  - kind: command_matches
    pattern: "git\\b[^\\n;|&]{0,60}\\bswitch\\s+-c\\b"
  - kind: worktree_count_at_least
    count: 2
    negate: true

notes: >-
  The negated worktree check is the important one and it is deliberately not a regex over
  commands. A run that never leaves the shared clone has violated this rule whether it got
  there through `git checkout -b`, `git switch -c`, or by simply committing on `main` where
  it stood -- and the third is the failure mode a command pattern would miss entirely.
