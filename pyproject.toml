[tool.poetry]
name = "agentjobs"
version = "0.1.0"
description = "Lightweight task management system for AI agent workflows"
authors = ["Jeff Posey <jposey@hellfiregames.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jeffposey/agentjobs"
repository = "https://github.com/jeffposey/agentjobs"
keywords = ["ai", "agents", "task-management", "workflow", "automation"]
packages = [{ include = "agentjobs", from = "src" }]
include = [
    { path = "src/agentjobs/frontend_dist", format = ["sdist", "wheel"] },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
pyyaml = "^6.0"
fastapi = "^0.119"
uvicorn = {extras = ["standard"], version = "^0.31.1"}
jinja2 = "^3.1"
typer = "^0.20.0"
watchdog = "^3.0"
# The httpx and python-multipart floors are set by the official MCP SDK below,
# not chosen independently. Raising them was the cost of adding `agentjobs mcp`.
httpx = "^0.27"
python-multipart = "^0.0.9"
# Official Model Context Protocol Python SDK, used by the `agentjobs mcp` STDIO
# server. Pinned to the 1.x line: the wire protocol is negotiated at initialize
# time, but the SDK's Python API is only stable within a major version.
mcp = "^1.29"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-asyncio = "^0.23"
# The Python suite is 89% of scripts/check.py and 2538 tests. xdist runs it across every
# core: 431s serial, 43s at `-n auto` on a 32-core machine, same tests, same result
# (task-233). The gate passes `-n auto`; a hand-run pytest stays serial, because xdist
# costs more than it saves on a small selection and its interleaved output is worse to
# read when you are debugging one test.
pytest-xdist = "^3.8"
black = "^23.12"
ruff = "^0.1"
mypy = "^1.8"
linkml = "^1.11.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocs-glightbox = "^0.5.2"
types-pyyaml = "^6.0.12.20260724"

[tool.poetry.scripts]
agentjobs = "agentjobs.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# No addopts. Coverage used to live here, which meant every invocation of pytest --
# the gate, one file, a -k selection -- instrumented the whole package and wrote an HTML
# report nobody opens before a commit. Measured cost on the full suite: 63 seconds, 13%
# of the pytest stage (task-233). Ask for it when you want it:
#
#     scripts/check.py --coverage        # the gate, with coverage
#     pytest --cov=src/agentjobs         # directly
#
# Parallelism is deliberately not here either; scripts/check.py passes `-n auto` so the
# gate is parallel and a hand-run pytest is not. See PARALLEL_ARGS in that file.
filterwarnings = [
    "ignore:Unclosed <MemoryObjectReceiveStream>:ResourceWarning"
]

[tool.black]
line-length = 100
target-version = ["py311"]
# Generated by LinkML from schema/*.yaml. Reformatting it would be overwritten by the
# next run of scripts/regen-schema-docs.sh and would make the regenerated diff noise.
extend-exclude = "^/schema/generated/"

[tool.ruff]
line-length = 100
target-version = "py311"
# Same reason as black's exclude: these files are regenerated, never hand-edited, so
# findings in them are not actionable.
extend-exclude = ["schema/generated"]

[tool.ruff.lint.per-file-ignores]
# Standalone example scripts manipulate sys.path before importing agentjobs so they can
# run from a clone without installing the package. That is the point of an example, not
# a defect, and rewriting them to satisfy E402 would make them worse at their job.
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
# Pydantic's own mypy plugin. Without it, mypy reads model __init__ signatures off the
# annotations and rejects `Webhook(url="https://...")` because the field is HttpUrl --
# even though passing a str is the documented, coercing, correct way to build one. The
# plugin models that coercion, which removes a class of false positives that would
# otherwise be silenced with casts.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["schema/generated"]
# disallow_untyped_defs is deliberately NOT set here, and switched on for the package
# below instead. The flag exists to keep the package's own API surface honestly typed;
# applying it to tests and example scripts buys nothing, since a test is a no-argument
# function returning None and annotating ~50 of them to satisfy a flag is ceremony
# rather than safety. Tests and examples are still type-checked -- a genuine type error
# in one still fails the run -- they are just not required to carry annotations.
#
# Expressed as an opt-in rather than a list of exemptions because mypy module patterns
# only wildcard whole components (`agentjobs.*` works, `test_*` does not), and tests/
# has no __init__.py so its modules are top-level. An exemption list would silently
# stop covering new test files.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "agentjobs.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information and have no stubs available.
# yaml is handled properly instead, via the types-PyYAML dev dependency, so its calls
# are actually checked rather than waved through. flask is imported by one example
# script and is not a dependency of the package at all.
# jsonschema arrives as a dependency of the MCP SDK and ships no stubs; the MCP
# server uses it to validate tool arguments against their published schemas.
module = ["uvicorn.*", "httpx.*", "flask.*", "linkml.*", "jsonschema.*"]
ignore_missing_imports = true
