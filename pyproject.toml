[tool.poetry]
name = "agentjobs"
version = "0.1.0"
description = "Lightweight task management system for AI agent workflows"
authors = ["Jeff Posey <jposey@hellfiregames.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/jeffposey/agentjobs"
repository = "https://github.com/jeffposey/agentjobs"
keywords = ["ai", "agents", "task-management", "workflow", "automation"]
packages = [{ include = "agentjobs", from = "src" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
pyyaml = "^6.0"
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
jinja2 = "^3.1"
typer = "^0.20.0"
watchdog = "^3.0"
httpx = "^0.26"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-asyncio = "^0.23"
black = "^23.12"
ruff = "^0.1"
mypy = "^1.8"
linkml = "^1.11.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocs-glightbox = "^0.5.2"
types-pyyaml = "^6.0.12.20260724"

[tool.poetry.scripts]
agentjobs = "agentjobs.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src/agentjobs --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore:Unclosed <MemoryObjectReceiveStream>:ResourceWarning"
]

[tool.black]
line-length = 100
target-version = ["py311"]
# Generated by LinkML from schema/*.yaml. Reformatting it would be overwritten by the
# next run of scripts/regen-schema-docs.sh and would make the regenerated diff noise.
extend-exclude = "^/schema/generated/"

[tool.ruff]
line-length = 100
target-version = "py311"
# Same reason as black's exclude: these files are regenerated, never hand-edited, so
# findings in them are not actionable.
extend-exclude = ["schema/generated"]

[tool.ruff.lint.per-file-ignores]
# Standalone example scripts manipulate sys.path before importing agentjobs so they can
# run from a clone without installing the package. That is the point of an example, not
# a defect, and rewriting them to satisfy E402 would make them worse at their job.
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
# Pydantic's own mypy plugin. Without it, mypy reads model __init__ signatures off the
# annotations and rejects `Webhook(url="https://...")` because the field is HttpUrl --
# even though passing a str is the documented, coercing, correct way to build one. The
# plugin models that coercion, which removes a class of false positives that would
# otherwise be silenced with casts.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["schema/generated"]
# disallow_untyped_defs is deliberately NOT set here, and switched on for the package
# below instead. The flag exists to keep the package's own API surface honestly typed;
# applying it to tests and example scripts buys nothing, since a test is a no-argument
# function returning None and annotating ~50 of them to satisfy a flag is ceremony
# rather than safety. Tests and examples are still type-checked -- a genuine type error
# in one still fails the run -- they are just not required to carry annotations.
#
# Expressed as an opt-in rather than a list of exemptions because mypy module patterns
# only wildcard whole components (`agentjobs.*` works, `test_*` does not), and tests/
# has no __init__.py so its modules are top-level. An exemption list would silently
# stop covering new test files.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "agentjobs.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information and have no stubs available.
# yaml is handled properly instead, via the types-PyYAML dev dependency.
module = ["uvicorn.*", "httpx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# yaml ships no type information. types-PyYAML is installed as a dev dependency for the
# package's own modules; this silences the same complaint for third-party imports that
# have no stubs available at all.
module = ["uvicorn.*", "httpx.*"]
ignore_missing_imports = true
