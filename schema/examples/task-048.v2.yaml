# ---- the specification -------------------------------------------------------
# v1 had one 5,240-character `description` blob plus a 1,900-character
# `prompts.starter` that largely restated it. Both are split here along the
# questions an agent actually asks.
spec:
  summary: >-
    A deliberate design pass over the task schema before implementing piecemeal
    changes, since the schema is the core of the product rather than incidental
    plumbing. Produces a design doc with rationale and rejected alternatives.

  intent: |
    The schema, the workflow, and the human/agent interfaces *are* the product --
    the rest is framework. So the schema deserves an explicit design pass rather
    than incremental accretion.

    This must land before task-045 implements its schema changes. Task-045 carries
    two schema changes specified in isolation; designing those separately and then
    redesigning them is backwards.

  description: |
    Work through the owner's ideas for the next schema iteration. For each proposed
    change record: what changes, the motivation, what breaks (loading, API, GUI,
    existing files), migration needed, and alternatives rejected with reasons.

    Write the result to `docs/schema-design.md`. The rejected alternatives matter
    most -- they are the part no future reader can recover from a diff, and the part
    that stops the same debate recurring.

  constraints: |
    - **This task produces decisions and a written spec, not code**, with one
      exception: the round-trip corpus test, built first as a safety net.
    - **Collaborative.** The owner leads the agenda and has ideas to work through.
      Do not finalise solo. If you find yourself deciding the owner's open questions
      for them, stop and ask.
    - The versioning decision recorded at authoring time is not to be relitigated
      mid-pass; revisit it deliberately at the end.

  out_of_scope: |
    - **Implementing any schema change.** Implementation happens in separate tasks
      derived from this one.
    - **Writing those derived task files is itself deliverable work, not clerical.**
      It is in scope for the task overall but NOT for any session that has not been
      told to do it. See log entry 12: an earlier session produced six task files
      from a prompt that asked only for the design document, because acceptance
      criteria read as authorisation. Confirm session scope before producing tasks.
    - Schema *tooling* (LinkML, docs site, diagram rendering). Instrumentally needed
      to evaluate the design, but its own concern -- see task-056.

  context:
    - path: docs/schema-design.md
      why: The deliverable. Sections 11 and 12 are what needs sign-off.
    - path: src/agentjobs/models.py
      why: The v1 schema being redesigned. 13 classes, Task is the root aggregate.
    - path: schema/agentjobs-v2.yaml
      why: The design in machine-readable form; compiles and validates.
    - path: tests/test_task_corpus.py
      why: The safety net. Any model change that strands a file fails here by name.

