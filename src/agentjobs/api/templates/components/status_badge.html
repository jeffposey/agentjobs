<span class="px-2 py-1 text-xs font-medium rounded
    {% if task.lifecycle == 'closed' %}{% if task.archived %}bg-gray-800 text-gray-400{% elif task.outcome == 'completed' %}bg-green-900 text-green-200{% else %}bg-gray-700 text-gray-300{% endif %}
    {% elif task.ball == 'human' %}bg-orange-900 text-orange-200
    {% elif task.ball == 'external' %}bg-red-900 text-red-200
    {% elif task.lifecycle == 'active' %}bg-blue-900 text-blue-200
    {% elif task.lifecycle == 'ready' %}bg-cyan-900 text-cyan-200
    {% elif task.lifecycle == 'draft' %}bg-purple-900 text-purple-200
    {% else %}bg-gray-700 text-gray-300{% endif %}">
    {{ task.display_status }}
</span>
