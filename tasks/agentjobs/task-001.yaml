spec:
  summary: Separate pre-implementation design approval from merge-oriented final approval
    in the human action UI.
  intent: Make multi-gate tasks truthful in the UI so the human can approve a design
    without appearing to authorize code that does not exist yet.
  description: The first external-project pilot exposed a remaining review-surface
    mismatch. A task handed to a human for pre-implementation design approval showed
    the same Approve wording used for final code review and implied permission to
    merge. The durable task record had to override that wording explicitly, and the
    agent had to repair the post-approval handoff prompt before implementation could
    begin.`n`nAdd a human action for approving a design or plan that returns the ball
    to the agent for implementation without implying merge or task completion. Keep
    final code approval as a separate review action.
  constraints: Preserve the existing final review/merge approval path. The selected
    action must write an accurate handoff prompt and log entry without requiring a
    manual corrective handoff.
  out_of_scope: Changing the job-hunting project or its React dashboard.
