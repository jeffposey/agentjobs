spec:
  summary: 'task-123 added the draft-to-ready promotion verb but only wired it into
    the machine-facing surfaces. Promote is reachable from MCP, REST and the Python
    client, and from neither of the two surfaces a human actually uses: the React
    app and the CLI. This umbrella tracks closing both.'
  intent: A verb that exists in the manager but not in any human interface is not
    shipped. Finish task-123's reach so a human who writes a draft can promote it
    wherever they happen to be standing.
  description: "`promote` is the only exit from `draft`. It exists in the manager\
    \ (`manager.promote_task`, `src/agentjobs/manager.py:783`), the REST API (`POST\
    \ /api/projects/{project_id}/tasks/{task_id}/promote`, `src/agentjobs/api/routes/status.py:238`),\
    \ the MCP tools (`src/agentjobs/mcp/mutation_tools.py:622`) and the Python client\
    \ (`client.py:671`).\n\nIt exists in neither human surface:\n\n- **React app**\
    \ \u2014 the generated client already binds the endpoint (`frontend/src/api/generated/sdk.gen.ts:307`),\
    \ but nothing outside `generated/` calls it. Tracked as task-004.\n- **CLI** \u2014\
    \ `grep promote src/agentjobs/cli.py` returns nothing. Tracked as task-005.\n\n\
    The React gap is the sharper one because the UI opens a loop it cannot close:\
    \ `TaskCreate.tsx:116` lets a human create a draft, and `Dashboard.tsx:123-126`\
    \ shows a drafts panel telling them those drafts \"need a decision before they\
    \ become work\" \u2014 with no control anywhere to make that decision.\n\nThe\
    \ two children are independent and can be worked in either order. Neither requires\
    \ backend, schema, or client-regeneration work; both are surface wiring over a\
    \ verb that already exists and already validates.\n\nThe general lesson, worth\
    \ stating once at this level rather than twice in the children: adding a verb\
    \ to the manager is not the end of the change. Its reach across surfaces is part\
    \ of the feature, and task-123 closed without it."
  constraints: "No backend behaviour changes anywhere under this umbrella \u2014 not\
    \ the manager verb, not the REST route, not the MCP tool, not the OpenAPI schema.\
    \ Every child goes through the existing validated path. Each child meets the repo's\
    \ verification bar on its own: `poetry run python scripts/check.py` green, plus\
    \ the change exercised the way a user would exercise it."
  out_of_scope: "Changing what promote does or when it is legal. Auditing surface\
    \ coverage for verbs other than promote \u2014 task-005 records what it finds\
    \ about the CLI's coverage, but acting on those findings is separate work."
  context:
  - path: src/agentjobs/manager.py
    why: promote_task at line 783 - the authoritative behaviour both children wire
      up to.
  - path: src/agentjobs/api/routes/status.py
    why: Line 238, the REST route and its PromoteRequest revision contract.
  - path: tasks/agentjobs/task-123-draft-to-ready-promotion-verb.yaml
    why: The completed task that added the verb; this umbrella is its unfinished reach.
