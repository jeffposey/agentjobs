- id: 4
  ts: '2026-08-17T21:37:24.887099Z'
  actor: claude
  type: decision
  body: "Three decisions the diff will not explain.\n\n1. SIBLING PANEL, NOT A WIDENED\
    \ REVIEW GATE. The spec offered both. Chosen: a separate `PromotePanel` in TaskDetail.tsx\
    \ gated on `lifecycle === \"draft\"`, rendered above `ReviewPanel`, which is untouched.\
    \ Rejected alternative: widening ReviewPanel's `ball === \"human\"` gate and adding\
    \ a fourth button. Approve / Request Changes / Reject are merge-review actions\
    \ \u2014 \"\u2713 Approve \u2014 agent may merge\" \u2014 and promote is not a\
    \ review verdict; putting it in that row would have made a draft's promotion read\
    \ as approving work that does not exist yet. Gating on lifecycle rather than on\
    \ the ball is also the more honest condition: it is exactly when `manager.promote_task`\
    \ accepts the verb.\n\n   Consequence worth stating: a draft's ball is `human`,\
    \ so ReviewPanel ALSO renders on a draft, and a draft therefore shows both panels\
    \ \u2014 promote, and the three merge-review buttons that do not really apply\
    \ to it. That is pre-existing and redesigning those three is explicitly out of\
    \ scope, so I left it. See the separate finding entry.\n\n2. THE REFUSAL MESSAGE\
    \ RENDERS OUTSIDE THE PANEL. Initially it rendered inside PromotePanel, which\
    \ is where the spec's wording points (\"report failure in the panel\"). The e2e\
    \ conflict test caught that this is wrong: the conflict worth reporting almost\
    \ always arrives because somebody else promoted the task, so by the time the message\
    \ exists the task is no longer a draft, the draft-gated panel has returned null,\
    \ and the message disappears with it. The observed failure was a click that visibly\
    \ did nothing. `PromoteError` is now a separate element rendered whenever `promoteError`\
    \ is set, regardless of lifecycle. Rejected alternative: keeping it inside and\
    \ rendering the panel for non-drafts when an error is present \u2014 that would\
    \ have put a section headed \"Draft \u2014 not claimable yet\" on a ready task.\n\
    \n3. A REFUSAL READER RATHER THAN A REGENERATED CLIENT. New file `frontend/src/api/mutation-error.ts`.\
    \ The API's 409s carry `{code, message, detail, suggested_action}`, but the generated\
    \ types declare only 422 for these operations because the OpenAPI schema does\
    \ not enumerate the 409s \u2014 so the thrown value is typed as a validation error\
    \ it is not. Rejected alternative: regenerating the client, which the constraints\
    \ forbid and which would not have helped anyway, since the omission is in the\
    \ schema rather than in the generation. `readRefusal` narrows the unknown thrown\
    \ value and returns null for anything unstructured, so a network failure is distinguishable\
    \ from a refusal instead of both rendering the same sentence."
