spec:
  summary: The React app has no way to promote a draft to ready, so a human can create
    a draft in the UI and cannot advance it there. The endpoint and the generated
    client binding both already exist; only the control is missing.
  intent: 'Close the loop the UI already opens: the dashboard invites a human to create
    drafts and tells them drafts need a decision before they become work, so the UI
    must be where that decision can be made.'
  description: "The generated frontend client already binds the endpoint \u2014 `promoteTaskApiProjectsProjectIdTasksTaskIdPromotePost`\
    \ in `frontend/src/api/generated/sdk.gen.ts:307`, with a TanStack mutation in\
    \ `@tanstack/react-query.gen.ts`. Nothing in `frontend/src` outside `generated/`\
    \ references it. The only mutations the app wires up are approve, request-changes\
    \ and reject (`frontend/src/App.tsx:128-130`) plus task creation. This is a wiring\
    \ gap, not a missing endpoint: no backend work and no client regeneration is expected.\n\
    \nThe dead end is concrete. `TaskCreate.tsx:116` offers a Draft/Ready radio, so\
    \ a human can create a draft from the UI. `Dashboard.tsx:123-126` shows a drafts\
    \ panel captioned as work \"that need[s] a decision before they become work\"\
    , linking to `?status=draft`. Follow that link, open the draft, and there is no\
    \ way to make the decision: `ReviewPanel` in `TaskDetail.tsx:40` returns null\
    \ unless `ball === \"human\"`, and its actions are approve/changes/reject \u2014\
    \ none of which promote.\n\nBuild the control:\n\n- Surface it on the task detail\
    \ page for tasks with `lifecycle === \"draft\"`. `ReviewPanel` is currently gated\
    \ on the ball, so either widen that gate deliberately or add a sibling panel;\
    \ whatever renders must not imply the merge-review semantics of the existing three\
    \ buttons.\n- Send `expected_revision` from the loaded task and handle a `revision_conflict`\
    \ by re-reading and re-presenting, the same contract the MCP path follows. Do\
    \ not retry blindly.\n- Carry the acting user the way approve/reject already do\
    \ (`detail.identity`), and let the human supply an optional promotion note \u2014\
    \ `manager.promote_task` falls back to \"Promoted by {actor}; the spec is finished\
    \ and it is claimable.\" when no body is given, and a human promoting from the\
    \ UI usually has a better sentence than that.\n- Report failure in the panel rather\
    \ than swallowing it; `invalid_transition` (already promoted, or not a draft)\
    \ is the expected non-exceptional error and should read as an explanation, not\
    \ a crash."
  constraints: "Frontend-only. Use the existing generated client \u2014 do not hand-write\
    \ the request, and do not regenerate the API client as part of this change. `poetry\
    \ run python scripts/check.py` must pass, and the change must be exercised against\
    \ a freshly started server through the real `/app/` route, not only in Vitest.\
    \ Assert on rendered values, not on the presence of markup."
  out_of_scope: The CLI `promote` command (sibling task under the same parent). Any
    change to the promote endpoint, the manager verb, the MCP tool, or the OpenAPI
    schema. Redesigning the review panel's existing approve/request-changes/reject
    actions.
  context:
  - path: frontend/src/App.tsx
    why: Where the three existing task mutations are wired to the generated TanStack
      hooks; the promote mutation belongs alongside them.
  - path: frontend/src/components/TaskDetail.tsx
    why: ReviewPanel is gated on ball === 'human' at line 40 and holds the existing
      action buttons; the promote control lands here or beside it.
  - path: frontend/src/components/Dashboard.tsx
    why: Lines 123-126 are the drafts panel that promises a decision the UI cannot
      currently make.
  - path: frontend/src/components/TaskCreate.tsx
    why: Line 116 lets a human create a draft from the UI, which is what creates the
      dead end.
  - path: frontend/src/api/generated/sdk.gen.ts
    why: Line 307 already binds the promote endpoint; no regeneration needed.
  - path: src/agentjobs/manager.py
    why: promote_task at line 783 - the transition rules, the default log body, and
      the invalid_transition case the UI must present.
