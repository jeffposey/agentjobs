    \ Jeff also proposed that promote is \"basically just renaming what Approve does\"\
    , and that needing the separate `promote` verb behind it is a backend design flaw.\
    \ I disagreed, on evidence, and he did not overrule that part \u2014 the change\
    \ stays UI-only.\n\nThe two verbs are structurally different, not cosmetically:\n\
    - `approve` (tasks.py:376) calls `handoff(ball=agent, ball_reason=work)` and deliberately\
    \ does NOT touch `lifecycle`.\n- `promote` (manager.py:783) moves `lifecycle`\
    \ draft\u2192ready AND clears `assignment.owner` AND sets ball agent/available.\n\
    \nClicking approve on a draft would therefore leave `lifecycle: draft` with `ball:\
    \ agent/work`. `get_next_task()` returns only `ready` tasks, so that task becomes\
    \ permanently unclaimable \u2014 precisely the failure `promote_task`'s docstring\
    \ names: \"without this verb a drafted task stays unclaimable for good.\" Merging\
    \ the two endpoints would mean one route branching on lifecycle internally, which\
    \ moves the complexity out of sight rather than removing it.\n\nSo: the flaw was\
    \ real and it was in the UI. The verb set stays as it is. `request-changes` and\
    \ `reject` are unchanged and already phase-agnostic \u2014 only their labels change\
    \ \u2014 and the primary button dispatches to `promote` on a draft and `approve`\
    \ otherwise.\n\nCONSEQUENCE ACCEPTED: the panel keeps its `ball === \"human\"\
    ` gate rather than gaining a second lifecycle-based entry condition, because one\
    \ panel with one gate is the point. A draft parked on `external` or `agent` therefore\
    \ shows no promote control in the UI; that is an odd state a draft should rarely\
    \ be in, and the CLI and MCP still reach it."
