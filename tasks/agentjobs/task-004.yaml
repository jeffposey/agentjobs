spec:
  summary: "The React app has no way to promote a draft to ready, so a human can create\
    \ a draft in the UI and cannot advance it there. The endpoint and its generated\
    \ client binding both already exist; what is missing is a control \u2014 and the\
    \ right place for it is the review panel the page already has, relabelled for\
    \ the planning phase."
  intent: "Close the loop the UI already opens: the dashboard invites a human to create\
    \ drafts and tells them drafts need a decision before they become work, so the\
    \ UI must be where that decision can be made \u2014 in one coherent set of actions\
    \ for the phase the task is in, not a second box beside the first."
  description: "The generated frontend client already binds the endpoint \u2014 `promoteTaskApiProjectsProjectIdTasksTaskIdPromotePost`\
    \ in `frontend/src/api/generated/sdk.gen.ts:307`, with a TanStack mutation in\
    \ `@tanstack/react-query.gen.ts`. Nothing in `frontend/src` outside `generated/`\
    \ references it. This is a wiring gap, not a missing endpoint: no backend work\
    \ and no client regeneration is expected.\n\nThe dead end is concrete. `TaskCreate.tsx:116`\
    \ offers a Draft/Ready radio, so a human can create a draft from the UI. `Dashboard.tsx:123-126`\
    \ shows a drafts panel captioned as work \"that need[s] a decision before they\
    \ become work\". Follow it, open the draft, and there is no way to make the decision.\n\
    \n**Build it as one phase-aware panel.** `ReviewPanel` in `TaskDetail.tsx` already\
    \ renders whenever the ball is with the human, and already offers the three actions\
    \ a human takes on a task. Two of them are correct during planning exactly as\
    \ they are \u2014 \"here is what the spec is missing\" and \"kill this idea\"\
    \ \u2014 and only their labels read wrong. So the panel changes labels by phase\
    \ and dispatches its primary button by phase:\n\n- **Draft:** `[\u25B2 Promote\
    \ \u2014 make it claimable]` `[\u270E Send feedback]` `[\u2715 Reject & Archive]`\n\
    - **Anything else:** `[\u2713 Approve \u2014 agent may merge]` `[\u270E Request\
    \ Changes]` `[\u2715 Reject & Archive]`\n\nThe primary button calls `promote`\
    \ on a draft and `approve` otherwise. Buttons two and three keep calling `request-changes`\
    \ and `reject` unchanged \u2014 labels only.\n\nThis is a reversal of the original\
    \ approach, which built a separate promote panel beside the review panel. See\
    \ the binding decision in the log. The verbs behind the buttons are NOT merged:\
    \ `approve` moves the ball and leaves `lifecycle` alone, while `promote` moves\
    \ `lifecycle` draft\u2192ready and clears the owner. Calling approve on a draft\
    \ would leave it `draft` + `agent/work`, which `get_next_task()` never returns\
    \ \u2014 permanently unclaimable. The relabelling is a UI concern and stops at\
    \ the UI.\n\nAlso required:\n\n- Send `expected_revision` from the loaded task\
    \ and handle a `revision_conflict` by re-reading and re-presenting, the same contract\
    \ the MCP path follows. Do not retry blindly.\n- Carry the acting user the way\
    \ approve/reject already do (`detail.identity`), and let the human supply an optional\
    \ promotion note \u2014 `manager.promote_task` falls back to \"Promoted by {actor};\
    \ the spec is finished and it is claimable.\" when no body is given.\n- Render\
    \ the promote refusal OUTSIDE the panel. After somebody else promotes the task\
    \ its ball becomes `agent/available` and the whole panel stops rendering, so a\
    \ message inside it disappears at the exact moment it is needed. This was observed,\
    \ not predicted."
  constraints: "Frontend-only. Use the existing generated client \u2014 do not hand-write\
    \ the request, and do not regenerate the API client as part of this change. Do\
    \ not change what `approve`, `request-changes` or `reject` DO; their labels change,\
    \ their endpoints do not. `poetry run python scripts/check.py` must pass, and\
    \ the change must be exercised against a freshly started server through the real\
    \ `/app/` route, not only in Vitest. Assert on rendered values, not on the presence\
    \ of markup."
  out_of_scope: The CLI `promote` command (sibling task under the same parent). Any
    change to the promote endpoint, the manager verb, the MCP tool, or the OpenAPI
    schema. Merging or otherwise altering the approve/promote verbs behind the buttons.
    The TaskList basename bug recorded in this task's log, which is separate work.
  context:
  - path: frontend/src/components/TaskDetail.tsx
    why: ReviewPanel is the panel to make phase-aware; it is gated on ball === 'human'
      and holds the three action buttons.
  - path: frontend/src/App.tsx
    why: Where the task mutations are wired to the generated TanStack hooks; the promote
      mutation belongs alongside approve/changes/reject.
  - path: src/agentjobs/api/routes/tasks.py
    why: 'Line 376 onward: what approve, request-changes and reject actually do. Read
      before assuming any two of them are the same verb.'
  - path: src/agentjobs/manager.py
    why: promote_task at line 783 - moves lifecycle and clears the owner, which is
      what makes it distinct from approve.
  - path: frontend/src/components/Dashboard.tsx
    why: Lines 123-126 are the drafts panel that promises a decision the UI cannot
      currently make.
  - path: frontend/src/api/generated/sdk.gen.ts
    why: Line 307 already binds the promote endpoint; no regeneration needed.
