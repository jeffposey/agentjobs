    \ leaves the React app.\n\n`TaskList.tsx:169` renders `<a href={taskPath(projectId,\
    \ row.task.id)}>`, a raw anchor holding a router path \u2014 `/p/_local/tasks/task-003`\
    \ \u2014 with no `/app` basename. The router is mounted with `basename=\"/app\"\
    ` (main.tsx), so Dashboard.tsx and TaskDetail.tsx use react-router `<Link>` and\
    \ get the prefix; TaskList does not. The browser therefore performs a full navigation\
    \ to `/p/_local/tasks/task-003`, which the server answers with the LEGACY Jinja\
    \ page. Confirmed in a Playwright snapshot: after clicking a task in the list\
    \ the page renders \"Phase 3 Web UI\", \"\U0001F464 Human View\" and \"\U0001F916\
    \ Agent View\", none of which exist in the React app.\n\nSo today the task list\
    \ is a one-way door out of the React UI, and any control added to the React task\
    \ detail page \u2014 including this one \u2014 is unreachable by the most obvious\
    \ route to it. My e2e tests navigate by id instead of clicking the list, with\
    \ a comment saying why, so they test promote rather than this bug.\n\nThis is\
    \ a pre-existing defect unrelated to promote, and widening task-004 to fix it\
    \ would bury a reviewable frontend change inside a routing fix. Recording it here\
    \ rather than acting on it. It wants its own task \u2014 I have not created one,\
    \ because filing new work is Jeff's call.\n\nSECOND, SMALLER OBSERVATION: a draft's\
    \ ball is `human`, so `ReviewPanel` renders on drafts too. A draft now shows the\
    \ promote panel AND the three merge-review buttons (\"\u2713 Approve \u2014 agent\
    \ may merge\") which do not apply to a task whose work has not started. Pre-existing,\
    \ and `out_of_scope` forbids redesigning those three, so untouched. Worth a decision\
    \ at some point about whether ReviewPanel should exclude drafts."
