spec:
  summary: The CLI has no `promote` command. `grep promote src/agentjobs/cli.py` returns
    nothing, so the one verb that exits `draft` is missing from the surface a human
    is most likely to be sitting in front of when they finish writing a spec.
  intent: Make promote reachable from the CLI the same way claim, handoff, release
    and close already are, so the draft exit is not a hole in an otherwise complete
    verb set.
  description: "`promote` exists in the manager (`manager.promote_task`, `src/agentjobs/manager.py:783`),\
    \ the REST API (`src/agentjobs/api/routes/status.py:238`), the MCP tools (`src/agentjobs/mcp/mutation_tools.py:622`)\
    \ and the Python client (`client.py:671`). It does not exist in `src/agentjobs/cli.py`.\n\
    \nAdd the command alongside the existing lifecycle commands, matching whatever\
    \ shape they already use \u2014 do not invent a new convention for this one verb.\
    \ Read the neighbouring claim/handoff/release/close commands first and copy their\
    \ argument names, their actor resolution, their `operation_id` generation, their\
    \ `expected_revision` handling if they do that, and their error rendering. The\
    \ point of this task is that a human typing `agentjobs promote task-042` gets\
    \ the same experience as `agentjobs claim task-042`, not that promote gets a bespoke\
    \ interface.\n\nTwo behaviours worth getting right because the manager already\
    \ has opinions about them:\n\n- An optional note/body. When none is given, `manager.promote_task`\
    \ writes \"Promoted by {actor}; the spec is finished and it is claimable.\" Do\
    \ not duplicate that default in the CLI \u2014 let the manager supply it.\n- `invalid_transition`\
    \ is the expected non-exceptional failure (the task is not a draft, or was already\
    \ promoted). It should print as a plain explanation with a non-zero exit code,\
    \ not a traceback."
  constraints: "Do not change the manager verb, the REST route, the MCP tool, or the\
    \ OpenAPI schema \u2014 this is a CLI surface only. Go through the existing client/manager\
    \ path rather than touching task files. Match the surrounding CLI commands' conventions\
    \ instead of introducing new ones. `poetry run python scripts/check.py` must pass,\
    \ and the command must be run for real against a draft task, not only unit-tested."
  out_of_scope: The React promote control (sibling task under the same parent). Any
    other missing CLI command; if the audit in ac-4 turns up further gaps, record
    them as a finding on this task and let a separate task be filed, rather than widening
    this one.
  context:
  - path: src/agentjobs/cli.py
    why: The file with the gap; the existing lifecycle commands here are the template
      to copy.
  - path: src/agentjobs/manager.py
    why: promote_task at line 783 - transition rules, the default log body, and the
      invalid_transition case.
  - path: src/agentjobs/client.py
    why: Line 671, client.promote - the call the CLI should route through.
