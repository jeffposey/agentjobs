- id: 4
  ts: '2026-08-17T20:55:52.046004Z'
  actor: claude
  type: progress
  body: 'ac-4 audit: CLI verb coverage against the manager. The spec''s premise for
    ac-2 is wrong and the gap is much wider than "promote is missing".


    `grep -n "manager\.[a-z_]*(" src/agentjobs/cli.py` returns exactly five call sites
    (lines 519, 657, 678, 688, 809). Full comparison against the public methods of
    `TaskManager` (`grep -n "^    def [a-z]" src/agentjobs/manager.py`):


    EXPOSED as a standalone command:

    - create_task -> `agentjobs create`

    - list_tasks -> `agentjobs list`

    - get_task -> `agentjobs show`


    REACHABLE ONLY INSIDE the interactive `agentjobs work` flow, never standalone:

    - get_next_task (cli.py:657)

    - claim_task (cli.py:678) - and it is called as `claim_task(id, agent=...)`

    - close_task (cli.py:688) - hardcoded to Outcome.COMPLETED, no other outcome reachable


    NOT EXPOSED ANYWHERE in the CLI:

    - promote_task (this task)

    - handoff

    - release_task

    - archive_task

    - update_task

    - delete_task

    - search_tasks

    - add_log_entry / add_progress_update

    - mark_deliverable_complete

    - dependency_facts / get_subtasks


    So the CLI does not have "an otherwise complete verb set" with one hole in it,
    as the spec assumed. It has three nouns (create/list/show), one scripted happy
    path (`work`), and no standalone state verbs at all. A human at the CLI today
    cannot hand off, release, archive, log progress, or close as anything other than
    completed.


    Consequence for ac-2: there is no claim/handoff/release/close command to copy
    argument names or actor resolution from. See the decision entry that follows for
    what I matched instead. Per the task''s out_of_scope, the remaining gaps are recorded
    here and not acted on; they are worth a separate task.'
  data:
    operation:
      id: c5b8e2a1-9f74-4d03-b16e-8a72c9d05f34
      kind: log_append
      fingerprint: de13e0f85e2a1bb39ab4016c291c1ec4
- id: 5
  ts: '2026-08-17T21:11:28.861526Z'
  actor: claude
  type: decision
  body: "Two decisions the diff will not explain.\n\n1. WHAT THE COMMAND WAS MODELLED\
    \ ON (ac-2). The spec said to copy claim/handoff/release/close. The audit above\
    \ shows they do not exist. Rejected alternative: inventing a richer interface\
    \ for promote alone (--operation-id, --expected-revision, an interactive confirm\
    \ like `work` uses) \u2014 that would have made promote the most sophisticated\
    \ command in a CLI whose other verbs are absent, i.e. exactly the \"new convention\
    \ for this one verb\" the spec forbids. Chosen instead: `show` as the template,\
    \ because it is the only other command that takes a positional task id and has\
    \ to fail on a bad one. Concretely matched \u2014 positional TASK_ID argument\
    \ (show:805); `typer.secho(..., fg=typer.colors.RED)` then `raise typer.Exit(code=1)`\
    \ on failure (show:811-812); `Path.cwd()` + `_build_manager(base_dir)` (show:807-808);\
    \ success line with the emoji prefix used by create/load-test-data. Neither operation_id\
    \ nor expected_revision is exposed: no other CLI command exposes them, and a single-shot\
    \ local process has no retry story that would use them. The manager generates\
    \ its own operation_id.\n\n2. ACTOR RESOLUTION. `--actor`, falling back to the\
    \ project's `default_user` from .agentjobs/config.yaml, and refusing with exit\
    \ 1 if neither is present. Rejected alternative: falling back to `getpass.getuser()`\
    \ the way `init` does for its prompt default. `init` is choosing a label for a\
    \ config file a human is about to read; promote is writing an actor into an append-only\
    \ log that nothing rewrites. An unattributed or wrongly-attributed state change\
    \ is worse than a refused one, so the command stops and says what to do. `_resolve_actor`\
    \ is a module-level helper rather than inline so the next state verb added to\
    \ the CLI inherits the same rule."
  data:
