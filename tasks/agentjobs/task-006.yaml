- id: 6
  ts: '2026-08-17T21:30:21.212872Z'
  actor: claude
  type: progress
  body: 'THE HEADLINE: current main is not broken. I could not reproduce the failure
    against it, in two independent browsers, and the live-update client code has not
    changed since it was verified working.


    Evidence, all gathered 2026-08-17 against the running server on 8876 serving the
    packaged frontend:


    1. Full chain verified working on the dashboard. With window.fetch instrumented
    in the page: a real task write (a log entry on this task) moved the server revision
    from 89f9634996e3076c84f3a48c to 22391338739829233c7b464e; the next check fetched
    the revision exactly once and refetched the dashboard exactly once. The rendered
    DOM was then read directly and showed this task as "In flight" and IN PROGRESS
    2 / TOTAL 107 -- current state, on a page that had never been reloaded. That is
    ac-1 and ac-2 behaviour, observed.

    2. Full chain verified working on the task list. Same instrumentation at /app/p/agentjobs/tasks:
    one revision fetch, two data refetches (listTasks and listBrokenTasks).

    3. The interval is alive. With no synthetic events dispatched at all: 4 revision
    polls in 54 seconds, against 3 expected at a 15-second interval.

    4. Verified again in Jeff''s OWN Chrome, not just the harness browser, via the
    Chrome extension: a fresh tab at /app/p/agentjobs loaded bundle /app/assets/index-CHcF4Rgh.js
    -- byte-identical to what the server currently serves -- registered the service
    worker, held cache agentjobs-shell-1e9a3f05bbbc, and polled 4 times in 58 seconds.
    No stale bundle, no stale cache, poller healthy. That tab has been closed again.

    5. The code is unchanged. git log 7cd1bfa..main -- frontend/src/components/LiveUpdates.tsx
    frontend/src/main.tsx returns nothing and the diff is empty. Both files are byte-identical
    to the revision that passed all six of task-086''s acceptance criteria on 2026-08-13,
    including physical tablet proof.


    So all five original hypotheses are now dead or irrelevant to current main:

    - H1 query-key drift: dead as a present cause. Every page subscribes through the
    generated Options helpers and every id is in the allowlist; the predicate was
    additionally asserted against real generated key objects and matches.

    - H2 response caching: dead. The service worker short-circuits /api/ to network
    before any cache, and the revision responses observed were fresh each time.

    - H3 stale service-worker shell: dead. Jeff''s own Chrome loads the current bundle.

    - H4 poller teardown: dead. The QueryClient is module-scoped in main.tsx and exactly
    one poller instance responds to each trigger.

    - H5 server-side digest: dead. The digest moves on every task write, observed
    twice.


    One correction to my own earlier reading, recorded so it is not carried forward:
    I briefly believed one focus event produced seven concurrent pollers. It does
    not -- it produces exactly one request. Those extra requests were interval polls
    that had accumulated across earlier waits and that I misattributed.


    A timing fact that matters for interpreting all of this: the served frontend was
    rebuilt at 21:11 today, which is AFTER the original report and roughly when Jeff
    re-confirmed the failure. Another agent''s merge (the project switcher / promote
    work) rebuilt the static assets. So the build I have exonerated is not necessarily
    the build Jeff''s long-open tabs were running when they went stale. A browser
    tab keeps executing the JavaScript it loaded until it is reloaded; that is ordinary
    behaviour, not a defect, and it would produce exactly what Jeff describes on both
    devices independently -- old code in a long-lived session, fresh data whenever
    the document is actually reloaded by F5 or pull-to-refresh.


    I cannot confirm that from here, and I will not assert it as the cause. The failing
    artefact is the specific browser session Jeff has open, and that is the one thing
    this environment cannot reach: the Chrome extension exposes only tabs it created,
    not his existing ones.'
