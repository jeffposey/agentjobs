ball_prompt: "Two things need you, and the first takes ten seconds.\n\n1. IMMEDIATE\
  \ FIX, no code required. You were on the legacy Jinja UI, not the React app. Open\
  \ http://localhost:8876/app/p/agentjobs (note the /app prefix) and live updates\
  \ work -- verified today in your own Chrome. On the tablet, the installed app must\
  \ point at https://agentjobs.tailfed1df.ts.net/app/ ; if it was installed from the\
  \ bare hostname it is pinned to the Jinja UI and needs reinstalling from the /app/\
  \ URL. C:/ai/shared/launchers/open-agentjobs.ps1 already opens the right URL, so\
  \ launching through it always lands correctly.\n\n2. THE DECISION, which is why\
  \ the ball is yours. http://localhost:8876/ currently 307-redirects to /p/agentjobs,\
  \ which is the deprecated Jinja UI. The supported React app is at /app/. So the\
  \ product's default front door delivers the UI that ENGINEERING.md calls legacy\
  \ and that lacks live updates, and the two URLs differ only by the /app prefix.\
  \ This will keep happening -- to you, and to anyone else who ever runs this -- until\
  \ the routing changes. Which do you want:\n  (a) Redirect / and /p/{project} to\
  \ their /app/ equivalents, making React the default and leaving Jinja reachable\
  \ only by an explicit legacy path. Smallest change that removes the trap. My recommendation.\n\
  \  (b) Retire the Jinja UI entirely. Cleaner end state, larger job, needs its own\
  \ task.\n  (c) Leave routing alone and treat this as a bookmark problem.\nWhichever\
  \ you choose is new work and belongs in its own task; task-006 as filed was a React\
  \ regression that does not exist.\n\n3. MERGE APPROVAL for what is on the branch.\
  \ fix/task-006-live-updates-regression, commit 7939a2a, two files, no behaviour\
  \ change: it exports the invalidation allowlist and adds a drift guard so a future\
  \ project-scoped endpoint cannot silently fall outside live updates. That is ac-5,\
  \ which stands on its own merits regardless of the misdiagnosis. Frontend gate passes\
  \ fully (48 tests, lint, types, build). The Python suite has one failure, tests/test_task_corpus.py::test_agentjobs_context_paths_exist,\
  \ which is pre-existing and fails in ANY worktree because task-002 references .agents/plugins/marketplace.json,\
  \ a file git-excluded from everything but the main clone. Nothing in this branch\
  \ touches Python or task files.\n\nAlso worth a decision, not filed because I was\
  \ not authorised to widen scope: that corpus test fails for every agent that follows\
  \ the mandatory worktree rule."
