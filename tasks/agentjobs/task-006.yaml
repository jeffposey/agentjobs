  body: "Human evidence from Jeff, 2026-08-17, answering ac-3 and narrowing the hypotheses\
    \ sharply.\n\nObserved:\n- Desktop Chrome on Windows: fails to auto-update. Confirmed\
    \ again just now.\n- Installed PWA on the tablet: ALSO fails to auto-update. The\
    \ pre-fix mobile behaviour is therefore \"broken\", same as desktop.\n- Backgrounding\
    \ the tablet app and foregrounding it did NOT produce an update. This is the case\
    \ task-086 ac-5 verified as passing on 2026-08-13.\n- Pull-to-refresh on the tablet\
    \ DID update it. Pull-to-refresh is a full document reload, so it proves the server\
    \ has the new data and the API returns it; it says nothing about the poller.\n\
    \nWhat this eliminates:\n- Hypothesis 3, a stale desktop service-worker shell,\
    \ is dead. It predicted mobile would be fine. Mobile is not fine.\n- Anything\
    \ Chrome-on-Windows-specific -- an extension, a desktop-only cache setting, one\
    \ stale long-lived tab -- is dead for the same reason. Two different devices,\
    \ two different origins (loopback 8876 and the Tailscale host), same failure.\n\
    - The server having stale data is dead: a reload shows current data immediately.\n\
    \nWhat this points at: the fault is in the shared React client, on the path between\
    \ \"poll detects a change\" and \"the view rerenders\". Both platforms run the\
    \ same bundle, so a client-side defect is the only hypothesis consistent with\
    \ all three observations.\n\nThe foreground-return detail is the sharpest signal\
    \ available and deserves care. `visibilitychange` firing on resume is what ac-5\
    \ tested, and it is tested deterministically in LiveUpdates.test.tsx, which passes.\
    \ Two readings remain and they need different fixes:\n  (a) the trigger never\
    \ fires or the poller is not running, so no request is made; or\n  (b) the request\
    \ is made and the revision comparison works, but the invalidation does not reach\
    \ the queries the visible components are actually subscribed to.\nReading (b)\
    \ is now the favourite. Hypothesis 1 -- the hardcoded PROJECT_TASK_QUERY_IDS allowlist\
    \ -- predicts exactly this shape: polls succeed, revision advances, nothing rerenders,\
    \ and a hard reload fixes it because a reload refetches everything regardless\
    \ of query keys. Hypothesis 4, a torn-down effect, predicts (a) instead.\n\nNext\
    \ step is to distinguish (a) from (b) by observing whether the revision requests\
    \ are actually being issued, before touching any code. Jeff's report cannot settle\
    \ that; only the network panel or an instrumented run can."
