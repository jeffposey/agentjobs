spec:
  summary: Filed as a React live-update regression; it was not one. The failing browser
    session was the legacy Jinja UI, which has no live updates and never did. GET
    / redirects to /p/{project} (Jinja) while the React app lives at /app/, so reaching
    AgentJobs by address rather than through the launcher lands on the deprecated
    UI. The React app was verified healthy in two browsers. Closed with a drift guard
    shipped; the routing fix is filed separately.
  intent: 'Reported by Jeff on 2026-08-17 from ordinary use: task records changed
    while the dashboard sat open and the page went on showing the old state until
    reloaded by hand, on desktop Chrome and on the installed tablet app.


    The report was accurate. The diagnosis in this task''s original spec was not:
    it assumed the failing page was the React app and reasoned from there through
    five hypotheses, all of which turned out to be irrelevant. Reading the failing
    tab''s script tags settled it in seconds and should have been the first move.


    Kept rather than cancelled because the investigation is the value here: it establishes
    that the React live-update path is healthy, and it found a real product defect
    underneath the false one.'
  description: '## What was actually wrong


    Nothing, in the React app. Jeff''s browser was on the legacy server-rendered Jinja
    UI, which has no live-update mechanism -- task-086 listed "Live updates for the
    Jinja UI" in its own out_of_scope.


    The decisive evidence was the failing tab''s loaded scripts: cdn.tailwindcss.com,
    alpinejs, and marked. The React app loads exactly one script, /app/assets/index-*.js,
    and no CDN tags.


    Verified by request:

    - GET / returns 307 -> /p/{project}, which serves the Jinja UI

    - GET /app/p/{project} serves React


    The two addresses differ only by the /app prefix, so a typed hostname, an old
    bookmark, or an app installed from the bare root all land on the deprecated UI.
    The launcher at C:/ai/shared/launchers/open-agentjobs.ps1 opens /app/ correctly,
    so anything launched through it was always fine.


    This accounts for every symptom: both devices affected; F5 and pull-to-refresh
    working, because a server-rendered page only updates on document reload; and foreground
    return doing nothing, because that UI has no visibilitychange handler.


    ## What was verified about the React app


    Healthy, in two independent browsers including Jeff''s own Chrome: the 15-second
    interval polls (4 polls in 54s and in 58s), a real task write moved the server
    revision, the poller detected it, invalidated, and the dashboard and task list
    refetched, with the rendered DOM confirmed current on a page never reloaded. LiveUpdates.tsx
    and main.tsx are byte-identical to the revision that passed all six of task-086''s
    criteria on 2026-08-13.


    ## What shipped here


    The ac-5 drift guard only. Live updates refetch a hardcoded allowlist of generated
    query ids, and omitting an entry is invisible -- polls keep succeeding while the
    view silently stops updating. Every project-scoped generated query must now be
    classified as task data or explicitly exempt with a reason, and the predicate
    is asserted against real generated key objects rather than strings.


    ## What did not ship


    The routing fix. Jeff chose to redirect / and /p/{project} to their /app/ equivalents;
    that is filed as its own task.


    ## Sibling app: not affected


    The job-search dashboard on 8766 serves its React app at the root (200, assets/index-*.js,
    no /app route) and has no Jinja UI, so it needs no equivalent redirect. Checked
    2026-08-17.'
  constraints: 'Historical, from the original filing, and retained because they still
    bind anyone touching live updates:

    - Steady state is one small request, not a full task list.

    - A failed refresh never blanks the last successfully loaded view.

    - One dropped request does not report the server as unreachable.

    - navigator.onLine never decides what is displayed.

    - Refresh fires on visibilitychange, not only focus.

    - No server-sent events and no websockets: task-086 rejected both with reasoning,
    and reopening either needs a measurement, not a preference.'
  out_of_scope: Rebuilding the live-update transport. Adding live updates to the legacy
    Jinja UI -- the answer there is to stop sending people to it, not to reimplement
    the feature twice. Notifications outside the browser. The routing change itself,
    which is separate work.
  context:
  - path: frontend/src/components/LiveUpdates.tsx
    why: The client-side poller and the invalidation allowlist. Verified healthy and
      unchanged since task-086; now also carries the explicit exempt list the drift
      guard checks.
  - path: frontend/src/components/LiveUpdates.drift.test.tsx
    why: The drift guard shipped by this task. Read it before adding a project-scoped
      read endpoint, because it will fail until the new query is classified.
  - path: src/agentjobs/api/routes/web.py
    why: The root route and _redirect_to_default, which send a browser to the Jinja
      UI rather than the React app -- the actual defect this task uncovered.
  - path: tasks/agentjobs/task-086-live-updates.yaml
    why: 'The original live-update feature: rejected transports, six acceptance criteria,
      and the verification this task re-confirmed rather than contradicted.'
