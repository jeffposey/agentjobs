- id: 4
  ts: '2026-08-17T21:20:07.462069Z'
  actor: claude
  type: progress
  body: 'Localisation in progress. Ruling out, with evidence rather than reading:


    - Service worker caching of the API (hypothesis 2, and the service-worker half
    of hypothesis 3) is DEAD. frontend/src/service-worker.js line 30 short-circuits
    any same-origin GET under /api/ to `event.respondWith(fetch(request))` before
    any cache is consulted, with a comment saying task data is always network-only.
    Nothing in the SW can serve a stale revision.

    - Query-key drift (hypothesis 1) is WEAKENED to near-dead for the visible views.
    Every page in App.tsx subscribes through the generated `...Options()` helpers
    -- DashboardPage uses getDashboardApiProjectsProjectIdDashboardGetOptions, TaskListPage
    uses listTasksApiProjectsProjectIdTasksGetOptions plus listBrokenTasks..., TaskDetailPage
    uses getTaskDetailApiProjectsProjectIdTasksTaskIdDetailGetOptions. All three ids
    are in PROJECT_TASK_QUERY_IDS, so the predicate should match them.

    - Poller teardown by unstable queryClient identity (hypothesis 4) is DEAD. main.tsx
    line 10 constructs the QueryClient once at module scope, outside the component
    tree, so its identity never changes and the effect''s dependency array is stable.


    Live observation against the running server on 8876, React app at /app/p/agentjobs,
    instrumented by wrapping window.fetch in the page:

    - The poller is running. Exactly one instance: one dispatched `focus` event produces
    exactly one GET /api/projects/agentjobs/revision. An earlier reading that suggested
    seven concurrent pollers was me misattributing requests that had accumulated across
    several waits; corrected here so the record does not carry it forward.

    - The revision endpoint responds 200 and the server-side digest is live (curl
    showed revision 89f9634996e3076c84f3a48c, task_count 107).


    Measurement caveat worth recording, because it invalidated my first attempt: the
    browser-pane tab reports document.visibilityState === "hidden" even while displayed
    in the harness. Chrome clamps and then intensively throttles setTimeout in hidden
    tabs, so "no interval polls appeared during a 25-second wait" is NOT evidence
    the interval is broken in this environment. Triggering the check by dispatching
    a focus event sidesteps the throttle and is the measurement this diagnosis rests
    on. Anyone re-running this must account for the same confound.


    Still open, and the next thing to measure: whether a revision CHANGE produces
    a refetch of the dashboard query. That distinguishes branch (a) from branch (b)
    and is the last fork before a cause can be named. This log entry exists partly
    to move the revision itself.'
