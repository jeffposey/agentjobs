  body: "ROOT CAUSE CONFIRMED. The React app was never the thing failing to update.\
    \ Jeff was not looking at the React app.\n\nThe decisive evidence came from Jeff's\
    \ actual failing tab. Asked to print its loaded scripts, it returned:\n  https://cdn.tailwindcss.com,\
    \ https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js, https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js\n\
    \nThose are the legacy Jinja UI's CDN scripts. The React app loads exactly one\
    \ script, /app/assets/index-CHcF4Rgh.js, and no CDN tags at all. So the failing\
    \ session was the server-rendered Jinja UI, which has no live-update mechanism\
    \ and never did -- task-086 listed \"Live updates for the Jinja UI\" in its out_of_scope,\
    \ so this is absence of a feature in that UI, not a regression in the one that\
    \ has it.\n\nHow a person lands there, verified by request:\n- GET http://localhost:8876/\
    \ returns 307 -> http://localhost:8876/p/agentjobs\n- GET /p/agentjobs serves\
    \ the Jinja UI (cdn.tailwindcss.com and alpinejs present)\n- GET /app/p/agentjobs\
    \ serves React (/app/assets/index-CHcF4Rgh.js, no CDN)\n\nThe server's default\
    \ route therefore delivers the deprecated UI. The two addresses differ only by\
    \ the /app prefix and are otherwise identical, so /p/agentjobs and /app/p/agentjobs\
    \ are near-indistinguishable in a browser bar, in a bookmark, and in an installed\
    \ app's start_url. C:/ai/shared/launchers/open-agentjobs.ps1 does the right thing\
    \ -- it opens /app/ on both the tailnet URL and the loopback fallback -- so anything\
    \ not launched through it, a typed hostname or an older bookmark or an app installed\
    \ from the root, lands on Jinja.\n\nThis explains every observation without residue,\
    \ including the ones that killed the earlier hypotheses:\n- Both devices affected:\
    \ both reach the app by address, not by launcher.\n- F5 and pull-to-refresh work:\
    \ Jinja is server-rendered, so a document reload is the only way it ever gets\
    \ new data. That is its normal behaviour, not a symptom.\n- Foreground return\
    \ does nothing: there is no visibilitychange handler in that UI to fire.\n- Every\
    \ test I ran passed: I was on /app/, the React app, which is healthy.\n\n\"It\
    \ used to update automatically\" is consistent with this too, and is worth stating\
    \ precisely because it is the part a future reader will doubt. Jeff verified live\
    \ updates on 2026-08-13 during task-086 review -- on the React app, at the URLs\
    \ that review used. The Jinja UI he is on now is a different surface that never\
    \ had the feature. Nothing regressed; the session moved.\n\nCorrection to my own\
    \ framing, recorded because the task title and summary now misstate the problem:\
    \ this task was filed as a React regression on the strength of a reasonable but\
    \ wrong inference, and I carried that inference forward through five hypotheses\
    \ before testing the one assumption underneath all of them -- that the failing\
    \ page was the React app. The cheapest possible check, reading the failing tab's\
    \ script tags, was the one that settled it. Worth remembering that \"which build\
    \ is it running\" should have been \"which application is it running\".\n\nStatus\
    \ of the task's own acceptance criteria under the corrected diagnosis:\n- ac-1\
    \ is met by this entry.\n- ac-2 and ac-3 are met for the React app by the evidence\
    \ in the previous entry, in two browsers including Jeff's own Chrome, but they\
    \ are now the wrong criteria: they test a surface that was never broken.\n- ac-4\
    \ holds -- task-086's six criteria are unaffected, and its code is unchanged.\n\
    - ac-5 is met by commit a69f78a, described in the next entry.\n- ac-6 is not yet\
    \ met; see the next entry for exactly what passed and what did not.\n\nWhat remains\
    \ is a product decision rather than a defect fix, and it belongs to Jeff: whether\
    \ the default route should stop delivering the deprecated UI."
