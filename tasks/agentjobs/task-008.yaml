spec:
  summary: The React task list renders each row's link as a raw anchor whose href
    omits the router's /app basename, so clicking a task performs a full page load
    into the legacy Jinja task page. The user leaves the React app without any indication,
    and live updates stop working from that point on.
  intent: 'Reported by Jeff on 2026-08-17, immediately after task-006 concluded that
    his stale dashboard was explained by how he reached the app. That conclusion was
    incomplete, and this is the missing half: the React app ejects users into the
    legacy UI by itself. No bookmark, no typed address, no stale install required
    -- open React, click a task, and you are in Jinja.


    This is the better explanation of the original report. It is also worse than what
    task-006 described, because it needs no user error at all and it happens on the
    single most common action in the product.


    The consequence is the same one that makes it matter: the Jinja UI has no live
    updates, so from the moment a user clicks a task they are looking at a page that
    will never change until they reload it. The merge gate assumes a human watching
    a dashboard notices a review request.'
  description: "## The defect\n\n`frontend/src/components/TaskList.tsx` line 169 renders\
    \ each row as:\n\n```tsx\n<a href={taskPath(projectId, row.task.id)} ...>\n```\n\
    \nand `taskPath` (line 91) returns `/p/{project}/tasks/{id}`.\n\nEvery path builder\
    \ in the frontend deliberately omits the `/app` prefix, because `main.tsx` mounts\
    \ the router with `basename=\"/app\"` and react-router's `Link` applies it. That\
    \ is correct and consistent \u2014 in `App.tsx`, `Dashboard.tsx`, `TaskDetail.tsx`,\
    \ and `DependencyGraph.tsx`, all of which use `<Link>`.\n\n`TaskList.tsx` is the\
    \ only file that uses a raw `<a href>`. A raw anchor is not routed: the basename\
    \ is never applied, the browser performs a real navigation to `/p/{project}/tasks/{id}`,\
    \ and the server serves the Jinja task page there.\n\nAudited 2026-08-17: this\
    \ is the only instance. `ProjectSwitcher.tsx` has no `Link` either but navigates\
    \ via `useNavigate()`, which respects the basename. The remaining raw anchors\
    \ in the codebase point at `/docs`, the FastAPI documentation, which is genuinely\
    \ outside the React app and correct as-is.\n\n## The fix\n\nUse `Link` from react-router-dom,\
    \ as every other in-app navigation does. This also restores client-side routing\
    \ for that click, which is a second thing the raw anchor broke: the current behaviour\
    \ is a full document load, discarding the SPA and every cached query.\n\nDo not\
    \ \"fix\" this by hardcoding `/app` into `taskPath`. That would diverge from the\
    \ other builders, and it would break again the moment the basename changes.\n\n\
    ## The guard\n\nA test that fails if an in-app link escapes the React app. Assert\
    \ the *rendered* href, not the source: render the task list inside a router configured\
    \ with `basename=\"/app\"` and assert the row link's href begins with `/app/`.\
    \ A raw anchor fails that assertion; a `Link` passes it.\n\nWorth extending to\
    \ the other components that link to tasks, since the class of bug is \"someone\
    \ used an anchor instead of a Link\" and nothing currently prevents it anywhere."
  constraints: '- Use react-router navigation for in-app targets. Do not hardcode
    the /app prefix into path builders.

    - Keep the row''s existing keyboard and touch affordances; it is a full-row click
    target and must stay one.

    - Assert the rendered href, not the presence of a Link component in source. The
    bug is what the browser does with the markup.

    - Genuine external links (/docs) stay raw anchors and must not be swept up.'
  out_of_scope: 'The server-side default-route redirect, which is task-007 and remains
    worth doing independently: it protects people who arrive by address, while this
    protects people already inside the app. Retiring the Jinja UI. Any redesign of
    the task list.'
  context:
  - path: frontend/src/components/TaskList.tsx
    why: Line 169 is the raw anchor and line 91 the path builder it uses. The single
      defect.
  - path: frontend/src/main.tsx
    why: Mounts the router with basename="/app", which is why unprefixed paths are
      correct for Link and wrong for a raw anchor.
  - path: frontend/src/components/Dashboard.tsx
    why: 'The correct pattern to follow: same unprefixed path builder, navigated with
      Link.'
  - path: tasks/agentjobs/task-007.yaml
    why: The complementary server-side fix for people who arrive by address rather
      than by clicking.
