  actor: claude
  type: progress
  body: 'Fixed, guarded, and verified in a real browser. Branch fix/task-008-task-list-link,
    worktree C:/projects/aj-008, commit 23dad82, two files.


    The change:

    - frontend/src/components/TaskList.tsx: the row link is now a react-router `Link`
    instead of a raw `<a href>`, with `Link` added to the existing react-router-dom
    import. The path builder is untouched and still returns an unprefixed `/p/...`,
    matching the four other builders in the codebase; the basename is the router''s
    job.

    - frontend/src/components/InAppLinks.test.tsx: new guard, four tests.


    Audit result, so nobody re-does it: TaskList was the ONLY offender. Dashboard,
    TaskDetail, DependencyGraph and App all already use `Link`. ProjectSwitcher has
    no `Link` but navigates with `useNavigate()`, which applies the basename. The
    remaining raw anchors point at `/docs`, which is FastAPI''s documentation, genuinely
    outside the React app, and correctly left alone -- the guard has an explicit allowance
    for it and a test asserting it stays unprefixed.


    Why the existing tests missed it, which is the part worth carrying forward: every
    component test renders inside a bare `<MemoryRouter>`, which has no basename.
    Without a basename a `Link` and a raw anchor produce identical hrefs, so no existing
    test could have distinguished them, and TaskList.test.tsx passes today against
    the broken code. The new guard renders with `basename="/app"` and asserts no in-app
    href escapes the prefix. It also asserts a non-zero link count so it cannot pass
    vacuously if the links disappear.


    Guard verified by reverting: with the raw anchor restored, two of the four tests
    fail and the message names the exact escaped hrefs (`/p/inbox/tasks/task-001`,
    `/p/inbox/tasks/task-002`). Restored, all four pass. A check I have not watched
    fail is decoration.


    Real-browser verification, on a server freshly started from this worktree on port
    8899 serving this branch''s build (assets/index-2yVqyTin.js):

    - The task rows render as /app/p/agentjobs/tasks/task-008 etc. Before the fix
    they rendered as /p/agentjobs/tasks/....

    - Clicking a row programmatically landed on /app/p/agentjobs/tasks/task-008, the
    page had no cdn.tailwindcss.com script (so React, not Jinja), and the React task
    detail for task-008 rendered with its title, critical priority, and current ask.

    - ac-3 specifically: a sentinel set on `window` before the click was still present
    after it, proving client-side routing rather than a document load. That sentinel
    is the whole test -- a full page load destroys it.


    Gate:

    - Frontend `npm run check` exits 0: 13 test files, 52 tests, generated-client
    check, lint, TypeScript, production build.

    - `poetry run python scripts/check.py` exits 1 on 1227 passed / 1 failed. The
    failure is again tests/test_task_corpus.py::test_agentjobs_context_paths_exist,
    and the assertion names `task-002 has missing context path .agents/plugins/marketplace.json`
    -- the same pre-existing, worktree-only failure documented in task-006, caused
    by a git-excluded file that exists solely in the shared clone. This branch touches
    no Python and no task files. ac-6 is satisfied by its own escape clause.


    A note on my own process, since it nearly bit: the first `git worktree add ../aj-008`
    created the worktree INSIDE the repository at frontend/aj-008, because the shell''s
    working directory had drifted to frontend/src between commands. It was removed
    and recreated with an absolute path. A worktree inside the clone would have been
    picked up by the frontend build and lint. Use absolute paths for worktree creation.'
