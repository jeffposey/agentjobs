ball_prompt: 'Ready for merge approval. Branch fix/task-008-task-list-link, commit
  23dad82, two files.


  What changed: the task list row is now a react-router `Link` rather than a raw `<a
  href>`. That one character class was the whole bug -- raw anchors are not routed,
  so the /app basename was dropped and clicking a task loaded the Jinja page. Path
  builders are untouched.


  You can check it yourself without merging: a server from the worktree is running
  on port 8899 serving this branch. Open http://localhost:8899/app/p/agentjobs/tasks
  and click any task. It should stay in the React app. Stop that server when you are
  done with it -- it is a review fixture, not something to leave running, and the
  real one on 8876 is untouched.


  Evidence: clicking a row lands on /app/p/agentjobs/tasks/task-008, renders the React
  detail page, and a sentinel set on `window` before the click survives it -- which
  proves client-side routing rather than a full page load. The new guard renders components
  WITH a basename (the existing tests use a bare MemoryRouter, which is exactly why
  none of them caught this) and fails if any in-app href escapes the prefix; I confirmed
  it fails on the old raw anchor before trusting it. Frontend gate green: 13 files,
  52 tests, lint, types, build. Python: 1227 passed, 1 failed -- the same pre-existing
  task-002 git-excluded context path that fails in every worktree, unrelated to this
  branch.


  On approval I will rebase, merge --no-ff, close, and remove the worktree.


  One thing worth your attention beyond this merge: task-007 (the server-side redirect)
  is now more clearly worth doing, not less. This fix protects people already inside
  the React app; task-007 protects people who arrive by address. They are different
  doors to the same room, and today both were open.'
