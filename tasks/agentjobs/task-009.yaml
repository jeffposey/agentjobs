  text: Clicking a task row in the React task list opens the React task detail page
    and stays inside the React app.
  verify: 'Real browser against a running server: click a row, confirm the URL keeps
    the /app prefix and the page renders React regions such as ''Full specification''
    rather than the legacy ''Human View'' / ''Agent View'' buttons.'
  status: pending
- id: ac-2
  text: An audit records every other place in frontend/src that builds a router path
    into a raw anchor, and each is either fixed or recorded as deliberate with the
    reason.
  verify: grep output and findings logged on this task.
  status: pending
- id: ac-3
  text: 'The e2e workaround is removed: promote-draft.spec.ts opens tasks by clicking
    the list, the way a user does, and still passes.'
  verify: Diff plus a passing Playwright run.
  status: pending
- id: ac-4
  text: "A test fails if this regresses \u2014 asserting on where the click actually\
    \ lands, not merely that an anchor exists."
  verify: Show the test failing against the unfixed code, then passing.
  status: pending
- id: ac-5
  text: poetry run python scripts/check.py passes.
  verify: Command output on the task.
  status: pending
