  actor: claude
  type: progress
  body: '# Specced from the reported stub. Root cause found; no code written.


    The task was filed from the UI as a title, one line of hypothesis and a screenshot.
    It now carries a specification. **Nothing is implemented** -- it stays `ready`/`agent`/`available`
    and is claimable.


    ## The diagnosis, so it is not re-derived


    The Status column of the task list renders the entire `ball_prompt` with no length
    bound. `DependencyState.tsx` puts the raw prompt into its `reasons` array for
    three states (`ball === "external"`, `ball === "human"`, and the final fallback),
    then renders each reason as a `break-words` paragraph, which wraps indefinitely
    rather than clipping. `TaskList.tsx:183` uses that component in the Status cell.


    **Jeff''s reported hypothesis -- "only on ones needing spec or review" -- is nearly
    right, and the correction matters for the fix.** Those labels are the `ball ===
    human` states, which are the states that carry a prompt at all. Every one of them
    renders its prompt in full. It only *looks* selective because most prompts are
    a single sentence: `task-123`''s is "Finish specifying this task." The trigger
    is prompt length, not task state.


    ## The thing that makes this a one-line-rule fix rather than a judgement call


    `Dashboard.tsx:24` already defines `truncate()` and already applies it to `ball_prompt`
    at 160 characters on line 99. It is module-private, so `DependencyState` cannot
    see it. The application therefore already holds a decision about how much of this
    field may render in a list -- made once, in one component, and unknown to the
    other. sc-3 asks for that divergence to be closed rather than for a third local
    helper.


    ## Deliberately not folded in


    `DependencyState` uses `key={reason}` -- the whole reason string as a React key.
    Fragile, and duplicate reasons would collide. Recorded in `out_of_scope` rather
    than fixed, because it is a separate defect and bundling it would make the diff
    harder to review than the fix deserves.


    ## Verified


    Read the attached screenshot on log entry 1 and traced every `ball_prompt` and
    `DependencyState` reference in `frontend/src`. The four call sites are Dashboard:52,
    DependencyGraph:78, TaskDetail:322 and TaskList:183 -- listed in the constraints
    because a fix must be checked against all of them, not just the reported one.'
