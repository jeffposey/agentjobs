spec:
  summary: In the task list, the Status column renders a task's entire ball_prompt
    untruncated, so a task carrying a long prompt produces a several-hundred-word
    wall of text in a single table row. The dashboard already truncates the same field;
    the list does not.
  intent: The task list is a scanning surface. A reader should be able to sweep the
    Status column and tell at a glance which tasks are actionable and which are waiting
    on them. One task with a long ask currently destroys that for the whole page.
  description: 'Reported by Jeff from the AgentJobs UI at `/p/agentjobs/tasks` on
    2026-08-18, with a screenshot attached to log entry 1.


    ## What the screenshot shows


    The row for `task-076-dispatch-permission-posture` occupies roughly two thirds
    of the visible page. Its Status cell renders the task''s complete `ball_prompt`
    -- an approximately 700-word decision write-up -- as body text inside the table.
    The four rows above it are each two lines tall. The reported symptom is entirely
    a rendering problem; the underlying task record is fine and long prompts are correct
    and wanted.


    ## Root cause, traced


    `src/components/DependencyState.tsx` builds a `reasons` array that, for several
    states, contains the raw `ball_prompt` with no length bound:


    - `ball === "external"` -> `[task.ball_prompt || "Waiting for an external dependency."]`

    - `ball === "human"` -> `[task.ball_prompt]`

    - the final fallback -> `[task.ball_prompt]`


    Its render maps `reasons` to `<p className="break-words text-xs leading-5">`,
    which wraps forever rather than clipping. `src/components/TaskList.tsx:183` puts
    that component in the Status cell, so the list inherits the unbounded text.


    ## Why it looked intermittent


    Jeff''s reported hypothesis was that it happens "only on ones needing spec or
    review". That is very close to right, and the reason is worth recording because
    it explains the shape of the fix:


    Those labels correspond to states where `ball` is `human` and a `ball_prompt`
    exists. Every such row renders its full prompt. Most prompts are one sentence
    -- `task-123`''s is "Finish specifying this task." -- so the defect is invisible
    until a task carries a long one. It is not conditional on the state; it is conditional
    on prompt length, and the states Jeff noticed are simply the ones that have prompts
    at all.


    ## The divergence that allowed it


    `src/components/Dashboard.tsx:24` defines `truncate(text, limit)` as a module-private
    function and applies it at line 99 to exactly this field, at a 160-character limit.
    It is not exported and `DependencyState` does not use it. So the application already
    contains a decision about how long this field may render, made in one component
    and unknown to the other. The fix should remove that divergence rather than add
    a third local rule.'
  constraints: '- The full `ball_prompt` must remain readable somewhere obvious. `TaskDetail.tsx`
    renders it in full at lines 90 and 321; that behaviour is correct and must not
    be truncated.

    - Do not fix this by shortening prompts or by capping `ball_prompt` at the schema
    or API layer. A long, complete ask is the schema working as intended -- the resumption
    contract in ALLAGENTS.md depends on it. This is a presentation bug and the fix
    belongs in presentation.

    - One shared truncation rule, used by every list surface. Do not add a second
    private helper.

    - `DependencyState` is also used by `Dashboard.tsx:52`, `DependencyGraph.tsx:78`
    and `TaskDetail.tsx:322`. Check the change against all four call sites; the `compact`
    prop already distinguishes list from detail use and may be the right lever.'
  out_of_scope: Redesigning the task list layout or the Status column's contents.
    Changing what `dependencyState()` chooses as a label. The React `key={reason}`
    on the reasons map uses the entire string as a key, which is fragile but is not
    this defect -- note it, do not fix it here.
  context:
  - path: frontend/src/components/DependencyState.tsx
    why: Root cause. Builds `reasons` from an untruncated `ball_prompt` and renders
      it in an unbounded paragraph.
  - path: frontend/src/components/TaskList.tsx
    why: Line 183 renders DependencyState in the Status cell -- the surface Jeff reported.
  - path: frontend/src/components/Dashboard.tsx
    why: Line 24 has the private `truncate()` and line 99 already applies it at 160
      chars to this same field. The rule to unify on.
  - path: frontend/src/components/TaskDetail.tsx
    why: Lines 90 and 321 render the full prompt deliberately. Must stay full.
