  actor: claude
  type: progress
  body: "Second pass, on Jeff's review: *\"It should not require pressing answer questions\
    \ button to get the multiple choice question prompt, that should be in default\
    \ view.\"*\n\nHe is right, and the reason is the one this task exists for. The\
    \ agent has already said, in its handoff, that it is waiting on four specific\
    \ decisions. A button that reveals them asks the reader to request the thing they\
    \ came to do \u2014 and on a phone it costs a tap, a scroll and a reorientation\
    \ before the first option is even on screen. Behind a control was the wrong side\
    \ of the disclosure.\n\n## What changed\n\n**Open questions render whenever the\
    \ panel does.** They sit in their own section between the \"Acting as ...\" line\
    \ and the verb row, with a free-text box per question, an \"Anything else (optional)\"\
    \ prose field, and a **\u2713 Send answers** button of their own. Nothing is clicked\
    \ to get there.\n\n**The \"\u270E Answer Questions\" verb disappears where questions\
    \ are open.** A button that opens the form the reader is looking at is not a second\
    \ verb, it is the same one twice. Where a task has *no* open questions it is unchanged\
    \ \u2014 the prose composer is still behind it, which is exactly what task-231\
    \ shipped.\n\nThat made `PanelVerbs.secondary` nullable. It is the rule task-231\
    \ already applies to `primary`, extended one field: a control appears only where\
    \ its verb is true.\n\n**A held task is not offered its questions at all**, however\
    \ many are open on it. Answering hands the ball back to `agent`/`answer`, which\
    \ would lift the hold \u2014 a control that quietly undoes the control beside\
    \ it. Covered by a test.\n\nThe gated composer is now prose-only again: it passes\
    \ an empty `answers` array and requires its text, exactly as it did before this\
    \ task existed. No backend change of any kind \u2014 the schema, the routes, the\
    \ manager and the MCP tool are untouched by this pass.\n\n## Verified\n\n*   **`scripts/check.py`,\
    \ unqualified, green on the rebased head \u2014 gate receipt written for 0788cc6.**\
    \ Branch rebased onto `main` at 63b2cc4; five commits.\n*   **16 jsdom tests**\
    \ (one more than before). Three were rewritten rather than adjusted, because their\
    \ subject changed: the two that asserted the \"Answer Questions\" button now assert\
    \ the form is on the page, and a new one asserts the button is *absent* where\
    \ questions are open. Two more added: the fallback path where nothing is asked,\
    \ and the held task.\n*   **task-231's own tests still pass**, including \"offers\
    \ no Approve on a task waiting on decision\" \u2014 its fixture carries an open\
    \ question, so it now reads the inline form instead of the button.\n*   **3 Playwright\
    \ tests at 390x844**, with the opening click deleted. The first assertion after\
    \ `goto` is now on an option, with nothing in between; a click there would hide\
    \ the very regression the test exists to catch. It also asserts the \"Answer Questions\"\
    \ button has count 0.\n*   **In Chrome against the sandbox.** `task-201` on arrival:\
    \ 4 questions, 4 free-text boxes, 12 option buttons, no \"Answer Questions\" anywhere,\
    \ Send disabled until something is said. Two real mouse clicks \u2014 one option,\
    \ then Send \u2014 produced `answer` #9 `re=4` `selected: [Session mode primary,\
    \ batch retained]`, ball `agent`/`answer`, no gesture in between. `task-205` (nothing\
    \ asked) still shows \"\u270E Answer Questions\" and no form. `task-204` (`human`/`review`,\
    \ one question open) shows the form *and* Approve, and no horizontal overflow.\n\
    \n## One thing seen in passing, not mine\n\n`tests/test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`\
    \ failed once under a full-gate run and passed in isolation immediately after.\
    \ Its own assertion message says why \u2014 *\"the grandchild never started, so\
    \ this proves nothing\"* \u2014 so it is a timing race that loses under xdist\
    \ contention rather than a defect in anything here. Nothing was changed for it.\
    \ Worth a task if it recurs; say the word and I will file one."
