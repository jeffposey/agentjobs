  body: "Built and verified. Branch `feat/task-017-structured-questions`, four commits,\
    \ rebased onto `main` at e797a74. Full unqualified `scripts/check.py` green on\
    \ the rebased head \u2014 10 of 10 stages, 235s, gate receipt written for 1349779.\n\
    \n## What was built\n\n**Schema.** `QuestionOption`, `QuestionData` and `AnswerData`\
    \ in `models_v2.py`, registered in `LOG_PAYLOADS` \u2014 the renamed `DISPATCH_PAYLOADS`,\
    \ which now holds four entry types, two of which have nothing to do with running\
    \ a process. `LogEntry`'s existing `_check_typed_payload` validates them, so a\
    \ malformed option list is refused at the write. Every field defaults, so the\
    \ prose-only question this corpus is full of loads unchanged; `tests/test_validate.py::TestRealCorpus`\
    \ confirms that against the real records.\n\nA question carries `options[]` (each\
    \ `label`, optional `description`, `recommended`), `multi_select`, and `placeholder`\
    \ \u2014 the last being how a question asks for a value rather than a choice,\
    \ which is what task-077's third question needed. An answer carries `selected[]`\
    \ (option labels) and `other` (free text); its `body` is composed from them so\
    \ the prose in the record cannot disagree with the payload beside it.\n\n**Agent\
    \ side.** `manager.handoff(..., questions=[...])` writes one `question` entry\
    \ per item inside the same mutation as the handoff, each threaded `re` to it.\
    \ Reaches agents through `POST /tasks/{id}/handoff`, `client.operations.handoff(questions=...)`\
    \ and the MCP `task_handoff` tool, whose schema and description now say to use\
    \ it.\n\n**Human side.** `POST /tasks/{id}/answer` gains `answers[]`, written\
    \ in the same mutation as the ball move. `feedback` becomes optional there and\
    \ nowhere else \u2014 requiring it would defeat the point. Where the human tapped\
    \ and typed nothing, the `ball_prompt` is composed from the questions and their\
    \ answers, so the agent resuming reads what it asked and what it was told without\
    \ walking the log.\n\n**Refusals**, all 409 via a new `AnswerError`: answering\
    \ a non-question, answering one that is already answered, naming an option the\
    \ question never offered, sending several options to a single-select question,\
    \ and an empty answer. Every answer in a batch is checked before anything is written,\
    \ so one bad answer writes none of them.\n\n**GUI.** `frontend/src/components/QuestionForm.tsx`.\
    \ Every open question renders with its options as buttons, the recommendation\
    \ marked but never preselected, and a free-text box under all of them unconditionally.\
    \ One Submit writes every answer and moves the ball once. A single-select option\
    \ can be tapped again to clear it \u2014 without that a phone user who mis-taps\
    \ has only a page reload.\n\nOne addition beyond the letter of the spec, argued\
    \ rather than assumed: **a task holding an open question offers the answering\
    \ verb whatever its `ball_reason`**, joining the extras rather than displacing\
    \ a primary. task-231's rule is that a control appears where its verb is true,\
