    \ stayed open, which is decision 3 working.\n\n**The browser found a defect the\
    \ tests could not.** `.touch-target:not(.block)` in `styles.css` sets `display:\
    \ inline-flex; align-items: center` at a specificity Tailwind's single-class utilities\
    \ cannot beat, so `flex-col items-start` on the option button rendered every label\
    \ centred. Fixed by moving the stack into a child span. No test asked the question,\
    \ because a test that reads a label does not care where the label is \u2014 this\
