spec:
  summary: The three existing postures are read_only (no shell, no worktree), supervised
    (acceptEdits plus a six-prefix allowlist), and autonomous (bypassPermissions).
    Supervised is the default and cannot finish any task, because a background session
    parks on the first Bash command outside the allowlist with no TTY to answer. Claude
    Code's `auto` permission mode has a classifier review each action instead of a
    human, which is the posture a dispatched run actually wants.
  intent: Dispatch's default posture cannot complete work. run_a6deb292 (2026-08-19)
    got past startup, read its task, then parked asking permission to run `ls` on
    the repository's own docs directory, and stayed parked until it was cancelled.
    The choice today is between a posture that blocks constantly and one with no gate
    at all; the useful middle is missing.
  description: "Observed 2026-08-19 on Claude Code 2.1.235.\n\n`Posture` in `src/agentjobs/dispatch/config.py`\
    \ has exactly three members, and `posture_flags()` in `src/agentjobs/dispatch/runner.py`\
    \ maps them to:\n\n- `read_only`   -> `--tools Read,Glob,Grep,WebFetch`, no worktree\n\
    - `supervised`  -> `--permission-mode acceptEdits`, `-w`, plus `--settings` carrying\
    \ an allowlist built from six command prefixes (pytest, ruff, black, mypy, npm,\
    \ git)\n- `autonomous`  -> `--permission-mode bypassPermissions`, `-w`\n\nNothing\
    \ emits `--permission-mode auto`, so that mode is unreachable from dispatch.\n\
    \nWhy supervised is unworkable for a dispatched run: `acceptEdits` auto-accepts\
    \ file edits but still prompts for Bash. The allowlist covers six prefixes, so\
    \ the first command outside them \u2014 `ls`, `cat`, `find`, `grep`, `sed`, anything\
    \ \u2014 raises a permission prompt. A `--bg` session has no terminal, so the\
    \ prompt cannot be answered and the run parks until its timeout. This is not a\
    \ rare edge: run_a6deb292 hit it on its first shell command.\n\nThe fix: add a\
    \ fourth posture that emits `--permission-mode auto` plus `-w`, and make it the\
    \ default for new projects and the fallback for an unspecified posture. In `auto`\
    \ mode a classifier reviews each action rather than a human, so a background run\
    \ proceeds without prompts while keeping a gate \u2014 which is what `supervised`\
    \ was reaching for and failed to deliver.\n\nKeep the existing three. `read_only`\
    \ and `autonomous` are still meaningful endpoints, and `supervised` remains correct\
    \ for a run someone is actually watching and willing to answer.\n\nDecide and\
    \ record whether the `--settings` allowlist still belongs on `auto`. It is harmless\
    \ (it can only pre-approve) and it saves the classifier some work, so carrying\
    \ it forward is the cheaper default, but say so explicitly rather than leaving\
    \ it implied."
  constraints: "- Do not remove or repurpose read_only, supervised, or autonomous;\
    \ add to the set.\n- The new posture must pass -w, like supervised and autonomous\
    \ do.\n- Changing the default changes the risk boundary of every future dispatch,\
    \ so state it in the dispatch example scaffold and in whatever docs name the postures\
    \ \u2014 not only in the enum.\n- A config that names a posture explicitly must\
    \ keep getting that posture.\n- Test the composed argv, not just the enum member.\
    \ The allow_rules() docstring records an hour lost on 2026-08-18 to a rule that\
    \ matched nothing."
  out_of_scope: The .mcp.json approval defect (task-019). The wrong server address
    in the generated prompt (task-154). Rewriting the allowlist's contents.
  context:
  - path: src/agentjobs/dispatch/config.py
    why: Posture enum at line 177; the default appears twice, on ProjectDispatchSettings.posture
      and in _parse_project's mapping.get fallback.
  - path: src/agentjobs/dispatch/runner.py
    why: posture_flags() is the mapping from posture to argv, and the docstring says
      AgentJobs owns these flags rather than the operator.
  - path: src/agentjobs/dispatch/scaffold.py
    why: The commented example lists the postures a user copies from; line 154.
