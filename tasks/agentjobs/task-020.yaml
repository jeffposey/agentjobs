  body: "Implemented on branch feat/task-020-auto-posture, worktree C:/projects/aj-020,\
    \ commit 17d0108.\n\nWhat changed:\n- `Posture.AUTO` added in dispatch/config.py;\
    \ `posture_flags()` composes `--permission-mode auto -w <task>` plus the same\
    \ allow-list supervised gets.\n- Default moved to AUTO in both places it lives:\
    \ the `ProjectDispatchSettings.posture` field default and the `mapping.get(\"\
    posture\", ...)` fallback in `_parse_project`.\n- `DispatchPosture` in models_v2.py\
    \ gained the same member. This was not optional and the suite caught it: `_record_dispatch`\
    \ converts config posture to schema posture *by value*, so AUTO existing in only\
    \ one enum raised ValueError at dispatch time, not at import. Two tests in TestSelectionIsRecorded\
    \ failed with `'auto' is not a valid DispatchPosture`.\n- Docs: design doc section\
    \ 4 amended, task-schema.md dispatch entry example, and the dispatch.yaml scaffold\
    \ comment users copy from.\n\nDecision on the allow-list under `auto` (ac was\
    \ silent, spec asked for it explicit): kept. The rules can only pre-approve, never\
    \ widen past what the classifier would allow anyway, and each names a command\
    \ a run is certain to need. Rejected dropping it \u2014 that would have made auto\
    \ differ from supervised in two ways at once and left the first `pytest` of every\
    \ run waiting on a classifier round-trip for nothing.\n\nDesign-doc correction\
    \ worth its own note: section 4's verified table claimed `acceptEdits` + allow-list\
    \ runs an arbitrary command with \"no prompt\". That was measured with allow-listed\
    \ commands only and generalised to a column headed *arbitrary command*, which\
    \ is where the bad default came from. Corrected in place with the run_a6deb292\
    \ evidence rather than deleted, and the section's actual decisions (bypassPermissions\
    \ rejected as default, dontAsk rejected, no auto-escalation) are left standing\
    \ \u2014 `auto` gates every action through a classifier, so it is a gate, not\
    \ the absence of one.\n\nVerification:\n- `poetry run python scripts/check.py`\
    \ exit 0 in the worktree: 1863 Python tests, Black/Ruff/MyPy, generated client\
    \ check, 124 Vitest tests, production build, 11 Playwright tests against a live\
    \ server. Log at scratchpad/gate-020b.log.\n- ac-6, live: dispatched task-107\
    \ from this worktree as run_e452d6f8. meta.yaml argv carries `--permission-mode\
    \ auto`, and `claude agents --json` reports session 903af6cf `state: \"working\"\
    ` \u2014 it ran shell commands with no prompt and no park. The two runs before\
    \ it, under supervised, both parked (run_08ddfa02 on the MCP dialog, run_a6deb292\
    \ on `ls`).\n\nAll six acceptance criteria met. Not merged \u2014 awaiting review\
    \ per the merge gate."
