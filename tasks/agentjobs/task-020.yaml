ball_prompt: 'Review branch feat/task-020-auto-posture (worktree C:/projects/aj-020,
  commit 17d0108, 10 files, +152/-19). Do not merge without saying so explicitly.


  What to look at, in the order that matters:


  1. `posture_flags()` in src/agentjobs/dispatch/runner.py -- the one-line change
  from a fixed "acceptEdits" to `"auto" if posture is Posture.AUTO else "acceptEdits"`.
  That single string is the whole risk boundary of the feature.

  2. The default moved to AUTO in two places in dispatch/config.py. Your ~/.agentjobs/dispatch.yaml
  named `supervised` explicitly, so it was changed to `auto` there too (machine-local,
  with a comment saying why). Any project that names a posture explicitly still gets
  it -- there is a test.

  3. docs/agent-dispatch-design.md section 4. It carried a decision dated 2026-08-18
  that made supervised the default. That decision was not overwritten: the reasoning
  is left in place, an admonition records what the evidence changed, and the verified-behaviour
  table''s misleading row is corrected rather than deleted. Read this if you want
  to check I did not quietly relitigate a settled call.


  Evidence: scripts/check.py exit 0 (1863 Python tests, Vitest, build, 11 Playwright).
  Live: run_e452d6f8 dispatched task-107 under the new posture, argv shows --permission-mode
  auto, session 903af6cf reached state "working" and ran shell commands with no prompt
  -- where the two supervised runs before it both parked.


  Separately, and NOT in this branch: you have asked for posture to also carry workflow
  policy -- merge and push behaviour, and an autonomous run driving a parent task
  through all its children. That is a larger design than this task and is captured
  on its own record rather than smuggled in here. It also runs into the merge gate
  in ENGINEERING.md, which currently says work never merges itself and absence of
  objection is not approval; that document needs an intentional edit before any agent
  auto-merges anything.'
