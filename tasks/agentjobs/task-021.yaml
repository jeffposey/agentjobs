    \ rebases, runs the full unqualified `scripts/check.py` in the branch's own worktree\
    \ with that worktree's interpreter, and merges only on a green one \u2014 then\
    \ rebuilds, restarts, verifies the running server is serving the merge, closes\
    \ the task and removes the worktree, escalating with a written account at the\
    \ first step it cannot complete.\n\nRouting the autonomous merge there means it\
    \ is the **identical sequence a human approval takes**, with exactly one substitution:\
    \ what authorised it. Nothing about the safety argument is newly built, so nothing\
    \ about it is newly unproven.\n\n**Rejected: the agent runs the gate itself, then\
    \ `git merge`.** It is the obvious reading of the spec and it is materially weaker\
    \ in three ways. The gate result would be the agent's report of the gate rather\
    \ than the gate; the merge would skip the rebuild/restart/verify sequence that\
    \ ENGINEERING.md's sharpest warning exists about; and every failure path \u2014\
    \ a conflicting rebase, a base that moved mid-gate, a branch somebody already\
    \ merged by hand \u2014 would be improvised per run instead of being the handled\
    \ cases they already are.\n\n**Consequence, accepted:** an autonomous merge now\
    \ requires `finish.enabled` for the project. A machine that has not switched the\
    \ finish on has no sanctioned mechanism for one. That is the honest degradation\
    \ \u2014 the alternative is a second, weaker merge path existing solely so that\
    \ a posture means something on a machine that has not opted into the mechanism\
    \ it depends on."
