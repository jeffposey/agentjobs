- id: 11
  ts: '2026-08-23T22:48:21.755429Z'
  actor: claude
  type: handoff
  body: "Handing off for review. Branch `feat/task-021-posture-merge-policy`, two\
    \ commits, gate green.\n\n**What was built.**\n\n`MergePolicy` is a property of\
    \ `Posture`, not a config key beside it: `read_only` \u2192 `none`, `auto`/`supervised`\
    \ \u2192 `review`, `autonomous` \u2192 `automatic`. Two independent switches would\
    \ have four combinations, of which \"autonomous execution but stop for review\"\
    \ is one nobody has wanted and \"classifier-gated execution, merges unreviewed\"\
    \ is one nobody should get by typo. `auto` and `supervised` are identical here\
    \ on purpose \u2014 they differ in how the *process* is gated while it runs, which\
    \ is a different question from who authorises the merge.\n\n`ProjectDispatchSettings.push`\
    \ is a per-project bool defaulting to `False`, parsed from `~/.agentjobs/dispatch.yaml`,\
    \ kept off the posture so the same posture can push in one repository and never\
    \ in another.\n\n`dispatch.runner.policy_clause` renders both into the generated\
    \ prompt, for both the worker stub and the supervisor stub. This is the second\
    \ deliberate exception to the pointer-not-composition rule and the argument is\
    \ in the function's docstring: everything else the stub gestures at is *in the\
    \ record*, and this is not \u2014 it is derived from a machine-local file the\
    \ agent cannot read, while this repository's committed prose says the opposite\
    \ by default.\n\n`finish_task` gains `authority`, defaulting to `APPROVAL` \u2014\
    \ the existing path, unchanged. `POSTURE` re-resolves the project's machine-local\
    \ posture and declines `posture_requires_review` unless it is genuinely `autonomous`.\
    \ `agentjobs finish --posture-release` is the CLI surface. Every record the finish\
    \ writes \u2014 merge commit message, log entry, close body \u2014 now states\
    \ which authority it ran under, through one function so the three cannot drift.\n\
    \n**Verification.**\n\n- Full gate, unqualified, in the branch's own worktree\
    \ with that worktree's interpreter: **exit 0, all ten stages, 214.6s.**\n- **ac-3\
    \ checked against the real thing**, not a fixture: built the argv this machine\
    \ would actually use for a dispatch of task-021 from its own `dispatch.yaml`.\
    \ Reported `posture autonomous / merge automatic / push False`, and the 1060-character\
    \ prompt carries the autonomous clause, the exact `--posture-release` command,\
    \ and `Never push`.\n- New coverage: 11 prompt-policy tests (each posture, both\
    \ stubs, push both ways, and one asserting the clause survives into the composed\
    \ argv rather than only out of `build_prompt`); 7 config tests (the derived mapping,\
    \ that `autonomous` is the *only* automatic posture, push defaulting to false\
    \ through both the parser and the dataclass, push and posture independent, a non-boolean\
    \ push refused); 8 finish tests against real git repositories (all three review\
    \ postures decline and touch nothing, autonomous merges, a red gate still stops\
    \ it, the record says no human reviewed it and the merge commit says so too, and\
    \ an approval still reads as an approval).\n\n**What I did not do, and why** \u2014\
    \ see the two `decision` entries. In short: no code pushes, the GUI is not told,\
    \ and per-task posture is not built. All three are recorded with their reasoning\
    \ and the follow-ups named."
