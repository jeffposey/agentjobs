- id: 10
  ts: '2026-08-23T22:47:44.624874Z'
  actor: claude
  type: decision
  body: "**`push` is a real switch that no code acts on, and that is deliberate.**\n\
    \n`ProjectDispatchSettings.push` exists, parses, defaults to `False`, and is rendered\
    \ into the dispatched agent's prompt as one sentence. **Nothing in AgentJobs runs\
    \ `git push`.** The switch reaches the agent's decision, which the spec named\
    \ as the only channel that matters, and stops there.\n\n**Rejected: teaching the\
    \ scripted finish to push after a successful merge.** It is the natural home and\
    \ it would have been about fifteen lines. There is no repository on this machine\
    \ with a remote to prove it against \u2014 agentjobs has none, `vault` must never\
    \ gain one \u2014 so it would have shipped as an untested publication step inside\
    \ a script that runs unattended, at the end of a sequence whose entire safety\
    \ argument is that every step either succeeds on evidence or stops. Publication\
    \ is the one act in that sequence that cannot be undone by a revert.\n\n**Reopen\
    \ trigger:** the first project configured `push: true` that also has `finish.enabled`.\
    \ At that point there is something to test against and the argument above expires.\
    \ Until then, an agent at `push: true` is told pushing is permitted and pushes\
    \ by hand, which is exactly the status quo for every other project of Jeff's.\n\
    \nTwo further scope calls made here, both recorded rather than silently taken:\n\
    \n- **The GUI is not told about any of this.** `DispatchStateView` gains no `merge_policy`\
    \ or `push` field, so the dispatch panel still shows only the posture. Adding\
    \ fields the browser does not render would be decoration, and rendering them properly\
    \ is a frontend change with its own generated-client churn. The CLI does show\
    \ both \u2014 `agentjobs dispatch status` now prints `merge=` and `push=` per\
    \ project. **This is a real gap for a human**, because \"this project will merge\
    \ my work without asking me\" is exactly the sort of thing that should be visible\
    \ where the Dispatch button is. It belongs in its own task.\n- **Per-task posture\
    \ is not built.** The 2026-08-21 queue note asks for it and flags the privilege-escalation\
    \ tension itself: project settings are machine-local and a browser cannot write\
    \ them, while task records are git-tracked and agent-writable, so a task that\
    \ could raise its own posture to `autonomous` would be an agent granting itself\
    \ an unreviewed merge. That needs the narrow-only rule designed and argued, and\
    \ it is a separate change from establishing what a posture means at all. It also\
    \ belongs in its own task, and task-022 should not assume it exists."
