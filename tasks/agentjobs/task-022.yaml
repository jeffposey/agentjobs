  body: "Moved behind task-021 by Jeff, 2026-08-21. This is the task he actually asked\
    \ for \u2014 \"be able to dispatch the entire epic, as autonomous or not\" \u2014\
    \ and it was sitting at position 10000 while he was trying to do exactly this\
    \ to task-211 and could not.\n\nIt keeps its needs dependency on task-021: the\
    \ epic walk has no merge policy to obey until posture carries one.\n\nBinding\
    \ input from the same conversation: epic-level approval, chosen over per-child\
    \ gates and over leaving the gate in place. One approval at dispatch; children\
    \ merge as they complete; the epic hands off to Jeff at the end with the whole\
    \ program to review. He was told this means unreviewed code reaches main and chose\
    \ it anyway, so task-021's objective floor is the only remaining safeguard and\
    \ must not be softened.\n\nAlso in scope now: posture as a per-task decision,\
    \ not only per project.\n\nLive context for whoever works this \u2014 task-211\
    \ is a real epic sitting ready with six open children (task-214..219), reopened\
    \ 2026-08-21 for exactly this purpose. It is the natural proving case, the way\
    \ task-209 was for the queue program. Verified that dispatching it already yields\
    \ supervisor mode: claim_task hands an epic the supervisor's seat (manager.py),\
    \ and build_argv derives supervisor=bool(open_children) (runner.py). What does\
    \ not exist yet is the unattended walk through the children."
