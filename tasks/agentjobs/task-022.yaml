    \ it | `bin/reset.py`, then claim `task-001`, then `agentjobs dispatch walk task-001\
    \ --project walk-sandbox` |\n| saved output | `C:/ai/scratch/task-022-demo/evidence/walk-{final,stop,retry}.log`\
    \ |\n\nJeff's real `~/.agentjobs/dispatch.yaml` was not touched and is still `auto`.\
    \ The sandbox carries a `bin/agentjobs` shim that pins `AGENTJOBS_HOME`, so nothing\
    \ invoked through it can reach the real backlog even by accident.\n\n**One substitution,\
    \ named plainly.** The sandbox's runner is `bin/child_runner.py`, a deterministic\
    \ script, not an LLM. It substitutes the *worker* and nothing else: the queue\
    \ picks the child, `dispatch_task` runs every gate and writes the inherited authorising\
    \ entry, the run gets a directory and a ledger row, the budget is enforced by\
    \ the dispatcher, the walk watches the record, and each merge goes through `agentjobs\
    \ finish --posture-release`, which runs the sandbox's own `scripts/check.py` on\
    \ the rebased branch. Two reasons: it is re-runnable, and `agentjobs dispatch\
    \ run` from inside this `auto` session is refused by the permission classifier.\
    \ What it therefore does *not* prove is that a model can do a child's job unattended\
    \ \u2014 that was task-021's ground.\n\n---\n\n### The successful walk (ac-1,\
    \ ac-2, ac-5, ac-6, ac-7)\n\nThree children, one attempt each, no human input\
    \ after the walk started.\n\n```\nStarting task-002 (attempt 1 of 2).\n  task-002\
    \ attempt 1 (run_02b56b9e): completed -- closed completed; its own gate ran and\
    \ its own merge happened\nStarting task-003 (attempt 1 of 2).\n  task-003 attempt\
    \ 1 (run_1abf0cbe): completed -- closed completed; its own gate ran and its own\
    \ merge happened\nStarting task-004 (attempt 1 of 2).\n  task-004 attempt 1 (run_b7289d7e):\
    \ completed -- closed completed; its own gate ran and its own merge happened\n\
    Walk of task-001: all_children_done.   EXIT=0\n```\n\nGit, in the throwaway repo\
    \ \u2014 three merge commits, each with two parents:\n\n```\n*   36cabb8 Merge\
    \ branch 'feat/task-004-notes' (task-004)\n|\\   | * 859e09f docs(task-004): ...\n\
    *   7126c6c Merge branch 'feat/task-003-notes' (task-003)\n|\\   | * c3b2136 docs(task-003):\
    \ ...\n*   b6ebfcc Merge branch 'feat/task-002-notes' (task-002)\n|\\   | * 3f7638a\
    \ docs(task-002): ...\n```\n\n`git remote -v` is empty and always was \u2014 **ac-6\
    \ is not \"we checked the logs\", it is a repository that has nowhere to push\
    \ to.** `git worktree list` shows only the clone: all three child worktrees were\
    \ removed by their own finishes.\n\nEach child's record, e.g. task-002 \u2014\
    \ note entry 5 lands **before** entries 6\u20138:\n\n```\n[2] Jeff Posey  note\
    \        \"Jeff Posey authorised a dispatch of task-001, and this run is\n   \
    \                          attempt 1 of 2 ...\"   data.epic = {parent: task-001,\
    \ entry: 2, attempt: 1, limit: 2}\n[3] claude      transition  Claimed by claude.\n\
    [4] Jeff Posey  dispatch    run=run_02b56b9e  trigger=child  posture=autonomous\
    \  caused_by=2\n[5] claude      progress    \"Appended one bullet ... Verified\
    \ by running scripts/check.py ... exit 0\"\n[6] finisher    progress    Scripted\
    \ finish started on `feat/task-002-notes`\n[7] finisher    progress    Merged\
    \ `feat/task-002-notes` into `main` as `b6ebfcc2`\n[8] finisher    transition\
    \  ... and verified live.\n```\n\n`branches: [(feat/task-002-notes, merged)]`,\
    \ `lifecycle=closed`, `outcome=completed`. The `dispatch` entry's `caused_by`\
    \ points at entry 2, which is a stored row naming a configured human \u2014 **the\
    \ rule in design \xA72 is satisfied, not bypassed.**\n\n**ac-5: the parent is\
    \ still `active` and was never closed by the walk.** That is deliberate and asserted\
    \ in the tests. The walk's exit line says so: *\"evaluate its acceptance criteria\
    \ against the children's evidence and close it yourself.\"*\n\n### The stop rule\
    \ (ac-3)\n\ntask-003's spec was rewritten to ask for a bullet identical to task-002's;\
    \ the sandbox gate refuses duplicate bullets, so the work is genuinely unmergeable\
    \ rather than sabotaged at the harness level.\n\n```\ntask-002 attempt 1 (run_8bd4ad53):\
    \ completed\ntask-003 attempt 1 (run_b42d0384): parked -- ball is human/decision:\
    \ The gate is red ...\nWalk of task-001: child_needs_a_human.   EXIT=1\n```\n\n\
    Afterwards: **one** merge on `main` (task-002's), `task-003` `active/human/decision`,\
    \ **`task-004` still `ready` with zero dispatches** \u2014 the sibling was never\
    \ started. The parent is `human/decision` with a prompt naming task-003 and what\
    \ completed before it. That is the criterion: stopped, not skipped.\n\n### The\
    \ bound (ac-4)\n\nEnforced in the dispatcher, shown by asking for a third run\
    \ of one child under one authorisation:\n\n```\ncall 1: Dispatched task-003 as\
    \ run run_f938c4d2\ncall 2: Dispatched task-003 as run run_31ea62a8\ncall 3: Refused\
    \ (child_attempts_exhausted): task-003 has already been run 2 time(s) on\n   \
    \     task-001's authorisation (entry 2), which is the limit of 2. ... A human\
    \ who wants\n        it tried again can authorise task-001 afresh.\n```\n\nThen\
    \ a human note on the epic, and the next call is dispatched again \u2014 the escape\
    \ hatch works and leaves a record that somebody chose it.\n\n---\n\n### Four defects\
    \ the demonstration found. None was visible to a green suite.\n\nCommitted as\
    \ `f38b0f4`. Each was hiding the next, which is why running it mattered.\n\n1.\
    \ **A run could not merge its own work.** `finish_task` takes the per-task run\
    \ lock unconditionally, and an autonomous run calling `agentjobs finish --posture-release`\
    \ already holds it. The command task-021's prompt names was declined `locked`\
    \ \u2014 **every autonomous run there has ever been.** The sanctioned merge path\
    \ was unreachable as shipped. Fixed by treating a run finishing itself as the\
    \ same run, established by `AGENTJOBS_RUN_ID` matching the run the lock file names.\n\
    2. **The walk could not see its children finish.** The CLI holds one corpus snapshot\
    \ per invocation, on the stated premise that one invocation is one logical read.\
    \ A walk breaks that premise. All three children merged and closed; the walk reported\
    \ three dead sessions and re-ran them. Fixed with `TaskStorage.refresh()`.\n3.\
    \ **The watcher read the record before the liveness signal.** A child writes its\
    \ last word then exits; the run is marked terminal after that. Reading the record\
    \ first leaves a window where it looks unfinished and the run looks over \u2014\
    \ which reads as a death, spends the retry, and re-runs work already on `main`.\
    \ The reads are swapped.\n4. **`dispatch child` leaked a batch run per invocation**,\
    \ so the next dispatch of that task was refused `live_run_exists`.\n\nRegression\
    \ tests for 2 and 3 are in `tests/test_dispatch_epic.py`, each constructed as\
    \ the failure actually occurred.\n\n### Two things the run established that the\
    \ design had not\n\n- **The retry fires less often than the design implies, and\
    \ that is right.** A dispatched run that fails is handed to `human`/`decision`\
    \ by its own run supervisor, so the walk reads it as parked and stops *without*\
    \ spending an attempt. `DIED` is the residual case \u2014 a run whose supervisor\
    \ wrote nothing, which is what an expired login looks like. Retrying a child that\
    \ said something would be ignoring it.\n- **A walk that stops for cause spends\
    \ the epic's authorisation.** Its handoff becomes the parent's newest entry, so\
    \ the next child dispatch is refused `parent_not_human_clocked` until a person\
    \ acts on the epic. Not designed in; it falls out of resolving authorisation from\
    \ the parent's newest non-transition entry, and it is exactly right.\n\nBoth are\
    \ now in `docs/agent-workflow.md` and the design record (`8471942`).\n\n**Gate:**\
