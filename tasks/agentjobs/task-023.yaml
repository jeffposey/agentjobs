- id: 7
  ts: '2026-08-29T18:29:29.614312Z'
  actor: claude
  type: progress
  body: "Built on `feat/task-023-structured-transcript`, rebased onto `main` at acb0e9a.\
    \ Two commits: 12751f8 (server) and f9ad2db (frontend, docs, sandbox).\n\n## What\
    \ was built\n\n**`src/agentjobs/dispatch/transcript.py`** \u2014 locates and parses\
    \ the session's own JSONL.\n\n- Locating it: a run's recorded `session_id` is\
    \ the first segment of the transcript's UUID filename (`553f321b` \u2192 `553f321b-aefe-....jsonl`),\
    \ so the match is on prefix. Three attempts, narrowest first: the store for the\
    \ project root, then stores whose name *begins* with that slug (a session that\
    \ relocated into a worktree), then every store. The newest match wins. A driver\
    \ that keeps no such file simply never matches, so nothing needs a list of which\
    \ drivers those are.\n- Parsing it: `assistant` events' `text` blocks become narration\
    \ entries; `tool_use` blocks accumulate into a group that a paragraph of narration\
    \ closes; `user` events carry either a prompt (string content) or `tool_result`\
    \ blocks, which are matched back to their call by id and supply `is_error` and\
    \ the output. `toolUseResult.structuredPatch` gives the diff counts, and `type:\
    \ \"create\"` counts its whole content as additions.\n- Bounded: only the last\
    \ 2 MB of the file is read (the first, partial line is dropped) and only the last\
    \ N entries are returned, so a poll's cost does not grow with the length of the\
    \ run. What was left off is stated, never hidden.\n\n**`GET /api/projects/{id}/dispatch/runs/{run_id}/transcript`**\
    \ \u2014 the entries, polled on the same clock as `/tail`. It does not replace\
    \ `/tail`.\n\n**`DispatchOutput.tsx`** \u2014 the readable view leads, the raw\
    \ terminal is behind a *Show raw terminal* toggle, and the panel degrades to the\
    \ raw capture automatically whenever there is nothing structured.\n\n**`scripts/dispatch_output_sandbox.py`**\
    \ \u2014 three seeded runs on port 8899 (its default; I ran it on 8903 because\
    \ 8898 and 8899 were both already bound by other agents' sandboxes). It redirects\
    \ its own `~` into a temp directory so seeded transcripts cannot land in the real\
    \ store.\n\n## Verification\n\n`poetry run python scripts/check.py`, unqualified,\
    \ on the rebased branch: **exit 0, all ten stages, receipt written for f9ad2dbb**\
    \ (gate7, 248.5s). New tests: 40 in `tests/test_dispatch_transcript.py`, 8 in\
    \ `tests/test_dispatch_api.py::TestRunStructuredTranscript`, 18 in `DispatchOutput.test.tsx`\
    \ (up from 8).\n\nRead end to end in a browser against the sandbox, not only in\
    \ tests. The real transcript used was this run's own \u2014 `553f321b-aefe-48c0-9a50-64886c6f19e1.jsonl`,\
    \ 15 entries at the time. What the panel rendered, verbatim:\n\n    ASKED   You\
    \ are the agent `claude` working task `task-023`\u2026\n    I'll start by reading\
    \ the task record.\n    \u25B8 Ran 3 commands\n    Task read. Let me set up the\
    \ worktree and explore the current implementation in parallel.\n    \u25B8 Edited\
    \ peek.py and 2 more files, ran 30 commands   +101 -0\n    Now I'll write the\
    \ server-side transcript module.\n    \u25BE Edited transcript.py   +555 -0\n\
    \        Write  transcript.py  +555 -0\n        C:/projects/worktrees/agentjobs-023/src/agentjobs/dispatch/transcript.py\n\
    \nThat is the spec's \"what good looks like\", against a real run rather than\
    \ a fixture.\n\nThe failure state (sandbox task-203) renders `Edited types.ts,\
    \ ran 2 commands  +1 -1  [2 failed]`, and opening it marks each failing call `failed`\
    \ with its error text in red. The degraded state (task-202) shows the note and,\
    \ under it, the raw capture \u2014 which still reads `NewMCPserverfoundinthisproject:agentjobs`,\
    \ so the before and after are visible in the same sandbox.\n\n## Two things the\
    \ gate caught that I had missed\n\nBoth were real, and both are fixed in f9ad2db:\
    \ the new operation was undocumented in `docs/api-reference.md`, and the new query\
    \ was unclassified in `LiveUpdates.tsx`'s live-update coverage map (it belongs\
    \ in `NON_TASK_PROJECT_QUERY_IDS` \u2014 a session writing is not a task write).\n\
    \n## A pre-existing flake, not mine\n\n`tests/test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`\
    \ failed in 3 of my 6 full gate runs, with two different messages (\"pid N survived\
    \ the timeout\" and \"the grandchild never started, so this proves nothing\").\
    \ It passes in isolation. I confirmed it is pre-existing rather than caused by\
    \ this branch by running the whole suite in the **main clone, on unmodified `main`**:\
    \ `pytest -q -n auto` there failed the same test the same way (1 failed, 3593\
    \ passed). It is load-sensitive, and this machine has several agents on it. Not\
    \ filed as a task \u2014 say the word and I will."
