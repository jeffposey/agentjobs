  verify: Every assertion is on a rendered string, never on markup. This run's own
    transcript (553f321b-...jsonl) was read end to end through the panel in Chrome
    via scripts/dispatch_output_sandbox.py; the rendering is quoted verbatim in log
    entry 7.
  status: met
