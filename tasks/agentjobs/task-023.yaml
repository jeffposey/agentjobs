- id: 8
  ts: '2026-08-29T18:29:49.545022Z'
  actor: claude
  type: decision
  body: "The four questions the spec left open, answered, with what was rejected.\n\
    \n**1. Poll, don't push.** A new `GET .../transcript`, polled by the panel on\
    \ the same 10s clock as `/tail`. Rejected server-push and a faster clock: nothing\
    \ here is a subprocess (unlike `/tail`, whose bytes come from a poller that shells\
    \ out), but a second interval would be a second thing to reason about for a panel\
    \ a human reads at human speed. Cost is bounded instead, by reading only the last\
    \ 2 MB of the file.\n\n**2. Last N *entries*, not turns.** \"Turns\" does not\
    \ work: a dispatched run has exactly one user prompt and hundreds of assistant\
    \ turns, so bounding by turn is bounding by nothing. An entry is one thing the\
    \ agent did \u2014 a paragraph of prose, or a run of consecutive calls \u2014\
    \ and 40 of them is the default. The count omitted is rendered (\"Showing the\
    \ last 1 of 137 steps\"), never silently dropped.\n\n**3. The raw view is not\
    \ a fallback nobody reaches.** It is both a deliberate toggle *and* what the panel\
    \ degrades to automatically whenever `source` comes back `none`, with the server's\
    \ note saying which case it is. Rejected the spec's suggested `pyte`/xterm.js\
    \ screen-buffer replay: it is a second renderer to maintain for the case where\
    \ the structured one has already failed, and the reason to want the raw bytes\
    \ at all is that they are unprocessed. Reopen if a real session dies in a way\
    \ where the unreplayed capture turns out to be unreadable \u2014 I did not hit\
    \ one.\n\n**4. Failure is stated in words, not signalled by colour.** \"2 failed\"\
    \ on the summary, \"failed\" on the call. Colour is there too, but a reader scanning\
    \ for trouble should find it by reading.\n\n**Two further decisions the spec did\
    \ not ask for.**\n\n**Sidechain events are dropped.** A subagent's turns are a\
    \ separate conversation; interleaved into the main one, nothing follows from what\
    \ precedes it. The `Agent` call that started it is in the main chain and stands\
    \ for it.\n\n**Escape sequences *are* removed from a command's output** \u2014\
    \ which is not the constraint's forbidden move. The constraint is about a *repaint*,\
    \ which encodes its spacing in cursor movements, so stripping destroys the text.\
    \ A program's own stdout encodes nothing in them but colour. Found on this run:\
    \ a pytest result reached the panel as `\\x1b[32m.\\x1b[0m` forty times over,\
    \ and no readable count.\n\n**Not done, deliberately: no Playwright spec.** The\
    \ vitest suite asserts on rendered text for every state including the failure\
    \ and degraded ones, the API suite covers the server end, and ac-6's \"one real\
    \ dispatched run read end to end\" was satisfied in a browser against a real transcript.\
    \ An e2e spec would need the e2e server to redirect `HOME` to reach a seeded transcript\
    \ store, which is machinery in the harness rather than coverage of the change.\
    \ Say so if you want it and I will add it."
