- id: 3
  ts: '2026-08-19T23:45:26.496208Z'
  actor: claude
  type: decision
  body: 'Approach chosen: opt-in enum tolerance in the client, at the single parse
    choke point.


    **Where the defect actually bites.** Every typed client read and *every* mutation
    funnels through `TaskClient._parse_task` (client.py:605) -> `Task.model_validate`.
    The MCP read tools already pass the server''s JSON straight through (`read_tasks`,
    `read_task_detail`, `read_search`, `read_next_task`), so the reads that broke
    were the *mutation* responses: `operations.*` -> `_mutation()` -> `_parse_task(data[''task''])`.
    That is exactly why `task_handoff` failed with `retryable:false` while a plain
    curl of the same task returned 200. One choke point therefore covers the MCP client
    and every other consumer of client.py.


    **Mechanism.** `ValueEnum` (models_v2.py:46) gains a `_missing_` hook that, *only
    while a client-scoped context manager is active*, returns an unregistered pseudo-member
    carrying the unknown string. Verified against pydantic 2.12.4: pydantic-core calls
    `_missing_`, the result validates, `model_dump(mode=''json'')` serialises it back
    as the raw string, and `Enum._member_map_` is not polluted. Outside that context
    the enum rejects unknown values exactly as today.


    **Rejected alternative 1: make `ValueEnum` tolerant unconditionally.** Simpler,
    but it relaxes the write path and `storage.load_task` too, so `posture: banana`
    would be storable and a corrupt file would stop being loud. That contradicts the
    constraints and task-049. The switch is off by default and turned on only by `client.py`.


    **Rejected alternative 2: build a parallel tolerant model tree with `create_model`.**
    No global switch, but it is a second schema implementation generated from the
    first -- which is the same class of problem the task is about -- and it silently
    drops the `@model_validator` consistency rules.


    **Rejected alternative 3: sanitise the payload using pydantic''s reported errors.**
    Would have to substitute a *known* member for the unknown one, which falsifies
    the record.


    **One consequence, handled.** Consistency rule 2 in `Task._check_consistency`
    indexes `BALL_REASONS[self.ball]`. An unknown `ball` pseudo-member is not a key
    there, so tolerance would turn a clean rejection into an uncaught `KeyError`.
    It becomes a `.get()` that skips the vocabulary check when the holder is not a
    member this reader knows -- unreachable on the server, where every ball is a real
    member, and the correct degrade in a client that is not the authority on validity
    anyway.


    **Skew stays detectable without failing.** The context manager collects the unknown
    values it met; `_parse_task` logs one warning per unknown value naming the enum,
    the value and the task. That is the record''s ''warn rather than fail every call''
    direction, without building a version handshake (explicitly out of scope).


    **Test strategy for ac-5.** Both processes are the same process in a test, so
    skew is represented at the transport: a wrapping `httpx.BaseTransport` serves
    the real FastAPI app and then rewrites a dispatch entry''s `posture` to a value
    absent from this reader''s `DispatchPosture`. That reproduces the original failure
    exactly -- an unknown value inside `log[].data`, reached through `LogEntry._check_typed_payload`
    -> `DispatchData`, which is where `log.12.posture` came from -- and because the
    mutation response travels the same transport, an unrelated mutation on that task
    exercises ac-2.'
