  summary: Legacy umbrella for Task 031 migration work. Superseded by phase-specific
    tasks (033-039).
  description: "## Objective\n\nMake AgentJobs self-hosted for its own development\
    \ work by migrating Task 031\nout of the previous project and establishing the\
    \ prompts and task records inside the\nagentjobs repository.\n\n## Scope\n\n-\
    \ Copy phase prompts into a dedicated `prompts/` directory\n- Convert Task 031\
    \ Markdown into a structured AgentJobs YAML task\n- Update phase tracking to reflect\
    \ historical progress through Phase 5.2\n- Prepare AgentJobs for ongoing self-managed\
    \ development with new tasks\n- Update cross-repo documentation to point at the\
    \ new source of truth\n- Retroactively break down Task 031 into standalone phase\
    \ tasks (task-033 through task-039)\n\n## Status\n\nThis record is retained for\
    \ audit purposes but no longer receives direct\nupdates. Active work now lives\
    \ in the phase-specific tasks created during\nPhase 5.3.\n\n---\n\n## Starter\
    \ prompt (migrated from schema v1)\n\nprompts/task-031-phase-1-core-infrastructure.md\n\
    ---\n\n## Phases (migrated from schema v1)\n\n`phases[]` was deleted in v2; sub-tasks\
    \ via `parent` are the one way to\nsubdivide. This is the historical record, preserved\
    \ verbatim.\n\n- **Core Infrastructure** (`phase-1`, completed)\n  - YAML storage,\
    \ models, manager complete\n  - completed 2025-10-25T20:00:00Z\n- **REST API**\
    \ (`phase-2`, completed)\n  - FastAPI with full CRUD operations\n  - completed\
    \ 2025-10-25T21:00:00Z\n- **Web GUI** (`phase-3`, completed)\n  - Dark theme browser\
    \ interface\n  - completed 2025-10-25T22:00:00Z\n- **Migration Tool** (`phase-4`,\
    \ completed)\n  - Markdown to YAML conversion\n  - completed 2025-10-25T23:00:00Z\n\
    - **Improve Task Rendering** (`phase-4.1`, completed)\n  - Marked.js markdown\
    \ rendering\n  - completed 2025-10-26T10:00:00Z\n- **Human-Agent UX** (`phase-4.2`,\
    \ completed)\n  - Waiting status, tabbed views, test data\n  - completed 2025-10-26T17:00:00Z\n\
    - **Package and Integrate** (`phase-5.1`, draft)\n  - Install in host environment,\
    \ migrate tasks (NOT YET DONE)\n- **Agent DX Improvements** (`phase-5.2`, completed)\n\
    \  - Examples, docs, CLI command delivered (see task-038)\n  - completed 2025-10-26T20:28:04Z\n\
    - **Bootstrap Self-Management** (`phase-5.3`, completed)\n  - AgentJobs now self-manages\
    \ (see task-039)\n  - completed 2025-10-26T20:28:05Z"
