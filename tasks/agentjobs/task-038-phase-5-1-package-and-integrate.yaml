- id: 2
  ts: '2026-08-11T05:55:51.877932Z'
  actor: claude
  type: transition
  body: 'Closed as superseded in a backlog grooming pass, 2026-08-11. Written 2025-10-26
    against a shape of the project that no longer exists.


    Each of its five activities, and where it actually went:


    - *Build and publish the initial Python package* -- `pyproject.toml` carries the
    full distribution metadata (name, license, homepage, classifiers, `packages =
    [{include = "agentjobs", from = "src"}]`) and the console entry point. Nothing
    is missing to build a wheel. Publishing to PyPI was never done and is a separate
    decision, not a leftover of this task -- if it is wanted, raise it as its own
    task rather than reviving this one.

    - *Update host project dependencies and CI* -- there is no host project. AgentJobs
    was extracted into its own repository, so the integration target this task was
    written to serve does not exist. `requirements.txt` and `docs/integration/agentjobs-package.md`,
    its two deliverables, are artifacts of that vanished arrangement.

    - *Seed AgentJobs with migrated tasks (34 total)* -- done, twice over. The v1
    corpus was imported, then migrated wholesale to schema v2 by task-051''s migrator
    and task-052''s switchover.

    - *Verify CLI/GUI against migrated data* -- covered by task-052''s acceptance
    and by task-059''s review-surface work.

    - *Document rollout* -- task-079 rewrote the README around installation from source,
    and `docs/installation.md` exists.


    Rejected alternative: keeping it open and rewriting it into a ''publish to PyPI''
    task. That would preserve an id whose entire spec, acceptance and deliverables
    would be discarded, which is a new task wearing an old number. The three acceptance
    criteria here all reference the host environment and are unsatisfiable as written.'
  data:
    lifecycle: closed
