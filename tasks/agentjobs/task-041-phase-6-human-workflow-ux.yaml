- id: 2
  ts: '2026-08-11T05:55:51.888205Z'
  actor: claude
  type: transition
  body: 'Closed as superseded in a backlog grooming pass, 2026-08-11. Written 2025-10-27
    as a four-phase umbrella; all four phases have since been built or deliberately
    replaced by later, better-specified work.


    - *Phase 1, human action buttons* -- built. task-059 shipped the review actions
    and, more to the point, fixed the fact that Approve did not do what its label
    claimed. task-064 then made those actions attribute to a named human instead of
    the anonymous ''human''.

    - *Phase 2, webhook system* -- built. `src/agentjobs/webhooks.py` fires HMAC-signed
    events; `docs/webhooks.md` documents them.

    - *Phase 3, comments and feedback* -- replaced by something better. Schema v2
    (task-050, task-052) unified comments and status updates into one append-only
    typed log, which is what this phase was reaching for. task-065 covers capturing
    a finding from anywhere in the UI; task-067 covers attaching images to it.

    - *Phase 4, Codex auto-trigger* -- superseded by the whole dispatch hierarchy
    under task-060. `examples/codex_listener.py` is the prototype this phase asked
    for; task-060''s design pass established that the hard parts are safety, runaway
    loops and process lifecycle, not the trigger, and tasks 068-078 and 080 carry
    that work.


    Rejected alternative: re-pointing this task at whatever remains and keeping it
    as the parent of the human-UX cluster. Nothing distinct remains -- every acceptance
    criterion here is met or has a named successor -- and an umbrella with no unclaimed
    work under it only clutters the queue. Its one lasting contribution, the GitHub-Issues-as-model
    framing, is already embedded in the tasks that replaced it.'
  data:
    lifecycle: closed
    outcome: superseded
