prompts:
  starter: "## Objective\nMove the demo tasks (task-001.yaml \u2026 task-007.yaml)\
    \ from `tasks/agentjobs/` to a new `tasks/test-data/` directory, making `tasks/agentjobs/`\
    \ the pure internal backlog.\n\n## Steps\n1. Create branch `chore/task-042-relocate-demo-tasks`\
    \ from main. Record it in this task's `branches[]` and mark the task in_progress.\n\
    2. `git mv tasks/agentjobs/task-001.yaml \u2026 task-007.yaml tasks/test-data/`.\n\
    3. Inspect `agentjobs load-test-data` (src/agentjobs/cli.py) and `src/agentjobs/test_data/`\
    \ for hardcoded paths to these files; update if needed.\n4. Check README.md's\
    \ directory-layout section (~line 223) and correct any drift.\n5. Restart the\
    \ server and verify `GET /api/tasks` no longer lists task-001\u2026007.\n6. Run\
    \ `poetry run pytest`.\n\n## Git workflow (mandatory)\nSmall single-logical-change\
    \ commits, Conventional Commits format, tests green before each commit. When the\
    \ branch is complete and verified: STOP, set this task to waiting_for_human, and\
    \ wait for explicit human approval. On approval: rebase onto main, merge with\
    \ --no-ff, mark the branch merged in branches[], set task completed.\n\n## Verification\n\
    - `Get-ChildItem tasks/test-data` shows 7 files; `Get-ChildItem tasks/agentjobs`\
    \ shows only task-031+ and react-frontend tasks.\n- API task list and Jinja dashboard\
    \ totals reflect the removal.\n- pytest green."
