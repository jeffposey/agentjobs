description: "The seven demo/sample tasks (task-001 through task-007 \u2014 fake auth\
  \ schemas, rate limiters, dark-mode toggles, etc.) are commingled with the real\
  \ internal AgentJobs roadmap in `tasks/agentjobs/`. README.md (~line 223) already\
  \ documents a `tasks/test-data/` directory that does not exist. Move the demo tasks\
  \ there so `tasks/agentjobs/` becomes the pure internal backlog.\n\nBecause `TaskStorage.list_tasks()`\
  \ globs `*.yaml` non-recursively (src/agentjobs/storage.py:72), files moved out\
  \ of `tasks/agentjobs/` disappear from the store automatically \u2014 no code change\
  \ needed for the move itself.\n\nAlso check whether `agentjobs load-test-data` (src/agentjobs/cli.py)\
  \ or `src/agentjobs/test_data/` reference these files by path and adjust if needed.\
  \ Update README.md if its description of the layout needs correcting."
