id: task-043-cors-vite-dev-origin
title: Allow Vite dev-server origin in CORS config
created: '2026-07-06T19:25:44.948348Z'
updated: '2026-07-06T19:25:44.948872Z'
status: ready
priority: high
category: developer_experience
assigned_to: claude
estimated_effort: 15 minutes
description: "The upcoming React frontend will run on the Vite dev server at `http://localhost:5173`\
  \ during development. The FastAPI CORS middleware in `src/agentjobs/api/main.py`\
  \ (lines ~38-47) currently allows only `http://localhost:8765` and `http://127.0.0.1:8765`,\
  \ so browser requests from the React app would be blocked by CORS preflight.\n\n\
  Append `http://localhost:5173` and `http://127.0.0.1:5173` to `allow_origins`. Keep\
  \ the origins explicit \u2014 never switch to `\"*\"` while `allow_credentials=True`\
  \ is set (the browser rejects that combination, and it would be a security regression\
  \ anyway).\n\nNote: the React app will primarily use the Vite dev proxy (`/api`\
  \ \u2192 `localhost:8765`), which avoids CORS entirely, but the direct-origin path\
  \ should also work and this is a good opportunity to understand what CORS is."
