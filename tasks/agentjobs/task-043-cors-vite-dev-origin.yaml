prompts:
  starter: "## Objective\nAdd the Vite dev-server origins to the CORS allowlist in\
    \ src/agentjobs/api/main.py.\n\n## Steps\n1. Create branch `feat/task-043-cors-vite-dev-origin`\
    \ from main. Record it in branches[] and mark the task in_progress.\n2. In src/agentjobs/api/main.py,\
    \ append `http://localhost:5173` and `http://127.0.0.1:5173` to `allow_origins`.\n\
    3. Restart the server and verify with a preflight request:\n   `curl.exe -i -X\
    \ OPTIONS http://localhost:8765/api/tasks -H \"Origin: http://localhost:5173\"\
    \ -H \"Access-Control-Request-Method: GET\"`\n   Expect `access-control-allow-origin:\
    \ http://localhost:5173` in the response headers.\n4. Run `poetry run pytest`.\n\
    \n## Git workflow (mandatory)\nSmall single-logical-change commits, Conventional\
    \ Commits format, tests green before each commit. When the branch is complete\
    \ and verified: STOP, set this task to waiting_for_human, and wait for explicit\
    \ human approval. On approval: rebase onto main, merge with --no-ff, mark the\
    \ branch merged in branches[], set task completed.\n\n## Study note (CORS primer\
    \ for the React work ahead)\nBrowsers enforce the same-origin policy: JS on origin\
    \ A may not read responses from origin B unless B opts in via Access-Control-*\
    \ response headers. The Vite proxy sidesteps this by making the browser talk only\
    \ to :5173 while Vite forwards to :8765 server-side. Both paths will work after\
    \ this task."
