prompts:
  starter: "## Objective\nThree fixes: (1) eliminate the nonexistent `planned` status\
    \ from config/docs/examples, (2) fix the Windows cp1252 UnicodeEncodeError on\
    \ `agentjobs serve` (emoji in cli.py:138 \u2014 reproduced 2026-07-06 in a background\
    \ PowerShell), (3) codify the git workflow (branch-per-task before in_progress,\
    \ branches[] recording, small reviewable Conventional Commits, human-approval\
    \ merge gate with rebase + --no-ff) in ENGINEERING.md and ALLAGENTS.md. See the\
    \ task description for exact file/line targets.\n\n## Steps\n1. Create branch\
    \ `docs/task-044-docs-git-workflow` from main. Record it in branches[] and mark\
    \ the task in_progress.\n2. Fix cli.py:41 default status \u2192 draft; fix docs/api-reference.md,\
    \ docs/agent-workflow.md, examples/collaborative_agent.py. Do NOT touch migration/converter.py's\
    \ legacy 'planned' mapping.\n3. Remove or guard emoji output in CLI (cli.py serve\
    \ and any other echoes with non-ASCII); verify `poetry run agentjobs serve` starts\
    \ in a fresh non-interactive PowerShell without PYTHONUTF8 set.\n4. Update ENGINEERING.md\
    \ Git Workflow + ALLAGENTS.md Task Lifecycle with the process above.\n5. Stretch:\
    \ generate docs/task-schema.md content from src/agentjobs/models.py.\n6. `poetry\
    \ run pytest`, plus black/ruff/mypy per ENGINEERING.md.\n\n## Git workflow (mandatory)\n\
    One logical change per commit (the three fixes are separate commits). When the\
    \ branch is complete and verified: STOP, set this task to waiting_for_human, and\
    \ wait for explicit human approval. On approval: rebase onto main, merge with\
    \ --no-ff, mark the branch merged in branches[], set task completed."
