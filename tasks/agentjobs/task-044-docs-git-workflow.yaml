estimated_effort: 1-2 hours
description: "Three hygiene items found during the React-frontend readiness review:\n\
  \n**1. Nonexistent `planned` status.** The `TaskStatus` enum (src/agentjobs/models.py)\
  \ has draft/ready/in_progress/blocked/waiting_for_human/under_review/completed/archived\
  \ \u2014 there is no `planned`. But: `src/agentjobs/cli.py:41` sets DEFAULT_CONFIG\
  \ `defaults.status: planned` (invalid); `docs/api-reference.md` (lines ~22/32/58)\
  \ and `docs/agent-workflow.md` (~60/287) document `planned`; `examples/collaborative_agent.py`\
  \ uses `TaskStatus.PLANNED` which would raise AttributeError. Fix all of these (default\
  \ \u2192 `draft`). Leave `migration/converter.py`'s `planned` mapping alone \u2014\
  \ that intentionally maps legacy input.\n\n**2. Windows console crash on startup.**\
  \ `agentjobs serve` (cli.py:138) echoes a rocket emoji; on Windows consoles with\
  \ cp1252 encoding (e.g. non-interactive/background shells) this raises UnicodeEncodeError\
  \ and the server never starts. Reproduced 2026-07-06. Fix by removing the emoji\
  \ from CLI output or guarding encoding (e.g. try/except fallback to plain text,\
  \ or reconfigure stdout to UTF-8). Audit other CLI echoes for the same issue.\n\n\
  **3. Git workflow gaps in agent docs.** ENGINEERING.md mandates branch *naming*\
  \ (`type/task-xxx-description`) and Conventional Commits, but never says when to\
  \ branch, how to size commits, or how merges happen. Add to ENGINEERING.md (Git\
  \ Workflow) and ALLAGENTS.md (Task Lifecycle):\n- Create the branch before marking\
  \ a task in_progress; record it in the task's `branches[]` field.\n- Small, single-logical-change,\
  \ easily reviewable commits; tests pass before every commit.\n- Stop at branch-complete:\
  \ set the task waiting_for_human for human review. Merge to main only on explicit\
  \ approval, via rebase onto main + `--no-ff` merge; then mark the branch `merged`\
  \ in branches[].\n\n**Stretch:** flesh out docs/task-schema.md (currently a stub)\
  \ from src/agentjobs/models.py."
