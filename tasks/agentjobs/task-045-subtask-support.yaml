id: task-045-subtask-support
title: Add sub-task (parent/child) support and split agent-assignment fields (assigned_to
  / supported_agents)
created: '2026-07-06T19:25:45.710710Z'
updated: '2026-07-29T19:17:08.364278Z'
status: draft
priority: high
category: infrastructure
assigned_to: claude
estimated_effort: half day
description: "AgentJobs has no task hierarchy today: `phases[]` are sub-units *inside*\
  \ one task (not claimable, no prompts/comments), and `Dependency.type` only supports\
  \ depends_on/blocks/related. The React-frontend effort wants milestone umbrella\
  \ tasks with real sub-tasks, so add first-class parent/child support:\n\n**Model**\
  \ (src/agentjobs/models.py): add `parent: Optional[str]` to `Task`. A direct field\
  \ is preferred over overloading `Dependency.type` because it is explicit and cheaply\
  \ queryable.\n\n**Manager** (src/agentjobs/manager.py): add `get_subtasks(task_id)`\
  \ returning children; change `get_next_task` to skip umbrella tasks (any task that\
  \ has children) so milestone containers are never claimed as work.\n\n**API**: accept\
  \ `parent` on TaskCreateRequest/TaskUpdateRequest (src/agentjobs/api/models.py);\
  \ add a `?parent=` filter to GET /api/tasks (src/agentjobs/api/routes/tasks.py).\
  \ Validate that the parent exists; reject self-parenting and cycles.\n\n**Jinja\
  \ UI** (minimal \u2014 the React frontend will replace it): on a parent's detail\
  \ page show a children list with status badges; on a child show a 'part of task-xxx'\
  \ link (src/agentjobs/api/templates/task_detail.html).\n\n**Tests**: model validation,\
  \ manager get_subtasks/get_next_task skipping, API create-with-parent + filter +\
  \ validation errors.\n\nAfter this task merges, the React milestone umbrella tasks\
  \ (Milestone 1: read-only browser; Milestone 2: interactive human workflow; Milestone\
  \ 3: maturity) and their children will be created using `parent`.\n\n**Assignment\
  \ fields (folded in 2026-07-29):** `assigned_to` is documented as \"agent currently\
  \ assigned\" but in practice gets filled in at task-authoring time as a static recommendation,\
  \ conflating eligibility with live ownership. Split it:\n- Add `supported_agents:\
  \ List[str]` to `Task` (src/agentjobs/models.py) \u2014 the eligibility/recommendation\
  \ list set at authoring time (e.g. `[claude, codex]`).\n- `assigned_to` becomes\
  \ live-ownership-only: null until an agent calls `mark_in_progress(task_id, agent=...)`;\
  \ the manager (src/agentjobs/manager.py) should clear it when status moves back\
  \ to `draft`/`ready`/`waiting_for_human`/`blocked`.\n- Backfill existing task YAML:\
  \ move each task's current `assigned_to` value into `supported_agents` (lowercased,\
  \ e.g. `Codex` -> `codex`) and clear `assigned_to` for any task not actually `in_progress`.\n\
  - Update docs/agent-workflow.md's Task Object section to document both fields and\
  \ the ownership-vs-eligibility distinction.\n- This was intentionally combined with\
  \ the parent/child work rather than opened as a separate task, since both are schema\
  \ changes touching the same model/API/template surface and schema changes here are\
  \ currently expensive enough that batching them is worth it. Consider a follow-up\
  \ task on reducing that friction (see docs/task-schema.md stretch goal in task-044)\
  \ if this keeps happening.\n\n## Superseded-by note (2026-07-29)\n\nThis task's\
  \ two schema changes (the `parent` field, and the `assigned_to`/`supported_agents`\
  \ split) were specified in isolation, before the decision to do a deliberate schema\
  \ design pass. **task-048 now precedes this task** and may confirm, reshape, or\
  \ absorb that scope.\n\nDo not start this task until task-048 has reconciled against\
  \ it (task-048 sc-4). The Jinja/manager/API/test work here likely survives largely\
  \ intact; it is the shape of the schema changes themselves that is subject to revision.\n"
