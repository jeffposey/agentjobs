prompts:
  starter: '## Objective

    Add sub-task behavior atop schema v2''s parent field per the task description.
    The schema fields already exist (task-050); this is manager/API/GUI behavior and
    tests only.


    ## Steps

    1. Create branch `feat/task-045-subtask-support` from main. Record it in branches[]
    and mark the task in_progress (claim via the v2 API).

    2. Manager: get_subtasks; umbrella exclusion from claimability. Tests.

    3. API: parent on create/update, ?parent= filter, exists/self/cycle validation.
    Tests.

    4. Jinja detail template: children list on parents, parent link on children.

    5. poetry run pytest, black/ruff/mypy. Verify manually via curl + browser, then
    delete scratch tasks.


    ## Git workflow (mandatory)

    One logical change per commit (manager / API / UI). When the branch is complete
    and verified: STOP, hand off to human review via the v2 handoff API with a
    ball_prompt, and wait for explicit approval. On approval: rebase onto main, merge
    with --no-ff, mark the branch merged in branches[], close the task.


    ## After merge

    Create the React milestone umbrella tasks and their sub-tasks using parent (see
    the approved plan: Milestone 1 read-only browser M1.1-M1.8, Milestone 2 interactive
    M2.1-M2.2, Milestone 3 optional M3.1-M3.2).'
