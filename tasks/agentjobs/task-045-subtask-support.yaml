- id: 6
  ts: '2026-08-11T03:18:53.747056Z'
  actor: claude
  type: decision
  body: '**Parent validation lives in the manager, not in the API route.**


    The spec put it under "API: validate parent exists; reject self-parenting and
    cycles",

    and the deliverable note says `routes/tasks.py`. I put it in `TaskManager` instead,
    and

    let the route''s existing `ValueError -> 400` handlers carry it to the client.
    The

    acceptance criterion is met either way -- a bad parent is a 400.


    Why: the CLI, `client.py` and any agent driving the manager directly would all
    bypass a

    route-level check, and a rule that only the web API enforces is a rule the corpus
    can

    still be edited around. It is the same reasoning that put `_unmet_needs` in the
    manager.


    Rejected: duplicating the check in the route for an API-shaped error message.
    The

    manager''s messages already name the task, the parent and the cycle chain, so
    the

    duplicate would only add a second place to forget.'
  data: {}
- id: 7
  ts: '2026-08-11T03:18:53.768456Z'
  actor: claude
  type: decision
  body: '**`?parent=` matches one id exactly; there is no way to ask for top-level
    tasks.**


    `GET /api/tasks?parent=<id>` returns that umbrella''s children and nothing else.
    It

    cannot express "tasks with no parent", which is the natural next request once
    a listing

    wants to show a tree.


    Rejected for now: a sentinel like `?parent=none`. It needs a reserved value that
    can

    never be a task id, and it is guesswork about what the React task list will actually

    want -- easier to add against a real caller than to design blind and support forever.

    The acceptance criterion asks only for the children of an id.'
  data: {}
- id: 8
  ts: '2026-08-11T03:18:53.790735Z'
  actor: claude
  type: decision
  body: '**The umbrella is `task-063-schema-v2`, category `infrastructure`, not `architecture`.**


    The spec suggested `architecture`. This project''s `.agentjobs/config.yaml` defines
    no

    such category, and adding one to file a single task is a larger change than task-045

    called for. `infrastructure` is what the five children already use.


    The reasoning is recorded in the umbrella''s own description too, so a reader
    who finds

    it there does not have to come back here.'
  data: {}
