spec:
  summary: AgentJobs has no working task hierarchy today.
  description: "AgentJobs has no working task hierarchy today. This task adds the\
    \ *behavior* for parent/child sub-tasks; the schema fields themselves now land\
    \ elsewhere.\n\n## Reconciled with the schema design pass (2026-07-29, task-048\
    \ sc-4)\n\nThis task originally carried two schema changes: a `parent: Optional[str]`\
    \ field, and the `assigned_to`/`supported_agents` ownership-vs-eligibility split.\
    \ **Both are absorbed into schema v2** (docs/schema-design.md \xA72: `parent`,\
    \ and `assignment.owner` / `assignment.eligible`), implemented by task-050 and\
    \ migrated by task-051. What remains here is everything those fields need to actually\
    \ *do*:\n\n**Manager** (src/agentjobs/manager.py): `get_subtasks(task_id)` returning\
    \ children; umbrella tasks (any task with open children) are never claimable \u2014\
    \ excluded from /next and refused by claim (this extends task-052's claimability\
    \ rule: ready + eligible + no open children + no unmet needs dependencies).\n\n\
    **API**: accept `parent` on create/update request models (src/agentjobs/api/models.py);\
    \ `?parent=` filter on GET /api/tasks (src/agentjobs/api/routes/tasks.py). Validate\
    \ parent exists; reject self-parenting and cycles.\n\n**Jinja UI** (minimal \u2014\
    \ the React frontend will replace it): children list with display_status badges\
    \ on a parent's detail page; 'part of task-xxx' link on a child (src/agentjobs/api/templates/task_detail.html).\n\
    \n**Tests**: manager get_subtasks / claimability exclusion, API create-with-parent\
    \ + filter + validation errors (missing/self/cyclic parent).\n\nAfter this task\
    \ merges, the React milestone umbrella tasks (Milestone 1: read-only browser;\
    \ Milestone 2: interactive human workflow; Milestone 3: maturity) and their children\
    \ will be created using `parent`.\n\n**Gated:** do not start until task-052 (v2\
    \ manager/API) merges.\n\n---\n\n## Starter prompt (migrated from schema v1)\n\
    \n## Objective\nAdd sub-task behavior atop schema v2's parent field per the task\
    \ description. The schema fields already exist (task-050); this is manager/API/GUI\
    \ behavior and tests only.\n\n## Steps\n1. Create branch `feat/task-045-subtask-support`\
    \ from main. Record it in branches[] and mark the task in_progress (claim via\
    \ the v2 API).\n2. Manager: get_subtasks; umbrella exclusion from claimability.\
    \ Tests.\n3. API: parent on create/update, ?parent= filter, exists/self/cycle\
    \ validation. Tests.\n4. Jinja detail template: children list on parents, parent\
    \ link on children.\n5. poetry run pytest, black/ruff/mypy. Verify manually via\
    \ curl + browser, then delete scratch tasks.\n\n## Git workflow (mandatory)\n\
    One logical change per commit (manager / API / UI). When the branch is complete\
    \ and verified: STOP, hand off to human review via the v2 handoff API with a ball_prompt,\
    \ and wait for explicit approval. On approval: rebase onto main, merge with --no-ff,\
    \ mark the branch merged in branches[], close the task.\n\n## After merge\nCreate\
    \ the React milestone umbrella tasks and their sub-tasks using parent (see the\
    \ approved plan: Milestone 1 read-only browser M1.1-M1.8, Milestone 2 interactive\
    \ M2.1-M2.2, Milestone 3 optional M3.1-M3.2)."
