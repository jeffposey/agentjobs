- id: 10
  ts: '2026-08-11T04:36:16.583869Z'
  actor: claude
  type: progress
  body: 'Review round 2. Jeff looked at the branch on a review server and asked for
    two things,

    both now built (commits 5 and 6 on the branch).


    **1. The task list nested sub-tasks under their parent.** Children were drawn
    as

    top-level rows, so an umbrella and its five stages read as six unrelated tasks.
    They now

    sit under the parent, collapsed, behind a toggle stating the count. Top-level
    rows keep

    the table''s recency sort; children sort by id, so the list and the detail page
    show the

    same children in the same order.


    **2. The umbrella page rolls up its children.** It previously said "2 open of
    5" and

    nothing else. It now shows a progress bar, "3 of 5 complete, 2 open", and names
    any

    child whose ball is with a human, blocked, or in flight.


    **And the umbrella''s own description was rewritten** (task-063, committed to
    main

    separately). Jeff''s objection was that a top-level task is "text saying I are
    a umbrella"

    -- and he was right about that specific record, because I had written its description

    about the *mechanism* rather than about the schema-v2 effort. It now says what
    the five

    tasks were, why the work was split that way, and what done means for the arc.


    Verified: 500 tests pass (13 more than round 1), black/ruff/mypy clean, and the
    whole

    thing re-checked against the real corpus on a restarted server -- task-063 renders

    "3 of 5 complete, 2 open", a 60% bar, and "Waiting on a human: task-053, task-054".


    One thing worth recording because it cost time: the review server was showing

    `UndefinedError: ''rollup'' is undefined` after I added the roll-up. The server
    was stale

    -- Jinja re-reads templates from disk per request, but uvicorn without --reload
    holds

    the Python route code in memory, so a new template was rendering against an old
    context.

    This is exactly the failure ENGINEERING.md''s "Restart the server" rule describes,
    in a

    form that looks like a template bug.'
  data: {}
- id: 11
  ts: '2026-08-11T04:36:16.610426Z'
  actor: claude
  type: decision
  body: '**A filtered task list goes flat; nesting applies only to the default view.**


    As soon as a search term or any non-"all" filter is active, every matching row
    is drawn

    regardless of whether its parent is expanded, and child rows gain a "part of <id>"
    hint.


    Why: a nested filtered list hides a matching child inside a collapsed parent.
    The row

    most likely to be hidden that way is a sub-task whose ball is with a human --
    the exact

    row the list exists to surface, and the same class of silent-empty-result the

    verification rule in ENGINEERING.md is about.


    Rejected: keeping the tree under filters and auto-expanding any parent with a
    matching

    descendant. It preserves the outline, but it means the set of visible rows depends
    on

    two interacting rules instead of one, and "why is this row here" stops being answerable

    from what you typed. Jeff confirmed the flat behaviour reads fine.


    Also rejected: filtering server-side so the tree could be rebuilt per query. The
    list''s

    filtering has always been client-side and instant; moving it to the server to
    serve one

    edge case would be a visible regression in exchange for a tidier implementation.'
  data: {}
- id: 12
  ts: '2026-08-11T04:36:16.638307Z'
  actor: claude
  type: decision
  body: '**An umbrella''s roll-up is derived on read, never stored on the parent.**


    Jeff asked whether umbrella tasks are "really supposed to be a shell task". The
    record

    stays thin; the *view* got richer.


    Storing a rolled-up status on the parent would put two records in the position
    of

    knowing whether an effort is done, and they would disagree the first time a child
    moved

    -- the same reasoning that makes `display_status` computed rather than persisted
    (design

    doc section 3). Nothing about an umbrella needs to be written down that its children
    do

    not already say.


    What was genuinely missing was not state but content: an umbrella''s `spec` should
    carry

    the arc of the whole effort. That is a writing problem, not a schema one, and
    it is

    fixed in task-063 rather than in the model.


    Rejected: a `rollup` or `progress` field on Task, cached and updated when a child
    moves.

    It needs a write path from every child transition to its parent, which is a second

    place for the log to be wrong.'
  data: {}
- id: 13
  ts: '2026-08-11T04:36:16.672744Z'
  actor: claude
  type: handoff
  body: 'Round 2 handed back to Jeff: list nesting and umbrella roll-up built, still
    not merged.'
