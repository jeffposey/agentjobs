prompts:
  starter: '## Objective

    Add first-class parent/child sub-task support per the task description: `parent:
    Optional[str]` on Task, manager helpers (get_subtasks; get_next_task skips tasks
    that have children), API support (`parent` on create/update, `?parent=` filter,
    validation: parent must exist, no self/cycles), minimal Jinja rendering, and tests.


    ## Steps

    1. Create branch `feat/task-045-subtask-support` from main. Record it in branches[]
    and mark the task in_progress.

    2. Model change + tests (backward compat: existing YAML without parent must load).

    3. Manager change + tests.

    4. API change + tests (TaskCreateRequest/TaskUpdateRequest in api/models.py; routes/tasks.py
    list filter + validation).

    5. Jinja detail template: children list on parents, parent link on children.

    6. `poetry run pytest`, black/ruff/mypy. Verify manually: create a scratch parent+child
    via curl, check ?parent= filter, check /api/tasks/next skips the parent, view
    both pages in the browser, then delete the scratch tasks.


    ## Git workflow (mandatory)

    One logical change per commit (model / manager / API / UI / docs). When the branch
    is complete and verified: STOP, set this task to waiting_for_human, and wait for
    explicit human approval. On approval: rebase onto main, merge with --no-ff, mark
    the branch merged in branches[], set task completed.


    ## After merge

    Create the React milestone umbrella tasks and their sub-tasks using the new parent
    field (see the approved plan: Milestone 1 read-only browser M1.1-M1.8, Milestone
    2 interactive M2.1-M2.2, Milestone 3 optional M3.1-M3.2).'
