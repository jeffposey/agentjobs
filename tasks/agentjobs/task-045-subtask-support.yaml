id: task-045-subtask-support
title: Sub-task behavior atop schema v2 (get_subtasks, umbrella non-claimability,
  ?parent= filter, GUI)
created: '2026-07-06T19:25:45.710710Z'
updated: '2026-07-29T20:47:00Z'
status: draft
priority: high
category: infrastructure
assigned_to: claude
estimated_effort: half day
description: "AgentJobs has no working task hierarchy today. This task adds the *behavior*\
  \ for parent/child sub-tasks; the schema fields themselves now land elsewhere.\n\n\
  ## Reconciled with the schema design pass (2026-07-29, task-048 sc-4)\n\nThis task\
  \ originally carried two schema changes: a `parent: Optional[str]` field, and the\
  \ `assigned_to`/`supported_agents` ownership-vs-eligibility split. **Both are absorbed\
  \ into schema v2** (docs/schema-design.md \xA72: `parent`, and `assignment.owner`\
  \ / `assignment.eligible`), implemented by task-050 and migrated by task-051. What\
  \ remains here is everything those fields need to actually *do*:\n\n**Manager** (src/agentjobs/manager.py):\
  \ `get_subtasks(task_id)` returning children; umbrella tasks (any task with open\
  \ children) are never claimable — excluded from /next and refused by claim (this\
  \ extends task-052's claimability rule: ready + eligible + no open children + no\
  \ unmet needs dependencies).\n\n**API**: accept `parent` on create/update request\
  \ models (src/agentjobs/api/models.py); `?parent=` filter on GET /api/tasks\
  \ (src/agentjobs/api/routes/tasks.py). Validate parent exists; reject self-parenting\
  \ and cycles.\n\n**Jinja UI** (minimal — the React frontend will replace it):\
  \ children list with display_status badges on a parent's detail page; 'part of\
  \ task-xxx' link on a child (src/agentjobs/api/templates/task_detail.html).\n\n\
  **Tests**: manager get_subtasks / claimability exclusion, API create-with-parent +\
  \ filter + validation errors (missing/self/cyclic parent).\n\nAfter this task merges,\
  \ the React milestone umbrella tasks (Milestone 1: read-only browser; Milestone 2:\
  \ interactive human workflow; Milestone 3: maturity) and their children will be\
  \ created using `parent`.\n\n**Gated:** do not start until task-052 (v2 manager/API)\
  \ merges.\n"
