- id: 5
  ts: '2026-08-11T06:03:23.082484Z'
  actor: claude
  type: note
  body: 'Evidence for whoever implements this, gathered 2026-08-11 after the promotion
    entry above was written. The promotion entry says docs/agent-workflow.md is ''still
    entirely schema v1''. That undersells it, and the sharper version changes what
    the work is.


    **src/agentjobs/client.py is already fully v2.** It exposes claim_task, handoff_task,
    release_task, close_task, add_log_entry, add_progress_update, get_next_task, list_tasks,
    get_task, search_tasks, create_task and mark_deliverable_complete. So the guide
    is not documentation lagging behind an API -- it documents methods that **do not
    exist on the client at all**. Every code sample in its Quick Start raises AttributeError.


    The dead symbols, so nobody has to re-derive the list:


    - `client.mark_in_progress(...)` -- the v2 spelling is `claim_task(task_id, agent=...)`

    - `client.mark_completed(...)` -- now `close_task(task_id, actor=..., outcome=...)`

    - `client.mark_blocked(...)` -- now `handoff_task(...)` to external/dependency,
    external/service or human/decision

    - `client.get_starter_prompt(...)` and `client.add_followup_prompt(...)` -- `prompts`
    was deleted in v2; the ask now lives in `ball_prompt` and the spec block

    - `from agentjobs import TaskStatus` and `task.status` -- replaced by the four
    axes (lifecycle, ball, ball_reason, outcome) and the derived `display_status`

    - the ''Task States'' section and the `status=` filter arguments throughout


    Roughly 70% of the code samples are affected. Surviving as-written: get_next_task,
    list_tasks, get_task, search_tasks, create_task, mark_deliverable_complete, add_progress_update.


    **Two places already depend on this file being right:**


    1. README.md line 141 links it as ''Agent workflow guide'' -- it is the front-door
    pointer for anyone driving AgentJobs from outside the repo.

    2. docs/agent-dispatch-design.md lines 284-292. The dispatch prompt stub originally
    sent **every dispatched agent to this file as its first instruction**. The read-only
    dispatch experiment on 2026-08-11 caught it -- the first headless run found the
    bug in the prompt that dispatched it. The stub now points at docs/schema-design.md
    section 5 instead, and task-070 is told to point at agent-workflow.md *if this
    task lands first*. That amendment also asks the implementing task to add a test
    asserting the referenced file exists and mentions the resumption contract; worth
    honouring here, because a doc that is correct today and unguarded is how this
    file got into its current state.


    Note the ordering consequence: if this task finishes and the guide becomes the
    canonical resumption contract, task-070''s stub should be pointed here rather
    than at schema-design.md section 5. Leave the section 5 reference intact either
    way -- it is the contract; this guide should link to it, not restate it, or the
    two will disagree eventually (rejected in agent-dispatch-design.md section 10
    for the same reason).


    For contrast, ALLAGENTS.md needs far less: it already covers the zero-context-reader
    requirement and the handoff rules, and is v2-correct. The asymmetry is why sc-1
    is nearly satisfied while sc-3 is not started.'
  data: {}
