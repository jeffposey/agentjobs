id: task-046-agent-human-handoff-loop
title: Formalize the agent-to-human handoff loop (status + notification, chat-independent)
created: '2026-07-20T20:10:26.008565Z'
updated: '2026-07-20T20:10:26.008565Z'
status: draft
priority: high
category: developer_experience
assigned_to: claude
estimated_effort: 1-2 hours
description: "Right now the human-review step in the agent workflow (see [[merge-gate-workflow]]\
  \ convention) has been happening informally through chat narration ('I'm stopping\
  \ here for your review') rather than through AgentJobs' own state. That defeats\
  \ the purpose of dogfooding: the whole point is that a task's status, comments,\
  \ and status_updates should be the source of truth for where things stand \u2014\
  \ not the surrounding conversation.\n\nThe real end-state goal (per project owner,\
  \ 2026-07-20): work towards a loop where an agent picks up a ready task, works it,\
  \ and when it hits a point that needs a human decision, ends its turn by (a) setting\
  \ the task to `waiting_for_human` (or `blocked`) via the real AgentJobs status API\
  \ \u2014 not just saying so in chat, (b) leaving a comment/status_update written\
  \ for a human reader that says exactly what was done and what decision is needed,\
  \ and (c) triggering whatever notification channel is available at the time. Symmetrically,\
  \ when a human responds (approves, comments, rejects) via any interface (CLI, API,\
  \ Jinja GUI today, React GUI soon), that response plus the task's accumulated history\
  \ (human_summary, description, prompts.starter/followups, status_updates, comments)\
  \ must be sufficient for a *brand new* agent session with zero conversational memory\
  \ to correctly resume the task. Chat conversation context is a bootstrapping convenience\
  \ for now, not something the loop should depend on long-term.\n\nNotification channel\
  \ scope for *this* task is intentionally narrow: use whatever is available in an\
  \ interactive session today (a chat reply, or the PushNotification tool for OS/phone\
  \ alerts) when a human decision is needed. Do NOT build a general-purpose notification/webhook\
  \ receiver, email/SMS integration, or an 'accounts' system in this task \u2014 that\
  \ is explicitly deferred (see Later section). The existing webhook infrastructure\
  \ (`task.status_changed` events, HMAC-signed, fired automatically by `manager.update_status()`\
  \ \u2014 see src/agentjobs/webhooks.py and src/agentjobs/manager.py:177) already\
  \ provides the hook point a future pluggable notification service would subscribe\
  \ to; this task should reference that as the intended extension point without building\
  \ it now.\n\n## Later (explicitly out of scope here, capture for a future task)\n\
  A pluggable notification/'account' system supporting multiple channel types (email,\
  \ SMS, mobile push, desktop toast) subscribed to AgentJobs' existing webhook events,\
  \ decoupled from any specific chat session or AI tool \u2014 so a human gets notified\
  \ even when no agent session is currently open. Do not design or implement this\
  \ now; just leave a clear pointer for later (e.g., a docs/roadmap note referencing\
  \ this task)."
