    docs/agent-workflow.md has two independent defects:


    (a) **It contains no resumption contract.** This is what task-046 as written owns
    -- sc-3, and the deliverable note ''Chat-independent resumption model documented''.


    (b) **Its 310 lines of TaskClient guide call methods that do not exist**, per
    the note above. Nothing owns this. No task mentions it.


    Fixing only (a) leaves the file still broken for its primary audience, and leaves
    README.md pointing at a guide whose examples crash. Fixing only (b) leaves the
    contract undocumented and task-070''s stub still routed around this file.


    **Recommendation: widen this task to cover both**, because the two halves touch
    the same paragraphs -- you cannot write the resumption contract into a quick-start
    whose surrounding examples call deleted methods without rewriting those examples
    anyway. Splitting a roughly two-hour prose job across two task ids costs more
    ceremony than it buys and guarantees a merge conflict between them.


    **Rejected alternative:** a separate ''rewrite the client guide for v2'' task,
    leaving 046 narrow. Defensible on the principle that a promoted task should not
    silently grow, and it would keep the resumption-contract work small enough to
    land today. If Jeff prefers this, raise the new task rather than quietly doing
    the work under this id.


    **If unanswered when you reach it:** do (a) in full, do (b) as far as the examples
    you must touch anyway, and hand off naming precisely which sections of the guide
    you left on v1. Do not silently leave a crashing example behind a section you
    rewrote.'
