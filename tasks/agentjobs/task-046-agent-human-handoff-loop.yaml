  description: "Right now the human-review step in the agent workflow (see [[merge-gate-workflow]]\
    \ convention) has been happening informally through chat narration ('I'm stopping\
    \ here for your review') rather than through AgentJobs' own state. That defeats\
    \ the purpose of dogfooding: the whole point is that a task's status, comments,\
    \ and status_updates should be the source of truth for where things stand \u2014\
    \ not the surrounding conversation.\n\nThe real end-state goal (per project owner,\
    \ 2026-07-20): work towards a loop where an agent picks up a ready task, works\
    \ it, and when it hits a point that needs a human decision, ends its turn by (a)\
    \ setting the task to `waiting_for_human` (or `blocked`) via the real AgentJobs\
    \ status API \u2014 not just saying so in chat, (b) leaving a comment/status_update\
    \ written for a human reader that says exactly what was done and what decision\
    \ is needed, and (c) triggering whatever notification channel is available at\
    \ the time. Symmetrically, when a human responds (approves, comments, rejects)\
    \ via any interface (CLI, API, Jinja GUI today, React GUI soon), that response\
    \ plus the task's accumulated history (human_summary, description, prompts.starter/followups,\
    \ status_updates, comments) must be sufficient for a *brand new* agent session\
    \ with zero conversational memory to correctly resume the task. Chat conversation\
    \ context is a bootstrapping convenience for now, not something the loop should\
    \ depend on long-term.\n\nNotification channel scope for *this* task is intentionally\
    \ narrow: use whatever is available in an interactive session today (a chat reply,\
    \ or the PushNotification tool for OS/phone alerts) when a human decision is needed.\
    \ Do NOT build a general-purpose notification/webhook receiver, email/SMS integration,\
    \ or an 'accounts' system in this task \u2014 that is explicitly deferred (see\
    \ Later section). The existing webhook infrastructure (`task.status_changed` events,\
    \ HMAC-signed, fired automatically by `manager.update_status()` \u2014 see src/agentjobs/webhooks.py\
    \ and src/agentjobs/manager.py:177) already provides the hook point a future pluggable\
    \ notification service would subscribe to; this task should reference that as\
    \ the intended extension point without building it now.\n\n## Later (explicitly\
    \ out of scope here, capture for a future task)\nA pluggable notification/'account'\
    \ system supporting multiple channel types (email, SMS, mobile push, desktop toast)\
    \ subscribed to AgentJobs' existing webhook events, decoupled from any specific\
    \ chat session or AI tool \u2014 so a human gets notified even when no agent session\
    \ is currently open. Do not design or implement this now; just leave a clear pointer\
    \ for later (e.g., a docs/roadmap note referencing this task).\n\n## Reconciled\
    \ with the schema design pass (2026-07-29, task-048)\nSchema v2 (docs/schema-design.md\
    \ \xA75, \xA710) makes most of this loop *structural*: every handoff requires\
    \ a ball_prompt (the ask is a schema-level requirement, not a discipline), handoffs\
    \ are typed log entries, and the task.handoff webhook carries the composed payload.\
    \ This task accordingly narrows to: documenting the resumption contract (docs/schema-design.md\
    \ \xA75) in ALLAGENTS.md and docs/agent-workflow.md, and exercising the loop end-to-end\
    \ as its first real use. Where the success criteria name v1 fields, read them\
    \ through the v2 mapping (human_summary -> spec.summary; status_updates/comments\
    \ -> the unified log). **Gated:** start after task-052 merges.\n\n---\n\n## Starter\
    \ prompt (migrated from schema v1)\n\n## Objective\nFormalize (in docs, and in\
    \ how I actually operate) the agent-to-human handoff loop described in this task's\
    \ description. This is primarily a documentation/behavioral task, not a code feature.\n\
    \n## Steps\n1. Create branch `docs/task-046-agent-human-handoff-loop` from main.\
    \ Record it in branches[] and mark the task in_progress.\n2. Update ALLAGENTS.md\
    \ (Behavioral Guidelines / Task Lifecycle) and docs/agent-workflow.md per the\
    \ success criteria: self-sufficient task content requirement, real status-API\
    \ handoff at human-decision points, interim notification channel (chat/PushNotification),\
    \ and the deferred-future pointer to a webhook-based notification service (reference\
    \ src/agentjobs/webhooks.py's existing task.status_changed event as the extension\
    \ point \u2014 do not build the receiver now).\n3. Spot-check tasks 042-045's\
    \ human_summary fields against the new standard; fix any gaps.\n4. poetry run\
    \ pytest (docs-only change, but confirm nothing broke).\n\n## Git workflow (mandatory)\n\
    Small single-logical-change commits, Conventional Commits format. When the branch\
    \ is complete and verified: STOP, set this task to waiting_for_human via the real\
    \ status API, leave a comment summarizing what was done and what needs review,\
    \ and send a PushNotification \u2014 this task is itself the first real exercise\
    \ of the rule it's establishing. Wait for explicit human approval before merging\
    \ (rebase onto main + --no-ff).\n\n## Study note\nThis task is about making the\
    \ AgentJobs task record the single source of truth for where work stands, so that\
    \ eventually neither the human nor a future agent needs this conversation's history\
    \ to know what happened or what's next."
  context: []
