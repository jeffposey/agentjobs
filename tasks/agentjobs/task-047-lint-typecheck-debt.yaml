id: task-047-lint-typecheck-debt
title: Fix two NameError bugs found by ruff, then clear lint/format/type debt
created: '2026-07-29T18:42:51.398166Z'
updated: '2026-08-10T08:02:04.569563Z'
status: waiting_for_human
priority: medium
category: maintenance
estimated_effort: 3-4 hours
human_summary: 'Ruff found two real bugs: Comment.update_content() and Webhook.record_trigger()
  both crash with NameError because models.py never imports timezone -- both methods
  are untested, which is why nobody noticed. Also makes enum fields consistently typed
  (use_enum_values currently makes task.status a str or an enum depending on how it
  was set, so the annotation is wrong half the time). Then clears the surrounding
  style/type debt that surfaced when the lint toolchain was first run.'
description: 'Standing up black/ruff/mypy on a fresh machine (2026-07-29) surfaced
  accumulated findings across the repo. Most is style debt, but **ruff found two real
  latent bugs** that are the reason this task is worth doing rather than deferring
  indefinitely.


  ## 1. Two NameError bugs (the actual priority)


  `src/agentjobs/models.py` imports `from datetime import datetime` but never imports
  `timezone`, while two methods reference `timezone.utc`:


  - `Comment.update_content()` (models.py:368)

  - `Webhook.record_trigger()` (models.py:390)


  Both raise `NameError: name ''timezone'' is not defined` when called. Confirmed
  empirically 2026-07-29, not just a static-analysis guess.


  These went unnoticed because both methods are entirely untested -- the coverage
  report lists models.py lines 367-368 and 390 as uncovered, exactly the broken lines.
  Fixing the import alone is a one-liner; **the fix must come with regression tests
  calling both methods**, otherwise the same class of bug reappears silently.


  Note `Webhook.record_trigger()` being dead-on-call is a hint worth chasing: check
  whether webhook delivery ever actually records `last_triggered`, or whether that
  field is silently never updated in production paths (src/agentjobs/webhooks.py).


  ## 2. Dead code


  `src/agentjobs/manager.py:132` -- F841, local variable `task` assigned but never
  used (inside `delete_task`). Check whether that line was meant to guard existence
  before deleting; it may be a swallowed bug rather than merely dead.


  ## 3. Style / type debt (mechanical)


  - **black**: 12 files would be reformatted, 36 clean. Mostly collapsing wrapped   expressions
  that fit on one line.

  - **ruff**: 29 findings total, 17 auto-fixable. Breakdown: 15x F401 unused imports   (mostly
  in tests/), 9x E402 module-level import not at top of file (all in   examples/),
  2x F541 f-string without placeholders, plus the F821/F841 above.

  - **mypy**: 53 errors across 17 files, overwhelmingly `no-untyped-def` in tests/   (pyproject
  sets `disallow_untyped_defs = true`, which tests were never written to   satisfy).


  ## Scope decision needed on E402


  The 9 E402 findings are all in `examples/`, where scripts do `sys.path` manipulation
  before importing agentjobs -- that is a legitimate pattern for standalone example
  scripts, not a defect. Prefer a `per-file-ignores` entry in the ruff config over
  rewriting the examples. Same judgement applies to mypy on tests/: consider whether
  `disallow_untyped_defs` should apply to tests at all, or be relaxed per-directory,
  rather than annotating ~50 test functions for their own sake.


  Do the bug fixes and the mechanical cleanup as **separate commits** so the real
  fixes stay reviewable and are not buried in a large reformatting diff.



  ## 4. Enum fields are not consistently typed (added 2026-07-29)


  `Phase`, `StatusUpdate`, and `Task` set `use_enum_values=True`. That converts values
  which pass through validation into plain strings, but **defaults bypass validation**
  and keep the enum member. So an in-memory `task.status` is:


  - `str` when loaded from YAML or explicitly set

  - `TaskStatus` when it fell through to the default


  The annotation claims `TaskStatus` in both cases, so it is wrong half the time --
  which is why mypy cannot catch status-handling bugs and why callers write `isinstance`
  guards.


  **Fix: delete `use_enum_values=True` from those three models (3 lines).** Verified
  experimentally on 2026-07-29 before writing this up:


  - YAML output is **byte-identical** -- `storage.py` dumps with `mode="json"`, which   converts
  enums to values regardless. The setting was never what produced clean YAML.

  - API JSON unchanged (`''completed''`, `''high''` still plain strings).

  - Full suite passed (72 tests).

  - Both paths then yield `TaskStatus`, and `.value` works uniformly.


  Existing `==` comparisons against string literals keep working because `TaskStatus`
  and `Priority` subclass `str`.


  ### Dead workarounds to remove with it


  `src/agentjobs/manager.py:172` is **already a no-op** and should go:


  ```python

  prev_status_value = previous_status if isinstance(previous_status, str) else previous_status.value

  ```


  `TaskStatus` *is* a `str` subclass, so `isinstance(..., str)` is `True` even for
  the enum member -- the `.value` branch never executes. It works by accident (JSON
  serializes str subclasses fine), but it is defensive code that does not do what
  it appears to do. That is the real cost of the inconsistency: the guards written
  against it are themselves subtly wrong.


  `examples/collaborative_agent.py:50` does the same dance and can be simplified.


  Also update the "Gotcha: enum fields are not consistently typed in memory" section
  of `docs/task-schema.md`, which documents the current behaviour and becomes obsolete
  once this lands.


  Why here and not in task-045 (the schema task): this changes no schema. The YAML
  is byte-identical -- it is a typing-correctness fix, which is this task''s subject,
  and it makes mypy meaningfully more useful (see sc-4).

  '
