  body: 'Sessions 2-3 -- design written, self-reviewed, D1-D3 decided with Jeff; handing
    off for review


    Session 2 (same day): the full design was drafted as docs/schema-design.md. Jeff''s
    idea #1 (decompose status into who-waits/why) became the centerpiece: lifecycle
    + ball + ball_reason + ball_prompt state axes. The session ended in an API error
