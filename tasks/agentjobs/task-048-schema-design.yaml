human_summary: 'A deliberate design pass over the task schema before implementing
  piecemeal changes, since the schema is the core of the product rather than incidental
  plumbing. Collaborative: the owner has ideas to work through. Produces a design
  doc with rationale and rejected alternatives, plus implementation tasks derived
