- timestamp: '2026-08-10T20:15:44.389408Z'
  author: claude
  status: in_progress
  summary: Claimed; sequenced before task-052 so a bad file during the migration is
    visible
  details: 'Branch fix/task-049-loud-load-errors created from main at bad0541.


    Why now rather than later: Jeff chose 049 then 055 then 052. Both are the right
    order. Storage currently swallows validation errors and returns None, so a malformed
    file vanishes from every listing with no trace. That is bad in normal operation
    and much worse during task-052''s migration, where a file failing to load is exactly
    the signal that something went wrong. Fixing it first means the riskiest change
    of the project runs with the alarm wired up rather than muted.


    Current behaviour, confirmed in src/agentjobs/storage.py: load_task catches ValidationError,
    logs at error level, and returns None. list_tasks skips anything that returns
    None. So the task disappears and the only evidence is a log line nobody is reading.


    Plan: a structured error type carrying path, field and message; load_task raises
    it; list_tasks keeps returning the valid tasks while surfacing the broken ones
    rather than dropping them silently; API, CLI and GUI all show them. Tests with
    a deliberately broken fixture for both the listing path and the single-read path.'
- timestamp: '2026-08-10T20:25:22.038665Z'
  author: claude
  status: waiting_for_human
  summary: Broken task files are now loud everywhere; all 3 criteria met, 343 tests
    pass
  details: 'Three commits on fix/task-049-loud-load-errors, split into the storage
    change and the surfaces that show it. 343 tests pass (15 new); ruff, mypy and
    black clean across 62 files.


    ## The change


    load_task returned None both for a missing file and for a corrupt one. Those are
    different answers. Missing is a legitimate reply to ''is there a task with this
    id''; corrupt is not, and returning None for it dropped the task out of every
    listing with a log line as the only evidence.


    Now: TaskLoadError for a file that exists but cannot be read, None only for genuinely
    absent. The error carries the path and a compressed field-level reason, so the
    message is ''priority: Input should be low, medium, high or critical'' rather
    than pydantic''s multi-line default with a docs URL.


    load_all() returns tasks AND errors, so one bad file cannot take down the listing
    of the other thirty-seven. Errors are returned rather than logged, deliberately:
    that forces callers to decide what to display, which is what makes a broken file
    visible in a UI instead of only in a log.


    Surfaces: GET /api/tasks/broken; a 422 naming the file when reading a corrupt
    task by id; a red banner on the web listing pages stating plainly that the file
    is not in the list below; a stderr warning from `agentjobs list`.


    ## Verified against a real server, not only in tests


    Dropped a deliberately corrupt file into the registered sandbox project and confirmed
    all four surfaces: valid tasks still listed, the broken file appeared in /broken
    with its field-level reason, the page banner named it, and reading it directly
    returned 422. Probe removed afterwards.


    ## One test updated because it encoded the bug


    test_load_task_with_invalid_yaml asserted `is None` for all three broken cases.
    That is exactly the behaviour this task exists to remove, so it was rewritten
    with the reasoning recorded in the test, plus a new test asserting missing files
    still return None so the two cases stay distinguishable.


    ## Why this mattered before task-052


    Jeff sequenced 049 before the migration deliberately, and it was the right call.
    Task-052 rewrites every task file in the corpus. If a converted file failed to
    load afterwards, the old behaviour would have made it vanish from the listing
    silently -- the failure mode hardest to notice, during the operation where noticing
    matters most. The alarm is now wired up before the risky change runs.


    ## Note for task-052


    The v2 loader in models_v2.check_schema_version raises SchemaVersionError for
    an unstamped file. When storage switches to v2 it should raise TaskLoadError for
    those too, so a stray v1 file left behind by a partial migration is reported by
    filename rather than crashing the listing.'
