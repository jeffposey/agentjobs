  summary: Claimed; sequenced before task-052 so a bad file during the migration is
    visible
  details: 'Branch fix/task-049-loud-load-errors created from main at bad0541.


    Why now rather than later: Jeff chose 049 then 055 then 052. Both are the right
    order. Storage currently swallows validation errors and returns None, so a malformed
    file vanishes from every listing with no trace. That is bad in normal operation
    and much worse during task-052''s migration, where a file failing to load is exactly
    the signal that something went wrong. Fixing it first means the riskiest change
    of the project runs with the alarm wired up rather than muted.


    Current behaviour, confirmed in src/agentjobs/storage.py: load_task catches ValidationError,
    logs at error level, and returns None. list_tasks skips anything that returns
    None. So the task disappears and the only evidence is a log line nobody is reading.


    Plan: a structured error type carrying path, field and message; load_task raises
    it; list_tasks keeps returning the valid tasks while surfacing the broken ones
    rather than dropping them silently; API, CLI and GUI all show them. Tests with
    a deliberately broken fixture for both the listing path and the single-read path.'
