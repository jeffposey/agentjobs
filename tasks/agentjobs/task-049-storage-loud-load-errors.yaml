id: task-049-storage-loud-load-errors
title: 'Storage: stop swallowing task validation errors; report file, field, and error'
created: '2026-07-29T20:45:00Z'
updated: '2026-07-29T20:45:00Z'
status: ready
priority: high
category: infrastructure
estimated_effort: 1-2 hours
human_summary: 'TaskStorage.load_task currently catches validation errors and returns
  None, so a broken task file silently vanishes from every listing -- the worst possible
  failure mode for a system whose files are hand-editable. Make load failures loud
  and precise. Decided during the schema design pass (task-048, decision D2) but lands
  on the v1 schema, before and independently of schema v2.'
description: 'When a task YAML file fails model validation, `TaskStorage.load_task`
  swallows the error and returns None, and the task disappears from listings with no
  trace. Under the strict-everywhere posture decided in docs/schema-design.md (§11,
  D2), a bad file must fail loudly instead: the reader gets filename + field + error,
  and listings report broken files rather than omitting them.


  Scope:

  - Storage: on validation failure, raise (or return) a structured error carrying
  the file path and the underlying pydantic error, instead of returning None.

  - Listing paths (manager, API, CLI, Jinja GUI): a broken file must be *visible* --
  an error entry or warning naming the file and reason -- and must not take down the
  listing of the remaining valid tasks.

  - Single-task reads (API GET by id, CLI show): surface the validation error with
  file, field, and message.

  - Tests: a deliberately-broken fixture file exercising both the listing path and
  the single-read path.


  This is a v1 change. It does not depend on, and should not wait for, the schema v2
  implementation chain (task-050 onward).'
