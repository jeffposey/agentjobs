id: task-049-storage-loud-load-errors
title: 'Storage: stop swallowing task validation errors; report file, field, and error'
created: '2026-07-29T20:45:00Z'
updated: '2026-08-10T20:28:37.582437Z'
status: completed
priority: high
category: infrastructure
estimated_effort: 1-2 hours
human_summary: 'TaskStorage.load_task currently catches validation errors and returns
  None, so a broken task file silently vanishes from every listing. Make load failures
  loud and precise. Decided during the schema design pass (task-048, decision D2)
  but lands on the v1 schema, before and independently of schema v2. Note the rationale
  was restated when D2 was amended: this is not about protecting hand edits (no longer
  a first-class interface) but about any writer -- a migrator or API bug that writes
  a bad file must fail by name rather than make a task disappear. Under UI-primary
  editing it is more urgent, not less: a vanished task is invisible to someone whose
  only window into the data is the listing.'
description: "When a task YAML file fails model validation, `TaskStorage.load_task`\
  \ swallows the error and returns None, and the task disappears from listings with\
  \ no trace. Under the strict-everywhere posture decided in docs/schema-design.md\
  \ (\xA711, D2), a bad file must fail loudly instead: the reader gets filename +\
  \ field + error, and listings report broken files rather than omitting them.\n\n\
  Scope:\n- Storage: on validation failure, raise (or return) a structured error carrying\
  \ the file path and the underlying pydantic error, instead of returning None.\n\
  - Listing paths (manager, API, CLI, Jinja GUI): a broken file must be *visible*\
  \ -- an error entry or warning naming the file and reason -- and must not take down\
  \ the listing of the remaining valid tasks.\n- Single-task reads (API GET by id,\
  \ CLI show): surface the validation error with file, field, and message.\n- Tests:\
  \ a deliberately-broken fixture file exercising both the listing path and the single-read\
  \ path.\n\nThis is a v1 change. It does not depend on, and should not wait for,\
  \ the schema v2 implementation chain (task-050 onward)."
