status_updates:
- timestamp: '2026-08-10T19:17:48.534164Z'
  author: claude
  status: in_progress
  summary: Claimed; v2 models will land alongside v1 rather than replacing it
  details: 'Branch feat/task-050-schema-v2-models created from main at the task-061
    merge, recorded in branches[] before this transition. Gate satisfied: task-047
    merged, so enums are honestly typed underneath this.


    SCOPE DECISION, made before writing code, because the task''s own note understates
    the problem.


    The task says the corpus test ''will fail against v1 files once the v2 model lands''.
    Measured, it is much larger than that: 26 modules import models, there are roughly
    180 references to fields v2 deletes (phases 25/6/4, prompts 65/25/7, human_summary
    17/5/4, across src/tests/templates), and 38 corpus files are v1. Replacing models.py
    in place would break storage, manager, every API route, every template, the CLI
    and the whole suite at once, and main would stay red until task-052 lands three
    tasks later. That violates ''tests pass before every commit'' for days.


    So v2 lands as a NEW module, src/agentjobs/models_v2.py, with v1 left untouched
    and still running the application. The repo stays green at every commit and this
    task stays independently reviewable, which is what its sizing intended.


    This is explicitly task-050''s call to make: docs/index.md says ''Whether generated
    models become the real models.py or stay a reference is task-050''s call.'' The
    deliverable path in the task record says models.py; I am changing it to models_v2.py
    and recording why here rather than silently.


    Consequence handed to task-051: it now owns the switchover as well as the migrator
    -- convert the corpus, then repoint storage and everything downstream at v2 and
    delete v1. That makes 051 bigger than originally sized. Flagging it now rather
    than at handoff.


    Approach: hand-write the Pydantic models from docs/schema-design.md rather than
    adopting schema/generated/models_v2_preview.py, because the design needs things
    gen-pydantic does not express -- the five consistency rules as validators, ball_reason
    scoped to the ball holder, extra=forbid, and a computed display_status. The generated
    file stays as reference. Acceptance test that matters: the hand-written model
    must load schema/examples/task-048.v2.yaml, which already validates against the
    v2 LinkML schema, so the two definitions are checked against each other rather
    than drifting.'
