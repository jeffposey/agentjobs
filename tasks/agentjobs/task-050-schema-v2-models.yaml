description: "Implement the v2 Pydantic models exactly as specified in docs/schema-design.md\
  \ (the accepted design; D1-D3 resolved in its \xA711). This task is the model layer\
  \ only.\n\nScope (docs/schema-design.md sections in parentheses):\n- State axes\
  \ (\xA73): lifecycle, ball, ball_reason (scoped vocabularies), ball_prompt, outcome,\
  \ archived; the five consistency rules, model-enforced.\n- spec block (\xA72): summary,\
  \ intent, description, constraints, out_of_scope, context pointers.\n- acceptance\
  \ (\xA72): pending|met|failed|dropped, optional verify hint. deliverables: pending|done|dropped.\n\
  - Unified log (\xA74): typed entries (note, progress, transition, handoff, decision,\
  \ question, answer, instruction), typed actors, per-task integer ids, re: threading.\n\
  - assignment (owner/eligible), parent, dependencies (task, type: needs|blocks|related,\
  \ note), links (rel vocabulary, real URL validation), branches (unchanged).\n- schema:\
  \ 2 stamp (\xA78): loader refuses files without it, with a loud error pointing at\
  \ `agentjobs migrate-schema`.\n- Strict mode (\xA711 D2): extra=\"forbid\" everywhere;\
  \ violations are errors at load and save.\n- Computed display_status (\xA73), derived,\
  \ never stored.\n- Deletions (\xA711 D1): phases, prompts, issues, Comment, Dependency.status,\
  \ human_summary do not exist in v2.\n- Regenerate/rewrite docs/task-schema.md to\
  \ describe v2 (task-044 stretch goal folded in here).\n\nOut of scope: the corpus\
  \ migrator (task-051), manager/API operations and taxonomy config validation (task-052),\
  \ CLI (task-053), GUI (task-054).\n\nNote: the corpus test (tests/test_task_corpus.py)\
  \ will fail against v1 files once the v2 model lands -- coordinate with task-051,\
  \ which migrates the corpus and updates that test. Land 050 and 051 on one branch\
  \ if the intermediate red state proves awkward to review; they remain separate commits/reviews\
  \ either way.\n\n**Gated:** do not start until task-047 (enum typing) merges --\
  \ v2 wants honestly-typed enums underneath it."
