- timestamp: '2026-08-10T19:17:48.534164Z'
  author: claude
  status: in_progress
  summary: Claimed; v2 models will land alongside v1 rather than replacing it
  details: 'Branch feat/task-050-schema-v2-models created from main at the task-061
    merge, recorded in branches[] before this transition. Gate satisfied: task-047
    merged, so enums are honestly typed underneath this.


    SCOPE DECISION, made before writing code, because the task''s own note understates
    the problem.


    The task says the corpus test ''will fail against v1 files once the v2 model lands''.
    Measured, it is much larger than that: 26 modules import models, there are roughly
    180 references to fields v2 deletes (phases 25/6/4, prompts 65/25/7, human_summary
    17/5/4, across src/tests/templates), and 38 corpus files are v1. Replacing models.py
    in place would break storage, manager, every API route, every template, the CLI
    and the whole suite at once, and main would stay red until task-052 lands three
    tasks later. That violates ''tests pass before every commit'' for days.


    So v2 lands as a NEW module, src/agentjobs/models_v2.py, with v1 left untouched
    and still running the application. The repo stays green at every commit and this
    task stays independently reviewable, which is what its sizing intended.


    This is explicitly task-050''s call to make: docs/index.md says ''Whether generated
    models become the real models.py or stay a reference is task-050''s call.'' The
    deliverable path in the task record says models.py; I am changing it to models_v2.py
    and recording why here rather than silently.


    Consequence handed to task-051: it now owns the switchover as well as the migrator
    -- convert the corpus, then repoint storage and everything downstream at v2 and
    delete v1. That makes 051 bigger than originally sized. Flagging it now rather
    than at handoff.


    Approach: hand-write the Pydantic models from docs/schema-design.md rather than
    adopting schema/generated/models_v2_preview.py, because the design needs things
    gen-pydantic does not express -- the five consistency rules as validators, ball_reason
    scoped to the ball holder, extra=forbid, and a computed display_status. The generated
    file stays as reference. Acceptance test that matters: the hand-written model
    must load schema/examples/task-048.v2.yaml, which already validates against the
    v2 LinkML schema, so the two definitions are checked against each other rather
    than drifting.'
- timestamp: '2026-08-10T19:31:57.475860Z'
  author: claude
  status: waiting_for_human
  summary: v2 models implemented and cross-checked against LinkML; all 4 criteria
    met, 285 tests pass
  details: 'Three commits on feat/task-050-schema-v2-models. 285 tests pass (79 new);
    ruff, mypy and black clean across 59 files. The running application is unaffected
    -- verified by starting the server and hitting the dashboard, both projects, /api/projects
    and /health after the change.


    ## The scope decision, which is the main thing to review


    v2 landed as a NEW module, src/agentjobs/models_v2.py. v1 is untouched and still
    runs everything.


    The task said replacing models.py would fail the corpus test. Measured, it is
    much bigger: 26 modules import models, roughly 180 references to deleted fields
    across src/tests/templates, and 38 v1 corpus files. Replacing in place breaks
    storage, the manager, every route, every template and the CLI in one commit, and
    main stays red until task-052 lands two tasks later. That is days of a broken
    main in exchange for nothing.


    docs/index.md explicitly assigns this call to task-050 (''Whether generated models
    become the real models.py or stay a reference is task-050''s call''), so I made
    it rather than escalating. The task''s deliverable said models.py; it is models_v2.py,
    recorded here rather than silently.


    Consequence, and it needs your awareness: task-051 now owns the switchover as
    well as the migrator -- convert the corpus, repoint storage and everything downstream,
    delete v1. That makes 051 materially bigger than its original sizing. It is the
    right place for it, because the migration and the switchover have to be atomic
    to keep main green, but it is no longer a small task.


    ## What is enforced


    The five consistency rules from design doc section 3, which are the design''s
    actual claim -- that limbo is unrepresentable. An open task with no ball, a ball_reason
    belonging to a different holder, a handoff with no ask, an outcome on an open
    task, and an active task with no owner are all now impossible to construct. Errors
    name what is wrong and what is permitted instead, because the reader is usually
    an agent that has never opened the design doc.


    ## Two things I added beyond the written spec


    1. Log integrity rules the design implies but never states: entry ids unique and
    ascending, and `re:` must point at an earlier entry that exists. An append-only
    log that can thread forward, or to nothing, is not append-only. Flagging it because
    it is a design decision I made rather than implemented.

    2. ball_reason is one flat enum plus a scoping table rather than three separate
    enums, so the field has a single type while still being unable to hold human/work.
    The alternative (three enums, a union field) would have made every read site do
    the narrowing.


    ## Cross-checked in both directions


    The Pydantic model loads schema/examples/task-048.v2.yaml, which linkml-validate
    accepts -- so LinkML''s definition and mine agree on what a task is. And what
    Pydantic *dumps* still validates against schema/agentjobs-v2.yaml, which is the
    direction that actually rots. That second test has a companion asserting the check
    can fail, so it cannot silently become a no-op.


    ## Documentation


    docs/task-schema.md now covers both versions rather than only v2. Documenting
    only v2 would leave the live on-disk format undocumented for the two tasks it
    takes to switch over. The v1 half carries a banner and goes away with task-051.
    Three tests guard the page against drift: every enum value and every Task field
    must appear on it.


    ## A mistake worth recording


    While mutation-testing the doc guard I ran `git checkout -- docs/task-schema.md`
    to undo the deliberate breakage, and reverted the entire uncommitted v2 rewrite
    with it. Redone, and nothing was lost, but the lesson is real: commit before mutation-testing,
    or mutate a copy. This is the second time this session that a cleanup command
    has been more destructive than intended.


    ## Not done here, by scope


    No migrator (051), no manager/API operations or taxonomy config validation (052),
    no CLI (053), no GUI (054). Nothing is wired in. Note also that config-driven
    acceptance criterion types (D5) remain deliberately deferred -- additive under
    the evolution policy, so they need not lengthen this chain.'
