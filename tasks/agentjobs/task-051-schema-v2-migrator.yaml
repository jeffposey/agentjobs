  description: "Implement the v1 -> v2 converter decided in docs/schema-design.md\
    \ \xA78 (D3) and migrate the repo's task corpus with it.\n\nConversion rules (all\
    \ specified in docs/schema-design.md):\n- status -> lifecycle/ball/ball_reason/outcome\
    \ per the \xA73 mapping table, including the split for v1 `blocked` (claimed ->\
    \ active + external/dependency; unclaimed -> ready) and the last-status-update\
    \ heuristic for `waiting_for_human`.\n- ball_prompt synthesized from the last\
    \ status update / handoff context where the ball lands on a person; flagged for\
    \ human review where no source text exists.\n- assigned_to -> assignment.eligible\
    \ (authoring-time values, lowercased) or assignment.owner (only where genuinely\
    \ in_progress).\n- prompts.followups -> instruction log entries (7 files have\
    \ them); status_updates and comments -> the unified log; prompts.starter dropped\
    \ where it restates the description, appended to spec.description where it does\
    \ not.\n- phases[] -> description appendix (15 files); issues[]/comments are empty\
    \ corpus-wide and migrate to nothing.\n- Nested checklist statuses: in_progress\
    \ -> pending; others map by name.\n- human_summary -> spec.summary; description\
    \ -> spec blocks (mechanical split where obvious, else everything into spec.description);\
    \ estimated_effort -> effort; external_links -> links; dependency task_id -> task,\
    \ depends_on -> needs.\n- schema: 2 stamped on every output file.\n\nAlso: update\
    \ tests/test_task_corpus.py to validate the migrated corpus against the v2 model\
    \ (round-trip + `schema: 2` assertion). See the coordination note in task-050\
    \ about the intermediate red state between 050 and 051.\n\n**Gated:** requires\
    \ task-050 (the v2 model) merged or on the shared branch.\n\n---\n\n## Starter\
    \ prompt (migrated from schema v1)\n\nImplement per docs/schema-design.md \xA7\
    8 and this description. Branch `feat/task-051-schema-v2-migrator` (or continue\
    \ task-050's branch per its coordination note), record in branches[], mark in_progress.\
    \ Migrate the corpus as its own commit so the diff is reviewable file-by-file.\
    \ When complete: STOP, set waiting_for_human, comment a summary, await approval."
  context: []
