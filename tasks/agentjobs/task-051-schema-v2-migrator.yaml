log:
- id: 1
  ts: '2026-08-10T19:49:06Z'
  actor: claude
  type: transition
  body: 'Claimed; corpus measured first, and one design assumption is measurably wrong


    Branch feat/task-051-schema-v2-migrator created from main at e9116da. Recovery
    tag `pre-v2-migration` created at the same commit: `git reset --hard pre-v2-migration`
    undoes the entire migration in one command.


    Jeff asked for extra care here. Safety measures adopted before any code was written:

    1. Recovery tag, tree clean and everything committed first.

    2. The migrator writes to a separate output directory. Nothing overwrites the
    corpus until the output has been verified.

    3. Field accounting is a gate, not a spot check: every v1 field must be mapped
    or on an explicit intentionally-dropped list. An unrecognised field fails the
    run rather than vanishing.

    4. Every converted file must load under models_v2 AND validate against the LinkML
    schema before any swap.

    5. No `git checkout --` on uncommitted work and no `rm -rf`; both bit me earlier
    today.


    CORPUS MEASURED BEFORE DESIGNING THE MAPPING (38 files):

    - issues[] non-empty in 0 files, confirming the design''s claim; migrates to nothing.

    - comments[] non-empty in exactly 1 file, one entry, kind=question.

    - phases[] non-empty in 15, prompts.followups in 7, matching the design''s counts.

    - statuses: completed 18, draft 9, ready 4, waiting_for_human 3, archived 2, in_progress
    1, blocked 1.

    - assigned_to is messy and needs real handling, not a lowercase(): ''Codex'' x14,
    ''claude'' x5, ''TBD'' x2, ''Claude + Codex'' x1. Two of those are not actor ids
    at all.


    FINDING THAT CONTRADICTS THE DESIGN, and the reason this task needed measuring
    first: docs/schema-design.md section 7 justifies deleting prompts.starter on the
    grounds that ''nearly every task''s starter restates its description''. Tested
    by containment over the real corpus: exactly 1 of 38 starters is contained in
    its description. The other 37 carry distinct text -- they are the agent briefings.
    Dropping them as the design anticipates would destroy 37 real documents.


    Decision: preserve every starter except the single true duplicate, appending it
    to spec.description under a heading. The design''s intent (one briefing, not two)
    is honoured because the result is one field; its stated mechanism (drop the starter)
    is not, because the premise does not hold for this corpus. Recording it here rather
    than silently deviating -- and it is worth Jeff knowing the design overestimated
    the redundancy.


    Other edge cases found: the single `blocked` task has no dependencies and no branch,
    so its blockedness is not derivable from anything and the v1 status is the only
    record -- the migrator preserves the original status in a log entry so nothing
    is lost. One waiting_for_human task has no status updates at all, so there is
    no source text for a ball_prompt; those get an explicit needs-review placeholder
    rather than an invented ask. The two archived tasks differ: one was superseded
    by phase-specific tasks, one was rejected as stale, so `outcome` is derived per
    file rather than defaulted.'
  data:
    v1_status: in_progress
- id: 2
  ts: '2026-08-10T20:05:48Z'
  actor: claude
  type: transition
  body: "Migrator complete and verified over all 38 files; the corpus WRITE is deliberately\
    \ not done\n\nThree commits. 328 tests pass (43 new); ruff, mypy and black clean\
    \ across 61 files. The corpus is untouched -- `git status tasks/` is empty.\n\n\
    ## What is done\n\nsc-1 and sc-3 are met. `agentjobs migrate-schema` converts\
    \ v1 to v2 per the section 3/8 mapping, refuses already-v2 files and unknown shapes,\
    \ and is dry-run by default.\n\nVerified over all 38 real files in both directories:\
    \ 38 convert, 38 load under models_v2, 38 validate against the LinkML schema,\
    \ 0 information losses, 18 review notes. Reproduce with:\n  poetry run agentjobs\
    \ migrate-schema --output-dir /tmp/preview --apply\n  poetry run agentjobs migrate-schema\
    \ --tasks-dir tasks/test-data --output-dir /tmp/preview-td --apply\n\n## What\
    \ is NOT done, and why -- read this before approving\n\nsc-2 is PARTIAL. The corpus\
    \ is not written.\n\nv1 storage cannot read v2 files. Writing 38 v2 files while\
    \ storage, manager, the API, every template and the CLI still expect v1 leaves\
    \ the application broken -- not one failing test, the whole thing. So the write\
    \ has to be atomic with the code switchover, and the switchover is task-052's\
    \ content: manager operations and the API surface on v2.\n\nI could have done\
    \ both in this branch. I judged that wrong for two reasons. First, it would make\
    \ this branch roughly 052+053+054 combined, at the end of a long session, in the\
    \ one place where a mistake destroys the project's own memory. Second, Jeff asked\
    \ specifically for care here. Doing the risky irreversible step in a rush to satisfy\
    \ a checkbox is the opposite of that.\n\nRecommended sequencing: task-052 begins\
    \ by running the migrator with --apply as its first commit, then switches the\
    \ code over in the same branch. The migrator is already proven against the real\
    \ data, so that first commit is mechanical and its output is already known.\n\n\
    ## Two real defects this found in task-050's work\n\nBoth were invisible until\
    \ the migrator produced 31 real tasks rather than one example file.\n\n1. models_v2\
    \ and schema/agentjobs-v2.yaml disagreed on required-ness: LinkML required spec.intent\
    \ and spec.description, Pydantic required neither. Task-050's round-trip test\
    \ could not catch it because the single example file fills in every field. Fixed\
    \ by meeting in the middle -- description required in Pydantic, intent optional\
    \ in LinkML -- and, more importantly, by adding a test that compares required-ness\
    \ between the two definitions directly so this class of drift cannot recur.\n\
    2. LinkML required ball_prompt on every open task, contradicting the design's\
    \ explicit exception for agent/available. Rule split so the exception is expressible;\
    \ verified that a ready task passes while a human/review task with no ask still\
    \ fails.\n\n## Deviation from the design, flagged earlier and now implemented\n\
    \nprompts.starter is preserved rather than dropped. Design section 7 justifies\
    \ deleting it on the grounds that starters restate their descriptions; measured\
    \ over the real corpus, exactly 1 of 38 does. The other 37 are distinct briefings.\
    \ They are appended to spec.description under a heading.\n\n## The 18 review notes\n\
    \nNone block the migration; all are places the converter refused to invent something.\n\
    - 9 tasks have no status update to derive a ball_prompt from, so they get an explicit\
    \ NEEDS REVIEW placeholder rather than a fabricated ask.\n- 5 have no human_summary,\
    \ so spec.summary is derived from the first sentence of the description.\n- 2\
    \ had assigned_to: 'TBD', which is not an actor id and is dropped.\n- 1 (task-004)\
    \ was `blocked` while unclaimed with no dependencies, so its blocker was never\
    \ recorded anywhere; mapped to ready with the original status preserved in a log\
    \ entry.\n\n## Safety measures actually used\n\nRecovery tag `pre-v2-migration`\
    \ at e9116da; `git reset --hard pre-v2-migration` undoes everything. Converted\
    \ only into temp directories. Committed the migrator before mutation-testing it,\
    \ which is the discipline I failed twice earlier today. No `git checkout --` on\
    \ uncommitted work and no `rm -rf` this session.\n\nOne test initially failed\
    \ in an instructive way: 'description dropped' was not detected, because the fixture's\
    \ description was short enough to be duplicated wholesale into the derived summary\
    \ -- so the text really was still present and the gate was right. The fixture\
    \ was too degenerate to lose anything. I fixed the fixture, not the gate."
  data:
    v1_status: waiting_for_human
