id: task-051-schema-v2-migrator
title: 'Schema v2: one-shot migrator and corpus migration'
created: '2026-07-29T20:45:00Z'
updated: '2026-07-29T20:45:00Z'
status: draft
priority: high
category: migration
estimated_effort: half day
human_summary: 'Build `agentjobs migrate-schema` (v1 YAML -> v2 per the mapping in
  docs/schema-design.md §3/§8), run it over the whole corpus, and update the corpus
  round-trip test to verify every file in v2 form.'
description: 'Implement the v1 -> v2 converter decided in docs/schema-design.md §8
  (D3) and migrate the repo''s task corpus with it.


  Conversion rules (all specified in docs/schema-design.md):

  - status -> lifecycle/ball/ball_reason/outcome per the §3 mapping table, including
  the split for v1 `blocked` (claimed -> active + external/dependency; unclaimed ->
  ready) and the last-status-update heuristic for `waiting_for_human`.

  - ball_prompt synthesized from the last status update / handoff context where the
  ball lands on a person; flagged for human review where no source text exists.

  - assigned_to -> assignment.eligible (authoring-time values, lowercased) or
  assignment.owner (only where genuinely in_progress).

  - prompts.followups -> instruction log entries (7 files have them); status_updates
  and comments -> the unified log; prompts.starter dropped where it restates the
  description, appended to spec.description where it does not.

  - phases[] -> description appendix (15 files); issues[]/comments are empty corpus-wide
  and migrate to nothing.

  - Nested checklist statuses: in_progress -> pending; others map by name.

  - human_summary -> spec.summary; description -> spec blocks (mechanical split where
  obvious, else everything into spec.description); estimated_effort -> effort;
  external_links -> links; dependency task_id -> task, depends_on -> needs.

  - schema: 2 stamped on every output file.


  Also: update tests/test_task_corpus.py to validate the migrated corpus against the
  v2 model (round-trip + `schema: 2` assertion). See the coordination note in task-050
  about the intermediate red state between 050 and 051.


  **Gated:** requires task-050 (the v2 model) merged or on the shared branch.'
phases: []
