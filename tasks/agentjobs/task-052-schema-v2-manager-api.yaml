- id: 5
  ts: '2026-08-10T22:00:21.792848Z'
  actor: claude
  type: decision
  body: 'Decisions taken while porting, recorded because the diff does not explain
    them.


    - **`display_status` is a Pydantic computed field.** It is served by the API and
    used by every template (sc-6), excluded by storage on write, and rejected as an
    input key by `extra="forbid"`. Rejected: leaving it a plain property, which would
    have meant each surface deriving its own label -- the drift the design doc forbids.

    - **`storage.mutate_task` re-validates the model before writing.** Attribute assignment
    does not re-run Pydantic validators, so without this the manager verbs could write
    a task violating the five consistency rules. One check at the end of the mutation
    rather than `validate_assignment`, which would trip on the intermediate state
    of every multi-field transition.

    - **`replace_task` and `PUT /tasks/{id}` were deleted.** A wholesale replace can
    rewrite the append-only log, which is the one thing v2 guarantees it cannot. PATCH
    covers content edits and deliberately excludes the state axes; the axes move only
    through claim/handoff/release/close.

    - **Webhook events are the v2 set only**: `task.handoff`, `task.question`, `task.closed`.
    `task.status_changed` and `task.completed` no longer fire, because nothing computes
    a v1 status to change.

    - **`Webhook`/`WebhookStorage` moved to `webhooks.py`** in their own earlier commit.
    They lived in models.py/storage.py, are unrelated to the task schema, and had
    to survive v1''s deletion.

    - **Taxonomy and dependency validation against config was NOT built.** The old
    design-doc sketch for this task listed it; the rewritten task description does
    not, and no success criterion covers it. Flagging rather than silently importing
    scope.'
