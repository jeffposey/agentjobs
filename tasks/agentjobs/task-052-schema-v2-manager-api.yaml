prompts:
  starter: '## Objective

    Migrate the task corpus to schema v2 and switch the application over to it. Delete
    schema v1.


    ## Read first, in this order

    1. This task''s description in full. It is written as a cold-start handoff and
    contains the sequence, the decisions not to relitigate, and the gotchas.

    2. `docs/task-schema.md` -- both schema versions documented side by side. This is
    the field map you will work from.

    3. `docs/schema-design.md` sections 3, 4 and 8 -- the state model, the unified log,
    and the version stamp. Sections 7 and 11 record rejected alternatives; do not
    reopen them.

    4. `src/agentjobs/models_v2.py` -- the target model, including the five consistency
    rules it enforces.

    5. `src/agentjobs/migrate_schema.py` -- the converter you will run.


    ## First actions

    - Verify: `git status` clean, `poetry run pytest` green, `git tag -l
    pre-v2-migration` prints the tag.

    - Preview the migration into a temp directory and read some output before writing
    anything. The exact commands are in the description.

    - Create branch `feat/task-052-schema-v2-switchover` from main, record it in
    branches[], mark this task in_progress -- in that order.


    ## The one rule that matters most

    The corpus write and the code switchover must be a single commit with green tests.
    There is no intermediate state where the application works. Everything else can and
    should be separate commits before and after it.


    ## If something goes wrong

    `git reset --hard pre-v2-migration` restores the last state where every task file is
    v1. The tag exists for exactly this. Do not delete it until this task is merged.


    ## Git workflow

    Small conventional commits, tests green before each. When complete: STOP, set
    waiting_for_human through the status API with a summary of what changed and what
    needs review. Do not merge.

    '
  followups: []
status_updates:
- timestamp: '2026-08-10T21:30:00Z'
  author: claude
  status: ready
  summary: Rewritten as a cold-start handoff; every prerequisite is now merged
  details: 'This task was a two-paragraph stub. It has been rewritten as a self-contained
    handoff because the owner intends to run it in a fresh session, possibly with a
    different model or a different tool entirely, and it is the riskiest change in the
    project.


    Everything that made it dangerous was deliberately built first, and all of it is
    merged:


    - task-047 gave the codebase honestly-typed enums and fixed two latent NameError
    bugs, one of which meant every successful webhook delivery had been crashing
    invisibly.

    - task-050 delivered models_v2 alongside v1 rather than replacing it, so v2 could be
    reviewed on its own without breaking the application.

    - task-051 built the migrator with two independent safety gates -- field accounting
    and information-loss verification -- both mutation-tested, and verified it against
    all 38 real files without writing any of them.

    - task-049 made unreadable files raise with filename and field instead of silently
    vanishing from listings. This matters most during exactly this migration.

    - task-055 closed the double-claim race with per-task locking spanning
    read-modify-write, proven by reverting the fix and watching all eight racing agents
    win the same task.


    The recovery tag `pre-v2-migration` marks the last commit where every task file is
    v1.


    Two things the next agent should know that are easy to miss. First, the migrator
    preserves prompts.starter, which contradicts what section 7 of the design doc
    anticipated -- the design assumed starters restate their descriptions, and measured
    over the real corpus only 1 of 38 does. Second, running the migrator over real data
    exposed two genuine drifts between models_v2.py and schema/agentjobs-v2.yaml that
    the unit tests could not see, because the single example file fills in every field;
    both are fixed and a test now compares the two definitions directly.'
