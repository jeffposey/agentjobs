  actor: claude
  type: progress
  body: 'Corpus migrated and application switched to v2; pausing mid-task


    State at pause, on branch feat/task-052-schema-v2-switchover:


    - Commit 402e763: Webhook + WebhookStorage moved into webhooks.py so they survive
    models.py''s deletion.

    - Commit 415c910 (the atomic commit): both corpora migrated in place (32 + 7 files,
    all stamped ''schema: 2''), storage/manager/API/templates/CLI/client/sample-data/md-import/examples
    ported to models_v2. 380 tests pass; ruff, mypy and black clean.


    Decisions made while porting:

    - display_status is a pydantic computed field: served by the API (sc-6), excluded
    by storage on write, rejected as an input key. Three tests in test_models_v2.py
    were updated accordingly.

    - storage.mutate_task re-validates the mutated model before writing, because attribute
    assignment bypasses the model validators; this is what enforces the consistency
    rules on the verb path.

    - manager.replace_task and the PUT endpoint were dropped: a wholesale replace
    could rewrite the append-only log. PATCH excludes the state axes; they move only
    through claim/handoff/release/close.

    - Webhook events are the v2 set only (task.handoff, task.question, task.closed);
    task.status_changed no longer fires.

    - Taxonomy/dependency validation against config (old design-doc scope) was NOT
    implemented; the rewritten task spec does not require it.


    Remaining before handoff to review:

    1. Delete models.py plus tests/test_models.py and the Comment half of tests/test_model_timestamps.py,
    as its own commit (nothing else imports them; verified).

    2. Update docs/task-schema.md (retire the v1 half) and check README references.

    3. Browser verification per the task: dashboard, task list, task detail, project
    switcher, a status change through the API, GET /api/tasks/broken returns [], against
    two registered projects if any (agentjobs project list).

    4. Handoff: v2 equivalent of waiting_for_human = handoff to human/review through
    the status API. Do not merge; pre-v2-migration tag stays until merged.'
