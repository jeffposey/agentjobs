- id: 9
  ts: '2026-08-10T22:46:49.408534Z'
  actor: claude
  type: decision
  body: '**Save-time validation of `dependencies[].task` is deferred; claim-time blocking
    is implemented instead.** Recorded here rather than in a docstring, as the review
    asked.


    The review offered two options. I took the second, and this is why.


    *Save-time validation, as schema-design.md issue 2 specifies, has an ordering
    problem the design doc does not address.* Writing a task that references one not
    yet created is normal and useful -- planning a chain top-down means task 050 names
    051 before 051 exists. Task-051''s migrator writes 39 files in one pass, and validating
    each against a store that is mid-write means the result depends on filename order.
    Any bulk import has the same shape. Doing it properly needs a two-pass write or
    a deferred-check mode, which is a real piece of design work.


    *Claim-time blocking gives the property that actually matters* -- a dependency
    that cannot be evaluated is never silently treated as satisfied -- with no ordering
    constraint, because by claim time the whole store is readable. The gate now distinguishes
    three cases and names which: still open, not a task in this project, and file
    present but unreadable. That last one is new: a dependency whose file is corrupt
    is no longer evidence that it is done.


    *Rejected: blocking silently, or logging a warning.* Both reproduce the original
    defect in a quieter form. The refusal names the id and the reason, so a typo is
