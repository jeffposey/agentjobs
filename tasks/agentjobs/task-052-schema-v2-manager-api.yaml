id: task-052-schema-v2-manager-api
title: 'Schema v2: manager operations and API surface (claim/handoff/log/release/close)'
created: '2026-07-29T20:45:00Z'
updated: '2026-07-29T20:45:00Z'
status: draft
priority: high
category: infrastructure
estimated_effort: 1-2 days
human_summary: 'Make the v2 state machine operational: manager methods and API endpoints
  for claim, handoff, log, release, and close; the inbox and next queries; taxonomy
  and dependency validation at save; and the typed webhook events (task.handoff,
  task.question, task.closed).'
description: 'Implement the canonical loop and API surface from docs/schema-design.md
  §5 on top of the v2 model.


  Scope:

  - Manager operations: claim (ready -> active, sets owner, ball agent/work), handoff
  (moves ball + ball_reason + required ball_prompt), log append (note/progress/decision/
  question/answer/instruction), release (active -> ready, clears owner), close (outcome
  + final entry). Every state change appends a manager-authored transition log entry --
  callers never write transitions themselves (§3 consistency rule 5).

  - Claimability: ready + eligible + no open children + no unmet `needs` dependencies
  (§3 boundary case, §5 /next row).

  - API: GET /api/tasks?ball=human (the human inbox, ball_prompt as line item),
  ?ball=external, GET /api/tasks/next?agent=..., POST claim/handoff/log/release/close
  per the §5 table. display_status served read-only.

  - Validation at save (§11 D2): category/tags/actor ids against the config vocabulary;
  dependencies[].task must exist in the store; links[].url really validated.

  - Config: the vocabulary authority for categories, tags, and actor ids lives in
  project config; document its format.

  - Webhooks: replace/extend task.status_changed with typed events task.handoff (payload
  carries ball holder + ball_prompt), task.question, task.closed (§5 notifications).

  - Tests throughout: state transitions, rejection of vocabulary violations, inbox/next
  query semantics, webhook payloads.


  **Gated:** requires task-051 (migrated corpus) merged.'
