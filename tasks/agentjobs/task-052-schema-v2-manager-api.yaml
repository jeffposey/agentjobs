  body: 'Rewritten as a cold-start handoff; every prerequisite is now merged


    This task was a two-paragraph stub. It has been rewritten as a self-contained
    handoff because the owner intends to run it in a fresh session, possibly with
    a different model or a different tool entirely, and it is the riskiest change
    in the project.


    Everything that made it dangerous was deliberately built first, and all of it
    is merged:


    - task-047 gave the codebase honestly-typed enums and fixed two latent NameError
    bugs, one of which meant every successful webhook delivery had been crashing invisibly.

    - task-050 delivered models_v2 alongside v1 rather than replacing it, so v2 could
    be reviewed on its own without breaking the application.

    - task-051 built the migrator with two independent safety gates -- field accounting
    and information-loss verification -- both mutation-tested, and verified it against
    all 38 real files without writing any of them.

    - task-049 made unreadable files raise with filename and field instead of silently
    vanishing from listings. This matters most during exactly this migration.

    - task-055 closed the double-claim race with per-task locking spanning read-modify-write,
    proven by reverting the fix and watching all eight racing agents win the same
    task.


    The recovery tag `pre-v2-migration` marks the last commit where every task file
    is v1.


    Two things the next agent should know that are easy to miss. First, the migrator
    preserves prompts.starter, which contradicts what section 7 of the design doc
    anticipated -- the design assumed starters restate their descriptions, and measured
    over the real corpus only 1 of 38 does. Second, running the migrator over real
    data exposed two genuine drifts between models_v2.py and schema/agentjobs-v2.yaml
    that the unit tests could not see, because the single example file fills in every
    field; both are fixed and a test now compares the two definitions directly.'
  data:
    v1_status: ready
