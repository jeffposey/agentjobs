spec:
  summary: 'The switchover. Run the proven migrator over all 38 task files, repoint
    storage, the manager, the API, the templates and the CLI at models_v2, and delete
    v1. There is no intermediate state where the application works, so the corpus
    write and the code change land in one commit. Everything risky about this was
    de-risked first: the migrator is verified against the real corpus, there is a
    recovery tag, broken files now fail loudly, and writes are locked. Written as
    a cold-start handoff -- it assumes no knowledge of the session that produced it.'
  description: 'This is the largest and most consequential task in the backlog. Read
    all of it before starting. It is written for an agent with no memory of the sessions
    that produced tasks 047-055.


    ## Where things stand right now


    - Every task file on disk is **schema v1**. Nothing has been migrated.

    - `src/agentjobs/models.py` is v1 and runs the whole application.

    - `src/agentjobs/models_v2.py` exists, is complete, is tested, and is **wired
    to nothing**.

    - `src/agentjobs/migrate_schema.py` converts v1 to v2 and has been run over the
    real corpus in dry-run: 38 convert, 38 load, 38 validate against the LinkML schema,
    0 information losses.

    - 354 tests pass. `ruff`, `mypy` and `black` are clean. Keep them that way.


    ## Why this cannot be split


    v1 storage cannot read v2 files, and v2 models cannot read v1 files. The moment
    the corpus is written as v2, every part of the application that still expects
    v1 breaks: 26 modules import the models and there are roughly 180 references to
    fields v2 deletes. So the corpus write and the code switchover are **one commit**.
    Splitting them leaves `main` broken, which the project''s own standards forbid.


    Within that constraint, keep the branch reviewable by landing preparation as separate
    earlier commits (see the order below).


    ## Do this in order


    **1. Confirm the starting state.** `git status` clean, `poetry run pytest` green,
    and `git tag -l pre-v2-migration` prints the tag. That tag marks the last commit
    where every task file is v1; `git reset --hard pre-v2-migration` undoes the entire
    migration. Do not delete it until this task is merged and verified.


    **2. Look at what the migration will produce, before producing it.**

    ```

    poetry run agentjobs migrate-schema --output-dir /tmp/preview --apply

    poetry run agentjobs migrate-schema --tasks-dir tasks/test-data --output-dir /tmp/preview-td
    --apply

    ```

    These write to temp directories and leave the corpus alone. Read a few of the
    outputs. The command prints 18 review notes; they are informational, not blockers,
    and are explained under "The review notes" below.


    **3. Port the code to v2 while the corpus is still v1.** Everything except the
    parts that must change atomically can be written and reviewed first. Storage is
    the seam: give it a v2 loader path and keep the v1 one until step 4.


    **4. The atomic commit.** Run the migrator with `--apply` against both real directories,
    switch storage/manager/API/templates/CLI to models_v2, update the corpus test,
    and commit it all together. Tests must be green in this commit.


    **5. Delete `models.py`** once nothing imports it, as its own commit. Keeping
    it one commit later makes step 4''s diff smaller and the deletion trivially revertible.


    ## What has to change


    Modules importing the models (all need review, most are mechanical):


    `src/agentjobs/storage.py`, `manager.py`, `cli.py`, `client.py`, `webhooks.py`,
    `test_data/sample_tasks.py`, `__init__.py`, `migration/converter.py`, `api/models.py`,
    and `api/routes/{tasks,status,prompts,search,web,webhooks,projects}.py`.


    Templates referencing deleted v1 fields: `task_detail.html`, `task_list.html`,
    `dashboard.html`, `components/status_badge.html`, `components/task_card.html`.


    The v1 to v2 field map is in `docs/task-schema.md`, which documents both versions
    side by side. The reasoning is in `docs/schema-design.md`.


    ## Decisions already made -- do not relitigate


    These were argued and settled. Re-opening them wastes a session.


    - **`status` becomes four fields**: `lifecycle`, `ball`, `ball_reason`, `outcome`,
    plus `archived` as a separate flag. See `docs/schema-design.md` section 3.

    - **`display_status` is computed, never stored.** It already exists as a property
    on the v2 Task. The GUI and API should use it instead of switching on status.

    - **`prompts.starter` is preserved**, not dropped, contrary to what section 7
    of the design doc anticipated. Measured over the real corpus, only 1 of 38 starters
    restates its description; the other 37 are distinct briefings. The migrator appends
    them to `spec.description`.

    - **`spec.intent` is optional; `spec.summary` and `spec.description` are required.**

    - **`ball_prompt` is required whenever `ball` is set, except for `agent/available`.**

    - **Files, not a database.** Rejected at length in design doc section 7.


    ## Gotchas that cost time to find


    - **`schema` shadows a Pydantic BaseModel attribute.** The v2 field is `schema_version`
    in Python with `alias="schema"`. Always dump with `by_alias=True`, or files will
    be written with the wrong key.

    - **The models and the LinkML schema can drift.** `tests/test_models_v2.py` has
    a test comparing required-ness between `models_v2.py` and `schema/agentjobs-v2.yaml`
    directly. If you change one, change the other; that test will tell you.

    - **`storage.mutate_task` must survive the rewrite.** Task-055 closed a real double-claim
    race by holding a per-task lock across read-modify-write. Reverting storage to
    load/save while porting to v2 silently reintroduces it. The race test in `tests/test_concurrency.py`
    will catch it.

    - **Unreadable files must stay loud.** Task-049 made `load_task` raise `TaskLoadError`
    rather than returning None. When storage moves to v2, a file with no `schema:
    2` stamp raises `SchemaVersionError` -- wrap that in `TaskLoadError` so a stray
    unmigrated file is reported by filename instead of crashing the listing.

    - **Lock files sit beside task files.** `*.lock` must not be globbed as tasks.

    - **The GUI is project-scoped.** URLs are `/p/{project_id}/...`; every link is
    built from a `base` context variable. Task ids are unique only *within* a project.

    - **`poetry -C <dir> run` changes the working directory**, which silently made
    an earlier session initialise the wrong project. Use the venv python directly
    when cwd matters.


    ## The review notes the migrator emits


    18 notes across the corpus, none of them blockers. They are places the converter
    declined to invent data:

    - 9 tasks have no status update to derive a `ball_prompt` from and get an explicit
    `NEEDS REVIEW:` placeholder. A human can improve them later; a fabricated ask
    would have been worse.

    - 5 have no `human_summary`, so `spec.summary` is derived from the first sentence
    of the description.

    - 2 had `assigned_to: TBD`, which is not an actor id, and it is dropped.

    - 1 (`task-004`, in test-data) was `blocked` while unclaimed with no dependencies,
    so its blocker was never recorded anywhere. It maps to `ready` and the original
    status is preserved in a log entry.


    ## Verification before handing off


    - `poetry run pytest` green; `ruff`, `mypy`, `black` clean.

    - Every task file starts with `schema: 2` and loads under `models_v2`.

    - Start the server and exercise it in a browser, not only through tests: the dashboard,
    the task list, a task detail page, the project switcher, and a status change through
    the API. Verify against **two** registered projects if any are registered (`agentjobs
    project list`).

    - Confirm no file in `tasks/` fails to load: `GET /api/tasks/broken` must return
    `[]`.


    ## Out of scope


    - CLI command surface for the v2 verbs (`inbox`, `claim`, `handoff`) -- task-053.

    - The v2 GUI redesign: inbox view, log rendering, editing affordances -- task-054.

    - The hierarchical task tree and anything about `parent` behaviour -- task-058
    and task-045.

    - Config-driven acceptance criterion types (D5) -- deliberately deferred, additive.


    ---


    ## Starter prompt (migrated from schema v1)


    ## Objective

    Migrate the task corpus to schema v2 and switch the application over to it. Delete
    schema v1.


    ## Read first, in this order

    1. This task''s description in full. It is written as a cold-start handoff and
    contains the sequence, the decisions not to relitigate, and the gotchas.

    2. `docs/task-schema.md` -- both schema versions documented side by side. This
    is the field map you will work from.

    3. `docs/schema-design.md` sections 3, 4 and 8 -- the state model, the unified
    log, and the version stamp. Sections 7 and 11 record rejected alternatives; do
    not reopen them.

    4. `src/agentjobs/models_v2.py` -- the target model, including the five consistency
    rules it enforces.

    5. `src/agentjobs/migrate_schema.py` -- the converter you will run.


    ## First actions

    - Verify: `git status` clean, `poetry run pytest` green, `git tag -l pre-v2-migration`
    prints the tag.

    - Preview the migration into a temp directory and read some output before writing
    anything. The exact commands are in the description.

    - Create branch `feat/task-052-schema-v2-switchover` from main, record it in branches[],
    mark this task in_progress -- in that order.


    ## The one rule that matters most

    The corpus write and the code switchover must be a single commit with green tests.
    There is no intermediate state where the application works. Everything else can
    and should be separate commits before and after it.


    ## If something goes wrong

    `git reset --hard pre-v2-migration` restores the last state where every task file
    is v1. The tag exists for exactly this. Do not delete it until this task is merged.


    ## Git workflow

    Small conventional commits, tests green before each. When complete: STOP, set
    waiting_for_human through the status API with a summary of what changed and what
    needs review. Do not merge.'
