human_summary: 'Mirror the v2 API surface in the Typer CLI: agentjobs inbox / next /
  claim / handoff / log / close, rendering display_status and ball_prompt so the
  handoff loop is fully drivable from a terminal.'
description: 'Expose the v2 loop through the CLI, mirroring the API surface from
  docs/schema-design.md §5:


  - `agentjobs inbox` -- open tasks with ball=human, one row per task with its
  ball_prompt (the human side of the loop).

  - `agentjobs next [--agent NAME]` -- what an agent should claim.

  - `agentjobs claim / handoff / log / close / release` -- the mutation verbs, with
  the same required arguments as the API (handoff demands ball, ball_reason, and
  ball_prompt).

  - Listings render the computed display_status; broken files are reported per
  task-049''s behavior.

  - Tests for each command (typer CliRunner).


  **Gated:** requires task-052 merged.'
