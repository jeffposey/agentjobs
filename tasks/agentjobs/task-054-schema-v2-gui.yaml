- id: 2
  ts: '2026-08-11T05:56:28.260249Z'
  actor: claude
  type: decision
  body: 'Narrowed and promoted draft -> ready in a backlog grooming pass, 2026-08-11.


    Like task-046 and task-053 it was parked at ball: human / ball_reason: spec on
    the schema-v1 migrator''s generic ''NEEDS REVIEW'' prompt, not on any real question,
    and its `needs` gate on task-052 closed when v2 merged on 2026-08-10.


    Unlike those two it could not simply be promoted, because part of it had already
    been built under other ids. Task-059 and task-064 rewrote the task detail page
    onto v2 while this task sat in draft. So sc-2 -- task detail renders spec, log
    and acceptance, with no deleted v1 fields left in the templates -- is met, verified
    by reading task_detail.html and by grepping the template directory for every v2-deleted
    field name (no hits). The remaining scope is the inbox view and the agent-activity
    view, and spec.description now says so in a dated appendix rather than leaving
    a future reader to discover it by rebuilding a page that already exists.


    Rejected alternative: closing this as superseded by task-059 and raising the inbox
    as a new task. The inbox is the reason the ball axis exists -- it is the original
    intent of this task, not an offshoot of it -- and moving it to a new id would
    strand the recorded scope boundary against task-058 and the inherited note from
    task-059 about the review buttons.'
  data: {}
