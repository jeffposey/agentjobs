  body: 'Claimed; last task before the v2 switchover


    Branch fix/task-055-single-writer from main. Sequenced before task-052 so the
    switchover inherits a correct storage implementation rather than porting a racy
    one -- 052 rewrites this layer.


    Plan: a cross-platform advisory lock per task file (O_CREAT|O_EXCL lockfile, no
    new dependency), and a mutate() helper that holds it across the whole read-modify-write.
    The race is not in save_task alone; it is in load -> decide -> save, so the lock
    has to span all three. Regression test drives real concurrent claims from threads
    and asserts exactly one wins.'
- id: 2
  ts: '2026-08-10T20:35:32Z'
  actor: claude
  type: transition
  data:
    v1_status: waiting_for_human
  body: 'Double-claim race closed and proven by mutation; 354 tests pass


    Two commits on fix/task-055-single-writer. 354 tests pass (11 new); ruff, mypy,
    black clean.


    The race was never inside save_task -- it was in the load -> decide -> save sequence
    every caller wrote by hand. TaskStorage.mutate_task now holds a per-task advisory
    lock across all three steps and re-reads inside it. Every mutating manager method
    routes through it. Added manager.claim_task, which checks its precondition inside
    the lock against a fresh read.


    Proof it works, not just that tests pass: reverted claim_task to the old unlocked
    shape and re-ran the 8-thread race. All eight agents won the same task -- the
    exact double-claim bug. With the lock, exactly one wins and seven get a ValueError
    naming the owner. Restored from a file copy rather than git checkout, given what
    that command cost earlier today.


    A second test caught a real gap mid-work: after converting update_status I had
    left add_progress_update doing an unlocked read-modify-write, and concurrent appends
    lost five of six entries. Converted all of them.


    Lock design: O_CREAT|O_EXCL lockfile rather than fcntl/msvcrt. Atomic everywhere
    this runs, no dependency, same behaviour on Windows and Unix. Cost is that a killed
    process leaves a stale lock, so the wait times out with an error saying exactly
    that instead of hanging. Locks are per task, so agents on different tasks never
    contend.


    Note for task-052: it rewrites this layer for v2, so it must carry mutate_task
    forward rather than reverting to load/save. And task-060 (agent dispatch) named
    055 a hard prerequisite -- that is now satisfied.'
