  status: in_progress
  summary: Claimed; last task before the v2 switchover
  details: 'Branch fix/task-055-single-writer from main. Sequenced before task-052
    so the switchover inherits a correct storage implementation rather than porting
    a racy one -- 052 rewrites this layer.


    Plan: a cross-platform advisory lock per task file (O_CREAT|O_EXCL lockfile, no
    new dependency), and a mutate() helper that holds it across the whole read-modify-write.
    The race is not in save_task alone; it is in load -> decide -> save, so the lock
    has to span all three. Regression test drives real concurrent claims from threads
    and asserts exactly one wins.'
