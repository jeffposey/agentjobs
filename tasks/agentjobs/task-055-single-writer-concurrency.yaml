id: task-055-single-writer-concurrency
title: 'Storage: serialize writes so two agents cannot claim the same task'
created: '2026-07-29T22:05:00Z'
updated: '2026-07-29T22:05:00Z'
status: ready
priority: high
category: infrastructure
estimated_effort: 2-3 hours
human_summary: 'TaskStorage.save_task does read-modify-write with no locking and no
  compare-and-swap, so two agents can both read a task as ready and both write it as
  active -- a silent double-claim. Found during the schema design pass (task-048)
  while evaluating whether a database was needed; the fix is to serialize writes
  rather than change storage. The race exists in v1 today and is independent of the
  schema v2 chain.'
description: 'A correctness bug, not a hardening task. `TaskStorage.save_task`
  (src/agentjobs/storage.py) serializes a model to YAML and writes the file with no
  lock and no version check. `load_task` -> mutate -> `save_task` is therefore a
  classic lost-update sequence.


  Two agents running `claim` against the same `ready` task will both observe it as
  claimable and both write themselves in as owner. The second write wins silently;
  the first agent believes it holds a task it does not. Nothing detects this, and
  nothing in the task record shows it happened.


  This matters more under schema v2, which is explicitly designed for multiple
  eligible agents (`assignment.eligible`, `/next?agent=...`, `POST /claim`), but the
  bug is present in v1 and should be fixed there.


  ## Why not a database


  Evaluated and rejected in docs/schema-design.md §7. MongoDB''s atomic findAndModify
  would close this for free, but changing substrate to fix one race forfeits diffable
  task history, git blame, and atomic task-plus-code commits, and adds a service to
  run. Serializing writes is a ~50-line fix. Recorded there so the trade is not
  re-argued.


  ## Scope


  - Advisory file locking around read-modify-write in storage (portalocker, or
  `os.O_EXCL` lockfiles -- must work on Windows, which is the primary dev platform).

  - A compare-and-swap guard: a write should fail if the file changed since it was
  read (`updated` timestamp or content hash), rather than blindly overwriting.

  - Make the manager/API the single writer for state transitions, so the claim path
  in particular is atomic: check claimable and set owner under one lock.

  - Decide and document what a losing writer sees -- a typed conflict error the CLI
  and API can report as "task already claimed by X", not a generic exception.

  - Tests: a concurrent double-claim regression test that fails against today''s
  code. This is the acceptance criterion that matters; the rest is implementation.


  ## Note on hand edits


  Per D2 as amended, direct file editing is an emergency hatch rather than a primary
  interface, so locking does not need to coordinate with a human in an editor. A
  concurrent hand edit that loses should surface as a git conflict or a CAS failure,
  which is the desired behavior either way.'
