    implementation.


    Review the new dependency footprint (Python dev group plus a Node toolchain) and
    decide whether it is warranted for a schema of this size. Then answer the open
    question in the description: should generated artifacts be committed, or regenerated
    in CI with a drift check?


    If approved, this should merge before or with task-048, since task-048 depends
    on it. If rejected, task-048''s design stands on its own but loses its machine-checked
    form.'
