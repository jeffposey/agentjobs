    Approved by Jeff on 2026-08-10 in the same pass as task-048, having been presented
    separately as intended -- the point of splitting this out was that it be reviewed
    on its own merits, and it was.


    What landed (see commits 4e946cf, 8204be9, 0eb0257 on docs/task-048-schema-design):

    - schema/agentjobs-v1.yaml and v2.yaml, the LinkML sources of truth for schema
    shape

    - schema/examples/task-048.v2.yaml, validated against v2

    - scripts/regen-schema-docs.sh, regenerating every derived artifact and failing
    loudly if the corpus or examples stop validating

    - 194 generated files: JSON Schema, mermaid ER sources, full-size SVGs, 168 reference
    pages, models_v2_preview.py

    - mkdocs.yml, docs/index.md, docs/schema/understanding.md


    Decision recorded: the generated artifacts are checked in rather than gitignored,
    so the site builds from a clone and the reference pages are reviewable evidence
    that the schema means what the prose claims. The cost is diff noise on regeneration,
    accepted knowingly.


    Dependencies added to pyproject.toml dev group: linkml, mkdocs, mkdocs-material,
    mkdocs-glightbox. One JS dev dependency (@mermaid-js/mermaid-cli) in package.json,
    used only to pre-render diagrams to SVG -- not a runtime dependency of the Python
    package and not shipped with it.


    Gotcha worth preserving: gen-doc must run with --subfolder-type-separation on
    Windows. Without it, class and slot pages land in one flat directory and names
    differing only by case (Task.md vs task.md) collide on a case-insensitive filesystem,
    silently overwriting each other.


    Outstanding, not fixed here: no .gitattributes, so regen-schema-docs.sh checks
    out with CRLF on a fresh clone and bash fails on it. One-line fix, left unbundled
    from this merge.'
