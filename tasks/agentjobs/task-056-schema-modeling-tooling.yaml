spec:
  summary: 'Model both schema versions in LinkML so the schema can be viewed, validated,
    and diffed with real tooling instead of hand-drawn diagrams and prose. Generates
    JSON Schema, entity diagrams, a browsable docs site, and a Pydantic preview from
    one source. Split out of task-048: the owner needed real modeling tools to evaluate
    the v2 design, which made this instrumentally necessary but not part of the design
    pass itself. Already built; recorded here so it is reviewed on its own merits
    rather than riding in on task-048''s sign-off.'
  description: 'The v2 design could not be fairly reviewed while it existed only as
    prose. The owner asked for real schema modeling tooling and a visual view. That
    work was done inside task-048''s session but is not in task-048''s scope, so it
    is recorded here as its own reviewable change.


    ## What was built


    - `schema/agentjobs-v1.yaml` -- v1 transcribed from src/agentjobs/models.py into
    LinkML, warts documented rather than silently fixed. Verified faithful by validating
    all 32 live task files against it.

    - `schema/agentjobs-v2.yaml` -- the v2 design in machine-readable form, including
    the section 3 consistency rules as declarative LinkML rules.

    - `schema/examples/task-048.v2.yaml` -- task-048 converted to v2 and validated;
    the worked example behind docs/schema/understanding.md.

    - `scripts/regen-schema-docs.sh` -- one command regenerating every derived artifact:
    JSON Schema, mermaid ER diagrams, full-size SVGs, 168 reference pages, a Pydantic
    preview, plus corpus and example validation.

    - `mkdocs.yml` + `docs/index.md` + `docs/schema/understanding.md` -- a browsable
    site covering both versions, with a guided walkthrough for readers new to the
    schema.


    ## New dependencies (the main thing to review)


    - Python dev group: `linkml`, `mkdocs`, `mkdocs-material`, `mkdocs-glightbox`.

    - Node dev tooling: `@mermaid-js/mermaid-cli` via a new `package.json`, used only
    to render diagrams to SVG. `node_modules/` and `site/` added to .gitignore.


    This is a larger footprint than the design pass it supported, which is exactly
    why it should be approved or rejected separately.


    ## Findings worth keeping


    - `gen-doc` needs `--subfolder-type-separation` on Windows. Without it, pages
    whose names differ only by case (Ball.md the enum vs ball.md the slot) collide
    on a case-insensitive filesystem and silently overwrite each other -- eight pages
    vanished with no error.

    - LinkML cannot express a nullable enum: an optional enum slot compiles to a bare
    $ref, so the generated JSON Schema rejects an explicit null while Pydantic will
    accept it. Recorded in docs/schema-design.md section 3; task-050 owes a regression
    test for both spellings.

    - `gen-pydantic` produces working v2 models (507 lines). Checked in as `schema/generated/models_v2_preview.py`
    as evidence the schema is implementable, NOT wired into the package. Whether generated
    models become the real models.py is task-050''s decision.


    ## Open question for review


    Whether generation is a build step (regenerate and commit artifacts) or a check
    (regenerate in CI and fail on drift). Currently the former, by default rather
    than by decision.


    ---


    ## Starter prompt (migrated from schema v1)


    Already built during task-048''s session. What remains is review, not implementation.


    Review the new dependency footprint (Python dev group plus a Node toolchain) and
    decide whether it is warranted for a schema of this size. Then answer the open
    question in the description: should generated artifacts be committed, or regenerated
    in CI with a drift check?


    If approved, this should merge before or with task-048, since task-048 depends
    on it. If rejected, task-048''s design stands on its own but loses its machine-checked
    form.'
