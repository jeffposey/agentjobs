id: task-057-multi-project-registry
title: 'Multi-project: a machine-level registry and project-scoped backend'
created: '2026-08-10T06:14:30Z'
updated: '2026-08-10T06:14:30Z'
status: ready
priority: high
category: infrastructure
estimated_effort: 1-2 working sessions
human_summary: 'AgentJobs is single-project by construction: config is read from the
  current working directory, TaskStorage takes one tasks directory, and the API caches
  exactly one of everything. Using it on a second project means a second server on a
  second port with no shared view. This task adds a machine-level project registry and
  makes the backend project-aware, so one running server can serve every registered
  project. The GUI half is task-058; this task is the foundation under it.'
description: 'The project owner''s goal for AgentJobs is to run **one** frontend and
  work through it on every project on the machine that is complicated enough to benefit.
  Nothing in the current backlog moves toward that, and the code actively prevents it.


  ## What blocks it today


  - `.agentjobs/config.yaml` is resolved relative to the process working directory
  (`api/dependencies.py::_resolve_project_root`, falling back to `Path.cwd()`), so the
  server serves whichever project it happens to have been launched from.

  - `TaskStorage.__init__` takes a single `tasks_dir`. There is no notion of more than
  one.

  - `_get_storage`, `_get_webhook_storage` and `_get_webhook_manager` are all
  `@lru_cache(maxsize=1)`. Even if a second project were resolvable, the cache would
  hand back the first one''s storage.

  - Every API route is mounted at `/api/tasks`, with no project in the path.


  ## Design


  **A registry, not a merged config.** A machine-level file — default
  `~/.agentjobs/projects.yaml`, overridable with `AGENTJOBS_HOME` — maps a short project
  id to that project''s root directory. It holds *only* the mapping. Each project keeps
  owning its own `.agentjobs/config.yaml` exactly as it does now.


  That split matters: a project''s config (categories, agents, tasks_directory) lives in
  that project''s repo, is versioned with it, and travels when the repo is cloned to
  another machine. The registry is machine-local and disposable — it is a list of what
  this laptop happens to have checked out. Merging the two would either put
  machine-specific paths into a versioned file or pull per-project taxonomy out of the
  repo that defines it. Neither is acceptable.


  **Project ids are the new namespace.** Task ids are only unique *within* a project —
  every project will have a `task-001`. Any cross-project surface must therefore key on
  the pair `(project_id, task_id)`. This is the sharp edge of the whole feature and the
  most likely source of subtle bugs; it needs to be true in the API, in the cache keys,
  and in every URL.


  **Routing.** Add project-scoped routes and keep the existing flat ones working:


  - `GET /api/projects` — the registry, with per-project task counts

  - `GET|POST /api/projects/{project_id}/tasks/...` — the full existing task, status,
  prompts, search and webhook surface, scoped

  - `GET /api/tasks/...` — retained, resolving to the **default project** (see below),
  so existing callers, the CLI, and the current GUI keep working unchanged


  The default project is: the project whose root contains the process working directory,
  if one is registered; otherwise the single registered project if there is exactly one;
  otherwise none, and the flat routes return a 409 naming the ambiguity rather than
  guessing.


  **Cross-project reads.** `GET /api/tasks/all` (or `?project=*`) returns tasks from
  every registered project, each carrying its `project_id`. This is what task-058''s
  cross-project inbox is built on. Read-only: writes are always project-scoped, so there
  is exactly one path that mutates a file.


  ## Path safety — now load-bearing


  `TaskStorage._task_path` (storage.py:27-33) joins the task id straight onto the tasks
  directory with no containment check, and accepts any id ending in `.yaml` verbatim.
  Today the blast radius is one project directory. Once one server serves paths drawn
  from a machine-wide registry, that is a much worse shape to leave lying around.


  Required here: resolve the composed path and assert it stays under the project''s tasks
  directory, rejecting anything that does not. Registry lookup must be exact-match
  against known ids, never a path join. This is hardening against a real weakness in our
  own code, not a response to a known exploit — FastAPI does not match `/` in a plain
  path parameter today, so the current route shapes are not obviously reachable.


  ## Sequencing — why this lands before schema v2, and what that costs


  Recorded because it reverses the order implied by docs/schema-design.md §12.


  The v2 chain (050-054) is six sequential tasks, and the tool is not usable on a second
  project at the end of any of them. Multi-project support is almost entirely orthogonal
  to the schema: it touches config resolution, storage construction, dependency caching
  and routing, none of which care what shape a task file has. Doing it first means the
  tool gets used across real projects while v2 is being built, and dogfooding across
  three projects will teach us more about whether the v2 state model is right than
  another design pass would.


  The cost is honest and small: `TaskStorage` and the dependency wiring get touched
  twice, once here and once by task-050. That is cheap. The expensive overlap would be
  the GUI, which is why task-058 is scoped to project navigation only and deliberately
  does not touch task rendering — task-054 rewrites that on v2.


  ## Out of scope


  - Any GUI change. That is task-058.

  - Anything schema v2. This lands on v1 models and must not anticipate them.

  - Authentication, multi-user, or remote projects. The registry describes directories
  on one machine, for one person.

  - Fixing the double-claim race (task-055) or load-error swallowing (task-049), though
  both get more urgent once one server writes to many projects. Note task-049 especially:
  a task that silently vanishes from a listing is harder to notice when the listing spans
  projects.

  '
