  details: 'Branch created from main at c0601b6, recorded in branches[] before this
    transition.


    Context for a zero-context reader: this task was created on 2026-08-10 immediately
    after task-048''s design pass merged, and it deliberately reverses the implementation
    order that docs/schema-design.md section 12 implied. The reasoning is in the description
    under ''Sequencing''. The short version: the v2 chain is six sequential tasks
    at the end of none of which agentjobs is usable on a second project, which is
    the owner''s actual goal for the tool.


    Plan for this session, in order, because the risk is concentrated at the start:

    1. ProjectRegistry with path containment, tested, before any route changes.

    2. Re-key the dependency caches by project id, with a two-project regression test
    written before the change is trusted.

    3. Project-scoped routes; retain the flat ones against a resolved default.

    4. CLI project add/list/remove; init registers.

    5. Verify against two real registered projects, not fixtures.'
- timestamp: '2026-08-10T06:37:58.886035Z'
  author: claude
  status: waiting_for_human
  summary: Multi-project backend complete and verified against two real projects;
    needs review
  details: 'All eight success criteria met. 175 tests pass (39 new). Four commits
    on feat/task-057-multi-project-registry.


    WHAT LANDED

    1fae942 ProjectRegistry + path containment. The registry maps a short id to a
    project root and is the only place an id becomes a path, which is what makes containment
    enforceable in one place. It holds nothing but the mapping -- each project keeps
    owning its .agentjobs/config.yaml, because that config is versioned with the project
    and travels when the repo is cloned.

    844fc71 Per-project API. The lru_cache(maxsize=1) niladic caches were the concrete
    reason agentjobs was single-project; they are now keyed by (project_id, resolved_path).
    Each task-facing router is mounted twice, unscoped at /api and again at /api/projects/{project_id},
    with one dependency reading project_id from the request path. One set of handlers,
    two prefixes, no drift.

    79837c7 CLI project add/list/remove; init registers.


    DELIBERATE DEVIATIONS FROM THE SPEC AS WRITTEN

    - sc-6 specified GET /api/tasks/all. Implemented as GET /api/all/tasks instead:
    /api/tasks/all is indistinguishable from a task whose id is literally ''all''
    and would shadow it. Noted on the criterion.

    - The design mentioned an implicit single-project mode only in passing. It is
    now explicit: when nothing is registered, or AGENTJOBS_TASKS_DIR/AGENTJOBS_PROJECT_ROOT
    pin a directory, the server serves one implicit project with id ''.''. That id
    is not a legal registry id, so it cannot collide. This exists so the rest of the
    code has one shape to handle rather than two.


    VERIFICATION -- against two real projects, not fixtures

    Registered this repo as ''agentjobs'' and a temp directory as ''sandbox-project'',
    ran ONE server, and confirmed: /api/projects lists both with correct task counts
    (28 and 1); scoped reads return each project''s own tasks; a status write to sandbox-project/task-001
    landed there and left this repo''s tree completely clean; /api/all/tasks returns
    ready tasks from both, each tagged with its project; an unknown project 404s naming
    what is registered.


    The sandbox project is left registered so the next session can see multi-project
    working without setting it up again. Remove with: agentjobs project remove sandbox-project.


    BUGS I INTRODUCED AND FIXED DURING THIS SESSION -- recorded because they are the
    interesting part

    1. init started writing the REAL ~/.agentjobs/projects.yaml during the test suite,
    and did: a pytest tmp path ended up in my actual home registry. Fixed by tests/conftest.py,
    an autouse fixture pinning AGENTJOBS_HOME to a temp dir for every test. Autouse
    deliberately: the cost of forgetting is silent state pollution outside the repo
    rather than a red test.

    2. The regression tests for the cache all passed on first run, which was suspicious.
    Mutation-tested them by reintroducing an unkeyed cache; they went red. A regression
    test that cannot fail is theatre.


    MISTAKES I MADE IN VERIFICATION, FULLY REVERTED

    Running ''poetry -C c:/projects/agentjobs run agentjobs init'' from a sandbox
    directory: -C changes poetry''s working directory, so init overwrote THIS repo''s
    .agentjobs/config.yaml with sandbox defaults and created a stray tasks/task-001.yaml.
    While cleaning that up I then ran ''rm -rf prompts/'' and deleted 12 tracked prompt
    files. All of it was restored from git (git checkout -- .agentjobs/config.yaml
    prompts/ .gitignore); the tree was verified clean before continuing and nothing
    was lost. Redone correctly using the venv python directly so cwd is respected.


    FINDINGS FOR OTHER TASKS -- not fixed here, deliberately out of scope

    - ''agentjobs init'' in a directory that ALREADY has a config silently overwrites
    it with defaults, no prompt, no backup. That is a real footgun independent of
    my poetry mistake above, and it is how I lost this repo''s config for a few minutes.
    Worth its own task.

    - API filter parameters are inconsistent: the existing list route takes ?status_filter=
    and ?priority_filter=, while the new /api/all/tasks takes ?status= and ?project=.
    I kept the clean names on the new endpoint rather than propagating the wart, but
    task-058''s GUI must not assume they match. Renaming the old ones is a breaking
    API change and belongs in its own task.

    - Pre-existing lint/type debt left untouched per task-047: unused Comment import
    in storage.py, F541 in the migrate command, missing PyYAML stubs.

    - task-049 (loud load errors) and task-055 (double-claim race) both get MORE urgent
    now that one server writes to many projects. Neither was touched.


    WHAT NEEDS REVIEW

    The two design decisions worth arguing about: (a) registry-as-pure-mapping with
    per-project config staying in each repo, and (b) mounting each router twice rather
    than duplicating handlers. Both are in the description and the commit messages.


    NEXT: task-058 (GUI switcher, scoped URLs, cross-project view) is unblocked once
    this merges. Do not merge without explicit approval.'
