success_criteria:
- id: sc-1
  description: A registry at ~/.agentjobs/projects.yaml (AGENTJOBS_HOME-overridable) maps
    project ids to roots, with a ProjectRegistry abstraction that is the only thing which
    resolves an id to a path
  status: pending
- id: sc-2
  description: 'CLI: agentjobs project add/list/remove works, and agentjobs init registers
    the project it initialises'
  status: pending
- id: sc-3
  description: One server serves two registered projects simultaneously; GET /api/projects
    lists both, and each project''s tasks are reachable and writable under
    /api/projects/{id}/tasks without cross-contamination
  status: pending
- id: sc-4
  description: The per-project caches are keyed by project id; a request for project B
    never returns project A's storage. Regression test with two projects registered
  status: pending
- id: sc-5
  description: Existing flat /api/tasks routes still work against the default project,
    and return a 409 naming the ambiguity when no default can be resolved rather than
    silently picking one
  status: pending
- id: sc-6
  description: GET /api/tasks/all returns tasks from every registered project, each
    tagged with its project_id
  status: pending
- id: sc-7
  description: 'Path containment enforced: a task id that escapes the project tasks
    directory is rejected, with a test covering traversal attempts and the .yaml-suffix
    branch'
  status: pending
- id: sc-8
  description: poetry run pytest passes, and the existing single-project workflow in this
    repo is verified working unchanged (serve, list, show, status update)
  status: pending
prompts:
  starter: '## Objective

    Make one AgentJobs server able to serve every project registered on the machine.
    Backend only — the GUI is task-058.


    ## Read first

    - src/agentjobs/api/dependencies.py — the whole problem is here: cwd-relative config
    resolution and three lru_cache(maxsize=1) singletons.

    - src/agentjobs/storage.py — TaskStorage takes one dir; _task_path has no containment
    check.

    - src/agentjobs/cli.py — config load/save and the base_dir convention.

    - .agentjobs/config.yaml — what stays per-project.

    - This task''s description — the registry-vs-config split and the (project_id,
    task_id) namespacing are the two decisions not to relitigate.


    ## Steps

    1. Create branch feat/task-057-multi-project-registry from main. Record it in
    branches[] and mark this task in_progress, in that order.

    2. ProjectRegistry first, with tests, before touching any route. It is the only thing
    that turns an id into a path, and path containment is enforced at that boundary.

    3. Re-key the dependency caches by project id. This is where a subtle bug will hide —
    write the two-project regression test before you trust it.

    4. Add the project-scoped routes; keep the flat ones working against a resolved
    default.

    5. CLI: project add/list/remove, and wire init to register.

    6. Verify with two real projects, not fixtures: register this repo and one other
    directory, run one server, and exercise both through the API.


    ## Do not

    - Touch the GUI templates. That is task-058.

    - Anticipate schema v2 in any way. This lands on v1.

    - Widen scope into task-049 or task-055 even though both become more urgent here.
    Note them in a status update instead.


    ## Git workflow

    Small single-logical-change commits, Conventional Commits. Tests green before each.
    When complete: STOP, set waiting_for_human through the status API with a summary of
    what was done and what needs review. Do not merge.

    '
