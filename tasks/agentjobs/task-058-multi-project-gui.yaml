    cross-project `/all` view which it called "the point" of the feature. That is now
    removed. The reasoning is in the description: when you are working you are in one
    project, and multi-project means any project reachable from one server rather than
    all projects on one screen.


    This blocks the task on schema v2. v1''s Task model has no parent field and no
    subtask concept, so a hierarchy is not representable; phases[] is sub-units inside a
    single task and v2 deletes it. An interim additive parent field on v1 was proposed
    -- cheap, and explicitly sanctioned by the evolution policy in docs/schema-design.md
    section 9 -- and the owner rejected it in favour of doing the full v2 schema
    properly. Dependency moved from task-057 to task-052 accordingly.


    Also recorded: the /api/all/tasks endpoint built in task-057 is now unused by the
    GUI. Kept rather than deleted (30 lines, read-only, tested); delete it if it is
    still unused when the React frontend lands.


    A scope boundary against task-054 was added, because both tasks now touch the v2
    GUI: this task owns the shell (switcher, scoped URLs, tree), 054 owns task contents
    and editing. Their one genuine overlap -- 054 wants a ball=human inbox as the home
    view, this task wants the project tree -- is flagged in both files for whoever lands
    second.'
