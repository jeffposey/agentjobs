prompts:
  starter: '## Objective

    Build the GUI shell: pick one project, see its tasks as an expandable hierarchy.
    Navigation and scoping only -- task-054 owns how a task renders.


    ## Read first

    - This task''s description. Two decisions in it are settled and must not be
    relitigated: no merged all-projects view, and no interim parent field on v1.

    - src/agentjobs/api/routes/web.py and the templates -- the current unscoped routes.

    - src/agentjobs/projects.py and api/dependencies.py -- task-057''s registry and the
    request_project dependency, which already resolves project_id from the path.

    - docs/schema-design.md section 2, for what `parent` actually is.


    ## Steps

    1. Confirm task-052 has landed, so v2 parent and its queries exist. If not, stop --
    this task is not startable.

    2. Create branch feat/task-058-multi-project-gui from main, record it in branches[],
    mark in_progress, in that order.

    3. Switcher and scoped URLs first, then the tree.

    4. Verify in a browser with two projects registered that share a task id.


    ## Do not

    - Build a merged cross-project view. The owner rejected it explicitly.

    - Add an interim parent field to v1. Also explicitly rejected.

    - Rewrite task detail rendering. Task-054.


    ## Git workflow

    Small single-logical-change commits, Conventional Commits. Tests green before each.
    When complete: STOP, set waiting_for_human through the status API with evidence of
    the tree and switcher working. Do not merge.

    '
  followups: []
