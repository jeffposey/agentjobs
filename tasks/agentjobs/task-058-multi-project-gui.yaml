spec:
  summary: 'The shell the owner will actually work in: pick one project, then see
    that project''s tasks as a hierarchy you can expand to reveal subtasks. Redesigned
    2026-08-10 -- the original version was built around a cross-project view showing
    every project''s tasks at once, and the owner rejected that shape: one project
    is selected at a time. Now blocked on schema v2, because a task hierarchy needs
    the parent field and v1 has no way to express one.'
  description: "The shell of the GUI: which project you are looking at, and how you\
    \ move around inside it. Task-054 owns what a task itself looks like; this task\
    \ owns everything around it.\n\n## The design, as specified by the owner on 2026-08-10\n\
    \n- **A project switcher.** One project is selected at a time. Switching is explicit.\
    \ **Split out into task-061 on 2026-08-10** -- it needs only task-057's registry\
    \ and scoped API, not schema v2, so gating it here was an error that delayed a\
    \ buildable feature behind four tasks. This task keeps the hierarchy.\n- **A hierarchical\
    \ task list** for the selected project, expandable to reveal subtasks.\n- **Not\
    \ a merged view.** You do not see every project's tasks at once. This is a direct\
    \ reversal of the original design and the reason this file was rewritten.\n\n\
    The reasoning behind the reversal, recorded so it is not undone later: when you\
    \ are working, you are in one project. A merged list optimises for surveying a\
    \ portfolio, which is not the job. Multi-project means *any* project reachable\
    \ from one server, not *all* projects on one screen.\n\nConsequence worth noting:\
    \ `GET /api/all/tasks`, built in task-057 as the intended centerpiece of this\
    \ task, is now unused by the GUI. It is ~30 lines, read-only and tested, so it\
    \ is being kept rather than deleted -- if a \"waiting on me everywhere\" screen\
    \ is ever wanted it is already there. If it is still unused when the React frontend\
    \ lands, delete it then.\n\n## Why this is blocked on schema v2\n\n**v1 cannot\
    \ represent a hierarchy.** `Task` in src/agentjobs/models.py has no `parent` and\
    \ no `children`. The nearest thing is `phases[]`, which is sub-units *inside*\
    \ one task, and v2 deletes it. There is no subtask concept in v1 at all.\n\nAn\
    \ interim additive `parent` field on v1 was proposed and **rejected by the owner\
    \ on 2026-08-10** in favour of doing the full v2 schema properly. Recorded because\
    \ the option is cheap and obvious enough that someone will re-propose it: the\
    \ answer is no, wait for v2.\n\nSo the dependency chain to this task is task-047\
    \ \u2192 050 \u2192 051 \u2192 052. `parent` arrives with the v2 models in task-050,\
    \ and the queries this GUI needs (children of a task, umbrella non-claimability)\
    \ arrive with task-052 and task-045.\n\n## Scope boundary against task-054\n\n\
    Both tasks touch the GUI on v2, and they must not both rewrite the same thing.\n\
    \n- **This task: the shell.** Project switcher, project-scoped URLs, the task\
    \ list as a tree, navigation between them.\n- **Task-054: the contents.** How\
    \ a single task renders -- spec blocks, the unified log, acceptance -- and the\
    \ editing affordances that make the GUI the primary human editing surface.\n\n\
    Where they meet: task-054's description makes a `ball=human` inbox the primary\
    \ home view, while this task makes the project tree the primary list. Both can\
    \ coexist on a project home -- an inbox section above the tree -- but whoever\
    \ lands second should confirm the shape with the owner rather than quietly overriding\
    \ the other.\n\n## URLs\n\n- `/p/{project_id}/` -- project home\n- `/p/{project_id}/tasks`\
    \ -- the hierarchical tree\n- `/p/{project_id}/tasks/{task_id}` -- detail (rendered\
    \ by task-054's work)\n- Legacy unscoped URLs redirect to the default project\
    \ rather than 404ing\n\n## The bug this design invites\n\nTask ids are only unique\
    \ *within* a project -- every project will have a `task-001`. Every link must\
    \ carry its project id. A link to `/tasks/task-001` instead of `/p/{project}/tasks/task-001`\
    \ silently opens a different project's task. Test it specifically, with two projects\
    \ that both contain the same id.\n\n## Also inherited from task-059\n\nTask-059\
    \ deferred its sc-5 to this task: the review action buttons POST to the unscoped\
    \ `/api/tasks/{id}/...` because the pages have no project context yet. Once scoped\
    \ URLs exist here, point them at the scoped routes.\n\n## Out of scope\n\n- Task\
    \ detail rendering and editing. Task-054.\n- Cross-project search or any merged\
    \ task view. Explicitly rejected above.\n- Registry editing from the UI -- projects\
    \ are registered from the CLI.\n- Restyling beyond what these changes require.\n\
    \n---\n\n## Starter prompt (migrated from schema v1)\n\n## Objective\nBuild the\
    \ GUI shell: pick one project, see its tasks as an expandable hierarchy. Navigation\
    \ and scoping only -- task-054 owns how a task renders.\n\n## Read first\n- This\
    \ task's description. Two decisions in it are settled and must not be relitigated:\
    \ no merged all-projects view, and no interim parent field on v1.\n- src/agentjobs/api/routes/web.py\
    \ and the templates -- the current unscoped routes.\n- src/agentjobs/projects.py\
    \ and api/dependencies.py -- task-057's registry and the request_project dependency,\
    \ which already resolves project_id from the path.\n- docs/schema-design.md section\
    \ 2, for what `parent` actually is.\n\n## Steps\n1. Confirm task-052 has landed,\
    \ so v2 parent and its queries exist. If not, stop -- this task is not startable.\n\
    2. Create branch feat/task-058-multi-project-gui from main, record it in branches[],\
    \ mark in_progress, in that order.\n3. Switcher and scoped URLs first, then the\
    \ tree.\n4. Verify in a browser with two projects registered that share a task\
    \ id.\n\n## Do not\n- Build a merged cross-project view. The owner rejected it\
    \ explicitly.\n- Add an interim parent field to v1. Also explicitly rejected.\n\
    - Rewrite task detail rendering. Task-054.\n\n## Git workflow\nSmall single-logical-change\
    \ commits, Conventional Commits. Tests green before each. When complete: STOP,\
    \ set waiting_for_human through the status API with evidence of the tree and switcher\
    \ working. Do not merge."
  context: []
