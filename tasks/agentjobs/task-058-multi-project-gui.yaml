id: task-058-multi-project-gui
title: 'Multi-project GUI: project switcher and a cross-project task view'
created: '2026-08-10T06:14:30Z'
updated: '2026-08-10T06:14:30Z'
status: draft
priority: high
category: ux
estimated_effort: 1 working session
human_summary: 'The half of multi-project support the owner actually sees: a project
  switcher in the web UI and a cross-project view answering "what is waiting on me,
  everywhere". Deliberately narrow — navigation and scoping chrome only, no changes to
  how a task itself is rendered, because task-054 rewrites task rendering on schema v2
  and building that twice would be waste.'
description: 'Task-057 makes one server serve every registered project. This task makes
  that visible and usable in the web UI, which is the interface the owner intends to
  actually work through.


  ## Scope, and the line that defines it


  **In scope — navigation and scoping:**


  - A project switcher in the base layout, listing registered projects, showing which is
  active.

  - Project-scoped URLs: `/p/{project_id}/`, `/p/{project_id}/tasks`,
  `/p/{project_id}/tasks/{task_id}`. The existing unscoped URLs redirect to the default
  project rather than 404ing.

  - A cross-project view at `/all` — every task from every registered project in one
  list, each row naming its project, filterable by status and project. This is the "what
  is waiting on me, everywhere" screen, and it is the single most valuable thing in this
  task.

  - Project name and task counts rendered wherever a project is identified, so it is
  never ambiguous which project a task belongs to.


  **Out of scope — anything about how a task is displayed or edited:**


  - task_detail.html''s rendering of description, criteria, status updates, comments,
  deliverables. Untouched.

  - Any editing affordance. Under D2''s amendment (docs/schema-design.md §11) the GUI
  becomes the primary human editing surface, but that is **task-054**, on schema v2.
  Building editing on v1 and then rebuilding it on v2 is exactly the duplicated work this
  scope line exists to prevent.


  The distinction to hold onto: this task changes *which* tasks you are looking at and
  how you move between them. Task-054 changes *what a task looks like* and what you can
  do to it. The first survives the v2 rewrite; the second would not.


  ## The cross-project view is the point


  Everything else here is plumbing made visible. The `/all` view is the thing that makes
  running one AgentJobs across many projects better than running many AgentJobs — it is
  the first screen that could not exist at all before task-057. Build it first, not last,
  and judge the task on whether it is genuinely useful to look at.


  Note the ordering constraint it implies: because task ids are only unique within a
  project, every link out of this view must carry its project id. A row that links to
  `/tasks/task-001` instead of `/p/{project}/tasks/task-001` will silently open a
  different project''s task. Test that specifically, with two projects that both contain
  the same task id.


  ## Out of scope, additionally


  - Cross-project search (the search router stays project-scoped for now).

  - Any registry editing from the UI — projects are registered from the CLI.

  - Styling beyond matching what the existing templates already do.

  '
