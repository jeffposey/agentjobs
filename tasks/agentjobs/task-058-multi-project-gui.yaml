prompts:
  starter: '## Objective

    Make the web UI multi-project: a switcher, project-scoped URLs, and one cross-project
    view. Navigation only — do not touch how a task is rendered.


    ## Read first

    - This task''s description, particularly the scope line separating navigation from
    task rendering. It exists to stop this task duplicating task-054.

    - src/agentjobs/api/routes/web.py — the three existing routes.

    - src/agentjobs/api/templates/base.html, dashboard.html, task_list.html.

    - Task-057''s implementation, which supplies the registry and /api/tasks/all.


    ## Steps

    1. Create branch feat/task-058-multi-project-gui from main. Record it in branches[]
    and mark this task in_progress, in that order.

    2. Build the /all cross-project view first. It is the reason the feature exists; if it
    is not useful to look at, the rest does not matter.

    3. Then the switcher and the scoped URLs, with legacy redirects.

    4. Verify in a browser with two projects registered that share a task id.


    ## Do not

    - Add editing affordances. Task-054 owns the GUI as an editing surface, on v2.

    - Modify task_detail.html''s content rendering.

    - Restyle. Match what is there.


    ## Git workflow

    Small single-logical-change commits, Conventional Commits. Tests green before each.
    When complete: STOP, set waiting_for_human through the status API with a summary and
    a screenshot or equivalent evidence of the cross-project view. Do not merge.

    '
