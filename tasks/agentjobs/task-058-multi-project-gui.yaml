- id: 3
  ts: '2026-08-11T05:55:51.964667Z'
  actor: claude
  type: decision
  body: 'Promoted draft -> ready in a backlog grooming pass, 2026-08-11.


    Unlike tasks 046 and 053 this one carried a real, accurate block: its ball_prompt
    read ''Redesigned by the owner; cross-project view removed, now blocked on schema
    v2'', because a hierarchical task tree needs `parent` and v1 had no way to express
    one. The owner rejected an interim additive `parent` on v1 on 2026-08-10 in favour
    of doing v2 properly.


    That block is now clear. `parent` landed with the v2 models in task-050, the corpus
    and application moved to v2 in task-052, and the queries this GUI needs -- `get_subtasks()`
    and umbrella non-claimability in `get_next_task()` -- landed with task-045. The
    stated dependency chain (047 -> 050 -> 051 -> 052) is fully closed. The remaining
    scope is unchanged and still wanted: the project-scoped `/p/{id}/` URLs and the
    task list rendered as an expandable hierarchy.


    Carrying forward two things its description already flags, so the next reader
    does not have to reconstruct them: the ordering conflict with task-054 over what
    owns the project home page is real and unresolved on purpose -- whichever lands
    second confirms the arrangement with the owner rather than overriding the other;
    and task-059 deferred its sc-5 here, so the review buttons still POST to unscoped
    `/api/tasks/{id}/...` routes and should be pointed at the scoped ones once these
    URLs exist.'
  data: {}
- id: 4
  ts: '2026-08-13T02:58:34.081126Z'
  actor: claude
  type: decision
  body: 'Gated behind task-088 (the React task list) on 2026-08-12, by the owner''s
    direction.


    This task was `ready`, `high`, and estimated at one working session, which put
    it third in

    `get_next_task()`''s ranking. Its remaining deliverable is "a hierarchical task
    list for the

    selected project, expandable to reveal subtasks" -- which is exactly task-088''s
    job in

    React. An agent asked for the next available task would have built the hierarchy
    in Jinja

    while the React port was underway: the half-migrated state task-082 exists to
    prevent.


    Note for whoever picks this up: the Jinja hierarchy may already be finished. `_nest_tasks`

    in `api/routes/web.py` returns depth, ancestors, and child counts, and `task_list.html`

    renders an expandable tree over them. The likely resolution is that this task
    is closed as

    superseded once task-088 lands, but that is a judgement to make then, against
    the spec,

    rather than assumed now. The rejected alternative was closing it as superseded
    immediately,

    which would discard a requirement nobody has re-read against what actually shipped.'
  data: {}
- id: 5
  ts: '2026-08-13T22:04:24.576465Z'
