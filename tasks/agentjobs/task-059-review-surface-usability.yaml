- timestamp: '2026-08-10T07:06:32.760955Z'
  author: claude
  status: waiting_for_human
  summary: Rendering, task ids and Approve semantics fixed; sc-5 deferred to task-058
  details: 'Six of seven criteria met, 177 tests pass (2 new). Two commits on fix/task-059-review-surface,
    split by logical change.


    ## What changed


    **Task ids are visible** (a1fc34e). The list, the detail header and the dashboard
    cards showed title and category only -- the id appeared nowhere but the URL, despite
    being the handle used in the CLI, branch names, dependencies[] and commit messages.
    Now on all three, and selectable on the detail page because it gets pasted into
    commands.


    **Prose renders as markdown** (a1fc34e). `update.details` was interpolated into
    a `<p>`, and HTML collapses newlines, so a multi-paragraph update became one solid
    block. Status updates and comments now use the `x-markdown` directive base.html
    already defined and `task.description` already used. Long entries (>400 chars)
    collapse to a fade with a Show more control; the newest is expanded, because that
    is the one you came to read.


    One deliberate difference from the existing pattern: content is passed through
    Jinja''s `tojson` rather than the hand-rolled backtick escaping the description
    block uses. These updates routinely contain backticks and `${...}` when quoting
    shell commands, which that escaping handles badly. The attribute is single-quoted
    because `tojson` escapes `''` but not `"`. Verified on the rendered page: three
    x-data attributes, all valid JSON string literals, no raw apostrophes, 32 newlines
    preserved in the longest entry.


    **Approve no longer returns finished work to the pool** (a5c80bc). It set `ready`,
    which means unclaimed and claimable by any eligible agent -- the opposite of approving.
    Approve and request-changes now both move the ball to the agent via `in_progress`
    and record what is owed. Nothing merges; the copy and tooltips say so explicitly
    and a test asserts the recorded approval admits a merge is still outstanding.


    ## Decision: why in_progress, and what was rejected


    Neither v1 status means "approved, awaiting merge". Leaving it `waiting_for_human`
    keeps a task in the human''s inbox after the human is done with it, which is the
    same limbo in the other direction. `in_progress` is what v2''s `ball: agent` /
    `ball_reason: work` maps back to in v1 (docs/schema-design.md section 3), so it
    is the faithful projection rather than a guess.


    Rejected: adding an `approved` status to v1. That is a schema change to a version
    we are actively migrating away from, and it would need a v2 mapping entry the
    design doc does not have.


    Also updated `test_approve_task`, which asserted `status == "ready"` -- it encoded
    the bug rather than the requirement. The reasoning is in the test itself so the
    change does not read as bending a test to fit the code.


    ## sc-5 deferred, not done


    Review actions still POST to the unscoped /api/tasks/{id}/... . This cannot be
    fixed here: the web pages have no project in their URL yet, so there is no project
    context for the action to address. It becomes doable when task-058 introduces
    scoped web routes, and is recorded on the criterion.


    ## Limit of my verification -- read this before trusting sc-6


    I verified the emitted markup and the rendered HTML by fetching the pages: the
    ids are present, x-markdown is applied, the collapse classes and Show more control
    are there, and the JSON payloads are well-formed. **I cannot see the page.** Whether
    it actually looks better is the thing this task exists for, and only you can confirm
    it. Two browser tabs were opened on task-057 and the task list.


    Note also that task-057 is `completed`, so its review panel does not render --
    the Approve button changes are covered by tests but you will need a `waiting_for_human`
    task to see them in the UI. This task itself is one, right now.


    ## Not touched


    Pre-existing lint debt in tests/test_human_actions.py (7 ruff findings) and the
    migrate command, both task-047''s. No restyling beyond what these fixes needed.
    No diff view -- code review stays in git.'
