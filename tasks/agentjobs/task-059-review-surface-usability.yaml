id: task-059-review-surface-usability
title: 'GUI: make the task record actually reviewable, and stop Approve from lying'
created: '2026-08-10T06:49:31Z'
updated: '2026-08-10T06:49:31Z'
status: ready
priority: high
category: ux
estimated_effort: 2-4 hours
human_summary: 'Found by the owner on 2026-08-10, the first time he tried to review a
  completed task through the web UI instead of through git. Two problems, both hit
  within a minute. Status updates render as an unformatted wall of text, because
  update.details is interpolated into a <p> where HTML collapses every newline. And
  the Approve button does not do what approval means in this project: it sets the task
  to ready, handing it back to the agent pool, rather than executing the documented
  merge gate. Small fixes, high leverage -- this is the screen the owner has to trust
  if the GUI is ever going to be the primary interface.'
description: 'Evidence, not speculation: the owner reviewed task-057 through the web UI
  on 2026-08-10, called it awful, and went back to git. Everything below is what he hit.


  ## Problem 1 -- prose renders as a wall of text


  `task_detail.html` line 280 does `<p ...>{{ update.details }}</p>`. HTML collapses
  newlines, so a multi-paragraph status update becomes one unbroken block: no
  paragraphs, no lists, no headings, no code formatting. Comments (`comment.content`)
  have the same problem.


  **The fix is nearly free, which is the main reason this is worth doing now.** The
  machinery already exists and is already used for `task.description`: `base.html`
  loads `marked` and defines an Alpine `x-markdown` directive, and line 167 renders the
  description through it. Status updates and comments simply do not use it.


  Also needed, because rendering alone will not fix the experience:


  - Long entries collapse by default with a show-more affordance. These records are
  long by design (see below) and a page of six full entries is unreadable regardless of
  formatting.

  - Newest-first is already correct; keep it.

  - The summary should read as the headline it is, with details subordinate.


  **This is half our own fault, and the task should fix both halves.** Status updates
  are long because ALLAGENTS.md requires them to be complete for a reader with zero
  context, and that requirement is correct -- it is the whole premise of the project. So
  the answer is not "write shorter updates". It is: render them properly, collapse them
  by default, and make the first line genuinely scannable so the reader chooses what to
  expand. If the agent-side writing convention needs a change too (a structured lead
  line before the prose), propose it here rather than silently changing style.


  ## Problem 2 -- Approve does not approve


  `POST /api/tasks/{id}/approve` (`routes/tasks.py`) calls
  `update_status(status=TaskStatus.READY)`. Per ENGINEERING.md, approving a completed
  branch means: rebase onto main, merge --no-ff, mark the branch merged, set the task
  completed. Setting it to `ready` means the opposite of all of that -- `ready` is
  "claimable by any eligible agent", so the button hands finished work back to the pool
  as though it were fresh.


  `reject` is also blunt: it archives the task outright, with no lighter option between
  "approved" and "gone".


  Decide and implement one of these, recording which and why:


  - **Make the buttons honest.** Approve records human approval and moves the task to a
  state that means "approved, awaiting merge", without claiming to have merged
  anything -- because the GUI cannot merge, and should not pretend to.

  - **Remove the buttons** until the v2 model can express this properly, leaving the
  record read-only rather than actively misleading.


  Either is defensible; silently leaving a button that does the wrong thing is not. The
  deeper fix genuinely belongs to schema v2: under the `ball` model, "approve" means
  different things depending on why the human holds the ball (`review` vs `approval` vs
  `decision`), which is precisely the distinction v1 cannot express. Note that in the
  status update -- this task is first aid on v1, and task-054 owns the redesign.


  ## Problem 3 (smaller) -- the review actions are project-blind


  The buttons POST to the unscoped `/api/tasks/{id}/...`. That resolves correctly only
  because the server happens to run from the project being reviewed. Once several
  projects are registered, a review action from a project-scoped page must address that
  project. Coordinate with task-058, which introduces the scoped URLs; if 058 lands
  first, just use its routes.


  ## Out of scope


  - Any redesign of task rendering for schema v2. That is task-054.

  - A diff view. Code review stays in git, and that is the right call -- do not build a
  worse git.

  - Restyling beyond what these fixes require.

  '
