prompts:
  starter: '## Objective

    Make the task detail page a screen a human can actually review from. Two fixes:
    render prose properly, and stop the Approve button doing the opposite of approval.


    ## Read first

    - This task''s description -- it records exactly what the owner hit, and why the
    length of status updates is deliberate rather than a thing to "fix" by writing
    less.

    - src/agentjobs/api/templates/task_detail.html, lines ~263-286 (status updates)
    and ~167 (the description, which already renders markdown correctly -- copy that).

    - src/agentjobs/api/templates/base.html, the x-markdown Alpine directive.

    - src/agentjobs/api/routes/tasks.py, the approve / request-changes / reject endpoints.

    - ENGINEERING.md, "The Merge Gate" -- what approval actually means here.


    ## Steps

    1. Create branch fix/task-059-review-surface from main. Record it in branches[]
    and mark this task in_progress, in that order.

    2. Fix the rendering first and look at task-057 in a browser. It is the worst
    case in the corpus and the reason this task exists.

    3. Then decide the Approve/Reject question, implement it, and record the decision
    and its rejected alternative in a status update.

    4. Verify by reviewing a real task through the UI, not by reading the template.


    ## Do not

    - Rewrite task rendering for schema v2. Task-054 owns that.

    - Build a diff view.

    - Shorten agent status updates as a substitute for rendering them properly.


    ## Git workflow

    Small single-logical-change commits, Conventional Commits. Tests green before
    each. When complete: STOP, set waiting_for_human through the status API. Do not
    merge.

    '
  followups: []
