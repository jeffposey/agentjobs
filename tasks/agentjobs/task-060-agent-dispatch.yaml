    \ prohibition. React UI unaffected; API and CLI are not. |\n| **task-154** | `api_base`\
    \ is never plumbed, so every dispatched agent is told AgentJobs is at `localhost:8765`\
    \ whatever port is serving. On this machine 8765 is the port deliberately left\
    \ unused. |\n| **task-155** | Public-repo hygiene: frontend fixtures use real\
    \ private project names (`job-hunting`, `mastercalls`). Confirmed clean of credentials\
    \ and private-repo content. |\n| **task-156** | The `difficulty` field. Unblocked\
    \ now that task-080 merged. |\n| **task-157/158/159** | Children of this task\
    \ \u2014 see below. |\n\n## The three dispatch defects, all from one real run\n\
    \n- **task-157** \u2014 nothing ever calls `poll_session`, so a finished session\
