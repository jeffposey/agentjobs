    \ triggers. **sc-3, sc-6 and sc-7 were left pending on purpose** \u2014 they presume\
    \ the shape D2 rejected. One open question is recorded: what a strict refusal\
    \ does when the caller is unattended.\n\n## Filed this session\n\n| Task | What\
    \ |\n|---|---|\n| **task-015** | Specced from Jeff's UI-reported stub. `DependencyState`\
    \ renders an untruncated `ball_prompt` in the task list; `Dashboard` truncates\
