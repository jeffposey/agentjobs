- id: 6
  ts: '2026-08-11T00:24:01.399991Z'
  actor: claude
  type: handoff
  body: 'Design pass for agent dispatch complete. Branch docs/task-060-agent-dispatch-design,
    two commits, nothing merged.


    **What exists now.** docs/agent-dispatch-design.md, in the shape of docs/schema-design.md:
    13 sections, every decision with its rationale and the alternative it beat, a
    rejected-alternatives section, and the four decisions (D1-D4) recorded with what
    was rejected. Added to the mkdocs nav. Plus seven derived implementation tasks,
    068-074, created draft.


    **The six questions the task set as its agenda, answered.**


    1. *Safety.* Four gates, each independently sufficient to stop a run: master switch,
    runner must exist machine-locally, per-project enablement, and a DISPATCH_DISABLED
    sentinel file checked immediately before every spawn. The runner argv lives in
    ~/.agentjobs/dispatch.yaml and never in the versioned project config -- otherwise
    `git clone` of any repository carries a ''run this command on Jeff''s machine''
    payload that the project''s own config legitimises. Kill switch at three scopes;
    `agentjobs dispatch stop` is one command with no arguments that writes the sentinel
    and kills everything. Dispatch never *initiates* without a human; runs do *continue*
    while nobody is watching.


    2. *Runaway loops.* Answered structurally first (D4) and numerically second: 3
    dispatches per task per day, 10 lifetime, 60s cooldown, 1 concurrent run, 30 minute
    wall clock. Per your call, the budget caps bind auto-dispatch only; one live run
    per task and the timeout bind everything, because they are correctness rather
    than spend. Tripping a per-task cap refuses the run, logs the specific limit,
    and moves the ball to you -- a task that burns its daily cap is telling you something
    is wrong with the task.


    3. *Concurrency.* task-055 is closed, so the hard prerequisite is met. Dispatch
    adds what a file lock cannot cover: the dispatcher claims before it spawns (so
    losing a race costs a rejected HTTP request, not a wasted model call), and a per-task
    run lock held for the process lifetime using the same O_CREAT|O_EXCL primitive
    055 chose.


    4. *Invocation.* A named runner with an argv template in machine-local config.
    Claude Code headless is the shipped default template, not the mechanism. The Agent
    SDK was rejected mainly because an in-process agent crash takes the supervisor
    with it -- a supervisor that dies with its child cannot report on it -- and secondarily
    because it makes AgentJobs hold API credentials it currently never touches. Argv
    is a list; there is no shell anywhere in the design.


    5. *Process lifecycle.* One blocking supervisor thread per run, guaranteed to
    write a terminal dispatch_result on every path including its own exception. Run
    directory and meta.yaml written before Popen so a supervisor that dies mid-spawn
    still leaves a row. Output streamed to disk, not buffered. Runs do not outlive
    their supervisor, and startup reconciliation turns anything found non-terminal
    into a task-visible ''interrupted''. Explicitly not the detached asyncio shape
    that hid the webhook NameError for months (task-047). One outcome worth flagging:
    exit 0 with an unmoved ball counts as a failure, because the agent stopped without
    saying what it needs.


    6. *Trigger.* An explicit Dispatch action, distinct from Approve, per your call.
    A webhook consumer on task.handoff was rejected despite being the obvious reuse:
    it fires on agent handoffs too, so safety would rest on filtering correctly rather
    than on never being asked.


    **Process note.** Another agent switched the shared working directory to feat/task-062-onboard-projects-from-the-ui
    partway through. My first commit had swept their in-flight files in; I reset it
    and recommitted only mine, leaving their working tree untouched. The task files
    here were committed through a git worktree for the same reason. Worth knowing
    that two agents in one checkout is a live hazard.


    452 tests pass. Nothing merged, nothing pushed.'
