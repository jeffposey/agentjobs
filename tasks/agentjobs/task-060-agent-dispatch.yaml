- id: 3
  ts: '2026-08-11T00:24:01.344137Z'
  actor: claude
  type: decision
  body: 'D4 (agent''s call): the dispatch loop is human-clocked.


    A dispatch may only be caused by a log entry whose actor is a human. An agent
    handoff never causes a dispatch, in any mode. This makes the circular failure
    mode -- agent finishes, agent starts, repeat -- structurally impossible rather
    than merely capped, and demotes counters and cooldowns to a backstop against a
    bug in the dispatcher itself.


    Rejected: permitting agent-caused dispatch and bounding it with counts, cooldowns
    and a hard cap. That is the obvious design and it defends a loop that is still
    permitted to exist; every protection is then a number someone can raise at 2am.
    The accepted cost of the chosen rule is real and permanent: ''agent finishes,
    next agent picks up automatically'' will never work. Every turn of the wheel costs
    one human click.


    Recorded as an agent decision rather than put to Jeff, because it follows from
    D1 (dispatch separate from approval) rather than being an independent choice.
    It is the first thing to revisit if the design ever feels too restrictive.'
  data:
    decision: D4
    design: docs/agent-dispatch-design.md#2
- id: 4
  ts: '2026-08-11T00:24:01.361786Z'
  actor: claude
  type: decision
  body: 'Dispatch composes no prompt; it passes a pointer to the task record.


    The dispatch payload is three fixed lines plus five substitutions: you are agent
    X working task Y in project Z, the server is at this URL, read the record. Schema-design
    section 5''s resumption contract already guarantees a task record is sufficient
    to resume from, and ball_prompt is required by the schema whenever the ball is
    set.


    Rejected: templating a rich prompt from summary + last handoff + acceptance. It
    is a second copy of the resumption contract that will drift from the first, it
    makes the dispatcher depend on schema shape, and it papers over the real bug in
    the case it appears to solve -- if the record is not sufficient to resume from,
    fix the record.


    This is the decision that removed most of the apparent difficulty from the invocation
    question.'
  data:
    design: docs/agent-dispatch-design.md#4
- id: 5
  ts: '2026-08-11T00:24:01.380534Z'
