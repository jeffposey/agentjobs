    \ batch run reported itself `failed`, about half the time.** The kill wakes the\
    \ supervisor, which sees a non-zero exit; the ledger writes `cancelled`; both\
    \ are read-modify-writes of one `meta.yaml`. The ledger now raises `cancel_requested`\
    \ *before* killing \u2014 the supervisor is blocked in `wait()` until then \u2014\
    \ and the supervisor defers.\n2. **The run lock leaked** on the supervisor's early-return\
    \ paths, then refused every later dispatch at that task with \"a run is already\
    \ live\".\n3. **`DispatchLedger` resolved projects only through the registry**,\
    \ so on a server serving an implicit project a cancellation stopped the process\
    \ and had nowhere to write the result \u2014 the exact silence this subsystem\
    \ exists to prevent.\n4. **Every task created in the React app had an empty log**,\
    \ because the create form never sent an actor. No record of who filed it \u2014\
    \ and since a dispatch must trace to a human's log entry, *a browser-created task\
    \ could never be dispatched*. This one would have made the whole feature look\
    \ broken.\n5. A closed dispatch gate was announced as an ARIA `alert`, putting\
    \ an orange box on every task of a machine with no dispatch config.\n6. **`reap_finished()`\
    \ existed, was tested, and nothing called it** \u2014 so worktrees accumulated\
    \ for as long as the machine ran. Startup reconciliation now reaps; `agentjobs\
    \ dispatch reap` is the on-demand form.\n\n## Two corrections to published design\n\
    \nBoth recorded as decisions on their tasks, because a diff would not carry them:\n\
    \n- **task-078:** its own constraint said `verify` was unused. It is not \u2014\
