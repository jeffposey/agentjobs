prompts:
  starter: '## Objective

    Give the web UI a project switcher and project-scoped URLs. Navigation only.


    ## Read first

    - src/agentjobs/api/routes/web.py -- the three unscoped routes.

    - src/agentjobs/api/dependencies.py -- `list_projects`, `request_project` and
    `resolve_default_project` already exist and already do the resolution. The API
    routers are mounted twice, unscoped and scoped; do the equivalent for web.

    - src/agentjobs/api/templates/base.html -- where the switcher goes.

    - tests/test_api_multiproject.py -- the two-projects-sharing-a-task-id fixture to
    extend.


    ## Do not

    - Build the hierarchy. Task-058, and it needs v2.

    - Change what task_detail.html draws. Task-054.

    - Build a merged all-projects view. Explicitly rejected by the owner.


    ## Git workflow

    Branch feat/task-061-project-switcher from main, record it in branches[], mark
    in_progress, in that order. Small commits, tests green before each. When complete:
    STOP, set waiting_for_human through the status API. Do not merge.

    '
