human_summary: 'Split out of task-058 on 2026-08-10 because it was wrongly blocked. The
  server has been able to serve every registered project since task-057, but the web UI
  has three unscoped routes and shows only the default project -- so the owner cannot
  see the second project he registered. The switcher needs nothing from schema v2; only
  the hierarchical task tree does. This is the shortest path from where the tool is to
  one that visibly does what it was built for.'
description: 'The API has been multi-project since task-057: `/api/projects` lists every
  registered project with task counts, and `/api/projects/{project_id}/tasks/...` serves
  each one. The web UI has not caught up. It has exactly three routes -- `/`, `/tasks`,
  `/tasks/{task_id}` -- none of which mention a project, so the GUI renders whichever
  project the server''s working directory resolves to and there is no way to reach
  another.


  The owner registered two projects and asked whether there was a chooser. There was
  not.


  ## Why this is a separate task


  Task-058 was reshaped on 2026-08-10 to the owner''s design -- pick a project, then see
  a hierarchy of its tasks -- and the whole task was gated on schema v2. That was wrong,
  and the error is recorded here rather than quietly corrected: **only the hierarchy
  needs v2.** A task tree needs the `parent` field, which does not exist in v1. A
  project switcher needs the registry and the scoped API, both of which shipped in
  task-057.


  Bundling them pushed a switcher that was buildable immediately behind four more tasks
  (047 -> 050 -> 051 -> 052). Splitting costs nothing and changes no decision: task-058
  keeps the tree and stays gated on v2.


  ## Scope


  - **A project switcher in the base layout**, on every page, listing registered
  projects and marking the active one. Uses `dependencies.list_projects()`.

  - **Project-scoped web routes**: `/p/{project_id}/`, `/p/{project_id}/tasks`,
  `/p/{project_id}/tasks/{task_id}`. The `request_project` dependency already resolves
  `project_id` from the request path, so the resolution logic exists -- this is wiring
  the web routes to it the way the API routes already are.

  - **Legacy URLs keep working**: `/`, `/tasks`, `/tasks/{id}` redirect to the resolved
  default project rather than 404ing. Bookmarks and the existing links in the templates
  must not break.

  - **Review actions address their project.** This closes task-059''s deferred sc-5: the
  Approve / Request Changes / Reject buttons POST to the unscoped `/api/tasks/{id}/...`
  today, which only resolves correctly because the server happens to run from the
  project being reviewed.


  ## The bug this invites


  Task ids are unique only *within* a project -- both registered projects can contain a
  `task-001`. Every link must carry its project id, or a row silently opens a different
  project''s task. Task-057''s test suite already registers two projects sharing an id
  for exactly this reason; extend that pattern to the web routes.


  ## Out of scope


  - The hierarchical task tree. Task-058, gated on schema v2''s `parent`.

  - Task detail *rendering* and editing affordances. Task-054, on v2. This task may
  change which URL the detail page lives at, not what it draws.

  - Any merged all-projects view. The owner rejected that on 2026-08-10; one project is
  selected at a time. Note `/api/all/tasks` exists from task-057 and stays unused by
  the GUI.

  - Registry editing from the UI. Projects are registered from the CLI.

  '
