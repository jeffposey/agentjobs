spec:
  summary: 'AgentJobs ships knowing about one project -- its own. Adding a second
    currently means reading a hint in the UI that tells you to go and run a CLI command,
    which is a poor first five minutes for a tool whose point is that you work through
    its interface. Two flows are needed: register a directory that is already an AgentJobs
    project, and turn an untracked directory into one. The REST endpoints are the
    durable deliverable; the Jinja form deliberately is not, because the React frontend
    replaces it.'
  description: 'The project switcher (task-061) lists registered projects and ends
    with the line "Register more with `agentjobs project add`". Telling someone to
    leave the UI and run a command is the wrong answer for the one workflow every
    new user hits first.


    ## Two flows


    1. **Add an existing AgentJobs project.** The directory already has `.agentjobs/config.yaml`.
    Register it: read its `project_name`, derive or accept an id, add it to the machine
    registry.

    2. **Create a project in an untracked directory.** The directory exists but has
    no AgentJobs config. Write one, create the tasks directory, then register it.
    This is what `agentjobs init` does, minus the interactive prompts.


    The UI should tell these apart by inspecting the path rather than making the user
    declare which one they are doing.


    ## Build the API properly; keep the HTML thin


    This is the part that decides whether the work survives.


    The **endpoints are durable** -- `POST /api/projects` to register, and something
    like `POST /api/projects/init` to create-then-register. The React frontend will
    call exactly these. Give them real validation, real errors, and tests.


    The **Jinja form is disposable**. A page with a path field, an inspect step and
    a confirm button is enough. Do not invest in a directory browser, autocomplete,
    or styling beyond what the existing pages already use. The owner has asked to
    keep Web UI work minimal ahead of the React/TS rebuild, and this task exists to
    make the API right, not to make the Jinja page nice.


    ## Safety -- this writes to arbitrary paths


    Registering is harmless; creating is not. `POST /api/projects/init` takes a filesystem
    path from a web request and writes files into it. Decide and record:


    - **Refuse to overwrite an existing config.** `agentjobs init` currently clobbers
    `.agentjobs/config.yaml` with defaults, no prompt and no backup. That footgun
    already cost a session -- it silently overwrote this repo''s own config during
    task-057 verification. Exposing it through a web form makes it materially worse,
    so this task should fix `init` as well: refuse, or require an explicit overwrite
    flag.

    - **The directory must already exist.** Do not create arbitrary parent directories
    from a web request; require the user to have made it.

    - **Reject paths that are already registered** under a different id, which the
    registry already does -- surface the error rather than swallowing it.


    ## Notes


    - `ProjectRegistry` in `src/agentjobs/projects.py` already does registration,
    id-slugging and duplicate detection. This task is mostly exposing it, not writing
    it.

    - Project ids are lowercase slugs matched exactly, never joined onto a path. Keep
    it that way.

    - Removing a project from the UI is **out of scope** for now: unregistering is
    low-risk but the button sits next to data people care about, and the CLI covers
    it.


    ---


    ## Starter prompt (migrated from schema v1)


    ## Objective

    Let someone add or create an AgentJobs project from the UI instead of being told
    to run a CLI command.


    ## Read first

    - This task''s description, particularly the safety section: one endpoint writes
    files into a path supplied by a web request.

    - `src/agentjobs/projects.py` -- ProjectRegistry already does the work; this is
    mostly exposure.

    - `src/agentjobs/api/routes/projects.py` and `cli.py`''s `project` commands and
    `init`.


    ## Priorities

    The REST endpoints are the deliverable and deserve real care. The Jinja page is
    scaffolding that React will replace -- keep it minimal on purpose.


    ## Do not

    - Build a filesystem browser or path autocomplete.

    - Add project removal to the UI.

    - Invest in styling.


    ## Git workflow

    Branch `feat/task-062-onboard-projects-from-the-ui` from main, record it in branches[],
    mark in_progress. Small conventional commits. When complete: STOP, set waiting_for_human
    through the status API. Do not merge.'
