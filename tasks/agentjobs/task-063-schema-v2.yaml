spec:
  summary: 'Schema v2 is live across the models, corpus, application, API, Python
    client, and React UI. The remaining umbrella work is task 053: dedicated CLI commands
    for the canonical state verbs.'
  intent: 'Schema v1 had one `status` field carrying three unrelated facts: how far
    along the work

    was, who had to act next, and how it ended. Any move overwrote the other two.
    The most

    expensive symptom was that "waiting for a human" was a status, so a task waiting
    on a

    review looked identical to a task nobody had started, and there was no query that

    answered "what needs me".


    v2 separates them: `lifecycle` (how far along), `ball` + `ball_reason` (who acts
    next

    and why), `outcome` (how it ended, set only at the end). `ball == human` is then
    a real

    inbox, and the review gate has something to hang on.

    '
  description: 'Five tasks, in dependency order:


    | | | |

    |---|---|---|

    | **050** | Models | The state axes and the consistency rules between them, the
    structured spec block, the acceptance checklist, the unified append-only log,
    `assignment`, `parent`, the `schema: 2` stamp, strict validation. Models only.
    |

    | **051** | Migrator | `agentjobs migrate-schema`, built against those models
    and proven against the real corpus, plus a round-trip test over every file. |

    | **052** | Switchover | Run the proven migrator over all 38 task files and repoint
    storage, manager, API, templates and CLI at v2 in the same commit, then delete
    v1. |

    | **053** | CLI | The verbs at the command line -- `inbox`, `next`, `claim`, `handoff`,
    `log`, `close` -- rendering `display_status` and `ball_prompt` so the loop is
    drivable from a terminal. |

    | **054** | Legacy GUI (superseded) | The planned Jinja-specific inbox/activity
    work was retired after the React dashboard and task detail shipped the durable
    v2 surface. |


    The split is not arbitrary. There is no intermediate state in which a half-migrated

    application works, so the corpus write and the code change had to land together
    -- which

    is only reviewable if everything risky about it happened *earlier*, in tasks that
    could

    each be judged on their own. That is what 050 and 051 are for: finished models
    to write

    the migrator against, and a migrator proven against real data before it was ever
    pointed

    at the corpus for keeps.


    053 remains open for dedicated CLI mirrors. Task 054 is closed superseded: the
    packaged React application now renders the v2 inbox, activity, task detail, log,
    and acceptance state, while Jinja remains legacy compatibility.


    **Done** when a task''s state is readable from the four axes alone in every interface.


    Sequencing was recorded as `needs` dependencies from the start. What was missing
    was

    anywhere to say the five are *one effort* rather than five neighbours -- which
    is what

    `parent` records, and what task-045 built.

    '
