- id: 8
  ts: '2026-08-10T23:33:03.906967Z'
  actor: claude
  type: decision
  body: '**Actor ids may contain spaces; the owner''s id is now `Jeff Posey`.** Recorded
    because I argued against it first and a later reader deserves both sides.


    The objection: an actor id is a *reference*. It appears in `actor:`, `assignment.owner`,
    `assignment.eligible`, and in URL query values such as `?agent=`. Config already
    carries `display_name` for readability, so the textbook split is a terse stable
    id plus a pretty label, and putting the pretty label in the id makes `display_name`
    redundant.


    Overruled, and reasonably. The stored record is the product here -- the whole
    premise is that a person or an agent reads the YAML directly -- so readability
    *in the file* is a real requirement, not a nicety. `actor: Jeff Posey` needs no
    lookup to understand; `actor: jeffposey` does. And the technical cost turned out
    to be nil rather than merely small, which I verified instead of assuming: PyYAML
    round-trips an unquoted internal space, FastAPI decodes `%20` in a query value,
    and `/api/tasks/next?agent=Jeff%20Posey` resolves correctly.


    *The residual cost, accepted:* near-miss ids are now easier to typo -- `Jeff  Posey`
    with two spaces is a different id -- which is why `validate_actor` refusing an
    unknown actor matters more than it did, and why there is now a test for exactly
    that near miss. `display_name` stays in the schema and is still the right place
    for a label that differs from the id; it simply happens to match today.


    *Not done:* no format validation on actor ids. Constraining them would need a
    rule that admits spaces but excludes whatever is genuinely dangerous, and nothing
    has yet shown what that is.'
  re: 7
  data: {}
- id: 9
