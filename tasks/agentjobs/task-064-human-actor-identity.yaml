ball_prompt: 'Review branch `feat/task-064-human-actor-identity` and approve or request
  changes. Worth a look specifically: the config shape decision above, and whether
  withholding the review buttons when no user is configured is the behaviour you want,
  versus letting them act anonymously. Approving this one will be the first action
  in the repo recorded as `jeff` rather than `human`.'
