- id: 2
  ts: '2026-08-10T23:12:06.489647Z'
  actor: claude
  type: decision
  body: '**One `actors:` list carrying `kind`, not a separate `humans:` list.** ac-4
    asked for this to be decided explicitly rather than by default.


    D4 says a task file names an actor by bare id and that *kind* is resolved from
    config. A single list where each entry declares its kind is that sentence expressed
    directly. Two parallel lists would make kind a function of which key an entry
    happens to sit under, which is the same fact stored in a second place -- the shape
    v2 rejected for `display_status` and for embedded actor objects.


    It also answers a question the two-list shape cannot: an actor id must be unique
    across *both* kinds, since `actor:` in a log entry is one namespace. With two
    lists nothing stops `jeff` appearing in both.


    *Rejected: `humans:` alongside `agents:`.* Cheaper today -- no migration, mirrors
    the existing key -- but it defers a merge that gets more expensive as more config
    accumulates around each list.


    *The cost, taken deliberately:* existing projects have `agents:`. Rather than
    rewrite anyone''s config, `load_actors` reads both and merges them, with `actors:`
    winning on a duplicate id. A project can adopt `actors:` for its people without
    touching its agents on the same day. `agents:` is not deprecated in this task;
    retiring it wants its own change once nothing depends on it.'
  data: {}
- id: 3
  ts: '2026-08-10T23:12:06.500783Z'
  actor: claude
  type: handoff
  body: 'All four acceptance criteria met.


    **Changed.** New `actors.py` resolves the config vocabulary. `.agentjobs/config.yaml`
    now has an `actors:` list -- jeff (human), claude and codex (agents) -- and `default_user:
    jeff`. The three GUI buttons post the configured id instead of the literal ''human''.
    The three human-action endpoints validate the actor and refuse an unknown one
    with a 400 naming the configured ids. `agentjobs init` asks for your user id,
    defaulting to the OS username.


    **Two behaviours worth naming, because they are judgement calls not requirements.**
    When config names no human, the review panel withholds the buttons and explains
    how to configure one -- refusing to act beats writing an unattributable entry
    into an append-only log. When config names two humans and no default, there is
    no default user rather than a guess, for the same reason.


    **Verified.** 419 tests pass; ruff, mypy, black clean. 17 new tests, including
    that ''human'' -- the exact value every review action used to carry -- is now
    refused. Checked against the running server rather than only in tests: the rendered
    page carries `const CURRENT_USER = "jeff"`, no `user: ''human''` payload survives
    anywhere in it, and POSTing `{"user":"human"}` to /approve returns 400 listing
    the real actors.


    **Historical entries keep saying ''human''.** The log is append-only; backfilling
    a name onto actions taken before there was a name would be inventing a record.'
