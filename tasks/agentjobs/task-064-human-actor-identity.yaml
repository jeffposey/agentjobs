- id: 5
  ts: '2026-08-10T23:22:16.729515Z'
  actor: claude
  type: decision
  body: '**The backfill was mine to object to and yours to decide, and on reflection
    your call is the better one.** Recording why, since the earlier handoff argued
    the opposite and a future reader will find both.


    I declined to backfill on the grounds that the log is append-only and writing
    a name onto entries taken before there was one is inventing a record. That argument
    does not survive contact with the specific facts. Every ''human'' entry was written
    by the GUI, the GUI has only ever been reachable by you, and the placeholder had
    exactly one possible referent. Rewriting an unambiguous placeholder to the identity
    it always denoted is *resolving* a reference, not fabricating one -- the same
    operation as expanding a relative path.


    It would be fabrication if the referent were uncertain: several people with access,
    or entries written by an API caller who was not you. Neither is true here, and
    that is a fact about this corpus rather than a general licence. If task-066 lands
    and several people use the instance, no comparable backfill is ever safe again.


    *What was actually changed*: 8 references across 7 files, in `log[].actor` only
    -- no `assignment.owner` or `eligible` entries held the placeholder. The rewrite
    walks the model rather than the text, because `ball: human` is the Ball enum and
    means ''a person acts next'', not ''a person named human''. The same word in two
    namespaces is precisely what a find-and-replace would have destroyed; all 7 tasks
    carrying `ball: human` are untouched and still answer `GET /api/tasks?ball=human`.'
  data: {}
- id: 6
  ts: '2026-08-10T23:22:16.746029Z'
  actor: claude
  type: handoff
  body: 'Second review round. Every item from your feedback:


    **1. Renamed to `jeffposey`.** Config, the default user, and the test fixtures.


    **2. Kept the disable-and-guide behaviour** when no user is configured, as you
    confirmed.


    **3. Multiple humans are now refused loudly rather than handled.** Previously
    an ambiguous config silently produced no default user, which looked identical
    to having none configured. `human_identity` now distinguishes the two and the
    panel says which: ''no user configured, add yourself'' versus ''multiple configured,
