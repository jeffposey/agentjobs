ball_prompt: "Review the Report Issue action on branch `feat/task-065-report-issue-action`\
  \ (worktree `C:/projects/aj-065`), then approve or send it back.\n\n**A review server\
  \ is running for you: http://127.0.0.1:8899/app/ \u2014 throwaway data, own port,\
  \ nothing touches your real corpus.** Click anything, including the destructive\
  \ controls. Say the word and I will stop it.\n\nWhat to look at, both states seeded:\n\
  \n1. `/app/p/review-sandbox/tasks/task-001-dashboard-layout` \u2014 a task page.\
  \ Hit **Report issue** (bottom right). The form pre-fills the route and offers to\
  \ link the task; file one and follow the confirmation into the created record.\n\
  2. Switch the destination to **No Human Configured** in the form's project select\
  \ \u2014 the reporter refuses and explains, rather than filing an unattributable\
  \ record.\n3. `/app/p/review-sandbox/tasks/task-002-log-timestamps` \u2014 an already-filed\
  \ report, showing the `reported-issue` tag and the new **Related** panel linking\
  \ back to the page it was noticed on. `task-003-ordinary-work` has no such panel,\
  \ for comparison.\n4. `/app/not-found` and `/` \u2014 the reporter is present on\
  \ pages with no project in scope. This is the deviation from the spec worth your\
  \ eye: the spec said 'next to the project switcher', and that nav only exists on\
  \ project routes, so it would have missed the picker that ac-1 names. Reasoning\
  \ is in the decision log.\n\nThe judgement calls, all recorded as decisions above:\
  \ the destination project is an explicit field defaulted to the one you are viewing\
  \ (ac-5); the page is stored as prose in the description rather than in `links[]`,\
  \ because the durable half of a URL is the route and not the host; and `related`\
  \ dependencies now render on the task detail page, which is a small reach outside\
  \ this task's stated surface \u2014 without it, ac-3's link existed only inside\
  \ the YAML.\n\nOne thing to look at critically: the floating control can sit over\
  \ page content. That is the first thing I would want a second opinion on.\n\nVerification:\
  \ `poetry run python scripts/check.py` fully green \u2014 1418 pytest, 81 vitest,\
  \ 8 Playwright including two new browser paths that file real issues against a real\
  \ server and read back the stored record. Black/ruff/mypy clean on the changed files\
  \ (the two pre-existing black failures in `tests/test_cli.py` and `tests/test_task_corpus.py`\
  \ are on main and untouched).\n\nUnrelated, found while seeding the sandbox and\
  \ already filed: `generate_task_id` ignores every slugged task id, so the sandbox\
  \ generated `task-001` next to `task-001-dashboard-layout`. That is **task-105**,\
