- id: 5
  ts: '2026-09-04T03:25:47.976716Z'
  actor: claude
  type: decision
  body: '**The identity model, decided 2026-09-03 with Jeff.** This is the design
    call this task has been parked on since 2026-08-10, and it is binding for every
    child.


    **Chosen: a trusted front door for remote callers, the machine''s owner on loopback,
    and a third principal kind for dispatched runs.**


    The first two are the combination this task''s own description guessed at ("the
    third plus the first is probably the answer -- picker locally, trusted header
    when deployed"). The refinement is that the local half is *not* a picker. A picker
    is self-asserted attribution, and on this machine the self-asserting party would
    frequently be a dispatched agent rather than a person, which is the failure the
    whole epic exists to close.


    **The third kind is the load-bearing part, and no prior spec had it.** The Big
    Dawg audit proposed identity at the proxy plus a path deny-list. Both are proxy-side,
    and a dispatched agent does not go through the proxy -- it is already on loopback.
    So if loopback is a blanket-trusted tier so that the desktop dashboard keeps working,
    the agent-impersonation chain (auditor 10''s P1-2) survives the entire fix. Splitting
    loopback into `owner` (no credential) and `run` (a run-scoped credential minted
    at dispatch) is what makes the boundary real rather than decorative.


    **Rejected alternatives.**


    - *Session-less "acting as" picker, locally.* Honest about being attribution rather
    than authentication, and cheap. Rejected because the population of local callers
    is not just Jeff -- it includes every agent this machine dispatches, and they
    can pick too.

    - *Real authentication: passwords, sessions, an identity provider.* Correct for
    a shared or exposed instance. Rejected as disproportionate for a tool whose selling
    point is a directory of YAML files with no infrastructure, and because the tailnet
    already performs the authentication; re-doing it in the app adds a login server
    and buys nothing here.

    - *The audit''s original path deny-list.* It denied `/api/all/tasks`, `dispatch/enable|disable`,
    `queue/repair`, `webhooks`, `/docs`, and the run output/tail/transcript routes,
    in addition to the creation routes. Rejected as over-broad: it was written to
    be useful *without* identity ("either layer alone is a large improvement"), and
    with identity in place most of it protects nothing that identity does not protect
    better. Verified by grep on 2026-09-03 that the React app calls every one of those
    routes zero times **except** the run output routes, which it uses for the structured
    dispatch output panel -- so the deny-list''s only real effect on the product would
    have been to break a working feature. What survives is three routes: `POST /api/projects/init`,
    `POST /api/projects`, `/api/projects/inspect`. They stay denied because they are
    the only rung that turns the API into arbitrary code execution on the box (init
    any directory -> enable dispatch -> dispatch a session with that cwd), and because
    nobody performs them from a phone.

    - *Denying `dispatch/enable|disable`.* Rejected. `enable` acts only against an
    already-defined runner, so its danger is entirely parasitic on being able to create
    a project pointing at an arbitrary directory; control `init` and `enable` stops
    being interesting. `disable` is the brake, and it is wanted *most* from a phone,
    away from the desk.


    **Consequence accepted:** this task''s former `out_of_scope` line -- "per-user
    permissions and roles... worth a separate task if it is ever wanted" -- is narrowed
    rather than kept. A fixed capability set per principal *kind* comes in scope,
    because knowing a caller is an agent buys nothing if an agent may still do everything
    a human may. Per-*person* permissions remain out of scope.'
  data:
