  actor: claude
  type: progress
  body: '**The first walk was killed by the harness, not by a child. The second walk
    then bailed for a reason that is a real gap in `dispatch walk`.** Recording both,
    because the second is a finding about dispatch rather than about this epic.


    **What happened.** The supervisor (run_b1c2d736) started `agentjobs dispatch walk`
    as a Claude Code background task at 03:37. It started task-329, then task-334,
    and then printed nothing for 29 minutes -- correctly, since it only prints on
    a state change and its poll is silent. At about 30 minutes the harness reported
    it `killed`. Nothing in the walk failed and no child failed; the watcher process
    was reaped while idle.


    **The children were unaffected.** They are separate dispatched sessions, not subprocesses
    of the walk. `dispatch status` at 04:08 showed run_43c2a909 (task-329) and run_b6998ff8
    (task-334) both `running` at ~1,835s. task-329 had by then built `feat/task-329-principal-resolution`,
    run a scripted finish, and had the ball handed back at a red `pytest` stage, which
    its session is working.


    **The gap: a restarted walk cannot adopt children already in flight.** Relaunching
    the walk -- this time detached from the harness, so an idle stretch cannot reap
    it -- exited 1 immediately with "7 open children remain and none is claimable".
    That is accurate but misleading as a conclusion: 329 and 334 are unclaimable precisely
    *because they are running*, and the remaining five are blocked on 329. The walk
    watches only children it started itself, so with nothing of its own in the air
    it had nothing to wait for and reported the epic stopped. It also moved this parent''s
    ball to `human`/`decision`, asking a person to resolve a child that does not need
    resolving.


    So a walk is not resumable across the loss of its own process, and its failure
    mode when restarted mid-flight is to report a healthy epic as stopped and wake
    a human. Worth a task; not this one''s scope, and I am not filing it from inside
    this run without checking the backlog first.


    **What I am doing instead.** I hold the watch myself until 329 and 334 reach a
    terminal state, then relaunch the detached walk at a moment when the next layer
    (330, 331) is genuinely claimable, so the new walk has children of its own to
    watch and lives to the end of the epic. Attempt counts are read off each child''s
    log, so nothing is double-spent by the restart. Ball back to `agent`/`work`: the
    epic is flying and no human decision is outstanding.'
