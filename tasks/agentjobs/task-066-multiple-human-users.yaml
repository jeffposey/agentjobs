spec:
  summary: AgentJobs has no notion of who is asking. Identity is a body field the
    API itself discloses, so any tailnet peer -- and any agent running on this machine
    -- can act as any configured human. Build the principal model that makes identity
    a fact.
  intent: 'task-064 gave AgentJobs one human identity read from config, and deliberately
    refused a config naming several, because the server had no way to tell which person
    was at the keyboard and an action attributed to the wrong person is worse than
    one attributed to nobody. This task was filed to lift that limit and has waited
    since 2026-08-10 on a single decision: which identity model.


    The Big Dawg audit of 2026-08-21 found the same gap from the other side and made
    it urgent. The whole REST API -- 99 operations, 61 of them mutating -- is anonymous
    at https://agentjobs.tailfed1df.ts.net, and `GET /api/projects` hands out the
    exact string a caller needs in order to be believed. Review endpoints compare
    `user == default_user`; that check is ''send back the value we just told you''.


    The decision is now made and recorded on this task. It is the combination 066
    guessed at -- a trusted front door for remote callers, the machine''s owner on
    loopback -- plus one kind no prior spec contemplated: a distinct principal for
    dispatched runs. That third kind is what makes the loopback boundary real. Without
    it an agent running on this machine curls past every control in the epic, which
    is the audit''s P1-2 finding and is not fixed by anything at the proxy.


    This is the account system, not a security patch bolted to the side of one. Every
    later question -- more than one person, attribution in the log, what an agent
    may do to its own task, what is safe to expose on a network -- is the same question
    about principals, and answering it once is why these children belong under one
    parent.'
  description: '## The model


    Every request resolves to exactly one **principal** before any handler runs. A
    principal is one of three kinds:


    - **`tailnet`** -- a remote caller whose identity the front door proved. The tsnet
    proxy calls `WhoIs(remoteAddr)` and sets an identity header; the app maps the
    login to a configured human actor.

    - **`owner`** -- a caller arriving on loopback with no run credential. The person
    at the machine. Maps to the configured human.

    - **`run`** -- a dispatched agent, holding a run-scoped credential minted at dispatch.
    Names its run and its task, and is never a human.


    ## What follows from it


    1. **Attribution stops being a claim.** The API keeps accepting an explicit `user`/`actor`
    -- agents and scripts post directly and hold no session, which is 066''s original
    constraint -- but a value that *disagrees* with the resolved principal is refused
    rather than preferred.

    2. **Several humans become possible.** `human_identity`''s MULTIPLE refusal is
    replaced by a per-request answer, which is the thing 064 could not do and explicitly
    deferred to here.

    3. **Capability differs by kind.** A `run` may log, hand off, and close its own
    task. It may never approve a review, dispatch, enable dispatch, create a project,
    or repair the queue. That closes the self-approval chain: today a dispatched agent
    can `POST /tasks/{id}/dispatch` with `{"user": "Jeff Posey"}` and be believed.

    4. **The network boundary shrinks to what identity cannot cover** -- the three
    routes that let the API point at a new directory on the filesystem.


    ## Scope change from the original 066


    This task previously put per-user permissions and roles out of scope: *''This
    is about knowing who acted, not restricting what they may do.''* Point 3 brings
    a **minimal** capability model in scope -- a fixed set per principal *kind*, not
    roles and not per-person grants. The reason is that the audit finding cannot be
    closed without it: knowing that a caller is an agent is useless if an agent may
    still do everything a human may do. Per-person permissions stay out of scope.


    ## The children


    One keystone, then two independent branches, then enforcement, then the two boundary
    tasks. The dependency order is real -- every child needs the principal seam --
    but the branches genuinely parallelise.


    1. **task-329** -- principal resolution (the seam everything hangs off). No dependencies.

    2. **task-330** -- identity registry: several humans, login mapping, retirement.
    Needs 329.

    3. **task-331** -- run principals: the loopback split. Needs 329.

    4. **task-332** -- authorization: capabilities per principal kind. Needs 329,
    330, 331.

    5. **task-244** -- the proxy proves identity; project creation stays off the network.
    Needs 329, 332.

    6. **task-333** -- project exposure, honoured through tasks and run transcripts
    alike. Needs 329, 332.

    7. **task-334** -- dispatch caps bind every trigger, and the design stops overclaiming.
    No dependencies; can run first or alongside anything.


    ## What must not regress


    The dashboard is used from a phone over the tailnet, and the audit''s proposed
    fix would have dark-screened a working surface to close a hole identity closes
    better. The structured dispatch output panel is the canary for the whole epic:
    if a child makes it stop rendering, that child is wrong, not the panel.'
  constraints: '- The log stays append-only. Retiring a person never rewrites their
    history.

    - The API keeps accepting an explicit actor: agents and scripts post directly
    and cannot hold a session. It must *agree* with the resolved principal rather
    than replace it.

    - No silent fallback to a default identity when the acting caller is unclear.
    That is the exact failure 064 removed.

    - Do not weaken validation. An unknown actor stays refused.

    - An identity header is believed only when it arrives by the path the front door
    controls. A header on any other route is ignored, never trusted.

    - Nothing in this epic may make the dashboard worse on a phone. Denying a route
    is a last resort, used only where identity cannot do the job.

    - `push: false` stays. The recoverability argument for unattended merges depends
    on it.'
  out_of_scope: 'Per-person permissions and roles -- capability is per principal *kind*
    only. Passwords, sessions, logout, or an identity provider: the front door does
    authentication and AgentJobs stays out of it. Multi-tenant hosting. Any change
    to what a human may do; owners keep every capability they have today.'
  context:
  - path: audits/2026-08-21/12-security.md
    why: 'Findings S-1, S-6 and S-8: the threat model and the exact anonymous requests
      that work today'
  - path: audits/2026-08-21/10-dispatch.md
    why: 'P1-2: the same door seen from inside a dispatched run, which is what the
      run principal kind closes'
  - path: src/agentjobs/actors.py
    why: human_identity and its MULTIPLE branch are what task-330 replaces
  - path: src/agentjobs/api/routes/tasks.py
    why: 'Lines 96-118: the `user == default_user` review gate that task-332 replaces'
  - path: src/agentjobs/api/routes/dispatch.py
    why: _owned_run at line 478 is the predicate task-333 extends; the run output
      routes at 795-882 are the panel that must not regress
  - path: scripts/tailscale-service-host/main.go
    why: 'The proxy task-244 rewrites: currently NewSingleHostReverseProxy with no
      identity and no filter'
acceptance:
- id: ac-1
  text: Every API request resolves to exactly one principal of kind tailnet, owner
    or run before any handler runs, and the record of an action names which kind acted
    and how the identity was established.
  verify: 'Live, 2026-09-04. Loopback: GET /api/whoami -> {kind: owner, source: loopback,
    describe: ''owner via loopback''}. Through the proxy: {kind: tailnet, source:
    proven_header, login: jposey@hellfiregames.com, describe: ''tailnet (...) via
    proven_header''} over a real tailnet connection. The run kind is minted at dispatch
    (runner.py:1495) and revoked when the run ends, which is why a finished run''s
    directory holds no credential.sha256. The `describe` field is the record naming
    kind and how identity was established.'
  status: met
- id: ac-2
  text: A body user/actor that disagrees with the resolved principal is refused on
    every mutating route, rather than being preferred over it.
  verify: 'docs/authorization.md states the rule per axis: a run may claim only the
    agent id it was dispatched as; a human may claim themselves or any kind:agent
    id, never a different person. Coverage is enforced rather than promised -- tests/test_authorization.py
    walks the application''s own router, filters mutating methods, and fails when
    an endpoint is absent from the table, in both directions so a renamed endpoint
    fails too. tests/test_run_authorization.py adds test_it_may_not_write_as_a_person
    and test_it_may_not_write_as_a_different_agent. Probed live: a tailnet principal
    posting actor ''claude'' is accepted, which is the documented and deliberate case,
    not a hole.'
  status: met
- id: ac-3
  text: A dispatched agent cannot approve a review, dispatch a task, enable dispatch,
    or create a project. Proven by a test that calls the API using a real run's credential,
    not by inspection.
  verify: tests/test_run_authorization.py drives the API through a `dispatched()`
    fixture that mints a real run credential. One test per forbidden act -- test_it_cannot_approve_a_review,
    test_it_cannot_dispatch_a_task, test_it_cannot_enable_dispatch, test_it_cannot_register_or_initialise_a_project
    -- plus repair-the-queue, another task, webhooks and another run's transcript.
    TestARunCanStillWork and TestAnOwnerLosesNothing hold the other side. Green in
    the full gate on merged main, 2026-09-04.
  status: met
- id: ac-4
  text: Several human actors can be configured, each is attributed correctly per request,
    and a retired actor cannot act while their past log entries still resolve.
  verify: 'task-330, all five of its own criteria met with tests: several humans accepted
    and attributed per request rather than per project; one login maps to exactly
    one actor id; an unmapped login is refused naming the login and the file, with
    no fallback to default_user asserted by test; a retired actor cannot act while
    a log written before the retirement still resolves and renders; an existing single-human
    config works unmodified. No-silent-fallback confirmed live -- through the proxy
    the principal resolves with login jposey@hellfiregames.com and actor_id null rather
    than guessing a default. RESIDUAL CLOSED 2026-09-05: ~/.agentjobs/identities.yaml
    now exists (owner Jeff Posey, jposey@hellfiregames.com -> Jeff Posey) and the
    dashboard shows ''Acting as Jeff Posey'' over the tailnet.'
  status: met
- id: ac-5
  text: The structured dispatch output panel -- /runs/*/tail and /runs/*/transcript,
    rendered by DispatchOutput.tsx -- still works from a phone over the tailnet, verified
    against a real run rather than a mock. Any child that dark-screens it has failed.
  verify: 'MET 2026-09-05. Jeff Posey opened the dashboard on his phone over the tailnet
    (https://agentjobs.tailfed1df.ts.net/app/), landed on this task''s page as a proxy-WhoIs''d
    caller, and reported in chat that the phone rendering is valid and readable --
