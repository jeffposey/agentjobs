- id: 36
  ts: '2026-09-05T18:49:11.298474Z'
  actor: claude
  type: decision
  body: 'Two decisions, made with Jeff Posey in chat on 2026-09-05.


    1. One actor id for the person across this machine: ''Jeff Posey''. The identity
    map binds one login to one actor id, and this machine''s projects disagreed --
    agentjobs, job-hunting and mastercalls used ''Jeff Posey'' while fantasyfootball
    and product-strategy used ''jeff''. Resolved by adding ''Jeff Posey'' (kind: human)
    to both of those projects, marking ''jeff'' retired: true, and setting default_user:
    Jeff Posey. Committed in each repo (fantasyfootball 9a91dca, product-strategy
    f0e8179). Rejected alternative: renaming ''jeff'' in place, which would leave
    the one existing ''jeff'' log entry in each project resolving to nothing; retirement
    keeps history resolving, which is what retirement is for. Also rejected: a per-project
    alias in identities.yaml, the residual docs/identity-registry.md names -- one
    rename is cheaper than a new mechanism for one person.


    2. The onboarding gap gets a CLI, not an account system and not a GUI form. Filed
    as task-335 (agentjobs identity list / map / unmap / owner / whoami). Reasoning:
    authentication is Tailscale membership plus the proxy''s WhoIs; AgentJobs holds
    no passwords and should not start. The only missing piece is the login-to-actor
    line, so a command that writes it safely is the whole fix. A dashboard form that
    writes identities.yaml was rejected because every tailnet peer reaches the dashboard,
    and a peer mapping themselves to an actor is exactly the impersonation this epic
    closes; the dashboard keeps a read-only ''Acting as'' indicator only. Per-person
    permission levels were also considered and rejected for now: the capability table
    is keyed by principal kind, per-project membership in actors: is the permission
    model, and with one human user a role system has no customer yet.'
