- id: ac-6
  text: Project creation routes (POST /api/projects/init, POST /api/projects, /api/projects/inspect)
    are unreachable through the proxy and reachable on loopback. No other route is
    denied by path.
  verify: 'Live both directions, 2026-09-04. Through the proxy all three return 403
    with a sentence naming the reason (''is not available through the tailnet; it
    is reachable on this machine''s loopback interface only''). On loopback all three
    reach the application and answer ordinary body validation ({''detail'': ''path:
    Field required''}), so they are reachable rather than denied. GET /api/projects
    stays 200 through the proxy, so the denial is not over-broad. TestTheDenyListIsThreeEntries
    fails if the map grows; TestNothingElseIsDenied walks the ten routes the audit
    wanted denied and asserts each still reaches the application.'
  status: met
- id: ac-7
  text: A project marked not exposed serves neither its tasks nor its run transcripts
    to a remote principal, and both to the owner.
  verify: 'Live, 2026-09-04. job-hunting and product-strategy are marked local-only:
    GET /api/projects/<id>/tasks returns 404 through the proxy and 200 on loopback,
    for both. The exposed agentjobs project returns 200 both ways. The project listing
    is filtered rather than denied -- the proxy sees agentjobs, fantasy-football and
    mastercalls; loopback additionally sees job-hunting and product-strategy. Hidden
    projects answer as absent rather than forbidden, matching _owned_run''s convention.
    task-333 tested the transcript route directly rather than inferring it from the
    task route.'
  status: met
