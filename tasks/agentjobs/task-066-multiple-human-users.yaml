- id: 9
  ts: '2026-09-04T03:31:11.055758Z'
  actor: claude
  type: note
  body: '**How to launch this epic, and why a `posture:` field on this record will
    not do it.**


    I briefly set `posture: autonomous` on this task and then removed it, because
    it does not do what it appears to do and would have been a trap for whoever launched
    the epic.


    `INHERITABLE_POSTURE_SOURCES` in `src/agentjobs/dispatch/epic.py` is `{DISPATCH,
    EPIC}`. `TASK` -- this record''s own `posture:` field -- is deliberately excluded
    (task-316), on the reasoning that it is "a git-tracked value any agent that can
    write the repository can set, and letting it cross would mean one agent editing
    one field on its own parent widens *every* child in the epic at once."


    That is exactly the shape of what I was doing: an agent writing a field on a parent
    record to widen a dozen children''s runs. The exclusion is right and the field
    stays off.


    **So the posture has to be chosen by a person at the moment of dispatch** -- source
    `DISPATCH`, which is the click. With no posture named at dispatch, every child
    falls through to the project default, which is `auto` on this project, and all
    seven would stop at the merge gate waiting for review. That is a safe failure,
    but it is not an overnight run.


    Machine state as of 2026-09-03, for whoever picks this up:


    - `posture=auto`, `max_posture=autonomous` for this project, so `autonomous` is
    permitted but must be asked for.

    - `finish=on`, so an approval runs rebase, gate, merge, rebuild, restart and close
    by itself.

    - `max_concurrent_runs=3`; `run_timeout_seconds` raised from 1800 to 5400 by Jeff
    on 2026-09-03, because 30 minutes is short for children this size.

    - `push=false`, and it stays false. That is the whole recoverability argument
    for letting children merge unreviewed.


    The dependency graph is four layers deep (329 -> 330/331 -> 332 -> 244/333), with
    334 free to run alongside any of it. Three concurrent runs and a single merge
    runway mean the wall-clock floor is roughly the depth, not the count.'
