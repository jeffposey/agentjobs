    assigned every v1 draft it could not derive an ask from a generic ''NEEDS REVIEW:
    finish specifying this task'' prompt, and those four were in fact fully specified.
    No human was actually being waited on.


    This task is different: it was authored on v2, its ball_reason is accurate, and
    its first acceptance criterion is that the storage model for binaries is *decided*
    and recorded, which in a product whose whole premise is diffable YAML in git is
    a genuine architectural question and not one an agent should settle alone. The
    ball is correctly with a human. Promoting it would put a real open design question
    into the claimable pool, where an agent would answer it by default rather than
    by decision.


    To unpark it: answer the design question, record it as a decision entry, then
    promote.'
