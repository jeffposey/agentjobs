- id: 6
  ts: '2026-08-18T03:54:00.042565Z'
  actor: claude
  type: decision
  body: "**Implementation decisions inside the accepted storage model.** The storage\
    \ question was settled on 2026-08-15 and is not reopened here; these are the calls\
    \ that decision left open.\n\n**1. The media type is read from the bytes, never\
    \ from the caller.** `sniff_media_type` matches the PNG/JPEG/WebP magic numbers\
    \ and the declared `Content-Type` is not consulted at all \u2014 the upload model\
    \ has no `media_type` field to send. A declared type is a claim about a blob;\
    \ the magic number *is* the blob. Taking the claim would let a mislabelled file\
    \ be stored with an extension and a served `Content-Type` that disagree with what\
    \ a browser does with it. *Rejected: trust the client and validate the extension*\
    \ \u2014 that validates the label, not the thing.\n\n**2. `attachments` is `Optional[...]\
    \ = None`, not a list defaulting to empty.** `_write_task` dumps with `exclude_none=True`,\
    \ so an entry without images carries no key at all. With `[]` every log entry\
    \ in all 120 existing task files would gain a line on its next write, for a field\
    \ none of them use \u2014 an \"additive\" change that rewrites the corpus is not\
    \ additive in the sense section 9 means. The cost is `entry.attachments or []`\
    \ at read sites, which is cheap and local. Asserted directly: a task written with\
    \ no images contains no `attachments` anywhere in its text.\n\n**3. Blobs are\
    \ written inside the manager verb, not at the API boundary.** `handoff` and `create_task`\
    \ take `AttachmentPayload` (raw bytes) and call storage themselves, so the file\
    \ and the entry citing it are produced by one call and an `AttachmentError` aborts\
    \ the whole verb. *Rejected: have the route write the file and pass finished metadata\
    \ into the manager* \u2014 one line shorter, and it admits two states the decision\
    \ explicitly rules out: a stored file no entry references, and an entry pointing\
    \ at a file that was never written. On creation the write happens after the id\
    \ is allocated, which is why the payload rather than the metadata has to reach\
    \ that far in.\n\n**4. Base64 in the request body, never in the record.** The\
    \ transport needs the bytes inline; the YAML must stay readable. Those are different\
    \ problems and they get different answers, which is worth stating because \"no\
    \ base64\" was the rejected option in the original decision and this is not that.\n\
    \n**5. Serving resolves through the task record.** `GET /tasks/{id}/attachments/{filename}`\
    \ looks the file up among the attachments the task's own log entries reference,\
    \ and 404s otherwise. The route therefore cannot be turned into a general file\
    \ server even if the containment check were wrong, and looking the record up is\
    \ also what supplies the hash it verifies before returning bytes."
  data:
    operation:
      id: e94b2170-6c38-4a5d-b1f2-73d0ac859e16
      kind: log_append
      fingerprint: ce3f8373a9b69719a8f9afc08d0c2b05
- id: 7
  ts: '2026-08-18T03:54:13.013219Z'
  actor: claude
  type: decision
  body: "**Two scope calls, both deliberate.**\n\n**The rejection box gets no paste\
    \ target; Request Changes does.** The spec names \"the review panel's Request\
    \ Changes box, and the Report Issue form\" as the two surfaces, and reject is\
    \ neither. It is also a different act: rejecting closes a task as cancelled, and\
    \ evidence for *why something should stop existing* is a weaker case than evidence\
    \ for *what is wrong with it*. Adding it would have been two lines, which is exactly\
    \ why it is worth saying no on purpose rather than by omission. Trivial to add\
    \ if it turns out to be wanted.\n\n**A test outside this task's surface had to\
    \ be fixed, and it was a real latent bug.** `create-task.spec.ts` reached the\
    \ create form through the dashboard's \"Create task\" call-to-action, which renders\
    \ only while the dashboard is empty. That silently required the file to run before\
    \ every other spec, an ordering nothing enforced. Adding `attach-screenshot.spec.ts`\
    \ \u2014 which sorts alphabetically ahead of it \u2014 broke that assumption,\
    \ and the failure looked like my change breaking task creation rather than a pre-existing\
    \ dependency finally being tripped.\n\nFixed by using the nav link, as `promote-draft.spec.ts`\
    \ already did and had already written the reason for. The entry point is incidental\
    \ to what that test covers (create \u2192 API \u2192 list). *Rejected: rename\
    \ my spec so it sorts last* \u2014 that hides the landmine for whoever adds the\
    \ next spec file, and the diagnosis would have to be made again from scratch."
