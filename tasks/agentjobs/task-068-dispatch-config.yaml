- id: 6
  ts: '2026-08-18T07:06:02.622187Z'
  actor: claude
  type: progress
  body: "Config layer built, verified through the real CLI, merged to main.\n\n**Shipped.**\
    \ `src/agentjobs/dispatch/config.py` (model, loader, four gates, substitution,\
    \ enablement writer), the `agentjobs dispatch enable|disable|config` command group,\
    \ and 39 tests across `tests/test_dispatch_config.py` and `tests/test_dispatch_cli.py`.\
    \ Two commits on `feat/task-068-dispatch-config`, merged `--no-ff` as 7350b75.\
    \ Nothing pushed.\n\n**All five acceptance criteria exercised through the CLI\
    \ against a throwaway `AGENTJOBS_HOME`, not only through tests**: absent file\
    \ reports \"dispatch is off\" rather than erroring; enabling with an undefined\
    \ runner exits 1 naming the known runners; enabling for real then `dispatch config\
    \ --project agentjobs` prints \"permitted\"; `touch DISPATCH_DISABLED` flips the\
    \ same command to \"refused (sentinel)\" with every other setting untouched; `dispatch\
    \ disable` flips it to \"refused (project_not_enabled)\".\n\n**Three decisions\
    \ worth knowing before task-070 reads this file.**\n\n1. *An unknown runner is\
    \ a per-project refusal, not a broken file.* The loader deliberately does **not**\
    \ cross-check `projects.<id>.runner` against `runners:` at parse time. It would\
    \ have been the tidier place for the check, but it makes one bad entry fail the\
    \ whole config and take every other project down with it \u2014 and it collapses\
    \ the distinction sc-2 asks for, since the caller would see `invalid_config` where\
    \ it needs `unknown_runner`. The check lives in `assert_dispatch_permitted`.\n\
    \n2. *The placeholder pattern requires an identifier inside the braces* (`\\{([a-z_][a-z0-9_]*)\\\
    }`), and substitution is a regex sub, never `str.format`. Both because of the\
    \ same collision: task-076's permission allow-list is passed as `--settings {\"\
    permissions\": ...}` JSON, so a runner argv legitimately contains braces. A broad\
    \ pattern would make that unrepresentable and `str.format` would raise on it.\
    \ The narrow pattern still catches `{propmt}` as a config error, which is the\
    \ failure worth catching \u2014 a typo would otherwise reach the agent verbatim\
    \ as part of its instructions. A test pins the JSON case.\n\n3. *Two fields were\
    \ added that section 3's config sample does not show*, both settled after it was\
    \ written: `runners.<name>.mode` (`session`|`batch`, task-077) and `projects.<id>.posture`\
    \ (`read_only`|`supervised`|`autonomous`, task-076). `mode` defaults to `batch`\
    \ and `posture` to `supervised`. Defaulting `mode` to batch keeps section 3's\
    \ own example \u2014 whose argv is `claude -p {prompt}` \u2014 meaning what it\
    \ looks like. Rejected: leaving both out and making task-070 extend the loader,\
    \ which would have put a security-relevant field into the file after the file\
    \ already existed on disk.\n\n**Also deliberate:** `set_project_enabled` edits\
    \ the raw YAML mapping rather than round-tripping through the dataclasses, so\
    \ keys this build does not understand survive a write. Comments do not \u2014\
    \ `yaml.safe_dump` loses them, and that is a known cost, not an oversight.\n\n\
    **Two pre-existing test failures, not caused by this work, verified red on `main`\
    \ at 6f07340 before any of it was written.** Stated here because the next agent\
    \ will see them and wonder.\n\n- `tests/test_validate.py::TestRealCorpus::test_the_tolerated_drift_is_only_taxonomy_and_serialization`\
    \ \u2014 the real corpus now emits an `absolute-path` finding, which the tolerated\
    \ set does not include. Source is `tasks/agentjobs/task-146-embed-reference-integration.yaml`,\
    \ which carries a `C:`-rooted path.\n- `tests/test_task_corpus.py::test_agentjobs_context_paths_exist`\
    \ \u2014 a task points at a context path that does not exist. In the shared clone\
    \ it is task-017 naming `src/agentjobs/models.py`; in a worktree it is additionally\
    \ task-013 naming `src/agentjobs/frontend_dist/assets`, which is a gitignored\
    \ build artifact and therefore absent from every worktree and every fresh clone.\n\
    \nThe second one means **`scripts/check.py` cannot currently pass in a worktree**,\
    \ which matters for a chain of tasks whose workflow requires worktrees. Not fixed\
    \ here and no task filed, because neither is in this task's scope and filing is\
    \ Jeff's call.\n\nEverything else is green: 1506 passed."
