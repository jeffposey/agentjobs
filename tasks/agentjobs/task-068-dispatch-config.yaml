spec:
  summary: 'The config surface for agent dispatch, with no spawning. Defines ~/.agentjobs/dispatch.yaml
    -- runners (argv templates), per-project enablement, limits -- plus argv substitution
    and the master switch. Machine-local by design: if runners lived in the versioned
    project config, cloning any repository would carry a ''run this command on my
    machine'' payload. Design section 3 and section 6 gate 2.'
  description: 'First of seven tasks derived from docs/agent-dispatch-design.md. Builds
    the configuration layer only, so it is fully testable without starting a process.


    ## Scope


    - A model and loader for `~/.agentjobs/dispatch.yaml` (schema in design section
    3), located via the same `AGENTJOBS_HOME` override `projects.py` already uses,
    so tests never touch a real home directory.

    - Runner resolution: given a project id, produce the runner to use, or a typed
    error naming why not (no config, master switch off, project not enabled, unknown
    runner).

    - Argv substitution for `{prompt}`, `{task_id}`, `{project_id}`, `{project_root}`,
    `{run_id}`, `{agent}`, `{api_base}`. **Per argv element, literal, no shell.**
    Substitution never produces a shell string; there is no `shell=True` anywhere
    in this subsystem.

    - The master switch (`enabled:`) and the `~/.agentjobs/DISPATCH_DISABLED` sentinel
    check, exposed as one `assert_dispatch_permitted(project_id)` call the later tasks
    use.

    - `agentjobs dispatch enable|disable <project>` and `agentjobs dispatch config`
    (show resolved configuration).


    ## Not in scope


    Spawning anything. No subprocess in this task.


    ## Why it is first


    Every refusal path in the design is a config question. Getting the refusals right
    and tested before any process can start means the later tasks are adding capability
    to a system that already knows how to say no.'
  context: []
