  type: note
  body: 'Re-encoded: draft / human / spec was the wrong vocabulary for what was meant.


    These seven were created `draft` with the ball on Jeff and `ball_reason: spec`,
    carrying a prompt saying ''do not start until the task-060 design is approved''.
    But `spec` means *this task is not finished being specified and a human must finish
    writing it*. That was not true of any of them -- they were fully specified and
    merely gated. The effect was that all seven were unreachable: not claimable, and
    sitting in the human inbox asking for work that was already done.


    The gate was a dependency all along. `get_next_task()` returns only `ready` tasks
    with no unmet `needs` dependencies, so the correct encoding was `ready` with a
    `needs` edge to task-060 -- which would have gated them exactly as intended and
    then released them automatically the moment 060 closed. Corrected to that now;
    task-060 is closed, so they are claimable.


    Recorded rather than quietly fixed because it is a lesson about the schema''s
    own vocabulary: `ball_reason` says *why a person is holding this*, and ''because
    I said so earlier'' is not one of the reasons. Sequencing belongs in `dependencies[]`,
    not in the ball.'
  data: {}
