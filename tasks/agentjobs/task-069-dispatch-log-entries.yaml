spec:
  summary: 'Two new LogEntryType values so a dispatch is a durable, git-tracked fact
    on the task rather than machine-local state: `dispatch` (who authorized, what
    argv ran, against which commit) and `dispatch_result` (how it ended). Also reserves
    the `dispatcher` actor id and adds the derived dispatch count. Design section
    3.'
  description: 'Derived from docs/agent-dispatch-design.md section 3.


    ## Scope


    - Add `dispatch` and `dispatch_result` to `LogEntryType` with their `data` payloads
    documented (design section 3 shows both).

    - Reserve a `dispatcher` actor id. `validate_actor` checks against the project''s
    configured vocabulary, and the dispatcher must be able to write the forced ball
    moves in design section 9 without every project having to add it to `actors:`
    by hand.

    - A derived `Task.dispatch_count` (and `dispatches_since(ts)`) that counts `dispatch`
    log entries. **No stored counter field** -- the count is derived so it cannot
    drift from the evidence for it, and so it needs no migration.

    - Update docs/task-schema.md and the LinkML schema in `schema/` so the generated
    reference does not drift.


    ## Why this is a schema change and that is fine


    This project decided (schema-design section 9) to make schema changes cheap rather
    than route around them. Encoding dispatch as `type: note` with a magic `data`
    key would be exactly the ''documented but unenforced'' shape v2 was built to remove.'
  constraints: '- Additive only. Old task files stay valid and no schema version bump
    is involved (evolution policy, docs/schema-design.md section 9).

    - Both entry types are manager-written, never postable by a caller -- the same
    rule `transition` already has, for the same reason: an entry that does not accompany
    a real event is a lie in an append-only record.

    - The dispatch entry records what actually ran: authorising actor, resolved argv,
    and the commit the working tree was on. A record that cannot answer ''what ran,
    against what'' is not worth writing.'
  out_of_scope: Writing either entry from a real run -- that is task-070. This task
    defines the types, their payloads, and the manager methods that append them.
  context:
  - path: docs/agent-dispatch-design.md
    why: Section 3, 'The task-side record' -- the fields each entry carries.
  - path: src/agentjobs/models_v2.py
    why: 'LogEntryType and LogEntry. See how `attachments` was added additively in
      task-067: Optional and absent, so existing files do not all change.'
  - path: docs/task-schema.md
    why: The log[] section, which this extends rather than contradicts.
