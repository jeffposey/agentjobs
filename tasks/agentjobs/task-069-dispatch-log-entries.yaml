- id: 7
  ts: '2026-08-18T07:38:46.615051Z'
  actor: claude
  type: progress
  body: "Two log entry types, validated payloads, reserved dispatcher actor, derived\
    \ count. Merged to main.\n\n**Shipped.** Three commits on `feat/task-069-dispatch-log-entries`,\
    \ merged `--no-ff`: the regen-script fix, the schema change, and the regenerated\
    \ artifacts in their own commit. 25 new tests in `tests/test_dispatch_log_entries.py`.\
    \ Nothing pushed.\n\n**Verified against a real server, not only the suite.** A\
    \ sandbox server on port 8899 over a throwaway tasks directory: `POST /api/tasks/<id>/log`\
    \ with `type: dispatch` and with `type: dispatch_result` both return **409 invalid_transition**\
    \ naming the rule. `record_dispatch` then wrote a real entry whose argv contained\
    \ `read the record; rm -rf /`, and the YAML on disk keeps it as exactly one list\
    \ element. `dispatcher` was accepted as the actor on `dispatch_result` in a project\
    \ whose config lists only `Jeff Posey` and `claude`. `GET /api/tasks/<id>` serves\
    \ all three entries with their types intact. Server stopped afterwards.\n\n**sc-4\
    \ now means something.** `scripts/regen-schema-docs.sh` validated the live corpus\
    \ against `agentjobs-v1.yaml` while every task file carries `schema: 2` \u2014\
    \ it reported \"143 passed\" against a schema none of them claim, so it could\
    \ not have failed. Pointed at `$V2` (log entry 1 called this out on 2026-08-11);\
    \ the corpus validates 143/143 against v2, and that number is now load-bearing.\n\
    \n**Four decisions.**\n\n1. *The payloads are validated, not merely documented.*\
    \ `DispatchData` and `DispatchResultData` are strict models checked by a validator\
    \ on `LogEntry` itself, so a hand-edited or hand-migrated file cannot carry a\
    \ dispatch entry with nothing in it. Rejected: validating only inside the manager\
    \ methods that write them. That is the lighter change and it leaves the record's\
    \ one job \u2014 being trustworthy after the machine-local run directory is gone\
    \ \u2014 resting on the write path having been the only one. An entry that cannot\
    \ say what ran is worse than no entry, because it looks like evidence.\n\n2. *`MANAGER_WRITTEN_LOG_TYPES`\
    \ replaces two hand-maintained lists.* The manager checked `is LogEntryType.TRANSITION`;\
    \ the MCP layer carried a literal list of postable types. Both would have needed\
    \ editing here, independently, and one of them would eventually not be. `AUTHORED_LOG_TYPES`\
    \ is now derived from the model. Rejected: adding two more literals, which is\
    \ smaller and reintroduces the drift the constraint was written to prevent.\n\n\
    3. *`dispatcher` is reserved but deliberately kept out of `load_actors`.* Merging\
    \ it into the configured vocabulary looked cleaner and would have broken an unconfigured\
    \ project outright: `validate_actor` accepts any id when config defines no actors\
    \ at all, and a vocabulary that always contains `dispatcher` is never empty, so\
    \ a fresh `agentjobs init` would have rejected every real actor. `reserved_actors()`\
    \ exposes the record for a UI that needs to resolve its kind. A reserved id is\
    \ also not a choice \u2014 nobody may act as it \u2014 so it should not appear\
    \ in a picker. A test pins the unconfigured-project case, since that is the failure\
    \ that would have shipped.\n\n4. *Three fields beyond the design's section 3 sample*:\
    \ `mode` and `posture` on the dispatch payload (task-077 and task-076, both decided\
    \ after that sample was written) and `session_id`, optional because `--bg` assigns\
    \ the id itself and the dispatcher captures it after spawning. Without `mode`\
    \ and `posture` the record cannot say what the run was allowed to do, which is\
    \ the question the entry exists to answer.\n\n**Note for task-070.** The manager\
    \ methods are `record_dispatch(...)` and `record_dispatch_result(...)`; both take\
    \ an `operation_id` and replay idempotently, so a supervisor that retries after\
    \ a timeout cannot double-count a dispatch. `exclude_none=True` on the payload\
    \ dump means an absent optional is absent from the YAML rather than present and\
    \ null.\n\n**Pre-existing failures unchanged**, both red on `main` before this\
    \ branch: `test_agentjobs_context_paths_exist` and the corpus `absolute-path`\
    \ finding in `test_the_tolerated_drift_is_only_taxonomy_and_serialization`. Detail\
    \ is in task-068 log entry 6. Everything else green: 1531 passed, and `npm run\
    \ check` passes in full including the generated-client cleanliness check and all\
    \ 10 Playwright paths."
