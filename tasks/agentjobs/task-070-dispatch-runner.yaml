  - path: src/agentjobs/webhooks.py
    why: The shape to avoid. Read `_dispatch` and task-047 before choosing how the
      batch supervisor runs.
  - path: src/agentjobs/manager.py
    why: Where the dispatch and dispatch_result entries get appended from.
acceptance:
- id: sc-1
  text: Session mode spawns a real background session, captures the CLI-assigned id
    from stdout, and records both run id and session id on the task
  status: pending
- id: sc-2
  text: A session that parks on a permission prompt is detected from `claude agents
    --json` and moves the ball to human/input with the pending command quoted in the
    ball_prompt
  status: pending
- id: sc-3
  text: A finished session is reaped rather than left holding a pid, and a session
    idle past the staleness threshold with an unmoved ball becomes finished_without_handoff
    without being killed
  status: pending
- id: sc-4
  text: 'Batch mode writes exactly one dispatch_result on every terminating path:
    exit 0, non-zero exit, timeout, and an exception injected into the supervisor
    itself'
  status: pending
- id: sc-5
  text: The batch wall-clock timeout terminates the whole process group; a grandchild
    spawned by the fake runner is gone afterwards, verified on Windows
  status: pending
- id: sc-6
  text: Emitted allow-list rules are asserted to use the `Tool(prefix:*)` colon form,
    so a silently-matching-nothing rule fails a test rather than a run
  status: pending
- id: sc-7
  text: No asyncio task, and no code path where an exception is logged and swallowed
    without a task-visible record -- the task-047 shape
  status: pending
