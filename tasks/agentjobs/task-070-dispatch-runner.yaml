log:
- id: 1
  ts: '2026-08-11T01:43:19.022663Z'
  actor: claude
  type: note
  body: 'Re-encoded: draft / human / spec was the wrong vocabulary for what was meant.


    These seven were created `draft` with the ball on Jeff and `ball_reason: spec`,
    carrying a prompt saying ''do not start until the task-060 design is approved''.
    But `spec` means *this task is not finished being specified and a human must finish
    writing it*. That was not true of any of them -- they were fully specified and
    merely gated. The effect was that all seven were unreachable: not claimable, and
    sitting in the human inbox asking for work that was already done.


    The gate was a dependency all along. `get_next_task()` returns only `ready` tasks
    with no unmet `needs` dependencies, so the correct encoding was `ready` with a
    `needs` edge to task-060 -- which would have gated them exactly as intended and
    then released them automatically the moment 060 closed. Corrected to that now;
    task-060 is closed, so they are claimable.


    Recorded rather than quietly fixed because it is a lesson about the schema''s
    own vocabulary: `ball_reason` says *why a person is holding this*, and ''because
    I said so earlier'' is not one of the reasons. Sequencing belongs in `dependencies[]`,
    not in the ball.'
  data: {}
- id: 2
  ts: '2026-08-18T05:34:27.153991Z'
  actor: Jeff Posey
  type: instruction
  body: "**How the overnight kickoff of the dispatch chain is to be sequenced. From\
    \ Jeff, 2026-08-18.** Recorded here rather than left in chat because it is an\
    \ ordering constraint on the parent loop, and ALLAGENTS requires a required order\
    \ to be durable.\n\n## The instruction\n\nPosture stays `supervised` throughout\
    \ (see task-076's decision entry). What varies is **dispatch order, not permissions**:\n\
    \n> Front-load the children that are most likely to need supervision, while Jeff\
    \ is still awake and reachable. Move on to the more autonomous-safe work later\
    \ in the night.\n\nHe will be available for a while after kickoff. He **may or\
    \ may not** signal before signing off.\n\n## The default when he goes unreachable\n\
    \n**Parked runs stay parked.** The night is lost rather than the authorization.\n\
    \nExplicitly rejected, and not to be built: an auto-escalation that promotes a\
    \ parked run to `autonomous` after N minutes of no human response. That grants\
    \ bypass permissions with no human present \u2014 the precise failure task-076\
    \ exists to prevent \u2014 and it violates design \xA72, which requires every\
    \ dispatch to trace to a human act. A timeout is not a human act.\n\n## The signal\
    \ that changes it\n\nOne message from Jeff before sleeping \u2014 in substance,\
    \ \"going down, autonomous from here\" \u2014 authorizes the remainder of the\
    \ chain to run under the `autonomous` posture. That message *is* the human act,\
    \ so \xA72 holds. Absent it, `supervised` stands and parking is the correct outcome.\n\
    \n## Consequence to plan around\n\nA child that parks after Jeff is asleep contributes\
    \ nothing until morning either way. So the value of this sequencing is entirely\
    \ in the front-loading: the ordering choice is what buys the night, not the posture."
