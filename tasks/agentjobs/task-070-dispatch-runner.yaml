- id: 7
  ts: '2026-08-18T08:19:42.004393Z'
  actor: claude
  type: progress
  body: "Both modes built, verified against a **live** Claude Code session, merged\
    \ to main.\n\n`src/agentjobs/dispatch/runner.py` + 47 tests. One commit, merged\
    \ `--no-ff`. Nothing pushed.\n\n## The live verification, because a passing suite\
    \ is not evidence here\n\nThrowaway git repo under `C:/ai/scratch`, throwaway\
    \ AgentJobs home, real `claude` 2.1.228, driven through the shipped `DispatchRunner`\
    \ rather than a reimplementation. The session was started `--bg --remote-control`\
    \ under `supervised`, given a command deliberately outside the allow-list (`npx\
    \ --yes cowsay hello`), and **it parked**. Polling classified it `parked` from\
    \ `claude agents --json`, and the ball moved to `human`/`input` written by `dispatcher`,\
    \ with this prompt:\n\n> Dispatched session `9f8876fe` is parked on a permission\
    \ prompt and will wait indefinitely. Answer it at https://claude.ai/code/session_01H5EK\u2026\
    \ \u2014 that link works from a phone. Or attach locally with `claude attach 9f8876fe`.\n\
    \nfollowed by the readable transcript tail showing the actual dialog: *\"This\
    \ command requires approval / Do you want to proceed? / 1. Yes / 2. Yes, and don't\
    \ ask again for: npx * / 3. No\"*. Log ended `[transition claude, dispatch Jeff\
    \ Posey, handoff dispatcher]`. Sessions stopped and `claude rm`'d, sandbox deleted,\
    \ `claude agents --json --all` reports nothing left behind.\n\n## Three bugs that\
    \ only the live run could find\n\nEvery one of them passed 39 unit tests first.\
    \ Worth stating plainly, because it is the argument for the acceptance criteria\
    \ being written the way they were.\n\n1. **`Popen([\"claude\", ...])` fails on\
    \ Windows with `WinError 2`.** `claude` is a `.CMD` shim, and without a shell\
    \ nothing resolves PATHEXT. The obvious fix is `shell=True`, which is exactly\
    \ what this subsystem refuses \u2014 it would turn a prompt full of quotes and\
    \ semicolons into a command string. So `resolve_executable()` does the PATHEXT\
    \ lookup explicitly and argv stays a list all the way to `CreateProcess`. Unit\
    \ tests never caught it because fake runners spawn as `sys.executable`, an absolute\
    \ path.\n\n2. **`text=True` decodes with the locale codepage**, cp1252 here, and\
    \ a real transcript is full of box-drawing. The `UnicodeDecodeError` is raised\
    \ *inside subprocess's reader thread*, where it does not propagate \u2014 it surfaces\
    \ as `stdout` being `None` several frames away. Every subprocess call now passes\
    \ `encoding=\"utf-8\", errors=\"replace\"`.\n\n3. **The first working handoff\
    \ was correct and useless.** It carried the raw ANSI dump: escape codes, a splash\
    \ screen, release notes, and the permission dialog nowhere in the last 40 lines.\
    \ `readable_tail()` strips escapes and frame-only lines, and the prompt now leads\
    \ with the Remote Control URL \u2014 the one thing a person holding a phone can\
    \ act on.\n\n## Decisions\n\n**The operator's argv owns the executable and the\
    \ mode flags; AgentJobs owns the posture flags.** Design section 4 says posture\
    \ is not the operator's business, and mode flags plainly are (a non-Claude CLI\
    \ needs different ones). So `compose_argv` splices posture flags in immediately\
    \ before the prompt element. Rejected: putting posture in the config file, which\
    \ is where a reader would look for it and precisely where section 4 says it must\
    \ not be, because it then gets chosen by whoever copies the example first.\n\n\
    **The Remote Control URL is extracted from the transcript with a regex, which\
    \ is a knowing exception to \"do not parse `claude logs`.\"** The constraint exists\
    \ so that *state* is never inferred from a terminal rendering, and it is not:\
    \ every phase decision reads the ledger. But the URL appears only in the transcript\
    \ \u2014 the design flagged this and left it to this task \u2014 and without it\
    \ a parked session hands someone a problem with no way to reach it from the device\
    \ they are on. One self-describing URL, no control flow depends on the match.\
    \ Rejected: linking to `claude attach` alone, which is correct and only works\
    \ at the keyboard, defeating the reason session mode was chosen.\n\n**A stale\
    \ session is reported but not stopped; a completed one is reaped.** Section 9\
    \ says both \u2014 \"reaping is AgentJobs' job\", and a stale session \"is not\
    \ killed and remains attachable\". Those pull opposite ways, resolved by outcome:\
    \ `completed` (the ball moved, the work concluded) reaps; `finished_without_handoff`\
    \ does not, and the pid leak is the accepted price of leaving it attachable.\n\
    \n**`idle`/`blocked` is finished, not parked.** It is a session that ended after\
    \ a denial. Reading it as parked would hand a human a question nobody is waiting\
    \ on an answer to.\n\n**An unrecognised `status`/`state` pair means running.**\
    \ Declaring a live run finished writes a terminal entry for a session that then\
    \ keeps working, which is worse than polling one that has stopped.\n\n## What\
    \ this task did not build, on purpose\n\nStartup reconciliation (design section\
    \ 9: batch survivors become `interrupted`, sessions re-attach) reads the run ledger,\
    \ and the ledger is task-072. `poll_session` decides but does not loop \u2014\
    \ whatever schedules polling belongs with 072 as well. The HTTP endpoint and its\
    \ guards are 071.\n\n**One caveat for 072/073:** `RunHandle` is in-memory. A restart\
    \ loses the handles but not the runs \u2014 every fact needed to rebuild one is\
    \ in `~/.agentjobs/runs/<run_id>/meta.yaml` (task id, session id, dispatch entry\
    \ id, argv, started_at). Reconstructing handles from those files is what reconciliation\
    \ will be.\n\nFull suite: 1578 passed. The two pre-existing failures described\
    \ in task-068 log entry 6 are unchanged."
  data:
    operation:
      id: 3c4d5e6f-7081-4c9d-aebf-2a3b4c5d6e7f
      kind: log_append
      fingerprint: 9b2512b8197631deed4579ca100d1e60
