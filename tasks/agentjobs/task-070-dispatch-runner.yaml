spec:
  summary: 'Actually start an agent: spawn the resolved argv in the project root,
    stream output to a run directory, and supervise it from a dedicated blocking thread
    that is guaranteed to write a terminal dispatch_result on every path -- including
    when the supervisor itself raises. Explicitly not the detached asyncio shape that
    hid the webhook NameError for months (task-047). Design section 9.'
  description: 'Derived from docs/agent-dispatch-design.md section 9.


    ## Scope


    - Spawn with `subprocess.Popen`, cwd = project root, process group (`CREATE_NEW_PROCESS_GROUP`
    on Windows, `start_new_session` on POSIX) so an agent that shells out to pytest
    does not leave it behind.

    - The three-line prompt stub from design section 4. **Compose nothing else** --
    the resumption contract already guarantees the record is sufficient.

    - Stream stdout/stderr to `~/.agentjobs/runs/<run_id>/`, to disk not memory: the
    interesting case is a crash, and a buffer loses exactly that.

    - One supervisor thread per run, blocking on `wait()`, whose body is wrapped so
    a terminal `dispatch_result` is written on **every** exit path, with `outcome:
    crashed` plus traceback if the supervisor itself raises.

    - Write the run directory and meta.yaml (`status: starting`) **before** Popen,
    so a supervisor that dies mid-spawn still leaves a row.

    - The outcome vocabulary from design section 9, including `finished_without_handoff`:
    exit 0 with an unmoved ball is a failure, because the agent stopped without stating
    what it needs.

    - Wall-clock timeout (default 1800s) terminating the process group.


    ## Verification that matters


    A passing suite is not evidence here. Test with a fake runner script that exits
    non-zero, one that hangs past the timeout, one that emits megabytes, and one that
    spawns a grandchild -- and assert a terminal log entry exists in every case. Windows
    is the reference platform, not the port.'
  constraints: '- One blocking supervisor thread per run, **guaranteed** to write
    a terminal `dispatch_result` on every exit path including its own exception.

    - Explicitly not the detached-asyncio shape used by `WebhookManager._dispatch`.
    A NameError in that shape stayed invisible for months (task-047). A supervisor
    that dies silently is worse than none.

    - The run directory and its meta file are written **before** Popen, so a supervisor
    that dies mid-spawn still leaves a row someone can find.

    - Output is streamed to disk, never buffered in memory.

    - Exit 0 with an unmoved ball counts as a failure: the agent stopped without saying
    what it needs.'
  out_of_scope: The HTTP endpoint and its guards (task-071), the run ledger and cancellation
    (task-072), and the UI (task-073). This task can be exercised from a Python call
    or a test.
  context:
  - path: docs/agent-dispatch-design.md
    why: Section 9, process lifecycle -- supervisor, output, outcomes.
  - path: src/agentjobs/webhooks.py
    why: The shape to avoid. Read `_dispatch` and task-047 before choosing how the
      supervisor runs.
  - path: src/agentjobs/manager.py
    why: Where the dispatch and dispatch_result entries get appended from.
