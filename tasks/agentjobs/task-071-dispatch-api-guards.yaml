- id: 6
  ts: '2026-08-18T08:44:28.036789Z'
  actor: claude
  type: progress
  body: "Guard layer, endpoint and CLI built; the whole loop verified against a running\
    \ server; merged to main.\n\nThree commits on `feat/task-071-dispatch-api-guards`,\
    \ merged `--no-ff`. 30 new tests across `tests/test_dispatch_guards.py` and `tests/test_dispatch_api.py`,\
    \ plus three in the CLI suite. Nothing pushed.\n\n## Verified live, over HTTP,\
    \ against `agentjobs serve` on 8899\n\nA throwaway project, a runner that just\
    \ prints. In order:\n\n1. Agent handoff as the newest entry \u2192 `POST .../dispatch`\
    \ returns **403 `not_human_clocked`**, suggested action *\"Act on the task yourself,\
    \ then dispatch. This rule is not configurable.\"*\n2. Human note appended \u2192\
    \ same request returns **202**.\n3. The task's log afterwards, which is the whole\
    \ feature in six lines: `4 note Jeff Posey` \u2192 `5 transition fake` (the claim,\
    \ before anything spawned) \u2192 `6 dispatch Jeff Posey` carrying `git_head bb0f668`\
    \ \u2192 `7 dispatch_result dispatcher finished_without_handoff` \u2192 `8 handoff\
    \ dispatcher`, ball on `human`/`decision`.\n4. `touch DISPATCH_DISABLED` \u2192\
    \ the next attempt returns **`sentinel`**.\n\nEntry 7 is worth pausing on: the\
    \ fake runner exited 0 and never moved the ball, and that is correctly reported\
    \ as a failure rather than a success. Sandbox and its registry entry removed afterwards.\n\
    \n## Decisions\n\n**An unconfigured actor is refused rather than assumed human.**\
    \ Stricter than `validate_actor`, which accepts any id on a project that has configured\
    \ none. That leniency is right for writing a note on a fresh `agentjobs init`\
    \ and wrong here: \"we do not know who this is\" must not be able to start a process\
    \ on someone's machine. Rejected: reusing `validate_actor` unchanged, which would\
    \ have made an unconfigured project's every actor implicitly authorised to dispatch.\n\
    \n**The request body has no `actor` field.** The recorded actor is the author\
    \ of the causing entry, never the poster. A caller naming a human would satisfy\
    \ the rule by assertion, which is not evidence of anything. A test posts `{\"\
    actor\": \"Jeff Posey\"}` on an agent-caused task and still gets 403.\n\n**403\
    \ for the human-clocked rule, 409 for everything else.** No retry turns an agent's\
    \ handoff into a human act; every other refusal describes a state of the world\
    \ that could change. A caller that cannot tell those apart will retry the one\
    \ that can never succeed.\n\n**The per-task run lock from design section 8 is\
    \ not built here.** Claim-before-spawn already makes the ready-task race safe\
    \ \u2014 verified with two threads on a barrier, exactly one run, the loser refused\
    \ \u2014 and for an already-active task the live-run scan covers it. The `O_CREAT|O_EXCL`\
    \ lockfile the design specifies is genuinely better, and it needs something that\
    \ knows when a run *ends* to release it. That is the ledger, which is task-072.\
    \ Recorded rather than silently skipped: if 072 does not add it, this stays a\
    \ narrow window where two dispatches of the same active task could both pass the\
    \ scan.\n\n## Two findings from the live run, neither in scope here\n\n1. **`require_clean_tree`\
    \ will refuse dispatch on any project that has not gitignored AgentJobs' own runtime\
    \ files.** Serving a project writes `.agentjobs/webhooks.yaml`; the manager writes\
    \ `.agentjobs/write-receipts/` and the task YAML itself. This repository ignores\
    \ all of them, so it is fine \u2014 but `agentjobs init`'s `_ensure_gitignore`\
    \ only adds `.agentjobs/agentjobs.db`, so a newly initialised project will look\
    \ permanently dirty and dispatch will refuse it with no obvious cause. Both test\
    \ fixtures had to ignore these paths before anything could be dispatched, which\
    \ is how it was found.\n\n2. **The runner's *name* doubles as the claiming agent\
    \ id.** `_claim_or_verify` claims as `resolution.runner.name`, so a runner named\
    \ `fake` produced `owner: fake` \u2014 an actor the project does not configure.\
    \ It works because `claim_task` does not validate the owner, but it means a runner\
    \ should be named for the agent it starts (`claude`, `codex`), and nothing currently\
    \ says so or checks it. Worth a line in the config docs or a validation in task-068's\
    \ loader.\n\nFull suite: 1608 passed, with the two pre-existing failures from\
    \ task-068 log entry 6 unchanged. `npm run check` passes in full, including the\
    \ generated-client cleanliness check and all 10 Playwright paths."
