spec:
  summary: 'POST /api/tasks/{id}/dispatch, and the preconditions that make it safe:
    the human-clocked rule (a dispatch may only be caused by a log entry whose actor
    is a human), clean working tree, claim-before-spawn, and the always-on safety
    limits. This is where the design''s load-bearing rule becomes one checkable function.
    Design sections 2, 5, 6 and 8.'
  description: 'Derived from docs/agent-dispatch-design.md sections 2, 5, 6 and 8.


    ## The rule this task implements


    > A dispatch may only be caused by a log entry whose actor is a human.


    Resolve the causing log entry, look its actor up in the project''s actor vocabulary,
    refuse unless `kind == human`. That single precondition is what makes an unbounded
    agent-to-agent loop structurally impossible rather than merely capped, so it should
    be one function with its own tests, not a condition spread across call sites.


    ## Scope


    - `POST /api/tasks/{id}/dispatch` and `agentjobs dispatch run <task-id>`.

    - Preconditions, each with a distinct typed refusal: dispatch not permitted (task-068),
    causing actor not human, working tree dirty (`require_clean_tree`), task already
    has a live run, machine at its concurrency limit, task closed.

    - **Claim before spawn.** If the task is `ready`, `claim_task` runs first under
    task-055''s lock; losing the claim costs a rejected HTTP request rather than a
    wasted model call. Re-dispatch of an already-active task verifies the owner instead
    of claiming.

    - Record `git_head` in the dispatch entry so the diff attributable to a run is
    recoverable.

    - **Refuse rather than queue** at the concurrency limit: a queue turns a click
    into a promise to spend money at a moment nobody is watching.


    ## Not in scope


    The per-task budget caps and cooldown -- those bind auto-dispatch only (decision
    D3) and belong to task-074.'
  constraints: '- **The human-clocked rule (D4) is binding and is not a configuration
    option.** A dispatch may only be caused by a log entry whose actor is a human.
    An agent handoff never causes a dispatch, in any mode. That is what makes the
    agent-finishes-agent-starts loop structurally impossible rather than merely capped.

    - Claim before spawn, so losing a race costs a rejected HTTP request rather than
    a wasted model call.

    - The `DISPATCH_DISABLED` sentinel is checked immediately before every spawn,
    not once at startup.

    - A refused dispatch names the specific gate that refused it.'
  out_of_scope: Auto-dispatch on approval (task-074) and the UI (task-073). Dispatch
    stays a distinct action from Approve; do not merge them.
  context:
