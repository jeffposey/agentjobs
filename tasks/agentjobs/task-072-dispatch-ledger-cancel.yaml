    why: The lock primitive from task-055 that the run lock should reuse.
acceptance:
- id: sc-1
  text: dispatch status lists live and recent runs with task, agent, mode, run id,
    session id where applicable, elapsed time and outcome
  status: met
- id: sc-2
  text: Cancelling a batch run terminates the whole process group after the grace
    period and writes outcome cancelled to the task
  status: met
- id: sc-3
  text: Cancelling a session run calls claude stop and writes outcome cancelled, without
    managing process groups itself
  status: met
- id: sc-4
  text: dispatch stop both writes the sentinel and stops live runs in both modes;
    a dispatch attempted immediately afterwards is refused
  status: met
- id: sc-5
  text: A batch run killed without its supervisor (simulate a hard crash) is found
    at next startup, marked interrupted on the task, and moves the ball to human --
    it does not disappear silently
  status: met
- id: sc-6
  text: After a server restart, a still-live session is re-attached and left running
    rather than cancelled or marked interrupted; a recorded session absent from claude
    agents --json gets a terminal entry
  status: met
- id: sc-7
  text: A finished session is reaped, and a reap blocked by uncommitted changes in
    its worktree surfaces that reason rather than being forced or silently skipped
  status: met
- id: sc-8
  text: Two dispatches of the same task cannot both hold the run lock, and a stale
    lock produces a timeout error naming it rather than hanging
  status: met
