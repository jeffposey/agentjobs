- id: 7
  ts: '2026-08-18T09:00:00.400712Z'
  actor: claude
  type: progress
  body: "Ledger, cancellation, run lock, reaping and startup reconciliation. Merged\
    \ to main.\n\nTwo commits on `feat/task-072-dispatch-ledger-cancel`, merged `--no-ff`.\
    \ 31 new tests in `tests/test_dispatch_lifecycle.py`. Nothing pushed.\n\n## The\
    \ crash path, verified as a real crash\n\nA throwaway home with a run directory\
    \ left at `status: running` and no supervisor anywhere \u2014 which is exactly\
    \ what a hard kill leaves behind. Started a real `agentjobs serve` on 8898; its\
    \ startup printed `Dispatch reconcile run_crashed: batch run marked interrupted`,\
    \ and `GET /api/projects/aj072/tasks/task-001` then showed `3 dispatch` \u2192\
    \ `4 dispatch_result dispatcher interrupted` \u2192 `5 handoff dispatcher`, ball\
    \ on `human`/`decision`. `agentjobs dispatch status` listed it; `agentjobs dispatch\
    \ stop` armed the sentinel and reported nothing live. Sandbox removed.\n\nThat\
    \ is sc-5 done the way it was written \u2014 \"simulate a hard crash\" \u2014\
    \ rather than by calling `reconcile()` in a test and trusting that a server would\
    \ too.\n\n## Decisions\n\n**Reconciliation runs from the server's lifespan hook,\
    \ and its failures are never fatal.** A server that refuses to start because it\
    \ could not tidy up is worse than one that starts with the tidying undone: the\
    \ run directories are still on disk and the next start will find them. Rejected:\
    \ raising out of startup, which would turn a missing `claude` binary into an unbootable\
    \ server.\n\n**Not being able to read the session ledger leaves sessions alone.**\
    \ `_session` raises `LedgerError` rather than letting an `OSError` escape, and\
    \ reconciliation treats a failed lookup as *unknown*, not as *dead*. Writing `interrupted`\
    \ because the CLI was momentarily unreachable would report live work as finished\
    \ \u2014 the one direction this subsystem must never get wrong. A test uses a\
    \ nonexistent binary and asserts no terminal entry is written.\n\n**An unreadable\
    \ run counts as live.** Same principle at the file level: a run whose meta cannot\
    \ be parsed cannot be shown to have ended, and calling it finished would both\
    \ hide a crash and let a second run start beside it.\n\n**The run lock is the\
    \ authority on \"one run per task\", not the directory scan.** `guards.dispatch_task`\
    \ still scans first because the scan produces a better message, but it now takes\
    \ the `O_CREAT|O_EXCL` lock before claiming and converts a `RunLockTimeout` into\
    \ `LiveRunExistsError`. The scan reads a directory and can lose a race with itself;\
    \ the lock cannot. This closes the window task-071's progress entry flagged as\
    \ deliberately left open.\n\n**The lock is released by whoever writes the terminal\
    \ entry**, in `_finish_batch` and `_finish_session`, and by `dispatch_task`'s\
    \ own `except` if the spawn never happened. A lock outliving its run would refuse\
    \ every future dispatch of that task until someone found the file \u2014 which\
    \ is why the timeout message names the file and the pid that left it.\n\n**`claude\
    \ rm` refusing over uncommitted changes is recorded, not retried with `-f`.**\
    \ That refusal is the signal that a run produced work nobody has looked at; forcing\
    \ past it deletes exactly the thing worth keeping. The reason is written into\
    \ the run's meta as `reap_blocked` so it is visible in `dispatch status` rather\
    \ than only in a log line nobody reads.\n\n## What a later task should know\n\n\
    `DispatchLedger` takes `session_command` so the session manager is injectable\
    \ \u2014 that is what let the whole session half be tested without a real Claude\
    \ Code install, and it means a non-Claude CLI with an `agents`/`stop`/`rm` surface\
    \ would work unchanged.\n\nReaping is not yet scheduled by anything. `reap_finished()`\
    \ exists and is tested; nothing calls it periodically. Whatever schedules polling\
    \ (task-073's UI refresh, or a future worker) should call it, or finished sessions\
    \ will accumulate pids until someone runs the CLI.\n\nFull suite: 1642 passed,\
    \ with the two pre-existing failures from task-068 log entry 6 unchanged."
