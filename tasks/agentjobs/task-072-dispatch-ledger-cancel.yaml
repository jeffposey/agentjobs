spec:
  summary: 'Make a run observable and stoppable. The run directory layout, the per-task
    run lock, cancel/stop/status commands, cancel-on-shutdown, and startup reconciliation
    that turns a crashed run into a task-visible ''interrupted'' rather than silence.
    Includes the panic button: dispatch stop writes the sentinel and kills everything.
    Design sections 6, 8 and 9.'
  description: 'Derived from docs/agent-dispatch-design.md sections 6, 8 and 9.


    ## Scope


    - Run directory layout `~/.agentjobs/runs/<run_id>/` with `meta.yaml`. **No shared
    index file** -- each directory is written only by its own supervisor, so listing
    is a scan and there is nothing contended to lock. Same reasoning as one YAML file
    per task.

    - The per-task run lock at `~/.agentjobs/runs/.locks/<task_id>.lock`, held for
    the process lifetime, using the same `O_CREAT|O_EXCL` primitive task-055 chose
    (atomic on Windows, no dependency, stale lock produces a timeout naming it rather
    than a hang).

    - `agentjobs dispatch status`, `dispatch cancel <run-id>`, `dispatch stop`.

    - Cancellation: `CTRL_BREAK_EVENT` / `SIGTERM` to the group, 30s grace so an agent
    can finish a `git commit`, then `taskkill /T /F` / `SIGKILL`.

    - `dispatch stop` is the panic button: writes `DISPATCH_DISABLED` **and** cancels
    every live run, one command, no arguments.

    - **Runs do not outlive their supervisor.** Graceful shutdown of `agentjobs serve`
    cancels live runs. Startup reconciliation declares any non-terminal run `interrupted`,
    appends its dispatch_result, and hands the ball to a human.


    ## The rejected alternative, restated because it will be suggested


    Letting a child survive a server restart and re-adopting it by pid. Pid adoption
    is unreliable, and it produces an orphaned autonomous agent editing a repository
    with nothing supervising it and no working kill switch -- the precise situation
    this subsystem exists to prevent. Losing a mid-flight run to a restart is a visible
    cost; an unsupervised orphan is not.'
  context: []
