spec:
  summary: 'The packaged React surface that removes the manual step: a Dispatch action
    beside Approve on a task whose ball is with an agent, live run status with cancel/output
    controls, and the per-project enable/disable toggle. The browser may enable or
    disable only; it never defines runner commands.'
  description: 'Derived from docs/agent-dispatch-design.md sections 5 and 6, and decision
    D2.


    This is the task that closes the loop the owner asked about on 2026-08-10: click
    in the packaged React application, agent starts, no chat window.


    ## Scope


    - A **Dispatch** action, visually and semantically distinct from Approve, on tasks
    whose ball is `agent`. Approve means ''I agree''; Dispatch means ''spend money
    now''. Do not merge them into one button.

    - Live run indicator on the task: running/finished, elapsed time, outcome, cancel
    button, and a link to the run output.

    - Per-project dispatch toggle. **Enable and disable only.** The runner argv is
    not editable from the browser, and a project cannot be enabled against a runner
    that is not already defined machine-locally. Rationale: dispatch turns an unauthenticated
    localhost API into remote code execution, so the browser-reachable surface may
    switch a known capability on and off but must never widen it.

    - Disable is always available with no ceremony. A kill switch you cannot reach
    is not one.

    - Every refusal from task-071 renders as its specific reason, not ''dispatch failed''.


    ## Verification


    Exercise it against a freshly started server, not just in tests. Assert on rendered
    values -- a test that finds `data-run-state=` while the template emits `RunState.RUNNING`
    passes and proves nothing.'
  constraints: '- Dispatch is a **distinct control from Approve**, deliberately: approval
    means ''I agree'', not ''spend money now''.

    - Run status must be live while a run is in flight, not a page the user has to
    reload.

    - Any new project-scoped query must be classified in `LiveUpdates.tsx` (PROJECT_TASK_QUERY_IDS,
    or NON_TASK_PROJECT_QUERY_IDS with its reason) or the drift test fails -- which
    is that test doing its job.

    - Assert on rendered values, not on markup being present.'
  out_of_scope: Auto-dispatch on approval (task-074).
  context:
  - path: frontend/src/components/TaskDetail.tsx
    why: Where Approve lives; the Dispatch action sits beside it and must not inherit
      its meaning.
  - path: frontend/src/components/LiveUpdates.tsx
    why: The live-update allowlist and the drift test that fails when a new project-scoped
      query is unclassified.
  - path: docs/agent-dispatch-design.md
    why: Section 5 -- the trigger, and why it is an explicit action.
