- id: 6
  ts: '2026-08-18T11:18:53.512751Z'
  actor: claude
  type: progress
  body: "# Auto-dispatch built, tested, and shipped switched off\n\nBranch `feat/task-074-auto-dispatch`,\
    \ four commits.\n\n## What landed\n\n`src/agentjobs/dispatch/auto.py` \u2014 `maybe_auto_dispatch()`,\
    \ `check_budget()`, `last_dispatch_at()`. Called from `approve` and `request-changes`\
    \ in `api/routes/tasks.py` after the human's write has already landed, so the\
    \ task's newest log entry *is* that human act, which is what makes the human-clocked\
    \ check meaningful rather than circular.\n\n**Nothing in this file raises into\
    \ its caller.** An approval that already succeeded must not turn into an error\
    \ response because a run could not start; every failure path returns an outcome\
    \ and, where it matters, writes what happened onto the task.\n\n## The safety\
    \ argument, and how it is checked\n\nThe rule is unchanged and uncompromised:\
    \ an approval is a human act so it may cause one dispatch; the handoff that ends\
    \ the resulting run is written by an agent, so it causes nothing and the wheel\
    \ stops. That is enforced by *calling* `assert_human_clocked` rather than reimplementing\
    \ the check, and tested directly (`TestTheHumanClockedRule`) \u2014 including\
    \ a case that first asserts every budget cap has room, so the test proves the\
    \ structural rule rather than accidentally testing a cap.\n\n## The caps\n\n3\
    \ per task per day, 10 lifetime, 60s cooldown. Counted from `dispatch` log entries\
    \ via `Task.dispatch_count` / `dispatches_since` \u2014 never a stored counter,\
    \ which could disagree with the evidence for it in the direction that spends money.\n\
    \nTwo behaviours worth knowing:\n\n- **Count caps park the task**, appending a\
    \ note naming the limit and handing the ball to `human`/`decision`. A task that\
    \ burns its budget is reporting a problem with itself, and nobody looks unless\
    \ it asks them to. **Cooldown does not park it** \u2014 waiting fixes a cooldown;\
    \ it is not a decision.\n- **Counts are reported before the cooldown.** A task\
    \ that has genuinely exhausted its lifetime budget says so, rather than telling\
    \ someone to wait sixty seconds for a refusal that will not change.\n\n## Scope\
    \ decisions\n\n- **`request-changes` is armed as well as `approve`.** Both are\
    \ human acts that hand the ball to an agent, and requesting changes is the one\
    \ handoff that always arrives with instructions attached \u2014 making it the\
    \ one needing a second click would be backwards.\n- **The generic `POST .../handoff`\
    \ is deliberately not hooked.** It is the agent-facing verb; putting the trigger\
    \ there would place it on the transition the human-clocked rule forbids and leave\
    \ safety resting on filtering correctly. That is the identical objection the design\
    \ used to reject a `task.handoff` webhook consumer. *Rejected alternative:* hooking\
    \ it and relying on `assert_human_clocked` to filter. It would in fact be safe,\
    \ and it is still the wrong shape \u2014 plus it costs a config-file read on every\
    \ agent handoff in the system.\n- **The settings page shows whether auto-dispatch\
    \ is armed, and offers no control for it.** Jeff is entitled to see from a phone\
    \ that approving will start an agent; he must not be able to arm it from there.\n\
    \n## Verification\n\n- `poetry run pytest`: **1671 passed**, 2 failed \u2014 the\
    \ same two already red on `main` and named in task-060 entry 12.\n- 15 new cases\
    \ in `tests/test_auto_dispatch.py`: the human-clocked rule, both trigger endpoints,\
    \ both off-states, each cap's boundary from both sides, the parking behaviour,\
    \ and `TestManualDispatchIsNotCapped` proving a task 20 dispatches over every\
    \ limit still dispatches by hand (sc-5, decision D3).\n- `npm run check` green\
    \ in full, 25 Vitest cases in `DispatchPanel.test.tsx` and 11 Playwright paths.\n\
    - `black`, `ruff` clean; `mypy src/agentjobs` shows only the pre-existing `storage.py:268`\
    \ error.\n\n## State on Jeff's machine after this merges\n\nUnchanged. `auto_dispatch`\
    \ defaults to `false` and lives in `~/.agentjobs/dispatch.yaml`, which the browser\
    \ cannot write. Arming it is a deliberate one-line edit \u2014 which is the form\
    \ the spec's \"wait until it is boring\" precondition takes now that the code\
    \ exists (see the decision in entry 4)."
