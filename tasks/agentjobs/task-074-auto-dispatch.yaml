spec:
  summary: 'The last click. With auto_dispatch on, a human approval that hands the
    ball to an agent dispatches it immediately. This is the only task where budget
    caps bind, because runaway needs an autonomous cycle. Deliberately last: it is
    a small change on top of a correct manual path, and shipping it earlier would
    mean no period of watching that path behave. Design sections 5 and 7, decisions
    D1 and D3.'
  description: 'Derived from docs/agent-dispatch-design.md sections 5 and 7, and decisions
    D1 and D3.


    ## Scope


    - `auto_dispatch: true` per project, off by default.

    - On a human action that moves the ball to `agent`, dispatch immediately. The
    human-clocked rule (design section 2) still holds without exception: the approval
    is a human act so it may cause one dispatch; the handoff that ends the resulting
    run is an agent act so it causes nothing. Add an explicit test for that second
    half -- it is the whole safety argument.

    - The budget caps, which bind here and nowhere else (D3): 3 dispatches per task
    per 24h, 10 lifetime, 60s cooldown between dispatches of one task. Counts derived
    from `dispatch` log entries (task-069), not a stored counter.

    - **Tripping a cap is never silent.** The run is refused, a note naming the specific
    limit and its value is appended, and for the per-task caps the ball moves to human/decision
    with a prompt saying the task has been dispatched N times without reaching a conclusion.
    A task that burns its daily cap is telling you something is wrong with the task.


    ## Precondition, not a dependency edge


    Do not start this until tasks 068-073 have been in real use long enough to be
    boring. That is a judgement call for the owner, not a schedule.'
  context: []
