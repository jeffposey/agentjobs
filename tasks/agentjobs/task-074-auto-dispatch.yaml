  text: An agent handoff never causes a dispatch, in either mode -- tested directly,
    since this is the rule the whole safety argument rests on
  status: pending
- id: sc-3
  text: Each budget cap (per-day, lifetime, cooldown) refuses at its boundary and
    not before, using counts derived from dispatch log entries
  status: pending
- id: sc-4
