spec:
  summary: Interactive agents already use per-task worktrees, and task metadata stays
    on shared main so review state cannot disappear with an implementation branch.
    Remaining work is to decide and implement task-specific worktrees for dispatched
    agents before the runner is built.
  description: "## Current status after the corpus audit (2026-08-13)\n\nThe agent\
    \ convention and recovery guidance shipped in ALLAGENTS.md, with supporting repository\
    \ guidance in ENGINEERING.md and docs/agent-workflow.md. Task records now stay\
    \ on shared `main`, so the former proposal for a GUI branch banner is obsolete:\
    \ the GUI no longer reads task state from an implementation worktree. The remaining\
    \ scope is layer 2 -- decide how AgentJobs or the selected runner creates an isolated\
    \ task worktree for dispatched work, and update the dispatch cwd decision before\
    \ implementation.\n\nThe history below records why the convention was introduced.\n\
    Two agents working this repository share one checkout, one working\ntree, and\
    \ one HEAD. There is no isolation and no coordination protocol beyond\nENGINEERING.md's\
    \ \"commit before switching agents\", which only helps the agent that\nreads it\
    \ and says nothing about not switching *branches* out from under a peer.\n\n##\
    \ What actually happened on 2026-08-11\n\nThree distinct failures in a single\
    \ afternoon, during task-060 and task-062:\n\n1. An agent ran `git add -A` and\
    \ swept the other agent's uncommitted, in-flight files\n   into its own commit.\
    \ Recovered with `git reset --soft` plus a selective unstage, but\n   only because\
    \ it was noticed within a minute.\n2. An agent checked out its own branch, replacing\
    \ the working tree under a peer that was\n   mid-task. The peer's next commit\
    \ would have gone to the wrong branch.\n3. An agent finished and left the checkout\
    \ on `main`. The owner opened the dashboard,\n   did not see task-060 waiting\
    \ for review, and reasonably concluded something was\n   broken. Nothing was broken\
    \ -- he was looking at a different branch's task files.\n\nFailure 3 is the interesting\
    \ one, and it is specific to this product. **Because tasks are\nYAML files in\
    \ the repository, the checked-out branch silently determines what the\ndashboard\
    \ shows.** A task under review on a branch is invisible from main. That is not\
    \ a\nconcurrency bug; it is a consequence of the git-as-database decision, and\
    \ it will recur\nevery time work is reviewed from the GUI while a branch is open.\n\
    \n## Scope\n\nDecide and implement the isolation model. Recommended shape, two\
    \ layers:\n\n**Layer 1 -- the convention, which is nearly free and should land\
    \ first.** Each agent\nworks in its own `git worktree`, created before it claims\
    \ and removed after its branch\nmerges. Documented in ENGINEERING.md's branch\
    \ lifecycle alongside \"create the branch\nbefore marking in_progress\", because\
    \ it is the same rule extended: no work outside a\nbranch, and no branch inside\
    \ someone else's tree. Add the `git add -A` prohibition\nexplicitly -- stage the\
    \ files the task owns, never the tree.\n\n**Layer 2 -- AgentJobs managing it,\
    \ if layer 1 proves insufficient.** The project\nregistry already maps a project\
    \ id to a root and is the only place an id becomes a path\n(`projects.py`), so\
    \ it is the natural owner of a worktree pool: `agentjobs worktree\nclaim <task-id>`\
    \ returns a path, `release` removes it, and stale worktrees for closed\ntasks\
    \ are reaped. Layer 2 is what makes dispatch safe to run concurrently -- see below.\n\
    \n## Why this blocks part of the dispatch work\n\ntask-070 and task-071 spawn\
    \ an agent with `cwd` set to the project root from the\nregistry. If that root\
    \ is the shared checkout, every dispatched run inherits exactly the\nfailure modes\
    \ above, except now they happen unattended and at machine speed rather than\n\
    at typing speed. A dispatched run should be given a task-specific worktree as\
    \ its cwd,\nwhich means the dispatch design's \"cwd = project_root\" needs revisiting\
    \ before task-070\nis implemented, not after.\n\n## The separate question this\
    \ raises, worth answering here\n\nWhether the GUI should tell the reader which\
    \ branch it is showing. A one-line banner --\n\"showing tasks from branch X\"\
    \ -- would have prevented failure 3 entirely and costs almost\nnothing. Consider\
    \ it in scope; it is the cheapest fix to the most confusing symptom.\n\n## Out\
    \ of scope\n\nMulti-machine or multi-user coordination. One machine, several agents.\n"
  constraints: '- Task metadata stays on `main`, always. A dispatched run must not
    be able to hide a review request on a branch nobody has checked out -- that defeats
    the merge gate, and it has already happened once (ENGINEERING.md).

    - A worktree for a finished task is litter; removing it is part of the work, not
    a follow-up.

    - Do not change how interactive agents take worktrees today.'
  out_of_scope: Changing the branch naming convention or the merge gate itself.
  context:
  - path: ALLAGENTS.md
    why: '''Why you get your own worktree'' -- three failures that produced the rule,
      all of which a dispatched agent can reproduce.'
  - path: ENGINEERING.md
    why: '''Task files live on main, always'' and ''Sharing a clone''.'
  - path: docs/agent-dispatch-design.md
    why: Section 8, concurrency.
