- id: 4
  ts: '2026-08-11T02:44:16.038155Z'
  actor: claude
  type: decision
  body: 'The worktree mandate belongs to agents, not to every contributor.


    Jeff, on reading the first pass: ''not every engineer needs to do it on their
    own machine, its more for agents safety.'' Correct, and the first commit got it
    wrong. ENGINEERING.md opens by declaring itself universal practice for human and
    AI contributors alike, so a mandatory worktree-per-task there tells a solo engineer
    in their own clone to do something that buys them nothing. A person alone in a
    clone has no peer to collide with.


    The hazard is specific to agents: several run against one clone, none can see
    the others, and none will get an error when a checkout moves the tree under a
    peer. So the mandate and the three incidents now live in ALLAGENTS.md under ''Why
    you get your own worktree'', addressed to the reader who is actually at risk,
    along with the recovery procedure for a commit that swept in someone else''s files.


    ENGINEERING.md keeps two things. A short conditional note -- alone, checkout is
    fine; sharing a clone, take a worktree -- because a second *human* on one clone
    has the same problem and should not have to read the agent handbook to find that
    out. And the one fact every contributor needs regardless: tasks are YAML files,
    so the checked-out branch decides what the dashboard shows. That one is not about
    isolation at all; it is a property of git-as-database that presents as a missing
    task, and it belongs in the engineering handbook whoever you are.


    The `git add -A` line softened from a prohibition to ordinary hygiene (''stage
    explicit paths'') in ENGINEERING.md, with the strong form and the recovery steps
    kept in ALLAGENTS.md. Same reasoning: for a solo engineer `git add -A` commits
    their own mess, which is a preference; for an agent it commits a peer''s work,
    which is damage.


    Rejected: leaving the mandate in ENGINEERING.md with a parenthetical ''agents
    especially''. Guidance that applies to one audience but is filed under universal
    practice trains everyone to read the handbook as advisory, which is expensive
    for the parts of it that are not.'
  data: {}
