spec:
  summary: 'Several agents work this repo in one checkout with one HEAD, and on 2026-08-11
    that caused three failures in one afternoon: one agent''s uncommitted files swept
    into another''s commit, a branch switched under an in-flight session, and a task
    under review made invisible in the dashboard because the tree was left on main.
    The last one is specific to this product -- tasks are files in the repo, so the
    checked-out branch silently decides what the GUI shows. Fix with a worktree per
    agent, and consider a branch banner in the GUI.'
  description: "Two agents working this repository share one checkout, one working\n\
    tree, and one HEAD. There is no isolation and no coordination protocol beyond\n\
    ENGINEERING.md's \"commit before switching agents\", which only helps the agent\
    \ that\nreads it and says nothing about not switching *branches* out from under\
    \ a peer.\n\n## What actually happened on 2026-08-11\n\nThree distinct failures\
    \ in a single afternoon, during task-060 and task-062:\n\n1. An agent ran `git\
    \ add -A` and swept the other agent's uncommitted, in-flight files\n   into its\
    \ own commit. Recovered with `git reset --soft` plus a selective unstage, but\n\
    \   only because it was noticed within a minute.\n2. An agent checked out its\
    \ own branch, replacing the working tree under a peer that was\n   mid-task. The\
    \ peer's next commit would have gone to the wrong branch.\n3. An agent finished\
    \ and left the checkout on `main`. The owner opened the dashboard,\n   did not\
    \ see task-060 waiting for review, and reasonably concluded something was\n  \
    \ broken. Nothing was broken -- he was looking at a different branch's task files.\n\
    \nFailure 3 is the interesting one, and it is specific to this product. **Because\
    \ tasks are\nYAML files in the repository, the checked-out branch silently determines\
    \ what the\ndashboard shows.** A task under review on a branch is invisible from\
    \ main. That is not a\nconcurrency bug; it is a consequence of the git-as-database\
    \ decision, and it will recur\nevery time work is reviewed from the GUI while\
    \ a branch is open.\n\n## Scope\n\nDecide and implement the isolation model. Recommended\
    \ shape, two layers:\n\n**Layer 1 -- the convention, which is nearly free and\
    \ should land first.** Each agent\nworks in its own `git worktree`, created before\
    \ it claims and removed after its branch\nmerges. Documented in ENGINEERING.md's\
    \ branch lifecycle alongside \"create the branch\nbefore marking in_progress\"\
    , because it is the same rule extended: no work outside a\nbranch, and no branch\
    \ inside someone else's tree. Add the `git add -A` prohibition\nexplicitly --\
    \ stage the files the task owns, never the tree.\n\n**Layer 2 -- AgentJobs managing\
    \ it, if layer 1 proves insufficient.** The project\nregistry already maps a project\
    \ id to a root and is the only place an id becomes a path\n(`projects.py`), so\
    \ it is the natural owner of a worktree pool: `agentjobs worktree\nclaim <task-id>`\
    \ returns a path, `release` removes it, and stale worktrees for closed\ntasks\
    \ are reaped. Layer 2 is what makes dispatch safe to run concurrently -- see below.\n\
    \n## Why this blocks part of the dispatch work\n\ntask-070 and task-071 spawn\
    \ an agent with `cwd` set to the project root from the\nregistry. If that root\
    \ is the shared checkout, every dispatched run inherits exactly the\nfailure modes\
    \ above, except now they happen unattended and at machine speed rather than\n\
    at typing speed. A dispatched run should be given a task-specific worktree as\
    \ its cwd,\nwhich means the dispatch design's \"cwd = project_root\" needs revisiting\
    \ before task-070\nis implemented, not after.\n\n## The separate question this\
    \ raises, worth answering here\n\nWhether the GUI should tell the reader which\
    \ branch it is showing. A one-line banner --\n\"showing tasks from branch X\"\
    \ -- would have prevented failure 3 entirely and costs almost\nnothing. Consider\
    \ it in scope; it is the cheapest fix to the most confusing symptom.\n\n## Out\
    \ of scope\n\nMulti-machine or multi-user coordination. One machine, several agents.\n"
  context: []
acceptance:
- id: sc-1
  text: ENGINEERING.md's branch lifecycle requires a per-agent worktree and prohibits
    `git add -A`, with the three 2026-08-11 failures named so the rule reads as a
    consequence rather than ceremony
  status: pending
- id: sc-2
  text: The workflow is documented end to end -- create worktree, branch, claim, work,
    merge, remove worktree -- and an agent following it never touches the shared checkout's
    HEAD
  status: pending
- id: sc-3
  text: A decision entry records whether AgentJobs manages worktrees itself (layer
    2) or the convention is sufficient, with the reasoning and the rejected option
  status: pending
- id: sc-4
  text: The GUI states which branch the tasks it is showing came from, so a reviewer
    cannot mistake 'wrong branch checked out' for 'the task is not waiting for me'
  status: pending
- id: sc-5
  text: 'The dispatch design''s cwd choice is revisited in writing: a dispatched run
    gets an isolated worktree rather than the shared project root, or there is a recorded
    reason it does not'
  status: pending
