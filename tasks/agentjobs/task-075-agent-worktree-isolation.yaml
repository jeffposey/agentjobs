- id: 3
  ts: '2026-08-11T02:41:35.798547Z'
  actor: claude
  type: handoff
  body: 'Documented the convention that three separate failures on 2026-08-11 were
    caused by not having.


    **ENGINEERING.md** gains a `Worktree Lifecycle` section ahead of Branch Lifecycle:
    one worktree per task, created before the branch and before the claim, removed
    after merge, never `git checkout` in the shared clone. It states the three failures
    as the reason, including the product-specific one -- because tasks are YAML files
    in the repository, whichever branch is checked out silently decides what the dashboard
    shows, so a task under review on a branch does not exist as far as main is concerned.
    Commit Hygiene gains a `git add -A` prohibition with the recovery procedure, since
    that failure is only recoverable if caught immediately.


    **ALLAGENTS.md** step 2 becomes ''Worktree, branch, then claim'' with the command,
    and step 6 ends with removing the worktree. Step 3 repeats the staging rule where
    an agent will actually be looking when it commits.


    Docs-only; no code touched. Verified by dogfooding: this branch was made with
    `git worktree add C:/projects/aj-075 -b feat/task-075-worktree-convention` and
    the shared clone was never checked out, so the agent working task-062 earlier
    today would have been undisturbed by it.'
