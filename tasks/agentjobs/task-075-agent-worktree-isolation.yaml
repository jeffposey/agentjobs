  body: 'Layer 1 only: the convention, documented. Layers 2 and 3 stay open.


    Jeff asked the right question -- ''shouldn''t the agent starting on a new task
    create the worktree?'' -- and the answer is yes, which makes this a documentation
    change before it is anything else. An agent told by a human to make a worktree
    is the same coordination-by-remembering that failed three times on 2026-08-11.
    An agent that reads ENGINEERING.md and does it unprompted is a fix.


    Scoped to sc-1 and sc-2 deliberately, and the task stays open for the rest:


    - **sc-3** (does AgentJobs manage worktrees itself?) is deferred, not decided.
    Layer 1 costs nothing and works today; layer 2 should not be built until layer
    1 is observed failing. Also note `claude --worktree` exists, so for dispatched
    runs the CLI may supply this for free -- task-077 should establish that before
    AgentJobs builds a worktree pool it does not need.

    - **sc-4** (GUI states which branch it is showing) is not done. It remains the
    cheapest fix to the most confusing of the three failures, and it is a code change
    rather than a doc change.

    - **sc-5** (dispatch cwd) belongs with task-077, which is deciding what a dispatched
    run even is.


    Rejected: closing this task on the documentation alone. Three of five criteria
    would be unmet, and a closed task is how a known problem becomes an unknown one.'
