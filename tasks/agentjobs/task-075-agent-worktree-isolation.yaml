- id: 6
  ts: '2026-08-11T03:00:04.614624Z'
  actor: claude
  type: progress
  body: 'Approved by Jeff and merged to main (c8ad756). Branch deleted, worktree removed.
    The task stays open; only the documentation layer is done.


    **Landed:** the worktree convention in ALLAGENTS.md (agents), a short conditional
    note in ENGINEERING.md (anyone sharing a clone), and -- added during review --
    the reversal of the rule that sent status transitions to a task''s branch. Task
    files now live on main, always.


    That last change came out of Jeff trying to approve this very task in the GUI
    and finding it still showed `ready`. It was not a mistake on his part: the handoff
    was committed to this branch, the dashboard reads the main clone''s working tree,
    so the review request was invisible to the reviewer. The merge gate depends on
    a human seeing a request; the old rule guaranteed they could not. The worktree
    convention added in the same branch made it airtight, since the shared clone is
    then never on the review branch. A rule this task introduced broke the gate this
    task was meant to protect -- worth remembering before the next workflow change.


    **Still open, and why each was left:**


    - *Should AgentJobs manage worktrees itself?* Deferred, not decided. The convention
    costs nothing and works today; build the pool only after the convention is seen
    failing. `claude --worktree` may cover dispatched runs for free -- task-077 should
    establish that first.

    - *GUI states which branch it is showing.* Not done, and it is now the most valuable
    remaining piece: it is the last defence when someone is looking at the wrong tree,
    and it is a small code change.

    - *Dispatch cwd.* Belongs with task-077, which is still deciding what a dispatched
    run is.


    Released back to ready so any agent can pick up the remainder.'
