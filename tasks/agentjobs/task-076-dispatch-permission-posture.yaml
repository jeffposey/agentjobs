  body: "**Decided by Jeff, 2026-08-18: three named permission postures, selected\
    \ per project, defaulting to `supervised`.**\n\nAnswered against the handoff in\
    \ entry 5, on the research in entries 2\u20134 (entry 3 corrects entry 2).\n\n\
    ## The postures\n\n| Posture | Flags |\n|---|---|\n| `read_only` | `--tools \"\
    Read,Glob,Grep,WebFetch\"` \u2014 verified enforceable; the agent has no shell\
    \ at all |\n| `supervised` **(default)** | `--permission-mode acceptEdits -w <task-slug>`\
    \ + the project allow-list via `--settings` |\n| `autonomous` | `--permission-mode\
    \ bypassPermissions -w <task-slug>` \u2014 per-project opt-in, never default |\n\
    \nSelection is per project, machine-local in `~/.agentjobs/dispatch.yaml`, like\
    \ every other dispatch setting.\n\n## sc-2 \u2014 may a dispatched agent run shell\
    \ commands unattended?\n\n**Yes, but only those matching its project's allow-list.**\
    \ Everything else parks the session at `waiting`/`blocked`, which AgentJobs polls\
    \ and converts into ball \u2192 `human`/`input` with the pending command quoted\
    \ in the `ball_prompt`. Under `autonomous`, all commands run unattended, and that\
    \ posture is off unless a project turns it on.\n\n**Seed allow-list, confirmed\
    \ as proposed:** `poetry run pytest:*`, `poetry run ruff:*`, `poetry run black:*`,\
    \ `poetry run mypy:*`, `npm run:*`, `git status:*`, `git diff:*`, `git add:*`,\
    \ `git commit:*`. It grows by Jeff answering a prompt with \"don't ask again\"\
    , so widening it is a visible act rather than an unreviewed config edit.\n\n**Rejected:\
    \ minus the git write verbs.** Tighter, and it would surface every first commit\
    \ \u2014 but it parks on routine work constantly, which is the pressure that makes\
    \ people widen allow-lists carelessly.\n**Rejected: start empty.** Maximum visibility\
    \ into what agents actually ask for; the first run parks on its first command,\
    \ and dispatch is not useful until the list is built by hand.\n\n## sc-3 \u2014\
    \ the task-075 interaction\n\n**Layer 2 is dropped for dispatched runs.** The\
    \ CLI's own `-w` supplies containment: worktree at `<root>/.claude/worktrees/<name>`\
    \ on branch `worktree-<name>`, git-locked with a lock reason naming the session\
    \ and pid, and `claude rm` refuses to discard one holding uncommitted changes.\
    \ Better than AgentJobs would have built, and free. Layer 1 \u2014 the convention\
    \ for interactive agents \u2014 is already merged and unaffected.\n\nWhat containment\
    \ buys, stated precisely: in the shared checkout an unattended agent commits on\
    \ top of a peer's in-flight work (the three 2026-08-11 failures, at machine speed),\
    \ and `read_only` would be the only defensible default. Contained, an accident\
    \ is confined to a branch nobody else has checked out and is recoverable by deleting\
    \ the worktree. **That is what makes `acceptEdits` defensible as a default.**\n\
    \n**A worktree is not a sandbox.** An agent with shell access can `cd` anywhere\
    \ on the machine. Containment reduces the blast radius of accidents; it does not\
    \ bound a confused or adversarial agent. So it justifies `supervised` as default\
    \ and explicitly does **not** justify `autonomous` as default.\n\n**Rejected:\
    \ AgentJobs owns the worktree (layer 2 as specified).** Real implementation cost\
    \ for control over naming and placement we do not need.\n**Rejected: `-w` for\
    \ session mode, AgentJobs-managed for batch.** Correct in principle since `-p`\
    \ has no worktree flag, but it means two worktree mechanisms to maintain and debug.\
    \ Revisit if batch dispatch turns out to need containment in practice.\n\n## Rejected\
    \ postures\n\n1. **Read-only only.** Cannot satisfy a single acceptance criterion\
    \ in tasks 068\u2013075, all of which require running the suite. Retained as a\
    \ posture because it is right for review and triage; rejected as the *only* mode\
    \ because it makes dispatch a reporting feature rather than a work feature.\n\
    2. **`dontAsk` as the default.** Never parks \u2014 it refuses and carries on.\
    \ Rejected because the verified behaviour is that the agent hits the denial, reports\
    \ it, and stops trying: it produces untested work and hands back anyway. A visible\
    \ stall traded for an invisible half-finished result.\n3. **`bypassPermissions`\
    \ as the default.** The only posture that never parks. Rejected as default because\
    \ it makes every dispatch an unattended shell, which \xA76's four gates exist\
    \ to avoid granting casually.\n4. **A bespoke per-runner argv allow-list** (option\
    \ 2 as literally written in the spec). Rejected: `--settings permissions.allow`\
    \ already does this and is enforced per-invocation; a second mechanism would need\
    \ a translation layer to the one that actually works.\n\n## Dependency\n\nThis\
    \ decision assumes task-077 going the session way \u2014 \"park and ask\" requires\
    \ a run that can be answered. task-077 was decided in the same session and does\
    \ go that way, so the assumption holds."
