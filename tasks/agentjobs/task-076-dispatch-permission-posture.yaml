spec:
  summary: The dispatch design specifies four safety gates around *starting* a run
    and says nothing about what the run may then do. That is the actual risk boundary.
    A headless agent that cannot run pytest satisfies no acceptance criterion in tasks
    068-075; one that can run anything is an unsupervised shell on the owner's machine.
    Mechanically the answer sits in the runner's argv, which makes it look like an
    operator detail -- it is not, and burying it in a config example means it gets
    chosen by whoever copies the example first.
  description: 'Found by the read-only dispatch experiment on 2026-08-11 (see task-060''s
    log and docs/agent-dispatch-design.md section 4). The experiment was run read-only
    precisely because the write-enabled version needed a permission decision nobody
    had made.


    ## The question


    A dispatched agent runs with nobody watching. Between ''can only read'' and ''can
    do anything'', where does it sit, and does that vary by project?


    ## What is already known


    - Read-only is genuinely useful and was proven so: the 2026-08-11 run produced
    a correct plan and three real defect reports in 143 seconds without write access.
    **A read-only dispatch mode may be the right first version**, and it sidesteps
    this question rather than answering it.

    - Edits without commands means untested code. The derived tasks all require `poetry
    run pytest`.

    - Full permissions in an isolated worktree (task-075) is a materially different
    risk from full permissions in the shared checkout. **Decide task-075 first or
    in parallel** -- containment changes the answer.

    - Credentials are not in scope: `claude -p` uses the local install''s own subscription
    auth and AgentJobs never sees a token.


    ## Options to evaluate, with the rejected ones recorded


    1. **Read-only dispatch only.** Reports, plans, reviews. No writes ever. Smallest
    useful thing, and the experiment is evidence it has value.

    2. **Edits accepted, commands allow-listed.** A per-runner allow-list (`pytest`,
    `ruff`, `git status`). More useful, and the allow-list is a maintenance surface
    that will be widened under pressure.

    3. **Full permissions, contained by a worktree.** Most useful, and depends entirely
    on task-075 being real containment rather than a convention.

    4. **Per-project choice** among the above, machine-local like every other dispatch
    setting.


    ## Why this blocks task-070


    The runner cannot be written without knowing what flags it passes. Answer this
    before implementing, not after discovering the first dispatched run stalled on
    a permission prompt with no human to answer it -- which in headless mode is not
    a prompt but a silent denial.


    ## Out of scope


    Authentication for the dashboard. Separate concern, and it becomes urgent only
    if the dashboard is exposed beyond localhost.'
  constraints: '- **This is a decision task. Do not decide it alone.** Research the
    options, write up the trade-offs with a recommendation, then `handoff` to `human`/`decision`
    and stop. An agent running unattended answering this by default is the specific
    failure this task exists to prevent.

    - Record the outcome as a `decision` entry naming the rejected alternatives, and
    amend docs/agent-dispatch-design.md so the document and the record agree.

    - Write no implementation code.

    - The real question is not what may *start* a run -- the design already has four
    gates for that -- but what the run may *do* once started. A headless agent that
    cannot run pytest satisfies no acceptance criterion; one that can run anything
    is an unattended shell.'
  out_of_scope: Implementing the posture. That belongs to task-070, which needs this
    answered first.
  context:
