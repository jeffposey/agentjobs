- id: 3
  ts: '2026-08-18T05:08:11.828875Z'
  actor: claude
  type: progress
  body: "**Correction to entry 2, and the permission matrix that replaces it.** Entry\
    \ 2 claimed allow-listing was not enforceable. That was my syntax error, not a\
    \ product defect, and the corrected result changes the recommendation.\n\n## Correction\n\
    \nEntry 2 reported that a `permissions.allow` entry did not suppress a prompt.\
    \ I had written the rules as `PowerShell(Set-Content*)` \u2014 no colon. The documented\
    \ form is `Tool(prefix:*)`. Retested with the colon:\n\n```\nclaude --bg --permission-mode\
    \ acceptEdits \\\n  --settings '{\"permissions\":{\"allow\":[\"Bash(python -m\
    \ pytest:*)\",\"PowerShell(python -m pytest:*)\"]}}' \\\n  \"Run the shell command\
    \ 'python -m pytest --version' ...\"\n```\n\nSession went straight to `\"status\"\
    : \"idle\", \"state\": \"done\"` with no prompt, and the command genuinely executed\
    \ (it reported `No module named pytest`, exit 1 \u2014 a real result from a real\
    \ run). **Allow-listing works, and it is settable per invocation through `--settings`.**\
    \ Option 2 in the spec is therefore viable, not dead.\n\nEntry 2's `--disallowedTools`\
    \ result still stands as observed (three trials, shell ran anyway), but given\
    \ the syntax lesson I would not now call it a defect \u2014 my invocation may\
    \ have been wrong in the same way. Either way it is not needed: the positive allow-list\
    \ is what a posture requires.\n\n## The verified permission matrix\n\nEvery cell\
    \ below was run as a `--bg` session on 2.1.228 and read back from `claude agents\
    \ --json` plus `claude logs`.\n\n| `--permission-mode` | File edits | Auto-classified\
    \ safe reads (`git log`, `git status`) | Arbitrary command (`python -m pytest\
    \ --version`) |\n|---|---|---|---|\n| *(default)* = **manual** | prompt \u2192\
    \ **parks** | allowed | prompt \u2192 **parks** |\n| `acceptEdits` | allowed |\
    \ allowed | prompt \u2192 **parks** |\n| `acceptEdits` + allow-list entry | allowed\
    \ | allowed | **allowed, no prompt** |\n| `dontAsk` | allowed | allowed | **silently\
    \ denied; run continues** |\n| `--tools \"Read,Glob,Grep\"` | no tool | no tool\
    \ | no tool at all |\n\nThree things in that table were not known when this task\
    \ was written:\n\n1. **The default mode for `--bg` is `manual`** (status line:\
    \ \"\u23F8 manual mode on\"), not a headless auto-deny.\n2. **`dontAsk` is the\
    \ silent-denial mode** \u2014 the exact behaviour the spec attributed to headless\
    \ mode generally. The agent was told no, said so, and explicitly declined to route\
    \ around it. Useful, and it is the *only* mode where a run continues past a refusal\
    \ instead of parking.\n3. **`acceptEdits` covers edit-shaped shell commands, not\
    \ just the Write tool.** `Set-Content -Path ae.txt` ran unprompted under `acceptEdits`\
    \ and the file was created. But it does **not** cover a test runner: `python -m\
    \ pytest --version` parked.\n\nSo there is no permission *mode* that permits `pytest`\
    \ but not arbitrary commands. That middle exists only as an allow-list, which\
    \ is why the allow-list finding above is the load-bearing one."
