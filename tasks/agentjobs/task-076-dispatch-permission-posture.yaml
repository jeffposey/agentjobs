- id: 4
  ts: '2026-08-18T05:08:47.334459Z'
  actor: claude
  type: progress
  body: "## Recommendation for Jeff's decision \u2014 not a decision entry\n\n**Recommended:\
    \ option 4, instantiated as three named postures, defaulting to a variant of option\
    \ 2.** Per-project selection, machine-local in `~/.agentjobs/dispatch.yaml` like\
    \ every other dispatch setting.\n\n| Posture | Flags | For |\n|---|---|---|\n\
    | `read_only` | `--tools \"Read,Glob,Grep,WebFetch\"` | Review, triage, plans,\
    \ defect reports. Verified enforceable \u2014 the agent has no shell at all. |\n\
    | `supervised` **(default)** | `--permission-mode acceptEdits -w <task-slug>`\
    \ + project allow-list via `--settings` | Normal dispatched work. |\n| `autonomous`\
    \ | `--permission-mode bypassPermissions -w <task-slug>` | Explicit per-project\
    \ opt-in, never default. |\n\n### Why `supervised` is the default, and what it\
    \ costs\n\nIt is option 2, but with the allow-list living where it is actually\
    \ enforced (`permissions.allow` in `--settings`, `Tool(prefix:*)` form) rather\
    \ than in bespoke runner argv. The seed list is small and boring: `poetry run\
    \ pytest:*`, `poetry run ruff:*`, `poetry run black:*`, `poetry run mypy:*`, `npm\
    \ run:*`, `git status:*`, `git diff:*`, `git add:*`, `git commit:*`.\n\nThe property\
    \ that makes this the right default is what happens to everything *not* on the\
    \ list: **the session parks at `waiting`/`blocked` rather than failing or silently\
    \ proceeding.** Parked is a state `claude agents --json` reports, so AgentJobs\
    \ can poll it and move the ball to `human`/`input` with the pending command quoted\
    \ in the `ball_prompt`. Jeff answers it from his phone through Remote Control.\
    \ The prompt's own \"don't ask again for: `<command>`\" option means the allow-list\
    \ grows by use rather than by anticipation.\n\nThe spec's framing \u2014 \"cannot\
    \ run pytest = satisfies nothing; can run anything = unattended shell\" \u2014\
    \ was a genuine dilemma only because a batch run has no third move. A session\
    \ has one: **ask.** That is the substantive thing the 2026-08-18 experiments add\
    \ to this task.\n\nThe cost, stated plainly: the allow-list is still a maintenance\
    \ surface that will be widened under pressure, exactly as the spec predicted.\
    \ The mitigation is that widening it is now a visible act (a prompt Jeff answered)\
    \ rather than a config edit nobody reviews.\n\n### sc-2, answered directly\n\n\
    **Yes, a dispatched agent may run shell commands unattended \u2014 only those\
    \ matching its project's allow-list.** Everything else parks and waits for a human.\
    \ Under `autonomous`, all commands run unattended, and that posture is off unless\
    \ a project turns it on.\n\n### sc-3, the task-075 interaction\n\n`-w` gives dispatched\
    \ runs worktree containment for free, and better than task-075 layer 2 would have\
    \ built: the worktree is git-locked with a lock reason naming the session and\
    \ pid, and `claude rm` refuses to discard one holding uncommitted changes. **Recommendation:\
    \ task-075 layer 2 is not needed for dispatched runs**; AgentJobs should pass\
    \ `-w` and let the CLI own the worktree. Layer 1 (the convention, for interactive\
    \ agents) is already merged and unaffected.\n\nWhat changes with containment versus\
    \ the shared checkout:\n\n- **Shared checkout:** an unattended agent is committing\
    \ on top of whatever a peer has in flight \u2014 the three 2026-08-11 failures,\
    \ at machine speed. `acceptEdits` would be too permissive here; `read_only` would\
    \ be the only defensible default.\n- **Contained worktree:** an accident is confined\
    \ to a branch nobody else has checked out, and is recoverable by deleting the\
    \ worktree. This is what makes `acceptEdits` defensible as a default and `bypassPermissions`\
    \ discussable at all.\n\n**A worktree is not a sandbox.** An agent with shell\
    \ access can `cd` anywhere on the machine; containment reduces the blast radius\
    \ of accidents, it does not bound a confused or adversarial agent. So containment\
    \ justifies `supervised` as a default. It does **not** justify making `autonomous`\
    \ the default, and the recommendation deliberately stops short of that.\n\n###\
    \ Rejected alternatives, with their costs\n\n1. **Read-only only.** Cost: cannot\
    \ satisfy a single acceptance criterion in tasks 068\u2013075, all of which require\
    \ running the suite. It stays in the roster as the `read_only` posture because\
    \ it is genuinely the right tool for review and triage dispatches \u2014 but as\
    \ the *only* mode it makes dispatch a reporting feature, not a work feature, and\
    \ the dispatch chain 070\u2192073 could never be run by it.\n2. **`dontAsk` as\
    \ the default.** Superficially the perfect unattended mode \u2014 it never parks,\
    \ it just refuses and carries on. Rejected: verified behaviour is that the agent\
    \ hits the denial, reports it, and stops trying. A run that cannot execute the\
    \ suite produces untested code and then hands back a task claiming work is done.\
    \ It converts a visible stall into an invisible half-finished result, which is\
    \ worse. Worth keeping available for a project that explicitly wants never-park\
    \ semantics.\n3. **`bypassPermissions` as the default.** Most useful, and the\
    \ only posture with no parking at all. Rejected as a *default* because it makes\
    \ every dispatch an unattended shell on Jeff's machine, which is what \xA76's\
    \ four gates exist to avoid granting casually \u2014 and because the containment\
    \ that would justify it is a blast-radius reducer, not a boundary. Retained as\
    \ opt-in.\n4. **A bespoke per-runner argv allow-list** (option 2 as literally\
    \ written). Rejected: `--settings permissions.allow` already does this, is enforced,\
    \ and is per-invocation. Building a second allow-list mechanism in AgentJobs would\
    \ mean maintaining a translation layer to the one that actually enforces.\n\n\
    ### The one thing this recommendation depends on\n\nIt assumes dispatch launches\
    \ a **session** (task-077), because \"park and ask the human\" requires a run\
    \ that can be answered. If task-077 is decided the other way \u2014 batch `claude\
    \ -p` \u2014 then `supervised` is not implementable, parking becomes a hang, and\
    \ the honest default becomes `read_only` or `bypassPermissions` with nothing in\
    \ between. **These two decisions should be made together, in that order.**"
