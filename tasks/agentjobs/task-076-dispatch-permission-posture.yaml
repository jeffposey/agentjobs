- id: 2
  ts: '2026-08-18T05:03:34.277047Z'
  actor: claude
  type: progress
  body: "Verified the permission mechanics against the installed CLI on 2026-08-18.\
    \ **The task's central factual premise is wrong**, and correcting it changes what\
    \ the options mean.\n\nInstalled: **claude 2.1.228** (the record and design doc\
    \ both say 2.1.220). All experiments were run in throwaway git repos under C:/ai/scratch,\
    \ never in this repository; every session was removed afterwards (`claude agents\
    \ --json --all` reports zero background sessions remaining).\n\n## The premise\
    \ that was wrong\n\nThe spec says a permission prompt \"in headless mode is not\
    \ a prompt but a silent denial.\" That is true of `claude -p`. It is **false**\
    \ of a `--bg` session.\n\nRan a default-permission background session with a prompt\
    \ requiring one shell command:\n\n```\nclaude --bg -n aj-exp-bg-1 \"Write the\
    \ current time into a file called stamp.txt ...\"\n```\n\n`claude agents --json`\
    \ reported `\"status\": \"busy\", \"state\": \"working\"`, then settled into **`\"\
    status\": \"waiting\", \"state\": \"blocked\"`** and stayed there across six polls\
    \ over 60s with no timeout. `claude logs <id>` showed the session parked on a\
    \ rendered permission dialog \u2014 \"Do you want to proceed? 1. Yes / 2. Yes,\
    \ and always allow ... / 3. No\".\n\nSo a dispatched session that meets an unpermitted\
    \ action does not fail and does not silently deny. **It parks, indefinitely, in\
    \ a state the ledger reports.** That is a queryable, addressable condition \u2014\
    \ which means \"ask the human\" becomes an available posture, and it was not available\
    \ under the batch assumption this task was written against.\n\n## What actually\
    \ enforces, and what does not\n\n| Flag | Result |\n|---|---|\n| `--permission-mode\
    \ acceptEdits` with `--bg` | **Works.** Status line confirms \"accept edits on\"\
    . |\n| `--permission-mode dontAsk` with `--bg` | **Works**, and permits shell\
    \ commands without prompting \u2014 `git status --short` ran unprompted despite\
    \ not being on any allowlist in `~/.claude/settings.json` or `.claude/settings.local.json`.\
    \ |\n| `--tools \"Read,Glob,Grep\"` | **Works, and is enforced.** The agent reported\
    \ its entire toolset as Glob/Grep/Read/EndConversation and could not shell out\
    \ at all. This is a real read-only mechanism. |\n| `--disallowedTools \"Bash\"\
    ` | **Did not hold.** The shell ran anyway. |\n| `--disallowedTools \"PowerShell\"\
    ` | **Did not hold.** The shell ran anyway. |\n\nThe `--disallowedTools` result\
    \ is three trials across two permission modes (`dontAsk` and `acceptEdits`), including\
    \ both plausible names for the Windows shell tool. Whatever the cause, **a posture\
    \ must not be built on `--disallowedTools`** on this version; `--tools` is the\
    \ flag that actually constrained the agent.\n\nThis directly damages option 2\
    \ as the task frames it (\"edits accepted, commands allow-listed\"). The per-runner\
    \ argv allow-list it imagines does not exist in enforceable form here. Allow-listing\
    \ on this machine lives in `.claude/settings.json` `permissions.allow`, which\
    \ is a settings surface, not a dispatch-argv surface \u2014 and which the six\
    \ entries currently in the user file show is maintained by hand and ad hoc.\n\n\
    ## Containment (sc-3 input)\n\n`-w/--worktree` composes with `--bg`. Verified:\
    \ the worktree was created at `<root>/.claude/worktrees/<name>` on branch `worktree-<name>`,\
    \ **git-locked with a lock reason naming the session and pid** (`git worktree\
    \ remove` refused; `-f -f` required), and `claude agents --json` reported the\
    \ session's `cwd` as the worktree path rather than the project root. `claude rm\
    \ <id>` refused to delete a worktree holding uncommitted changes.\n\nThat is materially\
    \ better containment than task-075 layer 2 would have had to build, and it is\
    \ free. It is **not a sandbox** \u2014 an agent with shell access can `cd` anywhere\
    \ on the machine. It reduces blast radius for accidents; it does not bound a determined\
    \ or confused agent. That distinction should govern how much the worktree is allowed\
    \ to buy in the decision.\n\nFull evidence, including the session-launcher findings,\
    \ is in task-077-dispatch-session-launcher's log."
