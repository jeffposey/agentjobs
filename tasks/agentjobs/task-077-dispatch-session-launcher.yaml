- id: 5
  ts: '2026-08-18T05:10:15.551299Z'
  actor: claude
  type: progress
  body: "**Entry 4 is void** \u2014 a placeholder body submitted by mistake. The log\
    \ is append-only so it stays; ignore it. This is the real entry.\n\n# sc-1: the\
    \ four questions, answered by running the CLI\n\nInstalled version is **2.1.228**,\
    \ not the 2.1.220 in the spec and the design doc. All sessions below were run\
    \ in throwaway git repos under `C:/ai/scratch`, never in this repository, and\
    \ every one was removed afterwards \u2014 `claude agents --json --all` now reports\
    \ zero background sessions.\n\n## Q1 \u2014 does `--remote-control` compose with\
    \ `--bg`? **Yes.**\n\n```\nclaude --bg --remote-control --permission-mode acceptEdits\
    \ -w aj-wt-test -n \"aj-exp-3\" \\\n  \"Write the string OK into a file named\
    \ ok.txt using the Write tool. Then stop immediately.\"\n```\n\nReturned immediately\
    \ with `backgrounded \xB7 b55b35ad \xB7 aj-exp-3`. `claude logs b55b35ad` shows,\
    \ in the session transcript:\n\n```\n/remote-control is active \xB7 Continue here,\
    \ on your phone, or at\nhttps://claude.ai/code/session_0142VngQLPx14GUrbyfLWPuC\n\
    ```\n\nThe `--help` text for `--remote-control` says \"Start an **interactive**\
    \ session with Remote Control enabled\", which reads as excluding `--bg`. It does\
    \ not. All four of `--bg`, `--remote-control`, `--permission-mode` and `-w` compose\
    \ in one invocation.\n\n## Q2 \u2014 does a non-interactively started session\
    \ surface on other devices? **Evidence says yes; not end-to-end tested.**\n\n\
    The session emitted its own `claude.ai/code/session_...` URL and named phone as\
    \ a destination, from a session started with no TTY. That is the CLI asserting\
    \ reachability, and it is the same mechanism an interactive RC session uses.\n\
    \n**What I did not do is open it on a phone.** I have no way to verify Jeff's\
    \ devices from here, and I am not going to report a device test I did not run.\
    \ If the decision turns on this, it is a thirty-second check: dispatch one session\
    \ and open the URL. I would treat it as verified-enough to decide on, and worth\
    \ confirming before anything is built on it.\n\n## Q3 \u2014 default permission\
    \ mode for a backgrounded session, and is it settable? **Default is `manual`.\
    \ Yes, settable.**\n\nStatus line of a plain `--bg` session reads `\u23F8 manual\
    \ mode on`. `--permission-mode acceptEdits` and `--permission-mode dontAsk` both\
    \ took effect per invocation, confirmed in each session's status line.\n\nThe\
    \ consequence matters more than the answer. A default `--bg` session meeting its\
    \ first shell command **parks**:\n\n```\nclaude --bg -n aj-exp-bg-1 \"Write the\
    \ current time into a file called stamp.txt ...\"\n\u2192 status \"busy\"/state\
    \ \"working\", then status \"waiting\"/state \"blocked\"\n\u2192 held there across\
    \ six polls over 60s, no timeout\n\u2192 claude logs showed a rendered permission\
    \ dialog awaiting an answer\n```\n\nIt does not fail, and it does not silently\
    \ deny. The full permission matrix is in task-076's log entries 3 and 4; it is\
    \ the input to that decision, so it lives there.\n\n## Q4 \u2014 what does `claude\
    \ agents --json` report, and is it enough for \xA79's outcome vocabulary? **Partly.\
    \ Not enough on its own.**\n\nFields on a background session: `pid`, `id` (8-char\
    \ short id), `cwd`, `kind` (`interactive`|`background`), `startedAt`, `sessionId`,\
    \ `name`, `status`, `state`. Interactive sessions carry no `status`/`state`.\n\
    \nObserved pairs:\n\n| `status` / `state` | Meaning |\n|---|---|\n| `busy` / `working`\
    \ | Running |\n| `waiting` / `blocked` | Parked on a permission prompt |\n| `idle`\
    \ / `done` | Finished its turn |\n| `idle` / `blocked` | Finished after a denial\
    \ (seen under `dontAsk` and under `--tools`) |\n| *(absent)* / `stopped` | `claude\
    \ stop`ped; conversation retained |\n\nMapped against \xA79's vocabulary: `cancelled`\
    \ \u2248 `stopped`, `timeout` we would still impose ourselves, and `completed`\
    \ vs `finished_without_handoff` **cannot be distinguished from this JSON at all**\
    \ \u2014 both are `idle`/`done`. That distinction has to come from the task record\
    \ (did the ball move?), which is where \xA79 already got it. `failed` and `crashed`\
    \ have no representation: there is no exit code in the ledger.\n\nTwo more findings\
    \ that bear on the decision:\n\n- **`--bg` ignores `--session-id`.** It warns:\
    \ `--bg manages the session id; ignoring --session-id (use --resume <id> to continue\
    \ an existing session)`. The spec's \"the caller assigns the id, so a run id and\
    \ a session id can be the same value\" is **false**. A dispatcher must capture\
    \ the id from stdout or correlate through `agents --json`.\n- **A `--bg` session\
    \ never exits.** On completion it becomes `idle`/`done` and keeps its pid. Sessions\
    \ accumulate until `claude stop` or `claude rm`. That is a process-lifecycle obligation\
    \ the session model *adds*, not one it removes.\n\n## Undocumented surface worth\
    \ knowing\n\nNot in `claude --help`'s command list, but real and self-documenting:\n\
    \n| Command | Behaviour |\n|---|---|\n| `claude logs <id>` | Recent terminal output\
    \ \u2014 **ANSI pty scrape, not structured** |\n| `claude stop <id>` | Stops the\
    \ session, keeps the conversation, retains the worktree |\n| `claude attach <id>`\
    \ | Opens it in the current terminal |\n| `claude rm <id>` | Removes worktree\
    \ and job state; **refuses if the worktree has uncommitted changes** |\n| `claude\
    \ agents --cwd <path>` | Filters the ledger by path \u2014 scopes a listing to\
    \ one project root |\n\nAnd `-w` containment, verified: worktree at `<root>/.claude/worktrees/<name>`,\
    \ branch `worktree-<name>`, **git-locked with a lock reason naming the session\
    \ and pid** (`git worktree remove` refused, `-f -f` required), with `agents --json`\
    \ reporting the session's `cwd` as the worktree path."
