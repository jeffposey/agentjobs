- id: 6
  ts: '2026-08-18T05:11:15.137445Z'
  actor: claude
  type: progress
  body: "## Recommendation for Jeff's decision \u2014 not a decision entry\n\n**Recommended:\
    \ drive `claude agents` in session mode as the primary path, and keep batch `-p`\
    \ as a second declared runner mode \u2014 split by what the run is for, not by\
    \ which vendor it is.**\n\nEntry 1 already settled the vendor question. What the\
    \ experiments add is that the two-mode abstraction it proposed is better motivated\
    \ than it looked: the second mode is not merely a fallback for a CLI without a\
    \ session manager, it is the *right* mode for a whole class of dispatch.\n\n###\
    \ Against the stated goal\n\nThe goal is to stop routing work through a chat window.\
    \ The honest accounting:\n\n- **Batch fails it.** Click Dispatch, read the result.\
    \ No redirect mid-flight. Everything you would want to say to a running agent\
    \ has to wait until it is finished and be said as a new dispatch. That replaces\
    \ the tracking and leaves the conversation exactly where it is.\n- **Session mostly\
    \ satisfies it, with one thing worth naming.** The run is steerable \u2014 but\
    \ **the steering happens in Claude's surface, not in AgentJobs'.** There is no\
    \ CLI verb to send a message into a running background session; you redirect it\
    \ at `claude.ai/code/session_...` or by `claude attach`. AgentJobs starts it,\
    \ records it, links to it.\n\nSo session mode does not remove the chat window.\
    \ It **demotes** it: AgentJobs becomes where work is tracked and decided, chat\
    \ becomes where a specific run is steered, and every such conversation now hangs\
    \ off a task record instead of floating free. I think that is the split you actually\
    \ want, and it is the strongest form of the goal that this CLI can deliver. It\
    \ is not \"chat is gone.\"\n\n### What it costs, stated at full weight\n\nThese\
    \ are real, and the third one is the best argument for the rejected option:\n\n\
    1. **Output becomes a screen scrape.** `claude logs <id>` returns ANSI pty rendering,\
    \ not structured events. Batch mode's `-p --output-format=stream-json` is genuinely\
    \ machine-readable. Recommendation: AgentJobs should **not parse `claude logs`**\
    \ \u2014 link to it, and take structured state from `agents --json` and the task\
    \ record.\n2. **Outcome fidelity drops.** `completed` vs `finished_without_handoff`\
    \ is indistinguishable in the ledger (both `idle`/`done`) \u2014 that one still\
    \ comes from the task record, as \xA79 already had it. But `failed` and `crashed`\
    \ have **no representation at all**: there is no exit code, and a session that\
    \ errors internally still reports `idle`/`done`. Batch mode gets this free from\
    \ the process exit.\n3. **There is no spend ceiling.** `--max-budget-usd` is `--print`-only,\
    \ verified in `--help`. **Session mode has no per-run money stop**, so \xA77's\
    \ runaway protection is reduced to the dispatch-count caps and loses its only\
    \ hard limit. Given a subscription usage window rather than a per-token bill this\
    \ is less severe than it sounds, but it is a real capability that batch has and\
    \ session does not.\n4. **Sessions never exit.** An `idle`/`done` session holds\
    \ its pid until `claude stop` or `claude rm`. Reaping becomes AgentJobs' job \u2014\
    \ a lifecycle obligation the session model *adds*.\n5. **The Remote Control URL\
    \ is only in the scrape.** It is not a field in `agents --json`. Putting \"continue\
    \ on your phone\" in the AgentJobs UI means either scraping it or reconstructing\
    \ it from the session id, and I have verified neither.\n\n### The two modes, and\
    \ what actually distinguishes them\n\nRather than `claude` vs `codex`, a runner\
    \ declares which it is:\n\n| Mode | Invocation | Good for | Gets |\n|---|---|---|---|\n\
    | `session` | `--bg --remote-control -w <slug>` | Work you might want to redirect:\
    \ implementation, anything long, anything that may need a permission answered\
    \ | Steerable from any device, worktree containment, park-and-ask |\n| `batch`\
    \ | `-p --output-format=stream-json --max-budget-usd N` | Bounded reports: review,\
    \ triage, defect hunts, the 2026-08-11 read-only run | Spend ceiling, structured\
    \ output, real exit code |\n\nThis keeps the generic argv-template runner of \xA7\
    4 intact and satisfies entry 1's constraint that the abstraction not become a\
    \ Claude-shaped hole \u2014 a CLI with no session manager simply declares `batch`\
    \ and gets the \xA79 supervisor model, which is retained rather than deleted.\n\
    \n### sc-3 \u2014 what survives of \xA79 if driving\n\n- **Supervisor thread per\
    \ run: gone** in session mode, replaced by a poller over `claude agents --json\
    \ --cwd <root>`. Retained for `batch`.\n- **Run directories and stdout capture:\
    \ gone** in session mode; `claude logs` owns it.\n- **\"Runs do not outlive their\
    \ supervisor\": must be reversed for session mode.** The rule existed to prevent\
    \ an unsupervised orphan with no kill switch. That premise no longer holds \u2014\
    \ `claude stop <id>` is a working kill switch that does not involve AgentJobs\
    \ at all, and the session is reachable from any device. Killing live sessions\
    \ because `agentjobs serve` restarted would destroy work for no safety gain. Startup\
    \ reconciliation inverts from \"declare it `interrupted`\" to \"re-attach to whatever\
    \ is still in the ledger.\"\n- **The wall-clock timeout needs different semantics.**\
    \ 1800s is right for a batch and wrong for a session you might pick up hours later.\
    \ Suggested replacement, for your call: no hard kill, but treat a session sitting\
    \ `idle`/`done` past a threshold with an unmoved ball as `finished_without_handoff`\
    \ and move the ball. That preserves what the timeout was protecting (a task silently\
    \ going nowhere) without killing a session you intended to return to.\n\n### sc-5\
    \ \u2014 what happens to task-070 and task-072\n\nRecommendation is **rescope\
    \ both, close neither.**\n\n- **task-070** shrinks substantially: spawn, capture\
    \ the id from stdout (it cannot be assigned \u2014 see the `--session-id` finding),\
    \ record it, poll. The supervisor-thread spec and run-directory spec stay in the\
    \ record but scoped to `batch` mode. Its verification plan (fake runner that exits\
    \ non-zero, one that hangs, one that emits megabytes) still applies to `batch`\
    \ and needs a session-mode equivalent written.\n- **task-072** survives more than\
    \ the spec anticipated. `claude agents --json` is a ledger but **not our ledger**\
    \ \u2014 it has no run\u2192task mapping, no dispatch attribution, no history\
    \ once `claude rm` runs. AgentJobs still needs its own ledger keyed by task; what\
    \ changes is that it stores a session id and delegates cancellation to `claude\
    \ stop` instead of managing process groups.\n\n### Rejected alternative, with\
    \ its cost\n\n**Supervise our own `-p` processes only** (the original \xA79 model).\
    \ Cost: fails the stated goal outright \u2014 no mid-flight redirect, so dispatch\
    \ replaces the tracking and leaves the conversation in chat. Also duplicates a\
    \ session manager that already exists and is scriptable. What it would have bought,\
    \ and what we give up by not choosing it: a hard spend ceiling, structured stream-json\
    \ output, and exit-code-derived `failed`/`crashed` outcomes. Those are genuine,\
    \ which is exactly why the recommendation keeps this mode available rather than\
    \ deleting it.\n\n### One thing to confirm before building\n\nQ2 is evidenced\
    \ but not end-to-end tested \u2014 I read the Remote Control URL out of a backgrounded\
    \ session's own transcript, but did not open it on a device. Thirty-second check,\
    \ worth doing before code depends on it."
