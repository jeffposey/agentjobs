  actor: claude
  type: decision
  body: "# `check` is a new field, not a filled-in `verify` \u2014 and this task's\
    \ own constraint was factually wrong\n\nThis task's constraints say:\n\n> `AcceptanceCriterion.verify`\
    \ already exists in the schema and is unused. Prefer filling it over inventing\
    \ a parallel mechanism.\n\n**The premise is wrong.** Measured against the corpus\
    \ on 2026-08-18:\n\n| | count |\n|---|---|\n| `acceptance[].verify` values present\
    \ | **132** |\n| Of those, shaped like a runnable command | ~36 |\n| Of those,\
    \ prose describing how a *human* checks | ~96 |\n\nRepresentative of the ninety-six:\
    \ *\"Show the test failing against the unfixed code, then passing.\"* \xB7 *\"\
    Mutate the task from another surface with the detail page open, then promote.\"\
    * \xB7 *\"Jeff runs the install; the manifest validation errors, if any, are recorded.\"\
    *\n\nThose are good entries. Several describe things no command can decide.\n\n\
    **The decision.** `check` is a new optional field, an argv list. `verify` keeps\
    \ its meaning as prose about what a person should do. A criterion may carry both,\
    \ and one that does is the best-documented kind: the command says whether it passes,\
    \ the prose says what passing is meant to mean.\n\n**Rejected: repurposing `verify`.**\
    \ Ninety-six prose strings would become commands. The only rescue \u2014 \"execute\
    \ it if it looks like a command\" \u2014 makes a *heuristic* the security boundary\
    \ on a field that is committed to a repository and cloned onto other people's\
    \ machines. A heuristic deciding whether to execute a string is not a boundary.\n\
    \n**Rejected: restructuring `verify` into `{text, check}`.** Cleaner on a blank\
    \ page; a breaking schema change to 132 existing values for no behaviour a new\
    \ optional field does not already give.\n\nThe constraint was a reasonable belief\
    \ that turned out not to survive `grep`, which is exactly the kind of thing a\
    \ design pass exists to find. Recorded here rather than quietly worked around,\
    \ because the next person to read that constraint will otherwise think the design\
    \ ignored it."
  data:
