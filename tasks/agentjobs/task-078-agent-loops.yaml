- id: 3
  ts: '2026-08-18T11:41:04.568761Z'
  actor: claude
  type: decision
  body: "# The budget caps as \xA72a published them would have made D5 inert\n\nCorrecting\
    \ a rule that is already in a design document, so it is recorded as a decision\
    \ rather than buried in a diff.\n\n**What \xA72a said:**\n\n> \xA77's caps now\
    \ bind here. They were scoped to auto-dispatch (D3) because a human clicking is\
    \ a decision; a loop is not clicking, so the per-task counts and cooldown apply\
    \ to every iteration after the first.\n\n**What that would do.** The per-task-per-day\
    \ cap is **3**. A chain a human explicitly authorized for 5 iterations would be\
    \ refused at iteration 4 \u2014 by a limit designed for a different mechanism,\
    \ silently, mid-chain. And the 60-second cooldown would insert a minute of dead\
    \ time between iterations for nothing: the previous iteration has already reached\
    \ a terminal state, which is the exact condition the cooldown exists to guarantee.\n\
    \nThe clause is right in spirit \u2014 a loop is not a human clicking, so it needs\
    \ bounding \u2014 and wrong in the unit it counts.\n\n**Decision L7:**\n\n- **Per-task-per-day\
    \ (3) counts authorized chains**, not iterations. Three separate chains against\
    \ one task in a day is still the signal the cap was built to give \u2014 something\
    \ is wrong with the task \u2014 and it no longer truncates the mechanism it was\
    \ meant to bound.\n- **Per-task-lifetime (10) keeps counting dispatches.** It\
    \ stays a true backstop: it is the number that catches a bug in the loop driver\
    \ itself, and a backstop redefined to accommodate the thing it guards is not a\
    \ backstop. A chain that would cross it is refused mid-chain and stops loudly.\n\
    - **Cooldown does not apply within a chain.** It exists to stop two runs being\
    \ started in the same breath, and iteration *n+1* begins only after *n* is terminal\
    \ by construction.\n\n**Rejected: raising the per-day cap for loops.** It sets\
    \ the number by what the feature needs rather than by what the cap is for, and\
    \ the next feature would ask for the same. Changing the unit is the honest fix;\
    \ changing the number to accommodate is how a limit stops meaning anything.\n\n\
    \xA72a is amended in this branch to say so, with the reasoning inline. Left as\
    \ published, the first person to implement D5 would have discovered the contradiction\
    \ by watching a chain die at iteration 4 and spent an afternoon deciding whether\
    \ it was a bug."
