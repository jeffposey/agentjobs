- id: 5
  ts: '2026-08-18T11:42:55.673474Z'
  actor: claude
  type: transition
  body: "# Design pass complete, merged, six implementation tasks derived\n\n`docs/agent-loops-design.md`,\
    \ 12 sections, seven decisions (L1\u2013L7) each with what it rejected and why.\
    \ Merged `--no-ff`, nothing pushed. Branch marked merged, worktree removed.\n\n\
    ## The questions the task set, answered\n\n**The thesis survives, narrowed.**\
    \ AgentJobs' contribution is not running loops \u2014 it is that a task already\
    \ carries the two things a chat window does not: a stated definition of done and\
    \ a history that outlives the process. The gap is that `acceptance[]` is prose.\n\
    \n**The counter-argument (sc-6) is conceded and used to scope the design.** The\
    \ inner loop \u2014 write, test, fix \u2014 is what agent CLIs already do, for\
    \ free and *better*, because it keeps its context. The outer loop buys exactly\
    \ three things: survival past context exhaustion (the big one, and specific to\
    \ having a durable record), a termination condition the agent does not control,\
    \ and an audit trail. Everything else credited to outer loops is the inner loop\
    \ wearing a costume. The consequence is a rule: an outer iteration begins only\
    \ when the inner loop has genuinely stopped.\n\n**Security (sc-3).** Checks run\
    \ only for projects already enabled for dispatch, under task-068's existing four\
    \ gates \u2014 never on read, never implicitly. The argument for reusing rather\
    \ than inventing a weaker gate: enabling dispatch already authorizes an autonomous\
    \ agent with write access, and a check is strictly less dangerous than that. An\
    \ allow-list of permitted executables was rejected as security theatre \u2014\
    \ `poetry run <anything>` is on any plausible allow-list.\n\n**Numbers (sc-4),\
    \ each with its reasoning:** 5 iterations default / 20 ceiling; 4h chain wall-clock\
    \ / 12h ceiling; thrash at **3** identical result vectors, not 2, because two\
    \ is one flaky rerun plus a no-op fix; regression stops **immediately with no\
    \ retry**.\n\n**Mixed criteria (sc-5).** The loop converges on the checked ones,\
    \ never marks an unchecked one met, and stops at `human`/`review` rather than\
    \ `completed` \u2014 the prose criteria are exactly the judgement it cannot make.\n\
    \n## Two findings that changed the design\n\nBoth recorded as decision entries\
    \ above, because a diff would not carry them:\n\n1. **This task's own constraint\
    \ was factually wrong.** `verify` is not unused: 132 values in the corpus, ~96\
    \ of them prose describing what a *person* should do. Executing that field would\
    \ reinterpret them as commands, and the only rescue makes a heuristic the security\
    \ boundary. So `check` is a new field and `verify` keeps its meaning.\n2. **Dispatch\
    \ design \xA72a would have made D5 inert.** The per-task-per-day cap of 3 would\
    \ kill any chain authorized for more than three iterations, and the 60s cooldown\
    \ would insert dead time between iterations that are serial by construction. \xA7\
    2a is amended here: per-day counts chains, the lifetime cap keeps counting dispatches\
    \ as a true backstop, the cooldown does not apply within a chain.\n\n## Derived\
    \ tasks\n\n**task-147** schema \xB7 **task-148** evaluator \xB7 **task-149** CLI/API\
    \ trigger \xB7 **task-150** chain authorization \xB7 **task-151** loop driver\
    \ \xB7 **task-152** GUI. Chained by `needs`.\n\n**147\u2013149 are the useful,\
    \ autonomy-free half** and the design names them as the natural stopping point:\
    \ executable acceptance criteria a person can evaluate on demand, carrying the\
    \ whole schema and security surface and none of the risk.\n\n**150 and 151 carry\
    \ an explicit constraint that they must not be started without Jeff's go-ahead\
    \ on building the outer loop at all**, with instructions to hand off `human`/`decision`\
    \ and stop. The design being finished is not the same as the decision being made,\
    \ and an agent working the backlog would otherwise make it by default \u2014 the\
    \ failure mode task-060's grooming pass identified on 2026-08-18.\n\nMerged without\
    \ human review under the autonomy grant on task-060 (entries 11 and 12). Docs\
    \ and task records only; no code."
