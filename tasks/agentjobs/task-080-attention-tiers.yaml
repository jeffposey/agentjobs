ball_prompt: 'Review branch `feat/task-080-attention-tiers` (2 commits, worktree ../aj-080).
  It splits the human inbox into a blocking tier that still badges and a quiet draft
  backlog that does not, and makes the task list default to open work. Worth a look
  in a browser as well as the diff: the dashboard now shows task-066 and task-067
  in a flat backlog section with no badge, and the task list opens on Open instead
  of All Status. Two judgement calls to confirm -- the default task list is flat rather
  than a tree (see the decision entry for why a tree would hide rows), and the alert
  heading is now ''Blocked on You'' rather than ''Waiting for Your Review''. Approve
  to merge --no-ff, or say what to change.'
