- id: 2
  ts: '2026-08-11T06:44:31.581248Z'
  actor: claude
  type: progress
  body: 'Both parts implemented on `feat/task-080-attention-tiers` (worktree ../aj-080).


    **Part one -- two tiers.** `blocks_human()` and `awaits_human_input()` in

    `src/agentjobs/api/routes/web.py` are now the single definition of each tier.

    `blocks_human` is `ball is HUMAN and lifecycle is not DRAFT`; a closed task has
    a null

    ball, so holding the ball already implies open and no extra check is needed. The
    badge,

    the dashboard alert panel, the umbrella child rollup (`_summarise_children`) and
    the

    project-switcher counts all call these instead of re-deriving `task.ball is Ball.HUMAN`

    inline -- that inline rule existed in three separate places and would otherwise
    have

    drifted apart.


    The dashboard gained a flat "Backlog awaiting your input" section listing the
    draft tier

    with a plain count: no red, no bell, no badge. The alert heading changed from
    "Waiting

    for Your Review" to "Blocked on You" because the panel also carries decisions,

    approvals and questions, so the old heading was false for some of what it listed.


    **Part two -- the task list default.** Added an `Open (not closed)` option defined
    as

    `lifecycle != closed` and made it the default; `initial_status` falls back to
    `open`

    rather than `all`. Defined by lifecycle rather than by enumerating outcomes so
    a future

    `Outcome` member cannot leak into the default view. No option was removed and

    `?status=all` / `?status=closed` still work.


    **Verified against a live server** (a second instance on port 8790 from the worktree,
    so

    the owner''s server on 8765 was left alone), reading the real task corpus:

    - badge: ABSENT (was showing 2)

    - alert panel rendered: False

    - backlog count: 2, containing task-066 and task-067

    - "Blocked on You" tile: 0, with "+2 in backlog" beneath it

    - task list default filter: `taskList(''open'')`; `?status=all` -> `taskList(''all'')`

    - status options: open, all, draft, ready, active, human, external, closed


    **Tests.** `tests/test_attention_tiers.py`, 18 new tests. Full suite 531 passed
    (was

    513). Assertions are on rendered values -- the integer inside the badge span,
    the string

    handed to the Alpine component -- not on markup presence. black and ruff clean;
    mypy

    clean on `src`. mypy reports 5 pre-existing errors in `tests/test_subtasks.py`,
    a file

    this branch does not touch.'
  data: {}
- id: 3
  ts: '2026-08-11T06:44:31.602348Z'
  actor: claude
  type: decision
  body: 'The default task list view is flat rather than a collapsible tree.


    `flattened` already treats any non-`all` status as a filter, so defaulting to
    `open`

    flattens the list. Rejected alternative: exempt `open` so the tree still applies
    by

    default. That is broken, not merely different -- a closed umbrella is filtered
    out under

    `open`, and `visible()` hides any row whose ancestors are not expanded, so the
    closed

    umbrella''s *open* children would have no parent row left to expand and would
    be

    unreachable in the default view. The row most likely to vanish that way is exactly
    the

    kind this list exists to surface.


    Depth indentation is rendered from `row.depth` independently of the tree state,
    so the

    outline survives; only collapsing is lost, and `All Status` restores it.'
  data: {}
- id: 4
  ts: '2026-08-11T06:44:31.622782Z'
  actor: claude
  type: note
  body: "Two known limitations, neither blocking, both deliberate.\n\n1. The alert\
    \ panel's \"View all N waiting tasks\" link points at `?status=human`, which is\n\
    \   a superset of the blocking tier -- it also matches parked drafts. The link\
    \ only\n   appears when more than three tasks are blocked. Making it exact would\
    \ mean adding a\n   `blocking` option to the status select, which is more vocabulary\
    \ than the fix needs.\n\n2. The task list's row-level filtering is client-side\
    \ Alpine, so a Python test cannot\n   assert that a closed row is absent from\
    \ the rendered default view. What is asserted\n   is the value the browser initialises\
    \ with (`taskList('open')`), which is the input\n   that decides the outcome.\
    \ The predicate itself was checked by hand against the live\n   server."
  data: {}
