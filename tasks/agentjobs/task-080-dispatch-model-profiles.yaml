- id: 5
  ts: '2026-08-18T20:47:39.631968Z'
  actor: Jeff Posey
  type: handoff
  body: "Changes requested by Jeff Posey:\n\n# Decisions on all four questions\n\n\
    Answering as `task-080-dispatch-model-profiles` (never the bare number \u2014\
    \ the closed\n`task-080-attention-tiers` shares it).\n\n## D1 \u2014 Difficulty\
    \ on the task: yes, three levels\n\n`routine` / `standard` / `hard`.\n\n- **Absent\
    \ is legal**, means `standard`, and the audit trail records that it was\n  *defaulted*\
    \ rather than *declared*. Requiring it would invalidate the corpus.\n- **Rejected:**\
    \ five levels \u2014 a five-level scale that people honestly use three levels\n\
    \  of is a scale with two dead values. **Rejected:** T-shirt sizes \u2014 they\
    \ read as\n  *effort*, which is the one field difficulty must not be confused\
    \ with.\n- **Correction to the justification in the handoff.** Do not record difficulty\
    \ as\n  earning its place because routing will consume it later. Given D4, it\
    \ ships with no\n  automated consumer at all. It justifies itself on human orientation\
    \ and filtering \u2014\n  *\"which of my ready tasks is hard enough that I should\
    \ drive it myself rather than\n  hand it to an agent\"* \u2014 and the design\
    \ should say so plainly, so a later reader does\n  not mistake an unconsumed field\
    \ for a broken one.\n\n## D2 \u2014 A profile selects a runner, plus declared\
    \ labels\n\nTake the recommended shape (difficulty \u2192 an existing runner),\
    \ with one amendment:\n**a runner may declare optional descriptive `model` and\
    \ `effort` labels.**\n\n- Labels are authored metadata for display and audit only.\
    \ They are **never parsed out\n  of argv, never used to construct a command, never\
    \ validated against a provider\n  vocabulary.** AgentJobs still does not learn\
    \ what a model is, and the security\n  boundary is untouched \u2014 argv remains\
    \ the only thing that launches.\n- This buys back the explanation runner-only\
    \ gives up:\n  `difficulty hard \u2192 profile balanced \u2192 runner claude-opus-max\
    \ (labels: opus / max)`.\n- **Cost, accepted:** a label can drift from the argv\
    \ beside it. That is a\n  documentation defect, not a dispatch defect. The design\
    \ must state this, and the GUI\n  must not present labels as though AgentJobs\
    \ verified them \u2014 they are the runner\n  author's claim, shown as such.\n\
    - **Rejected:** `{model}`/`{effort}` placeholders in argv with a\n  difficulty\
    \ \u2192 (model, effort) table. Log entry 2 settles it: Claude Code has five\n\
    \  effort levels, Codex has eight plus `Custom(String)`. That option needs a per-runner\n\
    \  vocabulary, which is per-provider tables wearing a portable name, plus a vocabulary\n\
    \  to keep current as models change.\n- **Rejected:** runner-only with no labels.\
    \ The saving is zero and it leaves the audit\n  trail unable to answer \"why did\
    \ this run cost that much\" in the terms the question is\n  asked in.\n\n## D3\
    \ \u2014 Precedence as proposed, plus an opt-in strict mode\n\nOrder stands, narrowest\
    \ first: **one-run override \u2192 profile named on this dispatch \u2192\nproject\
    \ default profile \u2192 machine default profile \u2192 the project's plain runner.**\
    \ Every\nlevel that participated is recorded, including which one won and why.\n\
    \n- **Default on an unmatched difficulty or a hole in the table:** fall back to\
    \ the plain\n  runner and *say so*. Do not refuse. A dispatch that dies because\
    \ a config table has a\n  hole is the worse failure.\n- **New: a per-profile `strict`\
    \ setting that refuses instead of falling back.** The\n  permissive default is\
    \ right for availability, but deliberate spend is the entire\n  point of the feature\
    \ \u2014 someone who selected a conservative profile and silently got a\n  frontier\
    \ model because a rule was missing was failed quietly. Strict turns that into\
    \ a\n  loud, chosen failure.\n- Strict is **opt-in and off by default**. A strict\
    \ refusal must name the profile, the\n  difficulty, and the rule that was missing\
    \ \u2014 enough to fix the config without a\n  debugger.\n\n## D4 \u2014 Land\
    \ difficulty now; defer the profile layer against a written trigger\n\n- **Build\
    \ now:** the `difficulty` field, its default-and-record behaviour, and filtering\n\
    \  in the list surfaces (CLI and GUI).\n- **Defer:** profiles, the resolver, precedence,\
    \ launch-plan preview, strict mode.\n- **Write the deferred design down anyway.**\
    \ The profile shape above is *decided*, not\n  merely discussed. `docs/agent-dispatch-design.md`\
    \ \xA74 records it as accepted-but-unbuilt\n  so the next session does not re-derive\
    \ it.\n- **Reopen trigger \u2014 whichever comes first, recorded in the doc so\
    \ this is a deferral\n  and not a dropped idea:**\n  1. 20 real dispatches have\
    \ run; or\n  2. a dispatch is first observed consuming a materially wrong-cost\
    \ model for the work,\n     in either direction; or\n  3. auto-dispatch or bounded\
    \ loops (`task-078-agent-loops`) begin dispatching\n     unattended \u2014 an\
    \ unattended loop with no cost policy is a different risk class than\n     a manual\
    \ dispatch, and it should not be the thing that discovers this.\n\n---\n\n## What\
    \ the next session does\n\n1. Record the above as a `decision` entry, naming each\
    \ rejected alternative.\n2. Amend `docs/agent-dispatch-design.md` \xA74: the difficulty\
    \ vocabulary, profile \u2192\n   runner + declared labels, precedence with strict\
    \ mode, and the deferral trigger.\n   Mark the profile layer accepted-but-unbuilt.\n\
    3. Update acceptance honestly. Criteria the amended design genuinely satisfies\
    \ get\n   `met`; where the deferral means a criterion cannot be satisfied \u2014\
    \ sc-7's profile\n   selection and launch-plan preview flows in particular \u2014\
    \ say that in the record\n   rather than marking it met.\n4. Derive **one** narrowly\
    \ scoped implementation task for the difficulty field (schema,\n   storage, CLI,\
    \ GUI filter). Do not widen task-068 / 069 / 073 / 077 / 078; add a\n   pointer\
    \ to this decision on each so their authors can see the shape that is coming,\n\
    \   and leave their scope alone.\n5. Write no implementation code under this task\
    \ \u2014 `out_of_scope` still holds."
