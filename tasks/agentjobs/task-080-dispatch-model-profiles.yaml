- id: 2
  ts: '2026-08-18T11:47:18.676194Z'
  actor: claude
  type: progress
  body: "# sc-4: the two CLI surfaces, verified rather than guessed\n\nThis is the\
    \ research half. It is reported separately from the recommendation because it\
    \ changed the recommendation, and because a later reader should be able to check\
    \ the evidence without taking the conclusion on trust.\n\n## Claude Code \u2014\
    \ verified against the installed binary, v2.1.228\n\n`claude --help`, read directly:\n\
    \n| Flag | Values |\n|---|---|\n| `--model <model>` | An alias for the latest\
    \ model (`fable`, `opus`, `sonnet`) **or** a full name (`claude-fable-5`) |\n\
    | `--effort <level>` | `low`, `medium`, `high`, `xhigh`, `max` |\n| `--fallback-model\
    \ <model>` | Comma-separated list, tried in order when the default is overloaded\
    \ or unavailable |\n\n**There is no profile flag.** `claude --help` is 238 lines\
    \ and contains no occurrence of \"profile\". Model and effort are per-invocation\
    \ flags and nothing else.\n\n## Codex \u2014 not installed on this machine, so\
    \ read from the source\n\n`codex` is not on PATH here, so the CLI could not be\
    \ interrogated. Evidence is from the `openai/codex` repository instead, which\
    \ is primary rather than a cheat-sheet blog.\n\n`codex-rs/utils/cli/src/shared_options.rs`:\n\
    \n| Flag | |\n|---|---|\n| `-m, --model <model>` | |\n| `-p, --profile <name>`\
    \ | **A named profile** |\n| `-c key=value` | Arbitrary config override |\n\n\
    `codex-rs/config/src/profile_toml.rs` \u2014 `struct ConfigProfile`, the shape\
    \ of a named profile in `~/.codex/config.toml`:\n\n```\nmodel, service_tier, model_provider,\
    \ approval_policy, approvals_reviewer,\nsandbox_mode, model_reasoning_effort,\
    \ plan_mode_reasoning_effort,\nmodel_reasoning_summary, model_verbosity, model_catalog_json,\
    \ personality, \u2026\n```\n\n`codex-rs/protocol/src/openai_models.rs` \u2014\
    \ `enum ReasoningEffort`:\n\n```\nNone, Minimal, Low, Medium, High, XHigh, Max,\
    \ Ultra, Custom(String)\n```\n\n## The four differences that matter\n\n1. **Both\
    \ have a model knob and an effort knob.** So a two-axis abstraction is genuinely\
    \ portable in principle. That much of the task's premise holds.\n\n2. **The effort\
    \ vocabularies do not align.** Claude Code offers five levels; Codex offers eight\
    \ plus `Custom(String)` \u2014 an explicit escape hatch for values its own client\
    \ does not yet know. They overlap on low/medium/high/xhigh/max; Codex adds none/minimal/ultra.\
    \ A shared AgentJobs enum would be a lowest common denominator that cannot express\
    \ `minimal` or `ultra`; a pass-through string would be unvalidatable, which is\
    \ exactly the \"lowest-common-denominator string bag\" the task's question 7 warns\
    \ against. **Neither horn is good, and that is a finding, not a detail.**\n\n\
    3. **Codex already has profiles, and they are richer than the ones this task proposes.**\
    \ `ConfigProfile` carries model, provider, two separate reasoning-effort settings,\
    \ verbosity, sandbox mode and approval policy \u2014 selectable with `-p`. An\
    \ AgentJobs profile layer would be a *second* profile system for Codex users,\
    \ with `-p` and AgentJobs' own profile competing to set the same keys, and no\
    \ way for AgentJobs to know which won.\n\n4. **Each has capabilities the other\
    \ lacks entirely.** Claude Code has `--fallback-model`; Codex has `model_provider`,\
    \ `service_tier` and `oss_provider`. Any abstraction covering both either drops\
    \ these or grows provider-specific escape hatches \u2014 which is the thing the\
    \ task explicitly does not want the generic runner interface to become.\n\n##\
    \ What this rules out, before any preference is expressed\n\nAn AgentJobs-owned\
    \ `(model, reasoning_effort)` policy layer with a shared vocabulary is not portable\
    \ in the way the task assumed. It can be made to work, but only by carrying a\
    \ per-runner vocabulary \u2014 at which point the \"portable\" abstraction is\
    \ per-provider tables wearing a portable name.\n\nThe trade-offs and a recommendation\
    \ follow in the next entry.\n\n*Sources: the installed `claude` v2.1.228 CLI help;\
    \ [openai/codex `shared_options.rs`](https://github.com/openai/codex/blob/main/codex-rs/utils/cli/src/shared_options.rs),\
    \ [`profile_toml.rs`](https://github.com/openai/codex/blob/main/codex-rs/config/src/profile_toml.rs),\
    \ [`openai_models.rs`](https://github.com/openai/codex/blob/main/codex-rs/protocol/src/openai_models.rs).*"
