- id: 8
  ts: '2026-08-18T21:49:59.577704Z'
  actor: claude
  type: question
  body: 'What does a **strict** profile refusal do when the caller is unattended --
    auto-dispatch, or a bounded loop from task-078-agent-loops?


    D3 makes strict mode refuse rather than fall back, and requires the refusal to
    name the profile, the difficulty and the missing rule. That is right for a human
    at a keyboard, who reads the message and fixes the config.


    An unattended caller has nobody to read it. A refusal that only returns an error
    there is a silent stall: the loop stops, the task still reads agent/work, and
    nothing indicates why. It likely has to move the ball to human/decision carrying
    the same text -- but that is a behaviour change to the loop, not just to the resolver,
    so it should be decided rather than assumed.


    Raised while writing the design amendment. Recorded in docs/agent-dispatch-design.md
    section 4 as an explicitly open block rather than answered by default. Not blocking:
    the profile layer is deferred, so nothing implements strict mode yet. It should
    be answered before it is built, and reopen trigger 3 -- unattended dispatch beginning
    -- is exactly when it will matter.'
  data:
