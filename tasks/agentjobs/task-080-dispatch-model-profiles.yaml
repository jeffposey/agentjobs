ball_reason: decision
ball_prompt: "# Four decisions, with a recommendation for each. Nothing is implemented\
  \ and nothing is decided.\n\nThe research is in log entry 2 \u2014 the two CLI surfaces,\
  \ verified against the installed `claude` v2.1.228 and the `openai/codex` source.\
  \ **It changed the recommendation**, so read that entry first if any of the reasoning\
  \ below looks unmotivated.\n\nThe headline from it: **Codex already has named profiles**\
  \ (`-p`, backed by a `ConfigProfile` in `config.toml` carrying model, provider,\
  \ reasoning effort, verbosity, sandbox mode). Claude Code has no profile concept\
  \ at all \u2014 just `--model` and `--effort`. And their effort vocabularies do\
  \ not align: Claude Code has 5 levels, Codex has 8 plus a `Custom(String)` escape\
  \ hatch. A shared AgentJobs effort enum is therefore either a lowest common denominator\
  \ or an unvalidatable string.\n\n---\n\n## Decision 1 \u2014 Does a task carry a\
  \ difficulty at all? *(Recommend: yes)*\n\nThis is the durable half and the only\
  \ part I would build without hesitation. It is provider-neutral, it belongs in the\
  \ task record, and it is useful **before** any routing exists \u2014 it tells a\
  \ human what to expect and it is filterable.\n\nHow it differs from what already\
  \ exists, which the task asked for explicitly:\n\n| Field | Answers |\n|---|---|\n\
  | `priority` | *How much does it matter that this happens?* |\n| `effort` (free\
  \ text) | *How long will it take?* |\n| **`difficulty`** | *How much capability\
  \ does doing it well require?* |\n\nThose come apart routinely. A one-line fix to\
  \ a race condition is `critical` priority, tiny effort, and genuinely hard. A large\
  \ mechanical rename is low priority, large effort, and easy.\n\n**Sub-question for\
  \ you:** the vocabulary. I would use **three levels, not five** \u2014 `routine`\
  \ / `standard` / `hard` \u2014 because I do not believe anyone can honestly distinguish\
  \ five, and a five-level scale that people use three levels of is a scale with two\
  \ dead values. T-shirt sizes are the obvious alternative and read as *effort*, which\
  \ is the field it must not be confused with.\n\n**Absent difficulty must be legal\
  \ and must mean something specific:** treat it as `standard`, and record in the\
  \ audit trail that it was defaulted rather than declared. Requiring it would make\
  \ every existing task in the corpus invalid.\n\n## Decision 2 \u2014 Does AgentJobs\
  \ own a model/effort policy layer? *(Recommend: no)*\n\nThis is where the research\
  \ pushes back hardest on the task's original shape.\n\n**Recommended instead: a\
  \ profile maps difficulty \u2192 an existing runner.** Runners already exist, already\
  \ carry argv, and argv already is the security boundary. So:\n\n```yaml\nprofiles:\n\
  \  balanced:\n    routine:  claude-sonnet\n    standard: claude-opus\n    hard:\
  \     claude-opus-max\n```\n\nwhere each of those names an ordinary runner whose\
  \ argv already says `--model opus --effort max`. AgentJobs never learns what a model\
  \ is, never maintains an effort vocabulary, and never fights Codex's `-p`.\n\n-\
  \ **Cost:** combinatorial. Three difficulties \xD7 two providers is six runner definitions\
  \ with near-identical argv, and AgentJobs can only explain a choice as *\"difficulty\
  \ hard \u2192 profile balanced \u2192 runner claude-opus-max\"* \u2014 it cannot\
  \ say \"model opus at effort max\" without parsing argv, which it must not do.\n\
  - **The alternative I am rejecting:** `{model}` and `{effort}` placeholders in argv\
  \ plus a difficulty \u2192 (model, effort) table. Better explanations, one runner\
  \ per provider \u2014 and it needs a per-runner effort vocabulary anyway, because\
  \ the two CLIs' vocabularies differ. At that point it is the same thing with more\
  \ moving parts and a new vocabulary to keep current as models change.\n\n**Your\
  \ call, and it is a genuine trade:** is *\"it chose runner claude-opus-max\"* an\
  \ adequate explanation, or do you want the launch plan to name the model and effort\
  \ as structured data?\n\n## Decision 3 \u2014 Precedence, when there are several\
  \ sources *(Recommend: most specific wins, and every level is recorded)*\n\nProposed\
  \ order, narrowest first: **one-run override \u2192 profile named on this dispatch\
  \ \u2192 project default profile \u2192 machine default profile \u2192 the project's\
  \ plain `runner`** (today's behaviour, and the fallback when no profile matches).\n\
  \nAn unmatched difficulty falls back to the project's plain runner and **says so**\
  \ rather than refusing. A dispatch that refuses because a config table has a hole\
  \ is a worse failure than one that runs with the ordinary runner and records that\
  \ it did.\n\n## Decision 4 \u2014 Do we build this now, or record it and stop? *(Recommend:\
  \ difficulty now, profiles later)*\n\nDecision 1 is cheap, useful immediately, and\
  \ carries no risk. Decision 2 is a config-schema change plus a resolver plus CLI\
  \ and GUI surfaces, and its value is entirely proportional to how often you actually\
  \ dispatch \u2014 which, as of today, is not yet at all.\n\nSo my recommendation\
  \ is to land `difficulty` on the task schema, and hold the profile layer until dispatch\
  \ has been used enough to know whether the runner-per-difficulty shape is the right\
  \ one. **That is deliberately the same reasoning task-074's spec applied to auto-dispatch**,\
  \ and I flag it because you may well disagree given you raised this task on 2026-08-10\
  \ specifically wanting the spend control.\n\n---\n\n## What I need from you\n\n\
  1. Difficulty on the task: yes/no, and three levels or five.\n2. Profiles select\
  \ a **runner** (recommended) or a **model + effort pair**.\n3. The precedence order\
  \ above: agree or amend.\n4. Build the profile layer now, or land difficulty alone\
  \ and wait.\n\nOnce you answer, the next session records your decision with its\
  \ rejected alternatives, amends `docs/agent-dispatch-design.md` \xA74 so the document\
  \ and the record agree, and derives narrowly scoped implementation tasks \u2014\
  \ rather than silently widening the five dispatch tasks this one is related to.\n\
  \n**Nothing has been written to the codebase for this task.** No branch, no code,\
  \ no doc change \u2014 the design amendment is the outcome of your decision, not\
  \ an input to it."
