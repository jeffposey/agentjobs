  body: "# Model policy decided by Jeff, 2026-08-18. Recorded with rejected alternatives.\n\
    \nJeff's answers are verbatim in log entry 5. This entry is the durable decision\
    \ record required by this task's own constraints, and names what was rejected\
    \ so a later reader cannot mistake a settled trade for an oversight.\n\n## D1\
    \ -- `difficulty` on the task: yes, three levels\n\n`routine` / `standard` / `hard`.\
    \ Absent is legal, means `standard`, and the audit trail records that it was *defaulted*\
    \ rather than *declared*.\n\n- **Rejected: five levels.** A five-level scale people\
    \ honestly use three levels of is a scale with two dead values.\n- **Rejected:\
    \ t-shirt sizes.** They read as *effort*, which is the one field difficulty must\
    \ not be confused with.\n- **Rejected: requiring it.** Would invalidate every\
    \ task in the corpus.\n\n**Jeff corrected the justification I offered, and the\
    \ correction is the point.** I had argued difficulty earns its place because routing\
    \ will consume it later. Given D4 it ships with *no automated consumer at all*,\
    \ so it justifies itself on human orientation and filtering instead -- \"which\
    \ of my ready tasks is hard enough that I should drive it myself rather than hand\
    \ it to an agent\". The design now says so explicitly, so an unconsumed field\
    \ is not later read as a broken one.\n\n## D2 -- a profile selects a runner, plus\
    \ declared labels\n\nThe recommended shape, with Jeff's amendment: a runner may\
    \ declare optional descriptive `model` and `effort` labels, which are display\
    \ and audit metadata only -- never parsed out of argv, never used to construct\
    \ a command, never validated against a provider vocabulary.\n\n- **Rejected: `{model}`/`{effort}`\
    \ placeholders plus a difficulty \u2192 (model, effort) table.** Log entry 2 settles\
    \ it: Claude Code has five effort levels, Codex has eight plus `Custom(String)`.\
    \ That option needs a per-runner vocabulary, which is per-provider tables wearing\
    \ a portable name, plus a vocabulary to keep current as models change.\n- **Rejected:\
    \ runner-only with no labels.** The saving is zero and it leaves the audit trail\
    \ unable to answer \"why did this run cost that much\" in the terms the question\
    \ is asked in.\n- **Accepted cost, stated so it is not later filed as a bug:**\
    \ a label can drift from the argv beside it. That is a documentation defect, not\
    \ a dispatch defect. Any UI must present labels as the runner author's claim,\
    \ not as something AgentJobs verified.\n\n## D3 -- precedence as proposed, plus\
    \ opt-in strict mode\n\nNarrowest first: one-run override \u2192 profile named\
    \ on this dispatch \u2192 project default profile \u2192 machine default profile\
    \ \u2192 the project's plain runner. Every participating level is recorded, including\
    \ which won.\n\nDefault on an unmatched difficulty or a hole in the table: fall\
    \ back to the plain runner and say so. **Rejected: refusing by default** -- a\
    \ dispatch that dies because a config table has a gap is the worse failure.\n\n\
    New from Jeff: a per-profile `strict` setting that refuses instead of falling\
    \ back, opt-in and off by default, its refusal naming the profile, the difficulty\
    \ and the missing rule.\n\n## D4 -- difficulty now, profile layer deferred against\
    \ a written trigger\n\nBuild: the `difficulty` field, its default-and-record behaviour,\
    \ and filtering in CLI and GUI list surfaces. Defer: profiles, resolver, precedence,\
    \ launch-plan preview, strict mode.\n\n**Rejected: building the profile layer\
    \ now.** Its value is proportional to how often dispatch is actually used, which\
    \ as of today is barely at all. **Rejected: deferring without writing it down**\
    \ -- the shape is accepted, not merely discussed, and re-deriving it later is\
    \ waste. Reopen triggers are recorded in the design and in this task.\n\n## What\
    \ this changed in the repository\n\n`docs/agent-dispatch-design.md` section 4\
    \ gains \"Model policy: task difficulty and dispatch profiles\", on branch `docs/task-080-model-profiles-decision`.\
    \ No implementation code, per `out_of_scope`."
