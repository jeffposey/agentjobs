- id: 6
  ts: '2026-08-11T07:41:57.657553Z'
  actor: claude
  type: decision
  body: 'Review actions stay on the task detail page and are not added to the

    dashboard''s blocked-on-you panel.


    Raised in review as a question: should panel entries carry Approve / Request Changes

    buttons, or should the reader click through?


    Rejected putting them on the dashboard. The panel shows `ball_prompt` truncated
    to 160

    characters, and an approve button beside a truncated summary invites approving
    without

    reading the review request -- which is exactly what the merge gate exists to prevent.

    ENGINEERING.md is explicit that the task record must contain the complete review
    request

    and that absence of objection is not approval; a one-click approve next to a preview

    quietly converts the gate into a rubber stamp. The click-through is the safeguard,
    not

    friction to be optimised away.


    The cost is a real one and worth stating: acting on several blocked tasks means
    several

    page loads. Accepted, because the action being made slightly slower is a high-consequence

    irreversible one.


    Recorded as constraint and acceptance criterion on task-089 so the React port
    does not

    reintroduce it.'
  data: {}
- id: 7
  ts: '2026-08-11T07:41:57.680022Z'
  actor: claude
  type: note
  body: "Reviewing the ladder had a bootstrap problem: the dashboard shows exactly\
    \ one\nrung, and the only way to see the next one was to approve the task under\
    \ review. So the\nreviewer could see rung 1 and nothing else.\n\nFixed without\
    \ product code. Five throwaway projects, one per rung, live in a temp\ndirectory\
    \ with their **own registry** (`AGENTJOBS_HOME` pointed at a temp path), so the\n\
    machine's real project registry is untouched. A server on port 8792 serves them\
    \ and the\nexisting project switcher moves between rungs.\n\nVerified all five\
    \ render the rung they are named for:\n\n    rung1-blocked            panel=['blocked']\
    \            badge=2  backlog_tile=+2\n    rung2-backlog            panel=['backlog']\
    \            badge=-  backlog_tile=+2\n    rung3-next-up            panel=['next_up']\
    \            badge=-  backlog_tile=+0\n    rung4-nothing-claimable  panel=['nothing_claimable']\
    \  badge=-  backlog_tile=+0\n    rung5-empty              panel=['empty_project']\
    \      badge=-  backlog_tile=+0\n\nrung1 is the useful one for the traceability\
    \ question: the backlog panel is suppressed\nwhile two drafts are parked, and\
    \ the tile still reads \"+2 in backlog\" and links to them.\n\nBuilder script\
    \ and demo data are scratch, not committed. If a durable version is wanted,\n\
    `agentjobs load-test-data` is the natural home for it."
  data: {}
