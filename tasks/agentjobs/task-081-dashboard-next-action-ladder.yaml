- id: 2
  ts: '2026-08-11T07:21:21.273537Z'
  actor: claude
  type: progress
  body: 'Implemented on `feat/task-081-next-action-ladder` (worktree ../aj-081), one
    commit.


    `_next_action()` in `src/agentjobs/api/routes/web.py` returns the name of the
    single

    panel to render -- `blocked`, `backlog`, `next_up`, `nothing_claimable`, or

    `empty_project` -- and `dashboard.html` is now one if/elif chain over that name.
    It

    returns a name rather than several booleans deliberately: a template that re-derives
    the

    precedence from the individual lists is how two panels start rendering together
    again,

    which is the defect being fixed.


    Tier 3 calls `manager.get_next_task()`, so the dashboard cannot recommend one
    task while

    `agentjobs work` hands out another. It links to the task rather than launching
    it;

    dispatching is the 068-078 epic.


    Tier 4 has the two flavours the spec called for. The old standalone `stats.total
    == 0`

    getting-started block was removed from the bottom of the page and became the

    empty-project flavour -- left where it was it would have stacked under whichever
    panel

    the ladder chose, which is the same defect in a different place.


    The backlog panel is now suppressed whenever anything is blocked on you. The `+N
    in

    backlog` line on the "Blocked on You" tile is therefore unconditional and is now
    a link

    to `?status=draft`. That pairing is load-bearing: without it, a suppressed panel
    is

    indistinguishable from an empty backlog and drafts rot unseen, which is the failure

    task-080 removed.


    **Verified against a live server** (port 8791 from the worktree; the owner''s
    8765 was

    left alone), reading the real task corpus:

    - panels shown: `[''backlog'']` -- exactly one

    - tasks named in that panel: task-066, task-067

    - tile trace: `+2 in backlog -> /p/agentjobs/tasks?status=draft`

    - badge: ABSENT


    **Tests.** 542 pass, up from 531; 11 new. `TestTheLadderShowsOnePanel` parametrises
    all

    five states and asserts the rendered panel set is exactly one marker, so a regression

    that stacks two panels fails rather than passing quietly.

    `TestNextUpAgreesWithTheManager` gives two ready tasks of different priority and
    asserts

    the panel names the one the manager selects. `TestTheBacklogStaysTraceableWhenSuppressed`

    covers the tile trace and its link. black, ruff, and mypy on `src` are clean.'
  data: {}
