  type: decision
  body: 'The empty-project rung uses the disabled Create task button, not a CLI command.


    This reverses the earlier decision on this branch to keep `agentjobs create` there
    for first-run readers. The concern was that a disabled button strands someone
    with no other path to a first task; the owner reviewed that reasoning and chose
    the button anyway, on the grounds that a human should never be told to open a
    terminal to do the thing the page is for. The rocket, heading, docs link and the
    agent-facing TaskClient snippet all stay -- the snippet''s audience is a script,
    not the reader.


    The stranding concern is real until task-090 lands, and that task now carries
    an acceptance criterion tying the ladder''s fourth rung to the new form.'
