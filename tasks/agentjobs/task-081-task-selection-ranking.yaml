assignment:
  owner: claude
  eligible: []
spec:
  summary: Design a schema-backed queue_position that gives every open task an explicit
    place within its priority band, so AgentJobs always has one durable answer to
    what comes next.
  intent: Priority levels are deliberately coarse, and dependencies answer eligibility
    rather than scheduling. AgentJobs currently falls back to updated timestamps,
    so grooming or logging silently changes the queue. The work order must be explicit
    task data that humans and every client can see and change intentionally.
  description: 'The core decision is settled: add a first-class `queue_position` to
    the task schema. `priority` remains the urgency band; `queue_position` is the
    authoritative order within that band. Together they form a total order for open
    work. This is not described as a tie-breaker because it is real scheduling data,
    not an incidental fallback.


    Dependencies, eligibility, lifecycle, ball state, and open-child rules determine
    whether a task is currently claimable. They do not encode which independent task
    should come first. `get_next_task()` filters by those rules and then selects the
    lowest `(priority rank, queue_position)`. Mutable timestamps are never part of
    the order.


    The design must settle readable storage and managed reorder mechanics: positive
    positions, uniqueness within each open priority band, default insertion at the
    bottom of a band, explicit before/after moves, priority changes with defined placement,
    concurrency under a project-level reorder lock, and sparse numbering or another
    human-readable strategy that avoids rewriting the corpus on every move. Missing/duplicate
    positions or a failed rebalance are reported as queue corruption; task selection
    must not silently fall back to timestamp or ID.


    The order must be visible and operable everywhere: REST and Python client, dedicated
    CLI commands, React list/drag and keyboard controls, MCP read results and a high-level
    reorder verb, portable validation, generated schema docs, and agent rules requiring
    the explicit queue rather than chat instructions or invented dependency edges.
    Creation defaults must always produce a valid position.


    Migration assigns every open task a deterministic initial position, then records
    the currently requested program order: task-109 MCP first, task-120 issue reporter
    second, and this queue-ordering program after those. The design produces implementation
    children; it does not hide implementation inside a one-line sort change.'
  constraints: '- Every open task has exactly one queue position within its priority
    band; no two open tasks in one band may share it.

    - Priority plus queue_position is the complete scheduling order after claimability
    filtering. No timestamp, filesystem order, or implicit ID order participates.

    - Dependencies remain semantic prerequisites only. Never add a needs edge merely
    to say one independent task should be done before another.

    - All create, import, migration, reprioritize, reorder, close, and archive paths
    preserve a valid total order through manager/domain operations.

    - Reordering is a managed domain verb, not a generic content patch or direct YAML
    edit.

    - The user-facing term is Queue position (or Work order), not tie-breaker.

    - The design must remain readable in YAML and safe under concurrent agents.'
  out_of_scope: Estimating effort from prose, automatic business-priority scoring,
    using dependency centrality as a substitute for explicit human order, or making
    one global queue span multiple separately configured projects.
  context:
  - path: src/agentjobs/manager.py
    why: Current claimability filter and timestamp-based ordering that must be replaced.
  - path: src/agentjobs/models_v2.py
    why: Schema and invariants for the new queue_position field.
  - path: docs/mcp-integration-design.md
    why: Managed agent surface that must expose and obey queue order without generic
      mutation.
  - path: frontend/src
    why: Task lists and accessible reorder interaction.
