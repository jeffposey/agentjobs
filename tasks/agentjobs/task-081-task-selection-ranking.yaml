spec:
  summary: get_next_task() ranks by (priority, most-recently-updated). With every
    candidate at high priority, a bulk grooming pass left the choice of next task
    to microsecond file-write order.
  intent: Make the answer to 'what should I do next' come from signals that mean something,
    and make it explain itself. Auto-dispatch and agent loops will consume this answer
    with no human reading it.
  description: "Raised by Jeff on 2026-08-11, after `get_next_task()` offered task-080\
    \ when the task\nactually waiting to be done was task-079.\n\n## What happened,\
    \ precisely\n\n`get_next_task()` filters to claimable tasks -- ready, eligible,\
    \ no unmet `needs`, no\nopen children -- then sorts by `(priority_rank, -updated)`.\
    \ On 2026-08-11 that produced:\n\n```\n04:37:06.742900  task-068-dispatch-config\n\
    04:37:06.759369  task-069-dispatch-log-entries\n...\n04:37:06.939007  task-080-dispatch-model-profiles\n\
    ```\n\nThirteen task files were rewritten inside one second by a bulk re-parenting\
    \ pass. Every\ncandidate was `high`, so `priority_rank` tied for all of them and\
    \ the entire ranking\nfell through to `-updated` -- which at that point differed\
    \ only in microseconds, in the\norder the loop happened to write the files. **The\
    \ recommended next task was decided by\nfilesystem write order during an unrelated\
    \ grooming pass.**\n\nThis is not a bad sort key that produced a slightly wrong\
    \ order. It is a ranking with no\nsignal left in it, returning an answer with\
    \ full confidence.\n\n## The three problems, which are separable\n\n1. **Recency\
    \ is backwards as a tiebreak.** `-updated` promotes whatever was touched most\n\
    \   recently, so editing a task advances it in the queue and a task nobody has\
    \ edited in\n   weeks sinks. Any bulk edit reshuffles the whole backlog. Oldest-ready-first\
    \ is at\n   least stable and starvation-free; whether age is the *right* signal\
    \ is part of what\n   this task decides.\n\n2. **Priority has stopped discriminating.**\
    \ Eight of nine candidates were `high`. A\n   column that is constant carries\
    \ no information, and the tiebreak silently becomes the\n   ranking. Whatever\
    \ is designed here has to keep working when a human has marked\n   everything\
    \ important, because that is the normal state of a real backlog.\n\n3. **The dependency\
    \ graph is present and unused.** `needs` edges already record what\n   each task\
    \ unblocks: on the same day, task-077 unblocked two tasks, 068/069/076 one\n \
    \  each, and 080/078/075 none. \"How much does finishing this release?\" is computable\
    \ from\n   data already in every task file and is a better signal than either\
    \ input currently\n   used.\n\n## And a fourth, which is why this was noticed\
    \ at all\n\n`/next` returns a bare task. There is no way to ask why *that* one,\
    \ or what came second,\nso a ranking built on nothing looks identical to a ranking\
    \ built on judgement. Even a\ncorrect algorithm needs to explain itself here --\
    \ the same argument task-080 makes for\npreviewing a dispatch launch plan before\
    \ anything starts.\n\n## Scope\n\nA design document, not a sort-key patch. It\
    \ should settle:\n\n- What signals rank a claimable queue, and how they combine\
    \ when priority is uniform.\n- Whether unblocking value (transitive `needs` descendants)\
    \ belongs in the ranking, and\n  what it costs to compute on a corpus this size.\n\
    - Whether an in-flight effort should be preferred over starting a new one -- `parent`\n\
    \  now records which tasks are one effort, and finishing beats starting.\n- What\
    \ `/next` must return alongside the task: which signals fired, what ranked second,\n\
    \  and why the top task beat it.\n- Whether ties should be broken deterministically\
    \ (by id) rather than by a timestamp\n  that a bulk edit can flatten.\n\n## Why\
    \ this matters more than it looks\n\nToday a human reads the queue and applies\
    \ judgement, so a bad ranking is a mild\nannoyance. Task-074 (auto-dispatch) will\
    \ consume this function's answer without a human\nin the loop, and task-078 (agent\
    \ loops) will consume it repeatedly. At that point the\nranking stops being advice\
    \ and starts being the thing that decides what gets built.\n\nFiled `medium` deliberately.\
    \ Marking it `high` would add a ninth `high` task to a queue\nwhose central problem\
    \ is that `high` no longer means anything -- which would be a small\ndemonstration\
    \ of the bug rather than a fix for it.\n"
  constraints: '- Must degrade well when every task is high priority; that is the
    normal state of a real backlog, not an edge case.

    - Ties must break deterministically. A timestamp a bulk edit can flatten is not
    a tiebreak.

    - Ranking inputs must come from data already in the task files. This is not a
    licence to add scoring fields humans have to maintain by hand.

    - The existing claimability filter (ready, eligible, no unmet needs, no open children)
    is settled and not up for redesign here; this is about ordering what survives
    it.'
  out_of_scope: '- Implementing the ranking. This task produces the design; implementation
    tasks are derived from it.

    - Estimating or predicting effort from task prose.

    - Changing what makes a task claimable.'
  context: []
