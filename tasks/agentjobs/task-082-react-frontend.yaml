spec:
  summary: AgentJobs' web UI is server-rendered Jinja with Alpine for interactivity.
    Build a React + TypeScript client against the REST API that already exists, mounted
    alongside the Jinja UI rather than replacing it, so the product is never in a
    broken half-migrated state.
  intent: 'The API is already the real interface: FastAPI serves it, publishes an
    OpenAPI schema at /openapi.json, and agents and scripts consume it directly. The
    Jinja templates are a second, parallel consumer that re-derives presentation logic
    the API could hand over typed.


    Two limits of the current stack are felt in daily use rather than in theory. Pages
    are static once rendered -- a handoff that arrives while the dashboard is open
    is invisible until the browser is manually refreshed, which is exactly the moment
    the tool is supposed to be telling you something. And the client-side filtering
    that Alpine does is unreachable from the Python test suite, so the task list''s
    filter behaviour is verified by hand rather than by CI.


    A typed client generated from the OpenAPI schema also closes a real gap: today
    a template can render `data-ball="Ball.HUMAN"` and every filter silently matches
    nothing, because nothing checks that the rendered value matches what the consumer
    expects.'
  description: "## Shape\n\nVite + React + TypeScript, served at `/app`, talking to\
    \ the existing REST API.\nThe Jinja UI keeps working throughout and is not removed\
    \ by this umbrella;\nretiring it is a separate decision to make once the React\
    \ client is at parity and\nhas been used in anger.\n\nGroundwork already exists.\
    \ task-043 added the Vite dev origin\n(`http://localhost:5173`) to the CORS allowlist.\n\
    \n## Children, in order\n\n1. **083 scaffold** -- Vite/React/TS/Tailwind, mounted\
    \ at `/app`, dev proxy, Jinja\n   untouched, assets bundled rather than fetched\
    \ from a CDN.\n2. **084 typed client** -- generated from `/openapi.json`; no hand-written\
    \ request\n   types.\n3. **085 test harness** -- Vitest and React Testing Library\
    \ over checked-in\n   fixtures, in place before the first screen.\n4. **086 live\
    \ updates** -- the view reflects a handoff without a manual refresh.\n5. **087\
    \ dashboard** -- including the next-action ladder from task-081.\n6. **093 mobile\
    \ and PWA** -- usable and installable on a phone, reachable from\n   another device\
    \ without widening the bind. Placed here deliberately: after one\n   real screen\
    \ exists, and before the remaining screens, so the responsive\n   pattern is established\
    \ once rather than retrofitted three times.\n7. **088 task list** -- with the\
    \ filtering that is currently untestable in Alpine.\n8. **089 task detail** --\
    \ log, spec, and the review actions.\n9. **090 create task** -- the surface the\
    \ product has never had in a browser.\n10. **094 e2e hardening** -- network-boundary\
    \ mocking and one browser path,\n    against real screens.\n11. **091 packaging**\
    \ -- built assets ship in the wheel; `pip install` still needs\n    no node.\n\
    \n## A property to gain on the way\n\nThe Jinja UI loads Tailwind, Alpine, and\
    \ marked from public CDNs, so the current\nweb UI does not render without internet\
    \ access. That contradicts a property this\nproject has otherwise defended --\
    \ task-067 rejected git-lfs to keep a checkout\nself-sufficient. The React client\
    \ bundles its own dependencies, so finishing this\numbrella removes the last runtime\
    \ dependency on an external host. 083 owns that;\nit is called out here because\
    \ it is a reason to finish, not an incidental detail.\n\n## Why not migrate in\
    \ place\n\nEvery child leaves the product working. A half-migrated UI where some\
    \ pages are\nReact and some are Jinja and neither is complete is worse than either\
    \ end state,\nand it is the usual way a rewrite stalls permanently."
  constraints: "- The Jinja UI keeps working at every commit. This umbrella never\
    \ leaves the\n  product in a half-migrated state.\n- `pip install agentjobs` must\
    \ not require node. Built assets ship in the wheel\n  (task-091).\n- No hand-written\
    \ API types. They are generated from the OpenAPI schema, or the\n  typed contract\
    \ is decorative.\n- No runtime dependency on an external asset host. The client's\
    \ dependencies are\n  bundled.\n- The server binds loopback and refuses a wildcard\
    \ bind. This application has no\n  authentication, so reachable means unauthenticated\
    \ (task-093).\n- No backend behaviour changes to suit the client. If the API is\
    \ missing\n  something, that is its own task with its own reasoning -- task-086's\
    \ revision\n  endpoint and task-087's computed next action are the two known candidates,\
    \ and\n  each records its own justification."
  out_of_scope: Removing the Jinja UI -- a separate decision once React is at parity.
    Authentication and multi-user identity (task-066). Any change to the task schema.
  context:
