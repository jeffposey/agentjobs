spec:
  summary: The packaged React application is now AgentJobs' primary human interface,
    delivered through four phases against the existing typed REST API. Phase 4 has
    shipped creation, end-to-end coverage, wheel packaging, and React-first docs;
    its final task-corpus audit is in progress.
  intent: 'The API is already the real interface: FastAPI serves it, publishes an
    OpenAPI schema at /openapi.json, and agents and scripts consume it directly. The
    Jinja templates are a second, parallel consumer that re-derives presentation logic
    the API could hand over typed.


    Two limits of the current stack are felt in daily use rather than in theory. Pages
    are static once rendered -- a handoff that arrives while the dashboard is open
    is invisible until the browser is manually refreshed, which is exactly the moment
    the tool is supposed to be telling you something. And the client-side filtering
    that Alpine does is unreachable from the Python test suite, so the task list''s
    filter behaviour is verified by hand rather than by CI.


    A typed client generated from the OpenAPI schema also closes a real gap: today
    a template can render `data-ball="Ball.HUMAN"` and every filter silently matches
    nothing, because nothing checks that the rendered value matches what the consumer
    expects.'
  description: '## Current status after the React documentation audit (2026-08-13)


    The React application now ships at `/app/` in the universal Python wheel and is
    the primary browser, tablet, and phone interface. Phases 095 through 097 are closed
    completed. Phase 098 has delivered browser task creation, end-to-end testing,
    packaging, and React-first documentation; task 103 is its final active corpus
    audit. The remainder of this description is the original migration plan and is
    retained as design history, not a description of the current UI.

    ## Shape


    Vite + React + TypeScript, served at `/app`, talking to the existing REST API.
    The

    Jinja UI keeps working throughout and is not removed by this epic; retiring it
    is a

    separate decision to make once the React client is at parity and has been used
    in

    anger.


    Groundwork already exists. task-043 added the Vite dev origin

    (`http://localhost:5173`) to the CORS allowlist.


    ## Four phases


    This task holds only what is true across all of them. Each phase is its own task

    with its own gate, and each phase''s own record owns the ordering of its children.


    | Phase | Done means |

    | --- | --- |

    | **095 foundation** | a typed, tested React app is served at `/app` |

    | **096 parity** | every read the Jinja UI offers, React offers -- including from
    a phone |

    | **097 reach** | the client tells you something you did not go looking for |

    | **098 ship** | `pip install` yields the whole UI, and a browser test proves
    the stack agrees |


    **Why phases rather than eleven flat children.** The first version of this epic
    was

    one umbrella over eleven tasks, with the intended order living in a prose list
    in

    this description. Prose cannot be queried and cannot gate anything, and two

    ordering defects duly hid in it: live updates could not be verified before a

    dashboard existed, and the create-task form''s acceptance depended on a dashboard

    rung that did not exist yet. Neither showed up in `dependencies[]`, so nothing

    would have caught either until an agent tried to verify an acceptance criterion

    against a page that was not there. Phases make the sequence structural, and gate

    it.


    ## A property to gain on the way


    The Jinja UI loads Tailwind, Alpine, and marked from public CDNs, so the current

    web UI does not render without internet access. That sits badly with a property

    this project otherwise defends: task-067 weighs git-lfs for attachments and leans

    against it as "probably wrong for a `pip install` product", on the grounds that

    the tool needs nothing but Python. The React client bundles its own dependencies,

    so finishing this epic removes the last runtime dependency on an external host.

    Phase 1 owns that; it is recorded here because it is a reason to finish, not an

    incidental detail.


    ## Why not migrate in place


    Every phase leaves the product working. A half-migrated UI where some pages are

    React and some are Jinja and neither is complete is worse than either end state,

    and it is the usual way a rewrite stalls permanently.'
  constraints: "These apply to every phase and every child. A phase record repeats\
    \ one only when\nit needs to say something more specific.\n\n- The Jinja UI keeps\
    \ working at every commit. This epic never leaves the product in\n  a half-migrated\
    \ state.\n- `pip install agentjobs` must not require node. Built assets ship in\
    \ the wheel.\n- No hand-written API types. They are generated from the OpenAPI\
    \ schema, or the\n  typed contract is decorative.\n- No runtime dependency on\
    \ an external asset host. The client's dependencies are\n  bundled.\n- The server\
    \ binds loopback and refuses a wildcard bind. This application has no\n  authentication,\
    \ so reachable means unauthenticated.\n- Where a computation already exists in\
    \ Python, the client renders it rather than\n  re-deriving it in TypeScript. Two\
    \ definitions of one rule will drift.\n- No backend behaviour changes to suit\
    \ the client without recorded reasoning. Three\n  additions are already justified\
    \ in their own tasks: a revision endpoint\n  (task-086), a computed next action\
    \ (task-087), and reverse dependency edges\n  (task-099)."
  out_of_scope: Removing the Jinja UI -- a separate decision once React is at parity.
    Authentication and multi-user identity (task-066). Any change to the task schema.
    Redesigning the dashboard (task-092, deferred to post-parity).
