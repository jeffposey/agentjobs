- id: 1
  ts: '2026-08-13T02:36:12.712808Z'
  actor: claude
  type: decision
  body: 'Restructured from one umbrella over eleven flat children into four phase
    tasks, at the

    owner''s direction on 2026-08-12. This task stays as the root and holds only the

    cross-cutting constraints; the phases hold the sequence.


    Reasoning. Eleven children under one parent put the intended order in a prose
    list in this

    description, where nothing could query or enforce it -- and two ordering defects
    were

    found sitting in exactly that gap: task-086''s acceptance names "an open dashboard"
    while

    depending only on the typed client, and task-090''s names a dashboard ladder rung
    that

    task-087 had not yet built. Both are now explicit `needs` edges. A phase also
    gives a

    reviewable gate roughly every two to four days instead of one gate at the end
    of a

    fortnight.


    Rejected alternative: closing this task as superseded and making the four phases
    top

    level. That is closer to what was asked for literally, and was rejected because
    the

    cross-cutting constraints -- Jinja keeps working, no node at install, no external
    asset

    host, loopback bind, no second definition of a Python rule -- would then have
    to be

    restated in four records and would drift. Keeping a root costs one extra level
    of nesting,

    which `_nest_tasks` already renders.


    Also considered and rejected: moving those constraints into ENGINEERING.md instead.
    They

    are real project invariants, but editing the document every agent reads, on the
    strength

    of a migration that has not started, is premature. Revisit when the epic closes.'
