  type: decision
  body: 'The project id goes in the URL path: `/app/p/{project_id}/tasks/{task_id}`.
    Decided by the

    owner on 2026-08-12, before the task is claimed, so its agent does not have to
    guess.


    Reasoning: ac-3 requires a deep link to survive a hard refresh. A URL with no
    project

    segment resolves against whatever project is currently selected, so the same link
    means

    different things at different times -- which is not a linkable URL. The API is
    already

    mounted at both `/api` and `/api/projects/{project_id}`, the Jinja UI already
    routes under

    `/p/{project_id}`, and both the registry (task-057) and the switcher (task-061)
    are closed,

    so multiple projects are already reachable from one server.


    Rejected: holding the selected project in client state, which is a simpler scaffold
    and

    matches the legacy unprefixed router but breaks linkability. Also rejected: deferring
    the

    question and retrofitting scoping later, which would touch every route, every
    query key,

    and the typed client -- the most likely thing to be re-litigated in phase 2.'
  data: {}
