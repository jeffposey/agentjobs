spec:
  summary: Stand up a Vite + React + TypeScript + Tailwind application, served by
    FastAPI at /app in production and by the Vite dev server during development, with
    the Jinja UI entirely untouched.
  intent: Everything else in this umbrella needs somewhere to live. Doing this first
    and separately means the scaffolding decisions -- directory layout, dev proxy,
    routing, how the SPA is served -- are reviewable on their own rather than buried
    inside the first screen someone builds.
  description: 'A `frontend/` directory at the repository root holding the Vite project.
    Client-side routing under `/app` (React Router or equivalent), so `/app/tasks/task-042-...`
    is a real, linkable URL rather than state held in memory.


    Two serving modes:


    - **Development.** Vite dev server on 5173 with a proxy for `/api` to 8765, so
    there is no CORS round trip in the common path. The CORS allowlist already carries
    the 5173 origin from task-043, which covers direct calls too.

    - **Production.** FastAPI serves the built bundle from `/app`, with a catch-all
    so a deep link like `/app/tasks/xyz` returns the SPA shell rather than a 404.
    Getting that catch-all wrong is the classic SPA deployment bug: the app works
    until someone refreshes a sub-page.


    Tailwind is chosen for continuity -- the existing templates are already Tailwind,
    so the visual language and the dark palette carry over instead of being reinvented.


    Ship one trivial page that fetches something real from the API and renders it.
    Not a placeholder: proof the whole path works end to end.'
  constraints: '- Nothing under `src/agentjobs/api/templates/` changes. The Jinja
    UI is not touched by this task.

    - A deep link into the SPA must work on refresh, not only via in-app navigation.

    - `frontend/node_modules` and build output are gitignored.

    - No API changes.'
  out_of_scope: Any real screen -- dashboard, list, detail all have their own tasks.
    Packaging the built assets into the wheel (task-091). Authentication.
  context:
  - path: src/agentjobs/api/main.py
    why: Where the SPA mount and the existing CORS allowlist live.
  - path: src/agentjobs/api/templates/base.html
    why: The Tailwind palette and layout to carry over.
