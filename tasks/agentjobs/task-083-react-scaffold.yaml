spec:
  summary: Stand up a Vite + React + TypeScript + Tailwind application, served by
    FastAPI at /app in production and by the Vite dev server during development, with
    the Jinja UI entirely untouched.
  intent: Everything else in this umbrella needs somewhere to live. Doing this first
    and separately means the scaffolding decisions -- directory layout, dev proxy,
    routing, how the SPA is served -- are reviewable on their own rather than buried
    inside the first screen someone builds.
  description: "A `frontend/` directory at the repository root holding the Vite project.\n\
    Client-side routing under `/app` with React Router, so `/app/tasks/task-042-...`\n\
    is a real, linkable URL rather than state held in memory.\n\n## Toolchain\n\n\
    Do not let `create vite` pick the versions silently; this combination is known\
    \ to\nwork together as of 2026-08 and is a reasonable starting point:\n\n| Package\
    \ | Version |\n| --- | --- |\n| react, react-dom | 19.2 |\n| vite | 8.2 |\n| typescript\
    \ | 6.0 |\n| @vitejs/plugin-react | 6.0 |\n| vitest | 4.1 |\n\nRecord what you\
    \ actually installed. If a version differs from the table, say why,\nso the next\
    \ person reads a fact rather than a guess.\n\nLinting: `oxlint` is a defensible\
    \ choice over ESLint here -- one binary, no\nplugin-resolution tree, fast enough\
    \ that it runs on every commit without anyone\ndisabling it. Pick one and record\
    \ the choice.\n\n## Two serving modes\n\n- **Development.** Vite dev server on\
    \ 5173 with a proxy for `/api` to 8765, so\n  there is no CORS round trip in the\
    \ common path. The CORS allowlist already\n  carries the 5173 origin from task-043,\
    \ which covers direct calls too.\n- **Production.** FastAPI serves the built bundle\
    \ from `/app`, with a catch-all so\n  a deep link like `/app/tasks/xyz` returns\
    \ the SPA shell rather than a 404.\n  Getting that catch-all wrong is the classic\
    \ SPA deployment bug: the app works\n  until someone refreshes a sub-page.\n\n\
    ## Bundle the dependencies\n\nTailwind is chosen for continuity: the existing\
    \ templates are already Tailwind, so\nthe visual language and the dark palette\
    \ carry over instead of being reinvented.\n\n**But not the way the templates do\
    \ it.** `base.html` pulls Tailwind, Alpine, and\nmarked from public CDNs, which\
    \ means the current web UI does not render without\ninternet access, and a cached\
    \ offline shell could never style itself. Install\nTailwind as a real build dependency\
    \ and bundle it. Same for anything else the\nclient needs. No `<script src=\"\
    https://...\">` in the React app.\n\n## Shell\n\nSet the viewport meta and a mobile-first\
    \ base stylesheet now. task-093 makes the\nscreens work on a phone; it should\
    \ not have to go back and fix the document\nshell first.\n\n## Prove the path\n\
    \nShip one trivial page that fetches something real from the API and renders it.\n\
    Not a placeholder: proof the whole path works end to end."
  constraints: "- Nothing under `src/agentjobs/api/templates/` changes. The Jinja\
    \ UI is not\n  touched by this task.\n- A deep link into the SPA must work on\
    \ refresh, not only via in-app navigation.\n- No external asset host. Every dependency\
    \ is bundled, including Tailwind.\n- `frontend/node_modules` and build output\
    \ are gitignored.\n- The installed toolchain versions and the linter choice are\
    \ recorded.\n- No API changes."
  out_of_scope: Any real screen -- dashboard, list, detail all have their own tasks.
    Packaging the built assets into the wheel (task-091). Authentication.
  context:
  - path: src/agentjobs/api/main.py
    why: Where the SPA mount and the existing CORS allowlist live.
  - path: src/agentjobs/api/templates/base.html
    why: The Tailwind palette and layout to carry over.
