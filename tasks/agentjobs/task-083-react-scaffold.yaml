spec:
  summary: Stand up a Vite + React + TypeScript + Tailwind application, served by
    FastAPI at /app in production and by the Vite dev server during development, with
    the Jinja UI entirely untouched.
  intent: Everything else in this umbrella needs somewhere to live. Doing this first
    and separately means the scaffolding decisions -- directory layout, dev proxy,
    routing, how the SPA is served -- are reviewable on their own rather than buried
    inside the first screen someone builds.
  description: "A `frontend/` directory at the repository root holding the Vite project.\n\
    \n**The project id goes in the path: `/app/p/{project_id}/tasks/{task_id}`.**\n\
    Decided before this task starts, because it is the first thing you would\notherwise\
    \ have to guess and it constrains every later screen and query key. The\nAPI is\
    \ already mounted twice -- `/api` and `/api/projects/{project_id}` -- and the\n\
    Jinja UI already routes under `/p/{project_id}` with an unprefixed legacy router\n\
    beside it. The registry (task-057) and the project switcher (task-061) are both\n\
    closed, so more than one project is a live case, not a hypothetical. A URL without\n\
    the project cannot survive the hard refresh ac-3 requires once a second project\n\
    exists, because it resolves against whatever happens to be selected.\n\nClient-side\
    \ routing with React Router, so a deep link is a real, linkable URL\nrather than\
    \ state held in memory.\n\n**A note on the repository root:** there is already\
    \ a `package.json` and\n`node_modules/` there. It is `agentjobs-schema-tools`\
    \ -- mermaid rendering for the\nLinkML schemas, dev tooling only, and explicitly\
    \ not a runtime dependency of\nanything. Do not extend it or install into it.\
    \ `frontend/` is a separate project.\n`.gitignore` already covers `node_modules/`\
    \ and `dist/` at any depth, so nothing\nneeds adding there.\n\n## Toolchain\n\n\
    Do not let `create vite` pick the versions silently; this combination is known\
    \ to\nwork together as of 2026-08 and is a reasonable starting point:\n\n| Package\
    \ | Version |\n| --- | --- |\n| react, react-dom | 19.2 |\n| vite | 8.2 |\n| typescript\
    \ | 6.0 |\n| @vitejs/plugin-react | 6.0 |\n| vitest | 4.1 |\n| tailwindcss | 4.3\
    \ |\n| @tailwindcss/vite | 4.3 |\n\nRecord what you actually installed. If a version\
    \ differs from the table, say why,\nso the next person reads a fact rather than\
    \ a guess.\n\nLinting: `oxlint` is a defensible choice over ESLint here -- one\
    \ binary, no\nplugin-resolution tree, fast enough that it runs on every commit\
    \ without anyone\ndisabling it. Pick one and record the choice.\n\n## Two serving\
    \ modes\n\n- **Development.** Vite dev server on 5173 with a proxy for `/api`\
    \ to 8765, so\n  there is no CORS round trip in the common path. The CORS allowlist\
    \ already\n  carries the 5173 origin from task-043, which covers direct calls\
    \ too.\n- **Production.** FastAPI serves the built bundle from `/app`, with a\
    \ catch-all so\n  a deep link like `/app/tasks/xyz` returns the SPA shell rather\
    \ than a 404.\n  Getting that catch-all wrong is the classic SPA deployment bug:\
    \ the app works\n  until someone refreshes a sub-page.\n\n## Bundle the dependencies\n\
    \nTailwind is chosen for continuity: the existing templates are already Tailwind,\
    \ so\nthe visual language and the dark palette carry over instead of being reinvented.\n\
    \n**Tailwind 4, via `@tailwindcss/vite`.** This matters because 4 is a different\n\
    setup from 3, and picking silently would leave the next person guessing: 4 is\n\
    CSS-first, so there is no `tailwind.config.js` -- theme values live in the\nstylesheet.\
    \ Do not port `base.html`'s `tailwind.config` object as a config file;\ntranslate\
    \ it.\n\nWhat has to survive the translation is small and entirely enumerable.\
    \ From\n`base.html`:\n\n    darkMode: 'class'\n    colors.dark.bg      #0f172a\n\
    \    colors.dark.surface #1e293b\n    colors.dark.border  #334155\n    colors.dark.text\
    \    #e2e8f0\n    colors.dark.muted   #94a3b8\n\n`darkMode: 'class'` has no config-key\
    \ equivalent in 4; it is expressed as a custom\nvariant in CSS. Look up the current\
    \ form rather than guessing at it, and keep the\nbehaviour identical -- dark mode\
    \ is driven by a class, not by\n`prefers-color-scheme`, because that is what the\
    \ templates do and the two UIs will\nbe open side by side during the migration.\n\
    \n**And do not load it the way the templates do.** `base.html` pulls Tailwind,\
    \ Alpine, and\nmarked from public CDNs, which means the current web UI does not\
    \ render without\ninternet access, and a cached offline shell could never style\
    \ itself. Install\nTailwind as a real build dependency and bundle it. Same for\
    \ anything else the\nclient needs. No `<script src=\"https://...\">` in the React\
    \ app.\n\n## Shell\n\nSet the viewport meta and a mobile-first base stylesheet\
    \ now. task-093 makes the\nscreens work on a phone; it should not have to go back\
    \ and fix the document\nshell first.\n\n## Which project, when the URL does not\
    \ say\n\nThe routes are project-scoped, so the app needs a project id before it\
    \ can fetch\nanything -- and `GET /api/projects` returns a plain list with **no\
    \ default or\ncurrent flag** on it. There is nothing to read the answer from,\
    \ so the behaviour\nhas to be chosen:\n\n- `/app` with no project segment fetches\
    \ `/api/projects` and redirects to the\n  first one.\n- An empty registry says\
    \ so, and links to the existing project onboarding. It does\n  not render an empty\
    \ shell, and it does not error.\n- **Do not hardcode `agentjobs`.** It is the\
    \ right answer on this machine and wrong\n  everywhere else, and it would pass\
    \ every check in this task.\n\nPersisting a *last selected* project, and a switcher\
    \ UI, are out of scope here --\nthe Jinja switcher is task-061 and its React counterpart\
    \ is not yet specified. A\nredirect to the first project is enough for this task,\
    \ and saying so is what stops\nit growing.\n\n## Prove the path\n\nShip one trivial\
    \ page that fetches something real from the API and renders it.\nNot a placeholder:\
    \ proof the whole path works end to end.\n\n## The catch-all, and how to actually\
    \ test it\n\nThis is the one thing in this task most likely to ship broken, because\
    \ it works\nunder every check except the real one.\n\n`StaticFiles(html=True)`\
    \ mounted at `/app` serves `index.html` for `/app` and\nreturns **404** for `/app/p/agentjobs/tasks/task-042-...`.\
    \ It does not fall back to\nthe shell for arbitrary depth. A deep link therefore\
    \ needs an explicit catch-all\nroute -- `@app.get(\"/app/{path:path}\")` returning\
    \ the shell -- registered so it\ndoes not shadow the hashed asset files, which\
    \ must still be served as themselves.\n\nTwo collisions worth knowing before you\
    \ mount anything:\n\n- The unprefixed legacy router already owns `/`, `/tasks`,\
    \ `/tasks/{task_id}`,\n  `/projects`, and `/projects/new`. Mounting the SPA at\
    \ `/` -- a common default --\n  shadows the entire Jinja UI and breaks ac-5.\n\
    - The project-scoped web router is mounted at `/p/{project_id}`. `/app` collides\n\
    \  with neither, which is why it is `/app`.\n\n**Verify by hard-refreshing the\
    \ deep link in a browser** -- typing\n`/app/p/<project>/tasks/<id>` into the address\
    \ bar, or pressing F5 while on it.\nClicking through from inside the app exercises\
    \ the client router only and passes\nwhether or not the server is right. If you\
    \ verify ac-3 by in-app navigation, you\nhave not verified ac-3, and the bug surfaces\
    \ the first time someone reloads a page\nthey were reading."
  constraints: "- Nothing under `src/agentjobs/api/templates/` changes. The Jinja\
    \ UI is not\n  touched by this task.\n- A deep link into the SPA must work on\
    \ refresh, not only via in-app navigation.\n- No external asset host. Every dependency\
    \ is bundled, including Tailwind.\n- `frontend/node_modules` and build output\
    \ are gitignored.\n- The installed toolchain versions and the linter choice are\
    \ recorded.\n- No API changes."
  out_of_scope: Any real screen -- dashboard, list, detail all have their own tasks.
    Packaging the built assets into the wheel (task-091). Authentication.
  context:
  - path: src/agentjobs/api/main.py
    why: Where the SPA mount and the existing CORS allowlist live.
  - path: src/agentjobs/api/templates/base.html
    why: The Tailwind palette and layout to carry over.
