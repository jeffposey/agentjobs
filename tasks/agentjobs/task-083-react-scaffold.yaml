  actor: claude
  type: note
  body: "Three pre-flight gaps closed before this task is handed out, all of them\
    \ omissions in\nthe spec rather than open questions:\n\n1. **Tailwind was unpinned.**\
    \ The matrix named React, Vite, TypeScript and Vitest but not\n   Tailwind, and\
    \ 4 versus 3 is a materially different setup -- CSS-first with\n   `@tailwindcss/vite`\
    \ against `tailwind.config.js`. Pinned to 4.3 (current on npm as of\n   2026-08-12),\
    \ with the five palette values and the class-driven dark mode enumerated so\n\
    \   the translation is a checklist rather than an archaeology exercise.\n\n2.\
    \ **Nothing said how the app picks a project.** The routes became project-scoped\
    \ by\n   decision, and `GET /api/projects` has no default or current flag, so\
    \ there was no\n   answer to read anywhere. Specified: redirect to the first project,\
    \ handle an empty\n   registry, and explicitly do not hardcode `agentjobs` --\
    \ which is correct on this\n   machine and would have passed every check in the\
    \ task.\n\n3. **The catch-all is the likely silent failure.** `StaticFiles(html=True)`\
    \ at `/app`\n   404s on a deep path rather than falling back to the shell, so\
    \ an explicit\n   `/app/{path:path}` route is required. Recorded which existing\
    \ routers a careless mount\n   would shadow -- the legacy unprefixed router owns\
    \ `/`, `/tasks`, `/tasks/{task_id}`,\n   `/projects` -- and rewrote ac-3 to require\
    \ verification by hard refresh, because\n   clicking through in-app exercises\
    \ the client router only and passes whether the server\n   is right or not."
