spec:
  summary: Generate TypeScript types and a client from FastAPI's /openapi.json rather
    than hand-writing them, so the frontend cannot drift from the API without the
    build failing.
  intent: 'Hand-written client types are a second definition of the schema that nothing
    keeps in sync. They agree with the backend exactly until someone renames a field,
    and then they agree with nothing and fail at runtime, in a browser, in front of
    a user.


    This project has already been bitten by the untyped-boundary failure in its own
    templates: a page rendered `data-ball="Ball.HUMAN"` where every consumer expected
    `human`, and every filter silently matched nothing. Generation makes that class
    of mismatch a build error.'
  description: 'FastAPI publishes a complete OpenAPI document derived from the Pydantic
    models.

    Generate from it -- `openapi-typescript` for types, or a generator that also emits

    fetch wrappers; pick one and record why.


    Wire generation into the workflow so a stale client is noticed: a checked-in

    generated file plus a CI check that regenerating produces no diff is the cheap

    version, and is enough. Generating at install time would make the build depend
    on

    a running server, which is worse.


    Use TanStack Query for fetching, caching, and refetch semantics, rather than

    hand-rolled `useEffect` fetches. It is also the natural place for the live-update

    work in task-086 to hook in, via query invalidation.


    Enums matter here specifically. `lifecycle`, `ball`, `ball_reason`, and `outcome`

    are closed vocabularies, and the generated types should make an invalid comparison

    a compile error rather than a silent false.


    ## Reject an unknown record schema, do not guess at it


    Task records carry a `schema` version stamp -- currently 2 -- and the project
    has

    already migrated it once. Generated types are a compile-time contract against
    the

    API''s shape; they say nothing about a record written by a *newer* version of

    AgentJobs than the client was built from.


    The client must refuse a `schema` value it was not built for, and say so, rather

    than rendering whatever fields it recognises. A partly-rendered task looks

    authoritative and is the worst possible failure for a page whose entire job is

    telling someone the current state of the work. This is a small explicit check,
    not

    a runtime validation layer.'
  constraints: "- No hand-written request or response types. If a type is written\
    \ by hand, this\n  task has not been done.\n- A stale generated client fails a\
    \ check somebody actually runs, rather than being\n  discovered in a browser.\
    \ **There is no CI in this repository** -- no\n  `.github/workflows`, no pre-commit\
    \ config -- so do not write an acceptance\n  criterion against a pipeline that\
    \ does not exist. Add the check to the project's\n  documented check command.\
    \ Standing up CI is worth doing and is not this task.\n- Generation must not require\
    \ a running server at install or build time.\n- An unrecognised record `schema`\
    \ version is refused visibly, never partly\n  rendered.\n- No backend changes\
    \ to make generation easier without recording why."
  out_of_scope: Screens. Runtime response validation -- the generated types are a
    compile-time contract, and adding a runtime validator is a separate decision with
    its own cost.
  context:
  - path: src/agentjobs/api/models.py
    why: The Pydantic models the OpenAPI schema is derived from.
  - path: src/agentjobs/models_v2.py
    why: The closed enums whose values must survive the boundary intact.
