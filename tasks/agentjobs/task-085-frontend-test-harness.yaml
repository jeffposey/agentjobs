spec:
  summary: Set up component and hook testing for the React client -- Vitest, React
    Testing Library, and checked-in fixtures -- with one real test through it, before
    the screens are built rather than after.
  intent: 'Test harnesses added after the screens are written are added never, or
    are added and then fitted around code that was not built to be tested. Doing it
    as its own task, first, makes it a precondition of every screen task rather than
    a cleanup item.


    There is a specific gap to close. The Jinja task list filters rows client-side
    in Alpine, so the Python suite cannot assert that a closed task is absent from
    the default view -- it can only assert the value handed to the component. That
    behaviour has been verified by hand every time. In React it should be verified
    by CI.'
  description: 'Vitest plus React Testing Library in jsdom, running against **checked-in
    JSON

    fixtures** of API responses.


    The fixture is worth more than a test input. It is also how a screen can be built

    and reviewed before the API call it needs is wired up, and it is the obvious

    source for a visibly-labelled sample mode later. Keep fixtures in the frontend

    tree, one per API shape, and treat them as something a human reads.


    Follow the existing suite''s convention on what an assertion is worth: assert
    the

    value a user acts on, not the presence of markup. The cautionary example is in

    ENGINEERING.md -- a check for `data-ball=` passed happily while the app emitted

    `Ball.HUMAN` and every filter matched nothing.


    Wire it into whatever runs on commit, so a failing frontend test is as loud as
    a

    failing pytest.


    ## What this task deliberately does not do


    Network-boundary mocking and a browser end-to-end path are **task-094**. They
    were

    originally bundled here, at an estimate that was wrong by enough to stall the

    first screen behind harness work. Component testing has to exist before any

    screen; the browser runner does not, and it is where the setup cost actually

    lands.


    The corollary: fixtures here are a stepping stone, not the end state. Tests that

    need to exercise the generated client''s own parsing and error paths wait for
    094

    rather than stubbing the client, which would test the stub.'
  constraints: "- Fixtures are checked in and human-readable, not generated at test\
    \ time.\n- Assertions are on rendered values a user acts on, not markup presence.\n\
    - Frontend tests run in the same command or pipeline as the Python suite; a test\n\
    \  nobody runs is not a test.\n- Do not stub the generated API client to get around\
    \ the absence of network\n  mocking. If a test needs that, it belongs in task-094."
  out_of_scope: Network-boundary mocking and browser end-to-end testing, both moved
    to task-094. Coverage thresholds. Visual regression testing. Testing the Jinja
    UI, which the Python suite already covers.
  context:
  - path: ENGINEERING.md
    why: 'The verification section: assert rendered values, not markup.'
  - path: tests/test_attention_tiers.py
    why: The convention to match -- named states, asserted values.
