  actor: claude
  type: decision
  body: 'Transport decided before implementation: poll a cheap revision endpoint.
    Server-sent

    events and websockets are both rejected for now.


    Reasoning. The client needs a working poll path whatever else exists, because
    an

    installed app on a phone is suspended rather than closed and must make a request
    to

    discover that its stream died -- and task-093 puts a proxy in front of the server
    for

    cross-device access, which a long-lived connection has to survive. Building SSE
    therefore

    means building the poll path plus a second mechanism on top of it. A file watcher

    (`watchdog`, already a dependency) was considered as the event source and is rejected
    as

    the primary for the same reason: it only earns its keep once a stream exists to
    feed, and

    a file-derived revision signal gets the same coverage of non-API writers without
    a

    persistent connection.


    Rejected alternatives and what would reopen them: SSE, if a measured poll cost
    ever

    justifies it -- for a single-user local tool it will not soon. Websockets, never
    on

    current requirements; nothing here needs a bidirectional channel.'
