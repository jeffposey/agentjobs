- id: 4
  ts: '2026-08-13T17:50:53.952800Z'
  actor: codex
  type: decision
  body: The revision hashes sorted YAML filenames and bytes with a 96-bit BLAKE2s
    digest. Metadata-only signals (newest mtime/count or name/size/mtime/ctime) were
    rejected after a focused same-count, same-size rewrite test reproduced a collision
    on Windows even with nanosecond fields restored. Content hashing covers API, CLI,
    agent, direct-write, and git writers without parsing YAML, so broken files also
    change the signal. Measured cost on the real 74-file AgentJobs task corpus was
    768.62 ms for 100 revisions (~7.69 ms per poll); the fixture response was 54 bytes.
    This is acceptable at a 15-second single-user poll interval.
  data:
    rejected:
    - mtime plus count
    - metadata-only digest
    - API-handler counter
