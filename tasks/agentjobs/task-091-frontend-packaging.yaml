  type: decision
  body: Use the documented scripts/build_release.py flow instead of a Poetry build
    hook. A hook made Poetry emit a CPython/Windows-specific wheel even though AgentJobs
    is pure Python. The release script still prevents stale assets by running npm
    ci and a clean Vite build before Poetry, then rejects any wheel that is not py3-none-any
    or lacks required React/PWA content. This records Jeff's instruction that nothing
    about AgentJobs should require Windows.
  data: {}
- id: 3
  ts: '2026-08-13T21:27:24.181356Z'
  actor: codex
  type: progress
  body: 'Universal React-in-wheel packaging is complete in commit aceab8c.


    The React build now writes into agentjobs/frontend_dist package data; FastAPI
    resolves that installed-package path and gives clear missing-bundle errors. The
    release script rebuilds from the lockfile, verifies shell, hashed JS/CSS, manifest,
    service worker, and icons in the wheel, enforces py3-none-any metadata, pip-installs
    the wheel into an isolated target, removes Node from PATH, starts agentjobs serve,
    and fetches all UI/PWA assets. A genuinely clean detached checkout passed this
    flow. The resulting wheel was 234,941 bytes versus the 121,600-byte pre-frontend
    baseline: +113,341 bytes, acceptable for a complete self-contained UI. The full
    repository gate passed with 604 Python tests, 41 Vitest tests, and 1 real-browser
    Playwright path. No push performed.'
  data: {}
