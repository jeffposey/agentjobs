- id: 14
  ts: '2026-09-06T01:40:48.261776Z'
  actor: claude
  type: decision
  body: "Lock holders sit under the board, not in it (spec decision 5, ac-6).\n\n\
    A scripted finish and the merge runway are this machine working, and they hold\
    \ **locks\nrather than run slots**. `occupied` is counted by exactly the expression\
    \ the concurrency\nguard uses and does not include them, so a cell for either\
    \ would make the count wrong in\nthe one place the task's constraints say it must\
    \ never be wrong.\n\n**They render as one line immediately under the grid**, inside\
    \ the same card:\n\n> **Also on this machine:** merge runway \u2014 Elsewhere\
    \ \xB7 3m 41s, finishing task-502 \xB7 3m 41s.\n> Locks, not run slots \u2014\
    \ so they are not in the count above, but a merge queues behind them.\n\nThe sentence\
    \ carries its own disambiguation, because a reader who has just counted the\n\
    cells needs to be told why these are not among them. Two are shown by name and\
    \ the rest\nbecome `+N more`; the Runs page's \"Also on this machine\" section\
    \ is the long form and the\nboard's header links to it.\n\n**Rejected: a ghost\
    \ cell, greyed out, for each holder.** It answers \"is this machine\nbusy?\" better\
    \ than a line does, and it makes \"how many slots are free?\" unanswerable \u2014\
    \nwhich is the question the board exists to answer. Two visual grammars in one\
    \ grid is worse\nthan one line of prose.\n\n**Rejected: leaving them to the Runs\
    \ page.** A board announcing \"3 slots free\" through a\nthree-minute merge is\
    \ answering the wrong question confidently, which is exactly what the\nspec called\
    \ out.\n\nThe strip renders **even when there are no cells to draw** \u2014 an\
    \ unconfigured machine with\na merge in flight still says so, which is the case\
    \ where the omission would be most\nmisleading. `SlotBoard.test.tsx` pins both."
