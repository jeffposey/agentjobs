- id: ac-1
  text: The Dashboard renders exactly `max_concurrent_runs` cells, driven by the value
    in `GET /api/runs/live` and not by any count computed in the browser -- asserted
    at more than one ceiling value.
  status: pending
- id: ac-2
  text: An occupied cell shows the run's task, its health in task-328's vocabulary,
    its elapsed time and a working link into the task -- including when the run belongs
    to a different project than the one being viewed, where it links into that project.
  status: pending
- id: ac-3
  text: N free cells offer N different tasks in queue order, and dispatching one re-fills
    the board without duplicating a task into two cells.
  status: pending
- id: ac-4
  text: 'Cell order is stable across polls: a board watched through a run starting
    and a run ending does not reorder the cells that did not change.'
  status: pending
- id: ac-5
  text: 'A decision entry records what happens at the edges -- ceiling of 1, `dispatch_configured:
    false`, and a ceiling large enough that the cards would not fit -- with the bound
    and what is shown past it.'
  status: pending
- id: ac-6
  text: A decision entry records where lock holders (finish, runway) appear, given
    that they are this machine working and hold no run slot.
  status: pending
- id: ac-7
  text: A decision entry records what the board replaced or absorbed, where anything
    dropped went, and how an alarming state still outranks the board rather than sitting
    in it as one more card.
  status: pending
- id: ac-8
  text: '`scripts/check.py` green with no arguments on a clean rebased tree, and Jeff
    has driven it in a browser on his own screen with both an idle board and a board
    with runs in it.'
  status: pending
