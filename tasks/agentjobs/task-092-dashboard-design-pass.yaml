spec:
  summary: 'Jeff, 2026-09-05: the Dashboard becomes a board of exactly `max_concurrent_runs`
    cards. Each card holds either the live run occupying that slot, or the next queued
    task with enough information to judge it and a Dispatch button. That answers the
    question this task was filed to ask -- the calm rungs are not re-ranked, they
    are replaced by a board whose shape is the machine''s capacity.'
  intent: "Filed 2026-08-11, immediately after task-081 merged, as a thought worth\
    \ keeping:\n\n    \"if there is no active task and there are some ready, it should\
    \ present the panel to\n    start a next task, backlog specs can maybe co exist\
    \ with start next task panel...\n    needs some thought, the dashboard of agentjobs\
    \ deserves more thought\"\n\nThe thought has now arrived, and it is not a ladder\
    \ tweak. Jeff, 2026-09-05:\n\n    \"the dashboard should show the X max concurrent\
    \ number of runs, either with next\n    task and info and dispatch button, or\
    \ the active run using that slot.... there\n    should be a way to override the\
    \ max from gui\"\n\nThe ladder ranks *panels* and shows the winner. A board ranks\
    \ nothing: it shows the machine's capacity as a fixed number of cells and fills\
    \ each one with whatever is true of it. The reason the calm rungs competed was\
    \ that the page had one slot for a call to action; a board has as many as the\
    \ machine does, so the competition disappears rather than being adjudicated."
  description: '## What the board is


    One card per run slot, `max_concurrent_runs` of them. A card is in one of two
    states:


    - **Occupied** -- a live run. What `GET /api/runs/live` already returns per run:
    the task, its title, the run''s health (`Working`, `Waiting on you`, `No output`,
    `Process gone` -- task-328''s vocabulary, which exists precisely because "live"
    does not mean "working"), elapsed time, and a link into the task.

    - **Free** -- the next queued task for that cell, with enough of its spec to judge
    it, and a Dispatch button. This is the panel task-337 shipped, one per free slot
    rather than once for the page.


    Everything needed on the read side exists. `GET /api/runs/live` (`src/agentjobs/api/routes/runs.py`)
    returns `occupied`, `max_concurrent_runs`, `dispatch_configured`, the runs and
    the lock holders, with `occupied` counted by exactly the expression the concurrency
    guard uses so the page and a refused dispatch cannot disagree. The dashboard endpoint
    returns the queue. This is mostly an arrangement problem, and the arrangement
    has real decisions in it.


    ## What still has to be decided


    **1. There is no such thing as slot 3.** `live_runs` returns a list; slots are
    not identified, allocated or numbered anywhere in the system. So the board''s
    cells are a fiction the page maintains, and the question is how it maintains it
    without the cards shuffling every two seconds as the poll returns. Stable ordering
    rule, stated: occupied cells first in start order, free cells after, is the obvious
    one and is worth writing down rather than falling out of a `map`.


    **2. The board is machine-wide; the Dashboard is project-scoped.** A run in another
    project occupies a slot on this machine, and `dispatch_configured` and the ceiling
    are machine facts. So the occupied cells can hold work from projects other than
    the one you are looking at -- task-328 already handles this on the Runs page by
    giving every row its own project name and its own server-built link, and the board
    should reuse that rather than re-solve it. The free cells are the asymmetric half:
    whose queue fills them? The project you are looking at is the obvious answer and
    is not the only one. Decide, record the rejected alternative.


    **3. N free cells need N different tasks.** Not the same next task repeated. `agentjobs
    next` answers with one task; the board wants the top N claimable, in queue order,
    with the ones excluded still excluded for the same reasons (`_explain_no_work`).
    And dispatching one has to remove it from its cell and re-fill the rest without
    the other cards jumping. Whether the server answers `next_n` or the page takes
    the head of the backlog it already has is a real choice with a correctness argument
    on the server side.


    **4. What happens at the edges.** `max_concurrent_runs: 1` is one card and the
    board is a panel. `dispatch_configured: false` means the ceiling is a default
    nobody chose, and the honest board there is not four confident empty cells --
    `capacitySentence` in `LiveRuns.tsx` already has the honest sentence for this
    case. And with the ceiling now user-settable (task-344), a person can set it to
    12: the board must stay legible and must not smuggle a scroll into a page whose
    whole point is not scrolling. State the bound and what happens past it.


    **5. Lock holders are not slots.** A scripted finish and the merge runway are
    this machine working, they appear in `holders`, and they hold no run slot. They
    cannot be cards without making the count wrong. They still have to be visible
    -- a board that says "3 free" while a merge is grinding is answering the wrong
    question. Somewhere adjacent, and decided here.


    **6. What the board replaces.** The next-action ladder''s calm rungs and the capacity
    row (task-337) are both saying, less directly, what the board says. Say which
    survive, which are absorbed, and where anything dropped went. The alert rung is
    the one thing this must not weaken: task-081''s strictness existed so an alarm
    never competes with a nudge, and a board of eight equal cards is exactly the shape
    that would let it. An alarming state has to outrank the board, not sit in it.


    ## What is settled


    The scope question this task carried as ac-3 is answered by the direction itself:
    this is the wider dashboard design pass, not a narrow ladder tweak. The ladder''s
    calm rungs do not need re-ranking because they stop being a ladder.'
  constraints: '- An alert must not have to compete with the board for attention.
    task-081 fixed that; a grid of equal cards is the shape most likely to reopen
    it.

    - The backlog stays traceable however this lands -- task-080. A draft nobody sees
    is a regression.

    - `occupied` and the ceiling come from `GET /api/runs/live` and are not recomputed
    in TypeScript. The browser must never be the one place able to disagree with the
    concurrency guard about whether the machine is full.

    - A free cell''s Dispatch button is the one-click contract task-188 and task-337
    established: it names who clicked, and choosing a group, a posture or a brief
    still happens on the task''s own page.

    - The board must fit one viewport at the ceiling values a person will actually
    set -- task-294, whose acceptance is measured geometry at named viewports.

    - Frontend plus whatever the free-cell question forces on the dashboard endpoint.
    Changing the ceiling is task-344, not this.

    - Take a worktree and bootstrap it before anything else; one unqualified `scripts/check.py`
    on the rebased branch before the handoff.

    - Jeff drives it in a browser on his own screen before it merges: sandbox on its
    own port with seeded throwaway data, and seed both states -- a board with runs
    in it and an idle one.'
  out_of_scope: '- The control that changes `max_concurrent_runs` -- task-344. This
    board reads the ceiling.

    - The count tiles and the analytics page they move to -- task-212, task-213.

    - The header''s contents or breakpoint -- task-292, task-167, task-168.

    - The Runs page itself. It stays; it is the long form of what a card shows.

    - Slot identity in the dispatch machinery. Nothing here allocates or numbers real
    slots; the cells are a presentation.

    - Visual restyling beyond what the board needs: colours, typography, the spacing
    scale.'
  context:
  - path: frontend/src/components/Dashboard.tsx
    why: The ladder and the panels the board replaces or absorbs.
  - path: frontend/src/components/LiveRuns.tsx
    why: The machine-wide query, the health vocabulary, the capacity sentence and
      the poll cadence the board needs. Already shared by three surfaces; the board
      is the fourth.
  - path: src/agentjobs/api/routes/runs.py
    why: '`occupied`, `max_concurrent_runs`, `dispatch_configured`, runs and holders
      -- the whole read side, with the reasoning for why the numbers ride along with
      the list.'
  - path: src/agentjobs/dashboard.py
    why: The shared next-action computation. Whether it answers with N next tasks
      instead of one is decision 3.
  - path: frontend/src/App.tsx
    why: '`DashboardPage`, `useDashboardDispatch` and the per-task busy/refusal handling
      a free cell''s button needs.'
  - path: tasks/agentjobs/task-081-dashboard-next-action-ladder.yaml
    why: Why the ladder is strict, including the rejected alternatives. The alert-versus-nudge
      argument survives the board.
