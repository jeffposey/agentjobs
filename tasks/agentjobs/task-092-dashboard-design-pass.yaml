- id: 13
  ts: '2026-09-06T01:40:35.443103Z'
  actor: claude
  type: decision
  body: "What the board does at the edges (spec decision 4, ac-5).\n\n**Ceiling of\
    \ 1 \u2014 one cell, full width.** The board is a panel there, and `boardColumns()`\n\
    caps the grid's columns at the cell count for exactly this reason: the first build\
    \ drew a\nsingle card occupying a third of the panel with two thirds of empty\
    \ card beside it, which\nreads as a board that failed to load. A one-slot board\
    \ is a panel and a panel is full\nwidth. Seen at `--ceiling 1` in the sandbox.\n\
    \n**`dispatch_configured: false` \u2014 no cells at all.** The ceiling there is\
    \ a default nobody\nchose, so cells drawn from it would be a fiction on top of\
    \ a fiction, and four confident\nempty slots would assert a capacity that does\
    \ not exist. The board degrades to what is\nstill true: the heading becomes **Next\
    \ up**, the header carries `capacitySentence`'s\nhonest sentence (*\"Dispatch\
    \ is not configured on this machine\"*), and the cells are the\nclaimable queue\
    \ with no padding and no slot framing. The cell label changes with it \u2014\n\
    `Next up` rather than `Slot free`, because slot language on a page that has just\
    \ said it\ndoes not know the slots is the same lie in smaller type. Dispatch buttons\
    \ are absent\nwithout a special case: `QueueDispatch` already renders nothing\
    \ on an unconfigured\nmachine.\n\n**Ceiling above the bound \u2014 draw the bound\
    \ and say the rest out loud.** `BOARD_CELL_LIMIT`\nis **6**. Past it the board\
    \ draws six cells and a line naming what it did not draw:\n*\"+3 more slots this\
    \ machine allows, N of them busy. The board draws 6 so the page still\nfits a\
    \ screen; Running now is the long form.\"* It never smuggles a scroll into the\
    \ page\nwhose whole point is not scrolling, and it never silently truncates \u2014\
    \ the omission is\nstated with a link to the surface that has room.\n\nWhy six:\
    \ at three columns from 1024px that is two rows, and it is the last count that\n\
    leaves room for the sections under it. A ceiling above six is also a number worth\n\
    *stating* rather than illustrating \u2014 this machine's own gate already divides\
    \ its cores\nbetween the runs it can see (task-339), so the seventh slot is not\
    \ a seventh agent\nworking, it is a seventh agent queueing.\n\n**Rejected: never\
    \ hiding a busy cell, by growing the board past the bound when\n`occupied > 6`.**\
    \ It sounds safer and it is not: it makes the page's height a function of\nhow\
    \ busy the machine is, which is the one thing task-294 is trying to bound. The\
    \ overflow\nline carries the busy count instead, so nothing is concealed.\n\n\
    **Measured, since a constraint asks for geometry rather than an opinion** (Chrome,\
    \ a\n390x844 iframe, 2026-09-05): a three-cell board with two runs and one free\
    \ cell is\n**636px tall**, sitting at y=97 to y=733. Hiding the free cell's summary\
    \ below 820px was\ntried and reverted \u2014 it bought **36px** and cost the line\
    \ the spec asks for (\"enough of\nits spec to judge it\"). That measurement is\
    \ task-294's to act on; it is recorded here so\nthat task starts with a number\
    \ rather than a re-measurement."
