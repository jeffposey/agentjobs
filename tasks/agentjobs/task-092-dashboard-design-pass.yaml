  body: 'Deferred to post-parity, by the owner on 2026-08-12.


    The question this task raises -- whether the calm ladder rungs should coexist
    -- is not

    settled. What is settled is the sequencing: task-087 ports today''s strict ladder

    faithfully rather than waiting on this decision, and the redesign happens afterwards
    in

    React.


    Reasoning: iterating on a layout is materially cheaper in React than in Jinja,
    so doing

    the thinking first would put a design pass in front of a migration that has been
    waiting

    since 2026-08-11 while the Jinja UI was polished instead. The rejected alternative
    was

    making this a hard dependency of task-087, which the task''s own description argued
    for on

    the grounds of not porting a layout that is about to change; the counter is that
    the port

    is verifiable precisely because it changes nothing, and a faithful port is a better

    starting point for a redesign than a Jinja template.


    Consequence to accept: the ladder gets built twice, once as a port and once as
    a

    redesign. That is the cost of not blocking the migration on a design decision.'
