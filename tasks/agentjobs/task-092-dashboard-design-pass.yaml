- id: 15
  ts: '2026-09-06T01:41:09.556411Z'
  actor: claude
  type: decision
  body: "What the board replaced, and how an alarm still outranks it (spec decision\
    \ 6, ac-7).\n\n**Absorbed \u2014 the `next_up` rung.** The ladder's calm rung\
    \ that offered the head of the\nqueue with a Dispatch button on each row *is*\
    \ the board's free half, one cell per free\nslot instead of a list of three. `next_action:\
    \ \"next_up\"` stays in the endpoint's\nvocabulary \u2014 it is still the honest\
    \ name for \"there is claimable work\", and `Dashboard`\nreads it \u2014 but the\
    \ panel it drew now returns `null` and the board draws that offer.\nNothing it\
    \ carried was lost: the queue, the per-task Dispatch buttons, the closed-gate\n\
    line and the why-this-one disclosure all moved into the board, the disclosure\
    \ into the\nfirst free cell for the same reason task-337 put it in the first row.\n\
    \n**Absorbed \u2014 the machine capacity row** (`MachineCapacityRow`, task-337/task-328).\
    \ It was\none line at the foot of the statistics card saying \"2 of 3 slots busy\"\
    \ and naming what was\nrunning. The board's header says the same sentence \u2014\
    \ literally, it calls the same\n`capacitySentence` \u2014 one card higher, with\
    \ the runs drawn instead of listed, and its\n\"Running now \u2192\" is the same\
    \ link. Keeping both would have been the same sentence twice on\nthe page that\
    \ has to fit one viewport. The component and its tests are deleted rather than\n\
    left as a dead export.\n\n**Survives untouched \u2014 every other rung**, and\
    \ its strictness: `blocked`, `queue_broken`,\n`backlog`, `nothing_claimable`,\
    \ `empty_project`, plus the broken-queue banner and the\n\"+N in backlog\" link\
    \ that keeps the backlog traceable (task-080). The Runs page survives\ntoo and\
    \ is unchanged \u2014 log entry 10 above, and the board's header is a route into\
    \ it.\n\n**How an alarm outranks the board.** The board is **not a rung**; it\
    \ is the machine's\nshape and it shows beside whichever rung won. The two alarming\
    \ rungs \u2014 `blocked` and\n`queue_broken` \u2014 get two things from it:\n\n\
    1. **Position.** On an alarming day the alarm renders first and the board below\
    \ it; on a\n   calm day the board is first and the surviving rung follows. `empty_project`\
    \ gets no\n   board at all, since six empty cells above \"Getting Started\" would\
    \ be the loudest thing\n   on the page saying nothing.\n2. **Silence.** While\
    \ an alarm holds the page the board is `statusOnly`: every Dispatch\n   button\
    \ is withheld, the closed-gate line is withheld, and the empty cell's \"Create\n\
    \   task\" link is withheld. task-081's rule is that an alarm must never compete\
    \ with a\n   **call to action**, and that is precisely what is removed.\n\n**Rejected,\
    \ and this is the one I changed my mind about: hiding the free cells entirely\n\
    under an alarm.** It is the stricter reading of task-081 and it was the first\n\
    implementation. It is wrong for this page: something is waiting on Jeff most days,\
    \ so a\nboard that shrank to its occupied cells whenever that was true is a board\
    \ he would rarely\nsee whole \u2014 and he asked for a board. A cell that names\
    \ a task and links to it is not a\ncall to action; the Active Tasks list under\
    \ the board has been exactly that since before\nthe ladder existed. Withholding\
    \ the *buttons* keeps the rule and keeps the board.\n\n**Rejected: suppressing\
    \ the board entirely under an alarm** (the strictest reading, and\nthe closest\
    \ to today's behaviour, since the `next_up` panel is already suppressed by\n`blocked`).\
    \ Same objection, harder: it would also hide what is *running*, which is the\n\
    half of the board that is pure status and the thing most worth knowing on a bad\
    \ day.\n\n`Dashboard.test.tsx` pins the placement and the `statusOnly` flag for\
    \ each rung, and\n`SlotBoard.test.tsx` pins what `statusOnly` removes."
