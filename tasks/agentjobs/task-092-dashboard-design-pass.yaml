  body: "Reframed from a ladder question to a slot board, by Jeff on 2026-09-05.\n\
    \nHe said, in chat: \"the dashboard should show the X max concurrent number of\
    \ runs, either\nwith next task and info and dispatch button, or the active run\
    \ using that slot.... there\nshould be a way to override the max from gui\". Filed\
    \ here rather than into task-294\nbecause that task is about bounding the Dashboard\
    \ to one viewport and is explicitly\nfrontend-only; this decides what is on it,\
    \ which is the question this task was opened to\nask.\n\nWhat that settles, and\
    \ what it does not:\n\n- **ac-3 as it stood is answered.** This is the wider dashboard\
    \ design pass, not a narrow\n  ladder tweak. The old ac-1 and ac-2 -- whether\
    \ the calm rungs coexist, and whether\n  \"nothing active\" joins the ladder condition\
    \ -- are dissolved rather than answered: a\n  board has one cell per run slot,\
    \ so there is no single call-to-action position for the\n  rungs to compete over,\
    \ and \"nothing active\" is not a condition on a ladder but simply\n  a board\
    \ with every cell free. They are replaced by acceptance on the board's own\n \
    \ behaviour.\n- **The alert argument survives intact.** task-081 made the ladder\
    \ strict so an alarm\n  never competes with a nudge, and a grid of equal cards\
    \ is exactly the shape that would\n  reopen that. Carried into the constraints\
    \ and into ac-7 rather than dropped.\n- **The title changed** from \"Rethink the\
    \ next-action ladder: should the calm rungs\n  coexist?\", which now names a question\
    \ nobody is going to answer. The old title is here\n  and the reasoning above\
    \ is the trail.\n\n**Rejected: folding this into task-294.** The two are one Dashboard\
    \ and it is tempting.\nAgainst it: task-294's acceptance is measured geometry\
    \ at named viewports, which is a\nverifiable thing a session can finish; loading\
