- id: 12
  ts: '2026-09-06T01:39:33.050380Z'
  actor: claude
  type: decision
  body: "Whose queue fills the free cells, and where the N tasks come from (spec decisions\
    \ 2 and 3, ac-3).\n\n**The project you are looking at fills the free cells.**\
    \ The occupied half is machine-wide\nand stays that way \u2014 every occupied\
    \ cell carries its own project name and the server-built\n`task_url`, exactly\
    \ as task-328 does on the Runs page, so a cell holding another project's\nrun\
    \ links into that project. The free half is asymmetric and this is the asymmetry:\n\
    \n- The button on a free cell posts to `POST /api/projects/{project_id}/tasks/{task_id}/dispatch`.\n\
    \  A cell offering another project's task would be a control acting outside the\
    \ page's own\n  scope, from a page whose every other control is scoped.\n- **There\
    \ is no cross-project order to merge.** `queue_position` is unique per band *within\n\
    \  a project*; nothing in AgentJobs ranks one project's `critical` against another's.\
    \ A\n  merged board would have to invent that ranking in TypeScript and would\
    \ then be the only\n  place in the system with an opinion about it.\n\n**Rejected:\
    \ filling free cells from every visible project's queue**, on the argument that\n\
    the slots are the machine's so the offers should be too. It is the more interesting\
    \ board\nand it is not buildable without inventing the ranking above. Reopen it\
    \ only if a\ncross-project order becomes a real thing the server can answer for.\n\
    \n**The server answers with N tasks, not the browser slicing three.** `queue_preview`\
    \ was\ncapped at `QUEUE_PREVIEW_LIMIT = 3`; that constant is now a **floor**,\
    \ and\n`build_dashboard_snapshot` takes a `preview_limit` which the dashboard\
    \ route reads from\n`machine_ceiling()` \u2014 the same function `GET /api/runs/live`\
    \ reports the ceiling with. Two\nreasons this is on the server rather than in\
    \ the page:\n\n1. The exclusions have to stay exclusions. `claimable_tasks()`\
    \ is what applies them; a\n   browser padding a short list from `active_tasks`\
    \ would put a task on the board that the\n   queue deliberately withheld.\n2.\
    \ The board's cell count and the supply of tasks for it now come from **one**\
    \ reading of\n   one file. Two readings would be two chances to disagree about\
    \ how big the board is, and\n   the symptom would be a permanently empty last\
    \ cell nobody could explain.\n\nA floor rather than a plain substitution because\
    \ a ceiling of one must not shrink the\npreview: a single-slot machine still wants\
    \ to see what is behind the task it is about to\nstart. `tests/test_slot_board_supply.py`\
    \ pins both directions, and asserts the two\nendpoints against *each other* rather\
    \ than each against a literal.\n\n**The server does not pad.** Two claimable tasks\
    \ and six slots is two cards and four\n`empty` ones; what an empty cell says is\
    \ decided in the browser."
