- id: 11
  ts: '2026-09-06T01:39:11.040992Z'
  actor: claude
  type: decision
  body: "Cell order, and the fiction that makes cells possible at all (spec decision\
    \ 1, ac-4).\n\n**There is no such thing as slot 3, and the board does not pretend\
    \ otherwise.** Nothing\nin AgentJobs allocates, numbers or identifies a run slot;\
    \ `live_runs` answers with a\nlist. So the cells are a fiction the page maintains,\
    \ and the only thing that makes the\nfiction usable is that it is stable. The\
    \ rule, written down rather than falling out of a\n`map` \u2014 it is `orderedRuns`\
    \ and `boardLayout` in `frontend/src/components/SlotBoard.tsx`:\n\n- **Occupied\
    \ cells first, in start order** (`started_at` ascending, `run_id` breaking\n \
    \ ties, a run with no start time last). Start order is the one ordering a poll\
    \ cannot\n  permute: a run that begins is appended after every run already going,\
    \ and a run that\n  ends is removed while the rest keep their order. Sorting on\
    \ anything the poll\n  recomputes \u2014 health, elapsed seconds, the ledger's\
    \ own scan order \u2014 would shuffle the\n  board every two seconds, which is\
    \ the failure this rule exists to prevent.\n- **Free cells after, in queue order**,\
    \ from `queue_preview`.\n- **React keys are the run id and the task id**, so a\
    \ cell that did not change is the\n  same DOM node it was two seconds ago.\n\n\
    **A busy cell is counted off `occupied`, never off `runs.length`.** They are different\n\
    numbers on purpose (task-333): the count is machine-wide and includes runs in\
    \ projects\nthis caller may not see, while the list is only the visible ones.\
    \ A cell for the\ndifference exists and says so \u2014 `Busy \u2014 a run in a\
    \ project this view cannot show`. The\nalternative, drawing those slots free,\
    \ would put a Dispatch button on a slot the\nconcurrency guard knows is taken,\
    \ which is precisely the browser disagreeing with\n`dispatch/guards.py` that the\
    \ endpoint's docstring forbids.\n\n**Rejected: sorting the cells by health so\
    \ the alarming ones come first.** It reads well\nin a screenshot and is unusable\
    \ in motion \u2014 a run going from `working` to `parked` would\njump its card\
    \ across the board while the reader was aiming at it.\n\n**One thing the spec\
    \ did not name, found by building the fixture: a task can be in two\ncells.**\
    \ The two halves come from two endpoints and nothing reconciles them, so a run\n\
    whose task was released back to `ready` while its process lives is live *and*\
    \ claimable,\nand the naive board draws it as a run and then offers a Dispatch\
    \ button under a second\ncopy of it. `boardLayout` filters the queue against the\
    \ task ids of runs **in this\nproject** \u2014 scoped, because a task id is unique\
    \ only within a project and suppressing\n`task-101` here because Elsewhere is\
    \ running its own `task-101` would silently drop work\noff the board. Both directions\
    \ are pinned in `SlotBoard.test.tsx`."
