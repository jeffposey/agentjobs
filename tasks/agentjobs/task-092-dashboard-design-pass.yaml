  body: "Built, gated and driven in a browser. Branch `feat/task-092-dashboard-slot-board`,\
    \ five commits on top of `main` at `430d870`.\n\n## What changed\n\n**Server**\
    \ (`0d4eefe`) \u2014 the board's cell count and its supply of tasks now come from\
    \ one\nreading of one file.\n\n- `machine_ceiling(home)` is new in `dispatch/config.py`:\
    \ `(max_concurrent_runs,\n  configured)`, never raising at a reader. `runs.py`'s\
    \ `_ceiling()` delegates to it.\n- `build_dashboard_snapshot(manager, *, preview_limit=None)`\
    \ clamps up to\n  `QUEUE_PREVIEW_LIMIT`, so it is a floor. The dashboard route\
    \ passes the machine ceiling.\n- `openapi.json` and `frontend/src/api/generated/`\
    \ regenerated (the description of\n  `queue_preview` changed).\n\n**Frontend**\
    \ (`884c24b`, `023ceed`) \u2014 `frontend/src/components/SlotBoard.tsx` is new.\n\
    \n- `orderedRuns()` and `boardLayout()` are pure and exported, so every rule the\
    \ decision\n  entries argue about is testable without a DOM: cell count, which\
    \ cells are busy, what\n  fills the rest, and no task in two cells. `boardColumns()`\
    \ caps the grid at the cell\n  count.\n- `Dashboard.tsx` sheds `renderWhyThisOne`,\
    \ `renderMachineCapacity`, `renderQueueAction`,\n  `renderQueueGate` and `machineIdle`\
    \ and gains one `renderSlotBoard(statusOnly)`. The\n  `next_up` case returns `null`\
    \ with a comment saying where it went; every other rung is\n  byte-identical.\n\
    - `LiveRuns.tsx` loses `MachineCapacityRow` and `runName`, exports `HealthBadge`,\
    \ and\n  leaves a comment where the row was saying what absorbed it. `LiveRunsPage`\
    \ is untouched.\n- `App.tsx` wires the board and keeps the `next_task` fallback\
    \ for a pre-task-337 server.\n\n**Fixtures** (`2f4d8ef`) \u2014 `scripts/slot_board_sandbox.py`\
    \ is new; the e2e machine's\nceiling is 2 so one browser can see a run cell and\
    \ a free cell at once; `live-runs.spec.ts`\nasserts the board instead of the deleted\
    \ capacity row.\n\n## Verification\n\n**The gate, unqualified, on the rebased\
    \ branch: exit 0, all 10 of 10 stages, 442.1s,\nreceipt written for `023ceed`.**\
    \ black 0.8s \xB7 ruff 0.6s \xB7 mypy 3.2s \xB7 api 7.6s \xB7 icons\n3.7s \xB7\
    \ oxlint 0.9s \xB7 pytest 293.5s \xB7 vitest 14.4s \xB7 build 6.2s \xB7 e2e 111.1s\
    \ (47 passed).\n\nOne gate, and it is the second launch rather than the first:\
    \ the first was killed at ~40%\nof pytest because I made a cosmetic edit while\
    \ it ran, which would have made its green a\nreceipt for a tree that no longer\
    \ existed.\n\nNew tests: `frontend/src/components/SlotBoard.test.tsx` (24) and\n\
    `tests/test_slot_board_supply.py` (6). Deleted: the `MachineCapacityRow` block\
    \ in\n`LiveRuns.test.tsx`, and the three `Dashboard.test.tsx` tests that belonged\
    \ to the\nabsorbed `next_up` rung \u2014 the two that survived in substance (the\
    \ whole head of the queue,\nand the disclosure appearing exactly once) are re-stated\
    \ against the board.\n\n**Driven in a browser** (Chrome, `scripts/slot_board_sandbox.py`,\
    \ six ports):\n\n- **8916** two runs, one of them in *Elsewhere* \u2014 its cell\
    \ names that project and links to\n  `/p/sandbox-elsewhere/tasks/task-501`; health\
    \ reads `Waiting on you`; one free cell with\n  a Dispatch button; the holders\
    \ line names a runway and a finish.\n- **8917** idle: three free cells, three\
    \ *different* tasks, three buttons.\n- **8918** a task blocked on a human: the\
    \ alert holds the top, the board keeps all three\n  cells below it, and the Dispatch\
    \ button is gone.\n- **8919** ceiling 9: six cells and `+3 more slots this machine\
    \ allows\u2026`.\n- **8920** ceiling 1: one full-width cell.\n- **8921** unconfigured:\
    \ heading `Next up`, the honest sentence, no cells drawn.\n\n**Dispatching from\
    \ a free cell works end to end** \u2014 on 8917 the first cell went from\n`data-slot-state=\"\
    queued\" data-task-id=\"task-101\"` to `data-slot-state=\"run\"`, capacity\nwent\
