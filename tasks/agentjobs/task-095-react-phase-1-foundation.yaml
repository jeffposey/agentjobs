spec:
  summary: Stand up the React application, its typed API client, and its component
    test harness. Nothing user-facing ships in this phase; everything after it depends
    on all three.
  intent: Grouped as a phase because these three are the only children with no user-visible
    output, and because a partly-done foundation is the state every stalled rewrite
    is in. Treating it as one gate means the next phase starts from something whole.
  description: 'Done means: **a typed, tested React app is served at `/app`** and
    fetches real data.


    Children: task-083 scaffold, task-084 typed client, task-085 test harness.


    Strictly ordered: 084 and 085 both need somewhere to live, so 083 is first. After

    that the two are independent and either order works.


    This phase deliberately ships no screen. The point is that the scaffolding

    decisions -- directory layout, dev proxy, deep-link handling, how types are

    generated, what a test asserts -- are reviewable on their own rather than buried

    inside the first screen someone builds. A screen built before the harness gets
    a

    harness fitted around it, or gets none.'
  constraints: "- The Jinja UI is untouched by every child in this phase.\n- No API\
    \ changes.\n- No screen work. If a child starts rendering product surface, it\
    \ has escaped its scope.\n- **There is no CI in this repository.** No `.github/workflows`,\
    \ no pre-commit\n  config, though a GitHub remote exists. 'Runs in CI' is not\
    \ available as an\n  acceptance mechanism; a single documented check command is.\
    \ Do not stand up CI\n  as a side effect of a child task -- it is its own decision."
  out_of_scope: Any real screen. Live updates. Packaging. Mobile.
  context:
  - path: src/agentjobs/api/main.py
    why: Where the SPA mount and the existing CORS allowlist live.
