spec:
  summary: Port the dashboard, task list, and task detail to React, and make them
    usable and installable on a phone. Done means every read the Jinja UI offers,
    React offers, from any device on the tailnet.
  intent: This is the phase that makes the React client worth having instead of a
    parallel experiment. It is grouped with the mobile work rather than treating that
    as a later polish pass, because the responsive pattern is cheap to set once and
    expensive to retrofit across three pages -- and because a review request that
    can only be answered from one desk delays every branch by however long it takes
    to get back to that desk.
  description: 'Done means: **every read the Jinja UI offers, React offers -- including
    from a phone.**


    Children, in order: task-087 dashboard, task-093 mobile and PWA, task-088 task

    list, task-089 task detail.


    **The order inside this phase is load-bearing.** 093 sits second, not last: after

    one real screen exists there is something to actually make usable on a phone

    rather than a guess at a pattern, and before the other two screens so the card

    layout and the cell-labelling convention are established once instead of

    retrofitted onto three ported pages.


    Port faithfully. task-092 asks whether the dashboard''s ladder should be

    redesigned and is deferred to post-parity by decision of 2026-08-12; a port that

    also changes behaviour cannot be verified against the original.'
  constraints: '- Behaviour matches the Jinja UI. Redesign is task-092, deferred.

    - The Jinja UI keeps working at every commit.

    - The responsive pattern from task-093 is followed by the screens after it, not
    retrofitted.

    - The server still binds loopback and refuses a wildcard bind.'
  out_of_scope: Removing the Jinja UI. Redesigning the dashboard (task-092). Creating
    tasks from the browser, which is phase 4. Live updates, which are phase 3.
  context:
  - path: src/agentjobs/api/templates/
    why: The pages being ported, and the behaviour parity is measured against.
