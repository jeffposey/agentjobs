spec:
  summary: Add the one surface that writes new records, prove the stack end to end
    in a browser, and get the built bundle into the wheel. Done means pip install
    yields the whole UI with no node.
  intent: 'The properties this phase defends are the ones that quietly disappear if
    nobody owns them: that a checkout is self-sufficient, that installing needs nothing
    but Python, and that the stack has been exercised the way a user exercises it
    rather than only in units.'
  description: 'Done means: **`pip install agentjobs && agentjobs serve` gives a stranger
    the whole

    React UI, and a browser test proves the stack agrees with itself.**


    Children, in order: task-090 create task, task-094 e2e hardening, task-091 packaging,
    task-102 React-first documentation audit, task-103 complete AgentJobs task-corpus
    audit.


    Grouped as the phase that makes the client a shipped product rather than a

    development-time artifact. 090 is here rather than in parity because the Jinja
    UI

    has no create form either -- it is new capability, not a port -- and because its

    ladder-rung acceptance criterion needs the React dashboard from phase 2 to exist.


    091 is the last product build step on purpose. Packaging a bundle that is still
    changing shape means

    doing it twice. After the shipped artifact is fixed, 102 reconciles current-facing
    documentation with the React product, and 103 performs the final corpus-wide durable-state
    audit.'
  constraints: '- `pip install agentjobs` requires no node, no npm, and no network
    beyond PyPI.

    - No runtime dependency on an external asset host.

    - A stale bundle must not be able to ship silently.

    - Creation goes through the manager''s create_task, never by writing YAML.'
  out_of_scope: Removing the Jinja UI -- a separate decision once this phase lands.
    Editing an existing task's spec in the browser. CDN hosting.
  context:
  - path: pyproject.toml
    why: Package data and build configuration.
