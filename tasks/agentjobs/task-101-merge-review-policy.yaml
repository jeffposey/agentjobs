ball_prompt: 'Decide the shape before anyone builds it: whether this is one setting
  or three (review-required, what satisfies a dependency, what dispatch may hand out
  unattended), whether a per-task override may only relax the default or also tighten
  it, whether an agent may set its own exemption, and whether ''review'' should name
  a kind -- behavioural, code, none -- rather than a boolean. See the five open questions
  in the description.'
