spec:
  summary: Inspect the complete AgentJobs task corpus after the React documentation
    audit, update stale durable state and references, and remove or retire records
    that no longer belong.
  intent: The task corpus is the product workflow and long-term memory. After a large
    frontend program, stale specs, prompts, dependency edges, and temporary records
    can misdirect both agents and humans unless the whole corpus is deliberately reconciled.
  description: Read every task under tasks/agentjobs, including closed history and
    open work. Check summaries, descriptions, ball prompts, acceptance state, dependencies,
    parents, links, context paths, branch state, and references to superseded UI architecture
    or process. Correct records whose current durable state is wrong; close, archive,
    or remove obsolete test artifacts, duplicates, and superseded open tasks when
    the evidence supports it. Preserve meaningful completed history and record why
    anything is retired or removed. Finish with a corpus-level report that lets a
    zero-context reader understand what changed and what intentionally remains.
  constraints: '- Inspect every tasks/agentjobs YAML record; sampling is insufficient.

    - Use TaskManager state verbs and update APIs rather than hand-editing lifecycle,
    ball, outcome, or logs.

    - Preserve completed historical evidence unless it is erroneous, a temporary artifact,
    or an explicitly superseded duplicate.

    - Record the evidence and reason before closing, archiving, or removing material
    records.

    - Do not absorb implementation work discovered by the audit; create or update
    durable follow-up tasks when authorized and leave clear findings.'
  out_of_scope: Implementing every product issue discovered during the audit. Rewriting
    valid historical logs merely to use current terminology.
  context:
  - path: tasks/agentjobs/
    why: The complete corpus in scope.
  - path: ALLAGENTS.md
    why: Lifecycle, resumption, and logging contracts each record must satisfy.
  - path: docs/task-schema.md
    why: Schema v2 field and state semantics.
