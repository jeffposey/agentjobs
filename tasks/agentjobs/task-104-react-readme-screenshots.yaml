spec:
  summary: Create at least one polished, current screenshot of the React application
    and restore a strong visual near the top of README.md; use a second phone or tablet
    image only when it adds distinct product value.
  intent: The previous README screenshot showed the retired Jinja interface and was
    removed during the React-first audit without an explicit replacement. AgentJobs
    now needs an honest, attractive visual that quickly communicates the current browser,
    tablet, and phone experience.
  description: Stage a realistic but non-sensitive AgentJobs project that shows the
    product at its best. Capture candidate views from the packaged React application,
    prioritizing a desktop dashboard or task view that communicates the project switcher,
    workflow state, hierarchy, activity, and review model without clutter or broken/demo-looking
    data. Add at least one selected image near the top of README.md. Consider a second
    phone or tablet image only if it demonstrates responsive review or task interaction
    that the primary image does not. Review the actual image files and rendered README
    placement with Jeff before merge.
  constraints: '- Use the real packaged React application, not a mockup or the legacy
    Jinja UI.`n- Use realistic, coherent, non-sensitive staged data; no private paths,
    people, tokens, or accidental local details.`n- At least one screenshot is required;
    prefer one excellent hero over a gallery.`n- A second screenshot must communicate
    a distinct mobile/tablet capability rather than repeat the desktop view.`n- Crop
    and size images for legibility on GitHub without excessive README height or browser
    chrome.`n- Include useful alt text and stable repository-relative image paths.`n-
    At review handoff, link and open the exact worktree README and every candidate/final
    image.'
  out_of_scope: Redesigning the React application solely for the screenshot. Fabricated
    image-generation mockups. Publishing or pushing changes.
