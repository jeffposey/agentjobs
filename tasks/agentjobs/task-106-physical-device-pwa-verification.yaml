spec:
  summary: 'Complete the physical-device checks intentionally left pending in the
    mobile/PWA implementation and React parity epic: install, private HTTPS access,
    standalone launch, upgrade, reconnect, and second-device setup.'
  intent: Automated contracts and emulated phone viewports prove the implementation
    shape but cannot prove real browser installation, OS suspension/resume, private-device
    routing, or deployed service-worker upgrades. Those limitations are currently
    distributed across closed tasks 086, 093, 096, and open epic 082.
  description: Use a real phone and, when available, a tablet on the private network
    described in docs/mobile-access.md. Install the packaged React application from
    private HTTPS, launch it standalone, exercise dashboard/list/detail/review behavior,
    suspend and resume it, stop and restart the host, deploy a changed application
    shell, and confirm the installed app upgrades without manual cache clearing. Follow
    the documentation from a second device and record any ambiguity or correction.
    Preserve network-only task data behavior throughout.
  constraints: '- Do not expose the unauthenticated AgentJobs server to the public
    internet or a wildcard bind.

    - Use the packaged React application and an HTTPS private proxy; plain HTTP may
    be tested only as the documented non-installable fallback.

    - Record device OS/browser versions and what was actually exercised.

    - Do not mark a criterion met from desktop emulation alone.

    - Any documentation correction must remain platform-neutral and must not make
    Windows a requirement.'
  out_of_scope: Adding authentication, redesigning the PWA, or supporting public hosting.
  context:
  - path: docs/mobile-access.md
    why: Procedure and security model to validate from a fresh device.
  - path: tasks/agentjobs/task-093-mobile-and-pwa.yaml
    why: Primary implementation record and pending physical checks.
  - path: tasks/agentjobs/task-096-react-phase-2-parity.yaml
    why: Phase-level acceptance left pending for physical installation.
  - path: tasks/agentjobs/task-086-live-updates.yaml
    why: Resume/reconnect behavior whose OS-level timing needs a real installed app.
