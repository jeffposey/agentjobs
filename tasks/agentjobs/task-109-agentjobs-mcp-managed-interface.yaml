spec:
  summary: Deliver the accepted AgentJobs MCP architecture as a standalone local server
    plus a Codex plugin, while making direct task-YAML mutation unsupported, preventable
    where the client permits it, and loud everywhere else.
  intent: Agents currently have easier access to general file tools than to AgentJobs'
    validated domain operations. That allowed an invalid active task with no ball
    to bypass the manager and disappear. The program must make managed operations
    the obvious path and preserve the task corpus as valid, visible, resumable state.
  description: 'This is the implementation umbrella for docs/mcp-integration-design.md.
    Complete it through its children: standalone STDIO foundation; project and actor
    routing; read/query tools; authoritative idempotency, concurrency, and error semantics;
    validated mutation tools; protocol and behavioral proof; Codex plugin/skill packaging;
    direct-write hook enforcement; portable validation and managed-write receipts;
    and documentation/release integration.


    The parent is finished by its children and must not become a second implementation
    workstream. At closure, review the children''s evidence against the design''s
    end-to-end contract, run the complete repository gate, and exercise one real zero-context
    create/claim/log/handoff flow through the installed MCP server.


    Execution order is deliberate: this is the next AgentJobs program. Work it as
    a parent loop and continue through eligible children without interleaving unrelated
    backlog work. The first executable child is task-110; dependency edges determine
    the rest.'
  constraints: '- The decisions in docs/mcp-integration-design.md are accepted and
    must not be reopened during implementation.

    - Ship one MCP implementation in the AgentJobs package; the Codex plugin packages
    it rather than forking it.

    - MCP writes must traverse TaskClient -> project-scoped REST -> TaskManager ->
    TaskStorage.

    - Do not expose generic lifecycle, ball, outcome, YAML, or arbitrary-record setters.

    - Preserve unrelated task-100 and task-105 scope; do not absorb a Beads migration
    or notification receiver.


    - When AgentJobs MCP tools are available, agents use them for every task read
    and mutation. Codex desktop, CLI, and IDE sessions must share the installed local
    MCP configuration. REST/TaskClient and the product CLI/GUI remain supported managed
    clients of the same authoritative manager path. Direct YAML mutation is reserved
    for a documented emergency recovery that the managed interfaces cannot perform;
    it requires an explicit reason and validation and is never the ordinary fallback
    for a failed or inconvenient tool call.'
  out_of_scope: Implementing a Beads replatform, a remote Streamable HTTP MCP deployment,
    a notification delivery service, or arbitrary batch mutation.
  context: []
