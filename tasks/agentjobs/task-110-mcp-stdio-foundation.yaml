  actor: claude
  type: progress
  body: "Implemented the MCP STDIO foundation on feat/task-110-mcp-stdio-foundation.\n\
    \nWhat was built\n- `src/agentjobs/mcp/`: config (AGENTJOBS_URL / AGENTJOBS_TIMEOUT,\
    \ bounded timeout),\n  compat (startup probe + version policy), errors (closed\
    \ 12-code vocabulary with a\n  published JSON Schema and code-driven retryability),\
    \ results (structuredContent +\n  text fallback, read-only/mutation annotations),\
    \ tools (empty ToolRegistry seam), and\n  server (build/initialize/run).\n- `agentjobs\
    \ mcp` CLI command. The MCP SDK import is deferred so other commands do not\n\
    \  pay for it.\n- `GET /api/version` returning {version, schema_version}; the\
    \ probe needs both, and\n  neither is derivable from the other.\n- TaskClient:\
    \ base_url, service_health, service_version, list_projects, and a\n  status_code\
    \ on TaskClientError.\n- 45 tests in tests/test_mcp_server.py.\n\nVerification\n\
    - `poetry run python scripts/check.py` passes end to end (682 pytest, frontend\n\
    \  generated-client check, lint, vitest, build, Playwright e2e).\n- `poetry run\
    \ ruff check .` clean; `poetry run mypy src/agentjobs` clean.\n- Wheel built,\
    \ installed into a clean venv, and driven with the official MCP client:\n  initialize\
    \ returned serverInfo agentjobs/0.1.0, tools capability, the accepted\n  instructions,\
    \ and an empty tool list. Diagnostics appeared on stderr only.\n\nTwo things a\
    \ reviewer should know\n- Dependency bump: the MCP SDK forces starlette >=0.48,\
    \ uvicorn >=0.31.1, httpx >=0.27,\n  python-multipart >=0.0.9, which pulls FastAPI\
    \ from 0.109 to 0.119. FastAPI 0.119 then\n  splits TaskRead into TaskReadInput/TaskReadOutput\
    \ because display_status is computed\n  and read-only. Merging the schemas back\
    \ was tried and reverted -- it drops\n  display_status, which the React app renders.\
    \ The accepted fix is\n  frontend/src/api/types.ts, which re-exports the output\
    \ shape as TaskRead so nine\n  components keep the domain name.\n- Bug found by\
    \ real use, not by the suite: probing a service that predates /api/version\n \
    \ reported \"not reachable -- start it with agentjobs serve\" about a server that\
    \ was\n  running. Fixed, and the test that missed it was replaced with one driving\
    \ a genuine\n  404.\n\nDeviation from ac-4: only Python 3.13 is installed on this\
    \ machine, so the clean-env\nwheel install and launch were proven on 3.13 rather\
    \ than 3.11/3.12. The package\ndeclares python = \"^3.11\" and uses nothing version-specific;\
    \ a 3.11/3.12 matrix belongs\nin CI, which this repository does not yet have.\n"
