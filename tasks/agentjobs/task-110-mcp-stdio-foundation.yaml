  \ was forced by the official MCP SDK. It\n   is the largest blast radius in this\
  \ branch and is why frontend/src/api/types.ts\n   exists. Commit 78418a3 explains\
  \ the alias; the alternative (merging the OpenAPI\n   input/output schemas) was\
  \ tried and reverted because it silently drops\n   display_status.\n2. The stdout\
  \ guarantee in src/agentjobs/mcp/server.py: the real stdout is handed to\n   the\
  \ transport and sys.stdout is repointed at stderr for the process lifetime. It is\n\
  \   deliberately blunt -- a filter would only have covered our own prints.\n3. The\
  \ 0.x version policy in compat.py: below 1.0 the check compares major AND minor,\n\
  \   because semver promises nothing across 0.x minors.\n\nNothing here registers\
  \ a tool yet; the inventory is empty by design and filled by\ntask-111 through task-114.\n\
  \nApprove and I will rebase, merge --no-ff, close the task, and continue the task-109\n\
  parent loop with task-111.\n"
