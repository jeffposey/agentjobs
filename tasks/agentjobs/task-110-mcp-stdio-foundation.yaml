parent: task-109-agentjobs-mcp-managed-interface
spec:
  summary: Add the packaged `agentjobs mcp` STDIO server, official MCP SDK dependency,
    startup compatibility probes, and shared result plumbing without implementing
    the domain tool inventory yet.
  intent: Every supported agent client needs one protocol implementation with clean
    packaging and process behavior. Establishing the boundary first prevents individual
    tools from inventing their own transport, HTTP, logging, or version policy.
  description: 'Implement section 1 and section 7 (Standalone) of docs/mcp-integration-design.md.
    Add the official Python MCP SDK, a typed MCP package, and an `agentjobs mcp` command
    that speaks only MCP on stdout and sends diagnostics to stderr. The process connects
    to the configured AgentJobs HTTP service, probes health/version/project capability,
    publishes the accepted server instructions, reports the installed AgentJobs version
    and schema compatibility, and shuts down cleanly.


    Create shared adapters for structuredContent plus text fallback, safety annotations,
    and error/result serialization. Domain handlers remain for later children. Build
    and install the wheel in a clean environment and launch the command on Windows;
    add POSIX-compatible implementation and tests suitable for CI.'
  constraints: '- Use local STDIO only for the initial release; do not add Streamable
    HTTP or embed MCP into FastAPI.

    - The MCP package may import TaskClient and generated API/Pydantic types, not
    TaskManager or TaskStorage.

    - Do not silently start or own the AgentJobs HTTP server.

    - Keep non-protocol output off stdout.

    - Server and plugin versions track the AgentJobs package version; fail actionable
    on incompatible major versions.'
  out_of_scope: Project/actor discovery fields, domain read tools, mutation tools,
    Codex plugin packaging, hooks, and remote authentication.
  context: []
