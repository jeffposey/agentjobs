ball_prompt: "Review and approve merging feat/task-111-mcp-projects-and-actors into\
  \ main.\n\nThe one behaviour change that reaches beyond MCP: claim, handoff, release,\
  \ close, log\nand progress now reject an actor the project does not configure. This\
  \ is the point of\nthe task, but it is a real tightening of the REST API, so it\
  \ is worth your explicit\nagreement rather than mine. A project with no configured\
  \ actors still accepts any id,\nso a fresh `agentjobs init` is unaffected; a configured\
  \ project -- including this one,\nwhich defines Jeff Posey, claude and codex --\
  \ now refuses anything else. Any script of\nyours that posts under a different name\
  \ will start getting a 400.\n\nAlso worth a look:\n- src/agentjobs/mcp/routing.py,\
  \ which is where the \"never infer a project, never\n  derive an actor\" rules live.\
  \ The actor check duplicates the REST authority on\n  purpose, so the error can\
  \ name the configured actors before a write is attempted.\n- The _parse_task fix\
  \ in client.py: list_tasks was broken against a real server and\n  the suite could\
  \ not have caught it. Commit 4160696.\n\nApprove and I will rebase, merge --no-ff,\
  \ close the task, and continue the task-109\nparent loop with task-112 (read tools)\
  \ and task-113 (mutation safety), which both\nbecome eligible.\n"
