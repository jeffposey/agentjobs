  actor: claude
  type: progress
  body: "Implemented project routing and actor attribution on\nfeat/task-111-mcp-projects-and-actors.\
    \ Four commits, one logical change each.\n\nWhat was built\n- Project discovery\
    \ (GET /api/projects) now reports each project's configured actors\n  with id/kind/display_name,\
    \ plus default_user. default_user is for addressing a\n  person; nothing nominates\
    \ an agent actor.\n- Actor validation added to claim, handoff, release, close,\
    \ log and progress. Before\n  this, only the three human review routes validated\
    \ an actor, so any other verb wrote\n  an unresolvable id straight into an append-only\
    \ log.\n- TaskClient.for_project(id) returns a client scoped to one project; all\
    \ thirteen task\n  call sites now build paths through one helper. Scoping returns\
    \ a new object, never\n  mutating -- there is no settable current project anywhere.\n\
    - TaskClient.projects() / get_project() return typed ProjectSummary records;\n\
    \  get_project names the valid ids when one is unknown.\n- src/agentjobs/mcp/routing.py\
    \ holds the shared helpers: require_project_id,\n  resolve_project, require_actor,\
    \ scoped_client, project_payload, and the reusable\n  JSON Schema fragments.\n\
    \nVerification\n- poetry run python scripts/check.py passes end to end.\n- 34\
    \ new tests in tests/test_mcp_routing.py, driven against the real FastAPI app\n\
    \  through the real dependency wiring, with two projects that share a task id\
    \ and have\n  disjoint actor vocabularies.\n- Exercised against the live service\
    \ on all five real registered projects: discovery\n  returned the right actors\
    \ per project, an unknown project named the five valid ids,\n  an unknown actor\
    \ was refused both by the MCP helper and by the REST layer on a real\n  log append,\
    \ and scoped reads returned each project's own tasks.\n\nBugs found and fixed\
    \ along the way\n1. TaskClient._parse_task dropped only display_status, so every\
    \ read carrying the\n   server's other computed fields raised a five-error ValidationError.\
    \ list_tasks was\n   simply broken against a real server. The unit tests missed\
    \ it because they feed\n   hand-written payloads with no computed fields; found\
    \ by pointing the client at the\n   running service. Now filters by the model's\
    \ declared fields, with coverage\n   parametrised across the read surface.\n2.\
    \ test_api.py's fixture overrode only the manager, so actor validation resolved\
    \ the\n   default project -- this repository -- and those tests would have been\
    \ checking\n   actor names against the real .agentjobs/config.yaml. The fixture\
    \ now overrides the\n   acting project too.\n"
  data: {}
- id: 3
  ts: '2026-08-17T06:43:49.343609Z'
  actor: claude
  type: decision
  body: 'Actor validation was added to all six agent verbs, not only to the MCP layer.
    The alternative -- validating in mcp/routing.py alone -- was rejected because
    the REST API is the authority the design names, and a guard that only one client
    honours is not a guard. The cost is stated: this tightens the public REST API,
    so a caller using an unconfigured actor id on a configured project now gets a
    400 where it previously succeeded.'
  data: {}
- id: 4
  ts: '2026-08-17T06:43:49.621103Z'
  actor: claude
  type: decision
  body: client.ProjectSummary mirrors the REST ProjectResponse rather than importing
    it, so the client keeps no dependency on the server package. The duplication is
    held honest by a contract test asserting both models declare the same fields;
    the rejected alternative was importing the API model into client.py, which would
    drag FastAPI into every client import.
