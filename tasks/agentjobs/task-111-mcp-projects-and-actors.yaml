spec:
  summary: Extend the authoritative REST models and TaskClient for explicit project-scoped
    calls, project actor discovery, and validation of every supplied mutation actor.
  intent: Task IDs are only unique inside a project, and actor names are durable audit
    data. An MCP session must never guess either one from cwd, model identity, or
    a stale hidden selection.
  description: 'Implement section 3 of docs/mcp-integration-design.md. Add typed TaskClient
    support for `/api/projects` and `/api/projects/{project_id}/...` routes. Extend
    the project response with the configured actor vocabulary (`id`, `kind`, `display_name`)
    and `default_user` needed for discovery, without using the human default as an
    agent mutation identity. Provide shared server helpers that require exact `project_id`
    on all task tools and require/validate `actor` on all mutations.


    Preserve `_local` for existing single-project compatibility. Add two-project fixtures
    with colliding task IDs and actor vocabularies that differ, proving reads and
    writes never leak across projects.'
  constraints: '- No mutable current-project or set-context state in MCP.

    - No cwd-based fallback after a tool receives a project-scoped request.

    - Never infer actor from the model, OS user, MCP session, or human default_user.

    - Projects with no actors preserve current compatibility; configured projects
    reject unknown actors through the existing actor validator.

    - Route construction belongs in TaskClient, not individual MCP handlers.'
  out_of_scope: Authentication for networked MCP, multiple-human account management
    (task-066), registry onboarding, and read/mutation domain tool implementations.
  context: []
