ball_prompt: "Review and approve merging feat/task-112-mcp-read-tools into main.\n\
  \nThis one is additive -- no existing behaviour changes, and nothing here can mutate\
  \ a\ntask. Worth your attention:\n\n1. src/agentjobs/mcp/read_tools.py, specifically\
  \ _explain_no_work. That is where I\n   spent judgement rather than following the\
  \ design line by line: the design says\n   task_next must distinguish no work from\
  \ broken, cyclic, and blocked work, and this\n   is my reading of what that should\
  \ actually say to an agent. Tell me if the\n   explanations are the wrong shape.\n\
  2. The TaskSummary field list in summaries.py. It is fixed by the design, but it\
  \ is\n   also the thing every agent will see most often, so it is worth one look.\n\
  3. TaskClient's new raw read methods sit beside the typed ones. Two ways to read\
  \ a task\n   is a wart; the alternative was making Task tolerate computed fields,\
  \ which would\n   have let derived state be passed back in as input. I took the\
  \ wart.\n\nApprove and I will rebase, merge --no-ff, close the task, and continue\
  \ the task-109\nparent loop with task-113 (mutation safety), which task-114 needs.\n"
