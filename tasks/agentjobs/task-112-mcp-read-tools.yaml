parent: task-109-agentjobs-mcp-managed-interface
spec:
  summary: Implement the five accepted read-only MCP tools with project scoping, broken-file
    visibility, dependency facts, children, pagination limits, and structured outputs.
  intent: Agents need a concise, dependable way to discover projects and reconstruct
    zero-context work before mutation. Read tools must preserve AgentJobs' loud-error
    behavior instead of making broken files or blocked work disappear.
  description: 'Implement the read inventory in section 4 of docs/mcp-integration-design.md:
    `projects_list`, `tasks_list`, `task_get`, `tasks_search`, and `task_next`. Generate
    input/output schemas from authoritative response types where possible, return
    structuredContent plus short text fallback, and apply accurate read-only/non-destructive/closed-world
    annotations.


    `task_get` must return the complete schema-v2 task, computed dependency facts,
    and subtasks. List/search include broken task files beside valid records and enforce
    the accepted 1-200 result limit. `task_next` does not claim and explains why no
    task is available when broken, cyclic, dependency-blocked, ineligible, or genuinely
    absent work is relevant.'
  constraints: '- Exact tool names and fields are fixed by the design; do not collapse
    them into a mode-based generic query tool.

    - All task tools require project_id.

    - Return stable IDs and full resumption data, not a prose-only summary.

    - Broken files remain distinct from missing tasks.

    - This task is read-only; do not add claim-on-next or any mutation.'
  out_of_scope: Mutation verbs, idempotency, direct-write enforcement, custom MCP
    UI/resources, or changing queue ranking (task-081-task-selection-ranking).
  context: []
