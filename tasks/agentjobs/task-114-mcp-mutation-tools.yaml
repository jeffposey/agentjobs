spec:
  summary: Implement the eight accepted MCP mutation tools as typed, high-level domain
    verbs over TaskClient, with no generic state or YAML mutation surface.
  intent: Agents need an obvious managed path for creating, claiming, handing off,
    releasing, closing, logging, and editing permitted task content. The tool contract
    must make invalid lifecycle/ball combinations unrepresentable or reject them through
    existing domain validation.
  description: 'Implement section 4''s mutation inventory in docs/mcp-integration-design.md:
    `task_create_draft`, `task_create_ready`, `task_claim`, `task_release`, `task_handoff`,
    `task_close`, `task_log_append`, and `task_update_content`. Use the exact input
    types, MutationResult output, operation IDs, revision requirements, and structured
    errors already added to the authoritative service.


    Use a discriminated handoff target so invalid ball/reason pairs do not validate.
    Exclude agent/available from handoff; release owns that transition. Create schemas
    omit all managed state and add the manager-owned creation event. ContentPatch
    exposes only the accepted authoring fields and cannot replace log or state axes.
    Return the fully reloaded task after success/replay.'
  constraints: '- Handlers call only TaskClient; no imports of TaskManager, TaskStorage,
    YAML, or task paths.

    - Do not expose set lifecycle/ball/outcome, save YAML, generic patch, batch, create-and-claim,
    transition-log, or unrestricted update tools.

    - Tool names and schemas are fixed by the design.

    - Every mutation requires explicit project_id, actor, and operation_id.

    - Preserve REST/manager validation messages and stable codes; do not reimplement
    lifecycle rules in MCP.'
  out_of_scope: Read tools, Codex plugin/skill packaging, direct-write hook, portable
    validator, remote MCP, or custom UI.
  context: []
