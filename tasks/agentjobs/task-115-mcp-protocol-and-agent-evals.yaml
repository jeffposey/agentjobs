spec:
  summary: Add protocol-level integration tests and realistic agent evaluations that
    prove the packaged MCP server works against a real AgentJobs service and drives
    valid behavior under retries, races, ambiguity, and hostile direct-write prompts.
  intent: Unit tests can prove handlers in isolation while missing broken STDIO framing,
    packaging, tool metadata, server/client skew, or agents choosing the wrong interface.
    Release needs evidence at the protocol and behavior boundaries where the original
    failure occurred.
  description: 'Implement section 9 of docs/mcp-integration-design.md. Snapshot and
    validate the complete tools/list contract, then launch the packaged STDIO server
    with an official MCP client or inspector against a freshly started real AgentJobs
    HTTP service. Exercise initialize, list, call, structured output, text fallback,
    invalid input, clean shutdown, and stderr-only diagnostics.


    Build a deterministic evaluation harness for the ten accepted scenarios: full
    create/claim/log/handoff loop, zero-context resume, colliding projects, racing
    claim, retry after lost response, refusal of direct-lifecycle instructions, direct-write
    attempts, read-only YAML access, broken-file reporting, and invalid handoff/close.
    Record tool traces and final task state as test artifacts without depending on
    a particular model''s prose.'
  constraints: '- Use a real service and packaged STDIO process for protocol proof;
    mocks may supplement but not replace it.

    - Keep model-based evals deterministic enough to diagnose; contract assertions
    use tool traces and persisted state.

    - Test Windows and POSIX command/quoting behavior where environment permits.

    - Do not weaken schemas to make an eval pass.

    - Any discovered product defect outside the design becomes a separate task rather
    than silent scope growth.'
  out_of_scope: Implementing missing tools, plugin marketplace publication, or notification
    delivery.
  context: []
