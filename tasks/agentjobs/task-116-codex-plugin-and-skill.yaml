spec:
  summary: Create a versioned AgentJobs Codex plugin that launches the installed standalone
    MCP server and teaches the managed zero-context workflow without duplicating protocol
    or lifecycle logic.
  intent: The standalone server provides cross-client interoperability, while Codex
    users need a discoverable, installable bundle with the right server wiring and
    workflow guidance. Packaging should make managed operations the default interface.
  description: 'Implement section 7 (Codex plugin) of docs/mcp-integration-design.md
    using current OpenAI plugin and skill conventions. Add `.codex-plugin/plugin.json`,
    `.mcp.json`, and `skills/agentjobs/SKILL.md`. The MCP entry launches the installed
    `agentjobs mcp` command; no server code is vendored into the plugin.


    The skill must trigger for AgentJobs task discovery, creation, lifecycle work,
    logging, and handoff. It teaches projects_list first, explicit project/actor inputs,
    zero-context task_get reading order, manager verbs, operation ID/revision retry
    behavior, task-files-on-main policy for this repository, and the fact that YAML
    is readable generated state. Keep schemas in MCP metadata rather than copying
    them into prose. Add a local marketplace entry or documented test fixture, install
    it, start a new session, and verify tools and skill discovery.


    The local Codex configuration is shared by the desktop app, CLI, and IDE extension.
    Installation and verification must therefore cover both a terminal session and
    a fresh desktop-app session, not treat them as separate integrations.'
  constraints: '- Follow the accepted one-server/two-distributions architecture.

    - Plugin and package versions stay aligned.

    - The skill cannot tell agents to edit task YAML or use generic state setters.

    - Do not embed secrets or machine-specific absolute paths in the plugin.

    - The initial plugin is Codex-specific packaging; standalone MCP remains the contract
    for other clients.

    - Hook implementation is task-117; leave a clean extension point without claiming
    direct-write enforcement is complete.


    - The skill says to use AgentJobs MCP for all task operations when the tools are
    present. An MCP error is surfaced and diagnosed; it is not permission to hand-edit
    YAML. Managed REST/CLI use is an availability fallback, and direct YAML is limited
    to the documented emergency-recovery override.'
  out_of_scope: Public marketplace submission, custom plugin UI, remote MCP registration,
    and the direct-write hook implementation.
  context: []
