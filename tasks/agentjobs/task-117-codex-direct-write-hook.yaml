spec:
  summary: Add and test a plugin-bundled Codex PreToolUse hook that denies practical
    patch, shell, PowerShell, and script attempts to mutate AgentJobs-managed task
    YAML while preserving read-only access.
  intent: MCP availability does not stop an agent from choosing general file tools.
    The hook must intercept the original failure class before execution and redirect
    the agent to the managed tools, while clearly remaining a guardrail rather than
    a security claim.
  description: 'Implement section 8 (Codex pre-tool hook) of docs/mcp-integration-design.md.
    Resolve managed task directories from AgentJobs project configuration and registry,
    canonicalize paths on Windows/POSIX, inspect PreToolUse inputs, and deny writes
    to managed `*.yaml` task records.


    Cover apply_patch/Edit/Write, shell redirection, PowerShell Set/Add-Content, Out-File,
    New/Remove/Move/Copy-Item and aliases, POSIX tee/redirection/sed -i/mv/cp/rm,
    and general interpreter invocations that explicitly target a managed task path.
    Allow Get-Content/rg/git diff/read tools and AgentJobs MCP/CLI/API operations.
    The denial names the project and tells the agent which managed tools to use. Bundle
    the hook in the plugin, document review/trust, and test the exact hook JSON protocol
    and exit/deny response.'
  constraints: '- Use current Codex PreToolUse schema and matcher behavior; plugin
    hooks require user trust.

    - Synchronous, deterministic, bounded execution with no network dependency.

    - Prefer conservative denial when a general interpreter explicitly names a managed
    task path.

    - Do not block read-only task access.

    - State prominently that hosted/specialized tools, disabled/untrusted hooks, and
    obfuscated scripts may bypass it.

    - Do not call the hook a complete security boundary.'
  out_of_scope: Claude/Gemini hook implementations, operating-system ACLs, sandbox
    changes, repository validation/receipts (task-118), or blocking writes outside
    managed task YAML.
  context: []
