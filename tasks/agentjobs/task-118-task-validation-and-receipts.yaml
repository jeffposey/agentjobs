spec:
  summary: Add a portable AgentJobs validation command plus manager-produced write
    receipts and a local staged-change gate, so invalid or unsupported direct task
    edits are loud outside Codex too.
  intent: Hooks are client-specific and bypassable. The repository needs a cross-agent
    semantic backstop, while local commits need evidence that staged task content
    came from AgentJobs' managed write path rather than a valid-looking direct edit.
  description: 'Implement section 8 (managed-write receipts and portable validation)
    of docs/mcp-integration-design.md. Add `agentjobs validate` for strict schema/corpus
    checks and `agentjobs validate --staged` for local commit policy. Every successful
    TaskStorage write emits a machine-local receipt under `.agentjobs/write-receipts/`
    with project/task/result hash, operation, actor when known, timestamp, and AgentJobs
    version. Ignore receipts in Git.


    Portable validation checks YAML parsing/schema, filename-ID agreement, lifecycle
    invariants, log integrity, configured taxonomy/actors where policy requires, parent/dependency
    existence and cycles using the canonical graph implementation, context/deliverable
    path policy, and canonical serialization. `--staged` additionally requires each
    staged task hash to match its latest receipt. Provide a repository Git-hook installation
    path and an explicit noisy maintainer recovery override requiring a reason and
    listing paths. CI/clean-clone validation does not require receipts and documents
    that it cannot prove writer provenance.


    The override is an emergency-recovery mechanism for a maintainer when no managed
    operation can express the repair. It is not an agent convenience switch: ordinary
    MCP, API, CLI, or GUI errors must be diagnosed through the managed path rather
    than bypassed.'
  constraints: '- Receipts are machine-local evidence, not task state and not a cryptographic
    security boundary.

    - Do not commit receipts or make CI depend on them.

    - Normal manager, API, CLI, MCP, migration, and UI writes all produce receipts
    through TaskStorage.

    - The recovery bypass must be explicit, reasoned, visible, and unsuitable as an
    unattended agent default.

    - Reuse task-100''s canonical dependency-cycle behavior; do not implement a competing
    graph rule.

    - Read-only task access remains supported; content-only direct edits are unsupported
    generated-state mutation.


    - Emergency direct repair requires an explicit human/maintainer decision, a recorded
    reason, exact affected paths, and a successful full validation afterward. Agent
    guidance must never enable the override autonomously.'
  out_of_scope: Codex PreToolUse behavior, OS access controls, signing receipts with
    a central secret, auto-repairing corrupt tasks, or changing dependency semantics.
  context: []
