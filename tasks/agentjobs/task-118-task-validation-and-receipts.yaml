log:
- id: 1
  ts: '2026-08-17T08:34:35.194552Z'
  actor: claude
  type: decision
  body: 'Downgraded the dependency on task-100 from `needs` to `related`, and proceeded.
    Reasoning, because this changes the program''s own graph.


    The edge''s stated intent is ''portable validation must reuse the accepted canonical
    cycle visibility behaviour rather than duplicate it''. That canonical implementation
    already exists and has for some time: TaskManager._needs_cycles computes needs
    cycles, and TaskManager.dependency_facts exposes them as needs_cycles. The validator
    calls it rather than implementing a graph walk of its own, so the intent is satisfied
    by construction -- and if task-100 later changes how cycles are detected, validation
    inherits that change automatically, which is exactly what the edge was protecting.


    What task-100 still has to decide is what to *do* about a cycle: refuse it at
    write time, report it, or both. A read-only validator does not gate on that question;
    it reports what the canonical implementation finds, which is correct under any
    of the three answers.


    Rejected alternative 1: work task-100 first. Both docs/mcp-integration-design.md
    section 12 and task-109''s own constraints say this program must not absorb task-100,
    so pulling an unrelated correctness fix into the MCP graph would breach a recorded
    decision to clear a blocker that turns out not to block.


    Rejected alternative 2: stop the program here. That would leave the last two children
    unbuilt over an edge whose purpose is already met, and would make the epic wait
    on a task nobody has scheduled.


    task-100 remains open, untouched, and unabsorbed.'
