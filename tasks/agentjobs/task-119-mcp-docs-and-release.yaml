spec:
  summary: Integrate the completed MCP server, plugin, hook, validation backstop,
    compatibility policy, and cross-agent setup into AgentJobs documentation and release
    verification.
  intent: A correct server is ineffective if agents do not discover it, users cannot
    install or upgrade it, or client-specific pages overpromise hook enforcement.
    Documentation is part of making the managed interface the obvious path.
  description: 'Implement sections 7, 8 (cross-agent matrix), and 10 of docs/mcp-integration-design.md
    after the protocol and enforcement surfaces stabilize. Update README and docs
    index; add standalone MCP setup plus Codex desktop/CLI/plugin, Claude, Gemini,
    and generic MCP client pages. Each includes service health, projects_list, actor
    configuration, a complete zero-context create/claim/log/handoff example, upgrade/rollback,
    and the exact protection level it receives.


    Update task-schema and agent-workflow guidance to call YAML readable generated
    state, not an authoring interface. Document operation IDs, revisions, structured
    errors, plugin/hook trust, managed-write receipts, local Git hook, portable validation,
    version skew, and the future-notification boundary. Build docs, validate links,
    install from the built wheel/plugin, run the real happy path, and prepare release
    notes/changelog evidence.'
  constraints: '- Do not claim hooks are security boundaries or that non-Codex clients
    receive Codex prevention.

    - Do not document remote Streamable HTTP, notification delivery, or public marketplace
    publication as shipped.

    - Keep MCP tool schemas authoritative in tools/list; docs show workflows, not
    a drifting duplicate reference.

    - Preserve React-first UI and current CLI/API documentation.

    - Version package, plugin, compatibility notes, and release artifacts coherently.'
  out_of_scope: Implementing missing functionality, public plugin submission, marketing
    screenshots, or a notification receiver.
  context: []
