spec:
  summary: Turn observations made while using AgentJobs into normal, actionable tasks
    with near-zero friction, including pasted screenshot snippets and a tray for submitting
    many findings together.
  intent: "Findings currently leak into chat or memory because stopping work to author\
    \ tasks is too expensive. A global reporter, clipboard screenshots, and a durable\
    \ multi-item capture tray make recording cheaper than forgetting, while keeping\
    \ tasks\u2014not chat and not a parallel issue store\u2014as the system of record."
  description: 'This is the implementation umbrella for the issue-reporting workflow.
    Complete it through task-065 (global single-issue reporting), task-067 (Git-backed
    screenshot attachments), and task-121 (multi-item capture tray and one-action
    submission). The parent is finished by its children and must not become a parallel
    implementation workstream.


    The intended experience is continuous capture: report one issue immediately, or
    keep collecting titled notes and pasted snippets while reviewing the product,
    then create all of them as normal tasks in one action. Created items use the same
    manager-backed task path as every other task; there is no separate issue database
    or inbox.'
  constraints: '- Every submitted finding becomes a normal task through the managed
    API/TaskManager path.

    - Preserve the reporter''s page/project/task context per finding.

    - Clipboard paste is the primary screenshot interaction.

    - The capture tray must survive navigation and an accidental reload until each
    item is successfully submitted.

    - Successful and failed items must be distinguishable so a partial submission
    never loses unsent work.

    - This program is explicitly second after task-109. That is scheduling order,
    not a semantic prerequisite, so it must be represented by queue position once
    task-081 ships and never by an invented needs edge.'
  out_of_scope: A separate issue entity or store, duplicate detection, automatic triage
    or prioritization, image annotation/cropping, video, and arbitrary bulk mutation
    of existing tasks.
  context:
  - path: frontend/src/App.tsx
    why: Global shell where issue capture is reachable from every page.
  - path: src/agentjobs/api/routes/tasks.py
    why: Existing manager-backed task creation boundary the reporter must reuse.
