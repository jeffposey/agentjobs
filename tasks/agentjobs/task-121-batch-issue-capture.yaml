  body: 'Gate before dispatch, decided by Jeff Posey on 2026-09-05: do not build the
    tray until the single-issue Report Issue action (task-065, shipped) has been used
    for a real multi-finding review pass and found wanting. Jeff has not yet used
    Report Issue in earnest, so the premise of this task -- that filing findings one
    at a time is costly enough to leave most of them unfiled -- is a hypothesis, not
    an observation. The reopen trigger is concrete: one desktop/phone/tablet UI feedback
    pass done through Report Issue, with a note here saying what the friction actually
    was (time per finding, focus loss, lost screenshots, lost context). If that pass
    is fine, close this as cancelled and the umbrella task-120 with it. Rejected alternative:
    dispatching now because the spec is complete and unblocked -- a complete spec
    for a feature nobody has needed yet is the more expensive mistake.'
