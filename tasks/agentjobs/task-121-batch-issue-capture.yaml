spec:
  summary: One pass through the React app turns up a dozen small problems at once.
    Today each one costs opening and submitting a form, so most of them get said out
    loud instead of filed. Collect findings as you go -- title, a note, a pasted screenshot
    -- and file the whole batch as normal tasks in one click.
  intent: 'The originating case, in the owner''s words on 2026-08-18: *"there are
    a ton of problems with the React GUI and I''d like to have a good way to bulk
    enter them."* That is one sitting, one pass through the product, and perhaps fifteen
    findings.


    Task-065 made filing one issue cheap. It did not make filing fifteen cheap, and
    a review pass produces them in a burst: each finding individually too minor to
    justify stopping, collectively the difference between a product that feels considered
    and one that does not. Reopening a modal per item interrupts the review itself,
    so the observations go back into chat -- which is the leak the whole epic exists
    to close.


    The measure of this task is not that many issues *can* be filed at once. It is
    whether filing beats saying it out loud. That test was failed during task-067''s
    own review: the reporter was open on screen and the finding still arrived by chat,
    because typing it was faster than filing it.'
  description: 'Add a global issue-capture tray to the React application. A user can
    add multiple cards quickly; each card has a required title, optional details,
    captured page/project/task context, and zero or more pasted screenshots using
    task-067''s shared attachment widget. Adding another finding must keep focus in
    the capture flow instead of closing the reporter.


    Persist the unsent tray locally, including image blobs, so navigation or an accidental
    reload does not erase a review session. IndexedDB is the expected browser mechanism
    because screenshot blobs do not belong in localStorage; the implementation may
    choose an equivalent local-only store with the same durability and cleanup behavior.


    `Create N tasks` is one user action. Each item goes through the same manager-backed
    report/create service from task-065 and receives a stable client operation ID
    so retry cannot duplicate successfully created tasks. The result reports success/failure
    per item, links created task IDs, removes only confirmed successes, and keeps
    failed/unsubmitted cards intact for correction and retry. This is intentionally
    not an arbitrary MCP batch-mutation tool and need not promise an all-or-nothing
    transaction across N task files.'
  constraints: '- One user action submits the full tray, but partial success is explicit
    and retry-safe rather than disguised as atomicity.

    - Reuse task-065''s task creation path and task-067''s attachment storage/widget.

    - Never create a parallel issue store; the tray is local unsent composition state
    only.

    - Preserve each item''s original route, project, and related task rather than
    applying submit-time context to the whole batch.

    - Do not lose prose or screenshots on validation, upload, network, or partial
    server failure.

    - Successful retry must not duplicate tasks already created by an earlier partial
    attempt.

    - Keyboard-first capture and clipboard paste are primary; file selection remains
    a fallback.'
  out_of_scope: Bulk editing existing tasks, automatic deduplication/triage, cross-device
    synchronization of an unsent tray, image annotation, and an all-or-nothing multi-file
    database transaction.
  context:
  - path: frontend/src/App.tsx
    why: Global shell and persistent capture-tray entry point.
  - path: frontend/src
    why: Reuse the report form and attachment widget produced by sibling tasks.
  - path: src/agentjobs/api/routes/tasks.py
    why: Manager-backed creation and idempotency boundary; no direct task file writes.
