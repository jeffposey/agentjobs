  body: 'Filed as its own task rather than reopening task-109. The MCP program delivered
    what its accepted design specified -- one server plus Codex packaging -- and it
    is complete. A second client''s packaging is new scope, not an unfinished part
    of the old scope, and folding it back in would make a finished program look unfinished
    and hide when each piece actually landed. Rejected alternative: reopen task-109
    and add an eleventh child.'
