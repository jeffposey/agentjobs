- id: 11
  ts: '2026-08-17T19:25:17.573707Z'
  actor: claude
  type: decision
  body: "THREE DECISIONS FROM THE IMPLEMENTATION PASS. Binding; do not relitigate.\n\
    \n1. THE CLAUDE HOOK PRINTS NOTHING WHEN IT ALLOWS.\n\nClaude's `permissionDecision:\
    \ \"allow\"` does not mean \"this hook has no objection\". It\nmeans \"skip the\
    \ permission system for this call\". The hook matches Edit, Write,\nNotebookEdit\
    \ and Bash, so emitting an allow on every event would silently auto-approve\n\
    nearly everything a session does \u2014 including every call the user's own settings\
    \ would\notherwise have prompted about. Exiting 0 with no output is Claude's way\
    \ of saying a hook\nhas no opinion, so that is what an allow does.\n\nCodex is\
    \ the opposite: its protocol expects a decision on every event, so its entry\n\
    point still answers `allow` explicitly. This is the ONLY behavioural difference\
    \ between\nthe two entry points, and it is deliberate. It reads as a missing feature,\
    \ so it is\nstated in the module docstring, the plugin README, docs/mcp-clients.md,\
    \ and a test named\nfor the failure it prevents (test_it_never_emits_an_allow_or_an_ask_decision).\n\
    \nRejected alternative: emit `permissionDecision: \"allow\"` for symmetry with\
    \ Codex. That\nwould have been a silent, session-wide permission bypass that looks\
    \ identical to a user\nwho trusts their tools \u2014 the worst kind of failure,\
    \ because nothing surfaces it.\n\n2. A REAL BUG, FOUND BY RUNNING THE MATRIX AGAINST\
    \ CLAUDE FOR THE FIRST TIME.\n\nFILE_WRITE_TOOLS was written in Codex's snake_case\
    \ (`notebook_edit`) and matched on a\nplain `.lower()`. Claude's tool is `NotebookEdit`,\
    \ which folds to `notebookedit` and\nmatched nothing. So the Claude matcher would\
    \ have registered NotebookEdit and the guard\nwould then have ALLOWED every write\
    \ it made \u2014 a hole that looks correct in the\nconfiguration file, which is\
    \ exactly the false confidence the matrix exists to catch.\n\nFixed at the root\
    \ rather than by adding an entry: tool names are now matched with\nseparators\
    \ stripped as well as case folded (`_normalise_tool`), so every current and\n\
    future spelling of a tool name lands on one table key. Regression test\n`test_one_tool_is_caught_however_its_client_spells_it`\
    \ pins four spellings.\n\nRejected alternative: add \"notebookedit\" to the table.\
    \ It fixes the one tool that was\nnoticed and leaves the next client's spelling\
    \ to be discovered the same way.\n\n3. evaluate() RETURNS A NEUTRAL DECISION,\
    \ NOT EITHER CLIENT'S PAYLOAD.\n\n`{\"decision\": \"allow\"|\"deny\", \"reason\"\
    : ...}`. Had it kept returning Codex's\n`permission_decision` payload, the Claude\
    \ entry point would be translating between two\nprotocols rather than adding one,\
    \ and Codex's shape would quietly have become the shared\none. A test asserts\
    \ the shared module contains none of `permission_decision`,\n`hookSpecificOutput`,\
    \ or `permissionDecision`.\n\nThe finding from the research pass held: there is\
    \ no stdin adapter. Both clients send\n`tool_name`/`tool_input` and `cwd`, which\
    \ `evaluate()` already read."
