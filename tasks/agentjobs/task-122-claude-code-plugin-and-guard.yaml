- id: 3
  ts: '2026-08-17T17:46:48.002348Z'
  actor: claude
  type: decision
  body: 'The repository''s own `.mcp.json` is gitignored rather than committed, and

    docs/mcp-clients.md gains a "Developing from a clone" section carrying both

    invocations. Branch docs/mcp-clone-invocation, commit 5616f57.


    Rejected alternative: commit a PATH-based `.mcp.json` (`command: "agentjobs"`).
    It

    looks like the friendlier default but is wrong for the only population that clones

    this repository. `pip install agentjobs` puts a launcher on PATH; a Poetry clone
    does

    not. On Windows the venv holds a POSIX shebang script named `agentjobs` and an

    `agentjobs.cmd` shim, and no `.exe` -- an MCP client spawns its server through
    argv

    with no shell, so neither is launchable. The invocation that works is

    `<venv>/Scripts/python.exe -m agentjobs.cli mcp`.


    So a committed PATH entry would be a tracked file every contributor has to edit
    to

    name their own virtualenv: a permanently dirty working tree, and a machine-specific

    absolute path one `git add -A` away from being published. The zero-config experience

    it was supposed to buy never existed, because the command it names does not resolve

    from a clone. Ignoring the file costs nothing real and removes the leak.


    The docs note is the durable half of this and had to be written under either option:

    the guide previously spelled every command `agentjobs`, including `agentjobs serve`,

    which is false for anyone developing here.'
