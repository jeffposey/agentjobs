- id: 8
  ts: '2026-08-17T18:39:51.830301Z'
  actor: claude
  type: decision
  body: "LAYOUT: one plugin directory serves both clients. Do NOT create\n`plugins/agentjobs-claude/`.\
    \ Extend `plugins/agentjobs/`, which the spec explicitly\nallows (\"or extend\
    \ the existing plugin directory if a shared layout is cleaner\").\n\nWhy this\
    \ is now clearly right, verified against current Claude Code docs today rather\n\
    than assumed:\n\n- The two clients read different manifest paths and ignore each\
    \ other's.\n  Codex: `.codex-plugin/plugin.json`. Claude: `.claude-plugin/plugin.json`.\
    \ Both can\n  sit in one directory, and both manifests can point at the same `skills/`,\n\
    \  the same `.mcp.json`, and a hooks file.\n- Claude's manifest fields line up\
    \ with the Codex one already written: `name`,\n  `version`, `description`, `author`,\
    \ `homepage`, `license`, `keywords`,\n  `mcpServers` (may be a path such as `\"\
    ./.mcp.json\"`), `skills`, `hooks`.\n- A shared guard module has to be importable\
    \ from wherever the hook runs. Hooks are\n  launched by absolute path from the\
    \ plugin root (`${CLAUDE_PLUGIN_ROOT}` /\n  `${CODEX_PLUGIN_ROOT}`), and a marketplace\
    \ installs a *directory*. A module outside\n  that directory is not there after\
    \ install. One directory is therefore the only\n  layout where the shared module\
    \ is genuinely shared rather than vendored twice --\n  which is exactly what the\
    \ constraint forbids.\n\nRejected alternative: two plugin directories with the\
    \ guard duplicated or symlinked.\nDuplication is the drift the constraint exists\
    \ to prevent; symlinks do not survive a\nzip-based marketplace install and are\
    \ hostile on Windows, which is where this is\ndeveloped.\n\nCONTRACT FINDING,\
    \ and the useful surprise: the stdin shapes are already compatible.\n`evaluate()`\
    \ in guard_task_yaml.py reads `tool_name` then falls back to `tool`, and\n`tool_input`\
    \ then falls back to `arguments`. `tool_name` / `tool_input` ARE Claude's\nfield\
    \ names -- the Codex script was already written against them, with the Codex names\n\
    as the fallback. Claude also sends `cwd`, which `main()` already reads.\n\nSo\
    \ there is no stdin adapter to write. The ONLY client-specific part is the decision\n\
    written to stdout:\n\n    Codex today:  {\"permission_decision\": \"deny\", \"\
    permission_decision_reason\": \"...\"}\n\n    Claude needs: {\"hookSpecificOutput\"\
    : {\n                     \"hookEventName\": \"PreToolUse\",\n               \
    \      \"permissionDecision\": \"deny\",\n                     \"permissionDecisionReason\"\
    : \"...\"}}\n\nClaude exit codes: 0 with that JSON controls the outcome; 0 with\
    \ no output means no\ndecision and normal permission flow; 2 blocks unconditionally\
    \ and cannot be overridden\nby JSON. Keep the existing fail-open behaviour --\
    \ exit 0 and allow on any internal\nerror -- which maps cleanly onto \"0 with\
    \ no decision\".\n\nClaude hook config, for `hooks/hooks-claude.json` or an inline\
    \ `hooks` field:\nmatcher on tool names `Edit|Write|NotebookEdit|Bash`, one entry\
    \ of `type: \"command\"`\nwith `\"command\": \"python \\\"${CLAUDE_PLUGIN_ROOT}/hooks/guard_task_yaml_claude.py\\\
    \"\"`.\nNote Claude's matcher must use ITS tool names, not Codex's -- the existing\
    \ matcher\nstring (`apply_patch|edit|write|...`) is Codex vocabulary and is lowercase;\
    \ Claude's\ntools are `Edit`, `Write`, `Bash`, `NotebookEdit`. The FILE_WRITE_TOOLS\
    \ / SHELL_TOOLS\ntables inside the guard already lowercase the tool name before\
    \ matching, so the Python\nside needs no change -- only the matcher string in\
    \ the Claude hooks file.\n\nSKILL frontmatter: Claude requires `name` and `description`.\
    \ The docs are explicit\nthat omitting `name` makes Claude fall back to the directory\
    \ basename, which for a\nmarketplace install is a version string that changes\
    \ on every update. So the shared\nSKILL.md must carry an explicit `name: agentjobs`."
