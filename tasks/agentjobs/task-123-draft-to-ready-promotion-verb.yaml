- id: 4
  ts: '2026-08-17T18:22:58.030309Z'
  actor: claude
  type: decision
  body: 'ac-3: promotion does NOT validate spec completeness. `promote_task` moves
    the

    lifecycle and records who said so; it does not inspect summary, description, or

    acceptance criteria.


    Rejected alternative: require a non-empty summary and description and at least
    one

    acceptance criterion, on the reasoning that the verb literally means "the spec
    is

    finished". Rejected for two reasons. It would invent a completeness rule that
    exists

    nowhere else in the schema -- nothing stops a task being *created* `ready` with
    an

    empty spec today, so enforcing it only on the draft path would make the stricter

    route the one nobody takes. And `agentjobs validate` already owns completeness,
    across

    the whole corpus and with findings a human can read; a weaker second copy inside
    the

    verb would refuse records their author considers ready, with no way to say "yes,
    I

    mean it" short of not using the verb.


    The consequence, stated so it is not rediscovered as a bug: promoting a thin draft

    succeeds. `agentjobs validate` is where that gets caught, as it already is for
    thin

    tasks created ready.


    Also decided, smaller: no webhook fires on promotion. `handoff` and `close` fire;

    `claim` and `release` do not. Promotion is pool movement, not a directed ask,
    and

    `release_task` -- which produces the identical target state -- is silent. A

    `task.promoted` event with no subscriber and no analogue on its nearest neighbour

    would be noise.'
