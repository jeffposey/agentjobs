  type: related
  note: Owns idempotency, the creation lock, revisions and error codes; ac-4 re-proves
    all of it on the new transport.
- task: task-115-mcp-protocol-and-agent-evals
  type: related
  note: Its ten scenarios become the parametrised proof that both transports behave
    identically.
