spec:
  summary: 'AgentJobs is unusably slow for its size: opening a task takes 5-10 seconds
    against a 112-file, 1.1 MB corpus. This umbrella covers measuring latency in both
    the CLI and the React app, fixing the causes (the corpus is re-parsed several
    times per request, with PyYAML''s pure-Python loader), and adding performance
    budgets to the test suite so it cannot silently regress.'
  intent: 'Reported by Jeff on 2026-08-17 from ordinary use, as the single most frustrating
    thing about the product: 5-10 seconds to open a task after clicking it. The app
    is simple and the data is small; it should feel snappy.


    This is filed ahead of the issue-reporting epic (task-120 / task-121) deliberately.
    A tool for capturing and fixing issues quickly is worth little if using it means
    waiting several seconds per click.


    The cause was measured before this task was written, so the children below are
    remediation of known defects rather than an open-ended investigation. The numbers
    and the call sites are recorded in the description so a later reader can tell
    whether a change actually helped.'
  description: '# Make AgentJobs feel instant


    ## Measured today (2026-08-17, 112 task files, 1.1 MB of YAML, warm server on
    localhost)


    | Surface | Wall time |

    | --- | --- |

    | `GET /api/projects/{p}/dashboard` | **7.9 s** |

    | `GET /api/projects/{p}/tasks/{id}/detail` | **4.1 s** |

    | `GET /api/projects/{p}/tasks` | **4.1 s** |

    | `GET /api/projects` | 2.0 s |

    | `GET /api/projects/{p}/search?q=...` | 1.2 s |

    | `GET /api/projects/{p}/revision` (polled every 15 s) | 0.23 s |

    | `agentjobs list --lifecycle ready` (CLI, cold process) | 3.0 s |


    Those are single-request numbers against a server that was already warm. They
    account

    for the whole of the reported "5-10 seconds to open a task": the React app fetches
    the

    detail and the list, and both re-read and re-validate the entire corpus.


    ## Why it is slow (root-caused, not guessed)


    Two independent multipliers, either of which alone would be visible.


    **1. The corpus is parsed several times per request.** `TaskStorage.list_tasks()`
    calls

    `load_all()`, which globs and re-parses every YAML file in the project. Nothing
    caches

    it. One `GET /tasks` therefore walks the whole corpus about four times:


    - `TaskManager.list_tasks()` -> `storage.list_tasks()` (src/agentjobs/manager.py:94)

    - `_read_tasks()` -> `dependency_facts()` -> `storage.list_tasks()` (manager.py:214)

    - `dependency_facts()` -> `_dependency_states()` -> `storage.load_all()` (manager.py:128)

    - `dependency_facts()` -> `_open_children()` -> `storage.list_tasks()` (manager.py:272)


    The dashboard is worse still, which is why it is the slowest page in the product
    and

    also the landing page.


    **2. YAML is parsed by PyYAML''s pure-Python loader.** `storage.load_task()` calls

    `yaml.safe_load` (src/agentjobs/storage.py:155). Measured over the real corpus:


    - `yaml.safe_load` (pure Python): **0.81 s**

    - `yaml.load(..., Loader=CSafeLoader)` (libyaml): **0.075 s**


    libyaml is already installed and importable in this environment. That is a ~10x
    parsing

    win for a one-line change, guarded by a fallback for installs without it.


    Multiply the two together and 4 s for a list is exactly what you would predict.


    **3. The revision poll reads every byte.** `TaskStorage.project_revision()`

    (storage.py:95) hashes the full contents of every task file. The React app polls
    it

    every 15 seconds, so the server re-reads 1.1 MB per client per poll to answer
    "has

    anything changed". Correct, but far more work than the question needs.


    ## Shape of the work


    1. **Measure first** (task-131). A repeatable benchmark for API, CLI, and browser
    interactions, so every later change is judged against numbers rather than a feeling.
    Nothing else in this epic merges without a before/after from this tool.

    2. **Load the corpus once** (task-132). Structural fix: a request-scoped snapshot,
    so a single request never parses a file twice.

    3. **Parse faster** (task-133). libyaml `CSafeLoader`, with a graceful fallback.

    4. **Stop re-reading unchanged files** (task-134). A process cache keyed on file
    identity, which also makes the 15-second revision poll nearly free.

    5. **Fix the front end** (task-135). Measure what the React app actually does
    when a task row is clicked, and make that interaction feel immediate.

    6. **Lock it in** (task-136). Performance budgets in the suite, run by `scripts/check.py`,
    over a synthetic corpus of fixed size so the thresholds are stable across machines.

    '
  constraints: '- Correctness is not negotiable for speed. Broken task files must
    still be reported by filename (the `load_all()` error-collection behaviour), a
    stale cache must never serve a task record that has changed on disk, and the revision
    signal must still notice writes made by the CLI, by git, and by hand editing.

    - Caching must be correct under the multi-writer reality this project already
    designed for: the API is not the only writer.

    - Every child states its before and after numbers, produced by task-131''s tool,
    in a `progress` log entry. ''Feels faster'' is not evidence.

    - Budgets added in task-136 must be stable on a slow machine. A flaky performance
    test is worse than none, because it gets disabled.'
  out_of_scope: '- Replacing YAML files with a database or a derived index. The git-friendly,
    one-file-per-task design is the product; this epic makes that design fast, it
    does not trade it away.

    - The legacy Jinja UI. It is deprecated (see task-007) and gets no performance
    work.

    - The issue-reporter epic (task-120, task-121), which follows this one.

    - Network and tailnet latency for remote devices. In scope is server and client
    work time, measured on localhost.'
  context:
  - path: src/agentjobs/manager.py
    why: list_tasks, dependency_facts, _dependency_states and _open_children each
      re-read the whole corpus; this is the main multiplier.
  - path: src/agentjobs/storage.py
    why: load_all/load_task do the globbing and the pure-Python yaml.safe_load; project_revision
      hashes every byte on every poll.
  - path: src/agentjobs/api/routes/tasks.py
    why: _read_tasks calls dependency_facts on every request, which triggers the repeated
      loads.
  - path: scripts/check.py
    why: The single repository gate; performance budgets have to run here to be real.
  - path: ENGINEERING.md
    why: 'Verification standards: exercise the change the way a user would, and ask
      what a passing check would have caught.'
