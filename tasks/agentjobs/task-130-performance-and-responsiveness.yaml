- id: 2
  ts: '2026-08-18T00:00:16.844990Z'
  actor: claude
  type: decision
  body: '**One human review for the whole epic, not one per child.**


    Jeff, 2026-08-17, on filing this epic: "Only wait for my review when you think
    it''s fast but need me to double check by testing in browser."


    So for the children of task-130 only, the per-branch merge gate in ENGINEERING.md
    is relaxed: an agent may merge a child on green tests plus a recorded before/after
    benchmark, without stopping for approval. The review checkpoint moves to the end
    of the epic, where it is a browser test on a real device rather than a diff read.


    **Rejected alternative:** hand off each of the six children for individual review,
    as the standard gate requires. Rejected because Jeff explicitly asked not to be
    stopped six times, and because the thing under review here is a *felt* property
    -- latency -- that a diff cannot demonstrate and a benchmark number can. Six approval
    round-trips would each ask him to approve something he still could not feel.


    **What this does not relax:** every child still records before/after numbers from
    task-131''s tool before it merges, still runs `scripts/check.py` green, and is
    still committed on its own branch from its own worktree. Speed of review is not
    permission to skip evidence. If a child turns out to need a product decision rather
    than an implementation, it hands off to human/decision as normal -- this decision
    covers review, not judgement calls.


    **Review logistics, still open:** Jeff may be able to test a branch server from
    a tablet if its URL is reachable from the Claude app; if the temporary port is
    not on the tailnet, the fallback agreed at filing time is to verify on desktop,
    merge, and have him confirm on the device against the normal tailnet URL afterwards.'
