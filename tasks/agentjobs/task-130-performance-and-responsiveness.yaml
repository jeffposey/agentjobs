  type: progress
  body: "**Session boundary.** The epic record and the measurements are complete;\
    \ the six child\ntasks have NOT been created yet. A fresh session should create\
    \ them, then work them.\n\nHanding off here on purpose: the `agentjobs` MCP interface\
    \ was unreachable for this\nsession (port 8765 vs 8876 -- see task-126, where\
    \ the evidence is logged). It has now\nbeen fixed machine-locally and verified\
    \ to serve 14 tools, but an MCP server only\nattaches at session start, so this\
    \ session could not use it. Everything above was\nwritten through the REST API,\
    \ which reaches the same authoritative code path. **The next\nsession should have\
    \ the MCP tools and should use them** (`task_create_ready`,\n`task_claim`, `task_log_append`,\
    \ ...) rather than the REST fallback.\n\n## What is already done\n\n- task-130\
    \ exists, `ready`, priority `critical`, with the full measurement table and\n\
    \  root-cause analysis in `spec.description`. Do not re-measure before reading\
    \ it.\n- The review-gate decision is logged above and is binding.\n- Nothing is\
    \ claimed. No branches or worktrees exist yet.\n\n## The six children to create\n\
    \nAll with `parent: task-130-performance-and-responsiveness`, lifecycle `ready`,\n\
    category `performance`. Suggested ids are free as of this writing; confirm before\
    \ use.\n\n**task-131 -- Measure it: a benchmark for API, CLI, and the browser.**\
    \ priority\ncritical, no dependencies. The gate for everything else. Deliver a\
    \ repeatable script\n(suggest `scripts/bench.py`) reporting p50/p95 for the API\
    \ endpoints in the table, the\ncommon CLI read commands, and a Playwright-driven\
    \ click-to-rendered-task timing. It\nmust run against a corpus of stated size\
    \ and print the size, so two runs are\ncomparable. Also add per-request server-side\
    \ timing (a response header or structured\nlog) so a slow request can be attributed\
    \ without a profiler.\n\n**task-132 -- Load the task corpus once per request.**\
    \ priority critical, needs\ntask-131. The single biggest win. Introduce a request-scoped\
    \ corpus snapshot so\n`list_tasks`, `dependency_facts`, `_dependency_states` and\
    \ `_open_children` share one\nparse instead of four. Call sites are named in the\
    \ epic description with line numbers.\nAcceptance should include a test asserting\
    \ the parse count for one request, not just a\nwall-clock number -- that is the\
    \ check that would actually catch a regression.\n\n**task-133 -- Parse YAML with\
    \ libyaml.** priority high, needs task-131. Use\n`yaml.CSafeLoader` in `storage.load_task`,\
    \ falling back to the pure-Python loader when\nthe C extension is absent, and\
    \ make the fallback visible rather than silent. Measured\n0.81 s -> 0.075 s over\
    \ the real corpus. Small and near-independent of task-132; they\nmultiply.\n\n\
    **task-134 -- Stop re-reading files that have not changed.** priority high, needs\n\
    task-132 and task-133. A process-level cache keyed on file identity (mtime + size,\
    \ or\nwhatever survives the multi-writer reality this project already designed\
    \ for: CLI, git\ncheckout, hand edits). Must also make `project_revision()` cheap\
    \ -- it currently reads\nall 1.1 MB on every 15-second poll, per client. The correctness\
    \ constraints in the epic\nare load-bearing here; a stale cache is a worse bug\
    \ than a slow app.\n\n**task-135 -- Make opening a task feel instant in the React\
    \ app.** priority critical,\nneeds task-131. Measure first: what does the app\
    \ actually fetch when a row is clicked?\nLikely fixes are prefetch-on-hover/intent\
    \ from the list, seeding the detail view from\nthe already-loaded list row so\
    \ something renders immediately, and making sure the\n15-second poll never blocks\
    \ or refetches an interaction. Target: under 500 ms click to\nrendered detail.\n\
    \n**task-136 -- Performance budgets in the suite.** priority high, needs 132,\
    \ 133, 134,\n135. Budgets asserted by `scripts/check.py` over a *synthetic* corpus\
    \ of fixed size, so\nthresholds do not drift with the real backlog and do not\
    \ flake on a slow machine.\nPrefer asserting on work done (files parsed per request)\
    \ alongside wall-clock, since\nwork counts are stable across hardware and wall-clock\
    \ is not.\n\n## After the children exist\n\nWork them one eligible child at a\
    \ time per the parent-task loop in ALLAGENTS.md:\nworktree, branch, claim, work,\
    \ verify with the task-131 tool, merge on green per the\ndecision above, close,\
    \ remove the worktree, continue. Stop at the end of the epic and\nhand off to\
    \ Jeff for the browser check (ac-7)."
