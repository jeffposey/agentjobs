- id: 4
  ts: '2026-08-18T00:46:32.335550Z'
  actor: claude
  type: progress
  body: "**Built and run. The benchmark reproduces the reported complaint, and the\
    \ parse counts confirm the epic's root cause as measurement rather than code reading.**\n\
    \n## Delivered\n\n- `scripts/bench.py` \u2014 serves a throwaway copy of the corpus\
    \ on its own port (18950) and times three surfaces. Never touches the real backlog;\
    \ never reuses the running server on 8876.\n- `src/agentjobs/instrumentation.py`\
    \ + middleware \u2014 every API response now carries `X-Response-Time-Ms` and\
    \ `X-Task-Parses`.\n- `frontend/playwright.bench.config.ts` + `frontend/e2e-bench/open-task.bench.ts`\
    \ \u2014 click-to-rendered timing.\n- `docs/performance.md`, a section in `ENGINEERING.md`,\
    \ `benchmarks/README.md`.\n- `benchmarks/baseline-2026-08-17-real.json` \u2014\
    \ the pre-optimisation baseline, committed so children can produce a before/after\
    \ without checking out old code to measure it.\n- `tests/test_instrumentation.py`\
    \ \u2014 12 tests.\n\n## Baseline (real corpus, 119 files, 1,195,490 bytes, 10\
    \ iterations)\n\n| Surface | p50 | p95 | task files parsed |\n| --- | --- | ---\
    \ | --- |\n| `GET /api/projects` | 1009 ms | 1062 ms | 119 |\n| `GET /dashboard`\
    \ | **7344 ms** | 8129 ms | **952 (8x the corpus)** |\n| `GET /tasks` | 3659 ms\
    \ | 4152 ms | **476 (4x)** |\n| `GET /tasks/{id}/detail` | 3954 ms | 4126 ms |\
    \ **478 (4x)** |\n| `GET /search?q=the` | 1020 ms | 1116 ms | 119 (1x) |\n| `GET\
    \ /revision` | 18 ms | 20 ms | 0 |\n| Browser: click row -> detail rendered (warm\
    \ app) | **9567 ms** | 11147 ms | - |\n| Browser: cold load -> detail rendered\
    \ | 10931 ms | 20510 ms | - |\n| CLI `list --lifecycle ready` | 1668 ms | 1678\
    \ ms | - |\n| CLI `next` | 787 ms | 796 ms | - |\n| CLI `show <task>` | 717 ms\
    \ | 730 ms | - |\n\n## What the numbers say that the epic did not already know\n\
    \n1. **The 4x multiplier is confirmed as a count, not an inference.** `/tasks`\
    \ parses 476 files against a 119-file corpus. `/tasks/{id}/detail` parses 478.\
    \ The epic predicted \"about four times\" from reading call sites; the header\
    \ measures it.\n\n2. **The dashboard is 8x, not 4x.** 952 parses. It is the landing\
    \ page, and it is the worst surface in the product by a wide margin.\n\n3. **`/search`\
    \ is already efficient** \u2014 119 parses, exactly one pass. It is slow only\
    \ because each parse is slow, so task-133 (libyaml) should fix search almost entirely\
    \ on its own while doing little for `/tasks`. That is a useful split: 132 and\
    \ 133 attack different halves of the same product.\n\n4. **`GET /revision` is\
    \ 18 ms here, not the 230 ms recorded in the epic.** Stated plainly because it\
    \ changes the priority of part of task-134: the poll is roughly 12x cheaper than\
    \ the epic assumed. The difference is most likely measurement conditions (the\
    \ epic's figure came from a single curl against the long-running server, including\
    \ connection setup; this is a warm keep-alive client after a discarded warmup).\
    \ **The re-reading of 1.1 MB per poll is still real and still worth fixing, but\
    \ it is not a headline cost.** Whoever takes task-134 should weigh it accordingly\
    \ rather than treating 0.23 s as given.\n\n5. **The browser number is the product\
    \ complaint, reproduced.** 9.6 s median from click to rendered detail, warm app.\
    \ Jeff reported 5-10 seconds. The benchmark lands inside that range without being\
    \ tuned to.\n\n## Run-to-run stability, which matters for task-136\n\nTwo consecutive\
    \ runs of the API section: wall-clock moved by up to 10% (`/dashboard` 7344 ms\
    \ then 8073 ms), while **parse counts were byte-identical** (952, 476, 478, 119,\
    \ 0 both times). This is the empirical case for task-136's instruction to assert\
    \ primarily on work done. A wall-clock budget tight enough to catch a 20% regression\
    \ would flake on this machine today.\n\n## Verification\n\n- `poetry run python\
    \ -m pytest`: 1250 passed, 1 failed \u2014 see below.\n- `npm run check` (frontend\
    \ gate: api schema+client, icons, lint, vitest, build, e2e Playwright): green,\
    \ 6/6 e2e passed.\n- `ruff`: clean. `black`: clean on changed files.\n- Exercised\
    \ as a user would: full run end to end, plus `--compare` against the saved baseline,\
    \ plus `--corpus synthetic`.\n\n**The one failure is pre-existing and worktree-specific,\
    \ not caused by this change.** `tests/test_task_corpus.py::test_agentjobs_context_paths_exist`\
    \ fails because task-002 names context path `.agents/plugins/marketplace.json`,\
    \ and `.agents/` is excluded through `.git/info/exclude` \u2014 a local, untracked\
    \ exclusion. The file therefore exists only in the main clone. The test passes\
    \ on `main` and fails in every worktree, and would also fail in a fresh clone.\
    \ Flagged to Jeff; not fixed here because it is unrelated to this task.\n\n##\
    \ Notes for whoever runs this next\n\n- A worktree needs its own `poetry install`,\
    \ `npm install`, `npx playwright install chromium` and `npm run build` before\
    \ the browser leg works. That is several minutes of setup per worktree.\n- Playwright's\
    \ default `expect` timeout is 5 s, which is *shorter than the thing being measured*.\
    \ The bench config sets 120 s. If a future change makes something slower than\
    \ that, raise it rather than concluding the app is broken.\n- `--skip-browser`\
    \ / `--skip-cli` give a fast API-only loop while iterating."
