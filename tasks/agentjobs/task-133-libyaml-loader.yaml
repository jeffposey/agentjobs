spec:
  summary: storage.load_task uses PyYAML's pure-Python loader. Switching to the libyaml-backed
    CSafeLoader, with a visible fallback when the C extension is absent, is a measured
    ~10x parsing win for a near-one-line change.
  intent: 'Small, low-risk, and near-independent of task-132: one cuts the number
    of parses, this one cuts the cost of each parse, and the two multiply. Measured
    over the real 112-file corpus before this task was written: 0.81 s with the pure-Python
    loader, 0.075 s with libyaml.'
  description: "# Use CSafeLoader\n\n`TaskStorage.load_task()` calls `yaml.safe_load`\
    \ (`src/agentjobs/storage.py:155`),\nwhich is PyYAML's pure-Python parser. libyaml\
    \ is already installed and importable in\nthis environment.\n\nMeasured over the\
    \ real corpus (2026-08-17):\n\n| Loader | Time |\n| --- | --- |\n| `yaml.safe_load`\
    \ (pure Python) | 0.81 s |\n| `yaml.load(..., Loader=CSafeLoader)` | 0.075 s |\n\
    \n## The change\n\nUse `CSafeLoader` when it imports, fall back to `SafeLoader`\
    \ when it does not, and\napply the same treatment to dumping (`CSafeDumper`) if\
    \ task files are written through\nPyYAML \u2014 a faster read path with an unchanged\
    \ write path is fine, but check rather\nthan assume.\n\n**Make the fallback visible.**\
    \ A silent fallback turns a 10x regression into a\nmystery: an install without\
    \ the C extension would simply be slow, with nothing\nanywhere saying why. Surface\
    \ it once at startup or expose it in whatever\ndiagnostics/version output already\
    \ exists, and have the benchmark report which loader\nis in use so a before/after\
    \ pair cannot be accidentally compared across loaders.\n\n## Round-tripping\n\n\
    Confirm the C loader parses the existing corpus identically: same values, same\
    \ types,\nand unchanged behaviour on timestamps, unicode, multi-line strings and\
    \ the empty\ndocument. A parity test over the real corpus (every file loads to\
    \ the same structure\nunder both loaders) is cheap and is the check that matters\
    \ here.\n\nRecord before/after from task-131's tool before merging."
  constraints: '- The pure-Python fallback must keep working; the C extension is not
    guaranteed on every install.

    - The fallback must not be silent.

    - No behavioural change to what is parsed. If the two loaders disagree anywhere
    in the real corpus, that disagreement is the finding and must be logged before
    proceeding.'
  out_of_scope: "- Reducing how often files are parsed \u2014 task-132.\n- Caching\
    \ parsed results across requests \u2014 task-134.\n- Changing the YAML schema\
    \ or the on-disk format."
  context:
  - path: src/agentjobs/storage.py
    why: load_task calls yaml.safe_load at roughly line 155; the dump path lives here
      too.
