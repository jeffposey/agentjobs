- id: 3
  ts: '2026-08-18T01:33:11.620722Z'
  actor: claude
  type: progress
  body: "**The trace, taken before any change was made (ac-1).**\n\nServer state at\
    \ the time: **task-132 and task-133 merged, task-134 not started.** All numbers\
    \ below therefore already include the server-side wins; this task's contribution\
    \ is on top of them (ac-3).\n\nMeasured in a real Chromium against a real server\
    \ on its own port (18952), over a copy of the 119-file corpus.\n\n## What the\
    \ app did on a task-row click\n\n**A click with nothing else in flight \u2014\
    \ already fine:**\n\n| Request | Duration |\n| --- | --- |\n| `/tasks/task-008/detail`\
    \ | 138 ms |\n| **click -> \"Full specification\" visible** | **146 ms** |\n\n\
    One request. Render overhead about 8 ms. The detail path was not the problem.\n\
    \n**The same click after returning to the list \u2014 three times worse:**\n\n\
    | Request | Start (relative to click) | Duration |\n| --- | --- | --- |\n| `/tasks`\
    \ | -65 ms | 68 ms |\n| `/tasks/broken` | -65 ms | 68 ms |\n| `/tasks/task-007/detail`\
    \ | +3 ms | **403 ms** |\n| `/revision` | +116 ms | 153 ms |\n| **click -> rendered**\
    \ | | **408 ms** |\n\nThe identical detail request took **403 ms instead of 138\
    \ ms**. Nothing about it changed; it spent the difference queued behind two refetches\
    \ of a list the app had just displayed, on a single-worker server.\n\n**Root cause:\
    \ `new QueryClient()` with defaults.** TanStack Query's default `staleTime` is\
    \ 0, so every query refetches the instant a component mounts. Navigating back\
    \ to the list refetched `/tasks` and `/tasks/broken`; the next click's detail\
    \ request then waited for them.\n\n**Also confirmed, and it was not a factor:**\
    \ the 15-second revision poll does not block or invalidate an in-flight interaction.\
    \ It appears in the trace as an ordinary concurrent request.\n\n**Also confirmed:\
    \ the detail view paints nothing while loading** \u2014 it renders a bare \"Opening\
    \ task...\" card until the whole record arrives. Relevant to the seeding idea,\
    \ evaluated separately below.\n\n## The fix\n\n`staleTime` derived from the poll\
    \ interval, in a new `frontend/src/queryClient.ts` (extracted from `main.tsx`\
    \ so the policy is testable).\n\nThe reasoning is the load-bearing part: **refetch-on-mount\
    \ is the wrong freshness mechanism for this app, because it already has a better\
    \ one.** `LiveUpdateStatus` polls the project revision and invalidates precisely\
    \ the task-backed queries when a task file actually changes \u2014 which catches\
    \ writes from other agents, the CLI and git alike. Refetching on every mount adds\
    \ no correctness on top of that, only load. Set to twice the poll interval rather\
    \ than `Infinity` so staleness stays bounded if the poll itself dies.\n\n## After\
    \ (ac-2)\n\n| Surface | baseline (task-131) | now | change |\n| --- | --- | ---\
    \ | --- |\n| **click task row -> detail rendered (warm app)** | 9567 ms | **267\
    \ ms** | **35.8x** |\n| cold load -> task detail rendered | 10931 ms | 1118 ms\
    \ | 9.8x |\n| `GET /dashboard` | 7344 ms | 141 ms | 52.1x |\n| `GET /tasks/{id}/detail`\
    \ | 3954 ms | 136 ms | 29.0x |\n| `GET /tasks` | 3659 ms | 155 ms | 23.6x |\n\n\
    **Parent ac-2 (under 500 ms from click to rendered detail): MET at 267 ms.**\n\
    \nDirect browser measurement of five consecutive click-and-back cycles after the\
    \ fix: 156, 154, 154, 156, 151 ms \u2014 and **one request per click**, the detail,\
    \ with no list refetch. The Playwright figure of 267 ms is the same interaction\
    \ measured through CDP with its own polling granularity; both are well inside\
    \ the target.\n\n## Verification\n\n- **The real path, against a running server\
    \ (ac-4):** edited a task file on disk the way the CLI or a git checkout would,\
    \ with the page open and untouched. The new title appeared **16.4 s later**, matching\
    \ the 15 s poll. `staleTime` does not suppress explicit invalidation, which is\
    \ the property that had to survive.\n- `frontend/src/queryClient.test.tsx` \u2014\
    \ three tests: the policy is derived from `NORMAL_POLL_MS` rather than picked\
    \ arbitrarily; a remount does **not** refetch a list it already has; an explicit\
    \ `invalidateProjectTaskQueries` **does** refetch. The middle two are the fix\
    \ and the thing the fix must not break.\n- `npm run check`: green \u2014 api schema\
    \ and client, icons, lint, vitest, build, 6/6 Playwright e2e.\n\n## What remains,\
    \ stated plainly\n\n**Cold load is 1118 ms** and is not addressed here. That is\
    \ a fresh navigation paying for a 337 KB bundle plus four parallel API calls,\
    \ not the interaction Jeff reported. Worth its own task if it ever matters; it\
    \ is not what \"opening a task\" means in the acceptance criterion.\n\n**A second-order\
    \ effect worth recording:** the list page fires `/projects`, `/tasks`, `/tasks/broken`\
    \ and `/revision` concurrently, and a single-worker uvicorn serialises them \u2014\
    \ three ~150 ms requests become ~450 ms of wall time. That is why the pre-fix\
    \ contention was so expensive. It is now mostly moot because the refetches are\
    \ gone, but anyone chasing cold load should know the server answers one request\
    \ at a time."
