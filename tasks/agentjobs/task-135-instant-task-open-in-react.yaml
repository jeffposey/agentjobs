- id: 4
  ts: '2026-08-18T01:33:32.307371Z'
  actor: claude
  type: decision
  body: "**Two of the three fixes this task proposed were measured and deliberately\
    \ not taken.**\n\nThe spec offered three candidates. One was the actual defect\
    \ and is done. The other two were reasonable guesses written before anything was\
    \ measured, and the measurement does not support them.\n\n**1. Seeding the detail\
    \ view from the cached list row \u2014 rejected.**\n\nThe idea: render title/status/priority\
    \ from the list row instantly, fill in the rest when the detail arrives, so the\
    \ wait is progressive rather than blank.\n\nAgainst: click to rendered is now\
    \ **267 ms**, of which about 140 ms is the server answering and roughly 8 ms is\
    \ rendering. Seeding would put partial content on screen perhaps 130 ms sooner.\
    \ In exchange it adds a partially-populated render state to a component that currently\
    \ has two states, and it adds the one failure mode the task's own constraints\
    \ single out \u2014 content on screen that silently disagrees with the server.\
    \ The detail response is also not a superset of the list row: it carries `children`,\
    \ `parent_task` and `identity`, so a seeded view is a genuinely different shape\
    \ needing its own tests, not a subset of the full one.\n\nFor 130 ms against a\
    \ 500 ms target that is already met by a factor of two, that is a bad trade.\n\
    \n**2. Prefetch on hover or pointer-down \u2014 rejected.**\n\nAgainst, in order\
    \ of weight:\n- **Hover does not exist on the devices this matters most for.**\
    \ Jeff uses the tablet and phone over the tailnet; a hover prefetch is dead code\
    \ on both.\n- It would fire a detail request for every row the pointer crosses\
    \ on the way to the one being clicked \u2014 on a single-worker server, that is\
    \ the *same contention* this task just removed, reintroduced deliberately.\n-\
    \ The win is capped at the ~140 ms server time, and only for the desktop case.\n\
    \n`onPointerDown` would work on touch and avoid the crossing-rows problem, buying\
    \ maybe 100 ms of the 267. Still not worth new prefetch machinery and its cache-warming\
    \ edge cases for a target already met twice over.\n\n**What would change this.**\
    \ If cold load (1118 ms) or a much larger corpus later pushes the interaction\
    \ back over 500 ms, `onPointerDown` prefetch is the first thing to reach for,\
    \ and this entry is the record of why it was not needed in August 2026.\n\n**The\
    \ rejected alternative to this decision** was to implement all three because the\
    \ spec listed them. Rejected: the spec explicitly said the fixes were \"to be\
    \ confirmed by the measurement\", and a spec written before the evidence does\
    \ not outrank the evidence. Shipping two changes that add stale-render surface\
    \ and a second request path, for a hundred milliseconds nobody is waiting on,\
    \ is exactly the kind of optimisation whose risk exceeds its value."
