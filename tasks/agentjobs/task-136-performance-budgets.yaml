spec:
  summary: 'Make the wins durable: budgets asserted by scripts/check.py over a synthetic
    corpus of fixed size, so a later change cannot silently give the speed back.'
  intent: Everything else in this epic is a one-time fix. Without a gate, the next
    feature that adds a corpus walk to a hot path reintroduces the problem, and nobody
    notices until it is 5 seconds again. This is the child that makes the epic hold.
  description: "# Budgets that hold, without flaking\n\n## Assert on work done, not\
    \ only on time\n\nWall-clock thresholds are the obvious approach and the fragile\
    \ one: they drift with\nhardware, they fail on a loaded laptop, and a flaky performance\
    \ test gets disabled \u2014\nwhich is strictly worse than having none.\n\nSo the\
    \ primary assertions should be on **work done**, which is stable across\nmachines:\n\
    \n- task files parsed per request (each file at most once \u2014 the durable form\
    \ of task-132)\n- files read by `project_revision()` (the durable form of task-134)\n\
    - number of corpus walks per CLI invocation\n\nWall-clock budgets can accompany\
    \ these, but set generously \u2014 they are there to catch\nan order-of-magnitude\
    \ regression, not a 20% one. State that intent in the test so a\nfuture reader\
    \ does not tighten them into flakiness.\n\n## Fixed synthetic corpus\n\nRun the\
    \ budgets against a generated corpus of stated, fixed size, not against\n`tasks/`.\
    \ The real backlog grows; a threshold tuned against 112 files becomes a\nfailing\
    \ test at 300 through no fault of the code. task-131 was asked to build the\n\
    synthetic-corpus seam for exactly this.\n\n## Wiring\n\nBudgets run as part of\
    \ `poetry run python scripts/check.py`, the single repository\ngate. Keep the\
    \ runtime cost sane \u2014 this gate runs before every commit, so a budget\nsuite\
    \ that adds minutes will get skipped in practice.\n\n## Close the epic honestly\n\
    \nBefore closing, re-run task-131's benchmark against the real corpus and record\
    \ the\nfinal numbers against the parent's acceptance criteria ac-2 through ac-5,\
    \ saying\nplainly which are met and which are not. If a target was missed, say\
    \ so \u2014 the parent\nstill needs Jeff's browser confirmation (ac-7) and he\
    \ should be told what he is\nlooking at."
  constraints: '- Budgets must be stable on a slow or loaded machine. A flaky performance
    test is worse than none.

    - The synthetic corpus is generated by the test, not committed as hundreds of
    fixture files.

    - Do not materially slow down scripts/check.py.'
  out_of_scope: "- Building the benchmark itself \u2014 task-131.\n- Any further optimisation\
    \ work. If a budget cannot be met, that is a finding to log, not a licence to\
    \ expand this task."
  context:
  - path: scripts/check.py
    why: The single repository gate; budgets have to run here to be real.
  - path: ENGINEERING.md
    why: 'Verification standards: ask what a passing check would have caught.'
