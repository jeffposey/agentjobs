spec:
  summary: Embed the widget in a registered project's own React app, run the whole
    loop from inside that app -- open the backlog, file an issue, start an agent on
    it -- and write docs/embedding.md from what actually happened rather than from
    what was intended.
  intent: 'Everything in this epic can pass its own tests while remaining unusable
    by a project that is not this one, because this repository has advantages a host
    does not: the code, the styles, the routes, the server on a known port, and an
    author who knows all of it. The only check that means anything is a different
    project, a different repo, a different dev server, and a person following written
    instructions.'
  description: 'The host is `C:/projects/job-hunting/tools/triage/web` -- a React
    app in a project already registered with AgentJobs and emphatically not this repository.
    If it turns out to be a poor fit, any other registered project''s React frontend
    serves, but the substitution and the reason go in this task''s log.


    From inside that app, with its own dev server running:


    1. See the launcher and the job-hunting backlog counts.

    2. Open the job-hunting project in AgentJobs from the launcher.

    3. File an issue about something on the page, and confirm it lands in the **job-hunting**
    backlog with the page context captured.

    4. Subject to task-144''s posture, dispatch an agent on it and confirm the run.


    Record in this task''s log: the created task id in the job-hunting project, screenshots,
    and everything that turned out to be friction -- each item either fixed here or
    filed as its own task. Friction discovered and then forgotten is the failure this
    child exists to prevent.


    Then write `docs/embedding.md` from that session: install, mount, configure, what
    it does, what it refuses to do, and the security posture in plain language. Index
    it from `docs/index.md` and the README where the reader will look for it.


    Finally, stand up a review server on its own port, with throwaway data and both
    a reachable and an unreachable server state seeded, and hand it over with a URL
    rather than a diff.'
  constraints: '- The reported task goes in the host project''s backlog, not this
    one. Clean up or clearly mark anything filed as a test.

    - No AgentJobs-specific shortcut may be used to make the host work; if the host
    needs something this repo has, that is a finding, not a workaround.

    - Documentation is written from the session, not from the specs. Anything the
    docs claim must have been done.

    - Review is handed over as a running URL on its own port with throwaway data,
    per the standing review rule.'
  out_of_scope: Permanent adoption of the widget in the host project, changes to the
    host project beyond what the integration needs, and marketing or launch material.
  context:
  - path: docs/index.md
    why: Where the new embedding guide has to be indexed to be found.
  - path: docs/quickstart.md
    why: The tone and level of detail an integration guide should match.
