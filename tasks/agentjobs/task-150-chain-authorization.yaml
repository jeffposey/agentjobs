spec:
  summary: 'The record a human writes to authorize a bounded chain of dispatches:
    the task, the iteration cap, the wall-clock ceiling, and a digest freezing the
    checks as they stood. Plus revocation. No driver yet -- this is the thing the
    driver will not be allowed to run without.'
  description: "Derived from [docs/agent-loops-design.md](../../docs/agent-loops-design.md)\
    \ \xA75, \xA78 and \xA79, and dispatch design \xA72a (D5).\n\n## Scope\n\nA `chain_authorized`\
    \ log entry whose actor is a human, carrying:\n\n- `chain_id`\n- `max_iterations`\
    \ (default 5, ceiling 20)\n- `wall_clock_seconds` (default 4h, ceiling 12h)\n\
    - `check_digest` \u2014 a digest over the criteria's `(id, check)` pairs at the\
    \ moment of authorization\n\n**The digest is the load-bearing part** (L4). Anyone\
    \ may write a check, including an agent \u2014 a rule forbidding that is pure\
    \ friction on the useful case, since the agent writing a task usually knows the\
    \ right test command. Freezing the set at authorization makes the dangerous case\
    \ structurally ineffective instead: an agent that changes a check mid-chain to\
    \ one that passes has moved the definition of done after a human agreed to it,\
    \ and the chain stops.\n\n**Refusals, each with its own reason code:**\n\n| Condition\
    \ | Why |\n|---|---|\n| No criterion has a check | A loop with no evaluable termination\
    \ condition is an unbounded spend, refused rather than capped (\xA72a). |\n| Every\
    \ check already passes | Nothing to converge on. The only thing such a loop can\
    \ do is change something already correct. |\n| Bounds above the ceilings | The\
    \ ceiling is the ceiling. |\n\nAuthorization is resolved **from the stored task**,\
    \ never from a request body \u2014 dispatch \xA72's forgeability requirement applies\
    \ unchanged.\n\n**Revocation** must be as blunt as `agentjobs dispatch stop`:\
    \ one command, effective before the next iteration. `~/.agentjobs/DISPATCH_DISABLED`\
    \ already stops every chain on the machine, because an iteration is a dispatch\
    \ and the sentinel is re-checked immediately before every spawn \u2014 assert\
    \ that rather than assuming it."
  constraints: '- **Do not start this task without Jeff''s explicit go-ahead on building
    the outer loop.** The design is complete and the go/no-go is not an agent''s call:
    tasks 147-149 deliver executable acceptance criteria with no autonomy, and this
    is where autonomy begins. If you reach this task without that decision, hand off
    `human`/`decision` and stop.

    - The authorizing entry is resolved from the stored task at every use, never from
    a request.

    - A chain whose checks all pass at authorization time is refused, not authorized-and-immediately-finished.

    - No driver in this task. Nothing here starts a run.'
  out_of_scope: The loop driver itself (task-151) and the GUI (task-152).
  context:
  - path: docs/agent-loops-design.md
    why: Sections 5, 8 and 9 -- the digest, the numbers and their reasoning, and revocation.
  - path: docs/agent-dispatch-design.md
    why: Section 2a for D5, and section 2's forgeability requirement which applies
      unchanged.
  - path: src/agentjobs/dispatch/guards.py
    why: resolve_causing_entry and assert_human_clocked -- the pattern for resolving
      authority from the stored record.
