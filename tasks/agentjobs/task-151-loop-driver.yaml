  - path: src/agentjobs/dispatch/ledger.py
    why: How a run reaches a terminal state, which is what an iteration waits on.
  - path: src/agentjobs/dispatch/auto.py
    why: The budget caps as they bind auto-dispatch; L7 changes how they count here.
