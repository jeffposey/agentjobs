    \ ran on identical source otherwise.\n\nSix tests added, none removed:\n\n- `tests/test_dispatch_guards.py::TestHumanClockedRule`\n\
    \  - the dispatcher's entry is refused **as an agent's** (sc-1)\n  - the refusal\
    \ contains no instruction to configure an actor as human (sc-3)\n  - a genuinely\
    \ unknown actor keeps the advice that suits one (sc-2)\n  - configuring `dispatcher`\
    \ as human does not re-arm the rule (the reserved-first ordering)\n  - **end to\
    \ end (sc-5)**: dispatch a task with the fake runner, `settle()`, assert the newest\
    \ entry's actor really is `dispatcher`, re-dispatch -> refused with the corrected\
    \ text and no run started; then one human note -> dispatch succeeds. Re-arming\
    \ is verified, not assumed.\n- `tests/test_dispatch_api.py` -- the same refusal\
    \ over HTTP: 403, `code: not_human_clocked`, and neither `detail` nor `suggested_action`\
    \ carries the recipe (sc-4).\n\nsc-4's other half checked by reading rather than\
    \ by test: `cli.py` renders `str(exc)` from the same exception, so the CLI is\
    \ corrected for free, and `frontend/src/components/DispatchPanel.tsx` is unmodified\
    \ -- no new per-surface override exists.\n\n## What was deliberately not done\n\
    \nNo change to `load_actors`, to `resolve_causing_entry`, to the human-clocked\
    \ rule, or to the reserved-actor design. No frontend change. No docs change: `docs/agent-dispatch-design.md`'s\
    \ only 'kind: human' mention is about the authorising identity in task-188's flow\
    \ and is still accurate.\n\nNote for the record, since it cost a turn: the agentjobs\
    \ MCP tools were not available in this session -- `.mcp.json` is untracked, so\
    \ `git worktree add` never copied it, and the tool list is fixed at session start.\
    \ All task mutations here went through the REST API on 8876, which is the same\
    \ validated manager path."
