  body: "Fix implemented, gate green, committed on fix/task-153-dispatch-refusal-message\
    \ (1431921), rebased onto main at 4e29bf5. Not merged, not pushed.\n\n## What\
    \ changed, in one place\n\n`src/agentjobs/dispatch/guards.py` only. Two edits,\
    \ both inside the module the spec named.\n\n1. `actor_kind()` now resolves AgentJobs'\
    \ reserved ids (via `reserved_actors()`) **before** the project's configured vocabulary,\
    \ and cannot be overridden by it. `load_actors` is untouched, so the fresh-init\
    \ allowance the RESERVED docstring protects is intact. `resolve_causing_entry`\
    \ is untouched, so a dispatcher entry is still the causing entry and the re-dispatch\
    \ is still refused.\n2. `assert_human_clocked()` therefore reaches its **agent**\
    \ branch for a dispatcher-written entry instead of its unknown-actor branch. That\
    \ branch's message gains one clause when the actor is reserved -- that the entry\
    \ is AgentJobs' own record of an earlier dispatch -- and keeps the advice it already\
    \ had: act on the task yourself, then dispatch.\n\nThe dangerous text is gone\
    \ from that path entirely: the words 'actors:', 'kind: human' and 'config.yaml'\
    \ do not appear in the message a re-dispatch now produces, and tests assert their\
    \ absence rather than assert the new wording only.\n\n## The decision inside the\
    \ fix\n\nReserved-before-config rather than config-first. A project that writes\
    \ `dispatcher: {kind: human}` into its own actors -- by hand, or on the strength\
    \ of the old message before this landed -- still gets the reserved agent and is\
    \ still refused. Config-first would have fixed the message while leaving the hole\
    \ open one edit away, which is a worse outcome than the bug: the guard's docstring\
    \ says 'the rule, and not a configuration option', and that is now true in fact.\n\
    \nThis also means `assert_authorizer_is_human` (the other caller of `actor_kind`)\
    \ stops emitting the same recipe when handed 'dispatcher' as an authorising identity.\
    \ That is the same defect at the same lookup, not a broader copy audit, so it\
    \ is fixed rather than left for the out-of-scope note.\n\n## Verification\n\n\
