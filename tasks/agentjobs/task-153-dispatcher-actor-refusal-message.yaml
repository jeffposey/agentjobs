    Why this clears the runway bar. The bar was: an autonomous runner dispatching\
    \ task-204..209 would plausibly hit it during that epic. It would.\n\n- Trigger\
    \ is ordinary, not exotic. Any *re*-dispatch of a task whose newest log entry\
    \ is the dispatcher's own `dispatch_result` takes this branch. Re-dispatch is\
    \ a designed-for event, not an edge case: ~/.agentjobs/dispatch.yaml carries `auto.per_task_per_day:\
    \ 3` and `per_task_lifetime: 10`, limits that only mean anything if the same task\
    \ is dispatched more than once. And `run_timeout_seconds` is 1800 against a gate\
    \ that costs ~355s alone and ~444s worst case under six-way concurrency (ENGINEERING.md),\
    \ so a run timing out and wanting a retry across six epic tasks is likely rather\
    \ than merely possible.\n- The consequence is the severe one. The refusal's `suggested_action`\
    \ is a *working* recipe: adding `dispatcher: {kind: human}` to the project's actors\
    \ makes every subsequent dispatcher-written entry clock as human, and dispatch\
    \ can then drive itself with no human in the loop for the remainder of the epic.\
    \ An autonomous runner is precisely the reader that applies a machine-readable\
    \ `suggested_action` mechanically, without the scepticism a human would bring.\
    \ A guard whose own error message tells an unsupervised agent how to disable it\
    \ is the wrong thing to have standing when unsupervised agents start running.\n\
    - Cost is small and the work already exists. Priority high, effort small, spec\
    \ complete, fix localised to guards.py. Promoting a filed task beat filing a new\
    \ one.\n\nRejected alternative: leaving it in the backlog and relying on the epic\
    \ never needing a retry. That bets the guard's integrity on a run-timeout never\
    \ firing across six dispatched tasks, and the failure is silent \u2014 the config\
    \ edit persists after the epic ends.\n\nScope is unchanged by this promotion.\
    \ This task remains about the message and the branch it takes; the human-clocked\
    \ rule, the choice of causing entry, and the reserved-actor design all stay exactly\
    \ as the spec's constraints state."
