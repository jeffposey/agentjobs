- id: 5
  ts: '2026-08-20T01:13:07.052635Z'
  actor: claude
  type: decision
  body: '**Decision: one resolver, four sources, and the socket wins.**


    `api_base` now resolves in exactly one place, `src/agentjobs/dispatch/address.py`,
    from

    the first source that knows the answer:


    1. an address the caller *observed* -- the listening socket a request arrived
    on;

    2. `AGENTJOBS_API_BASE`;

    3. `api_base:` in machine-local `~/.agentjobs/dispatch.yaml`;

    4. `http://localhost:8765`, unchanged, as the last resort.


    The task named three candidate sources and left the choice open. All three are
    in the

    answer, because they answer different questions and the constraint that decides
    it --

    "the CLI path has no request to derive from" -- rules out picking only the first.


    **Why the socket rather than the `Host` header.** A dispatch over HTTP passes
    ASGI

    `scope["server"]`, which uvicorn fills in from the listening socket''s own

    `getsockname()`. The header was rejected: this dashboard is published on a tailnet

    through a loopback proxy, so the header says `agentjobs.tailfed1df.ts.net` while
    the

    agent that has to use the address is a local process. The proxy''s `X-Forwarded-Proto`

    would also flip `scope["scheme"]` to https and produce `https://127.0.0.1:8876`,
    an

    address nothing serves -- so the derived scheme is always `http`, since AgentJobs''
    own

    server has no TLS options at all.


    **Why observed outranks declared.** A configured address that disagrees with the
    socket

    answering the call is stale by definition -- the realistic case being a dispatch.yaml

    still naming last month''s port. A test pins this ordering.


    **Rejected: resolve once at server startup into app state** (candidate 3 in the
    task).

    The app is loaded by import string -- `uvicorn.run("agentjobs.api.main:app", ...)`
    -- and

    the review sandbox calls `uvicorn.run` directly rather than going through `agentjobs

    serve`, so a port captured in the `serve` command would be captured on exactly
    the path

    the bug was found on and missed on the path that found it. Deriving per request
    needs no

    startup hook and cannot go stale.


    **Rejected: a machine-local setting alone** (candidate 2). It is the right answer
    for the

    CLI and the wrong answer for the browser: it would have left the review sandbox
    on 8901

    still needing a hand-written `api_base`, which is the "caller patches it" pattern
    the

    task''s constraints rule out. Kept as the CLI''s source, where there is genuinely
    nothing

    to observe.


    **Rejected: leaving the defaults in place and only passing from the endpoint.**
    The bug

    was not the constant''s value, it was that the constant appeared as a parameter
    default at

    three levels of one call chain -- a default no caller can override reliably, because

    omitting the argument silently reinstates it. All three are gone; `dispatch/address.py`

    holds the only copy, and a test greps the package to keep it that way.


    **Scope kept as specified.** `{api_base}` as an argv placeholder and the address
    inside

    `{prompt}` are substituted from the same resolved value, and every end-to-end
    test

    asserts both. No default port was changed anywhere.'
  data: {}
