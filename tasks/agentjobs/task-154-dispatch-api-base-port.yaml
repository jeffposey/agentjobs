    \ value into\n  auto-dispatch, so the two paths are one code path rather than\
    \ two constants.\n- `cli.py`: `dispatch run` prints the address it resolved.\n\
    - `dispatch/scaffold.py`, `docs/agent-dispatch-design.md`: documented.\n\n**Verification\
    \ against a server on a non-default port (sc-4, sc-1, sc-5)**\n\nRebuilt the review\
    \ sandbox on **port 8901** against this branch's source (checked:\n`agentjobs.__file__`\
    \ resolved to `C:/projects/aj-154/src/agentjobs`) and dispatched\ntask-001 through\
    \ the HTTP endpoint. The recorded argv in the task's dispatch entry:\n\n```\n\
    'You are the agent `claude` working task `task-001` ... AgentJobs is serving at\n\
    http://127.0.0.1:8901. Read the task record and follow the resumption contract\
    \ in\ndocs/agent-workflow.md. Dispatch run id: run_eafc5d4b. ...'\n```\n\nThe\
    \ dispatched session then acted on it -- its transcript shows it running\n`curl\
    \ -s -m 10 http://127.0.0.1:8901/openapi.json`. Before this change it would have\n\
    been given :8765 and reached nothing. Session killed and sandbox stopped afterwards;\
    \ the\nthrowaway home is at `%TEMP%/agentjobs-dispatch-review`.\n\n**sc-5**: the\
    \ prompt-correction workaround in\n`C:/ai/scratch/agentjobs-dispatch-review-sandbox.py`\
    \ is deleted -- the `port_fix`\ntemplate and the \"two upstream defects\" note\
