    \ `claude agents` has no remove verb\nto clear the row by hand.\n\n**Note for\
    \ this machine**: the real dashboard on 8876 needs nothing configured -- the\n\
    browser path derives its address. `agentjobs dispatch run` from a terminal will\
    \ report\n`http://localhost:8765` until `api_base: http://localhost:8876` is added\
    \ to\n`~/.agentjobs/dispatch.yaml`. That file is machine-local and hand-written\
