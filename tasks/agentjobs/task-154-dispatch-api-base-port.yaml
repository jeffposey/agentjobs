    \ That file is outside this repository, so it is not in the\nbranch.\n\n**sc-2**:\
    \ `agentjobs dispatch run` is covered by four tests -- config source, env\noverride,\
    \ the printed address, and the unchanged fallback -- in\n`tests/test_dispatch_api_base_end_to_end.py::TestDispatchFromTheCli`.\n\
    \n**sc-3**: `TestAutoDispatchAgrees` dispatches through Approve on a non-default\
    \ port and\nasserts the same address as the manual path.\n\n**Automated coverage**:\
    \ 25 resolver tests plus 9 end-to-end, one of which starts a real\nuvicorn on\
    \ an ephemeral port -- because `TestClient` synthesises `scope[\"server\"]` from\n\
    its base_url, so every other test would pass against a `Host`-header implementation.\n\
    \n**One loose end, not a defect in this change**: killing the sandbox server before\
    \ it\npolled left run `run_eafc5d4b` marked `running`, so `agentjobs dispatch\
    \ reap` reports\nnothing to reap and Claude Code's own ledger still lists the\
