  body: "**Task records under `tasks/` are left alone. Only living instructions were\
    \ changed.**\n\nThe line drawn is not \"history vs. present\" but **record vs.\
    \ instruction**. A task\nrecord is an account of what an agent or a human observed\
    \ and did; a doc or a test\nfixture is an instruction to whoever reads the repo\
    \ next. The first must stay\nfaithful even when what it recorded is inconvenient.\
    \ The second has no such claim.\n\nSo: `frontend/src/**` fixtures and `ENGINEERING.md`\
    \ changed; all 26 task files that\nmention `job-hunting`, `mastercalls`, `fantasy-football`\
    \ or\n`C:/ai/shared/launchers/open-agentjobs.ps1` are untouched.\n\nWhy the default\
    \ held for a published repository:\n\n1. The exposure argument does not survive\
    \ contact with the facts. The names are in\n   this repository's *published git\
    \ history* either way, and rewriting that history\n   is explicitly out of scope.\
    \ Scrubbing HEAD would therefore buy no privacy at all\n   \u2014 it would only\
    \ make the current tree read tidier while the same strings remain\n   one `git\
    \ log -S` away.\n2. What it *would* cost is the property this product exists to\
    \ provide. AgentJobs'\n   whole claim is that the task record is the durable,\
    \ trustworthy account of what\n   happened. A tracker that edits closed records\
    \ to look better in public is a\n   tracker whose records cannot be relied on,\
    \ and that is a far worse thing for it\n   to be than one that contains a directory\
    \ name.\n3. Nothing there is sensitive. A project directory name and a local launcher\
    \ path\n   are not credentials, and the spec's own audit already confirmed there\
    \ are no\n   credentials, tokens, or private-repo content anywhere in the tree.\n\
    4. Two of the 26 (`task-146`, `task-169`) are still `ready` and name those projects\n\
    \   *in their specs* \u2014 task-146's whole subject is integrating with a page\
    \ hosted at\n   `C:/projects/job-hunting/tools/triage/web`. Scrubbing those would\
    \ not be tidying\n   a record; it would make an open task unexecutable by removing\
    \ the thing it is\n   about. Any rule that scrubs the closed records has to answer\
    \ for these, and the\n   only coherent answers are \"scrub and break them\" or\
    \ \"carve an exception that\n   swallows the rule\".\n\n**Rejected alternative:\
    \ scrub the task corpus too** \u2014 redact the launcher to\n`<launcher script>`\
    \ and rename the project ids in all 26 files, so the repository\nreads uniformly\
    \ neutral to a contributor browsing it on GitHub. Rejected for (1)\nand (2): it\
    \ is cosmetic given the history, and it pays for that cosmetic with the\nintegrity\
    \ of the record, which is the load-bearing property of a task tracker. A\nreader\
    \ who wonders why closed tasks mention a project they cannot see now has this\n\
    entry to find, which is a better outcome than a silently-edited corpus.\n\n**This\
    \ is settled \u2014 do not reopen it on a later audit.** If the repository is\
    \ ever\nre-published under a rewritten history, that is the moment to revisit,\
    \ and only\nthen."
