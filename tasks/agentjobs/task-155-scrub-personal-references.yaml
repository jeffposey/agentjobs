  \ `tasks_directory`, and the route slug `task-004-resume` \u2192 `task-004-import`).\
  \ `33e148f` rewrites `ENGINEERING.md`'s merge-gate restart step so it no longer\
  \ tells a contributor to run `C:/ai/shared/launchers/open-agentjobs.ps1` \u2014\
  \ it states the general rule (`agentjobs restart` only restarts a CLI-started server;\
  \ against anything else it binds the default port and looks like it worked) and\
  \ points at the environment's own setup notes.\n\n**The one thing worth your judgement**,\
