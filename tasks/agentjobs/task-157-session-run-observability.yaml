    \ sc-3, and it is why\n   `reconcile()` still needs no change.\n\n2. **The poller\
    \ writes the transcript to the run directory each tick.** This is the one\n  \
    \ design choice not already in the handoff, and it is what makes the live tail\n\
    \   affordable. A session's output can only be read by shelling out to `<runner>\
    \ logs\n   <id>`; if the browser's tail did that, every watching tab would spawn\
