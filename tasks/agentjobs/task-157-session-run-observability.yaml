- id: 3
  ts: '2026-08-18T22:02:56.831621Z'
  actor: Jeff Posey
  type: instruction
  body: '# Requirement added by Jeff, 2026-08-18: output must be readable *while*
    the run is going.


    In his words:


    > don''t wait until the long ass task is done before we can see output... the
    output should likely be within a collapsible dispatch section while it''s going
    and after it''s done, and while it''s going, it should be a "tail" on it so you
    see new output as it is written


    ## What this changes about the task


    The original framing treated output as something you go and fetch after the fact,
    through a "View output" link. That is wrong for the actual experience: a session
    can run for many minutes, and during all of it the only signal is a growing elapsed
    counter. Watching a run is the normal case, not the exception.


    So the output surface is **live, in place, and collapsible**, in both states:


    - **While running:** a tail that updates as new output is written, inside a collapsible
    section on the task page. The reader should see progress without clicking through
    to anything.

    - **After finishing:** the same section, same place, still collapsible, now showing
    the completed output.


    One section that changes contents, not two different surfaces with a transition
    between them.


    ## Consequences worth stating before implementation


    - A session''s output comes from `<runner> logs <session_id>`, which is a subprocess
    per read. A tail that re-runs it on a short interval is a process spawn per interval
    per watching browser. Whatever polling interval the run-status poller uses is
    probably the right one to reuse rather than introducing a second, faster clock.

    - Tailing means the run-output route needs to serve an incremental or bounded
    read, not the whole transcript every time. `readable_tail` already exists for
    exactly this shape and is already used for parked-session prompts.

    - Collapsed by default or expanded while running is a real UI choice. Expanded-while-running
    matches the intent -- you should not have to ask to see a live run -- but it makes
    the task page taller for every live run. Pick one and say why.

    - This interacts with task-015: a long ball prompt already makes rows unreadable.
    A live output pane on the same page has the same failure mode if it is unbounded.
    Bound it.


    Also settled in the same message: **do not dispatch this work through AgentJobs.**
    Work it directly. Dispatch is not configured on the real machine (`~/.agentjobs/dispatch.yaml`
    does not exist), which is why the Dispatch section is absent from the live dashboard
    -- correct behaviour, not a stale build.'
