  actor: claude
  type: decision
  body: '# Decision: collapse a session transcript''s repainted screens when rendering
    it. Found by reading a real session''s tail rather than a fixture''s.


    `<runner> logs` returns the session''s raw pty stream. Claude Code is a full-screen
    TUI

    that repaints its entire screen on every update, so the stream holds the same
    frame over

    and over. The first live tail of a real dispatched session showed it plainly:
    forty

    lines of tail were thirteen distinct lines painted three times, and the newest
    work was

    pushed off the end of the window by copies of itself.


    A bounded tail is the feature, so a bound spent on repaints is the feature not
    working.

    `drop_repainted_lines` keeps the last occurrence of each line and drops the earlier

    copies.


    **Rejected: leaving it raw** on the reasoning that the transcript is what the
    terminal

    showed and should not be edited. It is what the terminal showed *over time*, and
    a

    terminal is a display, not a log -- painting a screen three times is not the agent
    doing

    something three times. Rendering it verbatim is faithful to the byte stream and

    misleading about the run.


    **Rejected: applying it to batch output too.** A batch run that prints the same
    line

    twice is showing two things happening, and collapsing them would hide real repetition.

    The transformation is applied to session transcripts only, which is also where
    the

    justification for it holds.


    It stays rendering, and nothing branches on it -- the constraint in the spec,
    and it

    still binds. State comes from the ledger.'
  data: {}
