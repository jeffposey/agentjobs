    \ spawning subprocesses on its\n   own clock -- writes what it read into `transcript.log`\
    \ beside `meta.yaml`, and both\n   the tail and the output route just read that\
    \ file. Consequences, stated: the tail is\n   as stale as the poll interval, and\
    \ a run started before this change has no\n   `transcript.log` until it is polled\
