- id: 8
  ts: '2026-08-18T22:30:59.027350Z'
  actor: claude
  type: decision
  body: '# Decision: AgentJobs now schedules background work. `_reap_finished_sessions`''
    docstring argued it should not; that reasoning does not survive session state.


    The reversed position, verbatim from that docstring: *"Startup is where this happens

    because nothing in AgentJobs schedules background work, and inventing a scheduler
    to

    delete directories would be the largest new moving part in this subsystem for
    the

    smallest reason."*


    **That reasoning was right about what it was written about and wrong about this.**
    A

    worktree that is not deleted is litter; it costs disk and nothing else, and `agentjobs

    dispatch reap` clears it on demand. Session state is not like that. Without a
    scheduler

    the primary dispatch mode never reports anything at all: the run says `running`
    for ever,

    the task never receives a `dispatch_result`, and the UI offers Cancel on a process
    that

    ended an hour ago. The cost of no scheduler is not litter, it is that dispatch
    cannot be

    observed -- and the rejected alternative below is worse than the moving part.


    **What was rejected: settling sessions only at startup, or only on demand.** It
    would

    have needed no new machinery, which was its whole appeal. It fails because a session

    finishing is not correlated with anything a human does: the observation has to
    happen

    while nobody is watching, or the record is only correct for people who thought
    to

    restart the server. A "refresh runs" button would put the burden of noticing on
    the

    person the record exists to inform.


    **Also rejected: giving `reconcile()` a phase check** (which log entry 2 called
    for, and

    the handoff prompt already corrected). With an interval poller that polls before
    it

    first sleeps, a session that ended while AgentJobs was down is settled on the
    first tick

    after startup. Adding the check would be a second mechanism for the same outcome,
    and the

    one that only runs at startup is the one that would rot.


    **Scope of the reversal, stated so it is not read as wider than it is.** Reaping
    stays at

    startup. The poller reaps each session as it settles it, so the startup pass now
    only

    ever finds what a dead process left behind; putting a second sweep on the interval
    would

    spawn processes to look for litter that has already been collected. The docstring
    has

    been rewritten to say this rather than left to contradict the code.'
  data: {}
