  type: progress
  body: 'Fixed on `fix/task-158-elapsed-after-finish`, worktree `C:/projects/aj-158`,
    commit `7771e78`. Not merged, not pushed.


    ## What changed


    Runs now record `finished_at`, and `RunRecord.elapsed_seconds()` measures a concluded
    run to it. A live run is still measured to now, so it keeps counting.


    **The stamp lives in the two functions that write run metadata** -- `RunDirectory.update_meta`
    and `ledger.write_status` -- not at the several call sites that can end a run
    (launcher failure, no session id, supervisor exit, cancel, reconcile). Any write
    that sets a terminal status stamps the finish time, so no existing path can omit
    it and neither can one written later. An explicit `finished_at` in the fields
    wins, and the two finishing paths pass exactly the instant they computed the task
    log''s `duration_seconds` from, so the run record and the task record cannot disagree.


    **A concluded run with no recorded finish time reports `None`** -- "unknown" in
    the browser, `-` in the CLI. That is runs from before this was recorded, and runs
    that ended without anything writing it down. Measuring those from now is the bug
    being fixed; a plausible invented number would be worse than admitting the record
    does not say. Stated in the docstring on `elapsed_seconds`.


    Also moved `TERMINAL_STATUSES` from `ledger` to `runner` (ledger already imports
    from runner, not the reverse) so both meta writers share one definition instead
    of `runner` carrying three inline copies of the same set.


    ## Verified against a running server, not only in tests


    Sandbox on :8901 with the branch''s code, three runs seeded to show every state
    at once:


    | Run | State | Reported |

    |---|---|---|

    | `run_review01` | finished, task log says `duration_seconds: 42.0` | **42.0**,
    and unchanged 30s later |

    | `run_71b14d53` | a real dispatched session, cancelled mid-run | grew 4.7s ->
    39.5s while live; froze at **40.197609**, identical on a read 30s later |

    | `run_review00` | finished, no finish time recorded | **null** -> "unknown" |


    `run_71b14d53`''s frozen 40.197609 is the same value to the microsecond as the
    `duration_seconds` on task-001''s `dispatch_result` entry -- sc-2 demonstrated
    end to end rather than only unit-tested.


    Before the fix, `run_review01` reported 41877.2 seconds for a 42-second run.


    ## Tests


    `TestDuration` in `tests/test_dispatch_lifecycle.py`, one test per criterion plus
    two on the stamp itself (a terminal write stamps even when the caller forgets;
    a `running` write does not stamp). Full suite: **1738 passed, 2 failed** -- `test_agentjobs_context_paths_exist`
    and the `absolute-path` tolerated-drift assertion, both already red on `main`
    and unrelated. Black, ruff clean; mypy has the one pre-existing `storage.py:268`
    error that `main` also has.


    Regenerated `openapi.json` and `types.gen.ts` for the changed field description.


    ## Two sandbox repairs, in `C:/ai/scratch/agentjobs-dispatch-review-sandbox.py`
    (not in the repo)


    1. Its runners had no `actor:`, so **every dispatch from the sandbox was refused**
    by the guard task-159 landed hours earlier. Set to `claude` on all three. Without
    this the review harness cannot dispatch at all.

    2. Seeded `run_review00` and gave `run_review01` a finish time, so both duration
    cases are visible side by side.'
