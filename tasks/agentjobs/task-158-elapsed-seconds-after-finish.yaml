spec:
  summary: The runs API computes elapsed_seconds from the current time rather than
    the run's finish time, so every terminal run reports a duration that grows without
    bound.
  intent: A completed run's duration is a fact about the past. Reporting it as a number
    that increases while you watch makes every duration in the UI untrustworthy.
  description: "Found 2026-08-18 by a dispatched agent exercising the run-watching\
    \ surface, and\nindependently consistent with the run records on disk.\n\n## Evidence\n\
    \n- `run_review01`: `status: finished`, `outcome: completed`, `live: false`. Its\
    \ own task\n  log records `duration_seconds: 42.0`. The runs API reported `elapsed_seconds:\
    \ 41877.2`\n  -- about 11.6 hours.\n- `run_a2fea425`: `status: failed`, `live:\
    \ false`, reported `elapsed_seconds: 864.99`,\n  which is exactly wall-clock-now\
    \ minus `started_at`.\n\nSo the value is `now - started_at` regardless of whether\
    \ the run ended. Any duration\ncolumn is wrong for every completed run, and wrong\
    \ by an unbounded amount that depends on\nwhen you happen to look.\n\nNote the\
    \ sandbox seeds `task-003` specifically to demonstrate a clean completed run with\n\
    its outcome badge. Its duration is the part that is wrong, which is how this stayed\n\
    unnoticed -- the badge looked right."
  constraints: '- A run that genuinely is live must still report a growing elapsed
    time; do not fix this by freezing everything.

    - Runs interrupted by a restart may have no recorded finish time. Decide what
    they report and make it obviously not a live duration, rather than falling back
    to now.

    - The task log already records duration_seconds for concluded runs. Prefer reconciling
    with that existing fact over inventing a second source of truth.'
  out_of_scope: Redesigning the runs listing or what a run record stores beyond what
    a correct duration needs.
  context:
  - path: src/agentjobs/api/routes/dispatch.py
    why: Where elapsed_seconds is computed for the runs listing.
