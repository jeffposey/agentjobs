  body: 'Fixed and merged --no-ff on Jeff''s instruction to fix it directly rather
    than work it as a full task.


    **Chosen: a runner declares `actor:`, defaulting to its own name.** The claim
    and the `agent` identity on dispatch entries use it; the dispatch entry still
    records `runner:` separately, because which recipe ran and who it acted as are
    different facts worth keeping apart.


    **Rejected: registering a runner id as an actor automatically.** It removes a
    setup step but widens what can create actors, and actors are a trust vocabulary
    -- the same vocabulary the human-clocked rule reads to decide whether a dispatch
    may happen at all. Growing it as a side effect of dispatch is the wrong direction
    for a field that gates spending money.


    Also added, satisfying sc-1''s second branch: a runner whose actor is outside
    the project''s vocabulary is refused **at dispatch** with a message naming both
    fixes, rather than the dispatch succeeding and the agent discovering it at its
    first write. A project that configures no actors still accepts any id, matching
    the allowance `validate_actor` already makes for a freshly initialised project
    -- otherwise a fresh `agentjobs init` could not dispatch at all.


    **The test fixtures had the same defect**, which is the clearest evidence it was
    real: they named a runner `fake` in projects configuring only `Jeff Posey`, `claude`
    and `codex`. Every one of them described a dispatch that could not have logged
    its own progress. Twenty tests failed on the new guard and were corrected rather
    than the guard relaxed.


    Verified: 1732 passed, with only the two failures already red on `main` (`test_agentjobs_context_paths_exist`,
    and the absolute-path tolerated-drift assertion). `black`, `ruff` and `mypy` clean
    on everything touched.


    sc-5 -- a real dispatched session logging progress as itself -- is not reproduced
    live. The unit path is covered and the sandbox was taken down at Jeff''s request
    before this landed.'
