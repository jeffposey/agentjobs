spec:
  summary: Dispatch generates a fixed prompt stub pointing the agent at the task record,
    with no way for the human pressing the button to add anything. Let them edit or
    extend it at dispatch time, on both the per-task and the project-level button.
  description: "Jeff, 2026-08-19: *\"you should be able to edit the prompt yourself,\
    \ when dispatching,\ngiving extra info, both when dispatching on specific task\
    \ and for entire project.\"*\n\n`DispatchRunner.build_prompt` renders a fixed\
    \ stub from a template: which agent, which\ntask, which project, where the API\
    \ is. Deliberately *\"a pointer to the record, never a\ncopy of it\"* -- that\
    \ principle is right and stays. What is missing is the thing a person\nsays out\
    \ loud when handing work over: *start with the failing test*, *the sandbox is\n\
    already running on 8901*, *do not touch the migration*.\n\nToday that has nowhere\
    \ to go. The alternative a human is left with is editing the task\nrecord to say\
    \ something that is not really part of the spec, which pollutes a durable\nrecord\
    \ with a transient instruction.\n\n## Design questions\n\n1. **Extend or replace?**\
    \ Appending an operator note preserves the stub's invariants\n   (the agent is\
    \ always told where its record is). Letting the whole prompt be rewritten\n  \
    \ is more flexible and can produce a run with no pointer to anything. Recommend\n\
    \   append-with-preview and record the rejection.\n2. **Where does the text live\
    \ afterwards?** The `dispatch` log entry already records\n   `argv` verbatim,\
    \ so the note is durable by accident. Decide whether it is also\n   recorded as\
    \ its own field -- an operator note is a fact about why a run was started\n  \
    \ and reads badly buried in an argv array.\n3. **Does it survive a re-dispatch?**\
    \ If a run fails and is dispatched again, silently\n   reusing the last note is\
    \ surprising and silently dropping it is annoying. Pick one and\n   say why.\n\
    4. **Project-level dispatch has no task at prompt-composition time.** The note\
    \ has to be\n   attached before the task is resolved, which the implementation\
    \ must accommodate.\n\n## A caution worth stating\n\nPrompt text is the one part\
    \ of a dispatch a human writes freehand, and it goes straight\ninto an argv that\
    \ starts a process. `compose_argv` placeholder substitution and quoting\nare the\
    \ surface to check. This is a place where a test that only asserts the note appears\n\
    in the prompt would miss the interesting failures.\n\n## This box is an affordance,\
    \ never a gate (added 2026-08-20, see task-188)\n\nDispatching a task is **one\
    \ click** and the task record is the brief -- Jeff recorded that\nas a binding\
    \ decision on task-188. This feature lets a human *add* something to a dispatch\n\
    they were already going to make. It must never become a step that has to be completed\n\
    before a run may start, and the dispatch must remain startable with the box untouched.\n\
    \nTwo neighbours to coordinate with rather than duplicate:\n\n- **task-188** introduces\
    \ a *sufficiency* prompt -- a text box shown only when the record\n  cannot brief\
    \ an agent, whose text becomes the authorising log entry. That one is\n  conditional\
    \ and rare by design. If it turns out to be the same component as this one\n \
    \ wearing a different label, sharing it is a good outcome; making this one mandatory\
    \ to\n  achieve that is not.\n- **task-172** wires dictation into every free-text\
    \ field and already names the dispatch\n  prompt among them. Do not build a bespoke\
    \ voice control here.\n"
  constraints: '- The generated stub''s pointer to the task record must survive whatever
    the human types. An agent that does not know where its own record is cannot log,
    claim, or hand off.

    - Never log the composed prompt anywhere the runner''s `env` secrets could reach
    it; argv is already recorded verbatim and env deliberately is not.

    - Works identically for per-task and project-level dispatch, or the feature is
    half-built.'
  out_of_scope: Prompt templating per runner (that is the profile layer in the design's
    section 4, accepted-but-unbuilt). Storing reusable prompt snippets. Making the
    prompt box a required step before a dispatch may start -- that is the ceremony
    task-188 removes, and task-188 owns the authorisation path.
  context:
  - path: src/agentjobs/dispatch/runner.py
    why: build_prompt, build_argv and compose_argv -- where the prompt is assembled
      and substituted into argv.
  - path: src/agentjobs/api/routes/dispatch.py
    why: The dispatch request model this has to carry a note on.
  - path: frontend/src/components/DispatchPanel.tsx
    why: The button that needs somewhere to type.
