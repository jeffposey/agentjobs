- id: 7
  ts: '2026-08-21T03:47:23.855841Z'
  actor: claude
  type: decision
  body: "**sc-4 decided: yes, a dispatched agent orchestrates a parent task \u2014\
    \ and the record picks, not the dispatcher.**\n\n**The condition is \"has an open\
    \ child\".** A task with an open child is an epic, so the agent sent at it gets\
    \ a supervisor prompt instead of the worker one. No new field, no label anyone\
    \ has to set, no judgement at spawn time \u2014 `manager.get_subtasks()` already\
    \ answers it, and `get_next_task()` already uses the same notion of an epic, so\
    \ the two cannot drift. Jeff's formulation was *\"anything that is starting with\
    \ a new worktree should be in a new session\"*; \"has an open child\" is that\
    \ sentence made checkable, and it is also the threshold sc-1 needed.\n\n**Two\
    \ prompt stubs, not one longer one**, because the second *inverts* the first's\
    \ load-bearing instruction. `PROMPT_STUB` opens by ordering a worktree before\
    \ anything else is written. A supervisor writes no code, needs no isolation, and\
    \ must not check anything out in the shared clone \u2014 doing so is exactly the\
    \ collision the worktree rule prevents, and it would then commit the parent's\
    \ task records where the dashboard cannot see them. Task-192's argument applies\
    \ in reverse: an instruction that must precede reading the guide cannot be deferred\
    \ to the guide, and that holds for \"do not take a worktree\" as much as it held\
    \ for \"take one\".\n\n**The claim had to change, and that was not in the plan.**\
    \ Found by writing the tests: `claim_task` refused *any* task with open children\
    \ \u2014 *\"an umbrella is finished by its children, so there is no work to take\
    \ here\"* \u2014 and `dispatch_task` claims before it spawns. So the supervisor\
    \ prompt was unreachable in production: dispatching a parent returned `ClaimLostError`.\
    \ The reasoning in that refusal stopped being true the moment driving an epic\
    \ became a described job. It is work, it belongs to one agent for the epic's length,\
    \ and refusing the claim left the only agent doing it with no way to say so on\
    \ the record.\n\nSo an umbrella is now claimable, and the claim writes a **supervision\
    \ ask** naming the open children instead of \"Execute the spec\". What survives\
    \ is the distinction between *naming* a task and *being handed* one: `get_next_task()`\
    \ still skips umbrellas, so nothing is ever put in the supervisor's seat by asking\
    \ what is next.\n\n*Rejected alternative:* a `supervise=True` parameter on `claim_task`,\
    \ leaving the refusal in place by default. More surgical, and worse \u2014 it\
    \ needs plumbing through REST, MCP and the CLI before a human could claim a parent\
    \ from the UI, and every caller that forgot it would get the old wrong answer.\
    \ The ask written on the claim is what stops an accidental claim, and it works\
    \ for every caller without one of them knowing about it.\n\n**D4 stands, and it\
    \ costs something worth naming.** A dispatch must be caused by a stored log entry\
    \ a human wrote, which is what makes agent-starts-agent structurally impossible\
    \ rather than merely capped. Nothing a supervisor writes satisfies that, so **a\
    \ supervisor cannot dispatch its children** \u2014 it starts them with the runner\
    \ CLI directly, as its own subprocesses. Consequence: those children have no run\
    \ directory, no ledger row, no `dispatch_result`, are not reaped by the poller,\
    \ and do not count against `max_concurrent_runs`, while the supervisor itself\
    \ holds a slot for the whole epic. That is not a bug to route around \u2014 the\
    \ task record is the signal the protocol tells a supervisor to watch anyway \u2014\
    \ but whether the ledger should learn about agent-started children is a real open\
    \ question. It is not filed as a task: it belongs to task-022 (the unattended\
    \ epic loop) or to a decision Jeff makes, not to an agent filing work for itself.\n\
    \n**sc-3's two unexercised cases are now specified** alongside the two the 2026-08-19\
    \ run established. *Child died* \u2014 session gone, ball still `agent`, nothing\
    \ new on the record: look at what survived on the branch and in the worktree,\
    \ then at most **one** restart with a re-brief naming what is already committed,\
    \ and after that hand the child to a human. A child that dies twice is dying for\
    \ a reason the supervisor cannot see, and an unbounded retry spends the night\
    \ proving it. Never force-remove a worktree holding uncommitted work. *Parent\
    \ idle* \u2014 do nothing that costs context: the poll and the parent's own record,\
    \ nothing else. Not a second child, not the running child's diff \"to be ready\"\
    , not the next child's context. The supervisor's context is the resource this\
    \ whole rule protects, and spending it while waiting is the same failure as working\
    \ the children yourself, arrived at politely."
