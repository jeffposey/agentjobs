  actor: claude
  type: progress
  body: "**Implemented on `feat/task-164-supervisor-dispatch`. What was written, and\
    \ what was verified how.**\n\n**sc-1 \u2014 the rule.** `ALLAGENTS.md` gains a\
    \ section, *You do not work the children*, and its Parent Task Loop steps 2\u2013\
    4 now say who works a child (a separate session) and who merges it (that session,\
    \ on its own approval). The threshold is **anything that takes a worktree**, with\
    \ the argument for it over a size estimate: it is checkable, where \"big enough\
    \ to be worth a session?\" is a judgement made by the party with an interest in\
    \ saying no. The Task Lifecycle section, which is written for the worker, now\
    \ opens by saying it is not yours if your task has an open child. The vendor-neutral\
    \ half \u2014 the protocol itself \u2014 is in `docs/agent-workflow.md`, since\
    \ dispatch points every run at that guide and dispatch serves any project.\n\n\
    **sc-2 \u2014 the bootstrap, demonstrated end to end.** This worktree was created\
    \ fresh and bootstrapped with `python scripts/bootstrap.py`: **26 seconds**, which\
    \ confirms rather than contradicts the ~30s figure already documented. It printed\
    \ its own interpreter, and `scripts/check.py` run with that interpreter passes\
    \ in full \u2014 Black, Ruff, MyPy, 2181 Python tests, the OpenAPI and client\
    \ checks, Vitest, the production build, and 16 Playwright tests against a live\
    \ server. That is the whole of sc-2: a fresh worktree, a documented command, a\
    \ green gate, no hand-repair anywhere in between.\n\n**sc-3 \u2014 four states,\
    \ all specified.** `docs/agent-workflow.md` carries the table (`ball: agent` \u2192\
    \ wait; `ball: human` \u2192 act; closed with an outcome \u2192 verify and move\
    \ on; ball still `agent` with the process gone \u2192 recover) and a paragraph\
    \ each. *Finished* and *parked* were established by the 2026-08-19 run in entry\
    \ 2 and are written up as they were learned, including that a parked child stops\
    \ the loop rather than the loop stepping past it. *Died* and *parent idle* are\
    \ specified in entry 7 above and written into the guide. The two rules that run\
    \ above all four \u2014 watching is a mechanism, and the record is the signal\
    \ \u2014 are stated in both files.\n\n**sc-4 \u2014 decided yes, and implemented.**\
    \ Entry 7 has the reasoning. In code:\n- `SUPERVISOR_STUB` and `describe_children()`\
    \ in `dispatch/runner.py`; `build_prompt()` chooses the stub from `open_child_ids()`.\n\
    - `claim_task()` no longer refuses a task with open children; it writes `supervision_prompt()`\
    \ naming them. `get_next_task()` is untouched, so an epic is still never *handed*\
    \ to anyone.\n- The two surfaces that told the old story were corrected: the React\
    \ `DependencyState` copy said the children \"must finish first\", and the legacy\
    \ Jinja detail page said \"not claimable\".\n\n**Verification beyond the suite.**\
    \ `build_prompt` was run against the real corpus, not a fixture: `task-160-dispatch-phase-two`\
    \ (9 open children) renders the supervisor prompt with eight children named and\
    \ \"and 1 more\"; `task-164` itself, a leaf, renders the unchanged worker prompt.\
    \ The full argv dispatch would execute for the parent was rendered too, posture\
    \ flags included. Twenty-one new tests cover the stub choice, the worktree inversion,\
    \ the leaf regression (byte-equal to the old prompt), the id cap, the claim in\
    \ the manager, over the API and through MCP, and a documentation-contract test\
    \ that fails if the guide loses the parent protocol or any of the four states.\n\
    \n**What sc-4 does not have, stated plainly: no live unattended run.** Nothing\
    \ here has been shown by dispatching a real parent and watching children start.\
    \ That is blocked rather than skipped \u2014 enabling any project for dispatch\
    \ is an edit to `~/.agentjobs/dispatch.yaml`, which by gate 3 nothing but a human\
    \ may make, and dispatching `task-160` for real would start an agent merging into\
    \ `main` on nine children. The behaviour that composition produces is task-022's\
    \ `ac-7`, and task-022 already declares `needs: task-164`.\n\n**Not done, deliberately:**\
    \ no follow-up task filed for the ledger gap in entry 7 (agent-started children\
    \ are invisible to the run ledger). It belongs to task-022 or to a decision, and\
    \ the Parent Task Loop says not to file work for oneself mid-loop."
