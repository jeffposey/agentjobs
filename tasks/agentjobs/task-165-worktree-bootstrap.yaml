- id: 5
  ts: '2026-08-19T17:29:28.320989Z'
  actor: claude
  type: handoff
  body: '## What was built


    **`scripts/bootstrap.py`** -- one command that takes a just-created worktree (or
    a fresh clone) to a state where it can run the gate: `poetry install`, `npm ci`
    in `frontend/`, `playwright install chromium`, then a verification step that the
    environment imports **this** checkout''s `src/`.


    **`scripts/check.py`** now refuses to run in a checkout that cannot verify itself,
    naming what is missing and pointing at the bootstrap, rather than failing inside
    pytest collection or npm''s resolver.


    **`ALLAGENTS.md` / `ENGINEERING.md`** carry the bootstrap command at the two places
    that tell a reader to make a worktree, with the measured cost and an explicit
    warning against borrowing the main clone''s virtualenv.


    **`tests/test_worktree_bootstrap.py`** -- 5 tests over the guard''s logic and
    the documentation contract.


    **`tests/test_task_corpus.py`** -- the pointer check no longer requires built
    output to exist (see below), and now reports every bad pointer at once instead
    of one per gate run.


    ## Measurements (2026-08-19, this machine)


    | | |

    | --- | --- |

    | Bootstrap, brand-new worktree | **30s** (poetry 21s, npm ci 11s, playwright
    1s) |

    | Bootstrap, re-run in a bootstrapped worktree | **13s** |

    | `pytest` | **3m52s**, 1755 tests |

    | `npm run check` | **73s** -- API-client generation check, icons, lint, 124 Vitest
    tests in 20 files, production build, 11 Playwright tests against a live server
    |

    | Whole gate | **about 5 minutes** |


    ## Verification, done the way a user would


    A second worktree (`C:/projects/aj-165-demo`) was created from scratch, bootstrapped
    by the documented command **only**, and used for every measurement above. Before
    bootstrapping, `python scripts/check.py` there printed:


    > `This checkout cannot verify itself: agentjobs imports from C:\projects\agentjobs\src\agentjobs,
    outside this checkout; frontend/node_modules is missing.`


    That message is itself the evidence for **sc-2**: the interpreter really did resolve
    `agentjobs` to the *main clone''s* source in an unrelated checkout. The first
    version of this guard only asked whether `agentjobs` was importable, and that
    version passed there -- silently green, testing another branch''s code. After
    bootstrapping, the same worktree printed `Imports resolve to C:\projects\aj-165-demo\src\agentjobs
    -- this checkout''s own source.`


    ## Acceptance


    - **sc-2 met** -- guard judges the import by location; demonstrated catching the
    real case above.

    - **sc-3 met** -- cold 30s, warm 13s, gate ~5 minutes, all measured rather than
    estimated.

    - **sc-4 met** -- both documents changed at the point of the worktree instructions.

    - **sc-1 not met.** A bootstrapped worktree now runs the entire gate end to end,
    but it does not reach a *pass*, because `main` is red. Three failures, all reproduced
    identically in the main clone: two task-corpus tests failing on four stale/invalid
    context pointers, and `frontend/e2e/dispatch.spec.ts` -- the only live-server
    test of dispatch -- failing because a started run never appears in the panel.
    Filed as **task-166** with the full evidence. `poetry run mypy .` is also broken
    on `main`, for a module-mapping reason, and is in that task too.


    ## One in-scope fix that was made


    `test_agentjobs_context_paths_exist` required every context pointer to exist on
    disk, so task-013''s pointer at `src/agentjobs/frontend_dist/` passed in a clone
    where someone had run `npm run build` and failed in every fresh worktree -- and
    since the gate itself builds that directory, the first run failed and a second
    passed. Git-ignored paths are now exempt. That is the same disk-state dependency
    the test''s own docstring rejects, so this was fixing the test''s stated intent
    rather than widening it.


    ## Loose end


    The demonstration worktree `C:/projects/aj-165-demo` has been removed. `C:/projects/aj-165`
    stays until this merges.'
