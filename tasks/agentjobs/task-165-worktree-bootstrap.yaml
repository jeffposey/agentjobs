- id: 3
  ts: '2026-08-19T17:04:30.324816Z'
  actor: claude
  type: decision
  body: '**Decided: the bootstrap installs a real environment per worktree. Both cheap
    sharing tricks are rejected.**


    Measured first, on this machine, 2026-08-19, in a worktree created from scratch:


    - `poetry install` -- **21s**. Poetry''s artifact cache is already warm, so this
    is mostly file copying into a new cache-dir virtualenv.

    - `npm ci` in `frontend/` -- **11s**, for the full 191 MB tree, from the npm cache.

    - `npx playwright install chromium` -- **1s**, already in the user-level browser
    cache.

    - Whole bootstrap, wall clock: **30s**.


    **Rejected: junctioning `frontend/node_modules` from the main clone.** This is
    what the previous session did by hand, and it buys 11 seconds. Against that: two
    worktrees would share one mutable 191 MB tree, including Vite''s `node_modules/.vite`
    pre-bundle cache, which two concurrent gates would write at once. This repository''s
    entire worktree rule exists because agents collide invisibly in shared state;
    adding a shared directory back to save 11 seconds inverts it. If `npm ci` were
    two minutes the trade would be worth revisiting -- reopen this if the measurement
    changes.


    **Rejected, and rejected harder: reusing the main clone''s Poetry virtualenv.**
    `poetry install` installs the root package in editable mode pointing at *that
    clone''s* `src/`, so `pytest` run from a worktree against that environment imports
    code from `main` rather than the branch under test. It reports a green suite for
    source it never executed, and nothing in the output says so. The prior workaround
    compensated with a `PYTHONPATH` override, which is correct only for as long as
    someone remembers it.


    That failure mode is not hypothetical here. Running `python scripts/check.py`
    with the system interpreter in the un-bootstrapped demo worktree resolved `agentjobs`
    to `C:\projects\agentjobs\src\agentjobs` -- the main clone. So the guard added
    to `check.py` judges the import by **location**, not by importability; the first
    version of that guard only checked importability and was satisfied by exactly
    this wrong answer.


    **Rejected: a documented list of steps instead of a script.** The steps were already
    derivable and were still not followed. `scripts/bootstrap.py` also does the thing
    prose cannot: it verifies afterwards that the environment imports the worktree''s
    own `src/`.'
