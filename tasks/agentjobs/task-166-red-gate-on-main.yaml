- id: 7
  ts: '2026-08-19T18:07:52.338644Z'
  actor: claude
  type: decision
  body: "**Decision \u2014 `task_update_content` keeps the whole-object spec contract.\
    \ Partial spec patches are rejected.**\n\nSpec question 2. The task frames the\
    \ whole-object contract as *\"defensible for authoring and hostile for correction\"\
    *, on the grounds that a one-character path fix means resending a very long description\
    \ *\"retyped by an agent, with no diff shown before it lands.\"*\n\n**The framing\
    \ is right about the hazard and wrong about its cause.** Nothing in the contract\
    \ requires retyping. All four corrections here were made by a 40-line script that\
    \ fetches the task, mutates one field of the returned spec object, and resends\
    \ it with `expected_revision`. Each produced a one-line content diff, confirmed\
    \ with `git diff` on the record afterwards, and no prose passed through a model\
    \ at any point. The hazard is an agent choosing to reconstruct a description from\
    \ memory; a partial patch does not remove that temptation, it just narrows the\
    \ blast radius when the agent takes it.\n\n**Why whole-object earns its keep.**\
    \ Combined with `expected_revision`, it forces a read-modify-write: a caller *cannot*\
    \ write the spec without having read the current one. That is what makes a lost\
    \ update impossible. A partial merge would let a caller write `spec.context` having\
    \ never read `spec.description`, and `expected_revision` would then be guarding\
    \ fields the caller never looked at \u2014 the appearance of optimistic concurrency\
    \ without the substance. It also drags merge semantics into an interface whose\
    \ value is that it has none: given a partial `context` list, is that a replace,\
    \ an append, or a keyed merge? Every answer is defensible and callers will assume\
    \ different ones.\n\n**Rejected alternative, stated plainly:** accept a partial\
    \ `spec` that merges field-wise into the stored spec. Rejected for the two reasons\
    \ above \u2014 it weakens `expected_revision` into decoration and it introduces\
    \ ambiguity that whole-object does not have.\n\n**The ergonomic gap is real and\
    \ should be closed the other way.** The right fix is not a looser API but a tool\
    \ that does the safe thing for you: a CLI/MCP helper that fetches the task, applies\
    \ a named field change, **shows the diff**, and resends with `expected_revision`\
    \ \u2014 which is exactly the script written for this task, promoted into the\
    \ product. That gives whole-object's safety with a patch's ergonomics, and the\
    \ diff-before-write that the task correctly identifies as missing today. Worth\
    \ its own task; not built here.\n\n---\n\n**Decision \u2014 a closed record stays\
    \ editable through the managed API.**\n\nThe task asks whether a closed record\
    \ should be editable at all, *\"and if not, how does a permanently-red gate caused\
    \ by a closed record ever get fixed?\"*\n\n**Empirically it already is.** `PATCH`\
    \ on the closed, completed `task-076` returned 200 with no special handling, appended\
    \ its own `update_content` log entry, and left `lifecycle: closed` untouched.\
    \ So the question is whether that should change.\n\n**It should not.** A closed\
    \ record is not inert: it is still read as the archaeology the resumption contract\
    \ depends on, and it is still asserted on by the corpus tests \u2014 `task-076`\
    \ held the gate red for the whole repository while closed. Making closed records\
    \ immutable would make that state unfixable through the managed path, and the\
    \ only remaining route is hand-editing the YAML, which is the exact failure the\
    \ managed interface exists to prevent. A rule whose enforcement forces the behaviour\
    \ it was written to stop is not a safety rule.\n\nWhat makes the edit safe is\
    \ the audit trail, not immutability: every change appends an entry naming the\
    \ operation, its fingerprint and the fields touched, so a closed record that was\
    \ corrected says so on its face.\n\n**Rejected alternative:** immutable-when-closed,\
    \ with a reopen-fix-reclose path. It costs two lifecycle transitions and rewrites\
    \ the task's own history \u2014 `closed \u2192 active \u2192 closed`, with the\
    \ transitions in the log \u2014 to correct a typo in a file path. That makes the\
    \ record less honest about what happened to it, not more.\n"
  data:
    operation:
      id: 7387d75c-5c31-4cea-8ffd-a6b586b47580
      kind: log_append
