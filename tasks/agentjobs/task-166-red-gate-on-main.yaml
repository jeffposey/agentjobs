    \ 'e2e-sleeper', which this project does not configure as an actor. Configured\
    \ actors: E2E Human, claude, codex. A dispatched agent must be able to log progress\
    \ and hand off under the identity that owns its task, and it cannot do that as\
    \ an unknown actor. Set 'actor:' on runner 'e2e-sleeper' in ~/.agentjobs/dispatch.yaml\
    \ to one of them, or add 'e2e-sleeper' to 'actors:' in .agentjobs/config.yaml.\n\
    \nThat is `UnknownRunnerActorError` from `assert_runner_actor_known` in `src/agentjobs/dispatch/guards.py`.\
    \ No run is ever created, so the run list has no `listitem` and the assertion\
    \ times out on an element that does not exist rather than on wrong text.\n\n**Timeline.**\
    \ `35018ad test(e2e): drive the whole dispatch loop through a live server` landed\
    \ 2026-08-18. `31b2198 fix(dispatch): act as a configured actor, not as the runner's\
    \ name` \u2014 task-159's guard \u2014 landed 2026-08-19. Its own commit message\
    \ says *\"The test fixtures needed the same fix, which is the defect in miniature:\
    \ they named a runner 'fake' in a project configuring only Jeff Posey, claude\
    \ and codex.\"* It fixed `tests/test_dispatch_guards.py`, `test_dispatch_api.py`,\
