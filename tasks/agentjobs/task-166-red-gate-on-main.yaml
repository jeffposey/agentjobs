- id: 6
  ts: '2026-08-19T18:07:51.240218Z'
  actor: claude
  type: decision
  body: "**Decision \u2014 the corpus tests keep asserting on live task records, and\
    \ keep failing rather than warning.**\n\nSpec question 3. Options considered:\
    \ keep as is; warn rather than fail; check only open tasks.\n\n**Kept as is.**\
    \ The reasoning turns on what actually went wrong here, which is not the thing\
    \ the question assumes.\n\nThe premise of the question is that these tests are\
    \ fragile because agents rewrite task records many times a day, so a bad pointer\
    \ turns the gate red for everyone. That risk is real but it is *not* what happened.\
    \ What happened is that four bad pointers accumulated over an unknown period and\
    \ **nobody saw the red gate at all** \u2014 because until task-165 landed, an\
    \ agent in a worktree could not run `scripts/check.py`, so the population most\
    \ likely to file a task with a since-renamed path was the population that never\
    \ ran the check. The observed failure mode is a gate nobody ran, not a gate that\
    \ cried wolf. Loosening it would treat a symptom that has not occurred and worsen\
    \ the one that has.\n\n**Warn rather than fail \u2014 rejected.** The gate emits\
    \ roughly two thousand lines and takes four minutes. A warning inside that is\
    \ not read by anyone, ever. This converts a defect that is currently caught into\
    \ one that is not, which is precisely what `spec.constraints` forbids: *\"Do not\
    \ make the tests toothless to make them quiet.\"*\n\n**Check only open tasks \u2014\
    \ rejected.** It sounds right \u2014 a closed task's pointers are archaeology\
    \ \u2014 and it is wrong on this evidence. `task-076` is closed and its pointer\
    \ at `.claude/settings.json` was **never** valid, not rotted; scoping to open\
    \ tasks would have buried a defect that was always there rather than surfacing\
    \ it. It also does not target the actual rot: pointers go stale when the code\
    \ they name is renamed, and the tasks pointing at actively-renamed code are open\
    \ ones. It exempts the records where a wrong pointer is cheapest and keeps checking\
    \ the ones that break most.\n\n**What makes keeping it tolerable** is already\
    \ in place and worth stating so nobody re-opens this on ergonomic grounds: the\
    \ test reports every bad pointer at once rather than one per four-minute run (task-165),\
    \ it exempts a task's own pending deliverables and git-ignored generated output,\
    \ and the failure message names the task id and the path. The cost of a red gate\
    \ is one managed API call. The benefit is that \"read this first\" stays true,\
    \ which is load-bearing for the resumption contract.\n\n**Follow-up worth filing,\
    \ not done here.** The better place to catch this is the write, not the gate:\
    \ a `dangling-context-path` rule in `src/agentjobs/validation.py`, beside the\
    \ existing `absolute-path` rule, would refuse a context pointer at the moment\
    \ an agent creates it \u2014 caught by the agent who introduced it, in the tool\
    \ they were already using, seconds after they wrote it. That would not replace\
    \ this test, because it cannot catch a pointer that was valid when written and\
    \ broken later by a rename. It would remove most of the volume.\n"
