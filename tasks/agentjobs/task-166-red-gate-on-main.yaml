    \nAdding `mypy` to the gate would close that, and it is nearly free: **2.9 seconds\
    \ warm**, against a gate that takes about four and a half minutes.\n\n**It is\
    \ deliberately left undone** because it changes what \"the gate\" means for every\
    \ agent in this repository, and the task asked to fix or document the invocation,\
    \ not to redefine the gate. Widening the gate is the repository owner's call,\
    \ not a thing to slip into a branch about red tests. Raised in the handoff instead,\
    \ where one word approves it.\n\n**Rejected alternative:** add `mypy`, `ruff`\
    \ and `black --check` to `check.py` here on the reasoning that it prevents recurrence.\
    \ Rejected as unrequested scope \u2014 but if the answer is yes, it is a three-line\
    \ change to `scripts/check.py` and should be its own commit, not folded into this\
    \ one.\n"
