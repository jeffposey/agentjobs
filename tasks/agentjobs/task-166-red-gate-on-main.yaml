  body: "**The four records are corrected, and the dispatch e2e failure is diagnosed.\
    \ Cause below \u2014 it is the product's guard doing exactly what it was built\
    \ to do, against a fixture nobody updated.**\n\n## The dispatch e2e failure: cause\n\
    \n`frontend/e2e/dispatch.spec.ts:58` fails because **the dispatch is refused,\
    \ correctly, and the panel says so.** The failure snapshot (`frontend/test-results/.../error-context.md`)\
