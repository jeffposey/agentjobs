  type: question
  body: "Does task-141 narrow to host-side integration of the menu built here, or\
    \ does this epic's task-169 fold into task-141 instead?\n\nThe overlap is substantial\
    \ and not accidental. Task-137's epic already describes a host-app launcher whose\
    \ menu offers Open in AgentJobs, Report issue, dispatch and settings, and task-141\
    \ was written to build it. This epic arrives at the same control from the other\
    \ direction \u2014 the AgentJobs app's own chrome \u2014 and concludes the two\
    \ should be one component, which they should.\n\nThe three ways out:\n\n1. **task-141\
    \ narrows** to \"integrate the shared menu into a host app\", and task-169 owns\
    \ building the shared component. Recommended: the menu is chrome for AgentJobs\
    \ first and embeddable second, and building it inside the app where it can be\
    \ exercised daily is the cheaper order. It also means the embedding epic's groundwork\
    \ children (138 distribution, 139 host-agnostic reporter, 140 server surface)\
    \ stay exactly as written and stay on the critical path.\n2. **task-169 is closed**\
    \ and its content merged into task-141. Keeps the embedding epic whole, at the\
    \ cost of blocking every visible piece of this epic behind four children of another\
    \ epic.\n3. Both are built. Rejected \u2014 two launchers is the failure the epic\
    \ constraints exist to prevent.\n\nNothing here is blocked while this is open:\
    \ task-168 (the menu shell inside AgentJobs), task-171/172 (dictation) and task-174/175\
    \ (AI drafting) are all independent of the answer. Only task-169 waits, and its\
    \ own ac-7 requires this resolved before code is written."
