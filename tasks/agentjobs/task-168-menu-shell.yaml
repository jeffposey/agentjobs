    \ a top bar or burger bar is dashboard and tasks probably ... api docs, playbooks,\
    \ dispatch settings, should be buried in config/etc menus ... Create should be\
    \ merged with Report Issue and put in a better place, maybe always on screen but\
    \ a small icon in top bar\". The epic-level decision is task-167 log entry 4.\n\
    \nThree consequences for this task, and the title, summary, description, constraints\
    \ and acceptance have been patched to match:\n\n1. **Report issue is not a menu\
    \ entry.** It merges with Create into one always-present capture control \u2014\
    \ **task-346** \u2014 which now owns where it lives and owns retiring the floating\
    \ button. Your ac-1 and ac-3 moved there. You still own the menu, About and the\
    \ version endpoint.\n2. **The menu receives API Docs, Playbooks and Dispatch settings**,\
    \ which **task-345** removes from the primary nav. 345 depends on this task for\
    \ exactly that reason: the entries cannot leave the bar before the menu can hold\
    \ them. Playbooks and Dispatch may arrive via task-170, which already owns dispatch-in-the-menu\
    \ \u2014 coordinate rather than building the entry twice.\n3. **The \"Dispatch\
    \ nav link stays in the primary nav\" constraint is lifted**, because it was explicitly\
    \ Jeff's call to make and he made it. What it protected is not lifted: the machine-wide\
    \ kill switch stays one interaction from every page, so if this menu turns out\
    \ not to render somewhere the bar does, Dispatch stays in the bar and the record\
    \ says so. That makes the project-less-pages question (ac-7) load-bearing rather\
    \ than tidy-up.\n\n**Rejected:** leaving this task exactly as specified and letting\
    \ task-346 quietly contradict it. Two overlapping tasks with opposite plans for\
    \ the same button is how a session ends up building the losing one \u2014 the\
    \ failure task-236 already names."
