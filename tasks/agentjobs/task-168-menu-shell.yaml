spec:
  summary: 'An actions menu in the top-right of the AgentJobs header: a transient
    popup holding About and the API docs to begin with, and the shell that later entries
    -- Playbooks and Dispatch settings, evicted from the nav row by task-345 -- are
    added to.'
  intent: 'This is the container the rest of the epic fills. Until it exists, every
    new AgentJobs action is either another fixed-position button in a corner or a
    link crammed into a nav bar that already has seven.


    Doing it first also settles the questions everything else inherits: how the popup
    opens and closes, how it behaves under a thumb on a phone, where focus goes, and
    what an entry looks like. A later child adding "Dispatch" should be adding one
    line to a list, not designing a menu. task-345 depends on this task for exactly
    that reason -- three entries cannot leave the top bar before something can hold
    them.'
  description: '**Read log entry 4 first.** Jeff redirected this on 2026-09-05: Report
    issue is no longer a menu entry (it merges with Create into task-346''s capture
    control), and the menu instead receives what the nav row is shedding.


    ## The trigger


    An icon button, top-right of the header, aligned with the primary nav. **Not a
    hamburger** -- log entry 3 explains why: there is already a nav burger at the
    left end below the breakpoint, and two hamburgers in one bar read as a duplicate.
    A kebab or the AgentJobs mark distinguishes it.


    **Why not the AgentJobs mark inside AgentJobs:** an AgentJobs logo labels the
    app you are already looking at, says nothing about what pressing it does, and
    competes with the "AgentJobs" wordmark already in the header. Outside AgentJobs
    -- task-169 -- the logo becomes the right choice for exactly the inverse reason.


    ## The popup


    Transient: opens on click/tap, closes on Escape, on a click outside, on route
    change, and after an item is chosen. It is not a drawer, not a persistent panel,
    and it never requires hover to open a submenu.


    Entries in this task:


    - **About** -- see below.

    - **API Docs** -- an `<a href="/docs">` to FastAPI''s own page. It currently occupies
    a slot in the primary nav that a menu can hold better; task-345 removes it from
    the bar once it lives here.


    Entries other children add: **Playbooks** and **Dispatch settings** (task-170
    and task-345, which is the pair that makes the nav row short), and **AgentJobs
    dashboard** (task-169, embedded hosts only). Coordinate with task-170 rather than
    building the dispatch entry twice.


    **Not an entry:** Report issue. task-346 owns it.


    ## About


    A small panel, not a route, answering "which AgentJobs am I looking at" from a
    phone:


    - The running server''s version. `src/agentjobs/__version__.py` holds it and `api/main.py`
    already passes it to FastAPI as the OpenAPI `version`, but there is no endpoint
    a client can read it from. Add one -- a small `GET /api/version` or an equivalent
    field on an existing bootstrap-shaped response -- and note that task-140 is separately
    adding a bootstrap call for embedded clients. Prefer converging on one response
    over adding a second endpoint that says nearly the same thing; if you add a standalone
    endpoint, say in a decision entry why.

    - The server origin the UI is talking to, and the current project id.


    ## Where the menu renders, and why it now matters more


    The menu lives in `ProjectApp`''s header, which the project-less status pages
    do not render. That was a coverage question about the reporter; it is now a question
    about the **dispatch kill switch**, because task-345 moves Dispatch settings in
    here on the condition that the menu is genuinely reachable from every page. Decide
    and record which of these you did:


    1. The menu also renders on the project-less status pages, or

    2. It does not, and you argue why -- in which case say plainly that Dispatch may
    have to stay in the nav row, and put that on task-345.


    ## Verification


    Stand up a review server on its own port with seeded throwaway data. Show the
    menu open on a desktop width and at a phone width. Jeff will look at it on his
    phone over the tailnet, so make sure it works there.'
  constraints: '- Keyboard accessible: the trigger is a real button, the popup is
    reachable and dismissible by keyboard, focus returns to the trigger on close.

    - Touch targets keep the existing `touch-target` sizing convention; note the CSS
    specificity trap documented in `PrimaryNav.tsx` around hiding a `.touch-target`
    element at a breakpoint.

    - The menu must not shift or reflow the header on open, and its z-order sits below
    the reporter modal (`PrimaryNav` is `z-30` for that reason).

    - Version comes from the server, never from a constant compiled into the frontend
    bundle -- a stale bundle reporting its own build''s version is worse than no version
    at all.

    - Do not touch the primary nav''s contents; task-345 owns that and depends on
    this.

    - Take a worktree and bootstrap it. One unqualified `scripts/check.py` on the
    rebased branch before the handoff.'
  out_of_scope: '- The embeddable/host-app version of the menu (task-169).

    - Report issue, the floating button, and the merged capture control (task-346).

    - Removing anything from the primary nav (task-345).

    - Dispatch entry (task-170), voice (task-172), AI drafting (task-175).

    - Any change to what the reporter form collects or how it files a task.

    - A settings surface. Task-142 owns settings.'
  context:
  - path: frontend/src/App.tsx
    why: ProjectApp's header is where the trigger goes, and the file carries the routes
      and the kill-switch comment.
  - path: frontend/src/components/PrimaryNav.tsx
    why: The popup behaviour to copy -- Escape, outside press, route change, matchMedia
      -- and the API Docs anchor that moves into this menu.
  - path: src/agentjobs/api/main.py
    why: Already imports __version__ for the OpenAPI metadata; the version endpoint
      belongs near it.
  - path: frontend/src/components/ProjectSwitcher.tsx
    why: The header's existing popup-ish control -- match its interaction behaviour
      rather than inventing a second pattern.
  - path: tasks/agentjobs/task-345.yaml
    why: Depends on this task and states what arrives in the menu; its kill-switch
      condition is what ac-7 answers.
