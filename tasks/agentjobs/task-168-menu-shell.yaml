  actor: claude
  type: decision
  body: "Top-right popup, not a top-left sidebar drawer. Jeff raised the drawer, then\
    \ said to start simple; this records why simple also happens to be right, so it\
    \ is not reopened by taste alone.\n\n**Rejected: burger top-left opening a full-height\
    \ drawer.** It is a real convention, but it is the convention for *navigation*\
    \ \u2014 Material's nav drawer holds an app's sections. This menu holds actions\
    \ and app-level items: report an issue, dispatch, dispatch settings, About. AgentJobs\
    \ already has navigation in the header (Dashboard, Tasks, Create, Dispatch), so\
    \ a left drawer would either duplicate it or absorb it, and absorbing it is a\
    \ nav rewrite this epic put out of scope. An actions menu sitting where a user\
    \ expects navigation is a worse lie than an unfamiliar corner.\n\n**The decisive\
    \ argument is task-169.** The same component has to render inside somebody else's\
    \ app, and there it cannot own the top-left \u2014 that corner is the host's own\
    \ logo and nav. A full-height panel sliding across an app AgentJobs does not own\
    \ is invasive in a way a small popup anchored to its own trigger is not. A placement\
    \ that only works on one of the two surfaces breaks the one-implementation premise\
    \ the whole epic rests on.\n\n**It is also the reversible choice.** A popup can\
    \ become a drawer later. A drawer that has swallowed the app's navigation is expensive\
    \ to unwind.\n\n**Reopen if:** the primary nav moves into a drawer for small screens\
    \ as its own piece of work, at which point this menu's relationship to that drawer\
    \ is a live question again. Related but separate: the header nav is `flex-wrap`\
    \ with six links plus the project switcher and wraps to multiple rows on a phone.\
    \ That is a real problem and a left-hand nav drawer is a reasonable answer to\
    \ it \u2014 but it is navigation work, not this menu, and no task covers it yet."
  data:
    operation:
      id: f60b8d47-3e91-4c25-8a06-2b7d94e15c38
      kind: log_append
      fingerprint: c01833b0b2f417e1297834206a527e8d
- id: 3
  ts: '2026-08-23T20:38:10.494018Z'
  actor: claude
  type: note
  body: "**There is now a second burger in the header, and it is not yours. Read this\
    \ before you build.**\n\ntask-292 merged a burger into the top bar on 2026-08-23.\
    \ It is not this task done early, and it must not be folded into this one. The\
    \ full reasoning is task-292's decision entry; here is what binds on you.\n\n\
    **What is already there.** Below 960px the header's six destinations \u2014 Dashboard,\
    \ Tasks, Create, Dispatch, Playbooks, API Docs \u2014 collapse behind a hamburger\
    \ at the **left** end of the bar, which drops them in a panel over the page. At\
    \ 960px and above there is no burger at all and the links are inline exactly as\
    \ before. The header is also now `sticky top-0 z-30`, below your `z-40` button\
    \ and `z-50` modal.\n\n**Nothing in this task's spec has to change.** You still\
    \ put an actions menu in the **top-right**, and it still exists at every width.\
    \ Four things keep the two apart:\n\n- **Corner.** Navigation left, actions right\
    \ \u2014 the convention Gmail, Slack and Material all use, for this reason.\n\
    - **Lifetime.** The nav burger exists only below 960px. Above it, yours is the\
    \ only control in the bar.\n- **Contents.** Yours holds AgentJobs actions; that\
    \ one holds destinations. They never hold the same entry.\n- **Owner, which is\
    \ the load-bearing one.** task-169 wants your menu embedded in somebody else's\
    \ React app. A host app has no Tasks page, so navigation cannot live in the component\
    \ that gets embedded. Keeping destinations out of it is what makes task-169 possible\
    \ at all.\n\n**One request, not a constraint: do not use a hamburger icon.** Two\
    \ hamburgers at opposite ends of one bar read as a duplicate. A kebab (\u22EE\
    ) or the AgentJobs mark distinguishes yours at a glance. Your call.\n\n**One thing\
    \ you can reuse.** `frontend/src/components/PrimaryNav.tsx` already settles the\
    \ popup questions your intent says this task exists to settle \u2014 close on\
    \ Escape with focus returned to the trigger, close on a press outside, close on\
    \ navigation, `aria-expanded`/`aria-controls` on a real button, and a `matchMedia`\
    \ listener so a panel left open does not come back when the viewport crosses the\
    \ breakpoint. Its jsdom tests cover all of it. Take the pattern; whether the two\
    \ share code is yours to decide, and they are different enough shapes (a full-width\
    \ sheet versus an anchored menu) that copying the behaviour may be cleaner than\
    \ abstracting it.\n\n**Still true, and worth repeating because task-292 moved\
    \ the Dispatch link one tap further away on a phone:** the Dispatch nav entry\
    \ stays in the primary navigation. It is where the machine-wide kill switch lives.\
    \ Below 960px it is now behind the nav burger, which is the most the width allows;\
    \ it is not in a menu of actions and must not become one.\n"
