spec:
  summary: "Put dispatch in the menu \u2014 both halves. Starting a project-wide run,\
    \ and the settings that govern whether runs happen at all, reachable from any\
    \ page in the app and from a host app that has no AgentJobs routes to navigate\
    \ to."
  intent: "Dispatch is the action most worth having one tap away: the value of \"\
    start an agent on the next thing\" is highest at the moment you decide the current\
    \ thing is fine, and that moment happens on a task page or a dashboard, not on\
    \ the dispatch settings screen.\n\nThe settings belong there for a different reason.\
    \ Today they are a route, which is fine inside AgentJobs and useless in an embedded\
    \ host app \u2014 a host has no `/dispatch` page to navigate to, so \"turn dispatch\
    \ off\" from inside the app you are building means opening another tab. A menu\
    \ that travels with the component solves both surfaces at once.\n\nThe care needed\
    \ here is why this is its own task rather than one line in the shell. Dispatch\
    \ spends money on Jeff's machine unattended. A menu makes it cheaper to trigger,\
    \ which is the goal, and cheaper to trigger by accident, which is not \u2014 and\
    \ the same menu now also holds the switch that stops it."
  description: "Two menu entries, one task, because they are the same subject and\
    \ the second is what makes the first safe to offer.\n\n## Start a run\n\nA **Dispatch**\
    \ entry that starts task-161's project-wide dispatch: pick whatever is next by\
    \ the existing selection rules, and start a run on it.\n\nIt is a menu item, so\
    \ there is room for one line of state and none for a panel. It states what will\
    \ be dispatched and by which runner, and every refusal reaches the human as its\
    \ own sentence \u2014 `REFUSAL_ACTIONS` in `DispatchPanel.tsx` already maps each\
    \ guard code to what to do about it, and this entry reuses that map rather than\
    \ collapsing everything into \"dispatch failed\".\n\nWhen dispatch is unavailable\
    \ \u2014 not configured, machine switch off, sentinel file present, project not\
    \ enabled \u2014 the entry is visibly disabled and says which of those it is,\
    \ with a route to the settings. It is never silently missing: someone looking\
    \ for it should learn why it will not work, not conclude the feature does not\
    \ exist.\n\n**Confirmation.** Decide whether the entry dispatches on tap or asks\
    \ first, and record the decision with its alternative. The relevant facts: this\
    \ is one tap from anywhere including a phone in a pocket, a run costs money, and\
    \ task-162 may add a prompt-authoring step that supplies a natural confirmation\
    \ moment.\n\n## Reach the settings\n\nA **Dispatch settings** entry giving access\
    \ to what `DispatchSettings` already renders: whether this project is enabled,\
    \ which runner it names, and the state of the machine-wide switch and the sentinel\
    \ kill-switch file.\n\n**Inside AgentJobs** it may simply navigate to the existing\
    \ `/dispatch` route \u2014 there is a working page, and duplicating it inside\
    \ a popup would be a second implementation of a panel that already exists.\n\n\
    **In a host app** there is no such route, so the entry either renders the panel\
    \ in the popup or deep-links to the AgentJobs server in a new tab. Decide which,\
    \ and prefer whichever keeps one implementation of the panel rather than two.\
    \ If the answer differs between the two surfaces, say so explicitly \u2014 a menu\
    \ whose entry means \"navigate\" in one host and \"open a panel\" in another is\
    \ defensible, but only if it was chosen.\n\n**What the menu may never do** is\
    \ unchanged and is not softened by being closer to hand: the browser may point\
    \ a project at a runner a human already wrote into `~/.agentjobs/dispatch.yaml`,\
    \ and may switch dispatch on and off. It may never describe, create or edit a\
    \ runner. The API refuses it too.\n\n## The nav entry\n\nThe Dispatch link in\
    \ the primary nav stays unless there is a reason beyond tidiness to remove it,\
    \ and removing it is Jeff's call rather than the implementer's. The comment above\
    \ it in `App.tsx` argues the kill switch must not be buried in a menu; a menu\
    \ present on every page and reachable in one tap arguably satisfies that better\
    \ than a nav link that disappears on the project-less pages \u2014 but that argument\
    \ holds only once the menu really is on every page, which is task-168's business.\
    \ If you conclude the nav entry should go, raise it as a question rather than\
    \ deleting it."
  constraints: '- The Dispatch nav entry is not removed in this task. If it should
    be, that is a question for Jeff, not a decision.

    - The menu never invents, describes or edits a runner. It may only enable, disable,
    and point at what a human already configured.

    - Guard refusals surface individually, using the existing `REFUSAL_ACTIONS` mapping;
    no generic failure message.

    - One implementation of the settings panel. Reuse `DispatchSettings`; do not fork
    a popup-sized copy of it.

    - The human-clocked rule is not weakened. A human choosing this entry is a human
    act; nothing about being in a menu changes what may follow it.

    - No polling from the menu. Read dispatch availability when the menu opens.

    - The kill switch remains reachable in one interaction from any page.'
  out_of_scope: "- Dispatch from an embedded host app (task-143) \u2014 this task\
    \ makes the menu entries; that task settles whether a host may start runs at all.\n\
    - Authoring the dispatch prompt (task-162) \u2014 consume it if it has landed.\n\
    - Any change to dispatch guards, the config file format, or the runner.\n- Editing\
    \ runner definitions from the browser. Permanently out of scope, everywhere.\n\
    - Run output or progress inside the menu. Starting a run navigates to where runs\
    \ are already shown."
  context:
  - path: frontend/src/components/DispatchPanel.tsx
    why: DispatchSettings itself, REFUSAL_ACTIONS, the D1 decision that dispatch is
      not approve, and the rule that the browser may never describe a runner.
  - path: frontend/src/App.tsx
    why: DispatchSettingsPage shows how the panel is currently wired; useTaskDispatch
      shows how a dispatch call and its refusals are handled. The comment above the
      Dispatch nav link is the argument this task must answer.
  - path: tasks/agentjobs/task-161-project-level-dispatch.yaml
    why: What the start entry starts.
  - path: tasks/agentjobs/task-144-embed-security-posture.yaml
    why: What an embedded surface is permitted to do -- directly relevant to offering
      the enable/disable switch from a host app.
