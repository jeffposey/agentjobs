- id: 10
  ts: '2026-08-19T20:40:46.066286Z'
  actor: claude
  type: decision
  body: 'D5: The guard against shipping an unexercised example is a test that **dispatches**
    the unmodified example, against a shim installed on PATH under the name the example
    uses. `tests/test_dispatch_example_config.py`, commit 7363de0.


    The review''s question was not "is this argv wrong" but "why did nothing catch
    it". It was not caught because every check stopped at *does the example load*:
    it parsed, its groups resolved, and its flags all existed. The defect was that
    the argv was for a different mode than the runner declared, and no static reading
    of the file distinguishes those.


    **What was built.** The test writes `EXAMPLE_CONFIG` through `write_example_config`,
    makes the two edits a human makes -- the master switch and one project entry --
    and then drives it through the real path a dispatch takes: `assert_dispatch_permitted`
    -> `resolve_runner` -> `build_argv` -> `start` -> `poll_session` -> the handoff
    a person reads. One test asserts the `runners:` and `runner_groups:` blocks are
    byte-identical to what ships, so the fixture cannot quietly fix the thing under
    test.


    **The shim is deliberately unforgiving.** It prints a `backgrounded` id only when
    launched with `--bg` and *not* `-p`, and it prints a Remote Control URL in its
    transcript only when it was launched with `--remote-control`. So the final assertion
    is on the symptom a person would meet -- the parked run''s `ball_prompt` carries
    a link that works from a phone -- and not on a flag appearing in a list. **Verified
    by re-breaking it**: restoring the shipped argv fails six of these tests; restoring
    only the missing `--remote-control` fails exactly the phone-link one, with the
    message "Answer it wherever the session is open" in the diff.


    It is installed as `claude` on PATH rather than spawned as an absolute `sys.executable`,
    which also exercises `resolve_executable`''s Windows `.CMD` lookup -- the path
    `runner.py`''s own docstring records as never having been covered by the fake-runner
    tests.


    **Plus the half a shim structurally cannot answer.** `TestTheFlagsExistOnTheInstalledCli`
    reads the example''s flags out of the config, groups them by the program they
    are handed to, and checks each against that program''s own `--help` -- skipping
    where the program is absent. CI never has an agent CLI; a machine editing this
    example always does. That is the check for "a flag that does not exist", which
    the shim cannot make because a fake accepts anything.


    **Rejected: a static assertion over the argv** (session runners must contain `--bg`
    and not `-p`). Cheap, and it would have caught this one instance. Rejected because
    it is the same class of check that already passed -- it encodes today''s known
    defect as a rule and catches nothing about the next mode-and-invocation mismatch,
    and it would not have caught the missing `--remote-control` at all, since an argv
    without it is well-formed.


    **Rejected: run the real `claude` in the gate.** The most faithful thing possible,
    and unusable: it costs money per gate run, needs an authenticated CLI, cannot
    run in CI, and on a machine without the CLI it would skip -- leaving the example
    unexercised in exactly the state this decision exists to prevent. The real CLI
    is exercised by hand instead, once per change, with the evidence in the task record.


    **Rejected: asserting the composed argv against a fixed expected list.** Brittle
    against every future posture-flag change, and it tests `compose_argv`, which already
    has its own tests, rather than testing the example.'
  data:
    acceptance: sc-5
    commit: 7363de0
- id: 11
  ts: '2026-08-19T20:40:46.163918Z'
  actor: claude
  type: decision
  body: 'D6: The example ships no runner for a CLI this machine cannot check. The
    `codex` runner definition is gone; the disabled `codex` **member** stays, and
    a verified Claude batch runner takes over the batch demonstration.


    The review asked that every flag in the example be one confirmed to exist on the
    CLI it names. `codex` is not installed here (nor are gemini, cursor-agent, copilot,
    amp, opencode), so `argv: ["codex", "exec", "{prompt}"]` could not be checked
    by any means available. It was plausible, and plausible is what put `-p` on a
    session runner.


    **What ships instead:**


    - The group member `- runner: codex / enabled: false` stays, with its note rewritten
    to say the runner gets written once codex is installed and its flags checked.
    This costs nothing and gains something: it now demonstrates *two* first-class
    states at once -- a member that is disabled, and a member that names a runner
    which does not exist yet. Both were already supported and neither was shown.

    - `claude-review` (`mode: batch`) replaces it as the batch example, because removing
    codex would otherwise have left half the design -- batch mode -- named in the
    file and never illustrated. Its flags were run: `claude -p --output-format stream-json
    --verbose --max-budget-usd 1 --model haiku` exits 0.

    - A comment where the codex runner used to be says where a second vendor goes
    and why nothing is shipped for you.


    **Flags checked by running them, claude 2.1.235, 2026-08-19:**


    - `--effort <level>` exists (low, medium, high, xhigh, max) and composes with
    `--bg --remote-control`.

    - `--model haiku` resolves -- a `-p` run reports `modelUsage: claude-haiku-4-5-20251001`.
    The help text names only `fable`, `opus` and `sonnet` as example aliases, so this
    one was worth running rather than assuming.

    - **`--output-format stream-json` is refused without `--verbose`**: *"When using
    --print, --output-format=stream-json requires --verbose"*, and nothing starts.
    So design section 4''s batch row was itself an invocation that does not run. Corrected
    there in the same commit, along with a note that `-w` comes from `posture_flags`
    and must not be written into a template.

    - `-p` with `-w <name>` works, so the batch runner is compatible with the supervised
    posture''s worktree flag.


    **Rejected: ship `codex exec` with a comment saying it is unverified.** Keeps
    the cross-vendor illustration. Rejected because the example is copied, not read
    -- a caveat in a comment does not survive a copy-paste, and this is the one file
    where being wrong propagates to every new setup.


    **Rejected: install codex to verify it.** It would answer the question properly,
    and it is a machine change made to satisfy a documentation constraint, well outside
    this task. Adding a second vendor as working configuration is also explicitly
    out of scope on this task''s spec.


    **Rejected: drop the batch mode example entirely.** Simplest diff. Rejected because
    a config example that names two modes and demonstrates one teaches the wrong half,
    and `--max-budget-usd` -- the only spend ceiling dispatch has -- would then appear
    nowhere a person setting up would see it.'
