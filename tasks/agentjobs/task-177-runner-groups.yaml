- id: 3
  ts: '2026-08-19T19:23:11.297251Z'
  actor: claude
  type: decision
  body: "D1 (sc-4): Usage-limit headroom is NOT observable from any scriptable CLI\
    \ surface, so selection is built on declared order, `enabled`, and executable\
    \ resolution only.\n\n**Verified by running, on 2026-08-19, against the only agent\
    \ CLI installed on this machine (`claude` 2.1.235; `codex`, `gemini`, `cursor-agent`,\
    \ `copilot`, `amp`, `opencode` are all absent from PATH):**\n\n- `claude --help`\
    \ has no `usage`, `limits` or `quota` subcommand. The full command list is: agents,\
    \ auth, auto-mode, doctor, gateway, import, install, mcp, plugin, project, setup-token,\
    \ ultrareview, update.\n- `claude auth status --json` returns identity only \u2014\
    \ loggedIn, authMethod, apiProvider, email, orgId, orgName, subscriptionType.\
    \ No window, no percentage, no reset time.\n- `claude agents --json` returns live\
    \ sessions (pid, cwd, kind, startedAt, sessionId, name, status, state). No token\
    \ or cost accounting at all.\n- `/usage` is an interactive built-in, not a CLI\
    \ verb. Run as `claude -p \"/usage\" --output-format json` it is **not executed**\
    \ \u2014 it reaches the model as ordinary prompt text and comes back as a chat\
    \ reply saying it cannot be run that way. That call cost $0.24, which is itself\
    \ the point: the only way to ask is to pay for a model turn and still not get\
    \ the answer.\n- A `-p` run's `--output-format json` does report `usage`/`modelUsage`/`total_cost_usd`\
    \ \u2014 but that is *what this call consumed*, after the fact. It says nothing\
    \ about what is left, and it exists only once the money is already spent.\n\n\
    **The data does exist machine-locally, and reading it would be a bug.** `~/.claude.json`\
    \ holds a private key `cachedUsageUtilization` with `five_hour`/`seven_day` utilization\
    \ percentages, `resets_at` timestamps, and an `extra_usage` credit balance. Three\
    \ reasons it is unusable:\n\n1. **It is stale, badly.** On this machine right\
    \ now it was fetched 2026-08-10T22:09:36Z \u2014 8 days 21 hours ago \u2014 and\
    \ reports `five_hour.utilization: 98` against a window whose `resets_at` was 2026-08-10T22:09:59Z.\
    \ A dispatcher reading it today would skip the preferred runner because of a limit\
    \ that expired nine days ago. It is refreshed when an interactive session renders\
    \ /usage, which a dispatcher never does.\n2. **It is undocumented private state**\
    \ with internal codename keys (`nimbus_quill`, `iguana_necktie`, `omelette_promotional`,\
    \ `tangelo`) that can change in any patch release. Parsing another program's cache\
    \ file is not an interface.\n3. **It is account-wide, not runner-wide.** It cannot\
    \ distinguish the headroom of `claude-opus` from `claude-sonnet`, which is exactly\
    \ the discrimination a group needs.\n\n**Decision:** selection inputs are (a)\
    \ declared order within the group, (b) the member's `enabled` flag, (c) whether\
    \ the runner name is defined in `runners:`, (d) whether its argv[0] resolves on\
    \ PATH. All four are local, free, deterministic, and cannot hang. First eligible\
    \ member wins.\n\n**Rejected: probe the CLI for headroom before selecting.** There\
    \ is nothing to probe. The nearest thing costs a model call and returns prose.\n\
    \n**Rejected: read `cachedUsageUtilization` from `~/.claude.json`.** Cheap and\
    \ tempting, and it would have been wrong by nine days on the very machine it was\
    \ designed on. A stale answer here does not degrade \u2014 it inverts, sending\
    \ every dispatch to the fallback runner while the preferred one sits idle.\n\n\
    **Follow-up trigger, not a task yet:** implement limit-aware selection when a\
    \ first-party agent CLI ships a documented command that prints remaining headroom\
    \ as structured output (e.g. `claude usage --json`). Until then there is nothing\
    \ to build against."
  data:
    acceptance: sc-4
    cli_version: claude 2.1.235
    verified_on: '2026-08-19'
- id: 4
  ts: '2026-08-19T20:07:06.609844Z'
  actor: claude
  type: decision
  body: "D2: An exhausted group refuses the dispatch. It never falls back to a runner\
    \ outside the group.\n\nThe precedence ladder ends at `projects.<id>.runner`,\
    \ and design section 4's rule is fallback-and-say-so. That rule applies to a *resolution\
    \ hole* \u2014 no group applies at all, so the plain runner is reached normally.\
    \ It deliberately does **not** apply when a group applies and every member of\
    \ it is disabled, undefined, or has no executable on PATH.\n\n**Why:** a group\
    \ is the operator's statement about which runners are interchangeable *for this\
    \ kind of work*. Substituting one from outside it runs a model the requester did\
    \ not ask for, at a cost they did not choose \u2014 which is exactly reopen trigger\
    \ 2 of section 4, the trigger this task fired. Falling back would make the group\
    \ layer capable of causing the failure it was built to prevent.\n\n**Rejected:\
    \ fall back to the project's plain runner and log it loudly.** Consistent with\
    \ the rest of the ladder and genuinely tempting, because a refused dispatch is\
    \ visible and an expensive one is not. Rejected because the two failures are not\
    \ symmetric: a refusal costs a message and a hand edit, and a wrong-cost run costs\
    \ money and cannot be undone. The refusal names every candidate and why it was\
    \ passed over, so it is actionable rather than merely correct.\n\n**Verified on\
    \ this machine, not only in tests:** with `standard` holding a disabled `claude-standard`\
    \ and an enabled `codex` that is not installed, `agentjobs dispatch config --project\
    \ agentjobs` prints `refused (no_eligible_runner) - Runner group 'standard' has\
    \ no member that can run: claude-standard (disabled); codex (executable_not_found:\
    \ 'codex' is not on PATH.)`."
  data:
    acceptance: sc-3
- id: 5
  ts: '2026-08-19T20:07:06.678882Z'
  actor: claude
  type: decision
  body: "D3: The machine-wide default group is an explicit `default_group:` key, not\
    \ a group named `default`.\n\nThe task's illustrative YAML had a group literally\
    \ called `default`, described as \"what a dispatch gets when it names nothing\"\
    . Built instead as a separate top-level key naming any group.\n\n**Why:** a reserved\
    \ name is invisible magic. With it, renaming a group changes the machine's behaviour\
    \ and nothing in the file says so; two people can disagree about whether `default`\
    \ is special; and there is no way to have a group called `default` that is merely\
    \ one option among several. An explicit key does the same job, reads as configuration,\
    \ and can be commented out to put every project back on its own explicit `runner:`\
    \ or `group:`.\n\n**Rejected: the magic name.** Shorter by one line, and the line\
    \ it saves is the one that explains what is happening.\n\n**Consequence stated\
    \ in the design so it is not rediscovered as a bug:** `default_group` sits above\
    \ `projects.<id>.runner` on the ladder, so adding it takes effect for every project\
    \ that has not named a group of its own \u2014 including projects that name a\
    \ plain runner. That is what a machine default means; a project that wants its\
    \ runner regardless should name its own group."
  data:
    acceptance: sc-2
- id: 6
  ts: '2026-08-19T20:07:06.754797Z'
  actor: claude
  type: decision
  body: "D4: Fixed an unrelated pre-existing gate failure on this branch rather than\
    \ routing around it, because sc-7 could not otherwise be met.\n\n`poetry run python\
    \ scripts/check.py` could not collect the test suite **at all** on a clean checkout\
    \ of main in this worktree: `ModuleNotFoundError: No module named 'scripts.bench'`,\
    \ deterministically, before my first edit. Confirmed by stashing the branch and\
    \ running the full suite on the untouched tree.\n\n**Mechanism**, which is worth\
    \ recording because it will recur: `scripts/build_release.py` opens with `from\
    \ scripts.build_frontend import ...` under a try/except. `tests/test_frontend_packaging.py`\
    \ execs that file by path with the repository root off `sys.path`. On Windows\
    \ the `import scripts` half succeeds anyway \u2014 against **pywin32's** `site-packages/win32/scripts`,\
    \ which pywin32's `.pth` puts on the path \u2014 so the fallback branch works,\
    \ nobody notices, and `sys.modules['scripts']` is left pointing at pywin32 for\
    \ the rest of the session. `tests/test_performance_budgets.py` is collected after\
    \ it, inserts the repo root, and does `from scripts.bench import build_corpus`,\
    \ which now resolves into a directory with no `bench` in it. Collecting the two\
    \ files in that order reproduces it in isolation; reversing the order does not.\n\
    \n**Fix:** `test_performance_budgets.py` now loads `scripts/bench.py` by file\
    \ location, which is already how `test_frontend_packaging.py` and `test_worktree_bootstrap.py`\
    \ read repository scripts. One file, tests only, in its own commit (`d98e00a`).\n\
    \n**Rejected: `sys.modules.pop('scripts', None)` before the import.** Shorter,\
    \ and it makes one test responsible for cleaning up after another \u2014 the next\
    \ test to import a repository script by package name breaks it again.\n\n**Rejected:\
    \ leaving it and reporting sc-7 as blocked.** The gate is the acceptance criterion;\
    \ a branch that cannot run it is not reviewable. The fix is two lines of test-only\
    \ change with existing precedent in the same directory.\n\n**Worth a follow-up\
    \ task, not filed:** `scripts/build_release.py`'s try/except is the actual root\
    \ cause and it is still there \u2014 it will silently take the pywin32 branch\
    \ again for anything else that imports it by path. Nothing depends on that today."
  data:
    acceptance: sc-7
    commit: d98e00a
- id: 7
  ts: '2026-08-19T20:08:15.544523Z'
  actor: claude
  type: progress
  body: "Runner groups built end to end on `feat/task-177-runner-groups`, branched\
    \ from main at 4f40173. Five commits, gate green.\n\n**What ships**\n\n- `runner_groups:`\
    \ in `~/.agentjobs/dispatch.yaml` \u2014 a named, ordered list of members. A member\
    \ is a bare runner name, or a mapping with `enabled: false` and a free-text `note`\
    \ saying why. Members may name a runner that does not exist yet; that is deferred\
    \ to selection, exactly like a project naming an unknown runner, so \"write the\
    \ second option now, enable it once you have set it up\" is a legal state rather\
    \ than a file that will not load.\n- `default_group:` \u2014 the machine-wide\
    \ group (D3).\n- `projects.<id>.group` \u2014 a project's own group, beside the\
    \ existing `runner`.\n- **Selection**: first member that can run, wins. Skipped\
    \ for `enabled: false`, for naming a runner absent from `runners:`, or for `argv[0]`\
    \ not resolving on PATH. Nothing is probed and nothing is timed (D1). Deterministic\
    \ by construction.\n- **Precedence**, narrowest first: dispatch group \u2192 *(unbuilt:\
    \ dispatch profile)* \u2192 project group \u2192 *(unbuilt: machine profile)*\
    \ \u2192 `default_group` \u2192 `projects.<id>.runner`. Section 4's ladder with\
    \ the profile rungs reserved rather than occupied.\n- **Audit**: the `dispatch`\
    \ log entry gains `selection` \u2014 group, which rung named it, and every member\
    \ in declared order with its verdict. Members after the winner are eligible with\
    \ no reason, because \"considered and not reached\" is a different fact from \"\
    considered and rejected\".\n- **Naming a group on a dispatch**: `POST /tasks/{id}/dispatch\
    \ {\"group\": ...}` and `agentjobs dispatch run --group`. The response now reports\
    \ the runner and group that were chosen.\n- **CLI**: `dispatch enable --group`,\
    \ group listing in `dispatch config` with per-member on/off and notes, and per-candidate\
    \ skip reasons when asked about a project.\n- **`agentjobs dispatch example`**\
    \ \u2014 sc-5. Prints a commented starting config; `--write` writes it and refuses\
    \ if anything is there. Switched off at every level, so `--write` cannot leave\
    \ a machine able to dispatch that was not able to before.\n- **`docs/agent-dispatch-design.md`\
    \ section 4** rewritten as one mechanism (sc-6), plus section 3's config example\
    \ and nouns table, section 6 gates 2 and 3, and a section 13 entry.\n\n**Selection\
    \ sits inside `assert_dispatch_permitted`, after all four gates**, never around\
    \ them. A test names a group with the `DISPATCH_DISABLED` sentinel in place and\
    \ still gets `sentinel` back.\n\n**Backwards compatibility, asserted rather than\
    \ intended.** A flat config loads, resolves and dispatches unchanged, exposes\
    \ no groups, and writes **no `selection` key at all** \u2014 asserted on the entry's\
    \ `data`, not on prose. `TestFlatConfigIsUntouched` in `tests/test_dispatch_config.py`,\
    \ plus `test_a_flat_resolution_writes_no_selection_key_at_all` in `tests/test_dispatch_runner.py`.\n\
    \n**Verified beyond the suite**, on this machine, through the real CLI against\
    \ a throwaway `AGENTJOBS_HOME`:\n\n- `dispatch example --write` wrote the config;\
    \ running it again refused and left the file untouched.\n- With the example armed,\
    \ `dispatch config` listed all three groups, marked `standard` as the machine\
