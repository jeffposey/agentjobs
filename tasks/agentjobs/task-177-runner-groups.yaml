    \ \u2014 \"print response and exit\". Two consequences:\n\n1. **No `--remote-control`\
    \ means the session is not steerable from another device.** That is the whole\
    \ reason session mode was chosen over batch (design section 4, verified end to\
    \ end 2026-08-18). Jeff drives sessions from his phone; a scaffold that drops\
    \ it removes the feature from every setup that copies it.\n2. `-p` on a runner\
    \ declared `mode: session` asks the CLI for print-and-exit while AgentJobs' session\
    \ machinery expects a backgrounded session whose id it captures and polls.\n\n\
    This is the config every new setup inherits, so it is the one file where being\
    \ wrong propagates.\n\n## What was verified, and what was not\n\nThe end-to-end\
    \ verification in your handoff covered `dispatch example --write`, `dispatch config`,\
    \ `dispatch config --project`, and both skip paths. Those are all *configuration*\
    \ surfaces. **No scaffolded runner was ever executed.** A recommended config that\
    \ parses is not a recommended config that runs.\n\n## What to do\n\n1. Correct\
    \ the scaffold's session runners to match the design's session invocation. Do\
