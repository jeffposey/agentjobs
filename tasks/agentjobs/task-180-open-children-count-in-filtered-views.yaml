- id: 5
  ts: '2026-08-20T20:23:10.574616Z'
  actor: claude
  type: decision
  body: "The spec's diagnosis was only half the story. Reproduced against the live\
    \ server on 8876 before changing anything, and the observed symptom does not come\
    \ from the subset iteration the spec named.\n\nTwo independent defects produce\
    \ the same `open_children_count: 0`:\n\n1. **`GET /search` never computed the\
    \ field at all.** Its `response_model` was `List[Task]` \u2014 the bare stored\
    \ record, no dependency facts. `TaskRead` (which carries them) is only used by\
    \ `GET /tasks`. So the key was simply absent from every search row, and `mcp/summaries.task_summary`\
    \ coerced the absence to `0` with `value if value is not None else 0`. **This\
    \ is what the reporter saw.** Note it also defaulted `actionable` to `False`,\
    \ so the spec's premise that \"actionable stays correct\" does not hold on the\
    \ search path either \u2014 it was right for the wrong reason.\n\n2. **`TaskManager.dependency_facts(subset)`\
    \ genuinely was page-relative**, as the spec says. Every caller in this repo happens\
    \ to pass the full corpus or nothing \u2014 `_read_tasks` called `dependency_facts()`\
    \ with no argument \u2014 so no shipped view was wrong because of it. It was a\
    \ loaded trap, not the live bug.\n\n**On whether the subset argument was a deliberate\
    \ cost trade: it was not.** `dependency_facts` already calls `self._open_children()`\
    \ unconditionally three lines above the subset loop, to compute `actionable`,\
    \ and `_open_children()` walks the whole corpus. The corpus was already being\
    \ read on every one of these calls. The subset loop bought nothing.\n\nRejected\
    \ alternative: making the field nullable and omitting it from views that \"cannot\
    \ compute it honestly\". Rejected because no such view exists \u2014 every request\
    \ already parses the corpus inside a `corpus_snapshot()` scope, so an honest count\
    \ is free everywhere. Nullability would have documented a constraint that is not\
    \ real.\n\nKept the constraint's other half, though, where it *is* real: `task_summary`\
    \ and `summaries.dependency_facts` no longer invent a `0` for a record that lacks\
    \ the key. They pass `None` through and the MCP schemas allow null. That coercion\
    \ is the line that turned a missing field into a confident wrong answer, and deleting\
    \ the field's absence at one surface does not stop the next surface reintroducing\
    \ it."
  data:
    operation:
      id: 3f1c9a2e-7b64-4d18-9f05-2a6e8c1d4b70
      kind: log_append
      fingerprint: 31cd3fad31e1118251ec54d3ed3c7025
- id: 6
  ts: '2026-08-20T20:25:33.706630Z'
  actor: claude
  type: progress
  body: "## Parse-count measurement (sc-2): zero cost, measured not argued\n\nTwo\
    \ servers against the identical 194-task corpus \u2014 8876 running `main`, 8899\
    \ running this branch (`agentjobs serve --port 8899` from the worktree). Three\
    \ passes per path, last reported, so a cold filesystem cache is not the number.\
    \ `X-Task-Parses`:\n\n| path | main | branch |\n| --- | --- | --- |\n| `/search?q=dispatch`\
    \ | 194 | **194** |\n| `/tasks` | 194 | **194** |\n| `/tasks?priority=high` |\
    \ 194 | **194** |\n\n**No path pays anything.** The constraint asked that a list\
    \ not be made to pay for a full corpus parse \u2014 it is not, because every request\
    \ already parses the corpus exactly once inside `storage.corpus_snapshot()`, and\
    \ both `_open_children()` and the newly-added `dependency_facts()` on `/search`\
    \ are served from that snapshot. 194 is the corpus size: one parse per file per\
    \ request, which is what it already was.\n\nWall-clock moved 291\u2192255ms on\
    \ `/search`, 353\u2192293ms on `/tasks`. That is noise on a single sample, not\
    \ a claimed improvement; the parse count is the number that means the same thing\
    \ on every machine.\n\n## Same measurement, the field itself\n\n`task-160-dispatch-phase-two`\
    \ (9 open children), read from each server:\n\n| surface | main | branch |\n|\
    \ --- | --- | --- |\n| `/search` | key absent entirely | **9** |\n| `/tasks` |\
    \ 9 | 9 |\n| `/tasks?priority=high` (children excluded by the filter) | 9 | 9\
    \ |\n\nAnd through the MCP surface the bug was reported on, `tasks_search` \u2192\
    \ `summaries.task_summary`:\n\n- against `main`: `open_children_count=None` \u2014\
    \ null now rather than the old invented `0`, because the summary-layer fix is\
    \ in the worktree while the service is not\n- against the branch: `open_children_count=9`\n\
    \n## Changes\n\n- `manager.dependency_facts` \u2014 count from the corpus-wide\
    \ `_open_children()` already computed for `actionable`; the subset loop is gone.\
    \ Docstring states what `tasks` does and does not scope.\n- `api/models.TaskRead.from_tasks(manager,\
    \ tasks)` \u2014 one enrichment path for every row-returning read surface, replacing\
    \ the private `_read_tasks` in `routes/tasks.py`.\n- `api/routes/search.py` \u2014\
    \ `response_model=List[TaskRead]`. This is the actual fix for the reported bug.\n\
    - `mcp/summaries.py` \u2014 a missing `open_children_count` passes through as\
    \ `None` instead of `0`, in both `task_summary` and `dependency_facts`; both JSON\
    \ schemas widened to `[\"integer\",\"null\"]`. `actionable` keeps its `False`\
    \ default, as the spec puts it out of scope.\n- Regenerated `frontend/openapi.json`\
    \ and the API client \u2014 `/search` now types as `Array<TaskReadOutput>`. `DependencyState.tsx`\
    \ already guarded with `?? 0`, so no component change.\n\n## Tests (sc-1)\n\n\
    Five added; each verified to fail against the unpatched source before being kept:\n\
    \n- `test_manager.py::test_dependency_facts_counts_children_the_subset_left_out`\
    \ \u2014 fails as `assert 0 == 3` on old code, reproducing the reported shape\
    \ exactly: `DependencyFacts(..., actionable=False, open_children_count=0)`.\n\
    - `test_manager.py::test_dependency_facts_reports_zero_children_as_zero` \u2014\
    \ the counterpart, so the fix cannot be \"always return something nonzero\".\n\
    - `test_api.py::test_search_reports_open_children_outside_the_result_set` \u2014\
    \ `KeyError` on old code.\n- `test_api.py::test_filtered_list_reports_open_children_outside_the_filter`\
    \ \u2014 passes on old code too; `/tasks` was already correct, and this pins it\
    \ so it stays that way.\n- `test_api.py::test_zero_open_children_means_zero` \u2014\
    \ `KeyError` on old code.\n- `test_mcp_read_tools.py` \u2014 two: absence is null,\
    \ and a real 0 is not turned into a null on the way through.\n\nThe API fixture\
    \ titles the parent \"Zebra\" and its children \"Quokka\", and gives them different\
    \ priorities, so neither the search nor the priority filter can return a child.\
    \ Without that separation the test would pass on the broken code.\n\n## Not done,\
    \ deliberately\n\n`unblocks_count` and `needs_cycles` in the same function are\
    \ still derived from the `tasks` argument and so are still page-relative \u2014\
    \ the identical trap, one line away. Every caller in this repo passes the full\
    \ corpus or nothing, so neither is wrong today. Left alone because this task's\
    \ scope is the child count, and making cycle detection corpus-wide would change\
    \ what `validation.py` reports about a subset. Noted in the function's docstring\
    \ pointing at task-180 so the next reader finds it rather than rediscovering it.\
    \ Worth a follow-up task if you want it; I have not filed one."
