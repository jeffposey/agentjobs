    \ ...sandbox has uncommitted changes (README.md). ... Current HEAD is 05c2d67.`\
    \ Named the file that was actually blocking it and did not blame the task record\
    \ beside it. This is sc-2.\n\n## Acceptance\n\nsc-1, sc-2 and sc-3 all met; sc-3\
    \ is the decision entry above this one.\n\nNothing left over. No follow-up filed."
