- id: 6
  ts: '2026-08-20T00:40:40.391688Z'
  actor: claude
  type: note
  body: "A second way the tree is dirty for reasons nobody edited anything, observed\
    \ on `main` at 994037e on 2026-08-19. Not a request to widen this task \u2014\
    \ evidence for whoever is choosing between deleting the spawn-time re-check and\
    \ excluding paths from `working_tree_clean`.\n\nRunning `poetry run python scripts/check.py`\
    \ leaves three files reported as modified by `git status --porcelain`:\n\n   \
    \ frontend/src/api/generated/@tanstack/react-query.gen.ts\n    frontend/src/api/generated/index.ts\n\
    \    frontend/src/api/generated/sdk.gen.ts\n\nThey are **byte-identical to HEAD**:\
    \ `git diff --numstat` on them is empty, and so is `git diff --ignore-all-space\
    \ --numstat`. The client-verification step regenerates them in place, which changes\
    \ their stat information; git's cached stat no longer matches, so `status` reports\
    \ them modified until something forces a content comparison. `git update-index\
    \ --refresh` did not clear it here; `git checkout --` on the three paths did,\
    \ and was safe precisely because the content was provably unchanged.\n\nWhy it\
    \ matters to this task: `working_tree_clean` shells out to `git status --porcelain`\
    \ and treats any output as dirty. So **running the gate \u2014 the thing ENGINEERING.md\
    \ requires before every commit \u2014 is by itself enough to make the next dispatch\
    \ refuse `dirty_tree`**, with no uncommitted work anywhere. That is a third self-inflicted\
    \ case, alongside the claim-writes-the-task-file case this task is named for and\
    \ the `dispatch_result` case logged from task-186.\n\nThe reading it supports:\
    \ an exclusion list keyed on paths would not have caught this one, because these\
    \ are ordinary source files that a human editing them really should block a dispatch.\
    \ What all three cases share is that the \"change\" is not a human's in-flight\
    \ work. Whether that is better served by dropping the second check, or by asking\
    \ git a question that ignores stat-only differences (`git status --porcelain`\
    \ after a `git diff` refresh, or `git diff --quiet HEAD`), is the call this task\
    \ has to make \u2014 and it is worth checking whether `git diff --quiet HEAD`\
    \ would have reported all three cases correctly, since it compares content rather\
    \ than trusting the stat cache."
