  body: "Implemented and verified on `fix/task-182-clean-tree-check`. Two commits:\
    \ `22fbc6d` (fix + tests), `8ece044` (docs).\n\n## What changed\n\n- `src/agentjobs/dispatch/runner.py`\
    \ -- `working_tree_clean` is now a thin predicate over a new `uncommitted_paths(project_root,\
    \ *, ignore=())`, which parses `git status --porcelain -z` and drops anything\
    \ under an ignored directory. Porcelain paths are repo-relative wherever git ran,\
    \ so they are resolved against `rev-parse --show-toplevel` before the containment\
    \ test; comparison is `os.path.normcase`d because this runs on Windows.\n- `src/agentjobs/dispatch/guards.py`\
    \ -- the pre-claim gate calls `uncommitted_paths(project.root, ignore=[manager.storage.tasks_dir])`\
    \ and names up to five offending paths in the `DirtyTreeError`.\n- `src/agentjobs/dispatch/runner.py`\
    \ `_tree_is_clean` -- same exclusion at the spawn-time re-check.\n- `docs/agent-dispatch-design.md`\
    \ -- \xA76 carries the exclusion and its cost; the task-186 containment section\
    \ no longer says the backstop is inert, and states what it still cannot see.\n\
    - `src/agentjobs/dispatch/scaffold.py` -- the same note beside `require_clean_tree`\
    \ in the scaffolded config.\n\n## Verification\n\n**Gate green.** `poetry run\
    \ python scripts/check.py`, exit 0: 1921 pytest in 4m03s, 145 Vitest, 15 Playwright.\n\
    \n**The new tests fail without the fix.** Stashed the two source files and re-ran:\
    \ 5 failures, including the pre-existing `TestWorkingTree::test_git_head_is_recorded_on_the_dispatch_entry`\
    \ -- which fails once the fixture stops pretending this repository gitignores\
    \ `tasks/`. The end-to-end one fails at the *spawn-time* check and the rest at\
    \ the pre-claim gate, so both call sites are demonstrably load-bearing.\n\nNew\
    \ coverage:\n- `tests/test_dispatch_guards.py::TestTaskRecordsInsideTheDispatchedRepo`\
    \ -- five tests: a task file dispatch already modified, a task file the claim\
    \ creates, a completed run not blocking the next dispatch, uncommitted work outside\
    \ `tasks/` still refusing, and the refusal naming README.md rather than the task\
    \ file.\n- `tests/test_dispatch_runner.py::TestUncommittedPaths` -- seven unit\
    \ tests on the primitive, including a filename with a space, a rename, git that\
