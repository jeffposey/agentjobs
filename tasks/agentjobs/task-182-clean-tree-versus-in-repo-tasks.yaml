- id: 7
  ts: '2026-08-20T00:58:55.689627Z'
  actor: claude
  type: decision
  body: 'Decision: exclude the project''s tasks directory from the clean-tree check,
    at both call sites. Keep both checks.


    `uncommitted_paths(project_root, ignore=[manager.storage.tasks_dir])` replaces
    the bare `working_tree_clean(project_root)` at `guards.py` (pre-claim) and in
    `runner._tree_is_clean` (spawn-time). The ignore list comes from the storage the
    manager actually writes through rather than from `Project.tasks_dir()`, so it
    cannot disagree with where the files really land.


    ## Why not log entry 2''s recommendation, which was to delete the spawn-time tree
    check


    That recommendation was written at 20:54 and is sound about the front half. Log
    entry 4, at 00:21, falsifies it as a complete fix: the terminal `dispatch_result`
    entry is written by the dispatcher *after* the run''s last commit, so a finished
    run always leaves exactly one uncommitted task file behind. That dirt is met by
    the **pre-claim** gate of the *next* dispatch -- the one entry 2 correctly identifies
    as the meaningful check and deliberately leaves alone. Deleting only the spawn-time
    check would have fixed one dispatch and refused every one after it.


    Verified live rather than reasoned about: a real run through `dispatch_task` left
    `M tasks/task-001.yaml` and nothing else. Without the exclusion, the CLI dispatch
    of the next task was refused `dirty_tree` naming that file.


    So the exclusion is not the alternative to entry 2''s fix; it is the only option
    that covers both ends, which is what entry 4 said. Given it is in place, the spawn-time
    check no longer misfires, and deleting it then buys nothing while giving up a
    cheap re-check. Both stay.


    ## What this costs


    **A human''s genuinely uncommitted hand edit to a task file no longer blocks a
    dispatch.** That is entry 2''s objection to the exclusion and it is correct. Taken
    deliberately, because there is no version of this that keeps the tasks directory
    meaningful at the pre-claim gate: the leftover `dispatch_result` sits in that
    directory unconditionally after every completed run, so a check that counts it
    fires every time, and a check that fires every time is switched off rather than
    heeded -- which is exactly what the task-177 session did to proceed.


    What survives: everything outside the tasks directory is inspected exactly as
    before, and that is where an agent''s code commits land. Pinned by `test_uncommitted_work_outside_the_tasks_directory_still_refuses`
    and, separately, by the assertion that the refusal names README.md and not the
    task file.


    ## Rejected: commit the claim before the re-check


    As entry 2 said -- dispatch would author commits in the user''s repository on
    its own initiative. It also only fixes the front half, for the same reason as
    above.


    ## Rejected: exclude only the task being dispatched


    Narrower, and it would preserve the check for other task files. It does not work:
    the dirt blocking the next dispatch is the *previous* task''s file, not this one''s.


    ## Also changed, because it is the reason nobody caught this


    The three dispatch test fixtures wrote `.gitignore` containing `tasks/`, with
    a comment claiming it mirrors this repository''s own .gitignore. It does not.
    `agentjobs init` never ignores task YAML (`_ensure_gitignore` adds only `.agentjobs/agentjobs.db`),
    and this repository tracks 192 files under `tasks/`. That fiction is what hid
    the defect from 1921 tests. The fixtures now ignore only `.agentjobs/`, which
    turns the pre-existing gate tests into real coverage -- `test_git_head_is_recorded_on_the_dispatch_entry`
    fails without the fix once the fixture is honest.


    ## Refusal message now names the paths


    With an exclusion in play, "has uncommitted changes" plus a `git status` showing
    only ignored task files explains nothing. The `DirtyTreeError` now lists up to
    five offending paths.


    ## Parser note


    `git status --porcelain -z`, not the newline form. The newline form quotes and
    escapes unusual filenames, and a path misparsed there would be dropped silently
    from a safety check. Pinned by tests for a filename with a space and for a rename
    (`-z` emits the original path as a second field, which must not be read as a second
    change). Git being unreadable returns `None`, distinct from "nothing uncommitted",
    and stays on the refusing side.'
  data: {}
