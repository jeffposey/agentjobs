  type: progress
  body: "Built on `feat/task-184-groups-in-dispatch-ui`, two commits, gate green (10/10,\
    \ 186s).\n\n**34a7262 \u2014 the change.**\n\n*API.* `_state()` in `src/agentjobs/api/routes/dispatch.py`\
    \ already called\n`assert_dispatch_permitted` and threw the resolution away. It\
    \ now keeps it, and\n`DispatchStateView` carries three new fields: `resolved_runner`\
    \ (what would actually\nstart), `resolved_group` (the group that chose it, null\
    \ for a flat config) and\n`resolved_from` (`project` / `machine` / `project_runner`).\
    \ Sent rather than derived in\nthe browser, because a page that re-implemented\
    \ the precedence ladder would be the one\nplace able to disagree with the dispatcher\
    \ about what runs. All three are null when a\ngate refuses \u2014 no answer rather\
    \ than a stale one. `openapi.json` and the generated\nclient are regenerated.\n\
    \n*Frontend*, all in `DispatchPanel.tsx` plus three lines of wiring in `App.tsx`:\n\
    \n- the THIS PROJECT gate tile reads `group: default \u2192 claude-opus-5`, with\n\
    \  `(machine default)` when nothing in the project chose it. It still reads\n\
    \  `runner: <name>` and still reads `no runner chosen` when those are the true\
    \ answers.\n- a **Group** pulldown sits beside the Dispatch button, rendered only\
    \ when the machine\n  defines groups. Its first option spells out what the project\
    \ would resolve to and is\n  not sent; picking a group sends it. `onDispatch`\
    \ now takes a `DispatchOptions` object\n  (`{group?, note?}`) instead of a bare\
    \ note \u2014 that is the shape task-307's posture\n  drops into with no further\
    \ change to the call.\n- the sentence beside the button names the resolved member\
    \ and its group. Once a group\n  is picked for this run it stops naming a member\
    \ and names the group instead: the\n  browser holds no member list, so guessing\
    \ which member wins would be the one sentence\n  there that is reliably wrong.\n\
    - the enable control lists this machine's groups *and* its runners in one select,\
    \ and\n  preselects what the project already uses.\n\n**7f86905 \u2014 `scripts/dispatch_groups_sandbox.py`**,\
    \ the review sandbox. Two servers,\nbecause a runner group is defined per machine:\
    \ 8900 has groups, 8901 has none.\n\n**Verified.**\n\n- 14 new Python tests in\
    \ `tests/test_dispatch_api.py` (`TestDispatchStateWithGroups`,\n  `TestBrowserToggleAgainstGroups`),\
    \ 20 new jsdom tests in `DispatchPanel.test.tsx`.\n  Every one asserts a rendered\
    \ sentence or the value a click acts on, never the presence\n  of markup.\n- **In\
    \ a real browser, against the sandbox.** Picked group `big` on the seeded task\
    \ and\n  pressed Dispatch. The run's `dispatch` entry records\n  `selection: {\"\
    group\": \"big\", \"source\": \"dispatch\"}` and `runner: claude-sonnet-5` \u2014\
    \n  `big`'s first member, where the project's own `default` group would have chosen\n\
    \  `claude-opus-5`. That is sc-2 proven through the whole stack rather than at\
