- id: 7
  ts: '2026-08-23T23:11:43.523357Z'
  actor: claude
  type: question
  body: "**Found while establishing sc-3, out of scope here, and worth its own task:\
    \ on a machine\nwith a `default_group:`, `dispatch enable --runner` is a silent\
    \ no-op for every project,\nincluding one that names a plain `runner:` and no\
    \ group of its own.**\n\nCase [6] of the experiment, against the throwaway home:\n\
    \n```\ndefault_group: big\nprojects.sandbox: {enabled: true, runner: claude}\n\
    \nPOST /dispatch/enable {\"runner\": \"codex\"}   ->  200\nprojects.sandbox in\
    \ the file, after         ->  {enabled: true, runner: claude}\n```\n\n`_already_grouped()`\
    \ returns true whenever `config.default_group` is set \u2014 for any\nproject\
    \ \u2014 so the branch that writes `entry[\"runner\"]` is never reached and the\
    \ requested\nrunner is dropped. Its docstring gives the reasoning, and the reasoning\
    \ is sound as far\nas it goes: `dispatch enable` should not *demand* a runner\
    \ for a project that is about\nto resolve through a group. It does not follow\
    \ that an explicitly requested one should\nbe *discarded*. The CLI has the same\
    \ behaviour, since both surfaces call the same\nfunction.\n\nNothing is lost \u2014\
    \ the group still decides, and the resolved runner is correct \u2014 so this\n\
    is a lie about what happened rather than a wrong outcome. It is invisible on this\n\
    machine today because `~/.agentjobs/dispatch.yaml` has no `default_group:`; it\
    \ would\nappear the moment one is added.\n\nThe fix is roughly `elif runner is\
    \ not None or not _already_grouped(entry, config):`,\nplus a decision about whether\
    \ a written-but-outranked `runner:` should be reported\nsomewhere. I did not make\
    \ it: it changes CLI behaviour, sc-3 does not ask for it, and\n`src/agentjobs/dispatch/config.py`\
    \ is the file task-021 is actively working. **Should I\nfile it?** I have not,\
    \ to avoid filing against another session's live file without being\nasked.\n"
  re: 6
