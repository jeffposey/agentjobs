- id: 6
  ts: '2026-08-23T23:11:30.935794Z'
  actor: claude
  type: decision
  body: "**sc-3, established by experiment before anything was changed: the round-trip\
    \ cannot\ndrop or change a project's group. So the \"fix it if it can\" clause\
    \ does not fire, and\nno config-layer behaviour was changed.**\n\nThe experiment\
    \ drove the real HTTP endpoints the browser calls \u2014 `POST\n/dispatch/disable`\
    \ and `POST /dispatch/enable` \u2014 against a throwaway `AGENTJOBS_HOME`\ncontaining\
    \ two runners, two groups and a project naming `group: fast`. Nothing touched\n\
    `~/.agentjobs/dispatch.yaml`. Six cases, and the file was read back after each:\n\
    \n| after | `projects.sandbox` in the file |\n|---|---|\n| disable | `{enabled:\
    \ false, group: fast}` |\n| enable `{runner: claude}` (the value the old select\
    \ preselected) | `{enabled: true, group: fast}` |\n| enable `{runner: codex}`\
    \ (a deliberate pick) | `{enabled: true, group: fast}` |\n| enable `{group: big}`\
    \ | `{enabled: true, group: big}` |\n| plain project, no groups defined, enable\
    \ `{runner: codex}` | `{enabled: true, runner: codex}` |\n\n`set_project_enabled`\
    \ guards the write with `_already_grouped`, so a `runner:` sent\nwhile a `group:`\
    \ is present is **not written**. The group survives a round-trip intact\nand the\
    \ resolved runner never moves. The concern the task was filed with \u2014 that\n\
    enabling from the browser writes `runner:` over a `group:` \u2014 is the opposite\
    \ of what\nhappens. The three cases now live as `TestBrowserToggleAgainstGroups`.\n\
    \n**What is real is the inverse, and it is what got fixed.** The endpoint declines\
    \ that\nrunner with a **200 and no message**, and the old control had no way to\
    \ express a group\nat all: it rendered a Runner select preselected on `available_runners[0]`\
    \ (because\n`state.runner` is null for a grouped project), so a human could pick\
    \ `codex`, press\nEnable, be told nothing, and have the project go on running\
    \ `claude` from group `fast`.\nA control that reports success and changes nothing\
    \ is the half of point 3 worth fixing,\nand offering the groups in the same select\
    \ is the fix \u2014 entirely in the browser, with\nthe config layer untouched.\n\
    \n*Rejected:* changing `_already_grouped` so an explicitly requested runner is\
    \ always\nwritten. It is a three-line change and it would remove a real oddity\
    \ \u2014 case [6] below \u2014\nbut it alters CLI behaviour as well as browser\
    \ behaviour, it is not needed for anything\nsc-3 asks, and `src/agentjobs/dispatch/config.py`\
    \ is the file task-021 is actively\nworking. Out of scope, and recorded as a question\
    \ instead.\n"
