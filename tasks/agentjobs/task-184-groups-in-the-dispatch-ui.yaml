    \ `Closed \u2014 group: default`, and the\n  enable control came up labelled \"\
    Runner or group\", preselected on `group: default`.\n- The flat machine on 8901:\
    \ no Group pulldown, `runner: claude-sonnet-5`,\n  \"Runners are defined by hand\u2026\
    \", and the same sentence beside the button as before.\n- `frontend/e2e/dispatch.spec.ts`\
    \ passes **untouched**, including its assertion that the\n  runner select's `<option\
    \ value>` is the bare name. That is the strongest sc-4 evidence\n  available:\
    \ a third-party check of the flat case that I did not write and did not edit.\n"
