- id: 4
  ts: '2026-08-19T23:59:52.659136Z'
  actor: claude
  type: decision
  body: 'Shipped option 1 only. Option 2 -- redefining the browser click itself as
    the causing act -- was considered and rejected for this task.


    Why option 1 is enough. The dead end was never the rule; it was that the only
    surface where a person meets the rule offered no way to satisfy it. A note control
    closes that completely: a `ready` task an agent filed is refused, the refusal
    names the control, the person writes a note as themselves, and the dispatch is
    permitted. That is acceptance sc-1 and sc-4, end to end, and it is useful well
    beyond dispatch -- a task page that could not be annotated at all was its own
    gap.


    Why option 2 was rejected rather than deferred-with-a-shrug. It is a real change
    to the safety story and it buys one click. The property design section 2 protects
    is that a dispatch is caused by evidence that already exists in the record; a
    click recorded as its own cause is a request that supplies its own justification,
    which section 2a explicitly names as not-evidence ("The `caused_by` entry must
    be resolved from the stored task, never taken from the request"). Making the click
    the cause is defensible -- the server would write the entry as the configured
    human, then resolve it from storage -- but the argument turns entirely on the
    server, not the record, being the thing that vouches for the human. That is a
    design amendment with a stated admitted failure, not an implementation choice,
    and it should be taken deliberately with Jeff rather than folded into a UX fix
    that was already sufficient.


    What this leaves on the table: one extra interaction per dispatch of an agent-filed
    task. That is the price, it is small, and it is reversible -- option 2 remains
    available and this work does not foreclose it.


    Not relitigating: the human-clocked rule itself, which is out of scope by the
    task''s own constraints and untouched here.


    sc-3 is therefore not applicable: the causing act was not redefined, docs/agent-dispatch-design.md
    is unchanged, and no amendment was needed.'
