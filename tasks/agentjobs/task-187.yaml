- id: 13
  ts: '2026-08-20T17:28:22.155758Z'
  actor: claude
  type: progress
  body: "**ac-2, ac-3 and ac-4 met. Evidence below; every run went to its own log\
    \ file.**\n\n**ac-2 -- the benchmark pair, verified the same way.** `poetry run\
    \ python scripts/bench.py --corpus synthetic --tasks 20 --iterations 3` in both\
    \ checkouts at once:\n\n```\nC:/projects/aj-187              START 17:25:52  END\
    \ 17:26:06  EXIT=0\n  [bench] checkout C:\\projects\aj-187 serving http://127.0.0.1:32508\n\
    C:/projects/aj-187-concurrent   START 17:25:54  END 17:26:08  EXIT=0\n  [bench]\
    \ checkout C:\\projects\aj-187-concurrent serving http://127.0.0.1:39874\n```\n\
    \nOverlapping by twelve of their fourteen seconds, on different ports, both reporting\
    \ a complete Browser section -- which is the part that goes through `playwright.bench.config.ts`,\
    \ so the bench Playwright path is covered and not merely the API and CLI ones.\n\
    \n**ac-4 -- there is no path to another checkout's server.** Three properties,\
    \ each demonstrated rather than asserted.\n\n*A server this run did not start\
    \ is refused, even when it looks healthy.* A stand-in for another checkout's server\
    \ was put on `C:/projects/aj-187`'s own port, answering `/health` with `200 {\"\
    status\": \"ok\", \"from\": \"a different checkout\"}` -- the most favourable\
    \ case for an accidental attachment, because it satisfies the readiness probe.\
    \ Playwright ran zero tests:\n\n```\n[e2e] checkout C:\\projects\aj-187 owns http://127.0.0.1:22042\
    \ (derived from the checkout path; AGENTJOBS_E2E_PORT overrides)\nError: http://127.0.0.1:22042/health\
    \ is already used, make sure that nothing is running\non the port/url or set reuseExistingServer:true\
    \ in config.webServer.\nEXIT=1\n```\n\n`reuseExistingServer: false` is untouched\
    \ by this change, and this is what it buys.\n\n*The server cannot bind a port\
    \ the config is not watching.* `run_server.py` has no default. Run without the\
    \ variable:\n\n```\nAGENTJOBS_E2E_PORT is not set, so this server does not know\
    \ which port to bind.\nIt is normally started by Playwright, which derives the\
    \ port for C:\\projects\aj-187 and passes it in.\nTo run it by hand, set the variable\
    \ first:\n    AGENTJOBS_E2E_PORT=20000 poetry run python e2e/run_server.py\nEXIT=1\n\
    ```\n\nBecause there is no second opinion about the port, `baseURL` and the bind\
    \ cannot drift apart -- the failure mode where a run watches one address while\
    \ a server listens on another does not exist.\n\n*The ports themselves differ\
    \ per checkout.* 22042 and 21100 for the gate, 32508 and 39874 for the benchmark,\
    \ from identical code in two checkouts of the same branch.\n\n**ac-3 -- diagnosable\
    \ without reading the config.** Every one of the failure and startup lines quoted\
    \ above names a checkout path or a full URL. The gate prints `[e2e] checkout <path>\
    \ owns <url>` before Playwright starts, the server prints `[e2e] serving <path>\
    \ on <url>` as it binds, and the benchmark prints `[bench] checkout <path> serving\
    \ <url>`. A developer reading a bind failure sees which checkout claimed the socket\
    \ and is told the number comes from the path, without opening a file.\n\n**Regression\
    \ cover.** `tests/test_gate_port_isolation.py`, 15 tests: the derivation is stable\
    \ per checkout and distinct across checkouts, the gate and benchmark ranges are\
    \ disjoint so one checkout cannot collide with itself, `run_server.py` refuses\
    \ a missing or nonsense port, and neither `18940` nor `18950` survives anywhere\
    \ in the four files. It would catch someone reintroducing a constant, which is\
    \ the mistake being fixed.\n\n**Scratch worktree `C:/projects/aj-187-concurrent`\
    \ (branch `scratch/task-187-concurrency-proof`) still exists at the time of writing;\
    \ it is removed as part of closing this task.**"
