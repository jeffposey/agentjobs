    \ (a scratch worktree of the same branch, bootstrapped with `python scripts/bootstrap.py`)\
    \ -- same suites, `EXIT=0`.\n\nThey were genuinely concurrent, not sequential:\
    \ the two Vitest stages report `Start at 12:24:40` and `Start at 12:24:51`, and\
    \ both Playwright stages ran inside the same window. Each log was written to its\
    \ own file so neither run had to be repeated to be read.\n\nThe line each run\
    \ printed before starting its server, which is the whole of ac-3 in practice:\n\
    \n```\n[e2e] checkout C:\\projects\aj-187 owns http://127.0.0.1:22042 (derived\
    \ from the checkout path; AGENTJOBS_E2E_PORT overrides)\n[e2e] checkout C:\\projects\a\
    j-187-concurrent owns http://127.0.0.1:21100 (derived from the checkout path;\
    \ AGENTJOBS_E2E_PORT overrides)\n```\n\nDifferent ports, each naming its own checkout,\
    \ from the same branch and the same config file -- which is the point: the number\
    \ follows the checkout, not the code.\n\nOne thing worth recording for whoever\
    \ runs this next. Two full gates on this machine do not take five minutes each;\
    \ they took roughly 25 minutes wall-clock, because the two 2025-test suites and\
    \ two Chromium runs contend for CPU. Nothing failed and nothing timed out, but\
    \ a reader expecting the documented five minutes will think it has hung. That\
    \ is a property of running two gates at once, not of this change.\n\nStill to\
    \ verify: ac-2 (the benchmark pair, running now) and ac-4 (demonstrating that\
    \ no path exists by which a run attaches to another checkout's server)."
