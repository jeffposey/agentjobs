- id: 2
  ts: '2026-08-20T05:47:10.373585Z'
  actor: Jeff Posey
  type: decision
  body: "Binding, from Jeff on 2026-08-20. This is the product principle the task\
    \ exists to serve, not an implementation preference \u2014 do not trade it away\
    \ for convenience later.\n\n**Dispatching a task or an epic is one click. You\
    \ do not prompt.** The task record is the brief; that is the whole point of keeping\
    \ a record good enough to resume from. Being asked for text before a run may start\
    \ is a *special occasion*, reserved for when the record genuinely cannot brief\
    \ an agent \u2014 and when it happens, ask for it properly, with the voice option\
    \ the dictation work is already building.\n\nHis words: *\"agentjobs is designed\
    \ so you just dispatch tasks or epics, you don't prompt, so by design it should\
    \ be a special occasion thing, and then we'll ask user for text/voice.\"* And\
    \ on the current behaviour: *\"I don't like having to know to go add a note before\
    \ clicking dispatch.\"*\n\n**Rejected: always show a prompt box, optional to fill\
    \ in.** Considered and put to Jeff explicitly, with the argument that at a 97%\
    \ refusal rate the box is effectively always on screen anyway, so making it mandatory\
    \ costs little and buys a dispatch record that says *why* a run started. He rejected\
    \ the premise rather than the trade: the 97% is the defect, not the baseline,\
    \ and designing around it would have entrenched exactly the ceremony this task\
    \ removes. Fixing the trigger makes the box rare, and a rare box does not need\
    \ to be mandatory.\n\n**Rejected: keep the human-note requirement and make the\
    \ control easier to find.** That is what task-185 shipped, and it is a good manual\
    \ path, but as the default it asks the human to satisfy a rule on the machine's\
    \ behalf. The rule it satisfies has been superseded since 2026-08-11 (\xA72a,\
    \ D5).\n\n**What this decision does not touch:** an agent still may never cause\
