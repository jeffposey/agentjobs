spec:
  summary: assert_human_clocked refuses a dispatch unless the task's newest log entry
    was written by a human, which is true of 2 of the 74 open tasks in this project.
    task-185 gave the page a note control so a human can satisfy it by hand, but that
    is ceremony before every dispatch, and AgentJobs is designed so you dispatch a
    task and the record is the brief. The button should write the authorising entry
    itself, attributed to the person who clicked, and only stop to ask for text when
    the record genuinely cannot brief an agent.
  intent: 'Jeff, 2026-08-20, after clicking through task-185''s fix: "I don''t like
    having to know to go add a note before clicking dispatch... will that be common?
    it shouldn''t, right? ... agentjobs is designed so you just dispatch tasks or
    epics, you don''t prompt, so by design it should be a special occasion thing,
    and then we''ll ask user for text/voice."'
  description: "## Measured, not assumed\n\nAgainst the live corpus on 2026-08-20\
    \ (74 open tasks, via the API on 8876):\n\n| | |\n|---|---|\n| would dispatch\
    \ straight away | **2** |\n| refused \u2014 newest entry is an agent's | 68 |\n\
    | refused \u2014 no log entries at all | 4 |\n| **refused overall** | **72 / 74\
    \ = 97%** |\n\nThe ceremony is not a special occasion. It is the default state\
    \ of the backlog, because\n`transition` entries written by the manager on create\
    \ and claim are attributed to the\nagent that caused them, so *every task an agent\
    \ files* fails the check from birth.\n\n## The conflation\n\nOne check is answering\
    \ two unrelated questions.\n\n1. **Who authorised this run?** A safety question.\n\
    2. **Does the agent have enough to work from?** A sufficiency question.\n\n`assert_human_clocked`\
    \ answers (1) by proxying through an artifact of (2) \u2014 the presence\nof a\
    \ recent human-written log entry \u2014 and gets both wrong. A task with a complete\
    \ spec\nand a stale agent note is refused; a task with an empty spec and a human\
    \ note saying\n\"testing\" is allowed. Those are exactly backwards.\n\n## Sufficiency\
    \ is not scarce, which is what makes one-click right\n\nSame corpus, asking whether\
    \ the record could actually brief an agent:\n\n| | |\n|---|---|\n| open tasks\
    \ with **no** `spec.description` | **0 of 74** |\n| open tasks with no `acceptance[]`\
    \ | 2 of 74 |\n| `ready` tasks with no `ball_prompt` | **69 of 69** |\n\n`ball_prompt`\
    \ is empty across the entire ready backlog *and that is correct* \u2014 a\n`ready`/`agent`/`available`\
    \ task has not been handed to anyone, it is in the pool. So\n`ball_prompt` is\
    \ the wrong sufficiency signal for the one state you dispatch from, and\nany check\
    \ keyed on it fires 100% of the time. Keyed on the spec instead, the prompt-for-text\n\
    path fires on **zero** tasks today. That is what \"special occasion\" should mean.\n\
    \n## What is already decided, and must not be relitigated\n\nRead `docs/agent-dispatch-design.md`\
    \ before touching this. Three things are settled:\n\n- **\xA72a, decision D5 (2026-08-11)\
    \ already superseded the human-clocked rule.** Its words:\n  *\"The property is\
    \ **boundedness**, not human causation.\"* \xA72 carries an explicit\n  admonition\
    \ \u2014 *\"Superseded 2026-08-11 by D5 \u2014 read \xA72a before implementing\
    \ this ...\n  Where the two conflict, \xA72a wins.\"* **`assert_human_clocked`\
    \ is enforcing the\n  superseded rule.** This task is not proposing a change to\
    \ the safety story; it is\n  making the code match a decision that is nine days\
    \ old.\n- **An agent may never cause a dispatch.** D5 does not weaken this and\
    \ neither does this\n  task. It survives by construction: agents do not have browsers.\n\
    - **The forgeability requirement (\xA72, \"The rule is only as good as the evidence\
    \ it\n  reads\") is untouched and is the constraint that shapes the fix.** *\"\
    The `caused_by`\n  entry must be resolved **from the stored task** at spawn time,\
    \ never taken from the\n  request body. A request that supplies its own justification\
    \ is not evidence.\"*\n\n## The shape that satisfies all three\n\n**The Dispatch\
    \ button writes the authorising entry itself, server-side, attributed to the\n\
    signed-in user \u2014 and only then dispatches, resolving `caused_by` from the\
    \ stored task as\nit does today.**\n\nForgeability is preserved because nothing\
    \ about the resolution changes: the entry is\npersisted to the task record first,\
    \ and the guard still reads it from storage rather than\nfrom the request. What\
    \ goes away is the human having to know to write it by hand.\n\nThis is task-185's\
    \ option 2, which that task listed and did not build (its `sc-3` is the\none criterion\
    \ it left unmet). It is *not* the same as trusting a request field, and the\n\
    distinction is the whole design \u2014 say so in the implementation, because a\
    \ reader\nskimming will assume otherwise.\n\n### When the box appears\n\nOnly\
    \ when the record cannot brief an agent. Pick the trigger from the spec, not from\n\
    `ball_prompt`, and state the choice \u2014 `spec.description` empty is the obvious\
    \ floor, and\nwhether an empty `acceptance[]` should also trigger it is a genuine\
    \ call worth a sentence.\nWhen it appears, the text the human types becomes the\
    \ body of the authorising entry, so\none action serves both purposes.\n\nWhen\
    \ it does not appear, the entry still gets written \u2014 with a body the manager\
    \ composes,\nnaming the person and the surface (\"Dispatched by Jeff Posey from\
    \ the task page\"), the\nsame way `promote` already composes its own sentence\
    \ when a human promotes without a note.\n\n### Identity\n\nThe entry must name\
    \ a real person, which means the click needs a signed-in user. The\nReact app\
    \ already carries one \u2014 Approve and Request-changes pass `user` \u2014 so\
    \ this is\nwiring, not new machinery. Decide and record what happens when no user\
    \ is selected:\nrefusing is defensible, and writing an entry attributed to nobody\
    \ is not.\n\n## What this is not\n\nNot the prompt-authoring feature. **task-162**\
    \ lets a human *add* something to a\ndispatch they are already making; it is an\
    \ optional affordance and must not become a\ngate. Voice arrives through **task-172**,\
    \ which already names the dispatch prompt among\nthe fields it wires dictation\
    \ into \u2014 so do not build a bespoke input here that 172 has to\nreplace. If\
    \ the sufficiency box and task-162's box turn out to be the same component,\n\
    that is a good outcome, but this task ships without waiting for either.\n\ntask-185's\
    \ note control stays. It is the right manual path for deliberately writing an\n\
    instruction onto a task, and it is what makes the refusal copy honest for the\
    \ CLI and MCP\ncallers who have no button to press."
  constraints: "- An agent must still never be able to cause a dispatch, pinned by\
    \ a test that survives this change.\n- The causing entry is still resolved from\
    \ the stored task at spawn time, never from the request body. Do not \"simplify\"\
    \ this by trusting a caused_by or an actor supplied by the client \u2014 that\
    \ is the exact failure \xA72's forgeability section exists to prevent, and it\
    \ would be invisible in review because the happy path looks identical.\n- Do not\
    \ key the sufficiency check on ball_prompt. It is empty for every ready task by\
    \ design, so a check on it fires always and teaches the user to click through\
    \ it.\n- The written entry must name a real signed-in human. An entry attributed\
    \ to nobody, or to the project's default_user regardless of who clicked, is worse\
    \ than the ceremony it replaces.\n- Amend docs/agent-dispatch-design.md in the\
    \ same branch. \xA72's refusal reasoning and \xA75 both describe the behaviour\
    \ this changes, and \xA72a is the decision being honoured \u2014 say plainly that\
    \ the code had been enforcing the superseded rule.\n- The CLI and MCP dispatch\
    \ paths have no browser and no signed-in user. Whatever ships must leave them\
    \ coherent, and refusing them with the existing message is an acceptable answer\
    \ if it is a stated one."
  out_of_scope: "Building the prompt-authoring box (task-162) or the dictation control\
    \ (task-171/172). Chain authorization and the loop driver (task-150/151) \u2014\
    \ D5's bounded-autonomy mechanism is separate work and this task neither needs\
    \ nor advances it. Backfilling log entries onto existing tasks. Multiple human\
    \ users (task-066) beyond reading whoever is currently signed in."
  context:
  - path: src/agentjobs/dispatch/guards.py
    why: "resolve_causing_entry and assert_human_clocked \u2014 the check that refuses,\
      \ and the resolution that must keep reading from storage."
  - path: docs/agent-dispatch-design.md
    why: "\xA72 (superseded rule + forgeability), \xA72a (D5, what actually governs),\
      \ \xA75 (what starts a dispatch). All three describe behaviour this changes."
  - path: frontend/src/components/DispatchPanel.tsx
    why: The button, and the refusal copy task-185 made honest; where the sufficiency
      box would live.
  - path: src/agentjobs/manager.py
    why: add_log_entry's refusal of forgeable types, and promote's composed-sentence
      precedent for an entry written without a human-supplied body.
  - path: src/agentjobs/api/routes/tasks.py
    why: Approve and Request-changes already carry a signed-in user through to a dispatch;
      the same identity is what the written entry must name.
