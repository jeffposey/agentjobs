ball_prompt: "Ready to review and approve the merge of `feat/task-188-one-click-dispatch`\
  \ (worktree `C:/projects/aj-188`; commits d40fbd8, 0449171, c581b63, 20e29f7). `poetry\
  \ run python scripts/check.py` is green: 1994 Python tests, 33 Vitest, 16 Playwright.\n\
  \n**Click it first, in a sandbox that is safe to break.** A throwaway server is\
  \ running on **http://127.0.0.1:8899/app/p/review/tasks** \u2014 its own port, its\
  \ own AgentJobs home, its own git repo, and a `dispatch.yaml` pointing at a runner\
  \ that just sleeps. None of your real records are reachable from it, so press everything,\
  \ including Cancel run.\n\n- **task-101** \u2014 filed by an agent, complete spec.\
  \ This is the change: one click, no box, a run starts. Then read the log \u2014\
  \ entry #2 is a note by Jeff Posey, `Dispatched by Jeff Posey from the task page`,\
  \ written by the server. That note is what authorised the run.\n- **task-102** \u2014\
  \ filed by an agent, empty description. The only case that stops to ask. The button\
  \ will not start anything until you say what the agent should do, and what you type\
  \ becomes that note.\n- **task-103** \u2014 already had your note on it. One of\
  \ the 2-in-76 that dispatched before today, here so you can see the old path is\
  \ unchanged.\n\nStop it with `agentjobs stop` won't work (different home) \u2014\
  \ I will kill it when you are done, or `taskkill` the python on 8899.\n\n**The two\
  \ things to actually look at in the diff.**\n\n1. `guards.py` \u2014 whether you\
  \ agree the identity/evidence split holds. The request names *who is clicking*;\
  \ the server validates that against `actors:` and refuses anything not `kind: human`;\
  \ the note is persisted; then the causing entry is re-read through `manager.get_task`\
  \ and put through `assert_human_clocked` like any other. The rule is asserted unconditionally\
  \ on both paths right before `runner.start`. It is not bypassed \u2014 it is satisfied.\
  \ If that reads as \"we now trust the request\" to you, I would rather know before\
  \ this merges.\n2. `record_can_brief` \u2014 sufficiency is `spec.description` and\
  \ nothing else. I rejected `ball_prompt` (empty on all 70 ready tasks by design)\
  \ and an empty `acceptance[]` (2 of 76, both with full descriptions). Both rejections\
  \ are pinned by tests. Measured after the change: 76 of 76 open tasks dispatch on\
  \ one click, 0 prompt for text.\n\n**One consequence you should choose rather than\
  \ discover** \u2014 this is entry #5 on this task, and I confirmed it against the\
  \ shipped code rather than taking it on trust. task-179 records that a second dispatch\
  \ onto an already-worked task is stopped today *only* by luck: `assert_human_clocked`\
  \ refuses because the working agent's own claim is the newest entry. This task makes\
  \ a human entry the newest on every dispatch, so that luck is gone permanently.\n\
  \nWhat is still guarded and what is not, verified:\n- A run **AgentJobs started**\
  \ is still caught by `LiveRunExistsError` before the claim and before the spawn.\
  \ Untouched by this branch.\n- A session **AgentJobs did not start** (spawn-session\
  \ skill, a terminal) writes no ledger row and takes no run lock, so nothing sees\
  \ it. `_claim_or_verify` passes an already-active task through whenever the owner\
  \ matches the dispatching runner's actor, which is always here because this project\
  \ configures one agent actor. After this merges, that case is guarded by nothing\
  \ until task-179 lands.\n\nI deliberately did not widen this task to fix it \u2014\
  \ that is task-179's work and it has its own call to make about what state counts\
  \ as \"already being worked\". A cheap stopgap is possible (refuse `active` + `agent`/`work`)\
  \ but it would also refuse legitimately re-dispatching a parked task, which is a\
  \ decision, not a detail. Your call whether task-179 should be raised in priority\
  \ before or after this merges.\n\n**Also filed at your request: task-189** \u2014\
  \ the gate runs its four-minute pytest stage before a block of checks worth about\
  \ fifteen seconds, and `assert-generated-clean.mjs` asserts against HEAD while reporting\
  \ it as staleness, so following its advice exactly reproduces the same failure.\
  \ That cost this session ~16 minutes across four runs.\n\nOn approval I will rebase\
  \ onto main, merge `--no-ff`, rebuild the frontend, re-run `C:/ai/shared/launchers/open-agentjobs.ps1\
  \ -NoOpen` so 8876 is serving the merged bundle, confirm it is live, close the task\
  \ and remove the worktree. I have not pushed and will not without you saying so."
