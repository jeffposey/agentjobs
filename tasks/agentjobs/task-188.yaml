- id: 5
  ts: '2026-08-20T06:02:42.040357Z'
  actor: claude
  type: note
  body: "Written while run_f27d3d88 is working this task. Not a scope change and not\
    \ a blocker \u2014 a consequence found after the spec was written, which the reviewer\
    \ needs and which you should mention in your handoff even if you do nothing about\
    \ it.\n\n**This change removes an accidental protection that task-179 is currently\
    \ relying on.**\n\ntask-179 (\"Dispatch is offered on a task an agent is already\
    \ working, and the guards would allow it\") records that a second dispatch onto\
    \ an actively-worked task is stopped today *only* because `assert_human_clocked`\
    \ refuses \u2014 the newest entry being the working agent's own `claim`. Its own\
    \ words: that is luck rather than safety, and the click passes every gate \"the\
    \ moment a human entry becomes the newest\".\n\nThis task makes a human entry\
    \ the newest on **every** dispatch, deliberately. So that moment stops being a\
    \ moment and becomes the permanent state.\n\nPrecisely how much is exposed, verified\
    \ in the code rather than assumed:\n\n- **A run dispatch started is still caught.**\
    \ `guards.py:332` scans `live_runs()` and raises `LiveRunExistsError` before the\
    \ claim and before the spawn. Confirmed live against run_f27d3d88 \u2014 this\
    \ run \u2014 on 2026-08-20. Unaffected by this task.\n- **An agent AgentJobs did\
    \ not start is not caught at all.** A session from the spawn-session skill or\
    \ a terminal writes no ledger row and takes no run lock, so `live_runs()` and\
    \ `acquire_run_lock()` both see nothing, and `_claim_or_verify` passes an already-active\
    \ task through when the owner matches the dispatching runner's actor \u2014 which\
    \ it always does here, because this project configures exactly one agent actor.\
    \ Six such sessions ran on 2026-08-19 and none appear in the ledger.\n\nSo after\
    \ this ships, the second bullet is guarded by nothing until task-179 lands.\n\n\
    **What to do about it, in preference order.** Do not widen this task to fix task-179\
    \ \u2014 that is its work and it has its own decisions to make. Do, in your handoff:\
    \ state this plainly as a consequence of the change, so whoever approves it is\
    \ choosing it rather than discovering it. If the fix happens to make it cheap\
    \ to keep a task-state refusal in place, say so and let the reviewer decide; do\
    \ not build it unasked.\n\nFull analysis is on task-179's log as entry 3."
