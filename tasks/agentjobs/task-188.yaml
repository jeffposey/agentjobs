- id: 6
  ts: '2026-08-20T06:53:16.721586Z'
  actor: claude
  type: progress
  body: "Built and verified on branch `feat/task-188-one-click-dispatch` (worktree\
    \ `C:/projects/aj-188`, four commits: d40fbd8, 0449171, c581b63, 20e29f7). Repository\
    \ gate green end to end \u2014 1994 Python tests, 33 Vitest component tests, 16\
    \ Playwright specs.\n\n## The shape that shipped\n\n`DispatchRequest` gained `authorized_by`\
    \ / `authorization_note` / `surface`. When `authorized_by` is set, `dispatch_task`\
    \ validates it against the project's configured actors, refuses anything that\
    \ is not `kind: human` (`authorizer_not_human`), and \u2014 inside the run lock,\
    \ after every refusal that can be judged without a write \u2014 appends a `note`\
    \ entry as that human, then **re-reads the task through `manager.get_task`** and\
    \ resolves the causing entry from the stored record. `assert_human_clocked` is\
    \ then asserted on the resolved entry unconditionally, on both paths, immediately\
    \ before `runner.start`. The authorising path does not bypass the rule; it satisfies\
    \ it. A test (`test_the_dispatch_reads_its_evidence_from_storage_not_from_the_request`)\
    \ makes the post-write storage read return an empty log and asserts the dispatch\
    \ fails \u2014 it has nowhere else to get an entry, so an implementation that\
    \ started trusting the request body would have to delete `_write_authorizing_entry`\
    \ to pass.\n\nComposed body when nothing is typed: `Dispatched by Jeff Posey from\
    \ the task page. No extra instruction was given: the task record is the brief.`\
    \ Same precedent as `promote`.\n\n## Decisions taken, with the rejected alternative\n\
    \n**Sufficiency is keyed on `spec.description` alone.** Rejected `ball_prompt`\
    \ (empty on 70 of 70 ready tasks by design \u2014 a check on it fires 100% of\
    \ the time and teaches the reader to click through it) and rejected an empty `acceptance[]`\
    \ (2 of 76 open tasks have none and both have a full description; missing criteria\
    \ are a grooming gap, not an authorisation one). Both rejections are pinned by\
    \ tests so a later reader cannot re-add them by accident. Also considered and\
    \ rejected treating `spec.summary` as a fallback: a one-line summary orients,\
    \ it does not specify.\n\n**The authoriser must be a configured human, but need\
    \ not equal `default_user`.** The review endpoints require that equality because\
    \ they need to know who is at the keyboard; this needs to know the entry names\
    \ a real person. Requiring equality would break the moment task-066 configures\
    \ a second human, and `human_identity` already refuses a multi-human config outright.\n\
    \n**No signed-in user falls back to the pre-existing rule, and the server never\
    \ substitutes `default_user`.** That is the CLI's behaviour and MCP's (there is\
    \ no MCP dispatch tool at all). A config value standing in for a person produces\
    \ something that looks like evidence and is not. The React panel knows before\
    \ the click and does not render the button, showing `identity.detail` instead.\n\
    \n**`caused_by` and `user` are mutually exclusive** \u2014 citing an entry and\
    \ creating one are different acts, so precedence would record an authorisation\
    \ the caller did not intend. Refused in the Pydantic model (400 naming the field)\
    \ and again in the guard (`conflicting_authorization`).\n\n**CLI keeps the old\
    \ rule and says so** rather than growing an `--as` flag. Same trust model as HTTP,\
    \ but a new surface for authorising runs that nothing currently needs.\n\n## Measured\
    \ against the live corpus, after the change\n\n76 open tasks in `agentjobs` on\
    \ 2026-08-20 (up from 74 when the spec was written; task-188 and task-189 are\
    \ the additions):\n\n| | before | after |\n|---|---|---|\n| dispatches on one\
    \ click | 2 | **76** |\n| refused \u2014 newest entry is an agent's | 70 | 0 |\n\
    | refused \u2014 no log entries at all | 4 | 0 |\n| **prompts for text** | \u2014\
    \ | **0** |\n| *(would have fired on empty `acceptance[]`)* | \u2014 | *2* |\n\
    | *(would have fired on empty `ball_prompt`)* | \u2014 | *70 of 70 ready*|\n\n\
    ac-5 satisfied: the prompt path fires on the tasks that genuinely lack a spec,\
    \ of which there are none, and on no others. That it *does* fire on one that lacks\
    \ a spec is pinned at the guard, API, component and e2e levels.\n\n## The e2e\
    \ spec that had to go\n\n`dispatch-authorising-note.spec.ts` asserted the ceremony\
    \ this branch removes \u2014 press Dispatch, expect a refusal naming \"Add a note\"\
    , write one, dispatch. Replaced by `dispatch-one-click.spec.ts` rather than patched,\
    \ because it tested a behaviour and the behaviour is gone. `dispatch.spec.ts`\
    \ had been failing only as collateral: the old spec died before its teardown re-disabled\
    \ the shared `_local` project, and the next spec asserted that project's gate\
    \ was closed.\n\nTask-185's note control stays, and `TaskDetail`'s comment explaining\
    \ why it sits under the dispatch panel was rewritten rather than deleted \u2014\
    \ a refusal can still land there for a caller with no signed-in user.\n\n## Verified\
    \ through the real path, not only the suite\n\nReview sandbox on **http://127.0.0.1:8899/app/p/review/tasks**\
    \ \u2014 own port, own AgentJobs home, own git repo, own `dispatch.yaml` pointing\
    \ at a runner that just sleeps. Clicked task-101 (agent-filed, complete spec):\
    \ one click, run started, and the log then read `#2 Jeff Posey note \u2014 Dispatched\
    \ by Jeff Posey from the task page.` between the agent's creation transition and\
    \ the claim. Opened task-102 (empty description): the textarea is there and the\
    \ button is disabled until it is answered.\n\nAlso filed **task-189** while working\
    \ this, at Jeff's request: `scripts/check.py` runs its four-minute pytest stage\
    \ before a block of checks worth about fifteen seconds, and this session burned\
    \ roughly sixteen minutes across four full runs because of it \u2014 twice on\
    \ the identical failure, because `assert-generated-clean.mjs` asserts against\
    \ HEAD and reports it as staleness."
