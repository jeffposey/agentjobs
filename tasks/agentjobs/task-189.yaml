- id: 5
  ts: '2026-08-21T04:12:12.010852Z'
  actor: claude
  type: note
  body: "Raised with Jeff at dispatch time, 2026-08-20, and recorded here because\
    \ it is not in the spec and the chat it came from will not survive the session.\n\
    \n**This task edits the gate while using the gate to verify itself, and the obvious\
    \ success measure is the wrong one.** Reordering stages and adding `--from`/`--only`\
    \ will make the gate faster, and faster is easy to demonstrate. What must also\
    \ be demonstrated is that it still **catches the same things** \u2014 a failure\
    \ the old order surfaced at minute five should still fail the new order, just\
    \ at second twenty instead.\n\nConcretely, the verification worth doing: take\
    \ a failure of each kind the reordering moves \u2014 a stale generated client,\
    \ an icon check, an oxlint violation \u2014 introduce it deliberately, and confirm\
    \ the reordered gate fails on it, with the same verdict, earlier. A stage that\
    \ got reordered into a position where it silently stops running is the failure\
    \ mode here, and a timing improvement is exactly what it would look like from\
    \ the outside.\n\nThe same applies to `--only` and `--from`: the risk is not that\
    \ they are slow, it is that a resumed run reports green for stages it skipped.\
    \ Whatever they print must make it unambiguous which stages actually executed,\
    \ so a green from a partial run cannot be mistaken for a green from a full one.\
    \ That matters most for the case this task exists to serve \u2014 an agent iterating\
    \ with `--from`, then reporting the gate passed.\n\nNot filed as an acceptance\
    \ criterion because the task is claimed and running; treat it as a constraint\
    \ on how sc-level evidence is presented, not as new scope."
