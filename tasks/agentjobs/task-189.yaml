- id: 7
  ts: '2026-08-21T04:29:51.232830Z'
  actor: claude
  type: decision
  body: "**The gate runs before the commit; the generated-client check therefore compares\
    \ against the working tree, not `HEAD`.**\n\nThe constraint asked which side of\
    \ the contradiction wins. It is the pre-commit rule.\n\n`frontend/scripts/assert-generated-clean.mjs`\
    \ ran `openapi-ts` and then `git diff --quiet -- src/api/generated`, which compares\
    \ the working tree to **HEAD**. That conflated two questions and answered only\
    \ one of them out loud. It is replaced by `frontend/scripts/check-generated-client.mjs`,\
    \ which:\n\n1. snapshots `src/api/generated`, regenerates it, and compares \u2014\
    \ *does the client match the schema?* This fails the gate. The message names the\
    \ changed files and says the regenerated output is already on disk and needs to\
    \ go in the commit. It deliberately does **not** say \"run `npm run generate:api`\"\
    , because the check has just run it, and that instruction is what turned a failure\
    \ into a dead end.\n2. asks `git status` separately \u2014 *is it committed?*\
    \ This is **not** a failure. It prints a note naming the paths.\n\nWhy the second\
    \ is not a failure: a gate that requires a commit to already exist can never be\
    \ the last thing you run before making one, and the documented workaround \u2014\
    \ commit the generated files first \u2014 means committing something no gate has\
    \ inspected. Asking whether the client matches *this working tree's* schema is\
    \ also strictly stronger than asking whether it matches HEAD's, which may be arbitrarily\
    \ old, and it aligns the client check with `check:api-schema`, which has always\
    \ compared against the file on disk.\n\n**Rejected alternative:** keep failing\
    \ on uncommitted output and document \"commit generated files, then run the gate\"\
    . Rejected because it inverts the pre-commit rule for one stage, and because it\
    \ buys nothing \u2014 the invariant that matters is client-matches-schema, which\
    \ is fully checked without it. An incomplete commit is still caught: any checkout\
    \ that does not carry the regenerated files (a fresh clone, CI, a colleague's)\
    \ regenerates and fails at question 1.\n\nBoth paths verified by hand against\
    \ the real check, not only in unit tests. Corrupting a generated file produced\
    \ the stale message; regenerating after an `openapi.json` edit produced the uncommitted\
    \ note; following the stale message exactly (review, then commit) passed on the\
    \ next run."
  data:
    operation:
      id: f274ddea-7847-4dbc-a61e-d4f21960a5bc
      kind: log_append
