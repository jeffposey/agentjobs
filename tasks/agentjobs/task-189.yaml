- id: 8
  ts: '2026-08-21T04:44:06.598786Z'
  actor: claude
  type: question
  body: 'Found while verifying that the reordered stages still catch what they used
    to (log entry 5''s constraint): **the `oxlint` stage cannot fail.**


    oxlint reports its rule violations at `warning` severity and is invoked as `oxlint
    --ignore-pattern src/api/generated/** .` with no `--deny-warnings` and no severity
    override, so it exits 0 whatever it finds. Reproduced twice: a file containing
    `debugger;` and a file reassigning a `const` each produced a printed diagnostic
    and exit code 0, both from `npx oxlint` directly and from `npm run lint`.


    This predates task-189 and is not caused by the reordering -- the stage was equally
    decorative when it ran after pytest. It is out of scope here on the constraint
    "reordering must not change what is checked, only when": adding `--deny-warnings`
    changes what is checked, and would fail the gate on findings that have been accumulating
    unenforced since the stage was written.


    So the demonstration that survives is three of the four moved stages rather than
    four. `black`, `api` and `icons` were each broken deliberately and the unqualified
    gate failed on them at **2.7s, 6.2s and 8.9s** respectively, where the same failures
    previously cost a full pytest run first. `oxlint` could not be demonstrated because
    no input makes it fail.


    **Question for Jeff:** file a follow-up to make the lint stage enforcing? It is
    a small change with an unknown-sized backlog behind it -- someone has to look
    at what `oxlint` currently prints on a clean tree before promising the gate will
    be green. I have not filed anything.'
  data:
