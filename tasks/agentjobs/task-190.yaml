  body: "Implemented on `fix/task-190-run-lock-leak`, two commits, and verified against\
    \ a real\nserver rather than by unit test alone.\n\n## What changed\n\n`src/agentjobs/dispatch/ledger.py`\n\
    - `RunLock` is now a task id, a path and a run id. `acquire_run_lock` writes the\
    \ holder\n  and **closes the descriptor before returning**. `release()` unlinks,\
    \ and refuses to\n  unlink a file that has come to name a different run \u2014\
    \ the window between a run's\n  terminal write and its release is real, and a\
    \ second dispatch can legitimately\n  reclaim the lock inside it.\n- `RunLock.adopt(run_id)`\
    \ names the run, called by `dispatch_task` once\n  `runner.start()` has produced\
    \ a run id. Before this every lock file on disk read\n  `run=` empty.\n- `LockHolder.parse`\
    \ reads `pid=\u2026 run=\u2026` tolerantly; `process_alive` answers liveness\n\
    \  (via `OpenProcess`/`GetExitCodeProcess` on Windows \u2014 `os.kill(pid, 0)`\
    \ is not a probe\n  there, CPython implements it with `TerminateProcess`).\n-\
    \ `stale_lock_reason` is the whole judgement, in one function so there is no second\n\
    \  rule to drift. Named run \u2192 its record decides, pid gets no vote. No run\
    \ record \u2192 the\n  pid decides. Unreadable \u2192 refuses.\n- `release_stale_locks`\
    \ sweeps the directory by the same rule; `reconcile()` calls it\n  **after** it\
    \ concludes orphaned runs.\n- The refusal text no longer mentions `.locks` or\
    \ tells anyone to delete a file.\n\n`src/agentjobs/dispatch/poller.py` \u2014\
    \ `_handle_from` attaches a `RunLock`. This is the\nroot-cause fix; see the decision\
    \ entry.\n\n`src/agentjobs/dispatch/guards.py` \u2014 one `lock.adopt(handle.run_id)`\
    \ after the start.\n\n`src/agentjobs/dispatch/runner.py` \u2014 `RunHandle.lock`'s\
    \ docstring now says a rebuilt\nhandle must set it, since that omission is what\
    \ the bug was.\n\n`docs/agent-dispatch-design.md` \u2014 \xA78's lock bullet and\
    \ \xA79's restart section amended.\n\n## Tests\n\n23 in `TestRunLock` / `TestStaleLockSweep`\
    \ (`tests/test_dispatch_lifecycle.py`), 3 in\n`TestTheLockIsReleasedByWhateverConcludesTheRun`\
    \ (`tests/test_dispatch_poller.py`).\nConfirmed the poller tests fail without\
    \ the fix: reverting the one-line `lock=RunLock(\u2026)`\nturns two of the three\
    \ red, and the third \u2014 \"a session still running keeps its lock\" \u2014\n\
    stays green, which is what a control is for.\n\nac-1 and ac-2 are pinned by a\
    \ pair differing in exactly one field, the run's status.\n\n## Verified by doing\
    \ it, on a sandbox home and a sandbox server on port 8917\n\nOwn `AGENTJOBS_HOME`,\
    \ own project, own port. None of Jeff's data touched.\n\n1. **A pre-fix leaked\
    \ lock is cleared at startup.** `task-005.lock` was left behind by\n   the *unfixed*\
    \ code during the reproduction \u2014 `pid=227460 run=`, its session run\n   `finished`\
    \ hours earlier. Starting the fixed server:\n\n       Dispatch reconcile task-005\
    \ lock: released the run lock on task-005:\n       the process that took it (pid\
    \ 227460) is gone, and it named no run\n\n   That is the shape of all four rows\
    \ in the description's table.\n\n2. **ac-3, batch, restarted mid-run.** Dispatched\
    \ `task-001`, lock read\n   `pid=118244 run=run_34eda108` (it names its run now),\
    \ killed the server mid-run,\n   restarted:\n\n       Dispatch reconcile run_34eda108:\
    \ batch run marked interrupted\n       Dispatch reconcile run_34eda108: released\
    \ the run lock on task-001:\n       its run run_34eda108 is interrupted\n\n  \
    \ Both lines, in that order, are the ordering argument made visible. The next\
    \ dispatch\n   of `task-001` was **permitted** (`run_a9ee8486`).\n\n3. **ac-3,\
    \ a real session, restarted mid-run \u2014 the spec's literal instruction.**\n\
    \   Dispatched a real `claude --bg` session on `task-002` (`run_0fe8da1a`), killed\
    \ the\n   server while it was live, restarted. Reconciliation re-attached it\n\
    \   (`session still running; re-attached`) and did **not** touch its lock, correctly.\
    \ The\n   session then finished, and the **new** server's poller settled it and\
    \ released the\n   lock \u2014 a process that had never held it. Re-dispatch of\
    \ `task-002` was permitted\n   (`run_084a5cb4`). That is ac-3 and ac-4 in one\
    \ sequence: the release no longer\n   depends on any in-memory handle surviving\
    \ anything.\n\n4. **ac-2, live run still refused.** While `run_a9ee8486` was genuinely\
    \ running,\n   `acquire_run_lock` refused:\n\n       task-001 is held by run run_a9ee8486,\
    \ which has not reported that it finished.\n       Cancel that run and this task\
    \ is dispatchable again; it appears under this\n       task's runs.\n\n5. **The\
    \ descriptor.** Before: `rm .locks/task-002.lock` \u2192 `Device or resource busy`\n\
    \   while the server lived, deletable the instant it was killed. After: the file\
    \ opens\n   read-write with the server up, so nothing holds it.\n\n6. **ac-1 and\
    \ ac-5 in the browser**, React app on the sandbox server. Put a leaked lock\n\
    \   of the old shape (`pid=999999999 run=`) on `task-003`, whose runs were all\
    \ terminal,\n   and pressed **Dispatch** on the task page: it started `run_bf01202a`.\
    \ No refusal, no\n   directory to know about \u2014 pre-fix that click was a permanent\
    \ `live_run_exists`.\n   Pressing it again, with that run live, produced the refusal\
    \ a human can still meet:\n\n       task-003 already has run run_bf01202a in state\
    \ 'running'. One live run per task,\n       always -- a second would have two\
    \ agents editing the same repository with the\n       same task record.\n    \
    \   Wait for the run to finish, or cancel it.\n\n   rendered directly above the\
    \ **Cancel run** button for that run. The remedy named is a\n   control on the\
    \ page.\n\n## ac-6: all four locks of 2026-08-20, explained rather than cleared\n\
    \nOne root cause, one aggravator, and the table splits along which path concluded\
    \ the run.\n\n| lock | how its run ended | why the lock survived | cleared now\
    \ by |\n|---|---|---|---|\n| `task-020` (pid 351652, dead) | run `finished`, server\
    \ later killed | nothing releases when the process dies | the startup sweep \u2014\
    \ `run=` empty and pid gone |\n| `task-107-\u2026` (pid 272672, dead) | run `cancelled`,\
    \ same | same | same |\n| `task-187` (pid 368228, alive) | run `finished`; the\
    \ **poller** settled it with a rebuilt handle whose `lock` was `None` | the release\
    \ was a silent no-op, and the live server still held the descriptor | the poller\
    \ now releases it as it settles; for a lock already leaked, the next restart sweeps\
    \ it |\n| `task-188` (pid 368228, alive) | same | same | same |\n\nRows 1\u2013\
    2 are the restart path; rows 3\u20134 are the poller path, which the original\n\
    description suspected (\"a second gap on the ordinary completion path worth finding\"\
    ) and\nwhich is `poller.py::_handle_from`. Both reproduced from scratch on the\
    \ sandbox before\nanything was written \u2014 `task-003` for the restart path,\
    \ `task-005` for the poller path,\neach leaving a lock of the same shape as its\
    \ row.\n\nBatch runs through the API were **not** leaking on completion: their\
    \ supervisor thread\nholds the real handle. Verified rather than assumed (`task-004`,\
    \ lock gone when the run\nfinished), and worth stating because it is what narrowed\
    \ the completion-path gap to\nsessions.\n"
