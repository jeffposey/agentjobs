    \ than out of a test.**\n\n### The gate, and a race my own test had\n\n`GATE EXIT=0`\
    \ \u2014 2051 pytest in 4m25s, 154 Vitest across 22 files, the production build,\
    \ 16 Playwright. Clean run, no reruns.\n\nIt took three attempts, and the second\
    \ failure is worth recording because it was mine. `test_a_raised_ceiling_admits_a_second_task_and_then_refuses`\
    \ set `status=\"running\"` on the first run and then started a second one. The\
    \ fake runner exits immediately, so its supervisor was still on its way to writing\
    \ a terminal status: by the time the second dispatch returned, the first run read\
    \ as finished and only one slot looked occupied. **The freeze was a race the existing\
    \ tests win only because they refuse immediately** \u2014 mine had a whole dispatch\
    \ in between. `hold_live()` now joins the supervisor before freezing, so the writer\
    \ is removed rather than outrun. Eight concurrency tests, five consecutive runs,\
    \ no flake. The per-task-lock test names its authorising entry explicitly, because\
    \ settling appends an agent-authored `dispatch_result` and the default newest-entry\
    \ rule would then refuse it as not-human-clocked \u2014 a real refusal, and not\
    \ the one under test.\n\n(The first failure was `test_agentjobs_context_paths_exist`,\
    \ red on `main` because of task-196's bad pointer; fixed as `441838f` and reported\
    \ in the first progress entry.)\n\n### ac-3 proved against the running server,\
    \ not against a fixture\n\nA passing Vitest test says the browser *would* render\
    \ it. It does not say the server on 8876 is serving it. So, after the rebuild\
    \ and restart, the ceiling was temporarily set to 1, a run was dispatched to occupy\
    \ it, and a second dispatch was attempted. The server answered `409`:\n\n```json\n\
