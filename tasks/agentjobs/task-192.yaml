- id: 4
  ts: '2026-08-20T08:05:00.176197Z'
  actor: claude
  type: progress
  body: "Fix written and verified with three real `--bg` dispatches. Branch\n`fix/task-192-worktree-prompt-parks-dispatch`,\
    \ worktree C:/projects/aj-192, commit 3addccf.\n\n## What changed\n\n- `PROMPT_STUB`\
    \ in `src/agentjobs/dispatch/runner.py` no longer says \"take your own git\n \
    \ worktree\". It gives the command: \"Before writing anything, run `git worktree\
    \ add\n  ../<repo>-<nnn> -b <type>/task-NNN-<slug>` and work from that path. Use\
    \ that shell\n  command, not a built-in worktree tool: those relocate the session's\
    \ permission root,\n  which parks a background run on a prompt nobody can answer.\"\
    \n- `docs/agent-workflow.md` gains the same paragraph under its existing worktree\
    \ heading,\n  naming `EnterWorktree` explicitly, plus a line on what to do when\
    \ a worktree for the\n  task already exists (use it or take a new name -- still\
    \ not the tool).\n- `docs/agent-dispatch-design.md` section on \"Isolation comes\
    \ from the agent\" records why\n  the clause is a command rather than prose.\n\
    - Docstrings: `PROMPT_STUB` and `posture_flags` now carry the task-192 reasoning,\n\
    \  including the two rejected alternatives (a `--settings` pre-approval for the\n\
    \  relocation gate, and `bypassPermissions`).\n- Tests: a new one asserts the\
    \ rendered prompt contains `git worktree add`, this task's\n  id in the branch\
    \ it names, `not a built-in worktree tool`, and `permission root`; the\n  guide\
    \ test now also asserts `EnterWorktree` and `permission root` appear there. The\n\
    \  prompt-length ceiling moved 500 -> 800, which is the cost of spelling the command\
    \ out.\n\n## Verification -- three real dispatches, no terminal attached\n\nAll\
    \ three run from C:/projects/aj-192 via `poetry run agentjobs dispatch run`, so\
    \ the\nprompt was composed by this branch's code, not the 8876 server's (which\
    \ runs main).\nTarget task was **task-015**, chosen as low-stakes.\n\n1. **run_ab042e6a\
    \ / session b0609221 -- fresh worktree (ac-1).** `claude agents --json`:\n   `status:\
    \ busy, state: working`. It ran `git worktree add` and\n   `C:/projects/agentjobs-015`\
    \ appeared in `git worktree list` on branch\n   `fix/task-015-truncate-ball-prompt-in-lists`.\
    \ No permission prompt, never `blocked`.\n2. **run_052b10e5 / session 15139703\
    \ -- one worktree already present (ac-2).**\n   `busy`/`working`. Transcript,\
    \ verbatim:\n   `$ git worktree add ../aj-015 -b fix/task-015-truncate-ball-prompt-in-list`.\n\
    3. **run_d74e729e / session ed2ba5d2 -- two worktrees already present, the observed\
    \ case\n   (ac-2).** `busy`/`working`. Transcript: \"Two prior interrupted runs\
    \ left empty\n   worktrees behind. Let me check whether either has work in it.\"\
    \ followed by\n   `$ for d in ../agentjobs-015 ../aj-015; do echo \"=== $d\";\
    \ git -C $d status --short; ...`\n   -- it inspected the existing worktrees with\
    \ shell `git -C`. This is exactly where\n   run_6f1f0741 reached for `EnterWorktree`\
    \ and parked; under the new prompt no run\n   touched that tool at all.\n\nEach\
    \ was `claude stop`ped once observed. None wrote code or made a commit; all three\n\
    worktrees were empty at `main`.\n\n## Cleanup and state left behind\n\n- Worktrees\
    \ `C:/projects/agentjobs-015` and `C:/projects/aj-015` removed; branches\n  `fix/task-015-truncate-ball-prompt-in-list`\
    \ and `...-lists` deleted.\n- **task-015 released back to `ready`/`agent`/`available`,\
    \ owner cleared.** Its log\n  entries 4-10 are this experiment, and the release\
    \ note says so.\n- The task-190 run-lock leak was hit twice between dispatches.\
    \ Deleting\n  `~/.agentjobs/runs/.locks/task-015.lock` cleared it both times with\
    \ no server restart\n  needed -- the lock was held by the exited CLI process,\
    \ not by the server. Noted for\n  task-190; not fixed here.\n\n## Not regressed\
    \ (ac-3)\n\n`posture_flags` is unchanged in behaviour -- only its docstring moved.\
    \ The existing\nassertions that no posture emits `-w` (`tests/test_dispatch_runner.py:182,227`)\
    \ still\npass, and run_d74e729e demonstrably executed `git -C` against sibling\
    \ checkouts, the\nclass of operation a `-w` guard refuses.\n\n## Next\n\nFull\
    \ gate `poetry run python scripts/check.py` is running; result to follow.\n"
