- id: 5
  ts: '2026-08-20T08:05:23.208578Z'
  actor: claude
  type: decision
  body: "**ac-4 was already satisfied before this task started, so no code was written\
    \ for it.**\n\nThe constraint reads \"a run that does park anyway must surface\
    \ through the task record,\nnot only in a terminal scrape\". The mechanism exists\
    \ end to end and has already fired in\nproduction on the very run this task was\
    \ filed about:\n\n- `classify_session` (runner.py) maps `status: waiting` / `state:\
    \ blocked` to\n  `SessionPhase.PARKED` -- the exact pair `claude agents --json`\
    \ reported for\n  run_6f1f0741.\n- `poll_session` routes `PARKED` to `_park_session`,\
    \ which calls `manager.handoff(...,\n  ball=Ball.HUMAN, ball_reason=BallReason.INPUT)`\
    \ with a `ball_prompt` naming the session,\n  the remote-control URL when the\
    \ transcript has one, the local `attach` command, and the\n  last 40 lines of\
    \ terminal. It is idempotent, keyed on the run's own meta rather than on\n  the\
    \ ball.\n- `poll_sessions_forever` is started in the API's lifespan (`api/main.py:110-112`),\
    \ so\n  the poller runs whenever the dashboard does -- every 10s.\n\n**Evidence\
    \ it worked, not just that it exists:** task-188 log entry #13, 2026-08-20\n07:27:47Z,\
    \ actor `dispatcher`, type `handoff` -- \"Dispatched session `0fe53295` is parked\n\
    on a permission prompt and will wait indefinitely. Answer it at\nhttps://claude.ai/code/session_018MSSiYNFr4Qxeq7Vy2ty94\
    \ -- that link works from a phone.\nOr attach locally with `claude attach 0fe53295`.\"\
    \ followed by the quoted terminal showing\n\"Creating wor...\". That is the parked\
    \ run in the record with the ball moved off the agent,\n55 seconds after the dispatch.\n\
    \n**Rejected:** adding a second, louder park path (a webhook fire, a distinct\
    \ log type, or\na `blocked`-specific poller branch). It would duplicate judgement\
    \ that already lives in\none place -- the property `poller.py`'s own docstring\
    \ exists to protect -- to no\nobservable gain, on a task marked `effort: small`\
    \ whose constraints say to keep the fix\nminimal.\n\nThe gap task-192's `intent`\
    \ describes (\"he could see the run was parked and could not see\nthe prompt\"\
    ) was that the prompt itself is unanswerable, not that it went unreported.\n"
  data: {}
