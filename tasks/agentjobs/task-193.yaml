    `agentjobs dispatch config` now reports that address, sourced from that file,
    with `AgentJobs answered (schema v2)`. Nothing on this machine still resolves
    to 8765.


    **ac-2 is the branch.** A dispatch whose caller observed no address -- the CLI
    -- now probes the resolved address before spawning and refuses with `api_base_unreachable`
    if nothing answers there. It sits last among the checks that write nothing, so
    a refusal leaves the task unclaimed. A dispatch from the browser is never probed:
    its address came off the socket answering that very request. And `agentjobs dispatch
    config` now prints the address, the source that produced it, and what answered
    there -- it printed the address nowhere at all before, so the only place it was
    ever shown was `dispatch run`, one line after the money was spent.


    **Two judgement calls worth your eye, both argued in the decision entry (log 8).**
    I made the gate a hard refusal with no `--allow-unreachable` escape, on the reasoning
    that the probe runs on the same machine that spawns the agent, so there is no
    case I can construct where the check is wrong and the dispatch is right. And I
    rejected the third candidate from your spec -- the scaffold writing `api_base`
    from an observed server -- because it would write a durable declaration from a
    transient observation, into the one file whose value is that nothing writes it
    but you. Say so if you want either decided the other way.


    **Verification:** full `scripts/check.py`, 10 of 10 stages, exit 0, 496.8s --
    no PARTIAL RUN. 22 new tests, the probe ones driven against a real `http.server`
    rather than a mocked `urlopen`. Hand-exercised in both directions: against this
    machine, and under an `AGENTJOBS_HOME` that declares nothing, where the gate refuses
    and names the address, the source and the fix.


    Nothing here is visible in the React app, so there is no sandbox to stand up --
    the surfaces that changed are `agentjobs dispatch config` and the refusal from
    `agentjobs dispatch run`. `DEFAULT_API_BASE` is untouched, per your constraint.


    On approval I will rebase, merge `--no-ff`, close, and remove the worktree.'
