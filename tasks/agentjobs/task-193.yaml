- id: 8
  ts: '2026-08-21T19:42:50.424401Z'
  actor: claude
  type: decision
  body: '**Two of the three candidates are built; the third is rejected.**


    Built: `dispatch config` reports the resolved address rather than nothing, and
    `dispatch run` refuses before spawning when nothing answers.


    **Rejected: having the scaffold write `api_base` when it can observe a running
    server.** scaffold.py''s whole doctrine is that AgentJobs never synthesises a
    dispatch config, never adds an entry nobody typed, and never repairs one it does
    not like -- because a file that appears by itself defeats the gate that makes
    the file trustworthy. Baking an observed port into it would be writing a durable
    declaration from a transient observation: whatever server happened to be up when
    someone typed `dispatch example --write`. And the timing is wrong in the ordinary
    case, where the example is written *before* there is a server to observe. What
    the example gets instead is two sentences telling the reader that `dispatch config`
    will check this for them and `dispatch run` will refuse if it is wrong -- the
    same information, delivered where it cannot go stale.


    **Rejected: warning instead of refusing.** A warning is the right shape for a
    problem the reader will notice anyway. This is the opposite: the run starts, the
    money is spent, the agent goes quiet, and the only artifact is a task record that
    stopped changing. The three real runs in this task''s intent are the evidence
    -- they were only survivable because those agents fell back to reading YAML off
    disk, which is luck rather than design.


    **Rejected: an `--allow-unreachable` escape hatch on `dispatch run`.** Considered
    and left out. The address is checked from the same machine that is about to spawn
    the agent, so "reachable from here" and "reachable from the agent" are the same
    question; there is no legitimate case I can construct where the check is wrong
    and the dispatch is right. A flag that lets someone past a gate they have not
    diagnosed is how the gate stops meaning anything. If a real case turns up -- a
    server that starts after the agent does -- it should arrive with that case attached.


    **The probe reports three states, not two, and only one of them refuses.** An
    address that answers HTTP but not as AgentJobs proceeds with a warning from `dispatch
    config`, because the check cannot distinguish a stranger on a reused port from
    an AgentJobs too old to serve `/api/version`, and only one of those is broken.
    Refusing on a distinction the code cannot actually draw would block working setups.


    **The gate only runs when the caller observed no address.** A dispatch from the
    browser derives its address from the socket its own request arrived on, so probing
    it asks a question already answered -- and every route in this API is an `async
    def` doing blocking file reads on the event loop, so a server issuing a synchronous
    HTTP call to itself from inside a request handler is a deadlock, not merely a
    waste.


    **Timeout is 5s rather than something tighter,** for the same asymmetry: refusing
    a dispatch whose server was merely slow tells a working machine it is broken,
    while waiting a few extra seconds before refusing is an inconvenience. A closed
    port refuses in microseconds and never approaches the ceiling; the ceiling exists
    for a *filtered* address, which answers nothing and would otherwise hang on a
    TCP retry schedule measured in minutes.'
