- id: 8
  ts: '2026-08-20T21:56:25.531646Z'
  actor: claude
  type: handoff
  body: 'Review and approve the merge of `fix/task-194-import-path-guard` (2 commits,
    rebased onto main at 9e84f16). Worktree: C:/projects/aj-194 -- created before
    task-200 moved the convention to ../worktrees/, so it sits beside the clone rather
    than under it.


    What it does


    1. `src/agentjobs/environment.py` (new) answers ''which checkout did this process
    import?'' from `agentjobs.__file__`. The server calls it in the lifespan hook
    and REFUSES TO START on a mismatch, printing the repair.

    2. `scripts/bootstrap.py` now detaches from an activated virtualenv that holds
    another checkout''s editable install, so a worktree gets its own environment and
    cannot repoint anyone. It also prints an absolute interpreter path instead of
    `poetry run`.

    3. `scripts/check.py`''s refusal names the activated virtualenv when that is what
    caused it -- its old advice was a loop.

    4. `/api/version` now reports `source_root`, so a running server can be asked
    without stopping it.

    5. ALLAGENTS.md and ENGINEERING.md record all of it.


    The root cause is worth 30 seconds of your attention: VIRTUAL_ENV is set in every
    dispatched agent''s shell, pointing at the main clone''s venv, and Poetry prefers
    an activated venv over its path-keyed one. So `python scripts/bootstrap.py` in
    a worktree -- the mandatory documented first step -- is what rewrote the main
    clone''s .pth. I reproduced it accidentally two minutes into this session by following
    ALLAGENTS.md verbatim. Nobody was careless; the instructions were the bug. Log
    entry 5 has the evidence.


    Verification, not just tests


    - ac-1: started uvicorn with cwd=C:/projects/agentjobs and the aj-194 interpreter
    -- the exact shape of the incident. Exit 3, refused, banner named both checkouts
    and printed `cd C:\projects\agentjobs && poetry install`.

    - ac-2: re-ran the bootstrap in the worktree with VIRTUAL_ENV set to the main
    clone''s venv, i.e. the sequence that broke it at 21:24. It printed ''Ignoring
    the activated virtualenv ...'', and the main clone''s .pth read `C:/projects/agentjobs/src`
    before AND after.

    - Positive case: a server started inside its own worktree starts normally and
    reports `source_root: C:\projects\aj-194`. Stopped it; 8876 was never touched.

    - Gate green on the rebased branch: 2083 pytest, 154 vitest, 16 Playwright, exit
    0.


    No review server -- there is no visible browser change, only a new JSON field.


    One thing to decide, because it affects you directly: after this merges, the dashboard
    on 8876 will refuse to start if its .pth is ever wrong again. The launcher runs
    from C:/projects/agentjobs (open-terminal-tool.ps1, Directory = ''C:/projects/agentjobs''),
    so the healthy case passes -- I checked. But a refusal means no dashboard until
    `poetry install` is run there. I judged that better than a dashboard quietly serving
    a branch. Say if you would rather it warned and served.


    On approval I will rebase, merge --no-ff, mark the branch merged, close the task,
    remove the worktree, and re-run the launcher so you are on the merged version.'
