- id: 7
  ts: '2026-08-20T21:56:04.705613Z'
  actor: claude
  type: decision
  body: "Decision: the server *refuses to start* on a mismatch rather than warning,\
    \ and the\nbootstrap *detaches* rather than refusing. Two different answers on\
    \ purpose.\n\nRefusing at startup, over the alternative of a loud banner: the\
    \ entire character of this\nfailure is that it is quiet, and a banner in a terminal\
    \ tab nobody reads is another quiet\nthing. A dashboard that will not start is\
    \ recoverable in five seconds with the command\nprinted in the error; a dashboard\
    \ serving someone's branch cost a forensic session to\neven notice. `AGENTJOBS_SKIP_SOURCE_CHECK`\
    \ exists for an install layout the check cannot\nreason about, and prints its\
    \ own warning so a machine running with the guard off cannot\nbe mistaken for\
    \ one that passed it.\n\nDetaching in the bootstrap, over the alternative of refusing\
    \ there too: a refusal leaves\nthe agent with no environment and an instruction\
    \ it cannot follow (`poetry run` resolves\nto the same wrong environment however\
    \ many times it retries). Detaching gives the worktree\nexactly what it came for\
    \ -- its own path-keyed environment -- and leaves the other checkout\nalone. It\
    \ is a fix rather than a warning.\n\nDeliberately *not* guarded, and why each\
    \ would be a false positive:\n\n- An installed (non-editable) package. Only an\
    \ editable install can point at the wrong\n  checkout. Someone who `pip install`s\
    \ AgentJobs and serves a clone of it is doing a\n  normal thing, and refusing\
    \ there would break real users to protect one machine's\n  worktree habit.\n-\
    \ A review server started inside its own worktree. That is a documented workflow\
    \ -- Jeff's\n  standing rule is to stand one up for any visible change -- and\
    \ it is *correct* for it to\n  run the branch's code. The rule is therefore \"\
    the checkout you were launched in\", with\n  the registered project as the fallback\
    \ when the launch directory is not a checkout at\n  all. That distinguishes it\
    \ from the incident, where the server was launched in the main\n  clone and ran\
    \ a worktree.\n- An activated virtualenv with nothing installed in it. That is\
    \ somebody's own\n  `python -m venv .venv`, activated on purpose; the bootstrap\
    \ has no business overruling it.\n- An activated virtualenv holding *this* checkout's\
    \ editable install. That is the main\n  clone repairing itself, which is the documented\
    \ repair for a `.pth` a worktree already\n  rewrote. Detaching there would send\
    \ the repair to a different virtualenv and leave the\n  broken one broken.\n\n\
    Also rejected: making the guard compare against the git repository (are these\
    \ two\nworktrees of the same repo?) rather than against paths. It catches the\
    \ same case and adds\na subprocess plus a dependency on git being present, for\
    \ no extra coverage."
