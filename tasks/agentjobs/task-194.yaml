- id: 5
  ts: '2026-08-20T21:27:56.173545Z'
  actor: claude
  type: progress
  body: "Root cause found, and reproduced accidentally within two minutes of starting.\n\
    \n`VIRTUAL_ENV` is set in a dispatched agent's shell, pointing at the main clone's\
    \ Poetry\nvirtualenv (`agentjobs-KSKY4Ymk-py3.13`). Poetry honours an *activated*\
    \ virtualenv in\npreference to its own path-keyed cache, so `poetry install` run\
    \ from any worktree\ninstalls the root package into the main clone's environment\
    \ and rewrites its\n`agentjobs.pth`.\n\nEvidence, this session, in order:\n\n\
    1. `git worktree add ../aj-194` then `python scripts/bootstrap.py` -- the documented,\n\
    \   mandatory first step for any agent in this repo.\n2. `agentjobs-KSKY4Ymk-py3.13/Lib/site-packages/agentjobs.pth`\
    \ then read\n   `C:/projects/aj-194/src`. The dashboard on 8876 was at that moment\
    \ serving this\n   branch's code. bootstrap.py printed \"Imports resolve to C:\\\
    projects\\aj-194\\src\\agentjobs\n   -- this checkout's own source\" and was telling\
    \ the truth: it verifies the *worktree's*\n   direction, which was fine, and is\
    \ blind to the damage it just did to the main clone.\n3. `poetry env info --path`\
    \ returns the *same* main-clone venv from both\n   `C:/projects/agentjobs` and\
    \ `C:/projects/aj-194`. With `VIRTUAL_ENV` unset it returns\n   nothing from the\
    \ worktree, which is the correct answer for a checkout with no env yet.\n\nSo\
    \ the aj-188 incident was not an agent taking a shortcut. Following the documented\n\
    procedure is what causes it. That is why nothing in the process docs prevented\
    \ it and why\nit will keep happening until the tooling refuses.\n\nRestored the\
    \ main clone (`poetry install` from `C:/projects/agentjobs`; .pth back to\n`C:/projects/agentjobs/src`)\
    \ and re-bootstrapped aj-194 with `VIRTUAL_ENV` unset so it\nnow owns `agentjobs-Ny-jPNj2`-style\
    \ env of its own. No restart of 8876 was needed --\nthe source on disk never changed,\
    \ only which source was on the path.\n\nIncidental observation, not in scope:\
    \ the Poetry cache holds 84 `agentjobs-*` virtualenvs,\none per worktree ever\
    \ bootstrapped. Worth a separate task if anyone cares about the disk."
