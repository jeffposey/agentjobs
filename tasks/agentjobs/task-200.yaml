ball_prompt: "Review and approve the merge of `chore/task-200-worktree-location` \u2014\
  \ one commit `51f2a18`, worktree `C:/projects/worktrees/aj-200`. Not merged; waiting\
  \ on your explicit approval.\n\n**What it does.** Every instruction to take a worktree\
  \ now says `git worktree add ../worktrees/<repo>-<nnn>` instead of `../aj-<nnn>`.\
  \ From `C:/projects/agentjobs` that is `C:/projects/worktrees/aj-<nnn>`, so the\
  \ workspace root stops filling with transient checkouts. The path is stated in four\
  \ documents plus the dispatch `PROMPT_STUB`, and all five moved together; a new\
  \ parametrized test asserts every copyable `git worktree add ../\u2026` line continues\
  \ `worktrees/`, which is the assertion that catches a fifth copy drifting back rather\
  \ than merely noticing a deletion.\n\n**The one call worth your judgement:** I wrote\
  \ it relative, not as the absolute `C:/projects/worktrees/aj-###` you asked for.\
  \ Same directory on this machine, but this repository is public and an absolute\
  \ path is wrong for every other checkout \u2014 the same class of leak task-155\
  \ is in review to remove. Log entry 4 has the reasoning. If you want the literal\
  \ absolute path anyway, say so and I will put it in; it is your repository and your\
  \ convention.\n\n**Verified by using it:** this task's own worktree was created\
  \ with the new command, and `git worktree add` made the `worktrees/` directory itself,\
  \ so there is no setup step for anyone to forget. Full gate green in that worktree\
  \ \u2014 `GATE_EXIT=0`, 2057 pytest, 154 Vitest, production build, 16 Playwright.\n\
  \n**No review server, deliberately.** Nothing is browser-visible: the diff is markdown,\
  \ one prompt string, and tests. Your standing rule about seeding a sandbox applies\
  \ to UI changes and this is not one \u2014 say the word if you disagree.\n\n**Left\
  \ alone on purpose** (log entry 4): the existing `aj-155`, `aj-180`, `aj-194` worktrees\
  \ stay put until their branches merge, and `prompts/`, an archive of prompts already\
  \ issued for closed tasks, keeps the old path. The stale `aj-188`/`aj-191`/`aj-192`\
  \ directories in the workspace root are litter from failed removals and are out\
  \ of scope here; tell me if you want them cleaned up separately.\n\nOn approval:\
  \ rebase onto `main`, merge `--no-ff`, mark the branch merged, close the task, remove\
  \ the worktree. No frontend rebuild or server restart is needed \u2014 nothing in\
  \ the bundle or the running server's behaviour changes \u2014 but I will confirm\
  \ rather than assume."
