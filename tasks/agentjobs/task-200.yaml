spec:
  summary: "Every worktree instruction in this repository says `git worktree add ../aj-<nnn>`,\
    \ which puts each one directly beside the clone in the workspace root. After a\
    \ few dozen tasks that directory is mostly worktrees, including ones left behind\
    \ when removal failed. Move the convention to a dedicated sibling directory, `../worktrees/<repo>-<nnn>`,\
    \ and update every place that states it \u2014 docs, the dispatch prompt stub,\
    \ and the tests that pin those strings."
  intent: Keep the workspace root readable, so a directory listing shows projects
    rather than transient worktrees.
  description: "The path appears in more than one place because the instruction has\
    \ to precede reading the guide (see task-192): `ENGINEERING.md` (\"Sharing a clone\"\
    ), `ALLAGENTS.md` (lifecycle step 2 and \"Why you get your own worktree\"), `docs/agent-workflow.md`,\
    \ `docs/agent-dispatch-design.md`, `src/agentjobs/dispatch/runner.py` (`PROMPT_STUB`),\
    \ and a comment in `src/agentjobs/dispatch/ledger.py`. Three tests assert the\
    \ literal string: `tests/test_documentation_contract.py`, `tests/test_worktree_bootstrap.py`,\
    \ and the dispatch prompt-stub tests.\n\nUse the relative form `../worktrees/<repo>-<nnn>`,\
    \ not an absolute path. On this machine the clone is `C:/projects/agentjobs`,\
    \ so it resolves to `C:/projects/worktrees/aj-<nnn>` \u2014 which is what was\
    \ asked for \u2014 while staying correct for anyone who clones this public repository\
    \ somewhere else. `git worktree add` creates the intermediate directory itself,\
    \ so no setup step is needed.\n\nExisting worktrees are not migrated; a worktree\
    \ is transient and moving one would rewrite its `.git` file for no benefit. They\
    \ age out as their branches merge."
  constraints: "Relative paths only \u2014 no machine-specific absolute path enters\
    \ the public repository. The dispatch prompt stub must stay short and must keep\
    \ naming the shell command rather than a built-in worktree tool (task-192)."
  out_of_scope: "Moving worktrees that already exist. Removing the stale `aj-188`,\
    \ `aj-191`, `aj-192` directories left in the workspace root by failed removals.\
    \ Any change to how the gate derives its ports from the checkout path (task-187)\
    \ \u2014 it hashes the path and is indifferent to depth."
  context:
  - path: ENGINEERING.md
    why: The 'Sharing a clone' section holds the canonical command block.
  - path: ALLAGENTS.md
    why: Lifecycle step 2 and 'Why you get your own worktree' both state the path.
  - path: src/agentjobs/dispatch/runner.py
    why: PROMPT_STUB is the copy a dispatched agent reads before anything else.
acceptance:
- id: ac-1
  text: No instruction anywhere in the repository tells an agent to create a worktree
    as a direct sibling of the clone; every one names `../worktrees/<repo>-<nnn>`
    or the `aj-` form of it.
  status: met
- id: ac-2
  text: The rendered dispatch PROMPT_STUB carries the new path, and the tests pinning
    it assert the new string.
  status: met
- id: ac-3
  text: '`poetry run python scripts/check.py` exits 0.'
  status: met
