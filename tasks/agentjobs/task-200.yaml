  actor: claude
  type: decision
  body: "The path is written relative (`../worktrees/<repo>-<nnn>`), not as the absolute\
    \ `C:/projects/worktrees/aj-<nnn>` the request named.\n\nBoth produce the same\
    \ directory on this machine, because the clone is `C:/projects/agentjobs`. The\
    \ relative form also stays true for anyone who clones this public repository elsewhere,\
    \ and it is what the surrounding instructions already use. Rejected the absolute\
    \ form: it would be the second time a maintainer's own machine leaked into the\
    \ repository as an instruction \u2014 task-155 is currently in review for removing\
    \ the first \u2014 and it would read as wrong to every contributor whose checkout\
    \ is not at that path.\n\nAlso decided, and both are narrow:\n\n- **`prompts/`\
    \ is not updated.** `prompts/task-095-phase-1-loop.md` still says `git worktree\
    \ add ../aj-083`. That directory is an archive of loop prompts already issued\
    \ for tasks now closed; it is a record of what was said, not an instruction anyone\
    \ will follow again. The new test therefore scopes itself to the four live instruction\
    \ documents rather than the whole repository. Rejected scanning repo-wide: it\
    \ would have forced an edit to a historical record to keep a test green.\n- **Existing\
    \ worktrees are not moved.** `aj-155`, `aj-180` and `aj-194` stay where they are\
    \ until their branches merge. Moving a worktree means rewriting its `.git` pointer\
    \ under a peer agent that is mid-task in it, for a directory that is about to\
    \ be deleted anyway."
