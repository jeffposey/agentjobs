  body: "Spec point 4, answered by measurement rather than reasoning \u2014 and the\
    \ spec's premise about the plugin's port was wrong.\n\nWhat `claude mcp list`\
    \ reports in this repository, which has both the enabled plugin and a project-scoped\
    \ file:\n\n```\nplugin:agentjobs:agentjobs: agentjobs mcp - Failed to connect\n\
    agentjobs: C:/.../virtualenvs/agentjobs-KSKY4Ymk-py3.13/Scripts/python.exe -m\
    \ agentjobs.cli mcp - Connected\n```\n\nTwo independent entries, namespaced apart\
    \ by the client. So yes, a project with both runs two servers offering the same\
    \ fourteen tools. Decided that this is not worth preventing: they do not collide\
    \ by name, the project-scoped one is the only one whose address a machine can\
    \ correct without editing an installed plugin's cache, and suppressing either\
    \ would mean AgentJobs reaching into a client's plugin state. Recorded in `docs/mcp.md`\
    \ so nobody has to rediscover it. Rejected alternative: naming the project-scoped\
    \ server something like `agentjobs-project` to make the pair obviously distinct\
    \ \u2014 that would break `enabledMcpjsonServers: [\"agentjobs\"]` already sitting\
    \ in user settings, and dispatch reads the name out of the file anyway, so the\
    \ rename buys clarity in a listing at the cost of an approval prompt.\n\nThe plugin\
    \ failing to connect above is a separate, pre-existing problem and is deliberately\
    \ not chased here: `agentjobs mcp` spawns and connects fine from this shell, from\
    \ Python, and from Node, so it is not the command or the port. Worth its own task\
    \ if it matters.\n\nPort reconciliation (ac-4). The spec says \"the plugin ships\
    \ 8876 and the docs still show 8765\". That is not what the repository contains\
    \ \u2014 `plugins/agentjobs/.mcp.json` ships **8765**, and `plugins/agentjobs/README.md`\
    \ already says 8765 is the default with \"override in your client's config if\
    \ yours listens elsewhere\". What ships 8876 is the *installed cache copy* at\
    \ `~/.claude/plugins/cache/agentjobs/agentjobs/0.1.0/.mcp.json`, hand-patched\
    \ on this machine. So the docs and the plugin already agreed; the thing that disagreed\
    \ was reality on one machine, with no sanctioned place to say so.\n\nDecided:\
    \ 8765 stays the documented default everywhere, because it is what `agentjobs\
    \ serve` binds with no arguments and is right for anyone installing fresh. A machine\
    \ that serves elsewhere states it **once**, in `AGENTJOBS_API_BASE` or `api_base:`\
    \ in `~/.agentjobs/dispatch.yaml` \u2014 the value dispatch already reads for\
    \ the same question \u2014 and `init` now reads the same value. Rejected: changing\
    \ the shipped default to 8876, which would be one machine's port baked into everybody's\
    \ plugin."
