  actor: claude
  type: decision
  body: "Spec point 2 \u2014 `init` does NOT write `enabledMcpjsonServers` into the\
    \ user's client settings.\n\nDecided: the file `init` writes is the project's\
    \ own `.mcp.json` and nothing else. Approval is left to the two mechanisms that\
    \ already exist \u2014 dispatch pre-approves the names it reads out of that file\
    \ via `--settings`, which covers the background case that has no terminal to answer\
    \ a prompt with; an interactive session gets Claude Code's one-time \"New MCP\
    \ server found in this project\" dialog and the human answers it.\n\nRejected:\
    \ having `init` also append `\"agentjobs\"` to `~/.claude/settings.json`. Two\
    \ reasons. It reaches outside the directory the user pointed the command at, to\
    \ a file AgentJobs does not own, in order to pre-consent on their behalf to running\
    \ a program \u2014 that is the wrong default for a tool whose whole guard story\
    \ is \"make the right thing easy, not the wrong thing impossible\". And it is\
    \ Claude-Code-specific: `.mcp.json` is a shape several clients read, `enabledMcpjsonServers`\
    \ is one client's settings key, so `init` would be silently doing nothing for\
    \ a Codex or Gemini user while appearing to have handled approval for everyone.\n\
    \nReopen trigger: if a *fresh* machine (one whose settings do not already carry\
    \ the key) hits the dialog on a dispatched run despite `enabledMcpjsonServers`\
    \ in `--settings`, then the pre-approval does not in fact cover every path and\
    \ this decision is wrong. Not observed \u2014 dispatch's pre-approval is one of\
    \ the three sources that apply regardless of folder trust, per the reasoning already\
    \ in `mcpjson_server_names`."
