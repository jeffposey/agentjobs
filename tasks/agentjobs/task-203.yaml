ball_prompt: 'Review and merge decision on task-203. Branch `fix/task-203-dispatcher-commits-own-write`,
  four commits, worktree C:/projects/worktrees/aj-203. Not merged, not pushed, awaiting
  explicit approval.


  **What changed.** The dispatcher now commits the task record it writes for itself.
  New `src/agentjobs/dispatch/record_commit.py` (one function), called at six sites
  where the dispatcher writes to a record with no session left to sweep the file up:
  the session settle, the batch settle, a batch run that never started, the ledger''s
  sweep of an abandoned run, a parked session''s handoff, and an auto-dispatch cap
  refusal. `TaskStorage` gains a public `task_path()`. Docs updated in `docs/agent-dispatch-design.md`,
  which already recorded the symptom without a resolution.


  **How it was verified.** 13 new tests driving real git repositories rather than
  a mocked subprocess -- two of them end to end through `DispatchRunner`, exercising
  the code that had the bug. Full gate green in the worktree, exit 0: Black + Ruff
  + MyPy over 155 files, 2135 pytest in 325.95s, 154 Vitest across 22 files, the production
  build, 16 Playwright against a live server.


  **What to look at, in the order that matters:**


  1. `record_commit.py`''s use of `git commit --only -- <path>`. This is the whole
  safety argument for ac-2 and ac-3, and it rests on git''s semantics rather than
  ours: `--only` reads the named path from the working tree and ignores the index,
  so a peer''s staged work survives. If you disagree with that reading, the test at
  `TestOnlyOurOwnFile::test_a_peers_staged_work_stays_staged_and_uncommitted` is where
  to poke it.

  2. **The push decision (ac-4): it commits, it does not push.** Reasoning is in a
  decision entry above, with a stated reopen trigger. This is the judgement call most
  worth your disagreement -- your standing rule in job-hunting is push-after-commit,
  and I argued that rule is for an agent with a human in the loop, not for a daemon.

  3. **No new config knob.** Committing is on wherever dispatch is on, on the reasoning
  that dispatch is already opt-in per project and a setting defaulting off would leave
  the bug in place for anyone who never finds it. Say so if you want it gated.

  4. The one write deliberately left alone: the pre-spawn `dispatch` entry, because
  committing it would move HEAD past the `git_head` that same entry just recorded.


  **After merging, the server on 8876 MUST be restarted** or the fix does nothing
  -- the dispatcher runs inside that process and holds the old code in memory. Restart
  it via `C:/ai/shared/launchers/open-agentjobs.ps1`, not `agentjobs restart` (that
  binds 8765). No frontend rebuild needed; nothing under `frontend/` was touched.
  Full reasoning and a way to confirm it is live are in a decision entry above.'
