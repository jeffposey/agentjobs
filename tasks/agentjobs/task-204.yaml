  actor: claude
  type: decision
  body: "Rule 6 forces two manager changes that `out_of_scope` assigns to task-205.\
    \ Taking them, minimally, rather than parking.\n\nTHE CONTRADICTION. sc-1 requires\
    \ `Task` to reject an open task with no `queue_position`. Every task is born open\
    \ (`create_task` builds draft or ready), and every close is a write of an open\
    \ task's model. So the moment rule 6 exists, `_create_unlocked` produces an invalid\
    \ model and `close_task` writes one. `out_of_scope` names \"assignment on create\"\
    \ as child 2 or later, and `constraints` forbids manager changes here. The spec\
    \ cannot be satisfied as written: rule 6 and \"no manager change\" are mutually\
    \ exclusive, not merely awkward together.\n\nWHAT I DID. Landed rule 6 in full\
    \ (sc-1 as written) plus the irreducible minimum that keeps the existing verbs\
    \ legal: `_create_unlocked` assigns bottom-of-band via `queue.next_position()`,\
    \ and `close_task` clears the position in the same write that clears `ball` (design\
    \ section 5.4). No lock, no reorder verb, no rebalance, no `get_next_task` change,\
    \ no API/CLI/UI change. `src/agentjobs/queue.py` holds the pure helpers so task-205\
    \ extends it rather than replacing it.\n\nREJECTED \u2014 park on human/decision.\
    \ The parent's park list does name \"an acceptance criterion cannot be met as\
    \ written\", so this was live. Rejected because the deviation is ~30 lines, strictly\
    \ additive, and reversible in one commit, and because parking child 1 of a six-child\
    \ program on a spec-drafting defect costs Jeff a decision whose only sensible\
    \ answer is this one.\n\nREJECTED \u2014 defer rule 6 to task-205, landing only\
    \ the field, `_check_queue` and the migration here. This is what `intent` (\"\
    zero behaviour change\") literally describes, and it needs no manager change at\
    \ all. Rejected because it abandons sc-1 entirely rather than bending a constraint,\
    \ and because a corpus with a validated-but-unenforced field drifts: every task\
    \ created between this merge and task-205's would arrive unpositioned.\n\nCONSEQUENCE\
    \ FOR TASK-205. Two things it can now assume rather than build: creation assigns,\
    \ and close clears. Two things it must still do to those paths: put them under\
    \ the project queue lock (design section 7), and add the reopen path (section\
    \ 5.4). Also still open and deliberately left: `update_task(priority=...)` moves\
    \ a task between bands without reassigning a position, so a priority patch can\
    \ create a duplicate. `_check_queue` reports it; section 5.3's interception fixes\
    \ it in task-205."
