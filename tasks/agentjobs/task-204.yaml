- id: 7
  ts: '2026-08-21T09:21:09.884333Z'
  actor: claude
  type: progress
  body: 'Implemented and verified on `feat/task-204-queue-position-schema`. Two commits:
    eeaf60f (code, tests, docs) and 3995fe1 (regenerated LinkML artefacts). Not yet
    merged.


    WHAT IS THERE.

    - `queue_position: Optional[int]`, ge=1, on `Task`, plus consistency rule 6 in
    `_check_consistency`, written to read like rule 1.

    - `src/agentjobs/queue.py`: `QUEUE_STEP = 100`, `next_position()` (bottom of band,
    used by create), `QueueRecord` / `read_queue_records()` / `plan_queue_migration()`
    / `migrate_queue_positions()`.

    - `_check_queue` in `validation.py`, wired into `validate_corpus`.

    - `schema/agentjobs-v2.yaml` slot, regenerated by `scripts/regen-schema-docs.sh`.

    - 42 new tests in `tests/test_queue_position.py`.


    TWO NON-OBVIOUS THINGS, both forced rather than chosen.


    1. **The migration reads raw YAML, not `Task` objects.** Rule 6 refuses to load
    an open task that has no position, so a migration built on `storage.load_all()`
    could not read a single file it was written to fix. `QueueRecord` carries the
    four fields the baseline needs, straight out of the mapping -- the same shape
    `migrate_schema.py` uses for v1 files v2 cannot load. `_check_queue` reads raw
    for the same reason: three of its four conditions are model-rejected, so a check
    written against loaded tasks would go silent exactly when the queue is broken.
    A test asserts both `unreadable` and `queue-missing` fire on one bad file.


    2. **Rule 6 reaches every path that builds an open task**, not just the manager.
    The v1->v2 converter (`migrate_schema.migrate_corpus`) now numbers the batch it
    converts before validating it, the markdown importer (`migration/__init__.py`)
    claims bottom-of-band positions against the target directory, `scripts/bench.py`
    numbers its synthetic corpus, and `test_data/sample_tasks.py` ships positioned
    fixtures. That is design section 5.1''s "no path creates an open task without
    one", arriving earlier than expected.


    sc-4 needed one unrelated fix. `LogEntry.attachments` has been on the Pydantic
    model since task-152 and was never added to the LinkML schema, so `linkml-validate`
    rejected task-015 -- the one file carrying an attachment -- and `regen-schema-docs.sh`
    aborted on it. It aborts on `main` too; this is pre-existing drift, not something
    this branch caused. Added the missing `Attachment` class. Corpus now: 225 passed,
    0 failed.


    VERIFICATION. `scripts/check.py` with no arguments, from the worktree, using the
    interpreter the bootstrap printed: **green, all ten stages, exit 0**, 386s. black
    0.6 / ruff 0.1 / mypy 19.5 / api 4.2 / icons 2.6 / oxlint 0.6 / pytest 309.6 /
    vitest 29.8 / build 3.5 / e2e 15.8. Not a `--from` or `--only` run.


    MIGRATION, dry-run against the live corpus: 93 open tasks positioned across four
    bands, 125 closed skipped, 0 unreadable. Applied to a scratch copy the diff was
    exactly `93 files changed, +2/-1 each` -- the `updated` line and one new `queue_position`
    line, nothing else. Re-running against the positioned result plans nothing.


    NOT YET DONE, and the reason it is sequenced this way: `StrictModel` sets `extra="forbid"`,
    so a process running pre-merge code cannot read a migrated task file at all. Committing
    the corpus before the code would break the dashboard on 8876 and this session''s
    own MCP writes. So the order is: merge the code to `main`, then migrate `tasks/agentjobs`
    and `tasks/test-data` in the main clone as a separate `chore(tasks):` commit,
    then restart the 8876 server through `C:/ai/shared/launchers/open-agentjobs.ps1
    -Force` -- not `agentjobs restart`, which binds 8765 and is not the process serving
    that port.'
