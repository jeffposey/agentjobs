spec:
  summary: Add `queue_position` to the task schema with the invariant that an open
    task has one and a closed task does not, teach the corpus validator to police
    uniqueness within a priority band, and run a deterministic migration that gives
    every open task a position. Nothing reads the field yet.
  intent: This is the first of six children of task-081 and the only one that can
    land alone with zero behaviour change. It makes the corpus ordered so that everything
    after it has something real to read. Landing the field and the migration separately
    from the selection change means a bad migration is discovered while the old ordering
    is still in force, not while the scheduler depends on it.
  description: 'Implements sections 3 and 15 (step 1) of `docs/task-selection-design.md`.
    Read that document first; it is the specification and this description does not
    repeat it.



    Deliver:



    1. `queue_position: Optional[int]`, `ge=1`, on `Task` in `src/agentjobs/models_v2.py`,
    with consistency rule 6 in `_check_consistency`: present if and only if the task
    is open. The rule mirrors the existing `ball` rule and should read like it.



    2. The matching slot in `schema/agentjobs-v2.yaml`, then `bash scripts/regen-schema-docs.sh`
    so the JSON Schema, the ER diagram and the v2 reference pages carry it. The generated
    output is committed; it is never hand-edited.



    3. `_check_queue` in `src/agentjobs/validation.py`, reporting as findings: an
    open task with no position, two open tasks sharing a position within one band,
    a non-positive position, and a position on a closed task. Findings, not exceptions
    -- a broken queue must be inspectable.



    4. A migration that assigns every open task in a project a position: within each
    priority band, order by `created` ascending then id ascending, and assign 100,
    200, 300, ... It must be idempotent in the sense that running it against an already-positioned
    corpus is a no-op, and deterministic in the sense that running it twice against
    the same unpositioned corpus produces identical files. Follow the shape of `src/agentjobs/migrate_schema.py`
    and `src/agentjobs/migration/` rather than inventing a new one.



    5. Run it against `tasks/agentjobs/` and commit the result. Every open task file
    gains one line.'
  constraints: '- No selection, manager verb, API, CLI or UI change belongs in this
    task. The field exists and is validated; nothing consumes it yet.

    - The migration''s inputs are immutable fields only. `updated` must appear nowhere
    in it.

    - Generated schema artefacts are regenerated by the script, never edited by hand.

    - The corpus migration is a `chore(tasks):` commit to `main`, separate from the
    code commit.'
  out_of_scope: Assignment on create, the reorder verbs, the queue lock, rebalancing,
    `get_next_task`, and the program order from design section 15 step 2 -- all of
    those are child 2 or later.
  context:
  - path: docs/task-selection-design.md
    why: The specification. Sections 3 and 15 are this task.
  - path: src/agentjobs/models_v2.py
    why: The ball invariant this rule is modelled on lives in _check_consistency.
  - path: scripts/regen-schema-docs.sh
    why: Regenerates everything derived from the LinkML schema; run it, do not hand-edit
      its output.
