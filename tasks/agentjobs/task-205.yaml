spec:
  summary: 'Give the manager the queue: assign a position on create, move and reprioritize
    as managed verbs under a project queue lock, rebalance safely, refuse a corrupt
    queue loudly, and make `get_next_task()` sort by (priority, queue_position) with
    an explanation of why that task won.'
  intent: This is where the queue starts to mean something. Until now `updated` decided
    what an agent worked on next, which meant that editing a task promoted it. After
    this task, the order is whatever a human wrote down, and the only way to change
    it is to say so.
  description: 'Implements sections 5 to 9 of `docs/task-selection-design.md`. Read
    that document first; it is the specification, including the review-pass fixes
    accepted 2026-08-20 (renumber skip-if-closed, same-band group moves, integrity-check
    scope).



    Deliver, in `src/agentjobs/manager.py` and `src/agentjobs/storage.py`:



    1. `QUEUE_LOCK = ".queue"` beside the existing `CREATION_LOCK`, with the fixed
    global lock order `.creation` then `.queue` then task locks ascending by id. Every
    band read taken under the lock must bypass the snapshot cache.



    2. Assignment on create: bottom of the band, or an explicit placement. Every path
    that can produce an open task -- create, import, `load_test_data`, promote out
    of draft, any reopen -- ends with a valid position, and every one of them (reopen
    included) holds the queue lock while assigning.



    3. `move(task_id, before=|after=|top=|bottom=, with_children=False)` and `reprioritize(task_id,
    priority, placement)`. `with_children` carries only the open descendants in the
    moved task''s own band (design section 5.2): positions in different bands are
    never compared, descendants in other bands keep their places, and the `moved_with`
    log data names exactly who moved. Both verbs append a `queue_move` log entry,
    which is added to `LogEntryType` and to `MANAGER_WRITTEN_LOG_TYPES`. A `priority`
    change arriving through the generic `update_task` patch is intercepted and routed
    through `reprioritize`, so no existing caller can break the invariant.



    4. `close` clears the position in the same write that clears the ball. No queue
    lock needed.



    5. Rebalance (automatic, on gap exhaustion) and compaction (explicit), both obeying
    the direction rule in design section 6: tail-first when renumbering upward, head-first
    when renumbering downward, two passes otherwise. The property to test is that
    every partial application read back from disk is a correctly ordered queue with
    no duplicates. Because `close` takes no queue lock, a task in the renumber''s
    snapshot can close before its write arrives: each per-task write goes through
    `mutate_task`, re-checks openness under that task''s own lock, and skips a task
    that is no longer open rather than writing a position onto it.



    6. `assert_queue_integrity()`, `QueueCorruptionError`, and `repair()`. The selection-time
    check covers every open task in the winning band and the bands above it -- the
    set the answer and its explanation actually read -- not just the claimable candidates,
    and not the whole corpus (design section 8). Selection raises; check, list and
    repair do not.



    7. `get_next_task()` sorts by `(priority_rank, queue_position)` after the unchanged
    claimability filter, and `explain_next()` returns the structure in design section
    9.'
  constraints: '- No timestamp, filesystem order or id order may participate in selection,
    including as a fallback when the queue is broken. The queue refuses instead.

    - Reordering is a managed verb with an operation_id. There is no `set_queue_position`.

    - A move writes exactly one task file, plus the moved children of a group move.
    If a move is rewriting the band, the numbering scheme has been implemented wrong.

    - Rebalance and compaction write no `queue_move` entries; they record no decision.'
  out_of_scope: REST, CLI, React and MCP surfaces (child 3, 4 and 5). The program
    order and the human ordering pass (child 6).
  context:
  - path: docs/task-selection-design.md
    why: The specification. Sections 5 to 9 are this task.
  - path: src/agentjobs/storage.py
    why: creation_lock and mutate_task are the patterns the queue lock follows.
  - path: src/agentjobs/manager.py
    why: get_next_task's timestamp sort is what this replaces.
acceptance:
- id: sc-1
  text: A test rewrites `updated` on every open task, in an order chosen to invert
    the old ranking, and proves `get_next_task()` returns the same task before and
    after. This is the test the whole program exists for.
  status: pending
- id: sc-2
  text: Concurrent creates and moves in one band never produce a duplicate position;
    a test exercises the race through the real lock rather than by mocking it.
  status: pending
- id: sc-3
  text: Every intermediate state of an interrupted rebalance is a valid, identically
    ordered queue -- proven by applying the renumber one file at a time and asserting
    the order after each write.
  status: pending
- id: sc-4
  text: A duplicate or missing position makes `get_next_task()` raise QueueCorruptionError
    naming the tasks and the repair command; `queue check` and `repair` still work
    on the same corpus.
  status: pending
- id: sc-5
  text: '`move`, `reprioritize` and create-with-placement each write one `queue_move`-bearing
    record, replay correctly on a repeated operation_id, and leave the band valid.'
  status: pending
- id: sc-6
  text: '`explain_next()` names the winner''s band and position and lists what was
    skipped ahead of it, with the claimability rule that excluded each.'
  status: pending
- id: sc-7
  text: 'A task that closes after a rebalance''s band snapshot but before its write
    is skipped: the rebalance writes nothing to the closed task, the closed task ends
    with no position, and the rest of the band keeps its order. This is the concurrent-close
    rule from design section 6.'
  status: pending
