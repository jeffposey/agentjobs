- id: 7
  ts: '2026-08-21T10:34:04.486812Z'
  actor: claude
  type: progress
  body: 'Implemented on feat/task-205-queue-verbs-selection, worktree C:/projects/worktrees/agentjobs-205.
    Two commits: 6ab7dd0 feat(queue) and e33076e chore(schema).


    WHAT IS THERE.


    1. `TaskStorage.QUEUE_LOCK = ".queue"` and `queue_lock()`, plus `list_tasks_uncached()`
    and `load_task_uncached()` -- the reads a lock holder takes. `_load_all_uncached(fresh=True)`
    bypasses the per-task snapshot as well as the corpus one, which the old method
    did not: it read through `load_task`, so a scope that had already read a file
    would have served the band from a snapshot taken before the lock was acquired.


    2. Creation holds `.creation` then `.queue`, always, not only when an operation_id
    was supplied. Section 7''s reasoning, verified: a create racing a *move* can duplicate
    a position while racing no other create, and the creation lock never covered that.
    `create_task(placement=...)` takes an explicit placement and writes a `queue_move`
    entry; the default bottom-of-band writes none, because it is not a decision.


    3. `move()` and `reprioritize()` in the manager; the arithmetic (`plan_insertion`,
    `plan_rebalance`, `plan_compaction`, `plan_renumber`, `Placement`, `BandEntry`)
    is pure and lives in `queue.py`, which writes nothing and knows nothing about
    locks. `_place()` rebalances and retries once when a gap is exhausted, then reports
    rather than retrying again -- a freshly rebalanced band is spaced QUEUE_STEP apart,
    so a second failure is not a gap problem.


    4. `update_task` intercepts two patches through `_rejoining_the_queue`: a band
    change on an open task, and a reopen. Both take the queue lock and land at the
    bottom of the band being joined. **There is no `reopen` verb**, so the generic
    patch is the only path that can produce one -- adding a verb would have needed
    REST/CLI/MCP surfaces that are children 3 to 5. Recorded as a decision below.


    5. Rebalance and compaction go through `apply_position`, which re-checks openness
    under the task''s own lock and skips a task that closed since the snapshot. `plan_renumber`
    orders the writes tail-first upward, head-first downward, two passes otherwise.


    6. `assert_queue_integrity(bands)`, `QueueCorruptionError`, `check_queue()`, `repair_queue()`.
    Integrity reads `_queue_places()`: loaded tasks for free, plus a raw read of each
    file that failed to load. That raw fallback is load-bearing -- the commonest corruption,
    an open task with no position, is rejected by rule 6 at load time and is invisible
    to a check built on loaded tasks alone. The cost is bounded by how broken the
    corpus is, not how big it is, so a healthy corpus pays nothing beyond the listing
    every caller already does. This is why `/tasks/next` still parses each file once
    and the task-132 performance budget still passes.


    7. `get_next_task()` sorts by `order_key` = (priority_rank, queue_position). `explain_next()`
    returns the section 9 structure via `NextExplanation.as_dict()`.


    ALSO TOUCHED, because "every path that can produce an open task" is the requirement
    and these are paths: `migrate_queue_positions` now takes the plan *inside* the
    queue lock (taking it before would let a create take a number the plan is about
    to hand out), and `migration.migrate_tasks` holds it across the whole import,
    since its band cursor is computed once and stepped. `_claim_next_position` reads
    uncached for the same reason as everything else under the lock. `promote_task`
    needed nothing: a draft is already open and therefore already has a position.
    `migrate_schema.migrate_corpus` was left alone deliberately -- it converts a v1
    corpus that no v2 process can read at all, writes raw files without a TaskStorage,
    and has no concurrent writer to lose to.


    VERIFICATION. `scripts/check.py` with no arguments, from the worktree, using the
    interpreter the bootstrap printed: **green, all ten stages, exit 0**, 363s. black
    0.5 / ruff 0.1 / mypy 1.5 / api 4.2 / icons 2.5 / oxlint 0.5 / pytest 330.0 /
    vitest 4.3 / build 3.2 / e2e 16.3. Not a `--from` or `--only` run. Run twice:
    once before the docs and migration-lock changes (390s) and once after.


    VERIFIED THROUGH THE REAL PATH, against a scratch copy of the live 218-task corpus
    rather than fixtures:

    - `check_queue()`: 0 problems across all four bands.

    - `explain_next()` on the real backlog returns task-100 at high/300, with task-220
    (critical/100, "not ready (active, held by agent)"), task-063 ("has 1 open child")
    and task-081 ("not ready (active, held by agent)") listed as skipped ahead of
    it.

    - Rewrote `updated` on all 92 open tasks to invert the old ranking. The old sort
    would now pick task-220; `get_next_task()` still returns task-100. That is sc-1
    on real data.

    - `move(task-120, top=True)`: 400 -> 50, and `git`-level byte comparison shows
    **exactly one file changed**.

    - `reprioritize(task-173, critical)`: low/100 -> critical/200, one queue_move
    entry carrying `from_band: low`.

    - Forced a duplicate at high/50: `get_next_task()` raised QueueCorruptionError
    naming both tasks and `agentjobs queue repair`. `repair_queue()` then fixed it,
    named the one task it guessed at, rebalanced only the band that was broken, and
    selection answered again.


    TWO FIXTURE FILES CHANGED, and it is worth knowing why rather than reading it
    as unrelated churn. `tests/test_attention_tiers.py` and `tests/test_mcp_read_tools.py`
    gave every open task `queue_position: 100`. Task-204 wrote them that way because
    nothing checked uniqueness then; now that is precisely the corruption selection
    refuses to answer over, so those fixtures were describing a queue that cannot
    exist. Both now derive the position from the task id.


    NOT DONE, and out of scope by the spec: REST, CLI, React and MCP surfaces are
    children 3 to 5. `QueueCorruptionError.message` already names `agentjobs queue
    repair`, which is the command child 4 will build; `check_queue`, `repair_queue`,
    `rebalance_band` and `compact_band` are the manager methods those surfaces will
    wrap.'
  data:
    operation:
      id: 5a1c2e30-0205-4b11-9c30-000000000003
      kind: log_append
      fingerprint: 027897880908062f21f477e2bcb993ae
- id: 8
  ts: '2026-08-21T10:34:15.663750Z'
  actor: claude
  type: decision
  body: 'No `reopen` verb. The generic patch is the reopen path, and it is where the
    lock went.


    Design section 5.4 says a reopened task re-enters at the bottom of its band under
    the queue lock, and the spec repeats it. The obvious reading is a `reopen_task()`
    domain verb beside claim/handoff/release/close.


    REJECTED, because a new domain verb is not a manager change -- it is a REST route,
    a CLI command, an MCP tool and a React control, all of which this task''s `out_of_scope`
    assigns to children 3, 4 and 5. Shipping the manager half alone would leave a
    verb nothing can call, and shipping all of it would take scope those children
    own.


    CHOSEN instead: `update_task` intercepts a patch that moves a closed task back
    to an open lifecycle and assigns it a bottom-of-band place under the queue lock,
    in `_rejoining_the_queue`, alongside the band-change interception section 5.3
    asks for. That covers the requirement completely, because `update_task` is the
    *only* path in the codebase today that can reopen a task at all -- nothing else
    writes `lifecycle`.


    Worth knowing for whoever adds the verb later: the interception is keyed on the
    patch, not on the caller, so a future `reopen_task()` that goes through `update_task`
    inherits it for free, and one that writes the axes directly must call `_rejoining_the_queue`
    itself. Before this change the same patch produced a task that would not validate
    -- rule 6 rejects an open task with no position -- so the failure was loud rather
    than silent, which is why nothing had noticed.'
