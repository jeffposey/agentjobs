spec:
  summary: 'Expose the queue over HTTP, in the Python client, and on the command line:
    read the whole ordered backlog, move a task before or after another, reprioritize
    with a placement, ask why a task is next, and check, repair or compact a band.'
  intent: The manager owns the order after child 2, but nothing can reach it. This
    is the surface a human and a scripted agent use, and `agentjobs queue list` is
    specifically the artefact the human ordering pass (child 6) reviews.
  description: 'Implements the REST, Python client and CLI rows of section 10 of `docs/task-selection-design.md`.



    REST, in `src/agentjobs/api/routes/tasks.py` and `projects.py`:



    - `GET /api/tasks/next` keeps its shape and answers `409 Conflict` on queue corruption,
    with the offending ids and the repair command in the detail.

    - `GET /api/tasks/next/explain` returns the section 9 structure.

    - `POST /api/tasks/{id}/queue-move` taking `before|after|top|bottom`, `with_children`,
    `actor`, `operation_id`, `expected_revision`.

    - `POST /api/tasks/{id}/reprioritize` taking the target priority and an optional
    placement.

    - `GET /api/projects/{id}/queue` returning the whole order, band by band, each
    entry carrying its claimability and the reason it is not claimable when it is
    not.

    - `POST /api/projects/{id}/queue/repair` and `.../compact`.

    - `queue_position` appears in the task read models.



    `queue_position` must not be added to `TaskUpdateRequest`. That allowlist is what
    keeps the field unreachable by generic patch.



    Python client: one method per verb, plus `queue()` for the listing. No generic
    position setter.



    CLI: a `queue` sub-app in the shape of the existing `dispatch` one -- `list`,
    `move`, `reprioritize`, `check`, `repair`, `compact` -- and `--why` on the next-task
    command. `queue list` is meant to be read by a person: band headings, position,
    id, title, and a marker on anything not claimable.



    Regenerate the frontend API client after the routes change; the gate verifies
    it.'
  constraints: '- Every mutating endpoint takes an actor and an operation_id and goes
    through the manager verb. No route computes a position itself.

    - The corruption path is exercised end to end, not just unit tested on the manager.

    - `agentjobs queue list` must be legible in a terminal at 80 columns.'
  out_of_scope: React (child 4) and MCP (child 5).
  context:
  - path: docs/task-selection-design.md
    why: The specification. Section 10 is this task.
  - path: src/agentjobs/api/models.py
    why: TaskUpdateRequest is the allowlist that must not gain queue_position.
