spec:
  summary: Delete the `updated`-first sort in the React task list, render tasks in
    queue order with their position, and let a person reorder the backlog by keyboard
    as well as by drag, including from a phone.
  intent: The list a human reads is currently ordered by a different rule from the
    API's answer, and neither rule was chosen by anyone. After this the screen and
    the scheduler agree, and the screen is where the order is actually decided --
    reordering a backlog is a thing you do by looking at it.
  description: 'Implements the React row of section 10 of `docs/task-selection-design.md`.



    In `frontend/src/components/TaskList.tsx`, `buildTaskRows` currently sorts by
    `updated` descending and consults priority only as a tie-break. That sort is deleted,
    not amended: rows come back in `(priority, queue_position)` order from the server
    and the client preserves it. Position is a visible column.



    Reordering:



    - Drag and drop within a band, firing exactly one `queue-move` per drop with an
    optimistic update and a rollback on failure.

    - Keyboard equivalents that are not a fallback but the primary path: focus a row,
    `Alt+Up`/`Alt+Down` to step, `Alt+Home`/`Alt+End` for top and bottom. Each fires
    one move.

    - A cross-band drag reprioritizes with an explicit confirmation, because it is
    two decisions at once.



    A drag-only reorder cannot be performed on the phone and tablet this backlog is
    read from, and cannot be tested without a pointer harness. The keyboard path is
    what the Playwright test drives.



    Also: the queue-corrupt state renders as a banner naming the offending tasks and
    the repair command, with the list refusing to claim an order it cannot justify;
    and the dashboard''s next action gains a "why this one" disclosure showing the
    section 9 explanation.



    Stand up a review server on its own port with seeded sandbox data containing both
    a healthy queue and a corrupt one, and give Jeff the URL.'
  constraints: '- Every reorder available to a mouse is available to a keyboard, and
    the Playwright coverage drives the keyboard path.

    - One move per gesture. No batch reorder that writes the whole band.

    - The client never re-sorts what the server ordered.'
  out_of_scope: MCP and agent rules (child 5). The actual ordering of the live backlog
    (child 6).
