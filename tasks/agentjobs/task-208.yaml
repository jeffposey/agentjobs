spec:
  summary: 'Put the queue in front of agents: position and the why-this-one explanation
    in the MCP read results, a `task_queue_move` mutation verb, and the rule in ALLAGENTS.md
    that an agent with an opinion about order moves the task instead of inventing
    a dependency.'
  intent: 'An order is only durable if the people and agents with opinions write them
    into the record rather than into a chat message. This is the child that closes
    that loop: an agent can see the order, can change it through a verb, and is told
    not to work around it.'
  description: 'Implements the MCP row of section 10 and all of section 11 of `docs/task-selection-design.md`.



    MCP, in `src/agentjobs/mcp/`:



    - `task_next` and `tasks_list` results carry band and position; `task_next` carries
    the section 9 explanation, so an agent handed a task can see what was skipped
    and why.

    - One new mutation tool, `task_queue_move`, taking `actor` and `operation_id`
    like every other mutation and calling the manager verb.

    - No generic position setter, consistent with the server''s standing contract
    that a task moves through domain verbs or not at all. The server instructions
    text is updated to say so.



    Rules and docs:



    - `ALLAGENTS.md` and `docs/agent-workflow.md` gain the section 11 rule: work what
    the queue says is next, `--why` explains it, move the task if you disagree, never
    add a `needs` edge to express order, never hand-edit `queue_position`, never rely
    on a chat instruction to reorder work.

    - `docs/task-schema.md` documents the field, the invariant, and the verbs.

    - The MCP guide names the new tool, as its contract test requires.'
  constraints: '- The rule must say what to do instead, not only what not to do. "Do
    not invent a dependency" without "move it in the queue" produces agents that do
    neither.

    - No tool that sets a position directly.'
  out_of_scope: The ordering of the live backlog (child 6).
  context:
  - path: docs/task-selection-design.md
    why: The specification. Section 10's MCP row and section 11 are this task.
  - path: src/agentjobs/mcp/mutation_tools.py
    why: The header states the no-generic-setter contract this must respect.
