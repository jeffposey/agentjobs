- id: 9
  ts: '2026-08-21T15:47:11.626700Z'
  actor: claude
  type: decision
  body: "Added a `queue_broken` error code to the MCP vocabulary, which the spec did\
    \ not ask for.\n\nDesign section 8 names the surfaces that report a corrupt queue\
    \ \u2014 REST 409, the CLI's non-zero exit, the React panel \u2014 and does not\
    \ name MCP. But `errors.py` maps an unclassified 409 from a read route to `internal_error`,\
    \ and the only read route that answers 409 is the one this task just made the\
    \ primary way an agent chooses work. So `task_next` over a corrupt queue would\
    \ have said \"AgentJobs is broken\" when the truth is \"your corpus is, and here\
    \ is `agentjobs queue repair`\". The gap predates this task; making the queue\
    \ the thing agents read through MCP is what makes it matter.\n\nRejected: mapping\
    \ 409 to the existing `broken_task`. That code means a file will not parse, and\
    \ the repair is different \u2014 a corrupt queue's files are all perfectly valid,\
    \ which is exactly why the failure is hard to see. Reusing the code would have\
    \ sent a reader to look at a file that is fine.\n\nAlso rejected: leaving it as\
    \ `internal_error` and noting the limitation in the docs. The whole argument of\
    \ section 8 is that a queue which quietly misreports trains everyone to ignore\
    \ corruption, and the failure it produces \u2014 silently working the wrong task\
    \ \u2014 is invisible. A code an agent can branch on is what makes the refusal\
    \ actionable rather than decorative. It is non-retryable, and its `suggested_action`\
    \ says not to pick a task by hand instead, since the order is precisely what is\
    \ in doubt."
  data:
    operation:
      id: 3b5c1d90-208a-4f11-9c02-0000000208b2
      kind: log_append
      fingerprint: afc41e326082342b3d7f2bb3c2d696a5
