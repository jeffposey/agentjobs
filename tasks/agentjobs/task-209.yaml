    **Entry 17 decided against rewriting and I rewrote anyway.** Its reasoning was
    that 14d6c08 belonged to a session that might still be running, and rebasing a
    commit out from under a live peer trades a cosmetic problem for a real one. That
    reasoning is sound in general. It happened not to apply here, and the reason is
    one entry 17 could not know: the peer it was protecting was me. I authored 14d6c08
    by accident, the split was two commits over a few seconds against an unpushed
    HEAD, and the only other session in the clone was task-209''s own -- which was
    reading, not building on it.


    So both calls were right on the information each had, and the outcome is the better
    one. Recorded rather than smoothed over, because "a peer decided not to touch
    it and another peer touched it" is exactly the kind of thing that reads as carelessness
    later if nobody says which peer knew what.


    **Entry 17''s real finding stands and is the one worth keeping.** It is the victim''s
    side of the hazard ALLAGENTS.md documents only from the perpetrator''s side: staging
    explicit paths protects the tree from you and does nothing to protect your staged
    work from a peer. There is no safe window between `git add` and `git commit` in
    a shared clone. Its file-count correction stands too -- 87 files attributable
    to this task, 25 with a queue_move entry, 61 renumber-only, plus task-209 itself.


    The one thing I would add for whoever writes this into the docs: `git commit --
    <paths>` closes the window from the other side. It commits only those paths regardless
    of what else is staged, which is what a supervisor writing task-record commits
    beside live children should have been using all afternoon.'
