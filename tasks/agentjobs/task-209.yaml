spec:
  summary: Present every open agentjobs task band by band as a readable list, get
    Jeff's approval of that list, and write the approved order through the queue verbs.
    This is the child that makes the backlog's order a decision rather than an artifact
    of the migration.
  intent: A mechanical seed satisfies the schema and nothing else. The point of the
    whole program is that AgentJobs has one durable answer to "what is next" that
    a human agreed with, and that answer does not exist until somebody reads the backlog
    in order and says yes. Doing it once also road-tests the verbs on eighty real
    tasks.
  description: 'Implements section 15 step 3 of `docs/task-selection-design.md`, and
    satisfies task-081''s sc-7.



    1. Produce the ordering proposal with `agentjobs queue list`: every open task,
    band by band, position, id, title, and a marker for anything not currently claimable
    with the reason. Roughly eighty tasks at the time of writing, most of them `high`,
    so the `high` band is the real work.



    2. Propose an order, with a short reason for each move away from the migration
    baseline -- not a reason per task, a reason per decision. Epics move with their
    children.



    3. Hand it to Jeff as a readable list and wait. His approval of the list is the
    evidence, and it is recorded on this task, not in chat.



    4. Write the approved order with `agentjobs queue move`, then re-read the list
    and confirm it matches what was approved.



    5. Section 15 step 2''s requested program order is folded into this: task-120
    (issue reporter) ahead of the queue-ordering implementation children. If Jeff''s
    review changes that, his review wins and the change is recorded here as a decision.'
  constraints: '- No `needs` dependency may be added to express order. If two tasks
    are ordered but not dependent, that is exactly what the queue is for.

    - Every move goes through the verb, so each one is logged. No bulk YAML rewrite.

    - The approved list is recorded on this task before it is applied, so a later
    reader can see what was agreed and compare it with what exists.

    - Ordering the backlog is not grooming it. Do not close, reprioritize or rewrite
    tasks along the way; raise anything that looks wrong as a question instead.'
  out_of_scope: Any code change. Any change to what the tasks say.
  context:
  - path: docs/task-selection-design.md
    why: Section 15 step 3 is this task; section 9 explains the claimability markers
      in the list.
