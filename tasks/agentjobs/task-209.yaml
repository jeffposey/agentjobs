- id: 4
  ts: '2026-08-21T01:13:05.550519Z'
  actor: claude
  type: decision
  body: 'Jeff settled the effort policy for this ordering pass (2026-08-20): grade
    the judgment by queue depth instead of ordering the whole backlog with uniform
    precision. Concretely, when the proposal is built and presented: (1) the head
    of each band -- roughly the next 5 tasks -- is ordered exactly, with a reason
    per move; (2) the next 5-10 are placed in rough buckets, not deliberated pairwise;
    (3) the tail is NOT ordered at all -- it keeps the migration baseline, and gets
    only a fast triage scan whose single question is "does anything here belong near
    the head?". Rationale: a position 40-deep is provisional by construction -- it
    will be re-thought before anything consumes it, so precision there is wasted effort,
    and reordering happens regularly enough that the tail''s order is never actually
    executed. Rejected alternative: full-precision ordering of all ~80 open tasks,
    rejected as spending Jeff''s scarcest resource on positions that decay before
    use. Two clarifications that keep this compatible with the acceptance criteria:
    the schema invariant is untouched (every open task still carries a position; the
    mechanical baseline provides the tail''s), and sc-1''s "approval of the list"
    is satisfied by approving the head exactly and explicitly accepting the baseline
    for the tail -- deliberately leaving the tail unordered is itself a considered
    decision, and it must be recorded as one. The triage scan exists because the forgotten-task
    problem (task-081 log entry 1) lives in the tail: graded effort means not ORDERING
    the tail, never not LOOKING at it.'
  data:
