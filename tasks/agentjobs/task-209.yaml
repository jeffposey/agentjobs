    \    absorb its detail -- that is a grooming call, not an ordering one. Both are\n\
    \    placed adjacent (HIGH 6 and 7) in the proposal so the decision is easy to\n\
    \    make later and costs nothing if it is never made.\n\nQ2. task-010 is in MEDIUM\
    \ and the argument for HIGH is strong.\n    tests/test_task_corpus.py asserts\
    \ a context path that exists only in Jeff's\n    clone, so it fails in every worktree.\
    \ ALLAGENTS.md now requires every agent\n    to take a worktree, and ENGINEERING.md\
    \ requires scripts/check.py before every\n    commit. The mandatory gate therefore\
    \ fails for every agent that follows the\n    mandatory process. It is proposed\
    \ at MEDIUM 1 -- the top of its band -- but\n    changing its band is `reprioritize`,\
    \ which this task is not authorised to do.\n    Worth a call.\n\nQ3. task-063\
    \ holds HIGH position 100 while its only open child is in MEDIUM.\n    The proposal\
    \ demotes it to the bottom of HIGH and promotes that child\n    (task-053) to\
    \ MEDIUM 4, which resolves the symptom. The underlying oddity --\n    an umbrella\
    \ whose band no longer matches its remaining work -- is a\n    reprioritize, not\
    \ a move, so it is left alone.\n"
