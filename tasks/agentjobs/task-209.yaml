    \ destroying every comment. 198 names\n    set_project_enabled at src/agentjobs/dispatch/config.py:1034;\
    \ 199 names\n    config.py:1102. Both observed live on 2026-08-20 against the\
    \ job-hunting\n    project; 199 counts 38 comment lines lost, 198 says the file\
    \ went from\n    annotated to 69 bare lines. 199 additionally notes the CLI path\n\
