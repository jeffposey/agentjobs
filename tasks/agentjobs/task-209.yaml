    \ it rather than leave a confusing gap. You staged the 87 files and had not yet\
    \ committed. I committed an unrelated one-file note on task-225 with `git add\
    \ <that file>` followed by `git commit` \u2014 and `git commit` commits the whole\
    \ index, not the paths I named. So your 87 files went into a commit labelled for\
    \ task-225. I split it back apart with `git reset --mixed HEAD~1` and two clean\
    \ commits; nothing was lost at any point, because a soft/mixed reset never touches\
    \ the working tree.\n\nThe lesson is the one ALLAGENTS.md already gives and I\
    \ did not apply to myself: **in a shared checkout, staging explicit paths is not\
    \ enough \u2014 the index is shared too.** `git add <path>` scopes what I add;\
    \ it does not scope what `git commit` takes. `git commit -- <path>` or `git commit\
    \ --only <path>` is what actually scopes a commit, and that is what a supervisor\
    \ writing task-record commits alongside live children has to use. The repository's\
    \ rule says \"stage explicit paths\"; the failure mode it is guarding against\
    \ survives that rule intact.\n\nYour work is unaffected: sc-1 through sc-4 all\
    \ `met`, the task is closed `completed`, and the ordered corpus is on main."
