  body: 'Review and, if you approve, merge fix/task-210-check-scrubs-virtualenv (worktree
    C:/projects/worktrees/aj-210, two commits: 46053e6 code+tests, 5d11ee7 docs).
    Nothing is merged and nothing is pushed.


    WHAT CHANGED - scripts/check.py only, plus its tests and one docs paragraph.

    A new child_environment() copies os.environ, always drops PYTHONHOME, and drops
    VIRTUAL_ENV and POETRY_ACTIVE when the activated virtualenv is not the one this
    interpreter is running in. run() passes it to every child and deliberately takes
    no env parameter, so a gate stage added later cannot forget to opt in. main()
    prints a one-line note when it disowns the shell, so a green run is not a silent
    correction.


    The three constraints held: the source-provenance guard (setup_problems/remedy)
    is byte-for-byte unchanged and still refuses; frontend/playwright.config.ts is
    untouched; the docs keep the whole existing explanation of WHY the hazard exists.


    HOW IT WAS VERIFIED - sc-1, run as the experiment it is, not asserted.

    VIRTUAL_ENV exported to the MAIN CLONE''s environment (agentjobs-KSKY4Ymk-py3.13)
    and left exported, then `<worktree interpreter> scripts/check.py` from the worktree.
    01:22:29Z to 01:29:13Z, EXIT=0. Black, Ruff, MyPy, 2130 pytest in 5m16s, both
    nested `poetry run` frontend checks, oxlint, 154 Vitest, the production build,
    and 16 Playwright tests -- the stage that used to fail -- all green. Playwright''s
    webServer is `poetry run python e2e/run_server.py` and run_server.py calls verify_source_or_die,
    so a green Playwright stage is itself the proof the nested poetry call resolved
    to this worktree; before this change the guard refused it there, six minutes in.
    Full stage-by-stage output is in the progress entry above.


    Also confirmed the mechanism directly, same exported VIRTUAL_ENV: the bare nested
    call imports C:/projects/agentjobs/src (the bug), the same call with env=check.child_environment()
    imports C:/projects/worktrees/aj-210/src (the fix).


    WHAT TO LOOK AT - two judgement calls I made and would want checked.

    1. The scrub is CONDITIONAL, not the flat delete the spec described. An unconditional
    delete also strips a VIRTUAL_ENV that IS this interpreter''s, which breaks a plain
    `python -m venv .venv` checkout: Poetry then has no path-keyed environment to
    fall back to and every nested `poetry run` in the frontend gate fails. scripts/bootstrap.py
    already declines to overrule somebody''s own .venv for the same reason, so this
    matches the existing idiom -- but it is a deviation from the written spec and
    it is the thing to disagree with if you are going to disagree with something.

    2. I did NOT also strip the activated venv''s Scripts directory from PATH, which
    is what a real `deactivate` does. Nothing in the gate calls a bare `python` --
    every nested call is `poetry run`, which does not pick its interpreter from PATH
    -- and if poetry itself were ever installed inside the activated venv, removing
    that directory would make `poetry run` vanish and break the gate outright. Real
    cost, hypothetical benefit. Reasoning and the reopen trigger are recorded as a
    decision on this task.


    SIBLINGS - the change makes the `unset VIRTUAL_ENV` workaround unnecessary, never
    required-in-reverse. With VIRTUAL_ENV already unset the new code takes the falsy
    branch and passes the environment through untouched, so a sibling gate running
    mid-flight under the old workaround behaves exactly as before.


    MERGE STEPS if you approve: rebase onto main, merge --no-ff, mark the branch merged,
    close completed, remove the worktree. No frontend rebuild or server restart is
    needed -- this touches no runtime code, only the gate runner, its tests, and ALLAGENTS.md.'
