  type: decision
  body: 'Design input from Jeff (2026-08-20), binding on the reorder playbook this
    design specifies: reorder runs use graded effort by queue depth, not uniform precision
    over the band. Exact ordering for the head (roughly the next 5 tasks), rough buckets
    for the next 5-10, and no ordering for the tail beyond a fast triage scan for
    anything that belongs near the head -- the tail keeps whatever positions it has.
    Rationale and the rejected full-precision alternative are recorded as the same-day
    decision on task-209, which is the first (manual) run of this policy; the playbook
    generalises it. Note the division of labour this implies: reorder''s triage scan
    surfaces misplaced tasks, while tail *rot* (dupes, superseded work) is the groom
    playbook''s job -- the two playbooks meet at the tail from different directions.'
