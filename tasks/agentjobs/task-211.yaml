- id: 26
  ts: '2026-08-21T18:23:03.521035Z'
  actor: claude
  type: decision
  body: "**Answering the second half of entry 22: agent types. Yes \u2014 worth it,\
    \ with two conditions, and it is not this task's to build.** Filed as **task-227**\
    \ (draft). Design \xA77.3 written; P11 added; P6 reworded.\n\n**Why yes, and it\
    \ is not a matter of taste: you already have exactly one agent type, hardcoded,\
    \ and it is called `supervisor`.** `posture_flags(..., supervisor=True)` widens\
    \ the permission allow-list via `supervisor_allow_rules()`, and `compose_argv`\
    \ picks `SUPERVISOR_STUB` over `PROMPT_STUB` \u2014 both derived from the record\
    \ (the task has an open child), **neither touching the runner**. That is a role\
    \ that changes what the agent is told and what it is permitted to do. Your proposal\
    \ generalises something this codebase already needed once and solved by special\
    \ case, which is the best evidence available that a layer is real rather than\
    \ speculative.\n\n**Condition 1: an agent type must carry more than a runner group,\
    \ or it is an alias table \u2014 and your own examples prove it.** `Producer`\
    \ \u2192 default runner. `senior engineer` \u2192 default runner. If a runner\
    \ group is all an agent type carries, those two are one object with two names,\
    \ and the vocabulary has failed at its second example. The payload that makes\
    \ it a real object is what `supervisor` already carries, generalised:\n\n- **a\
    \ role brief in the prompt stub** \u2014 a Producer grooms, orders and specs,\
    \ and should be *told* it does not write code;\n- **a permission profile** \u2014\
    \ today the allow-list is keyed on posture alone. A Producer that only touches\
    \ task records wants a far narrower list than an engineer, and that is a safety\
    \ property, not flavour. It has a named beneficiary already: task-220 found that\
    \ three consecutive classifier blocks arm a breaker that parks a `--bg` run, and\
    \ concluded the fix is *\"making sure the streak cannot form for the role that\
    \ provokes it\"*. A role-scoped allow-list **is** that fix, generalised.\n- **a\
    \ default posture and mode**;\n- **a default runner group** \u2014 one field among\
    \ several, rather than the whole thing.\n\n**Condition 2: keep role and cost on\
    \ separate axes, which is where I'd push back on the engineer ladder.** Lead /\
    \ senior / junior as you described them map onto big-dawg / default / sonnet \u2014\
    \ that is the `difficulty` axis (task-156) wearing job titles. Writing it into\
    \ a repo file writes a **spend** decision into portable content, which is the\
    \ thing \xA76.3 exists to prevent, and it costs you two concrete things: the same\
    \ playbook can no longer be run cheaply on a spare machine without editing a repo\
    \ file, and a reader cannot tell whether \"senior engineer\" constrains *behaviour*\
    \ or *budget*.\n\nThe test, which is the same test as condition 1: **if lead,\
    \ senior and junior differ in what they are permitted to do and how their work\
    \ is reviewed, they are agent types; if they differ only in which model runs,\
    \ they are `difficulty` with job titles.** I suspect you actually mean the first\
    \ \u2014 \"junior engineer\" carries a real idea about narrower scope and closer\
    \ review that \"easy\" does not \u2014 and if so the ladder is fine and the tiers\
    \ should carry that payload explicitly rather than implying it through a runner\
    \ choice.\n\n**Where it lives, if built as its own object.** Definitions \u2014\
    \ name, role brief, permission profile, default posture \u2014 in **project config,\
    \ git-tracked**, because \"Producer\" means the same thing on every machine. The\
    \ **binding to a runner group in machine config**, beside the groups, because\
    \ which executables exist does not travel. That split is what keeps a playbook\
    \ portable *and* keeps \xA76.3 intact: the playbook names a kind of agent, the\
    \ repo says what that kind is, the machine says what runs it.\n\n**One alternative\
    \ you should see before anyone builds it: the actor vocabulary may already be\
    \ the right home.** `actors:` is per-project, git-tracked, and *already carries\
    \ role language in its display names* \u2014 `claude` renders as \"Claude (Lead\
    \ Engineer)\", `codex` as \"Codex (Workhorse)\". An actor id is already independent\
    \ of which model ran (Opus and Fable both write `actor: claude`). Making agent\
    \ type a property of the actor \u2014 or making `producer` a fourth actor \u2014\
    \ would give attribution for free: the backlog would show which grooming the Producer\
    \ role did, which no separate layer gives you. The cost is that identity and role\
    \ stop being separable, so one agent working in two roles needs two ids. Not settled\
    \ here; it is task-227's first question.\n\n**Why it is not part of this task.**\
    \ Agent type is dispatch-layer work with consumers well beyond playbooks \u2014\
    \ every ordinary dispatch has an agent type too, and `supervisor` proves it \u2014\
    \ so folding it in would put task-211 in the business of designing dispatch. task-227\
    \ is a design pass in the same mould, priority medium, draft, with the findings\
    \ above written into its spec so its session does not re-derive them.\n\n**Consequence\
    \ for this design: one line, and it was already abstract.** P6 said a playbook\
    \ declares `difficulty` and never names a runner. Reworded so the rule is *the\
    \ indirection*, not the field name: **a playbook declares what kind of agent should\
    \ run it; the machine binds that to a runner.** If agent types land, `agent_type`\
    \ becomes that declaration with `difficulty` beside it as the orthogonal axis,\
    \ and nothing else in the playbook design moves. That is the whole reason there\
    \ was an indirection instead of a group name in the frontmatter, and it means\
    \ task-227 can settle either way without reopening task-211."
