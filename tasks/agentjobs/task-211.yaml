ball_prompt: "Both questions from your review are answered, revision 2 is on the branch,\
  \ and your phone link is updated in place: https://claude.ai/code/artifact/1588a618-c81b-4239-90a0-94a009c93d4a\n\
  \n**1. queue-check \u2014 agreed, and it is a better design, not a smaller one.**\
  \ \xA75.4 is rewritten. The check is synchronous now: the move lands, the response\
  \ carries warnings computed from what the queue already knows. Five of them, all\
  \ deterministic \u2014 the task you promoted cannot be claimed (this is `--why`\
  \ pointed at one task), you ordered something above its own prerequisite, what you\
  \ demoted gates other work, the move is a no-op, the band is corrupt. Your entry-6\
  \ reasoning survives intact: it fires only on a fact, it names the demoted task,\
  \ and it runs after the move. The 120s debounce existed only to amortise a model\
  \ call, so it bought nothing but delay. What is lost is judgement about whether\
  \ a move is *unwise* \u2014 that belongs to `reorder`, which sees the whole band.\
  \ Withdrawing the lane also removed the design's only exception to run-is-a-task,\
  \ its reserved actor, its spend ceiling and its fail-open branch. Reopen condition\
  \ is stated. task-219 is retargeted: still a draft, no longer needs task-215, and\
  \ can ship before any playbook exists.\n\n**2. agent types \u2014 yes, worth it,\
  \ with two conditions, and I filed it as task-227 (draft) rather than absorbing\
  \ it here.** \xA77.3 has the argument. The strongest point in its favour is that\
  \ you already have one, hardcoded: `supervisor` changes the prompt stub and the\
  \ permission allow-list and touches no runner. The conditions: (a) an agent type\
  \ must carry more than a runner group or it is an alias table \u2014 your own examples\
  \ prove it, since Producer and senior engineer both bind to default and would be\
  \ indistinguishable; the payload worth carrying is the role brief, a permission\
  \ profile, a default posture. (b) Keep role and cost on separate axes. **This is\
  \ where I would push back on lead/senior/junior as described** \u2014 mapped onto\
  \ big-dawg/default/sonnet they are `difficulty` with job titles, and writing a spend\
  \ decision into a repo file is the thing \xA76.3 exists to prevent. The test: if\
  \ the three tiers differ in what they may *do* and how their work is reviewed, they\
  \ are agent types; if they differ only in which model runs, they are difficulty\
  \ wearing titles. I suspect you mean the first, in which case say so in the definitions\
  \ rather than implying it through a runner choice. task-227 also raises an alternative\
  \ worth your eye before anyone builds: the `actors:` vocabulary may already be the\
  \ right home \u2014 it is per-project, git-tracked, and already says \"Claude (Lead\
  \ Engineer)\".\n\nP6 is reworded so a playbook declares *what kind of agent should\
  \ run it* rather than a named field, which lets task-227 settle either way without\
  \ reopening this design.\n\n**What you are approving:** revision 2 of the doc, commit\
  \ 625ee2a on `docs/task-211-playbooks-design` (docs-only diff), plus the retargeting\
  \ of task-219 and the filing of task-227. Everything else from the first review\
  \ stands unchanged. Full gate green on the rebased branch \u2014 2448 pytest, 195\
  \ vitest, 21 Playwright, all ten stages.\n\nOn approval I rebase, merge --no-ff,\
  \ close this, and remove the worktree. The children stay drafts until you promote\
  \ them, per the design's own rule."
