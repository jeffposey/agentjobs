- id: 5
  ts: '2026-08-21T03:33:42.590116Z'
  actor: claude
  type: decision
  body: "Jeff described the intended end-to-end workflow, 2026-08-20, which makes\
    \ the \"human move is sticky\" bound from log entry 3 concrete enough to design\
    \ against:\n\n> \"AI picks order first ... I manipulating by click and dragging\
    \ tasks up and down in the react dashboard, and that 'sticks' somehow\"\n\n**Mechanism\
    \ for stickiness \u2014 proposed, for the design to settle.** No new schema field\
    \ is needed. A `queue_move` is a managed verb and its log entry already records\
    \ the actor, so \"was this task's current position last set by a human or by a\
    \ playbook run\" is derivable from the record as it stands. The reorder playbook\
    \ reads that and treats a human-set position as an **anchor**: it orders around\
    \ anchors, and overriding one requires it to say so explicitly in its output rather\
    \ than silently re-deriving the band. Rejected alternative: a `queue_pinned` boolean\
    \ on the task \u2014 explicit and fast to read, but it needs a clearing rule or\
    \ every task eventually becomes pinned and the playbook has nothing left to do.\
    \ Provenance carries the same information and cannot drift from the truth, because\
    \ it *is* the write history.\n\n**Staleness.** An anchor should not hold forever,\
    \ or the queue slowly freezes into whatever Jeff last touched. Candidate rule\
    \ for the design to accept or replace: an anchor holds until the task materially\
    \ changes \u2014 it closes, its priority band changes, or its dependencies resolve\
    \ \u2014 at which point its position is the playbook's again. State the rule either\
    \ way; an anchor with no expiry is a decision, not an omission.\n\n**The trap,\
    \ and why it is the important half of this entry.** Stickiness alone re-creates\
    \ the exact problem this whole program exists to fix, with the polarity reversed.\
    \ Jeff's argument for autonomous ordering (entry 3) is that at 75 open tasks *he*\
    \ is the less-informed party, because the records do not fit in his head. If his\
    \ drag silently outranks a placement the playbook made for a reason he cannot\
    \ see on that screen, then the uninformed move beats the informed one by construction\
    \ \u2014 which is worse than the timestamp ordering, because it looks deliberate.\n\
    \nSo stickiness and **reason-at-drag-time are a pair, and neither should ship\
    \ alone.** The React reorder surface must show why a task currently sits where\
    \ it does \u2014 the playbook's recorded reason for that position \u2014 at the\
    \ moment someone drags it. Then his override is informed, which is what makes\
    \ it legitimately outrank the machine. The design already has the raw material:\
    \ `explain_next()` (task-selection-design \xA79) exists to explain the *selection*;\
    \ this needs the same treatment for a *position*.\n\n**Consequence for task-207**,\
    \ which builds the React list and drag/keyboard reorder: its acceptance criteria\
    \ today cover order, keyboard access, optimistic-update rollback and corrupt-queue\
    \ banners, but nothing about surfacing why a task holds its position. 207 is ready\
    \ and may ship before this design exists, so a pointer note has been added there.\
    \ Whether the reason display lands in 207 or in a child of this task is a sequencing\
    \ call, not a question of whether it is needed."
  data:
    operation:
      id: c5e07a94-2f65-4d18-b1ca-8597a0f50211
      kind: log_append
      fingerprint: 75cdf5050abd6e36eb49c0a3bf28ee2e
- id: 6
  ts: '2026-08-21T03:36:47.787736Z'
  actor: claude
  type: decision
  body: "Jeff refined the interaction, 2026-08-20, and it supersedes the reason-at-drag-time\
    \ proposal in log entry 5:\n\n> \"if I click and drag to reorder, which would\
    \ stick, it uses AI playbook thing that checks and gives me a reason why I shouldn't\
    \ do it\"\n\n**The move lands immediately and is authoritative. A playbook then\
    \ checks it and objects if it has grounds.** Not a confirmation gate \u2014 the\
    \ drag is never blocked, never awaits a model, and is durable the instant it happens.\n\
    \n**Why this beats entry 5's version, which is now the rejected alternative.**\
    \ Reason-at-drag-time shows a static justification for the position of the task\
    \ being grabbed. Three problems, all fixed by inverting it:\n\n1. **It becomes\
    \ wallpaper.** An explanation shown on every drag is read the first three times\
    \ and ignored after. An objection raised only when there is a real one carries\
    \ signal precisely because it is rare.\n2. **It explains the wrong thing.** The\
    \ risk in a drag is rarely the task grabbed \u2014 it is what got pushed *down*.\
    \ Promoting X above Y demotes Y, and Y may be gating three other tasks. A post-hoc\
    \ check reasons about the *consequences* of the move; a recited prior justification\
    \ cannot.\n3. **It cannot say anything new.** The prior reason was written before\
    \ this move existed. Only a check run after the fact can evaluate the queue as\
    \ it now stands.\n\n**Consequences the design must settle:**\n\n- **Shape.** This\
    \ is a *reactive* playbook \u2014 triggered by a human action, scoped to one move,\
    \ returning an objection or silence. That is a different shape from the three\
    \ batch-over-the-backlog cases this task currently specifies (groom, reorder,\
    \ flesh-out), and the design does not presently have the category. Add it or reject\
    \ it explicitly; a reactive playbook is cheap, fast, and probably the most-run\
    \ one in the product.\n- **Cost and debounce.** Jeff intends to reorder routinely,\
    \ and a model call per drag is real latency and real money. The check should debounce\
    \ over a reorder session \u2014 settle, then check once \u2014 rather than firing\
    \ per drop. State the trigger boundary.\n- **Dismissal is one click each way.**\
    \ A blocking modal reintroduces the friction this design removed. A non-blocking\
    \ notice with `undo` and `keep` is the shape; anything heavier will be ignored\
    \ or resented.\n- **An overruled objection is a stronger anchor than a bare drag,\
    \ and should be recorded as one.** If Jeff moves a task, reads the objection,\
    \ and keeps the move, he is at that point the *informed* party \u2014 which is\
    \ exactly the condition entry 3 says legitimises a human override. That state\
    \ should be distinguishable in the record from an unexamined drag, and a position\
    \ held against a stated objection should be close to immovable by a later reorder\
    \ run. This resolves the trap in entry 5 properly: rather than trying to inform\
    \ the human before the fact, the system lets the move stand and then earns its\
    \ authority.\n\nThe anchor mechanism from entry 5 is unchanged \u2014 provenance\
    \ from the `queue_move` actor, no new field, anchors expiring on material change.\
    \ What changes is only how the human comes to be informed: after the move, on\
    \ grounds, instead of before it, always."
  data:
