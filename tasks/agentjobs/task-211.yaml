- id: 25
  ts: '2026-08-21T18:22:37.848395Z'
  actor: claude
  type: decision
  body: "**Answering the first half of entry 22: queue-check becomes deterministic.\
    \ Adopted, and it is an improvement rather than a compromise.** Design \xA75.4\
    \ rewritten; P8 replaced; the reactive-playbook category withdrawn.\n\nJeff: *\"\
    Seems overly complicated and hard to use as it is. What if we postpone the playbook\
    \ idea for that, and use a new immediate deterministic process for queue check,\
    \ where it prompts you immediately based on the existing 'why' text, if possible.\"\
    *\n\n**It is possible, and the deterministic check is not thin.** Every one of\
    \ these is computable from data the move handler has already loaded \u2014 `_skip_reason`,\
    \ `dependencies[]`, `unblocks_count`, `find_queue_problems`:\n\n1. **The task\
    \ you promoted cannot be claimed** \u2014 unmet `needs`, open children, `draft`,\
    \ already claimed, not eligible. The queue will skip past it where you just put\
    \ it. This is literally `explain_next()`'s `--why` text pointed at one task rather\
    \ than the whole backlog, and it is the common mistake.\n2. **You ordered a task\
    \ above something it needs** \u2014 the order just written cannot execute in the\
    \ order it reads.\n3. **What you demoted gates other work** \u2014 *\"this pushed\
    \ task-204 down; three open tasks need it.\"*\n4. **The move changes nothing**\
    \ \u2014 the head above the drop is unclaimable, so `next` returns what it returned\
    \ before.\n5. **The queue is not in a state to be reasoned about** \u2014 a duplicate\
    \ or missing position in the band.\n\n**Why this is better and not just cheaper.**\
    \ Entry 6 rejected reason-at-drag-time on three grounds: it becomes wallpaper,\
    \ it explains the grabbed task when the risk is what got pushed *down*, and a\
    \ prior justification cannot see the queue as it now stands. All three grounds\
    \ survive the change of engine and the deterministic check clears all three \u2014\
    \ it fires only on a fact, warning 3 names the demoted task, and it runs after\
    \ the move. **The inversion you argued for in entry 6 is kept in full; only the\
    \ model is gone.** What the model version added on top was a 120-second debounce,\
    \ which was a cost rather than a feature: it existed solely to amortise the price\
    \ of a call, and with no call there is nothing left to buy \u2014 only a notice\
    \ arriving two minutes late, after five more moves, possibly after the tab is\
    \ closed.\n\n**What is genuinely lost.** The model could have said a move was\
    \ *unwise* rather than *illegal*. Not smuggled back, for two reasons. First, that\
    \ is `reorder`'s job and `reorder` does it better: judging an order needs the\
    \ whole band in view, and a check scoped to one drag is the worst available vantage\
    \ point for it. Second, it second-guesses the one act this design already decided\
    \ you own \u2014 entry 3's argument is that at 75 open tasks you are the *less-informed*\
    \ party at ordering time, and what follows from that is an agent that **orders**,\
    \ not an agent that **comments on your ordering**. So: **the deterministic check\
    \ catches the move that cannot work; `reorder` supplies the judgement, over the\
    \ whole band, when asked.**\n\n**The anchor mechanics survive on better evidence.**\
    \ Because the check is synchronous, \"kept over a stated warning\" becomes certain\
    \ rather than inferred \u2014 the warning was on screen when you chose to keep.\
    \ Under the debounced version it was a guess about whether a notice arriving two\
    \ minutes later had been read at all. `undo`/`keep` is unchanged, one click each\
    \ way, and `keep` still promotes the position to the strong anchor `reorder` must\
    \ not move.\n\n**What the change removed structurally, which is the part worth\
    \ noticing.** The reactive lane was the design's **only exception to \xA74.1's\
    \ run-is-a-task rule**, and carrying it required a reserved actor to write objections,\
    \ a machine-local debounce window, a batch-mode spend ceiling, and a fail-open\
    \ story. All five are gone and \xA74's central rule now holds without qualification.\
    \ It also removes the last automatic model call in the design: **every remaining\
    \ playbook run is started by a human on purpose.** And with no dispatch in the\
    \ path there is nothing to be unavailable from a phone on the tailnet, which is\
    \ where you actually reorder.\n\n**Rejected: keeping both, deterministic first\
    \ and a model second.** Tempting and premature \u2014 it is the reopen condition,\
    \ not the design. Stated in \xA75.4: reopen when you find yourself wanting an\
    \ argument about whether a move is *wise* at the moment you make it, and find\
    \ that running `reorder` afterwards does not serve. The reactive lane would then\
    \ return **on top of** the deterministic check, never instead of it, because the\
    \ check is free and always available.\n\n**Consequence: it stops being a playbook\
    \ child.** The check is a property of the `queue move` verb, in the family of\
    \ `queue check` and `explain_next()` \u2014 queue-program work (task-081, task-207),\
    \ not playbook work. **task-219 has been retargeted accordingly**: new title,\
    \ spec, constraints and acceptance; its `needs` on task-215 dropped, so it now\
    \ depends on no playbook machinery and can ship first or last. Its old *do-not-start-without-Jeff's-go-ahead*\
    \ constraint is dropped with the machinery that justified it \u2014 there is no\
    \ model call, no spend and no new category left in it. It is still a draft."
