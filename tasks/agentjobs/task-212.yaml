- id: 6
  ts: '2026-09-06T05:57:32.771491Z'
  actor: claude
  type: decision
  body: 'Unparented from task-294 the same day it was parented, on Jeff''s instruction.
    The Dashboard epic needs the count-tile strip *gone*; it does not need the analytics
    page *built*, and this task is the latter.


    Why it was wrong as a child: this task''s own sequencing puts the Dashboard removal
    last -- "design -> backend history/metrics API -> the page and its charts -> the
    dashboard removal and the link" -- behind the SQLite history contract accepted
    on 2026-09-05 (task-273 backend, task-311 migration). Parented under task-294,
    that made the Dashboard fitting on one screen wait on a storage migration it has
    nothing to do with. Jeff, 2026-09-06: *"yes it needs to be removed, just make
    sure this is not forcing work on it in this epic."*


    **What moved.** The Dashboard-side removal of the `<section aria-label="Task statistics">`
    strip is now task-357''s, as part of deciding what earns a place on a bounded
    Dashboard. That task also decides what happens to the counts in the interim, since
    this page will not exist yet.


    **What this means for this task.** Step 1 ("Relocate") may already be done when
    this starts. Read task-357''s record first: if the strip is gone, sc-1 is satisfied
    and this task is purely step 2 -- build the page, and put the entry point wherever
    task-357 left room for it. The sequencing sentence in the description above is
    superseded to that extent; the rest of it stands.


    **Rejected: splitting this into a removal task and an analytics task.** Tempting,
    and it would have let a piece of it stay under the epic. Against it: the removal
    is one JSX deletion and a decision about the counts, which is smaller than the
    task boundary costs (a worktree, a bootstrap, a gate, a review, a merge, a cleanup)
    -- and task-357 has to make that decision anyway because it is the task deciding
    what fits. A separate task would have two records deciding the same thing.'
