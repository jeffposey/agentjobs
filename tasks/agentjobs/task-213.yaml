spec:
  summary: 'Produce docs/analytics-design.md: define the structured SQLite history
    and query contract with task-273, and specify the analytics page. Design only;
    finish by creating implementation children under task-212.'
  intent: Make backlog trends, throughput, aging and waiting-state charts accurate
    and efficiently queryable. The authoritative SQLite decision is settled; this
    design determines temporal semantics, legacy-history coverage and the page/API
    contract before backend implementation.
  description: "Deliverable is `docs/analytics-design.md`, following the shape of\
    \ `docs/task-selection-design.md` \u2014 numbered sections, so implementation\
    \ children can cite \"section 4\" instead of restating the spec.\n\n**Part one:\
    \ history and query contract.** The owner decided on 2026-09-05 that SQLite, hosted\
    \ alongside the AgentJobs server outside code worktrees, will be authoritative\
    \ (task-273 backend, task-311 migration). Analytics must consume indexed task\
    \ state and timestamped structured state history in that database. Current rows\
    \ alone cannot answer historical backlog questions. Coordinate the history schema\
    \ with task-273 before implementation; do not put metrics dimensions only inside\
    \ whole-task JSON. Optional rollups are rebuildable accelerators, not a separate\
    \ authority. Audit legacy logs and, if useful, one-time Git backfill for fidelity;\
    \ never read Git history on each page request or present missing history as zero.\n\
    \nSpecify event timestamps and before/after state, project/task identity, creation/import\
    \ baseline, lifecycle, ball/reason, outcome, archive and dependency changes needed\
    \ by the chosen metrics. Define open versus closed, cancelled versus completed,\
    \ reopening, archive visibility, daily bucket timezone and end-of-day boundaries.\
    \ Distinguish unique completed tasks from completion events. Provide representative\
    \ SQL for open tasks over time and throughput, with indexes and query-plan/latency\
    \ evidence on a representative dataset. Explain legacy coverage boundaries, late/backfilled\
    \ events and empty/thin/unknown-history presentation. Validate which old logs\
    \ can actually reconstruct state; do not infer historical state merely from today's\
    \ row. Dependency-blocked history needs dependency changes and prerequisite state,\
    \ or an explicit coverage limitation.\n\n**Part two: what the page says.** Not\
    \ a chart list \u2014 start from the questions a person opens the page to answer.\
    \ At least: is the backlog growing or shrinking; is work getting finished faster\
    \ or slower; is anything aging badly; where is work stuck (waiting on a human,\
    \ blocked on dependencies). Then specify the visualisations that answer them,\
    \ the time ranges offered, and what the page shows when there is barely any history\
    \ yet \u2014 a two-day-old project must not render as a broken chart.\n\nSpecify\
    \ the API surface as well: endpoints, shapes, and how they fit the existing generated\
    \ frontend client (`npm run` client generation is part of `scripts/check.py`,\
    \ so the contract matters).\n\n**Part three: the entry point.** Decide the affordance\
    \ that replaces the tile strip on the dashboard \u2014 what it is, what it says,\
    \ whether it carries a number, and where it sits. Include a mobile treatment.\n\
    \n**Then create the implementation children** under task-212, sequenced with `dependencies[]`,\
    \ each citing its section of the design doc."
  constraints: "- Ship the doc, not the code. The only files this task writes are\
    \ `docs/analytics-design.md` and its own task records.\n- Record the temporal\
    \ schema/query and backfill decisions with rejected alternatives. The owner has\
    \ already selected authoritative SQLite; do not reopen YAML versus database here.\n\
    - Back cost claims with real endpoint timings and representative SQL query plans/rows\
    \ visited. Measure the current corpus size rather than assuming an old fixed task\
    \ count. Throwaway benchmarking is allowed.\n- Read `docs/task-schema.md` before\
    \ assuming what a log entry guarantees. The four state axes and which verbs write\
    \ which entries are what determines whether replay works at all.\n- Whatever charting\
    \ approach you propose has to survive the existing gate \u2014 Vitest in jsdom\
    \ and a Playwright path \u2014 so weigh a dependency against what it costs there."
  out_of_scope: Writing the page, the API, or the dashboard change. Choosing a chart
    library by installing one. Cross-project or per-actor analytics, which the parent
    excludes.
  context:
  - path: docs/task-selection-design.md
    why: "The model for this deliverable \u2014 numbered sections that implementation\
      \ children cite rather than restate."
  - path: docs/task-schema.md
    why: "Schema v2's four state axes and which manager verbs append which log entries\
      \ \u2014 this determines whether log replay can reconstruct a past state at\
      \ all."
  - path: src/agentjobs/dashboard.py
    why: The current stats computation, and the definition of each count the page
      must not silently change.
  - path: src/agentjobs/migrate_schema.py
    why: What v1 tasks were turned into. Migrated logs are the likeliest place replay
      fidelity breaks.
  - path: docs/performance.md
    why: The measurement tooling the cost comparison has to use.
