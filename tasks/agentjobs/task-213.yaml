- id: 8
  ts: '2026-09-07T01:45:24.028852Z'
  actor: claude
  type: decision
  body: "## Three defects in the offered history contract, each found by measuring\
    \ it\n\nThis is the coordination task-273's constraints require and the owner's\
    \ fourth-fork answer\nset up. All three were found by building the drafted schema\
    \ and running the real corpus\nthrough it; none is visible by reading the DDL,\
    \ and **each produces a wrong chart with a\nhealthy-looking query plan.** Full\
    \ detail in `docs/analytics-design.md` \xA74 and \xA76; they are\ntask-371's specification.\n\
    \n### 1. Backfilling lifecycle from git double-counts every close\n\nThe log already\
    \ records lifecycle transitions with their true timestamps. Git records the\n\
    same transitions again at commit time. Taking both gave **`SUM(open_delta)` =\
    \ 69 against\n125 open tasks \u2014 a 45% error in the backlog level**, with every\
    \ query plan still reading\n`SEARCH task_event USING INDEX ix_event_backlog`.\n\
    \n**The rule: the backfill is authoritative only for axes the log does not record.**\
    \ Lifecycle\nand outcome from the log, always. Priority, parent, category and\
    \ `archived` from git.\n`queue_position` from both \u2014 a bulk renumber rewrites\
    \ it with no per-task log entry \u2014 with\ngit de-duplicated against any native\
    \ move of the same axis within five minutes. With that\nrule the invariant holds\
    \ exactly and 314 backfilled events survive out of 4,773 raw git\nobservations.\n\
    \n*Rejected: backfilling everything git can see.* It is the obvious implementation\
    \ and it is\nwhat produced the 45% error.\n\n### 2. A backfilled creation instant\
    \ taken at commit time makes the backlog go negative\n\nGit records when a change\
    \ was **committed**, not when it happened. Three tasks here log a\nclose at `2025-10-26T01:24Z`\
    \ while git first sees those files twenty hours later. Replayed\nliterally, the\
    \ backlog series **opens at \u22123**. A negative open count is impossible and\
    \ no\nreader could diagnose it.\n\n**The rule: a backfilled `create` is timestamped\
    \ at the earliest evidence the task\nexisted** \u2014 `min(git commit time, the\
    \ task's own `created`, its first log entry)`. Applying\nit removed the impossibility\
    \ (series minimum 1, maximum 126, ending at the true 125) *and*\nimproved fidelity,\
    \ from 44 disagreeing tasks to 41.\n\nThis is task-311's, and it is the more dangerous\
    \ of the two because an import that has\nalready run without it leaves a store\
    \ that has to be rebuilt rather than patched.\n\n### 3. SQLite cannot bucket by\
    \ a real timezone, and a stored offset is wrong half the year\n\nTask-273's offer\
    \ is `date(ts, :tz)` with the offset from `project.reporting_tz`. SQLite has\n\
    no timezone database and its `date()` modifier takes a **fixed** offset:\n\n|\
    \ instant | true local day (America/Chicago) | `-06:00` | `-05:00` |\n|---|---|---|---|\n\
    | 2026-07-04T05:30Z | 2026-07-04 | **2026-07-03** \u2717 | \u2713 |\n| 2026-12-24T05:30Z\
    \ | 2026-12-23 | \u2713 | **2026-12-24** \u2717 |\n\nEither constant is wrong\
    \ for roughly half the year, in the late-evening hours \u2014 which is\nwhen much\
    \ of this project's work is recorded.\n\nThree ways out, measured: fixed offset\
    \ **0.24 ms and wrong**; a boundary table joined in\nSQL with boundaries from\
    \ `zoneinfo`, **correct and 58.8 ms** (250x, because the correlated\nlookup runs\
    \ once per event against an unindexed `VALUES` list); **API-side bucketing with\n\
    `zoneinfo`, correct and 0.906 ms.**\n\n**Decision: day bucketing happens in the\
    \ API, and `project.reporting_tz` holds an IANA zone\nname rather than an offset.\
    \ SQL filters and returns instants; it never names a day.** The\nAPI has to build\
    \ the calendar spine regardless \u2014 only 26 of 316 days carry a backlog event.\n\
    \n*Rejected: storing the local day on each event.* It makes the naive `GROUP BY`\
    \ correct and\nfast, and freezes the reporting timezone into the data \u2014 in\
    \ a single database shared across\nprojects that may not share a zone.\n\n###\
    \ Two indexes and two smaller items, all measured at 20x scale\n\n- `ix_task_counts\
    \ ON task(project_id, lifecycle, ball, outcome)` \u2014 the five-count summary,\n\
    \  **14.6 ms \u2192 1.68 ms**.\n- `ix_event_source ON task_event(project_id, source,\
    \ ts)` \u2014 history coverage, which runs on\n  every page load, **21.9 ms \u2192\
    \ 6.58 ms**.\n- The `task.parent_id` self-reference needs `DEFERRABLE INITIALLY\
    \ DEFERRED`: a bulk import\n  fails unless children follow parents, and an importer\
    \ should not have to topologically\n  sort a task graph. Hit while loading the\
    \ corpus.\n- `mechanical` must be **populated** at import, not merely defined.\
    \ A column that is always\n  `0` is worse than absent, because the query looks\
    \ correct.\n\n### What needs no change, so nobody adds it later\n\nThe nine before/after\
    \ axes answer every question on the page. `open_delta` carries the\nbacklog level\
    \ entirely. **`ball` needs no generated delta column** \u2014 its three-way running\n\
    sum is a `CASE` over the partial index `ix_event_ball` at 0.46 ms (18.4 ms at\
    \ 20x), so three\nmore stored columns would be maintenance for nothing. `task_state_daily`\
    \ stays deferred with\nits trigger unchanged: a windowed series costing more than\
    \ ~50 ms, against 0.91 ms today.\n\n### And one sequencing constraint that nothing\
    \ in the system enforces\n\nThe backfill reads the git history of the task records,\
    \ so **it must run, and be verified,\nbefore those files are retired.** Retire\
    \ first and the evidence is gone permanently. Already\non task-273 entry 36; repeated\
    \ here because this design is the reason that evidence is worth\nanything, and\
    \ because task-371 is what carries it to task-311."
