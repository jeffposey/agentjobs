    \ is the same test, the same assertion and\nthe same circumstances one day later,\
    \ on a branch containing one markdown file.\n\n`DispatchRunner._conclude_batch_run`\
    \ documents the race and claims to close it: the ledger\nsets `cancel_requested`\
    \ before it kills, and the supervisor \"is blocked in `wait()` until\nthen, so\
    \ the flag is always visible here by the time it matters.\" That sentence is what\n\
    fails under 32 xdist workers.\n\n**Measured here, and it points at task-370's\
    \ first hypothesis** \u2014 the child terminating\nbefore the cancel arrives,\
    \ so the ordering guarantee never applied:\n\n- **20 consecutive isolated runs\
