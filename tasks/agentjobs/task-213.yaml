    \ commit\n  the finish tried to merge.\n\nFailing and passing runs are the same\
    \ commit, machine and command. A lost read-modify-write\non the meta file would\
    \ not care about isolation; a spawn losing its slice to 31 sibling\nworkers would.\n\
    \n**This evidence belongs on task-370 and could not be written there:** a run\
    \ may act on its\nown task and no other (`docs/authorization.md`), so the API\
    \ refused it with\n`Run run_1b6cd5b8 was dispatched to work task-213 and addressed\
    \ task-370`. Worth moving\nacross \u2014 two finishes stopped in two days, on\
    \ branches neither of which touched dispatch, is\nthe argument that record needs.\n\
