- id: 7
  ts: '2026-09-07T01:44:53.555905Z'
  actor: claude
  type: progress
  body: "## The design is written, and it was checked against the corpus rather than\
    \ reasoned about\n\n`docs/analytics-design.md`, fifteen numbered sections, on\
    \ branch\n`docs/task-213-analytics-design`. Two commits, rebased onto `main`,\
    \ and the full\nunqualified `scripts/check.py` is green on the rebased tree \u2014\
    \ ten of ten stages, 300.8 s,\nreceipt written for `26d83e01`.\n\nEntry 12 of\
    \ task-273 licensed spending longer than the immediate need; the same licence\n\
    applies here, because the analytics page is the consumer most able to discover\
    \ the store\ncannot answer something. So this pass did not stop at prose. A throwaway\
    \ probe built\ntask-273's drafted schema as real SQLite, loaded all 367 task records\
    \ into it with every\nconstraint on, synthesised `task_event` from log replay\
    \ **plus** the git backfill the owner\nchose, and measured the page's whole query\
    \ set with its plans. Everything below is a\nmeasurement taken on this machine\
    \ on 2026-09-06. The probe lives in a job scratch\ndirectory; nothing from it\
    \ was committed, and the only file this task writes is the design\ndoc.\n\n###\
    \ What the page costs\n\n| | |\n|---|---|\n| the whole seventeen-query page |\
    \ **6.30 ms** |\n| the same at **20x** scale (7,340 tasks / 43,920 events) | 253\
    \ ms |\n| `GET /api/projects/agentjobs/dashboard` **today** | 719\u2013779 ms,\
    \ 367 parses |\n| `GET /api/projects/agentjobs/tasks` today | 790 ms, `X-Task-Parses:\
    \ 367`, 7.0 MB |\n| parse the corpus at all (libyaml) | 427 ms |\n\n**No plan\
    \ touches a JSON column and none scans a task document.** The backlog series is\n\
    `SEARCH task_event USING INDEX ix_event_backlog` at 0.24 ms; throughput\n`ix_event_closed`\
    \ at 0.22 ms; aging `ix_task_open_age` at 0.13 ms. An analytics endpoint\non today's\
    \ storage would cost more than either endpoint above, because it needs every\n\
    task's log and not just its current row.\n\n### The history is far better than\
    \ the log alone suggested\n\nTask-273 measured log-only replay: priority wrong\
    \ for 337 of 367 tasks. With the git\nbackfill the owner chose, plus the manager's\
    \ own semantics applied to entries that recorded\na lifecycle without the ball\
    \ it implies:\n\n| axis | replay disagrees with the current row |\n|---|---|\n\
    | ball / ball_reason | **1 / 367** |\n| position | 2 / 367 |\n| parent | 3 / 367\
    \ |\n| priority | **6 / 367** |\n| archived | **0 / 367** |\n| outcome | 22 /\
    \ 367 |\n| lifecycle | 29 / 367 |\n| **any axis** | **41 / 367 (11%)** |\n\nThe\
    \ backfill costs **0.4 s of `git log` and 0.16 s of parsing**, once, over 1,420\
    \ commits\nback to 2025-10-26. Three things did the work: git supplies the priority\
    \ value at file\ncreation for 369 tasks, which the log never wrote down; `queue_move`\
    \ entries turn out to\ncarry `from_band` \u2192 `band` and so held most priority\
    \ transitions all along; and applying\nthe manager's promote/release/claim semantics\
    \ took ball disagreement from 119 to 1.\n\n**`archived` has never transitioned\
    \ in this project** \u2014 verified against the backfill, not\nassumed. Both archived\
    \ tasks took the flag as an initial value in the 2026-08-10 migration\ncommit,\
    \ so there is no archive history to lose.\n\n### The invariant holds, and the\
    \ numbers reconcile with the running server\n\n`SUM(open_delta)` = **125** = `COUNT(*)`\
    \ of open tasks, after import, after backfill and\nafter reconciliation. And the\
    \ five counts computed from the probe are identical, field for\nfield, to what\
    \ the server on 8876 returns from `build_dashboard_snapshot`:\n\n```\nprobe :\
    \ total 367  in_progress 1  blocked 0  waiting_for_human 0  awaiting_input 29\
    \  completed 219\nserver: total 367  in_progress 1  blocked 0  waiting_for_human\
    \ 0  awaiting_input 29  completed 219\n```\n\nThat is sc-7's \"current-state totals\
    \ reconcile with the dashboard\", demonstrated. \xA75.3\nturns it into a test\
    \ task-372 owns, so the two cannot drift apart silently.\n\n### Facts that shaped\
    \ the page rather than decorating it\n\n- **Only 26 of 316 days (8%) carry a backlog\
    \ event.** A chart plotted from grouped rows\n  would draw a line through 8% of\
    \ the days and imply the level was undefined between them,\n  so the API fills\
    \ the calendar spine.\n- **244 close events across 242 distinct tasks** \u2014\
    \ two reopenings. Unique tasks and\n  completion events are both returned; only\
    \ the first is plotted.\n- **242 closed, of which 219 completed**, 16 superseded,\
    \ 5 duplicate, 2 cancelled. Reporting\n  closed as completed would overstate delivered\
    \ work by 10%.\n- Open work sits at `agent`/`available` 93, `human`/`spec` 29,\
    \ `agent`/`answer` 2,\n  `agent`/`work` 1.\n- Priority moved **37 times in this\
    \ project's life**, earliest 2026-08-15. A priority-churn\n  chart will look sparse\
    \ because the project is sparse, not because the method failed.\n\n### The charting\
    \ decision was measured, not preferred\n\nThe parent asks that any charting approach\
    \ survive Vitest-in-jsdom and a Playwright path.\nProbed against this repository's\
    \ own jsdom 30.0.1: `getBoundingClientRect()` returns all\nzeros, `offsetWidth`/`clientWidth`\
    \ are 0, `ResizeObserver` is **undefined**, `getBBox` is\n**undefined**, and `canvas.getContext('2d')`\
    \ returns **null**. Anything that measures its\ncontainer \u2014 Recharts' `ResponsiveContainer`,\
    \ visx's parent-size hook, Chart.js \u2014 renders\nnothing in the `vitest` stage\
    \ without shims, and a canvas library cannot render at all\nwithout adding a native\
    \ `canvas` build to a 30-second bootstrap. So: inline SVG with path\ndata from\
    \ pure functions, which vitest tests with no DOM at all. \xA710.1 carries the\
    \ reopen\ntrigger.\n\n### Deliverables\n\n- `docs/analytics-design.md` (\xA71\u2013\
    \xA715), on `docs/task-213-analytics-design`.\n- Four implementation children\
    \ under task-212: **task-371** (schema and import amendments,\n  critical), **task-372**\
    \ (API), **task-373** (page and charts), **task-374** (Dashboard\n  link), chained\
    \ by `needs` edges, each citing its sections."
