  ts: '2026-08-23T08:12:33.160461Z'
  actor: claude
  type: decision
  body: "The `kind: batch|reactive` field this task's spec names is NOT implemented,\
    \ and that is deliberate.\n\nThe design withdrew the reactive playbook category\
    \ outright (\xA75.4, decision P8, revised 2026-08-21 on Jeff's review): \"A playbook\
    \ in this design is batch work over a project or a task, and nothing else.\" The\
    \ frontmatter example in \xA73.2 has no `kind` field, and its field table does\
    \ not list one. This task's spec was written on 2026-08-21T04:55, before that\
    \ revision landed.\n\nRejected alternative: ship `kind` anyway as an enum with\
    \ a single `batch` member. That would put a field in every playbook's frontmatter\
    \ that carries no information, and would leave the string `reactive` in the codebase\
    \ naming a category the approved design says has no members and is not coming\
    \ back. A later reader would reasonably conclude the category exists.\n\nAlso\
    \ rejected: ship `kind: batch|reactive` as written. The task's own constraints\
    \ make P1/P2/P5/P10 binding and name the design as the specification; P8 is a\
    \ decision of the same design and shipping against it would encode a superseded\
    \ draft.\n\nIf the reactive lane ever reopens on P8's stated condition, `kind`\
    \ is a one-field addition to `PlaybookContract` at that point, and the reopen\
    \ will know what its members are.\n\nConsequence for \xA77.1's `playbook list`\
    \ line (\"names + descriptions + kinds\"): the CLI listing shows `target`, `difficulty`\
    \ and the gate count instead, which is the same orientation the word \"kinds\"\
    \ was reaching for."
  data:
