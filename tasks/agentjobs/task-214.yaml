- id: 6
  ts: '2026-08-23T08:12:47.896038Z'
  actor: claude
  type: decision
  body: "Four smaller calls the spec left open, each with what was rejected.\n\n1.\
    \ **A second REST route, `GET /api/projects/{id}/playbooks/{name}`, was added.**\
    \ The spec names only the collection. Without the detail route no remote surface\
    \ can read a brief at all: `playbooks_list` returns contracts, and `playbook show`\
    \ reads the local file, so an agent that discovered a playbook over MCP could\
    \ never see what it says. It is also where 404-vs-422 becomes expressible. It\
    \ is a GET, so P10 is untouched. Rejected: putting every body in the collection,\
    \ which turns a discovery listing into a corpus fetch.\n\n2. **`playbook init`\
    \ skips per file rather than refusing outright.** sc-3 says \"refuses to overwrite\
    \ an existing file\"; both readings satisfy that. Per-file skip lets a project\
    \ that tuned `groom.md` take a newly shipped `reorder.md` without the tuned one\
    \ being touched, and the command reports every file it kept so nothing is silent.\
    \ Rejected: all-or-nothing refusal, which makes the shipped set unusable after\
    \ the first local edit and teaches people to delete files to get past it. Also\
    \ rejected: the `--force-refuse` flag \xA77.1 sketches \u2014 there is no force,\
    \ so there is nothing to flag.\n\n3. **Unknown frontmatter keys are refused, and\
    \ `verbs:` entries are checked against the manager verbs.** Both are spelling\
    \ checks. `run_taks:` under a tolerant reader is a silently ignored contract \u2014\
    \ the failure StrictModel exists to stop for task records \u2014 and a `clsoe`\
    \ in `verbs:` makes the declared contract unmatchable against the log, which is\
    \ what P5's after-the-fact audit depends on. Neither is per-run enforcement, so\
    \ P5 is untouched. Rejected: tolerating unknown keys for forward compatibility.\
    \ Child 2 adds fields to the model, not to individual files, so there is nothing\
    \ to be forward-compatible with.\n\n4. **`run_task.category` is not validated\
    \ against the project's configured categories.** A playbook is read without reference\
    \ to any one project's config \u2014 the same file is read by `playbook show`,\
    \ by the API, and by the shipped-reference test where there is no project at all\
    \ \u2014 and the manager already validates the category when the run task is created\
    \ (task-215). Rejected: validating at load, which would make a playbook's validity\
    \ depend on which project it is being read from."
  data:
    operation:
      id: 7c1e0a52-0214-4a11-9f01-000000000004
      kind: log_append
      fingerprint: db1639c947cd81b932694166c565bc05
