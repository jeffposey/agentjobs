  body: "Playbook instantiation is complete and verified. Branch `feat/task-215-playbook-run`,\
    \ six commits d1c0b6f..5da808b, gate green on all ten stages with a receipt at\
    \ the tip. Not merged, not pushed.\n\n**What it does.** `agentjobs playbook run\
    \ <name>`, `POST /api/projects/{id}/playbooks/{name}/run`, and a Playbooks page\
    \ with a Run button beside Dispatch in the nav. A project-target playbook (groom,\
