ball_prompt: 'Approved -- cleared to merge. Rebase onto main, merge --no-ff, mark
  the branch merged in branches[], and close this task completed. No merge has happened
  yet: the UI records approval, it does not run git.


  Note from Jeff Posey:


  Standing approval from Jeff for every task-211 child, relayed by the supervisor
  after review. Held back deliberately until task-219''s merge landed: two scripted
  finishes merging into main at once is how the generated-client conflict that cost
  task-219 two cycles gets manufactured a second time. task-219 merged as 75c3387,
  so this one can go.


  **On sc-4, which the handoff correctly says cannot be satisfied as written -- the
  reading is right and is better than the criterion.** The spec asks that reactive
  playbooks be refused by `playbook run`. There is no `kind` field to test, because
  decision P8 withdrew the reactive category after the spec was written and task-214
  declined to build a single-member enum for it. Rather than reintroduce `kind`, this
  makes the refusal structural: task-214''s frontmatter contract forbids unknown keys,
  so a file declaring `kind: reactive` fails validation and never loads, and a playbook
  that never loads cannot be run from any surface -- including surfaces nobody has
  written yet. An enum check would only have covered the surfaces that remembered
  to call it. Accepted as met.


  **On the judgement call the handoff asked for a second opinion on -- `playbook run
  --actor` having no `default_user` fallback, unlike every other `--actor` in the
  CLI -- keep it.** The run task''s own creation entry is read moments later as the
  authorisation for spending money, and substituting the project''s `default_user`
  would put a signature on that entry that no person put there. That is precisely
  the reasoning `dispatch run` already uses when it refuses `not_human_clocked` rather
  than inventing an author, and where a `--as` flag was considered and deliberately
  left unbuilt. Costing a flag on every CLI run is the correct price. It is consistent
  with existing precedent rather than a new rule.


  Also checked rather than taken: `TestGatesStillBind` really does read `dispatch/guards.py`
  as text so no guard can start reading `request.playbook` without failing; there
  is no `playbook_run` MCP tool and its absence is documented at the top of the module
  as deliberate; and a test asserts the brief''s text is absent from the dispatch
  prompt, so the pointer-not-copy rule is enforced rather than described. Six commits,
  +3412, worktree clean, gate green with a receipt at the tip.


  Two limitations the handoff put on the record rather than leaving to be found --
  a resumed session''s wake prompt not carrying the pointer line, and `run_task.category`
  not validated against the project''s categories -- are both accepted as stated.
  The second is not a regression: nothing in AgentJobs validates categories today.


  The child''s session was stopped before this approval so its working directory does
  not pin the worktree the finish removes.


  That note is context to carry into the merge, not another review round: you are
  still cleared to merge.'
