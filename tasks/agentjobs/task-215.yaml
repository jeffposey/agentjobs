- id: 5
  ts: '2026-08-23T09:07:42.470529Z'
  actor: claude
  type: decision
  body: "**sc-4's first half is satisfied structurally, and no `kind` field was reintroduced.**\n\
    \nThe criterion says \"Reactive playbooks are refused by playbook run\". There\
    \ is no `kind`\nfield to check: decision P8 withdrew the reactive category on\
    \ 2026-08-21, after this\ntask's spec was written, and task-214 deliberately did\
    \ not implement `kind` for that\nreason (its decision entry of 2026-08-23). Read\
    \ literally, sc-4 asks this task to refuse\na thing the codebase cannot express.\n\
    \n**How it is resolved.** task-214's frontmatter contract forbids unknown keys,\
    \ so a file\ndeclaring `kind: reactive` does not load at all \u2014 `playbook\
    \ run` refuses it with\n`invalid_playbook`, naming the field. That is a *stronger*\
    \ guarantee than an enum check\nwould have been: it holds on every surface, including\
    \ ones nobody has written yet,\nbecause the refusal is at the parser rather than\
    \ in one command. Exercised by hand\n(`POST .../playbooks/watch/run` \u2192 `422\
    \ invalid_playbook`, \"watch.md: kind -- Extra\ninputs are not permitted\") and\
    \ pinned by\n`tests/test_playbook_run.py::TestUnrunnable::test_a_reactive_playbook_cannot_be_run_because_it_cannot_be_read`.\n\
    \n**Rejected: implement `kind: batch|reactive` as the spec says and refuse `reactive`.**\n\
    It would put a single-member-in-practice enum in the codebase naming a category\
    \ the\napproved design says has no members and is not coming back, and every playbook's\n\
    frontmatter would carry a field with no information. It also contradicts this\
    \ task's own\n`constraints`, which make the design's decisions binding.\n\n**Also\
    \ rejected: a bespoke error message for the `kind` key**, pointing a reader at\
    \ P8.\nHelpful, and it puts the withdrawn word `reactive` back into the source\
    \ for the sake of\na mistake only someone working from the superseded spec could\
    \ make. \"kind: Extra inputs\nare not permitted\" already names the field and\
    \ is actionable.\n\nsc-4's second half (MCP has no run tool) is unchanged and\
    \ met. task-214's name-based\ncheck is kept and a stronger one added: no file\
    \ in `agentjobs/mcp/` may mention\n`run_playbook` or `playbooks.run`, because\
    \ matching on tool names would miss a tool\ncalled something else."
  data:
    operation:
      id: 8d2f4a10-0215-4b21-9c02-000000000003
      kind: log_append
      fingerprint: b92bec35703b228701bc16819d4b24a8
- id: 6
  ts: '2026-08-23T09:08:03.841959Z'
  actor: claude
  type: decision
  body: "Four calls the spec left open, each with what was rejected.\n\n**1. `agentjobs\
    \ playbook run --actor` has no `default_user` fallback**, unlike every\nother\
    \ `--actor` in this CLI. It names the human creating the run task for a\nproject-target\
    \ playbook; without one the command refuses with `no_authorizing_human` and\n\
    creates nothing.\n\nThe spec says \"default_user is never substituted\" and this\
    \ is the only place that could\nhave. A project-target run creates the task it\
    \ then dispatches, so the human-clocked rule\nreads an entry this command *wrote\
    \ a moment earlier* \u2014 and an entry attributed to\nwhoever the config happens\
    \ to name is the signature task-188 refuses to invent. Rejected:\n`_resolve_actor(config,\
    \ actor)`, which every other CLI write uses and which falls back to\n`default_user`.\
    \ That would have made `agentjobs playbook run groom` work with no flags,\nat\
    \ the cost of the sentence the spec is explicit about.\n\nWhat this flag is *not*\
    \ is a way to authorise a dispatch from a shell: it can only reach\na task it\
    \ just created, and a **task-target** run does not use it at all \u2014 the target's\n\
    own newest entry must be a human's, exactly as `agentjobs dispatch run` requires.\
    \ So the\n`--as` flag `dispatch run` declined is still not here.\n\n**2. A refusal\
    \ that arrives after the run task exists leaves it there, and says so.**\nGates\
    \ 1\u20134 are asked *before* anything is written (`assert_dispatch_permitted`\
    \ in\n`run_playbook`), so \"dispatch is off on this machine\" \u2014 the refusal\
    \ that proves nothing\ncould have run \u2014 creates nothing. The refusals that\
    \ need a task to judge (a busy machine,\na dirty tree, a live run) can still land\
    \ after creation, and `PlaybookDispatchRefused`\nthen names the run task in its\
    \ message; it is `ready` and dispatchable from its own page.\nRejected: deleting\
    \ the run task to tidy up. Deleting task records to make a failure look\nneater\
    \ is not a trade this project makes, and \"a human asked for a groom run\" is\
    \ true\nwhether or not the machine had a slot. Also rejected: replicating the\
    \ concurrency and\nclean-tree checks in the pre-flight \u2014 two copies of a\
    \ gate drift, and `dispatch_task`'s\nordering is load-bearing.\n\n**3. `run_task.title`\
    \ templating is `{project}` and `{playbook}`, by targeted\nsubstitution rather\
    \ than `str.format`.** A title is authored prose, and `format` turns an\nunrecognised\
    \ brace into a `KeyError` at instantiation time \u2014 a run refused because\n\
    somebody wrote a literal `{` in a title. Anything the pattern does not name is\
    \ left\nexactly as written. (None of the three shipped references uses a placeholder\
    \ today.)\n\n**4. `agentjobs.playbooks.run` is deliberately not imported by the\
    \ package `__init__`.**\nTwo things depend on it: `agentjobs.dispatch` can hold\
    \ a `PlaybookPointer` without the\ntwo packages importing each other (`run` imports\
    \ the guards), and every read surface \u2014\n`playbook list`, the GET routes,\
    \ `playbooks_list` \u2014 stays structurally unable to reach an\nexecution path.\
    \ Both are pinned by tests. Rejected: exporting `run_playbook` from the\npackage\
    \ for convenience, which closes the import cycle and makes the read/execute\n\
    separation a convention rather than a property."
