    \ at, never copied: one appended line on the prompt stub, a short pointer in the\
    \ run task's spec, and `playbook` + `playbook_hash` on the dispatch entry.\n\n\
    **How I read sc-4, which cannot be satisfied as written.** It says reactive playbooks\
    \ must be refused, and there is no `kind` field to check \u2014 P8 withdrew the\
    \ reactive category after this spec was written, and task-214 declined to build\
    \ `kind` for that reason. I did not reintroduce it. Instead the refusal is structural:\
    \ task-214's frontmatter contract forbids unknown keys, so a file declaring `kind:\
    \ reactive` never loads, and a brief that never loads cannot be run on any surface\
    \ \u2014 including surfaces nobody has written yet. That is stronger than an enum\
    \ check would have been. The criterion text on the record now carries that note,\
