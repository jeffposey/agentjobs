  type: decision
  body: "**Decision: the live run is instantiated through the real code but not dispatched,\
    \ and the reason is structural rather than a preference.**\n\n`agentjobs playbook\
    \ run groom` cannot be run tonight, for two independent reasons, either of which\
    \ is sufficient:\n\n1. **The brief is on this branch and `playbook run` reads\
    \ the project root.** `run_playbook` calls `read_playbook(project.playbooks_dir(),\
    \ name)`, and `Project.root` for `agentjobs` is the shared clone `C:/projects/agentjobs`,\
    \ which is on `main`. `playbooks/groom.md` does not exist there and will not until\
    \ this branch merges \u2014 which happens after the handoff, not before it. The\
    \ command would refuse with `unknown_playbook` and start nothing. Registering\
    \ the worktree as a second project to get around it was rejected: it would also\
    \ redirect `tasks_dir()` into the worktree, and every task record written by the\
    \ run would land somewhere the dashboard never reads, which is the failure ENGINEERING.md's\
    \ \"task files live on main\" rule exists to prevent.\n\n2. **`--actor` must name\
    \ a configured human, and the only one is asleep.** `run_playbook` refuses a project-target\
    \ run with `no_authorizing_human` unless a human is named, because the creation\
    \ entry it writes is what the human-clocked dispatch rule then reads. Passing\
    \ `--actor \"Jeff Posey\"` would write his authorising signature for a spend he\
    \ did not clock \u2014 precisely the substitution task-188 exists to refuse, and\
    \ the CLI's own docstring says so in as many words (\"an unattributable run costs\
    \ the whole point of the human-clocked rule\"). This was rejected on its own merits\
    \ and would still have been rejected had reason 1 not existed.\n\n**What was done\
    \ instead.** The run task was created by the real instantiation code \u2014 `read_playbook`,\
    \ `pointer_for`, `_run_task_payload`, `create_run_task` \u2014 against the shared\
    \ clone's `TaskManager`, with the pointer taken over the brief authored on this\
    \ branch and `project_root` set to the worktree so the recorded path is the relative\
    \ `playbooks/groom.md` it will be after the merge. So the run task's title, summary,\
    \ pointer description, `context[]`, tags, category, priority and acceptance criteria\
    \ are all the ones frontmatter produced, not ones written by hand to look like\
    \ them. Attribution is `claude`, honestly, because that is who created it.\n\n\
    **What that leaves unexercised, stated plainly:** the dispatch half \u2014 `assert_dispatch_permitted`,\
    \ the runner resolution, the prompt line, and the `playbook`/`playbook_hash` pinned\
    \ on the dispatch entry. That half is task-215's deliverable and task-215 proved\
    \ it live on its own record; nothing about it is specific to groom. What is specific\
    \ to groom is the brief's discipline over a real corpus, and that is what this\
    \ run exercises.\n\n*Rejected: copying the brief into the shared clone untracked,\
    \ running the real command, then deleting it.* It dirties `main`'s working tree,\
    \ which the dispatch guards check and the scripted finish depends on, and it still\
    \ requires forging the human of reason 2.\n\n*Rejected: deferring the live run\
    \ until after the merge.* The merge is triggered by an approval this task is handed\
    \ off for; deferring the run past it means handing off with nothing proven, and\
    \ the propose half is the half that does not need the merge."
