spec:
  summary: 'Author playbooks/groom.md to the design''s normative spec and run it once
    for real against this backlog: propose closures, get Jeff''s approval on the run
    task, execute only what was approved through close with outcome duplicate/superseded.
    The proving case for the whole playbook concept.'
  intent: A playbook that has never run is a document. Groom is the case whose gate
    discipline (propose-then-approve) exercises everything the design claims about
    run-is-a-task, and the backlog genuinely needs it.
  description: "Implements section 5.1 of docs/playbooks-design.md (the task-211 deliverable;\
    \ add it to context[] once it merges). Groom is the proving case task-211 named\
    \ in its acceptance criteria, and this child is to playbooks what task-209 is\
    \ to the queue program: the live run that shows the machinery working on the real\
    \ corpus.\n\nThe brief must encode, normatively:\n\n- Sweep the open corpus for\
    \ duplicates, superseded work, and stale premises.\n- Propose first, always: the\
    \ closure proposal lands on the run task (one item per task: id, proposed outcome,\
    \ reason, evidence), then handoff ball: human / review with the proposal as ball_prompt,\
    \ and stop.\n- Execute only the recorded approved list, through the managed close\
    \ verb, outcomes limited to duplicate | superseded, each close body referencing\
    \ the run task. Partial approval is expressible; what executes is what was approved,\
    \ nothing else.\n- Stale-but-not-duplicate/superseded tasks are surfaced as questions,\
    \ never closed \u2014 wont_do is a human's own judgment (design \xA75.1).\n- Never\
    \ delete a file, never rewrite a spec, never reprioritise, never reorder. Groom\
    \ prunes the list; reorder orders what survives; they meet at the tail from different\
    \ directions.\n\nThe live run: `agentjobs playbook run groom` against this backlog,\
    \ the full propose \u2192 approve \u2192 execute cycle, evidence on the run task.\
    \ The mandatory human gate is the point \u2014 demonstrate that nothing closed\
    \ before the approval entry existed, and that the executed set equals the approved\
    \ set."
  constraints: "Design decision P7 (groom's mandatory gate and its executable set)\
    \ is binding. The run acts through managed verbs only. No close outside the approved\
    \ list, ever \u2014 this is the acceptance test of the whole design's guardrail\
    \ story."
  out_of_scope: Reordering anything (that is reorder's job, child 4). Closing anything
    as wont_do. Recurrence.
  context:
  - path: ALLAGENTS.md
    why: The workflow contract the run obeys; the proposal/approval mechanics are
      ordinary handoff mechanics.
