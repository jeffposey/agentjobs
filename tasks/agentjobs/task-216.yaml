    - task-183-cli-batch-run-always-interrupted \u2192 `duplicate` of task-278, which\
    \ is closed/completed with all three criteria met and fixed in `c33ca00`.\n\n\
    The eleven declined candidates are named on task-290 with the evidence for declining,\
    \ because a sweep is only as good as what it refused to propose. One is worth\
    \ repeating here: **task-105 looked stale and is not.** This run's own task was\
