- id: 8
  ts: '2026-08-23T11:02:22.619571Z'
  actor: claude
  type: decision
  body: '**Two decisions the live run forced, both changing the brief after it was
    first written. Recording them because one is a deviation from the design''s literal
    prose.**


    **1. A task whose `ball` is `human` is in scope for a groom sweep.** The first
    draft excluded it, reasoning that it is on somebody''s desk and theirs to judge.
    Against this backlog that rule removed 34 of 119 open tasks -- the whole block
    of audit findings parked at `human`/`spec`, which is exactly where duplicates
    collect, because nobody has triaged that pile yet. The reasoning was also wrong
    on its own terms: the proposal is addressed to the same person holding those tasks,
    so withholding an item because it is already in their hands hands them a shorter
    list, not a safer one. The exclusion that does carry weight is work **in flight**,
    where a close destroys a live session; a human-held task has no session to destroy.
    The item now says when a human is holding the task, so they can bring context
    the run cannot see. Fixed in `564fe21`.


    *Rejected: keeping the exclusion and mentioning the skipped pile in the proposal.*
    It sounds safe and is worse -- it produces a proposal whose omissions are invisible
    unless the reader counts, and the reader is the person the omission was supposedly
    protecting.


    **2. Groom''s gate hands off at `human`/`approval`, not `human`/`review`.** Design
    section 5.1''s prose says `review`. The same section''s heading calls the gate
    "mandatory human approval", the schema has an `approval` reason for exactly this,
    and `review` is the reason the merge gate uses -- where the ask is *read this
    diff*, not *authorise this list of writes*. Those are different questions and
    get different answers. Decision P7 pins the gate and the executable set, not the
    reason code, so nothing binding moves. Fixed in `983b9b9`, and the brief states
    the deviation and its grounds in place rather than only here.


    *Rejected: following the design''s prose literally and using `review`.* It would
    have made the run task read as a code review in the dashboard''s own vocabulary,
    which is the one thing this handoff is not, and it would have propagated the design''s
    slip into every future groom run rather than correcting it once.


    **Both were found by running the brief rather than by reading it, which is the
    argument for sc-2 and sc-3 existing at all.** Neither is visible from the design;
    both are obvious the moment a real corpus is in front of you.'
