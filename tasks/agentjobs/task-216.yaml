  body: "Complete on branch `feat/task-216-groom-playbook`, four commits off the post-215\
    \ `main` at `0de67a8`. Nothing merged, nothing pushed.\n\n## What was built\n\n\
    **`playbooks/groom.md`** \u2014 the project's normative groom brief, section 5.1\
    \ and decision P7 in the form a run actually reads. task-214 shipped a first-pass\
    \ reference written straight from the design's bullets; this is the version that\
    \ answers the questions a run hits against a corpus of 119 open tasks. What it\
    \ adds:\n\n- **What the sweep excludes and why** \u2014 the run task itself, a\
    \ task an agent is working right now, and a parent with open children. Each of\
    \ those closes something out from under somebody.\n- **Which half of a duplicate\
    \ pair dies**, ordered: further along, richer record, depended on, then the older\
    \ id. A proposal that names a pair without naming the survivor is not actionable,\
    \ and this is exactly the judgment a human contests.\n- **Proposal mechanics**\
    \ \u2014 the `ball_prompt` carries the whole list rather than pointing at it;\
    \ the sweep is proposed once rather than drip-fed; a proposal recorded after a\
    \ close is not a proposal, because the ordering is the entire audit guarantee.\n\
    - **Execution discipline** \u2014 re-read the record before executing; ambiguity\
    \ is not approval; an approval that *adds* an unproposed id is not executable\
    \ either, and the answer is to propose it properly rather than to close on an\
    \ id alone. Report a refused close, never work around it.\n- **Finding nothing\
    \ is a result**, reported as one, with what was read and why nothing qualified.\
    \ A groom run's whole value is trust that an id on its list is dead, and one bad\
    \ close costs more of that than ten empty runs gain.\n\nCommits:\n\n- `bf8a68c`\
    \ the brief.\n- `b293cfe` the shipped reference brought level with it, plus two\
    \ tests that pin **this repository's own** `playbooks/` the way `TestRealCorpus`\
    \ pins its task records \u2014 a playbook is authored by hand, is loaded by nothing\
    \ else in the suite, and fails at the one moment it matters with `invalid_playbook`\
    \ and nothing started.\n- `564fe21` and `983b9b9` two fixes the live run found\
    \ in the brief; see the decisions below.\n\n## The live run: task-290\n\nInstantiated\
    \ through the real code \u2014 `read_playbook`, `pointer_for`, `_run_task_payload`,\
    \ `create_run_task` \u2014 not dispatched. The decision entry above states both\
    \ reasons, and both are structural rather than preferences.\n\n**Nothing was closed,\
