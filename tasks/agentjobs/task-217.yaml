spec:
  summary: "Author playbooks/reorder.md \u2014 graded effort by depth, writes through\
    \ queue move itself with a reason per move, respects human anchors derived from\
    \ queue_move provenance \u2014 expose last-move actor in the queue listing so\
    \ a run can derive anchors, and run it live once after task-209's manual pass."
  intent: Reorder is the playbook with a named consumer and a stated model posture
    (frontier runner); it is what turns \"autonomous work is the direction\" into
    something the queue actually runs.
  description: "Implements section 5.2 of docs/playbooks-design.md (the task-211 deliverable;\
    \ add it to context[] once it merges). This generalises the task-209 pattern into\
    \ the reusable brief, under the bounds Jeff set on 2026-08-20 (task-211 log entries\
    \ 2, 3, 5 and 6 \u2014 binding).\n\nThe brief must encode, normatively:\n\n- Graded\
    \ effort by queue depth: head of each band (~5) ordered exactly with a reason\
    \ per move; next 5-10 in rough buckets; tail untouched except a triage scan asking\
    \ only \\\"does anything here belong near the head?\\\".\n- The run writes through\
    \ `queue move` itself \u2014 human review optional, not required \u2014 and every\
    \ move's queue_move body carries the reason for the placement. Recorded reasoning\
    \ is what makes optional review safe.\n- Triggered, not continuous: runs on explicit\
    \ request or because new tasks arrived; never on a schedule, never per dispatch.\n\
    - Anchors: a position whose latest queue_move actor is human is an anchor. Order\
    \ around anchors; overriding an ordinary anchor requires an explicit statement\
    \ naming it and the grounds; a strong anchor (kept-over-objection, child 6) is\
    \ never moved \u2014 raise a question instead. Anchors expire on material change:\
    \ close, band change, or a needs dependency resolving.\n- No scoring \u2014 no\
    \ numeric ranking function over signals. The output is an argument a reader can\
    \ disagree with (task-selection-design \xA712's scoring rejection still binds).\n\
    \nMechanics this child builds beyond the brief: the queue listing (API/CLI) gains\
    \ each open task's last queue_move actor so a run derives anchors without parsing\
    \ every log itself.\n\nThe live run: after task-209's manual ordering pass has\
    \ happened, one real `playbook run reorder`, demonstrating anchor respect (task-209's\
    \ human-approved head positions are anchors) and recorded reasons on every move."
  constraints: 'Design decision P7''s reorder bounds are binding, as are the decisions
    recorded on task-211 (log entries 2, 3, 5, 6). Ordering is not grooming: the run
    closes nothing, reprioritises nothing, rewrites nothing.'
  out_of_scope: "The reactive queue-check (child 6) \u2014 this child only consumes\
    \ its strong-anchor record if it exists. Any recurrence wiring. The task-209 live\
    \ reorder itself."
  context:
  - path: docs/task-selection-design.md
    why: "The queue verbs and invariants the run rides; \xA712's scoring rejection\
      \ still binds."
