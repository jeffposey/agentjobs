  body: "**Decision: the kickoff prompt asked for two things that are not this task's,\
    \ and they were not built.**\n\nThe prompt that started this session says, in\
    \ \"What to do\" step 2, to *\"build the last-`queue_move`-actor exposure with\
    \ tests\"*, and earlier that task-219's `keep` verb matters because *\"your brief's\
    \ anchor rules consume that record\"*.\n\nNeither belongs to task-218. Flesh-out\
    \ has no anchor rules \u2014 anchors are `reorder`'s (design \xA75.2, decision\
    \ P7), and `reorder` is **task-217**, which is open and unclaimed. The queue-move\
    \ actor exposure is queue-program work and appears nowhere in task-218's spec,\
    \ constraints or acceptance criteria. Both sentences read as carried over from\
    \ a sibling's brief.\n\nTask-218's record is the specification, and it names two\
    \ criteria: author the brief, and run it live. That is what this session did.\n\
    \n*Rejected: building the exposure anyway on the grounds that a kickoff prompt\
    \ asked for it.* It would put queue-program code on a playbooks branch, make the\
    \ review one thing plus an unrelated thing, and \u2014 worse \u2014 quietly take\
    \ work out of task-217's or the queue program's scope without any record that\
    \ it had moved. If it is wanted, it is a task, and filing it is cheaper than discovering\
    \ later that two branches both touched it.\n"
