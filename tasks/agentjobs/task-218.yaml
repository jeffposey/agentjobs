- id: 7
  ts: '2026-08-23T18:40:05.390352Z'
  actor: claude
  type: question
  body: "**Question: the browser path refuses to dispatch exactly the tasks flesh-out\
    \ exists for, unless the human types a note. Should a playbook pointer count as\
    \ the brief?**\n\n`dispatch_task` (`src/agentjobs/dispatch/guards.py`, the `authorizer_id\
    \ is not None` branch) raises `RecordCannotBriefError` when the caller names the\
    \ human clicking **and** `record_can_brief(task)` is false \u2014 that is, when\
    \ `spec.description` is empty. The message is right for an ordinary dispatch:\
    \ *\"there is nothing for an agent to work from and nothing this dispatch could\
    \ be attributed to beyond the click itself.\"*\n\nFor a flesh-out run the premise\
    \ is false. An empty `spec.description` is not an absent brief, it is *the reason\
    \ the run exists*, and the brief is the playbook the pointer names. So the surface\
    \ the design calls primary \u2014 a human clicking Run on the Playbooks page,\
    \ which passes `authorized_by` \u2014 is the one surface where the intended target\
    \ is refused.\n\nIt is not a hard block: any `note` satisfies the check, so a\
    \ human types \"flesh out per the playbook\" and it proceeds. Which is arguably\
    \ the worse outcome, because it is a box that fires on every legitimate use and\
    \ is cleared by typing anything \u2014 the exact \"teaches the human to click\
    \ through it\" failure `record_can_brief`'s own docstring says it was designed\
    \ to avoid.\n\n**The question is whether `record_can_brief` should return true\
    \ when the request carries a `PlaybookPointer`.** `DispatchRequest` already holds\
    \ one, so the information is present at the point of the check.\n\nI have not\
    \ changed it, for two reasons. It is dispatch's code and not this task's scope,\
    \ and the answer plausibly differs per playbook: a task-target playbook that *reads*\
    \ a spec would still want the guard. It also cannot be observed today, because\
    \ no task in this backlog has an empty `spec.description` \u2014 this is reasoning\
    \ from the code, not a reproduction. Worth its own task if the answer is that\
    \ the pointer should count.\n"
