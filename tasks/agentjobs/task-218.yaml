    \ read something already written. Different questions.\n- **A corpus measurement\
    \ inside the brief** (\xA71), so a run pointed at a task that does not need one\
    \ reports that instead of padding it.\n\n## sc-1 met. sc-2 not met, and no agent\
    \ can meet it\n\nThree independent blockers, any one sufficient. Full evidence\
