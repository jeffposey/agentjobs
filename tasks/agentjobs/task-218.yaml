  type: question
  body: "**Question: the park is not a lock. A task promoted and parked at `human`/`review`\
    \ is still handed out by `agentjobs next` and is still dispatchable. Should the\
    \ queue read the ball?**\n\nYou asked flesh-out to promote the draft it specifies.\
    \ It now does, and this is the cost, measured rather than reasoned about.\n\n\
    `_skip_reason` (`src/agentjobs/manager.py:555`) decides claimability on `lifecycle`,\
    \ open children, unmet needs, eligibility and band. It never reads `ball`. `assert_dispatch_permitted`'s\
    \ task-level checks refuse a closed task and a task at `agent`/`hold`, and nothing\
    \ else about the ball. So:\n\n    lifecycle: ready | ball: human / review\n  \
    \  agentjobs next returns: task-001 | A fleshed-out draft\n\nThat is the real\
    \ `TaskManager` against a temporary registry \u2014 create a draft, `promote`,\
    \ `handoff` to `human`/`review`, ask the queue. It hands it straight back.\n\n\
    **Which means the review gate on a flesh-out is a signal to a person, not a barrier\
    \ to a machine.** Before your instruction, flesh-out never promoted, so a fleshed-out\
    \ draft stayed `draft` and was unclaimable by construction \u2014 the gate was\
    \ mechanical. Now it is social: the only thing standing between an unreviewed\
    \ spec and a session working it is that you get to it first. task-292 is in that\
    \ state right now.\n\nThree ways to answer, and none of them is mine to pick:\n\
    \n1. **Leave it.** A task parked at `human` is visible as such in the app, and\
    \ in practice nobody runs `agentjobs next` blind. Cheapest, and it accepts that\
    \ \"parked\" means \"please do not\", not \"cannot\".\n2. **Make `_skip_reason`\
    \ skip a task whose ball is `human` or `external`.** One line, and arguably what\
    \ the four-axis schema always meant \u2014 `ball` names who acts next, so a task\
    \ whose next actor is a person is not the agent's to claim. It would change today's\
    \ backlog, though: any `ready` task sitting at `human` would leave the queue,\
    \ and I have not counted those.\n3. **Refuse it at dispatch only**, leaving `next`\
    \ alone. Narrower: a human clicking Dispatch on a task parked for their own review\
    \ is the case worth stopping, and `TaskOnHoldError` is the pattern to copy.\n\n\
    I have not built any of it. It is queue-program work, it is not in this task's\
    \ spec or acceptance, and (2) in particular changes what every project's queue\
    \ returns \u2014 that is a decision with a blast radius, taken deliberately, not\
    \ a fix folded into a playbooks branch. Worth its own task if the answer is anything\
    \ but (1).\n"
