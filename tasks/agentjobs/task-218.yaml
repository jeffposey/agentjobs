- id: 10
  ts: '2026-08-23T18:44:24.459775Z'
  actor: claude
  type: progress
  body: "Complete on branch `feat/task-218-flesh-out-playbook`, three commits off\
    \ the post-216 `main` at `ed99ca4`. Nothing merged, nothing pushed.\n\n## What\
    \ was built\n\n**`playbooks/flesh-out.md`** \u2014 the project's normative flesh-out\
    \ brief, design \xA75.3 and decision P7 in the form a run actually reads. task-214\
    \ shipped a first pass written straight from the design's bullets; this is the\
    \ version that answers the questions a run hits when it is pointed at a real record.\
    \ What it adds:\n\n- **A premise check before any write**, with four named ways\
    \ the premise fails \u2014 the work already shipped, it is a duplicate, somebody\
    \ is working it now, or the record is too thin to specify without inventing requirements\
    \ \u2014 and a different answer for each. *Thin is not the same as short*: the\
    \ test is the resumption contract, not a word count.\n- **\"You are specifying,\
    \ not deciding.\"** Where the work needs a call that is not the run's, the spec\
    \ names the decision as open rather than picking one and writing the pick into\
    \ prose. A spec that quietly settles an open question is the worst thing this\
    \ playbook can produce, because the task is then dispatched and a session implements\
    \ a call nobody took, with the record showing a specification rather than a decision\
    \ \u2014 and there is no later moment at which anyone catches it.\n- **The scope\
    \ line as what may move and what may not**, with the reasoning per item. Two of\
    \ the prohibitions are not in the design's prose and are argued in place: **never\
    \ change the title** (on a thin task it is usually the only thing a human wrote,\
    \ and it is the reviewer's only evidence of what was originally meant), and **never\
    \ change tags or category** (they feed bands, filters and views, so they are queue\
    \ decisions in the same sense a priority is).\n- **One `update_content`, not six.**\
    \ The update's own log entry is the before/after boundary a reviewer reads and\
    \ half the reversibility argument for writing before anybody has read anything;\
    \ writing in pieces destroys it.\n- **What the `ball_prompt` carries, and why\
    \ it is not groom's.** A groom proposal exists nowhere but its prompt, so the\
    \ prompt carries the whole list. A flesh-out's work is on the record directly\
    \ beneath the prompt, so it carries what was written, **what the run was least\
    \ sure of** (named specifically \u2014 which sentence it would delete first if\
    \ it were wrong), what it left empty, and the questions it raised.\n- **Never\
    \ start the work you just specified.** That is the live temptation \u2014 the\
    \ run now understands the task better than anyone and the record says exactly\
    \ what to do \u2014 and doing it deletes the gate.\n- **Why `review` and not the\
    \ `approval` groom moved to in `ce2d1fa`.** Groom asks a human to authorise writes\
    \ that have not happened; this asks one to read something already written, which\
    \ is what `review` is for. The two were considered against each other rather than\
    \ defaulted.\n- **Finding the task adequately specified is a result**, reported\
    \ as one, with the corpus measurement that makes it a likely outcome here rather\
    \ than an excuse.\n\n**The shipped reference brought level with it**, as task-216\
    \ did for groom, plus two tests against this repository's own `playbooks/` directory:\n\
    \n- flesh-out's contract pinned the way groom's already is \u2014 target, the\
    \ absent `run_task`, the single gate, and the load-bearing one: the declared verbs\
    \ stop at writing. `close`, `promote` and `queue_move` are exactly the moves that\
    \ would let a run act on a spec no human has read, so their absence is checkable\
    \ rather than only argued in the body.\n- Project copy and shipped reference compare\
    \ equal, for every brief this repository has adopted. Nothing here reads the shipped\
    \ copy \u2014 `playbook init` copies it into *other* projects \u2014 so it is\
    \ the one that rots silently while the authoritative one improves. That is how\
    \ the first pass sat two versions behind without anyone noticing.\n\nCommits:\
    \ `614a999` the brief \xB7 `fc6fff1` the reference and the tests \xB7 `6099eee`\
    \ a correction to the corpus figures the brief quotes, re-measured after two tasks\
    \ closed mid-session.\n\n## Verification\n\n**Full gate green, 10 of 10, no arguments,\
    \ clean tree: `6099eee3`, 266.1s.** Receipt written. Run with this worktree's\
    \ own interpreter, never `poetry run`.\n\nThe read surfaces were exercised by\
    \ hand rather than only in tests, against a **sandbox** \u2014 a throwaway `AGENTJOBS_HOME`,\
    \ this worktree registered as its own project, a server on port 8921 \u2014 so\
    \ nothing touched the shared registry or the dashboard on 8876. Both are since\
    \ removed; the shared `projects.yaml` has no leftover entry and 8921 is down.\
    \ (Port 8899 was tried first and is **aj-219's** sandbox server, still running\
    \ and left alone.)\n\n- `agentjobs playbook list` \u2192 flesh-out listed with\
    \ `target: task  difficulty: hard  gates: 1`.\n- `agentjobs playbook show flesh-out`\
    \ \u2192 contract rendered from frontmatter, then the brief.\n- `GET /api/projects/<id>/playbooks`\
    \ and `.../playbooks/flesh-out` \u2192 the full contract, `run_task: null`, and\
    \ a 14,490-character body. Checked the em dashes survive as UTF-8 over the wire;\
    \ they do \u2014 the mojibake in a shell pipeline is the Windows console, not\
    \ the API.\n\n**Nothing outside task-218 was moved by this session.** My two commits\
    \ to `main` (`b346721`, `a559861`) touch exactly one file between them, `tasks/agentjobs/task-218.yaml`.\
    \ Other task files changed on `main` tonight; every one of those is another session's\
