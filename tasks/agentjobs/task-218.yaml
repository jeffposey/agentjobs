- id: 8
  ts: '2026-08-23T18:40:06.550840Z'
  actor: claude
  type: question
  body: "**Question: `tests/test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`\
    \ fails under load, on `main`, and will probably fail the approval-triggered finish\
    \ for this task.**\n\nNine full-suite runs tonight, on this machine, alternating\
    \ between this worktree and the unmodified shared clone:\n\n| Tree | Runs | Failures\
    \ |\n|---|---|---|\n| `feat/task-218-flesh-out-playbook` | 6 | 3 |\n| `main`,\
    \ no changes at all | 3 | 1 |\n\nIt fails two different ways \u2014 `AssertionError:\
    \ pid NNNNN survived the timeout` and `AssertionError: the grandchild never started,\
    \ so this proves nothing` \u2014 and passes 3/3 in isolation and 130/130 when\
    \ only `tests/test_dispatch_runner.py` runs under `-n auto`. **It reproduces on\
    \ `main` with nothing of mine present**, so it is pre-existing; this branch's\
    \ diff is two markdown files and one test file.\n\nThe mechanism is visible in\
    \ the test. The runner is built with `timeout=3`, and the readiness loop that\
    \ waits for the grandchild's marker spawns a **fresh Python interpreter per 200\
    \ ms tick** (`subprocess.run([sys.executable, \"-c\", \"import time; time.sleep(0.2)\"\
    ])`, line 1541). On a box where xdist is already running 32 workers, starting\
    \ an interpreter costs far more than the 200 ms it is standing in for, so the\
    \ loop's real elapsed time overruns the 3-second timeout: either the group is\
    \ killed before the grandchild writes its marker, or the kill and the `tasklist`\
    \ check race. Two failure messages, one cause.\n\nI have not fixed it \u2014 it\
    \ is unrelated to this task and a fix to `tests/test_dispatch_runner.py` on a\
    \ playbooks branch is the mixing ALLAGENTS warns against. **But it matters to\
    \ this task's merge**: the scripted finish re-runs the full gate, and at roughly\
    \ a one-in-three failure rate it is likely to escalate with \"the gate went red\"\
    \ on a stage that has nothing to do with this branch. If that happens, `agentjobs\
    \ finish task-218` re-run is the retry, and the log above is why.\n\nThe obvious\
    \ fix, for whoever picks it up: sleep in-process instead of spawning an interpreter,\
    \ and give the readiness wait a budget derived from the runner's timeout rather\
    \ than a fixed tick count. Should this be a task?\n"
