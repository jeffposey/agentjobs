ball_prompt: 'Review `feat/task-219-queue-move-check` (worktree `C:/projects/worktrees/aj-219`,
  four commits on top of fb79be4). Section 5.4 of the playbooks design, built deterministic
  per P8 (revised) -- no model, no dispatch, no debounce anywhere in the path.


  **What it does.** A queue move lands exactly as before and is never blocked. The
  response now carries what the move is worth saying, computed synchronously from
  the corpus the move handler had already read under the lock. Five findings, each
  needing its own construction: the promoted task will be skipped and why; it now
  stands ahead of something it needs; what it displaced is gating other work; the
  band came out as it went in; the band is corrupt. **Most moves earn none of them**
  -- that is a requirement here, not an aspiration, and `TestSilenceIsNormal` is the
  test that guards it.


  The `queue_move` entry records the findings and the placement that undoes them.
  A new verb, `keep_queue_move` / `POST .../queue-keep`, records the strong anchor
  -- a `decision` threaded to the move it answers, carrying the warnings verbatim
  -- which task-217''s `reorder` must not overturn. It is refused when the move produced
  no warnings. Undo needs no new route: it is a move back.


  CLI, REST (`?envelope=true`), MCP and the React list all read one implementation,
  `src/agentjobs/queue_check.py`.


  **See it running.** A review server is up on **http://127.0.0.1:8899/app/p/sandbox-warned/tasks**
  -- throwaway data, its own port, nothing to do with 8876. Its `high` band is built
  so that promoting anything earns a notice; its `medium` band is the control, where
  every drag must leave the screen silent. Both halves are seeded because the silent
  half is the one that decides whether this is a check or wallpaper. The other four
  sandbox projects are unchanged. Stop it by killing the `review_queue_sandbox.py`
  process, or ask and I will; its temp directory is deleted with it.


  **Worth looking at closely:**


  1. **The `no_op` wording is a departure from section 5.4, argued on the record.**
  The design says "the head of the band above the drop is unclaimable, so `next` returns
  exactly what it returned before". Read literally that fires on almost every move
  ever made, which is the wallpaper the same section forbids. It is implemented as
  "the band''s order is identical before and after" -- rare, always worth knowing,
  and it entails the design''s claim. The decision entry has the alternatives and
  why each was rejected. This is the one place I did not follow the text as written.

  2. **`queue_warnings` is on the mutation envelope, so a plain REST POST without
  `?envelope=true` is not shown them.** The cost is stated in the decision entry.
  Making the route always answer with the envelope would break every existing caller;
  the findings are still in the `queue_move` entry of the task that comes back, and
  the Python client and MCP always ask for the envelope.

  3. **ff1f734 fixes a race the tests could not have found.** Two Alt+Up presses is
  one gesture, each fires its own request and refetch, and they do not finish in order
  -- the first move''s single finding landed last and replaced the second move''s
  three, so the notice described a queue state that no longer existed. I saw it in
  Chrome, not in jsdom. Both new tests fail without the guard; I checked.

  4. **`above_prerequisite` is same-band only.** Cross-band would mean a permanent
  warning on every move of a `high` task with a `medium` prerequisite. The case is
  not lost -- such a task is unclaimable, so `promoted_unclaimable` names the same
  dependency.


  **Verified:** full gate green, all ten stages, on ff1f734 (157.9s, receipt written).
  52 new Python tests, 40 jsdom tests on the notice, 3 Playwright tests that drive
  both buttons against a live server and read the anchor back out of the API. Exercised
  by hand on the CLI and in Chrome -- the plural bug, the undo-a-no-op nonsense, and
  the race above all came from doing that rather than from the suite.


  Not merged, not pushed, task still open, per the task-211 posture.'
