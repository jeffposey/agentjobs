spec:
  summary: When a human moves a task in the queue, the move lands and the response
    carries deterministic warnings about it -- the promoted task is unclaimable, it
    was ordered above its own prerequisite, what it demoted gates other work, the
    move is a no-op, the band is corrupt. A non-blocking notice offers one-click undo/keep;
    keep records the strong anchor that reorder must respect. No model, no spend,
    no debounce.
  intent: A human reordering the backlog cannot see the dependency graph, so the commonest
    ordering mistake -- promoting something that is blocked -- is invisible at the
    moment it is made and silent afterwards. Every fact needed to catch it is already
    computed by the queue; this puts it in front of the person at the one moment it
    matters.
  description: 'Implements section 5.4 of docs/playbooks-design.md (the task-211 deliverable;
    add it to context[] once it merges).


    **Retargeted 2026-08-21 on Jeff''s review of that design (task-211 log entries
    22 and 25).** This task previously specified `queue-check` as a *reactive playbook*:
    a 120s-debounced, spend-capped, batch-mode model call producing objections. That
    is withdrawn. Jeff''s judgement was that it was "overly complicated and hard to
    use as it is", and his proposal -- an immediate deterministic check driven by
    the `--why` text the queue already produces -- was adopted. What is left is smaller,
    faster, always available, and needs no playbook machinery at all.


    **What it does.** A human moves a task -- a drag in the React list, `queue move`
    on the CLI, the REST call under either. The move lands and is authoritative, exactly
    as before; it is never blocked and never awaits anything. The response carries
    zero or more **warnings**, computed synchronously from data the move handler has
    already loaded.


    **The warnings, and the fact behind each:**


    - **The task you promoted cannot be claimed** -- `_skip_reason`: unmet `needs`,
    open children, `draft` lifecycle, already claimed, not eligible. The queue will
    skip past it where it was just put. This is the existing `explain_next()` / `--why`
    text pointed at one task instead of the whole backlog, and it is the common case.

    - **You ordered a task above something it needs** -- `dependencies[]`. The order
    just written cannot execute in the order it reads.

    - **What you demoted gates other work** -- `unblocks_count` from the dependency
    facts: *this pushed task-204 down; three open tasks need it.* This is the one
    that answers task-211 log entry 6''s point that the risk in a drag is usually
    what got pushed down, not what was grabbed.

    - **The move changes nothing** -- the head of the band above the drop is unclaimable,
    so `next` returns what it returned before. Usually means the real blocker is elsewhere.

    - **The queue is not in a state to be reasoned about** -- `find_queue_problems`
    / `QueueCorruptionError`, which `queue check` already detects.


    **Surface.** A non-blocking notice in the React queue list (task-207''s) carrying
    the warning with `undo` and `keep`, one click each way. `undo` issues the inverse
    `queue move`, logged, human actor. `keep` appends the kept-over-warning entry
    that promotes the position to a **strong anchor**, which `reorder` (task-217)
    must not move. Ignoring the notice leaves an ordinary anchor. No blocking modal
    -- that reintroduces the friction the whole post-hoc shape exists to avoid.


    Because the check is synchronous, "the human was informed and kept the move anyway"
    is a fact about the record rather than an assumption about whether a notice arriving
    two minutes later was read. That is what makes the strong anchor legitimate.


    **CLI and REST get the same warnings**, not just the browser: `queue move` prints
    them, and the REST response carries them, so a move made from a script or a phone
    is checked identically.


    **Tests that matter:** each warning class fires on its own construction and stays
    silent otherwise; a move that is legal produces no warning at all (the check must
    not become wallpaper); the warnings are computed without a second full parse of
    the corpus (assert on task parses, per the performance convention, not on wall
    clock); `keep` produces the strong-anchor record `reorder` reads; `undo` is an
    ordinary logged human `queue_move`.'
  constraints: '- Design decision P8 (revised) is binding: deterministic and synchronous,
    no model call anywhere in this path, and the move is never blocked and never awaits
    anything.

    - The check reports; it never refuses a move. A corrupt band produces a warning,
    not a rejection -- consistent with `queue_listing` reporting rather than raising.

    - Silence is the normal outcome. A warning that fires on legal moves is a defect,
    not a feature.

    - Assert on rendered values and on task parses, not on markup presence or wall-clock
    time (ENGINEERING.md, Verification).'
  out_of_scope: Any judgement about whether a move is *wise* rather than *legal* --
    that is `reorder`'s job (task-217), over the whole band, on demand. Any model
    call. Recurrence, debouncing, or spend ceilings, none of which this needs. Reordering
    the queue automatically.
  context:
  - path: docs/playbooks-design.md
    why: Section 5.4 is the specification and section 10's P8 (revised) is the binding
      decision. Merged in 25427f1.
  - path: src/agentjobs/queue_check.py
    why: 'The check itself: the five warning kinds, the strong-anchor record shape,
      and the pure placement arithmetic.'
  - path: src/agentjobs/manager.py
    why: '`move_with_warnings` runs the check under the queue lock; `keep_queue_move`
      writes the anchor. `_skip_reason` is the existing deterministic ''why'' it reuses.'
  - path: src/agentjobs/queue.py
    why: '`find_queue_problems`, `place_of` and the band model the warnings are computed
      against.'
  - path: docs/task-schema.md
    why: The record both halves write, which is the contract task-217 reads.
  - path: scripts/review_queue_sandbox.py
    why: '`sandbox-warned` seeds both sides of the check for a review in a real browser.'
