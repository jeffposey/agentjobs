- id: 8
  ts: '2026-08-23T08:25:45.698190Z'
  actor: claude
  type: decision
  body: '**`no_op` means the band''s order did not change, not that `next` returns
    the same task.**


    Section 5.4 words this one as "the head of the band above the drop is unclaimable,
    so `next` returns exactly what it returned before". Read literally as "`next`
    is unchanged", it fires on almost every move ever made: reordering positions 30
    and 20 of a forty-task band never changes what comes next, and neither does any
    move at all in a band below one with claimable work. That is precisely the wallpaper
    the same section forbids two paragraphs earlier, and a warning that fires on ordinary
    grooming is the failure mode this whole design is written against.


    **Implemented instead as: the sequence of open task ids in the band is identical
    before and after.** That is rare, always worth knowing (`--top` on the band head,
    `--after Y` on the task already behind Y), and it entails the design''s claim
    rather than contradicting it -- an unchanged order does mean `next` returns what
    it returned before, which is what the message says. A no-op also short-circuits
    the three consequence warnings, because a move that caused nothing has no consequences
    worth a sentence; corruption is still reported, since a no-op move is a perfectly
    ordinary way to discover a band that was already broken.


    **Rejected:** the literal `next`-unchanged reading, for the reason above; and
    a middle version scoped to moves that land at the head of a band, which still
    fires on every `--top` in `low` on a machine that always has claimable `medium`
    work. The insight the design attaches to this warning -- "it usually means the
    real blocker is somewhere else" -- is served by `promoted_unclaimable`, which
    names the blocker.'
  data:
    operation:
      id: 7c1e2a90-1d44-4f2a-9b31-2190a0003001
      kind: log_append
      fingerprint: 7e8e70785cf0357d536bd3b25211370e
- id: 9
  ts: '2026-08-23T08:26:09.318515Z'
  actor: claude
  type: decision
  body: '**The findings ride on the existing mutation envelope, and `move` keeps its
    signature.**


    `TaskManager.move_with_warnings` is the verb that answers with a `MoveOutcome`;
    `move` delegates to it and returns `.task`. Over HTTP the findings are `queue_warnings`
    and `queue_undo` on `MutationResult`, which the route already returns for `?envelope=true`,
    and the bare-task default is byte-for-byte what it was.


    **Rejected: changing `move()` to return the outcome.** It is called from the route,
    the CLI and nineteen places in the existing suite, and every one of them would
    have had to learn about a wrapper to get at a task -- a lot of churn to spare
    one method name.


    **Rejected: making `queue-move` always answer with the envelope.** That is a breaking
    change to every caller of that route for the sake of a field most of them will
    never read, and it contradicts the compatibility story the envelope was introduced
    with. The cost of not doing it is real and worth stating: a script that POSTs
    to `queue-move` without `?envelope=true` is not shown the findings. It is not
    left blind, though -- they are in the `queue_move` entry of the task it gets back,
    and the Python client and MCP always request the envelope, so every first-class
    caller sees them.


    **A related call: the findings are recorded in the `queue_move` entry rather than
    recomputed on demand.** They are a fact about an event. Recomputing them when
    somebody reads the task back would answer about a queue that has since moved,
    and it is exactly that -- "what was on the screen when the person chose" -- that
    the design says makes the strong anchor legitimate.'
  data:
    operation:
      id: 7c1e2a90-1d44-4f2a-9b31-2190a0003002
      kind: log_append
      fingerprint: b791892028f8bfb19153bf5f8a9c3438
- id: 10
  ts: '2026-08-23T08:26:09.417889Z'
  actor: claude
  type: decision
  body: '**Three scoping calls inside the check, each made to keep silence normal.**


    **`above_prerequisite` is same-band only.** Positions are never compared across
    bands, so a `high` task stands ahead of a `medium` prerequisite whatever anybody
    drags; firing on that would mean a warning on every move of such a task forever.
    *Rejected:* comparing across bands, which would have been the literal reading
    of "ordered above something it needs" and pure wallpaper. The cross-band case
    is not lost -- the task is unclaimable, so `promoted_unclaimable` names the same
    dependency.


    It fires on the state **after** the move rather than only on an inversion this
    move newly created. The person just wrote that order and it still cannot execute.
    *Rejected:* only-when-newly-constructed, which would go quiet on the second and
    third drag of an already-inverted pair -- the moves most likely to be somebody
    trying and failing to fix it.


    **`demoted_blocker` counts anything whose rank worsened, the moved task included.**
    Moving a gate to the bottom is the same mistake as promoting something over it,
    seen from the other end. The message names at most three and states how many it
    left out; every id is in `tasks`.


    **`queue_broken` is scoped to the moved task''s band and the bands above it**
    -- `bands_at_or_above`, the same scope `assert_queue_integrity` uses for the same
    reason. A duplicate in `low` falsifies nothing about a `high` move, and reporting
    it would punish the wrong caller.


    **Ordering: `queue_broken` first.** It qualifies everything under it -- an order
    with two tasks on one number is not an order, so the three consequence findings
    are computed against positions nobody should be trusting.'
  data:
    operation:
      id: 7c1e2a90-1d44-4f2a-9b31-2190a0003003
      kind: log_append
      fingerprint: a62b210df91755675656751b35444b12
