spec:
  summary: Six of eight dispatched runs on 2026-08-20/21 completed unattended with
    no prompt at all. The one supervising an epic parked after 316 seconds. Find out
    what a supervisor does that an ordinary run does not, and fix that -- without
    loosening what every other run may do.
  intent: Unattended dispatch already works for ordinary task work; the run ledger
    proves it. What does not work is the supervisor role introduced by task-164, which
    is the one thing standing between AgentJobs and an unattended epic. The prize
    is a night that starts with one dispatch and ends with a merged epic.
  description: '**Read log entries 3 and 4 before anything else, and read entry 4
    second.** This task was framed three different ways in ninety minutes on 2026-08-21
    -- MCP permissions, then the permission mode, then the supervisor role -- each
    from whatever symptom was on screen at the time. Entry 4 is the current understanding
    and it withdrew most of entry 3. The spec below has been rewritten to match; treat
    the earlier framings as history, not instruction.


    ## What is actually known


    Eight dispatched runs on 2026-08-20/21. **Six completed unattended, start to finish,
    with no prompt:** run_fa103400 (task-202), run_b46b2abf and run_7b2413eb (task-164),
    run_249c7e73 and run_4008e36b (task-189), run_8c352a34 (task-211, on the `big-dawg`
    group). Each took a worktree, ran the full gate, merged, closed its task and removed
    its worktree. So `--permission-mode auto` in a `--bg` session is not broken, and
    the nine-entry `ALLOW_PREFIXES` is evidently sufficient for ordinary work.


    **Two parked, for unrelated reasons:**


    - `run_8a76889b` (task-202) parked on *"Confirm product-strategy file state"*
    -- a command reaching into `C:/projects/product-strategy`, a different repository
    outside the dispatched project root. Plausibly the classifier working as intended.
    Out of scope here.

    - `run_d5ab5caf` (task-081) parked after 316s supervising an epic, on the three-consecutive-blocks
    circuit breaker, with an MCP `task_log_append` against task-204 shown as the last
    blocked action. Its transcript is at `C:/Users/jpose/.agentjobs/runs/run_d5ab5caf/transcript.log`
    and the verbatim tail is on task-081 log entry 23.


    ## The question to answer first


    **What did the supervisor do that ordinary runs do not?** The obvious hypothesis,
    unproven: its job is to launch child agent sessions, and spawning an AI agent
    subprocess is exactly the kind of unusual action a classifier declines. Ordinary
    runs never do it.


    The breaker fires on *three consecutive* blocks and only the third is displayed.
    **The first two are the evidence and nobody has read them yet.** The transcript
    is a raw terminal capture with ANSI escapes, which is why an earlier attempt to
    mine it gave up; it is still the primary source and worth parsing properly.


    Do not write code before this is answered. Three fixes have already been proposed
    and withdrawn for skipping it.


    ## Constraints on whatever the fix turns out to be


    The supervisor needs its specific capability without widening what every other
    dispatched run may do. Candidate shapes, none prescribed: a targeted allow rule
    for the spawn command; a distinct posture used only for umbrella tasks; or changing
    *how* children are launched so the unusual act stops being unusual -- note that
    task-164 log entry 7 records that a supervisor cannot use dispatch for its children
    (D4 requires a human-authored entry) and so shells out directly, which may be
    the whole cause.


    ## Verification


    A unit test proves nothing here. The proof is `task-081` dispatched as a supervisor,
    starting `task-204` in its own session, with no prompt and no park. That is also
    the first live exercise of task-164''s supervisor path, which has never run end
    to end.'
  constraints: '- Diagnose before fixing. Establish what was actually blocked from
