    \ The probe lives in `C:/ai/scratch/task-224-probe/`, which is throwaway by convention.\n\
    \n### The expiry is now confirmed to the microsecond, a third way\n\nEntry 35\
    \ derived `E = 2026-08-22T07:40:44.5Z` two ways. A third is now on the record:\
    \ the credential file's mtime is `2026-08-21T23:40:44.6026608Z`, and `+8h` gives\
    \ **`07:40:44.6026608Z`**. Only the modification time was read; the file's contents\
    \ were not, and the classifier refused that read anyway, which is the right answer.\n\
    \nSo the daemon refreshes at `07:36:44.5Z` (E\u2212240s) and the token dies at\
    \ `07:40:44.6Z`. In Jeff's clock that is a refresh at **02:36:44** and expiry\
    \ at **02:40:44 CDT**.\n\n### What the probe does\n\n`probe.ps1` fires a cold-start\
    \ `claude -p ping` at fixed UTC targets and records, per probe: start and finish,\
    \ duration, exit code, whether the output carries `Login expired` / `authentication_failed`\
    \ / `Please run /login`, the credential file's mtime, and the output verbatim.\
    \ One JSONL line each, to `probes.jsonl`.\n\n- **Control block** \u2014 3 probes\
    \ at 06:35:00, 06:35:40, 06:36:20 (about 65 minutes before expiry). Establishes\
    \ that a healthy credential answers, tonight, on this machine.\n- **Main sweep**\
    \ \u2014 every 15 s from **07:35:00 to 07:42:00**, 29 probes. It starts 5m45s\
    \ before expiry, so the first probe sits outside any plausible client staleness\
    \ margin and the sweep walks into the zone, across the daemon's refresh at 07:36:44.5\
    \ and the expiry at 07:40:44.6.\n- **Tail block** \u2014 07:44, 07:47, 07:52.\
    \ If the refresh worked these pass; if it failed they should be refused.\n\nAt\
    \ run end it snapshots `daemon.log` and `daemon-auth-status.json` into the scratch\
    \ directory, because `daemon.log` is the only record of what the refresh actually\
    \ did and it is an internal file that may rotate. Neither snapshot contains a\
    \ credential.\n\n### Validation, because a silent failure at 02:35 loses the window\n\
    \nNot assumed \u2014 exercised.\n\n1. **A probe run by hand now** (01:07Z, E\u2212\
    6.6h): `pong`, 5.4 s, `refused=False`. The credential is healthy and the probe\
    \ is a real API call.\n2. **Two defects found and fixed by running it**, both\
    \ of which would have produced worthless data:\n   - `Start-Process -ArgumentList\
    \ '-p', 'Reply with exactly: OK'` does not reliably quote a multi-word argument\
    \ on PowerShell 5.1. The prompt arrived as separate argv entries and the CLI answered\
    \ *\"I don't see a question or task in your message\"* \u2014 a probe that looks\
    \ like it worked and tested nothing. Now a single bare word, `ping`.\n   - `$p.ExitCode`\
    \ read back **empty** after `WaitForExit(ms)`. PowerShell 5.1 releases the process\
    \ handle; touching `$p.Handle` before the wait caches it. Exit codes now populate\
    \ (`exit=0`).\n3. **`-SelfTest` runs the whole scheduling loop** against targets\
    \ a few seconds out, including the \"machine was asleep, target missed\" skip\
    \ branch. All three branches behaved: two probes at the right offsets, one correctly\
    \ skipped as 610 s late.\n4. **A throwaway scheduled task ran the self-test through\
    \ Task Scheduler**, to prove the scheduler's environment works \u2014 it does\
    \ not inherit this session's `CLAUDE_*` variables, which is exactly the difference\
    \ that breaks things silently at 2am.\n\n### What each outcome would mean\n\n\
    - **Probes refused somewhere in 07:35\u201307:40 while the daemon is silent**\
    \ \u2014 Mechanism B reproduced, on demand, with a timestamp. That converts entry\
    \ 35's two-observation pattern into a repeatable test and makes the upstream report\
    \ concrete.\n- **Every probe passes and the 07:36:44 refresh succeeds** \u2014\
    \ the anomaly needs a condition tonight does not have. The probes themselves become\
    \ the control for the next attempt, and the honest conclusion is that it is not\
    \ simply a function of the cycle boundary.\n- **The refresh fails and probes are\
    \ refused only after 07:40:44** \u2014 that is Mechanism A, the ordinary post-expiry\
    \ failure, and it says the anomaly did not recur.\n\n### One confound, stated\
    \ rather than engineered away\n\nStarting a `claude` process can start the daemon,\
    \ and a fresh daemon does its own auth check. So a probe could provoke a refresh\
    \ that moves E and destroys the window it is measuring. This is not fixable and\
    \ it is also *realistic* \u2014 real dispatch spawns sessions the same way, and\
    \ occurrence 3 happened at the moment a session was spawned. What makes it tolerable\
    \ is that sessions do not refresh their own credential; the daemon owns refresh,\
    \ which is established in `src/agentjobs/dispatch/auth.py`'s module docstring\
    \ rather than assumed here. The credential mtime recorded on every probe is what\
    \ would expose a refresh if one happened.\n\n### How to stop it\n\n```powershell\n\
    Unregister-ScheduledTask -TaskName 'task-224-auth-probe' -Confirm:$false\n```\n\
    \nIt is a one-shot trigger with a 2-hour execution limit, so it cannot linger.\
    \ It is set to wake the machine, because a sleeping machine produces no data and\
    \ also no failure.\n\n### Cost\n\nAbout 35 one-word prompts. Cents.\n"
