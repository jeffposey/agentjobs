    ```\n\nwith `exit=1`. Not one of them reached the model, so not one exercised\
    \ the credential. My verdict logic tested only whether the output matched `Login\
    \ expired`; anything else counted as \"answered\". A billing error is not an answer,\
    \ and six of them are not evidence of anything. This is the decoration failure\
    \ ENGINEERING.md warns about \u2014 I wrote a check and never asked what it would\
    \ catch.\n\nThe probe ran at 01:35\u201302:52 CDT, which is exactly when the weekly\
    \ quota gets deliberately burned down. A verified probe just now returns `exit=0`,\
    \ `pong`, so the limit has since cleared.\n\n**2. The entire 29-probe main sweep\
    \ never fired, and left no trace of not firing.** Only the 3 control and 3 tail\
    \ probes ran. Confirmed independently: `~/.claude/projects/C--ai-scratch-task-224-probe-sandbox/`\
    \ holds session transcripts at 01:35:04, 01:35:43, 01:36:23, 02:44:04, 02:47:03\
    \ and 02:52:03, and **nothing between 02:35 and 02:42**. No probe processes were\
    \ launched in the window.\n\nThe cause, reproduced in isolation rather than guessed:\n\
    \n```powershell\n$targets += , @('sweep-' + $t.ToString('HH:mm:ss'), $t)\n```\n\
    \nPowerShell parses that as `'sweep-' + ($t.ToString('HH:mm:ss'), $t)` \u2014\
    \ the comma builds an array, and `string + array` joins it with a space. So each\
    \ sweep target became **one string**, `\"sweep-07:35:00 08/22/2026 07:35:00\"\
    `, and `$pair[1]` was `$null`. `$null` coerces to `DateTime.MinValue`, so every\
    \ sweep target looked ~739,000 days overdue and took the skip branch \u2014 and\
    \ the skip record then threw on `$null.ToString('o')` before `Write-Rec` was ever\
    \ called. Twenty-nine targets vanished in milliseconds leaving no probe, no skip\
    \ record and no error anyone could see. `run-start` recorded `probes: 35`, which\
    \ is the only reason the gap was findable at all.\n\n**Why the self-test missed\
    \ it.** `-SelfTest` passed prebuilt `DateTime` values (`$n.AddSeconds(5)`) and\
    \ ran against a healthy account. It exercised the loop but never the sweep's own\
    \ target construction and never a failing probe. I validated the code path and\
    \ not the data the real run would use, which is the same mistake as setting up\
    \ the state a test is meant to check (task-207's lesson, applied to a harness\
    \ instead of a feature).\n\n### One real observation survives, and it is worth\
    \ having\n\nThe cycle was healthy. `daemon.log`:\n\n```\n[2026-08-22T07:36:44.870Z]\
    \ auth: proactive refresh starting\n[2026-08-22T07:36:45.161Z] auth: scheduling\
    \ proactive refresh in 28560s\n[2026-08-22T07:36:45.162Z] auth: proactive refresh\
    \ succeeded\n```\n\nThe refresh fired 370 ms after its scheduled 07:36:44.5 and\
    \ succeeded in **291 ms**, writing a new credential at 07:36:45.14. So even a\
    \ funded, working harness would probably have found nothing at that particular\
    \ boundary: there was no failure to catch. That is a data point about base rate,\
    \ not a null result about the anomaly.\n\nIt also confirms the timing model a\
    \ fourth time \u2014 the refresh landed within 400 ms of a prediction made 16\
    \ hours earlier.\n\n### Harness rewritten, and this time the failure modes are\
    \ tested\n\nBoth defects are fixed and both fixes have a test that fails without\
    \ them.\n\n- **Targets are built through `New-Target`**, which throws if the time\
    \ is not a `DateTime`. A silently-null target is now impossible to construct rather\
    \ than merely unlikely.\n- **Every probe is classified `refused` / `answered`\
    \ / `invalid`.** `invalid` covers spend/usage/rate limits, credit balance, timeouts,\
    \ launch failures and any non-zero exit with no recognised message \u2014 with\
    \ the reason recorded per probe. \"Did not say Login expired\" is no longer the\
    \ same thing as \"answered\".\n- **The verdict refuses to overclaim.** `NOT REPRODUCED`\
    \ now requires at least 70% of the planned sweep probes to have actually reached\
    \ the model. Below that it reports `INCONCLUSIVE - the window was not covered\
    \ ... This is NOT evidence of absence`, and it does so whatever the reason \u2014\
    \ invalid probes, skipped targets, or a sweep that did not run. Run 1 would have\
    \ printed INCONCLUSIVE under this logic.\n- **The skip record is built only from\
    \ values that cannot be null**, which is what silenced run 1.\n\nVerification,\
    \ all run and all green:\n\n| test | what it proves |\n|---|---|\n| `-Simulate\
    \ -SimulateCase billing` | replays run 1's six spend-limit outputs \u2192 `INCONCLUSIVE`,\
    \ not `NOT REPRODUCED`. The regression that matters. |\n| `-Simulate` (mixed)\
    \ | classifier correct on billing / refused / answered / timeout; a refusal outranks\
    \ an invalid. |\n| `-SelfTest` | live loop with a **concatenated label** \u2014\
    \ the exact shape that broke run 1 \u2014 probes fire on schedule and the skip\
    \ branch writes its record. |\n\n### Re-armed for tonight, on a boundary pinned\
    \ two ways\n\nCredential mtime `2026-08-22T16:18:48.65Z` + 8h, and the daemon's\
    \ `scheduling in 19929s` at 18:42:39.549. Both give:\n\n- **daemon refresh due\
    \ `2026-08-23T00:14:48.5Z`** (E\u2212240s) = 19:14:48 CDT\n- **expiry E = `2026-08-23T00:18:48.65Z`**\
    \ = **19:18:48 CDT tonight**\n\nScheduled task starts 18:10 CDT. Control block\
    \ at 18:15; sweep every 15 s from **E\u2212364s to E+71s** (30 probes, 19:12:45\
    \ \u2192 19:20:00 CDT), which brackets both offsets the anomaly was seen at (E\u2212\
    272s and E\u221254s) and crosses the refresh; tail at 19:22, 19:25, 19:30.\n\n\
    Old evidence archived as `probes-run1-2026-08-22.jsonl`, `RESULT-run1-2026-08-22.md`,\
    \ `daemon.log.snapshot-run1`.\n\n### The standing caveat, restated because run\
    \ 1 is the reason to state it\n\nA quiet boundary produces `NOT REPRODUCED`, and\
    \ that is worth much less than it sounds. Three occurrences in ~40 hours is roughly\
    \ one boundary in five. A single clean cycle is weak evidence; several are worth\
    \ something. The verdict line will not pretend otherwise, but nor should the reader.\n"
