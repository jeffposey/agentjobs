    \ and failed in 2 ms |\n\n### How E is derived, and why it is trustworthy\n\n\
    The daemon logs `auth: scheduling proactive refresh in Ns`, and each schedule\
    \ fires within a second of `T+N`. Against entry 6's twice-verified 8-hour lifetime,\
    \ that puts the refresh at a fixed **240 s before expiry** \u2014 derived independently\
    \ on two cycles:\n\n- `07:37:39.506 + 28560s = 15:33:39.5`, fired 15:33:40.465.\
    \ Token issued 07:37:39.5 \u2192 E = 15:37:39.5. Margin 240 s.\n- `15:44:50.496\
    \ + 28541s = 23:40:31.5`, fired 23:40:32.445. Token written 15:44:31 (entry 30)\
    \ \u2192 E = 23:44:31.5. Margin 240 s.\n\nIt is corroborated from the other side\
    \ too: refusal 2b lands 41.6 s after the derived E, and the daemon's `no token\
    \ found` lands 39.8 s before it. The model is sound, so the \u0394 column is real\
    \ arithmetic and not an estimate.\n\n### Splitting the population\n\n**Mechanism\
