- id: 15
  ts: '2026-08-21T20:35:06.071684Z'
  actor: claude
  type: progress
  body: "## Built recommendation 1: the poller now recognises an expired login, and\
    \ says the one thing that fixes it.\n\nBranch `feat/task-224-auth-park-detector`,\
    \ worktree `../worktrees/aj-224`. Nothing about credentials, tokens or the refresh\
    \ flow is touched \u2014 the change only makes an already-visible failure legible\
    \ in the tracker.\n\n### What was added\n\n**`src/agentjobs/dispatch/auth.py`**\
    \ \u2014 locate a session's JSONL transcript from the short id the run ledger\
    \ holds, and answer one question: *is this session sitting dead on an expired\
    \ login right now?*\n\n- **Parsed as JSON, matched on the top-level `error` field.\
    \ Never grepped.** This is not fussiness: the literal string `authentication_failed`\
    \ is in the transcript of any session that has *read about* this bug \u2014 this\
    \ task record, that module, its tests. A substring detector reports every session\
    \ investigating the failure as suffering from it.\n- **The line's own `sessionId`\
    \ is checked** against the run's, so a prefix-matched filename cannot mislead\
    \ it.\n- **It clears itself.** The dead line stays in the transcript forever;\
    \ a real model reply *underneath* it is what makes it history. A human's message\
    \ does not clear it \u2014 verified in entry 6, the 15:43:38 nudge failed 9ms\
    \ after arriving.\n- **Only the last 256 KB is read**, per poll, per live run.\
    \ Cheap, and the right semantics: a failure buried under newer work is a session\
    \ that carried on.\n- **`None` for every runner that is not Claude Code**, because\
    \ no other runner writes any of this. No runner names are sniffed at anywhere.\n\
    \n**`DispatchRunner.poll_session`** checks it *before* the phase branches, because\
    \ it contradicts them. `_park_auth_stall` hands the ball to `human`/`input` with\
    \ a prompt naming `claude auth login`, marks the run `parked` with the failure's\
    \ timestamp as the idempotency key, and commits the record itself.\n\n**Parked,\
    \ not finished, and not reaped** \u2014 the decision that matters most; reasoning\
    \ in the decision entry that follows.\n\n**`agentjobs dispatch auth-check [SESSION_ID]`**\
    \ \u2014 the same check for a human or an agent supervisor, exiting 1 when a session\
    \ is stalled. Supervisor-started children are that supervisor's own subprocesses\
    \ and appear in no ledger, so the poller cannot see them at all.\n\n**Docs.**\
    \ `docs/agent-dispatch-design.md` gains a section beside \"A parked session is\
    \ a handoff, not a stall\", and amends \xA79's \"`failed` and `crashed` have no\
    \ representation at all\". `docs/agent-workflow.md` gains a fifth child state\
    \ \u2014 *logged out* \u2014 because it is indistinguishable from *died* by looking,\
    \ and the table's advice for *died* is one restart, which is the one response\
    \ guaranteed to fail.\n\n### Verified against the real incident, not only against\
    \ fixtures\n\nTruncating the genuine transcripts at each of the three real `authentication_failed`\
    \ lines and asking the detector what it would have said at that moment:\n\n```\n\
    61e30711: truncated at the 15:38:21.136 failure -> STALLED, 'Login expired \xB7\
    \ Please run /login'\n61e30711: truncated at the 15:43:38.025 failure -> STALLED\n\
    6a0beee3: truncated at the 15:36:45.777 failure -> STALLED\nboth files as they\
    \ stand today                  -> None   (they recovered)\n```\n\nThen the false-positive\
    \ question, asked of the whole corpus rather than argued: **318 session transcripts\
    \ on this machine scanned, exactly 1 reported stalled** \u2014 `7ceaaaab`, the\
    \ 2026-08-20 child that died 394 ms into its first request and never ran a turn,\
    \ so nothing real follows its failure line. That one is correct. Notably *not*\
    \ flagged: this session's own transcript, which contains the string several times\
    \ over from reading this task.\n\n### Tests\n\n`tests/test_dispatch_auth.py` (17)\
    \ for the detector, including the substring false positive, a failure attributed\
    \ to another session, recovery, a nudge that is not a recovery, a stall after\
    \ a recovery, the `since` filter, non-JSON lines, and both tail-window edges.\
    \ `TestASessionKilledByAnExpiredLogin` in `tests/test_dispatch_poller.py` (8)\
    \ for the poller: the handoff and its prompt, the run *not* being recorded as\
    \ a success, the session not being reaped, idempotency across two polls, normal\
    \ settlement after recovery, and a non-Claude runner polling exactly as before.\
    \ `TestAuthCheckCommand` in `tests/test_dispatch_cli.py` (4).\n\n`tests/conftest.py`\
    \ gains an autouse fixture pointing the check at an empty temp directory, alongside\
    \ the two already there. Without it the suite would ask the developer's machine\
    \ whether *its* sessions had died.\n\nFull gate still running; this entry will\
    \ be followed by its result.\n"
