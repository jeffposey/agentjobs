- id: 16
  ts: '2026-08-21T20:35:30.787050Z'
  actor: claude
  type: decision
  body: "## An auth-stalled run is parked, not finished \u2014 and the session is\
    \ not reaped.\n\nThe alternative, and the obvious one, was to give the run a terminal\
    \ `dispatch_result` with `outcome: failed`. \xA79 of the design doc even licenses\
    \ it: it says `failed` and `crashed` have no representation in session mode *because*\
    \ a session that errors reports `idle`/`done`, and this task is precisely the\
    \ discovery that one such error can be named after all.\n\n**Rejected, because\
    \ finishing reaps.** `_finish_session` reaps the session by default, and entry\
    \ 8 established that recovery is *in place*: run_a1e35ca5 was already running\
    \ when it died, and after the re-auth it picked up on the same session with no\
    \ restart and no re-dispatch, then completed normally. Reaping would destroy the\
    \ cheapest recovery available and convert a six-minute outage into a lost night\
    \ \u2014 the exact failure this task exists to remove.\n\nThree consequences,\
    \ each deliberate:\n\n- **The run keeps its lock**, so the task cannot be re-dispatched\
    \ while it is stalled. That is right rather than merely tolerable: a fresh dispatch\
    \ would die in the same second, on the same dead credential. A human who would\
    \ rather start over can cancel the run from the dashboard, which is one click\
    \ and already exists.\n- **A stalled run stays live indefinitely** if nobody ever\
    \ acts. It is not silent \u2014 the ball is with a human, carrying a prompt naming\
    \ the fix \u2014 so this is a visible open item rather than a lost one, which\
    \ is the whole difference from today.\n- **No `dispatch_result` is written**,\
    \ so the run's record stays honest: it has not concluded, because it has not.\n\
    \n## Two things deliberately not built\n\n**No auto-nudge.** Entry 8 offered it\
    \ as optional: once auth is restored, poke the parked session so it resumes itself.\
    \ It is left out because AgentJobs has no trustworthy way to know auth is restored.\
    \ The one machine-readable signal \u2014 `daemon-auth-status.json` \u2014 is a\
    \ proven-stale latch (entry 8, signal 3), and polling the transcript cannot distinguish\
    \ \"auth is back\" from \"nothing has happened yet\". A nudge sent too early is\
    \ worse than none: it fails in 9 ms and consumes a turn. The human is already\
    \ being told to send that message, and they are the one party who knows they have\
    \ just logged in.\n\n**Batch runs are not covered.** `_classify_batch_exit` reads\
    \ a process exit code and would report a generic `failed`. Dispatch's session\
    \ mode is the unattended surface these two incidents happened on, and a batch\
    \ run at least ends loudly with output rather than being recorded as a success.\
    \ Naming it here so a later reader knows it was considered rather than missed.\n\
    \n## One thing added beyond the ask, and why\n\nJeff's note said \"make our supervisor\
    \ **pollers**\" \u2014 plural. The dispatch poller is one. The other is the agent\
    \ supervisor described in `docs/agent-workflow.md`, whose children are its own\
    \ subprocesses with no run directory and no ledger row, so the dispatch poller\
    \ cannot see them at all. That guide's table tells a supervisor that a child which\
    \ simply stops has *died*, and prescribes one restart \u2014 which, for this failure,\
    \ is guaranteed to die identically and to be the last useful thing that supervisor\
    \ does before it burns its budget proving so.\n\n`agentjobs dispatch auth-check\
    \ [SESSION_ID]` exists so that instruction is executable rather than prose: exit\
    \ 1 means logged out, and the guide now carries a fifth child state that branches\
    \ on it. The alternative \u2014 telling an agent to run a Python one-liner against\
    \ an internal module \u2014 is worse than a command.\n"
