    \ leases=0, live_workers=0)` \u2014 the daemon idled out **104 seconds before\
    \ the 07:34:38 refresh it had scheduled**, so nothing refreshed the token and\
    \ it expired on time at 07:38:38.6. The cold-start session at 07:48:28 was refused\
    \ 590 s later. Entry 6 recorded this occurrence as an unaided self-heal; the *death*\
    \ was a cancelled timer, which is a much less alarming thing than it looked.\n\
    - **2b and 2c** are ordinary post-expiry refusals following the three failed network\
    \ refreshes entry 6 already documented.\n\n**Mechanism B \u2014 a session refused\
    \ a token that had not expired. Two of the five, and this is the actual problem.**\n\
    \n`2a` at **E\u221253.7 s** and `3` at **E\u2212271.9 s**. Entry 30 found this\
    \ inversion for occurrence 3 and called it the open question. It also holds for\
    \ occurrence 2, which nobody had noticed \u2014 so it is the *shape* of the failure\
    \ rather than a one-off. In both cases the session was refused **before the daemon\
    \ had concluded anything was wrong**: at 15:36:45.8 the daemon still had 14 s\
    \ to go before its final attempt, and at 23:39:59.6 it had 33 s to go before its\
    \ first.\n\nAnd in both, the daemon's very next attempt after that first refusal\
    \ returned in **1\u20132 ms with `no token found`** \u2014 no network call at\
    \ all \u2014 where its earlier attempts that same cycle were 5.7\u20137.1 s network\
    \ failures that reported the token *present*.\n\n### A fixed client-side staleness\
    \ margin is ruled out\n\nThis was the obvious explanation and it does not survive\
    \ the data. In occurrence 2 the daemon read the token as **present** at E\u2212\
    239 s, E\u2212166 s and E\u2212106 s (real network calls, `(token still valid)`),\
    \ then **absent** at E\u221240 s. In occurrence 3 it read it as **absent** at\
    \ E\u2212238.5 s. The same offset \u2014 about E\u2212240 s \u2014 reads present\
    \ on one cycle and absent on the next, so no single margin explains both. Ruling\
    \ this out matters because it is the reading a later session would otherwise reach\
    \ for, and it would send anyone chasing a client constant that is not there.\n\
    \nWhat is left is that the stored credential genuinely stops being readable at\
    \ some point in the last minutes before expiry, and that both the sessions and\
    \ the daemon then see nothing. In occurrence 2 that transition is bracketed to\
    \ a **46-second window**: present at 15:35:59.68, a session refused at 15:36:45.78,\
    \ daemon reporting nothing at 15:36:59.69.\n\n### Two more hypotheses from the\
    \ original spec, now dropped\n\n- **Client version.** New: the CLI upgraded twice\
    \ this week \u2014 2.1.228 \u2192 2.1.235 (08-18 21:36) \u2192 **2.1.237** (08-20\
    \ 07:50) \u2192 **2.1.238** (08-21 15:44:49, `binary \u2026 changed (mtime changed)\
    \ \u2014 self-restarting for upgrade`). Occurrence 1 straddles the 235\u2192237\
    \ upgrade, occurrence 2 ran on 237, occurrence 3 on 238. **All three versions\
    \ produced it.** Version is not the discriminator.\n- **Concurrency / device limit.**\
    \ Occurrence 3's failing session was the *only* dispatched run live in the window\
