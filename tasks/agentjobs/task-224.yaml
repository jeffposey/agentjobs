  body: "Research is complete; all four acceptance criteria are met. No code was written\
    \ and no branch exists \u2014 the deliverable is log entries 6, 7 and 8 on this\
    \ record. Nothing was posted upstream and nothing was built.\n\n**The answer:\
    \ your remote-control hypothesis is wrong, and the real cause is in a log nobody\
    \ had opened \u2014 `~/.claude/daemon.log`.** Claude Code runs a background auth\
    \ daemon that owns OAuth refresh for every `--bg` session. At 15:33:40 UTC its\
    \ scheduled refresh fired on time and failed four times over 3m19s. It then gave\
    \ up and discarded the token \u2014 a token its own log line calls `(token still\
    \ valid)`, 40 seconds before that token would have expired anyway. Every `bg`\
    \ session went dead; the desktop app, on the same account and machine, kept working\
    \ throughout, including one call 91ms after the first failure.\n\nThat also explains\
    \ the part that made you swear: **answering the prompt could not have worked.**\
    \ Your message at 15:43:38 arrived fine and failed 9ms later, because it was retried\
    \ against a credential the daemon had already thrown away. Only `claude auth login`\
    \ clears it. It happened on 2026-08-20 too, and that time it healed itself in\
    \ two minutes with nobody logging in \u2014 which is what rules out any deliberate\
    \ logout.\n\n**Three decisions for you:**\n\n1. **The build recommendation** (entry\
    \ 8). A narrow detector in the dispatch poller: tail a quiet session's JSONL for\
    \ `\"error\": \"authentication_failed\"`, and on a hit hand the ball to you saying\
    \ \"this run needs `claude auth login`\". Right now dispatch is blind to this\
    \ \u2014 run_a1e35ca5 is recorded `outcome: completed` despite having died and\
    \ needed rescuing. Recovery is verified to work in place, with no restart, so\
    \ the fix is cheap and the failure it removes is a whole night's unattended work.\
    \ **Want me to file this as a follow-up task?** I have not created one.\n2. **The\
    \ upstream report.** anthropics/claude-code#79685 is the same bug, open since\
    \ 2026-07-21 with no maintainer response, and it asks for exactly the machine-readable\
    \ signal AgentJobs needs. I have three findings to add that the issue does not\
    \ have (the still-valid token being discarded, `daemon-auth-status.json` latching\
    \ at `auth_required` and never clearing, and the self-healing occurrence). **Posting\
    \ is your call \u2014 say the word and I will draft it for your approval rather\
    \ than sending anything.**\n3. **Anything to correct.** Entry 7 drops four candidate\
    \ explanations including yours, and is deliberate about the one thing the evidence\
    \ does *not* settle: why the refresh calls failed. The daemon logs no HTTP status,\
    \ so \"the OAuth endpoint was unhealthy\" and \"this machine's refresh token was\
    \ rejected\" cannot be told apart from anything on disk. I did not pick one.\n\
    \nOne live nuisance worth knowing: `~/.claude/daemon-auth-status.json` still reads\
    \ `auth_required` right now, hours after the successful re-auth, while everything\
    \ works. It is a stale latch \u2014 do not trust it if you ever go looking."
