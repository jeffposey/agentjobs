  actor: claude
  type: progress
  body: "**The spec's suspected cause is disconfirmed, and I cannot reproduce the\
    \ defect with any instrument I have.** Recorded in full before any code changes,\
    \ because the task's constraint is \"confirm the cause before changing the element\"\
    \ and what I confirmed is the opposite of what was suspected.\n\nWorktree `C:/projects/worktrees/agentjobs-225`,\
    \ branch `fix/task-225-drag-actually-starts`, bootstrapped. No app code changed\
    \ yet.\n\n## 1. `<button draggable>` is a valid drag source in Chromium\n\nStandalone\
    \ probe, no app and no server: a page with four candidate handle shapes, each\
    \ dragged with `page.mouse.move`/`down`/`move`/`up`, a capturing `dragstart` listener\
    \ recording what fired.\n\n```\n<button draggable>              -> dragstart fired\
    \ from: a\n<span draggable tabindex=0>     -> dragstart fired from: b\n<div draggable><button>\
    \         -> dragstart fired from: cwrap\n<div draggable><button pe:none> -> dragstart\
    \ fired from: dwrap\n```\n\nAll four start a drag. Blink agrees independently:\
    \ `getComputedStyle(grip).webkitUserDrag` is `\"element\"` on the live grip button,\
    \ the same value a fresh `<span draggable>` and `<div draggable>` compute. So\
    \ the \"button activation consumes the gesture\" hypothesis has no support at\
    \ the style-resolution layer either.\n\n## 2. The whole drag path works against\
    \ the real app, in five variations\n\n`frontend/e2e/drag-probe.spec.ts` (temporary,\
    \ not committed), real-mouse only, against a freshly built bundle of `main`:\n\
    \n| gesture | result |\n|---|---|\n| upward, dropped on the Status cell | order\
    \ changed |\n| upward, dropped on the task title `<a>` | order changed |\n| upward,\
    \ dropped on the Queue cell | order changed |\n| downward, dropped on the Status\
    \ cell | order changed |\n| downward, dropped on the task title `<a>` | order\
    \ changed |\n| cross-band (high onto low) | `role=\"alertdialog\"` count 1 \u2014\
    \ the confirmation, as specified |\n\nEvent traces show the full sequence every\
    \ time: `dragstart@source`, `dragover@\u2026`, `drop@target`, `dragend@source`.\n\
    \n## 3. It also works in real Chrome, headed, against the sandbox Jeff reviewed\n\
    \nNot bundled Chromium \u2014 `chromium.launch({channel: \"chrome\", headless:\
    \ false})` against the live task-207 sandbox on 8901, dragging `task-013`'s grip\
    \ onto `task-010`:\n\n```\nBEFORE: task-001,task-002,task-013,task-010,task-011,...\n\
    EVENTS: mousedown@task-013, dragstart@task-013, dragover@task-013,\n        dragover@task-010,\
    \ drop@task-010, dragend@task-013\nAFTER:  task-001,task-002,task-010,task-013,task-011,...\n\
    ```\n\nThat sandbox serves `assets/index-DdHo9wMI.js` \u2014 byte-identical to\
    \ the bundle my worktree builds from `main`. So this is not a stale-bundle question:\
    \ the code Jeff looked at is the code I tested. (I moved `task-013` twice while\
    \ probing and put it back; the high band is `010, 011, 012, 013, 020, 021` again,\
    \ as seeded.)\n\nThe server half works there too: `POST /api/projects/sandbox-healthy/tasks/task-013/queue-move`\
    \ with the project's `default_user` (\"Jeff Posey\") returns 200 and a new `queue_position`.\
    \ So neither a missing actor nor a refused write is silently reverting the order.\n\
    \n## 4. One thing I did observe failing: the browser-automation drag\n\n`mcp__claude-in-chrome`'s\
    \ `left_click_drag` against the sandbox produced **no events at all** \u2014 not\
    \ `dragstart`, not even `mousedown` \u2014 with capturing listeners installed\
    \ on `document` and the page otherwise responsive. A plain `left_click` on the\
    \ grip produced nothing either. That harness's synthetic input is not reaching\
    \ this page.\n\nThis is worth naming because it is a candidate explanation for\
    \ the original reproduction, though I cannot prove it is what happened: **an agent\
    \ driving that tool would see \"I dragged, nothing moved\" and read it as a product\
    \ defect**, which is the same wrong-instrument shape task-207 log 12 is about.\
    \ It does not account for Jeff's own report, which was by hand.\n\n## 5. What\
    \ I have not been able to test\n\nA human hand on a real mouse. Playwright drives\
    \ Chromium's drag through `Input.setInterceptDrags`, so it is not the OS drag\
    \ loop even when it is real mouse events and real Chrome. I cannot rule out that\
    \ the intercepted path and the hand path differ, and I am not going to assert\
    \ that they do.\n\nThe other untested explanation is much more ordinary: **the\
    \ grip's hit box is 18.56 px wide** (measured, `{\"x\":62.2,\"y\":438,\"width\"\
    :18.5625,\"height\":44}`). A grab that lands a few pixels off it starts a text\
    \ selection and the page does nothing at all \u2014 which is exactly the reported\
    \ symptom, and which no automated test can ever hit because every test grabs the\
    \ box's centre.\n\n## Consequence for the acceptance criteria\n\nsc-1 requires\
    \ the new test to be \"demonstrated to fail against the pre-fix code\". It does\
    \ not fail. It passes, in Chromium and in real Chrome. Per this task's own reasoning\
    \ that is not a test I can trust to be measuring the right thing, so writing the\
    \ fix on top of it would be the third repeat of the shape this task exists to\
    \ stop.\n\nParking for a decision rather than changing the element on a guess.\
    \ Next entry carries the ask."
