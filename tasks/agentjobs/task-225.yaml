  body: "**Not changing the drag handle, and not merging. Parking for one gesture\
    \ from Jeff instead.**\n\nTwo commits are on `fix/task-225-drag-actually-starts`,\
    \ both green through the full ten-stage gate (484s, `Ran every stage (10 of 10)`,\
    \ 21 e2e tests). Neither of them touches the handle.\n\n- `7dcb5c3` `test(e2e):\
    \ drive drag reordering with a real mouse` \u2014 the two tests sc-1 and sc-2\
    \ ask for.\n- `24faf3f` `chore(review): a durable queue-order sandbox, with a\
    \ drag trace` \u2014 `scripts/review_queue_sandbox.py`.\n\n## What was rejected,\
    \ and why\n\n**Rejected: change the handle from `<button>` to a non-button draggable\
    \ element.** That is the fix the spec proposes, and the spec's own constraint\
    \ is \"confirm the cause before changing the element; do not fix a guess.\" Entry\
    \ 3 records the confirmation attempt and it came back negative in four independent\
    \ ways \u2014 a shape probe, Blink's own `-webkit-user-drag` computation, five\
    \ drag variations against the real app, and real headed Chrome against the very\
    \ bundle Jeff reviewed. Making the change anyway would be changing a working element\
    \ on a hypothesis that the available evidence contradicts, with a live risk of\
    \ breaking the drag *and* the focus-restore path that the phone and tablet depend\
    \ on.\n\n**Rejected: widen the handle's hit box, or fix its ARIA role, as a way\
    \ of closing this.** Both are probably worth doing \u2014 19x44 px is a small\
    \ target, and `role=\"button\"` on something with no activation behaviour is sc-4's\
    \ complaint. But shipping either as *the fix for a drag that does not start* would\
    \ mean reporting a cause I have not established, and this task exists because\
    \ task-207 reported a feature as delivered on evidence that did not support it.\
    \ If the gesture turns out to work, sc-4 is a real and separable piece of work;\
    \ if it turns out to miss the handle, the hit box is the fix and I will know that\
    \ rather than guess it.\n\n**Rejected: merge the two commits now on the green\
    \ gate.** The parent's autonomous posture makes a green gate stand in for review,\
    \ but the same parent says to park on `human/decision` when \"an acceptance criterion\
    \ cannot be met as written\", and sc-1's second sentence cannot: the test does\
    \ not fail against the pre-fix code. Merging the half that passes and leaving\
    \ the criterion unmet is precisely the reading task-207 log 12 identifies as the\
    \ reason broken code was reported as delivered.\n\n## What settles it\n\n`http://127.0.0.1:8902/app/p/sandbox-healthy/tasks`\
    \ is running, seeded, throwaway. The panel bottom-right records the gesture, and\
    \ its three outcomes are three different tasks:\n\n| what the panel says | what\
    \ it means | what happens next |\n|---|---|---|\n| `PRESS on the handle \u2026\
    ` then `DRAGSTART`, `DROP`, `HTTP 200`, and the row moves | the drag works; the\
    \ original report was an instrument artefact | this task narrows to sc-4 and the\
    \ hit box, and the record is corrected |\n| `PRESS NOT on a handle \u2014 landed\
    \ on td` | the grab missed a 19 px target | widen and re-label the handle; that\
    \ is the whole fix |\n| `PRESS on the handle \u2026` and then nothing | the spec's\
    \ hypothesis is right for the OS drag loop and wrong for every automated harness\
    \ | move `draggable` off the button, exactly as the spec describes |\n\nVerified\
    \ end to end before handing it over \u2014 a deliberate miss produced `PRESS NOT\
    \ on a handle -- landed on td (in task-011)`, and a real drag produced `PRESS\
    \ on the handle queue-grip-task-013 (19x44 px) / DRAGSTART / DRAGOVER \xD73 /\
    \ DROP task-010 / REQUEST \u2026/queue-move / HTTP 200`, with no page errors."
