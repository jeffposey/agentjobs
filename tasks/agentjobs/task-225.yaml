    \ merged bundle. Every step fires, the request answers 200, the order changes.\n\
    \n**So drag-to-reorder is not broken and never was.** The `<button draggable>`\
    \ hypothesis is wrong, the reported defect does not exist, and the five automated\
    \ instruments in entry 3 that all said \"this works\" were right. sc-5 is met,\
    \ by the person the criterion names.\n\n## What this does to the acceptance criteria\n\
    \n- **sc-5 \u2014 met.** Directly, by Jeff, in a browser.\n- **sc-2 \u2014 met.**\
    \ The cross-band test drives a real mouse, gets the confirmation, and the priority\
    \ changes.\n- **sc-3 \u2014 met.** `TaskList.tsx` was never touched, and the keyboard\
    \ test still passes in the gate.\n- **sc-1 \u2014 the test exists and passes;\
    \ its second sentence is unsatisfiable.** \"Demonstrated to fail against the pre-fix\
    \ code\" presumes a defect, and there is no pre-fix code because there was nothing\
    \ to fix. Marking it `met` would be a lie in the direction this task exists to\
    \ prevent, so it stays `pending` pending Jeff's call on whether to reword it or\
    \ drop it.\n- **sc-4 \u2014 still open, and now the only real work left.** `role=\"\
    button\"` on an element that does nothing when activated is a genuine defect,\
    \ independent of the drag. It should not be closed silently on the back of this.\n\
    \n## What was wrong, then\n\nNot the code. The instrument, and then the record.\
    \ `mcp__claude-in-chrome`'s `left_click_drag` produces no events at all against\
    \ this page \u2014 entry 3, section 4 \u2014 so an agent using it sees \"I dragged,\
    \ nothing moved\" and has no way to tell that apart from a broken feature. task-207\
    \ log 12 states the drag failure as reproduced fact; on this evidence it is not,\
    \ and that entry needs a correction pointing here. Its other conclusion still\
    \ stands: closing a task `completed` over a `pending` sc-5 was wrong, and it was\
    \ wrong for process reasons that have nothing to do with whether the drag worked.\n\
    \nThe lesson generalises past this task and is worth carrying into `ENGINEERING.md`\
    \ beside the two bullets already there: **a browser-automation gesture that produces\
    \ no result is not evidence of a defect until you have checked that the gesture\
    \ reached the page.** The check is one capturing listener."
