    job titles, with the test applied rather than asserted.'
  status: pending
- id: sc-5
  text: It says exactly what a role permission profile may do to the posture boundary,
    and why that is safe; and what becomes of the derived `supervisor` role.
  status: pending
- id: sc-6
  text: Implementation children are derived and held as drafts pending Jeff's approval
    of the design.
  status: pending
