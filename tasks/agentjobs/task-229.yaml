- id: 6
  ts: '2026-08-21T20:37:42.294041Z'
  actor: claude
  type: decision
  body: "Transport: option A \u2014 keep the HTML5 drag, add an edge-autoscroll loop.\
    \ Option B (a pointer-event rewrite with `setPointerCapture`) is rejected for\
    \ now.\n\n**Why A.** The defect is that the page does not scroll, and that is\
    \ one self-contained loop: `frontend/src/components/dragAutoScroll.ts` is 120\
    \ lines including its documentation and it touches nothing else. B would have\
    \ replaced a gesture that, since task-225, demonstrably starts and drops correctly\
    \ \u2014 re-deriving the drop target from coordinates, reimplementing the cross-band\
    \ confirmation's trigger, and re-earning the evidence that the gesture works at\
    \ all. That is a large risk to carry for a benefit (touch) the spec puts out of\
    \ scope.\n\n**What choosing A costs, stated plainly so the next reader does not\
    \ have to rediscover it.** HTML5 drag does not fire on touch devices, so dragging\
    \ on a phone or tablet is still not a thing, and the phone reordering story remains\
    \ keyboard and controls. That is the case B would have bought, and it is what\
    \ should reopen this decision: **if touch drag is ever claimed as a requirement,\
    \ the answer is B, and this loop is thrown away rather than adapted.** A pointer-event\
    \ implementation gets autoscroll for free because it owns its own move loop.\n\
    \n**Item 2, the drag leaving the browser \u2014 partly fixed, and the remainder\
    \ explicitly accepted.** The payload moves from `text/plain` to `application/x-agentjobs-task-id`.\
    \ The harm was that a queue position could be dropped as text into any other application\
    \ on the machine; under a type nothing else understands there is nowhere outside\
    \ this table for the gesture to deposit itself. What is *not* fixed is that Chrome\
    \ still lets the drag image travel outside the window, because that is the operating\
    \ system's drag loop and an HTML5 drag has no say in it. Confining the gesture\
    \ to the document is precisely what B buys by construction, and it is accepted\
    \ here rather than worked around: a ghost that goes nowhere is cosmetic, and the\
    \ task calls this half minor."
