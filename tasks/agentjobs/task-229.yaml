- id: 8
  ts: '2026-08-21T20:38:27.985635Z'
  actor: claude
  type: progress
  body: "Implemented on `fix/task-229-drag-autoscroll` (worktree `C:/projects/worktrees/aj-229`),\
    \ two commits, gate green.\n\n**The fix.** `frontend/src/components/dragAutoScroll.ts`\
    \ (new). `startDragAutoScroll()` attaches a capture `dragover` listener that records\
    \ the pointer's Y, and runs a `requestAnimationFrame` loop that scrolls the window\
    \ while that Y sits inside an 80px edge zone. The rate ramps on a squared curve\
    \ from 90 px/s at the boundary of the zone to 1100 px/s at the edge itself \u2014\
    \ gentle enough to place a row one line at a time, fast enough to cross several\
    \ screens. Movement is computed from elapsed time rather than per frame, so a\
    \ slow machine covers the same ground, with a 100ms cap so a missed frame is not\
    \ repaid in one jump. `TaskList.tsx` starts it from a `useEffect` keyed on the\
    \ existing `dragging` state and stops it on cleanup.\n\n**Two things about the\
    \ loop worth knowing before changing it.** It does *not* depend on `dragover`\
    \ continuing to fire: a held hand produces no events, and the loop keeps scrolling\
    \ from the last reading it has. And it tears itself down from its own capture\
    \ `drop`/`dragend` listeners as well as through the React cleanup, so the loop\
    \ cannot outlive the gesture even if the component's state were left set.\n\n\
    **The payload.** `text/plain` \u2192 `application/x-agentjobs-task-id` in `onDragStart`.\
    \ See the decision entry for what that does and does not fix.\n\n**Verified, and\
    \ what each piece is worth.**\n- `dragAutoScroll.test.ts`, 15 cases, drives the\
    \ loop with a hand-turned frame clock and a fake scroller: the ramp, both directions,\
    \ symmetry, the elapsed-time arithmetic, the frame cap, a held-still pointer,\
    \ and teardown on drop / on dragend / twice over. Settles the arithmetic, says\
    \ nothing about a browser.\n- `TaskList.test.tsx`, 5 new cases: that the page\
    \ scrolls both ways for a drag this list started, that it does not for one it\
    \ did not, that a cancelled drag (`dragend`, no drop) stops it, and that the payload\
    \ type is private. **Checked these can see the defect** \u2014 with the effect\
    \ stubbed out, three of them fail; that check is the one task-207 and task-225\
    \ did not make in this file.\n- `frontend/e2e/queue-order.spec.ts`, one new test\
    \ in real Chromium: seeds 30 rows so the document is taller than the window, presses\
    \ a grip, moves into the bottom edge zone, then *holds still* and polls `window.scrollY`.\
    \ It passes, which is the only automated evidence that a real browser fires `dragover`\
    \ at the document and that `window.scrollBy` moves this page. It then releases\
    \ and asserts `scrollY` stops changing. **It is not evidence a person can reach\
    \ an off-screen row** \u2014 Playwright goes in through `Input.setInterceptDrags`,\
    \ below the operating system's drag loop, which is task-225's incident exactly.\n\
    - `scripts/check.py`, all ten stages, 490.9s, exit 0. pytest 2190, vitest 45 files,\
    \ 22 e2e.\n\n**The sandbox for the by-hand check (a2).** `scripts/review_queue_sandbox.py`\
    \ seeded fourteen tasks across three projects \u2014 under one screen, so the\
    \ fixture built to review this feature could not show the defect. Added a fourth\
    \ project, `sandbox-tall`, with 60 more high-band tasks: 72 rows, four or five\
    \ screens. The trace panel now collapses `dragover` into one running line (a screen-crossing\
    \ drag fires hundreds, and one line each pushed PRESS and DRAGSTART out of the\
    \ panel's 24-line window) and reports how far the page moved, so the gesture leaves\
    \ durable evidence either way.\n\nRunning now on 8899 \u2014 its own port, its\
    \ own throwaway registry and data under a temp directory that is deleted when\
    \ it stops. Nothing touches the 8876 corpus."
