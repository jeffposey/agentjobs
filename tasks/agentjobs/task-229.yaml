spec:
  summary: "Dragging a task's grip in the React task list never scrolls the window,\
    \ so a row can only be dropped on a target that is already visible. On a backlog\
    \ longer than one screen \u2014 which is every real backlog \u2014 that makes\
    \ the drag path unusable and leaves the keyboard path as the only way to move\
    \ a task any real distance. The drag also escapes the browser window entirely\
    \ (a native HTML5 drag out to other applications), which is cosmetic but the same\
    \ root cause."
  intent: "Reordering the backlog by looking at it is the point of the queue column,\
    \ and task-207 shipped drag as the accelerator for exactly that. A drag that cannot\
    \ reach off-screen targets does not accelerate anything: the common move \u2014\
    \ pull something from the bottom of the list to the top of its band \u2014 is\
    \ precisely the one it cannot perform. Reported by Jeff, 2026-08-21: \"the lack\
    \ of scrolling makes the feature mostly unusable.\""
  description: "## What is broken\n\nReported by Jeff, 2026-08-21, using the merged\
    \ drag path in a browser.\n\n1. **No auto-scroll.** While dragging a row's grip,\
    \ holding the pointer at the top or bottom edge of the window does not scroll\
    \ the page, the way it does in every list-reordering UI a person has used. The\
    \ list is taller than the viewport, so the only reachable drop targets are the\
    \ rows already on screen. Scrolling with the wheel mid-drag is not a substitute\
    \ \u2014 a person cannot hold a drag and operate a scroll gesture on a touchpad\
    \ or a phone.\n2. **The drag leaves the browser.** The grip is a native HTML5\
    \ `draggable` element carrying `text/plain`, so the row can be dragged out of\
    \ the window and dropped on other applications. Cosmetic, and Jeff called it minor\
    \ \u2014 but it is a consequence of the same transport choice, so whoever fixes\
    \ 1 should decide about 2 rather than leave it unstated.\n\nNot in question: the\
    \ keyboard path (`Alt+Up`/`Down`/`Home`/`End`) works and moves a task any distance,\
    \ and the drag itself does *start* and *drop* correctly since task-225. This is\
    \ only about what the gesture can reach.\n\n## Where the code is\n\n`frontend/src/components/TaskList.tsx`.\
    \ The grip is a `<button draggable>` with `onDragStart`/`onDragEnd` around line\
    \ 429; rows accept via `onDragOver`/`onDrop` around line 419; the drop resolves\
    \ to a `before`/`after` move in `onRowDrop` (line 304), including the cross-band\
    \ confirmation.\n\nNothing there listens for the pointer approaching a viewport\
    \ edge, and nothing scrolls. Browsers do not do this for you at the document level\
    \ during an HTML5 drag \u2014 Chrome's own autoscroll during DnD is limited and\
    \ unreliable for page scroll \u2014 so the absence is an omission, not a browser\
    \ bug to be worked around.\n\n## Two ways to fix it, and the choice belongs in\
    \ this task\n\n**A \u2014 keep HTML5 drag, add an edge-autoscroll loop.** A `dragover`\
    \ handler on the document records the pointer's Y; a `requestAnimationFrame` loop\
    \ scrolls the window while it sits within some threshold (~60\u201380px) of the\
    \ top or bottom edge, at a rate that ramps with proximity; the loop starts on\
    \ `dragstart` and is torn down on `dragend`/`drop`, including the cancel paths.\
    \ Smallest diff. Does not address 2, and does nothing for touch \u2014 HTML5 drag\
    \ does not fire on touch devices at all, so the phone case Jeff asked for in task-207\
    \ is still keyboard-only.\n\n**B \u2014 replace the transport with pointer events.**\
    \ `pointerdown`/`pointermove`/`pointerup` with `setPointerCapture`, the drag confined\
    \ to the document by construction (which resolves 2 for free), autoscroll trivial\
    \ because you already own the move loop, and touch works. Larger, and it means\
    \ re-deriving the drop target from coordinates rather than getting it from `dragover`.\n\
    \nRecommendation is A unless the touch case is being claimed now; whichever is\
    \ chosen, **record it as a `decision` on this task with the rejected alternative**,\
    \ because the next reader will otherwise assume the transport was never considered.\n\
    \n## Verification \u2014 read this before writing a test\n\nThis area has burned\
    \ two tasks on tests that could not see the defect. task-207 shipped drag with\
    \ three green tests over a gesture the browser never started; ENGINEERING.md's\
    \ Verification section carries both that incident and task-225's.\n\n- **A Playwright\
    \ drag is not a person's drag.** Playwright drives Chromium's drag through `Input.setInterceptDrags`,\
    \ below the real drag loop. It is fair evidence that a handler is wired and a\
    \ route is called; it is not evidence that a human can drag a row to a target\
    \ eight rows off-screen.\n- So: an automated test may cover the scroll *mechanism*\
    \ (the loop starts, scrolls, and is torn down), but the acceptance evidence for\
    \ \"you can now reach an off-screen row\" is **a hand on a real mouse**, in a\
    \ review sandbox with enough seeded tasks that the list is several screens tall.\n\
    - Stand that sandbox up as part of the handoff, on its own port with its own throwaway\
    \ data, and say how to stop it. `scripts/review_queue_sandbox.py` already exists\
    \ and keeps its traces.\n- Check that autoscroll does not fire on a drag that\
    \ started outside the list, and that the loop cannot outlive a cancelled drag\
    \ (Escape, or a drop on a non-target)."
  constraints: "Do not touch the keyboard reorder path \u2014 it works and is the\
    \ primary accessible route. Do not change the cross-band confirmation behaviour\
    \ in `onRowDrop`. The full `scripts/check.py` gate before every commit; task records\
    \ to `main`, code to a worktree branch."
  out_of_scope: "Touch/phone drag support, unless option B is chosen and it falls\
    \ out for free \u2014 the phone reordering story is keyboard/controls today and\
    \ changing that is its own task. Any redesign of the queue column or the reorder\
    \ affordance itself."
