    \ trace got wrong, now fixed.** One record read `=> the browser never started\
    \ a drag from the handle` about a drag that had plainly started, and another printed\
    \ `y=undefined ... NaNpx`. Both are one bug in the sandbox instrument, not in\
    \ the application: a `mouseup` arrived while a long autoscrolling drag was still\
    \ in flight, so `finish()` summarised and cleared the gesture mid-way and recorded\
    \ the remainder as a second gesture with no PRESS and no DRAGSTART. `finish()`\
    \ now refuses to close a gesture off while a drag is in flight, and the scroll\
    \ summary says so plainly rather than printing `NaN` if the start was never recorded.\
    \ Left alone this instrument would have told the next session that drag was broken\
    \ when it was not, which is exactly task-225's incident wearing a different hat.\n\
    \nSandbox stopped, temp directory gone. Nothing merged and nothing pushed: the\
    \ branch is still `fix/task-229-drag-autoscroll` and the ball stays with Jeff\
    \ for the merge word."
