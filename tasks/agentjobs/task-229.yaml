      \ an automated drag is not acceptance evidence."
  - path: tasks/agentjobs/task-207.yaml
    why: Shipped the reorder feature; its spec is what drag was supposed to deliver.
  - path: ENGINEERING.md
    why: The Verification section carries both prior incidents in this exact code
      path.
  - path: scripts/review_queue_sandbox.py
    why: The seeded sandbox to hand Jeff for the by-hand check; it records what the
      page actually received.
