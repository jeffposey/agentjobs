- id: 4
  ts: '2026-08-21T20:26:43.832769Z'
  actor: claude
  type: decision
  body: "**One task on one branch, not a parent with three children. Filed as an epic\
    \ twenty minutes earlier; that was wrong for what Jeff wants and this reverses\
    \ it.**\n\nJeff, 2026-08-21: *\"what I'd really like to be able to do, is do all\
    \ 3 tasks in one branch for task-231 and only pay the ceremony and full gate costs\
    \ once instead of 3 times.\"*\n\n**Why the epic structure could not deliver that.**\
    \ In this system \"epic\" is not a grouping label, it is an execution mode, and\
    \ it is enforced mechanically. `PromptBuilder.build_prompt` chooses between two\
    \ stubs on one property of the record \u2014 `stub = SUPERVISOR_STUB if children\
    \ else PROMPT_STUB` (src/agentjobs/dispatch/runner.py:953), where `children` is\
    \ `open_child_ids()`, the still-open children. The same read drives the permission\
    \ grant (`supervisor=bool(children)`). `SUPERVISOR_STUB` tells the run, before\
    \ it reads anything: *do not work a child yourself, do not take a worktree, check\
    \ nothing out, start a separate session per child.* There is no override field\
    \ and no posture that changes it. So a parent with three open children buys exactly\
    \ three sessions, three worktrees, three gates, three review round trips and three\
    \ merges. That is the design working as intended (task-164), not a bug.\n\n**What\
    \ was decided.** Close task-226, task-016 and task-228 as `superseded`, fold their\
    \ plan into this task as parts 1/2/3, and keep the three records as the detailed\
    \ spec for each part \u2014 pointed at from `context[]`. This task then has no\
    \ children, dispatches as an ordinary worker, and is worked on one branch in one\
    \ session: one worktree, one bootstrap, three commits, **one full `scripts/check.py`\
    \ before the handoff rather than before each commit**, one review, one merge,\
    \ one rebuild-and-restart.\n\n**Why it is defensible here and not in general.**\
    \ The test is whether the human could reject one part and merge the others. Here\
    \ they cannot: parts 2 and 3 are built against the vocabulary part 1 settles,\
    \ so rejecting part 1 invalidates the other two. Three things that stand or fall\
    \ together, changing one component, reviewed by one person reading one diff, are\
    \ one unit of work \u2014 and ALLAGENTS.md's \"you do not work the children\"\
    \ rule is aimed at the opposite case, a supervisor accumulating four unrelated\
    \ children's context. That reasoning does not apply to three views of one component.\n\
    \n**Rejected: keep the epic and dispatch it anyway.** It would have produced the\
    \ three-session split whatever the spec said, because the prompt is chosen from\
    \ the record and not from the prose. Rejected: add a `consolidated` flag to dispatch\
    \ now. That is real schema and dispatch work, it overlaps the agent-type layer\
    \ task-227 is designing, and it is not worth blocking tonight's fix on. Filed\
    \ separately instead.\n\n**The cost, stated so nobody rediscovers it.** The gate\
    \ deviation means intermediate commits on this branch are not individually gate-verified,\
    \ so `git bisect` across them may land on a commit that does not pass. Bounded\
    \ by the fact that nothing reaches `main` except through the final unqualified\
    \ green plus the merge, and by the cheap stages (~15s) still running per commit.\
    \ If that trade turns out to be wrong, the evidence will be a bisect that wastes\
    \ someone's afternoon, and this entry is where to record it."
  data:
