- id: 10
  ts: '2026-08-21T21:38:50.211579Z'
  actor: claude
  type: decision
  body: "**Part 3 \u2014 the approve payload takes a `note` field, and no attachments.\
    \ Both halves of p3-2's judgement call, and the task-001 sequencing question task-228\
    \ told this task to raise rather than guess past.**\n\n**The payload shape, and\
    \ why it does not pre-empt [task-001](tasks/agentjobs/task-001.yaml).** 228 asked\
    \ whoever built this to read 001's decisions first, and to raise the ordering\
    \ rather than invent a parallel parameter. 001 has no decision entries at all\
    \ \u2014 it is still `draft`, and its own record says the design question is *why*\
    \ it is still draft. So there was nothing to fit into, and waiting for it would\
    \ have blocked a one-field change behind an unspecified design question.\n\nWhat\
    \ was built instead is the shape 001 can extend without moving anything: `ApproveActionRequest`\
    \ is `NoteActionRequest`, a base with `user` plus `note: Optional[str]`. The two\
    \ axes 001's own spec names \u2014 *what is being approved* and *what the human\
    \ wants to say about it* \u2014 stay orthogonal. `note` is the second. When 001\
    \ settles the first, it adds its gate discriminator beside `note` on the same\
    \ model, and neither the field nor its meaning changes. The alternative 228 warned\
    \ against \u2014 a bespoke `approval_note` parameter that 001 would find bolted\
    \ on beside its own \u2014 is what naming the field for the axis rather than for\
    \ this route avoids. A note appended to task-001 says so, so its author does not\
    \ have to derive it from this diff.\n\nThe clearance sentence itself is now the\
    \ named constant `APPROVAL_CLEARANCE`, which is also the seam 001 needs: varying\
    \ what an approval *means* is one substitution at that name, and the regression\
    \ test asserts against the constant rather than a copy of its wording, so the\
    \ two branches cannot drift apart while the guard still passes.\n\n**Attachments\
    \ on an approval: no.** Request Changes carries them (`AttachmentPicker`) because\
    \ a screenshot of the thing being objected to *is* the payload \u2014 the feedback\
    \ is a description of something wrong, and the image is the evidence for it. Promote\
    \ does not, and neither does this. An approval note is context to carry into a\
    \ merge, not evidence of a defect, and there is no observed instance of one needing\
    \ an image. Adding them would double the sidecar-storage path and the decode-and-refuse\
    \ handling for a case nobody has hit.\n\n*Rejected: add them for symmetry with\
    \ Request Changes.* Symmetry between two controls that mean different things is\
    \ not a reason on its own, and the asymmetry here is the point \u2014 one control\
    \ says \"here is what is wrong\", the other says \"go ahead\". **Reopen trigger,\
    \ stated so this is a decision and not an omission:** the first approval note\
    \ that wants a screenshot. It is additive when it comes, exactly as the note itself\
    \ was."
