spec:
  summary: "One task, three parts, one branch. The review panel is the single control\
    \ pair every human intervention goes through, and it has three defects: it never\
    \ reads `ball_reason`, so it offers \"Approve \u2014 agent may merge\" on a task\
    \ with no branch; it writes `ball_reason: revise` for four different human intents;\
    \ and Approve is a bare button, so an approval carrying a sentence has to be filed\
    \ as a rejection. Fix all three on one branch, in one session, behind one review.\
    \ Absorbs task-226, task-016 and task-228, which are closed as superseded and\
    \ remain readable for their detail."
  intent: "These three were filed separately over one evening because each was noticed\
    \ separately. They are one defect seen from three sides, they change one component,\
    \ and the second and third are built on a vocabulary decision the first makes\
    \ \u2014 so a reviewer looking at part three is re-reading part one's diff anyway.\
    \ Working them as one branch pays the worktree, the gate, the review round trip\
    \ and the merge once instead of three times. That is the whole reason this is\
    \ one task and not a parent with children: see the decision log."
  description: "## The three parts\n\n| Part | The half it fixes | Absorbed from |\n\
    |---|---|---|\n| **1. The vocabulary** | What the panel **writes**. `ball_reason:\
    \ revise` is the only value a human-to-agent handoff can take, and it has carried\
    \ four distinct intents \u2014 reject work, grant a permission, re-brief a run,\
    \ impose a hold. A later session had to reinterpret one of them in prose. | [task-226](tasks/agentjobs/task-226.yaml)\
    \ |\n| **2. The offered verbs** | What the panel **offers**. `ReviewPanel` branches\
    \ on `lifecycle === \"draft\"` alone and never reads `ball_reason`, so a task\
    \ waiting on a decision renders \"\u2713 Approve \u2014 agent may merge\" \u2014\
    \ false when there is no branch. | [task-016](tasks/agentjobs/task-016.yaml) |\n\
    | **3. The approval note** | What the panel **cannot carry**. Approve is a bare\
    \ button with no composer, so an approval with a sentence attached goes through\
    \ Request Changes, taking a round trip the human did not want and recording approved\
    \ work as revised. | [task-228](tasks/agentjobs/task-228.yaml) |\n\n**The three\
    \ absorbed tasks are closed, not deleted.** Each carries the full evidence \u2014\
    \ the verbatim quotes, the log entries that show the cost, the code line numbers,\
    \ the constraints, and the rejected alternatives already considered. They are\
    \ the working spec for their part. Read all three before starting; this task is\
    \ the plan, they are the detail.\n\n## Order, and why\n\n**1 \u2192 2 \u2192 3.**\
    \ Part 1 settles whether the agent-side reason vocabulary grows and what each\
    \ control is called. Part 2 branches the offered verbs on `ball_reason` and needs\
    \ those names. Part 3 adds what the approve verb can carry, and is the smallest.\n\
    \nThe order is a build order, not a dependency graph \u2014 nothing here blocks\
    \ anything else in the `needs` sense, and a part that turns out harder than expected\
    \ can be committed last without stranding the others.\n\n**One warning for part\
    \ 3:** [task-228](tasks/agentjobs/task-228.yaml) defers the approve payload shape\
    \ to [task-001](tasks/agentjobs/task-001.yaml), which is still `draft`. That is\
    \ a real sequencing question, not a formality \u2014 read 001 before designing\
    \ the parameter, and raise it rather than guessing past it.\n\n## How this one\
    \ runs \u2014 read this, it is not the default protocol\n\nThis task is deliberately\
    \ **not** a parent with children, and the difference is mechanical rather than\
    \ stylistic. Dispatch chooses a run's prompt from one property of the record:\
    \ [`stub = SUPERVISOR_STUB if children else PROMPT_STUB`](src/agentjobs/dispatch/runner.py:953),\
    \ where `children` is the task's still-open children. A parent with open children\
    \ *is* an epic to this system, and its worker is told to take no worktree and\
    \ start a separate session per child. That is the behaviour being avoided here,\
    \ so the children were closed into this task rather than left hanging off it.\n\
    \nSo run it as an ordinary task, with three deviations from habit that are all\
    \ deliberate:\n\n1. **One worktree, one branch.** `git worktree add ../worktrees/aj-231\
    \ -b fix/task-231-review-panel`, bootstrap it, work all three parts there.\n2.\
    \ **One commit per part**, in build order, each a coherent change with a message\
    \ naming its part and the task it absorbed. Three commits, not one squashed blob\
    \ \u2014 the parts are separately reviewable even though they merge together.\n\
    3. **One full gate, once, before the handoff \u2014 not before every commit.**\
    \ This is a deliberate deviation from [ENGINEERING.md](ENGINEERING.md)'s commit\
    \ rule, made on Jeff's instruction, and the reasoning and its risk are in this\
    \ task's decision log. While iterating, run the cheap stages \u2014 `scripts/check.py\
    \ --only black,ruff,mypy,oxlint,vitest,build`, about fifteen seconds \u2014 which\
    \ catch formatting, types and a broken build without paying for pytest. Then `scripts/check.py`\
    \ with no arguments before you hand off, and that green is the one that counts.\n\
    4. **One review, one merge.** Hand off once, with all three parts done. Do not\
    \ park for review part by part.\n\nEverything else is unchanged: task records\
    \ to `main` in the shared clone, code on the branch, no merge without explicit\
    \ approval.\n\n## Verification\n\nThe three absorbed tasks each carry their own\
    \ verification notes; follow them. Two things belong at this level because no\
    \ individual part proves them:\n\n- **Exercise the panel by hand against a running\
    \ server, in every state.** A task at `human`/`decision`, one at `human`/`review`,\
    \ one at `human`/`approval`, and a `draft`. Per [ENGINEERING.md](ENGINEERING.md),\
    \ assert on the rendered value a user acts on, not the presence of markup \u2014\
    \ this component has already shipped a bug that every test passed over.\n- **Read\
    \ the three parts together as a reviewer would.** The point of one branch is that\
    \ the labels, the offered verbs and what they write are consistent; that consistency\
    \ is exactly what a part-by-part review cannot see."
  constraints: "- One worktree, one branch, three commits, one full gate before the\
    \ handoff, one review. See \"How this one runs\" \u2014 the gate deviation is\
    \ authorised on this task only and does not generalise.\n- Do not re-parent this\
    \ task or add children to it. Open children change how dispatch prompts a run\
    \ against it (runner.py:953), which is the thing this structure exists to avoid.\n\
    - Any schema change decided in part 1 must reach the validator, docs/task-schema.md,\
    \ REST, the generated client, MCP and the CLI \u2014 not just the React app \u2014\
    \ before parts 2 and 3 are built against its labels.\n- Existing `revise` entries\
    \ stay valid and are not migrated; whatever is added is additive.\n- Do not remove\
    \ Reject & Archive from any reason \u2014 it is the escape hatch for \"this whole\
    \ task is wrong\", valid against a decision request too.\n- The approve path stays\
    \ `ball: agent` / `ball_reason: work` and its prompt still carries the merge-gate\
    \ clearance; a note is additive to \"you may merge\", never a replacement.\n-\
    \ Nothing here makes the GUI run git. The panel records; it does not merge."
  out_of_scope: "Structured multiple-choice question answering in the GUI (task-017).\
    \ The design-approval gate variant and which gates exist (task-001) \u2014 though\
    \ part 3 must read it. Editing a task's authoring fields from the browser (task-230).\
    \ A general \"work an epic's children on one branch\" capability, which is its\
    \ own task \u2014 this is the one-off that motivated it."
  context:
  - path: tasks/agentjobs/task-226.yaml
    why: Part 1's full spec. Closed as superseded by this task; the four documented
      intents, their verbatim evidence, and the schema constraints are all there.
  - path: tasks/agentjobs/task-016.yaml
    why: Part 2's full spec, including the ball_reason-to-verbs table and the incident
      that produced it.
  - path: tasks/agentjobs/task-228.yaml
    why: Part 3's full spec, including why the payload shape defers to task-001.
  - path: frontend/src/components/TaskDetail.tsx
    why: "ReviewPanel \u2014 the single component all three parts change."
  - path: src/agentjobs/api/routes/tasks.py
    why: 'approve_task and request_changes: what the two controls write today.'
  - path: docs/task-schema.md
    why: The ball_reason union part 1 may grow and part 2 must branch over.
  - path: src/agentjobs/dispatch/runner.py
    why: Line 953 is why this is one task rather than a parent with children; read
      it before restructuring anything here.
