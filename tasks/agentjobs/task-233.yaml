- id: 8
  ts: '2026-08-21T23:09:30.722881Z'
  actor: claude
  type: progress
  body: "**Part 6 \u2014 the before/after, stated as far as it can honestly be stated,\
    \ and named where it cannot.**\n\n## What is measured\n\n**Per gate run, the same\
    \ ten stages either way:**\n\n| | Before | After |\n|---|---|---|\n| Full gate\
    \ | **365.0s** | **94.5s / 95.8s / 103.6s** (three green runs) |\n| of which pytest\
    \ | 326.5s | 49.2s / 52.1s / 57.0s |\n| Tests executed | 2190 | 2608 |\n\nBoth\
    \ figures come from the same instrument \u2014 `scripts/check.py` prints its own\
    \ per-stage table at the end of every run, which is why re-measuring the budget\
    \ in ENGINEERING.md is now reading the bottom of any gate run rather than instrumenting\
    \ one.\n\n**This task's own session, as a worked example.** I invoked the full\
    \ gate seven times: five ordinary runs (66.0s, 62.9s, 131.4s, 95.8s, 94.5s), one\
    \ `--since-gate` run (50s), one inside a simulated run directory (99.0s). Two\
    \ of the five failed at pytest, which is the normal shape of a working session.\n\
    \n- **Actual gate time: 599.6s \u2014 10.0 minutes.**\n- **Under the old configuration,\
    \ the same seven invocations: \u22482558s \u2014 42.6 minutes.** Each run's non-pytest\
    \ stages are its measured costs; pytest is replaced with ENGINEERING.md's 326.5s,\
    \ and the `--since-gate` run becomes a full gate because the flag did not exist.\n\
    - **\u224833 minutes saved on one task.** That uses the *uncontended* old pytest\
    \ figure; against the 540.1s I actually measured under load it would be roughly\
    \ 66 minutes.\n\n## What is not measured, and will not be until runs happen\n\n\
    **I cannot state the end-to-end per-run figure the baseline uses, and I am not\
    \ going to estimate one.** The baseline (p50 15.6m per run, 2.13 runs per task,\
    \ \u224833 min of dispatched time per task at the median) comes from `started_at`/`finished_at`\
    \ in `meta.yaml`. Producing the \"after\" needs runs dispatched under the new\
    \ configuration, and none exist \u2014 this run itself started before any of this\
    \ was on disk.\n\nTwo things follow, and both are deliberate.\n\n**The estimate\
    \ I could construct would be dishonest in a specific way.** Multiplying \"gate\
    \ runs per session\" by the saving requires knowing how many times a typical run\
    \ invokes the gate, and *nothing in the corpus records that* \u2014 it was finding\
    \ 4 of this task, the reason every ranking was inference. Inventing the multiplier\
    \ here would be exactly the failure the instrumentation exists to end.\n\n**The\
    \ measurement is now automatic rather than an afternoon's work.** Once a handful\
    \ of runs have been dispatched post-merge:\n\n```bash\npoetry run python scripts/run_report.py\
    \ --since 7\n```\n\nThat prints the baseline table for the new period \u2014 and,\
    \ for the first time, the gate lines beneath it: how many gate runs a session\
    \ paid for, what they cost, and how much of that was gate runs that failed. Comparing\
    \ it with the table in this task's spec is the after-figure, taken with the same\
    \ method, with no hand-assembly.\n\n## Verified end to end, not just in tests\n\
    \nThe gate was run inside a run directory with `AGENTJOBS_RUN_ID`/`AGENTJOBS_RUN_DIR`\
    \ set, the way a dispatched session's gate will see it. `phases.jsonl` afterwards:\n\
    \n```json\n{\"kind\": \"gate_started\",  \"scope\": \"full\", \"stages_total\"\
    : 10, \"run_id\": \"run_demo1234\"}\n{\"kind\": \"gate_finished\", \"scope\":\
    \ \"full\", \"passed\": true, \"seconds\": 99.0, \"stages_run\": 10}\n```\n\n\
    and `run_report.py --list` against that ledger:\n\n```\n  run           task \
    \      outcome      elapsed  gates\n  run_demo1234  task-233   completed     \
    \  1.7m  1 (1.6m)\n```\n\n**The first attempt at that demo wrote seventeen records\
    \ for one gate run, and finding it is the reason it was worth doing.** `pytest`\
    \ inherited the two variables, `tests/test_check_gate.py` exercises `check.main`\
    \ a dozen times over, and each simulated gate appended a real record to the live\
    \ run \u2014 the measurement reading mostly itself. Three fixes, one per door:\
    \ the gate scrubs the pair for every stage it starts; `tests/conftest.py` detaches\
    \ every test from any run, autouse, so a bare `pytest` is covered too; and `DispatchRunner._environment`\
    \ now *grants* a run identity rather than passing on whatever it inherited, which\
    \ also stops a supervising agent filing a child's gate under its own run. My own\
    \ test caught it, and it would not have been caught by any amount of unit testing\
    \ that did not put a real gate inside a real run directory.\n\n## Final state\
    \ of the branch\n\n`perf/task-233-cycle-time`, four commits, worktree `../worktrees/agentjobs-233`:\n\
    \n```\n0358810 fix(dispatch): keep a run's identity from leaking into things that\
    \ are not it\nfc14e97 perf(gate): run pytest across every core, and stop paying\
    \ for coverage\n38b47a8 feat(dispatch): record durably what a run spends its time\
    \ on\n9ad046f fix(tests): make the Python suite safe to run in parallel\n```\n\
    \nGate green on the final commit \u2014 103.6s, ten of ten stages, 2608 tests\
    \ \u2014 and it issued a receipt for `0358810f`, which is the `--since-gate` mechanism\
    \ working on the real repository rather than in a fixture.\n"
