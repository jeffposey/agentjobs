    \ documented, honest about its own value, and not pushed on anybody.\n\n**2. Acceptance\
    \ t6 stays open, and the task stays open with it.** His words: *\"yeah it should\
    \ really be tested... do I like leaving it open while we have to keep finding\
    \ other tasks or epics to test it successfully with? no, but that's probably the\
    \ right move.\"*\n\nHe is right and he is right about disliking it. The alternative\
    \ \u2014 closing on the gate-component measurement and calling it done \u2014\
    \ would mean this task's own headline claim was never checked against the thing\
    \ it is a claim about. So the code merges now and **the record stays open until\
    \ the ledger can answer the question with real runs**, not estimates.\n\nConcretely,\
    \ the remaining work is one command and a judgement:\n\n```bash\npoetry run python\
    \ scripts/run_report.py --since 7\n```\n\nOnce **five or so tasks** have been\
    \ dispatched and worked under the merged configuration, that prints the baseline\
    \ table for the new period plus the gate lines \u2014 gate runs per session, what\
    \ they cost, how much was thrown away on gate runs that failed. Compare against\
    \ the table in this task's spec, write the comparison into the log, mark t6, close.\n\
    \nFive is a floor rather than a target: fewer than that and the median is one\
    \ unusual session. There is no need to *find* tasks for it \u2014 ordinary backlog\
