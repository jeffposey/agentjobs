- id: 7
  ts: '2026-08-21T23:08:29.021476Z'
  actor: claude
  type: decision
  body: "**Part 4 \u2014 every cycle-time lever considered, ranked by measured or\
    \ estimated saving, with the rejected ones named.** This is the entry the spec\
    \ asks to be the deliverable that makes the next pass fast.\n\nMeasurements are\
    \ from this machine, 2026-08-21, using `scripts/check.py`'s own per-stage table\
    \ and `scripts/run_report.py` over `~/.agentjobs/runs/`. Where a figure is estimated\
    \ rather than measured it says so.\n\n## Taken, and measured\n\n| # | Lever |\
    \ Saving | Cost | State |\n|---|---|---|---|---|\n| 1 | **Run pytest across every\
    \ core** (`-n auto`) | **299s per gate run** (342.6s \u2192 43.6s, serial \u2192\
    \ parallel, no coverage) | one dev dependency; two test defects fixed; three environment-leak\
    \ fixes | done |\n| 2 | **Coverage off by default**, `--coverage` to ask for it\
    \ | **60\u2013200s per gate run** (measured twice under different loads; see the\
    \ caveat) | none \u2014 the tooling stays, it is opt-in | done |\n| 3 | **`--since-gate`**,\
    \ the necessity rule | **~45s** on a prose- or task-record-only change (94.5s\
    \ \u2192 50s) | a receipt file, a 2-entry path table, and an exception in ENGINEERING.md\
    \ that must not be widened | done |\n\n**1 and 2 together are the headline: the\
    \ gate is 365s \u2192 94.5s.** Same 2608 tests, pass/fail counts compared on the\
    \ same commit, four consecutive green parallel suites plus five green gates.\n\
    \nThe coverage figure is a range, not a number, and stays a range. Log entry 2\
    \ measured serial-with-coverage at 494s and serial-without at 431s (a 63s delta);\
    \ I measured 540.1s and 342.6s (a 197.5s delta). Both pairs are honest same-machine\
    \ numbers taken under different loads. **The delta is dwarfed by lever 1 and does\
    \ not need resolving to justify the change**, so I did not spend another twenty\
    \ minutes on it. Anyone who wants the real number should measure it on an idle\
    \ machine and correct this entry.\n\n## Not taken here, already filed, and ranked\
    \ above anything left in the gate\n\n| # | Lever | Estimated saving | Task |\n\
    |---|---|---|---|\n| 4 | **Merging after approval costs a second dispatched session**\
    \ | ~2h of the 21h baseline; **~11 min on every task, forever** | [task-234](tasks/agentjobs/task-234.yaml),\
    \ ready, queue position 200 |\n| 5 | **Consolidation \u2014 stop turning a modest\
    \ task into an epic** | task-081 alone was 455 min, **32% of all dispatched time**\
    \ | [task-232](tasks/agentjobs/task-232.yaml) |\n| 6 | **Auth expiry killing long\
    \ runs** | 8 interrupted runs, and duration is the risk factor | [task-224](tasks/agentjobs/task-224.yaml)\
    \ |\n\n**Lever 4 is now the single largest remaining item and it is bigger than\
    \ everything left in the gate.** With the gate at 94.5s, a whole extra dispatched\
    \ session at ~11 minutes costs seven times what a full gate does. If only one\
    \ thing is worked next, it is task-234.\n\n## Rejected, with reasons\n\n- **`--dist\
    \ loadfile` instead of the default distribution.** Measured 54.9s against 43.6s\
    \ \u2014 27% slower \u2014 and it buys per-file isolation the suite does not need,\
    \ because `tests/conftest.py` already isolates every *test*. Reopen only if a\
    \ test appears that genuinely cannot share a worker.\n- **More xdist workers than\
    \ `auto`.** `auto` is 32 here, one per core. Nothing suggests oversubscribing\
    \ helps and it would make the interleaving worse.\n- **Running gate stages concurrently\
    \ with each other.** With pytest at ~50s and the whole frontend block at ~35s,\
    \ the ceiling is about 35 seconds. It would interleave the output of ten stages,\
    \ and it would break `--from`, which is the mechanism that makes a late failure\
    \ cheap. Bad trade at the new prices; it was a better one at the old ones.\n-\
    \ **Reducing what the gate verifies.** Out of scope by Jeff's constraint, and\
    \ it was never where the time was: 89% of the gate was one stage being run badly,\
    \ not the wrong stages being run.\n- **Skipping the ~30s worktree bootstrap per\
    \ child session.** The only way to skip it is to borrow the main clone's virtualenv,\
    \ which runs the child's tests against the wrong source and reports a green suite\
    \ for code it never executed. That is the incident task-194 spent a forensic session\
    \ on. 30 seconds is not worth re-opening it.\n- **Widening the `--since-gate`\
    \ path table.** Candidate entries for `frontend/*` and `assets/*` would each spare\
    \ Black, Ruff and MyPy \u2014 about 2 seconds. A table whose entire risk is being\
    \ wrong should not grow for savings of that size, and one that does is one nobody\
    \ audits. The rule for adding an entry is written into `scripts/gate_scope.py`:\
    \ it must skip a stage measured in minutes, and its docstring must name what reads\
    \ those paths.\n- **`--since-gate` itself, honestly reconsidered.** It was specified\
    \ when a wasted gate cost six minutes; it now saves under a minute, and I would\
    \ not have built it at today's prices. It is kept because the reasoning is the\
    \ durable half \u2014 the gate should be able to state what a change cannot reach\
    \ \u2014 and because it is what makes it safe to add an expensive stage later.\
    \ **If a reviewer wants it dropped, the argument for dropping it is sound and\
    \ I would not fight it.**\n\n## Deliberately still unmeasured, and now cheap to\
    \ measure\n\n- **Concurrent parallel gates.** ENGINEERING.md's old scaling figures\
    \ (two gates +9%, four +16%, six +25%) were measured against the *serial* suite\
    \ and no longer describe anything. `-n auto` asks for every core, so two gates\
    \ now compete for the same 32 rather than each taking a core. **I did not measure\
    \ it and the docs now say so rather than quoting a stale number.** Worth an hour\
    \ when someone has the machine idle.\n- **What share of a run is exploration,\
    \ work, gate and merge.** This was finding 4 and the reason every ranking above\
    \ the gate line is inference. It is now instrumented rather than answered: `phases.jsonl`\
    \ records the gate, and the next round can add phases wherever the next question\
    \ is.\n- **Why eight runs died in a mean four minutes.** Unchanged, and the phase\
    \ records are the tool for it.\n\n## Follow-ups recommended, not filed\n\nI have\
    \ not created tasks for these \u2014 the backlog is Jeff's to grow, and both are\
    \ small enough to fold into existing work:\n\n1. **Re-measure concurrent gates**\
    \ on an idle machine and put the number back in ENGINEERING.md, replacing the\
    \ \"nobody has measured this\" paragraph.\n2. **Produce the end-to-end after-figure**\
    \ once a handful of runs have been dispatched post-merge \u2014 one command, `poetry\
    \ run python scripts/run_report.py --since 7`. See the next log entry.\n"
