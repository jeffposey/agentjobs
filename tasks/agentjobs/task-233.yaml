- id: 21
  ts: '2026-08-23T18:42:14.735656Z'
  actor: claude
  type: decision
  body: "## The before/after is now a command, not a script in a scratch directory\n\
    \nBranch `perf/task-233-cycle-time-measured`, commit `25a13ba`, gate green across\
    \ all\nten stages (279.7s, contended).\n\n**The decision:** produce t6's claim\
    \ through `scripts/run_report.py` rather than\nalongside it. The rejected alternative\
    \ was to state the numbers from a throwaway\nscript and close \u2014 which is\
    \ exactly the hand-assembly finding 4 of this task exists to\nend, and would have\
    \ left the claim unreproducible the moment the scratch file was\ndeleted. The\
    \ first pass at this measurement *was* such a script; it is what showed the\n\
    tool was missing two things.\n\n    poetry run python scripts/run_report.py --driver\
    \ claude --split 2026-08-21T23:24:52+00:00\n\n- **`--split WHEN`** prints the\
    \ table either side of a moment, so the moment can be\n  the merge commit whose\
    \ effect is being claimed. Runs with no start time are declared\n  rather than\
    \ quietly dropped.\n- **`--driver NAME`** narrows to one runner, for the reason\
    \ in the entry above. An\n  absent `driver` key reads as `claude`, which was true\
    \ of every run that predated the\n  Codex path \u2014 and dispatch now writes\
    \ `driver` on every path, so that fallback stops\n  being load-bearing for anything\
    \ dispatched from here on.\n- **The median task prints beside the mean.** Both\
    \ were needed to read this window\n  honestly and only one was there.\n- **Overlapping\
    \ gates are named** rather than left as a percentage over a hundred.\n\n## A limitation\
    \ on t4 that this run demonstrated on itself\n\n`t4` is marked met and the instrumentation\
    \ does work \u2014 every figure in the entry above\ncame out of `phases.jsonl`.\
    \ But **it is collecting from a small minority of runs, and\nthis run is one of\
    \ the ones it missed.** `AGENTJOBS_RUN_ID` and `AGENTJOBS_RUN_DIR`\nare not in\
    \ this session's environment, so the green gate above wrote no phase record\n\
    anywhere.\n\nCorrelated across the whole ledger: **67 of 69 `claude --bg` runs\
    \ have no phase file\nat all**, against 3 of 3 for the Codex path, which spawns\
    \ in-process. The two `--bg`\nexceptions both do carry a correct `run_id` inside\
    \ their records, so nothing is\n*mis*attributed \u2014 the failure is silence,\
    \ not corruption.\n\n**This is already filed as task-249**, in draft, whose title\
    \ names the mechanism\nexactly: `--bg` hands the session to a persistent daemon\
    \ that spawns the worker with\nthe daemon's environment, not the launcher's. It\
    \ is not re-filed here. Two\nconsequences worth carrying into it:\n\n1. The gate\
    \ lines in any report over this period describe **the runs that gated and\n  \
    \ were instrumented**, not all runs. That is why the after-window shows 3 gate\
    \ runs\n   across 2 instrumented runs when far more gates than that were actually\
    \ run.\n2. Fixing task-249 will make the next measurement of this kind much sharper,\
    \ and it\n   is the single highest-value follow-up to this task's part 3.\n\n\
    ## Remaining scope\n\nNone. Every acceptance criterion is now met and the ranked\
    \ list in entry 7 stands\nwith two additions the ledger has since supplied: the\
    \ resumption saving is confirmed\n(follow-on runs 27.4m cold \u2192 10.8m resumed),\
    \ and the scripted finish is confirmed\n(three tasks merged and closed with zero\
    \ dispatched minutes).\n"
