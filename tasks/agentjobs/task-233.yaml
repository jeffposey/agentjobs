  text: The pytest configuration change is made or explicitly rejected, with a measured
    before/after pair on the same commit showing identical pass/fail counts and the
    wall-clock difference.
  status: pending
- id: t2
  text: "If parallelism is adopted, the shared-state audit is recorded \u2014 which\
    \ tests touch the live corpus, fixed ports, or a shared home \u2014 and the suite\
    \ is shown green across at least three consecutive runs, not one."
  status: pending
- id: t3
  text: A gate-necessity rule exists that would have skipped the task-221 worked example
    while still running TestRealCorpus, and its boundary is written into ENGINEERING.md
    as an explicit exception.
  status: pending
- id: t4
  text: A dispatched run records phase boundaries durably enough to reproduce the
    baseline table automatically, without parsing transcript.log.
  status: pending
- id: t5
  text: A decision entry ranks every candidate lever by measured or estimated saving
    against cost, names the rejected ones with reasons, and states which are filed
    as follow-ups.
  status: pending
- id: t6
  text: 'The end-to-end claim is stated as a before/after: what a representative task
    cost in dispatched minutes before this work and after it, using the same measurement
    method as the baseline.'
  status: pending
