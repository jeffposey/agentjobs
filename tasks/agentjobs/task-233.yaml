- id: 6
  ts: '2026-08-21T22:44:12.493711Z'
  actor: claude
  type: progress
  body: "**Parts 1\u20133 built and measured on branch `perf/task-233-cycle-time`\
    \ (worktree `../worktrees/agentjobs-233`).** Everything below is measured on this\
    \ machine, same commit, same suite.\n\n## Part 1 \u2014 the pytest configuration.\
    \ The gate went from 365s to about 95s.\n\nThe earlier measurement in log entry\
    \ 2 was right about the cause and wrong about the size. Sorting the one `frozenset`-derived\
    \ `parametrize` (`tests/test_models_v2.py:257`) was the whole of the first blocker,\
    \ and **the second round of shared-state failures it predicted did not happen**\
    \ \u2014 the suite ran green under `-n auto` on the first attempt after that one\
    \ line.\n\n| Configuration | Wall clock | Result |\n|---|---|---|\n| serial +\
    \ coverage \u2014 **what the gate ran before this** | 540.1s | 2538 passed |\n\
    | serial, no coverage | 342.6s | 2538 passed |\n| `-n auto` (32 workers), no coverage\
    \ | **42.5s / 45.7s / 43.6s** | 2538 passed |\n| `-n auto --dist loadfile` | 54.9s\
    \ | 2538 passed |\n\nIdentical pass/fail counts in every configuration, which\
    \ is the constraint the spec set. `--dist loadfile` was measured and rejected:\
    \ it is 27% slower than the default and buys isolation the suite does not need.\n\
    \nContention caveat, stated because entry 2's numbers disagree with these: entry\
    \ 2 measured 494s/431s for the first two rows against my 540.1s/342.6s. Both pairs\
    \ are honest same-machine numbers taken under different loads. **The coverage\
    \ saving is therefore somewhere between 60s and 200s and I am not going to pretend\
    \ to know it more precisely** \u2014 it is dwarfed by the parallelism and does\
    \ not need to be resolved to justify the change.\n\nWhat landed: `addopts` no\
    \ longer forces coverage on every pytest invocation anywhere; `pytest-xdist ^3.8`\
    \ is a declared dev dependency (previously installed by hand into one venv); `scripts/check.py`\
    \ passes `-n auto`, with `--coverage` and `--serial` as opt-ins. Parallelism is\
    \ in the gate rather than in `addopts` deliberately \u2014 a hand-run `pytest\
    \ -k something` stays serial, because xdist costs more than it saves on a small\
    \ selection and its interleaved output is worse when you are reading one failure.\n\
    \n## The shared-state audit (acceptance t2)\n\nThe suite was already parallel-safe,\
    \ and `tests/conftest.py` is why. Three autouse fixtures: every test gets its\
    \ own project registry under a tmp `AGENTJOBS_HOME`, its own `~/.claude` home,\
    \ and a stubbed reachability probe so nothing makes a real TCP connection. Ports:\
    \ the four places in `tests/` that open a socket all `bind((\"127.0.0.1\", 0))`\
    \ \u2014 no fixed port anywhere in the Python suite. The live corpus: `tests/test_validate.py::TestRealCorpus`\
    \ reads it, but read-only, so concurrent workers do not conflict.\n\n**One genuine\
    \ flake found, and it was not shared state \u2014 it was wall clock.** `tests/test_dispatch_poller.py::TestTheScheduler::test_it_reports_a_change_once_rather_than_every_tick`\
    \ slept a fixed 1.0s and asserted exactly one report had arrived. Each poll spawns\
    \ real processes, so under a machine running the suite on every core the first\
    \ report can land after that second, and the test failed with `repeated itself:\
    \ []` \u2014 having observed nothing at all. Fixed by waiting for the first report\
    \ before timing the quiet period, which is how the sibling test above it already\
    \ worked, plus an assertion that *something* was reported so an empty result can\
    \ never read as a pass. A fixed sleep is safe as an upper bound and unsafe as\
    \ a lower one.\n\n## Part 2 \u2014 the gate-necessity rule, absorbed from task-221\n\
    \n`scripts/check.py --since-gate`, with the derivation in `scripts/gate_scope.py`.\
    \ The design point is that task-221 was right to be worried about erosion, so\
    \ the rule is built so a third party can check it:\n\n1. **It rests on a receipt\
    \ the gate wrote, not on an assertion.** A green unqualified run on a clean tree\
    \ records the commit it verified, in the checkout's git directory (outside the\
    \ work tree, so it is never itself a change to classify). `--since-gate` diffs\
    \ the working tree \u2014 untracked files included \u2014 against that commit.\
    \ No receipt, no narrowing: it runs everything and says why.\n2. **Default-deny.**\
    \ Two path families map to a reduced set: `tasks/**` and prose. Everything else\
    \ selects all ten stages. An incomplete table costs a minute, never a check.\n\
    3. **`tasks/**` maps to `pytest`, not to nothing**, because `TestRealCorpus` reads\
    \ the live corpus. That is the acceptance-t3 property and the one the worked example\
    \ turns on.\n4. **A reduced run prints `NECESSITY RUN`, the commit, every changed\
    \ path with the rule that matched it, and every skipped stage**, and never prints\
    \ \"Ran every stage\". An unchanged tree prints `NOTHING CHANGED` and runs nothing.\
    \ `--only`/`--from` still never earn a receipt.\n\nThe worked example is a test:\
    \ a receipt, then a commit that adds one task record, resolves to `[\"pytest\"\
    ]`.\n\n**Honest assessment: this is worth far less than when task-221 was written**,\
    \ because the full gate is now ~95s rather than ~365s. I kept it because the reasoning\
    \ is durable and because it is what makes it safe to add an expensive stage later,\
    \ but if a reviewer wants it dropped the argument is defensible and I would not\
    \ fight it.\n\n## Part 3 \u2014 instrumentation\n\n`src/agentjobs/dispatch/phases.py`\
    \ writes one JSON object per line to `phases.jsonl` in the run's own directory,\
    \ beside `meta.yaml`. No service, no database. Dispatch puts `AGENTJOBS_RUN_ID`\
    \ and `AGENTJOBS_RUN_DIR` into the spawned session's environment (both spawn sites;\
    \ the polling helpers deliberately do not get them), so any child of the agent\
    \ inherits them. `scripts/check.py` records `gate_started`/`gate_finished` with\
    \ scope, duration, pass/fail and the failing stage \u2014 unconditionally, because\
    \ `record_phase_from_env` writes nothing outside a run, so a developer running\
    \ the gate by hand is not measured. Every failure path is swallowed: instrumentation\
    \ that can break the run it measures is worse than none.\n\n`scripts/run_report.py`\
    \ reads the ledger and reproduces the baseline table automatically. Against the\
    \ live ledger just now, without touching `transcript.log`:\n\n```\n  runs    \
    \              54 (2 cancelled, 43 completed, 8 interrupted, 1 running)\n  total\
    \ run time        23.5h\n  distinct tasks        26\n  runs per task         2.08\n\
    \  run length            p50 16.4m, p75 32.2m, p90 52.7m, max 231.6m\n```\n\n\
    `--per-task` puts task-081 at the top with 455.3m, 32.3% of everything \u2014\
    \ finding 2 of this task, now a command rather than an afternoon.\n\n## Verification\
    \ so far\n\n- `mypy`, `black`, `ruff`, `oxlint`, `api`, `icons` green.\n- 94 new\
    \ tests across `tests/test_gate_scope.py`, `tests/test_run_phases.py` and additions\
    \ to `tests/test_check_gate.py`.\n- Two real defects the gate caught in its own\
    \ new code, both fixed: a receipt being issued during tests that stub `subprocess.run`\
    \ (which would have written a false receipt for this repository \u2014 a soundness\
    \ hole dug by the test suite, in the one feature whose point is that its evidence\
    \ is real), and the poller flake above.\n- A four-run soak plus a full gate is\
    \ running now; parts 4 and 6 (the ranked lever list, and the before/after statement)\
    \ follow it.\n"
