ball_prompt: "Review `perf/task-233-cycle-time` (4 commits, worktree ../worktrees/agentjobs-233).\
  \ **The gate is 365s -> 94.5s**, same 2608 tests, pass/fail counts compared on the\
  \ same commit; final gate green at 103.6s on the tip.\n\nThree things I want a decision\
  \ on, not just approval:\n\n1. **`--since-gate` (part 2, from task-221) may not\
  \ be worth keeping.** It was specced when a wasted gate cost six minutes; it now\
  \ saves under a minute. I built it because the acceptance asked for it and because\
  \ the reasoning is durable, but if you want it dropped the argument for dropping\
  \ it is sound and I would not fight it. Dropping it means reverting parts of `scripts/check.py`\
  \ and deleting `scripts/gate_scope.py`, `tests/test_gate_scope.py` and one ENGINEERING.md\
  \ section \u2014 the other three commits are independent.\n\n2. **Acceptance t6\
  \ is marked pending, deliberately.** The end-to-end per-run figure needs runs dispatched\
  \ under the new configuration and none exist yet. I have the measured gate before/after\
  \ and this session's own 10.0min-vs-42.6min accounting, and I declined to invent\
  \ the \"gate runs per session\" multiplier that a full estimate needs \u2014 that\
  \ unknown was finding 4 of this task. Either accept t6 as satisfied by the measured\
  \ half, or leave it open until `run_report.py --since 7` can answer it a few runs\
  \ from now. Your call.\n\n3. **The ranked list (log entry 7) says task-234 is now\
  \ the biggest remaining lever** \u2014 a whole extra dispatched session per task,\
  \ ~11 minutes, against a gate that is now 94.5s. If one thing is worked next, that\
  \ is my recommendation.\n\nNothing needs looking at in a browser: no UI changed.\
  \ To see it yourself, from the worktree: `poetry run python scripts/check.py` (~95s),\
  \ then `--since-gate` again immediately, which should say NOTHING CHANGED and run\
  \ nothing. `poetry run python scripts/run_report.py --per-task` prints the baseline\
  \ table straight off the ledger.\n\nOn approval I rebase onto main, merge --no-ff,\
  \ mark the branch merged, close the task and remove the worktree. No frontend rebuild\
  \ needed."
