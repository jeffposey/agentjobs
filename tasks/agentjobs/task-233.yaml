- id: 20
  ts: '2026-08-23T18:28:40.172812Z'
  actor: claude
  type: progress
  body: "## t6: the end-to-end before/after, measured 2026-08-23\n\nThe hold was released\
    \ because \"there should have been enough tasks dispatched by now.\"\nThere are.\
    \ The ledger now holds **87 runs**, up from the 52 the baseline was built on.\n\
    The cut is the merge commit `a8686df`, **2026-08-21T23:24:52Z** \u2014 every run\
    \ started\nbefore it is *before*, every run started after it is *after*. Same\
    \ method as the\nbaseline: `meta.yaml` start/finish out of `~/.agentjobs/runs/`,\
    \ read through\n`scripts/run_report.py`'s own loader, no transcript parsing.\n\
    \n### The window has to be split by driver, and that is not a dodge\n\n**Every\
    \ run in the before window is `driver: claude`. Seventeen of the thirty-three\n\
    after it are `driver: codex`** \u2014 a runner that did not exist when the baseline\
    \ was\ntaken, being brought up under task-248 and task-285 in this very window.\
    \ Its runs are\ndominated by startup failures: `Codex App Server thread/start\
    \ failed`, `required MCP\nserver 'agentjobs' is not ready`, and eleven runs under\
    \ two minutes that never reached\nan agent. Two tasks account for all seventeen,\
    \ at **8.5 runs per task**.\n\nLeft in, they drag the after window's run-length\
    \ p50 to 2.5m and push runs-per-task\n*up* to 2.82, and both numbers are artefacts\
    \ of a driver bring-up rather than facts\nabout cycle time. Taken out, the comparison\
    \ is claude-driver against claude-driver.\nBoth cuts are given below; the second\
    \ is the one that answers t6.\n\n### The comparison\n\n| | before (to 2026-08-21\
    \ 23:24) | after, all drivers | after, claude driver |\n|---|---|---|---|\n| runs\
    \ with durations | 54 | 31 | 15 |\n| distinct tasks | 26 | 11 | 9 |\n| total dispatched\
    \ time | 24.6h | 5.6h | 4.8h |\n| **median task** | **45.6m** | 14.1m | **9.5m**\
    \ |\n| mean task | 56.7m | 30.3m | 31.7m |\n| **runs per task** | **2.08** | 2.82\
    \ | **1.67** |\n| run length p50 | 17.1m | 2.5m | 10.4m |\n| run length p90 |\
    \ 56.8m | 18.3m | 54.4m |\n\n**A representative task went from 45.6 dispatched\
    \ minutes to 9.5 \u2014 a factor of 4.8.**\nThe mean moved much less, 56.7m to\
    \ 31.7m, and the reason is visible in the per-task\nlist: task-241 cost 134.9m\
    \ building the scripted finish and task-234 cost 67.9m\nbuilding session resumption.\
    \ Those are two feature builds in a nine-task sample, and\nthey are exactly the\
    \ sort of thing the baseline's own mean was distorted by \u2014 the\nbaseline's\
    \ mean drops from 56.7m to 40.7m when task-081's epic is removed. The median\n\
    is the honest statistic at this sample size and it is the one quoted.\n\n### Three\
    \ tasks cost zero dispatched minutes and do not appear above at all\n\ntask-214,\
    \ task-215 and task-219 were rebased, gated, merged `--no-ff`, rebuilt,\nrestarted,\
    \ verified and closed by **scripted finishes** with no agent anywhere in\nthem:\
    \ `fin_d2481ca3` 3.4m, `fin_e26effae` 3.0m, `fin_4c205d56` 3.0m. They are absent\n\
    from the runs ledger because no run happened, which is the point. Nine finishes\
    \ have\nrun so far \u2014 3 finished, 3 escalated (2 rebase conflicts, 1 red gate),\
    \ 3 declined as\nnever-candidates \u2014 and nothing was merged that a human had\
    \ not approved.\n\n### Attribution: which of the three changes did what\n\nThe\
    \ window contains three landings, not one, and the ledger separates them.\n\n\
    **The gate (this task).** Every full passing gate the phase records have caught,\
    \ in\nthe wild: 125s, 141s, 155s, 157s, 174s \u2014 **median about 155s against\
    \ the 365s\n`ENGINEERING.md` measured before**. The documented 95.8s is a quiet-machine\
    \ best case;\n155s is what a dispatched session actually pays. Roughly 2.4x on\
    \ the real figure.\n\n**Resumption (task-234).** Follow-on runs \u2014 the second\
    \ and later run on a task \u2014 are\nwhere this shows, and it is unambiguous:\n\
    \n| | count | mean |\n|---|---|---|\n| before, all cold | 28 | **27.4m** |\n|\
    \ after, cold | 3 | 28.2m |\n| after, resumed | 4 | **10.8m** |\n\nCold follow-on\
    \ runs did *not* get shorter (27.4m \u2192 28.2m). Resumed ones are 10.8m.\nSo\
    \ the follow-on saving is resumption's, not the gate's, and the gate's saving\
    \ is\nspread thinly across every run instead.\n\n**The scripted finish (task-241).**\
    \ The three zero-run closes above, replacing a\nfollow-on run whose before-window\
    \ mean was 27.4m.\n\n### A measurement nobody had: three concurrent gates\n\n\
    `ENGINEERING.md` says outright that the contended cost of the parallel gate is\
    \ unknown\nand must be measured before it is quoted. `run_4063f1c0` measured it\
    \ by accident. Its\nphase records show **three gates started 03:27:10, 03:27:50\
    \ and 03:29:03 and all still\nrunning at 03:33** \u2014 one session with three\
    \ overlapping `check.py` invocations, each\nasking `-n auto` for all 32 cores:\n\
    \n    gate  342.3s  partial  failed at pytest\n    gate  384.0s  full     failed\
    \ at pytest\n    gate  361.5s  full     passed\n\n**Three concurrent parallel\
    \ gates cost 342-384s each, versus 95.8s alone and ~155s\nunder ordinary load.**\
    \ Fifteen minutes of a 14-minute run, which is how the report can\nshow gate time\
    \ exceeding run time \u2014 the phase records are right and the gates\noverlapped.\
    \ That is a real number for a line ENGINEERING.md currently leaves blank,\nand\
    \ it is worth writing down: the parallel gate does not degrade gracefully under\n\
    self-contention the way the serial one did (388s/411s/444s at 2/4/6).\n\n### What\
    \ is not claimed\n\n- Nine tasks is a small sample and the median is the statistic\
    \ that survives it. Two\n  of the nine were feature builds of the very machinery\
    \ being measured.\n- The codex driver's failure rate is real and is being worked\
    \ in task-248/task-285.\n  It is excluded here as a different question, not because\
    \ it is convenient.\n- Only 5 of 33 after-window runs carry gate phase records.\
    \ Runs that never invoked\n  `check.py` \u2014 task-record work, escalations,\
    \ crashed codex startups \u2014 correctly have\n  none, so the gate lines describe\
    \ the runs that gated, not all runs.\n"
