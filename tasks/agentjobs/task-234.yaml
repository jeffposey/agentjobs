id: task-234
title: Merging after approval costs a whole second agent session, about eleven minutes,
  on every task
created: '2026-08-21T20:43:16.534300Z'
updated: '2026-08-21T23:40:06.148407Z'
lifecycle: active
ball: human
ball_reason: input
ball_prompt: "Dispatched session `0fa21703` stopped on an expired login at 2026-08-21T23:39:59.562000+00:00\
  \ and will not resume by itself. It said: \"Login expired \xB7 Please run /login\"\
  .\n\n**Run `claude auth login` in a terminal on that machine.** Answering inside\
  \ the session cannot work: Claude Code's background auth daemon has already discarded\
  \ the credential, so anything sent to the session is retried against a token that\
  \ no longer exists and fails instantly.\n\nThen send the session a message to wake\
  \ it, or attach with `claude attach 0fa21703`. It resumes in place -- nothing is\
  \ lost and this task does not need re-dispatching."
