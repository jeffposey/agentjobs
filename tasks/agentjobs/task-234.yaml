- id: 5
  ts: '2026-08-21T21:01:09.814175Z'
  actor: claude
  type: progress
  body: "**The mechanism Jeff's instruction was conditional on is verified. Stop-then-wake-with-a-prompt\
    \ works, and the woken session keeps its context.** Tested 2026-08-21 on a throwaway\
    \ session, not on a real run.\n\n## The experiment\n\nA background session was\
    \ started in a scratch directory, allowed to complete one turn, stopped, and then\
    \ resumed headlessly with a *different* prompt that could only be answered from\
    \ its prior conversation.\n\n```\n1. claude --bg \"Reply with exactly ALPHA-SENTINEL-77\
    \ and nothing else. Do not use any tools.\"\n   -> backgrounded, id aa31bb7a\n\
    \   -> ran the prompt; its output shows ALPHA-SENTINEL-77\n\n2. claude agents\
    \ --json --all\n   -> \"id\": \"aa31bb7a\", \"sessionId\": \"aa31bb7a-7224-41d3-a6b4-068f68ce5ed0\"\
    \n      (the short id is the UUID's first field, not a separate namespace)\n\n\
    3. claude stop aa31bb7a\n   -> stopped aa31bb7a\n\n4. claude -r aa31bb7a-7224-41d3-a6b4-068f68ce5ed0\
    \ -p \"What sentinel string did you just reply with? Answer in one line.\"\n \
    \  -> ALPHA-SENTINEL-77\n```\n\nStep 4 is the result that matters. The session\
    \ was **stopped**, and it answered from the conversation it had before being stopped.\
    \ A cold agent could not have answered that question at all.\n\nSo the full shape\
    \ Jeff described is available with the tools already on this machine:\n\n- **Ball\
    \ moves to human** \u2192 `claude stop <session_id>`. The ledger already has the\
    \ code for this: `DispatchLedger._stop_session` ([ledger.py:686](src/agentjobs/dispatch/ledger.py:686))\
    \ calls exactly this command, and its docstring already states the reason \u2014\
    \ going around the session manager with a pid \"would lose the conversation that\
    \ `stop` preserves.\"\n- **Human approves or requests changes** \u2192 `claude\
    \ -r <sessionId> -p \"<the approval or the feedback>\"`, which wakes the same\
    \ agent with its own context and hands it the next instruction.\n\n## Three practical\
    \ notes for whoever builds it\n\n1. **Use the full UUID, not the short id.** `-r\
    \ aa31bb7a` was not tried; `agents --json --all` gives `sessionId` and that is\
    \ what worked.\n2. **Redirect stdin.** Step 4 printed `Warning: no stdin data\
    \ received in 3s, proceeding without it.` and stalled three seconds before running.\
    \ A server calling this must pass `< /dev/null` (or the subprocess equivalent,\
    \ `stdin=DEVNULL`) or every wake-up costs a needless three seconds and risks blocking\
    \ on a pipe that never closes.\n3. **The reaper is the thing that would break\
    \ this.** `reap()` calls `claude rm`, which deletes the conversation \u2014 an\
    \ earlier entry has the detail. A run whose task is sitting at `human` must not\
    \ be reaped, or there is nothing left to wake. That is the one change without\
    \ which the rest cannot work.\n\n## A false negative, recorded so nobody repeats\
    \ it\n\nThe first attempt reported `No conversation found with session ID`, which\
    \ looks like a refutation and is not. That session had been started with `--remote-control`\
    \ and came up **idle** \u2014 the CLI printed `idle \u2014 send a prompt to start`\
    \ and the positional prompt was never delivered, so the session had no conversation\
    \ to resume. Resume was correctly reporting an empty session.\n\n**This matters\
