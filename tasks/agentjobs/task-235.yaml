  type: progress
  body: "**Entry 14's `no_eligible_child` is real but it is not what it sounds like:\
    \ nothing is blocked and the epic is healthy. Correcting the record before the\
    \ misreading sets.**\n\n## What happened\n\n1. 07:27 \u2014 the walk started and\
    \ dispatched task-237 as `run_b34f8216`.\n2. ~08:05 \u2014 **the walk process\
    \ itself was killed**, about 38 minutes in. Not by me, and not by anything on\
    \ the task: the supervisor process died while its child kept running. task-237\
    \ was unaffected \u2014 it is a separate detached session, and at 08:06 it was\
    \ live, iterating `scripts/check.py --only e2e` (three partial gate runs recorded\
    \ in its `phases.jsonl`, latest started 08:03:44).\n3. 08:07 \u2014 I relaunched\
    \ the walk. It reported `no_eligible_child` and handed this parent to `human`/`decision`.\n\
    \n## Why the relaunch stopped, and why it is not a blockage\n\n**A walk watches\
    \ only the children it started itself. It cannot adopt one already in flight.**\
    \ On the relaunch, task-237 was `active` and claimed, so it fell into the \"already\
    \ claimed\" arm of the eligibility test and the walk correctly concluded it had\
    \ nothing to start \u2014 then reported that as a stop condition. task-238 and\
    \ task-239 need task-237, task-356 needs task-238, task-240 needs all three. So\
    \ every child was genuinely unclaimable *at that instant*, and none of it means\
    \ anything is wrong.\n\nEntry 15's prompt \u2014 \"read that child's record, decide\
    \ what it needs\" \u2014 is written for the case where a child stopped dirty.\
    \ No child stopped. There is nothing for a human to decide here.\n\n## What this\
    \ actually costs, and the correct recovery\n\n**The walk is not resumable, so\
    \ a killed walk leaves an epic unsupervised with a live child still running.**\
    \ Its own stop message names the recovery \u2014 *\"restart the walk when it is\
    \ resolved\"* \u2014 so the sanctioned pattern is: let the in-flight child land,\
    \ then relaunch the walk, which re-reads the attempt count off each child's log\
    \ so nothing is double-spent. That is what I am doing, one child at a time. The\
    \ cost of the kill is therefore serialisation, not lost work: task-238 and task-239\
    \ are independent of each other and the original walk would have flown them together,\
    \ whereas each relaunch can only start what is claimable at that moment.\n\nI\
    \ relaunched it this time **detached from the harness's background-job supervision**\
    \ (`Start-Process`, PID recorded) rather than as a managed background job, on\
    \ the theory that whatever reaped the first one was reaping a job rather than\
    \ a process. Untested \u2014 it stopped for the unrelated reason above before\
    \ it could prove anything either way.\n\n## Taking the ball back\n\nI am the supervisor\
    \ and I am awake, so the ball returns to `agent`/`work`. A persistent watch is\
    \ armed on task-237's record \u2014 it fires on `closed`, on the ball reaching\
    \ `human` or `external`, **and** on its run transcript going quiet for 25 minutes,\
    \ so a dead child is not mistaken for a working one. When it lands `completed`\
    \ I relaunch the walk for task-238 and task-239.\n\n**Unchanged from entry 13:\
    \ task-240 is a human gate by construction** and no posture can satisfy ac-4 or\
    \ ac-6."
