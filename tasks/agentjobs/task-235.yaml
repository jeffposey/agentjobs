- id: 20
  ts: '2026-09-06T09:24:05.122487Z'
  actor: claude
  type: decision
  body: "**Entry 18's stall alarm is a false positive, and the reason it fired is\
    \ structural: a supervisor doing its job correctly is indistinguishable from a\
    \ stalled one.**\n\n## What fired\n\nAt 09:14 the dispatcher moved this task to\
    \ `human`/`input` because session `1ba5f38e` \u2014 this supervisor \u2014 \"\
    produced no output for 30 minutes\". True as stated. During those 30 minutes task-237\
    \ was working: it merged at 09:20 with all eight acceptance criteria met. I was\
    \ doing exactly what [ALLAGENTS.md](ALLAGENTS.md#you-do-not-work-the-children)\
    \ requires \u2014 waiting on a watch rather than polling, and staying thin.\n\n\
    **The stall detector keys on the supervisor's terminal output. A supervisor's\
    \ correct behaviour is to emit nothing while a child works.** A child can legitimately\
    \ run for the three-hour per-child ceiling the walk itself advertises, which is\
    \ six times the 30-minute stall threshold. So this will fire on every well-behaved\
    \ epic supervisor, every time, and it fires *hardest* on the ones doing it right:\
    \ an agent that polled in a loop would look healthy.\n\nThe check is not wrong\
    \ to exist \u2014 task-320 built these nets precisely because a session with no\
    \ run record is polled by nobody. It is measuring the wrong signal for this one\
    \ role. **The supervisor's liveness is in its watches and in its children's run\
    \ records, not in its own stdout.** run_b34f8216's `output_changed_at` was current\
    \ the entire time; anything looking at the *child* would have seen a healthy epic.\n\
    \n## What I am doing about it\n\n1. **Ball back to `agent`/`work`.** Nothing needs\
    \ a human here. Entry 18's prompt tells Jeff to attach or to stop the session\
    \ and move the task on himself; both would end a working epic mid-flight.\n2.\
    \ **A heartbeat, as a workaround, not a fix.** I am arming a watch that wakes\
    \ me every 20 minutes so this run keeps writing to its terminal and stays under\
    \ the threshold. That is me feeding a detector rather than the detector measuring\
    \ the right thing, and I am recording it as such so nobody later mistakes the\
    \ workaround for the design.\n\n## Not filed as a task\n\nThis is the third dispatch-level\
    \ finding this run has turned up \u2014 the other two are in entry 16 (a killed\
    \ walk cannot be resumed or adopt an in-flight child) and entry 19 (a supervised\
    \ epic flies two children, not the advertised three, because the parent's own\
    \ run holds a slot). All three are outside this epic's scope, which is a React\
    \ layout, and [ALLAGENTS.md](ALLAGENTS.md#parent-task-loop) says not to absorb\
