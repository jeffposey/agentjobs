  - path: tasks/agentjobs/task-093-mobile-and-pwa.yaml
    why: The portrait behaviour that must not regress, and the breakpoint reasoning
      already used in this app.
  - path: tasks/agentjobs/task-168-menu-shell.yaml
    why: The burger-menu task this epic overlaps with on navigation.
