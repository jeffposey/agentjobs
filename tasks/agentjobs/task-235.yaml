  body: "**Binding, from Jeff, 2026-08-22. Do not relitigate.** This settles what\
    \ task-236 was created to ask, so task-236 shrinks to the two questions left open\
    \ (below).\n\n**The decision.** The Tasks page gets a sidebar of tasks, with collapsible\
    \ children, and the task detail in the main panel. The Dashboard does not get\
    \ a sidebar. Neither do Create or Dispatch.\n\n**What that means precisely, spelled\
    \ out because the phrase admits more than one reading:**\n\n1. **The sidebar is\
    \ the task list, not a navigation rail.** The left column holds task rows you\
    \ select from. It is the shape Claude's own app uses for conversations, not the\
    \ shape Gmail uses for folders.\n2. **The tree collapses.** `queueOrder.ts` already\
    \ groups children under parents and `TaskList.tsx:481` already indents by `depth`;\
    \ what is missing is a disclosure control per parent and collapse state that survives\
    \ a refetch. In a 320-400px column this is not a nicety \u2014 an epic with nine\
    \ children (task-137) otherwise buries everything after it.\n3. **It is per-surface,\
    \ not a global spine.** This is the substantive half of Jeff's second message\
    \ and the reason the Dashboard is excluded. Gmail, Slack, Discord and Claude all\
    \ keep their sidebar on every screen because it is *navigation*. Ours is a *master\
    \ column over tasks*, so it belongs only where tasks are the subject: redundant\
    \ on the Dashboard, which is already a view over tasks, and irrelevant on Dispatch\
    \ settings.\n4. **The header nav stays** and remains the way you move between\
    \ Dashboard, Tasks, Create and Dispatch. A per-surface master column does not\
    \ replace it. This is also why the epic stays cheap \u2014 no rail, no third pane,\
    \ no new navigation system.\n5. **Dashboard \u2192 task lands in the Tasks surface\
    \ with that task selected**, not on a detail-only page. Otherwise clicking a task\
    \ from the dashboard drops you somewhere with no list, which is the defect this\
    \ epic exists to remove.\n\n**Rejected: a global navigation rail (the three-pane\
    \ Gmail/Slack shape).** It scales better to future surfaces \u2014 analytics from\
    \ task-212, playbooks from task-211, runs from task-023 \u2014 and it is what\
    \ four of the five apps Jeff named actually do. It was rejected because those\
    \ apps have five to fifty destinations and we have four, so a permanent 60px column\
    \ would spend width to duplicate a header that already works; and because the\
    \ sidebar we actually want is a *list*, which a rail does not remove the need\
    \ for. **What would make this wrong:** enough top-level surfaces that the header\
    \ nav wraps, or a second list (playbooks, runs) that wants the same treatment.\
    \ Either is a reason to reopen this, not to quietly build a rail inside a later\
    \ child.\n\n**Still open, and still task-236's job:** the breakpoint (width, orientation,\
    \ or both, and what a 1024px landscape tablet gets), and whether task-168's burger\
    \ menu collides with any of this \u2014 less sharply now that the sidebar is per-surface,\
    \ but it needs a stated answer recorded on task-168 as well."
