  - path: frontend/src/components/QueueBroken.tsx
    why: The other banner with the same dependency on the old shell.
  - path: frontend/src/components/Dashboard.tsx
    why: Where the link into the Tasks surface comes from; it must land with the task
      selected.
  - path: frontend/src/App.network.test.tsx
    why: Shell-level tests that will need updating rather than deleting.
