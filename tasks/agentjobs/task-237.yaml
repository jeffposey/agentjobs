- id: 10
  ts: '2026-09-06T08:53:13.192327Z'
  actor: claude
  type: decision
  body: "**The empty region gets a prompt, not content. ac-6's decision entry.**\n\
    \n`/tasks` with nothing selected renders a card headed \"No task selected\" saying\
    \ that choosing a task fills this region and that the list stays where it is,\
    \ plus a link to file a new task.\n\n**Why a prompt.** The one thing a reader\
    \ landing here does not know is that this region is now *theirs* \u2014 that clicking\
    \ fills it rather than replacing the page, which is exactly the behaviour this\
    \ epic exists to introduce. That has to be said once, and a panel of content would\
    \ answer a question nobody asked while hiding the one thing they need to be told.\n\
    \n**Rejected: rendering the queue's next task.** It was the most attractive option\
    \ and it is wrong here for three separate reasons. The Dashboard's next-up panel\
    \ already answers \"what should I work on\", and two surfaces naming different\
    \ tasks is precisely how they drift apart. It would add a query to a region whose\
    \ entire job is to be replaced by the first click. And it invites a reader to\
    \ act on a recommendation shown in the place where a *record* is about to appear,\
    \ which is a different kind of thing.\n\n**Rejected: a project summary or counts.**\
    \ task-212 is moving counts off the Dashboard onto a page of their own; putting\
    \ them here would be building the surface that task is about to design, in the\
    \ one place guaranteed to be covered up.\n\n**Reopen this if** task-239 finds\
    \ the prompt is dead weight once the detail panel is fitted \u2014 a reader who\
    \ has selected a task once never sees it again in that session, so its whole value\
    \ is in the first visit and that is worth measuring rather than assuming.\n"
  data:
    operation:
      id: 9d4e0b62-1f57-4a83-92c6-6ea15b30d7f4
      kind: log_append
      fingerprint: dc8d01bc19b6955e260af19232d8bb64
- id: 11
  ts: '2026-09-06T08:53:33.460075Z'
  actor: claude
  type: decision
  body: "**The list restacks into cards on a container query, and that is a scope\
    \ call, not a style one.**\n\nThe spec said the panes hold the components they\
    \ already hold and that cramped is expected. Cramped was not what happened: the\
    \ six-column table's flexible Task column got **zero pixels** in a 413px region,\
    \ so the list was a column of blank rows with every title unclickable. That is\
    \ not a thing to hand to task-238 \u2014 it is the surface not working.\n\n**Chosen:**\
    \ the existing narrow-viewport card strategy, re-asked of the table's own box\
    \ (`@container`, opted into by `stackWhenNarrow`). task-235's own context note\
    \ pointed here \u2014 \"`ResponsiveTable.tsx` ... the sidebar is a narrow viewport\
    \ by another name\" \u2014 and it needs no new design, so it is the smallest change\
    \ that leaves the surface usable.\n\n**Rejected: leaving the table to scroll horizontally\
    \ inside the region.** Six columns behind a scrollbar nobody looks for, in a 413px\
    \ column, is worse than the blank rows it replaces.\n\n**Rejected: making the\
    \ list region wide enough for the table (~700px).** At 1280 that leaves 490px\
    \ for the record, which inverts master and detail; and at the 840px window the\
    \ density spec exercises, no split can hold a 700px table and a record at once.\
    \ It fails at exactly the width it was supposed to rescue.\n\n**Rejected: shrinking\
    \ or hiding columns in the narrow region.** That is the right answer and it is\
    \ task-238's \u2014 \"the narrow-column row\" is that task by name. Doing it here\
    \ would be designing the row while claiming to be moving it.\n\n**Rejected: converting\
    \ the shared viewport rule for every table.** A full-width table in an 830px window\
    \ has a ~780px box, so switching them all over would restack tables that fit today.\
    \ The opt-in costs ~35 duplicated declarations in `styles.css`; a media query\
    \ and a container query cannot be combined into one rule, and the alternatives\
    \ (a class toggled from React, a custom property per declaration) both put the\
    \ answer somewhere a reader of that file cannot see it.\n\n**What this leaves\
    \ task-238:** a 331px card per task. Two tasks fit the region. The row is the\
    \ whole of that task's remaining job and the numbers are in the progress entry\
    \ above.\n\n---\n\n**Also landed here, and it is not scope creep:** `docs/tasks-shell.md`,\
    \ linked from `docs/index.md`. task-236's ac-4 asked for one page the building\
    \ children could read and its close entry parked the writing on this task, being\
    \ the first child to take a worktree. The decided shape had ended up spread across\
    \ task-235 log entries 3, 8 and 9 written weeks apart \u2014 the exact fragmentation\
    \ ac-4 existed to prevent \u2014 so the page supersedes all three and says so.\n"
