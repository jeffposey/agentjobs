- id: 9
  ts: '2026-09-06T08:53:00.917247Z'
  actor: claude
  type: progress
  body: "**Built, gated green, and looked at in a browser.** Branch `feat/task-237-two-region-tasks-shell`,\
    \ six commits, rebased onto `main` at `239d2dc` and gated once on the result:\
    \ `scripts/check.py`, all ten stages, exit 0, receipt written for `04b99dbc`,\
    \ 468s.\n\n## What it does\n\n`tasks` is now a layout route rendering the list\
    \ region plus an `<Outlet />`, with `:taskId` as its child. `tasks/new` stays\
    \ a sibling and still wins on route ranking, since a static segment outscores\
    \ a dynamic one. A deep-linked `/p/{project}/tasks/{taskId}` therefore arrives\
    \ with both panes, and selecting another task changes only the right-hand one.\n\
    \nWhich shell a viewport gets comes from `frontend/src/components/shellLayout.ts`,\
    \ holding task-235 entry 9's rule as `(min-width: 600px) and (min-height: 600px)`\
    \ and a `useSyncExternalStore` hook over `matchMedia`. `useSyncExternalStore`\
    \ rather than an effect because the first paint has to be right: reading the query\
    \ in an effect renders the wrong shell once and corrects it, which on a phone\
    \ means mounting, fetching and unmounting the whole task list before the reader\
    \ sees the record they asked for.\n\n## Measured, in Chromium, against this repository's\
    \ own 125-task corpus\n\nAt 1278x1185 on `/p/agentjobs/tasks/task-237`: list region\
    \ **413px**, detail region **777px**, page scroll room **0**, horizontal overflow\
    \ **0** on the document and **0** inside the list.\n\nThat last figure took two\
    \ fixes, both found by looking rather than by a test.\n\n## Three things the geometry\
    \ forced, none of them in the spec\n\n1. **The list cannot render the six-column\
    \ table.** `table-layout: fixed` gives its one flexible column whatever the fixed\
    \ ones leave, and five fixed columns asking for 39.5rem leave a 413px region nothing\
    \ at all \u2014 so the task title collapsed to **zero pixels**, Chromium reported\
    \ every such cell as `hidden`, and eight e2e specs that click a task by its title\
    \ failed at once while the page still looked populated. The list now restacks\
    \ into cards on a **container query** (`stackWhenNarrow` on `ResponsiveTable`),\
    \ opted into by the task list alone. Threshold 771px, not 819px: that is the viewport\
    \ rule's 819 minus the shell's own `sm:px-6` padding, so the boundary for a full-width\
    \ list is exactly where it was.\n2. **The drag auto-scroll had to follow the list\
    \ into its region.** `startDragAutoScroll` used `window.scrollBy`, which is a\
    \ silent no-op the moment the document stops being the scroller. It now takes\
    \ an element, finds the scrollable box around it, and measures the edge zones\
    \ from that box's rectangle \u2014 falling back to the window in the stacked shell,\
    \ which is what it always did. This is also what removes task-294's stated reason\
    \ for not framing this surface.\n3. **The filter row keyed off the viewport too.**\
    \ Four controls with a combined minimum of 43rem, asked \"does the window have\
    \ room for one line\", said yes inside a 413px region and hung a horizontal scrollbar\
    \ off the whole list. `@container` on the filter section; task-356 deletes the\
    \ row entirely.\n\nPlus one that only became visible once the regions existed:\
    \ `StatusCard` demanded a screen's worth of height inside a region exactly one\
    \ screen tall, so every arrival on the Tasks surface put a scrollbar on both regions\
    \ until the queries answered. `min-h-full`, top-aligned.\n\n## Tests\n\n92 Playwright\
    \ and 460 vitest, all green. New: `frontend/src/App.shell.test.tsx` (8 cases over\
    \ the composition \u2014 both panes, the empty state, the Dashboard click, the\
    \ banners' placement, and the phone shell) and `frontend/e2e/tasks-shell.spec.ts`\
    \ (4 cases over the half jsdom cannot make \u2014 measured boxes side by side,\
    \ a page with nowhere to scroll, a record scrolled without moving the list, a\
    \ phone that still scrolls its document).\n\n`src/test/viewport.ts` is new and\
    \ is what makes \"a jsdom test at a phone viewport\" a thing this repository can\
    \ say: jsdom ships no `matchMedia`, so it installs one answering from `window.innerWidth`/`innerHeight`.\n\
    \nUpdated rather than deleted: the two banner assertions moved from `TaskList.test.tsx`\
    \ to the shell test, where the banners now live. The density spec's three table-form\
    \ cases ask for a full-width list at a *short* window \u2014 which the device-class\
    \ rule treats as a phone \u2014 and a fourth case covers the region, asserting\
    \ the task title has a box at all. Both drag specs filter the list to their own\
    \ rows: a seeded pair that sat 677px apart now sits 2794px apart, which no raw-mouse\
    \ drag can span. `scrollToEnd` in `pinned-header.spec.ts` falls through to the\
    \ tallest scrollport when the document has none.\n\nThree tests were waiting on\
    \ the header rather than on the record and so were measuring a page whose content\
    \ had not arrived. That passed only because the loading card gave an empty page\
    \ somewhere to scroll; removing that height made the gap measurable. They now\
    \ wait for the record.\n\n## What it looks like, honestly\n\nThe list row is **331px**\
    \ as a card and the filter block **308px**, so two tasks fit a 1035px region.\
    \ That is the state this task hands to task-356 (the filter behind a button) and\
    \ task-238 (the row a narrow column deserves), and it is what \"the panes can\
    \ hold the components they already hold\" costs. It is still a large improvement\
    \ on the alternative, which was a column of blank rows.\n\nNot evidence for: drag-to-reorder\
    \ and Alt+Up/Alt+Down under a person's hand. Playwright drives Chromium's drag\
    \ below the OS drag loop, so the specs above cover the handlers, the client call\
    \ and the route, and task-240's sandbox review is where a hand on a mouse belongs\
    \ \u2014 task-235 ac-4 asks for exactly that and it stays open.\n"
