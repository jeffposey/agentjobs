spec:
  summary: "On the Tasks surface only, replace the single full-width page with a persistent\
    \ left region and a main detail region at landscape widths, and change tasks and\
    \ tasks/:taskId from sibling routes into a parent route with a nested outlet so\
    \ both panes render at once. Structure only \u2014 the panes can hold the components\
    \ they already hold."
  intent: The routing change is the whole difficulty. Doing it on its own, with the
    existing components dropped into the new regions unchanged, keeps the diff readable
    and the regression surface small.
  description: "## The change\n\n**Read task-235 log entry 3 first** \u2014 it is\
    \ binding and it decides what you are building.\nThe short version for this child:\
    \ the two regions belong to the **Tasks surface only**.\nDashboard, Create and\
    \ Dispatch keep the full width and the header nav stays exactly as it\nis. You\
    \ are not building a global sidebar.\n\n`frontend/src/App.tsx:521-530` currently\
    \ renders:\n\n```\n<main className=\"mx-auto w-full max-w-7xl ...\">\n  <Routes>\n\
    \    <Route path=\"tasks\" element={<TaskListPage .../>} />\n    <Route path=\"\
    tasks/:taskId\" element={<TaskDetailPage .../>} />\n```\n\n`tasks` and `tasks/:taskId`\
    \ are siblings, which is exactly why one replaces the other.\nMake `tasks` a layout\
    \ route that renders the list region plus an `<Outlet />`, and\n`:taskId` its\
    \ child. React Router v6 nesting does this without new dependencies.\n\nThen apply\
    \ the breakpoint task-236 settled: two regions at and above it, today's\nsingle-column\
    \ stack below it.\n\n## What \"structure only\" means\n\nThis child is finished\
    \ when the geometry and the routing are right. `TaskList` and\n`TaskDetail` go\
    \ into the new regions **as they are** \u2014 the collapsible tree and the\nnarrow-column\
    \ row are task-238's job, and fitting the detail to a bounded panel is\ntask-239's.\
    \ If they look cramped at the end of this task, that is expected and belongs in\n\
    a progress note, not in this diff.\n\n## Points that will bite\n\n- **Independent\
    \ scrolling.** Two regions that scroll the page as one is the failure mode\n \
    \ that makes a sidebar layout feel wrong. Each region owns its own scroll container,\
    \ and\n  the page itself does not scroll at landscape widths.\n- **The empty state.**\
    \ `/tasks` with no task selected now renders a list and an empty\n  main region.\
    \ Decide what fills it \u2014 a prompt, a summary, the queue's next task \u2014\
    \ and\n  say why in a decision entry. Do not leave a blank rectangle.\n- **The\
    \ Dashboard link.** Selecting a task from the Dashboard must land on the Tasks\n\
    \  surface with that task selected, per the binding decision, not on a detail-only\
    \ page.\n  The nested route makes this free; check it rather than assuming.\n\
    - **The `max-w-7xl` centring** comes off the Tasks surface, but the detail region\
    \ still\n  needs a readable measure. A wide panel with 200-character lines is\
    \ not an improvement.\n- **Existing tests.** 228 vitest component tests and 26\
    \ Playwright tests assert against\n  the current shell. Update the ones that describe\
    \ structure; do not delete a test\n  because it now fails.\n- **The banners.**\
    \ `BrokenFiles` and `QueueBroken` render above the current `<main>`.\n  Give them\
    \ a home in the new shell where they cannot be scrolled past inside one pane."
  constraints: "- Take a worktree and bootstrap it (`python scripts/bootstrap.py`)\
    \ before anything else.\n- Only the Tasks surface changes shape. Dashboard, Create\
    \ and Dispatch keep the full\n  width, and the header nav is untouched.\n- No\
    \ new npm dependency. React Router v6 nesting and Tailwind are sufficient.\n-\
    \ Below the breakpoint the rendered output is what it is today. A jsdom test at\
    \ a phone\n  viewport should not be able to tell this change happened.\n- `scripts/check.py`\
    \ green before every commit, using the interpreter path the bootstrap\n  prints\
    \ rather than a bare `poetry run`."
  out_of_scope: "- The collapsible tree, selection and keyboard movement in the list\
    \ \u2014 task-238.\n- Fitting the detail panel and the other surfaces \u2014 task-239.\n\
    - Any change to the header nav, or a global navigation rail. The decision was\
    \ against one.\n- Any visual redesign beyond what the geometry forces."
  context:
  - path: frontend/src/App.tsx
    why: 'The shell and the sibling routes being replaced: header at 508, main at
      521, Routes at 523-530.'
  - path: frontend/src/components/BrokenFiles.tsx
