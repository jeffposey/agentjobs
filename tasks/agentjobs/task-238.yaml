spec:
  summary: The task list is currently a wide multi-column table designed to be the
    whole page; in the sidebar it is a narrow tree you pick from, with children that
    collapse under their parents, a selected row, and arrow-key movement. Drag-to-reorder
    and Alt+Up/Alt+Down must survive the move, verified by hand.
  intent: A master column is a different component from a full-width table even when
    it renders the same data, and in 350px a nine-child epic without a collapse control
    buries everything below it.
  description: "## The work\n\n`TaskList.tsx` renders a grid that assumes page width\
    \ \u2014 line 344 is\n`min-[820px]:grid-cols-[minmax(16rem,1fr)_repeat(3,minmax(9rem,auto))]`.\
    \ In a sidebar it\nhas roughly 300-400px, which is the narrow-viewport case `ResponsiveTable`\
    \ already\nhandles by restacking into labelled rows. Start by checking whether\
    \ that existing\nmechanism is the answer before writing a second one.\n\n### Collapsible\
    \ children \u2014 the part that is new rather than moved\n\nHalf the tree already\
    \ exists: `queueOrder.ts` groups children under their parents and\nreturns `depth`,\
    \ `childCount` and `openChildren`, and `TaskList.tsx:481` indents by\ndepth. What\
    \ is missing:\n\n- **A disclosure control per parent**, keyboard-reachable, with\
    \ correct `aria-expanded`.\n  Left/Right arrows collapse and expand, as a tree\
    \ normally does.\n- **Collapse state that survives a refetch and a navigation.**\
    \ The list refetches\n  constantly (live updates); a tree that re-expands every\
    \ poll is unusable. Decide where\n  the state lives \u2014 component state, URL,\
    \ or `localStorage` \u2014 and say why in the record.\n  It is per project, not\
    \ global.\n- **A collapsed parent must not hide work silently.** `childCount`\
    \ and `openChildren`\n  are already computed; show enough that a collapsed epic\
    \ still reads as having nine open\n  children. task-137 and task-167 both have\
    \ nine.\n- **A deep link to a collapsed child expands its ancestors.** Pasting\n\
    \  `/p/agentjobs/tasks/task-214` must reveal task-214 in the tree, not select\
    \ something\n  invisible.\n- **A sensible default.** All-expanded reproduces today's\
    \ wall of rows; all-collapsed\n  hides most of the backlog. Pick one, state the\
    \ reasoning, and make it a one-line change\n  if it turns out wrong in review.\n\
    \n### What the column needs beyond the tree\n\n- **A selected row.** The task\
    \ in the detail panel is visibly the selected one, driven by\n  the route param,\
    \ surviving a refetch. `aria-current`, so it is announced rather than\n  only\
    \ coloured.\n- **Up/Down arrow movement** that changes the selection and loads\
    \ that task's detail.\n  This is what makes a list-and-detail layout fast and\
    \ is most of why the shape is worth\n  adopting.\n- **Scroll that stays put.**\
    \ The column has its own scroll container (task-237).\n  Selecting a row must\
    \ not scroll it; returning to the list must not reset it.\n  `scrollIntoView`\
    \ on keyboard movement, only when the row is out of view.\n- **A row that reads\
    \ at 320px.** Id, title, and the one or two signals that decide what to\n  click\
    \ \u2014 ball and priority are the candidates. Everything else moves to the detail.\
    \ Do\n  not shrink the font to keep a column.\n\n## The trap, stated plainly\n\
    \n**Drag-to-reorder and Alt+Up/Alt+Down live in this component and both are focus-sensitive.**\n\
    task-207 shipped the keyboard reorder with green jsdom and Playwright tests and\
    \ it worked\nexactly once per click, because React reorders rows by moving DOM\
    \ nodes and a browser\ndrops focus from a node it reinserts \u2014 and both tests\
    \ re-focused the handle before every\nkeypress, so neither could see it. task-225\
    \ then spent an afternoon on a drag defect that\ndid not exist, because an automation\
    \ tool reported a successful drag that delivered zero\nevents to the page.\n\n\
    So: **press the keys twice in a row yourself, and move a row with a real mouse.**\
    \ Before\nfiling anything as broken, prove the gesture reached the page:\n\n```js\n\
    document.addEventListener(\"mousedown\", (e) => console.log(\"got\", e.target.id),\
    \ true);\n```\n\nEmpty console means the instrument, not the app.\n\n**The tree\
    \ makes the collision worse, not better, and the record has to say how it is\n\
    resolved.** Three specific cases:\n\n1. Arrow keys now mean two things \u2014\
    \ move the selection (Up/Down), expand and collapse\n   (Left/Right) \u2014 next\
    \ to an existing Alt+arrow that reorders.\n2. Reordering with a parent collapsed:\
    \ does the parent carry its subtree, and what does\n   Alt+Up mean when the sibling\
    \ above is hidden?\n3. Dragging a row onto a collapsed parent: does it do nothing,\
    \ expand on hover, or\n   reparent? Reparenting is out of scope \u2014 the safe\
    \ answer is likely \"nothing\" \u2014 but it\n   has to be a decision, not an\
    \ accident."
  constraints: "- Take a worktree and bootstrap it before anything else.\n- Reorder\
    \ is not allowed to regress. Verification is a person's hand on a real mouse and\n\
    \  a real keyboard; a Playwright pass is supporting evidence, not the evidence.\n\
    - Below the breakpoint the list renders as it does today, collapse control included\
    \ or\n  excluded \u2014 whichever, state which and why.\n- The tree extends `queueOrder.ts`\
    \ rather than replacing it. It already produces the\n  rows; do not build a second\
    \ grouping.\n- Keyboard selection and expansion are announced to assistive tech,\
    \ not signalled by\n  colour or an icon alone.\n- scripts/check.py green before\
    \ every commit."
  out_of_scope: "- The detail panel's contents \u2014 task-239.\n- The shell geometry\
    \ and routing \u2014 task-237, already done by the time this starts.\n- Reparenting\
    \ a task by dragging it onto another. Real, wanted, and its own task.\n- Changing\
    \ what the queue order is; this is the same order in a narrower column.\n- Filtering\
    \ and search in the sidebar. Worth having, worth its own task."
  context:
  - path: frontend/src/components/TaskList.tsx
    why: The component being adapted, including the reorder handlers, the line-344
      grid built for page width, and the depth indent at line 481.
  - path: frontend/src/components/queueOrder.ts
    why: Already produces the parent/child rows with depth, childCount and openChildren.
      The collapse extends this.
  - path: frontend/src/components/ResponsiveTable.tsx
    why: The existing restack-when-narrow mechanism; check whether it already solves
      the column before writing another.
  - path: frontend/src/components/dragAutoScroll.ts
    why: Drag auto-scroll assumes the page scrolls. In a scroll container that assumption
      changes.
  - path: frontend/src/components/LiveUpdates.tsx
    why: The refetch that collapse state has to survive.
  - path: tasks/agentjobs/task-207-*.yaml
    why: The focus-across-reorder defect and the two tests that hid it. Read before
      writing tests for this.
  - path: tasks/agentjobs/task-225.yaml
    why: The afternoon lost to an automation tool reporting a drag it never delivered.
