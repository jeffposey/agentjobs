- id: 8
  ts: '2026-09-06T10:17:14.632528Z'
  actor: claude
  type: decision
  body: 'The four decisions this task asked to be made rather than defaulted into.


    **1. Two components, not one that stretches.** `TaskList` takes `variant="table"
    | "tree"`. The table is exactly what shipped -- six columns, restacking into labelled
    cards when its own box is narrow -- and it is what the stacked shell below the
    device-class threshold still renders, which is the constraint this task set. The
    tree is a new row shape used only in the two-region shell''s list region. Rejected:
    reusing `ResponsiveTable`''s restack, which task-237 already turned on here. It
    stopped the title collapsing to zero pixels, and that is all it can do: a card
    is six labelled lines you read, a master column is one indented row you pick from.
    task-237''s own record says as much, and its e2e test deliberately did not assert
    row height because "fitting a task row to a narrow column is task-238''s subject".


    **2. The fold lives in `localStorage`, keyed per project, storing the exceptions
    to a default of open.** Component state was rejected because it dies on the navigation
    this shell exists to make cheap -- leaving the Tasks surface for the Dashboard
    and coming back would unfold everything, and the list refetches constantly besides.
    The URL was rejected because a fold is a property of a reader, not of a link:
    pasting a task URL to somebody else would carry your folds into their browser,
    and it would collide with the filter params already in there. Storing the *exceptions*
    rather than the whole state is what makes an epic filed tomorrow arrive open with
    no migration, and it is why flipping `FOLDED_BY_DEFAULT` in `TaskList.tsx` flips
    every fold in one line, as the spec asked.


    **3. The default is open.** All-collapsed hides most of the backlog behind a click,
    including whatever `agentjobs next` would hand out, and a queue whose first screen
    omits the work is not a queue. The spec''s counter-argument -- "all-expanded reproduces
    today''s wall of rows" -- is answered by the row rather than by the default: the
    wall was a flat six-column table, and these rows are indented, 79px tall as measured
    against this repository''s own corpus, and grouped. Folding is therefore an act
    a reader takes on a specific epic they are done with, which is exactly the thing
    worth remembering across sessions.


    **4. The three collision cases.**


    *Arrow-key meanings.* Alt is the whole of the distinction, and it is checked first.
    Up and Down move the selection and load that record; Left and Right fold and unfold,
    or -- on a leaf, or an already-folded parent -- step out to the parent, as a tree
    does. The same four keys **with Alt** move the task through its band, which is
    what they already meant. Home and End without Alt go to the ends of the visible
    list; with Alt they move the task to the ends of its band.


    *Reordering with a parent folded.* The parent does not carry its subtree, and
    Alt+Up steps past the sibling above it **in the band** whether or not that sibling
    is on screen. This needed no code: `queueOrder.ts` has always computed a step
    over the band and never over the rendered rows, precisely so that filtering or
    grouping cannot change what a gesture means. Folding is one more thing that changes
    what is rendered. What makes the move legible when the neighbour it passed is
    invisible is the polite live region, which names that neighbour -- and that is
    now covered by a test.


    *Dragging onto a folded parent.* It is an ordinary drop: the dragged task is placed
    beside that parent in its band, exactly as a drop on any other row would place
    it. Rejected: doing nothing, which makes a folded row a hole in the list and is
    indistinguishable from a broken drop target; and unfolding on hover, which moves
    every row under the pointer mid-gesture and lands the drop somewhere nobody aimed
    at. Reparenting is out of scope and is its own task.'
  data: {}
- id: 9
  ts: '2026-09-06T10:17:14.782006Z'
  actor: claude
  type: progress
  body: 'Built on `feat/task-238-sidebar-task-tree`, three commits, rebased onto `main`
    at `f9c1de2`.


    ## What is there


    `frontend/src/components/taskTree.ts` is new and pure: the parent grouping (moved
    out of `TaskList.tsx` unchanged), a descendant count per parent, the visible-rows
    filter over a fold predicate, the arrow-key neighbour, and the per-project storage.
    `queueOrder.ts` is untouched -- the tree sits beside it and the two never meet,
    which is the point made in the decision entry above.


    `TaskList.tsx` gains `variant="tree"`: one indented row per task carrying the
    id, the title, the dependency-state badge, the priority pill and the place in
    line; a disclosure on every parent with `aria-expanded` and a name that says what
    folding would hide; a selected row driven by the route with `aria-current="page"`;
    Up/Down to move the selection with focus following it, and Left/Right to fold.
    `App.tsx` passes `variant="tree"` in the two-region shell''s list region and nothing
    in the stacked one.


    ## A real defect found in a browser, not by a test


    Pressing Down twice in Chromium did nothing the second time. Opening a task dropped
    the query string, so the first press emptied the search, the list re-rendered
    from three rows to the whole backlog, React reinserted the row that had just been
    selected somewhere else, and the browser dropped focus from the node it moved.
    That is task-207''s failure reached through a different door, and it is now fixed
    -- every row link and the arrow-key navigation carry the filters across -- with
    two jsdom tests pinning it.


    Worth recording because of how it was found: the jsdom test for two presses was
    green throughout, because in jsdom the row never moves.


    ## Verified


    - **`scripts/check.py`, unqualified, on the rebased branch.** Green. (See the
    entry that follows for the commit it verified.)

    - **19 new jsdom tests** in `TaskList.test.tsx`, and a mutation check on the one
    that matters most: stubbing out `writeCollapsed` turns the fold-survives-a-remount
    test red, so it is not passing for an unrelated reason.

    - **5 new Playwright tests** in `e2e/task-tree.spec.ts` against a live server:
    the column measured at its 320px floor with a title box 140px+ wide and a font
    no smaller than the full-width table''s; a fold that survives a reload; a deep
    link into a folded parent unfolding its ancestors; Up/Down moving the selection
    with focus following, asserted by *waiting* for focus rather than placing it;
    and a scrollport that does not move under either a click or a step between two
    rows already on screen.

    - **The existing reorder specs now run against the tree**, because the default
    Playwright viewport is 1280x720 and that is the two-region shell. `queue-order.spec.ts`
    presses Alt+Up twice without re-focusing, and drags with `page.mouse` down/move/move/up,
    both green.

    - **By eye, against this repository''s own corpus**, on a server started from
    this worktree on port 8917 (stopped afterwards): rows 79px tall, task-235''s four
    children grouped and indented under it, the column exactly 320px at a 700x800
    window with nothing pushed sideways, and the phone shell''s cards unchanged. Screenshots
    at 320px, 413px and on a 390px phone.


    ## Not verified, and it cannot be by an unattended run


    ac-9 and ac-10 ask for **a person''s hand** on a real keyboard and a real mouse,
    and this run had neither. The Playwright evidence above is what the task itself
    calls supporting evidence, not the evidence: `page.keyboard` goes in below the
    browser''s own shortcut handling and `page.mouse` drives Chromium''s drag controller
    through `Input.setInterceptDrags`, which is not the operating system''s drag loop
    (task-225). Those two criteria are left `pending` rather than claimed, and a follow-up
    task holds the two-minute check.'
