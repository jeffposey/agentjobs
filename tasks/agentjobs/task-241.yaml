- id: 7
  ts: '2026-08-22T02:56:10.824210Z'
  actor: claude
  type: decision
  body: "**Decision: five choices where I did not build what the spec's step list\
    \ literally said, and one where I did.** Each is binding unless a reviewer overturns\
    \ it; each names what was rejected, because none of them is recoverable from the\
    \ diff.\n\n## 1. Closing is the last step, not the fourth\n\nThe spec lists close\
    \ at step 4 and rebuild/restart/verify at step 5. Built the other way round.\n\
    \n**Rejected: closing before delivery.** ENGINEERING.md's sharpest warning about\
    \ this exact sequence is that `frontend_dist/` is gitignored, so a merged React\
    \ change is committed and invisible until `npm run build` runs in the serving\
    \ clone \u2014 and the human ends up looking at the version they approved you\
    \ to replace. If closing came first, that failure would end with a task marked\
    \ `completed`, which is precisely the ambiguity this task's constraints forbid.\n\
    \nAs built, a failure after the merge leaves: the merge on the record with its\
    \ commit, the task **open**, the ball with the agent, and a prompt reading \"\
    **The merge is done: `abc1234`**\" followed by what is missing. A reader can never\
    \ be in doubt about whether `main` moved.\n\nThe cost, stated so nobody rediscovers\
    \ it: a task can now sit open with its branch already merged. That state is real\
    \ and it is the honest one.\n\n## 2. The finish does not touch acceptance statuses\n\
    \nThe spec says \"set acceptance statuses that are genuinely determinable\".\n\
    \n**Rejected: writing anything to `acceptance[]`.** I could not find one that\
    \ a script can determine. \"The branch merged\" is not an acceptance criterion;\
    \ every real criterion on the tasks in this corpus is a claim about behaviour\
    \ that a human or an agent judged. Writing `met` on them from a merge would be\
    \ fabricating evidence in the one part of the record that is supposed to carry\
    \ it. The agent sets them before handing off, and the human approves on that basis\
    \ \u2014 that chain is intact and this must not insert itself into it.\n\n## 3.\
    \ Verification asks for containment, not equality \u2014 and asks about the checkout\
    \ first\n\nThe spec says to check the serving process is running the merged code,\
    \ and calls \"started after the merge commit\" a floor.\n\nBuilt: `/api/version`\
    \ gains `source_commit`, **captured once at process start and never recomputed**,\
    \ and the check is `merge-base --is-ancestor <merge> <serving commit>` in the\
    \ clone that was merged into.\n\n- **Rejected: comparing for equality.** The finisher\
    \ commits the task record to the base immediately after merging, so the base is\
    \ already past the merge by the time anything restarts. Equality would fail every\
    \ successful delivery. Found by a test, not by reasoning.\n- **Rejected: recomputing\
    \ the commit per request.** The whole value is that a *stale* process cannot produce\
    \ the right answer. Read on demand, a server running hour-old code would read\
    \ the new HEAD off disk and report the merge commit. Captured at startup, it cannot.\n\
    - **Rejected: retrying a source-root mismatch.** A different clone answering on\
    \ the address is not a slow restart, and waiting cannot turn it into the right\
    \ one. It escalates immediately, with its own reason.\n- **`started_at` is reported\
    \ but not tested against.** It is the floor; the commit is the ceiling, and where\
    \ there is a commit the floor adds nothing.\n\n## 4. A configured restart always\
    \ runs; the prefix list only decides whether an *unconfigured* one may be skipped\n\
    \nThe spec says rebuild \"if and only if the merge touched it\", and I did exactly\
    \ that for the frontend. I did **not** extend that logic to the restart.\n\n**Rejected:\
    \ restarting only when `src/agentjobs/` or `frontend/` changed.** That list is\
    \ a guess about what a process holds \u2014 templates, static files, the bundle,\
    \ package metadata \u2014 and being wrong about any one of them leaves the human\
    \ on stale code, the failure this step exists to prevent. A few seconds of downtime\
    \ on a local dashboard is a much smaller cost than being wrong. The prefixes still\
    \ decide one thing: whether a machine that has configured *no* restart command\
    \ may finish anyway, or must escalate.\n\n## 5. Escalation goes through the existing\
    \ `auto_dispatch` switch\n\nThe spec says \"escalation means: dispatch the task\"\
    .\n\n**Rejected: dispatching unconditionally.** `auto_dispatch` is the existing\
    \ switch for \"may a human's approval start a run without a second click\", and\
    \ it is off for this project deliberately. Overriding it from a new code path\
    \ would be a second, undocumented answer to a question already answered in machine-local\
    \ config.\n\nAs built: an escalation always writes the full account and hands\
    \ the ball to `agent`/`work` with a prompt naming the step. Where `auto_dispatch`\
    \ is on it then dispatches, attributing the run to **the human's approval entry**\
    \ rather than the newest one \u2014 by then the newest is the finisher's, and\
    \ a dispatch defaulting to it would be refused as not human-clocked. Where it\
    \ is off, which is here, the task sits with a precise prompt and Jeff's existing\
    \ Dispatch click wakes the session that did the work. That is the pre-task-234\
    \ flow with a far better prompt in it, and it costs nothing to fall back to.\n\
    \n**Also rejected: making the finish a thread in the server.** Step five restarts\
    \ the server. A finish running inside it would be killed by its own restart, half\
    \ way through the part whose job is to verify the restart worked \u2014 leaving\
    \ a merged branch, a live server, and nobody to say so. It is a detached process.\n\
    \n## 6. The one place I built exactly what was asked: `--no-ff`, and a human before\
    \ every merge\n\nUntouched, and both have tests. The merge commit is still the\
    \ reviewable unit. A person still clicks Approve, per task, and the *route that\
    \ received the click* is what passes `finishable` \u2014 not a value derived from\
    \ the resulting task, because requesting changes and approving both hand the ball\
    \ to the agent and only the route can tell them apart. That is the failure mode\
    \ a derived value would eventually produce: merging a branch somebody had just\
    \ asked for changes on.\n"
  data:
    operation:
      id: 9d3a5c81-4b2e-4a77-93f0-6c8e1d2f4a55
      kind: log_append
      fingerprint: 952d32dba079615f3feda0e74e78d68b
- id: 8
  ts: '2026-08-22T03:17:25.625763Z'
  actor: claude
  type: progress
  body: "**Demonstrations. All four ran against a real clone of this repository, with\
    \ a real AgentJobs server started out of it, driving the real `agentjobs finish`\
    \ CLI.** `scripts/finish_sandbox.py`, `python scripts/finish_sandbox.py` \u2014\
    \ about ten minutes for the set. Nothing is stubbed; the gate is this repository's\
    \ own `scripts/check.py` and the server is a real `agentjobs serve`.\n\n## f1\
    \ \u2014 a clean, green branch, with no agent anywhere\n\n```\ntask-243: finished\
    \ (finished)\n  preflight  ok         1.1s  sandbox/happy at d599ebc9 in .../worktrees/happy\n\
    \  rebase     ok         0.1s  sandbox/happy onto main: d599ebc9 -> d599ebc9\n\
    \  gate       ok       185.2s  scripts/check.py green\n  merge      ok       \
    \  0.9s  --no-ff into main as 228f56d8f759ef72a9164abc93d603845c4e664a\n  rebuild\
    \    skipped    0.0s  the merge touched no frontend/ path\n  restart    ok   \
    \      3.8s  ran .../restart.py\n  verify     ok         0.0s  http://127.0.0.1:43124\
    \ is serving fff8d536, which contains\n                              the merge\
    \ 228f56d8, from .../clone\n                              (started 2026-08-22T03:02:57.781814+00:00)\n\
    \  close      ok         0.0s  closed completed\n  worktree   ok         0.0s\
    \  removed .../worktrees/happy\n```\n\nChecked afterwards, not taken from the\
    \ tool's own word: `main` contains the branch, the merge commit has two parents,\
    \ the task is `closed`/`completed`, `branches[]` reads `merged` with a timestamp,\
    \ `git worktree list` no longer has it, and `/api/version` moved from `fe667189`\
    \ to `fff8d536`. **194.7s end to end, no dispatched run, no model.**\n\n## f3\
    \ \u2014 a real conflicting rebase\n\n```\ntask-244: escalated (rebase_conflict)\n\
    \  preflight  ok         1.0s  sandbox/conflict at 41732619\n  rebase     STOPPED\
    \          \"The branch is exactly where it was (41732619). Nothing was merged.\"\
    \n```\n\n`CONFLICT (content): Merge conflict in sandbox-conflict.txt`, aborted,\
    \ and **the branch tip read back and compared: `41732619 -> 41732619`.** Not merged\
    \ into main. Task `active`, ball `agent`, prompt opens \"**Nothing was merged.**\"\
    . 2.1s.\n\nThe sentence in that escalation is not boilerplate: the code reads\
    \ the tip after the abort and picks between \"the branch is exactly where it was\"\
    \ and \"**the abort did not restore it** \u2014 do not assume the branch is clean\"\
    . A woken session acts on that sentence, so it may not be a guess.\n\n## f4 \u2014\
    \ a real red gate\n\n```\ntask-245: escalated (gate_failed)\n  rebase     ok \
    \        0.1s  sandbox/red-gate onto main: c87a93a5 -> c87a93a5\n  gate      \
    \ STOPPED          `scripts/check.py` failed after the rebase (3s, exit 1).\n\
    \                              A red gate never merges.\n```\n\nThe real gate,\
    \ failing at its real first stage on a deliberately unformatted file. Not merged.\
    \ Full output kept at `<finish>/gate.log` and named in the escalation. 4.7s.\n\
    \n## f5 \u2014 the port answers, and the answer is wrong\n\nThe sharp case: a\
    \ restart command that **exits zero and restarts nothing**, which is exactly what\
    \ a wrong restart command looks like from outside.\n\n```\ntask-246: escalated\
    \ (not_live)\n  gate       ok       184.7s  scripts/check.py green\n  merge  \
    \    ok         0.2s  --no-ff into main as 74a8e27c8421743cb16007c0730f4a66508eaff1\n\
    \  restart    ok         0.0s  ran ... -c pass\n  verify     STOPPED         \
    \ \"is serving commit fff8d536, which does not contain the merge\n           \
    \                   74a8e27c -- it is the process that was already running.\n\
    \                              **The merge is done** and the rebuild and restart\
    \ both ran,\n                              so this is about the serving process,\
    \ not about the branch.\"\n```\n\n**The merge is real and the record says so;\
    \ the task stays open.** Ball with the agent, prompt opening \"**The merge is\
    \ done: `74a8e27c`.**\" This is the ambiguity constraint discharged: a reader\
    \ can tell, without guessing, that `main` moved and the delivery did not.\n\n\
    Also covered by tests rather than by the sandbox, because they need a server that\
    \ lies in a specific way: a different checkout answering on the address escalates\
    \ immediately as `wrong_checkout_serving` instead of being waited out, and a `/api/version`\
    \ with no `source_commit` cannot prove anything and is not accepted.\n\n## f6\
    \ \u2014 untouched\n\nA person clicks Approve, per task, and only the approve\
    \ route passes `finishable`. `tests/test_finish_approval_hook.py` asserts request-changes\
    \ never starts a finish, a machine with the feature off falls through to exactly\
    \ the old behaviour, a task sitting in review starts nothing on its own, and the\
    \ approval is still recorded against the person who made it.\n\n## f2 \u2014 the\
    \ before/after pair, and the honest caveat\n\n**Before** \u2014 task-234's named\
    \ table, eleven post-approval runs: 6.1, 12.0, 12.1, 10.2, 10.7, 12.5, 11.6, 17.2,\
    \ 8.3, 16.4, 4.1 minutes. **Mean 11.0m.**\n\n**After** \u2014 from a real finish's\
    \ own record, through the same instrument:\n\n```\n$ python scripts/run_report.py\
    \ --home <sandbox>\n\nNo dispatched runs matched. Scripted finishes in <sandbox>\\\
    home\\finishes\n\n  scripted finishes     1 (task-241; approval merges without\
    \ an agent)\n    finished            1, mean 3.1m  <- follow-on runs that never\
    \ happened\n    tasks finished with no dispatched run: 1\n```\n\n**11.0m \u2192\
    \ 3.1m, and no dispatched run at all.**\n\n**The caveat, stated rather than buried:\
    \ those are not the same job.** The finish's phase records split it \u2014\n\n\
    ```\ngate_started  03:13:12\ngate_finished 03:16:08   passed: true, seconds: 176.7,\
    \ stages_run: 10\nwhole finish                       185.8s\n```\n\n\u2014 so\
    \ **176.7s of the 185.8s is the gate, and the machinery itself costs 9.1 seconds.**\
    \ The eleven-minute sessions being replaced did *not* re-run the gate; they rebased\
    \ already-verified work and merged it. So the finish does **strictly more** than\
    \ what it replaces and still takes a third of the time. If you want the comparison\
    \ that is exactly like for like, it is 11.0 minutes against **9 seconds**, with\
    \ a full re-verification of the rebased branch thrown in.\n\nThe report is silent\
    \ about finishes until there is one, so this changes nothing for anyone who never\
    \ turns it on.\n\n## What the sandbox itself got wrong, three times, and why it\
    \ is written into the script\n\nEach of these is a way of demonstrating nothing\
    \ while appearing to demonstrate something, and each cost a run:\n\n1. **An un-bootstrapped\
    \ worktree stops at `preflight`, not at the conflict.** The first pass reported\
    \ a `no_interpreter` refusal as a successful demonstration of a rebase conflict,\
    \ because it only checked the shape \u2014 escalated, branch unchanged, nothing\
    \ merged \u2014 and not the reason. It asserts the reason now.\n2. **A sandbox\
    \ file Black would reformat turns every case downstream of the gate into another\
    \ red-gate case.** The gate is real; single-quoted strings are not.\n3. **Rewriting\
    \ `README.md` to force a conflict breaks `test_documentation_contract` for every\
    \ case that follows** \u2014 so the next case's gate went red for a reason belonging\
    \ to the previous one, and reported it as its own finding. The conflict case uses\
    \ a scratch file now.\n\n## The gate\n\n`scripts/check.py`, unqualified, green:\
    \ **130.8s**, all ten stages, on a clean tree at `17d78f5`.\n"
