  body: "**Ready for review: `feat/task-241-scripted-finish`, 8 commits, gate green\
    \ at 130.8s on a clean tree.** All six acceptance criteria met; the demonstration\
    \ entry has the evidence and the decision entry has the six binding calls.\n\n\
    **What it does.** With it enabled, clicking Approve rebases the task's branch,\
    \ runs the full gate in that branch's own worktree with that worktree's own interpreter,\
    \ merges `--no-ff`, rebuilds the frontend if the merge touched it, restarts the\
    \ server the way this machine says it was started, proves the running process\
    \ is serving the merge, closes the task and removes the worktree. No agent is\
    \ started at all. When it cannot do a step safely it stops, writes exactly how\
    \ far it got, and hands the ball back.\n\n**The number: 11.0 minutes -> 3.1 minutes,\
    \ and no dispatched run.** 176.7s of that 3.1m is a full gate run the eleven-minute\
    \ sessions never did, so like for like it is 11.0 minutes against 9.1 seconds\
    \ of machinery, with a re-verification of the rebased branch thrown in.\n\n**Demonstrated\
    \ live, not asserted** \u2014 real clone of this repo, real server, real `agentjobs\
    \ finish`, in `scripts/finish_sandbox.py`: a clean branch merged and verified\
    \ live; a real conflicting rebase aborted with the branch tip read back and unchanged;\
    \ a real red gate blocking the merge; and a restart command that exits zero and\
    \ restarts nothing, caught by verification with the merge already done and the\
    \ record saying so.\n\n---\n\n**Two things I need from you, and one is a decision.**\n\
    \n**1. The switch is off, and turning it on is yours.** I did not touch `~/.agentjobs/dispatch.yaml`.\
    \ Nothing changes on this machine until you add this under `projects.agentjobs`,\
    \ and it takes effect only after this branch is merged and 8876 restarts:\n\n\
    ```yaml\n  agentjobs:\n    enabled: true\n    group: default\n    auto_dispatch:\
    \ false\n    posture: auto\n    finish:\n      enabled: true\n      base_branch:\
    \ main\n      restart:\n        - pwsh\n        - -File\n        - C:/ai/shared/launchers/open-agentjobs.ps1\n\
    \        - -Force\n      verify_base: http://127.0.0.1:8876\n```\n\nI have **not\
    \ verified that exact restart command**, and you should before trusting it: I\
    \ know from the task spec that the launcher restarts-if-stale and takes `-Force`,\
