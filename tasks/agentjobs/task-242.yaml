spec:
  summary: 'Overnight full-repo audit (night of 2026-08-21, before the weekly limit
    resets 7pm 2026-08-22): dispatch one read-only auditor per system listed in the
    description, each writing a findings file, then a synthesis session that writes
    one combined report and files draft tasks for actionable findings. Spends leftover
    weekly quota that would otherwise expire.'
  intent: "Get a comprehensive, adversarial picture of where AgentJobs actually stands\
    \ \u2014 code, schema, interfaces, process docs, tests, security, and the task\
    \ corpus itself \u2014 while a large block of otherwise-expiring model quota makes\
    \ it nearly free. Intended to become a weekly ritual."
  description: "## Ground rules (apply to every auditor)\n\n- **Read-only.** No code\
    \ changes, no task mutations except this task's own log. An auditor that wants\
    \ to fix something writes it up instead.\n- **No worktree, no gate.** Auditors\
    \ read the main clone; they never check out, never run `scripts/check.py` (it\
    \ would contend for cores and proves nothing about an audit).\n- **Findings are\
    \ files.** Each auditor writes `audits/2026-08-21/<NN>-<slug>.md` in the main\
    \ clone. Format per finding: severity (P1 blocking-defect / P2 should-fix / P3\
    \ improvement / P4 observation), evidence (file:line or command output), and the\
    \ concrete fix or question. End with a \"what I did NOT get to\" section \u2014\
    \ silent truncation is the failure mode.\n- **Adversarial stance.** The standing\
    \ question from ENGINEERING.md: \"what would this have caught?\" Applied to code,\
    \ docs, and tests alike. Praise is not a finding.\n- **Dispatch:** spawn-session\
    \ in auto mode (read-only makes unattended safe), max 3 concurrent per the machine's\
    \ dispatch limit. Prefer Fable 5 for auditors \u2014 the Fable meter is at 12%\
    \ used vs 75% used on the all-models meter \u2014 but **check /usage first and\
    \ confirm Fable does not also draw down the all-models pool**; if it does, budget\
    \ against the 25%.\n\n## The auditors (12 sessions)\n\n**1. Context architecture\
    \ \u2014 static vs dynamic.** AGENTS.md, ALLAGENTS.md, ENGINEERING.md, CLAUDE.md\
    \ @-chain, GLOBAL-AGENTS.md, MCP server instructions, dispatch prompts. Is this\
    \ the right split between static context (loaded every session) and dynamic context\
    \ (task records, ball_prompt, docs read on demand)? Measure the static bundle's\
    \ token cost per session. Find contradictions, duplication across the four files,\
    \ rules that describe a world that no longer exists (e.g. timings, counts), and\
    \ content that should migrate from static prose into the task/dispatch layer or\
    \ vice versa. Also samples ~15 task records against the Resumption Contract; reads\
    \ docs/task-corpus-audit.md first and audits drift since. This is the audit Jeff\
    \ named first \u2014 give it the strongest auditor.\n\n**2. docs/ vs reality.**\
    \ Every design doc (agent-dispatch-design, task-selection-design, schema-design,\
    \ playbooks-design, mcp-integration-design, agent-loops-design, webhooks, performance,\
    \ migration-guide, quickstart, installation, mobile-access, api-reference). For\
    \ each: does the code do what the doc says? Built, half-built, or abandoned? Flag\
    \ docs a new user would follow off a cliff.\n\n**3. Schema v2 & validation.**\
    \ models_v2.py, validation.py, schema_tolerance.py, migration/, migrate_schema.py,\
    \ docs/task-schema.md + docs/schema/. Are the four state axes (lifecycle/ball/ball_reason/outcome)\
    \ actually enforced everywhere or only at the edges? Invariant holes (states constructible\
    \ through storage that the verbs forbid), tolerance policy coherence, migration\
    \ completeness, doc/model drift.\n\n**4. Storage, manager, operations.** storage.py,\
    \ manager.py, operations.py, receipts.py, actors.py, projects.py. Atomicity of\
    \ file writes, crash windows, operation_id idempotency actually replaying vs re-executing,\
    \ concurrent-writer safety (multiple agents + a running server), TaskStorage abstraction\
    \ bypasses elsewhere in the codebase.\n\n**5. Queue system.** queue.py + task-selection-design.md.\
    \ Band semantics, claimability rules vs what task_next --why reports, queue check/repair\
    \ correctness, collision handling, whether stored order survives the operations\
    \ that touch it.\n\n**6. CLI.** cli.py (Typer). Command coverage vs API/MCP parity,\
    \ exit codes, error text quality, dead or lying flags, help drift, the init/open/serve/restart\
    \ lifecycle against the \"which server is yours to restart\" rules.\n\n**7. REST\
    \ API + client + webhooks.** api/, client.py, webhooks.py, export_openapi.py,\
    \ instrumentation.py. Error contract consistency, parity with manager verbs, OpenAPI\
    \ honesty, generated-client freshness mechanism, HMAC webhook correctness (timing-safe\
    \ compare, replay, event surface), X-Response-Time-Ms/X-Task-Parses plumbing.\n\
    \n**8. MCP server.** mcp/. Tool inventory vs manager verbs, actor/operation_id\
    \ contract enforcement, instruction text accuracy, failure-mode ergonomics (what\
    \ a confused agent sees), duplicate plugin-vs-direct server registration.\n\n\
    **9. React frontend.** frontend/src \u2014 App, components/, api/generated, queryClient,\
    \ pwa.ts, service-worker.js, report/. Rendered-value correctness (the data-ball=\"\
    Ball.HUMAN\" class of bug), query invalidation, PWA/service-worker staleness (the\
    \ stale-bundle failure class), accessibility, tailnet/mobile behavior, and quality\
    \ of the 228 vitest + 26 e2e against \"what would it have caught\".\n\n**10. Dispatch\
    \ subsystem.** dispatch/ (runner, poller, auto, guards, ledger, phases, wake,\
    \ scaffold, record_commit, address, auth, config) + agent-dispatch-design.md +\
    \ run_report.py. Newest and least-audited system: guard completeness (classifier\
    \ interactions), ledger integrity, resume/wake correctness, orphan handling, the\
    \ three-concurrent-runs assumption, auth.\n\n**11. Gate & tooling.** check.py,\
    \ gate_scope.py, bootstrap.py, bench.py, build_frontend.py, build_release.py,\
    \ project_setup.py. Is the --since-gate default-deny table actually default-deny?\
    \ Receipt chain auditability, bootstrap's wrong-checkout defenses, parallel-safety\
    \ claims, release build correctness/portability (matters for product-strategy\
    \ ambitions).\n\n**12. Security & exposure.** Cross-cutting: the tsnet/tailscale\
    \ exposure path (scripts/tailscale-service-host/, mobile-access.md), dispatch\
    \ auth.py, webhook HMAC, API auth story (is there one?), secrets handling, what\
    \ an attacker on the tailnet or a malicious task YAML can do (YAML load safety,\
    \ path traversal via task ids/attachments, injection via task content into dispatched\
    \ prompts).\n\n## Deliberately merged/excluded\n- Test-suite quality is folded\
    \ into each system's auditor (each owns its tests) \u2014 a 13th tests-only auditor\
    \ would re-read everything.\n- Task-corpus record quality rides with #1 (sampled).\n\
    - Performance: #7 and #11 carry the instrumentation questions; no separate profiling\
    \ run.\n\n## Synthesis (1 session, Fable, after all 12 land)\nReads the 12 findings\
    \ files, nothing else at depth. Produces:\n1. `audits/2026-08-21/00-BIG-DAWG-REPORT.md`\
    \ \u2014 executive summary, findings ranked across all audits, a contradiction\
    \ sweep (places where two auditors' facts disagree \u2014 those are the interesting\
    \ ones), and a themes section (failure classes that recurred).\n2. Draft AgentJobs\
    \ tasks (task_create_draft) for every P1/P2 so Jeff promotes rather than re-types.\n\
    3. Commits audits/ + task files to main with chore commits.\n\n## Budget guard\n\
    Planning cost almost nothing; execution is 12 auditors + 1 synthesis. If /usage\
    \ before dispatch shows the pool tighter than expected, cut in this order: merge\
    \ 6 into 7, merge 2 into 1, merge 5 into 3. Never cut 1, 3, 10, or 12.\n\n## Open\
    \ questions for Jeff before dispatch\n- Confirm audits/ directory in-repo is acceptable\
    \ (additive, not restructuring).\n- Confirm Fable-for-auditors after checking\
    \ how the two meters interact.\n- Any system to weight heavier tonight (he said\
    \ more prompting is coming)."
  constraints: Read-only across all auditors; no merges, no task mutations beyond
    this task's log and the synthesis session's draft-task filings; max 3 concurrent
    dispatched sessions; findings must cite evidence (file:line or command output);
    every auditor states what it did not cover.
  out_of_scope: Fixing anything found (findings become draft tasks instead); auditing
    other projects; performance profiling runs; any push to the remote.
  context:
  - path: docs/task-corpus-audit.md
    why: Prior art for auditing the task corpus; auditor 1 reads it first and audits
      drift since
  - path: ENGINEERING.md
    why: The 'what would this have caught' standard every auditor applies
