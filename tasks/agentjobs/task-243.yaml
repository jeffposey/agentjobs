  body: "## Recurred today, 2026-08-27, **at the widened 30-second budget**\n\nSeen\
    \ from task-296's branch (`fix/task-296-stall-detection`), which touches neither\
    \ this test nor the kill path \u2014 it adds a stall check to `poll_session`'s\
    \ `RUNNING` branch.\n\n```\nFAILED tests/test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too\n\
    \  AssertionError: pid 1448696 survived the timeout\n1 failed, 3482 passed, 1\
    \ skipped in 184.30s\n```\n\n**What makes this a useful data point rather than\
    \ another sighting:** the same branch, same code, passed a full unqualified gate\
    \ half an hour earlier, and the test passed in isolation immediately afterwards\
    \ (`1 passed in 4.73s`). So the mitigation already applied \u2014 polling `_dies_within`\
    \ for 30 seconds instead of asserting on the instant \u2014 **is not sufficient**.\
    \ The in-file comment says the widening was measured against six runs on 2026-08-25\
    \ with one late exit; today's machine was loaded enough to exhaust the full 30\
    \ seconds, or the grandchild genuinely outlived it.\n\nThat distinction is the\
    \ open question, and this run cannot settle it: `_dies_within` returning False\
    \ means \"still listed after 30s\", and nothing recorded whether it died at 31\
    \ seconds or never. **Worth having the fix record which**, because \"the budget\
    \ is too small\" and \"the group kill sometimes misses the grandchild\" want different\
    \ fixes, and only the second is a real defect in the product.\n\nTwo things this\
    \ cost, both of which the task already predicts: a full gate cycle, and \u2014\
    \ because it is in the scripted finish's path \u2014 it would have blocked a merge\
    \ on a branch with nothing wrong with it."
