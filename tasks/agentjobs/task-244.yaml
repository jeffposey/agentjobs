    | Probe | Before | After |

    |---|---|---|

    | `GET /api/whoami` | `no principal (no_proven_identity)` | `tailnet (jposey@hellfiregames.com)
    via proven_header` |

    | `GET /api/dispatch/runs/<id>/output`, `/tail`, `/transcript` | **403** | **200**
    |

    | `POST /api/projects/inspect` | 200 | **403**, *"not available through the tailnet;
    it is reachable on this machine''s loopback interface only"* |

    | the same on loopback | 200 | **200** |

    | `POST /api/projects`, `POST /api/projects/init` | 200 | **403** |

    | `GET /api/projects`, `/api/all/tasks` | 200 | **200** |

    | the proxy''s own loopback socket, directly | forwarded | **403** *"tailscale
