- id: 12
  ts: '2026-09-04T07:57:09.680526Z'
  actor: claude
  type: decision
  body: '**Three smaller calls the diff will not explain.**


    **1. The front-door proof exists, and its default is "no front door".** Task-329
    recorded the residual and assigned the fix here: loopback says "from this machine",
    not "from the proxy", so any local process could set `X-Tailscale-User` and be
    believed as `tailnet` -- which holds all eleven capabilities against a run''s
    five. Demonstrated live before the change: `curl -H ''X-Tailscale-User: attacker@example.com''
    http://127.0.0.1:8876/api/whoami` answered `tailnet (attacker@example.com) via
    proven_header`.


    The proxy now presents a 32-byte secret from `~/.agentjobs/front-door-secret`,
    compared with `hmac.compare_digest`. **With no secret configured, nothing is the
    front door** -- not even a genuine proxy request -- so on a machine running no
    proxy the identity header is inert and every local caller is the owner it actually
    is. Failing closed on *attribution* while staying open on *function*.


    *The honest limit, stated in `front_door.py` at length rather than left for someone
    to discover:* the proxy and every dispatched agent run as the same user, so no
    secret stored here is unreadable by an agent that goes looking. It buys three
    real things -- forgery becomes a deliberate act rather than an accident, a proxy-less
    install cannot produce a `tailnet` principal at all, and the boundary acquires
    a name and a file so a deployment that genuinely separates the proxy tightens
    by moving the secret rather than by redesigning resolution. It does not buy secrecy,
    and claiming it did would be the worse error.


    *Rejected: leaving the residual open and only stripping the client''s header.*
    That closes the remote forgery and leaves the local escalation, which is the one
    task-332 built a capability table to prevent.

    *Rejected: keeping loopback-alone as the default and tightening only when a secret
    is configured.* Backwards compatible, and it leaves the hole in the exact configuration
    that matters -- this machine -- until somebody remembers to set a variable.

    *Rejected: the application minting the secret.* It would be handing out the evidence
    it uses to decide whom to believe. The proxy writes; the application only reads,
    and a missing file is the ordinary state rather than an error.


    **2. The deny-list stays three, and a test says so.** `TestTheDenyListIsThreeEntries`
    fails if the map grows, with a message pointing at the record; `TestNothingElseIsDenied`
    walks ten routes the audit originally wanted denied -- `/api/all/tasks`, both
    dispatch switches, dispatching a task, the three run-output routes, `/queue/repair`,
    the scoped task list, `/app/` -- and asserts each reaches the application. Task-066
    entry 5 is binding and this is the mechanism that keeps it binding after everyone
    who read it has moved on.


    **3. The Go tests are not in `scripts/check.py`, deliberately.** `go test ./scripts/tailscale-service-host/`
    is green and documented in two READMEs, and `scripts/bootstrap.py` does not install
    a Go toolchain. Adding a stage would make Go a dependency of a Python project
    for an optional component most installs never run; making the stage skip when
    Go is absent gives a gate that silently covers less on some machines than others,
    which is worse than a documented manual step.


    The trade-off is real and is the reason this is a decision and not a footnote:
    **a change to `frontdoor.go` can merge with its tests unrun.** What limits the
    damage is that the proxy is not the security boundary on its own -- the application
    refuses an unproven identity by itself -- and that the two halves pin each other''s
    header spellings from opposite sides (`frontdoor_test.go` and `tests/test_front_door.py`
    each assert their own, because a disagreement between them is silent and its symptom
    is every remote caller quietly becoming the owner). *Reopen this if the proxy
    grows a second responsibility.*


    **Also worth knowing, and not obvious:** there was no Go toolchain on this machine.
    Go 1.27.1 was unpacked to `C:/ai/scratch/goroot/go` (throwaway by Jeff''s convention)
    purely to build and test; nothing was installed system-wide and nothing on `PATH`
    changed.'
