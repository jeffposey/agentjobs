- id: 11
  ts: '2026-09-04T07:56:43.356603Z'
  actor: claude
  type: progress
  body: '**Built and verified on `feat/task-244-tailnet-proxy-identity` (`833a166`,
    `6b16880`).** Fourteen files: three new (`src/agentjobs/front_door.py`, `scripts/tailscale-service-host/frontdoor.go`
    and its test, `docs/tailnet-front-door.md`, `tests/test_front_door.py`), the rest
    edits.


    ## What landed


    **Go, `scripts/tailscale-service-host/`** -- `frontdoor.go` is a handler in front
    of the existing `NewSingleHostReverseProxy`, so nothing reaches the backend un-identified.


    - `WhoIs` on every request, and **four refusals**, each `403` with a sentence:
    the lookup failed, no node came back, the node is **tagged** (a machine, and AgentJobs
    maps a login to a *person* -- this tailnet has two tagged nodes), or no user profile
    / empty login.

    - **Strips** the caller''s own `X-Tailscale-User`, `X-AgentJobs-Front-Door`, `X-AgentJobs-Run`
    and the three forwarding headers before setting its own. Load-bearing, not tidy-up:
    each is evidence the application acts on, arriving from someone who can type anything.

    - **Three denied routes**, `POST /api/projects`, `/api/projects/init`, `/api/projects/inspect`,
    matched on the `path.Clean`ed path so `/api/projects/x/../init` and `/api/proj%65cts/init`
    are the same route here as they are to the application. `GET /api/projects` is
    not denied.

    - The shared secret, minted here on first run at `~/.agentjobs/front-door-secret`.


    **Python** -- `front_door.py` supplies the secret (environment, then file, cached
    five seconds so server-before-proxy start order cannot matter); `principals.py`
    splits `is_front_door` into `is_local` (address) and `is_front_door` (address
    **and** a `compare_digest` match on the proof), adds `was_forwarded`, and refuses
    to fall back to `owner` for a front-door request that names nobody.


    **Docs** -- `docs/tailnet-front-door.md` (new, in `docs/index.md`), and the trust-rule
    section of `docs/principals-design.md` rewritten. Both say what the shared secret
    is *not* worth as plainly as what it is.


    ## How it was verified


    **The gate**, unqualified, in the worktree, from the worktree''s own interpreter:
    **1 failed, 3925 passed, 1 skipped, 625.9s**. The failure is `test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`
    -- *"the grandchild never started, so this proves nothing"* -- the known load-sensitive
    flake named on task-308 and task-329''s records. **Two gates were running on this
    machine at once** (task-333''s child was mid-gate). It passed alone in 10.1s;
    this branch touches neither the runner nor the kill path. Log at `C:/Users/jpose/.claude/jobs/33934cfd/tmp/gate-244.log`.
    The scripted finish runs the full gate again and merges only on a green one, so
    that run is the authority rather than this note.


    **Go tests**: `go test ./scripts/tailscale-service-host/` green, 18 cases, plus
    `go vet` and `gofmt`. Go is not a dependency of this repository and these are
    deliberately **not** in `scripts/check.py` -- see the separate decision entry.


    **Against the live Service**, which is where the two design corrections came from.
    Every row below is a real request over `https://agentjobs.tailfed1df.ts.net` from
