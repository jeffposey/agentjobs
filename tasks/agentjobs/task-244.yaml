  ts: '2026-09-04T07:49:16.463102Z'
  actor: claude
  type: note
  body: '**ac-6: the tailnet ACL''s reach for `svc:agentjobs`, read 2026-09-04.**
    The audit filed this as the open item nobody had answered. It does not change
    the design -- identity is per-connection either way -- but it sizes what is exposed.


    **Read from this machine''s netmap** (`tailscale debug netmap` on `coruscant`),
    not from the admin console, which needs a browser login nobody here has.


    **The policy is the default allow-all.** The packet filter distributed to this
    node accepts sources `100.64.0.0/10` (spelled as the eleven CGNAT sub-ranges the
    control plane emits) and `fd7a:115c:a1e0::/48`, to destinations `0.0.0.0/0` and
    `::/0`, ports 0-65535, protocols TCP/UDP/ICMPv4/ICMPv6. That is `{"src": ["*"],
    "dst": ["*:*"]}` -- nobody has narrowed it.


    **The `services/agentjobs` node capability is present on this node**, carrying
    the Service''s VIP `100.126.67.115` / `fd7a:115c:a1e0::a201:43c1` on `tcp:443`,
    and `agentjobs.tailfed1df.ts.net` resolves to it. That capability is what lets
    a node route to the Service at all.


    **So: reachable by every node on the tailnet, not a subset.** Directly confirmed
    for `coruscant` (every probe in this task''s verification went over it). For the
    other four it is an *inference* from the allow-all filter plus the fact that the
    same netmap carries the caps for both Services rather than a subset -- stated
    as an inference because I read one node''s netmap and cannot read another''s.


    **Five nodes, one user account** (`hellfiregames.com`, single-user tailnet):


    | Node | Owner |

    |---|---|

    | `coruscant` (this machine) | `jposey@` |

    | `jeffs-tab-s7` | `jposey@` |

    | `jeffs-z-flip6` | `jposey@` (offline, last seen 6d) |

    | `agentjobs-service-host` | `tag:agentjobs-host` |

    | `jobsearch-service-host` | `tag:jobsearch-host` |


    So "every node" is today three of Jeff''s own devices and two tagged service hosts.
    **That second group is why the tagged-node refusal in the proxy is not theoretical**:
    `jobsearch-service-host` is a real tagged peer that could open a connection to
    this Service, and there is no person behind it to attribute.


    Recorded in prose at [docs/tailnet-front-door.md](docs/tailnet-front-door.md#what-the-tailnet-acl-currently-allows)
    so it does not live only in a task log. **It will go stale**: adding a person
    to the tailnet, or narrowing the policy, changes who can knock. It does not change
    whether they are identified, and since task-332 it does not change what they may
    do.'
