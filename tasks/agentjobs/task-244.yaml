spec:
  summary: The tsnet proxy forwards every request with no identity and no filter.
    Make it prove who is calling and hand that proof to the app, and deny only the
    three routes that let the API point at a new directory.
  intent: 'This was filed as the whole fix and is now one child of task-066, because
    the audit''s own framing -- ''two layers; either alone is a large improvement''
    -- was written for a world with no identity model. With one, the proxy''s job
    shrinks to the half only it can do: it is the only thing that can call `WhoIs`
    on a tailnet connection, so it is where identity is established. Deciding what
    a caller may do once identified belongs to task-332, and keeping local-only projects
    off the network belongs to task-333.


    Read task-066''s decision entry first. It is binding and it explains, with the
    grep that produced it, why this task''s deny-list is three routes rather than
    the audit''s ten.'
  description: '## Layer 1: prove identity


    `server.LocalClient().WhoIs(remoteAddr)` on each request, and set the identity
    header the app reads. The proxy is currently `NewSingleHostReverseProxy` with
    nothing in front of it (`main.go:56-63`).


    The app''s side of this contract is task-329''s: **the header is believed only
    when the request arrives by the path the front door controls.** Get the two halves
    consistent, and do not let this task''s convenience widen that rule -- a header
    trusted from anywhere is a body field with better clothes.


    A connection `WhoIs` cannot identify is not forwarded as anonymous. It is refused,
    and the refusal says why. There is no unauthenticated remote caller in the finished
    design.


    ## Layer 2: deny exactly three routes


    `POST /api/projects/init`, `POST /api/projects`, `/api/projects/inspect`.


    They are the only rung that turns the API into arbitrary code execution on this
    machine -- init any existing directory, enable dispatch on it, create a task,
    dispatch a session with that cwd -- and `/inspect` is the filesystem existence
    oracle that makes the first step aimable. Nobody performs any of them from a phone.
    They stay fully reachable on loopback.


    ## Explicitly not denied, and why


    The audit''s list also denied `/api/all/tasks`, `dispatch/enable|disable`, `/queue/repair`,
    `/webhooks*`, `/docs`, `/redoc`, and the run output/tail/transcript routes. Verified
    by grep on 2026-09-03: **the React app calls every one of those zero times except
    the run output routes**, which it uses for the structured dispatch output panel.
    So that half of the deny-list would have protected nothing the rest of this epic
    does not protect better, while breaking the one surface it touched.


    - **Run output, tail and transcript** -- identity-gated instead. This is the panel;
    breaking it is the failure mode this whole epic is shaped to avoid.

    - **`dispatch/enable` and `disable`** -- `enable` acts only against an already-defined
    runner, so its danger is parasitic on `init`, which is denied. `disable` is the
    brake and is wanted most from a phone.

    - **`/api/all/tasks`** -- filtered by task-333 rather than denied, which stays
    correct when there is a second front door.

    - **Dispatching a task** -- ordinary workflow. It was never on the audit''s list
    and must not acquire a ban here.


    ## The open item the audit could not answer


    Nobody has read the tailnet ACL: whether `svc:agentjobs` is reachable by all four
    peers or a subset. Read it, and record what it says on this task. It does not
    change the design -- identity is per-connection either way -- but it sizes what
    is exposed today.'
  constraints: '- The identity header must be believed by the app only on the path
    this proxy controls. Coordinate with task-329 rather than inventing a second contract.

    - An unidentifiable connection is refused, never forwarded as anonymous.

    - Deny three routes. Adding a fourth is a decision to record with its reasoning,
    not a judgement call made while editing.

    - Do not break the structured dispatch output panel. It is the acceptance criterion
    the epic is measured on.

    - The proxy stays a proxy: no authorization logic, no project knowledge, no policy.
    It establishes identity and forwards.'
  out_of_scope: Authorization and capabilities (task-332). Project exposure and /api/all/tasks
    filtering (task-333). Anything about what a dispatched run may do (task-331).
  context:
  - path: scripts/tailscale-service-host/main.go
    why: 'The proxy this task rewrites: NewSingleHostReverseProxy at 56-63, no WhoIs,
      no filter'
  - path: audits/2026-08-21/12-security.md
    why: 'S-1, S-6 and S-8: the threat model and the exact anonymous requests verified
      against the tailnet hostname'
  - path: frontend/src/components/DispatchOutput.tsx
    why: 'Lines 201-220: the panel that must keep working, and the reason the run
      output routes are not denied'
