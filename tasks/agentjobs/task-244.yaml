    | through the front door with forged `X-Tailscale-User: attacker@example.com`
    + `X-AgentJobs-Front-Door: guessed` + `X-AgentJobs-Run` + `X-Forwarded-For` |
    -- | `tailnet (jposey@hellfiregames.com)`: every forged header stripped |

    | the same identity header sent **directly** to the app on loopback | `tailnet
    (attacker@example.com)` | `owner` once the merged app is serving |


    **In a browser over the tailnet**: `/app/` loads, the Dispatch page renders with
    its gates and its Disable button, `/runs` lists three live runs, and **task-244''s
    own page shows the structured dispatch output panel, live, against this run**
    -- the panel the whole epic is shaped not to break, and which was returning 403
    through the tailnet an hour ago.


    ## Two residuals, both named rather than buried


    1. **`~/.agentjobs/identities.yaml` does not exist**, so the proven login maps
    to no actor and the app says so in the Dispatch panel: *"The login ''jposey@hellfiregames.com''
    is not mapped to an actor."* That is task-330''s deliberate refusal working, not
    a defect, and **the Dispatch button is disabled until it is written** -- which
