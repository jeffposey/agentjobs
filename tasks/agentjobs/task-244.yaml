    is one actor id per login machine-wide, and this machine''s projects use two spellings
    of the same person (`Jeff Posey` in agentjobs/job-hunting/mastercalls, `jeff`
    in fantasy-football/product-strategy), so the choice has a consequence that is
    Jeff''s to make, not mine to guess. Worth a follow-up on task-330''s model.

    2. **The proxy binary is shared with `svc:jobsearch`** (`C:/ai/shared/services/bin/tailscale-service-host.exe`,
