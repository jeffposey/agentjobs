spec:
  summary: 'Big Dawg Audit P1 (auditor 4 F1/F2; auditor 7 for webhooks.yaml; auditor
    7''s aside that task files already use temp-file rename was checked by the synthesis
    and is wrong). TaskStorage._write_task is a bare Path.write_text: truncate then
    write, no temp file, no os.replace, no fsync. Every write has a window in which
    the server, the poller and other CLIs read a truncated file as a broken task,
    and a kill mid-write leaves a zero-length record whose only recovery loses every
    log entry since the last chore commit. A crashed writer also leaves a lock nothing
    reclaims.'
  description: "## What was found\n\n- `src/agentjobs/storage.py:496-497`: `yaml_text\
    \ = yaml.safe_dump(...)`; `path.write_text(yaml_text, encoding=\"utf-8\")`. Verified\
    \ by the synthesis session against main. Compare `attachments.py:128-134`, written\
    \ four days later, which writes a `.partial` and `os.replace`s it. `storage.py:220-222`\
    \ describes an atomic writer that does not exist.\n- Consequence 1: a server restart\
    \ (prescribed after every merge) or a killed CLI mid-write leaves a truncated\
    \ file \u2192 `TaskLoadError` \u2192 the task drops into the broken banner, counts\
    \ as not-closed for dependents, is invisible as a child. Recovery is `git checkout\
    \ -- <file>`, which loses every log entry since the last task-file commit.\n-\
    \ Consequence 2: readers take no lock by design, the per-request snapshot is entered\
    \ per request, and the dashboard re-lists on every `/revision` change \u2014 whose\
    \ hash changes twice per write (once at truncation). Landing inside the window\
    \ is made more likely, not less.\n- `storage.py:366-382`: the lock file records\
    \ the writer's pid and nothing ever reads it. Contention spins 10 s then raises\
    \ `TaskLockTimeout`; there is no `agentjobs unlock` and no sweep. The dispatch\
    \ ledger solved exactly this for its own locks (`dispatch/ledger.py:377-400 release_stale_locks`).\
    \ The crash that truncates the file also leaves the lock, so the two compound.\n\
    - Same `write_text` pattern: `projects.py:368-372` (registry, unlocked) and `webhooks.py:65-68`\
    \ (`_write_webhooks`, read-modify-written from a background delivery task with\
    \ no lock \u2014 auditor 7).\n- No test reads during a write or reads a truncated\
    \ file (`tests/test_storage.py` 11 tests, `test_concurrency.py` 14).\n\n## Fix\n\
    1. `_write_task`: write to `path.with_name(f\".{task.id}.partial\")` in the same\
    \ directory, `fsync`, `os.replace` onto the target. Three lines; NTFS and POSIX\
    \ both make `replace` atomic. Fix or delete the comment at `storage.py:220`.\n\
    2. Factor that into one helper and use it for the registry and `webhooks.yaml`.\n\
    3. On `FileExistsError` in `locked()`: read the pid; if not alive AND the lock\
    \ is older than the timeout, reclaim (delete + retry once). Windows pid reuse\
    \ is why both conditions are needed. Add `agentjobs unlock <task>` for the residual\
    \ case and name it in the timeout message.\n4. Tests: one process in a write loop,\
    \ one reading `list_tasks()` in a loop, assert zero `TaskLoadError`; a stale-lock\
    \ reclaim test.\n\nAuditor 4's \xA76 note: these are owed to the current backend\
    \ and cost the same under any future one."
  context:
