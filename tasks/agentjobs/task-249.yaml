- id: 8
  ts: '2026-08-25T23:59:54.364257Z'
  actor: claude
  type: progress
  body: "## Spec step 1 answered, empirically, and it changes the fix\n\nAuditor 10\
    \ did not run step 1. I did, and **the installed CLI does offer a per-session\
    \ environment for `--bg`** \u2014 it is just not called that in `--help`. `--settings\
    \ <file-or-json>` is documented as \"load additional settings from\", and a Claude\
    \ Code settings file carries an `env` block. Because it travels in **argv**, it\
    \ survives the daemon hop that discards the launcher's environment.\n\n### The\
    \ probe\n\nClaude Code **2.1.238**, 2026-08-25. `claude agents --help` and `claude\
    \ --help` have no env flag for `--bg`; `--environment` is a cloud-session id and\
    \ unrelated.\n\nThe daemon was already up, so this is the **steady state** the\
    \ task is about, not the daemon-start case: no \"Starting background service\"\
    \ banner was printed. Launched a throwaway `--bg` session with an env var exported\
    \ into the launcher *and* a second one in a `--settings` file, asked it to print\
    \ both:\n\n```\nSETTINGS=[settings-value-arrived] LAUNCHER=[]\n```\n\nDecisive\
    \ in both directions in one shot. The launcher's exported variable is **discarded**,\
    \ exactly as the task predicts; the `--settings` value **arrives**.\n\n### Confirmation\
    \ of the mechanism, from this very run\n\n`~/.claude/daemon.log` for my own dispatch:\n\
    \n```\n23:54:11Z [supervisor] idle 5s with no clients \u2014 exiting  (uptime=50204s)\n\
    23:56:46Z [supervisor] \u2500\u2500\u2500 daemon start \u2500\u2500\u2500 version=2.1.238\
    \ pid=1113332 origin=transient\n23:56:46Z [bg] bg spawned 7a0cba89 (shell)\n```\n\
    \nMy `AGENTJOBS_RUN_ID` is correct (`run_3f8ec46f`) for precisely the reason the\
    \ task names: the daemon had idle-exited 2m35s earlier, so **my launch started\
    \ it** and my launcher's environment became the daemon's. `run_68ea396e` fourteen\
    \ hours earlier inherited `run_12b2675c` because the daemon then in place carried\
    \ that. Same mechanism, both directions, observed on the same machine within a\
    \ day.\n\n### What this changes\n\n- **`--settings` takes a file path**, so the\
    \ runner's `env:` can be delivered *without* appearing in argv. That is the property\
    \ the secrets advice in `docs/agent-dispatch-design.md` and `config.py` was claiming\
    \ and not delivering \u2014 so ac-3 resolves in the \"make it true\" direction\
    \ rather than \"remove the advice\".\n- Spec step 2 (derive from the ledger) is\
    \ still worth having, but demoted to a **fallback** rather than the primary fix.\
    \ It cannot be the primary: as entry 3 notes, `released_posture` is a second consumer\
    \ that reaches a *merge authority* decision, and filtering `live_runs` by project\
    \ would have been ambiguous at several points today.\n\nPlan: deliver the environment\
    \ through a per-run settings file (primary), keep a ledger-derived fallback for\
    \ anything that still arrives without it, record `daemon_started` in `meta.yaml`,\
    \ and teach `run_report` to tell the three cases apart.\n\nWorktree `../worktrees/agentjobs-249`,\
    \ branch `fix/task-249-run-identity-from-ledger`, bootstrapped in 36s."
