  body: "Done. Commits 6308db8 (code) and 8a5a834 (docs) on docs/task-270-docs-drift-sweep.\
    \ Full gate green, receipt for 18d4f874.\n\nac-1 VERIFIED BY RUNNING IT, not by\
    \ reading the code. In this worktree before the frontend was built:\n  $ python\
    \ -m agentjobs.cli open --port 18771\n  Starting AgentJobs server at http://localhost:18771...\n\
    \  Waiting for server to initialize...\n  React frontend bundle is missing from\
    \ the package; run `npm run build` in frontend/ ...\n  The API is up at http://localhost:18771;\
    \ only /app/ is unavailable. No browser was opened.\n  EXIT=1\nThe reused-port\
    \ path was exercised too, by standing up a SimpleHTTPRequestHandler on 18772:\
    \ \"Something other than AgentJobs is listening on port 18772 (answered HTTP 404\
    \ at /api/version, which AgentJobs does not). Choose another port with --port,\
    \ or stop that service.\" EXIT=1. serve and restart print the same sentence as\
    \ a startup warning and do NOT refuse \u2014 REST, MCP and the CLI all work without\
    \ a bundle, and a headless install is legitimate.\n\nac-2 and ac-3 VERIFIED TOGETHER\
    \ in a throwaway project with a NON-DEFAULT tasks directory, which is what makes\
    \ it a real test: init --tasks-dir tasks/qs, then the quickstart's three commands\
    \ verbatim. create --ready printed \"Created task-001.yaml (ready \u2014 claimable\
    \ now)\", list --lifecycle ready showed it, and work --agent codex displayed it.\
    \ Before the fix, work read a literal ./tasks, created an empty directory and\
    \ printed \"No tasks available\".\n\nDESIGN NOTES\n- /api/version gained frontend_bundle:\
    \ present|missing, so one probe answers both \"is this AgentJobs\" and \"can it\
    \ serve /app/\". ApiBaseProbe gained a payload field to carry it rather than making\
    \ the caller ask twice. openapi.json and the generated TS client regenerated;\
    \ the gate's api stage is green.\n- spa.py: bundle_is_present() / bundle_status(),\
    \ and the three duplicated missing-bundle sentences now share one _missing_sentence\
    \ helper.\n- open captures the child's stderr to a temp file instead of letting\
    \ it go to a console created with CREATE_NEW_CONSOLE|CREATE_NO_WINDOW. That is\
    \ what makes the wrong-checkout banner \u2014 the failure that cost a forensic\
    \ session in task-194 \u2014 reportable rather than invisible. The file is deleted\
    \ after it is relayed.\n- create gained --ready and now names the lifecycle in\
    \ its success line either way. Without it the documented three-command quickstart\
    \ could not work, because a draft is deliberately not claimable.\n- work keeps\
    \ an explicit --storage-dir override; only the default changed, from ./tasks to\
    \ the configured tasks_directory via _build_manager.\n\nDOCS: the npm build line\
    \ added to installation.md, quickstart.md, agent-workflow.md and README.md, each\
    \ with one sentence on why it is required from a clone and not from a wheel. The\
    \ contributor recipe now points at scripts/bootstrap.py instead of a hand-written\
    \ poetry install + npm install, which used npm install (can rewrite the lockfile)\
    \ and skipped the source-provenance check.\n\nNOT VERIFIED BY EXECUTION: the \"\
    nothing answered\" branch of open. I did not construct a server that refuses to\
    \ start, so the captured-stderr relay is covered by reading rather than by running.\
    \ Worth an eye in review; it is the one path of the three I did not exercise."
