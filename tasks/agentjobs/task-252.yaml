  body: "Done, on branch docs/task-270-docs-drift-sweep (one worktree for the whole\
    \ docs-vs-reality cluster at Jeff's instruction \u2014 see the decision entry).\
    \ Commit 8ac8c29.\n\nWHAT CHANGED in docs/agent-dispatch-design.md\n- Header replaced\
    \ with a status block: a table mapping every \xA713 item to the task that shipped\
    \ it (068, 069, 070, 071, 072, 073, 076, 077, 177, 074), a list of shipped work\
    \ the design predates entirely (task-075/186 worktrees, task-241 finish, WAKE_STUB,\
    \ run phases, dispatch auth-check|reconcile|status --live), and the four unbuilt\
    \ features.\n- Marked *(unbuilt)*: `difficulty` and the difficulty\u2192profile\
    \ table, runner `model`/`effort` labels, per-profile `strict`. Convention matches\
    \ config.py:1076.\n- Corrected the two false absences: run directories/transcript\
    \ capture (RunDirectory at runner.py:790, TRANSCRIPT_FILENAME at :102, served\
    \ by /runs/{id}/output) and the Remote Control URL (REMOTE_CONTROL_URL at runner.py:540,\
    \ surfaced at :2046).\n- Corrected \"on graceful shutdown every live run is cancelled\"\
    : main.py lifespan cancels only the poller, the batch supervisor thread is daemon=True\
    \ (runner.py:2285), and stop_everything is reached only from cli.py:1318. Startup\
    \ reconciliation is what actually closes the gap.\n- Probe timeout \"two second\"\
    \ \u2192 five (PROBE_TIMEOUT_SECONDS = 5.0, address.py:214).\n- Concurrent-gate\
    \ table marked as measuring the SERIAL gate that task-233 replaced; recorded that\
    \ the contended figure at the new speed is unmeasured.\n- Safety section: added\
    \ the attacker model it never had. The four gates are sufficient against a repository\
    \ choosing what executes and not against a network peer; what defends the second\
    \ case is loopback binding plus the tailnet.\n- New \xA75a for the scripted finish,\
    \ and a \xA78 subsection for the WAKE_STUB resumption contract \u2014 both previously\
    \ existed only in ALLAGENTS.md and wake.py.\n\nREADME: dispatch no longer \"not\
    \ yet implemented\"; the loops design is linked rather than denied; the Claude\
    \ Code plugin credited alongside Codex's; parent claimability restated as task-164\
    \ implemented it.\n\nTHREE AUDIT CLAIMS I DID NOT ACT ON, because I checked them\
    \ and they are wrong. Recording so the next reader does not \"fix\" the doc into\
    \ something false:\n\n1. \"The poller does not reap; reap_finished runs at startup/on\
    \ demand only\" (auditor 10). Half right and misleading. The whole-ledger sweep\
    \ is indeed startup-only, but poll_session settles each session with _finish_session(...,\
    \ reap=True) \u2192 stop_session (runner.py ~:286, :339, :363). The poller does\
    \ reap per session. main.py:72's own docstring says so. Left the doc alone.\n\
    2. \"\xA714 says auto-dispatch consumes get_next_task\" (synthesis grep). There\
    \ is no \xA714 \u2014 the doc ends at \xA713 plus an appendix. The only get_next_task\
    \ mention is at :539, about parents with open children, and it is correct.\n3.\
    \ \"'neither is verified' / 'two second' at the cited lines\" \u2014 the line\
    \ numbers were from audit HEAD 2b6c89f; the strings exist but had moved. Found\
    \ by content, not by line.\n\nMEASUREMENT CORRECTED: the audit says dispatch is\
    \ \"13 modules, ~11.7k lines\". Measured at HEAD 41de4f0: 15 modules, 9,729 lines\
    \ (`wc -l src/agentjobs/dispatch/*.py`). The doc now carries my figure with the\
    \ command that produced it, not the audit's.\n\nac-1 and ac-2 both satisfied.\
    \ Not yet gated."
