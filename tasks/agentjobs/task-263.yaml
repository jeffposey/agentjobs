spec:
  summary: "Big Dawg Audit P2/P3 cluster with five witnesses (auditor 8 F5, auditor\
    \ 6 F6, auditor 12 S-10, auditor 7, auditor 4 F8). \"Never adopt default_user\"\
    \ is requested in four places and enforced in none \u2014 task_claim with actor\
    \ \"Jeff Posey\" passed both checks live. The CLI does the opposite by default:\
    \ promote, queue move and reprioritize without --actor are attributed to default_user.\
    \ Reserved ids dispatcher/finisher are accepted from any caller; PATCH passes\
    \ actor through unvalidated; DELETE and deliverables take none and write \"system\"\
    . The log is append-only, so every one of these is a permanent misattribution."
  description: "## Evidence\n- MCP (auditor 8, live): `task_claim(actor=\"Jeff Posey\"\
    , task_id=nonexistent)` returned `task_not_found` \u2014 the actor passed. `routing.require_actor`\
    \ compares against `project.actor_ids` (`routing.py:101-102`), which includes\
    \ humans; REST `acting_actor` documents \"an agent verb need not match default_user\"\
    \ (`status.py:192-194`); `validate_actor` has no kind check (`actors.py:194-213`).\
    \ The prohibition lives in `routing.py:41-42`, `read_tools.py:196`, `SKILL.md`,\
    \ and a schema description.\n- CLI (auditor 6 F6): `_resolve_actor` (`cli.py:1739-1756`)\
    \ falls back to `config.default_user` for `promote`, `queue move`, `queue reprioritize`.\
    \ `project mcp-setup`'s docstring admits agents \"quietly fall back to the CLI\"\
    .\n- REST (auditors 7, 12, 4): `PATCH /tasks/{id}?actor=` is a bare query param\
    \ passed straight to the manager (`routes/tasks.py:439-459`), written as `actor\
    \ or \"system\"`; `DELETE /tasks/{id}` takes no actor, archives as `\"system\"\
    `, closes an open task as `cancelled` and fires `task.closed` with `triggered_by:\
    \ system` (`manager.py:1445`); `PATCH .../deliverables/{path}` takes none and\
    \ writes no log entry at all (`manager.py:1076-1094`, auditor 4 F7). `dispatcher`/`finisher`\
    \ are accepted from any HTTP or MCP caller (`actors.py:202-203`), so a caller\
    \ can write \"AgentJobs finisher merged \u2026\" entries; the human-clocked guard\
    \ refuses to dispatch on them but the record lies.\n- Python client default: `add_progress_update(agent=\"\
    \")` sends `\"author\": \"system\"`, which any project with an `actors:` block\
    \ refuses as `unknown_actor`; `tests/test_client.py:142` pins the defect (auditor\
    \ 7).\n\n## Fix\n- `require_actor` (MCP) and `acting_actor` (REST): refuse `kind\
    \ == human` on the agent verbs (claim, release, handoff-from-agent, log as agent,\
    \ task_next's eligibility actor) with `unknown_actor` plus an action naming the\
    \ agent ids; refuse `RESERVED` ids from HTTP and MCP (dispatcher and finisher\
    \ call the manager directly).\n- `PATCH` takes `actor` in the body and validates\
    \ it; `DELETE` and deliverables take a body with `actor`; `mark_deliverable_complete`\
    \ takes an actor and appends a NOTE.\n- CLI: no fallback for agents \u2014 require\
    \ `--actor`, or fall back only when stdin is a TTY, and print who the action was\
    \ recorded as.\n- Client: make `agent` required in `add_progress_update` or drop\
    \ the method.\n- Rejected alternative (auditor 8): leaving it to skill text, which\
    \ the standalone-MCP and Gemini rows never load."
  context:
