spec:
  summary: "Big Dawg Audit P2 (auditor 10 P2-3; auditor 12's threat model agrees).\
    \ mcpjson_server_names reads the dispatched project's own .mcp.json and pre-approves\
    \ every server in it via enabledMcpjsonServers in --settings; supervisor runs\
    \ additionally pre-approve mcp__<name> for every tool. That file is repository\
    \ content, so the design's \"a project cannot execute a command that was not written\
    \ into dispatch.yaml by hand\" does not hold \u2014 dispatch bypasses exactly\
    \ the consent prompt that stops a cloned repo from running a command. Latent today\
    \ because every enabled project is Jeff's own."
  description: "## Evidence\n- `runner.py:296-328` `mcpjson_server_names` reads the\
    \ project's `.mcp.json`; `:331-357, 434-446` put the names into `enabledMcpjsonServers`\
    \ in the `--settings` blob. `supervisor_allow_rules` (`:268-293`) adds `mcp__<name>`\
    \ for each \u2014 classifier not consulted.\n- `docs/agent-dispatch-design.md:1244-1254`\
    \ states the gate; `:792-795` rejected `enableAllProjectMcpServers` as \"a much\
    \ broader grant\". Per project the grant is the same; only cross-project scope\
    \ differs.\n- Same family, lower severity and inherent to running a project's\
    \ gate at all: `Bash(npm run:*)` and `poetry run pytest:*` are pre-approved, and\
    \ what `npm run build` executes is defined by the repository.\n- Auditor 8's related\
    \ question (unanswered): `.claude/settings.json` allow-lists `mcp__agentjobs__*`\
    \ only, and `runner.py:356` passes `enabledMcpjsonServers` for the project-scoped\
    \ server \u2014 in a `--bg` run does the plugin's second MCP server prompt, fail\
    \ silently, or get used with the stale skill? Auditor 11 P4-4: `bootstrap.py:184-218`\
    \ copies the main clone's `.mcp.json` into a worktree, interpreter path included,\
    \ so a worktree session's MCP server runs the main clone's code, not the branch's.\n\
    \n## Fix\nName the permitted MCP servers per project in `dispatch.yaml` (machine-local,\
    \ hand-written, where runners live) and intersect with `.mcp.json`; refuse on\
    \ a name the machine has not approved, the way an unknown runner is refused. Write\
    \ down the `npm run`/`pytest` residual as accepted. Answer auditor 8's `--bg`\
    \ question in the same pass and record it."
