    \ top five 73.6s of worker time. **The tail was an inference and is now a measurement**,\
    \ and it is two shapes: real subprocess timeouts, and four tests that parse the\
    \ whole task corpus. That also settles proposal 9 in the negative, as its own\
    \ text said it would.\n\n**Proposal 4 \u2014 no nested `poetry run` (ac-3).**\
    \ `api` and `icons` run their Python halves with `sys.executable`; a stage is\
    \ now a sequence of commands. Three interleaved reps against `main`'s own check.py\
    \ in one worktree: the pair went **6.5 / 6.4 / 7.0s to 3.6 / 3.6 / 4.3s**. `frontend/package.json`\
    \ is untouched \u2014 `npm run check` is a standalone gate with no interpreter\
    \ handed to it. Playwright's `webServer` remains, as specified. Asserted by a\
    \ test over the stage table.\n\n**Proposal 3 \u2014 `--dist worksteal`: measured,\
    \ not adopted.** Six interleaved runs, same 4157 passing: default 76.5 / 77.2\
    \ / 79.7s, worksteal 69.0 / **112.9** / 73.9s. The spread inside the worksteal\
    \ arm is larger than the gap between the arms and the default arm's own spread\
    \ is 3.2s, so three runs cannot tell a 6% effect from a neighbouring gate. Reopen\
    \ with more reps on a quiet machine.\n\n**Proposals 5/6 \u2014 `--concurrent`,\
    \ off by default (ac-4).** Runs each stage as `DEPENDENCIES` allows, captures\
    \ output per stage, reserves `CONCURRENT_RESERVE = 4` cores from pytest for the\
    \ frontend lane. Six contended gates in two worktrees of the same commit, **all\
    \ green**:\n\n| Arm | Gates seen | `-n` | A | B |\n|---|---|---|---|---|\n| Alone,\
    \ serial | 1 | auto | 254.3 / 245.8s | \u2014 |\n| Alone, `--concurrent` | 1 |\
    \ 28 | **165.1 / 166.0s** | \u2014 |\n| Paired, serial | 2 | 16 | 325.4 / 375.7s\
    \ | 352.8 / 403.6s |\n| Paired, `--concurrent` \xD73 | 3 / 2 / 3 | 6 / 12 / 6\
    \ | **206.4 / 235.4 / 211.2s** | **201.2 / 234.6 / 211.6s** |\n\nAlone it is a\
    \ 35% cut and the wall clock is exactly `api + build + e2e`. Paired it is ~45%,\
    \ and there `pytest` becomes the critical path because `gate_slots` divides the\
    \ machine and the reserve takes four more off the top. A third dispatched gate\
    \ (`worktrees/agentjobs-363`) came and went during the run, so each row names\
    \ the gate count its own budget line reported.\n\nIt stays a flag. It prints `EXPERIMENTAL\
    \ RUN` at both ends, records its phases under scope `concurrent` so `already_green`\
    \ cannot rest on one, and **writes no gate receipt** \u2014 the same three devices\
    \ `PARTIAL RUN` uses, for the same failure.\n\n**One real defect found and fixed\
    \ by running it**: the first `--concurrent` gate passed all ten stages and then\
    \ died in `print` with `UnicodeEncodeError`, reporting nothing \u2014 Black writes\
    \ an emoji and a redirected stdout here is cp1252. The serial gate never meets\
    \ this because its children write to the inherited handle.\n\n**The re-cut table\
    \ (ac-4).** The gate is now **bounded by `e2e` at 139s, not by `pytest` at 89s**,\
    \ and one green unqualified run costs ~250s against the documented 95.8s. Every\
    \ critical-path argument in docs/performance.md predates that, so both columns\
    \ are kept and the new one is marked as the one to quote. ENGINEERING.md no longer\
    \ holds the table \u2014 it points at docs/performance.md and `tests/test_context_budget.py`\
    \ leaves 32 bytes of headroom \u2014 so it gets one line for the flag, paid for\
    \ by tightening two sentences."
