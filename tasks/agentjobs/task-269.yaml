  body: "**task-301 is done and parked for Jeff. I restarted the walk past it rather\
    \ than letting the epic sit \u2014 here is why that is not the walk's stop rule\
    \ being ignored.**\n\n## Where the epic stands, 10:4x UTC\n\n| Child | State |\n\
    |---|---|\n| **task-301** | work complete, `active` / `human` / `review`. Branch\
    \ `docs/task-301-context-budget`, commit `647f2b7`, worktree `C:/projects/worktrees/aj-301`.\
    \ Full unqualified `scripts/check.py` green on the rebased branch, 10/10, 242.3s.\
    \ Needs one approval. |\n| task-302 | started by the resumed walk |\n| task-303,\
    \ task-304, task-306 | open, unblocked, `posture: autonomous` |\n| task-305 |\
    \ open, blocked \u2014 `needs: task-301` |\n\ntask-301 parked because its run\
    \ was started at `auto` by the posture defect in entry 9, which I found too late\
    \ to change for it. Its work is unaffected; only its merge waits.\n\n## Why restarting\
    \ the walk past a parked child is safe here\n\nThe walk stops on any child that\
    \ is not clean, and the reason `epic.py` gives is explicit: *\"a sibling that\
    \ depended on the failed child would now be building on a gap.\"* That is a checkable\
    \ claim rather than a general caution, so I checked it before restarting rather\
    \ than reasoning about it:\n\n- `task-302` \u2014 `dependencies: []`\n- `task-303`\
    \ \u2014 one `related` on task-276, no `needs`\n- `task-304` \u2014 `dependencies:\
    \ []`\n- `task-306` \u2014 `dependencies: []`\n- `task-305` \u2014 `needs: task-301`,\
    \ and therefore not claimable; the queue will not offer it and the walk cannot\
    \ start it\n\nSo no child the resumed walk can start depends on task-301. The\
    \ one that does is held by the dependency graph, which is the mechanism the stop\
    \ rule exists to back up, not a substitute for it.\n\n**The rejected alternative**\
    \ was to leave the epic stopped until Jeff wakes and approves task-301. That is\
    \ the letter of the rule and it buys nothing: it would idle four independent children\
    \ for hours over a gap that provably does not reach them.\n\n**What I am not doing:**\
    \ approving task-301, or merging it. Its branch stays exactly where its own session\
    \ left it.\n\n## What the walk should do when it runs out\n\nWith task-301 parked\
    \ and task-305 blocked behind it, the walk will end on `NO_ELIGIBLE_CHILD` rather\
    \ than `ALL_CHILDREN_DONE` once 302, 303, 304 and 306 are through \u2014 which\
    \ is the correct report, and is why that stop is distinguished from a finished\
    \ epic. This parent stays open until task-301 is approved, task-305 runs, and\
    \ its own five acceptance criteria are judged against what the children recorded."
