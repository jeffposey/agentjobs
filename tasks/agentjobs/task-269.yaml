spec:
  summary: 'Auditor 1''s verdict on the Big Dawg question Jeff named first: the static/dynamic
    split is right in principle and wrong in proportion. This is the umbrella for
    acting on it - measurement first, correctness next, compression last.'
  intent: Everything a Claude or Codex session genuinely needs on every task is in
    static context; everything else is dynamic, reachable when the task calls for
    it. Measured, not asserted.
  description: '## The finding


    From `audits/2026-08-21/01-context-architecture.md`, the audit Jeff named first
    and gave the strongest auditor. Its short answer: **"the split is right in principle
    and wrong in proportion."**


    The design already states the correct rule, in `runner.py:115-131` - *"the payload
    is a pointer to where the context is, not a copy of it."* The dispatch prompt
    obeys it, at about 600 characters. The always-loaded bundle does not: roughly
    **17,200 tokens per session** across the @-chain, of which about **36% is a rule
    a session acts on**; the rest is rationale, incident narrative and measurement
    history. It restates dynamic payloads the record and the prompt already carry
    verbatim, and it is rewritten most days (ENGINEERING.md and ALLAGENTS.md took
    13 commits on 2026-08-19/20/21 alone) with no test, no budget and no count of
    what it costs.


    Nothing in it is wrong in a way that bites today. The cost is paid per session,
    in tokens and in the attention every rule competes for.


    ## The constraint on this epic


    **Do not optimise static context for its own sake.** Jeff''s instruction, 2026-08-23,
    and it is also the audit''s own weak point: auditor 1 measured only the markdown
    it could `wc`, and the report''s coverage section lists the harness system prompt
    and the MCP tool declarations as *"not examined at all, by anyone"*. An interactive
    session on 2026-08-23 carried roughly 200 deferred tool names from gmail, slack,
    notion, calendar, chrome and computer-use before a single repo word loaded. If
    that is the dominant cost, grinding ENGINEERING.md is optimising the wrong half
    - and it is the half where over-cutting loses rules.


    So the measurement child runs first, and a finding that the deep cut is not worth
    its risk is an acceptable outcome of this epic.


    ## The children


    | # | Child | Gate |

    |---|---|---|

    | 1 | **task-301** - measure what a session actually loads, Claude and Codex |
    none; runs first |

    | 2 | **task-302** - three statements that contradict the code, plus the double-numbered
    merge gate | none; worth doing regardless of size |

    | 3 | **task-303** - the harness orders EnterWorktree and enforces it; the repo
    forbids it | none; also a dispatch-reliability fix |

    | 4 | **task-304** - context evals: which rules actually change behaviour, re-run
    per model release | none; the durable half |

    | 5 | **task-305** - move rationale, incidents and measurement history out; budget
    under test | needs task-301 |

    | 6 | **task-306** - the dynamic half is drifting: summaries, default ball prompts,
    missing questions | none |


    Children 2 and 3 are correctness, not size: an agent following the text literally
    does the wrong thing today. They do not wait on the measurement.


    Child 4 is what keeps this from recurring. A rule that is load-bearing for one
    model may be redundant for the next, so the classification has to be re-runnable
    rather than re-argued.


    ## Supervising this


    Each child that takes a worktree gets its own session. Read the child''s record,
    its acceptance statuses and its diff - not its transcript. Approval is per child,
    through the GUI, as always.'
  constraints: 'The measurement child changes no prose. The compression child does
    not start before it. No rule leaves the repository in any child: text moves to
    docs/, to a task record, or to a dynamic prompt that already carries it. GLOBAL-AGENTS.md
    is edited at C:/ai/shared/ and is not in this repo''s history.'
  out_of_scope: task-276 (the write guard's task-path false positive) stays independent
    - related friction, different mechanism. Reducing the MCP surface itself, if the
    measurement points there, gets its own task rather than being absorbed here.
  context:
  - path: audits/2026-08-21/01-context-architecture.md
