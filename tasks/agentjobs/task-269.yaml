  text: What a session loads is measured for both Claude and Codex, by source, with
    dates and commands - so the split can be argued from a number instead of an estimate.
  status: pending
- id: ac-2
  text: No statement in the always-loaded bundle contradicts the code it describes.
  status: pending
- id: ac-3
  text: A background session in this repository can write into the shared checkout
    without fighting its own harness.
  status: pending
- id: ac-4
  text: The bundle is under a budget a test asserts, with no rule removed - or the
    record carries a decision explaining why the deep cut was scaled back.
  status: pending
- id: ac-5
  text: Which rules are load-bearing is answerable by re-running something, not by
    re-reading the files.
  status: pending
