- id: 8
  ts: '2026-08-23T01:31:29.946121Z'
  actor: claude
  type: progress
  body: "Second first-principles pass, on index.md and agent-workflow.md at Jeff's\
    \ request. Commit 4c7bb30, gate green, receipt 4c7bb30e.\n\nagent-workflow.md\
    \ was rated \"accurate\" by the audit, with the reasoning \"every client signature,\
    \ enum value, CLI flag and anchor checked resolves\". Every signature does resolve.\
    \ That is the wrong test: it checks that a name exists, not that the sentence\
    \ about it is true.\n\nFINDING 1 \u2014 the guide named an exception a client\
    \ author cannot catch. It said a broken queue makes get_next_task() raise QueueCorruptionError.\
    \ Two problems: QueueCorruptionError is not exported from the agentjobs package\
    \ (only agentjobs.queue has it), and TaskClient raises TaskClientError over HTTP\
    \ regardless. So `except QueueCorruptionError` around a client call catches nothing.\n\
    \nPROVEN, not reasoned. Throwaway project on port 18795, two ready tasks, one\
    \ forced onto the other's queue_position to corrupt the queue, then the documented\
    \ call:\n  caught TaskClientError, status_code = 409\nThe page now carries a four-row\
    \ table \u2014 TaskClient raises TaskClientError/409, in-process TaskManager raises\
    \ queue.QueueCorruptionError, REST answers 409, MCP returns queue_broken \u2014\
    \ plus a snippet that catches the thing actually thrown.\n\nFINDING 2 \u2014 approval\
    \ was described unconditionally as handing back to agent/work for the agent to\
    \ merge. With finish.enabled the same click runs the whole close-out with no agent\
    \ in it. Same conditional already corrected in api-reference.md; the guide now\
    \ states both and points a woken agent at the record rather than its memory.\n\
    \nFINDING 3 \u2014 worktree naming. This guide says ../worktrees/<repo>-<nnn>,\
    \ ALLAGENTS.md says aj-<nnn>, runner.py:127's prompt stub says <repo>-<nnn>, and\
    \ ledger.py:831's comment says aj-<nnn> \"per ALLAGENTS.md\". Both spellings are\
    \ live on this machine right now: worktrees/agentjobs-248 sits beside worktrees/aj-281.\
    \ I did not pick a winner \u2014 a project may declare its own short name, and\
    \ the guide now says so and names AgentJobs'. Picking one would have invalidated\
    \ existing worktrees for no gain.\n\nVERIFIED AND CORRECT, so nobody re-checks:\
    \ every TaskClient method the guide calls, with signatures (get_next_task, explain_next_task,\
    \ claim_task, add_progress_update, handoff_task, get_task, list_tasks, search_tasks,\
