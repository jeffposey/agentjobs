  body: "Done. Commits c8674f8 (the sweep) and 18d4f87 (static-context corrections)\
    \ on docs/task-270-docs-drift-sweep. Full gate green, all ten stages, receipt\
    \ written for 18d4f874.\n\nac-1 SATISFIED, and enforced. tests/test_api_reference_coverage.py\
    \ walks every operation in the live OpenAPI document against docs/api-reference.md\
    \ and fails if one is unmentioned. It normalises path-parameter names (so {id}\
    \ and {task_id} compare equal) and accepts either the scoped or unscoped spelling,\
    \ because the doc documents each route once and says so in its Project scoping\
    \ section. A second test fails if the \"no authentication\" line drifts below\
    \ the first 15 lines. MEASURED: 99 operations, 28 of them undocumented before\
    \ this change \u2014 the audit said 74 of 94 and 20 missing; my count is from\
    \ the app itself at HEAD 41de4f0 and supersedes it. actor corrected to required\
    \ on handoff/release/promote/close/log (all Field(...) in api/models.py; ClaimRequest\
    \ takes agent).\n\nac-2 SATISFIED. docs/index.md now indexes all 20 top-level\
    \ docs plus the integration pair, grouped under a status word: shipped / design\
    \ record (accepted, not built) / historical / dated report / generated. The queue\
    \ design is relabelled \"accepted 2026-08-20, IMPLEMENTED 2026-08-21\" with its\
    \ sections 1 and 14 marked as before-state. No design doc now describes shipped\
    \ behaviour as proposed.\n\nac-3 SATISFIED. tests/test_schema_generated_is_current.py\
    \ regenerates the LinkML JSON Schema from both sources and compares against the\
    \ committed files, parsed rather than as text so key-order churn is not reported\
    \ as drift. ~5s. Two companion tests: one fails if regen-schema-docs.sh stops\
    \ writing the file this checks (otherwise a rename silently disarms it), one documents\
    \ the two zero-byte .dbml files nothing generates. I also edited schema/agentjobs-v2.yaml\
    \ to stop calling itself PRESCRIPTIVE/unimplemented and re-ran the full regen\
    \ script; only real content changes are staged, LF/CRLF-only churn was reverted.\n\
    \nALSO FIXED: task-schema (ten required fields not seven, six rules not five,\
    \ category unvalidated at write time, update_task kept off the axes by the API\
    \ model rather than the manager \u2014 task-254 owns that gap); webhooks (task.handoff\
    \ fires on the handoff verb only; claim/release/promote move the ball and fire\
    \ nothing \u2014 verified, only 4 _fire call sites in manager.py); mobile-access\
    \ (foregrounding is not a navigation; crypto.randomUUID throws over the HTTP fallback,\
    \ which breaks queue moves and issue reports); mcp.md (five expected_revision\
    \ tools, not three \u2014 promote, handoff, close, update_content, queue_move);\
    \ performance.md (benchmark port derived from the checkout path); schema-design.md\
    \ and understanding.md (eleven log types, not eight; the dead v1/v2 comparison\
    \ removed); playbooks and loops banners; mkdocs nav and site_name.\n\nTWO AUDIT\
    \ CLAIMS THAT WERE ALREADY FIXED before I started, so no change was needed: plugins/agentjobs/README.md\
    \ already says fifteen tools (corrected in the Codex plugin work since audit HEAD\
    \ 2b6c89f), and README.md's install block already had the npm line.\n\nNOT DONE,\
    \ deliberately: the create --before/--after/--top placement flag. TaskManager.create_task\
    \ accepts a placement argument and honours it, but no CLI flag, request field\
    \ or MCP input exposes it. Exposing it is a feature, not a doc fix, so the doc\
    \ now says it is unexposed rather than describing a flag that does not exist.\n\
    \nReviewable at http://127.0.0.1:8899 \u2014 mkdocs serve, this worktree, own\
    \ port. Two link warnings about ../ENGINEERING.md and ../ALLAGENTS.md are pre-existing\
    \ (2 before my change, 2 after) and are an artefact of those files living outside\
    \ docs/."
