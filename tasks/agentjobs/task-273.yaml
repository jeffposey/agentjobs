spec:
  summary: Replace canonical task YAML with authoritative SQLite on the AgentJobs
    server host, outside code worktrees. Preserve managed workflow semantics and make
    task state, relationships, and history directly queryable for analytics.
  intent: 'Owner decision, 2026-09-05: eliminate routine task-log Git commits, branch-dependent
    backlogs, and file-storage coordination workarounds. This supersedes earlier recommendations
    to retain canonical YAML with a disposable SQLite index.'
  description: 'Implement authoritative SQLite behind the existing AgentJobs service.
    All normal clients, including CLI, MCP, UI, dispatch and worktrees, address the
    same project-scoped service/store; no silent local database creation or YAML fallback
    if the service is unavailable. The database resides on the server host in a configurable
    durable data directory outside source checkouts. SQLite is embedded in AgentJobs,
    not a separate database server.


    Design the physical schema around real queries, not one opaque task JSON blob.
    Use indexed columns for project/task identity, title, lifecycle, ball/reason,
    outcome, priority, queue position, owner, parent, archived, created/updated and
    revision. Use relational rows for dependencies, tags and append-only log/history
    entries. Nested authoring content (spec sections, acceptance criteria and other
    value objects) may use validated JSON where it avoids unnecessary normalization;
    choose explicit columns/tables for fields that must be filtered, grouped or constrained.
    Specify one authoritative representation per field and assemble the existing task
    API shape from it.


    Write current state, attributable audit/history, revision and operation-id bookkeeping
    in the same transaction. Record structured before/after state for creation, close,
    reopen, handoff and other changes needed to reconstruct historical counts. Preserve
    log threading and original timestamps/actors. Index project/time and task/time
    queries. Task-212/213 require open-task counts over time, throughput, aging and
    waiting-state trends; demonstrate representative SQL queries and plans without
    scanning/parsing every task document. Define historical coverage and distinguish
    unknown pre-migration history from zero.


    Preserve optimistic conflicts, atomic claim, independent log appends, idempotent
    retries and queue semantics. Enforce project-scoped identity and open-task position
    uniqueness in SQL; multi-row reorders and their history must commit atomically.
    Domain validation, dependency/cycle rules and authorization remain enforced. Transactions
    do not automatically solve webhook delivery: preserve and test replay/side-effect
    behavior, coordinate task-255. Define WAL/durability settings, bounded busy handling,
    schema version upgrades, connection ownership and crash recovery. SQL storage
    does not require removing code worktrees.


    Declare a backend-neutral storage boundary. Revisit the old file-shaped Protocol
    proposal: do not require task_path/file locks from a SQL backend. Retain an explicit
    import/diagnostic path for malformed legacy records without allowing invalid live
    database state.


    Provide generic consistent backup/restore support and operator documentation:
    use SQLite''s online backup API or an equivalent consistent snapshot mechanism
    while live, cover attachments and required metadata, document paths/retention
    integration, and verify restore into an isolated instance. Do not recommend copying
    only a live database file while WAL writes continue. Product records contain generic
    backup support only.


    Task-311 owns reversible production import, cutover, and retirement of Git/file-specific
    workflows. Keep YAML as optional export/import, not an automatically committed
    mirror or second live authority. Update architecture documentation to distinguish
    the accepted target from the still-live YAML implementation. Earlier audit estimates
    are historical, not delivery promises.'
  constraints: Preserve every existing task, log, attachment reference, project boundary
    and managed workflow contract. No production cutover under this task; task-311
    owns it. Tests/benchmarks use isolated data, never the live database. Backups
    must be demonstrably restorable. Coordinate the schema/history contract with task-213
    before freezing it.
  out_of_scope: Disposable SQLite read index over canonical YAML; MongoDB/PostgreSQL/Dolt
    implementation; distributed database replication; analytics UI implementation;
    personal backup-provider configuration.
  context:
  - path: audits/2026-08-21/04-storage-manager.md
    why: 'Section 6 in full: inventory, accrual table, the weighing, and the trigger'
  - path: docs/schema-design.md
    why: Section 7, the stated philosophy and the existing SQLite-index escape hatch
  - path: src/agentjobs/storage.py
    why: The surface to declare as a Protocol
