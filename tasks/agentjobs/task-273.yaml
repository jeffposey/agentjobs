- id: 5
  ts: '2026-09-05T21:54:15.168428Z'
  actor: claude
  type: question
  body: 'Restart window, raised 2026-09-05 when Jeff reviewed the storage decision.
    The spec is right that there is no local fallback: with SQLite embedded in the
    server process, the server is the only thing that may open the database, so when
    it is down the CLI, MCP and every dispatched run''s task writes are down with
    it. Today that window is not hypothetical, it is scheduled: the merge gate''s
    step 6 restarts the server after every merge, the launcher restarts it when code
    changes underneath it, and `agentjobs restart` is the documented fix for a stale
    process. Under YAML those writes land on disk regardless. Under this design a
    run that handoffs, logs or closes during the restart gets a connection refused.


    Decide, before freezing the contract: (a) clients retry with bounded backoff against
    a refused connection and surface a clear "service unavailable, nothing written"
    error rather than a stack trace, with the retry budget documented; (b) the finisher''s
    restart step and the launcher drain in-flight requests or hold new ones (graceful
    shutdown on the ASGI side, and the front door returning 503 rather than a reset)
    so a restart is a pause, not an outage; (c) whether the CLI''s direct-to-storage
    path survives at all, or every CLI verb becomes an HTTP client like MCP already
    is, which also decides how `agentjobs serve` and `agentjobs restart` themselves
    address the store they are about to own. The idempotent operation_id replay the
    spec already requires is what makes (a) safe. Coordinate with task-126, which
    carries the same question from the MCP side.'
  data:
    operation:
      id: a4c1f8e2-3b7d-4e6a-9f21-5c8d0e7b2a41
      kind: log_append
      fingerprint: 31be9c7e0c5c4b73ed15509d63520885
- id: 6
  ts: '2026-09-05T21:56:10.271158Z'
  actor: claude
  type: decision
  body: 'Owner decision, Jeff Posey, 2026-09-05, answering entry 5. The restart window
    is handled on both sides of the connection and nowhere else:


    1. Clients retry. Every client of the service (CLI, MCP, the dispatch runner''s
    task writes, the finisher) retries a refused or reset connection with bounded
    backoff, keyed on the same operation_id so a retry can never write twice. When
    the budget is spent the client reports "service unavailable, nothing written"
    as a clean error, never a stack trace, and never a local write. The budget is
    a documented constant, not per-call configuration.

    2. Restarts drain. The server finishes in-flight requests before exiting (graceful
    ASGI shutdown), and the tailnet front door answers 503 while nothing is listening
    rather than resetting the connection. A restart is a pause a client rides through,
    not an outage it must reason about. The merge gate''s step 6, the launcher and
    `agentjobs restart` all get this for free once the server does it.

    3. Every CLI verb becomes a service client, the same as MCP already is. The only
    process that opens the database is the server, including `agentjobs serve` on
    startup. There is no direct-to-storage CLI path to keep.


    Rejected: a local task store or YAML fallback while the server is down (a second
    authority, and the spec already forbids it); the MCP server spawning the service
    when nothing answers (reintroduces the stale-server-on-the-wrong-port failure
    this repository has documented); leaving the CLI on a direct storage path (two
    processes opening one SQLite file is exactly the concurrency the design exists
    to remove). Task-126 is closed as superseded on this basis; its remaining concern,
    MCP behaviour during the window, is item 1 here.'
