  actor: claude
  type: question
  body: '**One database for every project, or one per project?**


    Either works. It decides how backups and restores are scoped, and whether a cross-project
    question is ever possible.'
  re: 20
  data:
    options:
    - label: One database, all projects
      description: '`~/.agentjobs/data/agentjobs.db`, with `project_id` on every row
        and in every key. Project scoping becomes a foreign key rather than a convention.
        One backup, one migration run, one connection pool. A cross-project view stays
        possible later at no cost. Restoring one project means importing an export
        into the live database rather than swapping a file.'
      recommended: true
    - label: One per project
      description: A database under each project's own data directory. Restoring one
        project cannot touch another and a project can live on its own disk. Costs
        N connections, N migration runs, N backups, and closes the door on any query
        spanning projects.
