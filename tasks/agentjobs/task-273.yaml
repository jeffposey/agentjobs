    \ forks that would force a v4 have been found and either designed for or consciously\
    \ deferred with the deferral written down.\n\nWhat that licenses, concretely:\n\
    \n- **Design for queries nobody has asked for yet.** The spec already requires\
    \ open-over-time, throughput and aging without whole-document scans. Go past that:\
    \ ask what task-212/213 will want second, what an operator debugging a stuck dispatch\
    \ will want, and what a question about a task's history at a past instant costs.\
    \ A column that is cheap to add now is a migration later.\n- **Coordinate with\
    \ task-213 before freezing the history contract.** This is already in the constraints\
    \ (\"Coordinate the schema/history contract with task-213 before freezing it\"\
    ) and it is the single most likely source of a v4: the analytics page is the consumer\
    \ most able to discover the store cannot answer something. Do not treat that coordination\
    \ as optional or as task-311's problem.\n- **Say what the upgrade path is.** A\
    \ schema version and a migration mechanism are part of this design, not a later\
    \ concern. Knowing how v4 would be applied is what makes it survivable if it comes\
    \ anyway.\n\nTwo things are settled and must NOT be re-asked:\n\n1. **Authoritative\
    \ SQLite, not a disposable index over canonical YAML.** Owner decision 2026-09-05,\
    \ recorded in entry 4 and named in task-358's out_of_scope as explicitly not to\
    \ be relitigated.\n2. **The restart window.** Answered in entries 5, 6 and 9 \u2014\
    \ clients retry with bounded backoff keyed on operation_id, restarts drain gracefully\
