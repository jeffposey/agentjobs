spec:
  summary: Add first-class Codex batch runners to AgentJobs without changing existing
    Claude launch behavior. Codex runs must receive safe posture-specific sandbox
    flags and a required AgentJobs MCP connection.
  intent: Enable production AgentJobs dispatch to Codex Terra for normal work and
    Codex Sol for Big Dawg work while Claude remains available only as an MCP compatibility
    canary.
  description: Extend dispatch runner configuration and command composition so a runner
    can declare its CLI driver. Keep Claude as the backward-compatible default. Support
    Codex in batch mode using `codex exec --json`, translate AgentJobs posture to
    Codex sandbox policy, require the AgentJobs MCP server at launch, and reject unsupported
    Codex session/resume behavior clearly. Preserve existing Claude argv and lifecycle
    behavior exactly.
  constraints: Do not switch the user's live runner groups until a human-triggered
    Codex smoke dispatch passes. Do not make Claude a production fallback. Existing
    Claude runner configuration and tests must remain compatible. Machine-local executable/model
    argv stays in the user config, not repository defaults.
  out_of_scope: Interactive Codex session/resume orchestration and redesigning the
    generic dispatch lifecycle are out of scope for the first integration.
  context:
  - path: src/agentjobs/dispatch
    why: Dispatch configuration, runner eligibility, command composition, and run
      lifecycle.
  - path: tests
    why: Existing dispatch behavior and new Codex regression coverage.
  - path: docs
    why: Operator setup and rollout guidance.
