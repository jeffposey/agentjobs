spec:
  summary: A successful Codex batch run launched by `agentjobs dispatch run` exited
    but remained permanently `running` in the ledger because its daemon supervisor
    died with the CLI process.
  intent: Ensure the command-line dispatch path has a trustworthy terminal ledger
    state before Codex becomes a production runner.
  description: Make the CLI batch-dispatch path preserve a completion supervisor so
    terminal results are written reliably. The live Codex smoke run `run_8413ed0f`
    successfully used AgentJobs MCP and closed task-277, but its run record was left
    `running` after the child exited because the CLI returned immediately and the
    daemon thread could not finish its terminal write.
  constraints: Preserve the existing safety postures and no-shell process launching.
    Do not broaden Codex permissions or alter runner-group selection as part of this
    repair.
  out_of_scope: Production runner-group cutover and the separate AgentJobs plugin-manifest
    cleanup (task-124).
  context:
  - path: src/agentjobs/cli.py
    why: '`dispatch run` returns immediately after starting the batch handle.'
  - path: src/agentjobs/dispatch/runner.py
    why: Batch supervision is currently a daemon thread around `process.wait()`.
  - path: src/agentjobs/dispatch/ledger.py
    why: Startup reconciliation presently marks the orphaned batch run interrupted.
acceptance:
- id: ac-1
  text: A batch run started by `agentjobs dispatch run` writes exactly one terminal
    run state and dispatch-result record after its child exits.
  verify: '`pytest tests/test_dispatch_cli.py::TestDispatchRun tests/test_dispatch_runner.py
    -q`'
  status: met
- id: ac-2
  text: A successfully completed child is not later misclassified as interrupted merely
    because the launching CLI process ended.
  verify: CLI regression asserts a completed subprocess has a terminal ledger record
    before command return.
  status: met
- id: ac-3
  text: Regression coverage exercises the CLI batch path and asserts the terminal
    ledger state.
  verify: '`pytest tests/test_dispatch_cli.py -q`'
  status: met
