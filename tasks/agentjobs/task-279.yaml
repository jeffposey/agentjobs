spec:
  summary: AgentJobs currently dispatches Codex through noninteractive `codex exec`.
    Add a separate session runner so a dispatch creates a durable App Server-owned
    Codex thread that can be inspected and steered.
  intent: Make Codex Dispatch usable as an interactive, app-visible session workflow
    rather than only a batch log.
  description: Implement and prove a Codex App Server-backed session driver for AgentJobs
    Dispatch. Preserve the existing `codex exec` batch driver and defer production
    runner-group cutover until the session path is validated.
  constraints: Use the stable Codex App Server protocol core. Do not enable experimental
    `remote-control`, do not expose a LAN service by default, and do not silently
    fall back to the batch driver. Keep the existing Codex batch runner.
  out_of_scope: Switching default or Big Dawg production runner groups to Codex; that
    follows only after this driver is verified.
  context:
  - path: docs/codex-dispatch.md
    why: Existing batch runner design and operational posture.
  - path: src/agentjobs/dispatch
    why: Current dispatch driver, run ledger, and supervisor implementation.
acceptance:
- id: ac1
  text: A configured Codex App Server session driver can coexist with the existing
    Codex batch driver.
  status: pending
- id: ac2
  text: Dispatch starts a Codex App Server thread with explicit model, cwd, sandbox/approval
    posture, and required AgentJobs MCP configuration; it records the returned thread/session
    identifier in the run and task dispatch records.
  status: pending
- id: ac3
  text: AgentJobs can query the stable App Server thread status and send follow-up
    work to a running or resumed session using supported RPCs, without transcript
    scraping.
  status: pending
- id: ac4
  text: Unreachable App Server and required-MCP failures are surfaced clearly and
    never silently invoke the batch runner.
  status: pending
- id: ac5
  text: Deterministic protocol unit tests and an integration proof verify that a started
    thread is listed by the App Server; documentation distinguishes this runner from
    ChatGPT Remote device pairing.
  status: pending
