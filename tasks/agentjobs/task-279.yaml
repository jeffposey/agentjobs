spec:
  summary: AgentJobs currently dispatches Codex through noninteractive `codex exec`.
    Add a separate session runner so a dispatch creates a durable, app-visible Codex
    thread that can be inspected and remotely steered.
  intent: Make Codex Dispatch usable as an interactive, app-visible, remotely steerable
    session workflow rather than only a batch log.
  description: Implement and prove a Codex App Server-backed session driver for AgentJobs
    Dispatch. On Windows, test the experimental Codex Remote Control path needed for
    live device-pairable steering. Preserve the existing `codex exec` batch driver
    and defer production runner-group cutover until the session path is validated.
  constraints: 'Use the App Server JSON-RPC protocol and the Codex Desktop Remote
    Control path where Windows lacks the stable shared daemon socket. Remote Control
    is experimental: keep it loopback/pairing-scoped, do not expose an unauthenticated
    LAN listener, surface startup/pairing failures clearly, and do not silently fall
    back to batch. Keep the existing Codex batch runner.'
  out_of_scope: Switching default or Big Dawg production runner groups to Codex; that
    follows only after this driver is verified.
  context:
  - path: docs/codex-dispatch.md
    why: Existing batch runner design and operational posture.
  - path: src/agentjobs/dispatch
    why: Current dispatch driver, run ledger, and supervisor implementation.
acceptance:
- id: ac1
  text: A configured Codex App Server/Remote Control session driver can coexist with
    the existing Codex batch driver.
  status: pending
- id: ac2
  text: Dispatch starts a Codex session with explicit model, cwd, sandbox/approval
    posture, and required AgentJobs MCP configuration; it records the returned thread/session
    identifier in the run and task dispatch records.
  status: pending
- id: ac3
  text: AgentJobs can query session status and send follow-up work through supported
    App Server or Remote Control RPCs, without transcript scraping.
  status: pending
- id: ac4
  text: Unreachable App Server, Remote Control pairing/startup, and required-MCP failures
    are surfaced clearly and never silently invoke the batch runner.
  status: pending
- id: ac5
  text: Deterministic protocol unit tests and a Windows integration proof verify that
    a started session is visible/listable in Codex Desktop and can be steered through
    the authorized remote path; documentation distinguishes stable App Server behavior
    from experimental Remote Control.
  status: pending
