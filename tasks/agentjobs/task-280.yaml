spec:
  summary: Make Codex dispatch reliable as a product surface by addressing App Server
    lifecycle, MCP startup, resumability, and Desktop visibility as separate tested
    contracts.
  intent: Turn Codex dispatch from a successful smoke path into a reliable, diagnosable,
    resumable production workflow.
  description: 'This is a structural follow-up to the first Codex session-dispatch
    rollout. The current implementation can complete a real Luna task, but it crosses
    three independently fragile boundaries: AgentJobs MCP startup, Codex App Server
    thread/turn lifecycle, and Codex Desktop''s session/index reconciliation.


    The epic must establish a durable architecture and explicit acceptance tests rather
    than adding another sequence of narrow retry patches. It should preserve the existing
    AgentJobs task lifecycle, audit trail, worktree isolation, and fail-closed MCP
    behavior.


    The implementation work is intended for the ordinary Codex/Luna runner. Do not
    route this epic or its children through the Big Dawg/Sol runner. Speed policy
    is deliberately separate from the architecture work: Terra and Sol should later
    be compared in non-Fast/Standard mode, while Fast-mode cost/performance tuning
    remains a separate experiment.'
  constraints: '- Do not weaken AgentJobs'' task-write audit trail, required MCP contract,
    worktree isolation, or human review gates.

    - Do not treat Desktop sidebar visibility as equivalent to dispatch success; define
    dispatch completion, thread resumability, and Desktop visibility as separate contracts.

    - Implementation children should be worked by Codex using the Luna/default runner.

    - Do not use Sol/Big Dawg for the epic''s implementation or acceptance runs.

    - Terra/Sol Standard-speed comparison and Fast-mode tuning are explicitly deferred
    to later, separate tasks.'
  out_of_scope: Changing the active runner-group policy; optimizing Fast mode; benchmarking
    Terra or Sol; replacing the AgentJobs MCP task protocol; broad Codex Desktop product
    fixes outside the integration boundary.
  context:
  - path: docs/codex-dispatch.md
    why: Current Codex dispatch protocol, runner setup, posture mapping, and rollout
      contract.
  - path: docs/agent-dispatch-design.md
    why: Foundational dispatch safety, lifecycle, and runner-group decisions that
      this epic must preserve.
  - path: src/agentjobs/dispatch/codex_app_server.py
    why: Current App Server client and the boundary where lifecycle and service settings
      are sent.
  - path: tests/test_codex_app_server.py
    why: Existing protocol-level coverage to extend into the structural acceptance
      tests.
