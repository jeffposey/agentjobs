spec:
  summary: Fail Codex dispatch before task work when the required AgentJobs MCP server
    cannot start, handshake, or become ready.
  description: 'Implement a standalone App Server preflight using the same executable,
    cwd, environment, permission posture, service tier, and required-MCP override
    as the real run. It must complete the JSON-RPC handshake, observe MCP startup
    status, and inspect mcpServerStatus/list for the required agentjobs server before
    any task turn begins. Persist a classified diagnostic and phase timing without
    calling task-mutating MCP tools.


    Also repair the existing MyPy failure at src/agentjobs/dispatch/codex_app_server.py:156
    by giving the App Server Popen keyword collection a type compatible with subprocess.Popen.
    This is baseline debt at the same boundary, not a separate retry patch.'
  constraints: Use the configured Codex Luna/default runner only for this future implementation
    child. Preserve required MCP fail-closed behavior, the append-only task audit
    trail, per-task locks, worktree isolation, and review gate. Do not alter runner
    groups or use Sol/Big Dawg.
  out_of_scope: Changing task protocol, runner selection, Fast mode, or Codex Desktop
    behavior.
  context: []
