spec:
  summary: Replace ephemeral launcher ownership with a durable per-run coordinator
    that can reconcile App Server state without duplicating agents.
  description: Implement the coordinator/state model for one App Server process per
    active Codex turn. Persist preflight, startup, running, completion, failure, and
    reconciliation facts in the existing run directory. On AgentJobs host restart,
    reconcile recorded runs against stored Codex threads without treating a PID as
    sole proof or launching duplicate work.
  constraints: Use the configured Codex Luna/default runner only. Preserve AgentJobs
    locks, audit entries, worktree isolation, permission postures, and human review
    gates. Do not introduce a shared global App Server process, alter runner selection,
    or use Sol/Big Dawg.
  out_of_scope: Changing Desktop UI behavior, cold-start policy details, MCP server
    configuration, or Fast mode.
  context: []
acceptance:
- id: ac-1
  text: One active Codex run owns one App Server child through its turn, with persisted
    lifecycle state sufficient for post-restart reconciliation.
  verify: Coordinator and dispatch-runner tests.
  status: pending
- id: ac-2
  text: A host restart or transient process-probe miss cannot spawn a second agent
    for the same task.
  verify: Recovery fixtures assert lock retention and no duplicate launch.
  status: pending
