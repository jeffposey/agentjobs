spec:
  summary: Make same-thread resume, busy-thread handling, and audited cold starts
    explicit state transitions rather than retry heuristics.
  description: 'Replace message-substring handling of App Server resume errors with
    typed classifications. A persisted thread that is busy remains the task continuation:
    retain its lock and record resume_busy; do not automatically create a new thread.
    Permit a new session only for a positively classified missing/deleted/unrecoverable
    thread, and audit both old and new identifiers.'
  constraints: Use the configured Codex Luna/default runner only. Preserve task audit
    records, locks, worktree isolation, permissions, and review gates. Do not use
    Sol/Big Dawg or change runner groups.
