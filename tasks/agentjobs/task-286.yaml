spec:
  summary: "Jeff rejected the README section \"Why this is not another task tracker\"\
    \ outright. Two weak bullets, one of which is \"git is the database\". The product's\
    \ real differentiator is that it is opinionated in ways the schema enforces \u2014\
    \ a task cannot sit unassigned, every handoff carries its ask, every open task\
    \ has a place in line \u2014 and none of that is on the front page. Rewrite so\
    \ the README sells itself early and defers the boring detail."
  description: "## The complaint\n\nJeff, in chat, rejected the section outright.\
    \ His direction: the product has opinions worth leading with, a task cannot be\
    \ unassigned, and every task has a queue order within its priority bucket, which\
    \ is what makes a next-task answer possible. The README should sell itself early\
    \ with that kind of material and defer the boring detail.\n\nCurrent section is\
    \ two bullets: hierarchy roll-up, and \"Git is the database\". Neither is a reason\
    \ to choose this over Jira-with-an-MCP-server. The genuinely opinionated decisions\
    \ are invisible until a reader is deep in docs/task-schema.md.\n\n## What is actually\
    \ differentiating, each verified 2026-08-22\n\nThese are refused by `Task.model_validate`,\
    \ not enforced by convention. Proven by constructing each violation and watching\
    \ it fail:\n\n- **An open task cannot be unassigned.** Rule 1: `ball` is absent-or-null\
    \ if and only if the task is closed. A task with `lifecycle: active` and no `ball`\
    \ does not load.\n- **A handoff cannot be silent.** Rule 4: `ball_prompt` is required\
    \ whenever `ball` is set, with one deliberate exemption for `agent/available`\
    \ where the spec is itself the ask. `ball: human, ball_reason: review` with no\
    \ prompt does not load.\n- **An open task cannot be out of line.** Rule 6: `queue_position`\
    \ is present if and only if the task is open. So \"what is next\" always has an\
    \ answer, and it is a stored decision rather than a sort over `updated`.\n\nSupporting,\
    \ and all verified in this session:\n- `agentjobs next --why` names the winner's\
    \ band and position AND every task it passed over with the rule that excluded\
    \ each.\n- There is no `set_lifecycle`, no `set_queue_position`, and no generic\
    \ patch that reaches the axes \u2014 confirmed absent from src/. State moves through\
    \ claim/handoff/release/close/promote, each of which appends its own log entry,\
    \ so the record shows *why* and not only *what*.\n- Retries are safe (`operation_id`\
    \ replays) and stale decisions are refused (`expected_revision`).\n- A parent\
    \ with open children is skipped by `next` but claimable by name, and claiming\
    \ one hands back a supervision prompt (task-164).\n- Dispatch closes the loop:\
    \ an authorised human decision can start the agent. That is the thing a tracker\
    \ with an MCP server cannot do.\n\n## Shape\n\nSell early, then the boring details.\
    \ Roughly: keep the stateless-agents framing and the ball YAML block, then a strong\
    \ \"it has opinions\" section built from the enforced guarantees above, then the\
    \ existing MCP / React / what-works-today / design / installation sections in\
    \ their current order.\n\nDo not turn it into marketing. Every claim names the\
    \ mechanism that enforces it, because that is the actual differentiator \u2014\
    \ anyone can claim a workflow, few can say the schema refuses to represent the\
    \ broken state."
  context: []
