  body: "Read the rendered page: http://127.0.0.1:8899/_readme_preview/ \u2014 mkdocs\
    \ from worktree aj-286, own port. Branch docs/task-286-readme-positioning, commit\
    \ 86b44e8, full gate green, receipt 86b44e8c.\n\nWHAT CHANGED. \"Why this is not\
    \ another task tracker\" is gone. In its place, above the fold, is \"It is opinionated,\
    \ and the schema does the arguing\" \u2014 three guarantees stated as things the\
    \ model refuses to represent rather than as benefits:\n- a task cannot sit unassigned\
    \ (ball absent iff closed)\n- a handoff cannot be silent (ball_prompt required\
    \ whenever the ball is set)\n- every open task has a place in line (queue_position\
    \ present iff open), which is what makes \"what should I work on\" have one answer\n\
    \nThen `agentjobs next --why` as the payoff, because it is the command that makes\
    \ the third guarantee visible. Then the softer opinions as bullets, then the loop-closing\
    \ point about dispatch. Everything below is unchanged in substance and in the\
    \ same order.\n\nI PROVED ALL THREE rather than asserting them: constructed each\
    \ violating task and watched Task.model_validate refuse it. The next --why sample\
    \ output is the real renderer's shape, taken from a live run, not invented \u2014\
    \ my first draft had the format wrong and I caught it by running the command.\n\
    \nTWO CLAIMS I DELIBERATELY WEAKENED, and I want you to agree with the call. Queue-position\
    \ uniqueness is NOT model-enforced \u2014 one file cannot see another \u2014 so\
    \ the text says placement holds a lock and `queue check` reports collisions, instead\
    \ of claiming the schema guarantees it. And the no-set_lifecycle claim is scoped\
    \ to the interfaces, because TaskManager.update_task does apply whatever keys\
    \ it is handed (task-254 is the open task for that). Both would have read stronger\
    \ overclaimed, and overclaiming is the exact defect the previous branch spent\
    \ today removing from these docs.\n\nHOUSEKEEPING: the worktree has two uncommitted\
    \ review-scaffolding files \u2014 docs/_readme_preview.md and a nav line in mkdocs.yml\
    \ \u2014 so the page could be rendered. They are NOT in the commit and I will\
    \ revert them before merging. Say the word and I merge, or tell me what to change."
