- id: 3
  ts: '2026-08-23T05:17:38.698546Z'
  actor: claude
  type: question
  body: "**Three findings that are stale or overlapping but are NOT duplicate or superseded,\
    \ so they are raised rather than closed. Section 5.1: `wont_do` is your judgement,\
    \ and rewriting a spec is not groom's job.**\n\n## Q1 \u2014 task-018's stated\
    \ example is dead, but the defect it names is alive and has seven fresh instances\n\
    \ntask-018 opens with \"task-060 is `closed`/`completed` with ten open children.\"\
    \ **That is no longer true.** All fifteen of task-060's children are now closed\
    \ \u2014 068 through 078, 080, and 157 through 159 \u2014 so a reader checking\
    \ the example today finds nothing wrong and may conclude the task is stale.\n\n\
    It is not stale. The same pathology has seven current instances:\n\n| Open task\
    \ | Parent | Parent state |\n|---|---|---|\n| task-147, 148, 149, 150, 151, 152\
    \ | task-078-agent-loops | **closed** |\n| task-156 | task-080-dispatch-model-profiles\
    \ | **closed** |\n\nSix of the acceptance-check and loop-driver tasks, plus the\
    \ difficulty-field task, are sitting under parents that closed out from under\
    \ them. So task-018's second half \u2014 \"and nothing can reopen it\" \u2014\
    \ is now the live problem: seven tasks whose umbrella is gone.\n\n**The ask:**\
    \ task-018's `spec.intent` names an example that no longer demonstrates anything.\
    \ Groom will not rewrite it. Do you want a `flesh-out`-style pass to swap the\
    \ example for the seven live ones, or is a `note` on task-018 pointing at this\
    \ entry enough? Its queue position is a human anchor you set on 2026-08-21 and\
    \ this run did not touch it.\n\n## Q2 \u2014 task-196 and task-261 overlap on\
    \ the restart defect; fold or keep?\n\ntask-261 (Big Dawg draft) says under F2/F9\
    \ that \"restart with default flags on this machine reproduces the second-server-on-8765\
    \ incident ENGINEERING.md warns about\", and its fix is to make `status`/`stop`/`restart`\
    \ probe `/api/version` instead of matching a port. That is the same territory\
    \ as task-196, \"restart can add a server generation instead of replacing one\"\
    .\n\nThey are not the same task. task-196 carries evidence 261 does not: two live\
    \ generations on 2026-08-20 with the older one holding 8876, and \u2014 the part\
    \ that is genuinely a different defect \u2014 a `serve` whose port was already\
    \ taken printed `Started server process`, **ran startup reconciliation and wrote\
    \ to disk** concluding a run was orphaned, *then* failed to bind and exited. An\
    \ identity probe does not fix a process that mutates state before discovering\
    \ it cannot listen.\n\n**The ask:** fold 196's evidence into 261 and close 196\
    \ as duplicate, or keep 196 as the write-before-bind defect and let 261 own only\
    \ the identity question? I lean to keeping both \u2014 but that is a spec-boundary\
    \ call, which is yours. Not proposed for closure either way.\n\n## Q3 \u2014 task-015\
    \ may be mooted by task-238, and is not yet\n\ntask-015 is \"stop one long `ball_prompt`\
    \ from swallowing a task list row\", about the Status column in the wide multi-column\
    \ task table. task-238 (Shell 3, under the task-235 epic) replaces that table\
    \ with a narrow collapsible sidebar tree you pick from \u2014 a surface with no\
    \ Status column at all.\n\nIf task-235 ships as specced, task-015 has nothing\
    \ left to fix. But **task-235 has not shipped and none of its five children has\
    \ been claimed**, so closing 015 now would be closing a live defect against an\
    \ intention. Left open deliberately. Worth re-checking after task-239 lands."
