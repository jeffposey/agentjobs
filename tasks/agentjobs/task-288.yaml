  ts: '2026-08-23T05:17:17.034826Z'
  actor: claude
  type: progress
  body: "**The closure proposal. Four items over 125 open tasks. Nothing is closed;\
    \ strike anything and what remains is what executes.**\n\n## 1. task-199 \u2014\
    \ close as **duplicate** of task-198\n\nSame defect, same function, same incident.\
    \ Both name `set_project_enabled` round-tripping `~/.agentjobs/dispatch.yaml`\
    \ through `yaml.safe_dump` (`src/agentjobs/dispatch/config.py`, cited at :1034/:1101\
    \ by 198 and :1102 by 199). Both were filed off the same event: `job-hunting`\
    \ enabled from the browser on 2026-08-20, 38 comment lines destroyed. Filed twelve\
    \ minutes apart \u2014 198 at 20:33:06Z, 199 at 20:45:14Z.\n\n**Which one survives\
    \ is a genuine choice and I am not confident enough to make it silently.** task-198\
    \ is the earlier record, carries an `effort` estimate and `eligible: [codex, claude]`\
    \ so it is dispatchable today, and has six acceptance criteria and two deliverables.\
    \ task-199 has the better prose \u2014 a fuller \"ways out\" section and a sharper\
    \ statement of why a machine-local file with no git history makes the loss unrecoverable\
    \ \u2014 but no eligible runners and no deliverables.\n\nProposed: **close 199,\
    \ keep 198.** Say the word and it goes the other way instead. Either way the survivor\
    \ loses some analysis, and groom is not allowed to merge the two specs \u2014\
    \ that would be rewriting one, which section 5.1 forbids.\n\n## 2. task-011 \u2014\
    \ close as **superseded**\n\ntask-011 is \"merging frontend code does not update\
    \ the running server, and nothing says so\", filed 2026-08-17 after task-008's\
    \ fix merged and Jeff hit the same bug against a two-hour-old bundle. It named\
    \ three possible fixes.\n\nTwo of them have since been built or filed:\n- **Fix\
    \ 1 and 3 shipped in task-241.** `src/agentjobs/dispatch/finish.py` runs `npm\
    \ run build` in the serving clone when the merge touched `frontend/` (`rebuild_frontend`,\
    \ :686), runs the machine's configured restart (`restart_server`, :723), and proves\
    \ the running process is serving the merge before closing. ENGINEERING.md's merge\
    \ gate step 6 carries the same steps for a hand-merge.\n- **Fix 2 is task-014**,\
    \ open \u2014 \"detect a bundle talking to a server it was not built against\"\
    \ is exactly task-011's \"make the server detect it\".\n\nSo there is nothing\
    \ left in task-011 that is not either shipped or separately filed. **Caveat, stated\
    \ plainly: the scripted finish only covers projects with `finish.enabled`.** A\
    \ hand-merge on a machine without it still has the gap, and the only thing closing\
    \ it there is a rule in a document \u2014 which is precisely the failure mode\
    \ task-011 complained about. If you would rather keep 011 open as the standing\
    \ record of that residual, that is a defensible read and this item should be struck.\n\
    \n## 3. task-007 \u2014 close as **superseded** by task-275\n\ntask-007 redirects\
    \ `/` and the legacy `/p/...` paths to their `/app/` equivalents, and says in\
    \ its own description that the Jinja UI \"stays reachable at an explicit legacy\
    \ path for now \u2014 retiring it outright is a larger job and deliberately not\
    \ this task.\"\n\ntask-275 does the larger job: delete `web_router`, `web_legacy_router`\
    \ and `api/templates/` outright, on a stored-XSS finding (`x-markdown` \u2192\
    \ `el.innerHTML = marked.parse(content)`, no sanitiser, over `ball_prompt` and\
    \ every log entry body). If 275 lands there is no legacy UI left for 007 to redirect\
    \ away from, and 007's careful provisions for keeping it reachable become work\
    \ against the direction.\n\n**Caveat: task-275 is still a `draft` at `human/spec`\
    \ \u2014 you have not ratified it.** This close bets on a direction you have not\
    \ signed. If you would rather 007 stay open until 275 is promoted, strike this\
    \ item and it can be re-proposed then. What is not defensible is leaving both\
    \ open and having someone work 007 into a router that 275 deletes.\n\n## 4. task-123\
    \ \u2014 close as **superseded** by task-174 + task-175\n\ntask-123 is a *decision*\
    \ task, raised 2026-08-18: \"Decide whether AgentJobs should do that expansion\
    \ itself, and if so, where the intelligence lives.\"\n\nBoth halves of that question\
    \ are now specced elsewhere:\n- **Where the intelligence lives** \u2014 task-174,\
    \ \"Decide how AgentJobs is allowed to call a model at all.\"\n- **Whether and\
    \ how it expands** \u2014 task-175, a checkbox on the create and report forms,\
    \ checked by default, that has a model expand what you typed into a real spec\
    \ with the draft landing in the form. task-218 covers the same transformation\
    \ on the agent side, as the `flesh-out` playbook writing onto an existing thin\
    \ task.\n\nA decision task whose decision has been made in three other records\
    \ is superseded by them. Nothing in 123 is lost: 174 inherits the \"where does\
    \ it live\" question and 175 inherits the reporter-form case 123 was raised about.\n\
    \n## Tally if all four are approved\n\n125 open \u2192 121. Two duplicates collapse\
    \ to one; three superseded records retire into work that is either shipped or\
    \ specced. No file deleted, no spec touched, no position changed by this run."
