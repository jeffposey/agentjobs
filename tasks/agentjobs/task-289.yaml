ball_prompt: '**The reorder is done and needs no approval - section 5.2 requires no
  gate, and the reasons are on the moves. This is here for the four things it could
  not touch.**


  Read log entry 3. In order of how much they cost you:


  1. **The whole CRITICAL band is unclaimable** - four drafts at human/spec, two active.
  `agentjobs next` walks past all six. Three of the four drafts are the unauthenticated-tailnet-API
  chain. Promoting them is a lifecycle change and reorder does not do lifecycle.

  2. **task-275** is a stored XSS banded HIGH while four security drafts sit in CRITICAL.
  Should it be CRITICAL?

  3. **The playbooks epic is split across two bands** - task-218 and task-219 are
  MEDIUM while their four siblings are HIGH, so task-211 cannot close until MEDIUM
  comes up. task-219 in particular has no dependency on any playbook machinery and
  could be worked today.

  4. **task-010** reads as HIGH to me and sits at the head of MEDIUM.


  Log entry 2 has the anchor finding, which is the most interesting thing this run
  produced and is a design defect rather than a backlog one: **the design derives
  anchors from the actor of the latest queue_move, and on this corpus that finds three,
  while twenty-two of your own decisions were applied by an agent and so do not count.**
  Raised on task-217 as a question, with three candidate fixes. This run treated the
  task-209 positions as effective anchors and left the head of HIGH alone rather than
  re-deriving an order you approved two days ago.


  Close this record once you have read it, or leave it open if any of the four questions
  turns into work.'
