- id: 2
  ts: '2026-08-23T05:18:50.770929Z'
  actor: claude
  type: decision
  body: "**Anchors: how they were derived, and the finding that the design's derivation\
    \ rule would have found almost none.**\n\nSection 5.2 derives an anchor from provenance:\
    \ the actor of a task's latest `queue_move`. A human actor makes the position\
    \ an anchor. I applied that to all 125 open tasks. Thirty-one carry a `queue_move`\
    \ at all; **three have a human actor**:\n\n| Task | Anchor set | Jeff's stated\
    \ reason |\n|---|---|---|\n| task-021 | 2026-08-21 | \"Moved to the top of the\
    \ high band... He wants epics dispatchable as a unit\" |\n| task-022 | 2026-08-21\
    \ | \"This is the task he actually asked for\" |\n| task-018 | 2026-08-21 | \"\
    this defect has now fired twice\" |\n\nAll three were respected and none was overridden.\
    \ Checked for expiry, which section 5.2 triggers on close, band change, or a `needs`\
    \ dependency resolving: task-022 needs task-164 (closed 2026-08-21T04:43Z, *before*\
    \ the anchor was set, so no expiry) and task-021 (still open). No anchor has expired.\
    \ None of the three moved.\n\n## The finding: actor provenance misses decisions\
    \ a human made and an agent applied\n\n**Twenty-eight of the thirty-one latest\
    \ moves have actor `claude`, and a large share of those are Jeff's own decisions.**\
    \ Read the bodies:\n\n- Twenty of them say *\"task-209: applying the ordering\
    \ approved by Jeff on 2026-08-21\"* \u2014 an entire ordering pass Jeff reviewed\
    \ and approved, executed by an agent.\n- task-211's says *\"Jeff, 2026-08-21:\
    \ move the playbooks epic to the head of the high band \u2014 'I want to start\
    \ using playbooks'\"*.\n- task-017's says *\"Jeff asked for this a second time\
    \ on 2026-08-21, in nearly the same words as the first ask\"*.\n\nUnder the rule\
    \ as written, **not one of those positions is an anchor**, because the hand on\
    \ the verb was an agent's. So the mechanism designed to make a human move sticky\
    \ would, on this corpus, protect three positions and leave twenty-two of Jeff's\
    \ decisions re-derivable by the next run.\n\nThat is not a small edge case. It\
    \ is the majority case, and it is *created by the product working as intended*:\
    \ AgentJobs is built so an agent executes what a human decided, which means the\
    \ actor field records the executor and the reason field records the decider.\n\
    \n**What this run did about it:** treated the task-209-approved positions and\
    \ the two explicitly-quoted ones as **effective anchors** and left them alone,\
    \ and said so here rather than silently re-deriving an order Jeff approved two\
    \ days ago. The head of HIGH \u2014 the playbooks epic, then task-017, then the\
    \ 021/022/018 trio \u2014 was not touched for this reason.\n\n**Rejected alternative:**\
    \ deriving anchors strictly by actor and re-ordering the head of HIGH on its merits.\
    \ It would have been faithful to the letter of section 5.2 and would have thrown\
    \ away a human decision on a technicality about who typed the command. The design's\
    \ own justification for anchors is that the human was the informed party; that\
    \ is a fact about who decided, not about who executed.\n\n**What task-217 should\
    \ do with this** \u2014 raised there as a question, not decided here. Three candidates,\
    \ roughly in order of how much I like them: have the manager record a `decided_by`\
    \ alongside the actor on a `queue_move` so provenance can name the decider; or\
    \ let a move declare itself as applying a human decision and treat that as human\
    \ provenance; or accept that agent-applied human decisions are not anchors and\
    \ say so explicitly in the brief, so the next run does not have to make this call\
    \ in the dark. What should not happen is the brief shipping with a derivation\
    \ rule that is silently wrong most of the time."
