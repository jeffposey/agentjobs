- id: 3
  ts: '2026-08-23T05:19:11.972282Z'
  actor: claude
  type: question
  body: "**Four things the reorder could not fix, because fixing them means changing\
    \ a band, a lifecycle or a spec \u2014 none of which reorder may touch. All four\
    \ are yours.**\n\n## Q1 \u2014 the entire CRITICAL band is unclaimable, and reordering\
    \ it changes nothing\n\nSix tasks, **zero claimable**. task-233 is `active`/`agent`/`hold`;\
    \ task-248 is `active`/`human`/`review`; task-244, 245, 247 and 249 are all `draft`\
    \ at `human`/`spec`. So the band that should be the front of the queue hands an\
    \ agent nothing, and `agentjobs next` walks straight past all six into HIGH.\n\
    \nI ordered them anyway, because the order is what you will read when you triage\
    \ them. But **the ordering is cosmetic until you promote them.** Four drafts stand\
    \ between the queue and its own top band, and three of them are the unauthenticated-API\
    \ chain. Promoting is a lifecycle change; reorder does not do lifecycle.\n\n##\
    \ Q2 \u2014 task-275 is a stored XSS sitting in HIGH while four security drafts\
    \ sit in CRITICAL\n\nI moved it to the head of the audit-draft cluster and left\
    \ its band alone, because reorder does not reprioritise. But `x-markdown` doing\
    \ `el.innerHTML = marked.parse(content)` over `ball_prompt` and every log entry\
    \ body, on a router still mounted and still proxied to the tailnet, is the same\
    \ *kind* of finding as task-244 and is banded one level below it. Should it be\
    \ CRITICAL?\n\n## Q3 \u2014 the playbooks epic is split across two bands\n\ntask-211\
    \ is HIGH with six children. **task-214, 215, 216 and 217 are HIGH; task-218 and\
    \ task-219 are MEDIUM.** A parent cannot close while a child is open, so task-211's\
    \ completion is gated on two tasks the queue will not offer until MEDIUM comes\
    \ up \u2014 which, with 73 open in HIGH, is a long way off. Either 218/219 belong\
    \ in HIGH with their siblings, or 211 is not really a HIGH-band epic. Both are\
    \ band changes.\n\nWorth noting alongside: task-219 is the one child of the epic\
    \ with **no dependency on any playbook machinery** \u2014 the design says so explicitly,\
    \ because it was retargeted to the queue program. It could be worked today and\
    \ is sitting in MEDIUM behind everything.\n\n## Q4 \u2014 task-010 is arguably\
    \ in the wrong band, and has been since it was filed\n\nIt is at the head of MEDIUM.\
    \ Its defect \u2014 `test_agentjobs_context_paths_exist` failing in every worktree\
    \ and every fresh clone \u2014 hits **every agent in this repository**, because\
    \ ALLAGENTS.md requires them all to work in worktrees and run the gate. A red\
    \ gate an agent cannot attribute to its own change is the failure that trains\
    \ people to ignore red. That reads as HIGH to me. Left in MEDIUM, at its head,\
    \ because the band is not mine to change."
