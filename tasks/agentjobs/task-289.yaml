    \ still `draft`/`high`. The band question is written into its own `queue_move`\
    \ entry, on that task, where whoever triages it will read it. |\n| Q3 | Playbooks\
    \ epic split across two bands | **Moot.** task-214, 215, 216 and 219 all closed\
    \ today. The two remaining children \u2014 task-217 and task-218 \u2014 are both\
    \ `active` and being worked, so 218's MEDIUM band no longer gates task-211 behind\
    \ 73 HIGH tasks. The condition that made it a question dissolved. |\n| Q4 | task-010\
    \ in the wrong band | **Moot.** Closed as `superseded`. |\n\nThe anchor-derivation\
    \ finding from entry 2 \u2014 the one that matters most, since it says section\
    \ 5.2's rule would protect three positions out of twenty-five \u2014 is recorded\
    \ on **task-217**, which is active. It is not this record's to carry.\n\n**One\
    \ thing I am not doing, and saying so rather than doing it quietly:** I am not\
    \ filing a task for \"promote or reject the nine security drafts\" (task-244,\
    \ 245, 247, 249, 256, 257, 261, 263, 275, all `draft` at `human`/`spec`). That\
    \ is a real standing decision and nothing tracks it as a unit. But it is yours,\
