spec:
  summary: The run record for a reorder pass executed by hand on 2026-08-23, before
    playbooks/reorder.md exists (task-217 is blocked behind task-215). Eight queue
    moves were made and each carries its reason in its own queue_move entry; this
    record holds what the moves cannot - what was considered and left alone, and why.
  intent: Section 5.2 requires no gate, so unlike the groom run of the same date this
    one wrote directly. What makes that safe is recorded reasoning, and reasoning
    about a move that did not happen has nowhere to live except a run record.
  description: 'A hand-run of the `reorder` brief in docs/playbooks-design.md section
    5.2, over the 125 open tasks as of 2026-08-23. The last full ordering pass was
    task-209 on 2026-08-21; everything filed since - the Big Dawg audit output, task-243,
    task-287 - landed at the foot of its band by filing order rather than by any judgement.


    ## The eight moves


    Each move''s own `queue_move` entry carries its reason. In summary:


    **CRITICAL, ordered exactly** - the band is six tasks, so all of it is head. New
    order: **task-244, task-245, task-249, task-247, task-248, task-233.** The first
    three are one attack read at three depths (unauthenticated API, injection into
    a pre-approved `git merge`, run-identity leak) and are cheapest to fix together.
    task-247 is integrity rather than exposure. task-248 is already active in review,
    so its position gates nothing. task-233 went from the head to the foot: it is
    held by an agent, it is measurement rather than defect, and its own deliverable
    has landed.


    **HIGH** - the head was left exactly as it stood (see anchors below). Two moves
    in the body: **task-198** promoted from 6100 to just behind task-196, best value-per-effort
    in the band; **task-275** promoted from 14200, dead last of 73, to the head of
    the audit-draft cluster, because a stored XSS should not sort below every ergonomics
    defect filed the same day.


    **MEDIUM** - **task-243** promoted from 7200 to second, behind task-010. Both
    are gate-reliability defects that fire on work their author never touched, and
    task-233''s move to 32-core pytest makes 243''s load-sensitivity worse rather
    than better.


    **LOW** - four tasks, triage scan only. Nothing there belongs near the head.


    ## What was deliberately not done


    - **Nothing was closed, reprioritised or rewritten.** The four closures proposed
    on the same date belong to the separate groom run and are still awaiting approval;
    the tasks proposed for closure were left exactly where they were, so that if any
    proposal is struck nothing has to be undone.

    - **No task''s band was changed**, though three arguably want one - see the questions
    on this record.

    - **No scoring.** Every placement above is an argument, per section 12 of docs/task-selection-design.md,
    which section 5.2 leaves binding.

    - **The tail of HIGH below the audit cluster was scanned, not ordered.** Graded
    effort: precision deep in the queue decays before it is consumed.'
  constraints: 'Section 5.2 bounds, all binding: graded effort by depth, a reason
    recorded on every move, triggered rather than continuous, anchors respected or
    overridden with stated grounds, and no numeric ranking function anywhere.'
  out_of_scope: Closing, promoting, reprioritising or rewriting anything. The four
    closures proposed the same day are the groom run's, and are gated on Jeff's approval
    there.
  context:
  - path: docs/playbooks-design.md
    why: Section 5.2 is the brief this run followed - graded effort, recorded reasons,
      anchor mechanics and their expiry.
  - path: docs/task-selection-design.md
    why: Section 12's rejection of scoring, which section 5.2 leaves binding on every
      playbook.
