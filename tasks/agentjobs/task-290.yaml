  body: "# Closure proposal \u2014 groom run, 2026-08-23\n\n**Nothing has been closed.**\
    \ This entry is the proposal, recorded before any close, as\n`playbooks/groom.md`\
    \ \xA73 requires. What executes, if anything, is exactly the list you\napprove\
    \ and nothing else.\n\n## Scope of the sweep\n\n119 open tasks (80 `ready`, 34\
    \ `draft`, 5 `active`). Excluded from closure per the\nbrief's \xA71: the run\
    \ task itself, the 5 `active` tasks (task-211, task-216, task-224,\ntask-233,\
    \ task-290), and 12 parents holding open children. **104 tasks judged.**\n\nMethod:\
    \ clustered by category, tag and subject noun, then read the whole record of every\n\
    candidate pair rather than the titles. A token-overlap scan over all 119 open\
    \ tasks\n(Jaccard on title + summary, threshold 0.16) surfaced 14 pairs; every\
    \ one was a\nparent/child or two siblings of the same epic, so none is a duplicate.\
    \ Premises were\nchecked against the code and against `git log`, not assumed \u2014\
    \ three candidates that\nlooked stale turned out not to be, and are named below.\n\
    \n## Proposed closures \u2014 3\n\n### 1. task-010 \u2014 `superseded`\n\n*A corpus\
    \ test can only pass on one machine, and fails in every worktree*\n\n**Reason.**\
    \ The premise no longer holds. The test was changed to exempt a task's own\npending\
    \ deliverables, which is precisely the fix this task asks for.\n\n**Evidence.**\
    \ Commit `eee75fb` (2026-08-17), \"fix(tests): stop requiring a task's own\nunbuilt\
    \ deliverables to exist\". Its message states the same failure this task's\ndescription\
    \ states. `tests/test_task_corpus.py:122` now carries the exemption and its\n\
    docstring reproduces the argument. Verified live in this worktree, which has no\n\
    locally-excluded files copied in: `pytest -k context_paths` gives **1 passed**.\n\
    Acceptance criteria 1 and 3 are satisfied by that commit; criterion 2 (\"the chosen\
    \ fix\nis recorded as a decision\") is satisfied by the commit body rather than\
    \ by a log entry\non this task.\n\n### 2. task-100-dependency-cycle-deadlock \u2014\
    \ `superseded`\n\n*A `needs` cycle deadlocks silently*\n\n**Reason.** A cycle\
    \ is no longer silent. It is detected, and it is reported on three\nsurfaces a\
    \ human or an agent reads.\n\n**Evidence.** `manager._needs_cycles` (`manager.py:425`)\
    \ computes cycles into\n`DependencyFacts.needs_cycles`; commit `ed1f21c` (2026-08-13),\
    \ \"feat: surface task\ndependency state\". It reaches:\n\n- the validator \u2014\
    \ `validation.py:326` emits `dependency-cycle: needs cycle a -> b: every\n  task\
    \ in it is permanently unclaimable, and no listing will say so`, shipped in\n\
    \  `dc04330` (2026-08-17);\n- the React app \u2014 `DependencyState.tsx:17` renders\
    \ `Cycle: a \u2192 b`, and\n  `DependencyGraph.tsx:57` flags it;\n- the API and\
    \ MCP \u2014 `api/models.py:34`, `mcp/read_tools.py:557`.\n\nTests: `tests/test_manager.py:392`\
    \ covers a two-task cycle end to end, and\n`tests/test_validate.py:330` writes\
    \ raw YAML by hand and asserts the validator reports\nit \u2014 which is this\
    \ task's acceptance criterion 2, \"a cycle present in hand-edited files\nis still\
    \ surfaced\".\n\n**Residue, stated so you can strike this item if it matters.**\
    \ Acceptance criterion 3\nasks for a three-task cycle test as well as a two-task\
    \ one; only the two-task case is\ncovered. The design choice \u2014 report rather\
    \ than refuse at write time \u2014 was made in code\nand never recorded as a decision,\
    \ which criterion 1 also asks for. Neither changes the\nfact that the deadlock\
    \ is no longer silent.\n\n### 3. task-183-cli-batch-run-always-interrupted \u2014\
    \ `duplicate` of task-278\n\n*A batch run started from the CLI always ends interrupted,\
    \ however well it went*\n\n**Reason.** The same defect was filed twice and fixed\
    \ under the other id.\n\n**Evidence.** task-278, \"Keep CLI batch dispatch supervised\
    \ through completion\", is\n`closed`/`completed` with all three acceptance criteria\
    \ `met`. Its summary \u2014 a\nsuccessful batch run launched by `agentjobs dispatch\
    \ run` staying permanently `running`\nbecause its daemon supervisor died with\
    \ the CLI process \u2014 is task-183's description.\nFixed in `c33ca00` (2026-08-22),\
    \ \"fix(task-278): retain batch supervision in CLI\":\n`cli.py:1193` now prints\
    \ \"Waiting for the batch run to record its outcome\" and joins the\nsupervisor,\
    \ and `tests/test_dispatch_cli.py:194`\n(`test_waits_for_a_batch_run_to_write_its_terminal_record`)\
    \ pins it.\n\n**Residue.** task-183's acceptance criterion 2 asks that \"killing\
    \ `agentjobs serve` still\nterminates its own batch runs\" be pinned by a test.\
    \ That behaviour is unchanged and was\nnever broken, but I did not find a test\
    \ pinning it. Say the word and it becomes a task\nrather than being lost inside\
    \ this close.\n\n## Questions \u2014 3. Nothing here is proposed for closure.\n\
    \n### Q1. task-196 and task-261 overlap, and neither contains the other\n\ntask-261\
    \ (\"CLI knows whose server it is\") covers task-196's incident class \u2014 its\
    \ own\nevidence names the stale second server as \"enforced nowhere\" \u2014 and\
    \ its acceptance says\n`restart` with nothing listening starts nothing. But task-196\
    \ asks for two things\ntask-261 does not: that a `serve` which cannot bind its\
    \ port reports that and exits\nnon-zero having written nothing, and that a restart\
    \ provably leaves exactly one process,\nverified from the process table rather\
    \ than by a passing test. Per the brief, two records\nthat each hold something\
    \ the other lacks are not duplicates. **Do you want them merged,\nor task-196\
    \ narrowed to the bind-failure half?** I have changed neither.\n\n### Q2. task-269's\
    \ scripted-finish premise changed today\n\ntask-269 asks, among seven findings,\
    \ to \"cut the inactive scripted-finish prose\" \u2014 634\nwords describing a\
    \ feature \"switched off on this machine\". You turned `finish.enabled`\non at\
    \ about 08:11 today, so that prose now describes live behaviour and the finding\
    \ no\nlonger applies as written. The other six findings are untouched. **Worth\
    \ an edit to that\ntask's spec** \u2014 which groom may not make, so it is here\
    \ instead.\n\n### Q3. Two epics are converging on the same embed problem\n\ntask-137\
    \ (\"Embedded AgentJobs: drop the helper UI into an app you are building\", 9\
    \ open\nchildren) and task-167's child task-169 (\"The same menu, in somebody\
    \ else's React app,\nin one import\") are both \"put an AgentJobs surface inside\
    \ a host React app\", as is\ntask-139 (\"Lift the issue reporter out of the AgentJobs\
    \ app so a host app can render\nit\"). That is an architecture question about\
    \ how the two epics divide, not a duplicate\npair, and merging specs is outside\
    \ groom's executable set. **Raised, not acted on.**\n\n## Candidates checked and\
    \ rejected\n\nWorth reading: a sweep is only as good as what it declined to propose.\n\
    \n- **task-105** (\"Generate the next task number from all slugged task IDs\"\
    ) looked stale\n  because this run's own task was created as `task-290`, the correct\
    \ next number. It is\n  not fixed. `storage.py:621` still does `int(stem.split(\"\
    -\", maxsplit=1)[1])`, which\n  raises on `task-104-react-readme-screenshots`\
    \ and skips past it; the symptom is masked\n  only because unslugged ids currently\
    \ dominate the corpus. The bug is intact.\n- **task-012** (error boundary) \u2014\
    \ no `ErrorBoundary` or `componentDidCatch` anywhere in\n  `frontend/src`. Premise\
    \ holds.\n- **task-013** (sourcemaps) \u2014 no `sourcemap` setting in `frontend/vite.config.ts`.\n\
    \  Premise holds.\n- **task-053 / task-063** (schema v2 CLI verbs) \u2014 `agentjobs\
    \ --help` lists no `claim`,\n  `handoff`, `log`, `close` or `inbox`. Premise holds.\n\
    - **task-198** (enabling dispatch from the UI destroys comments in `dispatch.yaml`)\
    \ \u2014\n  `dispatch/config.py:1260` still writes with `yaml.safe_dump`. Premise\
    \ holds.\n- **task-021 / task-201** \u2014 both say \"posture\", and they are\
    \ different subjects: what a\n  dispatched run may do (merge, push) versus what\
    \ kind of supervision a supervisor\n  performs. Not duplicates.\n- **task-262\
    \ / task-263** \u2014 both concern reserved and system actors, but 262 is about\n\
    \  what `agentjobs validate` reports and 263 about what the write path refuses.\
    \ Different\n  verbs, different surfaces. Their fixes may pull against each other;\
    \ that is for whoever\n  works them, not a reason to close either.\n- **task-014\
    \ / task-260** \u2014 bundle-versus-server API skew detection is not PWA cache\n\
    \  staleness, though both surface as \"the app is out of date\".\n- **task-018\
    \ / task-254** \u2014 task-254 makes `reopen` a verb, which is half of task-018;\n\
    \  the other half, a guard against closing a parent with open children, is nowhere\
    \ else.\n  Not superseded.\n- **task-173-transcription-fallback** \u2014 explicitly\
    \ says \"build it or close it\", to be\n  closed unbuilt if task-171 finds the\
    \ native paths sufficient. task-171 is still open,\n  so the condition has not\
    \ been met. Left alone.\n\n## What executing an approved list would do\n\nEach\
    \ approved item is closed through the managed `close` verb with the approved outcome,\n\
    each close body naming task-290 and, for item 3, naming task-278 as the survivor.\
    \ No\nfile is deleted, no spec rewritten, no priority changed, no queue position\
    \ moved. Then\ntask-290 closes with the tally: proposed, approved, executed, refused,\
    \ deferred.\n"
