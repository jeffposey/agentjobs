ball_prompt: "**Approve, strike or reject each of these three closures. Nothing has\
  \ been closed and nothing will close without your answer.** The full evidence, the\
  \ questions and everything the sweep declined to propose are in log entry 3 above;\
  \ this prompt is complete enough to decide from.\n\nThe sweep read 119 open tasks\
  \ and judged 104 of them (excluded: this run task, 5 tasks an agent is actively\
  \ working, and 12 parents holding open children).\n\n**1. task-010 \u2014 close\
  \ as `superseded`.** *A corpus test can only pass on one machine, and fails in every\
  \ worktree.* The fix shipped: commit `eee75fb` (2026-08-17) exempted a task's own\
  \ pending deliverables from `test_agentjobs_context_paths_exist`, which is exactly\
  \ what this task asked for. Verified live \u2014 `pytest -k context_paths` passes\
  \ in this worktree, which is where it used to fail.\n\n**2. task-100-dependency-cycle-deadlock\
  \ \u2014 close as `superseded`.** *A `needs` cycle deadlocks silently.* It is no\
  \ longer silent. `ed1f21c` (2026-08-13) computes `needs_cycles` into the dependency\
  \ facts and `dc04330` (2026-08-17) put it in `agentjobs validate`; it also renders\
  \ in the React app as \"Cycle: a \u2192 b\" and is exposed over the API and MCP.\
  \ Tests cover the two-task cycle both in the manager and against hand-written YAML.\
  \ *Residue, if you want to strike this one:* its acceptance also asked for a three-task\
  \ cycle test, which does not exist, and for the report-versus-refuse choice to be\
  \ recorded as a decision, which was never written down.\n\n**3. task-183-cli-batch-run-always-interrupted\
  \ \u2014 close as `duplicate` of task-278.** *A batch run started from the CLI always\
  \ ends interrupted.* task-278 is closed/completed with all three criteria met and\
  \ its summary is this task's description word for word in substance; fixed in `c33ca00`\
  \ (2026-08-22), pinned by `test_waits_for_a_batch_run_to_write_its_terminal_record`.\
  \ *Residue:* task-183 also wanted a test pinning that killing `agentjobs serve`\
  \ still terminates its own batch runs \u2014 unchanged behaviour, but I found no\
  \ such test. Say so and it becomes its own task instead of being lost in this close.\n\
  \n**Three questions, none of them proposed for closure.** (Q1) task-196 and task-261\
  \ overlap on the stale-second-server incident but each holds something the other\
  \ lacks \u2014 merge them, or narrow task-196 to the bind-failure half? (Q2) task-269\
  \ asks to cut prose describing a scripted finish that is \"switched off on this\
  \ machine\"; you turned it on this morning, so that one of its seven findings no\
  \ longer applies. (Q3) task-137's embed epic and task-167's task-169/task-139 are\
  \ converging on the same \"AgentJobs surface inside a host React app\" problem \u2014\
  \ an architecture call, not a duplicate pair.\n\n**How to answer.** \"All three\"\
  \ approves the list as it stands. To approve partially, name the ids you want closed,\
  \ or name the ones to strike \u2014 the executed set is exactly what you state and\
  \ nothing else, and an item you are unsure about is treated as not approved rather\
  \ than interpreted.\n\nNote the merge posture: **task-216 will merge on its own\
  \ approval, and this run task stays open until you answer.** They are separate decisions\
  \ \u2014 approving the branch is not approving these closures.\n"
