  body: "# A `demoted_blocker` warning, kept rather than undone \u2014 and the brief\
    \ could not say so where it told me to\n\nPromoting **task-295** in MEDIUM returned:\n\
    \n> `demoted_blocker` \u2014 This pushed task-142-embed-settings-and-identity\
    \ (1 open task needs it), task-145-embed-zero-config-wiring (1 open task needs\
    \ it), task-150-chain-authorization (1 open task needs it) down the 'medium' band.\
    \ Other open work is waiting on them.\n\n**The move is kept.** \xA75 says the\
    \ honest response is often to undo, so here is the grounds for not doing so.\n\
    \n**All three demoted tasks are themselves unclaimable, and their prerequisites\
    \ are nowhere near the head.** task-142 and task-145 both wait on task-141, still\
    \ open; task-150 waits on task-149, still open. So nothing can pick any of them\
    \ up today whatever position they hold, and moving one task ahead of them changes\
    \ nothing about when they are worked \u2014 it changes only what a reader sees\
    \ above them. The warning is measuring the shape of the dependency graph, correctly,\
    \ and in this instance that shape is already what is stopping them rather than\
    \ the order is.\n\nWeighed the other way: what was promoted is a live defect on\
    \ a surface Jeff uses daily, made reachable by a merge that landed tonight. What\
    \ was demoted cannot start. That is not a close call.\n\nI checked this rather\
    \ than assumed it \u2014 `queue list --band medium` reports the exclusion rule\
    \ beside each of the three.\n\n## The brief asked for something the surface cannot\
    \ do, and is fixed\n\n\xA75 said: *\"If you keep it, the reason must say you saw\
    \ this and why the promotion still wins.\"*\n\n**The reason is the move body,\
    \ and the move body is written before the warning exists.** The warning is returned\
    \ *by* the write. The only way to obey that sentence literally is to move the\
    \ task a second time purely to reword it \u2014 churn, which the same document\
    \ is bounded against in \xA73 and \xA79, to record a fact nobody's ordering depends\
    \ on.\n\n\xA77.2 already had the right answer for exactly this class of thing:\
    \ *\"Log the decisions the moves do not carry: an anchor overridden and why, **a\
    \ warning you kept a move over**, a bucket you drew and the principle behind it.\"\
    * So the two sections disagreed, and the one that was impossible was the one a\
    \ run reads at the moment the warning appears.\n\n**Fixed in `d576ba4`**, project\
    \ copy and shipped reference together: \xA75's `demoted_blocker` clause now sends\
    \ the acknowledgement to the run task, says why it goes there rather than in the\
    \ body, and names the `undo` placement the reply returns \u2014 which turns \"\
    undo the move\" from an exercise into an instruction, since the caller no longer\
    \ has to work out which neighbour restores the previous order.\n\nThis is the\
    \ second live run in this epic to find a defect in the brief it was executing\
    \ (task-216's found two), and it is the argument for sc-3 existing at all: the\
    \ brief read correct until a warning actually fired.\n\n**Note for a later reader:**\
    \ this run's spec pins `playbooks/reorder.md` at sha256 `60b4ad542386`, the content\
    \ at run creation. The file has changed since, by the run itself, for the reason\
    \ above. The pin is a record of what was executed, not a constraint that was violated."
