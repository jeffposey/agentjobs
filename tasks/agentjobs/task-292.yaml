- id: 13
  ts: '2026-08-23T20:41:38.800705Z'
  actor: claude
  type: progress
  body: "**Built, verified and committed on `feat/task-292-pinned-header` as `e16d579`.\
    \ Gate green with no arguments, all ten stages, 168.9s.**\n\n## What is in the\
    \ diff\n\n`frontend/src/components/PrimaryNav.tsx` is new \u2014 the header lifted\
    \ out of `App.tsx`, which now renders `<PrimaryNav projectId={projectId} />` in\
    \ its place. Nothing else about the shell changed.\n\n- `sticky top-0 z-30` on\
    \ the `<header>`, below `IssueReporter`'s `z-40` button and `z-50` modal.\n- `flex-nowrap`,\
    \ with the six destinations in a `hidden min-[960px]:flex` container and a hamburger\
    \ in a `min-[960px]:hidden` wrapper at the left end.\n- The panel is `absolute\
    \ inset-x-0 top-full`, so opening it overlays the page instead of pushing it down\
    \ under a bar that is already pinned. `position: sticky` is a positioned value,\
    \ so the header is already the containing block.\n- Closes on Escape with focus\
    \ returned to the trigger, on a `mousedown` outside the header, on navigation\
    \ (which covers the back button), and on a `matchMedia` change past the breakpoint\
    \ \u2014 so a panel left open at 400px does not reappear on the way back down\
    \ from 1200px.\n\n`frontend/src/styles.css` gains `scroll-padding-top: 4.25rem`.\
    \ See \"what went wrong\" below; it is not cosmetic.\n\n## Three things the browser\
    \ taught me that no amount of reading would have\n\n**1. `min-[960px]:hidden`\
    \ on the burger did nothing.** `styles.css` carries `.touch-target:not(.block)\
    \ { display: inline-flex }`, whose specificity (0,2,0) beats a Tailwind utility's\
    \ (0,1,0) \u2014 so the burger stayed visible at 1280px with the class correctly\
    \ applied. Fixed by moving the breakpoint onto a wrapper `<div>` rather than by\
    \ touching that global rule. Caught only because a Playwright assertion asked\
    \ whether the burger was *hidden* at a desktop width; a jsdom test asserting the\
    \ class would have passed.\n\n**2. Two ways of asking \"does the dialog cover\
    \ the header\" are not the same question.** `element.closest('[role=\"dialog\"\
    ]')` at the top of the viewport returns nothing, because the thing over the header\
    \ is the full-screen scrim and the dialog is a card in the middle of it. The test\
    \ now walks up from the dialog to its nearest `position: fixed` ancestor and asks\
    \ whether the topmost element is inside *that*.\n\n**3. `Playwright.boundingBox()`\
    \ and `getBoundingClientRect()` do not answer the same question.** This whole\
    \ task turns on viewport-relative coordinates, and only one of the two is unambiguously\
    \ that. Every assertion reads the rect from the page.\n\n## What went wrong, at\
    \ length, because two of my guesses were confidently wrong\n\n`queue-order.spec.ts`'s\
    \ cross-band drag went red. It took three attempts to find out why, and the first\
    \ two were wrong in a way worth recording.\n\n- **Guess 1: the pinned header occludes\
    \ the drag handle.** I added `scroll-padding-top`, the test went green in isolation,\
    \ and I nearly reported it fixed. It was not fixed \u2014 it went green because\
    \ running that spec alone gives it a different corpus. *The gate caught what my\
    \ isolated run did not.*\n- **Guess 2: my spec's fixture tasks add rows to the\
    \ shared corpus and push the two dragged rows apart.** I instrumented `dragOnto`\
    \ and the numbers supported it: the target sat 328px below the fold. So I made\
    \ the fixture a single closed task, adding no row to the default list. Still red.\n\
    - **What it actually was.** I stopped guessing and ran the one experiment that\
    \ isolates the variable: `sticky top-0` applied to the *existing* header, nothing\
    \ else changed, no new spec file, identical corpus. Red. So it was the header\
    \ after all, and guess 1 had been right about the mechanism and wrong about the\
    \ fix \u2014 the baseline numbers from `main` show `scrollIntoViewIfNeeded` parking\
    \ the grip at exactly **y = 0**, which is now behind 65px of opaque bar, so the\
    \ press landed on the header and no drag ever began. `scroll-padding-top` does\
    \ not reach it, because that is a CDP primitive rather than the CSSOM `scrollIntoView`.\n\
    \nThe fix is in the helper, not in the header. `dragOnto` used two minimal `scrollIntoViewIfNeeded`\
    \ calls, which cannot work: each scrolls the least it can, so the second undoes\
    \ the first when the rows are far apart, and the least it can do for a row above\
    \ the fold is put it at y=0. It now computes both elements' extent and centres\
    \ the pair in the band the header leaves behind \u2014 and when they cannot both\
    \ fit, it throws a sentence saying how far apart they are and how much room there\
    \ is, instead of surfacing as a drag that silently did nothing.\n\nThat exposed\
    \ the last real fact: **the pair sits 677px apart and a 720px window leaves 655px\
    \ below the pinned bar.** It fit before by 43px. So the two pointer-drag tests\
    \ now take a 900px-tall viewport, which is a property of the harness rather than\
    \ a claim about the product \u2014 the gesture a person makes across a longer\
    \ list is the edge auto-scroll one, which has its own test and is untouched.\n\
    \n`scroll-padding-top` stayed, on its own merits rather than as a fix for this:\
    \ it is what stops a `scrollIntoView`, a fragment link, or the scroll a browser\
    \ performs when Tab reaches an off-screen control from landing underneath the\
    \ bar. `pinned-header.spec.ts` asserts it, and that assertion fails by exactly\
    \ the header's height without it.\n\n## Evidence\n\n- **`frontend/e2e/pinned-header.spec.ts`**,\
    \ 8 tests. Header top and height on all six surfaces at 1280x800 and 390x844;\
    \ the Tasks link reached from the bottom of a long page at both (via the burger\
    \ below the breakpoint); inline-links-and-no-burger at desktop; all six destinations\
    \ behind the burger at phone width with the bar the same height open as closed;\
    \ the Report Issue modal covering the bar at both viewports; the `scroll-padding`\
    \ property; and **a negative control** that strips `sticky top-0` at runtime and\
    \ asserts the header does leave the viewport \u2014 so ac-5's \"the assertion\
    \ fails when the pin is removed\" is demonstrated in the suite rather than taken\
    \ on trust.\n- **`frontend/src/components/PrimaryNav.test.tsx`**, 7 jsdom tests\
    \ for the panel behaviour, plus one that reads the component's own source and\
    \ checks every `min-[Npx]:` variant in it agrees with the exported `NAV_INLINE_MIN_PX`.\
    \ Tailwind needs the number as a literal in the class, so nothing else would notice\
    \ the two drifting apart.\n- **Measured in a real browser**, not only in tests:\
    \ at 390, 900 and 1280 the header is `top: 0, height: 65` after scrolling, and\
    \ the burger panel opens over the content. The 900px case is the one worth noticing\
    \ \u2014 it was 128px before.\n\n## What I did not do\n\nThe header's **contents**\
    \ are unchanged: the same eight items, in the same order, with the same labels.\
    \ Below 960px six of them are one tap away instead of zero; nothing was added,\
    \ removed or renamed. That keeps this inside the constraint about task-167/task-168's\
    \ scope, which Jeff's revise had partly reopened.\n\nI also did not touch `frontend/index.html`\
    \ or the viewport meta \u2014 see task-295.\n\n## Filed\n\n- **task-294** \u2014\
    \ the Dashboard fits one screen and never scrolls, from Jeff's *\"Dashboard is\
    \ its own thing, goal with it is to NOT involve any scrolling at all.\"* It carries\
    \ the non-scrolling-frame design this task rejected, and the `dragAutoScroll`\
    \ rewrite that comes with it.\n- **task-295** \u2014 the pinned bar under the\
    \ iOS status bar in the installed PWA. This answers my own question in log entry\
    \ 4: it was hypothetical then and the precondition is real now, so it is filed\
    \ on its own rather than folded in. Its first acceptance criterion is to reproduce\
    \ or refute it on a real device, because it has been read and not seen.\n\nNotes\
    \ recorded on **task-236** (the measurement, and that task-235's rail reopen-trigger\
    \ has fired below 955px) and **task-168** (that there is now a second burger,\
    \ why it does not collide, and a request that it not use a hamburger icon).\n"
