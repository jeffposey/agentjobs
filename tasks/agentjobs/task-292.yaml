- id: 4
  ts: '2026-08-23T19:22:32.042381Z'
  actor: claude
  type: question
  body: "**Question: a pinned bar in the installed PWA may end up under the iOS status\
    \ bar. I put it out of scope. Should it be its own task?**\n\n`frontend/index.html:5`\
    \ is `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    \ />` \u2014 no `viewport-fit=cover` \u2014 and nothing in `frontend/src/styles.css`\
    \ or the components reads `env(safe-area-inset-top)`. In a browser tab that is\
    \ fine, because the browser chrome occupies the inset. In a standalone home-screen\
    \ PWA there is no chrome, so a `top-0` element sits at the physical top of the\
    \ display, under the clock and the notch.\n\nI left it out of scope rather than\
    \ folding it in, for one reason: fixing it means changing the viewport meta, which\
    \ changes the layout of **every** surface at once, and that is a bigger blast\
    \ radius than the task it would be riding along with. It is also not certain to\
    \ bite \u2014 it depends on whether the app is opened from the home screen, and\
    \ I have not observed it, only read the markup.\n\nSo it is a prediction, not\
    \ a reproduction, and it is written down here rather than asserted in the spec.\
    \ Worth a task on its own, or worth folding into this one and accepting the wider\
    \ change?\n"
  data:
    operation:
      id: 9c4e1a77-58b2-4c30-b1e9-2d6f8b41e292
