  body: "**Specified by a run of the `flesh-out` playbook, 2026-08-23. The duplicate\
    \ search came first; here is where it looked and what it found.**\n\nFour passes\
    \ over all 290 records, open and closed:\n\n1. **Title nouns and synonyms** \u2014\
    \ `top bar`, `topbar`, `sticky`, `header nav`, `position: fixed`. 13 records matched,\
    \ 11 of them false positives on other senses of \"position\" and \"header\".\n\
    2. **The artefact** \u2014 every record naming `frontend/src/App.tsx`. 22 records.\
    \ This is the pass that would have found a counterpart phrased differently, and\
    \ it did not find one.\n3. **Closed records as well as open ones**, so that a\
    \ shipped fix would show up as done rather than as missing. Nothing closed touches\
    \ the global header's scroll behaviour.\n4. **The epic that owns the area** \u2014\
    \ task-235's Shell children, task-236 through task-240, plus task-167/task-168\
    \ which add a control to this same row.\n\n**Three near misses, and why none of\
    \ them is this task.** The test applied was: *if the counterpart were done, would\
    \ this task have nothing left to do?*\n\n- **task-237 (`Shell 2`)** is the closest,\
    \ and it settles the question in writing rather than by argument. Its `out_of_scope`\
    \ reads *\"Any change to the header nav, or a global navigation rail\"*, and its\
    \ constraints read *\"the header nav is untouched\"* and *\"Below the breakpoint\
    \ the rendered output is what it is today.\"* It stops the **Tasks** page scrolling\
    \ at landscape widths, which pins the header there as a side effect \u2014 and\
    \ leaves Dashboard, Create, Dispatch and Playbooks scrolling, and leaves every\
    \ surface scrolling on a phone. Plenty left to do, so: overlap, not duplicate.\
    \ It is written into the spec as an overlap and deliberately **not** as a dependency\
    \ edge.\n- **task-239 (`Shell 4`)** has an acceptance criterion reading *\"The\
    \ task id, title and ball remain visible while scrolling a long task log\"* \u2014\
    \ which is the same sentence about a different element. That header is inside\
    \ the detail panel's own scroll container. Same words, different DOM node, different\
    \ work.\n- **task-167 / task-168** put a burger menu into this row. They change\
    \ what is *in* the header; this changes where the header is. They interact \u2014\
    \ a condensed narrow-width bar and a burger menu are two answers to one problem\
    \ \u2014 and that interaction is named in the constraints so neither is built\
    \ in ignorance of the other.\n\nNothing was folded and nothing was closed: there\
    \ was no duplicate to fold into.\n"
