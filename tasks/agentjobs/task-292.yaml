- id: 11
  ts: '2026-08-23T19:51:45.150595Z'
  actor: claude
  type: decision
  body: "**The narrow-width decision, answering Jeff's question of 2026-08-23 (log\
    \ entry 7). Taken on a measurement, not on taste.**\n\n## What I measured first\n\
    \nBefore choosing, I measured the real header in the running app at 8876 \u2014\
    \ the eight items' rendered widths, and the width at which the row stops fitting\
    \ on one line. The numbers change the question:\n\n| Viewport | Header height\
    \ today |\n|---|---|\n| 1440 / 1280 / 1024 / 960 | 64px \u2014 one row |\n| 900\
    \ / 860 / 820 | 128px \u2014 two rows |\n| 800 / 768 / 640 / 540 / 480 | 112px\
    \ \u2014 two rows (tighter `gap-2` below 820) |\n| 430 / 390 / 360 / 320 | 164px\
    \ \u2014 three rows |\n\n**The single row survives only at \u2273955px.** Bisected:\
    \ at `gap-6`/`px-6` the nav is 128px tall at 950 and 64px at 955. Its intrinsic\
    \ one-line width is 968px including the `lg` padding. Items: AgentJobs 119, project\
    \ switcher 153, Dashboard 93, Tasks 57, Create 65, Dispatch 79, Playbooks 89,\
    \ API Docs 81.\n\nSo this is **not** a phone problem. The header already wraps\
    \ on a 900px window and on every landscape tablet below ~960 \u2014 and one more\
    \ destination (task-212's analytics, task-023's runs) moves the threshold to ~1050\
    \ and starts wrapping 1024px screens. That is precisely the trigger task-235's\
    \ binding decision named for reopening the rail question: *\"enough top-level\
    \ surfaces that the header nav wraps.\"* I am not reopening it \u2014 see below\
    \ \u2014 but it should be on the record that the condition has been met at the\
    \ widths above, not merely predicted.\n\n## The decision\n\n**1. Pin it, on every\
    \ surface, at every width.** `sticky top-0` on the `<header>`.\n\n**2. The bar\
    \ never wraps. One row, always.** Below the fit threshold the six destination\
    \ links move into a panel that drops from the bar behind a burger; at or above\
    \ it they are inline exactly as today.\n\n**3. The threshold is 960px**, as a\
    \ `min-[960px]:` arbitrary variant \u2014 the same idiom as the existing `min-[820px]:gap-6`.\
    \ Chosen from the 955px measurement with a few pixels of headroom, not from a\
    \ framework default. It is deliberately *not* 820px, this app's existing narrow\
    \ breakpoint: 820 is where the table restacks, and the header stops fitting 135px\
    \ later. Using 820 would leave the 820\u2013954 band wrapping, which is the band\
    \ this measurement exists to expose.\n\n**4. No burger above 960.** The links\
    \ stay inline and visible.\n\n**5. The panel drops from the bar. It is not a left\
    \ drawer, and it is not a rail.**\n\n**6. `z-30`** on the header.\n\n**7. The\
    \ burger sits at the left edge of the bar.** Top-right is left free.\n\n## Why,\
    \ and what I rejected\n\n**Against pinning it as-is (the first alternative in\
    \ the spec).** At 390px that is 164px of a 844px screen \u2014 19% \u2014 permanently.\
    \ Worse than the complaint. At 900px it is 128px. Rejected.\n\n**Against pinning\
    \ only above a breakpoint and letting the phone scroll as today.** Cheapest, and\
    \ it is the one that leaves Jeff's actual reading surface unfixed. He reads this\
    \ over Tailscale on a phone; that is the case the task exists for. Rejected.\n\
    \n**Against a toggleable panel at desktop too** \u2014 Jeff's second option, *\"\
    or still have that be a toggleable panel from a burger menu?\"* Rejected, and\
    \ this is the part of his message I am pushing back on. A burger at 1440px buys\
    \ back 64px of 800 (8%) and charges a click for every navigation, forever. It\
    \ also hides the Dispatch link, and `App.tsx:604` carries a deliberate comment\
    \ about why that link is not in a menu: it is where the machine-wide kill switch\
    \ lives, and *\"a kill switch you cannot reach is not one.\"* task-167's constraints\
    \ repeat it. Below 960 the row cannot fit and the trade reverses; above it, visible-and-free\
    \ beats hidden-behind-a-click.\n\n**Against a left drawer**, Jeff's *\"or left\
    \ bar, whatever\"*. Two reasons. task-238 puts a **task list** down the left of\
    \ the Tasks surface at landscape widths; a nav drawer that also comes from the\
    \ left teaches two different meanings for the same edge, and they meet at exactly\
    \ the widths where a tablet crosses the breakpoint. And a top sheet is literally\
    \ what he described first \u2014 *\"an overlay burger icon that opens the top\
    \ bar\"* \u2014 the bar's own contents, dropping down over the page. It also needs\
    \ no slide animation and no drawer-scrim machinery.\n\n**Against a horizontally-scrolling\
    \ nav row** (not in the spec's list; I considered it and it is the cheapest thing\
    \ that would work). One 44px row, no new control, no hidden state, no interaction\
    \ cost, ~4 lines. Rejected because off-screen destinations are invisible, which\
    \ is the same unreachability in a new costume, and because it degrades as destinations\
    \ are added \u2014 and two more are already specced.\n\n**Against making the app\
    \ shell a non-scrolling frame** (`h-dvh`, `<main>` as the scroll container), which\
    \ is structurally the nicer answer and which I wanted to recommend. It would pin\
    \ the header with no `sticky` and no z-index at all, hand task-237 its non-scrolling\
    \ page, and give Jeff's *\"Dashboard should involve no scrolling\"* goal a bounded\
    \ region to fit into. Rejected **for this task** because `frontend/src/components/dragAutoScroll.ts`\
    \ scrolls the backlog during a drag with `window.scrollBy`, which becomes a no-op\
    \ the moment the document stops being the scroller. Drag-to-reorder has already\
    \ cost task-207, task-225 and task-229; breaking its auto-scroll as a side effect\
    \ of a header fix is not a trade to make quietly. Recorded as the better long-term\
    \ structure, to be taken deliberately by whoever owns the dashboard-fits-one-screen\
    \ work \u2014 with the auto-scroll rewrite in its scope.\n\n## How it stays compatible\
    \ with task-168's burger (ac-3 asks for this explicitly)\n\ntask-168 puts *\"\
    a burger-icon menu in the top-right\"* holding AgentJobs **actions** \u2014 Report\
    \ issue, About, later dispatch and voice. This task puts a burger holding **destinations**.\
    \ Those are different things and they must not become one control:\n\n- **Different\
    \ corners.** Navigation left, actions right \u2014 the Gmail/Slack/Material convention,\
    \ and the same split those apps use for the same reason. task-168 keeps the top-right\
    \ it specified; nothing in it needs to change.\n- **Different lifetimes.** The\
    \ nav burger exists only below 960px. task-168's menu exists at every width. So\
    \ above 960 there is exactly one control in the bar and no ambiguity at all; below\
    \ it there are two, at opposite ends.\n- **Different owners, which is the load-bearing\
    \ reason.** task-167 wants its menu to be a component another project embeds in\
    \ *its* app, carrying Report issue and a link into its backlog. Folding AgentJobs'\
    \ own destinations into that component would make it un-embeddable, since a host\
    \ app does not have a Tasks page. Keeping navigation out of it is what preserves\
    \ task-169.\n- **Different icons, so they do not read as duplicates.** The nav\
    \ trigger is a hamburger. task-168's should be a kebab or the AgentJobs mark.\
    \ That is a suggestion to task-168, not a constraint from here.\n\nThis answer\
    \ is being copied onto task-236 (whose job is exactly this question) and task-168.\n\
    \n## What is *not* decided here\n\nThe rail. task-235's decision rejected a global\
    \ navigation rail and named this wrap as the condition that would make the rejection\
    \ wrong. The condition is now met below 960px. I am deliberately **not** acting\
    \ on it: a transient panel is not a rail, costs no width when closed, and reopening\
    \ that decision is task-236/task-235's to do with Jeff in the room. What I have\
    \ added is the measurement it should be reopened against, if it is.\n"
