spec:
  summary: "The React app's global header \u2014 AgentJobs, the project switcher and\
    \ the six nav links \u2014 is a plain block element in a scrolling document, so\
    \ it leaves the screen the moment you scroll. Pin it, so the app's only navigation\
    \ is reachable from anywhere on a long page."
  intent: "That header is the whole navigation system: there is no rail, no back button\
    \ that means anything, and the burger menu (task-168) is not built. The pages\
    \ you most need to leave are the longest ones in the product \u2014 a task log\
    \ runs to dozens of entries, and the task list to a hundred rows \u2014 so today\
    \ the cost of moving between surfaces is a scroll to the top first. It is worst\
    \ on a phone, which is where this app is read over Tailscale, and where the scroll\
    \ is longest."
  description: "## What is wrong\n\n`frontend/src/App.tsx:596-612`. `ProjectApp` renders\n\
    \n```\n<div className=\"flex min-h-screen flex-col bg-dark-bg text-dark-text\"\
    >\n  <header className=\"border-b border-dark-border bg-dark-surface\">\n    <nav\
    \ className=\"... flex min-h-16 max-w-7xl flex-wrap items-center gap-2 ...\">\n\
    ```\n\nThe header is in the normal flow of a document that scrolls, so it scrolls.\
    \ Nothing else about it is wrong: it is already opaque (`bg-dark-surface`) and\
    \ already has a bottom border, which are the two things a pinned bar usually needs\
    \ adding.\n\n## The mechanical part\n\n`sticky top-0` plus a z-index on the `<header>`.\
    \ That is genuinely it, and if the change were only mechanical it would not be\
    \ worth a task.\n\n**Pick the z-index against the two stacking neighbours that\
    \ already exist**, rather than reaching for `z-50`:\n\n- `IssueReporter.tsx:38`\
    \ \u2014 the Report Issue floating button, `fixed bottom-4 right-4 z-40`.\n- `IssueReporter.tsx:128`\
    \ \u2014 its modal, `fixed inset-0 z-50`, a full-screen overlay.\n\nThe header\
    \ must sit **below** both: above the modal overlay it would punch a hole in a\
    \ dialog. Below `z-40` it stays under the floating button, which never overlaps\
    \ it positionally anyway. `z-30` satisfies both; whatever is chosen, say against\
    \ what.\n\n## The part that is a real decision, and is not the run's to take\n\
    \n**The header wraps.** `flex-wrap` with `min-h-16` and seven items \u2014 the\
    \ title, the project switcher, and Dashboard / Tasks / Create / Dispatch / Playbooks\
    \ / API Docs, each a 44px `touch-target`. At a phone width it is two or three\
    \ rows tall. Pinning it as it stands spends a large share of a small screen permanently\
    \ on navigation, which trades one annoyance for a worse one.\n\nSo there is a\
    \ design question underneath a one-line CSS change: **does the bar condense below\
    \ some width, and into what?** Named alternatives, none of them chosen here:\n\
    \n- Pin it exactly as it is, at every width, and accept the height.\n- Pin it\
    \ only at or above a breakpoint; below that it scrolls as today.\n- Condense the\
    \ row on narrow widths \u2014 drop the `AgentJobs` wordmark, or the links that\
    \ are not Dashboard/Tasks \u2014 and pin the condensed form.\n- Wait for task-168's\
    \ burger menu to collapse the links, and pin whatever survives that.\n\n**Take\
    \ the decision explicitly and record it** as a `decision` entry on this task with\
    \ the alternative you rejected, before the implementation lands. Do not settle\
    \ it silently inside a CSS class: the reason this task looks trivial and is not\
    \ is exactly that the trivial change makes the phone case worse, and a `decision`\
    \ entry is the only place a later reader will find out that somebody noticed.\n\
    \n## Its relationship to the shell epic \u2014 read this, it is not a duplicate\n\
    \ntask-237 (`Shell 2`) gives the **Tasks surface** two independently scrolling\
    \ regions and states that at landscape widths *the page itself does not scroll*.\
    \ Where that lands, the header stays put on that one surface as a side effect.\
    \ It does not make this task unnecessary, and task-237 says so itself in two places:\n\
    \n- its `out_of_scope`: *\"Any change to the header nav, or a global navigation\
    \ rail.\"*\n- its constraints: *\"the header nav is untouched\"*, and *\"Below\
    \ the breakpoint the rendered output is what it is today. A jsdom test at a phone\
    \ viewport should not be able to tell this change happened.\"*\n\nSo after task-237\
    \ the header still scrolls away on Dashboard, Create, Dispatch and Playbooks,\
    \ and still scrolls away everywhere on a phone \u2014 which is the case this task\
    \ exists for. task-239's *\"header that stays\"* is a different header again:\
    \ the task id, title and ball at the top of the **detail panel**, inside that\
    \ panel's own scroll container.\n\nThe two must not fight. Neither ordering is\
    \ blocked, and no dependency edge is recorded on purpose \u2014 this is an overlap\
    \ to be aware of, not a prerequisite. If task-237 has already landed when you\
    \ start, check the pinned header against the two-region layout at both viewports\
    \ rather than assuming they compose.\n\n## Verifying it\n\nAssert the **rendered\
    \ geometry**, not that a class is present: `header.getBoundingClientRect().top\
    \ === 0` after scrolling the document to its end, at a desktop and at a phone\
    \ viewport, on a page long enough to scroll. A test that asserts `class=\"sticky\"\
    ` passes against a header inside an ancestor with `overflow: hidden`, where `sticky`\
    \ does nothing \u2014 which is the failure mode this rule exists for (`ENGINEERING.md`,\
    \ Verification).\n\nA jsdom/vitest test cannot see this: jsdom does not lay out,\
    \ so every `getBoundingClientRect()` is zero and `position: sticky` has no meaning.\
    \ The evidence has to be Playwright. Existing specs live in `frontend/e2e/`."
  constraints: "- Frontend only. No API, schema or CLI change; the legacy Jinja pages\
    \ are not touched.\n- No new npm dependency. Tailwind's `sticky`/`top-0`/`z-*`\
    \ utilities are sufficient \u2014 the same constraint task-235's epic works under.\n\
    - Do not change what is *in* the header. Adding, removing or reorganising its\
    \ controls is task-167/task-168's scope; if condensing the row on narrow widths\
    \ is the decision taken, say on the record how it stays compatible with the burger\
    \ menu those tasks put there.\n- The chosen z-index is argued against `IssueReporter`'s\
    \ `z-40` button and `z-50` modal, and the modal still covers the header.\n- Acceptance\
    \ is asserted on rendered geometry in Playwright, never on the presence of a class\
    \ \u2014 ENGINEERING.md, Verification.\n- Take a worktree and bootstrap it (`python\
    \ scripts/bootstrap.py`) before anything else \u2014 ALLAGENTS.md, Task Lifecycle.\n\
    - `scripts/check.py` green with no arguments before every commit, run with the\
    \ interpreter path the bootstrap prints rather than a bare `poetry run` \u2014\
    \ ENGINEERING.md."
  out_of_scope: "- Changing the header's contents or adding a menu to it \u2014 task-167\
    \ and task-168.\n- The Tasks surface's two-region layout and its independent scroll\
    \ containers \u2014 task-237.\n- The detail panel's own sticky header (task id,\
    \ title, ball) \u2014 task-239, a different element.\n- Any visual restyling:\
    \ colours, spacing, typography, the wordmark's treatment.\n- The legacy Jinja/Alpine\
    \ pages \u2014 task-275 wants them deleted, not fixed.\n- iOS safe-area handling.\
    \ `frontend/index.html` has no `viewport-fit=cover` and nothing in the app reads\
    \ `env(safe-area-inset-top)`, so a pinned bar in a standalone PWA may sit under\
    \ the status bar. Real, and a separate task: fixing it here means touching the\
    \ viewport meta for every surface at once."
  context:
  - path: frontend/src/App.tsx
    why: "Lines 596-612 are the header and the `flex min-h-screen flex-col` wrapper\
      \ it sits in \u2014 the whole of the change, and the wrap behaviour the narrow-width\
      \ decision turns on."
  - path: frontend/src/components/IssueReporter.tsx
    why: The only two z-indexes in the app (`z-40` button, `z-50` modal). The header's
      must be chosen against them.
  - path: frontend/src/styles.css
    why: '`touch-target` is `min-height: 44px`, which is why seven header items are
      tall enough to wrap into three rows on a phone.'
  - path: tasks/agentjobs/task-237.yaml
    why: 'The neighbour that looks like a duplicate and is not: its out_of_scope and
      constraints both put the header nav outside its change, and its phone-width
      behaviour is explicitly unchanged.'
  - path: ENGINEERING.md
    why: The Verification section's rule about asserting rendered values rather than
      markup, which decides what the acceptance test may look like.
acceptance:
- id: ac-1
  text: On a task detail page whose log is long enough to scroll, at 1280x800 and
    at 390x844, scrolling the document to its end leaves the header's `getBoundingClientRect().top`
    at 0 and its Tasks link clickable. Asserted in Playwright on the measured rectangle,
    not on a class name.
  status: pending
- id: ac-2
  text: "The same holds on every surface that renders the header \u2014 Dashboard,\
    \ Tasks, Create, Dispatch, Playbooks \u2014 or, where the decision in ac-3 deliberately\
    \ excludes a width or a surface, that exclusion is what the test asserts instead."
  status: pending
- id: ac-3
  text: A `decision` entry on this task states what the bar does below the wrap width,
    names the alternative rejected, and says how it stays compatible with the burger
    menu task-168 will put in the same row.
  status: pending
- id: ac-4
  text: "Opening the Report Issue modal still covers the header completely at both\
    \ viewports, and the floating Report Issue button is still clickable \u2014 the\
    \ two existing z-indexes, checked rather than assumed."
  status: pending
- id: ac-5
  text: '`scripts/check.py` green with no arguments on a clean tree, and the new Playwright
    assertions fail when `top-0`/`sticky` is removed from the header.'
  status: pending
