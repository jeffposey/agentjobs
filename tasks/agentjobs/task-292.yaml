ball_prompt: "Drive it, then approve or send it back.\n\n**Sandbox: http://127.0.0.1:8891/app/**\
  \ \u2014 my branch, throwaway data, its own port. It is not the 8876 dashboard and\
  \ it does not touch your real corpus. Start at http://127.0.0.1:8891/app/p/sandbox-tall/tasks,\
  \ which has sixty tasks so there is something to scroll. Stop it with `poetry run\
  \ python scripts/run_report.py`-style Ctrl-C, or tell me and I will kill it; the\
  \ temporary data deletes itself when the process ends.\n\n**Both sides, without\
  \ me building a second one:** 8876 is still serving `main`, so it *is* the before.\
  \ Put the two side by side. Narrow the window to about 900px on each and the difference\
  \ is at its sharpest \u2014 that is the case I did not expect to find.\n\n## I answered\
  \ your question. Here is the short version; the long one is the decision entry.\n\
  \n**Landscape: keep the top menu visible. No burger.** I am pushing back on your\
  \ second option. A burger at 1440px buys back 64px of 800 and charges a click for\
  \ every navigation forever \u2014 and it hides Dispatch, which `App.tsx` has a comment\
  \ about: it is the machine-wide kill switch and a kill switch you cannot reach is\
  \ not one.\n\n**Phone: your burger, but the panel drops from the bar rather than\
  \ sliding in from the left.** You said \"top bar, or left bar, whatever\". I went\
  \ with the top for two reasons. It is literally what you described first \u2014\
  \ the bar's own contents, dropping over the page. And task-238 is going to put a\
  \ *task list* down the left edge at landscape widths; a nav drawer from the same\
  \ edge teaches two meanings for one gesture, and they meet exactly where a tablet\
  \ crosses the breakpoint.\n\n**The number that changed my mind about your whole\
  \ question: the bar only fits on one line at 955px.** I measured it in your running\
  \ app before choosing. It is 128px tall on a 900px window and 164px on a phone.\
  \ So this was never a phone problem \u2014 every landscape tablet below ~960 has\
  \ been getting a two-row header, and one more nav destination pushes that up to\
  \ 1024px screens. That is exactly the condition task-235's decision named for reopening\
  \ the navigation-rail question. **I did not reopen it** \u2014 a panel behind a\
  \ burger is not a rail and costs no width closed \u2014 but the measurement is now\
  \ on task-236, which is the task that owns that call, for you to make with the numbers\
  \ in front of you.\n\n**The breakpoint is 960, not this app's existing 820.** 820\
  \ is where the tables restack; the header stops fitting 135px above it. Using 820\
  \ would have left the whole 820\u2013954 band still wrapping.\n\n## What to actually\
  \ look at\n\n1. Scroll to the bottom of a long task on a phone-width window. The\
  \ bar is still there, and it is **one row** \u2014 65px, where it used to be 164.\n\
  2. Tap the burger. Everything is in there, in the same order, nothing renamed. Escape\
  \ closes it and focus goes back to the button.\n3. A ~900px window. This is the\
  \ case I would most like your eye on, because it is the one you did not ask about.\n\
  4. Report issue still opens and its dialog still covers the bar. That was an acceptance\
  \ criterion, not an afterthought.\n\n## Two things you should know before approving\n\
  \n**I touched a test file that is not mine.** `queue-order.spec.ts`'s drag helper\
  \ scrolled a row to y=0 to reach it \u2014 which is now behind the header, so the\
  \ press landed on the bar and the drag never started. I rewrote the helper to place\
  \ both ends below the bar deliberately, and gave the two pointer-drag tests a 900px-tall\
  \ viewport because the rows they use sit 677px apart and a 720px window now leaves\
  \ 655. Real product interaction, not a test being fussy. Drag still works; the auto-scroll\
  \ test is untouched.\n\n**I got it wrong twice before I got it right**, and the\
  \ progress entry says so in detail. Worth two minutes if you want to know how much\
  \ to trust the rest.\n\n## Filed rather than done\n\n- **task-294** \u2014 the Dashboard\
  \ fits one screen, no scrolling. Your line about the Dashboard, made into a task.\
  \ It also carries the design I *wanted* to use here and rejected: stop the document\
  \ scrolling at all and make `<main>` the scroll container. That is the better shape\
  \ and it breaks drag-to-reorder's auto-scroll, so it belongs where somebody can\
  \ pay proper attention to it.\n- **task-295** \u2014 the pinned bar may end up under\
  \ your iPhone's status bar in the installed PWA. That was the open question I left\
  \ you last time; pinning the bar makes it real, so it is a task now. Its first criterion\
  \ is to look at it on your actual phone, because I have only read the markup.\n\n\
  **Nothing is merged.** Branch `feat/task-292-pinned-header`, commit `e16d579`, gate\
  \ green with no arguments, all ten stages."
