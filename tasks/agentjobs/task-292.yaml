ball_prompt: "Read the spec I just wrote onto this task, then release the ball if\
  \ it is right.\n\n**Nothing was closed.** The duplicate search found no duplicate\
  \ \u2014 three near misses, all written up in the progress entry. The closest, task-237,\
  \ settles it in its own words: its out_of_scope reads \"Any change to the header\
  \ nav, or a global navigation rail\" and its constraints read \"the header nav is\
  \ untouched\". So this is the work the Shell epic deliberately left out, not a second\
  \ copy of it.\n\n**What I wrote**, in one update: a summary and an intent (the header\
  \ is the app's only navigation and the longest pages are the ones you most need\
  \ to leave); a description in four parts \u2014 the two lines of CSS, the z-index\
  \ chosen against IssueReporter's existing z-40 and z-50, the design decision underneath,\
  \ and how it relates to task-237/239; seven constraints each citing where it came\
  \ from; six things out of scope; five context files with reasons; and five acceptance\
  \ criteria.\n\n**What I was least sure of, and would delete first if I were wrong:\
  \ the whole \"this is a real decision\" section, and ac-3 with it.** You filed a\
  \ one-line CSS fix and I have written a task that asks somebody to take a design\
  \ decision before they touch it. My reason is that the header wraps to two or three\
  \ rows on a phone \u2014 seven items, each a 44px touch target \u2014 so pinning\
  \ it as-is permanently spends a third of a phone screen on navigation, which is\
  \ plausibly worse than what you filed this about. But that is my judgement about\
  \ your app on your phone, and if you would rather it just be pinned everywhere and\
  \ be done, say so and ac-3 comes out. I deliberately did **not** pick one of the\
  \ four alternatives myself.\n\n**What I left empty:** no tags, no category change,\
  \ no parent, no dependency on task-237. The overlap with task-237 is a paragraph\
  \ in the description rather than a needs edge, because an edge would make this unclaimable\
  \ until task-237 closes and that is not true of the work.\n\n**One question below\
  \ the fold:** a pinned bar in the installed PWA may sit under the iOS status bar\
  \ (no `viewport-fit=cover`, nothing reads `env(safe-area-inset-top)`). I put it\
  \ out of scope and asked whether it should be its own task. It is read off the markup,\
  \ not observed.\n\n**Ball was human/spec before this** \u2014 your own \"finish\
  \ specifying this task\" \u2014 so I have not interrupted anything; I have answered\
  \ it.\n\nOne mechanical note you should know when you look at this. I promoted it\
  \ out of `draft` before parking it, which is what you asked for. `_skip_reason`\
  \ decides claimability on lifecycle alone and never reads the ball, so this task\
  \ is now returned by `agentjobs next` and is dispatchable even though it is parked\
  \ at your review. Measured against the real manager, not inferred. If that is not\
  \ what you want, the fix is in the queue rather than here \u2014 I raised it on\
  \ task-218."
