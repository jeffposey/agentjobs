- id: 10
  ts: '2026-08-25T09:45:59.799829Z'
  actor: claude
  type: decision
  body: "**sc-4: something does enforce it, and what it does is report. `agentjobs\
    \ branches` is built.**\n\nThe task offered three shapes and I took the middle\
    \ one, for the reason it gave: the finish now retires the branch it merged, but\
    \ **a finish only ever retires branches it merged itself**. Three cases stay outside\
    \ it \u2014 a branch a person merged by hand (which is where two of the six on\
    \ 2026-08-23 came from), a branch whose finish escalated after the merge and was\
    \ never retried, and a branch predating this fix. In every one of those, nothing\
    \ says the branch is there. That is the same failure mode as before, just narrower,\
    \ and it is worth a surface.\n\n**What it does.** Lists every local branch in\
    \ two groups: the ones `main` already contains with no worktree, each with the\
    \ task that claims it and that task's state, and the ones still in flight with\
    \ **how long each has really been open**. It exits 0 either way.\n\n**What it\
    \ deliberately does not do: delete anything.** Several agents work this clone\
    \ and none of them can see the others. The information that separates \"abandoned\"\
    \ from \"somebody is mid-task on this\" \u2014 is a session alive, does its author\
    \ mean to come back \u2014 is not in git, so any automatic sweep is guessing,\
    \ and a sweep that guesses wrong once costs somebody a day. Reporting costs a\
    \ person one glance and one `git branch -d`. That is also this repository's existing\
    \ habit: `queue check` reports, `dispatch reap` refuses rather than forcing, `queue\
    \ repair` states everything it guessed.\n\n*Rejected: putting it in `scripts/check.py`.*\
    \ The task already says why and it is right \u2014 the gate runs before a commit\
    \ and branch cleanup happens after a merge, so the gate could only ever complain\
    \ about the *previous* task's litter, at the moment you are least able to act\
    \ on it.\n\n*Rejected: a `doctor` command.* Same content, a name that promises\
    \ more than one report, and the first thing anyone would add to a \"doctor\" is\
    \ a `--fix`. Naming it `branches` keeps the scope honest.\n\n*Rejected: doing\
