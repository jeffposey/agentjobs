- id: 9
  ts: '2026-08-25T09:45:39.806386Z'
  actor: claude
  type: decision
  body: "**sc-2: a refused delete is reported, not escalated.** The finish carries\
    \ on and writes the refusal into its step table.\n\nThe reasoning is about where\
    \ in the sequence this sits. By the time `delete_branch` runs, the merge has landed,\
    \ the rebuild and restart have happened, verification has proved the running server\
    \ is serving the merge, and the task is already closed `completed`. An escalation\
    \ from there does two things: it hands the ball back to an agent, and \u2014 where\
    \ `auto_dispatch` is on \u2014 it starts a whole session. Spending a session to\
    \ delete a ref is a worse trade than leaving the ref, by a wide margin.\n\nIt\
    \ is also the trade `remove_worktree` already makes, three lines above, in the\
    \ same position and for the same reason: *\"A failure here is litter, not a half-finished\
    \ merge... waking a session to delete a directory would cost more than the directory\
    \ does.\"* Two adjacent cleanup steps answering the same question differently\
    \ would be the thing a later reader could not account for.\n\n*Rejected: escalating.*\
    \ The argument for it is that a refusal means something is genuinely wrong \u2014\
    \ `-d` only refuses a branch `main` does not contain, and the finish just merged\
    \ it. That is real, and it is why the refusal is written down verbatim with git's\
    \ own stderr rather than swallowed. But the failure it would be reporting is a\
    \ merge that did not land, and **the merge step already checks that directly and\
    \ escalates itself** (`already_merged`, `merge_failed`, `base_moved`). A refusal\
    \ this late would be a second, weaker detector for something the sequence has\
    \ already established, and paying a session for it every time it fires the other\
    \ way \u2014 a transient git state, a lock, a filesystem quirk \u2014 is the cost.\n\
    \n**The refusal is still made unmistakable in two places.** The step's detail\
    \ says `refused: <git's stderr> -- left in place, never forced`, and `agentjobs\
    \ branches` will list the branch afterwards as one `main` contains with no worktree.\
    \ So the information survives the decision not to escalate on it.\n\n**One thing\
    \ the ordering had to buy explicitly.** A branch checked out in a worktree cannot\
    \ be deleted, so this runs after `remove_worktree` \u2014 but it does not *trust*\
    \ `remove_worktree`, which returns `ok` even when the removal failed. It re-reads\
    \ `git worktree list --porcelain` and, if the branch is still held, says so in\
    \ those words. Without that, a failed worktree removal would arrive here as a\
    \ git refusal phrased in terms of checkout, which reads exactly like the unmerged\
    \ case and means something completely different. The task asked for the ordering\
    \ to be explicit rather than incidental; asking git rather than assuming the previous\
    \ step is what makes it so."
