    The two pull in opposite directions only if you get the causation wrong, and getting
    it wrong is the likely failure of whoever picks this up -- so it is stated in
    the description rather than left to be rediscovered.


    **The evidence.** Every rebase conflict in the task-211 epic came from a branch
    living across another branch''s merge: task-219 across task-214, task-215 across
    task-219, task-217 across task-218. Five sessions on one clone for eleven hours
    produced exactly three, all that shape.


    **The trap.** The obvious reading is "keep branches short, so keep tasks small".
    That is wrong on the measurements. task-217''s branch was open about nine hours
    and held roughly one hour of work; the rest was waiting -- parked at `human`/`review`,
    then behind two `base_moved` retries. Shrinking the task would not have shortened
    the branch at all. Lifetime is driven by **wait**, not by size, so the guidance
    has to attack wait: rebase at handoff rather than at the merge, and do not leave
    an approved branch sitting.


    **Jeff''s preference is explicitly the other way and it is right.** Every task
    boundary pays a worktree, a bootstrap, a full gate, a review round, a merge and
    a cleanup, and on a small task that overhead is most of the cost -- four children
    paid it tonight. So the guidance must say bigger tasks are fine and name the actual
    ceiling: one session''s context, and acceptance criteria that stay independently
    checkable. Not an arbitrary size, and not the parent-task session boundary, which
    is a different rule that gets confused with a size limit.


    *Rejected: filing this as its own task.* Jeff asked for it folded in, and it is
    the same rule''s other half -- one is what happens to a branch after it merges,
    the other is how long it takes to get there. Splitting them would put two halves
    of "branch discipline" in two places, which is the exact failure gap 2 of this
    task already describes.


    Three acceptance criteria added, sc-6 through sc-8, with sc-8 specifically requiring
    the lifetime-versus-size distinction be written down so a later reader cannot
    resolve the tension by shrinking tasks.'
