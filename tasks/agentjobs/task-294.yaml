  body: "ac-3 \u2014 The frame is the Dashboard's alone, not the app shell's.\n\n\
    `ProjectApp` reads the route (`isDashboardPath`) and renders the shell one of\
    \ two\nways. On the Dashboard: `h-dvh overflow-hidden`, `<main>` as `flex min-h-0\
    \ flex-1\nflex-col py-3`, and no footer. Everywhere else: `min-h-dvh`, `py-8`,\
    \ footer, and the\ndocument is still the scroll container exactly as it was.\n\
    \n**The rejected alternative was the app-wide frame** the spec sketches, which\
    \ is the\nbetter long-term shape \u2014 it would pin the header with no `sticky`\
    \ and no z-index, and\nhand task-237 a non-scrolling Tasks page. It was not taken\
    \ because the Tasks surface\nrenders `TaskList`, and `dragAutoScroll.ts` scrolls\
    \ it with `window.scrollBy`, which\nbecomes a silent no-op the moment the document\
    \ stops being the scroller. Drag-to-reorder\nhas already cost task-207, task-225\
    \ and task-229, and task-225 established that an\nautomated gesture is not evidence\
    \ a real one works \u2014 so the app-wide frame's true cost\nis not the one-line\
    \ dependency-injection change, it is a round trip through Jeff's hand\non a real\
    \ mouse. That is a price worth paying for the Tasks page's own non-scrolling\n\
    task, and not worth paying inside a Dashboard task where it buys nothing.\n\n\
    Consequences, both deliberate:\n\n- `sticky top-0` stays on the header. It is\
    \ redundant inside the frame and load-bearing\n  on every other surface; removing\
    \ it \"coherently\" is task-237's business, not this\n  task's, and the constraint\
    \ forbids trading it away.\n- task-237 inherits the app-wide frame as a live option\
    \ with this task's measurements\n  already in hand.\n\nTwo things that did move,\
    \ both one word, both for the reason the constraint names:\n`min-h-screen` became\
    \ `min-h-dvh` on the unframed shell and on `StatusCard`. `100vh` on\na phone is\
    \ the height *without* the retracting URL bar, so those surfaces were taller\n\
    than the visible viewport by exactly the bar's height. Nothing else about them\
    \ changed.\n\nHeld by: `frontend/e2e/dashboard-one-screen.spec.ts`, \"the frame\
    \ is the Dashboard's\nalone\" \u2014 it opens a task detail page and asserts the\
    \ document still scrolls and\n`window.scrollBy` still moves it."
