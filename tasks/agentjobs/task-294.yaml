spec:
  summary: Umbrella for the goal that the Dashboard fits one screen and never scrolls.
    It supervises three children that each change how much has to fit.
  intent: A dashboard is a glance, not a document. If it scrolls, the part below the
    fold is doing none of the work a dashboard exists to do while still costing the
    space it occupies. Three separate tasks each change how much has to fit on that
    one screen, and worked apart they were each deciding the same question in isolation.
    This roof makes the trade-off one decision.
  description: "## Where this came from\n\nJeff, on task-292, 2026-08-23: *\"Dashboard\
    \ is its own thing, goal with it is to NOT involve any scrolling at all.\"*\n\n\
    On 2026-09-05 Jeff grouped four Dashboard tasks at the head of the critical band\
    \ via task-337, noting they *\"are the rest of the same subject and are meant\
    \ to be worked as a set\"*. On **2026-09-06** he asked for that grouping to become\
    \ a real umbrella rather than a queue adjacency, and this task was converted.\n\
    \n## What this task is now\n\nA parent. It takes no worktree and writes no code.\
    \ **Whoever claims it starts one session per child and supervises** \u2014 see\
    \ [ALLAGENTS.md, You do not work the children](../../ALLAGENTS.md).\n\nIts original\
    \ hands-on scope \u2014 the `h-dvh` frame, the `dragAutoScroll` consequence, the\
    \ fitting decisions, the Playwright geometry assertions \u2014 moved verbatim\
    \ to **task-357**. Nothing was dropped in the conversion; if you are looking for\
    \ the work, it is there.\n\n## The children, and why each is under this roof\n\
    \n- **task-357 \u2014 the non-scrolling frame.** The frame itself and the decision\
    \ about what earns a place on the bounded surface. This is the task that makes\
    \ the Dashboard fit.\n- **task-212 \u2014 move the count tiles to an analytics\
    \ page.** It removes five tiles' worth of vertical space from the Dashboard, so\
    \ it changes the fitting problem more than anything else here. It has its own\
    \ child, task-213.\n- **task-344 \u2014 make `max_concurrent_runs` settable from\
    \ the browser.** Since task-092 settled that the Dashboard is a slot board of\
    \ one card per concurrent run, this makes the number of cards \u2014 and therefore\
    \ the amount that has to fit \u2014 a value a person can change after the frame\
    \ ships. A frame that fits three cards and breaks at six is not done.\n\n**Order\
    \ is not fixed and no child `needs` another.** Any order works; each child records\
    \ which world it landed in. The one real prerequisite in the set is task-344's\
    \ own `needs` on task-198 (the comment-preserving config writer), which is outside\
    \ this umbrella and will gate that child.\n\n## What closing this means\n\nNot\
    \ \"all three children are closed\" \u2014 `agentjobs dispatch walk` exiting 0\
    \ says that, and deliberately does not close a parent. Closing this means the\
    \ Dashboard *actually* fits one screen with the children's changes all in, verified\
    \ after the last of them lands, because each child was measured against the Dashboard\
    \ as it stood when that child ran. The last merge can undo the first one's fit."
  constraints: "- Supervisor's seat: no worktree, no branch, no code on this task.\n\
    - Do not relitigate a child's binding decisions. task-092 settled what the Dashboard\
    \ is; task-292 settled the header.\n- Each child merges on its own terms \u2014\
    \ an explicit human approval of that child, or its own green gate at posture `autonomous`.\
    \ A supervisor approves nothing.\n- The re-measurement after the last child lands\
    \ is this task's own work and is done before it closes. It is a measurement, not\
    \ a rebuild; if it fails, that is a new child, not a scope grab here."
  out_of_scope: "- Doing any child's work. If you are editing `App.tsx`, you are on\
    \ the wrong task \u2014 that is task-357.\n- The Tasks, Create, Dispatch and Playbooks\
    \ surfaces. They may scroll.\n- Re-deciding the slot board's contents \u2014 task-092,\
    \ closed and binding.\n- The header's contents or breakpoint \u2014 task-292,\
    \ task-167, task-168.\n- Visual restyling: colours, typography, the spacing scale.\n\
    - The Tasks surface's two-region shell \u2014 task-235's children."
  context:
  - path: tasks/agentjobs/task-357.yaml
    why: 'The child carrying this task''s original hands-on scope: the frame, the
      fitting decisions, the geometry assertions.'
  - path: tasks/agentjobs/task-212.yaml
    why: Child. Removes the count-tile strip, which changes the fitting problem more
      than anything else in the set.
  - path: tasks/agentjobs/task-344.yaml
    why: Child. Makes the card count a value a person can change, so the frame has
      to survive being widened after it ships.
  - path: ALLAGENTS.md
    why: 'The parent-task protocol: a session per child, the supervisor is thin, and
      the walk does not close the parent.'
acceptance:
- id: ac-1
  text: All three children (task-357, task-212, task-344) are closed `completed`,
    or a decision entry here records which was dropped from the set and why.
  status: pending
- id: ac-2
  text: After the last child merges, the Dashboard is re-measured on `main` at the
    viewports task-357 named, and `document.documentElement.scrollHeight <= window.innerHeight`
    still holds at each. Each child was measured against a different Dashboard; this
    is the only check that the combination fits.
  status: pending
- id: ac-3
  text: The re-measurement is done at the maximum `max_concurrent_runs` task-344's
    control permits, not only at the current value of 3.
  status: pending
- id: ac-4
  text: A decision entry summarises what the set collectively dropped, moved or collapsed
    from the Dashboard, and confirms nothing reachable before is unreachable after.
  status: pending
- id: ac-5
  text: Jeff has driven the merged result in a browser on his own screen.
  status: pending
