- id: 13
  ts: '2026-09-06T07:21:43.250431Z'
  actor: claude
  type: decision
  body: "ac-5 and ac-6 \u2014 what came off the Dashboard, and where each thing went.\n\
    \n**The five count tiles: removed outright.** No collapsed line, no placeholder\
    \ route.\nFour of the five numbers are already answered by something that stays\
    \ \u2014 In Progress is\nthe slot board, Needs you is the red attention badge\
    \ in the header (task-338) and the\n\"Tasks Blocked on You\" alarm \u2014 and\
    \ Blocked, Completed and Total are analytics rather\nthan a call to action. Reintroducing\
    \ them as one line would be the strip at 20% scale\nand would still be the thing\
    \ between this page and one screen. The rejected alternative\nwas a single collapsed\
    \ line; it was rejected because the counts it would carry are the\nthree nobody\
    \ acts on.\n\n**task-212 inherits all five, and its `sc-1` is not satisfied by\
    \ anything here.** The\nentry point goes wherever task-212 decides \u2014 this\
    \ task creates no route, no link and no\nplaceholder, so there is nothing for\
    \ it to adopt or tidy up. Nothing on the Dashboard\nnow points at a page that\
    \ does not exist.\n\n**Reachability, counted both ways.** Links out of the Dashboard\
    \ body before: 8 kinds \u2014\nthe board's task links, its \"Running now \u2192\
    \", Dispatch buttons and \"Why this one?\"; the\nladder's rung links; `+N in backlog`;\
    \ Active Tasks' \"View all\"; and the active task\ncards. After: 7. The one that\
    \ went is **`+N in backlog` \u2192 `/tasks?status=draft`**, which\nhung under\
    \ the strip rather than being part of it.\n\nWhere it went: the Tasks surface's\
    \ own Status filter, which has a `Draft` option. The\nroute is now Active tasks'\
    \ \"View all \u2192\" \u2192 Tasks \u2192 Status: Draft \u2014 two clicks instead\
    \ of\none, both on controls a person can see. It is still unconditional, which\
    \ is the property\n`promote-draft.spec.ts` relied on; that spec now walks the\
    \ new route and its comment\nrecords the swap. The ladder's own backlog rung still\
    \ offers \"All drafts \u2192\" in one click\nwhen it is the winning rung. **This\
    \ is the one loss in the change and it is worth\nflagging**: if you want a one-click\
    \ drafts route back on the Dashboard, say so and it is\na single inline link in\
    \ the Active tasks header.\n\n**What else was cut, and none of it is a link:**\n\
    \n- **The footer, inside the frame only.** `AgentJobs \xA9 2026`, no links, 53px\
    \ \u2014 6% of a\n  phone and 14% of a phone in landscape. Every scrolling surface\
    \ still has it.\n- **Active tasks: 3 rows of however many, from all of them.**\
    \ The server sends every\n  open task and the page rendered all of them; on a\
    \ forty-task project that was ~4,000\n  of the 5,681px. The heading carries the\
