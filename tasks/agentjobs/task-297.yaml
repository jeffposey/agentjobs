- id: 7
  ts: '2026-08-27T16:00:11.205716Z'
  actor: claude
  type: decision
  body: "## The approach: catch up rather than refuse, plus stop the finisher being\
    \ its own amplifier\n\nBranch `fix/task-297-finish-catch-up`.\n\n### First, what\
    \ task-223 already fixed, and what it did not\n\nJeff's note asks whether the\
    \ runway lock closed this. **It closed half of it, and the half it closed is the\
    \ half the task called \"the finding\".**\n\n`Runway` (task-223) takes one repo-scoped\
    \ lock just after `preflight` and holds it through rebase, gate, merge and delivery.\
    \ So no two finishes are ever gating at once, and the escalation-kills-the-next-finish\
    \ loop in the description's step 3 cannot recur *between finishes*: when `fin_a790b54d`\
    \ escalated and committed its record, `fin_736e455c` would not have been mid-gate\
    \ \u2014 it would have been queued, not yet rebased.\n\nWhat the runway does **not**\
    \ touch is the trigger in step 1: three commits from three ordinary agent sessions\
    \ (`chore(task-233): hand off`, `chore(task-217): answer\u2026`, `chore(task-218):\
    \ record\u2026`). Those sessions hold no runway and never will \u2014 ENGINEERING.md\
    \ requires them to commit records to `main`, and this task explicitly rules changing\
    \ that out of scope. So `base_moved` still fires on every busy evening, and sc-1\
    \ is still open.\n\n**And the runway reintroduced one amplifier of its own.**\
    \ `Runway.take` passes an `on_wait` callback that writes a \"queued for the merge\
    \ runway\" note *and commits it* (`finish.py`, `announce`). That commit happens\
    \ while the **other** finish holds the runway and is very likely mid-gate. So\
    \ a second finish queuing now moves `main` under the first one's gate and escalates\
    \ it \u2014 the exact shape of the original bug, with the finisher on both ends\
    \ of it. Not observed in the wild yet only because it needs two finishes overlapping,\
    \ which is now rarer.\n\n### What ships\n\n**1. A `catch_up` step between the\
    \ gate and the merge.** When the base moved, ask `scripts/gate_scope.py` \u2014\
    \ the same table `--since-gate` uses \u2014 what the moved paths can reach. If\
    \ every moved path classifies to a *reduced* stage set, rebase onto the new tip\
    \ and re-run exactly those stages, then merge. If any moved path is unclassified,\
    \ refuse with `base_moved` exactly as today.\n\n**2. The runway queue note no\
    \ longer commits.** The log entry still lands on disk immediately (the dashboard\
    \ reads the working tree, not git), so the \"am I hung or queued?\" question the\
    \ note exists to answer is still answered. The commit is dropped because the *same\
    \ file* is committed a minute later by that finish's own `announce_start`, or\
    \ by its escalation if it times out \u2014 `commit_task_record` commits one path,\
    \ and that path is this task's record. Nothing is orphaned; one commit simply\
    \ stops landing at the worst possible moment.\n\n### Why not the other three\n\
    \n- **Exempt `tasks/` from `base_moved` outright.** Rejected. The constraint is\
    \ right that \"nearly always harmless\" is not \"cannot affect the gate\", and\
    \ the precedent is concrete: `tests/test_validate.py::TestRealCorpus` reads `Path(__file__).parents[1]\
    \ / \"tasks\" / \"agentjobs\"` \u2014 the *checkout it runs in*. The gate runs\
    \ in the branch's worktree, whose `tasks/` is the pre-move corpus, so the new\
    \ records are genuinely unverified, deterministically so. Worse, the interaction\
    \ is not one-sided: a branch that changes the validator plus records written against\
    \ the old validator is a real red-gate combination, and an exemption would merge\
    \ it unseen.\n- **Serialise finishes.** Already shipped as the runway; kept, and\
    \ this builds on it rather than replacing it. It is the floor the task asked for,\
    \ and it is what makes `catch_up`'s bounded retry terminate \u2014 with the runway\
    \ held, the only thing that can still move `main` is an ordinary session's record\
    \ commit, not another finish's whole gate.\n- **Stop escalations moving `main`.**\
    \ Adopted only in the narrow form above (the queue note), and deliberately **not**\
    \ for the escalation commit itself. An escalation's record is the entire explanation\
    \ of why a merge did not happen; leaving it uncommitted in a shared clone for\
    \ the next agent to find dirty is the failure `record_commit.py` was written for\
    \ (task-203). With the runway holding, that commit can no longer land under another\
    \ finish's gate anyway \u2014 the amplifier it fed is gone at the other end.\n\
    \n### What `catch_up` does about TestRealCorpus\n\nIt runs it. `tasks/*` maps\
    \ to `(\"pytest\",)` in `gate_scope.CLASSES` precisely because `TestRealCorpus`\
    \ is the one stage whose inputs are not bounded by the diff, and `catch_up` re-runs\
    \ the classified stages against the *new* base after rebasing onto it. So the\
    \ merged tree is verified for everything the moved paths can reach, by the same\
    \ table and the same reasoning `--since-gate` already publishes. That is the argument\
    \ against the exemption in point 1 and the reason this is not one: nothing is\
    \ assumed inert.\n\n### Two properties that keep this from becoming a loophole\n\
    \n- **Default-deny, twice over.** A path matching no class selects every stage,\
    \ which means `catch_up` declines and `merge` refuses \u2014 `gate_scope`'s own\
    \ safety property, reused rather than re-derived. And the table is loaded from\
    \ *the finished repository's* `scripts/gate_scope.py`; a project that publishes\
    \ no such table gets today's unconditional refusal. The exemption exists only\
    \ where the repository itself has argued for it in a file under review.\n- **It\
    \ is bounded and it says so.** At most two catch-up rounds; a third move escalates\
    \ with its own reason (`base_moves_repeatedly`) rather than looping. And `catch_up`\
    \ writes nothing to the task record while it runs \u2014 a progress note there\
    \ would commit to `main` and move the base it is trying to catch up with, which\
    \ is this task's whole subject. The step table in the closing entry carries it\
    \ instead.\n"
