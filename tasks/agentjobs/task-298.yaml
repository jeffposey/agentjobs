- id: 7
  ts: '2026-08-25T08:35:12.255325Z'
  actor: claude
  type: decision
  body: '**The restart advice moves branch rather than staying where it was and being
    suppressed for finishes.**


    The obvious reading of the constraint -- "narrows when it is shown, does not delete
    it" -- is to leave the sentence on the no-run dispatch branch and skip it for
    a finish. That is wrong, and following it would have preserved a remedy that cannot
    work.


    `release_stale_locks` judges a lock by exactly the same rule as the reclaim inside
    `acquire_run_lock`: a terminal run, or an absent process. So a restart can never
    clear a lock that acquisition has just refused on -- both would have cleared it
    already. The advice was, in that branch, unconditionally useless.


    The one thing a restart does that acquisition cannot is `reconcile()`, which concludes
    runs that were recorded live when a previous process died, and only *then* sweeps.
    So a lock naming a run whose record still says `running` is the genuine "lock
    outliving a dead run", and it is the `holder.run_id` branch. The advice now lives
    there.


    **Rejected:** keeping it in both places to be safe. Advice offered where it cannot
    help is what produced this task -- the message was not merely unhelpful, it recommended
    an action that would have damaged a healthy merge. Two more places to offer it
    is two more chances to make the same mistake.'
  data:
