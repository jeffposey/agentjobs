  actor: claude
  type: progress
  body: 'Done on `fix/task-298-run-lock-refusal-names-finish` (3 commits, full gate
    green 10/10 in 199.8s).


    ## What changed


    **The lock now records what took it.** `_holder_text` writes `kind=dispatch|finish`,
    and for a finish a `finish=<id>` adopted the moment the finish directory exists,
    plus `started=<iso>` from the acquisition. `LockHolder` parses all three and exposes
    `is_finish`. An absent `kind` is a lock file written before this and reads as
    a dispatch, because that is what every one of them was. `RunLock.adopt_finish()`
    is the finish''s counterpart to `adopt()` and exists for the same reason -- the
    lock is taken *before* the directory, because taking it is what decides whether
    the attempt happens at all.


    `finish_task` acquires with `kind=KIND_FINISH` and calls `adopt_finish` immediately
    after `FinishDirectory.create`. That is the only change in `finish.py`; nothing
    about when a finish is spawned moved.


    **`_lock_refusal` now has four branches instead of two**, and `_finish_refusal`
    carries the finish ones.


    **The restart remedy moved to the branch it is actually right about**, which is
    not where it was. `release_stale_locks` uses exactly the same evidence as the
    reclaim inside `acquire_run_lock`, so a restart can never clear a lock that acquisition
    just refused on -- with one exception: `reconcile()` concludes orphaned runs `interrupted`
    *first* and sweeps the locks *after*, so a lock naming a run that was recorded
    live when the process died is precisely what a restart fixes. That is the `holder.run_id`
    branch, and it now carries the advice. The no-run branch, which carried it before,
    cannot benefit from a restart at all.


    ## The before and after, taken live


    `scripts/finish_lock_refusal_sandbox.py` (new) builds a throwaway clone, branch,
    worktree, task record and dispatch config with `finish.enabled`, spawns a real
    `finish_task` in a detached process whose `scripts/check.py` sleeps, waits for
    it to be inside the gate, and then goes through the real `dispatch_task` guard
    -- the function the browser''s POST calls. Run it with another checkout''s interpreter
    and it reports what that checkout says. Both of these are that script''s output,
    ten minutes apart:


    **Before** (main clone''s interpreter, unmodified `main` at 43c06da) -- the reported
    bug, reproduced:


    > task-001 is held by a dispatch that started (pid 962208) and has not yet said
    which run it became, so it cannot be shown to be over. If it is genuinely stuck,
    restarting AgentJobs clears locks whose runs have ended.


    Lock file: `pid=962208 run=`


    **After** (this branch):


    > task-001 is held by a scripted finish (fin_1ffd1590) started at 03:27:41, 9s
    ago, which is merging it now. Approving a task on this machine runs the merge
    itself -- rebase, the full gate, a --no-ff merge, and the rebuild that puts it
    in front of you -- so there is nothing to dispatch. When it lands the task closes;
    if it stops, the ball comes back with the step it stopped at written on the record.


    Lock file: `pid=978148 run= kind=finish finish=fin_1ffd1590 started=2026-08-25T08:27:41+00:00`


    Both refusals are `LiveRunExistsError(reason=live_run_exists)`, which is what
    the task page renders verbatim. The exception type, the reason and the lock''s
    behaviour are unchanged -- only what it says.


    ## The other three shapes


    - **Dispatch, run named, run recorded live** -- unchanged text plus the restart
    sentence: *"...Cancel that run and this task is dispatchable again; it appears
    under this task''s runs. If it is genuinely stuck, restarting AgentJobs settles
    runs that were live when it last stopped and clears their locks."*

    - **Dispatch, no run named, pid alive** -- this is the brief window between taking
    the lock and having a run to name, and it is now described as that: *"...has not
    named its run yet -- that window is a moment wide, so try again shortly..."*.
    No restart advice: a live holder''s lock is not something a restart clears.

    - **Finish whose process is gone** -- *"...whose process (pid N) is gone, so nothing
    is merging. Restarting AgentJobs clears locks whose holders have ended."* Normally
    unreachable, because for a finish an absent pid is proof and the lock is reclaimed
    rather than refused; it survives for the case where the one reclaim an acquisition
    is allowed has already been spent.


    ## Verification


    - Full gate, unqualified, on the branch: 10/10 green, 199.8s (pytest 118.3s --
    three concurrent gates were not running, but the machine was not idle either).

    - Eight new tests in `tests/test_dispatch_lifecycle.py::TestRunLock`. The load-bearing
    one is `test_a_finish_holder_and_a_dispatch_holder_read_differently`: same contention,
    two kinds of holder, two messages -- it fails if the kind stops being written
    and the code goes back to inferring the holder. sc-3 is tested from both sides
    deliberately, because narrowing the restart advice is easy to overshoot into deleting
    it.

    - `tests/test_dispatch_lifecycle.py tests/test_dispatch_guards.py tests/test_dispatch_finish.py
    tests/test_finish_approval_hook.py`: 178 passed.


    ## Not done, deliberately


    The spec''s own aside -- whether the GUI should hide or disable Dispatch while
    a finish holds the lock -- is untouched. It is a second question, the task says
    so, and it needs the browser to know a finish is running, which is a different
    piece of plumbing from what a refusal says once it has already happened.'
