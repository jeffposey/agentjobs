spec:
  summary: 'The Playbooks page ships and groom and reorder are one click on it. Two
    things stop flesh-out being usable the same way: running it against a task means
    typing that task''s id into a field on a different page, and the dispatch confirmation
    fires on precisely the tasks flesh-out exists to fix, because it is keyed on an
    empty description.'
  intent: A playbook is worth having only if reaching for it is easier than writing
    the prose yourself. groom and reorder clear that bar because they act on the whole
    project and a single button says everything. flesh-out acts on one task, so the
    button belongs on that task -- and today it is the one playbook whose route to
    running it is worse than not having it.
  description: '**Follows task-215, which shipped the Playbooks page, and task-218,
    which raised the second half of this as an open question rather than fixing it
    out of scope.**


    ## What exists today, so nobody rebuilds it


    `frontend/src/components/Playbooks.tsx` lists every playbook the project holds
    with its contract, and a Run button that goes through the existing dispatch dialog.
    A `target: project` playbook -- groom, reorder -- is one click. A `target: task`
    playbook renders a text input for the task id, which was the right call for that
    task''s scope and is not where this should end.


    ## Gap 1 -- flesh-out has no entry point from a task


    To flesh out task-N you navigate to the Playbooks page and type `task-N` into
    a field. That is backwards: you were already looking at task-N when you decided
    it was thin. The natural control is on the task itself -- a "Flesh this out" action
    on the task page that runs the `target: task` playbook against the task you are
    reading, with no id to retype and no chance of typing the wrong one.


    Worth thinking about generally rather than special-casing one playbook: **any
    `target: task` playbook should be offerable from a task page**, driven by the
    contract''s `target` field, so a fourth one added later appears there without
    a frontend change. Whether that is a menu, a single action, or something else
    is a design call -- make it and say why.


    ## Gap 2 -- the brief guard refuses exactly the tasks flesh-out is for


    `record_can_brief` in `dispatch/guards.py` is keyed on an empty `spec.description`,
    deliberately and for good reasons stated at length in its docstring: it is the
    one state that unambiguously means *there is nothing here to work from*, and `ball_prompt`
    and empty `acceptance[]` were both considered and rejected as alternatives.


    That reasoning is sound for an ordinary dispatch and inverts for flesh-out. **An
    empty description is not a missing brief for this run; it is the input.** The
    brief is the playbook, which is exactly what the run carries. So the confirmation
    fires on every legitimate use and is cleared by typing any character into the
    description -- which is worse than not firing at all, because it trains the click-through
    and would then be silent on the ordinary dispatch it was written for.


    **The likely shape: a run that carries a playbook pointer has a brief, so the
    guard should take the playbook into account rather than looking only at the record.**
    Do not simply exempt playbook runs wholesale without checking what else that would
    wave past. Whatever you decide, keep the guard firing on an ordinary dispatch
    of a description-less task -- that case is real and it is the one the guard was
    built for.


    ## Worth considering, not required


    - **Past runs are invisible from the page.** A playbook''s value is that it improves
    across runs, and today there is no way to see from the GUI that groom has run
    three times or what came of them. The run tasks exist (task-288, task-290 for
    groom; task-289, task-291 for reorder) and are linked by nothing. A "recent runs"
    list per playbook would make the improve-over-time story legible. Decide whether
    it belongs here or in its own task.

    - **The brief is readable over REST but the page may not show it.** Check whether
    a reader can see what a playbook will actually instruct before pressing Run, and
    fix it if not -- pressing Run on an unread brief is the thing most likely to produce
    a run somebody regrets.


    ## What this task is not


    Not a new invocation surface, not recurrence, and not an MCP run tool -- decision
    P10 forbids the last of those and its absence is deliberate: an agent starting
    a run is an agent causing a dispatch. This is about making the surfaces that already
    exist reachable from where the user already is.'
  constraints: '- Do not add an MCP tool that runs a playbook. Design decision P10
    is binding and its absence is the feature.

    - Every existing dispatch gate must still bind. This task changes where a run
    is started from, never what is permitted to start one.

    - `record_can_brief` must still fire on an ordinary dispatch of a task with an
    empty description. Narrow it for playbook-carrying runs, do not disable it.

    - Drive the per-task offer from the playbook contract''s `target` field, not from
    a hardcoded name, so a future task-target playbook needs no frontend change.

    - Assert on rendered values rather than markup presence, per ENGINEERING.md''s
    verification rules.'
  out_of_scope: Recurrence, scheduling and event triggers -- all deferred by the design
    and unaffected by this. Any MCP mutation. Changing what groom or reorder do; they
    are one click already and this task does not touch them beyond whatever falls
    out of shared components.
  context:
  - path: frontend/src/components/Playbooks.tsx
    why: 'The page task-215 shipped, including the task-id field this task is replacing
      as the primary route for a target: task playbook.'
  - path: src/agentjobs/dispatch/guards.py
    why: record_can_brief, keyed on an empty spec.description, and its docstring explaining
      why the alternatives were rejected -- read it before narrowing it.
  - path: src/agentjobs/api/routes/playbooks.py
    why: The run route a task-page control would call, including how it resolves a
      target task.
  - path: playbooks/flesh-out.md
    why: 'The brief itself: what a run will do to the task, and why an empty description
      is its input rather than a blocker.'
