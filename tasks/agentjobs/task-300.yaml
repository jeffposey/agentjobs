spec:
  summary: 'The playbooks design deferred recurrence and wrote the condition for reopening
    it. That condition was met on the day the playbooks shipped: groom ran twice and
    reorder ran twice in one day, against a stated threshold of "more than weekly".
    Design how a run fires on an event -- an epic closing, a batch of tasks arriving
    -- with the authorisation and bounds the product already requires of every other
    autonomy.'
  intent: A backlog rots between the moments someone remembers to tend it, and remembering
    is the part a tool should absorb. The moments that most want a groom or a reorder
    are exactly the moments a person is least likely to think of them -- just after
    finishing a large piece of work, when the backlog has changed most and attention
    has moved on.
  description: "**Requested by Jeff, 2026-08-23, hours after the playbooks epic (task-211)\
    \ closed:** *\"the goal should be that the human doesn't need to remember to click\
    \ groom and reorder, these get triggered automatically after epic tasks, or other\
    \ triggers.\"*\n\n**This is a design task, not an implementation task.** Follow\
    \ the task-081 and task-211 pattern: produce a design document, get it approved,\
    \ derive implementation children as drafts. Do not build the trigger machinery\
    \ under this task.\n\n## The design deferred this deliberately, and named its\
    \ own reopen condition\n\n`docs/playbooks-design.md` \xA78 decided playbooks are\
    \ on-demand: no schedule, no standing queue. Read it before anything else -- the\
    \ reasoning is good and most of it still binds. Its argument was that a scheduled\
    \ groom is *\"cron with judgement\"*, that deferring cost almost nothing because\
    \ the human act is one click, and that **building recurrence before the playbooks\
    \ had run even once would be automating an unmeasured process.**\n\nThat last\
    \ clause is the one that has expired. It also wrote the condition explicitly:\n\
    \n> **Reopen when:** the manual cadence becomes the demonstrable bottleneck (groom\
    \ runs requested more than weekly, or the backlog demonstrably rots between requested\
    \ runs).\n\n**Measured against that, on 2026-08-23 alone:** groom ran twice (task-288\
    \ at 06:02, task-290 at 17:37) and reorder ran twice (task-289 at 18:19, task-291\
    \ at 21:08). Four judgement runs in one day against a threshold of *more than\
    \ weekly*. The condition is met by roughly an order of magnitude, on the first\
    \ day the machinery existed, and the process is no longer unmeasured -- three\
    \ live runs produced recorded evidence and each found a defect in its own brief.\n\
    \n## What \xA78 already decided about how it must land, and this is binding\n\n\
    > when it reopens, it lands on task-078's authorization machinery: a `chain_authorized`-shaped\
    \ entry naming the playbook, a cadence, and bounds, so recurrence arrives with\
    \ the same evidence rules as every other autonomy in this product.\n\nAnd it named\
    \ the prepared hook: `run_task.acceptance` in the frontmatter (\xA73.2) -- *\"\
    a playbook whose runs carry acceptance criteria is a playbook a bounded loop can\
    \ evaluate.\"* Both briefs already carry acceptance. Do not invent a parallel\
    \ authorisation path; this rides task-078's.\n\n## The distinction the design\
    \ turns on, and the thing most likely to be got wrong\n\n**Jeff asked for event\
    \ triggers, not a schedule, and they are not the same proposal.** \xA78 rejected\
    \ \"cron with judgement\". An epic closing is not cron: it is a discrete, meaningful,\
    \ rare event that a person would agree warrants a look. That difference is the\
    \ whole basis for reopening and should be argued explicitly rather than assumed.\n\
    \nThe cautionary precedent is decision **P8**, which withdrew the reactive-playbook\
    \ category outright after Jeff called it *\"overly complicated and hard to use\
    \ as it is\"*. What was withdrawn there was a debounced, spend-capped model call\
    \ fired by **every queue move** -- a fine-grained everyday gesture. An epic close\
    \ is coarse-grained and rare. **State where the line between those falls**, because\
    \ \"fire a playbook on an event\" is exactly the shape that was rejected once,\
    \ and a design that does not distinguish itself from P8 will deserve the same\
    \ fate.\n\n## What the design must answer\n\n- **Which events.** Jeff named an\
    \ epic closing. Candidates worth weighing: a parent task closing with all children\
    \ done; N tasks created since the last run; a queue-corruption detection; a task\
    \ closed as duplicate suggesting more exist. Argue each in and out rather than\
    \ listing them.\n- **What fires, and how strong.** A dispatched run, or a *suggestion*\
    \ a human accepts with one click? The second is much cheaper to get right, keeps\
    \ a human in the loop by construction, and would still remove the remembering\
    \ -- which is the actual ask. Consider it seriously as the first increment rather\
    \ than a lesser version.\n- **Authorisation.** Whose approval, recorded where,\
    \ and how it is bounded and revoked. \xA78 says `chain_authorized`-shaped; work\
    \ out what that means concretely for a playbook.\n- **Spend and runaway bounds.**\
    \ What stops an epic-close trigger firing during a night when six epics close.\n\
    - **Interaction with the gates that already exist.** groom's propose-then-approve\
    \ does not disappear because a machine started the run; if anything a machine-started\
    \ run makes that gate more load-bearing, not less.\n- **What a triggered run must\
    \ not do.** The existing constraint that a playbook never widens what may execute\
    \ on a machine holds unchanged.\n\n## Related\n\ntask-078 is the authorisation\
    \ machinery this must use. task-211 is the closed epic whose \xA78 this reopens.\
    \ task-299 covers the GUI surfaces for manual runs and is independent of this."
  constraints: "- Design only. Produce a document and derive implementation children\
    \ as drafts; build no trigger machinery under this task.\n- Recurrence must land\
    \ on task-078's authorisation machinery, per design \xA78. Do not invent a second\
    \ autonomy path.\n- Human gates inside a playbook are untouched by how the run\
    \ started. groom still proposes and waits.\n- A trigger must never widen what\
    \ may execute on a machine. Every dispatch gate binds exactly as it does for a\
    \ manual run.\n- Distinguish the proposal from decision P8's withdrawn reactive\
    \ category explicitly. A design that does not say why it is different from the\
    \ thing already rejected has not made its case."
  out_of_scope: Building the triggers. Cron-style scheduling, unless the design argues
    its way to it from evidence rather than assuming it. Changing what groom, reorder
    or flesh-out do when they run. The manual GUI surfaces in task-299.
  context:
  - path: docs/playbooks-design.md
    why: Section 8 is the deferral this reopens, including the reopen condition and
      the requirement to land on task-078's machinery. Decision P8 in section 10 is
      the precedent a trigger design must distinguish itself from.
  - path: docs/agent-dispatch-design.md
    why: The gates a triggered run must still pass, and the human-clocked rule a machine-started
      run has to answer for.
  - path: playbooks/groom.md
    why: Its propose-then-approve gate is what keeps a machine-started groom safe,
      and its run_task.acceptance is the hook section 8 named.
