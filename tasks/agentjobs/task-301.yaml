- id: 10
  ts: '2026-08-25T10:42:40.218294Z'
  actor: claude
  type: decision
  body: 'The report RECOMMENDS the deep cut, and adds a ceiling. The spec invited
    the opposite answer, so here is why it was not taken, and what was rejected.


    WHAT THE MEASUREMENT SAYS. This repository''s always-loaded markdown is 24,902
    of a dispatched session''s 75,619 opening tokens - 32.9%, the largest block anyone
    here can act on, and 6.4x the entire MCP surface. The audit''s hypothesis was
    that compressing ENGINEERING.md optimises the wrong half. It does not. It is the
    right half.


    REJECTED: "recommend against the cut because the harness is 57%." True but not
    a reason. The harness is not ours; a share we cannot move is not a denominator
    that makes our own share unworthy of moving. And 24,902 tokens is not marginal
    in absolute terms either.


    REJECTED: "a one-time 3,900-word cut is enough." Between 2026-08-21T15:47 and
    2026-08-25T09:57 the two files gained 29,355 bytes - about 1,240 words a day at
    this repository''s measured 6.31 bytes/word - so a 3,900-word cut is undone in
    roughly three days at that rate. That window contains the audit itself and is
    an upper bound, not a steady state; but even at a quarter of the rate the cut
    is gone inside a fortnight. A cut without a ceiling is seasonal.


    WHAT IS PROPOSED INSTEAD, for task-305 to adopt without re-deriving: a byte cap
    enforced by a test, copying the 512-char pattern in src/agentjobs/mcp/instructions.py.
    ENGINEERING.md 26,000 B, ALLAGENTS.md 23,000 B, AGENTS.md 2,000 B, CLAUDE.md 200
    B; bundle total 52,000 B with 800 B of slack, down 30% from today''s 74,746 B.
    Enforce the bundle total, treat the per-file numbers as guidance for where to
    look.


    WHY 52,000 AND NOT A ROUND NUMBER: it is where the bundle actually stood on 2026-08-21T20:00
    (51,903 B), plus the ~1 KB AGENTS.md Codex section added since, which is load-bearing.
    Nobody called the bundle thin that day and several sessions worked correctly against
    it. An anchor a reader can check beats an aspiration.


    CORROBORATION, arrived at independently: task-269''s fixes 4 and 5 propose removing
    about 3,900 words. At the measured 2.11 tokens/word that is ~8,200 tokens / ~24,600
    bytes, which takes the bundle to ~50,150 B - within 4% of the 52,000 anchor. Task-269''s
    proposed cut is the right size. This task does not revise it; it justifies it
    and bounds what comes after.


    BYTES, NOT WORDS OR TOKENS, for the cap itself: `wc -c` needs no tokenizer, runs
    in a test, and means the same thing on both runners. The conversions are recorded
    so a word-count proposal can still be priced: 3.0 bytes/token (Claude), 4.4 (Codex),
    2.11 tokens/word.


    WHAT THIS TASK DELIBERATELY DID NOT DO. It says where the tokens are; it does
    not say which sentences are load-bearing. That is task-304''s question, and the
    report says so rather than implying the cap can be met by cutting whatever is
    largest. It also states that if 52,000 B cannot be reached without dropping a
    rule that has prevented a real failure, the right move is to raise the cap on
    the record, not to make the bad trade.'
  data:
    operation:
      id: c8d3f261-9e04-4a77-b5da-6f1e30ab7c95
      kind: log_append
      fingerprint: 723b8f75d44ee88aaeab42526cbf617d
