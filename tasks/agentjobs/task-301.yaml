- id: 8
  ts: '2026-08-25T10:42:08.724246Z'
  actor: claude
  type: progress
  body: 'Measured, written up, gate green. Branch `docs/task-301-context-budget`,
    worktree `C:/projects/worktrees/aj-301`, commit 647f2b7 (rebased onto main). Deliverable:
    `docs/context-budget.md`, plus a row in `docs/index.md`''s dated-reports table.
    No prose was cut and no MCP registration touched, per the constraint.


    METHOD. The spec asked for `/context`, which a dispatched run cannot invoke. Two
    better instruments were available and both read the prompt rather than reconstruct
    it:


    (A) First-request input tokens straight out of the session transcripts. `input_tokens
    + cache_creation_input_tokens + cache_read_input_tokens` on a session''s first
    assistant message is exactly what request 1 carried. Claude: `~/.claude/projects/<slug>/*.jsonl`.
    Codex: `last_token_usage.input_tokens` on the first `token_count` event in `~/.codex/sessions/`.
    181 Claude sessions and 27 Codex sessions were read this way; no session was started
    to produce any figure and no API key was used.


    (B) Self-instrumentation. To price one specific file, emit it as a Bash tool result
    of known byte size and read the step it causes in this session''s own usage ladder:
    tokens = input(k+1) - input(k) - output(k). That is the production tokenizer on
    the exact text. Validated in-run by control turns: sub-1 KB results cost 177/305/352/359
    tokens, the right order, proving nothing was silently dropped.


    NUMBERS (2026-08-25, Claude Code 2.1.238 / claude-opus-5).

    - This run''s own first request: 75,619 tokens.

    - ENGINEERING.md 13,639 tok (40,699 B). ALLAGENTS.md 10,701 tok (32,536 B). agentjobs/AGENTS.md
    548 tok. CLAUDE.md after stripping 14 tok. Repo-controlled total 24,902 = 32.9%.

    - Outside repo control: harness prompt + built-in tool schemas + skills + agent
    list + env 42,876 (56.7%, residual); GLOBAL-AGENTS.md 3,838; MEMORY.md ~2,668;
    C:/projects/AGENTS.md ~1,069.

    - MCP surface: 3,795 tokens, and in 2.1.238 it is NOT in request 1 - it is injected
    on the first tool call. The two repo markdown files cost 6.4x the entire MCP surface.

    - Interactive vs dispatched, same day and version (2026-08-24): 69,846 vs 74,087.
    A dispatched run pays ~4,240 tokens more than an interactive one for the same
    work - larger than the whole MCP surface, and never counted before.

    - Codex (0.149.0-alpha.4.1 / gpt-5.6-sol, 2026-08-25): first request 19,095. Codex
    does not expand @-imports, so ENGINEERING.md and ALLAGENTS.md are not auto-loaded,
    C:/projects/AGENTS.md is not loaded at all, and there is no MEMORY.md. Repo share
    at open: 1.7%. It then reads both files as tool results (+8,965 and +7,367 measured
    from its own ladder), reaching 35,650 with a 46.8% repo share.


    TOKENIZER CAVEAT, stated in the doc: the same two files run 3.0 bytes/token under
    Claude''s tokenizer and 4.4 under Codex''s. Token figures do not cross the runner
    boundary; bytes do.


    CORRECTION TO THE EXISTING AUDIT: auditor 1''s chars/4 estimator understates this
    repository''s markdown by about a quarter. Measured ratio is 2.98-3.04 B/token
    for ENGINEERING/ALLAGENTS and 2.48 for link-dense markdown. Use 3.0.


    INCIDENTAL FINDING worth knowing: `cat` of a file over roughly 30 KB is never
    loaded into context - the harness persists it to `tool-results/` and substitutes
    a 2 KB preview, which cost 916 tokens against 13,639 for the whole file. Both
    large files had to be chunked for the measurement to work at all.


    VERIFICATION: full unqualified gate on the rebased branch, all 10 stages green,
