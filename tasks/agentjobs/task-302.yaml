- id: 12
  ts: '2026-08-25T11:05:39.074367Z'
  actor: claude
  type: progress
  body: "**All four original items are done. Two of them needed no edit \u2014 the\
    \ documents had already been corrected between the audit and now, and I verified\
    \ that against the code rather than assuming it. Branch `docs/task-302-bundle-contradictions`,\
    \ one commit, full gate green.**\n\nThe auth-stall item from entries 5 and 6 merged\
    \ separately under task-313 (`4262a3f`), so its branch was already gone; this\
    \ run started clean from `main` at `6c34f09`.\n\n## 1. Parent claimability (ac-1)\
    \ \u2014 no edit needed, and here is why\n\nThe spec pointed at `manager.py:1180-1195`.\
    \ That range has moved; `claim()` is now at **`src/agentjobs/manager.py:1281`**,\
    \ and its docstring at **1293** opens: *\"A task with open children can be claimed,\
    \ and what it hands you is the supervisor's seat (task-164).\"* The body confirms\
    \ it \u2014 there is no children check among the refusals, and line **1337** writes\
    \ `supervision_prompt(children) if children else WORK_PROMPT`. The skip lives\
    \ in `get_next_task`'s claimability filter instead, at **line 569**: `and task.id\
    \ not in open_children`.\n\n`GLOBAL-AGENTS.md` line 139 currently reads: *\"a\
    \ parent with an open child is skipped by `agentjobs next`, but it can still be\
    \ claimed by name \u2014 and claiming one hands you the supervisor's seat, not\
    \ the children's work.\"* That is exactly what the code does, on both halves.\
    \ `docs/task-schema.md:84` and `docs/schema-design.md:96-98` agree.\n\n**So the\
    \ finding is stale.** The sentence auditor 3 flagged has been rewritten since\
    \ 2026-08-21. I left it alone rather than editing it to say the same thing differently\
    \ \u2014 and note for the record that **nothing was written to `C:/ai/shared/GLOBAL-AGENTS.md`\
    \ in this run**, so there is no out-of-repo change to account for.\n\n## 2. The\
    \ `ball_prompt` exemption (ac-2) \u2014 also no edit needed\n\n`models_v2.py:875`\
    \ is the check: `if reason is not BallReason.AVAILABLE and not (self.ball_prompt\
    \ or \"\").strip()`. `ALLAGENTS.md:346` already carries the exemption in the schema\
    \ doc's own words \u2014 *\"required whenever the ball is set, **except `agent/available`**,\
    \ where the spec is itself the ask\"* \u2014 plus the sentence explaining why\
    \ a `ready` task can sit with an empty prompt. Same conclusion: fixed between\
    \ the audit and now.\n\nBoth of these are worth stating plainly because the task's\
    \ own verification section predicted the failure mode: a doc \"corrected\" to\
    \ match a stale reading is the same defect with a new date. The correction here\
    \ was to confirm and leave, not to edit.\n\n## 3. The double-numbered merge gate\
    \ (ac-3) \u2014 fixed\n\n**Decision: ENGINEERING.md owns the numbering, as the\
    \ spec suggested.** It already holds the restart-ownership rule, the posture table\
    \ and the `--posture-release` command, so a reader following a step there has\
    \ the context the step depends on. ALLAGENTS' list was the one that had to give.\n\
    \nWhat was wrong: ALLAGENTS' task lifecycle numbered its own 6 and 7 over the\
    \ same actions ENGINEERING numbers 3 to 6, so **\"step 6\" named the delivery\
    \ step in one file and the merge in the other**, and each file's follow-on section\
    \ then cited its own numbering \u2014 `#### Steps 3 to 6 may already have happened\
    \ before you read them` against `### Steps 6 and 7 may be done before you wake\
    \ up`, for one procedure.\n\nWhat changed:\n\n- ALLAGENTS' lifecycle **stops at\
    \ the approval**. Its step 6 now points at `ENGINEERING.md#the-merge-gate` by\
    \ anchor and names the range there, keeping only the two things a reader needs\
    \ *before* arriving \u2014 `-d` never `-D`, and \"you are not finished when the\
    \ merge commit exists\". Step 7 is gone, absorbed into that pointer.\n- ALLAGENTS'\
    \ follow-on heading is now `### The post-approval steps may be done before you\
    \ wake up`, and its first paragraph links ENGINEERING's `Steps 3 to 6` section\
    \ by anchor. No second numbering survives anywhere.\n- ENGINEERING's merge gate\
    \ gained a short paragraph saying **this is the only numbered list**, what the\
    \ old duplication looked like, and that anything citing a step \u2014 prose, docstring\
    \ or test \u2014 cites this one. That is the part that stops it growing back.\n\
    - `dispatch/finish.py`'s module docstring and `_finish` docstring cited *\"ALLAGENTS.md\
    \ steps 6-7\"*, a numbering that no longer exists. Both now cite the merge gate's\
    \ 3-6. `finish.py:29`'s *\"not at step 4\"* was already ENGINEERING's numbering\
    \ and is unchanged.\n\n**Cross-references checked, not assumed.** I wrote a throwaway\
    \ checker that extracts every markdown link with an anchor across ENGINEERING,\
    \ ALLAGENTS, AGENTS, `docs/agent-workflow.md`, `docs/agent-dispatch-design.md`,\
    \ `docs/task-schema.md` and `docs/schema-design.md`, slugifies every heading in\
    \ each target, and reports mismatches. Result on the branch: **31 anchored links,\
    \ 0 broken.**\n\nIt found **five that were already broken on `main`** \u2014 I\
    \ ran it there too, before my edits, and got the identical five. Two headings\
    \ had gained a date suffix after the links to them were written (`### The epic\
    \ walk: one human act, many runs (task-022, 2026-08-23)` and `### What is checked,\
    \ and what is merely claimed (added 2026-08-20, task-188)`). Fixed by correcting\
    \ the four link targets rather than shortening the headings, which is the lower-risk\
    \ direction. Recorded here because the audit reported all intra-doc anchors as\
    \ correct and that is no longer true.\n\n## 4. Worktree naming (ac-4) \u2014 fixed\n\
    \n**Decision: `<repo>-<nnn>` wins, where `<repo>` is the project's directory name\
    \ \u2014 so `agentjobs-<nnn>` here.** The deciding argument is that `PROMPT_STUB`\
    \ is a template rendered into every project's prompt and cannot know a project's\
    \ short name, so `<repo>-<nnn>` is the literal string every dispatched agent is\
    \ actually told to run. Making the docs match the prompt is one prose edit; making\
    \ the prompt match the docs is a code change the constraints rule out.\n\n**Rejected:\
    \ keeping `aj-` and teaching the stub the short name.** It is the nicer abbreviation\
    \ and it is what half the live worktrees use, but it puts a per-project lookup\
    \ into the one surface that has to work before the agent has read anything, to\
    \ save six characters in a directory name.\n\nChanged: `ENGINEERING.md` (three\
    \ examples), `ALLAGENTS.md` (lifecycle step 2 and the naming bullet, which now\
    \ states the rule rather than only showing an example), `docs/agent-dispatch-design.md:2127`,\
    \ and `ledger.py:1037`'s docstring. `docs/agent-workflow.md` kept the generic\
    \ statement but lost the carve-out that said AgentJobs uses `aj` and then declined\
    \ to choose between the two spellings \u2014 it now says older `aj-045` worktrees\
    \ are not wrong, just not what to write next.\n\nTwo documentation-contract tests\
    \ pinned the old spelling and were updated to follow: `test_documentation_contract.py:248`\
    \ and `test_worktree_bootstrap.py:93-94`. The separate assertion that every copyable\
    \ `git worktree add` lands under `worktrees/` is untouched and still passes.\n\
    \n## A blocker that was not mine, and had to be cleared to finish at all\n\n**The\
    \ first full gate failed, and `main` was the reason.** `tests/test_task_corpus.py::test_agentjobs_context_paths_exist`\
    \ reported `task-317 -> docs/context-budget.md`. I ran that test in the main clone\
    \ before concluding anything: **it failed there too**, so `main` was red and so\
    \ was every branch cut from it \u2014 including every other child of task-269,\
    \ which merge through `agentjobs finish` and so cannot merge against a red gate\
    \ at all.\n\nCause: task-317 was filed by the task-301 session and pointed at\
