spec:
  summary: GLOBAL-AGENTS says a parent is unclaimable while a child is open; the code
    says it is claimable. ALLAGENTS states the ball_prompt rule without the agent/available
    exemption the schema has. The merge gate is numbered twice, and each file cross-references
