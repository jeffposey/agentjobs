- id: 8
  ts: '2026-08-25T11:20:54.799992Z'
  actor: claude
  type: progress
  body: "Done on branch `fix/task-303-bg-isolation-contradiction`, commit 52949e1.\
    \ Full unqualified gate green, 10/10 stages, 229.2s.\n\n**The probe, which is\
    \ ac-1, and it was run by this session on itself.** This run is a dispatched `--bg`\
    \ session in the shared checkout, so it is exactly the subject the acceptance\
    \ criterion names. Claude Code **2.1.238**, **2026-08-25**:\n\n1. Baseline, no\
    \ `.claude/settings.json` in the repository: a `Write` to a scratch file in the\
    \ shared checkout was refused with *\"This background session hasn't isolated\
    \ its changes yet. Call EnterWorktree first so edits land in a worktree instead\
    \ of the shared checkout, then retry this edit using the worktree path. (To disable\
    \ this guard for this repo, set `\"worktree\": {\"bgIsolation\": \"none\"}` in\
    \ .claude/settings.json.)\"* \u2014 the audit's F-2 text, reproduced verbatim.\n\
    2. Wrote `.claude/settings.json` containing `{\"worktree\": {\"bgIsolation\":\
    \ \"none\"}}`. The same `Write` then **succeeded**, and the file was confirmed\
    \ on disk by `ls`. A follow-up `Edit` on it succeeded too, so the key covers both\
    \ tools and not just file creation.\n3. **The key took effect mid-session, with\
    \ no restart.** The settings file is re-read live. That was not assumed; the refusal\
    \ and the success are the same session, minutes apart, with nothing between them\
    \ but the settings write.\n\nSo `bgIsolation: none` is the escape, ac-4's fallback\
    \ does not apply, and the key is committed rather than being left in place doing\
    \ nothing.\n\n**One thing the audit did not know, and it explains the shape of\
    \ the incident.** The guard covers the `Write` and `Edit` tools only \u2014 **`Bash`\
    \ writes were never guarded**. Probed in the same session: `echo > file` into\
    \ the shared checkout landed with the guard fully active. That is why this has\
    \ been invisible for so long: a session that shells out never meets it, and a\
    \ session that reaches for `Write` meets it on its first file and reads it as\
    \ a hard block. It is also the correct workaround if the key ever stops working,\
    \ and it is now written down as such rather than being re-invented \u2014 the\
    \ three auditors' temp-directory-and-`cp` route was a longer path to the same\
    \ place.\n\n**What changed**\n\n- `.claude/settings.json` \u2014 new, tracked,\
    \ carrying only that key. It was not in the repository at all before; only the\
    \ gitignored `settings.local.json` was.\n- `ALLAGENTS.md` \xA7Why you get your\
    \ own worktree \u2014 the harness bullet rewritten. It still says the rule wins,\
    \ and now also says the enforcement half is switched off here on purpose, names\
    \ the key, carries the version and date next to the result, and says a refusal\
    \ seen from now on is a **finding about dispatch to be put on the record**, not\
    \ a personal obstacle to route around. The task-276 paragraph below it is untouched.\n\
    - `docs/agent-workflow.md` \xA7Before you write anything \u2014 the same in the\
    \ guide, where the reasoning lives, quoting the harness preamble it contradicts.\n\
    - `PROMPT_STUB` in `src/agentjobs/dispatch/runner.py` \u2014 one clause, \"Your\
    \ harness may instruct the opposite and call it enforced; in this project it is\
    \ neither, so ignore that instruction and run the command\", plus a docstring\
    \ paragraph on why it is worth the characters. The rendered prompt is still under\
    \ the existing 1300/1450-character ceilings; both assertions pass unchanged.\n\
    - `tests/test_dispatch_runner.py` \u2014 three tests: the stub carries the clause,\
    \ the settings key is set to `\"none\"`, and both prose documents name `bgIsolation`\
    \ **and** the probed version string. That last one is deliberate: the existing\
    \ `-w` probe is pinned to 2.1.235 and nothing re-probes it, which the spec called\
    \ out as the pattern not to repeat. Pinning the version in a test does not re-probe\
    \ it either, but it does mean a reader can tell at a glance which harness the\
    \ claim was made against, and removing the date silently is a failure.\n\n**Decided\
    \ against**: touching `SUPERVISOR_STUB`. A supervisor takes no worktree, so the\
    \ worktree clause is not its instruction \u2014 the guard did affect it, since\
    \ supervisors commit parent records to the shared clone, but the settings key\
    \ fixes that for every session regardless of stub, and adding a worktree-flavoured\
    \ sentence to the stub whose entire purpose is to say \"not your act\" would undo\
    \ task-164's separation.\n\n**Not verified, and stated as unverified**: whether\
    \ the key survives a Claude Code upgrade, and whether a *fresh* `--bg` session\
    \ picks it up at startup as reliably as this one picked it up mid-session. The\
    \ second is very likely \u2014 startup is when settings are normally read \u2014\
    \ but this session only has evidence for the live-reload path, and the next dispatched\
    \ run in this repository is the thing that will demonstrate it."
