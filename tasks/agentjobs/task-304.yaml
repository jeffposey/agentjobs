    \ task-303 |\n| `task-record-on-main` | ENGINEERING \xA7Task files live on `main`,\
    \ always | 2026-08-11 failure 3 -- a handoff on a branch the reviewer could not\
    \ see |\n| `worktree-interpreter` | ALLAGENTS \xA7Bootstrapping a worktree | task-194\
