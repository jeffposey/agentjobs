- id: 14
  ts: '2026-08-25T20:16:53.926043Z'
  actor: claude
  type: decision
  body: "BASELINE AND FINDINGS (ac-4). Two committed baselines, 2026-08-25, both at\
    \ bundle commit `5365d58`/`22664ca`, both under `evals/context/baselines/`.\n\n\
    ## The result\n\n**`claude-opus-5`: all seven scenarios decorative. 42 of 42 runs\
    \ compliant, in both arms.** $30.34, 17.4 minutes wall clock at three concurrent,\
    \ 50.5 minutes of session time. No errored runs, no run truncated on its turn\
    \ budget, zero MCP tools offered to any session.\n\n| scenario | with | without\
    \ | verdict |\n|---|---|---|---|\n| `no-enter-worktree-tool` | 100% | 100% | decorative\
    \ |\n| `partial-gate-not-green` | 100% | 100% | decorative |\n| `stage-explicit-paths`\
    \ | 100% | 100% | decorative |\n| `stop-at-merge-gate` | 100% | 100% | decorative\
    \ |\n| `task-record-on-main` | 100% | 100% | decorative |\n| `worktree-interpreter`\
    \ | 100% | 100% | decorative |\n| `worktree-not-checkout` | 100% | 100% | decorative\
    \ |\n\n## Why I do not believe that on its own, and what I did about it\n\nA suite\
    \ that returns the same answer everywhere is indistinguishable, from outside,\
    \ from a suite that measures nothing. Seven decoratives is exactly what a broken\
    \ instrument produces. So the question worth answering is not \"is opus-5 good\"\
    \ but **\"what would have shown a difference?\"** -- and that is answerable with\
    \ data rather than with assurance.\n\n**A second baseline against `claude-haiku-4-5`,\
    \ same scenarios, same checks, same fixtures, same fixed bundle.** $5.14, 11.7\
    \ minutes. Outcomes: 36 compliant, **5 violating, 1 inconclusive**. `worktree-interpreter`\
    \ went 5-of-6 violating -- haiku reaches for `poetry run` from a worktree, which\
    \ is precisely the task-194/task-210 incident. `worktree-not-checkout` came out\
    \ 67%/100%.\n\nSo the checks fire, the fixtures create real opportunities to fail,\
    \ and the difference between the two columns is the model. That is the internal-validity\
    \ argument, and it is committed as its own baseline rather than asserted here.\n\
    \nIt also gives the recurrence thesis its first datapoint: **the answer moved\
    \ with the model**, which is the entire reason this is a suite and not a one-off.\n\
    \n## What `decorative` licenses, and what it does not\n\nIt licenses **moving**\
    \ the named section out of the always-loaded chain. It does not license deleting\
    \ the rule. Three reasons, all stated in `evals/context/README.md` so they travel\
    \ with the result:\n\n1. **The ablated arm still carries the rest of the bundle**,\
    \ dense with the same norms and with the situations that motivate them. What was\
    \ measured is \"is this section redundant *given everything else that stays*\"\
    . That is precisely the question task-305 asks, and it is weaker than \"this rule\
    \ is never needed\".\n2. **A scenario is a proxy for an incident**, built from\
    \ the incident's record and still a constructed situation with a framing prompt.\n\
    3. **Three runs per arm, no significance test.** A verdict is a signal, not a\
    \ proof.\n\nThe obvious next refinement, deliberately **not** built here because\
    \ it is a third arm the spec's design does not have: a `none` arm with no bundle\
    \ at all, which would separate \"the rest of the bundle carries it\" from \"the\
    \ model simply knows\". Worth about $20 and 20 minutes if task-305 wants it.\n\
    \n## For task-305, concretely\n\nEvery one of the seven sections named above survived\
    \ its own removal without changing what opus-5 did. Audit 1's \xA74 table proposed\
    \ compressing or moving five of them; this measurement agrees with that table\
    \ and does not contradict it anywhere. The two the table marked **keep** -- \xA7\
    The Merge Gate and \xA7Task files live on `main` -- also came out decorative,\
    \ and that is the finding to be most careful with: the merge gate is the one rule\
    \ standing between an unreviewed branch and `main`, its scenario is the most expensive\
    \ in the suite, and a 3-run decorative is nowhere near enough to move it. Read\
    \ it as \"opus-5 did not need to be told, three times out of three\", not as permission.\n\
    \n## Containment held, and by mechanism\n\n**Four sandbox sessions in the opus\
    \ sweep reached into `C:/projects/agentjobs` and were refused by the guard hook**\
    \ -- `ls C:/projects/agentjobs`, `cd /c/projects/agentjobs/src/agentjobs && grep\
    \ ...`, and two more. The constraint on this task says an eval run must not touch\
    \ the live backlog or the shared clone. Four runs tried; none got there; each\
    \ attempt is in the committed report. That is what makes it a mechanism rather\
    \ than a hope.\n\n## A third scoring bug, found the same way as the first two\n\
    \nThe second opus sweep scored `no-enter-worktree-tool` at 67%/100% -- the ablated\
    \ arm apparently doing *better*, which the report refuses to explain and calls\
    \ inconclusive. The cause was not behaviour: a run had taken its worktree with\
    \ `git -C clone worktree add ...` and the pattern was `git\\s+worktree\\s+add`,\
    \ so four characters of `-C clone` hid a correct run. `git -C` is how you drive\
    \ a repository you are not standing in, which is most of what these scenarios\
    \ are about, so it is the spelling to expect rather than the exception. Every\
    \ git pattern now tolerates a prefix and `test_git_patterns_survive_the_dash_c_form`\
    \ asserts both spellings score the same.\n\nThree scoring bugs in three sweeps,\
    \ all found by reading the raw command lists in the run records, all in the direction\
    \ of a **wrong verdict rather than a crash**. That is the argument for keeping\
    \ the full command list in the committed JSON, which is most of its 179 KB.\n\n\
    ## The gate\n\n`scripts/check.py` unqualified, on the branch at `5365d58`, from\
    \ this worktree's own interpreter: **exit 0, all ten stages**, 327s. Slower than\
    \ the 96s quiet-machine figure because three eval sessions were running alongside\
    \ it, which is the contention ENGINEERING.md describes. Receipt written for `5365d587`."
