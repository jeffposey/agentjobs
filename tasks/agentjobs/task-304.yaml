  status: pending
- id: ac-3
  text: Each scenario is scored on a checkable action trace wherever possible; every
    judge-scored scenario has a written rubric in the repository, not in a prompt.
  status: pending
- id: ac-4
  text: One baseline run is committed with the date and the model id, and the report
    states per-rule whether it was load-bearing, decorative, or not working.
  status: pending
- id: ac-5
  text: "The suite is runnable by a named command, and the docs say when to run it\
    \ \u2014 at minimum, on a new model release."
  status: pending
