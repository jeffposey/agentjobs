- id: 12
  ts: '2026-08-27T10:31:52.709231Z'
  actor: claude
  type: answer
  body: "**Measured. The mechanism is real, and the trigger is narrower than the question\
    \ assumed in a way that matters a great deal here: a nested `CLAUDE.md` loads\
    \ on `Read` and `Grep`, and does NOT load on a Bash `cat`.**\n\nI missed this\
    \ question on my first read \u2014 I read the record at 09:47 and it was added\
    \ at 09:49 \u2014 and found it when logging results. The cut was already gate-green\
    \ by then. I ran the experiment anyway, because the answer is cheap and permanent\
    \ whichever way it goes.\n\n## What was run\n\nClaude Code **2.1.238**, 2026-08-27,\
    \ haiku-4-5, `claude -p --output-format json`. Two scratch trees, identical but\
    \ for one file: `A/` has a one-line root `CLAUDE.md`; `B/` has the same plus `B/sub/CLAUDE.md`,\
    \ 8,648 bytes of a distinctive numbered marker rule. Both have `sub/thing.py`\
    \ defining `widget_alpha`. Prompts asked the model to quote \"nested marker rule\
    \ number 017\" or reply NOT_LOADED, so the probe reports whether the text reached\
    \ the model rather than whether a token count moved.\n\n| # | What the session\
    \ did | Nested file loaded? |\n|---|---|---|\n| 1 | nothing \u2014 just answered\
    \ | **no** |\n| 2 | `Read sub/thing.py` | **yes** |\n| 3 | `Bash: cat sub/thing.py`\
    \ | **no** |\n| 4 | `Grep` for a string under `sub/` | **yes** |\n| 5 | `Write\
    \ sub/scratch.txt` | *inconclusive* \u2014 a permission prompt blocked the tool,\
    \ so the gesture never landed |\n\nToken accounting agrees with the behavioural\
    \ probes, using \xA79's instrument (input + cache_creation + cache_read):\n\n\
    - Probe 1: **A and B both 34,053 tokens, to the token** \u2014 10 + 11,876 + 22,167\
    \ in each. An 8.6 KB file that loaded at session start could not produce that.\n\
    - Probe 2 pair: A **68,497**, B **70,059**. **+1,562 tokens** in the tree that\
    \ has the nested file, for a file whose text is deliberately repetitive and so\
    \ tokenises well.\n\nProbe 3 was checked against this repository's own rule about\
    \ automated gestures: the run was re-asked to name the function it saw, answered\
    \ `widget_alpha`, and *still* answered NOT_LOADED. The `cat` landed and the file\
    \ did not load. Probe 5 is reported as inconclusive for the same reason in reverse\
    \ \u2014 the tool never executed, so it proves nothing.\n\n## The three outcomes\
    \ the question offered, and which one this is\n\nNeither \"it never loads\" nor\
    \ \"it loads eagerly\". It is the third: **deferred, and therefore a real lever.**\
    \ But two caveats turn it from \"adopt this\" into \"this needs its own task\"\
    :\n\n- **The trigger is the native file tools, not the shell.** Dispatched runs\
    \ in this repository are handed a bypassPermissions preamble that tells them to\
    \ prefer Bash for reading and editing \u2014 *\"read files with cat, head, or\
    \ sed -n... make file changes with sed, heredocs, or short scripts, rather than\
    \ using the dedicated Read, Edit, or Write tools\"*. This very run followed it.\
    \ So a rule placed in `src/agentjobs/dispatch/CLAUDE.md` would be invisible to\
    \ precisely the sessions that do most of the work here, unless one happened to\
    \ `Grep` first. That is not a reason to abandon the idea; it is a reason the idea\
    \ comes with a second decision about how dispatched sessions read files.\n- **Codex\
    \ is untested and the question's own warning stands.** Codex reads `AGENTS.md`,\
    \ not `CLAUDE.md`, and per `docs/context-budget.md` \xA74 it does not auto-load\
    \ `ENGINEERING.md`/`ALLAGENTS.md` at all \u2014 it reads them as tool results\
    \ because `AGENTS.md` says to. Whether Codex defers a nested `AGENTS.md` was not\
    \ measured. A rule moved to a nested file could become invisible to Codex rather\
    \ than deferred, which is a correctness question rather than a budget one.\n\n\
    ## Whether it should have changed what this task cut\n\n**No, and I would not\
    \ redo the cut given the answer.** The distinction is what moved:\n\n- Everything\
    \ task-305 moved is **rationale, incident narrative, measurement history and duplication**.\
    \ It went to `docs/`, to a dynamic prompt that already carried it, or to the task\
    \ record that found it. A nested `CLAUDE.md` is a worse home for all of it than\
    \ `docs/` is \u2014 `docs/` is reachable by any agent, any tool, and by a person,\
    \ and none of it is directory-scoped anyway.\n- **Every rule stayed in the always-loaded\
    \ bundle.** The lever this question identifies is about moving *rules* out \u2014\
    \ a rule only somebody editing `src/agentjobs/dispatch/` needs. That is a different\
    \ operation, with the two correctness risks above, and it should be specced and\
    \ measured rather than folded into a compression pass.\n\nSo the finding is additive\
    \ to this epic rather than a correction to it, and it is worth its own task under\
    \ task-269. What it would need to settle: whether dispatched sessions can be made\
    \ to trigger the load reliably (or told to `Grep` first), whether Codex honours\
    \ a nested `AGENTS.md`, and which rules are genuinely directory-scoped \u2014\
    \ my guess is fewer than it feels like, since most of ENGINEERING.md and ALLAGENTS.md\
    \ is about the workflow rather than about a subsystem.\n\nI have not filed that\
    \ task: the spec says not to absorb follow-ups without authorisation, and the\
    \ supervisor holding task-269 is better placed to decide where it sits in that\
    \ epic. The measurement above is complete enough to file from without re-running\
    \ anything."
