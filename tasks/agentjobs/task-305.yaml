- id: 13
  ts: '2026-08-27T10:32:55.171777Z'
  actor: claude
  type: decision
  body: "**The cap is 60,000 bytes, not task-301's 52,000, and the cut was stopped\
    \ at 58,557 deliberately.** This is ac-5's decision entry.\n\n## What was rejected\n\
    \n**REJECTED: cut to 52,000.** It was reachable \u2014 there is always another\
    \ paragraph to compress \u2014 but the only material left at 58,557 was rules.\
    \ Getting the last ~6,500 bytes would have meant shortening the `--since-gate`\
    \ properties past the point where they say what not to weaken, thinning the merge\
    \ gate's numbered steps, or moving rules into a `docs/` file a session has to\
    \ know to open. The spec is unambiguous about that trade: *\"A budget that forces\
    \ a rule out is a worse outcome than a large file.\"* Task-301 authorised the\
    \ same escape in its own \xA78: *\"if 52,000 B cannot be reached without dropping\
    \ a rule that has actually prevented a failure, report that and raise the cap\
    \ with the reason on the record.\"*\n\n**REJECTED: no cap at all, or a soft one\
    \ in prose.** Task-301's central finding is that a cut without a ceiling is seasonal\
    \ \u2014 the two files gained about 1,240 words a day over the window it measured,\
    \ so a 3,900-word cut is undone in days. A cap nothing enforces is a statement\
    \ of intent, which is the same argument ENGINEERING.md already makes for putting\
    \ checks in the gate rather than in a list.\n\n**REJECTED: a generous cap with\
    \ room to grow into.** 60,000 leaves ~1,450 bytes of slack, which is tight on\
    \ purpose and mirrors the 800 bytes task-301 proposed on 51,200. Tight is the\
    \ point: adding a rule then requires either fitting it or raising the cap in a\
    \ commit that says which rule needed the room. That is the behaviour the cap exists\
    \ to produce.\n\n## Why the anchor was not reached, in numbers rather than in\
    \ adjectives\n\nThe word target was substantially met. The byte anchor was not,\
    \ because the anchor is a snapshot of files that have since grown by rules.\n\n\
    | | 2026-08-21 (the anchor's day) | before this branch | after |\n|---|---:|---:|---:|\n\
    | ENGINEERING.md + ALLAGENTS.md, words | 8,717 | 12,260 | **8,902** |\n| four-file\
    \ bundle, bytes | \u2014 | 78,055 | **58,557** |\n\n- The audit's target was **3,900\
    \ words** out of the two large files. This removed **3,358**.\n- The two files\
    \ are now **185 words larger than they were on 2026-08-21** \u2014 while carrying\
    \ six days of genuinely new rules that arrived in between: task-293's scripted-finish\
    \ cleanup, task-303's `bgIsolation` finding and its refusal-reporting rule, task-308's\
    \ posture ceiling, the finish configuration, the queue move notices. None of that\
    \ is narrative and none of it was cut.\n- So the residual gap to 52,000 is not\
    \ slack I declined to squeeze. It is six days of rules the anchor predates.\n\n\
    ## What would actually close it\n\nNot more compression of these two files. Three\
    \ things, in the order I would rank them:\n\n1. **The nested-`CLAUDE.md` lever**,\
    \ measured in the answer to entry 10 and recorded in `docs/context-budget.md`\
    \ \xA78b. It defers real bytes. It also has two open correctness questions and\
    \ needs its own task.\n2. **Task-301's own ranked list of cheaper levers**, none\
    \ of which has been touched: the dispatched-session premium over interactive (~4,240\
    \ tokens, never examined) and per-project MCP scoping (~3,795 tokens, nine of\
    \ ten servers irrelevant here) are together larger than everything cut in this\
    \ task.\n3. **`scripts/context_eval.py` on a new model release.** Some of what\
    \ is currently load-bearing may be redundant with a later model's defaults, and\
    \ that is the only instrument that can say which \u2014 a verdict there is the\
    \ honest way to remove a rule rather than compress one.\n\nLowering `BUNDLE_BUDGET_BYTES`\
    \ is the right instinct and the test's docstring says so; the constraint is that\
    \ it be lowered by finding more rationale to move, not by grinding a rule until\
    \ it stops being one."
