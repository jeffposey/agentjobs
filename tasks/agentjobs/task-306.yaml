- id: 11
  ts: '2026-08-27T11:03:38.212129Z'
  actor: claude
  type: decision
  body: "**Three surfaces deliberately got nothing, and the reasons are different.**\n\
    \n**The CLI.** The earlier decision said \"the MCP mutation tool result and the\
    \ CLI's write commands\" would render these. On inspection the CLI has no write\
    \ command that can construct either condition: `agentjobs create` does not accept\
    \ a summary at all (it passes `title`, `description`, `priority`, `category` and\
    \ nothing else to `create_task`), `promote` clears `ball_prompt` on its way out\
    \ of draft, and `work` is an interactive claim-then-close loop. A check wired\
    \ into those would be one that has never fired and never can \u2014 ENGINEERING's\
    \ own test for a check is \"ask what it would have caught; if the answer is nothing\
    \ that has ever gone wrong here, it is decoration\". So the CLI got nothing, and\
    \ the earlier decision is corrected here rather than quietly. **Reopen trigger:**\
    \ if `agentjobs create` ever grows a `--summary` option, that command becomes\
    \ a real surface and should call `check_record(task, verb=\"create\")`.\n\n**The\
    \ React create form.** `frontend/src/components/TaskCreate.tsx` writes `spec.summary`\
    \ and is a genuine human authoring path, so this is a real gap rather than a non-surface.\
    \ It is out because covering it means either reimplementing the 40-word rule in\
    \ TypeScript \u2014 two copies of one rule in two languages, which is the drift\
    \ this module's own `DEFAULT_BALL_PROMPTS` test exists to prevent \u2014 or promoting\
    \ `record_warnings` onto the API mutation envelope, which is the wire cost the\
    \ previous decision argued against. Neither is a five-minute change and neither\
    \ is named in the acceptance criteria. The right shape if it is ever wanted is\
    \ probably not a post-write warning at all but a live word count under the textarea,\
    \ which is a UI design question and a separate task.\n\n**`ENGINEERING.md`.**\
    \ It has a \"Measuring performance\" section naming its two instruments, and `scripts/corpus_stats.py`\
    \ is a third instrument of the same kind. It is not added there because this task's\
    \ `out_of_scope` reserves the always-loaded static files to the sibling children,\
    \ and because that bundle is capped by `tests/test_context_budget.py` \u2014 spending\
    \ budget on a script that runs once per audit is exactly the trade task-301 measured\
    \ against. The script documents itself, `docs/task-corpus-audit.md` names it,\
    \ and `docs/index.md` points at both."
