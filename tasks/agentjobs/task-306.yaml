- id: 9
  ts: '2026-08-27T10:42:42.016497Z'
  actor: claude
  type: decision
  body: "**These two warnings are addressed to the author of the write, at the moment\
    \ of the write, and they are not in `agentjobs validate` at all.**\n\nWhat they\
    \ are for: to catch a record-quality drift *while the person or session that caused\
    \ it is still in context and can fix it in one edit*. That is the whole value.\
    \ A record whose summary ran to 54 words was written by a session that has since\
    \ ended; telling anybody about it later produces a chore, not a fix.\n\nSo the\
    \ shape is `queue_check.py`'s, deliberately, and its docstring states the governing\
    \ rule already: *\"Silence is the normal outcome, and that is a requirement rather\
    \ than an aspiration. A warning that fires on ordinary moves is wallpaper, and\
    \ wallpaper is worse than nothing because it trains a reader to click past the\
    \ one that mattered.\"* A new module `record_check.py` computes both conditions\
    \ as a pure function of one `Task`, and the two surfaces that answer an author\
    \ \u2014 the MCP mutation tool result and the CLI's write commands \u2014 render\
    \ what it returns. Nothing refuses, nothing exits non-zero, no existing record\
    \ is touched.\n\n**Rejected \u2014 per-record warnings in the corpus sweep (`agentjobs\
    \ validate`), which is what the spec's check 1 literally asks for.** On today's\
    \ corpus that is 51 of 58 recent records lit up on the first run. The readers\
    \ of that output are a pre-commit hook and CI, and neither is the record's author:\
    \ the advisory would fire on a commit that did not cause it, about records the\
    \ committer did not write. That is precisely the backlog the spec warns against,\
    \ and the second-order cost is worse than the noise \u2014 `validate`'s findings\
    \ are today uniformly *errors that must be fixed*, and mixing in 51 lines nobody\
    \ will act on trains a reader to skim past the `queue-duplicate` and `dependency-cycle`\
    \ lines in the same block.\n\n**Rejected \u2014 a `created:` cutoff date, warning\
    \ only on records newer than it.** It removes the noise and keeps the sweep, but\
    \ it makes two byte-identical records validate differently according to a date\
    \ buried in source, which nobody reading the output can see; and the cutoff needs\
    \ curating forever or it silently stops meaning anything. It also concedes the\
    \ real point: the sweep is the wrong reader either way.\n\n**Rejected \u2014 corpus\
    \ statistic only, with no per-record warning anywhere.** This is the cheapest\
    \ option and it is what check 3 asks for on its own, but it fails ac-2 and ac-3:\
    \ a statistic in a doc that is regenerated at audit time is not a signal at the\
    \ moment a record is written, and the drift the audit measured happened while\
    \ a statistic like it could have existed.\n\n**Adopted alongside, not instead:**\
    \ the corpus view still exists, as `scripts/corpus_stats.py`, run when someone\
    \ is auditing rather than on every commit. It is what produces check 3's questions/answers-per-100-entries\
    \ figure, and it also reports how many existing records each warning *would* fire\
    \ on \u2014 so the size of the backlog stays visible to an auditor without being\
    \ pushed at a committer.\n\n**One further design point, decided the same way.**\
    \ The warnings are computed at the caller from the task the mutation response\
    \ already returns, not carried over the wire in a new API field. A record warning\
    \ is a pure function of one record; a queue warning is not \u2014 it depends on\
    \ the state of a whole band at the moment of the move, which only the server saw,\
    \ which is why `queue_warnings` has to travel. Adding an API field for something\
    \ every client can already derive costs an OpenAPI change, a generated-client\
    \ regeneration and a frontend type for no information gained."
  data:
    operation:
      id: b81d5f27-0a64-4c3e-9d12-5f7a3e60c4a8
