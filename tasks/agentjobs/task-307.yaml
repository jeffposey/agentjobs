- id: 3
  ts: '2026-08-23T22:34:59.492938Z'
  actor: Jeff Posey
  type: decision
  body: '**A dispatch may raise posture above the configured default. This settles
    sc-1; do not relitigate it.**


    Jeff, 2026-08-23, asked directly whether the pulldown should be able to escalate
    or only narrow: *"yes, those decisions are correct, I understand the risk of picking
    a pull down option."*


    **The rejected alternative was lower-only** -- a control that can only narrow
    posture below what `dispatch.yaml` resolved, and therefore can never turn a browser
    click into `bypassPermissions`. It was rejected because it does not deliver the
    feature: the reason to choose a posture at dispatch time is to say "let this one
    run unattended", and a control that cannot express that is not the thing that
    was asked for. The risk it avoids was named explicitly to Jeff before he answered
    -- that the browser is reachable from a phone over Tailscale, and that once task-021
    lands, choosing `autonomous` means choosing "merge without me" -- and he accepted
    it.


    **What this does not decide**, and what the implementer still owns:


    - Whether escalation costs anything at the point of use. The spec floats requiring
    the typed note, or naming the raised posture in the authorising entry so the record
    shows a human chose it rather than inherited it. Jeff accepted the risk of the
    control existing; he did not rule on its ergonomics. Decide it, and record that
    decision too.

    - The warning copy beside `autonomous`, which is downstream of task-021''s own
    recorded decisions. Read them first.


    **Still out of scope regardless**: dispatching automatically when Approve is clicked.
    Jeff deferred that separately on the same day -- *"lets keep that out of scope
    for now, waiting for me to try auto dispatch"* -- and accepting escalation here
    does not reach it. It is a different question: this one is what envelope a run
    gets, that one is who authorises it.'
  data:
    operation:
      id: e15b7d90-3c4a-4f28-9b61-08a7d2e6f513
      kind: log_append
      fingerprint: f048416963fc7f09fe14cc1a9657e7a6
- id: 4
  ts: '2026-08-23T22:49:19.713233Z'
  actor: Jeff Posey
  type: decision
  body: "**The pulldown's escalation is now bounded by a project ceiling. Read this\
    \ with entry 3, which it amends rather than replaces.**\n\nJeff, 2026-08-23, immediately\
    \ after the escalation decision in entry 3, on the related question raised by\
    \ task-308: *\"yes, project should have max posture, and default posture, duh\"\
    *.\n\n**What changes for this task.** Entry 3 stands \u2014 a human clicking this\
    \ control may choose a posture above the project's default. What is added is a\
    \ ceiling: `dispatch.yaml` will carry a `max_posture` as well as a default, and\
    \ no source may resolve above it. So the control offers postures in the range\
    \ *[anything] \u2026 max_posture*, defaulting to the project's default posture.\n\
    \n**Two consequences for the implementation, both concrete:**\n\n1. **Do not offer\
    \ a choice the API will refuse.** The pulldown is populated from what the resolved\
    \ config permits, not from the `Posture` enum. A control that lists `autonomous`\
    \ on a project capped at `auto`, and then surfaces a 4xx when it is picked, is\
    \ a worse outcome than not offering it \u2014 it teaches the operator that the\
    \ control lies.\n2. **The refusal still has to exist.** The browser is not the\
    \ only caller. The API and the CLI flag (sc-2, sc-3) must clamp or refuse independently\
    \ of what any client chose to display, because a client-side filter is a convenience\
    \ and never a control.\n\n**Sequencing.** task-308 owns the ceiling \u2014 the\
    \ config field, its default for an existing `dispatch.yaml`, and the precedence\
    \ order among project default, task record and dispatch-time choice. This task\
    \ consumes it. If 308 has not landed when this one is worked, say so on the record\
    \ and hand the ball back rather than inventing a second answer to where the ceiling\
    \ comes from; two implementations of a permission ceiling is the failure worth\
    \ avoiding here.\n\n**Unchanged**: auto-dispatch on Approve is still out of scope,\
    \ deferred by Jeff on 2026-08-23."
  data:
    operation:
      id: 5c8d3f16-2047-4ba9-8e73-9d0b1a45f2e0
      kind: log_append
      fingerprint: 08dd8721ab2fd8d8795a4f44352dd791
