- id: 14
  ts: '2026-08-25T04:59:52.268440Z'
  actor: claude
  type: decision
  body: '**Escalation costs a written record, not a typed note. This settles the first
    of the two questions decision entry 3 left to the implementer.**


    Entry 3 delegated this explicitly: *"Jeff accepted the risk of the control existing;
    he did not rule on its ergonomics. Decide it, and record that decision too."*
    Deciding it now so that the block on task-308 costs no design time later.


    **The decision.** When the chosen posture is *above* the project''s resolved default,
    the authorising log entry that the server writes says so, naming the posture and
    the surface. When the chosen posture is at or below the default, nothing extra
    happens and the entry reads exactly as it does today.


    The mechanism already exists and is not new surface: `compose_authorization_body(actor,
    surface)` in `dispatch/guards.py:365` already composes that entry''s body and
    already names the surface it came from. This adds a clause to it. `DispatchRequestBody.user`
    (task-188) is what causes the entry to be written on the browser path, and that
    plumbing is untouched.


    **Rejected: requiring the typed note when escalating.** It was the spec''s own
    first suggestion and it is the worse of the two. It puts friction on the exact
    case the feature exists for -- "audit this one with the big model, and let it
    merge" -- and friction on a common path trains the operator to type `x` and press
    on, which yields a record that *looks* like accountability and is not. A note
    nobody reads is weaker evidence than a sentence the server writes and cannot be
    skipped. The typed note stays what it is today: available, optional, and the human''s
    own words when they have some.


    **Rejected: nothing extra at all.** The task''s own constraints require that *"the
    record says which posture ran and not merely which one the config would have given"*.
    Silence would satisfy that only for the dispatch entry, not for the question a
    reader actually asks six weeks later, which is "why did this run get bypass, and
    who decided that".


    **Consequence for sc-5, and it is a real gap in the current acceptance criteria.**
    The dispatch entry already records `posture:` in its `data` -- visible in entry
    7 and entry 12 of this very task, both reading `posture: auto`. So half of sc-5
    passes today without any change. What is missing is **which source supplied it**,
    and that field (`posture_source`: `project` / `task` / `dispatch`) is named by
    task-308''s sc-4 as well. It should be implemented once, by whichever task lands
    first, and consumed by the other. Whoever picks this up: check whether 308 already
    added it before adding it again.'
