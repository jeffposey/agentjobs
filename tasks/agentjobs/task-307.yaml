spec:
  summary: "Posture is fixed in `dispatch.yaml` per runner, group or project. Jeff\
    \ wants to pick it from a pulldown next to the Dispatch button, the way he will\
    \ pick a runner group (task-184). Nothing supports that today: there is no posture\
    \ field on the dispatch request, no `--posture` flag on the CLI, and no control\
    \ in the browser. The unresolved question is whether a browser click may *raise*\
    \ posture above the configured default, since `autonomous` means bypassPermissions\
    \ and \u2014 once task-021 lands \u2014 merging without a human."
  intent: "Jeff, 2026-08-23: \"being able to choose the runner group from pulldown,\
    \ and posture from pulldown, before clicking dispatch\". Posture is a per-dispatch\
    \ decision in practice \u2014 \"audit this one with the big model, and let it\
    \ merge\" is judged against the task in front of you, not configured once per\
    \ project \u2014 but the system only lets it be configured once per project."
  description: "## What exists, verified 2026-08-23\n\nPosture reaches a run from\
    \ exactly one place: the resolved `dispatch.yaml`, where it is\na field on a runner,\
    \ a group, or the project (`Posture` default `AUTO`,\n`src/agentjobs/dispatch/config.py:387`,\
    \ parsed at `:736`). Three surfaces would each\nneed to learn about it, and none\
    \ of them has:\n\n- **API** \u2014 `DispatchRequestBody` (`src/agentjobs/api/models.py:816`)\
    \ carries\n  `caused_by`, `group`, `user` and `note`. No posture. `DispatchStarted`\
    \ *reports* the\n  posture back, so the response half of the round-trip already\
    \ exists.\n- **CLI** \u2014 `agentjobs dispatch run` takes `--project`, `--caused-by`,\
    \ `--group`. No\n  `--posture`.\n- **Browser** \u2014 `DispatchPanel.tsx` renders\
    \ posture as read-only text\n  (\"Runner X, posture Y, authorised by Z\", around\
    \ line 373) and has no control for it.\n\nSo this is not a pulldown. It is a request\
    \ field, a guard rule, a CLI flag and a\ncontrol, in that order.\n\n## The decision\
    \ this task must not skip\n\n**May a dispatch raise posture above what the config\
    \ resolved, or only lower it?**\n\nThe case for lower-only: posture is the safety\
    \ envelope, `dispatch.yaml` is a file on\ndisk that a human edited deliberately,\
    \ and the browser is a surface reachable from a\nphone over Tailscale. A control\
    \ that only narrows can never turn a click into\n`bypassPermissions`, so it needs\
    \ no new trust argument at all.\n\nThe case for allowing escalation: the whole\
    \ point of the feature is \"let this one run\nunattended\", and a control that\
    \ cannot express that is not the feature Jeff asked for.\nIf escalation is allowed\
    \ it should cost something the way `--as` was made to \u2014 the\ntyped note,\
    \ or naming the raised posture in the authorising entry so the record shows a\n\
    human chose it.\n\nThere is precedent for refusing the easy version. `agentjobs\
    \ dispatch run --help` says a\n`--as` flag was considered and deliberately left\
    \ alone: *\"it is the same trust model the\nHTTP path already has, but it is a\
    \ new surface for authorising runs and nothing\ncurrently needs it.\"* Whatever\
    \ is decided here, record it as a `decision` with the\nrejected alternative \u2014\
    \ a later reader cannot recover this from the diff.\n\nThe stake rises when task-021\
    \ merges. After it, `autonomous` will mean the run merges\nits own work without\
    \ a human, so this dropdown stops being \"what may it execute\" and\nbecomes \"\
    may it merge without me\". Read task-021's recorded decisions before designing\n\
    the control's copy; the warning text beside `autonomous` is downstream of them.\n\
    \n## Sequencing\n\ntask-184 adds the runner-group pulldown to the same panel and\
    \ is frontend-only, because\nthe API already accepts `group`. **Land task-184\
    \ first.** Both tasks edit\n`DispatchPanel.tsx`; done concurrently they conflict\
    \ for no benefit, and 184 establishes\nthe shape of a per-dispatch choice control\
    \ that this one should copy rather than invent.\n\n## Out of the design entirely\n\
    \nAuto-dispatch on Approve. Jeff deferred it explicitly on 2026-08-23 \u2014 \"\
    maybe? lets keep\nthat out of scope for now, waiting for me to try auto dispatch\"\
    \ \u2014 and it is a different\nquestion (who authorises) from this one (what\
    \ envelope)."
  constraints: "- The human-clocked rule is untouched. `assert_human_clocked` still\
    \ decides *whether* a dispatch may start; this task only changes *what envelope*\
    \ the started run gets. A posture field must never become an alternative route\
    \ to authorising a run.\n- The posture the run actually got is already reported\
    \ on `DispatchStarted` and written to the dispatch log entry. Whatever is chosen\
    \ must show up there, so the record says which posture ran and not merely which\
    \ one the config would have given.\n- Read-only over `dispatch.yaml`. Choosing\
    \ a posture for one dispatch never rewrites the file, exactly as choosing a group\
    \ never creates one.\n- Assert on rendered values, not the presence of markup\
    \ \u2014 a control that renders `Posture.AUTONOMOUS` while the test checks a `<select>`\
    \ exists is the failure mode this repository has already been bitten by.\n- `poetry\
    \ run python scripts/check.py` passes, and the generated client is regenerated\
    \ before the commit, not after."
  out_of_scope: "Dispatching automatically when Approve is clicked (deferred by Jeff,\
    \ 2026-08-23). Authoring or editing runners, groups or postures in `dispatch.yaml`\
    \ from the browser (task-178). Agent types as a role layer carrying posture (task-227)\
    \ \u2014 that is a possible successor to this, not this."
  context:
  - path: src/agentjobs/api/models.py
    why: DispatchRequestBody around line 816 is the field set that has no posture;
      DispatchStarted below it already reports one.
  - path: src/agentjobs/dispatch/config.py
    why: Posture is resolved here and nowhere else - the default at line 387 and the
      parse at line 736.
  - path: src/agentjobs/dispatch/guards.py
    why: Where a rule about which postures a request may ask for would live, beside
      assert_human_clocked.
  - path: frontend/src/components/DispatchPanel.tsx
    why: Renders posture as read-only text today. task-184 adds the group pulldown
      here first.
  - path: src/agentjobs/cli.py
    why: dispatch run takes --group and would take the posture flag the same way.
