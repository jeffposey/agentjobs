- id: 15
  ts: '2026-08-25T05:00:23.702177Z'
  actor: claude
  type: decision
  body: "**The copy beside each posture states its merge consequence, and a posture\
    \ the project cannot actually perform is offered disabled with the reason. This\
    \ settles the second question decision entry 3 left to the implementer.**\n\n\
    Entry 3 required task-021's recorded decisions be read first. They are read, and\
    \ they change the answer in a way the spec did not anticipate.\n\n**What task-021\
    \ actually established** (its decision entries 8 and 10):\n\n- `MergePolicy` is\
    \ a *property* of `Posture`, not a config key beside it: `read_only` \u2192 `none`,\
    \ `auto`/`supervised` \u2192 `review`, `autonomous` \u2192 `automatic`. So the\
    \ copy is derivable, not authored per option.\n- An autonomous merge runs through\
    \ `agentjobs finish --posture-release`, which merges only on a green unqualified\
    \ `scripts/check.py`.\n- **Accepted consequence: an autonomous merge requires\
    \ `finish.enabled` for the project.** *\"A machine that has not switched the finish\
    \ on has no sanctioned mechanism for one.\"*\n- Push is not a posture property,\
    \ is per project, and is `false` here.\n\n**The decision, in three parts:**\n\n\
    1. **Each option carries its merge consequence, in the operator's terms, not the\
    \ enum's.** `auto` and `supervised` \u2192 \"stops for your review before merging\"\
    . `autonomous` \u2192 \"merges its own work when the gate passes -- no review\"\
    . `read_only` \u2192 \"no shell, nothing to merge\". This is derived from `Posture.merge_policy`,\
    \ so it cannot drift from what the posture actually does.\n\n2. **`autonomous`\
    \ on a project without `finish.enabled` is offered *disabled*, with the reason.**\
    \ This is the part that comes out of task-021 rather than out of the spec. Without\
    \ the finish, choosing `autonomous` produces a run told in its prompt that it\
    \ may merge, on a machine with no sanctioned mechanism to do it -- the run then\
    \ either stops confused or improvises a `git merge`, which is the one thing task-021's\
    \ entry 8 exists to prevent. Disabled-with-a-reason is right where omitting-it\
    \ is wrong: the operator should learn *why* the option they were promised is unavailable,\
    \ and the fix (\"switch the finish on for this project\") is one line of their\
    \ own config. This is the same principle as entry 4's \"do not offer a choice\
    \ the API will refuse\", applied to a second reason a choice can be unusable.\n\
    \n3. **The panel says whether this project pushes.** One clause, beside the posture\
    \ line the panel already renders. This closes the gap task-021's entry 10 identified\
    \ and deliberately left open -- *\"'this project will merge my work without asking\
    \ me' is exactly the sort of thing that should be visible where the Dispatch button\
    \ is\"* -- and it closes it here rather than in a new task, because this control\
    \ is the place that entry was describing. It is read-only text, no new request\
    \ field, and it costs one boolean on the dispatch state view.\n\n**Rejected: a\
    \ confirmation dialog on `autonomous`.** The obvious safety reflex, and wrong\
    \ for this control. Jeff explicitly accepted the risk in entry 3 -- *\"I understand\
    \ the risk of picking a pull down option\"* -- so a dialog re-asks a question\
    \ he has already answered, every single time, and the cost lands entirely on the\
    \ case the feature was built for. A modal that always appears is a modal nobody\
    \ reads. The written record decided in entry 14 is the accountability, and it\
    \ does not need the operator's attention to work.\n\n**Rejected: neutral copy\
    \ naming only the posture.** That is what the panel does today, and it is what\
    \ task-021 flagged as a real gap. \"posture autonomous\" tells an operator nothing\
    \ about whether their work merges without them.\n\n**Explicitly not decided here,\
    \ because it is task-308's:** which postures appear in the list at all. That is\
    \ `[everything <= max_posture]` and the ceiling does not exist yet. This decision\
    \ governs how an option *reads* once 308 has determined that it is offered."
