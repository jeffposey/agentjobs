  type: progress
  body: "**Built on branch `feat/task-307-posture-pulldown`, two commits, full unqualified\
    \ gate green with a receipt for `9c37905e`.**\n\n**What task-308 had already done,\
    \ checked before writing anything.** Its merge (`bc02a36`) delivered more of this\
    \ task than the spec anticipated: `posture` on `DispatchRequestBody`, `--posture`\
    \ on the CLI, the `posture_above_ceiling` refusal, `posture_source`/`posture_ceiling`/`posture_requested`\
    \ on the dispatch entry, and `offerable_postures` on the dispatch state view.\
    \ So **sc-2, sc-3 and sc-5 were already met when this run started**, and what\
    \ remained was sc-4 -- the control Jeff actually asked for -- plus the two design\
    \ decisions this task owns.\n\n**The control.** `DispatchPostureChoice` in `DispatchPanel.tsx`,\
    \ labelled **Envelope**, copying `DispatchGroupChoice` exactly as task-184 intended\
    \ -- that file already said *\"task-307 adds `posture` here and changes nothing\
    \ else\"* and *\"this is the shape task-307 copies\"*. `DispatchOptions` gains\
    \ `posture`; `App.tsx` spreads options, so it needed no change at all.\n\n**Three\
    \ server fields added, all small, all for reasons rather than symmetry:**\n\n\
    - `posture_merge_policies` -- what each posture does to the branch, keyed by posture.\
    \ Sent rather than hardcoded in the client for the same reason `offerable_postures`\
    \ is, and the stake is higher: this is the difference between \"stops for your\
    \ review\" and \"merges without you\", so a client carrying its own copy could\
    \ tell an operator the opposite of what happens.\n- `finish_enabled` -- so `autonomous`\
    \ can be offered *disabled with the reason* where task-021's scripted finish is\
    \ off.\n- `push` -- closing the gap task-021's own decision entry 10 named and\
    \ left for a later task.\n\n**Decision entry 14 is implemented, not just recorded.**\
    \ The authorising entry the server composes now names a posture raised above the\
    \ project's default. Verified in the real path, not only in tests -- an escalating\
    \ dispatch writes: *\"Jeff Posey authorised a dispatch of this task from the task\
    \ page. **They chose posture `autonomous` for this run, above this project's `auto`.**\
    \ No extra instruction was given...\"* A narrowing dispatch writes exactly what\
    \ it wrote before. It stays silent for a task-record posture (that writer need\
    \ not be human, which is why task-308 bounds it with a ceiling instead of trusting\
    \ provenance) and never rewrites a typed note.\n\n**Verified through the real\
    \ path, and it caught a real error in my own work.** `scripts/dispatch_posture_sandbox.py`\
    \ stands five projects on port 8902 -- every configuration the control behaves\
    \ differently in. Standing it up showed that my first draft of the design note\
    \ was **wrong**: I had written that the control is absent on \"every project that\
    \ has not raised its ceiling\". It is not. An unset `max_posture` means the ceiling\
    \ is the project's *own posture*, so agentjobs at `auto` still offers `read_only`,\
    \ `supervised`, `auto` -- it just cannot escalate. The control vanishes only at\
    \ a `read_only` ceiling, the one posture with nothing beneath it. Fixed in the\
    \ design doc, the component comment, and the sandbox fixtures, and `unraised`\
    \ now exists as a fixture precisely because it is what every real project looks\
    \ like.\n\nEnd-to-end proof, against a live server rather than a test double:\n\
    \n- `POST /dispatch {\"posture\":\"autonomous\"}` on the raised project \u2192\
    \ run started, and the generated agent prompt reads *\"Posture `autonomous` releases\
    \ the merge gate: this run merges its own work with no human review.\"* The choice\
    \ reaches the run, not just the page.\n- The same on `unraised` with `supervised`\
    \ \u2192 `posture: supervised`, `posture_source: dispatch`, `posture_ceiling:\
    \ auto`.\n- All five state endpoints return the intended `offerable_postures`\
