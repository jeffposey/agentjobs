- id: 8
  ts: '2026-08-25T05:56:48.845578Z'
  actor: claude
  type: decision
  body: "**The four questions your entry 2 left open, decided and enforced. Each with\
    \ what was rejected.**\n\nYour ceiling settles sc-1 and sc-2 and is implemented\
    \ as written; none of it is relitigated below. These are the four things entry\
    \ 2 named as still open, plus one the implementation forced.\n\n---\n\n**1. Precedence:\
    \ most-specific-wins, and it is refused-versus-clamped that matters.**\n\nDispatch-time\
    \ choice > task record > project default. That is the obvious reading and it is\
    \ what shipped, tested in `TestPrecedence`.\n\nThe part that was **not** obvious,\
    \ and is the real decision: the two sources the ceiling bounds are treated differently\
    \ when they exceed it.\n\n| Source | Above the ceiling | Why |\n|---|---|---|\n\
    | Dispatch-time (`--posture`, task-307's control) | **Refused** \u2014 `posture_above_ceiling`,\
    \ HTTP 403 | A caller is waiting on an answer. Quietly handing them something\
    \ narrower than they asked for is worse than saying no. |\n| Task record | **Clamped**,\
    \ and the run records that it was | Nobody is waiting. Refusing would hand every\
    \ agent a denial of service *on its own task*: write an over-ceiling value once\
    \ into a file it can already write, and every future dispatch of that task fails.\
    \ |\n\n**Rejected: clamping both.** It makes an operator's explicit choice silently\
    \ not happen.\n**Rejected: refusing both.** It is the DoS above, and it also contradicts\
    \ your entry 2 in as many words \u2014 *\"an agent that edits its own task record\
    \ to autonomous on a project whose max_posture is auto gets auto\"*. Gets, not\
    \ is refused.\n\n---\n\n**2. `max_posture` defaults to the project's own `posture`.**\n\
    \nNot to `auto`, not to `autonomous`, not to a constant. Before this task, the\
    \ project's posture was the only posture a run could ever get; an absent ceiling\
    \ equal to it reproduces that exactly, so no existing `dispatch.yaml` widens on\
    \ upgrade. Verified against your real machine config, not a fixture: all three\
    \ projects report `max_posture=auto`, unchanged behaviour.\n\nThe cost, stated\
    \ rather than smoothed over: **the feature is opt-in twice.** A task's `posture:\
    \ autonomous` and task-307's pulldown both do nothing until the ceiling is raised\
    \ by hand in a file no AgentJobs surface writes. That is the point of it.\n\n\
    **Rejected: defaulting to `autonomous`** so the feature works out of the box.\
    \ It would silently release the merge gate for every project on the machine, which\
    \ is precisely the escalation this task exists to close.\n\n---\n\n**3. Width\
    \ order: `read_only` < `supervised` < `auto` < `autonomous`. This one is counter-intuitive\
    \ and load-bearing.**\n\nA ceiling has to compare postures, and the enum's declaration\
    \ order is not the answer. **`supervised` is narrower than `auto`.** The question\
    \ a ceiling asks is what a run may do *unattended*: supervised runs nine allow-listed\
    \ prefixes and parks on everything else, where `auto` is classifier-gated over\
    \ a far larger set. Supervised *feels* wider because a human at a terminal can\
    \ approve what it parks on \u2014 but that is a second authorisation arriving,\
    \ not something the run was granted, and a `--bg` session gets no such approval\
    \ (the `Posture` docstring's own 2026-08-19 incident).\n\nSo `max_posture: supervised`\
    \ means \"nothing here runs unwatched\", and handing it `auto` would defeat exactly\
    \ that.\n\nThe comparison is `Posture.within(ceiling)`, **not** `<=`. `Posture`\
    \ inherits `str`, so it already has comparison operators and they compare spelling:\
    \ alphabetically `read_only` sorts *above* `autonomous`, so a `<=` ceiling would\
    \ let the narrowest posture in the enum clear every cap. `test_string_comparison_would_have_got_it_backwards`\
    \ asserts the trap is real, so anyone who later \"simplifies\" `within` into `<=`\
    \ gets a failing test that explains why not.\n\n**Rejected: overriding `__le__`\
    \ and `__gt__` on the enum.** I wrote it that way first. Overriding two of the\
    \ six leaves the other four still comparing spelling, which is worse than overriding\
    \ none \u2014 a half-defined ordering is a trap that looks like a feature.\n\n\
    ---\n\n**4. An incoherent `dispatch.yaml` is refused at parse time, not clamped.**\n\
    \n`posture: autonomous` under `max_posture: auto` raises `DispatchConfigError`\
    \ naming both. Unlike the two sources the ceiling bounds, both halves of that\
    \ contradiction were typed by the same person into the same file, so there is\
    \ nobody to protect from anybody \u2014 running their default at their ceiling\
    \ would be the tool deciding which of two lines they meant. `resolve_posture`\
    \ still clamps that combination defensively, for a settings object built in code\
    \ rather than loaded from a file, so the code path fails closed rather than open.\n\
    \n---\n\n**5. `assert_human_clocked` is untouched, and here is the check on that\
    \ claim.**\n\nNothing in `resolve_posture` reads an actor, a log entry, or an\
    \ identity \u2014 that is the whole point of the ceiling, and it is why the guard\
    \ needed no change. The dispatch chain is unchanged in order and in effect: posture\
    \ resolution sits *above* the run lock and above every write, so an over-ceiling\
    \ request writes nothing at all (`test_a_refused_dispatch_writes_no_dispatch_entry`).\
    \ Starting a run and choosing what a run may do remain separate gates, and this\
    \ task touched only the second.\n"
