- id: 9
  ts: '2026-08-25T05:57:19.638316Z'
  actor: claude
  type: progress
  body: "**Built and verified. Branch `feat/task-308-posture-ceiling`, six commits,\
    \ `eb4e9f6`. Full unqualified gate green at 158.0s, exit 0, receipt written for\
    \ `eb4e9f6c`.**\n\n## What is on the branch\n\n**`ProjectDispatchSettings.max_posture`**\
    \ (`dispatch/config.py`) \u2014 optional, defaults to the project's own `posture`.\
    \ Read through `.ceiling`, which is never `None`. `.offerable_postures()` returns\
    \ everything at or below it, narrowest first, so a chooser and the resolver work\
    \ from one list.\n\n**`Posture.rank` and `Posture.within(ceiling)`** \u2014 the\
    \ width order, with the `<=`-compares-spelling trap documented on the method and\
    \ asserted in a test.\n\n**`resolve_posture(settings, task=, requested=)` \u2192\
    \ `ResolvedPosture`** \u2014 the whole precedence and clamping rule in one function\
    \ that reads no identity. Returns the posture, the source (`project` / `task`\
    \ / `dispatch`), the ceiling, and what was asked for if it was cut down. `.as_data()`\
    \ is what goes on the record; `.describe()` is the sentence the CLI prints.\n\n\
    **`Task.posture`** (`models_v2.py`) \u2014 optional `DispatchPosture`. `exclude_none`\
    \ keeps it out of every task file that never sets it, so introducing it rewrote\
    \ nothing; a test asserts that. Reachable through `PATCH /tasks/{id}` and MCP\
    \ `task_update_content`, deliberately \u2014 the ceiling is what makes the writer\
    \ irrelevant.\n\n**Three provenance fields on the `dispatch` entry** \u2014 `posture_source`,\
    \ `posture_ceiling`, and `posture_requested` (present only on a clamp). Optional,\
    \ so entries written before today keep their exact shape; the docs say to read\
    \ an absent `posture_source` as `project`, never as unknown. The same three go\
    \ into the run directory's `meta.yaml`.\n\n**`DispatchRequest.posture`**, resolved\
    \ in `dispatch_task` **above the run lock and above every write**, so a refused\
    \ request leaves the task exactly as it was.\n\n**The runner holds the resolved\
    \ posture** rather than reading `settings.posture` at each of its ten use sites\
    \ \u2014 prompt clause, permission flags, Codex session settings, run meta, dispatch\
    \ entry. One source, so a run's recorded posture cannot differ from the one it\
    \ was started under.\n\n**Surfaces**: `POST /tasks/{id}/dispatch` takes `posture`\
    \ and refuses above the ceiling as 403 `posture_above_ceiling`; the dispatch state\
    \ view carries `max_posture` and `offerable_postures`; `agentjobs dispatch run\
    \ --posture` and `dispatch config` show the ceiling.\n\n## Verification\n\n**The\
    \ gate.** `scripts/check.py`, no arguments, on the branch tip. All ten stages:\
    \ black 0.9s \xB7 ruff 0.1s \xB7 mypy 1.5s \xB7 api 4.4s \xB7 icons 2.5s \xB7\
    \ oxlint 0.7s \xB7 pytest 107.6s \xB7 vitest 5.4s \xB7 build 3.8s \xB7 e2e 31.1s.\
    \ Exit 0.\n\n**40 new tests.** 36 in `tests/test_dispatch_posture_ceiling.py`,\
    \ 4 in `tests/test_dispatch_api.py`.\n\nThe one that is a security property rather\
    \ than a rule is `TestAgentWrittenPostureCannotWiden`. It does what the spec's\
    \ own threat model describes: an agent writes `autonomous` onto its own task record\
    \ on a project whose config never raised its ceiling. Four assertions, and the\
    \ choice of what to assert on is the point \u2014\n\n- the run's `meta.yaml` says\
    \ `posture: auto`;\n- **the recorded argv contains no `bypassPermissions`.** Asserted\
    \ on argv, not on the resolver's return value, because the resolver agreeing with\
    \ itself proves nothing about what the operating system was handed;\n- the dispatch\
    \ entry says `posture_source: task`, `posture_ceiling: auto`, `posture_requested:\
    \ autonomous` \u2014 a reader learns it was cut down without opening a machine-local\
    \ file;\n- and its counterpart: **raising `max_posture` to `autonomous` lets the\
    \ identical value through.** Without that, the first three would pass on a broken\
    \ build that ignored the task field entirely.\n\n**Against the real machine config,\
    \ not a fixture.** `~/.agentjobs/dispatch.yaml` parses unchanged under the new\
    \ parser, and `dispatch config` reports `max_posture=auto` for agentjobs, job-hunting\
    \ and mastercalls \u2014 the upgrade-safety property, observed rather than argued.\
    \ Resolving against those real settings: no source \u2192 `auto (from the project)`;\
    \ task asks `autonomous` \u2192 `auto (asked for autonomous on the task, clamped\
    \ to the project ceiling auto)`; a dispatch-time request for `autonomous` \u2192\
    \ refused, `posture_above_ceiling`.\n\n**One pre-existing test needed updating**,\
    \ and it is the good kind: `test_the_content_patch_exposes_only_authoring_fields`\
    \ asserts the exact set of fields MCP will patch. It failed because `posture`\
    \ joined the set, which is the check working \u2014 a field cannot slip into the\
    \ agent-writable surface without somebody saying so in a diff.\n\n## Nothing visible\
    \ in a browser yet\n\nNo sandbox stood up, deliberately. The two new state-view\
    \ fields exist so task-307's control can populate from them, and no React component\
    \ reads them yet, so there is nothing for a reviewer to look at that they cannot\
    \ read in the diff. 307 is the task that gets a review server.\n\n## What this\
    \ unblocks\n\ntask-307 handed back on 2026-08-24 blocked on exactly one thing:\
    \ *\"`max_posture` does not exist in the codebase\"*. It does now, along with\
    \ `offerable_postures` on the state view, the `posture` request field, and the\
    \ 403 its pulldown must not be able to provoke. Its own decision entries 14 and\
    \ 15 flagged that `posture_source` should be implemented once by whichever task\
    \ landed first \u2014 it is implemented here, so 307 should consume it rather\
    \ than add it again.\n"
