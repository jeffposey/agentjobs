ball_prompt: "**Gate is green. Ready to re-run the finish. Branch `feat/task-308-posture-ceiling`\
  \ at `b8d5e78`, now seven commits \u2014 rebased onto `main`, full unqualified `scripts/check.py`\
  \ exit 0, 183.4s, all ten stages, receipt written for `b8d5e786`.**\n\nEntry 19\
  \ has the full account. The short version:\n\n**The gate failure was not this branch's.**\
  \ `TestProcessGroup::test_the_timeout_kills_the_grandchild_too` asserted that the\
  \ grandchild process was *already* dead the instant the supervisor thread joined.\
  \ `_terminate` signals the process group, so the parent and grandchild die concurrently\
  \ and independently, and `join` tracks the parent \u2014 nothing orders the grandchild's\
  \ exit before it. Under load it loses that race. The branch touches neither the\
  \ kill path nor that test; I checked both diffs against `main` before touching anything.\n\
  \n**Reproduced it rather than assuming.** A temporary probe ran the same scenario\
  \ polling instead of asserting, six times, with the full suite loading the machine\
  \ under `-n auto`. One run came back with the grandchild still listed at the moment\
  \ `join` returned and gone by the next poll \u2014 the gate's failure, in hand.\
  \ Probe deleted, not committed.\n\n**Fixed by waiting rather than assuming, and\
  \ checked that the wait is not a decoration**: `_dies_within(os.getpid(), 3.0)`\
  \ \u2014 a process that never exits \u2014 returns False. The test still fails if\
  \ the grandchild genuinely survives.\n\n---\n\n**Two things for you, neither blocking.**\n\
  \n**1. The seventh commit is scope I added.** `test(dispatch): wait for the grandchild\
  \ to die rather than assume it already has` fixes a pre-existing flake that task-308\
  \ did not ask about. I judged it in scope because sc-6 is \"the gate passes\" and\
  \ this is what was stopping it, and because it is a complete fix rather than a workaround\
  \ \u2014 so I filed no follow-up task. **If you would rather it not ride along with\
  \ a posture change, say so and I will move it to its own branch**; it is independent\
  \ of the other six and cherry-picks cleanly.\n\n**2. The `max_posture` question\
  \ from my last handoff is still open**, and still not blocking the merge. Every\
  \ project on this machine reads `max_posture=auto`, so the feature ships inert.\
  \ To turn it on for agentjobs, one line in `~/.agentjobs/dispatch.yaml`:\n\n```yaml\n\
  projects:\n  agentjobs:\n    posture: auto\n    max_posture: autonomous   # <- add\
  \ this\n```\n\nI recommend that pair and deliberately did not write it myself \u2014\
  \ a ceiling this tool set for itself is not a ceiling. Note what it buys: once set,\
  \ an agent that writes `posture: autonomous` onto its own task record gets it on\
  \ the next dispatch. Auditable on the run record, not prevented. If you would rather\
  \ allow escalation only from the pulldown and not the task field, that is a per-source\
  \ cap rather than one ceiling \u2014 a real design change, and I will file it.\n\
  \n---\n\n**Next step is yours: approve again and the scripted finish will re-run.**\
  \ It knows it merged nothing last time and will start from the rebase. I did not\
  \ merge \u2014 posture `auto`, and I have no authority to."
