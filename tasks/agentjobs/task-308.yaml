- id: 19
  ts: '2026-08-25T06:41:13.437609Z'
  actor: claude
  type: progress
  body: "**The gate failure was a pre-existing flake in a test this branch does not\
    \ touch. Found the mechanism, reproduced it, fixed it. Gate now green on `b8d5e78`.**\n\
    \n## What failed, and what it was not\n\n`tests/test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`,\
    \ on the assertion `pid 957328 survived the timeout` \u2014 the grandchild had\
    \ started, so this was the real assertion and not the \"never started, so this\
    \ proves nothing\" guard above it.\n\n**First thing checked, before anything else:\
    \ state on disk against what this session remembers.** Worktree present, branch\
    \ `feat/task-308-posture-ceiling`, the same six commits by title, rebased onto\
    \ `7fd6713`. `main` has gained exactly one commit since \u2014 `6ddf50d`, the\
    \ finish's own escalation record, a task-record commit carrying no code. Everything\
    \ accounted for; nothing improvised.\n\n**Then, before touching a test that had\
    \ just gone red: does this branch reach it at all?**\n\n- `git diff main..HEAD\
    \ -- src/agentjobs/dispatch/runner.py` filtered for kill / signal / terminate\
    \ / grace / timeout / process-group: **no lines**. The branch does not touch the\
    \ kill path.\n- `git diff --stat main..HEAD -- tests/test_dispatch_runner.py`:\
    \ **empty**. The branch does not touch the test.\n\n## The mechanism, established\
    \ rather than assumed\n\n`_terminate` signals the **process group** \u2014 parent\
    \ and grandchild are killed concurrently and independently. `join(handle)` returns\
    \ when the supervisor thread finishes, which tracks the **parent**. Nothing in\
    \ that ordering makes the grandchild's exit precede the parent's, and the test\
    \ asserted it had already happened, with no tolerance at all.\n\nReading that\
    \ off the source is a theory, so I measured it. A temporary probe ran the identical\
    \ scenario but polled the grandchild's pid after `join` instead of asserting once,\
    \ recording whether it was alive at that instant and how long it then took to\
    \ die. Six runs, with the full suite running under `-n auto` alongside to load\
    \ the machine:\n\n```\nalive_at_join=False  lag=2.01s\nalive_at_join=False  lag=2.06s\n\
    alive_at_join=False  lag=1.67s\nalive_at_join=False  lag=2.18s\nalive_at_join=True\
    \   lag=1.22s   <- the failure, reproduced\nalive_at_join=False  lag=1.51s\n```\n\
    \nRun 5 is the gate's failure: still listed at the moment `join` returned, gone\
    \ by the next poll. The probe was deleted; it is not in the commit.\n\nIncidental\
    \ finding worth having on the record: **`_pid_alive` shells out to `tasklist`,\
    \ which costs about a second per call on this machine.** That is why the \"lag\"\
    \ column never reads near zero even when the grandchild was already dead \u2014\
    \ it is one `tasklist` round trip. It also means any budget here has to be seconds,\
    \ not milliseconds.\n\n**What I did not establish**, and will not claim: whether\
    \ run 5's `alive_at_join=True` was the grandchild genuinely still running, or\
    \ a `tasklist` false positive within its own ~1s window. I did not distinguish\
    \ the two. It does not change the fix \u2014 either way the assertion was resting\
    \ on a one-second-scale timing coincidence \u2014 but it is not something I checked,\
    \ so it is not something I am asserting.\n\n## The fix, and the check that it\
    \ is not a decoration\n\nThe assertion now waits for the grandchild to disappear,\
    \ to a generous budget, via a new `_dies_within(pid, seconds)` helper beside `_pid_alive`.\
    \ The budget is deliberately not a deadline claim \u2014 it is only large enough\
    \ that a loaded machine cannot exhaust it, so a failure means \"still running\"\
    \ and never \"slow\".\n\nA bounded poll that always returns true would be decoration,\
    \ so I mutation-checked the helper directly: `_dies_within(os.getpid(), 3.0)`\
    \ \u2014 a process that certainly never exits \u2014 **returns False** after 4.1s,\
    \ and a dead pid returns True. What the test proves is unchanged: it still fails\
    \ if the grandchild genuinely survives.\n\n## Verification\n\n- `TestProcessGroup`\
    \ alone: passes.\n- Full suite under `-n auto` on the branch before the fix: exit\
    \ 0 \u2014 a second data point on intermittency, and on its own it would only\
    \ have been \"re-ran it until it went green\", which is why the mechanism above\
    \ was found first.\n- **Full unqualified `scripts/check.py` on `b8d5e78`: exit\
    \ 0, 183.4s, all ten stages.** black 0.6 \xB7 ruff 0.1 \xB7 mypy 1.7 \xB7 api\
    \ 5.0 \xB7 icons 2.5 \xB7 oxlint 0.5 \xB7 pytest 104.6 \xB7 vitest 31.4 \xB7 build\
    \ 4.3 \xB7 e2e 32.8. Receipt written for `b8d5e786`.\n\nOne intermediate red:\
    \ `black` wanted the new assertion on one line. Reformatted and amended into the\
    \ same commit, then the gate re-run from the top \u2014 the green above is a full\
    \ run, not a resumed one.\n\n## Scope\n\nThis is a seventh commit on the branch\
    \ doing something task-308 did not ask for, so it is called out rather than buried.\
    \ I judged it in scope on the narrow ground that sc-6 is \"the gate passes\" and\
    \ this is what was stopping it \u2014 the fix is complete rather than a workaround,\
    \ so no follow-up task is warranted. **If you would rather this not ride along\
    \ with a posture change, say so and I will move it to its own branch**; it is\
    \ independent of every other commit here and will cherry-pick cleanly.\n"
