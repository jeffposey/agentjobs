spec:
  summary: 'Jeff required on 2026-08-21 that posture be settable per task, not only
    per project. It was written into a queue_move note on task-021 and never reached
    that task''s spec or any other, so it is currently unimplemented and unowned.
    The hard part is not the field: task records are git-tracked and agent-writable,
    so a task that can raise its own posture to `autonomous` lets an agent widen its
    own permissions by editing a file it can already write.'
  intent: 'Jeff, 2026-08-21, moving task-021 to the top of the high band: "posture
    must be settable per task, not only per project. Note the tension the design has
    to resolve -- project dispatch settings are machine-local (~/.agentjobs), while
    task records are git-tracked and agent-writable, so a task that can raise its
    own posture to autonomous is a privilege-escalation path. Decide whether a task
    may only narrow the project''s posture, never widen it."'
  description: "## Why this is a task rather than a line in task-021\n\nIt was found\
    \ on 2026-08-23 by the session supervising task-021, reading that task's log\n\
    rather than its spec. Jeff wrote the requirement into a `queue_move` entry on\n\
    2026-08-21 and flagged it himself as *\"not yet in this spec\"*. It never got\
    \ added \u2014 not\nto task-021, not to task-022, not anywhere. A search of the\
    \ backlog for per-task posture\nand for the narrow-versus-widen question returns\
    \ nothing, and no source file or design\ndocument mentions a task-level posture.\n\
    \nSo it is a live requirement of Jeff's autonomy push that no task owns. That\
    \ is the whole\nreason this record exists.\n\n## The distinction that must not\
    \ be collapsed\n\nThere are now three places a posture could come from, and they\
    \ do **not** share a trust\nmodel:\n\n| Source | Written by | Trust |\n|---|---|---|\n\
    | `dispatch.yaml` | a human, editing a machine-local file | The baseline. Not\
    \ reachable from the network. |\n| A pulldown at dispatch time (task-307) | a\
    \ human, clicking, per dispatch | **Escalation allowed** \u2014 Jeff decided this\
    \ 2026-08-23. |\n| **The task record (this task)** | **anyone who can write the\
    \ task file, including an agent** | **Undecided. This is the question.** |\n\n\
    task-307's decision entry settles the second row only. It was asked and answered\
    \ as\n\"may a human clicking a pulldown choose a posture above the project default\"\
    , and Jeff\naccepted that risk knowingly. **It says nothing about the third row**,\
    \ where the writer\nneed not be a human at all \u2014 and an agent editing its\
    \ own task's posture field to\n`autonomous` is a different act from a person choosing\
    \ one in a browser. Do not cite\nthat decision as cover for this one.\n\n## What\
    \ has to be decided here\n\n1. **May a task's posture widen the project's, or\
    \ only narrow it?** Jeff's own framing\n   leans narrow-only and names the reason.\
    \ The counter-argument is that narrow-only makes\n   the field nearly useless\
    \ for the case it was asked for \u2014 marking a specific task as\n   safe to\
    \ run unattended.\n2. **If widening is allowed at all, what makes the writer accountable?**\
    \ Options worth\n   weighing: accept only a posture written by a configured human\
    \ actor (the log already\n   records who wrote what); require a human-clocked\
    \ entry after the field changed, so an\n   agent raising it and then dispatching\
    \ itself cannot work; or keep the field advisory\n   and require the human to\
    \ confirm it at dispatch through task-307's control.\n3. **How it composes with\
    \ the project setting and with a dispatch-time choice.** Three\n   sources need\
    \ a stated precedence order, and the resolved posture must be visible on\n   the\
    \ run record so \"why did this run get bypass\" has one answer.\n\nRecord the\
    \ decision with its rejected alternative. This is the kind of choice a later\n\
    reader cannot recover from a diff.\n\n## Do not weaken the existing guard\n\n\
    `assert_human_clocked` in `src/agentjobs/dispatch/guards.py` refuses any dispatch\
    \ whose\ncausing log entry was written by an agent, and says why: *\"which is\
    \ what makes an\nagent-starts-agent loop impossible rather than merely capped.\"\
    * A task-level posture\nfield must not become the way around it. Starting a run\
    \ and choosing what a run may do\nare separate gates, and this task touches only\
    \ the second \u2014 but an agent that can widen\nits own posture has weakened\
    \ the pair, whatever the first gate still says."
  constraints: '- Whatever is decided, the resolved posture and the source it came
    from must both appear on the run''s dispatch entry. "Which of the three sources
    won" cannot be a thing a reader has to reconstruct.

    - `assert_human_clocked` is not to be relaxed, reworded, or routed around. This
    task changes what envelope a run gets, never who may start one.

    - The project setting stays machine-local. Nothing here moves `dispatch.yaml`
    into the repository, and nothing makes a git-tracked file authoritative over it
    without an explicit decision saying so.

    - `poetry run python scripts/check.py` passes.'
  out_of_scope: "The dispatch-time pulldown (task-307) \u2014 that is a human choosing\
    \ per dispatch and its escalation question is already answered. The merge and\
    \ push policy each posture carries (task-021). Auto-dispatch on approval, which\
    \ Jeff deferred on 2026-08-23."
  context:
  - path: src/agentjobs/dispatch/guards.py
    why: assert_human_clocked and the actor-kind machinery already distinguish a human
      writer from an agent one; that is the primitive this decision needs.
  - path: src/agentjobs/dispatch/config.py
    why: Where the project-level posture resolves today, and where a precedence order
      would have to be implemented.
  - path: docs/task-schema.md
    why: A posture field on the task record is a schema change and belongs documented
      there.
