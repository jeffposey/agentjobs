- id: 2
  ts: '2026-08-23T22:49:07.499020Z'
  actor: Jeff Posey
  type: decision
  body: "**A project declares two postures: a default and a maximum. Everything else\
    \ chooses within that ceiling. This settles sc-1 and most of sc-2 \u2014 do not\
    \ relitigate them.**\n\nJeff, 2026-08-23, on being shown the narrow-only-versus-widen\
    \ question: *\"yes, project should have max posture, and default posture, duh\"\
    *.\n\n**What it means.** `dispatch.yaml` gains a `max_posture` alongside the existing\
    \ posture, which becomes the default. Any other source \u2014 a posture on the\
    \ task record, a choice at dispatch time (task-307) \u2014 selects a posture,\
    \ and the resolved posture is clamped to `max_posture`. A request above the ceiling\
    \ is refused, naming the ceiling and where it was set.\n\n**Why this is better\
    \ than either option that was put up**, and worth understanding rather than just\
    \ implementing:\n\nBoth alternatives on the table treated the danger as *who wrote\
    \ the field*. Narrow-only forbade widening outright and cost the feature its point.\
    \ The accountability variants tried to establish that a human wrote the value\
    \ \u2014 a check on provenance, which is only ever as good as the identity machinery\
    \ behind it, and which an agent with write access to a git-tracked file is in\
    \ a decent position to spoof.\n\nA ceiling makes the question moot. `dispatch.yaml`\
    \ is machine-local, not in the repository, and not writable through any AgentJobs\
    \ surface. So **it does not matter who wrote the task-level posture**: an agent\
    \ that edits its own task record to `autonomous` on a project whose `max_posture`\
    \ is `auto` gets `auto`. The privilege-escalation path Jeff named on 2026-08-21\
    \ is closed by construction rather than by trusting a writer, which is the difference\
    \ between a control and a convention.\n\n**Rejected**, explicitly: narrow-only\
    \ (kills the feature it was asked for), and provenance checks on the field's writer\
    \ (fragile, and unnecessary once a ceiling exists).\n\n**What is still open and\
    \ belongs to whoever works this:**\n\n- **Precedence among the three sources below\
    \ the ceiling.** The ceiling is settled; which of project default, task record\
    \ and dispatch-time choice wins when they disagree is not. The obvious reading\
    \ is most-specific-wins \u2014 dispatch-time choice over task record over project\
    \ default \u2014 but say so and test it rather than leaving it to be inferred.\n\
    - **This project's own two values.** `auto` has been the default since task-020,\
    \ and Jeff dispatched task-021 as `autonomous`, so agentjobs plausibly wants `default:\
    \ auto`, `max: autonomous`. Confirm rather than assume; a wrong ceiling here is\
    \ the one that matters.\n- **What `max_posture` defaults to when a config does\
    \ not set one.** It must default to something no wider than today's behaviour,\
    \ so upgrading an existing `dispatch.yaml` never silently widens a project.\n\
    - sc-3 to sc-6 are untouched by this decision.\n\n**Note for task-307.** Its pulldown\
    \ must offer only postures at or below `max_posture`, and must not present a choice\
    \ the API will refuse. Jeff's earlier acceptance of pulldown escalation stands\
    \ and is now bounded by this."
