spec:
  summary: "Since task-021, a posture carries a merge policy and a project carries\
    \ a push switch \u2014 so choosing `autonomous` means the run merges its own work\
    \ with no review. The browser still renders posture as a bare word next to the\
    \ runner name and says nothing about merging or pushing. The one surface where\
    \ a human decides to start a run is the one that cannot tell them what the run\
    \ is allowed to do with their repository."
  intent: 'Raised by the session that implemented task-021, recorded there as a scope
    call rather than taken silently: "the GUI''s dispatch panel is not told about
    merge policy or push, which is a real visibility gap and wants its own task".
    Filed on Jeff''s instruction, 2026-08-23.'
  description: "## What changed underneath the page\n\ntask-021 merged as `53307a2b`\
    \ on 2026-08-23. After it:\n\n- **`MergePolicy` is a property of `Posture`, not\
    \ a switch beside it.** `auto` and\n  `supervised` hand off for review; `autonomous`\
    \ merges automatically once\n  `scripts/check.py` is green; `read_only` merges\
    \ nothing.\n- **Push is per project and defaults to false**, deliberately not\
    \ a posture property.\n\nBoth are real consequences of pressing Dispatch, and\
    \ both are invisible in the browser.\n`DispatchPanel.tsx` renders posture as a\
    \ bare enum value in a sentence of the form\n\"Runner X, posture Y, authorised\
    \ by Z\". A person reading that page cannot tell whether\nthe run they are about\
    \ to start will stop for them or merge itself.\n\nThis matters more than a normal\
    \ missing-label bug because the information is\n**asymmetrically available**.\
    \ The policy lives in `~/.agentjobs/dispatch.yaml`, a\nmachine-local file. The\
    \ repository's own committed prose \u2014 ENGINEERING.md, ALLAGENTS.md\n\u2014\
    \ still reads \"work does not merge itself\" by default, qualified only for the\
    \ posture\nthat releases it. So the page is the only place a human could learn\
    \ what this machine\nwill actually do, and it is silent.\n\n## What to show\n\n\
    1. **What this posture will do to the branch**, in words rather than an enum:\
    \ that it\n   will hand off for review, or that it will merge itself on a green\
    \ gate.\n2. **Whether this project pushes.** `push: false` is the safe default\
    \ and worth stating\n   positively \u2014 \"never pushes\" is information, not\
    \ the absence of it.\n3. **The objective floor, where it applies.** An automatic\
    \ merge is gated on\n   `scripts/check.py` exit 0. A reader deciding whether to\
    \ trust `autonomous` should be\n   able to see that it is not merely the agent's\
    \ own judgement.\n\n## Where this sits among its siblings\n\nThree tasks now touch\
    \ the same panel and want to land in this order:\n\n- **task-184** \u2014 the\
    \ runner-group pulldown and the \"no runner chosen\" caption. Frontend\n  only.\
    \ First.\n- **task-307** \u2014 the posture pulldown, bounded by the project ceiling\
    \ from task-308.\n- **this task** \u2014 saying what the chosen posture *means*.\n\
    \nThere is a case for folding this into task-307, and it is deliberately not folded:\n\
    307 is a control that sends a new field through the API, this is display of state\
    \ the\nAPI already returns, and the second is worth having even if the first slips.\
    \ If whoever\nworks 307 finds the copy inseparable from the control, merging them\
    \ is a reasonable\ncall \u2014 record it as a decision rather than doing it silently."
  constraints: "- Display only. This task adds no field to any request and changes\
    \ no policy; if it finds the API does not return enough to describe the policy,\
    \ that is a finding to record, not a licence to redesign the endpoint.\n- Assert\
    \ on rendered values, not the presence of markup. A test that checks a posture\
    \ element exists while it renders `Posture.AUTONOMOUS` is the failure mode this\
    \ repository has already been bitten by.\n- Do not restate the policy as a hardcoded\
    \ frontend table. If the copy is derived from a constant the client keeps in sync\
    \ by hand, it will drift the first time a posture is added \u2014 derive it from\
    \ what the API reports.\n- `poetry run python scripts/check.py` passes."
  out_of_scope: "Choosing the posture (task-307) or the runner group (task-184). Authoring\
    \ runners, groups or postures from the browser (task-178). Changing any merge\
    \ or push behaviour \u2014 task-021 settled that and it is merged."
  context:
  - path: frontend/src/components/DispatchPanel.tsx
    why: Renders 'Runner X, posture Y, authorised by Z' around line 373 and says nothing
      further.
  - path: src/agentjobs/api/routes/dispatch.py
    why: DispatchStateView is what the page has to work with; establish whether it
      already carries enough to describe the policy.
  - path: src/agentjobs/dispatch/config.py
    why: Where posture, its merge policy and the per-project push switch resolve after
      task-021.
