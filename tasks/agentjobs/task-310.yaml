spec:
  summary: "Found by the task-184 session while establishing sc-3 against a throwaway\
    \ home. On a machine whose `dispatch.yaml` sets a top-level `default_group:`,\
    \ enabling a project with `--runner <name>` appears to succeed and changes nothing\
    \ \u2014 the project still resolves through the default group. It affects the\
    \ CLI as well as the browser, and it is invisible on Jeff's machine only because\
    \ his config happens to have no `default_group:`."
  intent: 'A switch that reports success and does nothing is worse than one that refuses:
    the operator believes they pinned a runner, and every subsequent dispatch quietly
    uses a different one. task-184 established this experimentally and correctly left
    it alone as out of scope.'
  description: "## Where it came from\n\ntask-184's sc-3 asked whether a browser enable/disable\
    \ round-trip could drop or change a\nproject's group. The session answered that\
    \ against a throwaway `AGENTJOBS_HOME` over the\nreal HTTP endpoints, and the\
    \ answer was **no** \u2014 that round-trip is safe, and no\nconfig-layer behaviour\
    \ changed in that task.\n\nThis fell out of the same experiment and is a different\
    \ defect. It was deliberately not\nfixed there: out of scope for a frontend task,\
    \ and `src/agentjobs/dispatch/config.py` was\nthe live file of a concurrently-running\
    \ task at the time.\n\n## The behaviour\n\nOn a machine whose `dispatch.yaml`\
    \ has a top-level `default_group:`, enabling a project\nwith an explicit runner:\n\
    \n```bash\nagentjobs dispatch enable <project> --runner claude-sonnet-5\n```\n\
    \nreports success, writes what it was asked to write, and has no effect on which\
    \ runner\nthe project resolves to. The machine-wide `default_group` still wins.\
    \ The same is true\nthrough the browser's enable control and through the API endpoint\
    \ beneath it, because\nall three converge on the same resolution.\n\n**Jeff's\
    \ own machine does not show this**, because his `dispatch.yaml` sets\n`default_group:\
    \ default` \u2014 wait, verify that before relying on it either way; the\ntask-184\
    \ session's report says the defect is invisible there because his config has no\n\
    `default_group:`, and the resolved output of `agentjobs dispatch config` is the\
    \ thing to\ncheck rather than either claim. Establish it first.\n\n## What to\
    \ decide\n\nThe fix is not obviously \"runner beats default_group\". Both readings\
    \ are defensible:\n\n- **Explicit beats implicit** \u2014 a runner named on the\
    \ enable command is a deliberate act\n  and should override a machine-wide default.\
    \ This is the intuitive reading and probably\n  right.\n- **Refuse instead of\
    \ guessing** \u2014 if a project cannot express \"this runner, not the\n  default\
    \ group\", enabling with `--runner` should fail loudly and say so, rather than\n\
    \  silently picking a winner.\n\nEither is acceptable. **Silently doing nothing\
    \ is not**, and that is the whole bug.\nRecord the choice with its rejected alternative.\n\
    \n## Reproduction\n\nAgainst a throwaway `AGENTJOBS_HOME`, never the real one\
    \ \u2014 a `dispatch.yaml` with a\ntop-level `default_group:` and at least two\
    \ runners, a project enabled with `--runner`\nnaming the runner the group would\
    \ *not* pick, then `agentjobs dispatch config` to see\nwhich one actually resolves.\
    \ `scripts/dispatch_groups_sandbox.py`, added by task-184,\nalready builds most\
    \ of this scaffolding."
  constraints: "- Reproduce against a throwaway `AGENTJOBS_HOME`. Do not experiment\
    \ on `~/.agentjobs/dispatch.yaml`; it is the live config for every project on\
    \ this machine.\n- Whatever the resolution, all three surfaces must agree \u2014\
    \ CLI, API and browser converge on one resolution path and must not be fixed independently.\n\
    - If the decision is to refuse, the refusal must name the `default_group` that\
    \ conflicts and where it is set. A refusal a user cannot act on is the same defect\
    \ wearing a different face.\n- `poetry run python scripts/check.py` passes."
  out_of_scope: The frontend enable control's contents (task-184, merged or in review).
    Authoring groups or runners from the browser (task-178).
  context:
