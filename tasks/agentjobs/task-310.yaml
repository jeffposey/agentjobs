  body: "**Correction, before anyone works this: the defect is live on Jeff's machine.\
    \ The spec above says the opposite and is wrong.**\n\nThe description repeats\
    \ the task-184 session's report that this is *\"invisible on this machine because\
    \ your config has no `default_group:`\"*, and hedges about verifying it. Verified\
    \ now, 2026-08-23, and the hedge resolves against the report:\n\n```\n$ grep -nE\
    \ \"^default_group:\" ~/.agentjobs/dispatch.yaml\n111:default_group: default\n\
    ```\n\n**`default_group: default` is set.** So the precondition for this bug is\
    \ satisfied on the machine every project here dispatches from. Treat the sentence\
    \ in the description as superseded by this entry rather than as something still\
    \ to establish.\n\nWhat that means concretely, from `agentjobs dispatch config`\
    \ on the same day:\n\n```\nagentjobs     enabled  group=default  posture=auto\
    \  merge=review  push=False\njob-hunting   enabled  runner=-       posture=auto\
    \  merge=review  push=False\nmastercalls   enabled  runner=-       posture=auto\
    \  merge=review  push=False\n```\n\n`agentjobs` names its group explicitly, so\
    \ it is unaffected either way. **`job-hunting` and `mastercalls` name neither\
    \ a runner nor a group** and resolve through the machine-wide default. That is\
    \ correct behaviour, not the bug \u2014 but it is exactly the configuration in\
    \ which the bug bites: an attempt to pin either of them with `dispatch enable\
    \ <project> --runner <name>` is the silent no-op, and there is nothing in the\
    \ output above that would show a person it had failed.\n\nNobody has been bitten\
    \ yet, as far as the record shows, because nobody has needed to pin a runner on\
    \ those two. That is luck rather than safety, and it is the argument for not leaving\
    \ this at the bottom of the band on the grounds that it is theoretical. It is\
    \ not theoretical.\n\n**One thing the reproduction should not assume**: that `agentjobs`'\
    \ own `group: default` line makes it immune. Establish what an explicit `--runner`\
    \ does to a project that already names a group as well as to one that names nothing\
    \ \u2014 they are different cases and the report only covered the second."
