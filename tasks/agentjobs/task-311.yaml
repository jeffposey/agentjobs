spec:
  summary: A project's tasks are YAML under `tasks/` in that project's own git repository.
    A branch or worktree therefore carries a snapshot of the backlog as it was when
    the branch was cut, and there is no single source of truth while any branch exists.
    Three separate defects and one standing prose rule already exist to work around
    this. The question is whether task records should live in a location that is shared
    across worktrees rather than versioned alongside the code they describe.
  intent: 'Jeff, 2026-08-24, immediately after watching it break a gate run: "if only
    we werent using yaml files for tasks on branches in worktree with no single source
    of truth, hmmmm... I wonder what we could do about that (WINK)".'
  description: "## The design fact\n\n`tasks_directory` points inside the project.\
    \ For this repository that is\n`tasks/agentjobs/`, tracked in the same git repository\
    \ as the source. Git versions it\nlike any other directory, so **every branch\
    \ and every worktree holds its own copy of the\nbacklog**, frozen at the moment\
    \ the branch was cut.\n\nThat is not a bug in any one component. It follows from\
    \ the arrangement, and the\narrangement was a deliberate and good choice \u2014\
    \ git-backed, diffable, portable, no\ndatabase. **None of that is what this task\
    \ questions.** The question is narrower: does\nthe backlog belong on a *branch*,\
    \ or in one location every worktree shares?\n\n## Four things that already exist\
    \ because of it\n\n1. **\"Task files live on `main`, always.\"** An entire section\
    \ of ENGINEERING.md, with the\n   incident that produced it: a handoff committed\
    \ to a branch is invisible to the human\n   it is addressed to, which defeats\
    \ the merge gate outright. The rule works. It is a\n   rule, enforced by agents\
    \ remembering it, standing in for a property the storage layer\n   could have\
    \ had.\n2. **task-182** \u2014 `require_clean_tree` refused every dispatch in\
    \ a project whose task\n   files live in its own repo, because writing a task\
    \ record dirties the tree the check\n   is inspecting. Closed as completed, by\
    \ special-casing.\n3. **The dashboard shows whatever branch is checked out.**\
    \ Documented in ENGINEERING.md\n   as a thing not to file bugs about: *\"tasks\
    \ are YAML files in this repository, so\n   whichever branch is checked out decides\
    \ what the dashboard shows.\"*\n4. **`test_agentjobs_context_paths_exist` fails\
    \ on a branch for a record fixed on\n   `main`.** Observed 2026-08-24: a bad `context[]`\
    \ pointer was committed to `main`,\n   turning the corpus test red; it was corrected\
    \ on `main` minutes later; a worktree cut\n   before the correction still failed\
    \ the gate on it until rebased. The test is right to\n   read the corpus. It just\
    \ cannot tell which copy of the corpus is real.\n\nEach was handled sensibly on\
    \ its own. Together they are the same cause four times, and\nthe fourth cost a\
    \ gate run tonight.\n\n## What to weigh\n\nThis is a design task and the answer\
    \ may be \"keep it as it is, and write down why.\"\n\n- **Move the task directory\
    \ outside the working tree.** `tasks_directory` is already\n  configurable, and\
    \ the registry already resolves a project's root independently of the\n  checkout.\
    \ A location outside the repo \u2014 still git, still YAML, still diffable, just\
    \ its\n  own repository or a sibling directory \u2014 gives every worktree one\
    \ backlog and deletes\n  all four workarounds at once. The cost is that a commit\
    \ can no longer contain both a\n  change and the task record describing it, which\
    \ ENGINEERING.md already accepts as the\n  price of the \"always on main\" rule,\
    \ so this may cost nothing that has not been paid.\n- **Keep it in the repo and\
    \ make readers resolve through the registry.** Narrower: the\n  corpus test and\
    \ the dashboard ask the registry for the project root rather than reading\n  the\
    \ checkout. Fixes symptoms 3 and 4, leaves 1 and 2 as rules.\n- **Keep everything\
    \ and document it as intended.** Defensible. The current arrangement\n  makes\
    \ a task's history part of the repository's history, which has real value for\n\
    \  archaeology, and the rules do work when followed.\n\nWhichever is chosen, **record\
    \ it with the rejected alternatives** \u2014 this is the kind of\ndecision that\
    \ gets silently re-litigated every time it bites someone.\n\n## Do not treat this\
    \ as a mandate to rip out YAML\n\n\"Git-friendly and lightweight\" is the product's\
    \ stated philosophy and one file per task\nis the load-bearing part of it. Nothing\
    \ here proposes a database, a service, or a schema\nchange. The whole question\
    \ is *which directory*."
  constraints: '- Decide before building. This touches storage layout, and a half-migration
    is worse than either end state.

    - Any migration must be reversible and must not lose log history. The task log
    is the record of why things happened and is not reconstructable.

    - `tasks_directory` is already configurable and other projects on this machine
    use it differently. Whatever is decided must not assume every project made the
    same choice as agentjobs.

    - If the decision is to keep things as they are, the four workarounds above get
    a single documented home explaining the shared cause, so the fifth person to hit
    it recognises it.'
  out_of_scope: Replacing YAML with a database or a service. Schema changes. The dispatch/merge
    policy that happens to interact with this.
  context:
  - path: ENGINEERING.md
    why: 'Holds two of the workarounds: ''Task files live on main, always'' and the
      note that the checked-out branch decides what the dashboard shows.'
  - path: src/agentjobs/storage.py
    why: Where the tasks directory is resolved and read.
  - path: src/agentjobs/projects.py
    why: The registry already resolves a project root independently of what is checked
      out, which is the mechanism a narrower fix would use.
  - path: tests/test_task_corpus.py
    why: Reads this repository's own records, and is the test that fails in a worktree
      for a record already fixed on main.
