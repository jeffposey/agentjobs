spec:
  summary: Cut over existing projects to the authoritative SQLite backend from task-273,
    preserving their complete task history. Remove routine task-state Git commits
    and ensure every code branch and worktree sees the same live backlog.
  intent: Owner selected authoritative SQLite co-located with the AgentJobs server
    on 2026-09-05. The goal is dedicated single-source-of-truth task storage, not
    relocating canonical YAML or accelerating it with an index.
  description: 'Task-273 implements the SQLite backend and generic backup support.
    This task owns safe adoption and removal of the file/Git workflow coupling.


    Inventory each registered project''s configured source directory and all task
    readers/writers: CLI, API, MCP, dispatch/finisher, registry resolution, validators,
    receipts, attachments, tests and tooling. Do not assume every project''s layout
    is this repository''s. Choose a configurable durable database location on the
    AgentJobs server host outside all code worktrees; clients resolve the service/project,
    never the checkout''s task snapshot.


    Provide dry-run validation and a transactional, repeatable import preserving IDs,
    state, queue order, log IDs/thread references, timestamps, actors, nested content,
    attachment bytes/references and legacy operation metadata. Report malformed records
    and ambiguous histories with actionable diagnostics; never silently skip or fabricate
    them. Define baseline/history coverage for task-212/213 and optionally recover
    evidence from historical Git data before retiring the source, without requiring
    Git for ongoing metrics.


    Take a consistent pre-cutover backup and prove restore. Quiesce old writers during
    final import, verify counts/content/history/attachments, switch the configured
    authority once, and reject stale clients or legacy write paths clearly. No steady-state
    dual writing. A migration interrupted or rerun must not duplicate tasks/logs or
    partially switch projects. Define rollback both before and after new SQLite writes,
    including how post-cutover changes are preserved.


    After verified cutover remove routine task-record commits from dispatch and finish,
    the tasks-on-main rule, task-directory clean-tree exceptions that are no longer
    needed, staged task validation and byte receipts where replaced by database validation/audit.
    Update or retire direct-file task guards without removing managed-write/authorization
    requirements. Keep code worktree isolation and meaningful code merge checks. Convert
    live-corpus-dependent tests to reproducible isolated fixtures and service/store
    integration tests so Git branch contents do not select the live backlog.


    Retire canonical tracked task files through an explicitly documented archival/removal
    step after migration verification; preserve history and rollback material. Optional
    YAML/JSON exports are user-requested interchange artifacts, never automatically
    committed task-state mirrors. Update README, ENGINEERING, ALLAGENTS, workflow/schema/storage
    documentation and client instructions to describe the new authority accurately.


    Exercise two worktrees plus multiple clients against one server: task mutation
    does not dirty either source checkout, checkout/rebase does not change the visible
    backlog, and restart preserves tasks/history. Verify generic backup/restore and
    document an operator backup-enrollment checkpoint before relying on the new store.'
  constraints: No data loss or silent legacy-record omission. Production migration
    must be reversible with a demonstrated restore and preserve changes made after
    cutover. One live authority; no fallback to checkout YAML. Personal backup configuration
    stays out of public task records. Preserve code worktree and merge safety.
  out_of_scope: Reconsidering the selected storage engine; keeping YAML canonical;
    analytics page implementation; personal backup-provider setup.
  context:
  - path: ENGINEERING.md
    why: 'Holds two of the workarounds: ''Task files live on main, always'' and the
      note that the checked-out branch decides what the dashboard shows.'
  - path: src/agentjobs/storage.py
    why: Where the tasks directory is resolved and read.
  - path: src/agentjobs/projects.py
    why: The registry already resolves a project root independently of what is checked
      out, which is the mechanism a narrower fix would use.
  - path: tests/test_task_corpus.py
    why: Reads this repository's own records, and is the test that fails in a worktree
      for a record already fixed on main.
