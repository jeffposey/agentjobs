- id: 12
  ts: '2026-09-07T05:02:20.562749Z'
  actor: claude
  type: progress
  body: 'Foundation landed on `feat/task-311-sqlite-cutover`. Two commits.


    **The storage seam.** `storage_config.py` holds which backend each project is
    on, in `~/.agentjobs/storage.yaml` -- machine level, because a project''s own
    config is versioned and travels with a clone while the database does not; recording
    the cutover in a tracked file would tell a fresh clone elsewhere that its tasks
    live in a database that machine never had. `store_factory.open_store(project)`
    is the single place a project id becomes a store, and it *enforces* the owner''s
    decision of 2026-09-05 that only the server opens the database: a client process
    asking for a SQLite-backed project is refused and told to use the service.


    **TaskManager needed no rewrite.** It runs on `SqlTaskStore` unchanged. Only two
    places were genuinely about files -- the missing-task check (now `storage.has_task`)
    and queue repair''s raw reads (now backend-aware, and under SQL the corruption
    it rescues is unrepresentable). This is the result the whole cutover rests on;
    had a verb needed a per-backend implementation, this would have been a rewrite
    of the domain layer rather than a change of where rows live.


    **`cutover.py`** is the operator sequence: preview (the real import against a
    throwaway database), back up, import, verify, record. `storage.yaml` is written
    last, because it is what every client reads to decide where to look.


    **Three defects the live corpus found, all fixed:**

    1. `_persist` restamped `updated` on every write -- right for a verb, wrong for
    an import, and it silently re-dated all 374 records to the migration. Tied to
    `record_history`, which already distinguishes the two.

    2. A re-run after a *completed* import upserted the tasks harmlessly and wrote
    the reconstructed history a second time, doubling every event with nothing raising.
    Now refused unless `replace=True`, which empties the project inside the same transaction
    that re-fills it.

    3. Verification compared serialised strings; the corpus holds a `merged_at` with
    a local offset that the store correctly normalises to UTC, and a string comparison
    called that data loss. Now compared as instants.


    **Measured on this repository''s own 374 records:** imported and VERIFIED. Backlog
    invariant 129 = 129. 7 of 7 attachment blobs. Without git backfill, 1914 events
    and all 374 needing reconciliation; with it, 1492 git observations, 2043 events,
    and only 58 needing reconciliation -- matching the 84% figure task-273 measured.


    **Still to do:** the `agentjobs storage` CLI group; client retry with bounded
    backoff and graceful shutdown/503 (task-273 entry 6, items 1 and 2); the CLI verbs
    becoming service clients (item 3); dispatch and finish giving up their task-record
    commits; converting live-corpus tests to fixtures; the documentation that currently
    instructs agents to commit task YAML to `main`; and the retirement step for the
    tracked files.'
  data:
    operation:
      id: a2b3c4d5-2222-4a2b-8c3d-000000000311
      kind: log_append
      fingerprint: bcebcf88eb909f7d5f2a7962cf6a1033
- id: 13
  ts: '2026-09-07T05:36:53.637746Z'
  actor: claude
  type: decision
  body: '**The dispatch family keeps a direct-to-storage path. This departs from task-273
    entry 6 item 3 and the owner should confirm or overturn it.**


    Entry 6 says every CLI verb becomes a service client, so only the server opens
    the database, and that there is no direct-to-storage CLI path to keep. Every task
    verb and every queue verb now honours that: `RemoteTaskManager` is the manager''s
    surface over `TaskClient`, and `store_factory.task_manager_for` is the single
    branch between the two worlds.


    The dispatch family does not, and three separate guards -- each built deliberately
    by a different task -- say the same thing when I tried to make it one:


    1. **A run credential scopes an HTTP caller to its own task** (task-332). `agentjobs
    dispatch walk` is run *by* a supervisor session and starts *other* tasks'' runs,
    so over HTTP every child is `wrong_task` and the epic walk stops working. `docs/authorization.md`
    states outright that the CLI is outside that gate "by construction", which is
    why the walk works today. The only way through is for the CLI''s client to suppress
    the run credential -- which preserves today''s trust boundary exactly (an agent
    can already shell out to the CLI for owner authority) but is a security decision
    I should not take silently.

    2. **`argv` must not appear in a dispatch schema.** Recording a dispatch over
    HTTP needs a request model carrying `argv`, and `tests/test_dispatch_api.py::test_no_dispatch_request_body_accepts_a_command_to_run`
    forbids exactly that -- on the correct ground that a schema is the execution surface
    whatever today''s page happens to send. I wrote those routes, hit that test, and
    backed them out.

    3. **One authorization per dispatch.** Routing the CLI through the existing `POST
    /tasks/{id}/dispatch` instead needs `trigger` and `on_behalf_of_parent` on its
    body, which `DispatchRequestBody._one_authorization` exists to refuse: it is precisely
    how a caller would claim a run rides a parent''s authorization when it does not.


    **Why the exception is safe rather than merely convenient.** Entry 6''s stated
    reason is that "two processes opening one SQLite file is exactly the concurrency
    the design exists to remove". That is a good default and it is not a correctness
    argument for this store: WAL plus `busy_timeout` is what SQLite provides multi-process
    access with, `BEGIN IMMEDIATE` takes the write lock up front, the operation ledger
    that makes a retry a replay is a table, and every invariant is a `CHECK` or a
    unique index **in the database** rather than a Python validator. `connection.py`
    already sets the busy timeout for this exact reason and says so.


    **What was rejected.** Suppressing the run credential and widening the two dispatch
    surfaces, which would have honoured the letter of entry 6 at the cost of three
    real guards. Also rejected: making the dispatch verbs simply fail on a migrated
    project, which is honest but would make the cutover unusable, since dispatch is
    how agents run.


    **The narrowness is the mechanism.** `store_factory.dispatch_manager_for` is the
    only place that takes the exception, its docstring carries this whole argument,
    and it refuses outright when the database is behind this build''s physical schema
    -- a short-lived process must not apply a migration another process may be reading
    through.


    **The proper long-term answer, if the owner wants entry 6 honoured literally,
    is that the dispatch subsystem moves inside the server**: the CLI''s dispatch
    verbs become thin launchers and the epic walk runs server-side. That is a real
    piece of work with its own design, not a detail of this migration, and it is a
    good candidate for a task of its own.'
