spec:
  summary: "A dispatched session that hands off for review stays alive, so its run\
    \ keeps the task's lock. The scripted finish that approval triggers then declines\
    \ `locked` and nothing merges. The remedy the tool itself prints is to cancel\
    \ the run \u2014 and cancelling rewrites the task's `ball_prompt` with \"Run X\
    \ ended `cancelled` and nobody was told what this task needs\", which is false,\
    \ alarming, and lands in front of the human who just approved. Both approvals\
    \ on 2026-08-23/24 hit this."
  intent: 'Jeff, 2026-08-24, on being shown the message mid-merge: "OUCH DUDE. this
    is a new one". The merge was in fact proceeding normally and completed seconds
    later. A person who acted on that prompt would have re-dispatched a task that
    was already merging.'
  description: "## The sequence, observed twice\n\nBoth of tonight's approvals hit\
    \ it identically \u2014 task-021 at 22:5x and task-022 at 01:07.\n\n1. A dispatched\
    \ session finishes its work, hands the ball to `human`/`review`, and stops\n \
    \  its turn. **The session stays alive**; the run stays live and keeps the per-task\
    \ run\n   lock, which is correct \u2014 the lock exists so a second run cannot\
    \ start against a task\n   somebody is working.\n2. The human approves. `after_human_handoff(...,\
    \ finishable=True)` spawns the scripted\n   finish (task-241).\n3. The finish\
    \ calls `acquire_run_lock`, loses to the live run, and returns\n   `DECLINED /\
    \ locked`. **Nothing merges.** The spawn log says: *\"task-022 is held by run\n\
    \   run_8cbf13e7, which has not reported that it finished. Cancel that run and\
    \ this task\n   is dispatchable again.\"*\n4. Following that advice, `dispatch\
    \ cancel` stops the session and calls `_conclude`.\n   `_conclude` re-handoffs\
    \ whenever the ball is not already `HUMAN` \u2014 and approval has\n   just set\
    \ it to `agent`/`work` \u2014 so it overwrites the merge clearance with:\n\n \
    \  > Run `run_8cbf13e7` ended `cancelled` and nobody was told what this task needs.\
    \ Read\n   > the dispatch_result entry, then either dispatch again or take it\
    \ on yourself.\n\nThat sentence is wrong in three ways at once. Somebody *was*\
    \ told what the task needs \u2014\nthe human approved it, and the clearance it\
    \ just overwrote said so. The run did not fail;\nit completed its work and was\
    \ cancelled administratively to release a lock. And the\nadvice \u2014 dispatch\
    \ again, or take it on yourself \u2014 would, if followed, start a second run\n\
    against a task that is mid-merge.\n\n## Why it is worth more than its cosmetics\n\
    \nThe false prompt is the visible half. The invisible half is that **the scripted\
    \ finish\ndoes not fire on a normal approval at all** for any task whose session\
    \ is still alive.\ntask-241 exists to take the agent out of the post-approval\
    \ loop; this puts a human back\nin it, doing a two-step dance \u2014 cancel, then\
    \ `agentjobs finish` \u2014 that is nowhere in the\ndocumentation and that they\
    \ have to know to do.\n\nEarlier finishes on this machine did succeed (task-214\
    \ through task-219, task-218), so\nsomething distinguishes those runs from these.\
    \ **Establish what before designing a fix** \u2014\nwhether their sessions had\
    \ already been reaped, whether the poller concluded them, or\nwhether the parked\
    \ state tonight's runs passed through (both were parked at some point,\none on\
    \ an auth stall) is what keeps a run live. Do not assume the failure is universal;\n\
    the evidence says it is not.\n\n## Candidate directions, none of them decided\n\
    \n- **Approval concludes the run.** If a human approves, the run's work is over\
    \ by\n  definition; concluding it before spawning the finish removes the lock\
    \ contention at its\n  source. Needs care: the session may be resumed after approval\
    \ to do the delivery.\n- **The finish waits briefly for the lock, then asks the\
    \ run to stand down**, rather than\n  declining on the first attempt.\n- **`_conclude`\
    \ does not overwrite a merge clearance.** Narrower and worth doing whatever\n\
    \  else is chosen: a run cancelled while the task's ball carries an approval should\
    \ not\n  replace that prompt with a request for a decision the human already made.\n\
    \n## Related but not the same\n\ntask-022 (merged as `6e107f5e`) fixed the *self*-lock:\
    \ a run calling\n`agentjobs finish` on its own task deadlocked against a lock\
    \ it held. That is the same\nlock and a different caller. This defect is about\
    \ an approval-triggered finish blocked by\na live run that is not itself."
  constraints: '- Establish first why some finishes succeed and these did not. A fix
    built on "the finish is always blocked" would be built on a false premise; task-214
    through task-219 finished normally on this machine.

    - Do not remove the run lock or weaken it. It is what stops two runs working one
    task, and task-022''s fix depends on the run holding it for its lifetime.

    - Whatever a cancelled run writes must not contradict a standing human decision
    recorded on the same task.

    - `poetry run python scripts/check.py` passes.'
  out_of_scope: The self-lock case, fixed in task-022. Changing when a session is
    reaped, unless that turns out to be the cause.
  context:
  - path: src/agentjobs/dispatch/finish.py
    why: finish_task acquires the run lock and returns DECLINED/locked when it cannot.
  - path: src/agentjobs/dispatch/ledger.py
    why: _conclude writes the cancelled prompt, and re-handoffs only when the ball
      is not already HUMAN - which is why approval's agent/work ball is what exposes
      it.
  - path: src/agentjobs/api/routes/tasks.py
    why: The approve endpoint and after_human_handoff(finishable=True), which spawns
      the finish.
