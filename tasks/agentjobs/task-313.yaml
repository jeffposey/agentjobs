spec:
  summary: The `ball_prompt` written when a dispatched run stalls on authentication
    named `claude auth login` as the fix, flatly. The same symptom has two causes
    and the other one is fixed by waking the session. Both that prompt and `dispatch
    auth-check` now give the one command that distinguishes them, and say what each
    outcome means. Built and gate-green on `fix/task-302-auth-stall-prompt`.
  intent: "Jeff, 2026-08-23: \"yes, fix the ball_prompt text and record it on 302\"\
    . Split out of task-302 because it is a code change with its own branch and gate,\
    \ where task-302's remaining four items are prose edits \u2014 and because leaving\
    \ it as a log entry on an unclaimed task made finished work invisible in the GUI."
  description: "## What was wrong\n\n`src/agentjobs/dispatch/runner.py` wrote this\
    \ onto a task whenever a dispatched run died\non an authentication failure:\n\n\
    > **Run `claude auth login` in a terminal on that machine.** Answering inside\
    \ the session\n> cannot work\u2026\n\nStated as certain. It is one of two causes,\
    \ and the other has the opposite remedy:\n\n| Cause | Looks like | Fix |\n|---|---|---|\n\
    | The credential store genuinely cannot authenticate | session idle, one synthetic\
    \ `Login expired` message | `claude auth login` |\n| The store is fine; this session\
    \ is stuck behind a refresh that already failed | **identical** | wake the session;\
    \ a login changes nothing |\n\n`src/agentjobs/dispatch/auth.py`'s own docstring\
    \ says the mechanism outright \u2014 *\"what\nkills a session is a refresh that\
    \ fails, not a token that expires\"* \u2014 and task-224\nestablished that `daemon-auth-status.json`\
    \ is a latch that never clears. Neither made it\ninto the sentence the human reads.\n\
    \n## How it was found\n\ntask-022's run stalled on 2026-08-24 at 00:17:35Z. The\
    \ supervising session relayed the\ngenerated prompt to Jeff as established fact.\
    \ He pushed back from experience \u2014 his is\nthat the credential usually is\
    \ not really expired. Both then argued from inference: the\nsession reasoned from\
    \ the credential file's mtime and an assumed 8-hour lifetime that the\ntoken could\
    \ not have expired, and told him he was right. He was not, that time, and\nneither\
    \ was the reasoning \u2014 the access token's age was never the question.\n\n\
    **One command settled it in ten seconds**, run as a fresh process outside the\
    \ stalled\nsession:\n\n```\nclaude -p \"Reply with exactly: AUTH_OK\"\n```\n\n\
    It failed, so the login was genuinely needed. But nothing else observable distinguishes\n\
    the two cases \u2014 not the task record, not the run ledger, not `agents --json`.\n\
    \n## What changed\n\n- **`dispatch/runner.py`** \u2014 the stall `ball_prompt`\
    \ now states there are two causes,\n  gives the probe, and branches: authenticates\
    \ \u2192 wake the session, *\"Logging in again\n  changes nothing\"*; fails \u2192\
    \ `claude auth login`, and no restart will clear it.\n- **`cli.py`** \u2014 `dispatch\
    \ auth-check`'s closing advice, same shape.\n- **Tests were rewritten, not unbroken.**\
    \ `test_dispatch_poller.py` asserted\n  `\"claude auth login\" in ball_prompt`\
    \ with the comment *\"the one instruction that\n  works\"*. The assertion encoded\
    \ the wrong claim, so making it pass again would have\n  preserved the defect.\
    \ It now asserts the probe, the phrase `fresh process`, and both\n  branches.\
    \ `test_dispatch_cli.py` likewise.\n\n## Not done here\n\n`docs/agent-workflow.md`'s\
    \ recovery section has the same overstatement \u2014 *\"naming\n`claude auth login`\
    \ as the fix. That is the whole recovery\"* \u2014 true in two of three\nrecorded\
    \ occurrences, stated without the qualifier. Left to task-302, which owns prose."
  constraints: '- Do not re-assert either fix as the certain one. The point of the
    change is that the prompt offers a test rather than a verdict.

    - `poetry run python scripts/check.py` passes.'
  out_of_scope: task-302's four original prose items, and the same overstatement in
    docs/agent-workflow.md, which belongs to it.
