    \ proving the inherited posture reaches the merge and names itself in the merge\
    \ commit.\n\n**A real walk, not just the suite** (the standard in ENGINEERING.md\
    \ \xA7 Verification). Built a throwaway project under its own `AGENTJOBS_HOME`\
    \ \u2014 epic plus two children, `posture: auto` / `max_posture: autonomous`,\
    \ a stand-in runner that writes down its prompt and closes its task \u2014 and\
