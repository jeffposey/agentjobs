  ts: '2026-08-25T23:48:20.501345Z'
  actor: claude
  type: decision
  body: "**The first `finish --posture-release` declined, and the cause is a defect\
    \ in the environment this run was handed \u2014 not in this branch, and not in\
    \ the guard that refused.**\n\n```\ntask-316: declined (posture_requires_review)\n\
    This finish runs at posture auto (from the project), whose merge policy is `review`.\n\
    ```\n\n## What actually happened\n\n`released_posture` (`finish.py:1174`, task-315)\
    \ decides the merge posture from `os.environ[\"AGENTJOBS_RUN_ID\"]`. In this session's\
    \ shell that variable reads **`run_12b2675c`** \u2014 the task-269 *supervisor*\
    \ run, dispatched at 09:57Z today and long finished. My own run is `run_68ea396e`.\n\
    \nThe guard then did exactly the right thing with that input. `finish.py:1224`:\
    \ *\"A run may only vouch for the task it was dispatched against.\"* `run_12b2675c.task_id`\
    \ is `task-269`, not `task-316`, so the record was discarded and resolution fell\
    \ through to `resolve_posture` \u2192 the project default `auto` \u2192 `review`\
    \ \u2192 declined. Nothing was touched.\n\nThe two records, side by side, are\
    \ the whole of it:\n\n| | `run_68ea396e` (mine) | `run_12b2675c` (what my env\
    \ says) |\n|---|---|---|\n| `task_id` | **task-316** | task-269 |\n| `posture`\
    \ | autonomous | autonomous |\n| `posture_source` | dispatch | dispatch |\n| `status`\
    \ | running | finished, 09:57Z |\n\nEntry 36 records Jeff choosing `autonomous`\
    \ for *this* run, and `run_68ea396e/meta.yaml` \u2014 written by the manager at\
    \ dispatch, not by me \u2014 says the same. The authority for this merge exists\
    \ and is on file. The environment variable that points at it is the thing that\
    \ is wrong.\n\n## Why the variable is stale, as far as I can establish it\n\n\
    `DispatchRunner._environment` (`runner.py:1656`) is correct and explicitly defends\
    \ against this: it **pops** `AGENTJOBS_RUN_ID` and `AGENTJOBS_RUN_DIR` before\
    \ setting them, with a comment saying why \u2014 *\"Granted, never inherited.\
    \ A dispatcher can itself be running inside a dispatched run.\"* So the leak is\
    \ not there.\n\nWhat fits the evidence is that `claude --bg` does not do the session's\
    \ work in the process dispatch spawned. The background session is hosted, and\
    \ the host that is hosting me was first started under `run_12b2675c` \u2014 which\
    \ was itself a `--bg --remote-control` run, and which ran scripted finishes that\
    \ restart processes. My shell also carries `VIRTUAL_ENV` pointing at the **main\
    \ clone's** virtualenv (`agentjobs-KSKY4Ymk`), not this worktree's, which is consistent\
    \ with an environment inherited from a process rooted in `C:\\projects\\agentjobs`\
    \ rather than one dispatch built for me.\n\n**I have not proved that mechanism**\
    \ and I am not asserting it. What is proved is the observable: a dispatched run's\
    \ shell carried another, older run's id, and the correct guard consequently stripped\
