  actor: claude
  type: decision
  body: "**A context pointer on this task was turning every gate run in the repository\
    \ red, on `main` and on every branch. Removed it; the information it carried is\
    \ preserved in the audit pointer's `why`.**\n\nFound 2026-08-25 by the run working\
    \ task-302, whose gate failed at `tests/test_task_corpus.py::test_agentjobs_context_paths_exist`:\n\
    \n```\ncontext pointers name paths that do not exist: task-317 -> docs/context-budget.md\n\
    ```\n\n**This was not a stale-worktree artefact.** I ran the same test in the\
    \ main clone before touching anything and it failed there too \u2014 so `main`\
    \ was red, and so was every branch cut from it. That is the whole reason this\
    \ was worth fixing from another task rather than reported and left.\n\n**Cause.**\
    \ This task was filed by the session working task-301, and pointed at `docs/context-budget.md`\
    \ \u2014 task-301's own deliverable, which exists only on `docs/task-301-context-budget`.\
    \ That branch is parked at `human`/`review` and unmerged, so the pointer was a\
    \ forward reference to a file the repository does not contain.\n\n**What changed.**\
    \ The `docs/context-budget.md` entry is gone. Its `why` said section 2 records\
    \ the measurement that found this, including why F11's token half does not reproduce;\
    \ that sentence now lives on the `audits/2026-08-21/08-mcp.md` entry, together\
    \ with an instruction to point an entry back at the context-budget document once\
    \ task-301's branch merges. Nothing else on this task was touched \u2014 not the\
    \ spec prose, not the acceptance criteria, not the queue position.\n\n**Rejected:\
    \ waiting for task-301 to merge.** It is the tidier repair and it restores the\
    \ pointer for free, but it is gated on a human review that had not happened, and\
    \ it left every branch in the repository unable to pass its own gate in the meantime\
    \ \u2014 including the other children of the task-269 epic, which merge through\
    \ `agentjobs finish` and therefore cannot merge at all against a red gate.\n\n\
    **Also rejected: relaxing the test.** The contract is right. A context pointer\
    \ that names a non-existent path is exactly the defect it is there to catch, and\
    \ this is a true positive.\n\n**The general shape of this is task-311's**, which\
    \ asks whether task records should live somewhere shared across worktrees rather\
    \ than versioned alongside the code. This instance is narrower than that \u2014\
    \ the pointer was wrong on `main` itself, not merely absent from a branch snapshot\
    \ \u2014 so it is repaired here rather than folded into that question."
