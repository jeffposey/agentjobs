- id: 7
  ts: '2026-08-27T11:43:48.479860Z'
  actor: claude
  type: progress
  body: "**ac-1 answered, and the spec's premise turns out to be wrong in a way that\
    \ matters.**\n\nBranch `fix/task-317-mcp-declaration-port`, worktree `../worktrees/agentjobs-317`.\n\
    \n## Which declaration a session gets\n\n**Neither declaration was winning a contest.\
    \ There was no contest.** The two servers are namespaced separately by Claude\
    \ Code \u2014 `mcp__agentjobs__*` for the project-scoped entry and `mcp__plugin_agentjobs_agentjobs__*`\
    \ for the plugin's, both of which are already spelled out in `~/.claude/settings.json`'s\
    \ allow-list. They cannot collide. The plugin's server was simply **dead**, and\
    \ had been in every session.\n\nEvidence, from this running dispatched session\
    \ (`run_41989070`, 2026-08-27):\n\n```\n$ claude mcp list\nplugin:agentjobs:agentjobs:\
    \ agentjobs mcp - x Failed to connect - CONNECTION_CLOSED: Connection closed\n\
    agentjobs: C:/Users/jpose/AppData/Local/pypoetry/Cache/virtualenvs/agentjobs-KSKY4Ymk-py3.13/Scripts/python.exe\
    \ -m agentjobs.cli mcp - OK Connected\n```\n\nCorroborated three ways: `netstat`\
    \ shows only `127.0.0.1:8876` listening and nothing on 8765; a process listing\
    \ shows exactly one MCP child, whose command line is the project-scoped entry's\
    \ interpreter form, and no `agentjobs.exe` at all; and this session's own tool\
    \ list carries 16 `mcp__agentjobs__*` names and zero plugin-prefixed ones.\n\n\
    The cause reproduces exactly. `agentjobs mcp` with `AGENTJOBS_URL` unset:\n\n\
    ```\nagentjobs mcp: AgentJobs service at http://127.0.0.1:8765 is not reachable\n\
    (Request failed: [WinError 10061] ... actively refused it). Start it with\n`agentjobs\
    \ serve`, or point AGENTJOBS_URL at the running service.\n```\n\nIt exits, and\
    \ a client renders an MCP server that exits at startup as `CONNECTION_CLOSED`\
    \ \u2014 not as a bad address. That is why nobody caught it.\n\n## Two things\
    \ the audit could not establish, now established\n\nAuditor 8's F4 left both open.\
    \ Both were settled by one controlled probe: I edited **the repository's** `plugins/agentjobs/.mcp.json`\
    \ from 8765 to 8876, re-ran `claude mcp list`, and the plugin entry went from\
    \ `Failed to connect` to `Connected`; then reverted. Therefore \u2014\n\n1.  **Claude\
    \ Code reads the repo copy, not the installed cache.** The marketplace here is\
    \ `extraKnownMarketplaces.agentjobs -> directory C:\\projects\\agentjobs`, so\
    \ `plugins/agentjobs/.mcp.json` in the working tree is what a session launches.\
    \ **The hand edit in `~/.claude/plugins/cache/agentjobs/agentjobs/0.1.0/.mcp.json`\
    \ (which says 8876) is inert** \u2014 F4 assumed the cache was authoritative and\
    \ it is not, which is why that edit never made the plugin work.\n2.  **Claude\
    \ Code does honour a plugin server's per-server `env` block.** F4 recorded that\
    \ as unverified and inferred from the hand edit that it probably was not honoured.\
    \ It is.\n\n## F11's token half, revisited\n\nThe spec is right that F11 does\
    \ not reproduce today \u2014 but not for the reason it gives. It is not that \"\
    the names collide, so one declaration wins\". It is that the plugin's server was\
    \ down, so its 16 tools and its instruction block were never injected. **Making\
    \ the plugin's declaration merely *work* would have made F11 true rather than\
    \ false**: 32 tools, two instruction blocks, and two spellings of every call.\
    \ That is the reason the fix below is \"resolve the address\" plus \"say plainly\
    \ that you want one server, not two\", rather than \"point the second one at 8876\"\
    .\n\n## The fix\n\n`plugins/agentjobs/.mcp.json` no longer names an address at\
    \ all:\n\n```json\n{ \"mcpServers\": { \"agentjobs\": { \"command\": \"agentjobs\"\
    , \"args\": [\"mcp\"] } } }\n```\n\nThat alone would still land on 8765, because\
    \ `McpConfig.resolve` had no source between `AGENTJOBS_URL` and its literal default.\
    \ So `src/agentjobs/mcp/config.py` now falls through to the address **the machine\
    \ has declared** \u2014 `AGENTJOBS_API_BASE`, then `api_base:` in `~/.agentjobs/dispatch.yaml`\
    \ \u2014 before the default. That is `agentjobs.dispatch.address.configured_api_base`,\
    \ the same resolution dispatch already uses for the address it hands an agent\
    \ and `agentjobs init` uses when it writes a project's `.mcp.json`; the CLI's\
    \ `_mcp_base_url` was already doing this and `McpConfig` was the one caller that\
    \ was not. `configured_api_base` gained an optional `env` mapping so the MCP server\
    \ resolves the environment it was handed rather than reaching into `os.environ`,\
    \ which is also what makes it testable.\n\nVerified end-to-end in the worktree,\
    \ `AGENTJOBS_URL` unset:\n\n```\nINFO agentjobs.mcp.server: Connected to AgentJobs\
    \ 0.1.0 (task schema v2)\n     at http://127.0.0.1:8876; 5 project(s) available.\n\
    INFO agentjobs.mcp.server: Serving 16 tool(s): ...\n```\n\nSame command on `main`\
    \ refuses at 8765. `~/.agentjobs/dispatch.yaml` on this machine declares `api_base:\
    \ http://127.0.0.1:8876`, so nothing else had to be configured for that to work.\n\
    \n## ac-2\n\nThe root `.mcp.json` is **untracked** \u2014 `.gitignore:74`, with\
    \ a comment saying there is no version of it correct for two people at once. So\
    \ the repository contains exactly one `agentjobs` MCP declaration, the plugin's,\
    \ and after this change it names no port. `tests/test_codex_plugin.py::TestMcpWiring`\
    \ previously asserted the 8765 value; it now asserts the opposite contract, that\
    \ no port appears in that entry.\n\nDocs updated where the change makes them false:\
    \ `docs/mcp.md`, `docs/mcp-clients.md`, `plugins/agentjobs/README.md`.\n\nGate\
    \ running; result to follow."
