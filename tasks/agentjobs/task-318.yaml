      land in the parent''s run directory'
  - path: tasks/agentjobs/task-302.yaml
    why: 'The live observation: the decline, the lock file, the environment, and the
      command that got past it'
  - path: tasks/agentjobs/task-316.yaml
    why: "The sibling defect in the same spawn path \u2014 consider whether one fix\
      \ covers both"
