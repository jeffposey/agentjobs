- id: 9
  ts: '2026-08-27T11:13:53.574002Z'
  actor: claude
  type: progress
  body: "**ac-1, settled from inside a live walk-started child: the shell now sees\
    \ its own run id. The defect is fixed. And the causal story in this task's title\
    \ is wrong \u2014 worth correcting, because the right one predicts a different\
    \ blast radius.**\n\nWritten by `run_74dfbc1c`, working task-318, dispatched by\
    \ the task-269 walk (`trigger: child`, `posture_source: epic`, `caused_by: 5`).\
    \ Entry 4 asked for exactly one comparison, from a shell inside a dispatched child\
    \ rather than from dispatch-side records. Here it is.\n\n## The comparison entry\
    \ 4 asked for\n\n```\n$ echo \"$AGENTJOBS_RUN_ID\"\nrun_74dfbc1c\n$ echo \"$AGENTJOBS_RUN_DIR\"\
    \nC:\\Users\\jpose\\.agentjobs\\runs\\run_74dfbc1c\n\n$ cat ~/.agentjobs/runs/.locks/task-318.lock\n\
    pid=1409908 run=run_74dfbc1c kind=dispatch started=2026-08-27T11:08:26+00:00\n\
    \n$ cat ~/.agentjobs/runs/.locks/task-269.lock          # the supervisor's\npid=959100\
    \  run=run_1132ebf8 kind=dispatch started=2026-08-27T09:40:12+00:00\n```\n\n**Shell,\
    \ lock and `meta.yaml` all say `run_74dfbc1c`.** A distinct supervisor run exists\
    \ and is nameable \u2014 `run_1132ebf8` \u2014 and its id is nowhere in this session's\
    \ environment. Both of `_own_run_holds_lock`'s conditions therefore hold on their\
    \ own, with no override, which is precisely what task-302 and task-303 could not\
    \ get. `meta.yaml` records `session_env: delivered`, so the identity arrived through\
    \ task-249's `--settings` channel.\n\n(Entry 4's snippet said `~/.agentjobs/runs/<run>/lock`.\
    \ The locks are per **task**, in a shared `.locks/` directory \u2014 `runs/.locks/<task-id>.lock`\
    \ \u2014 not per run. Corrected here so the next reader does not `cat` a path\
    \ that has never existed.)\n\n## Which candidate was real: neither, as written\n\
    \nac-1 asks which of the spec's two candidates it is. The answer is that the spec's\
    \ framing does not contain it, and candidate 1 is disprovable by reading nine\
    \ lines.\n\n**Candidate 1 is false.** `walk_epic.start_child` (`src/agentjobs/dispatch/epic.py`)\
    \ does not build an environment at all. It constructs a `DispatchRequest` carrying\
    \ `task_id`, `trigger`, `on_behalf_of_parent` and `posture`, and calls `dispatch_task`.\
    \ There is no environment in it to leak. Every child gets a freshly created run\
    \ id and run directory from the dispatcher, which is why `run_a07731b6` and `run_ff8c316d`\
    \ both had correct directories of their own.\n\n**Candidate 2 is the right family\
    \ but the wrong mechanism.** It guessed the session \"was started earlier or differently\
    \ and carries the older value\". The real mechanism, established by task-249 and\
    \ documented in `dispatch/session_env.py`: `claude --bg` is a **launcher**. It\
    \ hands the session to a persistent Claude Code daemon and the daemon spawns the\
    \ worker **from the daemon's own environment**, discarding the launcher's entirely.\
    \ So the worker inherits the identity of whichever run happened to *start the\
    \ daemon* \u2014 not of its parent, and not of anything \"older\" in its own lineage.\n\
    \n**That distinction is not pedantry, and it explains the evidence better than\
    \ the title does.** A walk supervisor is dispatched first and its launch is typically\
    \ the one that starts the daemon; every child then launches into that already-running\
    \ daemon and comes up wearing the supervisor's id. So \"child inherits parent\"\
    \ is a *consequence* of the walk's ordering, not the rule. The rule is \"everything\
    \ inherits the daemon-starter\", and it has two corollaries the title would not\
    \ lead anyone to expect:\n\n- A run with no parent at all is equally exposed.\
    \ `run_68ea396e` (task-316) came up as `run_12b2675c` from **fourteen hours earlier**\
    \ \u2014 far too old to be an inheritance from a spawn.\n- A child whose own launch\
    \ starts the daemon comes up correct. `run_3f8ec46f` did, two and a half minutes\
    \ after the daemon idle-exited (task-249's log).\n\n## The pid inference in entry\
    \ 3 was sound reasoning pointed at the wrong target\n\nEntry 3 found task-302's\
    \ and task-303's locks sharing `pid=1003448` twenty-five minutes apart and read\
    \ it as evidence for candidate 1. The reading is right that one long-lived process\
    \ wrote both locks; what it missed is *which* process the pid in a lock file identifies.\
    \ `acquire_run_lock` runs inside the **dispatcher**, so the pid is the walk's,\
    \ and a walk starting two children from one process is the expected, correct thing\
    \ \u2014 not a symptom. This run reproduces the same shape harmlessly: my lock\
    \ names `pid=1409908`, a live `python` (the dispatcher), while the supervisor's\
    \ lock names `pid=959100`, which is no longer running at all. Two different pids,\
    \ no leak. The pid never carried the signal.\n\nRecording it because the inference\
    \ was explicitly flagged as an inference, and the honest thing is to say where\
    \ it landed.\n\n## Status\n\n- **ac-1: met.** Answered from a live dispatched\
    \ child, and the cause named as the daemon-owns-the-environment defect fixed by\
    \ task-249, not either candidate as the spec worded them.\n- **ac-2: pending the\
    \ finish.** The command this run was told to use will be run with no environment\
    \ override; whether it merges is the observation.\n- **ac-3, ac-4** are where\
    \ the remaining work is. `own_run_id`'s existing tests all exercise a **finished**\
    \ stale run, and the walk case is a **live** one \u2014 a real hole, since `_run_vouching_for`\
    \ would still pass every one of those six tests if its task-id comparison were\
    \ removed. Working branch `test/task-318-walk-child-run-identity`."
