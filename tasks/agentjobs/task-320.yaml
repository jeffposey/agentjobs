- id: 7
  ts: '2026-08-27T16:42:33.971969Z'
  actor: claude
  type: decision
  body: '**Decision: adoption, not detection. `agentjobs run register` is the fix.**


    Jeff''s note on this record (entry 3) picked the shape: sessions register themselves,
    the AGENTS.md files say to always do it, and a dispatched session knows it need
    not. That is what is built, and here is the argument for it against the two alternatives
    the spec put up.


    **Rejected -- make the protocol the fix (do nothing).** `dispatch walk` already
    starts epic children as real dispatches, so their coverage is by construction.
    But that closes the gap only for epic children. A human or a supervisor can still
    hand-spawn a session at any task, which is exactly what happened to task-217,
    and nothing would stop or notice it. Rejected as insufficient rather than as wrong.


    **Rejected for now -- record-side detection.** Flagging a task that is `active`/`agent`/`work`
    with no live run behind it and no log movement is runner-agnostic and catches
    causes registration cannot, including a dispatched run whose process died without
    the ledger noticing. It was not built because of the constraint on this record:
    it cannot presently tell an unattended session from an interactive one a person
    is working in, and both are `active`/`agent`/`work` with no run record. Every
    interactive session would be a false positive, and a detector that cries wolf
    on the most common healthy state is worse than none.


    **Registration is what makes that detector possible later**, which is the reason
    to build this one first. Once an unattended session is expected to have a run
    record, *not* having one stops being the norm and becomes a signal. Detection
    is the natural follow-up and is a better task after this than before it.


    **How the interactive case is handled here: by construction, not by heuristic.**
    `register` refuses an interactive session outright (`session_interactive`). A
    session a person is sitting in is never adopted, so it can never be reported stalled,
    parked, or finished-without-handing-off. The decisive reason is not false positives:
    `_settle_finished_session` calls `stop_session` on a session it judges finished,
    and applied to a session somebody was typing into that would end it mid-sentence.
    Claiming the task remains what records that a person is working it.


    Answers **sc-1**.'
  data:
    operation:
      id: 3f1c2a90-77b2-4e21-9f36-1a4c8ad61b01
      kind: log_append
      fingerprint: 544cab709f3376f3eda717ea365aa022
- id: 8
  ts: '2026-08-27T16:42:52.002376Z'
  actor: claude
  type: decision
  body: '**Decision: recovery is out of scope. Detection and reporting only.**


    sc-4 asked for this to be argued rather than inherited from task-296. Task-296''s
    reason was that a stalled session may hold a dirty worktree, so restarting risks
    two sessions on one branch. That reason applies here unchanged, and registration
    adds a second one that is stronger and specific to it:


    **AgentJobs never had this session''s argv, environment or prompt.** It did not
    start the process, so it has nothing to start again. A "restart" would be a cold
    dispatch wearing the old run''s name, against a task whose worktree and branch
    the previous session may still hold -- which is the two-sessions-on-one-branch
    failure, arrived at by a different road.


    So a registered session is never killed and never restarted. It stays attachable,
    and what AgentJobs does is say on the task record which of the four things happened
    to it: parked on a permission prompt, stopped by an expired login, finished without
    handing off, or claiming to work while emitting nothing. `agentjobs dispatch cancel
    <run>` remains available to a human who wants the session stopped.


    **Three smaller scope calls, recorded so they are not re-taken:**


    - **The machine''s `max_concurrent_runs` is not applied to a registration.** It
    exists to stop a click starting an agent the machine cannot afford. This session
    is already running; refusing would not stop it, it would only keep it invisible,
    which is the whole defect. The registered run does hold a slot from then on, because
    the machine really is running that agent.

    - **A registration writes a `note`, not a `dispatch` entry.** Nobody authorised
    a run and AgentJobs started no process, so design section 2''s human-clocked chain
    must not be forged by a command any agent can invoke. The note''s entry id is
    what the run''s `dispatch_entry_id` points at, which is all `_ball_moved` and
    `record_dispatch_result` need.

    - **A session launched from inside a worktree is refused, not adopted.** `runner.ledger()`
    lists with `--cwd <project root>`, and the poller looks a session up exactly that
    way -- so adopting one listed elsewhere would produce a run reported `gone` at
    the next tick. Refusing is the honest answer; relaxing it later means teaching
    the poller to widen its own lookup, which is a change to the poller and not to
    this command.


    Answers **sc-4**.'
  data:
    operation:
      id: 7b2d4e11-0c93-4a77-b5e2-9d3f61a4c2d8
      kind: log_append
      fingerprint: 7eb41b2153df021cdace35fe8de7ecd5
