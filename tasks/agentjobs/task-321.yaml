- id: 6
  ts: '2026-08-27T15:59:46.250810Z'
  actor: claude
  type: decision
  body: "Plan, after reading the whole approve \u2192 finish path.\n\n**What the reader\
    \ sees today.** `approve_task` calls `spawn_finish`, which starts a detached `agentjobs\
    \ finish` and returns the path of a log it will write. Nothing else happens: the\
    \ browser gets the task back, the ball reads `agent`/`work` with the approval's\
    \ own prompt, and for the two to four minutes the finish takes there is no signal\
    \ at all. `announce_start` writes a `progress` entry \u2014 but only after preflight\
    \ and the runway wait, and only if the reader reloads. The Dispatch button stays\
    \ live the whole time, and pressing it produces a refusal from the run lock rather\
    \ than an explanation.\n\n**What is already on disk and unread.** A finish writes\
    \ `~/.agentjobs/finishes/<fin_id>/` \u2014 `meta.yaml` (task, project, outcome,\
    \ started_at, merge_commit), `phases.jsonl` (`finish_preflight`, `finish_runway`,\
    \ `gate_started`, `gate_finished`), `gate.log`, `restart.log` \u2014 and the spawned\
    \ process's stdout lands in `finishes/spawn/<task-id>.log`, which ends up holding\
    \ the whole step table. `scripts/run_report.py` reads that directory; the API\
    \ never has. So this is mostly a reading problem, not a recording one.\n\n**Decision:\
    \ make a finish readable the way a run already is, rather than streaming a process.**\n\
    \n1. `spawn_finish` writes a marker beside the log *before* `Popen`, so the approve\
    \ response cannot return before the page can tell a finish is starting. That closes\
    \ the one-to-two-second window between the click and the finish directory existing.\n\
    2. Steps are recorded as they land, not only in the final table: a `StepLog` that\
    \ writes a `finish_step` phase on every append. Plus per-stage gate records from\
    \ `scripts/check.py` (`gate_stage_started` / `gate_stage_finished`), because the\
    \ gate is ~85% of a finish's wall clock and is currently one silent block.\n3.\
    \ A reader module assembles those into a status \u2014 state, live, elapsed, the\
    \ step table, gate progress, the log tail \u2014 with liveness taken from the\
    \ per-task run lock through the existing `stale_lock_reason`, so a finish whose\
    \ process died reads as interrupted rather than as a spinner forever.\n4. Two\
    \ endpoints under the dispatch surface, mirroring runs: a polled JSON view and\
    \ a plain-text `/output`.\n5. The task page grows a Finish panel between the review\
    \ verbs and Dispatch, and Dispatch's button is disabled while a finish is live,\
    \ saying why.\n\n**Rejected: streaming the finish's stdout to the browser.** It\
    \ would need `run_command` to tee rather than capture, and the CLI to print each\
    \ step, and it would still show nothing during the gate \u2014 the gate's own\
    \ output is buffered until it exits. The step table plus per-stage gate progress\
    \ is more legible than the terminal text would have been and costs no change to\
    \ how a finish executes.\n\n**Rejected: putting the finish state on the approve\
    \ response.** Additive to `HumanActionResponse`, which six routes share, to save\
    \ one refetch that the page's own post-approve invalidation already makes. The\
    \ marker in (1) is what makes that refetch reliable."
