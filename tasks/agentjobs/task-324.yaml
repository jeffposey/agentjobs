- id: 6
  ts: '2026-08-29T18:00:41.879319Z'
  actor: claude
  type: decision
  body: "sc-5. `--name` is the flag; `--remote-control [name]` is a different surface\
    \ and does not touch the session name. Established by observation on Claude Code\
    \ 2.1.247, 2026-08-29, not from `--help`.\n\n**The instrument.** Four throwaway\
    \ `--bg --remote-control` sessions, each given a harmless one-line prompt and\
    \ stopped afterwards. Read back two ways: `claude agents --json`, run from a separate\
    \ process, and this session's own `ListAgents` peer listing. The on-disk ledger\
    \ `~/.claude/sessions/<pid>.json` was read directly as a third check.\n\n**Probe\
    \ A \u2014 `--name \"task-999 probe-alpha\"`.** Launch echoed the name. After\
    \ a full turn (`state: done`), `claude agents --json` still reported `\"name\"\
    : \"task-999 probe-alpha\"`, and the ledger showed `nameSince` 12 ms after `startedAt`.\n\
    \n**The thing that would have defeated a naive fix.** Claude Code renames a `--bg`\
    \ session from the prompt a few seconds into the first turn. This very run is\
    \ the control: its ledger entry reads `\"name\":\"git worktree task setup\"` with\
    \ `nameSince` **5254 ms** after `startedAt`, and the concurrent run on task-023\
    \ reads `git worktree setup` \u2014 one word apart, neither naming a task. `--name`\
    \ is not overwritten by that rename. It is set at launch and stays.\n\n**Probe\
    \ B \u2014 `--remote-control \"task-999 probe-beta-rc\"`, no `--name`.** The session\
    \ came up called `Reply with the single word OK and nothing else.` \u2014 the\
    \ prompt. No peer row anywhere carried `probe-beta-rc`. So the two flags are not\
    \ the same string, and `--remote-control`'s optional value does not reach the\
    \ picker or the peer channel. (It also *consumes* a bare argument that follows\
    \ it, which is why the spliced name is a flag pair and lands after it, never a\
    \ bare string.)\n\n**Probe C \u2014 `-p --name ...`.** Exit 0, output `OK`. Accepted\
    \ in batch mode, so splicing it does not break a `mode: batch` runner.\n\n**Probe\
    \ D \u2014 a 127-character name.** Returned verbatim from `claude agents --json`,\
    \ untruncated. There is no length cap to design around, so brevity in the format\
    \ below is a choice and not a constraint.\n\n**Which surface the peer channel\
    \ addresses.** `ListAgents` lists sessions by this same name and appends a `[ref]`\
    \ suffix only when a bare name is ambiguous. Every pre-existing row carries one.\
    \ The two rows named by this change do not \u2014 see the progress entry's listing\
    \ \u2014 so a run named this way is addressable by its name alone."
  data:
    operation:
      id: 4f2a7c31-9b64-4d1e-8a52-16c0f3b7d9a1
      kind: log_append
      fingerprint: 60d687d051e13e52d93f21919c26ad74
- id: 7
  ts: '2026-08-29T18:00:56.443534Z'
  actor: claude
  type: decision
  body: "The name is `<project>/<task>@<short run id>` \u2014 `agentjobs/task-324@11085a50`\
    \ \u2014 and the title is deliberately not in it.\n\n**What the spec left open,\
    \ answered.** Task id is mandatory and leads, because the picker is scanned and\
    \ that is where the eye lands. The run id, with its `run_` prefix stripped as\
    \ noise, is what distinguishes two runs of one task (sc-2); the task id alone\
    \ cannot. The project is included because both surfaces are machine-wide \u2014\
    \ two hundred sessions across five projects on this machine right now \u2014 while\
    \ a task id is only unique within its project.\n\n**Rejected: putting the title\
    \ in.** It is the one candidate that reads well, and it loses on two grounds.\
    \ A title is editable, so two runs of one task could end up named after two different\
    \ descriptions of it, which is precisely the instability this task exists to remove.\
    \ And truncating one rarely distinguishes, because the tasks that need telling\
    \ apart are neighbours in the same area whose titles share a prefix \u2014 this\
    \ task and task-296 both open \"Dispatch does not\". The id is the key every other\
    \ surface already uses. Probe D established there is no length cap forcing this,\
    \ so it is a judgement and can be revisited: if the id-only form turns out to\
    \ be unreadable in practice, a truncated title is a one-line change to `session_name`.\n\
    \n**Rejected: writing it into the runner templates.** The scaffold has three Claude\
    \ templates and an operator may write more; every one of them would have to remember\
    \ the name, and an operator editing a copied template would silently lose it.\
    \ Splicing follows the posture flags' precedent \u2014 AgentJobs owns this argv\
    \ element, not the operator \u2014 and gives a custom runner an identifiable session\
    \ for free.\n\n**Rejected: `--remote-control <name>` as the carrier.** Probe B\
    \ (previous entry) shows it does not reach the picker or the peer channel at all."
  data:
    operation:
      id: 7d1e5b02-3a48-4c96-b7f1-2e5a90c4d8b3
      kind: log_append
      fingerprint: c1f683eac424ff7feadb4ad438196ac9
- id: 8
  ts: '2026-08-29T18:01:06.902737Z'
  actor: claude
  type: decision
  body: "sc-4, the Codex half: a Codex runner is left unnamed, deliberately, and this\
    \ stays a Claude-only splice.\n\n`session_name_flags` returns `[]` for `driver:\
    \ codex`. A Codex App Server thread has no display name and `codex exec` has no\
    \ flag that sets one, so there is nothing here to degrade \u2014 a Codex thread\
    \ was never in the Claude session picker and was never addressable on the peer\
    \ channel. Making this a \"runner capability\" would mean declaring an interface\
    \ one of two drivers cannot implement, which is a worse record than a no-op with\
    \ a reason. Revisit if the App Server grows a name a picker can read; `test_a_codex_runner_is_deliberately_left_unnamed`\
    \ is where that would be noticed.\n\nThe other half of sc-4 \u2014 an operator's\
    \ own flags \u2014 is covered two ways. A custom template's flags keep their order\
    \ and their place (`test_a_custom_template_carrying_its_own_flags_still_composes`),\
    \ and a template that already writes its **own** `--name` or `-n` is not given\
    \ a second one (`test_a_template_that_names_itself_is_not_given_a_second_name`).\
    \ That opt-out is the only one, and it requires the operator to write the flag\
    \ as its own argv element \u2014 a `--name` buried inside a longer string does\
    \ not count, which is what stops it from being an injection route."
  data:
