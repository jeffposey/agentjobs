    ]   (prompt is element 11 of 12)\n[\"--name\", \"agentjobs/task-324@bb22bb22\"\
    ]\n```\n\n`claude agents --json`, run from a **separate process**:\n\n```json\n\
    { \"pid\": 1896236, \"id\": \"687a1beb\", \"cwd\": \"C:\\\\projects\\\\agentjobs\"\
    , \"kind\": \"background\",\n  \"sessionId\": \"687a1beb-e9a4-4cdc-b9b8-068f3f5da0d7\"\
