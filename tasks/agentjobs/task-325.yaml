spec:
  summary: "One test \u2014 TestProcessGroup::test_the_timeout_kills_the_grandchild_too\
    \ \u2014 has now failed three unrelated gates by timing out rather than by finding\
    \ a bug. Its own comment says its 30-second budget is \"large enough that a loaded\
    \ machine cannot exhaust it\"; that premise was written for a machine running\
    \ one gate, and this one routinely runs two or three. Establish whether the grandchild\
    \ genuinely survives or the check is simply slow, then fix the one that is wrong."
  intent: Stop a timing assertion from failing merges it has nothing to do with, without
    weakening the thing it actually tests.
  description: "## What happens\n\n`tests/test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`\
    \ fails under `scripts/check.py` with `AssertionError: pid <n> survived the timeout`,\
    \ and passes in seconds when run alone.\n\nThree occurrences on record, none on\
    \ a branch that touches the kill path:\n\n- task-308's scripted finish (recorded\
    \ in the test's own comment, 2026-08-25).\n- task-324, 2026-08-29: the second\
    \ stage-`pytest` run of the gate, `pid 1893332`.\n- task-324's **scripted finish**,\
    \ minutes later, `pid 1904932` \u2014 which stopped the finish outright and cost\
    \ a full second finish (~6 minutes) to get past.\n\nIt passed on two full unqualified\
    \ gates on the same branch in between. So it is intermittent, and its rate is\
    \ high enough to be a real tax: two failures in four gate runs on one afternoon.\n\
    \n## Why the existing mitigation is not enough\n\ntask-308 already widened this\
    \ from an outright assertion to `_dies_within(grandchild_pid, 30.0)`, with a comment\
    \ stating the budget \"is only large enough that a loaded machine cannot exhaust\
    \ it, so that a failure means 'still running', never 'slow'.\"\n\n**That premise\
    \ no longer holds.** ENGINEERING.md says three dispatched runs are allowed on\
    \ this machine and overlapping gates are the normal case; a gate under three-way\
    \ contention has been measured at around six minutes against a 96-second baseline.\
    \ During the task-324 failures only *two* agent runs were live, so it did not\
    \ even take the worst case. `_pid_alive` shells out to `tasklist`, which the same\
    \ comment prices at about a second per call on an idle machine \u2014 under a\
    \ loaded one that cost is unbounded, and the polling budget is not.\n\n## What\
    \ to work out first\n\nDo not just raise the number. Establish which of these\
    \ it is, and write down which:\n\n1. **The check is slow.** `tasklist` under load\
    \ eats the budget, so 30 seconds buys only a handful of polls. Fix: a cheaper\
    \ liveness check (`OpenProcess`/`ctypes` on Windows, `os.kill(pid, 0)` elsewhere)\
    \ so the budget buys hundreds of polls instead of a few, and the wall-clock number\
    \ stops being load-sensitive. This is the hypothesis the evidence currently favours.\n\
    2. **The kill is genuinely slow.** The process-group signal really does take longer\
    \ than 30 seconds to reach a grandchild on a loaded machine \u2014 in which case\
    \ the budget is wrong and the reason should be recorded, not the number quietly\
    \ bumped.\n3. **The kill genuinely misses.** There is a real race in which the\
    \ grandchild survives, and this test has been finding a bug all along. Least likely,\
    \ most important to rule out rather than assume.\n\nInstrument it: time `_pid_alive`\
    \ and count the polls actually made before the budget expires. That single measurement\
    \ separates (1) from (2) and (3).\n\n## Why it is worth a task rather than a retry\n\
    \nA test that fails a merge for a reason unrelated to the branch trains everyone\
    \ to re-run the gate on red, which is exactly the habit that lets a real failure\
    \ through. The scripted finish makes it worse: a red gate stops the finish, so\
    \ this costs a whole cycle rather than a re-run."
  constraints: "- Do not delete or skip the test, and do not mark it `xfail`. It guards\
    \ a real property \u2014 an agent that shelled out to pytest must not leave the\
    \ pytest behind \u2014 and that property has no other coverage.\n- Whatever replaces\
    \ the current check must still fail when the grandchild genuinely survives. Prove\
    \ that: make the kill a no-op and watch the test go red.\n- A liveness check has\
    \ to work on Windows and elsewhere; this suite runs on both."
  out_of_scope: '- Retry logic in `scripts/check.py` or in the scripted finish. Making
    a flaky test cheaper to tolerate is not the same as fixing it, and a general retry
    mechanism would hide failures that are real.

    - Any other slow or timing-sensitive test. If the same pattern turns up elsewhere,
    file it separately with its own evidence.'
  context:
  - path: tests/test_dispatch_runner.py
    why: TestProcessGroup::test_the_timeout_kills_the_grandchild_too and the _dies_within
      / _pid_alive helpers below it; the comment above the assertion records task-308's
      earlier mitigation and the premise this task disputes.
  - path: docs/performance.md
    why: What a gate costs under contention, which is the evidence that the 'a loaded
      machine cannot exhaust it' premise no longer holds.
  - path: tasks/agentjobs/task-324.yaml
    why: The sc-6 progress entry and the two finish attempts record the three occurrences
      and the pids.
