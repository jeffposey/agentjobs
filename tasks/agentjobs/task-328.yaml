- id: 8
  ts: '2026-09-04T02:42:28.630366Z'
  actor: claude
  type: decision
  body: "**What a live-but-not-working run renders as, and whether finishes and the\
    \ runway appear.** (ac-5)\n\n**`health`, a new field beside `status`, computed\
    \ in `ledger.run_health()`.** `is_live` only means \"nothing has declared this\
    \ over\", so a surface that renders every live run as *working* is asserting something\
    \ the ledger never said. Every value is read off evidence already on disk \u2014\
    \ nothing new is probed, nothing new is written:\n\n| health | what it is read\
    \ from | rendered as |\n| --- | --- | --- |\n| `working` | `status: running` |\
    \ \"Working\" (green) |\n| `starting` | `status: starting` | \"Starting\" (grey)\
    \ |\n| `parked` | `status: parked` \u2014 the runner writes this when a session\
    \ stops on a permission prompt or an expired login | \"Waiting on you\" (amber)\
    \ |\n| `silent` | `status: stalled` \u2014 the poller writes this after `limits.session_stall_seconds`\
    \ with no transcript growth (task-296) | \"No output\" (amber) |\n| `orphaned`\
    \ | a **batch** run whose recorded pid is gone | \"Process gone\" (red) |\n| `unknown`\
    \ | an unreadable or unrecognised meta | \"Unreadable\" (red) |\n\n**The pid deliberately\
    \ gets no vote on a session run**, which is the trap the spec warned about, and\
    \ the reason is `stale_lock_reason`'s own: a dispatched session outlives the process\
    \ that launched it, so a dead pid is expected rather than diagnostic. Session\
    \ runs record no pid at all today. The authoritative check for one is `session_ledger()`,\
    \ which shells out to the session manager with a 60-second timeout \u2014 unusable\
    \ on a two-second poll, and unnecessary, because **the API server serving this\
    \ page is itself the poller** that writes `parked` and `stalled`. If the page\
    \ renders, the statuses behind it are current.\n\n`stale_lock_reason` cannot detect\
    \ this case and is not used for it. Its first rule is \"if the lock names a run,\
    \ that run's record decides\" \u2014 which returns `None` for every live run,\
    \ by design. It is used for the holders below, where it is exactly right.\n\n\
    **Finishes and the merge runway appear, in their own section, and are not counted\
    \ as occupied slots.** A scripted finish (task-241) and a repository's runway\
    \ (task-223) are real machine activity, both hold locks, and neither has a run\
    \ record \u2014 so during the ~3 minutes a merge takes, a runs-only surface would\
    \ answer \"nothing is happening\". They are read by `ledger.live_lock_holders()`,\
    \ the read-only twin of `release_stale_locks`: same `stale_lock_reason` filter,\
    \ nothing deleted, so a finish whose process is gone is not listed.\n\nThey are\
    \ **excluded from `occupied`** because `occupied` must equal what `dispatch/guards.py`\
    \ counts (`len(live_runs(home))`) or this surface and a refused dispatch could\
    \ disagree about whether the machine is full. A lock is not a run slot. The section\
    \ says so in its own words: *\"They hold locks rather than run slots, so they\
    \ are not in the count above \u2014 but a task cannot be dispatched while one\
    \ holds it, and a repository's merges queue behind its runway.\"*\n\nA dispatch's\
    \ own lock is **not** listed as a holder; it is the run above, and listing both\
    \ would imply the machine is twice as busy as it is.\n"
  data:
    operation:
      id: 5c9d21ee-7b40-4f0a-9d2a-8ab3c4d5e602
      kind: log_append
      fingerprint: b5c1cff1f3a7149815f4ea8f7574109a
- id: 9
  ts: '2026-09-04T02:42:47.494312Z'
  actor: claude
  type: decision
  body: "**Freshness: the runs panel's own clock, not `LiveUpdates` \u2014 and unlike\
    \ that panel, it never stops.** (spec item 4)\n\n`LiveUpdates` (task-086) cannot\
    \ carry this signal, for two independent reasons:\n\n1. **It is project-scoped.**\
    \ It polls one project's revision \u2014 a hash of *that project's* task files\
    \ \u2014 and refetches an allowlist of queries keyed on that project id. A machine-wide\
    \ answer is not covered by any single project's revision, and the run occupying\
    \ the last slot is usually in a project the reader is not looking at.\n2. **The\
    \ signal is wrong even for the right project.** A revision moves on a task write.\
    \ Most of what changes here is not one: a session going quiet, a finish reaching\
    \ its gate, a run's elapsed seconds. A page refetching only on revision changes\
    \ would show \"Running for 3s\" until the run ended \u2014 which is exactly the\
    \ reasoning `useTaskDispatch` already records for the per-task runs list.\n\n\
    So this reuses that existing pattern rather than adding a third: `refetchInterval`\
    \ on the query, 2s while anything is live. No new polling machinery, and no entry\
    \ needed in `PROJECT_TASK_QUERY_IDS`/`NON_TASK_PROJECT_QUERY_IDS` \u2014 the drift\
    \ test enumerates ids containing `ApiProjectsProjectId`, and `listLiveRunsApiRunsLiveGet`\
    \ is deliberately not one.\n\n**One deliberate difference from the per-task panel:\
    \ it never returns `false`.** That panel stops polling when nothing is live, and\
    \ is right to: the only thing that starts a run there is the button beside it,\
    \ which invalidates the query itself. This list has no such guarantee \u2014 the\
    \ next run to appear will be started from another project's page, from the CLI,\
    \ or by an epic walk \u2014 so a badge that had stopped polling would sit at zero\
    \ through all of it. Idle polling is 15s, matched to `LiveUpdates.NORMAL_POLL_MS`,\
    \ so an idle machine costs one extra request on a cadence the app already pays.\n\
    \n**Rejected alternative: extend the revision poller to a machine-level revision.**\
    \ That means a new endpoint hashing the run ledger, a second thing for `LiveUpdates`\
    \ to poll, and a new drift-test category \u2014 more machinery than the `refetchInterval`\
    \ this codebase already uses for exactly this, and it would still poll on a clock\
    \ underneath.\n\n**A cost this exposed, and the fix that came with it.** This\
    \ is the first thing in AgentJobs to read the whole run ledger *on a clock*. `list_runs`\
    \ parses every run directory the machine has ever had \u2014 135 of them here,\
    \ 224 KB, because a dispatch meta carries the full argv including a settings blob\
    \ \u2014 and `read_run` was using `yaml.safe_load`, the pure-Python parser, while\
    \ `storage.load_yaml` has always reached for libyaml. Measured 2026-09-04: **178\
    \ ms \u2192 16.7 ms**, so `live_runs()` goes from ~204 ms to ~33 ms. At the 2s\
    \ busy poll that is 1.6% of a core rather than 10%, and `dispatch/guards.py` gets\
    \ the same saving on every dispatch. Committed separately (`1910f13`) so the perf\
    \ change is reviewable on its own.\n"
  data:
    operation:
      id: 7e2b45aa-9c18-4d33-8b71-5c6d7e8f9a03
      kind: log_append
      fingerprint: 81761c5ab49443ab356cf28c67a0f8be
- id: 10
  ts: '2026-09-04T02:43:10.193775Z'
  actor: claude
  type: decision
  body: "**The Dashboard panel: what it costs, and what paid for it.** (ac-3)\n\n\
    **Shape.** One line at the foot of the *existing* statistics card, beside the\
    \ \"+N in backlog\" link that is already exactly this shape: a status dot, \"\
    2 of 3 slots busy\", then up to two task titles, capped, with \"+N more\" \u2014\
    \ the whole row linking to the Runs tab.\n\n**What paid for it: not adding a card.**\
    \ A sixth top-level section would have cost its own `space-y-6` gap (24px), its\
    \ own border and its own 24px padding before rendering a character \u2014 roughly\
    \ 110px. Measured in Chromium against the sandbox, the row as built is **44px**\
    \ at both 390x844 and 1280x800.\n\n**Nothing was cut, and that is a deliberate\
    \ answer rather than an omission.** task-294 is still `ready` \u2014 the Dashboard\
    \ scrolls today and does not pass its assertion, with or without this row. So\
    \ \"the Dashboard *still* passes\" (ac-3's wording) is not satisfiable as written,\
    \ and cutting one of the existing sections to buy 44px would not have made it\
    \ satisfiable either: it would have removed something on a guess about a layout\
