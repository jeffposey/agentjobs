  type: progress
  body: '**Built and verified on `feat/task-329-principal-resolution` (commit `fa01f54`).**
    Six files, 913 lines added, nothing removed, no existing file''s behaviour changed.


    **What landed.**


    - `src/agentjobs/principals.py` -- the whole model, and pure: `PrincipalKind`
    (`tailnet`/`owner`/`run`, no fourth), `PrincipalSource` (`run_credential`/`proven_header`/`loopback`),
    `Problem` (`no_proven_identity`/`unverified_run_credential`), `Principal`, `Resolution`,
    `RunCredential`, `is_front_door`, `resolve_principal`. It takes a client host
    and a header mapping rather than a `Request`, so the trust rule is readable and
    testable with no transport in the way.

    - `src/agentjobs/api/dependencies.py` -- the adapter: `resolve_request_principal`,
    `get_principal_resolution`, `get_principal`, and `PRINCIPAL_STATE_ATTR`. `request.client.host`
    is the immediate peer -- the socket -- which is the reason a header claiming an
    identity is only believed from the front door.

    - `src/agentjobs/api/main.py` -- one middleware, `resolve_principal_for_request`,
    which stashes the resolution on `request.state` and does nothing else. Middleware
    rather than a route dependency because "every request" is what the epic is built
    on and a dependency list covers routes only.

    - `tests/test_principals.py` -- 34 tests, two layers (pure rule, then the same
    properties over the real app''s middleware stack).

    - `docs/principals-design.md` and a row in `docs/index.md`, marked **partly shipped**
    with a header saying plainly that nothing is enforced and naming the children
    that change that.


    **How it was verified.**


    - `scripts/check.py`, unqualified, in the worktree, from the worktree''s own interpreter:
    **exit 0, "Ran every stage (10 of 10)"**, 324.9s. Log at `C:/Users/jpose/.claude/jobs/0abbd216/tmp/gate-329-b.log`.
    No pre-existing test was modified -- `git show --stat` on the commit lists three
    new files and three appended-to ones, and the two touched source files gained
    only new symbols.

    - The first gate run failed one test, `test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`.
    That is a known flake documented in its own body: "the flake that failed the gate
    for task-308''s finish -- the branch under it touched neither this test nor the
    kill path." Same here. It passed alone in 7.4s and passed in the second full run.
    Named rather than silently re-run.


    **The wiring is proved, not assumed.** The HTTP tests register a probe route on
    the real `app` and assert `middleware_ran is True` -- so a change that removed
    the middleware would fail rather than fall through to the dependency''s own on-the-spot
    resolution.


    **Why ac-4 is safe to claim.** No route reads a principal, no response gained
    a header, no model or schema changed, so `openapi.json` and the generated client
    are untouched (the `api` stage is green, which is what checks that). The `run`
    kind cannot be reached in production at all: the installed verifier is `no_run_credentials`,
    which returns `None` for everything, so precedence rule 1 never fires until task-331
    replaces it.


    **What is deliberately still a stub, for the children.** `actor_id` is `None`
    on every resolved principal (task-330 owns the mapping; a resolved `tailnet` carries
    the raw `login` instead). The verifier verifies nothing (task-331 installs one
    via `set_run_credential_verifier`). The proxy does not set `X-Tailscale-User`
    yet (task-244) -- correct in the meantime, because an absent header simply does
    not resolve `tailnet`.'
