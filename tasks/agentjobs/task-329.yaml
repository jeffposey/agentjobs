- id: 7
  ts: '2026-09-04T03:56:37.673391Z'
  actor: claude
  type: decision
  body: '**The front door is the socket''s peer address, and loopback is where it
    ends.** Binding on task-244 and task-332.


    `is_front_door` parses `request.client.host` and asks whether it is loopback --
    in every spelling, including `::ffff:127.0.0.1`, which a dual-stack socket reports
    for an IPv4 loopback connection and for which `IPv6Address.is_loopback` is False.
    An address that will not parse (`testclient`, a hostname, empty, absent) is **not**
    the front door: "we could not tell where this came from" must never mean "believe
    what it claims about itself".


    **Rejected: reading `X-Forwarded-For` or `X-Real-IP`.** The obvious-looking way
    to know where a request "really" came from, and exactly wrong -- both are set
    by whatever sent the request, so consulting them would undo the rule they appear
    to implement. There is a test that passes a loopback value in those headers from
    a remote peer specifically so that a future change to read them fails.


    **Rejected: a configurable set of trusted origins, now.** A `trusted_proxies:`
    knob would let someone front the app with a proxy on another host. Nobody has
    asked, the proxy in this repository forwards to `127.0.0.1`, and a trust boundary
    with a config knob on it is a trust boundary somebody will widen. The parameter
    exists in the pure function''s signature, so adding it later is a one-line change
    rather than a redesign.


    **The residual, stated so nobody discovers it as a surprise: loopback does not
    separate the proxy from any other local process.** A local process can set `X-Tailscale-User`
    and be believed as `tailnet`. This is bounded and accepted for now on two grounds.
    Both kinds are human, so nothing is escalated by it -- a local process that could
    do this could equally have arrived as `owner`. And the local caller that actually
    matters is a dispatched agent, which precedence rule 1 catches by credential rather
    than by path, which is the whole reason the credential is checked first.


    **Closing that residual needs the proxy to prove it is the proxy** -- a secret
    it holds and a local process does not, presented per request. That is a proxy-side
    change and belongs to task-244, not here. Whoever takes it should tighten `is_front_door`
    rather than add a second concept beside it.'
  data:
    operation:
      id: 3f6a1c22-8b90-4a71-9d18-1c5e77b04332
      kind: log_append
      fingerprint: e0f1f92aa2d0416c5801a0c28bb4f45d
- id: 8
  ts: '2026-09-04T03:56:53.961443Z'
  actor: claude
  type: decision
  body: '**Three shape calls the diff will not explain.** Binding on task-330, task-331
    and task-332.


    **1. A presented run credential that does not verify resolves *nothing*, and never
    falls back to `owner`.** The spec fixed the precedence but not this case. Falling
    through was the tempting reading -- "a bad credential is like no credential" --
    and it is a downgrade attack on the one boundary this epic adds: on loopback,
    any local process could present rubbish and be handed the person''s identity.
    So a rejected credential produces `Problem.UNVERIFIED_RUN_CREDENTIAL` and no principal.
    It is still *resolution*, not refusal -- what a route does about it is task-332''s
    call, and the problem code is deliberately distinct from `NO_PROVEN_IDENTITY`
    so that "someone presented a credential we reject" and "an ordinary unauthenticated
    request" cannot be conflated when that call is made.


    **2. The verifier is a module-level slot with a default that verifies nothing.**
    `no_run_credentials` returns `None` for everything, so `run` is unreachable in
    production and this change is genuinely inert; task-331 installs the real one
    with `set_run_credential_verifier`. **Rejected: defining a credential format now
    and verifying it here.** That is task-331''s work, and half of it landed early
    would be a format nobody had minted against. **Rejected: a FastAPI dependency
    override as the seam** -- the pure resolver has no application to override against,
    and the trust rule is worth more tested without a transport than wired through
    one.


    **3. Middleware, not a route dependency.** `resolve_principal_for_request` runs
    on every request and writes only `request.state.principal_resolution`. A route-level
    dependency covers routes, and "every request" is the sentence the whole account
    system rests on; the SPA and static paths are served by this application too.
    The dependency `get_principal_resolution` still resolves on the spot when nothing
    stashed an answer, so a partially-wired test app gets a real resolution rather
    than a default -- **not** a fallback that hides a missing middleware, which is
    why the HTTP tests assert `middleware_ran is True` separately.


    **Also decided, and smaller: a `tailnet` principal carries the raw `login` and
    leaves `actor_id` as `None`.** Rejected: mapping the login to the configured `default_user`
    here, which would have been one line and would have written an attribution nobody
    configured -- the precise failure `agentjobs.actors` exists to prevent, and task-330''s
    whole subject.'
