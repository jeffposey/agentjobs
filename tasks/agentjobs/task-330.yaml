  type: progress
  body: "**Built and verified on `feat/task-330-identity-registry` (4 commits: f36d0dd,\
    \ 0b546ef, c2e75cc, b3e2167).** This is the only review this work will get, so\
    \ what follows is the whole of it.\n\n## What landed\n\n- **`src/agentjobs/identities.py`\
    \ (new).** The machine-level login map: `IdentityRegistry`, case-insensitive lookup,\
    \ an `owner:` line, and `unmapped_login_help()` \u2014 the refusal message. A\
    \ malformed entry is skipped rather than fatal, because one person's typo must\
    \ not take the dashboard away from everybody else.\n- **`src/agentjobs/actors.py`.**\
    \ `human_identity(config, principal)` \u2014 per request, not per project. `MULTIPLE`\
    \ is gone, replaced by six problem codes (`unconfigured`, `unmapped`, `unknown_actor`,\
    \ `retired`, `ambiguous`, `not_a_person`). `Actor.retired`, `active_humans()`,\
    \ `RetiredActorError`, `PROBLEM_HEADLINES`.\n- **API wiring.** `current_identity`\
    \ takes the principal; the seven review routes, the task detail route, the playbooks\
    \ route, the legacy pages and `GET /api/projects` all pass the request's own.\
    \ The projects listing mattered more than it looks: the React app attributes queue\
    \ reordering with its `default_user` field, so leaving it project-wide would have\
    \ meant two people reordering as one.\n- **Both UIs.** The headline over a refusal\
    \ was `problem === \"multiple\" ? \u2026 : \"No user configured.\"` in two places\
    \ \u2014 exhaustive for two problems, wrong for six. One table per surface plus\
    \ `tests/test_identity_problem_headlines.py`, which fails when either loses a\
    \ code; the drift is silent otherwise because both sides fall back rather than\
    \ erroring.\n- **`docs/identity-registry.md`**, and a correction to `docs/principals-design.md`,\
    \ which promised this task would populate `Principal.actor_id`. It does not and\
    \ should not \u2014 the mapping needs a project's vocabulary and principal resolution\
    \ is deliberately project-agnostic. Left as written it would have sent the next\
    \ reader hunting a field that stays `None`.\n\n## Resolution order, as built\n\
    \n1. A run \u2192 `not_a_person`, first, so nothing downstream can map it to a\
    \ human.\n2. A proven login \u2192 the machine registry. Mapped to a live actor,\
    \ that is the answer.\n3. Otherwise the machine's `owner:`; failing that, a project\
    \ with several active people is refused as `ambiguous`, and a project with at\
    \ most one resolves from `default_user` or from being the only candidate \u2014\
    \ exactly what every caller got before principals existed.\n\n## Verified\n\n\
    **Full unqualified `scripts/check.py`, green, all 10 of 10 stages** (3794 passed,\
    \ 1 skipped; vitest 355; e2e 38; 339s). Log: `$CLAUDE_JOB_DIR/tmp/gate5.log`.\n\
    \nAn earlier full run had one unrelated failure \u2014 `test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`,\
    \ whose own assertion message is \"the grandchild never started, so this proves\
    \ nothing\". It passed alone and passed in the green run; it is load-sensitive,\
    \ not caused by this change.\n\n**Exercised against a live server**, not only\
    \ the suite: a sandbox project on port 8971 with three people (jeff, sam, dana-retired)\
    \ and a real `identities.yaml`. Every path checked by HTTP:\n\n| Request | Result\
    \ |\n|---|---|\n| bare loopback, two active people | `ambiguous`, refused, names\
    \ both |\n| `X-Tailscale-User: jeff@\u2026` | resolves `jeff` |\n| `X-Tailscale-User:\
    \ sam@\u2026` | resolves `sam` |\n| sam approves as `jeff` | 400, \"must be attributed\
    \ to configured user 'sam'\" |\n| sam approves as `sam` | 200 \u2014 **and the\
    \ task file records `actor: sam`** |\n| dana (retired) approves | 400, \"'dana'\
    \ is retired and may no longer act\" |\n| unmapped login | `unmapped`, message\
    \ names the login and the absolute path of the file |\n| retire sam *after* he\
    \ approved | his entries still render; jeff then resolves cleanly on bare loopback\
    \ with no further config |\n| legacy Jinja page, unmapped login | headline reads\
    \ \"Your login is not mapped.\" |\n\nThe retirement case was run in that order\
    \ deliberately \u2014 act, then retire \u2014 because that is the constraint:\
    \ the log is append-only and a person's history must survive their departure.\n\
    \nNote on the first attempt at this: port 8899 was already held by an orphaned\
    \ server from worktree `aj-219` (started 2026-08-23), so the first round of results\
    \ was the wrong process answering. Caught by checking `/api/version`'s `source_root`.\
    \ That process was left alone \u2014 it is not mine and not blocking anything.\n\
    \n## Judgement, the other half of the autonomous gate\n\nNothing found wrong with\
    \ the work. Two things a reader should know rather than discover:\n\n- **`default_user`\
    \ is not consulted when several people can act.** That is task-064's reasoning\
    \ surviving intact, and it is the one place where this task deliberately *refuses*\
    \ rather than resolving. Project config is committed, so it cannot say who is\
    \ at this keyboard.\n- **`default_user` on a project with at most one human is\
    \ still honoured unchecked**, even when it names an id `actors:` never listed.\
    \ Some installs are in that state; `validate_actor` already refuses the write,\
    \ so re-refusing here would break working configs for no gain. Retirement is the\
    \ one thing that still bites on that path."
