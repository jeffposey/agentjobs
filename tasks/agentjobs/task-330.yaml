spec:
  summary: Replace human_identity's MULTIPLE refusal with a registry that maps a proven
    identity to a configured human actor, accepts more than one person, and lets an
    actor be retired without rewriting their history.
  intent: 'This is the original ask of task-066, now buildable because the identity
    model is decided. Today a config naming two people is refused outright, and the
    failure a second person meets is a yellow box telling them to edit YAML. task-064
    chose that refusal deliberately -- attributing an action to the wrong person is
    worse than attributing it to nobody -- and deferred the fix to here.


    The dependency on task-329 is real: a registry that maps identities is useless
    until something establishes an identity to map.'
  description: '## What to build


    1. **Several `kind: human` entries accepted** in project config, replacing the
    MULTIPLE branch in `actors.py`.

    2. **A mapping from proven identity to actor id.** The tailnet login (the `LoginName`
    WhoIs returns) is the key; a configured actor id is the value.

    3. **Retirement.** An actor may stop being able to act while every past log entry
    naming them still resolves and still renders.


    ## Decide and record: where the mapping lives


    It is a genuine fork, so make the call explicitly and write it as a `decision`
    entry with the rejected option:


    - **Machine-level** (`~/.agentjobs/`), on the grounds that the tailnet is a property
    of the machine, not of a project, and the same person has one login across every
    project served here.

    - **Per-project** (`.agentjobs/config.yaml`), on the grounds that the actor vocabulary
    already lives there and splitting identity across two files makes both harder
    to reason about.


    The machine-level option is probably right for the login-to-actor mapping specifically,
    with the actor vocabulary staying per project, but decide it rather than inheriting
    this sentence.


    ## Refusal, not fallback


    An identity that maps to nothing is **refused**, with a message that says how
    to map it. It never falls back to `default_user`. That fallback is precisely the
    defect task-064 existed to remove, and reintroducing it here would undo that task
    while appearing to extend it.


    The refusal message is the whole onboarding experience for a second person, so
    write it as such: name the login that was not recognised, name the file to add
    it to, and show the shape of the entry.'
  constraints: '- The log stays append-only. Retiring a person never rewrites their
    history, and their past entries must keep resolving to a displayable name.

    - No silent fallback to a default identity. An unmapped login is refused.

    - Do not weaken validation: an unknown actor stays refused.

    - Existing single-human configs keep working untouched. Nobody has to edit YAML
    because this landed.'
  out_of_scope: 'Per-person permissions -- capability is per principal kind and belongs
    to task-332. Any UI for managing people; config is the interface for now. Authentication
    itself: the front door proves identity, this only maps it.'
  context:
  - path: src/agentjobs/actors.py
    why: 'human_identity and its MULTIPLE branch: the thing this replaces'
  - path: tests/test_actors.py
    why: The existing behaviour, including the deliberate refusal this task lifts
  - path: tasks/agentjobs/task-064-human-actor-identity.yaml
    why: Why the single-human limit was chosen and what it was protecting; do not
      undo its reasoning
