- id: 5
  ts: '2026-09-04T05:25:53.966918Z'
  actor: claude
  type: decision
  body: "**The login-to-actor mapping lives machine-level, in `~/.agentjobs/identities.yaml`.\
    \ The actor vocabulary stays per project.** (ac-2)\n\n```yaml\n# ~/.agentjobs/identities.yaml\n\
    owner: jeffposey\nidentities:\n  - login: jeff@example.com\n    actor: jeffposey\n\
    ```\n\nChosen for two reasons, only the first of which the spec anticipated. A\
    \ tailnet login is a property of this machine's tailnet, not of any repository,\
    \ so one person has one login across every project served here \u2014 the file\
    \ sits beside `projects.yaml`, and both record what this particular machine has.\
    \ The second reason is the decisive one: **`.agentjobs/config.yaml` is committed\
    \ and travels with a clone.** A login map there publishes the machine's account\
    \ list to everyone who clones the repository, which for a public repo is a real\
    \ disclosure, and it forces the same person to be re-declared in every project\
    \ on the machine \u2014 so adding a second person becomes *n* edits rather than\
    \ one, which is the friction this task exists to remove.\n\n**Rejected: per-project,\
    \ in `.agentjobs/config.yaml` alongside the actor vocabulary.** Its argument is\
    \ good and was weighed: identity split across two files is harder to reason about,\
    \ and the actor ids the mapping points at are already there. It loses on the two\
    \ counts above. What survives of it is that the vocabulary \u2014 who exists,\
    \ their kind, their display name, whether they are retired \u2014 stays per project,\
    \ because who may act on a project is a property of that project and travels with\
    \ it correctly.\n\n**A third question the spec did not name, decided here: which\
    \ of several people is the caller on bare loopback.** They present no login, so\
    \ nothing can be looked up. `owner:` in the same machine file answers it. `default_user`\
    \ deliberately does *not* \u2014 project config is shared, so it cannot say who\
    \ is at *this* keyboard, and honouring it would be exactly task-064's defect.\
    \ With no `owner:` and several people who can act, the request is refused as `ambiguous`.\n\
    \n**Residual, stated rather than designed around:** an entry names one actor id,\
    \ so a person whom two projects call by different ids can only be mapped to one.\
    \ The other project refuses with `unknown_actor`, naming the id and the config\
    \ file. Using the same id is the fix. A per-project alias was considered and rejected\
    \ as speculative generality \u2014 nothing on this machine needs it, and the refusal\
    \ is honest and actionable."
  data:
    operation:
      id: 3d0a1f52-7b41-4c8e-9a2d-1e5c8b330001
      kind: log_append
      fingerprint: 0b62e4ad9b145c91458c28df6eb13b31
