- id: 5
  ts: '2026-09-04T04:58:43.285175Z'
  actor: claude
  type: decision
  body: "The credential is not a secret from the agent holding it, and this is what\
    \ that costs.\n\n**The property this buys is \"an agent cannot claim to be a person\"\
    , not \"an agent cannot misbehave as itself\".** A run reads its own credential\
    \ out of its own environment. Nothing stops it passing that credential to something\
    \ else, printing it, or writing it to a file \u2014 and nothing in this change\
    \ pretends otherwise. What it does buy is that the run *cannot present itself\
    \ as the owner or as a tailnet user*, because those two kinds are established\
    \ by evidence the run does not hold: loopback-with-no-credential, and a header\
    \ the front door proved. Rule 1 is checked first precisely so that presenting\
    \ a credential is not optional cover the agent can drop.\n\nThere is no escalation\
    \ path through the credential: a run principal is strictly less capable than an\
    \ owner once task-332 gives either of them capabilities, so a leaked run credential\
    \ buys its holder less than they had by simply being on loopback. That asymmetry\
    \ is why the residual is acceptable rather than merely tolerated.\n\n**Rejected:\
    \ trying to keep it from the agent.** Every mechanism available \u2014 a file\
    \ the agent can read, an environment variable it can print, a socket it can call\
    \ \u2014 is reachable by a process that already runs arbitrary code as this user.\
    \ A design that claimed otherwise would be a claim nobody could enforce, and building\
    \ on it is the failure task-334 is cleaning up in `agent-dispatch-design.md`,\
    \ which calls the self-dispatch loop \"structurally impossible\" when it is bounded.\
    \ Nothing this task writes repeats that claim; `docs/principals-design.md` states\
    \ the limit in its own section instead.\n\nA later reader who assumes the credential\
    \ is a secret will build something unsound on top of it. That is the sentence\
    \ this entry exists for."
  data:
    operation:
      id: 3f1a5c62-7b40-4e19-9c11-0d8a4e331001
      kind: log_append
      fingerprint: 44f4114cdc4fbd9d6cf1cc129145de1b
- id: 6
  ts: '2026-09-04T04:58:57.490120Z'
  actor: claude
  type: decision
  body: "A run that carries no credential resolves as `owner` \u2014 the pre-existing\
    \ state, not a new hole. (ac-6)\n\nThree cases produce one: a run dispatched before\
    \ this shipped; a Claude `--bg` session whose settings document could not be written;\
    \ a driver added later that cannot carry an environment through to its worker.\
    \ All of them arrive on loopback with no credential, so rule 3 resolves them `owner`,\
    \ exactly as every run on this machine did yesterday.\n\n**Why that is the narrowest\
    \ answer available today, and not merely the easy one.** Nothing is enforced yet\
    \ \u2014 task-332 owns capabilities \u2014 so there is no less-capable principal\
    \ to assign; a fourth kind invented here would be a kind with no meaning, and\
    \ `principals.py`'s \"three kinds and no fourth\" is load-bearing. The alternative\
    \ that *is* narrower is refusing such a run outright, and the constraint forbids\
    \ it: existing dispatch must keep working. So the honest move is to make the case\
    \ **legible** rather than to pretend it is closed \u2014 a session whose credential\
    \ could not be delivered records `session_env: uncredentialed` on its run record,\
    \ distinct from `delivered`, `conflict` and `failed`, so task-332 can read \"\
    this run has no identity\" off the ledger rather than inferring it from silence.\n\
    \n**Rejected: failing the dispatch when the credential cannot be delivered.**\
    \ That trades a bounded identity gap for a lost hour of work, and it is the same\
    \ trade `session_env.deliver_identity` and `phases.record_phase` already refuse.\
    \ Rejected too: putting the credential inline in argv when the file write fails\
    \ \u2014 argv is recorded verbatim into `meta.yaml` *and* into this task's own\
    \ dispatch log entry, so that would breach the constraint to satisfy a nice-to-have.\n\
    \nExisting dispatch is otherwise untouched: batch and Codex App Server runs get\
    \ the credential straight from the process environment (their worker *is* the\
    \ process spawned), and the `--bg` launcher deliberately does **not** get one\
    \ \u2014 when a launch starts the Claude daemon, the daemon inherits the launcher's\
    \ environment and hands it to every session it spawns afterwards (task-249). A\
    \ stale run id mislabels a phase record; a stale credential would make one run's\
    \ sessions speak as another's."
  data:
    operation:
      id: 3f1a5c62-7b40-4e19-9c11-0d8a4e331002
      kind: log_append
      fingerprint: b6090b944fd355777be4df651c859e0a
- id: 7
  ts: '2026-09-04T04:59:25.864999Z'
  actor: claude
  type: progress
  body: "Built and verified on `feat/task-331-run-credential` (3 commits: e670b33\
    \ source, d10a5aa tests, 9c61637 docs).\n\n## What landed\n\n**`src/agentjobs/dispatch/credentials.py`**\
    \ \u2014 new. Mints `<run_id>.<nonce>` (`secrets.token_urlsafe(32)`, 256 bits)\
    \ when the ledger starts a run, writes only the SHA-256 digest to `<run_dir>/credential.sha256`\
    \ at 0600, and verifies a presented token against that digest plus the run's status.\
    \ The run id travels in the clear so verification is one directory read rather\
    \ than a scan of every run the machine has had; a `\\Arun_[0-9a-f]{8,}\\Z` check\
    \ runs before the id is ever used as a path segment, because it arrives in a request\
    \ header. Comparison is `secrets.compare_digest`. Minting never raises: an unwritable\
    \ digest returns `\"\"`, and a run with no credential is the case ac-6's decision\
    \ covers.\n\n**`principals.py`** \u2014 additive only. New `Refusal` dataclass\
    \ and `Problem.EXPIRED_RUN_CREDENTIAL`; `RunCredentialVerifier` widened to `Union[RunCredential,\
    \ Refusal, None]`, which every existing `Optional[RunCredential]` verifier still\
    \ satisfies by return-type covariance, so task-329's tests and fakes needed no\
    \ change. `resolve_principal` returns the refusal's own problem and sentence.\
    \ Neither way of saying no falls through to `owner`.\n\n**Delivery.** `session_env.deliver_identity`\
    \ takes a `credential`, and a credential present moves the settings document out\
    \ of argv and into the 0600 file it already writes for a runner's `env:`. That\
    \ is not cosmetic: argv is recorded verbatim into `meta.yaml` **and** into this\
    \ task's own dispatch log entry (entry 4 above), so inline would have breached\
    \ the constraint directly. The redacted document still goes to `meta.yaml`, so\
    \ the permission envelope stays as auditable as it was. A file write that fails\
    \ drops the credential and keeps the run id, recorded as the new `Delivery.UNCREDENTIALED`.\n\
    \n**Spawn paths.** Batch and Codex App Server get the credential straight from\
    \ `_environment` \u2014 their worker *is* the process spawned. The `--bg` launcher\
    \ deliberately does not (see ac-6 decision). `_environment` now pops `AGENTJOBS_RUN_CREDENTIAL`\
    \ unconditionally before granting one, so a supervisor dispatching a child cannot\
    \ leak its own.\n\n**Expiry.** `verify_run_credential` reads the run record and\
    \ refuses anything not `is_live`. Both writes that can end a run \u2014 `RunDirectory.update_meta`\
    \ and `ledger.write_status` \u2014 also delete the digest, so the status check\
    \ and the revocation are belt and braces rather than one mechanism.\n\n**Recognition.**\
    \ `api/main.py` installs the verifier at import, over `no_run_credentials`. `TaskClient`\
    \ attaches `X-AgentJobs-Run` from this process's environment when there is one\
    \ and nothing when there is not \u2014 which is what keeps the dashboard, the\
    \ CLI and the suite the owner. New `GET /api/whoami` reports the resolved principal\
    \ and enforces nothing; it never echoes the credential, and a run's `actor_id`\
    \ is always null.\n\n**Scrubbing.** `scripts/check.py`'s `RUN_VARS`, `contexteval/runner.py`,\
    \ and a conftest fixture all drop the credential, so nothing inherits a live one\
    \ and reports the ambient environment as its own state.\n\n## Verification\n\n\
    `scripts/check.py`, unqualified, **exit 0, all 10 stages, 470s** in `../worktrees/agentjobs-331`\
    \ (log: `$CLAUDE_JOB_DIR/tmp/gate4.log`). Contention was normal \u2014 several\
    \ agents on this machine.\n\n`tests/test_run_credentials.py` is 42 tests in three\
    \ layers. The one worth reading is `TestAgainstARealDispatchedRun`: it starts\
    \ uvicorn on an ephemeral port, `POST`s a real dispatch through the API, and the\
    \ dispatched process asks `/api/whoami` through the ordinary `TaskClient` using\
    \ the credential it found in its own environment. That answers ac-1 as written\
    \ \u2014 a synthesised header proves the resolver and proves nothing about delivery.\
    \ **It was checked against the defect**: with `mint_run_credential` stubbed to\
    \ return `\"\"`, that test fails `assert 'owner' == 'run'`, which is exactly auditor\
    \ 10's P1-2 finding. The same test greps every artefact the run left \u2014 task\
    \ YAML, `meta.yaml`, stdout, stderr, phase records \u2014 for the exact token\
    \ the process held, and finds it nowhere (ac-4).\n\nTwo pre-existing tests needed\
    \ updating rather than working around: `test_the_default_verifier_verifies_nothing\u2026\
    ` now asserts a property of the *default* rather than of production, and `test_dispatch_runner.py`\
    \ grew a `settings_document` helper that reads the `--settings` value inline or\
    \ by path. One unrelated flake appeared under three-way gate contention (`TestProcessGroup::test_the_timeout_kills_the_grandchild_too`,\
    \ \"the grandchild never started\") and did not recur in the green run or in a\
    \ focused rerun.\n\n## Not done, deliberately\n\nEnforcement. No route reads the\
    \ principal to decide anything, and every caller gets exactly the response it\
    \ got before \u2014 that is task-332. Nothing here repeats `agent-dispatch-design.md`'s\
    \ \"structurally impossible\" claim; task-334 owns that prose."
