    \ dependency is on the solved dependant of every `APIRoute`, not merely declared\
    \ on the app.\n\n**ac-2** -- `tests/test_capabilities.py` covers the rule; `tests/test_identity_registry_api.py::TestNobodyDispatchesInSomebodyElsesName`\
