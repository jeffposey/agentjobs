    \ rather than a 403. Both refusal messages carry the claimed id and the resolved\
    \ one.\n\n**ac-3** -- `tests/test_run_authorization.py`, done the way the audit\
    \ did it. Every request holds a **real credential minted by `mint_run_credential`\
    \ for a real run directory**, presented on the real header, over HTTP: approve\
    \ \u2192 `capability_denied`; dispatch \u2192 `capability_denied`; enable *and*\
    \ disable dispatch \u2192 `capability_denied`; project register *and* init \u2192\
    \ `capability_denied`; queue repair \u2192 `capability_denied`; webhook create\
    \ \u2192 `capability_denied`; five separate verbs against another task (claim,\
    \ log, close, handoff, queue-move) plus a PATCH \u2192 `wrong_task`, each naming\
    \ both task ids; another run's transcript \u2192 `wrong_run`. Writing as a person\
    \ \u2192 `actor_mismatch`; writing as `codex` while dispatched as `claude` \u2192\
    \ `actor_mismatch`.\n\n**ac-4** -- two throwaway sandboxes on their own ports,\
    \ then stopped; the live 8876 dashboard was never touched and is still answering.\n\
    - `review_panel_sandbox.py` on **8891**: clicked **Approve** on task-101 in Chrome.\
    \ Record: `Approved by Jeff Posey through the web UI`, ball `agent`/`work`. Then\
    \ the **keyboard queue reorder** (Alt+\u2193 on a focused row): task-102's `queue_position`\
    \ went 200 \u2192 350, below task-103.\n- `dispatch_posture_sandbox.py` on **8892**:\
    \ clicked **Dispatch**, which started `run_19e26786` and moved the task to *In\
    \ progress (claude)*. Then **New Instructions** with typed text: recorded as `New\
    \ instructions from Jeff Posey`, ball `agent`/`redirect`.\n- The same file's `TestAnOwnerLosesNothing`\
    \ re-runs every refused request without the credential and asserts none of them\
    \ is a 403.\n\n**ac-5** -- on 8892 the structured **Output** panel rendered the\
    \ run's transcript inline, *Show raw terminal* present. From the page's own context:\
    \ `GET .../runs/run_19e26786/output` \u2192 **200**, 1731 bytes; `/tail` \u2192\
    \ **200**.\n\n**On the gestures.** Every browser click above was proved to land\
    \ before anything was concluded from it -- a capturing `mousedown`/`click` probe\
    \ reported `isTrusted: true` on the Approve button, and each action was then confirmed\
    \ against the task record over the API rather than against a screenshot. One screenshot\
    \ after a click showed no change and the note box *was* present in the DOM; that\
    \ was the harness painting late, not a defect.\n\n## Two behaviour changes a reader\
    \ should know about\n\n- `POST /tasks/{id}/approve` with another person's `user`\
    \ now answers **403 `actor_mismatch`** where it answered 400. Two assertions in\
    \ `test_identity_registry_api.py` were updated with the reason: acting as another\
    \ person is a refusal of the caller, not a malformed request.\n- A request that\
    \ resolves to **no principal** is refused on every mutating route. In practice\
