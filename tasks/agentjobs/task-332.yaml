    \ corrected -- three of them still said nothing was enforced.\n\n## Evidence\n\
    \n**Gate: green, unqualified, all ten stages.** `poetry run python scripts/check.py`\
    \ on `b757d245`, 341.6s, receipt written. 3,918 tests.\n\n**ac-1** -- `tests/test_authorization.py`\
