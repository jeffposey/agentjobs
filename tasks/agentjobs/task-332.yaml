    \ What this deliberately does not do\n\nStated at the foot of `docs/authorization.md`\
    \ so nobody reads the table as more than it is: it is **not authentication**;\
    \ **reads are untouched** (task-333); an **uncredentialed run still resolves `owner`**\
    \ and holds everything an owner does; and a run holds its own credential and can\
    \ pass it on. The property bought is \"an agent cannot claim to be a person\"\
    , not \"an agent cannot misbehave as itself\"."
