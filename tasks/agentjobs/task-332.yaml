- id: 5
  ts: '2026-09-04T06:28:41.274094Z'
  actor: claude
  type: decision
  body: 'Design settled before writing code. Worktree ../worktrees/agentjobs-332 on
    feat/task-332-capability-authorization, bootstrapped.


    **Where the check goes: one app-level FastAPI dependency, keyed on the endpoint
    function.**

    Rejected: a per-route `Depends(...)` on each of the ~40 mutating routes (that
    is exactly the "checking the ones that came to mind" the constraint forbids),
    and middleware (it runs before routing, so it has no path params and no matched
    endpoint). An app-level dependency runs after matching, so `request.scope["endpoint"]`
    and `request.path_params` are both populated. Keying the table on the endpoint
    *function* rather than on the path is not cosmetic: every API router is mounted
    twice, unscoped at `/api` and again at `/api/projects/{project_id}`, so a path-keyed
    table would need each entry twice and could silently cover only one of them.


    **Enumeration is enforced, not promised.** `capabilities.py` holds the table;
    a test walks `app.routes`, filters the mutating methods, and fails on any endpoint
    the table does not name. A route added without a decision about it turns the suite
    red rather than shipping unchecked. Reads are not in the table by default (task-333
    owns project exposure); the two run/finish output routes are the exception, because
    ac-5 asks for them identity-gated rather than denied.


    **The table, keyed by principal kind.** owner and tailnet: everything, unscoped
    -- no human loses anything. run: TASK_CREATE, and TASK_EDIT / TASK_VERB / TASK_QUEUE
    / RUN_OUTPUT scoped to its own task and its own run. Denied to a run: TASK_REVIEW,
    DISPATCH, DISPATCH_ADMIN, PROJECT_ADMIN, QUEUE_ADMIN, WEBHOOK_ADMIN.


    Two judgement calls inside that, recorded because the spec does not settle them:

    - **Queue moves are task-scoped for a run**, so a run may reorder its own task
    and not somebody else''s. ALLAGENTS.md tells an agent that disagrees with the
    order to move it, which argued for leaving queue moves unscoped -- rejected, because
    that instruction is aimed at a session *choosing* what to work on next, and a
    dispatched run is given its task rather than choosing it. The spec''s scope clause
    ("a run that may close any task can still close somebody else''s") applies to
    a move for the same reason.

    - **Creating a task is allowed to a run**, unscoped -- it is in neither of the
    spec''s lists, agents file follow-up tasks as a matter of course, and a new task
    is not "a task other than its own".


    **Agreement (ac-2) is checked on the axis a principal can lie about.** A run:
    the claimed actor must be the agent id the run was dispatched as, and never a
    `kind: human` id. A human principal: a claimed *human* id must equal the one the
    principal resolves to, while a claimed *agent* id is allowed -- the CLI and MCP
    running as the person at the machine legitimately attribute their writes to the
    tool, and an agent-attributed entry is strictly less powerful (it cannot clock
    a dispatch). Refusing that would have broken every local agent write for no gain
    in the property being protected.


    **Blast radius checked before committing to it.** The CLI never speaks HTTP (it
    drives the manager directly), so `agentjobs dispatch walk`, the poller, the finisher
    and `agentjobs queue` are all untouched. The only HTTP callers are the React app
    (owner/tailnet) and the MCP server, whose `TaskClient` already presents the run
    credential since task-331 -- so a dispatched agent''s MCP tools become capability-checked,
    which is the point.


    **One test-harness consequence, stated because it looks like a cheat and is not.**
    Starlette''s `TestClient` defaults its peer to the literal host `"testclient"`,
    which is not an IP address, so `is_front_door` correctly says no and *no principal
    resolves at all* -- every mutating route in the suite would 403. The app is only
    ever served on loopback, so a conftest fixture defaults the test peer to 127.0.0.1;
    tests that name their own peer (the identity-registry ones) keep it, and the new
    capability tests all name theirs explicitly.'
