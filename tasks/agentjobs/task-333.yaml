- id: 8
  ts: '2026-09-04T08:23:49.662223Z'
  actor: claude
  type: progress
  body: 'BUILT AND VERIFIED. Branch `feat/task-333-project-exposure`, rebased onto
    main at 9a20bd5, three commits: afed4b0 (the feature), ef1b880 (a flaky test in
    the merge path), e7c117c (the front-door correction).


    WHAT SHIPPED


    `src/agentjobs/exposure.py` is the rule, pure and transport-free like `capabilities.py`:
    a project''s `visibility` (`shared` by default, `local` to hide it), read from
    the project''s own `.agentjobs/config.yaml`, and a predicate saying whether a
    principal may read it. `local` admits `owner` and `run` and excludes `tailnet`.
    Enforcement is in `api/dependencies.py`.


    The leverage is that `request_project` is the single place every project-scoped
    route resolves its project, and every router is mounted twice behind it -- so
    one check makes a hidden project''s tasks, runs, transcripts, webhooks, searches
    and queue absent together rather than one route at a time. On top of that: `/api/projects`
    and `/api/all/tasks` and `/api/runs/live` filter by the asking principal, `_owned_run`
    states the exposure check itself rather than inheriting it, and the legacy Jinja
    project switcher and picker list only visible projects.


    The 404 is built in one function, `_no_such_project`, and it draws its `Registered
    projects: ...` list from the CALLER''S visible set. The registry''s own sentence
    names every registered id, so reusing it would have disclosed the hidden projects
    through the response that is hiding them. That was the one non-obvious hole in
    the first draft.


    Also brought the run `tail` and `transcript` routes under task-332''s capability
    table. They are the same output read two other ways and were the only run-output
    routes with no principal check at all, so `a run may read its own transcript and
    no other''s` was true of the route nobody polls and false of the two the page
    polls. `tests/test_authorization.py` now derives its read exemptions from the
    application instead of carrying a hardcoded list that would have gone stale silently.


    DEPLOYED, not just implemented. `visibility: local` is committed into `C:/projects/product-strategy/.agentjobs/config.yaml`
    (ab15c33) and `C:/projects/job-hunting/.agentjobs/config.yaml` (6e99c3a). Neither
    was pushed. The constraint asked for the setting to be explicit in config rather
    than a hardcoded list of names, and this is the half of that which actually hides
    anything on this machine.


    VERIFIED


    `tests/test_project_exposure.py`, 38 tests, all over HTTP from two sockets that
    differ only in what they present -- the way the audit established the finding.
    Refusals asserted as absent rather than forbidden, and the hidden-project 404
    asserted byte-for-byte equal to the unknown-id one. A `SECRET` string is written
    into the hidden project''s task title and into its run transcript, so the assertions
    are on the bytes rather than on status codes.


    Proved the tests are not decoration: with `readable_by` stubbed to `return True`,
    15 of them fail and 19 pass -- and the 19 are exactly the owner-loses-nothing
    and exposed-project-untouched ones, which is the right split.


    Full unqualified `scripts/check.py`: green, all ten stages, 324s, receipt written
    for e7c117c9.


    WHAT IS NOT DONE HERE


    ac-5''s browser half. The suite covers its server half -- a tailnet principal
    reading an exposed project''s structured transcript still gets rendered entries
    rather than an empty panel -- but the panel itself in a phone browser over the
    tailnet is a post-merge check, since the running dashboard on 8876 is still on
    pre-merge code. Doing it immediately after the finish.'
