- id: 5
  ts: '2026-09-04T07:39:59.547544Z'
  actor: claude
  type: decision
  body: 'NAME AND SCOPE OF THE SETTING (ac-6).


    Chosen: `visibility`, a top-level key in the *project''s own* `.agentjobs/config.yaml`,
    with two values -- `shared` (the default) and `local`.


    Rejected: `expose_on_proxy`, the audit''s name. It names the wrong thing. The
    control is about which *principals* may read the project; the proxy is merely
    today''s only way for a non-local one to arrive. A second front door -- another
    proxy, a LAN bind, an authenticated public endpoint -- would make a proxy-shaped
    name read as a lie while the code carried on working correctly, which is the worst
    kind of wrong name because nothing fails. `visibility` is a property of the thing
    being read, which is what this is.


    Also rejected: `remote_readable: true|false`. Boolean, so it cannot grow a third
    answer, and `remote` is still a transport word.


    Scope, decided the same way:


    1. Per project and per principal KIND, never per person. Per-person visibility
    is out of scope for the whole of task-066 and would turn a setting into a role
    system.

    2. In the PROJECT''s config, not the machine registry. Local-only is a property
    of the project -- `vault` is local-only wherever it is checked out -- so the setting
    travels with the repository and is stated once rather than once per machine. The
    registry stays a disposable list of what this machine has cloned.

    3. `local` admits `owner` AND `run`, and excludes only `tailnet`. A dispatched
    agent runs here with the project''s files on its filesystem; refusing it over
    HTTP would stop nothing and would break a run dispatched *into* a local-only project
    from reading its own task. The axis is where the caller is, not how much it is
    trusted.

    4. The default is `shared`, and that is deliberate rather than lazy. Defaulting
    closed would take every existing install''s phone away at upgrade, silently, with
    no error naming the cause -- and a change with that shape gets reverted rather
    than configured. The line this task holds is that exposed projects keep working.
    Safety is carried instead by `visibility_of` FAILING CLOSED: a key that is present
    and unreadable means `local`, because the only way to write an unrecognised value
    is to have been trying to say something about exposure and mistyped it. Hiding
    on a typo is one edit to recover; publishing on one is not. `agentjobs init` writes
    the key explicitly, so a new project records a decision rather than inheriting
    a default.'
  data: {}
- id: 6
  ts: '2026-09-04T07:40:13.390486Z'
  actor: claude
  type: decision
  body: 'TWO SCOPE CALLS, ONE IN AND ONE OUT.


    IN: the run TAIL and TRANSCRIPT routes were added to task-332''s capability table
    (`ROUTE_CAPABILITIES`, `Capability.RUN_OUTPUT`). They were the only run-output
    routes with no principal check of any kind, so a dispatched run could read another
    run''s transcript over HTTP while being refused the same bytes through `/output`.
    That is the same class of hole as the one task-332 closed, on the route this task
    exists to protect, and it is two lines. Rejected leaving it to a follow-up task:
    the inconsistency would have shipped inside the change whose whole subject is
    that route.


    While there, `tests/test_authorization.py` stopped carrying a hardcoded set of
    exempt read endpoints and now derives them from the application, so renaming one
    of *those* is caught too. The old list would have gone stale silently, which is
    the exact failure that test exists to prevent.


    OUT: the proxy is untouched, as `out_of_scope` says (task-244). This is worth
    stating plainly because it bounds what shipped: `scripts/tailscale-service-host/main.go`
    uses a bare `httputil.NewSingleHostReverseProxy` and sets NO identity header (verified
    by reading it, 2026-09-04). So a phone reaching this machine through the tsnet
    proxy today arrives on loopback with no header and resolves as `owner` -- which
    means it still sees every project. The mechanism here is complete, enforced and
    tested end to end against a `tailnet` principal; it does not bite for a real phone
    until task-244 makes the proxy say who is asking. Nobody should read this task
    as ''product-strategy is now hidden from the phone''. What is true is ''product-strategy
    is now hidden from a tailnet principal, and task-244 is what makes the phone one''.'
