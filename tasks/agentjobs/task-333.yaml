- id: 7
  ts: '2026-09-04T08:23:28.899007Z'
  actor: claude
  type: decision
  body: 'CORRECTION to the previous entry, 2026-09-04. Its last paragraph said the
    proxy sets no identity header, so a phone would still resolve as `owner` and see
    everything until task-244. That was true when I read `scripts/tailscale-service-host/main.go`
    at the start of this run and is now false: **task-244 merged to main while this
    branch was open** (commits 5fe9e44, 9ff4088). The proxy now runs `WhoIs` on the
    tailnet connection, sets `X-Tailscale-User`, strips any copy the caller sent,
    and proves it is the proxy with a shared secret in `x-agentjobs-front-door`. So
    this control is live for a real phone rather than waiting on anything.


    That correction had teeth beyond the prose. Task-244 also changed what a `tailnet`
    caller *is*: `is_front_door` now requires loopback AND the matching secret, so
    the suite''s `remote()` client -- loopback plus an identity header -- had stopped
    resolving to a `tailnet` principal and was resolving to nobody. Every refusal
    this suite asserts is also produced by an unresolved caller, so all 36 tests would
    have gone on passing while proving nothing about the case they are named for.
    Found on the rebase, fixed in e7c117c: the client presents the secret too, and
    one new test asserts each client resolves to the kind it claims. This is why the
    rebase-before-handoff rule earns its keep -- the conflict was one import line,
    and the thing it dragged in was the test suite''s premise.


    The order the two landed in is now recorded in docs/exposure.md, because it is
    the difference between a control that works and one that is only written down.'
