- id: 7
  ts: '2026-09-04T04:27:50.072174Z'
  actor: claude
  type: decision
  body: "Four decisions, each with what was rejected.\n\n**1. `limits.auto:` keeps\
    \ its name, and so does `AutoDispatchLimits`.** The name is now wrong \u2014 those\
    \ caps bind every trigger \u2014 and it stays anyway. Rejected: renaming the key\
    \ to `limits.per_task`, with or without a legacy fallback. The block lives in\
    \ machine-local `~/.agentjobs/dispatch.yaml`, which nothing in AgentJobs writes\
    \ and nothing migrates. A rename would silently return a machine whose caps had\
    \ been tuned to the code defaults, which is the one direction a cap must never\
    \ move by accident, and the constraint on this task says caps do not get lowered\
    \ here. The cost is paid in words instead: the dataclass docstring, `scaffold.py`'s\
    \ example, the design's \xA77 table and `check_budget`'s docstring all say the\
    \ name is historical and why.\n\n**2. The check goes in `dispatch_task`, not in\
    \ each caller.** Rejected: adding `check_budget` to the three call sites (`auto.py`,\
    \ the HTTP route, `epic`). That is precisely the shape the bug had \u2014 a rule\
    \ enforced in three places is enforced in two as soon as someone adds a fourth\
    \ trigger, which is the argument `guards.py` already makes about `assert_human_clocked`.\
    \ One consequence: the caps are now a `raise` rather than a return value, so `auto.py`\
    \ catches `BudgetCapError` and rebuilds the outcome it used to build directly.\
    \ `AutoDispatchOutcome.reason` and `.detail` are unchanged, deliberately, so nothing\
    \ downstream branches differently.\n\n**3. Ordering: after the live-run and concurrency\
    \ checks, before the dirty-tree check.** Rejected: putting the free per-task check\
    \ first, which \"cheapest first\" would suggest. Two things beat it. A task whose\
    \ run is still live is one dispatch old by construction, so the cooldown fires\
    \ and reports a 60-second timer where the true answer is \"that run has not finished\"\
    . And a cap refusal writes to the task record and commits it, which is the wrong\
    \ thing to do to a task whose only problem is that the machine is busy \u2014\
    \ that refusal is about the machine, not the task. The budget check still precedes\
    \ the dirty-tree check, which shells out to git.\n\n**4. `guards.live_runs` is\
    \ left alone; the hourly count gets its own read.** Rejected: replacing `guards.live_runs`\
    \ with `ledger.live_runs` and deriving both answers from one scan, which the `guards.live_runs`\
    \ docstring itself invites (\"when task-072 lands this should call it\"). It would\
    \ have been faster \u2014 guards' copy uses `yaml.safe_load` at 178 ms against\
    \ the ledger's `load_yaml` at 16.7 ms on this machine's 137 runs \u2014 but the\
    \ two readers disagree about a directory with no `meta.yaml` at all: guards skips\
    \ it, the ledger returns it as status `unknown`, which is live, which would block\
    \ dispatch. Trading a correctness change into a task about caps is how a cap lands\
    \ with a side effect nobody looked for. The new count reads through the ledger\
    \ and costs one extra scan of about 17 ms, against a process this decides whether\
    \ to spawn. Worth reopening as its own task, with the empty-directory question\
    \ answered first."
