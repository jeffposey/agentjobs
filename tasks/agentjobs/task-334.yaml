- id: 5
  ts: '2026-09-04T04:26:59.892522Z'
  actor: claude
  type: progress
  body: "Built on `feat/task-334-dispatch-caps` (commit 7893b73, rebased onto main\
    \ at 134066e). Full unqualified `scripts/check.py` green, all 10 of 10 stages,\
    \ 365s (2026-09-04); the dispatch suite re-run after the rebase, 213 passed.\n\
    \n## What was built\n\n**1. The caps moved to a chokepoint and now bind every\
    \ trigger.** New module `src/agentjobs/dispatch/budget.py` holds `check_budget`,\
    \ `check_machine_budget`, `record_cap_refusal` and `CapRefusal`. They are called\
    \ from `guards.dispatch_task` \u2014 the one place manual, auto and epic-child\
    \ dispatch all pass through \u2014 rather than from `auto.py`, which applied them\
    \ to `DispatchTrigger.AUTO` alone. A refused dispatch raises `BudgetCapError`,\
    \ whose `reason` is the cap's own code. `auto.py` re-exports the names and catches\
    \ the exception, so `AutoDispatchOutcome.reason` and `.detail` are byte-for-byte\
    \ what they were: no caller of `maybe_auto_dispatch` has to know the check moved.\n\
    \nPlaced after the live-run and concurrency checks, not before them. Both of those\
    \ name a sharper cause: a task whose run is still live is one dispatch old by\
    \ construction, so the cooldown would fire and report a timer where the real answer\
    \ is \"that run has not finished\", and a cap refusal writes to the task record,\
    \ which is not a thing to do to a task whose only problem is that the machine\
    \ is busy.\n\n**2. `limits.dispatches_per_hour`, machine-wide, default 30.** Counts\
    \ run directories with a `started_at` inside a rolling hour, read through `ledger.list_runs`\
    \ \u2014 one directory per dispatch, across every project, task and trigger. This\
    \ is the count no per-task cap can stand in for: N tasks each at their own limit\
    \ have no ceiling between them, and `max_concurrent_runs` bounds what is *alive*\
    \ rather than what takes off, so a loop that starts a run, fails it and starts\
    \ another never holds a slot long enough to be refused by it. A run whose metadata\
    \ has no readable `started_at` is not counted, so one corrupt file cannot refuse\
    \ dispatches.\n\n**3. A tripped cap says so on the record, for every trigger.**\
    \ The note names the limit, its value and the trigger (`dispatch_refused`, `dispatch_trigger`,\
    \ `dispatch_count` in `data`), and is written by the reserved `dispatcher` actor.\
    \ An HTTP refusal is read once by whoever is holding the mouse; the record is\
    \ what the next session reads. A *count* cap still parks the task with a human\
    \ \u2014 except on `manual`, where a person is reading the refusal in the same\
    \ second and taking their ball away would be the tool responding to a click by\
    \ changing the thing clicked on. The transient caps (cooldown, hourly) never park.\n\
    \n**4. API rendering.** `per_task_per_day`, `per_task_lifetime`, `cooldown` and\
    \ `machine_per_hour` are added to `_DISPATCH_STATUS` as 409s (none is a rule retrying\
    \ can never satisfy) and to `_DISPATCH_ACTION` with the file and key to change.\n\
    \n**5. Prose corrected.** Design section 2's \"structurally impossible\", the\
    \ `guards.py` docstring's \"not representable\", the section-2 sentence \"agents\
    \ do not have browsers\", the epic-walk restatement at \xA74, `epic.py`'s copy\
    \ of it, the two refusal messages inside `guards.py`, and `tests/test_auto_dispatch.py`'s\
    \ \"the caps are a backstop\". Each now says the loop is **bounded, not impossible**,\
    \ and names where the bound lives. D3 in \xA711 carries its reversal; \xA77's\
    \ tables and the config examples in the design and `scaffold.py` are rewritten.\
    \ No new claim of impossibility replaces any of them.\n\n## The number, and the\
    \ epic-walk assumption (ac-3)\n\nMeasured from this machine's own run ledger on\
    \ 2026-09-04: **137 runs, and the busiest rolling 60-minute window in the whole\
    \ history contained twelve dispatches** (ending 2026-08-22 22:26 UTC), at `max_concurrent_runs:\
    \ 3`. Thirty is 2.5x that. Stated as an assumption rather than a guarantee: an\
    \ epic walk would have to turn a run over every six minutes on all three slots\
    \ to reach thirty, and no real run here has been that short (`run_timeout_seconds`\
    \ is 5400), while a dispatch loop reaches thirty in seconds. That gap is the design\
    \ of the number \u2014 a cap that fires on real work is one somebody raises to\
    \ infinity. `test_the_default_leaves_room_for_the_epic_walks_this_machine_runs`\
    \ pins it at 18 recent runs, half again the observed peak, and asserts the dispatch\
    \ still takes off.\n\nNo existing cap was lowered. This machine's values are unchanged:\
    \ `max_concurrent_runs: 3`, `run_timeout_seconds: 5400`, `limits.auto` at 3/10/60s.\
    \ `dispatches_per_hour` is absent from `~/.agentjobs/dispatch.yaml`, so the machine\
    \ takes the 30 default; nothing needs editing for it to apply.\n\n## Tests\n\n\
    `tests/test_dispatch_guards.py` \u2014 `TestBudgetCapsBindEveryTrigger` (manual\
    \ over the lifetime cap; manual inside the cooldown, which is the case a forged\
    \ click used to walk straight through; the record naming cap + trigger; and a\
    \ control that a task under every cap still dispatches) and `TestTheMachineWideHourlyCap`\
    \ (refuses when full; a rolling hour rather than a clock hour; records the refusal;\
    \ the default leaves epic-walk headroom; an unreadable run is not counted). `tests/test_dispatch_epic.py`\
    \ \u2014 `test_a_child_over_the_lifetime_cap_is_refused_by_the_budget`, which\
    \ also asserts a child *is* parked because nobody is watching a walk. `tests/test_auto_dispatch.py`\
    \ \u2014 `TestManualDispatchIsNotCapped` inverted into `TestManualDispatchIsCappedToo`,\
    \ two cases, through the HTTP endpoint.\n\nOne unrelated flake seen on the first\
    \ gate run: `test_dispatch_runner.py::TestProcessGroup::test_the_timeout_kills_the_grandchild_too`\
    \ failed with \"the grandchild never started, so this proves nothing\" \u2014\
    \ a six-second wall-clock race spawning two Python processes against a 3s runner\
    \ timeout, under xdist on a contended machine. Passes in isolation and passed\
    \ on both subsequent full runs. Nothing in this diff touches the runner or process\
    \ spawning."
