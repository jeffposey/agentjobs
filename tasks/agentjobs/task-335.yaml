spec:
  summary: Mapping a tailnet login to an actor id means hand-editing ~/.agentjobs/identities.yaml,
    which is what the refusal card tells a new person to do. Add `agentjobs identity`
    subcommands that write that file safely, list it, and say who the caller resolves
    to.
  intent: 'task-330 shipped the machine-level identity registry and deliberately left
    config as the interface. The first real onboarding (2026-09-05) showed the gap:
    the owner opened the dashboard on a phone, was refused with the unmapped-login
    card, and had to have an agent write the YAML for him. That is fine for one person
    once and wrong as the product''s answer. The fix is a small CLI over the same
    file, not an account system: authentication stays Tailscale membership plus WhoIs,
    AgentJobs stores no credentials, and the mapping is the whole of what a person
    needs. CLI only for writes, by decision; the dashboard gets a read-only ''signed
    in as'' indicator and nothing that writes the map.'
  description: 'Add an `agentjobs identity` command group in src/agentjobs/cli.py,
    backed by a write path in src/agentjobs/identities.py (the module is read-only
    today).


    Subcommands:


    - `agentjobs identity list` -- print owner and every login -> actor mapping, and
    for each actor id say which registered projects define it and which do not (the
    unknown_actor case), so a mapping that will be refused on some project is visible
    before anyone hits it.

    - `agentjobs identity map <login> <actor>` -- add or replace the mapping for a
    login. Refuse when <actor> is not a `kind: human` actor in at least one registered
    project, naming the projects that do define humans. Refuse when the actor is retired
    everywhere. Case-insensitive on login, matching IdentityRegistry.resolve. `--owner`
    sets `owner:` to the same actor id in the same write.

    - `agentjobs identity unmap <login>` -- remove a mapping. Refuse if it would remove
    the owner''s only login unless `--force`.

    - `agentjobs identity owner [<actor>]` -- show or set `owner:`.

    - `agentjobs identity whoami [--project <id>]` -- run human_identity() the way
    the CLI path does (no request, so the owner) and print the resolved actor and
    how it resolved; with --project, also validate the actor against that project''s
    vocabulary so the unknown_actor refusal is reproducible from a shell.


    Write path requirements: read-modify-write of the whole file preserving unknown
    keys; write atomically (temp file + replace) so a crash cannot truncate the map
    and lock everyone out; create ~/.agentjobs if missing; never write over HTTP.
    The registry already re-reads per request, so no restart step.


    Refusal text: update unmapped_login_help() to print the CLI command as the primary
    instruction, keeping the YAML shape as the fallback for a machine with no CLI
    on PATH. The existing test that feeds the printed YAML back through the parser
    must keep passing; add one that the printed command parses as a valid Typer invocation.


    Dashboard: a read-only "Acting as <display_name> (<login>)" indicator already
    exists per the 2026-09-05 report; make sure it says how the identity was established
    (owner / tailnet). Add no form that writes identities.yaml.


    Docs: docs/identity-registry.md gets a "Mapping a login" section with the CLI
    first; docs/mobile-access.md onboarding step points at the command.'
  constraints: 'CLI only for writes. Decision recorded on task-066 (2026-09-05): a
    dashboard form that maps logins to actors is reachable by every tailnet peer,
    and letting a peer map themselves to an actor is the impersonation the account-system
    epic exists to close. No new HTTP route may write identities.yaml. No passwords,
    tokens or accounts: authentication remains the front door''s WhoIs.'
  out_of_scope: Per-person permission levels or roles (out of scope for the whole
    of task-066; the capability table is keyed by principal kind). Per-project aliases
    for one person under two ids (docs/identity-registry.md names this as a stated
    residual; the real install was reconciled by renaming instead). Any change to
    how the proxy proves a login.
  context:
  - path: src/agentjobs/identities.py
    why: the registry this CLI writes; read-only today, with the refusal text in unmapped_login_help()
  - path: src/agentjobs/actors.py
    why: human_identity() and validate_actor(), which whoami and map reuse rather
      than reimplement
  - path: docs/identity-registry.md
    why: the shipped design, the two-file split and why the map is machine-level;
      gets the new section
  - path: src/agentjobs/projects.py
    why: default_home() and the project registry, for which projects define a given
      actor
  - path: tests/test_identities.py
    why: existing parser and refusal-text tests to extend
acceptance:
- id: ac-1
  text: '`agentjobs identity map jposey@example.com ''Jeff Posey'' --owner` on a machine
    with no identities.yaml creates the file with owner and one mapping; IdentityRegistry().resolve()
    then returns it, and a second run with a different actor replaces rather than
    duplicates the entry.'
  status: pending
- id: ac-2
  text: '`identity map` refuses an actor id that no registered project defines as
    a human, and refuses one that is retired in every project, each with a message
    naming the projects consulted.'
  status: pending
- id: ac-3
  text: 'The write is atomic: a test that makes the final replace fail leaves the
    previous file intact and readable.'
  status: pending
- id: ac-4
  text: '`identity list` shows, per mapped actor, which registered projects define
    it and which would refuse it as unknown_actor.'
  status: pending
- id: ac-5
  text: '`identity whoami --project <id>` prints the resolved actor and the resolution
    reason for the CLI path, and reproduces the unknown_actor refusal for a project
    that does not define the mapped id.'
  status: pending
- id: ac-6
  text: The unmapped-login refusal (unmapped_login_help) names the CLI command first;
    the existing round-trip test still passes and a new test checks the printed command
    is a valid invocation.
  status: pending
- id: ac-7
  text: 'No HTTP route writes identities.yaml: tests/test_authorization.py''s route
    walk finds no new mutating route touching the identity registry, and the dashboard''s
    identity indicator is read-only and shows the resolution kind.'
  status: pending
- id: ac-8
  text: docs/identity-registry.md and docs/mobile-access.md document the command;
    full unqualified scripts/check.py green.
  status: pending
