    \ Playwright cases, and these are the ones that matter. jsdom loads no stylesheet,\
    \ so every link there reports the same computed colour whatever its classes say;\
    \ a class-name assertion would also pass against a class Tailwind never emitted.\
    \ These read `getComputedStyle` out of a real browser: the marked entry's background\
    \ is not transparent, its `box-shadow` is not `none` (the inset ring compiled),\
    \ and no other entry matches it on either colour channel.\n- The negative control\
    \ is in the file rather than in a reviewer's head, in the shape `pinned-header.spec.ts`\
    \ uses: it reproduces the reported bug by copying a sibling's class list onto\
    \ the current entry, and shows the paint assertion then has nothing to find. Copying\
    \ rather than deleting the marking classes, deliberately -- deleting them leaves\
    \ the link with no colour class at all, so it inherits the page's brighter text\
    \ and stays distinguishable by accident. That was the first version of the control\
    \ and it failed for a reason unrelated to what it was controlling for.\n\nAlso\
    \ verified by eye, in Chrome at 1278px against the sandbox: the project root marks\
    \ Dashboard, `/tasks/task-101` marks Tasks (not Create), `/tasks/new` marks Create\
