- id: 6
  ts: '2026-09-05T20:01:08.841624Z'
  actor: claude
  type: decision
  body: 'Decision: retire Create''s `text-blue-300` accent, so colour in the primary
    nav means "you are here" and nothing else.


    Why it is in scope rather than a tidy-up: the report is not only "nothing is marked",
    it is "not clear ... that it is currently Dashboard". Both halves are visible
    in the attached screenshot. With no current-page styling, the single blue label
    was the only thing the eye could land on, and it was on the entry the reader was
    *not* on. Adding a marker while leaving a second, louder blue in the bar would
    leave the ambiguity in place and make the fix harder to see.


    Rejected alternative 1 -- keep the accent and mark the current page in some other
    colour. Two colour vocabularies in a seven-item bar, one of which is only decoration.
    The reader still has to learn which blue is which.


    Rejected alternative 2 -- keep an accent for Create in a different hue, or add
    a `+` glyph. Both re-introduce a competing signal, and the glyph adds width to
    a row whose one-line fit is a measured constant (`NAV_INLINE_MIN_PX` = 1100, re-measured
    for task-328). Create is a destination like the others; nothing else in the bar
    advertises what it does either.


    What is given up, stated so nobody rediscovers it as a bug: Create is no longer
    distinguished as "the entry that creates something rather than going somewhere",
    which is what the comment on that line claimed the accent was for. If that distinction
    turns out to matter it should come back as something other than colour -- position,
    a separator, or a rule in the actions menu task-168 put in the top-right. `PrimaryNav.test.tsx`
    and `e2e/nav-current.spec.ts` both assert Create is painted identically to the
    other entries you are not on, so its return would be a deliberate act rather than
    a drift.'
  data:
