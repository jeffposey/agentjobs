- id: 5
  ts: '2026-09-05T20:00:53.025483Z'
  actor: claude
  type: progress
  body: 'Reproduced the report from the attached screenshot and from the source: `PrimaryNav`
    had no current-page state at all. Every destination rendered with one class list
    -- `touch-target rounded-md px-3 text-sm font-medium hover:bg-dark-border` --
    and nothing read `useLocation()` except the effect that closes the burger panel.
    So "which tab is selected" had no answer in the markup either: no `aria-current`,
    no styling.


    The second half is why the screenshot looks the way it does. `Create` carried
    `text-blue-300`, the only colour in the bar, so on the Dashboard the one entry
    that stood out was the one you were *not* on -- which is exactly the reading in
    the report ("not clear which tab is selected and that it is currently Dashboard").


    Fix, on branch `fix/task-336-active-tab-indicator`:


    - `currentDestinationPath(pathname, projectId)` -- exported pure function, longest
    match wins. `/tasks/new` marks Create rather than lighting up Tasks as well; `/tasks/task-042`
    marks Tasks; Dashboard''s `""` is the fallback for anything under the project
    nothing else claims. Both the project prefix and the destination path are compared
    at a segment boundary, so project `demo2` is not project `demo` and `/tasksomething`
    is not `/tasks`.

    - The current entry gets `aria-current="page"` and three visual channels, not
    one: `text-white` against muted siblings, a `bg-blue-500/15` tint, and an `inset-ring-1
    inset-ring-blue-400/60` hairline. `inset-ring` rather than a border because a
    border is 2px of layout and the row''s one-line fit at `NAV_INLINE_MIN_PX` is
    measured; a ring paints inside the box. The tint is deliberately not `bg-dark-border`,
    which is the hover background -- an inactive entry under the pointer would otherwise
    look exactly like the current one.

    - Everything you are not on is now `text-dark-muted` (5.7:1 on the bar''s `#1e293b`,
    past AA), which is the other half of the contrast.

    - The same marking appears inside the burger panel below 1100px.

    - Text metrics unchanged: no weight change, no added glyph, no border. `NAV_INLINE_MIN_PX`
    and its measurement still hold.


    Verified: full `scripts/check.py` from the worktree (see the next entry for the
    receipt), 5 new e2e cases in `frontend/e2e/nav-current.spec.ts` reading computed
    colour out of a real browser, 15 new jsdom cases in `PrimaryNav.test.tsx`, and
    by eye at 1278px on a sandbox -- Dashboard, Tasks, a task detail page and Create
    each marked correctly.'
  data:
