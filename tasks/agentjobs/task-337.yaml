  body: "Built and verified on branch `feat/task-337-dashboard-next-action` (worktree\
    \ `../worktrees/agentjobs-337`), commits 4b56311 and d2734d8. Full `scripts/check.py`\
    \ green, all ten stages, receipt written for 067a4a65.\n\nWHAT CHANGED\n\n1. The\
    \ two calm rungs of the ladder swapped (`src/agentjobs/dashboard.py`). `backlog`\
    \ used to outrank `next_up`, so a project with parked drafts answered \"what do\
    \ I do next\" with a table of every one of them -- 31 rows on this project, each\
    \ reading `spec`, under a subtitle admitting that nothing is blocked by any of\
    \ them. `next_up` now wins whenever there is a claimable task; `backlog` renders\
    \ only when there is not. The alert rung is untouched and still strict.\n\n2.\
    \ `next_up` offers the head of the queue, not one task. The snapshot gained `queue_preview`\
    \ -- `manager.claimable_tasks()[:3]`, one call rather than two, so the panel and\
    \ the \"Why this one?\" disclosure beside it cannot name different tasks. `next_task`\
    \ stays in the contract as its first element.\n\n3. Each row carries a Dispatch\
    \ button (`frontend/src/components/QueueDispatch.tsx`). One click, nothing to\
    \ fill in -- the record is the brief, as task-188 established. A task whose record\
    \ cannot brief an agent gets \"Brief and dispatch \u2192\" linking to its own\
    \ page instead of a textarea in a panel with no room for one. No group pulldown,\
    \ no posture chooser, no runs list: choosing happens on the task page.\n\n4. The\
    \ panel says what the machine is doing, from the machine-wide `/api/runs/live`\
    \ the capacity row already reads: \"Nothing is running on this machine. Starting\
    \ one of these is the useful move.\" / \"An agent is already working. These are\
    \ next in line.\" It says neither until that query has answered, so the line cannot\
    \ flip a poll after the page paints. This is the \"check if there are no current\
    \ Runs\" half of the spec.\n\n5. `DashboardResponse` gained `identity`, mirroring\
    \ the task detail and the playbook listing and for the same reason: a run must\
    \ be attributed to a real person, so a button that cannot name one is disabled\
    \ with the reason rather than pressable into a refusal.\n\n6. Where the machine\
    \ may not dispatch, the panel prints one line at its foot with a link to Dispatch\
    \ settings -- not a refusal repeated beside every row. Where dispatch was never\
    \ configured it says nothing at all, exactly as the task panel does.\n\n7. The\
    \ backlog panel, when it does render, samples five drafts and links to the rest.\n\
    \n8. The legacy Jinja dashboard shares the projection, so it follows the reorder;\
    \ it lists the same three tasks and still only links.\n\nVERIFIED\n\n- `scripts/check.py`,\
    \ unqualified, exit 0, ten of ten stages, 489s. Log kept for this session.\n-\
    \ Driven by hand in Chrome against `scripts/dashboard_next_action_sandbox.py`\
    \ on :8903, all four seeded states. Pressed Dispatch on the first row: a run started\
    \ (`run_05e13443`), the claimed task left the preview, the list refilled with\
    \ the next three, the sentence changed to \"An agent is already working\", and\
    \ the Runs badge, the In Progress tile and the capacity row all followed. The\
    \ click was proved to reach the button with a capturing `mousedown`/`click` listener\
    \ before anything was concluded from it -- a first click had produced no run and\
    \ the instrument, not the application, was the open question.\n- New tests: `QueueDispatch.test.tsx`\
    \ (10) covers one-click dispatch, the no-identity disabled state, the cannot-brief\
    \ link, both silent states and the refusal; `Dashboard.test.tsx` gained the preview\
    \ list, the render-prop action, both machine sentences, the silence before the\
    \ runs query answers, and the backlog sampling; `tests/test_attention_tiers.py`\
    \ now asserts `next_up` outranks `backlog`, that the preview stops at `QUEUE_PREVIEW_LIMIT`,\
    \ and that the \"+N in backlog\" trace survives under both suppressing rungs.\n\
    - `frontend/e2e/promote-draft.spec.ts` used to find a draft through the backlog\
    \ panel. It now walks the \"+N in backlog\" link, which is unconditional -- the\
    \ panel is not, and that directory shares one project across every spec.\n\nREJECTED\n\
    \n- Leaving `backlog` above `next_up` and merely shortening its table. It would\
    \ still be the page's one call to action on the days nothing needs a person, which\
    \ is the complaint.\n- Making the calm rungs coexist as two panels. That re-creates\
    \ the two-calls-to-action problem task-081 fixed. The backlog is instead traced\
    \ by the statistics card's \"+N in backlog\" link, which was already there and\
    \ already unconditional.\n- Computing \"is anything running\" on the server and\
    \ adding a ladder rung for it. It is machine-wide state on a per-project projection,\
    \ the browser already holds the answer for the capacity row, and a fifth rung\
    \ would have made the panel vanish rather than change one sentence.\n- Rendering\
    \ the full `DispatchPanel` per row. Group, posture, brief and runs on three rows\
    \ would make the panel taller than the screen -- and task-294 is open about exactly\
    \ that.\n\nOTHER DASHBOARD TASKS, AS ASKED\n\ntask-092 (the ladder design question),\
    \ task-294 (fits one screen), task-212 and task-213 (move the count tiles off\
    \ it) are now the first four in the `critical` band, in that order, with a note\
    \ on each saying why. Commit d1907ca on `main`.\n\ntask-092 is the one to read\
    \ first: it asks exactly this question, was deferred on 2026-08-12 until the React\
    \ port reached parity, and its ac-1 (\"whether the calm rungs coexist is decided\
    \ and recorded, with the rejected alternative\") and ac-2 (\"whether 'nothing\
    \ active' joins the ladder condition is decided\") are answered by the two rejections\
