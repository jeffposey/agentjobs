- id: 7
  ts: '2026-09-05T21:14:28.222264Z'
  actor: claude
  type: decision
  body: '**The badge sits beside the project switcher, outside the collapsible group,
    and `NAV_INLINE_MIN_PX` moves 1100 -> 1140 to pay for it.**


    Rejected: hanging it on a nav destination, which is what the legacy Jinja header
    does (its Tasks link) and the obvious port. Every destination in this bar goes
    behind the burger below the breakpoint, so on a phone -- the surface Jeff reads
    over Tailscale, and the one the report is about -- the badge would render inside
    a hidden container and be invisible. jsdom applies no stylesheet, so a component
    test would have called that a pass.


    The badge costs 34px of row: a 24px pill plus the 10px gap. Measured in Chromium
    at 1100x800 with the switcher pinned to the 224px (`max-w-56`) a long project
    name reaches for, the bar overflowed by exactly 34px -- `nav.scrollWidth` 1134
    against `clientWidth` 1100, and 0 with the badge hidden. That is the case the
    constant is defined against, so it moves to 1140. Rejected: leaving 1100 and letting
    the switcher truncate instead. It shrinks by `min-w-0` rather than overflowing
    in most real cases, which is why the wrong answer here looks fine in a sandbox
    with a four-character project name; task-328 already settled that the constant
    holds for the long-name case, and reversing that silently would be worse than
    a 40px band moving to the burger. The 960-1139 band now uses the burger, which
    keeps every destination one tap away.


    Rejected: rendering a zero, the way the green Runs badge does. That one is a readout
    where zero running is real information; this one is an alarm, and an alarm permanently
    on screen stops being read -- the exact failure `tests/test_attention_tiers.py`
    was written about. Zero also spends the 34px on every screen instead of the rare
    one.


    Rejected: feeding the badge from the dashboard query it shares a number with.
    905KB against this corpus.


    **Not done, deliberately:** the badge counts `blocks_human` only, so a parked
    draft raises nothing. The Dashboard''s separate "+N in backlog" rung already covers
    those and the tiers test forbids merging them.'
