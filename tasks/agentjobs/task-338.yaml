- id: 5
  ts: '2026-09-05T21:13:44.014093Z'
  actor: claude
  type: progress
  body: 'Built the header badge on `fix/task-338-topbar-attention-badge` (two commits:
    `78d6452` API, `a86e514` app). Full `scripts/check.py`, all ten stages, exit 0
    in 411s on the rebased branch''s worktree.


    **What the defect was.** The legacy Jinja header has always carried a red count
    on its Tasks link (`base.html`, and `tests/test_attention_tiers.py` is the test
    file written about it). The React port dropped it, so every surface but the Dashboard
    went silent about work stopped on a person.


    **What was built.**

    - `GET /api/projects/{id}/attention` -> `{"blocking": n}`. Its own endpoint because
    the header renders everywhere and the dashboard projection is 905KB of task records
    against this corpus (measured 2026-09-05, `curl -w %{size_download}`); a badge
    fed from that query would have made the Tasks tab pay a dashboard''s worth of
    bytes for one integer.

    - The predicate moved to `dashboard.count_blocking_human`, which the Jinja header
    now calls too, so the two headers and the "Needs you" tile cannot drift. A test
    asserts all three answer 2 on the same corpus.

    - `AttentionBadge` + `useHumanAttention`; freshness is `LiveUpdates` (added to
    `PROJECT_TASK_QUERY_IDS`), not a clock of its own -- the number moves when a task
    file is written and at no other time.


    **Verified.** 4 new Playwright tests: the badge appears on the Tasks tab with
    no reload after a task is handed to a human, and clears again; it leads to the
    Dashboard panel naming that task; it is visible at 390px and at the breakpoint;
    the bar is still one row and does not overflow at either. 6 new vitest cases and
    4 new pytest cases. Screenshots taken at 1280 and 390.'
