  type: question
  body: 'For Jeff: should the finish also retry without an agent before escalating,
    when the gate went red and main has moved since the rebase? In the task-337 incident
    the branch''s code was fine; the red test was a corpus check on a task record
    that main had already fixed by the time the finish finished. A single bounded
    re-rebase-and-rerun of the failed stage, on the same logic the existing catch_up
    step uses (only when moved paths are classified by gate_scope), would have merged
    task-337 with zero tokens. Cost: a genuinely red branch pays one extra gate, up
    to ~4 minutes under load. It is deliberately out of scope for this task so the
    dispatch change is not held on it; say yes and it becomes a follow-up task, say
    no and the answer is recorded here.'
