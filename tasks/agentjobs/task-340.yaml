spec:
  summary: When an approved task's scripted finish goes red at the gate, the finish
    hands the ball to agent/work and dispatches nobody, because dispatch_after_escalation
    is gated on auto_dispatch, which is off here. The task then sits until Jeff notices
    and clicks Dispatch or runs the CLI by hand, with no notification and the failing
    test buried in a wall of pytest output. Make the escalation spend the approval's
    authorisation on a run, and make the escalation prompt lead with what failed.
  intent: A human approval is the one human act the merge needs. After it, no step
    of getting the code onto main should wait on a second human act unless a judgement
    is genuinely required. A red gate is work for an agent, not for Jeff.
  description: "**The incident (task-337, 2026-09-05).** Jeff approved task-337. The\
    \ scripted finish (fin_835695c3) rebased feat/task-337-dashboard-next-action onto\
    \ main and ran the gate; pytest failed on one test, `tests/test_validate.py::TestRealCorpus::test_the_tolerated_drift_is_only_taxonomy_and_serialization`,\
    \ because task-339.yaml on main at that moment carried an absolute path. The fix\
    \ for task-339's record (5051c15) landed on main after the finish had rebased,\
    \ so the worktree still had the broken copy. The branch's own code was fine; today's\
    \ main passes the test.\n\nThe finish did what it is coded to do: it wrote the\
    \ escalation (e955c4e), handed the ball to `agent`/`work` with a prompt addressed\
    \ to \"the session that may be resumed\", released the lock and the runway, and\
    \ called `dispatch_after_escalation`. That function returns None without dispatching\
    \ when the project's `auto_dispatch` is false, which it is for agentjobs (`~/.agentjobs/dispatch.yaml`,\
    \ `projects.agentjobs.auto_dispatch: false`). Its docstring and docs/agent-dispatch-design.md\
    \ (\"When it escalates, it spends exactly the authorisation the approval already\
    \ carried\") both describe the fallback as \"the human's existing Dispatch click\
    \ resumes the session\". Nothing notified Jeff. The last run for the task had\
    \ finished at 21:03 UTC and no new one existed. The task sat at agent/work with\
    \ no agent for the rest of the evening, and Jeff's question was \"is task-337\
    \ stuck?\".\n\nJeff's ruling, 2026-09-05: the fix is the process, not running\
    \ `agentjobs finish` by hand. A finish that encounters a test failure should not\
    \ wait for him to run CLI commands.\n\n**What to change.**\n\n1. **Decouple the\
    \ post-escalation dispatch from `auto_dispatch`.** `auto_dispatch` answers \"\
    may an approval start a run with no second click\". The escalation case is different:\
    \ the approval already started machinery (the finish, gated by `finish.enabled`),\
    \ and the run being asked for is that same act continuing after the machinery\
    \ could not finish it. Gate `dispatch_after_escalation` on `finish.enabled` (the\
    \ switch that let the approval start a finish in the first place), not on `auto_dispatch`.\
    \ Keep `assert_dispatch_permitted`, the machine ceiling, the per-task run bound,\
    \ and the `caused_by` attribution to the human's approval entry exactly as they\
    \ are; this widens one gate, not the safety argument. Decide whether it deserves\
    \ its own `finish.dispatch_on_escalation` knob defaulting to true, or simply follows\
    \ `finish.enabled`; record the decision with the rejected alternative.\n\n2. **The\
    \ dispatched run must be able to do the job.** It resumes (or replaces) the session\
    \ that worked the task, in the task's existing worktree, with a prompt that names\
    \ the failing step. Check what `dispatch_task` does with a task at agent/work\
    \ that has a prior run: the docs say a second dispatch may resume the session\
    \ that worked the task; confirm that path is what an escalation reaches and that\
    \ the prompt it receives is the escalation's, not a fresh \"work task-NNN\". The\
    \ run's own success path is unchanged: fix, gate green, rebase, hand off for review.\
    \ A human approves again, the finish runs again. Every cycle costs a human approval,\
    \ so this cannot loop unattended.\n\n3. **Lead the escalation with the cause.**\
    \ The `ball_prompt` and the progress entry currently embed the gate's last lines,\
    \ which for a pytest failure is two hundred lines of DeprecationWarnings before\
    \ the `FAILED` line. Put the dispositive lines first: the stage, and for pytest\
    \ the `FAILED ...` short-summary lines and the assertion; then the pointer to\
    \ gate.log; then the raw tail if at all. A person reading the dashboard must see\
    \ *which test* in the first screen. The gate log path is machine-local and absolute;\
    \ it should not be in `spec.context` or `deliverables` (that is exactly the drift\
    \ the corpus test rejects) but is fine in a log body.\n\n4. **If the escalation\
    \ does not dispatch, say so to a human.** Whenever `dispatch_after_escalation`\
    \ returns None (dispatch disabled, ceiling reached, no human entry, dispatch error),\
    \ the ball must not sit at `agent`/`work` with no agent. Hand off to `human`/`decision`\
    \ instead, with a prompt naming why no run started and what the click or command\
    \ is. An open task names who acts next, and \"agent\" with no agent is a lie the\
    \ schema cannot catch.\n\n**Verification.** A test in tests/test_dispatch_finish.py\
    \ where a gate goes red on a project with `finish.enabled` and `auto_dispatch:\
    \ false` and asserts a run was dispatched with `caused_by` the approval entry;\
    \ one where dispatch is impossible and asserts the ball lands on `human`, not\
    \ `agent`; one asserting the escalation prompt's first lines name the failing\
    \ stage and test. Then the real thing: approve a throwaway task whose branch fails\
    \ one test on this machine and watch the run start without a click. Update docs/agent-dispatch-design.md\
    \ \xA75a and the sentence at \"When it escalates, it spends exactly the authorisation\"\
    \ to match, and ENGINEERING.md's \"Steps 3 to 6 may already have happened\" paragraph\
    \ if it changes what a woken agent should expect."
  constraints: Do not widen `auto_dispatch` itself, and do not let an escalation dispatch
    on a project with `finish.enabled` off. Push stays off. The per-task retry bound
    and the machine's max_concurrent_runs still apply to the escalation's run. Task
    records stay on main.
  out_of_scope: Retrying the gate without an agent when main has moved since the rebase
    (the no-token fix for this exact incident) is a separate decision; see the question
    on this task's log. Unsticking task-337 itself is not this task.
  context:
  - path: src/agentjobs/dispatch/finish.py
    why: escalate_on_record writes the handoff; dispatch_after_escalation is the auto_dispatch-gated
      call at the end of the escalation branch of the orchestrator.
  - path: src/agentjobs/dispatch/config.py
    why: FinishSettings and ProjectDispatchSettings.auto_dispatch; where a new knob
      would live.
  - path: docs/agent-dispatch-design.md
    why: section 5a and the paragraph on what an escalation spends; both state the
      current auto_dispatch fallback and need to change with the code.
  - path: tests/test_dispatch_finish.py
    why: existing escalation tests to extend.
  - path: tasks/agentjobs/task-337.yaml
    why: 'the incident record: the escalation entry and ball_prompt as written today.'
