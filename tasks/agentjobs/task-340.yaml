  body: '**Durable-execution framing, at Jeff''s request (2026-09-05). It names what
    this change actually is.**


    The scripted finish is a durable workflow in the exact technical sense: a sequence
    of steps written to a journal that outlives the process running them. It already
    has most of the machinery, and the names line up one for one --


    - **Journal / event history**: the task log''s `finish_step` entries, plus `~/.agentjobs/finishes/<id>/meta.yaml`
    and the phase records.

    - **Idempotent replay**: `agentjobs finish` re-run picks up its own prior merge
    through `previous_merge_commit` rather than merging twice, and tells that case
    apart from a branch somebody merged by hand.

    - **Compensation (saga)**: `rebase --abort` and `merge --abort`, each followed
    by reading the ref back rather than assuming the abort worked.

    - **Liveness distinct from completion**: `finish_status` derives `INTERRUPTED`
    from the lock holder''s pid via `stale_lock_reason`, and its docstring refuses
    a heartbeat *because* a second staleness rule would drift from the first. That
    is a better answer than a heartbeat, and it is already built.


    **What was missing is the one thing durable execution insists on: a suspended
    workflow must schedule its own continuation.** In Temporal''s vocabulary the escalation
    was a workflow that suspended awaiting a signal nobody was going to send -- the
    "signal" being Jeff noticing a task on a dashboard. That is not a durable wait;
    it is a dropped one, and task-337 is what a dropped one looks like after four
    hours.


    So this change is not a new feature so much as closing the loop the rest of the
    design already assumes: the stop now either starts the run that continues the
    work, or moves the ball to somebody who exists. Nothing else about the workflow''s
    durability changed.


    One honest correction while writing this: I expected to find the finish had no
    liveness signal and to file a follow-up for it. It has one, it is better than
    the heartbeat I was going to propose, and the reasoning is in `finish_status.py`''s
    own docstring. No task filed.'
