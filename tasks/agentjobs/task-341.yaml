- id: 5
  ts: '2026-09-06T02:51:32.982665Z'
  actor: claude
  type: progress
  body: "Reproduced and measured on the live server (127.0.0.1:8876, /app/p/agentjobs/tasks,\
    \ Chrome, viewport 1278px). The screenshot understates it: the first screenful\
    \ of the task list is entirely blank \u2014 header, filters, a column header row,\
    \ then a void.\n\nTwo independent layout failures, both in shared code.\n\nHorizontal.\
    \ The table is 1763px wide inside a 1197px scrollport, so Status, Priority, Assigned\
    \ and Updated sit off-screen behind a horizontal scrollbar nobody looks for. Cause:\
    \ the Task cell's title carries Tailwind `truncate`, whose `white-space: nowrap`\
    \ sets that cell's max-content width to the full length of the longest title.\
    \ `.responsive-table` is `table-layout: auto`, so one title sizes the column \u2014\
    \ measured 1261px of a 1197px viewport for a single cell. `truncate` can never\
    \ fire, because nothing constrains the column it lives in.\n\nVertical. `DependencyState\
    \ compact` renders `ball_prompt` verbatim as the Status cell body. task-092-dashboard-design-pass\
    \ is parked on review with a full review request in its prompt; poured into the\
    \ 194px auto-layout left it, that wraps to 2070px. The row is 2091px tall. The\
    \ median row is 77px. The 122 rows total 12874px, so one task's prose is 16% of\
    \ the whole list \u2014 and it is the row that lands at the top of the first screen,\
    \ which is why that screen renders empty.\n\nBoth are the same mistake twice:\
    \ no cell in this table ever constrains its own text. The other two callers of\
    \ ResponsiveTable have it too \u2014 Dashboard's \"Title\" column and LiveRuns'\
    \ `task_title` are equally unbounded; they have just not met a long enough string\
    \ yet.\n\nBranch fix/task-341-task-list-density, worktree ../worktrees/agentjobs-341,\
    \ bootstrapped."
