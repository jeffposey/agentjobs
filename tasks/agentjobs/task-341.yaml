- id: 7
  ts: '2026-09-06T03:41:14.575955Z'
  actor: claude
  type: progress
  body: "Done, on branch fix/task-341-task-list-density (3 commits, rebased onto main\
    \ at a1b8d99, head f6f4233).\n\nTwo fixes, both in shared code.\n\n`table-layout:\
    \ fixed` on `.responsive-table`, with a `<colgroup>` per table. Fixed layout is\
    \ what stops one cell sizing a column, and it is also what makes `truncate` work\
    \ \u2014 an ellipsis needs a box that will not grow, and this table never bounded\
    \ one. The task list's five bounded columns are as wide as the widest thing they\
    \ can hold (Queue 5rem, Status 12rem, Priority 6rem, Assigned 6rem, Updated 10.5rem,\
    \ which keeps the timestamp on one line); Task takes the remainder. Dashboard\
    \ and LiveRuns get colgroups too \u2014 not because either has been seen to break,\
    \ but because both are unbounded in exactly the same way and were one long title\
    \ from it. Without a colgroup, fixed layout divides the width equally, which would\
    \ be worse than what it replaced.\n\n`DependencyState compact` joins its reasons\
    \ into one paragraph, clamps it to two lines, and puts the whole text on the element's\
    \ `title`. Nothing is dropped from the DOM and nothing is cut in JavaScript \u2014\
    \ the clamp is CSS, and the unclamped version is on the task's own page. Not-compact\
    \ is unchanged: a paragraph per reason, no clamp, no tooltip. The Task cell's\
    \ title also gained a `title` attribute, since it is the line that gets cut.\n\
    \nMeasured before and after on the real backlog, same viewport (1278px, scrollport\
    \ 1197px):\n\n|                          | before | after |\n| ---           \
    \           | ---    | ---   |\n| table width              | 1763px (566px past\
    \ the edge) | 1197px (0) |\n| tallest row              | 2091px | 91px |\n| median\
    \ row               | 77px   | 77px |\n| whole list               | 12874px |\
    \ 9779px |\n| rows on the first screen | **0**  | **12** |\n\nThe first screen\
    \ was empty because the 2091px row sat at the top of the queue with its own content\
    \ off to the right \u2014 so the page rendered a header, filters, a column header\
    \ row and then a void. That is the screenshot on this task.\n\nVerification. Four\
    \ Playwright cases in `frontend/e2e/task-list-density.spec.ts`, all measured rectangles\
    \ from a real browser: the table's overflow past its scrollport, every column's\
    \ box against the viewport edges, every row's height, a title whose scrollWidth\
    \ exceeds its clientWidth (which is what an ellipsis means), and a phone case\
    \ asserting the card layout is what it always was. **Checked against the pre-fix\
    \ code before being trusted** \u2014 570px of overflow at 1280px, 994px at 840px,\
    \ and no `title` on the row at all. jsdom cannot see any of this: it has no table\
    \ layout algorithm, `getBoundingClientRect()` is always zero, and a unit test\
    \ asserting `class=\"truncate\"` passed throughout because the class was always\
    \ there and had never had a bounded box to work in. Nine vitest cases cover the\
    \ parts that are about rendered values rather than layout.\n\nLooked at, not just\
    \ tested: the task list, the Runs table and the Dashboard's backlog table, all\
    \ three on screen at 1278px, all three with zero overflow. The Dashboard one needed\
    \ a drafts-only project to render at all, because the next-action ladder shows\
    \ one panel and every other rung outranks the backlog \u2014 which is why the\
    \ sandbox has a third project."
