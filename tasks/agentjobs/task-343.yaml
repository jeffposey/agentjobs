spec:
  summary: Approving with a note records it on the task, then the scripted finish
    merges without it -- the note reaches no merge commit, no prompt, and no agent.
  intent: A human who types a sentence into Approve should have that sentence reach
    whatever acts next. Today, on the one project where the finish is switched on,
    nothing acts on it at all.
  description: "## What is wrong\n\n`POST /tasks/{id}/approve` takes an optional `note`\
    \ (task-228) and writes it faithfully:\nverbatim into the handoff `ball_prompt`\
    \ after `APPROVAL_CLEARANCE`, and into the log\nbody as `Approved by {user} through\
    \ the web UI: {note}`. That part works.\n\nThen `after_human_handoff(..., finishable=True)`\
    \ runs. Where the project has\n`finish.enabled` -- agentjobs does, `finish=on`\
    \ -- it calls\n`spawn_finish(project=..., task_id=..., approver=user)` and returns\n\
    (`src/agentjobs/api/routes/tasks.py:664`). `spawn_finish` builds its argv with\n\
    `--project` and `--approver` and nothing else\n(`src/agentjobs/dispatch/finish.py:2310`).\
    \ **The note is not a parameter anywhere on\nthe finish path.**\n\nSo on the happy\
    \ path the finish rebases, gates green, merges `--no-ff`, delivers and\ncloses.\
    \ Nobody ever reads the `ball_prompt` the note went into. The merge commit\ncarries\
    \ the approver's *name*, through `authorisation_phrase`, but not the note\n(`src/agentjobs/dispatch/finish.py:1056`).\n\
    \nThe escalation path is worse rather than better. When the finish stops, `escalate()`\n\
    overwrites `ball_prompt` wholesale with its own failure account\n(`src/agentjobs/dispatch/finish.py:1590`),\
    \ and `wake.py` builds the woken session's\nprompt from `ball_prompt` (`src/agentjobs/dispatch/wake.py:46`).\
    \ The agent that gets\nwoken is therefore never *shown* the note; it survives\
    \ only in the log, reachable if\nthat agent happens to read the record's history.\n\
    \n## How it drifted\n\nBoth halves landed on 2026-08-21, five hours apart, and\
    \ the second did not account for\nthe first:\n\n- `5cc55e7` 16:12 -- `feat(api):\
    \ let an approval carry a note without becoming a rejection (part 3, absorbs task-228)`\n\
    - `9c45e1f` 21:24 -- `feat(dispatch): approval finishes the task itself, and wakes\
    \ a session only when it cannot` (task-241)\n\nThe UI already hedges in a way\
    \ that reads as a promise: the field is labelled\n*\"Approval note (optional)\
    \ -- does not block the merge\"* with the placeholder\n*\"Anything to carry into\
    \ the merge.\"* (`frontend/src/components/TaskDetail.tsx:430`).\nThat is precisely\
    \ what does not happen.\n\n## What to do\n\nTwo changes, both additive, neither\
    \ altering who authorises a merge:\n\n1. **Carry the note into the merge commit\
    \ body.** `spawn_finish` and the `finish` CLI\n   grow a way to receive it --\
    \ read it off the task's newest approval log entry rather\n   than threading a\
    \ string through argv, if that is cleaner, since the record already\n   holds\
    \ it and argv on Windows is a poor place for free text. `merge()` appends it\n\
    \   under the `authorisation` line. This makes the note durable in the exact artefact\n\
    \   the approval produced, and it is the cheapest of the three.\n2. **Make the\
    \ escalation prompt carry it.** `escalate()` reads the approval note back\n  \
    \ off the record and includes it in the `ball_prompt` it writes, so a woken agent\
    \ is\n   told what the human actually asked for instead of only what the finish\
    \ could not do.\n\nRead the note from the record in both cases -- one source,\
    \ so the two cannot drift the\nway the original pair did.\n\n## The question that\
    \ is not yours to settle\n\nThere is a third option: **let a note suppress the\
    \ auto-finish**, falling through to\nordinary auto-dispatch on the theory that\
    \ a note means \"do something before merging.\"\nThat is a behaviour change to\
    \ what Approve does, and Jeff has not decided it. Do not\nimplement it. If, while\
    \ doing 1 and 2, you conclude it is the right shape, raise it as\na `question`\
    \ on this task and hand the ball to `human`/`decision` rather than acting.\n"
  constraints: '- Nothing here may change who authorises a merge, or the posture rules
    in ENGINEERING.md''s merge gate.

    - An approval with no note must still produce a byte-identical record and merge
    commit to today''s. That invariant is what task-228 was careful about and it stays.

    - Read the note back off the task record rather than threading it through `spawn_finish`''s
    argv where you can: the record already holds it, and one source stops the two
    paths drifting apart again.

    - `spawn_finish` must keep its "never raises" property. An approval that has already
    been recorded must not fail because a note could not be read.

    - Task-record commits go to `main`; code goes on the branch.'
  out_of_scope: '- Making a note suppress the auto-finish, or otherwise changing what
    Approve does when a note is present. That is the open question above and needs
    Jeff''s call.

    - Reworking the note field''s UI copy beyond whatever is needed to stop it over-promising.

    - Anything about Request Changes, which already hands to an agent that reads its
    prompt.'
  context:
  - path: src/agentjobs/api/routes/tasks.py
    why: '`approve_task` (line 693) writes the note; `after_human_handoff` (line 626)
      diverts to the finish at line 664 without it.'
  - path: src/agentjobs/dispatch/finish.py
    why: '`spawn_finish` argv at 2310 carries no note; `merge()` builds the commit
      message at 1056; `escalate()` overwrites ball_prompt at 1590.'
  - path: src/agentjobs/dispatch/wake.py
    why: The woken session's prompt is built from ball_prompt (line 46), which escalate()
      has just overwritten.
  - path: frontend/src/components/TaskDetail.tsx
    why: The approve NoteForm at line 430 -- its label and placeholder are the promise
      being broken.
  - path: tasks/agentjobs/task-241.yaml
    why: The scripted finish that took over the approval path and did not account
      for the note.
  - path: tasks/agentjobs/task-228.yaml
    why: Where the note came from, and the byte-identical-without-a-note invariant
      it established.
