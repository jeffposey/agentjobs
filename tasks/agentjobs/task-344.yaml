spec:
  summary: '`limits.max_concurrent_runs` is machine-level and lives in ~/.agentjobs/dispatch.yaml,
    so changing it means hand-editing a file on the host. Once the Dashboard becomes
    a slot board (task-092) that number decides how much of the page there is, so
    it needs a control in the GUI. This adds one -- human-only, comment-preserving,
    and honest about being a machine-wide setting reached from a project page.'
  intent: 'Jeff, 2026-09-05, specifying the slot board: *"there should be a way to
    override the max from gui"*.


    The number is not an implementation detail once it is the shape of the Dashboard.
    Today changing it means finding `~/.agentjobs/dispatch.yaml` on the host, editing
    YAML, and knowing that a running server may be holding a cached copy. That is
    a fine contract for a machine setting nobody touches and a bad one for a dial
    a person will reach for whenever the board is full and they want one more run
    in flight.'
  description: '## What it is


    One control that writes `limits.max_concurrent_runs` in `~/.agentjobs/dispatch.yaml`,
    and one endpoint behind it. The read side already exists and is correct: `GET
    /api/runs/live` returns `max_concurrent_runs` and `dispatch_configured` alongside
    the live runs, counted by exactly the expression the concurrency guard uses (`src/agentjobs/api/routes/runs.py`),
    so no second source of truth needs inventing. Only the write side is missing.


    Where the control lives is a small decision to take and record: the Dispatch settings
    page is where every other dispatch setting is, and the slot board is where a person
    feels the limit. Both, or one with a link, are defensible; pick one and say why.


    ## Five things it has to get right


    **1. The writer must not destroy the file.** `set_project_enabled` round-trips
    the whole document through `yaml.safe_dump`, which deletes every comment in it
    -- that is task-198, and it is a `needs` here rather than a note because a new
    writer for the same file would do the same damage on the same click. One of the
    comments already lost once was the note on `max_concurrent_runs: 3` recording
    that the value came from a measurement on this machine rather than a guess (task-191).
    Rewriting *that* line is the one this task exists to do, so it is the one whose
    comment must survive. If this task lands first it has to build the round-tripping
    writer itself, and task-198 collapses into it.


    **2. It is machine-wide, and it is reached from a project page.** Every other
    control in the app changes the project you are looking at. This one changes every
    project on the host, including runs of projects you cannot see. The control has
    to say so in words, not leave it to be inferred from where it sits.


    **3. Human-only.** `dispatch.admin` covers enable and disable today (`docs/authorization.md`);
    this extends it. A run must not be able to raise its own machine''s ceiling --
    the concurrency guard is the floor under every other bound on dispatch, and a
    run that can lift it has no bound at all. A run credential presenting this request
    gets the same 403 as `dispatch enable`.


    **4. Raising it has a real cost, and the control should say what.** Gates contend
    for the same machine: `docs/performance.md` measures how the gate degrades under
    contention, and the current value of 3 was measured rather than chosen. A spinner
    that goes to 12 with no comment invites a person to discover thrashing by causing
    it. Name a bound and give the reason, or show what the current value cost -- decide
    which and record it.


    **5. Lowering below what is running is legal, and must kill nothing.** Three runs
    alive and the ceiling set to 1 is a coherent state: the live runs keep running,
    and the guard refuses the next dispatch until two have finished. The UI must say
    that is what will happen rather than implying anything is about to be stopped,
    and nothing in the write path may touch a live run.


    ## The freshness question


    A running server may hold a parsed config. Whatever caching exists, a ceiling
    changed in the browser has to be the ceiling the *next dispatch guard decision*
    uses, without a restart -- otherwise the control appears to work and changes nothing,
    which is the failure mode task-194 and the stale-server rail in ENGINEERING.md
    both describe. Verify by dispatching past the old ceiling, not by re-reading the
    page.


    Concurrent writes are the other half: `agentjobs dispatch enable` from a shell
    can be writing this file at the same moment. Say what the writer does about that
    -- a lock, a read-modify-write under one, or an explicit "last writer wins, and
    here is why that is acceptable for this file".'
  constraints: '- The comment-preserving writer is the deliverable, not a workaround
    around it. No second writer for the same file.

    - Human-only, enforced server-side and tested with a run credential, not merely
    hidden in the UI.

    - Nothing in this task stops, cancels or signals a live run under any value.

    - Machine-wide scope stated in the control''s own words.

    - No push. This machine''s dispatch config is machine-local and never committed.

    - Take a worktree and bootstrap it before anything else; one unqualified `scripts/check.py`
    on the rebased branch before the handoff.

    - Jeff drives it in a browser on his own screen before it merges: sandbox on its
    own port with a seeded throwaway `dispatch.yaml` that has comments in it, so he
    can change the value and then look at the file.'
  out_of_scope: '- Per-project concurrency ceilings. There is one cap and it is machine-level
    (`docs/agent-dispatch-design.md`); introducing a second is a design task, not
    this one.

    - Editing runners or runner groups from the browser -- task-178.

    - The slot board''s layout and what a slot card holds -- task-092.

    - Any other field of dispatch.yaml. One dial.

    - Auto-tuning the ceiling from machine load. Interesting, and not this.'
  context:
  - path: src/agentjobs/dispatch/config.py
    why: '`set_project_enabled` is the writer that destroys comments; the new ceiling
      writer must not be a second one like it.'
  - path: src/agentjobs/api/routes/runs.py
    why: 'The read side: `max_concurrent_runs`, `dispatch_configured`, and `occupied`
      counted exactly as the guard counts it.'
  - path: src/agentjobs/api/routes/dispatch.py
    why: Where enable/disable live and where `dispatch.admin` is enforced; the new
      endpoint belongs beside them.
  - path: docs/authorization.md
    why: The capability table. This extends `dispatch.admin` rather than inventing
      a capability.
  - path: docs/performance.md
    why: How the gate degrades under contention -- the reason raising the ceiling
      is not free and the reason 3 was measured.
  - path: tasks/agentjobs/task-198.yaml
    why: The comment-destroying writer, which this depends on.
