spec:
  summary: "Create and Report issue both file a task through the same manager path,\
    \ yet the app offers them as two unrelated controls \u2014 a nav link and a floating\
    \ button in the opposite corner. Merge them into one small always-present control,\
    \ and decide whether what sits behind it is one form or two."
  intent: "Jeff, 2026-09-05: *\"Create should be merged with Report Issue and put\
    \ in a better place, maybe always on screen but a small icon in top bar.\"*\n\n\
    The two are already the same thing where it counts. task-120's binding constraint\
    \ is that *\"every submitted finding becomes a normal task through the managed\
    \ API/TaskManager path\"* \u2014 there is no issue store, no inbox, no second\
    \ entity. What differs is the ceremony: Report issue captures three fields and\
    \ the page you were on, Create asks for a spec. That is one act with two amounts\
    \ of typing, and presenting it as two controls in opposite corners of the screen\
    \ makes the cheap one look like a different feature.\n\nMerging them is also what\
    \ makes the capture argument survive the bar getting shorter (task-345). Create\
    \ leaving the nav row must not mean authoring gets harder \u2014 it should mean\
    \ it gets nearer, present on every page instead of one link among seven."
  description: "## The two controls today\n\n- **Create** \u2014 a `/tasks/new` destination\
    \ in the primary nav, rendering the full authoring form (task-090).\n- **Report\
    \ issue** \u2014 a `fixed bottom-4 right-4` button (`IssueReporter.tsx`) opening\
    \ a modal, mounted *outside* the routes in `App.tsx` on purpose, so it is present\
    \ on pages that render before a project resolves. Its header comment explains\
    \ that placement; do not lose the coverage silently.\n\n## What to decide\n\n\
    **1. One form or two.** The candidate answers, and this task picks one and records\
    \ the rejected alternative:\n\n- *One form, two entry points* \u2014 the same\
    \ dialog, opened either \"quick\" (title, details, screenshot paste, captured\
    \ page context) or \"full\" (the whole spec), with a control to expand from one\
    \ to the other. The attraction is that a report that turns out to deserve acceptance\
    \ criteria does not have to be refiled.\n- *Two forms behind one control* \u2014\
    \ a menu with Report issue and New task, sharing only the control.\n\nWhichever\
    \ wins, task-342 (no way to set priority when reporting) is very likely answered\
    \ for free, and this task should say whether it is. task-175's \"draft with AI\"\
    \ is the same argument arriving later: a model expanding three dictated sentences\
    \ into a spec is only coherent if the two forms are one thing.\n\n**2. What the\
    \ control is and where it sits.** Jeff's suggestion is a small icon in the top\
    \ bar, always on screen. Against it: the bar is being deliberately emptied by\
    \ task-345, and an *action* in a row of *destinations* is what task-336 already\
    \ found confusing when Create was the only coloured entry. In its favour: it is\
    \ one place, it is thumb-reachable at the top on a phone held one-handed only\
    \ for some hands, and it survives the burger collapse if it is placed outside\
    \ the collapsible group the way task-338's badge is.\n\nThe floating button it\
    \ replaces is not obviously worse and the reasons it exists are written down \u2014\
    \ decide with the arguments, not by preference, and state what happens at 375px.\
    \ Note task-295: the bottom-right corner is where the iOS home indicator lives,\
    \ which is a point against staying there.\n\n**3. Where it renders.** The bar\
    \ is inside `ProjectApp`; `IssueReporter` is not, deliberately. If the control\
    \ moves into the bar it loses the project-less status pages. Decide the same way\
    \ task-168 was asked to: either the control also renders there, or you argue why\
    \ that coverage does not matter. Do not lose it by accident.\n\n## Its relationship\
    \ to task-168\n\ntask-168 plans to retire the floating button by moving Report\
    \ issue **into** the burger menu, and its ac-1/ac-2 say so. Jeff's direction on\
    \ 2026-09-05 supersedes that placement: Report issue is not a menu entry, it is\
    \ half of this control. **Record the decision on task-168 as well** \u2014 a decision\
    \ on one of two overlapping tasks is a decision the other's session will not see,\
    \ which is the mistake task-236 already names. task-168 still owns the menu itself,\
    \ About, and the version endpoint; it simply stops owning where Report issue lives.\n\
    \n## Verification\n\nA review server on its own port with seeded throwaway data,\
    \ per the standing rule. Both halves exercised: file a quick report with a pasted\
    \ screenshot, and author a full task, from the one control, at desktop and at\
    \ 375px. The existing `report-issue.spec.ts` and `create-task.spec.ts` are updated\
    \ to the new entry point rather than deleted."
  constraints: "- Everything filed still goes through the managed TaskManager path\
    \ and becomes an ordinary task. No second entity, no inbox \u2014 task-120's constraint\
    \ is untouched.\n- No capture surface is lost: the pages that today can report\
    \ an issue can still report one, or the record says why the loss is acceptable.\n\
    - Nothing the reporter already collects is dropped \u2014 page, project and task\
    \ context per finding, and clipboard screenshot paste (task-067).\n- Keyboard\
    \ reachable, focus returns to the trigger on close, and the modal keeps its z-order\
    \ above the pinned header (`PrimaryNav` is `z-30` precisely so it stays below\
    \ the reporter's `z-40`/`z-50`).\n- The control must not reflow or grow the header\
    \ on open.\n- Take a worktree and bootstrap it. One unqualified `scripts/check.py`\
    \ on the rebased branch before the handoff."
  out_of_scope: "- The rest of the primary nav's contents \u2014 task-345.\n- The\
    \ menu shell itself, About, and the version endpoint \u2014 task-168.\n- The multi-item\
    \ capture tray \u2014 task-121.\n- Dictation (task-172) and draft-with-AI (task-175),\
    \ though the shape chosen here should not make either harder.\n- Redesigning what\
    \ the authoring form collects beyond what merging requires."
  context:
  - path: frontend/src/components/IssueReporter.tsx
    why: The floating button, the modal, and the header comment explaining why it
      mounts outside the routes.
  - path: frontend/src/App.tsx
    why: Where the reporter mounts, where the bar lives, and the /tasks/new route.
  - path: frontend/src/components/PrimaryNav.tsx
    why: The z-30 comment explaining the ordering with the reporter, and the collapsible
      group the control must sit outside of if it goes in the bar.
  - path: tasks/agentjobs/task-168-menu-shell.yaml
    why: Plans to put Report issue in the menu; ac-6 supersedes that and must be recorded
      there.
  - path: tasks/agentjobs/task-120-issue-reporter-workflow.yaml
    why: The constraint that every finding becomes an ordinary task, which this merge
      rests on.
  - path: tasks/agentjobs/task-342.yaml
    why: "Priority when reporting \u2014 likely answered by converging the two forms."
