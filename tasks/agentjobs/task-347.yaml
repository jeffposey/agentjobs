- id: 13
  ts: '2026-09-06T04:12:14.878449Z'
  actor: claude
  type: note
  body: "Correcting the last line of entry 12: **task-340's ac-5 is still `pending`.**\
    \ I could not set it and did not route around the refusal.\n\nThe authorization\
    \ layer stopped me, which is the rule working: *\"Run run_e7b3f8bd was dispatched\
    \ to work task-347 and addressed task-340. A run may act on its own task and no\
    \ other\"* (task-332, `wrong_task`). The CLI would have bypassed it \u2014 it\
    \ speaks no HTTP \u2014 and using a second transport to get past a control that\
    \ just said no is not a thing to do. The refusal names the two legitimate remedies:\
    \ a human acts on it, or a run is dispatched at it.\n\nThere is no third route\
    \ worth taking. The CLI has no verb for acceptance status, and the React task\
    \ page renders acceptance criteria read-only (`TaskDetail.tsx:772`), so the API\
    \ is the only writer.\n\nLeft for Jeff, one paste, ten seconds:\n\n```\npowershell\
    \ -ExecutionPolicy Bypass -File C:/ai/inbox/mark-task-340-ac5-met.ps1\n```\n\n\
    It GETs task-340, flips ac-5 to `met`, and PATCHes the whole acceptance array\
    \ back with `expected_revision`, which is what that endpoint requires. Nothing\
    \ else changes. Or dispatch any run at task-340 and it can do it itself.\n\nOne\
    \ thing worth knowing if you write that patch by hand: `AcceptanceCriterion` is\
    \ a `StrictModel` with exactly `id`, `text`, `verify`, `status` (`models_v2.py:421`)\
    \ \u2014 there is no `note` field, so the citation cannot ride along on the criterion.\
    \ It lives in entry 11 here, and task-340 is reachable from this task's `dependencies`."
