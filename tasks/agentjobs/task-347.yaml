  type: decision
  body: "Closing this as superseded rather than spending a gate on it, and deliberately\
    \ **not** running the finish this run's prompt names.\n\n**Why the finish would\
    \ prove nothing from here.** `dispatch_after_escalation` short-circuits on a live\
    \ run: `src/agentjobs/dispatch/finish.py:2470` returns `reason=\"live_run\"` whenever\
    \ a live run already holds the task, because a run finishing itself *is* the agent\
    \ the escalation is addressed to. `run_e7b3f8bd` is that run \u2014 `/api/runs/live`\
    \ showed it as the sole occupant of task-347 \u2014 and the per-task run lock\
    \ is mine too (`guards.py`, `LiveRunExistsError`). So a finish started from this\
    \ session **cannot** start a repair run whatever the gate does. It would have\
    \ burned a full gate to observe the one branch ac-5 is not about. The prompt's\
    \ finish instruction assumes a branch worth merging; this one was built never\
    \ to merge.\n\n**Why Jeff could not click Approve \u2014 the thing he actually\
    \ hit.** Entry 7 handed to `human`/`decision` with a prompt saying \"click Approve\"\
    . `frontend/src/components/TaskDetail.tsx:165` returns `primary: null` for `decision`\
    \ and `input`, offering only \"\u270E Answer Questions\". That is deliberate,\
    \ from task-077: approve writes a fixed merge clearance, and offering it on a\
    \ task holding open questions once had him asking whether clicking it answered\
    \ them. **The UI was right and the handoff was wrong** \u2014 an instruction to\
    \ Approve requires `human`/`review`. Nothing to fix in the code, and no task filed.\n\
    \n**Rejected alternative:** hand back at `human`/`review` so Approve appears,\
    \ and let him spend the click. Rejected because that click buys a weaker copy\
    \ of evidence that already exists (entry 11) and costs a gate, a spawned run to\
    \ stop, and cleanup afterwards.\n\n**Cleanup done in the shared clone:** worktree\
    \ `../worktrees/agentjobs-347` removed and branch `chore/task-347-escalation-rehearsal`\
    \ deleted with `-D` (never merged, by design \u2014 it carried `tests/test_task_347_rehearsal.py`,\
    \ which was written to fail). `git worktree list` and `git branch --list` are\
    \ clean of 347. task-340's ac-5 is marked met with the citation in entry 11."
