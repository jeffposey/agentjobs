spec:
  summary: When the gate goes red and main has moved since the rebase, the red may
    belong to the old base rather than to the branch. Re-rebase once, re-run only
    the stage that failed, and only when gate_scope classifies every moved path. Escalate
    if it is still red.
  intent: Two red gates in 24 hours were caused by task records on main that main
    had already fixed. Both cost a human review cycle and an agent run to repair a
    branch that was never broken. The cheapest correct answer spends no tokens at
    all.
  description: '**The evidence, both from 2026-09-05.**


    1. task-337: the finish rebased, the gate went red on `tests/test_validate.py::TestRealCorpus`,
    and the cause was task-339.yaml carrying an absolute path. main had already fixed
    it (5051c15) *after* the finish rebased. The branch was fine.

    2. task-340''s own first gate: red on `test_task_corpus.py::test_agentjobs_context_paths_exist`,
    because task-341 and task-342 had been created through the API and never committed.
    Again nothing to do with the branch.


    **The mechanism already exists.** `catch_up` handles the neighbouring case --
    the base moving *during* a green gate -- by rebasing onto the moved base and re-running
    only what `gate_scope` says the moved paths can reach, with a default-deny table
    and a bounded round count. This asks for the same judgement applied to a *red*
    result.


    **The design question, and it is the whole task.** "Re-run a failed gate" is one
    wording away from "retry until green", which is how a gate stops meaning anything.
    Whatever ships has to be defensible to a third party, so decide and record:


    - **Bound it at one attempt**, not a round count. A second red is a red.

    - **Only when `gate_scope` classifies every moved path**, exactly as `catch_up`
    already refuses an unclassifiable move.

    - **Only re-run the stage that failed**, and re-run it whole -- never a narrower
    selection within it.

    - **The record has to say it happened**: which stage, which commit range moved,
    and that the green being merged on is a second attempt. A merge whose gate went
    red once and was retried must not read like a clean first pass.

    - Decide whether a red stage whose *own* inputs are untouched by the move should
    skip the retry entirely, since the move demonstrably cannot explain it.


    **Cost.** A genuinely red branch pays one extra run of one stage before it escalates
    -- up to about four minutes for pytest under load. Weigh that against a human
    review cycle plus a repair run, which is what both incidents above cost.


    **Provenance.** Raised as a question on task-340 and deliberately kept out of
    it so the dispatch change was not held on it. Jeff''s answer, 2026-09-05: *"I
    don''t know, you decide."* Filed on that delegation.'
