spec:
  summary: A task with a live run still shows Dispatch as a primary, enabled action.
    Clicking it is refused with LiveRunExistsError every time. The control should
    say a run is live and offer to open or stop it instead.
  intent: An affordance that cannot succeed is worse than no affordance. It teaches
    the person that AgentJobs errors at random, when in fact the system was right
    and the button was lying.
  description: '**Observed by Jeff, 2026-09-05.** He answered the open question on
    task-340 from the task page, which moved the ball to `agent`/`answer`, then clicked
    Dispatch and got an error. The error was correct: `run_7f8b8193` was live on task-340
    at that moment, and `dispatch_task` enforces one live run per task (`LiveRunExistsError`).
    Nothing was broken except the button.


    His words: *"that''s why it should be clear and not have a brightly lit dispatch
    button, don''t you think?"*


    **Why the existing surface does not cover it.** task-328 built the machine-wide
    live-run view -- the Runs tab and its count badge. That answers "what is running
    right now" for the machine. It does not answer "is something running on *this*
    task", which is the question the button implicitly claims to have answered by
    being enabled. The badge said `Runs 1` on the same screen and the button was still
    lit.


    **What to change.**


    - The task page already knows, or can ask, whether a live run exists for this
    task. Where one does, Dispatch is not the action: name the run and offer what
    is actually useful -- open it, and stop it.

    - Same treatment for a task holding a live *finish*: `read_finish_status` already
    reports `live` and `INTERRUPTED`, so the page can distinguish "a finish is working"
    from "a finish died" rather than inviting a dispatch into either.

    - Do not merely disable the button. A greyed control with no explanation is the
    same failure one step quieter; the page should say which run holds the task.

    - Check the other entry points for the same shape -- the Dispatch tab and any
    per-row action -- and decide whether they need the same treatment or whether refusing
    there is fine because the person chose a task from a list rather than being handed
    a button on the one they were reading.


    **Do not weaken the refusal.** One live run per task is the invariant that stops
    two agents editing one repository with one task record. This is entirely about
    what the page offers, not about what the server permits.'
