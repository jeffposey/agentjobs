spec:
  summary: 'Jeff, reviewing task-092 on 2026-09-05: with `max_concurrent_runs: 1`
    the board draws one full-width cell for one task, and most of that width is empty.
    The "why this one first" expander barely fills it. Find a layout for the one-slot
    board that earns its space, without changing what the board says.'
  intent: 'Task-092 decided (log entry 13) that a one-slot board is a panel and a
    panel is full width, because a single card at a third of the panel with two thirds
    of empty card beside it "reads as a board that failed to load". Full width fixed
    that and created this: a card whose content is sized for a third of the page,
    stretched across all of it. Jeff saw it in the `--ceiling 1` sandbox and called
    it a waste of space. He chose to merge task-092 and file this rather than hold
    the merge for one ceiling value.'
  description: 'Look at `scripts/slot_board_sandbox.py 8920 --idle --ceiling 1` in
    the worktree once task-092 has merged, or on `main` after it. The one-slot board
    is `SlotBoard.tsx` with `boardColumns()` returning 1.


    Options worth trying, none of them decided:


    - Let the single cell use its width: put the task''s summary and the why-this-one
    disclosure beside the title and the Dispatch button rather than under them, so
    the card is one or two lines tall instead of a stack.

    - Cap the cell''s width at what a one-column card needs and use the rest for the
    queue behind it, since a one-slot machine still gets a three-task preview (task-092
    made `QUEUE_PREVIEW_LIMIT` a floor for exactly this reason). The board would then
    read "this one next, and here is what follows".

    - Something else that survives being looked at on a 390px phone, where full width
    is already correct and the problem does not exist.


    Whatever lands, seed it in the sandbox at ceiling 1 and ceiling 3 side by side
    so Jeff can compare, per the review-server rule.'
  constraints: '- Do not change the board''s content or its rules: cell count from
    `GET /api/runs/live`, occupied first in start order, the alarm withholding buttons.
    This is layout at one ceiling value only.

    - Ceilings of 2 and above must render exactly as they do after task-092. Pin that
    in `SlotBoard.test.tsx`.

    - Task-294 owns the Dashboard''s one-viewport geometry. Coordinate rather than
    duplicate: if 294 has landed, its measurements bound this; if it has not, record
    the ceiling-1 height here for it.

    - Sandbox on its own port with throwaway data before the handoff; Jeff reviews
    in a browser.'
  out_of_scope: '- The ceiling control (task-344).

    - The board''s behaviour at 2 or more cells, at the six-cell bound, or when dispatch
    is unconfigured.

    - Restyling beyond what the one-cell layout needs.'
  context:
  - path: frontend/src/components/SlotBoard.tsx
    why: '`boardColumns()` and the cell layout. The one-column case is what changes.'
  - path: scripts/slot_board_sandbox.py
