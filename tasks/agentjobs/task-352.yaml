spec:
  summary: 'While task-092''s scripted finish was running its gate, the Runs badge
    said 0, the Runs page said "Nothing is running on this machine right now", and
    the finish sat in a footnote. Jeff, 2026-09-06: that is terrible. A finish is
    work happening on the machine and must show as one.'
  intent: The surface that answers "what is running on this machine" must never say
    nothing while a five-minute gate is running for a task.
  description: 'Observed 2026-09-06 03:55 UTC, on the live dashboard at :8876, with
    fin_fb600ff5 (task-092) in the gate and fin_e47790de (task-341) queued on the
    runway: `GET /api/runs/live` returned `occupied: 0`, `runs: []`, and both finishes
    only under `holders`. The Runs nav badge rendered 0, the Runs page header said
    "0 of 3 slots busy" and its Runs section said "Nothing is running on this machine
    right now"; the two finishes were listed under "Also on this machine". task-092''s
    own slot board (merged e06b356) keeps that design: finishes go in a strip under
    the board, never in a cell.


    Fix, on the machine-wide surface (task-328) and the slot board (task-092):


    - The nav badge counts what is running on the machine: dispatched runs plus finishes
    in progress. The runway holder is the same finish''s lock and is never counted
    separately.

    - The Runs page lists a finish in the Runs table beside the dispatched runs, linked
    to its task, with its state (the finish step: rebase, gate, merge, runway-queued)
    and its elapsed time. The "Nothing is running" message appears only when neither
    runs nor finishes exist.

    - The capacity sentence keeps the slot count (it must agree with dispatch/guards.py)
    but says when merges are in progress too, so "0 of 3 slots busy" never stands
    alone while a gate is running.

    - The slot board shows a finish as a card in the board, labelled as a finish,
    rather than as a footnote. `occupied` still counts slots exactly as the guard
    does; the board''s card count and queue preview must not lose a dispatchable free
    cell because a finish occupies a visual card.

    - The backend keeps `occupied` unchanged. Add whatever the frontend needs to render
    a finish as a run row honestly (health-like state, elapsed, task link) without
    pretending it is a dispatched run.'
  constraints: '`occupied` stays exactly `len(live_runs(home))` so this surface and
    a refused dispatch never disagree. Do not touch the finisher or the ledger''s
    lock semantics.'
  out_of_scope: Cancelling a finish from the Runs page. Changing how the guard counts
    slots.
  context:
  - path: src/agentjobs/api/routes/runs.py
    why: The live-runs endpoint; holders vs runs is decided here.
  - path: frontend/src/components/LiveRuns.tsx
    why: The badge, capacity sentence and Runs page.
  - path: frontend/src/components/SlotBoard.tsx
    why: The Dashboard board, merged in task-092; HoldersStrip is the footnote.
  - path: tests/test_live_runs_api.py
    why: Backend tests for the endpoint.
  - path: frontend/src/components/LiveRuns.test.tsx
    why: Frontend tests for the surfaces.
