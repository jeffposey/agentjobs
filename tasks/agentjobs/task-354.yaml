- id: 4
  ts: '2026-09-06T04:55:11.217610Z'
  actor: claude
  type: progress
  body: 'Branch `feat/task-354-interactive-session-runs` at fc44c1f in C:/projects/worktrees/agentjobs-354,
    rebased onto main after task-352 merged. Full gate running.


    Built, as decided in entry 3:


    - `session_identity.py`: `SessionIdentity.from_environment` reads `CLAUDE_CODE_SESSION_ID`,
    and answers None inside a dispatched run (that session already has a record).

    - `dispatch/interactive.py`: `start_interactive_run` (called by the claim), `settle_for_task`
    (called after handoff/release/close), `sweep_interactive_runs` (called by the
    poller). The sweep reads the *project''s own* runner ledger, not a default `claude`,
    and `runner.ledger(scoped=False)` drops `--cwd` so a session working from a worktree
    is still found.

    - Ledger: `mode: interactive`, `cwd` and `origin` on RunRecord; `slot_runs()`;
    `conclude_interactive()` which never writes to the task; health `idle` from the
    transcript''s mtime past ten minutes; cancel and `stop_everything` close the record
    and leave the session alone; reconcile checks presence only.

    - Guards: the concurrency count uses `takes_slot`, the per-task check is unchanged
    and its refusal now names an interactive holder.

    - Claim route takes `session_id`/`session_cwd`; handoff, release and close settle.
    The Python client fills both from the environment by default.

    - Registration adopts an interactive session instead of refusing it, as an interactive
    run.

    - Frontend: `runKindLabel` ("your session"), health word `idle`, board draws it
    as an extra card without taking a free cell, and the Dispatch panel withholds
    the button with a status note when any run for the task is live.


    Verified: 27 new backend tests (test_interactive_runs.py, test_interactive_claim_api.py),
    99 in the two frontend suites, black/ruff/mypy/oxlint/vitest/build green. Seen
    working in the sandbox on port 8910 (`--attended`): board card, three free cells
    still dispatchable, no Dispatch button on the task, and the session''s own transcript
    in the Runs panel.


    Decision, recorded because it changes an existing rule: `registration.SessionInteractiveError`
    is no longer raised, and its test now asserts adoption. The refusal existed because
    the poller would stop such a session; a mode the poller cannot act on removes
    the reason.'
