- id: 3
  ts: '2026-09-06T04:31:31.953031Z'
  actor: claude
  type: decision
  body: 'Design for interactive runs, decided after reading registration.py, poller.py,
    ledger.py, guards.py and the claim route.


    1. The claim writes the run record. `POST /tasks/{id}/claim` gains optional `session_id`
    (the driver''s full session uuid) and `session_cwd`. The MCP server and the CLI
    fill both from their own environment (Claude Code publishes `CLAUDE_CODE_SESSION_ID`;
    the process cwd is the root it was launched in), so every session that claims
    through either is visible with no extra step. A claim with no session identity,
    or by a human actor, writes no run. Rejected: an explicit register step, because
    ALLAGENTS.md already tells every session to register and this very session could
    not (refused `session_unknown`, then would have been refused `session_interactive`);
    a step agents must remember is a step half of them skip. `agentjobs run register`
    stays for background sessions, and now adopts an interactive one through the same
    code instead of refusing it.


    2. Mode `interactive` (new DispatchMode value). Record: status running, session_id
    = full uuid, cwd, driver, origin `claimed` or `registered`, no pid, no posture.
    Ended by: handoff, release or close of the task (any actor, through the API routes
    and the CLI verbs), which concludes the record `completed`; or the session disappearing
    from the driver''s ledger, which the poller and startup reconcile detect by sessionId
    and conclude `session_ended`. Rejected: ending it only at restart, because a session
    Jeff closed at lunch would show as working until the next restart.


    3. Never parked, stopped or settled. `poll_live_sessions` only ever applies the
    session protections to mode `session`; an interactive record gets a presence check
    and nothing else, and nothing writes onto the task. Cancelling an interactive
    run from the GUI concludes the record and never calls the driver''s stop. The
    registration module''s reason for refusing interactive sessions was exactly that
    the poller would stop one; with a mode the poller cannot stop, the reason is gone.


    4. Slots. An interactive run does not occupy a slot: the concurrency limit exists
    to stop a click starting an agent the machine cannot afford, and a session Jeff
    is typing into is not that. `slot_runs(home)` = live runs minus interactive; the
    guard''s concurrency count and `occupied` on GET /api/runs/live both use it, so
    they still agree. The per-task "one live run" check stays inclusive, so Dispatch
    on a task an interactive session holds is refused `live_run_exists` -- which is
    the fix for the Dispatch button in the common case.


    5. Health for an interactive run: `working` if its transcript file changed in
    the last ten minutes, else `idle` (new health word). Read off the transcript''s
    mtime, which is what the task page already reads to show the log.


    6. GUI: the badge and Runs tab count and list it (it is in `runs`), labelled interactive;
    the slot board draws it as a card outside the slot cells, the way task-352 draws
    a finish; the task page lists it in the Runs panel with its transcript, and shows
    Dispatch disabled with the live-run reason. An active task with an owner and no
    live run at all gets a "Dispatch anyway" button that says the task is claimed
    with nothing running it.'
