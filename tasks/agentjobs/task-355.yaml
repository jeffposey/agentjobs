  type: progress
  body: 'End-to-end check of task-354''s merge, run from an interactive Claude Code
    desktop session (id c9e02370) against the live server on 8876 at commit 8f88cb4c.
    Jeff''s test, in his words: "the test is that something shows up at all, which
    is not really tested by a staged sandbox." He was right to insist on it -- the
    sandbox passed and two of the three real paths do not.


    Works: a claim that carries `session_id` writes the interactive run and every
    surface shows it. `POST /api/tasks/task-355/claim` with `session_id` and `session_cwd`
    produced run_2118273c, mode `interactive`, health `working`. The dashboard draws
    a green "Working" card labelled "your session" naming the task, the Runs badge
    reads 1, and the slot board still reads "0 of 3 slots busy" with all three cells
    offering Dispatch. That is exactly the design in task-354''s entry 3, item 4:
    an interactive run is visible without taking a slot.


    Does not work, and both are how a person actually reaches this:


    1. **Claiming over MCP writes no run.** `mcp__agentjobs__task_claim` on this same
    task, from this same session, produced `runs: []`. The route is correct -- `api/routes/status.py::claim_task`
    writes the record when `payload.session_id` is present -- and `client.claim()`
    fills it from `SessionIdentity.from_environment()`. The MCP server is a separate,
    long-lived process that does not carry this session''s `CLAUDE_CODE_SESSION_ID`,
    and cannot: it serves many sessions and the tool schema has no session field.
    Note `client.claim_task()` (the older method at client.py:535) also sends only
    `{"agent": agent}`, so any caller on that path is invisible too. The session id
    has to travel in the request rather than be read from the server''s environment.


    2. **`agentjobs run register` still refuses a desktop session.** `agentjobs run
    register --task task-355 --project agentjobs` from this session: `Refused (session_unknown):
    No live session c9e02370 under C:\projects\agentjobs`, listing six other sessions.
    task-354 removed the `session_interactive` refusal but not this one, and its own
    spec said so: "the first refusal is not even reached for the way Jeff most often
    works." ALLAGENTS.md still instructs every session to register.


    So task-354''s `visible` acceptance criterion holds for a direct API caller and
    fails for both documented agent paths. Suggest a follow-up task rather than reopening
    354; the merge is sound, the seam is incomplete.


    This session is currently holding task-355 with a live interactive run so Jeff
    can see the card. Release it when he has looked.'
