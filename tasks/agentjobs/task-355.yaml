spec:
  summary: Jeff approved task-354 in the web UI and nothing merged. Its branches[]
    was empty, so the scripted finish was never a candidate, and the GUI gave no sign
    the click would not merge.
  intent: Approving work in the GUI either merges it or says why it did not.
  description: 'Observed 2026-09-06 05:08 UTC on the live dashboard, by Jeff, on task-354.


    What happened: task-354 was handed off for review with a green gate. Jeff clicked
    Approve. The record shows `Approved by Jeff Posey through the web UI` and the
    ball moving to `agent`/`work` with a prompt reading "Approved -- cleared to merge.
    Rebase onto main, merge --no-ff ... No merge has happened yet: the UI records
    approval, it does not run git." Main did not move. No finish entry was written.
    Jeff''s words: "I just clicked finish and that .... oh.... I have no idea whats
    going on now."


    Cause, in two halves.


    1. **`branches[]` was empty.** The session that worked task-354 took a worktree
    and a branch but never recorded it on the task. ENGINEERING.md requires the branch
    to be recorded "as part of the same update that sets in_progress", and nothing
    enforces it. Running `agentjobs finish task-354 --project agentjobs` by hand then
    exits `declined (no_active_branch)` with "task-354 lists no active branch, so
    there is nothing to merge." Adding the branch through `task_update_content` and
    re-running finished normally: merged as 848be879, gate green in 339.8s, verified
    live.


    2. **The human is told nothing.** `finish=on` for this project, so a click on
    Approve is supposed to rebase, gate, merge, rebuild, restart and close. When the
    task is not a finish candidate the click instead becomes a plain handoff to an
    agent, and the person who clicked sees an approval that appears to have worked.
    The prompt written is addressed to an agent, and where no agent is running, nothing
    reads it. That is indistinguishable from a merge in progress.


    What "done" looks like:


    - A task handed off for review with no active branch is caught before the human
    is offered an Approve button that will not merge, or the button says plainly what
    it will do instead.

    - After an Approve that cannot run the finish, the GUI says so on the task, naming
    the reason, rather than only writing an agent-addressed prompt.

    - Recording the branch is enforced or automatic rather than a step an agent is
    asked to remember. Consider deriving it at claim time, the way task-354 made the
    claim write the run record.


    Worth checking whether other closed tasks have an empty `branches[]`; the run
    report for the last 7 days already shows one finish `declined (never a candidate;
    nothing was done)`.'
  constraints: Do not weaken who authorises a merge. This is about telling the human
    what their click did, not about merging more freely.
  context:
  - path: src/agentjobs/dispatch/finish.py
    why: Where no_active_branch is decided and the finish declines.
  - path: src/agentjobs/api/routes/tasks.py
    why: The approval route that writes the agent-addressed prompt instead of running
      the finish.
  - path: frontend/src/components/DispatchPanel.tsx
    why: The Approve button and what it tells the human afterwards.
  - path: ENGINEERING.md
    why: Requires branches[] to be recorded at claim time; nothing enforces it.
