- id: 6
  ts: '2026-09-06T10:48:04.075437Z'
  actor: claude
  type: decision
  body: "The search box stays visible on the header line; the three selects go behind\
    \ the button.\n\nThe spec named this the one open question and gave the default\
    \ answer. Measurement\nsupports it rather than merely permitting it, so it is\
    \ taken as decided:\n\n- Typing to find a task is the frequent gesture. A `?q=`\
    \ is in most of the URLs this\n  list is reached by, where `status`/`priority`/`scope`\
    \ sit at their defaults on almost\n  every visit. Putting search behind a click\
    \ would tax the common case to save space\n  spent on the rare one.\n- The column\
    \ holds both. At the sidebar's 320px floor the header line is one 44px row:\n\
    \  a flexed `min-w-0 flex-1` input beside a shrink-0 button. Nothing was shrunk\
    \ to fit --\n  the input keeps its `touch-target` height and the button keeps\
    \ a 44px hit box, so the\n  \"shrink both until neither works\" failure the spec\
    \ warned about does not arise and the\n  question of which gives way never had\
    \ to be answered.\n\n**Rejected: search inside the popover too.** It would make\
    \ the button the single entry\npoint, which is tidier, and it is what a 220px\
    \ column would force. It loses the thing\nthe list is used for -- a reader who\
    \ knows the task id types it, and behind a click that\nis two gestures and a lost\
    \ focus. The reopen trigger is a real column narrower than\nabout 260px, which\
    \ this layout does not currently produce.\n\n**Rejected: counting the search in\
    \ the button's badge.** The search box is on screen\nwith its own text in it,\
    \ so the badge would be lighting up for a filter the reader can\nalready read.\
    \ An indicator that fires on things you can see is one people stop reading,\n\
    which would cost the one case that matters -- a filtered list that looks empty.\
    \ `Clear\nall filters` does clear the search, because a \"clear\" that leaves\
    \ the list still hiding\nmost of it would be the same defect wearing a different\
    \ hat."
  data:
