spec:
  summary: The Tasks surface carries a permanent four-control filter panel above the
    list. It becomes a popover opened from a filter icon button, which shows when
    a filter is actually set.
  description: "## What is there now\n\n`frontend/src/components/TaskList.tsx:427-449`\
    \ renders a `<section aria-label=\"Task\nfilters\">` holding four controls that\
    \ are always on screen: a search box, and `status`,\n`priority` and `scope` selects.\
    \ It is a bordered card above the list, present on every\nvisit, whether or not\
    \ anything is filtered.\n\nThree costs, and the third is what makes this part\
    \ of task-235 rather than a nicety:\n\n1. **It is permanently spending vertical\
    \ space on a control you touch rarely.** The\n   defaults (`status=open`, `priority=all`,\
    \ `scope=all`) are what almost every visit\n   uses.\n2. **On a phone it is most\
    \ of the first screen**, above any task.\n3. **In the sidebar it does not fit\
    \ at all.** task-237 puts the list in a ~320-400px\n   column. Four stacked full-width\
    \ controls at the top of that column push the first\n   task row below the fold,\
    \ which is the opposite of what the sidebar is for.\n\n## The change\n\n**A filter\
    \ icon button in the list column's header opens the controls in a popover**;\n\
    they are not rendered inline. Jeff asked for this directly on 2026-09-06, in the\
    \ same\nbreath as the sidebar \u2014 it is the same complaint about spent space.\n\
    \n- **The button says whether anything is filtered.** A filter set to something\
    \ other than\n  its default has to be visible without opening the popover \u2014\
    \ a dot, a count of active\n  filters, or the values themselves if they fit. Otherwise\
    \ a list quietly hiding two\n  thirds of the backlog looks like an empty backlog,\
    \ which is a worse defect than the one\n  being fixed.\n- **A way to clear back\
    \ to the defaults**, from the popover, in one gesture.\n- **The URL stays the\
    \ source of truth.** `filterValue()` reads `status`, `priority` and\n  `scope`\
    \ from `URLSearchParams` and `updateParam` writes them; a pasted filtered URL\
    \ must\n  still arrive filtered, with the button showing it.\n- **The search box\
    \ is the one open question.** Typing to find a task is a far more\n  frequent\
    \ gesture than changing a select, so the default answer is: search stays visible\n\
    \  as a slim input in the column header, the three selects go behind the button.\
    \ If the\n  column is too narrow to hold both a search input and the button, decide\
    \ which gives way\n  and record the reasoning as a `decision` \u2014 do not shrink\
    \ both until neither works.\n- **It applies at every width**, not only in the\
    \ sidebar. The permanent panel is wrong on\n  the phone for the same reason.\n\
    \n## Mechanics that will bite\n\n- **No new dependency.** There is no popover\
    \ library in this app and this does not justify\n  adding one; a positioned element\
    \ with focus management is enough.\n- **Escape closes it, focus returns to the\
    \ button, and a click outside closes it.** These\n  are the three things a hand-rolled\
    \ popover forgets.\n- **`aria-expanded` on the button and a labelled dialog or\
    \ group**, so the state is\n  announced. The existing controls already carry `sr-only`\
    \ labels \u2014 keep them.\n- **The existing tests reach these controls by `aria-label`**\
    \ (`Status`, `Priority`,\n  `Scope`). They will now need the popover opened first.\
    \ Update them rather than deleting\n  them, and add one that fails if a non-default\
    \ filter leaves no visible trace on the\n  closed button.\n"
  constraints: "- Take a worktree and bootstrap it (`python scripts/bootstrap.py`)\
    \ before anything else.\n- Every filter reachable today stays reachable, and the\
    \ URL parameters keep their current\n  names and values so existing links do not\
    \ break.\n- No new npm dependency for the popover.\n- Keyboard and screen-reader\
    \ parity with the inline controls: open, change, close, and\n  know from the closed\
    \ button that something is filtered.\n- The popover behaves at phone width too\
    \ \u2014 it must not open off-screen or under the\n  header.\n- `scripts/check.py`\
    \ green before the handoff, run once on the rebased branch."
  out_of_scope: "- New filters. This moves the four controls that exist; adding a\
    \ difficulty filter is\n  task-156's job.\n- Saved or named filter sets.\n- Changing\
    \ what the default filter is.\n- The sidebar's tree, selection and keyboard movement\
    \ \u2014 task-238.\n- The detail panel \u2014 task-239."
  context:
  - path: frontend/src/components/TaskList.tsx
    why: Lines 427-449 are the filter section being replaced; filterValue() at 172
      and updateParam are how the URL parameters are read and written.
  - path: frontend/src/components/TaskList.test.tsx
    why: The existing tests reach the selects by aria-label and will need to open
      the popover first.
  - path: frontend/src/components/IssueReporter.tsx
    why: 'The app''s existing hand-rolled overlay: prior art for focus handling and
      dismissal rather than a new dependency.'
