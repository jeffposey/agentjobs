spec:
  summary: 'The hands-on half of task-294: bound the Dashboard to a viewport-height
    frame, decide what earns a place on it, and prove by measured geometry that it
    never scrolls.'
  intent: "A dashboard is a glance, not a document. If it scrolls, the part below\
    \ the fold is doing none of the work a dashboard exists to do while still costing\
    \ the space it occupies \u2014 so a scrolling dashboard is really a short dashboard\
    \ with an unread appendix. Deciding what fits is the valuable half; the layout\
    \ is the easy half.\n\nThis is where the worktree, the branch and the Playwright\
    \ assertions live. task-294 above it is a supervisor's seat and writes no code."
  description: "## Where this came from\n\nJeff, on task-292, 2026-08-23: *\"Dashboard\
    \ is its own thing, goal with it is to NOT involve any scrolling at all.\"* Said\
    \ in passing while answering a question about the header, and filed as task-294\
    \ rather than folded into that task, which is about the top bar on every surface.\n\
    \n**This task is task-294's child and carries the whole of its original hands-on\
    \ scope**, unchanged. task-294 became an umbrella on 2026-09-06 so that the sibling\
    \ tasks which change *what has to fit* \u2014 task-212, task-344 \u2014 sit under\
    \ one roof with it; the umbrella supervises and this task does the work. If you\
    \ are reading only one of the two, read this one.\n\n## Two halves, and the second\
    \ is the interesting one\n\n**The mechanical half.** `frontend/src/App.tsx` renders\
    \ the shell as `flex min-h-screen flex-col` with `<main>` in the normal flow,\
    \ so the **document** scrolls. A surface that must not scroll wants the opposite:\
    \ a frame of exactly the viewport height, with the scroll \u2014 where there is\
    \ any \u2014 living inside a region rather than on the page.\n\n```\n<div className=\"\
    flex h-dvh flex-col\">        {/* the frame, exactly one viewport */}\n  <header\
    \ \u2026 />                                {/* fixed height, no sticky needed\
    \ */}\n  <main className=\"min-h-0 flex-1 overflow-y-auto\">\u2026</main>\n  <footer\
    \ \u2026 />\n</div>\n```\n\n`dvh` rather than `vh` deliberately: `100vh` on a\
    \ mobile browser is the height *without* the retracting URL bar, so a `100vh`\
    \ frame is taller than the visible viewport on a phone and the page scrolls by\
    \ exactly the bar's height \u2014 the classic version of this bug.\n\n**This structure\
    \ was considered and deliberately rejected by task-292**, whose decision entry\
    \ records why. It is the better long-term shape \u2014 it would pin the header\
    \ with no `sticky` and no z-index, and hand task-237 its non-scrolling Tasks page\
    \ \u2014 but it has a cost that belongs in *this* task's scope rather than a header\
    \ task's:\n\n> `frontend/src/components/dragAutoScroll.ts` scrolls the backlog\
    \ during a drag with `window.scrollBy`, which becomes a no-op the moment the document\
    \ stops being the scroller.\n\nDrag-to-reorder has already cost task-207, task-225\
    \ and task-229. The helper is already dependency-injected (`scrollBy`, `viewportHeight`\
    \ are both `DragAutoScrollDeps` fields), so pointing it at a scroll container\
    \ instead of the window is a small change \u2014 but it must be **verified by\
    \ a hand on a real mouse**, not by Playwright, for the reason task-225 records.\
    \ Budget for that, or scope the frame to the Dashboard alone and leave the other\
    \ surfaces on document scroll.\n\nWhich of those two you do is a decision to take\
    \ and record: a frame for the whole app, or a frame for one surface.\n\n## The\
    \ half that is a real decision: what fits\n\nAt 844px of phone height, minus a\
    \ 65px pinned header and a footer, there is not much. So this task cannot be done\
    \ without deciding what the Dashboard is *for* and cutting what does not serve\
    \ it. Read these before deciding:\n\n- **task-092** is **settled and closed**\
    \ as of 2026-09-05: the Dashboard is a slot board of one card per concurrent run.\
    \ That is the thing that has to fit, and it changes the answer \u2014 read it\
    \ first, not last.\n- **task-212** (sibling) moves the count tiles off the Dashboard\
    \ onto an analytics page. If that lands first, most of the fitting problem is\
    \ already solved and this task is small. It is a sibling rather than a prerequisite\
    \ because either order works; **state which world this landed in.**\n- **task-344**\
    \ (sibling) makes `max_concurrent_runs` settable from the browser, so the number\
    \ of cards on the board is a value a person can change after this ships. The frame\
    \ has to survive that.\n- **task-081** built the next-action panel that is the\
    \ Dashboard's centre of gravity.\n\nState plainly what is dropped, moved or collapsed,\
    \ and where it went. A Dashboard that fits because something important was quietly\
    \ deleted is not the goal.\n\n## What \"never scrolls\" has to mean to be testable\n\
    \nNot \"usually fits on Jeff's monitor\". Name the viewports it must fit and assert\
    \ on rendered geometry, in Playwright \u2014 `document.documentElement.scrollHeight\
    \ <= window.innerHeight`, at each. A phone in **landscape** is the hard case:\
    \ ~400px tall, which is where a design that fits a 844px portrait phone and a\
    \ 800px desktop still fails.\n\nDecide and record whether landscape phone is in\
    \ or out. If it is out, say what happens there instead \u2014 a scrolling fallback\
    \ is a legitimate answer, an unreadable clipped panel is not."
  constraints: "- Frontend only. No API, schema or CLI change.\n- No new npm dependency;\
    \ Tailwind's flex and overflow utilities are enough.\n- The header stays pinned\
    \ and stays one row (task-292). If this task adopts the non-scrolling frame, `sticky\
    \ top-0` becomes redundant on that surface \u2014 remove it only if it is removed\
    \ coherently, and never at the cost of the pin on the surfaces that still scroll.\n\
    - If the document stops being the scroll container on any surface that renders\
    \ `TaskList`, `dragAutoScroll.ts` moves with it and drag-to-reorder is re-verified\
    \ by a person's hand on a real mouse \u2014 task-225, task-229.\n- `100dvh`, never\
    \ `100vh`, for any full-viewport frame.\n- Nothing currently reachable from the\
    \ Dashboard may become unreachable. Count what is there before and after, and\
    \ put both counts in the record.\n- Acceptance asserts measured geometry at named\
    \ viewports, never the presence of a class \u2014 ENGINEERING.md, Verification.\n\
    - Take a worktree and bootstrap it before anything else; `scripts/check.py` green\
    \ with no arguments before the handoff.\n- Jeff drives it in a browser on his\
    \ own screen before it merges. Sandbox on its own port with seeded throwaway data,\
    \ per the standing UI-review rule.\n- Log the outcome onto this task, not onto\
    \ task-294. The parent closes on this task's evidence."
  out_of_scope: "- The Tasks, Create, Dispatch and Playbooks surfaces. They may scroll;\
    \ only the Dashboard is being bounded. If the app-wide frame is the chosen route,\
    \ those surfaces keep an internal scroll region and their behaviour is unchanged\
    \ to a user.\n- The analytics page itself \u2014 task-212 and task-213.\n- Re-deciding\
    \ the slot board's contents beyond what fitting forces \u2014 task-092 settled\
    \ that and its decisions are binding.\n- Making `max_concurrent_runs` settable\
    \ \u2014 task-344.\n- The header's contents or breakpoint \u2014 task-292 settled\
    \ those, task-167/task-168 own what is in it.\n- Visual restyling: colours, typography,\
    \ the spacing scale.\n- The Tasks surface's two-region shell \u2014 task-235's\
    \ children."
  context:
  - path: frontend/src/App.tsx
    why: The shell (`flex min-h-screen flex-col`) that makes the document the scroll
      container, and `DashboardPage`, the surface being bounded.
  - path: frontend/src/components/dragAutoScroll.ts
    why: Scrolls with `window.scrollBy`, so it breaks silently if the document stops
      being the scroller. Already dependency-injected, which is what makes the fix
      small.
  - path: tasks/agentjobs/task-092-dashboard-design-pass.yaml
    why: 'Closed 2026-09-05 and binding: the Dashboard is a slot board of one card
      per concurrent run. That is what has to fit.'
  - path: tasks/agentjobs/task-212.yaml
    why: Sibling. Moves the count tiles off the Dashboard. If it lands first, most
      of the fitting problem is solved before this starts.
  - path: tasks/agentjobs/task-292.yaml
    why: Its decision entry records why the non-scrolling frame was rejected there
      and left for this task, and the measurement of what the header costs in height.
  - path: tasks/agentjobs/task-225.yaml
    why: Why drag-to-reorder is re-verified by a person rather than by an automation
      tool.
acceptance:
- id: ac-1
  text: "At each named viewport, the Dashboard's `document.documentElement.scrollHeight`\
    \ is less than or equal to `window.innerHeight` \u2014 measured in Playwright,\
    \ not asserted from a class name."
  status: pending
- id: ac-2
  text: The named viewports include a phone portrait (390x844) and a desktop (1280x800)
    at minimum, and the record states explicitly whether phone landscape (~844x390)
    is in scope and what happens there if it is not.
  status: pending
- id: ac-3
  text: A decision entry states whether the non-scrolling frame was applied to the
    whole app shell or to the Dashboard alone, with the rejected alternative and the
    reasoning.
  status: pending
- id: ac-4
  text: A decision entry states what was dropped, moved or collapsed to make it fit,
    and where each thing went. Nothing reachable from the Dashboard before is unreachable
    after; both counts are in the record.
  status: pending
- id: ac-5
  text: "The record states which world this landed in with respect to task-212 \u2014\
    \ whether the count tiles were still on the Dashboard when it was bounded."
  status: pending
- id: ac-6
  text: If the scroll container moved on any surface rendering TaskList, drag-to-reorder
    and its edge auto-scroll still work, verified by a person's hand on a real mouse
    and recorded as such.
  status: pending
- id: ac-7
  text: '`scripts/check.py` green with no arguments on a clean tree, and Jeff has
    driven it in a browser on his own screen.'
  status: pending
