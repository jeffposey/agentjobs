  actor: claude
  type: handoff
  body: "## Why the walk stopped, and it is not what the record says\n\ntask-273 is\
    \ built, gated and parked on you. I verified the child's claims rather than relaying\
    \ them: the gate receipt in its worktree names `73e07f92` \u2014 the branch tip\
    \ \u2014 with `basis: null`, so it was a full unqualified gate, not a narrowed\
    \ one. The worktree is clean. Two code commits, 16 files, 4,296 insertions.\n\n\
    **But the child did not park on judgement. It parked because it was never told\
    \ it was autonomous.** Its session was *resumed* (`--resume`, no prompt string)\
    \ rather than started cold, so the only posture clause it ever received was the\
    \ `auto` one from `run_8ad284df`. task-273's own entry 39 asserts \"They chose\
    \ posture `autonomous` for the epic, so this run gets it too\" \u2014 the record\
    \ says one thing, the session was told another, and nothing reported the mismatch.\
    \ The child's \"Nothing merged; posture prompt said hand off\" is correct behaviour,\
    \ not reluctance.\n\nFiled as **task-375** (high, dispatch): a resumed run records\
    \ a posture it never delivers, which silently defeats the epic walk for any child\
    \ whose session gets resumed. The fix is a real fork \u2014 deliver the clause\
    \ into the resumed turn (cheap, but raises a live session's posture mid-flight)\
    \ or refuse to resume across a posture change (safer, loses the context resume\
    \ exists for) \u2014 so I specified it rather than picking.\n\n## What that means\
    \ for your read of task-273\n\nRead entries 42 and 43 as a normal review request,\
    \ not as a child raising an alarm. The one thing it explicitly asks you not to\
    \ take on trust is design change 1: `task_run` is no longer authoritative for\
    \ how a run ended, because two run ids in this corpus each carry two `dispatch_result`\
    \ entries (interrupted at 22:27, completed at 22:31, both true) and a row holds\
    \ one outcome. Dispatch facts still render from the row; results stay on the entry.\n\
    \nWorth knowing before you decide: history fidelity is reported at **84%, not\
    \ the 89% task-213 measured**, and the child reported it as measured rather than\
    \ rounding toward the other task's figure. Four backfill bugs were found and fixed\
    \ getting there, three of which would have shipped silently \u2014 including git\
    \ and the manager writing timestamps in different formats, which would have bucketed\
    \ changes into the wrong day and broken every chart on the analytics page.\n\n\
    ## Mechanics, so the choice is one gesture\n\n`finish=on` for this project, so\
    \ approving task-273 runs the whole merge gate itself \u2014 rebase, full gate,\
    \ `--no-ff`, rebuild, restart, close, worktree and branch cleanup. No agent needed.\
    \ `main` has moved one commit since the branch rebased (`e569b15b`, a task-record\
    \ commit only), so the finish will re-gate on the rebased tree; that is expected,\
    \ not a problem.\n\n**Whichever you pick, this epic needs a fresh dispatch of\
    \ task-358 afterwards.** My session ends here, and task-311 only becomes eligible\
    \ once task-273 closes.\n\n## This parent's own criteria\n\nNone are met yet,\
    \ and ac-2 in particular is mine to verify rather than a child's to claim \u2014\
    \ it wants a live read and write through the UI *and* the CLI with the YAML path\
    \ unavailable, which cannot be true until task-311 has flipped the authority.\
    \ ac-3 and ac-5 (whether task-247 and task-272 survive; what historical coverage\
    \ the store honestly has) are decisions I owe this record, and task-273's entry\
    \ 42 now has most of the evidence for ac-5."
