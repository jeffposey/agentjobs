spec:
  summary: A question can be raised while the ball stays on an agent, so no surface
    ever shows it. And a question is only closed by an entry typed `answer`, so a
    reply logged as a `decision` leaves it open and the human is asked twice.
  intent: 'The loop is broken at both ends. A question written to a task record either
    never reaches the human, or reaches them again after they have answered it.


    The whole argument for putting questions on the record rather than in chat is
    that the human is asked once, sees it on a surface they already read, answers
    once, and the answer is durable. None of those four is currently reliable. Two
    questions sat invisible for weeks; a third was re-asked a day after being answered.'
  description: "## Two defects, one loop\n\n### 1. A question can be raised that nobody\
    \ ever sees\n\nA `question` entry can be appended while `ball: agent` / `ball_reason:\
    \ available`. Nothing moves the ball, flags the task, or counts the question anywhere.\
    \ The question panel only renders when the ball is on a human, so the question\
    \ is written to the record and reaches no one.\n\nTwo live instances, both found\
    \ by grep rather than by any surface, on 2026-09-06:\n\n- **task-063** \u2014\
    \ question raised 2026-08-11, invisible for 26 days.\n- **task-167** \u2014 question\
    \ raised 2026-08-19, invisible for 18 days.\n\nBoth were handed to `human`/`decision`\
    \ by hand in commit `a9ce5c7`. That is a repair, not a fix; the next question\
    \ raised the same way disappears the same way.\n\n### 2. A question can be answered\
    \ and stay open\n\n`Task.open_questions()` in `src/agentjobs/models_v2.py` is\
    \ three lines:\n\n```python\nanswered = {entry.re for entry in self.log if entry.type\
    \ is LogEntryType.ANSWER}\nreturn [e for e in self.log if e.type is LogEntryType.QUESTION\
    \ and e.id not in answered]\n```\n\nOnly `answer` closes a thread. Nothing stops,\
    \ warns about, or notices an entry of any other type threaded to a question with\
    \ `re:`.\n\n**The instance.** task-273 entry 5 was a `question`. Entry 6 was the\
    \ owner's answer, written up by an agent as `type: decision` with `re: 5` \u2014\
    \ correctly threaded, correctly attributed, and invisible to `open_questions()`.\
    \ The question stayed open for a day and the panel kept presenting it. Fixed by\
    \ hand in entry 9 (commit `dbc0efe`); the defect is not.\n\n**Why an agent picks\
    \ `decision`.** It is the honest label for a binding call with a rejected alternative.\
    \ ALLAGENTS.md says to record decisions as `decision` entries and to raise unknowns\
    \ as `question` entries \u2014 it never says which type to use when a human's\
    \ reply is both an answer *and* a decision. So the agent chooses the one that\
    \ reads better and breaks the loop.\n\n## Corpus damage, measured 2026-09-06\n\
    \nOf 28 task files containing a `question` entry, 17 have no `answer` entry anywhere.\
    \ Only two of those were open tasks \u2014 task-063 and task-167, both instances\
    \ of defect 1. task-273 was the only instance of defect 2. Both have been repaired\
    \ by hand.\n\n## The decision to take on defect 2\n\nThree shapes:\n\n1. **Widen\
    \ the closing rule.** Any entry threaded to a question with `re:` closes it, or\
    \ specifically `answer` and `decision` do. Cheapest. The risk is real: agents\
    \ already thread follow-up `note` and `question` entries onto a thread, so \"\
    any `re:` closes it\" would close threads that are still live.\n2. **Warn instead.**\
    \ Leave the rule alone and surface the anomaly \u2014 a `record_warning` on write,\
    \ and something in `agentjobs validate`, when a question has a threaded non-`answer`\
    \ entry and no answer.\n3. **Make the write path pick correctly.** Give the manager\
    \ an `answer` verb that appends the entry and marks the thread, and say plainly\
    \ in ALLAGENTS.md that a human's reply to a question is logged as `answer`, with\
    \ the reasoning in the same entry if it is also a decision.\n\nNot exclusive;\
    \ 2 and 3 together are probably right, and 1 alone is not.\n\n## The decision\
    \ to take on defect 1\n\n**Deliberately open.** Auto-moving the ball when a question\
    \ is raised is one answer and has a real cost: an agent mid-task that asks a clarifying\
    \ question would hand its own task away and stop being claimable. A questions\
    \ count on the task row, or a standing \"questions waiting on you\" list, does\
    \ not have that cost. ac-3 states the requirement and leaves the mechanism to\
    \ whoever takes this.\n\n## Whatever the rules become, show the thread\n\nA question\
    \ thread that already carries a threaded reply should display that reply beneath\
    \ the question, so a human is never asked cold about something already discussed.\
    \ Shared with task-360; whichever lands second should check what the first did."
  constraints: "- Preserve the append-only log. Nothing here rewrites or retypes an\
    \ existing entry.\n- If the closing rule widens, the widening is explicit and\
    \ enumerated. \"Any `re:` closes the thread\" silently resolves threads carrying\
    \ follow-up notes and questions, which is a worse failure than the one being fixed.\n\
    - Any change to `open_questions()` needs a test for the mis-typed case that fails\
    \ before the fix.\n- Whatever surfaces defect 1 must not make an agent's own clarifying\
    \ question hand its task away, unless that is chosen deliberately and recorded.\n\
    - ALLAGENTS.md is in scope and its change is measured against the context budget\
    \ \u2014 `tests/test_context_budget.py` caps the loaded bundle, so cutting elsewhere\
    \ may be needed.\n- Take a worktree and bootstrap it; one unqualified `scripts/check.py`\
    \ on the rebased branch before the handoff."
  out_of_scope: "- Re-typing or repairing historical entries. The corpus sweep is\
    \ done and recorded above; all three instances are repaired.\n- Answering the\
    \ questions now open on task-063 and task-167. Those are the owner's to answer.\n\
    - Redesigning the question model, adding question kinds, or structured multiple-choice\
    \ \u2014 task-017 owns that.\n- Rendering of long question bodies in the draft\
    \ panel \u2014 task-360."
  context:
  - path: src/agentjobs/models_v2.py
    why: '`open_questions()` is the closing rule: only `answer` closes a thread. Around
      line 1189.'
  - path: src/agentjobs/manager.py
    why: "Around line 125-136, where answering already guards against a question that\
      \ is not open \u2014 the natural home for an `answer` verb."
  - path: ALLAGENTS.md
    why: Says to record decisions as `decision` and raise unknowns as `question`,
      and is silent on which wins when a human's reply is both. Also silent on moving
      the ball when a question is for a human.
  - path: tasks/agentjobs/task-273.yaml
    why: 'Defect 2''s reproduction: entry 5 the question, entry 6 the decision that
      should have closed it, entry 9 the hand-written answer that did.'
  - path: tasks/agentjobs/task-167-agentjobs-menu.yaml
    why: 'Defect 1''s reproduction: entry 2 a question raised 2026-08-19 with the
      ball left on agent/available.'
acceptance:
- id: ac-1
  text: 'A test reproduces the closing defect: a question with a `decision` threaded
    to it by `re:` and no `answer` is reported open before the fix, and behaves as
    the chosen design says after it.'
  status: pending
- id: ac-2
  text: "A decision entry records which of the three shapes was taken, and the rejected\
    \ alternatives \u2014 in particular why the closing rule was or was not widened,\
    \ and to which entry types."
  status: pending
- id: ac-3
  text: "An open question directed at a human is visible on a surface Jeff already\
    \ reads, without the ball having been moved by hand. Whether that is the ball\
    \ moving automatically, a questions count on the task row, or a standing list,\
    \ is the task's decision \u2014 but 'ask a question and the ball stays agent/available'\
    \ must stop being a silent dead end."
  status: pending
- id: ac-4
  text: ALLAGENTS.md states which entry type records a human's reply to a question,
    including the case where the reply is also a binding decision, and that raising
    a question for a human means moving the ball. The context-budget test still passes.
  status: pending
- id: ac-5
  text: A question thread carrying a threaded reply displays that reply beneath the
    question in the draft panel, so a human is never asked cold about something already
    discussed.
  status: pending
- id: ac-6
  text: "Verified in a browser against a seeded task in each state \u2014 question\
    \ with no reply, question with a threaded decision, question properly answered,\
    \ and a question raised while the ball is on an agent \u2014 not asserted from\
    \ tests alone."
  status: pending
- id: ac-7
  text: '`scripts/check.py` green with no arguments on a clean rebased tree.'
  status: pending
