  body: "Scope widened within the hour it was filed. Retitled from \"A human's answer\
    \ can be logged so it never closes the question\" \u2014 the closing bug is the\
    \ second half, not the whole thing.\n\n**The first half, found 2026-09-06 minutes\
    \ after filing.** A question can be raised while `ball: agent` / `ball_reason:\
    \ available`, and nothing moves the ball or flags it anywhere. The question panel\
    \ only renders when the ball is on a human, so the question is written to the\
    \ record and never reaches anyone.\n\nTwo live instances, both found by grep rather\
    \ than by any surface:\n\n- **task-063** \u2014 question raised 2026-08-11, invisible\
    \ for **26 days**.\n- **task-167** \u2014 question raised 2026-08-19, invisible\
    \ for **18 days**.\n\nBoth were handed to `human`/`decision` by hand in commit\
    \ `a9ce5c7`, with the questions re-asked as tappable options. That is a repair,\
    \ not a fix; the next question raised the same way disappears the same way.\n\n\
    Jeff's reaction on being told about them in chat, which is the point: *\"how awesome,\
    \ more questions, waiting on me, and the gui doesnt show it, you tell me and its\
    \ not clear from your message.\"* An agent reporting open questions in conversation\
    \ is the failure mode this whole system exists to remove \u2014 chat does not\
    \ survive the session, and he should not be the one keeping the list.\n\n**So\
    \ the two halves are one task.** A question that never reaches the human and a\
    \ question that reaches them twice are the same loop broken at opposite ends,\
    \ they touch the same code and the same ALLAGENTS.md sentences, and fixing one\
    \ alone leaves the loop unreliable. ac-3 and the second clause of ac-4 are the\
    \ new half.\n\n**Rejected: filing the ball half separately.** It would have been\
    \ the third task filed in ten minutes about one panel, and the two fixes cannot\
    \ be verified independently \u2014 the browser check in ac-6 has to exercise all\
    \ four states in one sitting anyway.\n\n**Not decided here:** whether raising\
    \ a question should move the ball automatically. Auto-moving is one answer and\
    \ has a real cost \u2014 an agent mid-task that asks a clarifying question would\
    \ hand the task away and stop being claimable. A questions count on the task row,\
    \ or a standing \"questions waiting on you\" list, does not. ac-3 states the requirement\
    \ and deliberately leaves the mechanism open."
