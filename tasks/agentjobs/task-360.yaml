spec:
  summary: A question entry is rendered into the draft panel whole, whatever its length.
    A 300-word question fills the screen as one unbroken bold block above the answer
    box, and the reader cannot find the ask inside it.
  intent: 'Reported by the owner on 2026-09-06: looking at task-273''s question panel,
    he could not tell what he was being asked. The question had in fact already been
    answered.


    The panel is the one place in the app where the app asks the human for effort.
    It is the worst possible place to make them work for it. An agent writing a shorter
    question is half the fix and is task-359''s; the panel not pasting whatever it
    is handed is this half, and it is the half that holds when the next agent writes
    long anyway.'
  description: "## What it looks like\n\ntask-273's entry 5 is roughly 300 words:\
    \ three lettered sub-decisions, a paragraph of justification, and a cross-reference,\
    \ all in one body. The draft panel renders it as a single bold paragraph spanning\
    \ the full width of the card, ~12 lines deep on a desktop, immediately above the\
    \ answer textarea. Bold across the whole block removes the only emphasis the format\
    \ had. Markdown in the body \u2014 the backticked identifiers, the lettered list\
    \ \u2014 comes through as literal characters.\n\nThe reader's problem is not the\
    \ length in itself. It is that nothing in the presentation distinguishes *the\
    \ ask* from *the reasoning that led to it*, so the ask has to be excavated.\n\n\
    ## What to fix\n\n**Clamp it.** A question body over some threshold collapses\
    \ to its first lines with a control to expand. Pick the threshold from what actually\
    \ fits above the fold on a phone, not from a round number.\n\n**Render the markdown.**\
    \ These bodies are written as markdown by every agent in this repository and the\
    \ rest of the app renders it. Code spans, lists and paragraph breaks should survive.\n\
    \n**Stop bolding the whole thing.** Emphasis on everything is emphasis on nothing,\
    \ and it defeats the author's own emphasis.\n\n**Show the thread.** If entries\
    \ are threaded to the question with `re:`, the reader should see that something\
    \ has already been said on it. task-359 covers the case where the threaded entry\
    \ is an answer that failed to close the loop; the display half is shared and either\
    \ task may land it, so whichever is second should check what the first did rather\
    \ than doing it twice.\n\n## Not a substitute for writing short\n\n`ball_prompt`\
    \ is already held to about five lines by convention and questions should be too.\
    \ That guidance belongs with task-359, which owns the agent-behaviour half. This\
    \ task makes the panel survive a long body; it does not make a long body acceptable."
  constraints: '- The full body stays reachable. Collapsing must never be the only
    state, and the expanded form must be selectable and copyable.

    - Threshold chosen against a real viewport, and stated in the record with the
    viewport it was chosen for. Phone portrait is the binding case.

    - Rendering markdown here uses whatever the rest of the app already uses. No new
    dependency for this.

    - The panel must stay legible when the body is one short sentence, which is the
    common case. Do not build for the outlier and regress the norm.

    - Take a worktree and bootstrap it; one unqualified `scripts/check.py` on the
    rebased branch before the handoff.

    - The owner drives it before it merges. Sandbox on its own port, seeded with a
    short question and a long one so the two can be compared, per the standing UI-review
    rule.'
  out_of_scope: "- What closes a question thread \u2014 task-359.\n- Guidance to agents\
    \ about question length \u2014 task-359 owns the ALLAGENTS.md half.\n- The structured\
    \ multiple-choice question model \u2014 task-017.\n- Rendering of other long log\
    \ entries. If the same clamp obviously applies to the log timeline, say so in\
    \ the record and file it; do not absorb it.\n- Restyling the draft panel's other\
    \ controls (Promote, Send feedback, Reject)."
  context:
  - path: frontend/src
    why: The draft/review panel that renders open questions above the answer box.
      Find the component that maps over `open_questions` before changing anything.
  - path: tasks/agentjobs/task-273.yaml
    why: Entry 5 is the 300-word question that produced the report. Use it as the
      long-body fixture.
  - path: tasks/agentjobs/task-359.yaml
    why: 'The other half: why that question was on screen at all. Shares the show-the-thread
      display change.'
