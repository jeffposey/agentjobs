  actor: claude
  type: decision
  body: "Dropped the `needs: task-240` dependency, and repaired three spec fields\
    \ that a malformed create had corrupted.\n\n**The dependency was wrong in kind,\
    \ not just in detail.** It was added to express \"run after the shell review\"\
    , which is ordering. ALLAGENTS.md is explicit that dependencies are prerequisites\
    \ and that a false one makes a task unclaimable, deadlocks the graph if it ever\
    \ points both ways, and misleads every reader who takes it at face value. Ordering\
    \ goes through `queue move`, never through `needs`.\n\nThe concern behind it was\
    \ real and is preserved: do not land this while a person is driving the sidebar\
    \ by hand, because it edits the very rows under review. That now sits in `constraints`,\
    \ where a reader can weigh it, rather than in the graph, where it silently blocked\
    \ the task. task-240 \u2014 the review in question \u2014 closed `completed` at\
    \ 21:52Z today, so the concern is discharged as of now.\n\n**Rejected alternative:**\
    \ keep the dependency and rely on task-240 closing to clear it. Rejected because\
    \ it teaches the wrong pattern (the next agent copies it), and because the record\
    \ would still assert a prerequisite relationship that does not exist.\n\n**Field\
    \ repair.** A malformed create had left `</constraints>` and two `<parameter name=...>`\
    \ tags embedded as literal text at the end of `constraints`, with `out_of_scope`\
    \ null and `context` empty \u2014 the content for both was sitting inside that\
    \ polluted string. Split it back out into the real fields. `summary` was 64 words\
    \ and tripping the record warning; cut to two sentences, with the four-reasons\
    \ detail moved to `intent` and `description` where it belongs. Patched rather\
    \ than re-filed, so the id, the log and the acceptance criteria survive."
