    \ drag path is not the OS drag loop, so this is good evidence that the handlers,\
    \ the client call and the `queue-move` route work end to end, and it is not evidence\
    \ that a *person's* gesture works. task-225's afternoon went to a browser-automation\
    \ tool reporting success while delivering no events at all, so the distinction\
    \ is not pedantry. What makes the risk small here rather than absent: this change\
    \ removes a static span from a sibling subtree, and touches neither the grip,\
    \ its handlers, the row's `onKeyDown`, nor the focus-restoration path \u2014 `git\
    \ diff` on `TaskList.tsx` is the removed span and a comment, nothing else.\n"
