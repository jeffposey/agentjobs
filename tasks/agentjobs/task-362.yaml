spec:
  summary: Every task row in the sidebar prints its raw `queue_position` as visible
    text. Remove it from the row, keeping it in the reorder grip's aria-label and
    in NextExplanation, where it is explained and where accessibility needs it.
  intent: 'A reader scanning the sidebar needs the title. The number is a gapped internal
    coordinate: it is not ordinal, it duplicates the priority chip beside it, and
    in a 320-400px column it takes width from the part the reader came for.'
  description: "## What is wrong\n\n`frontend/src/components/TaskList.tsx:820` renders\
    \ `{task.queue_position ?? \"\u2014\"}` as visible row text. Jeff asked, 2026-09-06,\
    \ looking at the finished sidebar: *is there some reason a human needs to see\
    \ the random queue numbers?* There is not, and there are four reasons against.\n\
    \n1. **It is not ordinal.** In his screenshot the visible values were 293, 1393,\
    \ 843, 893. A reader taking 1393 for \"1393rd\" is wrong; one taking it for \"\
    3rd\" is also wrong. Positions are gapped band coordinates, assigned so a task\
    \ can be inserted between two others without renumbering. The list's own order\
    \ already conveys order, exactly, with no arithmetic.\n2. **It duplicates the\
    \ row it sits on.** Its only meaning is position *within a band*, and the band\
    \ is already the `critical` / `high` chip immediately beside it.\n3. **It advertises\
    \ a number the workflow forbids editing.** ALLAGENTS.md is explicit that `queue_position`\
    \ is never hand-edited \u2014 reordering goes through `queue move`, because a\
    \ hand-written number can collide with another open task in the band, which is\
    \ corruption. Displaying it prominently invites the edit the docs prohibit.\n\
    4. **It truncates the title, in the column this epic exists to fix.** In the screenshot\
    \ task-235's title dies at \"\u2026on the screen alre\u2026\" while a meaningless\
    \ 1393 sits on the same row with whitespace around it. Spending a narrow column's\
    \ width on bookkeeping and clipping the content is precisely the trade task-235\
    \ was created to reverse.\n\n## What to do\n\n**Remove the visible number from\
    \ the sidebar row. Keep both other usages.**\n\n- **Keep `TaskList.tsx:741`**,\
    \ the reorder grip's `aria-label` \u2014 `Reorder task-235, critical band, position\
    \ 293`. A screen-reader user stepping a task through its band with Alt+Up/Alt+Down\
    \ has no other way to know where it landed. Removing this would be a real accessibility\
    \ regression, and it is the one place the number genuinely informs an action.\n\
    - **Keep `NextExplanation.tsx:51`**, which renders it as \"position X of the Y\"\
    \ \u2014 in context, explained, and answering a question the reader actually asked.\n\
    - **Keep the `data-queue-position` attributes** at `TaskList.tsx:775` and `:862`.\
    \ They are test hooks, not user-facing, and several existing tests assert against\
    \ them. Removing rendered text is not a reason to remove a test seam; if any of\
    \ them turns out to be genuinely dead, say so with the grep rather than deleting\
    \ it in passing.\n\n## Relationship to task-207\n\n**task-207 is what put this\
    \ number on the row** \u2014 \"Queue position: the React list shows the real order,\
    \ and you can change it without a mouse\" \u2014 so this task partially reverses\
    \ a shipped decision, and should say so rather than looking like a tidy-up. What\
    \ task-207 got right and this keeps: the list renders the stored order rather\
    \ than re-sorting client-side, and the order is changeable from the keyboard.\
    \ What it over-delivered: showing the coordinate as well as the ordering it produces.\
    \ The ordering was the requirement; the number was the implementation showing\
    \ through.\n\n## The one argument for keeping it, and why it loses\n\nThe number\
    \ lets you eyeball queue corruption \u2014 two open tasks colliding on the same\
    \ value inside one band. That is real, but it is rare, `agentjobs queue check`\
    \ answers it definitively rather than by eye, and there is already a broken-queue\
    \ banner for the condition. A permanent column on every row in the narrowest surface\
    \ is the wrong price for a diagnostic that better tools already cover. **What\
    \ would make this wrong:** if position collisions turned out to be frequent *and*\
    \ the banner missed them, a debug affordance would be justified \u2014 but as\
    \ a toggle or a detail-panel field, not restored to every row."
  constraints: "- Remove only the rendered text. Do not touch how order is computed,\
    \ stored, or validated \u2014 not `queueOrder.ts`, not `taskTree.ts`, not the\
    \ schema, not the API, not the CLI.\n- The reorder grip's `aria-label` keeps naming\
    \ the band and the position.\n- `NextExplanation` keeps showing the position in\
    \ its explanatory sentence.\n- The `data-queue-position` attributes stay; they\
    \ are test seams.\n- Drag-to-reorder and Alt+Up / Alt+Down keep working, including\
    \ focus survival across a move. task-207 and task-225 are the scar tissue here:\
    \ this edits the same rows those defects lived in.\n- Update the tests that assert\
    \ the visible number rather than deleting them \u2014 they should assert its absence,\
    \ or assert the aria-label instead.\n- Do not land this while the shell is under\
    \ live human review, because it edits the very rows being driven. task-240 was\
    \ that review and closed `completed` on 2026-09-06, so the constraint is satisfied\
    \ as of now; re-check only if another by-hand review of the sidebar opens.\n-\
    \ `scripts/check.py` green, unqualified, once, on the rebased branch before handoff."
  out_of_scope: '- Any change to how queue order is computed, assigned, or repaired.

    - A debug view or toggle for queue positions. Rejected in the description above;
    reopening it means reopening this task''s reasoning, not quietly adding one.

    - The broken-queue banner and `queue check`.

    - Any other column, chip or field on the row. This is one data element, not a
    row redesign.

    - Restyling: colours, typography, spacing scale.'
  context:
  - path: frontend/src/components/TaskList.tsx
    why: Line 820 renders the visible number and is the whole change. Line 741 is
      the aria-label to keep; lines 775 and 862 are the data-queue-position test seams
      to keep.
  - path: frontend/src/components/NextExplanation.tsx
    why: Line 51 shows the position in context as 'position X of the Y'. This usage
      stays; it is the counter-example that shows what earning the space looks like.
  - path: frontend/src/components/TaskList.test.tsx
    why: Asserts against queue positions in several places; these need updating rather
      than deleting.
  - path: tasks/agentjobs/task-207.yaml
    why: The task that added the number. Its decision is being partially reversed,
      so read what it was actually asked to deliver before changing it.
