  type: decision
  body: "ac-5's premise is false, and the measurement says so. **The title gets no\
    \ width back \u2014 zero pixels.** Recording it rather than quietly marking the\
    \ criterion met, because the spec argued from it twice.\n\n**Instrument.** Playwright-driven\
    \ Chromium at 1280x900, against the real corpus served from this branch's own\
    \ bundle on a throwaway port 8899, measured with `getBoundingClientRect()` on\
    \ the live DOM. Two builds of the same checkout: the \"before\" with `TaskList.tsx`\
    \ stashed, the \"after\" with it applied. Server stopped afterwards.\n\n**Numbers,\
    \ sidebar 413.44px both times:**\n\n| | before | after |\n|---|---|---|\n| title\
    \ span width | 350.38px | 350.38px |\n| title `scrollWidth` (task-235) | 531px\
    \ | 531px |\n| still truncated | yes | yes |\n\n**Why.** The number was never\
    \ on the title's line. The tree row is two block lines inside the link \u2014\
    \ `[id \xB7 \"part of task-NNN\"]` above, `[title]` below \u2014 and the removed\
    \ span sat on the *first* one, `ml-auto`, hard right. The title is a block element\
    \ already spanning the full content column, so its width is set by the column\
    \ and nothing on the line above can touch it. The spec's fourth argument reads\
    \ the screenshot as though 1393 sat *beside* \"\u2026on the screen alre\u2026\"\
    ; it sat above it.\n\n**What was actually reclaimed**, measured the same way by\
    \ probing an identically-classed span into the live id line: **34.4px** \u2014\
    \ 26.4px of text plus the 8px flex gap \u2014 out of a 333.8px id line, **10.3%**\
    \ of it. That line is where an orphaned row truncates \"part of task-NNN\", so\
    \ that note is the one thing on screen that gains room.\n\n**The change still\
    \ stands, on the other three arguments**, which the measurement does not touch:\
    \ it is not ordinal, it duplicates the band chip beside it, and it advertises\
    \ a field the workflow forbids hand-editing. Removing visual noise from a scanning\
    \ surface is worth doing on its own. But \"it truncates the title\" should not\
    \ be repeated by the next task in this epic \u2014 if a title needs width in the\
    \ sidebar, the lever is the column, the indent or the three-line row, not this\
    \ span.\n\n**Rejected alternative:** mark ac-5 met on the strength of the row\
    \ looking cleaner. That is the failure mode ENGINEERING.md's verification section\
    \ names \u2014 a check that would have caught nothing. The criterion asked for\
    \ a browser measurement precisely so this could come out either way, and it came\
    \ out the other way.\n"
