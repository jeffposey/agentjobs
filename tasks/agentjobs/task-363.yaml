- id: 9
  ts: '2026-09-06T22:20:21.735670Z'
  actor: claude
  type: progress
  body: 'All three defects fixed on `fix/task-363-review-panel-links-questions`, three
    commits, rebased onto `main` and gated once.


    **What changed.**


    - `frontend/src/components/linkify.ts` (new) splits a body into text and URL runs.
    It returns data, never markup: the caller renders the pieces as React children,
    so nothing on this path interprets a task record as HTML or Markdown (task-326
    stands). The scheme allow-list *is* the pattern -- only `https?://` can match
    -- and because a match needs a scheme and an authority, every href it can produce
    is absolute, so the react-router basename cannot be dropped. Trailing punctuation
    is trimmed, so a URL ending a sentence does not swallow the full stop, and backticks
    and angle brackets end a match rather than joining it.

    - `SpecText` in `TaskDetail.tsx` renders those segments. One change covers the
    review panel''s prompt, "Current ask" and every log body. Anchors carry `target="_blank"`
    and `rel="noopener noreferrer"`; the existing Links section was normalised to
    the same `rel`.

    - `frontend/src/components/ReviewLinks.tsx` (new) is the hoisted card, `nav aria-label="Links
    for this review"`, above the identity line, the questions and the verb row.

    - `QuestionForm.tsx`: the legend is `float-left w-full`, which opts it out of
    the in-border layout the defect comes from, with the rest of the card in a `clear-left`
    sibling; the `fieldset`/`legend` grouping is unchanged. `questionHeading()` strips
    a leading ordinal from the body. Card heading raised to `text-base`, option labels
    lowered to `font-medium`, so the question dominates.

    - `scripts/review_links_sandbox.py` (new), port 8913, four throwaway states.


    **Browser evidence** -- Chrome, sandbox on 8913, 2026-09-06. Two screenshots under
    `tasks/agentjobs/attachments/task-363/`.


    - *task-301*, the task-240 prompt verbatim. Six anchors in the panel, three in
    the prose and the same three in the card, every one `rel="noopener noreferrer"
    target="_blank"`. The URL that ends a sentence rendered as `.../tasks/task-143`,
    not `.../task-143.`. The card precedes the verb row (`compareDocumentPosition`).
    Each card row is 44px tall and `document.elementFromPoint` at its centre returns
    the anchor.

    - **A real click landed and was followed.** A capture-phase `mousedown` listener
    recorded `{tag: "A", href: "http://127.0.0.1:8913/app/p/sandbox-shell/tasks/task-143"}`
    and Chrome opened that exact absolute URL in a new tab. Naming the instrument
    per ENGINEERING.md: `mcp__claude-in-chrome`''s `left_click`, and the listener
    is what proves the gesture arrived rather than the tool''s own success report
    -- an earlier click at the wrong coordinates recorded the fieldset instead and
    changed nothing, which is how I know the listener discriminates.

    - *task-302*, five questions. Measured per fieldset: `legend.top >= fieldset.top
    + borderTopWidth` on all five, gap 12px, and question 2''s legend occupies **4
    line boxes** (`Range.getClientRects().length`) -- the wrapping case, with the
    border unbroken above it. Numbering: the agent wrote "3." on question 3 and "1)"
    on question 5; the cards render **1.** to **5.** in order, each with one number.
    Question 5 is the discriminating case -- body "1)", rendered "5.".

    - *task-017 rules, in the browser*: a `textarea` in all five cards, `[aria-pressed="true"]`
    count 0 on arrival, exactly one `button[type=submit]`. After a real tap on "Delete
    it", `aria-pressed` became `true`, the record still read `human/decision` and
    held **0** `answer` entries -- selecting does not submit.

    - *task-303*: card holds the `pr` (titled "PR #9 -- the shell") and the `build`;
    the `doc` link stays in the Links section below, which still lists all three.

    - *task-304*: no card, no anchors in the panel. The quiet state stays quiet.


    **Tests.** `linkify.test.ts` (10) on the segmentation, including the `javascript:`/`data:`/`file:`/`ftp:`
    allow-list and the no-relative-href property. `ReviewLinks.test.tsx` (9) drives
    the real panel and reads hrefs off the DOM. Six added to `QuestionForm.test.tsx`
    for the heading, including the stale-numbering case and the fieldset grouping.


    **Gate.** `scripts/check.py`, no arguments, on the rebased branch: **exit 0, all
    10 stages, 334.6s**, receipt written for `590a64ec`. Nothing pushed.'
