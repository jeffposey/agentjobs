- id: 8
  ts: '2026-09-06T22:19:53.443190Z'
  actor: claude
  type: decision
  body: 'A link reaches the review card by being in the current `ball_prompt`, plus
    any `links[]` entry whose existing `rel` is already `pr` or `build`. Nothing new
    is asked of the agent writing the handoff, and no schema value was added.


    **Rejected: a new `review`/`sandbox` value in `LinkRel`, hoisting links that carry
    it.** It reads better on paper -- titled, explicit, no guessing -- and three things
    sank it.


    1. `links[]` is durable and a review address is not. A sandbox lives on a throwaway
    port for the length of one review; written into `links[]` it outlives the process
    it points at, and nothing in the system removes it, so the task acquires a permanent
    link to a dead port. `ball_prompt` already has exactly the right lifetime: it
    is replaced at the next handoff, and so is the card.

    2. It would fix nothing that has been seen to break. The defect that filed this
    task is a handoff that already exists and already named its URLs in the prompt.
    A scheme that works only for handoffs written after every agent learns a new field
    leaves that one, and the corpus behind it, as it was.

    3. Its population depends on agent discipline -- the least reliable mechanism
    here -- for a benefit (a title) the URL mostly carries itself. The enum addition
    also costs a migration, schema tolerance, docs and a regenerated client.


    The cost of reading the prompt instead, stated so nobody rediscovers it as a bug:
    a URL mentioned in passing is promoted alongside one meant to be visited, and
    neither gets a title. That is a card with one row too many, which a reviewer resolves
    in a glance; the rejected alternative''s failure mode is an empty card, which
    they cannot. `pr` and `build` are included because those two values of the existing
    vocabulary already mean "an artefact of the work under review"; `doc`, `design`,
    `issue` and `other` stay in the Links section further down, where a durable reference
    belongs.


    **Second decision, on the doubled number: the body''s ordinal is stripped, not
    the form''s.** The panel shows only questions with no answer threaded to them,
    so an agent''s own numbering goes stale the moment one is answered -- answering
    the second of four would print a list numbered 1, 3, 4 and invite a reviewer to
    say "question 3" meaning the second card. Deferring to the body was rejected for
    that. Dropping the number entirely was rejected for the same reason in reverse:
    "5 open questions" over unnumbered cards gives the reader no way to name one.
    The strip is anchored, one or two digits, `.` or `)`, whitespace -- so "8876 or
    8910 for the sandbox?" keeps its first word, and a body that is nothing but an
    ordinal keeps it rather than rendering an empty heading.'
  data:
