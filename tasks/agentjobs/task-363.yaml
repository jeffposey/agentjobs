    \ space, with the seeded state that read best being task-303, where the links\
    \ were only in the card. Correct: on a phone a 60-character address is three lines\
    \ of a small screen, and it was there twice.\n\n**The rule now.** A **link line**\
    \ \u2014 an address alone on its line, optionally `Name: ` in front of it, optionally\
    \ bulleted \u2014 is lifted into the card and **removed from the prompt**; the\
    \ name titles the row. `links[]` entries with `rel` `pr` or `build` join it, titled\
    \ by their own `title`. The one remaining way a URL could be a tap target twice\
    \ (mid-sentence in the prompt *and* in `links[]`) renders as plain text in the\
    \ prose.\n\n**Naming is the author's job, not a heuristic's.** Only the agent\
    \ writing the handoff knows which of three identical-looking ports is the tablet\
    \ one. Rejected: deriving a name from the URL (host plus last path segment), which\
    \ for `127.0.0.1:8913/app/` and `127.0.0.1:8913/app/?w=1024` produces two rows\
    \ called the same thing \u2014 worse than no name, because it looks authoritative.\n\
    \n**An address inside a sentence stays where it was written.** Rejected: deleting\
    \ it, which leaves \"Open  and confirm the log expands\"; and replacing it with\
    \ a short named anchor, which is the same address on screen twice in a smaller\
    \ font. The case is resolved at the source instead \u2014 the convention says\
    \ put review links on their own lines \u2014 and the panel degrades honestly for\
    \ the corpus written before it: the named lines hoist, the mid-sentence one stays\
    \ inline, and no address appears twice either way.\n\n**Where the policy lives,\
    \ and why not ALLAGENTS.md.** The always-loaded context bundle has **6 bytes**\
    \ of headroom against `tests/test_context_budget.py`'s 60,000, so a paragraph\
    \ there would have to buy its room by cutting load-bearing prose \u2014 which\
    \ ENGINEERING.md says to run the ablation suite before doing, at a cost this task\
    \ cannot justify. So the policy is enforced where it is cheap and reaches the\
    \ author at the right moment:\n\n- a third `record_check` condition, `unnamed_review_link`,\
    \ raised by `handoff` alone and only for a ball going to a **human**, naming the\
    \ addresses the panel cannot name and stating the convention. This is the same\
    \ argument task-306 made for the two conditions already there: the session that\
    \ caused the drift is still in context and can fix it in one edit.\n- one sentence\
    \ in the `task_handoff` MCP tool description, which costs nothing against the\
    \ bundle and is read by exactly the agents that write handoffs.\n- the full convention\
    \ with examples in `docs/agent-workflow.md`, under Human Review.\n\nRejected:\
    \ raising `BUNDLE_BUDGET_BYTES`. The test's own message allows it as a stated\
    \ decision, and a formatting convention is not what a session should pay for before\
    \ its first thought.\n\n**The rule is stated twice, in TypeScript and in Python**,\
    \ because the panel and the check run in different runtimes and neither can call\
    \ the other. Bounded deliberately: `tests/test_record_check.py::TestReviewLinks::test_the_line_shapes_the_panel_and_this_check_must_agree_on`\
    \ pins the eight prompt shapes both must agree on, so changing one without the\
    \ other fails rather than drifting."
