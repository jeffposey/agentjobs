spec:
  summary: "Fold an epic while you are reading one of its descendants, reload, and\
    \ the fold is gone \u2014 and the stored preference is erased, not merely overridden.\
    \ Found by hand during task-240's review; task-238's own e2e test misses it because\
    \ it reloads with nothing selected."
  intent: 'The fold is the sidebar''s only defence against a backlog that does not
    fit. A fold a reader has to redo after every reload is not a fold, and this one
    is worse than transient: the recorded preference is rewritten to empty, so it
    does not come back when they navigate away from the child either.'
  description: "## What happens\n\nReproduced against `scripts/shell_sandbox.py` with\
    \ Playwright, four arms differing\nonly in what the URL selects. Fold `task-100`,\
    \ reload, and ask whether its children\nare still hidden:\n\n| Selected when the\
    \ fold is made | After reload | `localStorage` |\n| --- | --- | --- |\n| nothing\
    \ (`/tasks`) | still folded | `[\"task-100\"]` |\n| the epic itself (`/tasks/task-100`)\
    \ | still folded | `[\"task-100\"]` |\n| a child (`/tasks/task-104`) | **fold\
    \ lost** | `[]` |\n| a grandchild (`/tasks/task-143`) | **fold lost** | `[]` |\n\
    \nThe last two are the ordinary case. A reader opens a task, decides the epic\
    \ above it\nis taking too much room, folds it, and reloads or comes back later.\n\
    \n## Why\n\n`TaskList.tsx`, the reveal effect (search for \"A deep link to a folded\
    \ child unfolds\nits ancestors\"). It unfolds every folded ancestor of the selected\
    \ task and **writes\nthat through to `localStorage`**. Within one session it is\
    \ guarded by the `revealed`\nref, which is what its comment means by \"folding\
    \ the parent of the task you are\nreading stays folded\". A reload resets that\
    \ ref to `null`, so the effect fires again\nfor a selection the reader never changed,\
    \ and discards the fold they had just made.\n\nTwo of task-238's acceptance criteria\
    \ meet here and pull opposite ways:\n\n- **ac-2** \u2014 a fold survives a reload.\n\
    - **ac-4** \u2014 a deep link to a child inside a folded parent unfolds its ancestors.\n\
    \nBoth are implemented and both have a green Playwright test. The gap is that\n\
    `e2e/task-tree.spec.ts` asserts ac-2 by reloading `/tasks` with **nothing selected**,\n\
    which is the one arm in which the reveal effect cannot fire. Nothing tests the\
    \ two\ntogether.\n\n## What \"fixed\" means\n\nThe reveal has to be able to tell\
    \ a link that *arrives* naming a hidden task from a\npage that merely *reloads*\
    \ on a selection the reader already had. Approaches, in the\norder they look promising\
    \ \u2014 pick one and record why:\n\n1. Persist what has been revealed alongside\
    \ the fold, so the ref survives a reload.\n2. Fire the reveal only when the selection\
    \ changes *after mount*, and on first mount\n   only when the selected row is\
    \ actually hidden by a fold **and** was not already\n   the selection the previous\
    \ page had.\n3. Reveal without writing: unfold for this render, and leave `localStorage`\
    \ alone, so\n   the reader's recorded preference is never destroyed by a navigation.\n\
    \nWhichever is chosen, ac-4 must still hold: a pasted link to a hidden grandchild\
    \ has\nto reveal and select it.\n\n## Verification\n\nA test that reloads with\
    \ a descendant selected, which is the case nothing currently\ncovers. jsdom is\
    \ enough for the mechanism; the Playwright arm is worth adding beside\nthe existing\
    \ ac-2 test because `localStorage` is the thing under test."
  constraints: "- Do not weaken task-238's ac-4. A pasted deep link to a task hidden\
    \ by a fold must\n  still reveal and select it.\n- The fix is in the reveal, not\
    \ in the storage helpers: `readCollapsed` /\n  `writeCollapsed` are doing exactly\
    \ what they are asked to.\n- Add the missing test in the same change. A fix with\
    \ no arm covering \"reload with a\n  descendant selected\" leaves the same hole\
    \ for the next person."
  out_of_scope: "- Changing the default fold state, or which parents start folded.\n\
    - The other two findings from task-240's review: the drag affordance and the phone\n\
    \  list control each have their own task."
  context:
  - path: frontend/src/components/TaskList.tsx
    why: The reveal effect that rewrites the fold, and the state it is guarded by.
  - path: frontend/src/components/taskTree.ts
    why: readCollapsed / writeCollapsed, and the comment on why exceptions rather
      than the whole state are stored.
  - path: frontend/e2e/task-tree.spec.ts
    why: The green ac-2 test that reloads with nothing selected, and the ac-4 test
      beside it. The missing arm goes here.
  - path: scripts/shell_sandbox.py
    why: The sandbox this was found in. task-100 with a grandchild at task-143 is
      the fixture; it is on branch chore/task-240-shell-sandbox until that merges.
