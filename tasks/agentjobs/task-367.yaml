spec:
  summary: The list-and-detail shell (task-235) shipped and works. Using it turned
    up four things that are improvements rather than blockers, and this epic holds
    them so task-235 can close on what it actually promised.
  intent: Separate "the shell works" from "the shell is finished". task-235 delivered
    a two-region Tasks surface and its acceptance criteria are about that. Four improvements
    found in the first real use of it were being held inside that epic, keeping it
    open on work it never promised. They belong together, but not there.
  description: "## What this holds\n\nFour items, all consequences of the new shell\
    \ and all found by using it rather than by reviewing it:\n\n| child | what it\
    \ is |\n| --- | --- |\n| task-364 | A fold is thrown away on reload whenever a\
    \ descendant of the folded parent is selected. |\n| task-365 | A drag carries\
    \ the grip glyph rather than the row, and nothing shows where it will land. |\n\
    | task-366 | On a phone there is no way to open the task list without leaving\
    \ the record. |\n| Shell 8 | The divider between the sidebar and the record cannot\
    \ be moved. |\n\n## Why one epic rather than three topical homes\n\nThey share\
    \ a cause and they share a shape. The cause: every one of them is a consequence\
    \ of the new shell, surfaced in its first real use. The shape: none of them blocks\
    \ anything, and each improves a surface that already works.\n\nSplit across existing\
    \ homes they would lose the provenance that explains them, and none would be anyone's\
    \ priority in its adopted home.\n\n**Rejected alternative:** send task-366 to\
    \ task-168 (the burger menu) and task-364 to a task-238 follow-up. Rejected on\
    \ the provenance argument above, and because task-093 \u2014 the natural home\
    \ for the phone item \u2014 is already closed, so that item had no home to go\
    \ to at all.\n\n## Why this is not a child of task-235\n\nThe entire point is\
    \ to let task-235 close. A child would re-block it. This is a sibling.\n\n## Why\
    \ `high` and not `critical`\n\nJeff has said explicitly that none of these is\
    \ urgent, and gave his reasoning per item: he does not really use the phone; he\
    \ does not drag to reorder much *yet*, though he expects to more once it is fixed;\
    \ and remembering fold state is polish. `high` records that these are wanted without\
    \ pretending they are blocking.\n\n## One thing to flag rather than relitigate\n\
    \ntask-364 is a defect against a binding decision, not new polish. task-235's\
    \ log entry 9 records a requirement that the collapsed/expanded state persists\
    \ across reloads. Jeff has now called it polish, which is his call and stands.\n\
    \nThis note exists so that a later reader does not read the demotion as an oversight,\
    \ and so that nobody \"discovers\" the contradiction and reopens the question.\
    \ It is settled."
  constraints: '- Each child stands alone and merges alone. This epic is a container
    and a provenance record; it does not impose an order on its children, and none
    of them needs another.

    - No child here blocks task-235, task-362, or anything else. If one turns out
    to block something, that is a reason to re-file it, not to add a dependency from
    here.

    - The shell''s shipped behaviour is the baseline. These are improvements to a
    working surface; a child that has to change the two-region structure to land is
    out of scope for this epic and belongs in its own task.

    - Do not close this epic by walking it. Each child closes on its own evidence,
    and this parent closes only when a reader judges the four items done.'
  out_of_scope: '- task-235''s own acceptance criteria. Those are judged on task-235,
    against task-237 and task-239''s recorded evidence, and this epic exists precisely
    so that judgement is not entangled with the four items here.

    - New shell features. This is the polish pass on what shipped, not the next round
    of layout work.

    - Restyling: colours, typography, spacing scale.

    - Anything on the server, the schema, the API or the CLI. All four items are frontend.'
  context:
  - path: tasks/agentjobs/task-235.yaml
    why: The epic these four came out of. Its log entry 9 is the binding device-class
      decision, and the one task-364 is a defect against; its constraints are where
      the divider was originally deferred.
  - path: frontend/src/App.tsx
    why: The two-region shell all four items sit inside.
  - path: frontend/src/components/TaskList.tsx
    why: "Owns the fold state, drag-to-reorder and the sidebar column \u2014 three\
      \ of the four children edit this file."
