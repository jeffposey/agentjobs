  body: "Epic populated. task-364, task-365 and task-366 reparented here from task-235,\
    \ and task-368 (Shell 8, the draggable divider) filed here new. Four children,\
    \ as specified.\n\n**task-368 was filed at `high`, not the `critical` its ready\
    \ spec carried.** The spec was drafted as a child of task-235, where every child\
    \ was `critical` because the shell itself was. Filing it `critical` inside an\
    \ epic that exists precisely because none of its contents is urgent would be incoherent\
    \ \u2014 the priority band is what `agentjobs next` sorts on, so a `critical`\
    \ child would jump the whole polish pass ahead of genuinely blocking work while\
    \ its own parent said it was not urgent. `high` matches its three siblings and\
    \ the epic.\n\n**Rejected alternative:** file it `critical` as drafted and rely\
    \ on queue position to hold it back. Rejected because band beats position: a `critical`\
    \ task is returned ahead of every `high` one regardless of where it sits in its\
    \ own band, so the position would not have restrained it.\n\n**Its `needs: task-240`\
    \ was dropped**, for the same reason as task-362's \u2014 see that task's log.\
    \ The draft named it a real prerequisite (\"changing the geometry mid-review invalidates\
    \ what he reported\"), which was a defensible reading, but task-240 closed `completed`\
    \ at 21:52Z today and the concern is discharged. Nothing was lost by removing\
    \ it."
