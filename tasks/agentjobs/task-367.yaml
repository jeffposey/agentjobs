  type: question
  body: "**The three reparented children still sit at the top of the `high` band on\
    \ a reason that no longer holds. Should they move down?**\n\ntask-364, task-365\
    \ and task-366 are at positions 16, 33 and 67 \u2014 the very top. They were put\
    \ there earlier today by a `queue_move` whose recorded justification was: *\"\
    the three findings from task-240's review block task-235, so they run before anything\
    \ else in this band.\"*\n\nBoth halves of that are now false. They no longer block\
    \ task-235, because they are no longer its children; and Jeff has called each\
    \ of them polish rather than urgent, which is the whole reason this epic exists.\n\
    \nThat move also demoted fifteen tasks, and the move's own warning named the cost:\
    \ task-141 and task-168 each have four open tasks waiting on them, task-138 has\
    \ three. Those are now sitting behind a polish pass.\n\n**Not moved, deliberately.**\
    \ Reordering three tasks out of the top of the band changes what `agentjobs next`\
    \ returns project-wide, and Jeff is driving dispatch by hand right now \u2014\
    \ so a silent reshuffle would change what he sees at the top of his queue without\
    \ his having asked for it. ALLAGENTS says to move rather than re-derive, and that\
    \ stands, but it also says a move is a decision the next session inherits, which\
    \ makes it his to make while he is actively at the wheel.\n\n**Recommendation:**\
    \ move all three below the blocker cluster \u2014 `agentjobs queue move task-364\
    \ --after task-198`, then 365 and 366 after it, restoring roughly the order the\
    \ earlier move displaced. task-368 needs nothing; it was created at the band's\
    \ natural bottom (15800)."
