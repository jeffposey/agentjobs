spec:
  summary: 'The gate''s shape inverted while nobody was re-measuring it. Task-268
    measured `e2e` at 135.3s and 138.8s against `pytest` at 79.3s and 89.1s, so the
    single biggest remaining lever on gate time is Playwright''s `workers: 1`. This
    is task-268''s proposal 7, promoted from "defer" by that measurement, and it still
    needs the spec-by-spec audit that deferral was waiting for.'
  intent: Cut the gate's critical path, which is now Playwright and not the Python
    suite.
  description: '## Why now


    Task-268 re-cut the stage table on 2026-09-06 (docs/performance.md). Two uncontended
    green gates:


    | | pytest | e2e | whole gate |

    |---|---|---|---|

    | run 1 | 79.3s | 135.3s | 254.3s |

    | run 2 | 89.1s | 138.8s | 245.8s |


    `e2e` is 56% of the gate. It is also exactly what bounds `scripts/check.py --concurrent`,
    whose uncontended wall clock is `api + build + e2e` to the tenth of a second:
    3.4 + 15.7 + 146.0 = 165.1s. **No further scheduling work can take the gate below
    the e2e stage**, so this is the lever, and every other one in task-268''s list
    is now second-order.


    The suite is 107 tests on `workers: 1`.


    ## What the deferral was waiting for


    Task-268''s proposal 7 estimated a saving of at most 12s and deferred it "until
    a spec-by-spec audit", on three stated hazards. The estimate is now stale by an
    order of magnitude; the hazards are not, and are the actual work:


    1. **All specs share one server.** `e2e/run_server.py` starts a single `agentjobs
    serve` through Playwright''s `webServer`. Parallel workers would drive one process,
    which is fine for reads and not obviously fine for anything that writes.

    2. **All specs share one temp project.** Two workers creating, reordering or closing
    tasks in the same project will see each other''s writes. Per-worker projects,
    or a spec-level split between read-only and mutating specs, is the real design
    question.

    3. **Two specs toggle machine-level dispatch configuration.** Those are not merely
    order-dependent, they are globally destructive to a concurrent neighbour, and
    they may have to stay serial whatever else happens.


    So the deliverable is not "set `workers: 4`". It is: audit what each spec touches,
    isolate what can be isolated, quarantine what cannot, and quote a before/after.


    ## Also worth doing here


    `e2e` grew from 25.0s (2026-08-21) to ~138s without anyone noticing, which is
    its own finding. Whatever the outcome on parallelism, say in docs/performance.md
    what the per-test cost is and whether the growth is tests or seconds-per-test.'
  constraints: Playwright's ports are derived per checkout from the path (task-187)
    and must stay that way -- concurrent gates in different worktrees depend on it.
    A before/after pair is required (ENGINEERING.md); quote three runs of each arm,
    not one. Any spec that must stay serial should say so in the spec file, with the
    reason.
  out_of_scope: Stage-level concurrency in check.py, which is task-268's `--concurrent`
    and already shipped behind a flag. Cutting the Python suite's tail, which task-268's
    `--durations=15` measured and left open.
  context:
  - path: docs/performance.md
    why: The re-cut stage table and the concurrent-run measurements task-268 left
  - path: frontend/playwright.config.ts
    why: workers, the webServer, and the per-checkout port derivation
  - path: frontend/e2e/run_server.py
    why: The one server every spec shares
  - path: tasks/agentjobs/task-268.yaml
    why: Proposal 7 and the three hazards this task has to answer
