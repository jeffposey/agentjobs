spec:
  summary: "`test_cancelling_a_live_run_stops_it_and_marks_it_cancelled` failed inside\
    \ task-268's scripted finish with `assert 'failed' == 'cancelled'` \u2014 the\
    \ exact race `runner.py`'s `cancel_requested` guard was written to close, still\
    \ open under 32 xdist workers. It cost that finish its whole gate and no merge,\
    \ which is the expensive half."
  intent: Make a cancelled run say `cancelled` every time, so the gate stops going
    red on it.
  description: "## What happened\n\n2026-09-06, `agentjobs finish task-268 --posture-release`,\
    \ gate log `~/.agentjobs/finishes/fin_bc9f16f6/gate.log`, worker `gw23` of 32:\n\
    \n```\ntests/test_dispatch_api.py::TestDispatchRuns::test_cancelling_a_live_run_stops_it_and_marks_it_cancelled\n\
    E   AssertionError: assert 'failed' == 'cancelled'\n1 failed, 4158 passed, 1 skipped\
    \ in 75.34s\n```\n\nThe two assertions before it passed: `stopped is True` and\
    \ `run[\"live\"] is False`. **Only the word is wrong.** The same test passes on\
    \ its own in 1.1s, and the branch under it (`perf/task-268-gate-speed`) touches\
    \ nothing in `src/agentjobs/dispatch/`.\n\n## Why this is not \"just a flake\"\
    \n\n`DispatchRunner._conclude_batch_run` (src/agentjobs/dispatch/runner.py, around\
    \ line 3040) carries a long docstring saying this exact failure was already found\
    \ and closed:\n\n> Killing a batch run wakes this supervisor, which sees a non-zero\
    \ exit and quite reasonably calls it `failed`; the ledger meanwhile writes `cancelled`.\
    \ Both are read-modify-writes of the same meta file and either can land last,\
    \ so a run the human cancelled was reported as failed roughly half the time. **The\
    \ ledger sets the flag before it kills, and this supervisor is blocked in `wait()`\
    \ until then, so the flag is always visible here by the time it matters.**\n\n\
    The bolded sentence is what has to be wrong. Two candidate holes, and the first\
    \ job is to find out which:\n\n1. **The child terminates for its own reasons before\
    \ the cancel arrives.** The test starts `import time; time.sleep(120)` and cancels\
    \ immediately; on a machine running 32 workers the spawn can lose enough time\
    \ that the supervisor concludes first, writes `failed`, and the cancel then finds\
    \ a terminal run. If so, `read_meta()` is being asked a question that was already\
    \ settled and the ordering guarantee never applied.\n2. **The flag is set but\
    \ not visible.** `cancel_requested` and the terminal write are read-modify-writes\
    \ of one meta file from two processes with no lock between them. \"Blocked in\
    \ `wait()` until then\" assumes the flag write completes before the kill takes\
    \ effect and before the supervisor's read.\n\nThis matters beyond the test. **The\
    \ word is shown to a human who has just pressed Cancel** \u2014 that is why the\
    \ guard was written \u2014 and a GUI that says `failed` after a deliberate cancel\
    \ is a lie about what the system did.\n\n## Cost\n\nA red gate is a whole extra\
    \ gate launch, which is 100\u2013250s uncontended and 300\u2013400s paired (docs/performance.md).\
    \ task-339 measured six to nine gate launches per run and half of them red; an\
    \ intermittent failure in a 4159-test suite is a direct contributor to that number."
  constraints: 'Do not fix this by loosening the assertion or by marking the test
    flaky. The assertion is the product requirement -- a cancelled run says cancelled.
    Reproduce it before fixing: run the test under `-n auto` against a loaded machine,
    or drive the race directly, and say in the log which of the two holes it was.'
  out_of_scope: The rest of the dispatch outcome vocabulary, and the three tests that
    reserve an ephemeral port and rebind it from a child (task-268's spec, P3-4),
    which is a different parallel-safety problem in the same suite.
  context:
  - path: src/agentjobs/dispatch/runner.py
    why: _conclude_batch_run and the cancel_requested guard whose docstring claims
      this is closed
  - path: src/agentjobs/dispatch/ledger.py
    why: 'Around line 1246: where the ledger writes CANCELLED and sets the flag before
      killing'
  - path: tests/test_dispatch_api.py
    why: The failing test, around line 569
