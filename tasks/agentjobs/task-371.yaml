spec:
  summary: "Apply the eight amendments docs/analytics-design.md section 6 asks of\
    \ task-273's schema and task-311's import. Four are required \u2014 without them\
    \ the backlog chart is wrong in ways no query plan reveals \u2014 and four are\
    \ cheap-now columns and indexes."
  intent: This is the coordination task-273's constraints require ("coordinate the
    schema/history contract with task-213 before freezing it") and the owner's answer
    to its fourth fork set up ("run task-213 next, then build", without a blocking
    edge). Every item was found by measuring the drafted schema against the real 367-task
    corpus, not by reading it. Two of them are import rules, and an import that has
    already run without them produces a store whose history is wrong and whose queries
    all look healthy.
  description: "Read **`docs/analytics-design.md` section 6** \u2014 it is the whole\
    \ specification, with each item's measurement in sections 4 and 5. Do not re-derive\
    \ them.\n\n**Required (\xA76.1). The store is wrong without these.**\n\n- **A.\
    \ Clamp a backfilled creation instant to the earliest evidence** \u2014 `min(git\
    \ commit time, the task's own `created`, its first log entry)` \u2014 never commit\
    \ time alone. \xA74.3. Git records when a change was *committed*, not when it\
    \ happened; three tasks in this corpus log a close twenty hours before git first\
    \ sees the file, and replayed literally the backlog series opens at **\u22123**.\
    \ A negative open count is impossible and no reader could diagnose it. Applying\
    \ the clamp removed it (series minimum 1) *and* improved replay fidelity from\
    \ 44 to 41 disagreeing tasks. Belongs to task-311's import.\n- **B. Restrict the\
    \ git backfill to axes the log does not record.** \xA74.4. Lifecycle and outcome\
    \ come from the log, always; priority, parent, category and `archived` come from\
    \ git; `queue_position` takes both, de-duplicated against any native move of the\
    \ same axis within five minutes. Backfilling lifecycle as well double-counts every\
    \ close: measured `SUM(open_delta)` = **69 against 125 open tasks**, a 45% error,\
    \ with no hint in any query plan. Belongs to task-311's import.\n- **C. `project.reporting_tz`\
    \ holds an IANA zone name, not a UTC offset.** \xA73.5. The column exists; this\
    \ fixes what goes in it. `America/Chicago` is right all year, `-06:00` is right\
    \ for half of it.\n- **D. Assert the reconciliation invariant in the store's own\
    \ suite** \u2014 `SUM(open_delta)` equals `COUNT(*)` of open tasks \u2014 after\
    \ import, after backfill, and after a backup/restore round trip. Task-273 proposes\
    \ it; the analytics page depends on it, so it is a dependency rather than a suggestion.\n\
    \n**Requested (\xA76.2). Cheap now, a migration later.**\n\n- **E.** `CREATE INDEX\
    \ ix_task_counts ON task(project_id, lifecycle, ball, outcome)` \u2014 the five-count\
    \ summary, measured 14.6 ms \u2192 **1.68 ms** at 20x scale (covering index instead\
    \ of `SCAN task`).\n- **F.** `CREATE INDEX ix_event_source ON task_event(project_id,\
    \ source, ts)` \u2014 the history-coverage query, 21.9 ms \u2192 **6.58 ms** at\
    \ 20x. It runs on every analytics page load despite looking like metadata.\n-\
    \ **G.** Make the `task.parent_id` self-reference `DEFERRABLE INITIALLY DEFERRED`.\
    \ Found while loading the corpus: a bulk insert fails unless children follow parents,\
    \ and an importer should not have to topologically sort a task graph. Costs nothing;\
    \ the constraint still holds at commit.\n- **H.** Populate `mechanical` at import,\
    \ not merely define it. The page uses it to keep a 132-file bulk renumber out\
    \ of \"activity\"; a column that is always `0` is worse than absent, because the\
    \ query looks correct.\n\n**Confirmed sufficient \u2014 change nothing (\xA76.3).**\
    \ The nine before/after axes answer every question the page asks. `open_delta`\
    \ carries the backlog level. `ball` needs no generated delta column: its three-way\
    \ running sum is a `CASE` over the partial index `ix_event_ball`, measured at\
    \ 0.46 ms (18.4 ms at 20x). `task_state_daily` stays deferred with its trigger\
    \ unchanged.\n\n**How to land it.** Where task-273's implementation has not started,\
    \ the amendments go into its record and its DDL, and this task's deliverable is\
    \ that edit plus the log entry saying what changed and why. Where it has started,\
    \ they are a migration and a change to the import. Either way, say on task-273\
    \ and task-311 which items landed where."
  constraints: "- Cite `docs/analytics-design.md` sections; do not restate the measurements,\
    \ and do not re-run the probe to re-derive them.\n- Items A and B are rules for\
    \ task-311's import path, not for the schema. Do not implement them as query-time\
    \ corrections \u2014 the page must not have to repair the store on every read.\n\
    - Do not add a generated `ball_delta` column or any of the other things \xA76.3\
    \ confirms as unnecessary. More stored columns is the easy mistake here.\n- Do\
    \ not reopen the authoritative-SQLite decision or the restart-window decision.\
    \ Both are settled on task-273 (entries 4, 5, 6, 9, 12) and named there as not\
    \ to be relitigated."
  out_of_scope: Implementing the storage backend (task-273) or the migration (task-311).
    Building the analytics API or page. Any schema change not named in section 6.
