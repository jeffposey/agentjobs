spec:
  summary: Build GET /api/projects/{project_id}/analytics, returning the backlog level
    and its flows, throughput and cycle time, the age distribution and oldest work,
    where work is stuck, and an explicit statement of how much history is real. One
    request for the whole page.
  intent: The page is a single screen read on a phone over Tailscale, and its panels
    share a range, a timezone and a coverage statement that must be identical across
    all of them. Splitting them into seventeen endpoints would be seventeen chances
    to render half a page and one more way for two panels to disagree about what history
    exists. The storage cost of the whole set is 6.3 ms, so there is nothing to save
    by splitting it.
  description: "Implement **`docs/analytics-design.md` section 7** exactly \u2014\
    \ the response models there are the contract, and sections 3 and 5 hold the semantics\
    \ and the measured SQL behind them.\n\n**The endpoint.** `GET /api/projects/{project_id}/analytics?range=90d`,\
    \ `range` \u2208 `30d | 90d | 12m | all`, default `90d`. Read-only. Mounted in\
    \ `PROJECT_SCOPED_ROUTERS` like every other task-facing router, so it serves at\
    \ both the unscoped and scoped forms per `api/main.py`.\n\n**The models are the\
    \ deliverable as much as the handler.** `npm run generate:api-client` regenerates\
    \ `frontend/src/api/generated/` from `openapi.json`, and the `api` stage of `scripts/check.py`\
    \ compares both against the working tree \u2014 so every model in \xA77.3 is a\
    \ named Pydantic class in `src/agentjobs/api/models.py`. An inline `dict` generates\
    \ anonymous TypeScript and is not acceptable.\n\n**The semantics are settled and\
    \ are not yours to re-decide** (\xA73, and \xA714's decision list):\n\n- Open\
    \ is `lifecycle <> 'closed'`, drafts included. The level is a running sum of `open_delta`,\
    \ which makes reopening correct by construction.\n- Completed is `outcome == 'completed'`,\
    \ never merely closed. Return `tasks_completed` (`COUNT(DISTINCT task_id)`) and\
    \ `completion_events` (`COUNT(*)`) separately; they differ by two in today's corpus.\n\
    - Archived tasks count in the level and are excluded from aging, oldest and stuck.\n\
    - **Day bucketing happens here, in Python, with `zoneinfo` and the project's IANA\
    \ reporting zone \u2014 never with SQLite's `date(ts, :offset)`.** \xA73.5 measures\
    \ why: a fixed offset is wrong for half of every year, the correct SQL alternative\
    \ costs 58.8 ms, and this costs 0.91 ms.\n- The API fills the calendar spine.\
    \ Only 8% of days in this corpus carry a backlog event; a series returned as grouped\
    \ rows would misrepresent the other 92%.\n- Unknown history is never zero. Series\
    \ start at `coverage.baseline_at`; `estimated` is set per bucket, not per response.\n\
    \n**SQL.** \xA75.2 gives the two headline queries verbatim, with the opening-balance\
    \ query that lets a windowed series start at the right level (0.031 ms at 20x\
    \ scale). Every query is an indexed scan and none touches a JSON column \u2014\
    \ keep it that way, and capture `EXPLAIN QUERY PLAN` for anything you add.\n\n\
    **Two tests that are the point of the task, not extras:**\n\n- `AnalyticsTotals`\
    \ equals `build_dashboard_snapshot(...)[\"stats\"]` field for field on the same\
    \ corpus. Demonstrated once in \xA75.3; as a test it is what stops the two drifting\
    \ apart silently.\n- `SUM(open_delta)` equals `COUNT(*)` of open tasks. If task-371\
    \ has already put this in the store's suite, assert it here through the API's\
    \ own read path as well \u2014 the page is the thing that goes visibly wrong when\
    \ it fails.\n\n**Errors (\xA77.4).** A project with no events is `200` with empty\
    \ series and `coverage.baseline_at` null, not an error. Do not inherit `dashboard.py`'s\
    \ `QueueCorruptionError` handling: nothing here reads the queue order, and offering\
    \ the repair command from this page would be noise."
  constraints: '- **This cannot be finished before task-273''s storage exists, and
    must not be faked.** The endpoint''s entire value is that it does not parse task
    documents. If the store is not there yet, say so and hand the ball back rather
    than shimming a YAML implementation that will be thrown away and whose numbers
    would be misleading in the meantime.

    - No query may scan a task document or touch a JSON column. Record the plan for
    every query you add.

    - Named Pydantic models only; the generated client is part of the gate.

    - Do not add panels beyond section 7.3''s response. Section 8.7''s deferred panels
    have triggers; none has fired.'
  out_of_scope: "The page and its charts (a later child). The Dashboard entry point.\
    \ Cross-project or per-actor analytics, which the parent excludes. An arbitrary\
    \ date-range parameter \u2014 section 7.1 explains why the four presets are the\
    \ whole surface for now."
  context:
  - path: docs/analytics-design.md
    why: Section 7 is the specification; section 3 the semantics; section 5 the measured
      SQL and its plans.
  - path: src/agentjobs/api/routes/dashboard.py
    why: The shape a read-only projection route takes here, and where the stats object
      it must reconcile with is assembled.
  - path: src/agentjobs/dashboard.py
    why: 'build_dashboard_snapshot: the definition of each count the totals object
      must not silently change.'
  - path: src/agentjobs/api/main.py
    why: PROJECT_SCOPED_ROUTERS and the double mount every task-facing router gets.
