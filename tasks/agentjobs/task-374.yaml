spec:
  summary: "Put one text link, \"Analytics \u2192\", on the Dashboard's existing \"\
    Active tasks\" heading row, reaching the analytics page. One link, zero new vertical\
    \ pixels, and the Dashboard still never scrolls."
  intent: Task-294 removed the five count tiles outright and deliberately created
    no route, no link and no placeholder, leaving the entry point to this epic. Nothing
    on the Dashboard currently points at the analytics page, so until this lands the
    page is reachable only by typing a URL. It is last in the sequence because a link
    to a page that does not exist is the one thing task-294 refused to leave behind.
  description: "Implement **`docs/analytics-design.md` section 11**.\n\n**The link.**\
    \ `Analytics \u2192` on `Dashboard.tsx`'s existing `<div className=\"flex items-baseline\
    \ justify-between gap-4 \u2026\">` \u2014 the row holding the `Active tasks (n)`\
    \ heading and the `View all n \u2192` link. The two links become a `flex items-baseline\
    \ gap-3` group on the right, with `Analytics \u2192` **first**, so the existing\
    \ link keeps the edge position a reader's thumb already knows. Same `touch-target\
    \ text-xs text-blue-400` treatment as its neighbour.\n\n**Why there, and not the\
    \ two alternatives, is settled in \xA711.** In short: the heading row already\
    \ exists and already carries a right-aligned link, so the entry point costs **zero\
    \ vertical pixels** \u2014 which matters because `frontend/e2e/dashboard-one-screen.spec.ts`\
    \ asserts the Dashboard never scrolls and task-294 has just spent a task reclaiming\
    \ that space. It is also at the point of removal, which is what the parent's `sc-2`\
    \ asks for.\n\n**Rejected, with its reason, so it is not relitigated by accident:**\
    \ a `PrimaryNav` destination. More discoverable and free of Dashboard cost, but\
    \ `NAV_INLINE_MIN_PX` is a **measured** 1140px and is a function of the row's\
    \ contents \u2014 task-338's attention badge moved it from 1090. Another destination\
    \ moves it again, dropping every desktop window between 1140 and the new value\
    \ into the burger. That is the wrong price for a page opened weekly. Its reopen\
    \ trigger is the page becoming something opened from the Tasks or Runs surfaces\
    \ rather than from the Dashboard. An unlabelled icon was also rejected: a glyph\
    \ for a page nobody has seen is a guess, and the word costs about sixty pixels\
    \ of a row that has room.\n\n**Verification is the whole risk here.** Re-run `dashboard-one-screen.spec.ts`\
    \ and confirm the Dashboard still fits at every width it covers, then check by\
    \ hand at 320px, 390px and 768px that the heading row's wrap \u2014 existing behaviour\
    \ for `View all n \u2192` \u2014 is acceptable rather than ugly. Stand the change\
    \ up on its own port with seeded data and give Jeff a URL; a diff and a green\
    \ suite are not a review request for something visible in a browser."
  constraints: '- The Dashboard must still never scroll. Adding a row, a banner or
    a tile is a failure of this task, not a variation on it.

    - Do not add a PrimaryNav destination. Section 11 rejects it with a measured cost
    and a reopen trigger; firing that trigger is a decision to record, not a tidy-up.

    - Do not reintroduce the count tiles in any form, collapsed or otherwise. Task-294
    rejected a collapsed line and the reasoning stands.

    - Verify in a browser, not only in jsdom.'
  out_of_scope: The analytics page itself and the route registration, which belong
    to the page child. Any other change to the Dashboard.
  context:
  - path: docs/analytics-design.md
    why: Section 11 is the specification, with the rejected alternatives and their
      reopen triggers.
  - path: frontend/src/components/Dashboard.tsx
    why: The Active tasks heading row the link joins.
  - path: frontend/e2e/dashboard-one-screen.spec.ts
    why: The assertion that the Dashboard never scrolls, which this change must not
      break.
  - path: frontend/src/components/PrimaryNav.tsx
    why: NAV_INLINE_MIN_PX and why a nav destination was rejected.
