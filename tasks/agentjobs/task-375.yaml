spec:
  summary: When a dispatch resumes an existing session instead of starting a cold
    one, the run record gets the new posture but the session receives only the ball
    prompt. It keeps operating under the posture clause from its original prompt.
    An epic dispatched `autonomous` therefore has its children hand off for review,
    and the walk stops with `child_needs_a_human` on a branch it was authorised to
    merge.
  intent: 'Posture reaches a session exactly once, in the prompt that starts it (ALLAGENTS.md,
    "Your prompt says whether you stop here"). A resume writes no prompt, so the one
    channel posture travels on is silently skipped and the record''s posture and the
    session''s operative posture diverge with nothing anywhere reporting the mismatch.
    task-022''s epic walk is the feature most exposed: its whole value is merging
    children unattended on one authorisation, and a resumed child cannot do that.'
  description: "## What happened\n\nObserved 2026-09-07 on the task-358 epic walk\
    \ (`run_2acfe100`).\n\nJeff dispatched task-358 at posture `autonomous`, above\
    \ this project's `auto`. The walk started child task-273 and recorded, on task-273's\
    \ own log:\n\n- **entry 39** (note): \"They chose posture `autonomous` for the\
    \ epic, so this run gets it too.\"\n- **entry 41** (dispatch): `posture: autonomous`,\
    \ `posture_source: epic`, body: \"Resumed the session from run `run_8ad284df`\
    \ rather than starting a cold one... The ball prompt was delivered to it as its\
    \ next turn.\"\n\nThe `argv` on entry 41 is `--resume c3b3a806-...` with **no\
    \ prompt string at all**. The two earlier runs that created and last drove that\
    \ session \u2014 `run_1039616a` and `run_8ad284df` \u2014 both carry `posture:\
    \ auto`, `posture_source: project`, so their prompts carried the \"Posture `auto`\
    \ stops at the merge gate\" clause.\n\nThe child then wrote in its handoff (entry\
    \ 43): **\"Nothing merged; posture prompt said hand off.\"** It was right \u2014\
    \ `auto` was the only posture clause it had ever been told. The walk exited 1\
    \ with `child_needs_a_human` on a branch carrying a green unqualified gate that\
    \ the epic's authorisation already covered.\n\n## Why it is not just a lost merge\n\
    \nThe record asserts a posture the session never received, and nothing reports\
    \ the divergence. A reader of task-273 would conclude the child was autonomous\
    \ and chose to hand off on judgement \u2014 the one reading ALLAGENTS.md invites,\
    \ and the wrong one. That misreads the child's report and, in the other direction,\
    \ would let someone conclude a child merged under an authorisation it never had.\n\
    \nIt also silently defeats task-022: an epic walk's value is merging children\
    \ unattended on one authorisation, and any child whose session gets resumed cannot\
    \ do that.\n\n## The fix is a choice, and it should be made deliberately\n\nBoth\
    \ directions are defensible and they trade differently:\n\n1. **Deliver the posture\
    \ clause on resume** \u2014 prepend the same clause the cold prompt carries to\
    \ the resumed turn's text. Cheap; keeps resume's context saving. But it raises\
    \ a live session's posture mid-flight, which is a real authorisation question:\
    \ the session may already have made decisions under the lower posture.\n2. **Refuse\
    \ to resume across a posture change** \u2014 start a cold session when the resolved\
    \ posture differs from the one the session last ran under. Safer and self-evidently\
    \ correct; loses the worktree and context that made resume worth doing.\n\nEither\
    \ way, **the record must stop asserting a posture the session was not told**:\
    \ if the dispatcher cannot deliver it, the entry should say what the session is\
    \ actually operating under, not what was resolved.\n\n## Where to look\n\n`agentjobs\
    \ dispatch` builds prompts and decides resume-versus-cold. The posture clause\
    \ is the \"Posture `auto` stops at the merge gate\" / \"Posture `autonomous` releases\
    \ the merge gate\" text; find where it is composed and follow the resume path\
    \ past it."
  constraints: Do not raise a running session's posture without deciding, on the record,
    whether that is an authorisation change. Whatever is chosen, the dispatch log
    entry must not claim a posture the session was never told.
  out_of_scope: Redesigning posture itself (task-021 settled it). The epic walk's
    retry and grounding rules (task-022). Codex resume policy (task-283) except where
    it shares the code path.
  context:
  - path: tasks/agentjobs/task-273.yaml
    why: 'Entries 39, 41 and 43 are the reproduction: the record says autonomous,
      the argv carries no prompt, the child says its prompt told it to hand off.'
  - path: tasks/agentjobs/task-358.yaml
    why: The epic whose walk stopped on this. Its log has the supervisor's account.
  - path: ALLAGENTS.md
    why: "\"Your prompt says whether you stop here\" \u2014 the rule that makes the\
      \ prompt posture's only channel."
  - path: docs/agent-dispatch-design.md
    why: The epic walk (task-022) and what an unattended chain of child merges depends
      on.
