  text: The importer detects a record field carrying a verbatim quote with informal
    or frustrated tone and refuses or quarantines it, with the chosen behaviour and
    its false-positive trade-off recorded as a decision entry.
  status: pending
- id: ac-2
  text: The same check runs over `tasks/` in the gate, so an author is told before
    the record is committed rather than at import.
  status: pending
- id: ac-3
  text: "A supported redaction path exists for a field and for a log entry body, records\
    \ that a redaction happened and by whom, and re-serialises the file canonically\
    \ \u2014 replacing the hand-splice used on 2026-09-07."
  status: pending
- id: ac-4
  text: ALLAGENTS.md states the paraphrase-by-default rule where it gives logging
    guidance.
  status: pending
- id: ac-5
  text: The corpus is clean by the detector's own measure, and the six regions already
    rewritten are re-saved canonically through the new redaction path.
  status: pending
- id: ac-6
  text: No test, fixture or commit message reproduces any of the removed wording;
    detector test cases are synthetic.
  status: pending
