spec:
  summary: 'task-311 built and verified the cutover, but the one path it never exercised
    end to end is the one AgentJobs is judged on: dispatch a run, let an agent work,
    let the scripted finish merge and close it, all on a project whose records are
    rows. Prove that, then run the production cutover.'
  intent: 'The cutover machinery is merged and the sandbox proved the storage half:
    two worktrees, one backlog, a restart, a backup, a rollback. What it did not prove
    is a dispatch. Dispatch is the product, and it is also the one family that keeps
    a direct-to-storage path (task-311, entry 13) -- so it is simultaneously the least
    tested and the most exceptional part of the migration. Cutting the owner''s live
    tracker over before that is exercised would put the thing they depend on most
    on an untested path.'
  description: '## Part one: exercise a dispatch on a migrated project


    An integration test, not a manual run, and it does not need to spend money: the
    dispatch tests already stand up a configured runner that echoes. Against a project
    cut over to SQLite:


    1. `dispatch_task` passes its guards, claims the task and records the `dispatch`
    entry **in the store**, with the run row derived from it.

    2. The clean-tree check excludes nothing and still passes -- `task_file_exclusions`
    returns `[]` for a migrated project, so the check now covers the whole tree.

    3. The terminal `dispatch_result` lands, and `commit_task_record` reports there
    is nothing to commit rather than failing.

    4. `agentjobs finish --posture-release` rebases, gates, merges, closes the task
    in the store, and leaves the checkout clean.

    5. The epic walk starts a child and watches its **task record** to a terminal
    state, reading the store rather than a file.


    Step 5 is the one worth designing carefully: the walk polls the record, and a
    supervisor running older code would poll a frozen file instead. Assert on what
    the walk observes, not on what the store holds.


    ## Part two: the production cutover


    Once part one holds:


    ```

    agentjobs storage status

    agentjobs stop --port 8876

    agentjobs storage preview --project agentjobs

    agentjobs storage cutover --project agentjobs --port 8876

    ```


    Then restart through the launcher (`C:/ai/shared/launchers/open-agentjobs.ps1`),
    read the dashboard, take and verify a backup, and only then consider retiring
    the tracked files -- which is a further deliberate step documented in the storage
    guide.


    **Quiesce first and check for company.** `git worktree list` and `agentjobs branches`
    must be empty of other people''s work: a peer session running pre-cutover code
    would keep writing YAML nothing reads, silently. That is the failure mode this
    task exists to avoid.


    **The other four registered projects stay on files** unless separately cut over,
    and `agentjobs storage status` prints both counts for each so the mixed state
    is legible rather than surprising.


    ## Rollback


    `agentjobs storage rollback --project agentjobs` exports the store''s current
    state back to the tasks directory -- including anything written after the cutover
    -- and points the project at its files again. The database is kept.'
  constraints: 'Do not run the production cutover until part one passes. Do not retire
    the tracked files in the same act as the cutover: they are what a rollback would
    otherwise have to reconstruct. Take and verify a backup before relying on the
    store, as the storage guide''s enrolment checkpoint says.'
  out_of_scope: Moving the dispatch subsystem inside the server -- that is the separate
    question task-311 entry 13 raises. Cutting over the other four registered projects.
    Retiring the tracked task files.
  context:
