spec:
  summary: 'The storage migration left dispatch as the one CLI family that still opens
    the database directly. Three security guards make it so, and the alternative is
    a real architectural change: the dispatch verbs become thin launchers and the
    epic walk runs server-side.'
  intent: A recorded owner decision (task-273, entry 6, item 3) says every CLI verb
    becomes a service client so only the server opens the database. task-311 honoured
    that for every task and queue verb and could not honour it for dispatch without
    weakening three guards that three separate tasks built. It took the narrow exception
    and recorded why (task-311, entry 13). This task is where that stays a decision
    somebody made rather than a shortcut that hardened into an assumption.
  description: "## What blocked the literal reading\n\nEach of these is a deliberate\
    \ guard, and each says the same thing:\n\n1. **A run credential scopes an HTTP\
    \ caller to its own task** (task-332). `agentjobs dispatch walk` runs *as* a supervisor\
    \ session and starts *other* tasks' runs, so over HTTP every child is `wrong_task`.\
    \ `docs/authorization.md` states the CLI is outside that gate by construction.\n\
    2. **`argv` may not appear in a dispatch schema.** `tests/test_dispatch_api.py::test_no_dispatch_request_body_accepts_a_command_to_run`\
    \ forbids it, on the ground that a schema is the execution surface whatever today's\
    \ page sends.\n3. **One authorization per dispatch.** `DispatchRequestBody._one_authorization`\
    \ refuses a body that could claim a run rides a parent's authorization when it\
    \ does not \u2014 which is exactly what `trigger` and `on_behalf_of_parent` on\
    \ that body would allow.\n\n## The three ways out\n\n**(a) Keep the exception.**\
    \ What is shipped. `store_factory.dispatch_manager_for` is the only place that\
    \ takes it, it refuses when a schema migration is pending, and the concurrency\
    \ argument against it is not a correctness argument for this store: WAL plus `busy_timeout`\
    \ is what SQLite provides multi-process access with, and every invariant is a\
    \ constraint in the database rather than a Python validator.\n\n**(b) Widen the\
    \ surfaces.** Suppress the run credential in the CLI's client and add the three\
    \ fields. Honours the letter of entry 6 and costs all three guards. Probably wrong,\
    \ but it should be rejected explicitly rather than by omission.\n\n**(c) Dispatch\
    \ moves inside the server.** The CLI's dispatch verbs become thin launchers of\
    \ a server-side operation and the epic walk runs in the server process, which\
    \ is where the poller and the Dispatch button already are. Honours entry 6 without\
    \ touching a guard, and is the largest of the three.\n\n## What this task owes\n\
    \nA decision entry naming the choice, the rejected alternatives and the reasoning\
    \ \u2014 and, if (c), a design before any code. It is not urgent: (a) is shipped,\
    \ tested and bounded. It is worth deciding rather than inheriting."
  constraints: 'Do not weaken the run-credential scope, the argv rule or the one-authorization
    validator as a side effect of a storage decision. If (c) is chosen, design before
    code: moving the epic walk into the server changes what happens to a walk when
    the server restarts, and that question has to be answered first.'
  out_of_scope: Re-deciding that SQLite is authoritative. The cutover itself.
  context:
  - path: src/agentjobs/store_factory.py
    why: dispatch_manager_for carries the whole argument for the exception in its
      docstring.
  - path: docs/authorization.md
    why: States that the CLI is outside the capability gate by construction, which
      is what option (b) would change.
