spec:
  summary: Review and approve the proposed PostgreSQL schema for user authentication,
    including multi-provider OAuth2 support and security policies.
  description: "## Context\nWe need to implement a robust user authentication system\
    \ supporting multiple OAuth2 providers (Google, GitHub, Microsoft).\n\n## Proposed\
    \ Schema\n\n### users table\n- id (uuid, primary key)\n- email (varchar, unique)\n\
    - display_name (varchar)\n- avatar_url (varchar, nullable)\n- created_at (timestamp)\n\
    - updated_at (timestamp)\n\n### oauth_accounts table\n- id (uuid, primary key)\n\
    - user_id (uuid, foreign key to users)\n- provider (varchar: 'google', 'github',\
    \ 'microsoft')\n- provider_user_id (varchar)\n- access_token (text, encrypted)\n\
    - refresh_token (text, encrypted, nullable)\n- expires_at (timestamp, nullable)\n\
    - created_at (timestamp)\n- updated_at (timestamp)\n\n### sessions table\n- id\
    \ (uuid, primary key)\n- user_id (uuid, foreign key to users)\n- token (varchar,\
    \ unique, indexed)\n- expires_at (timestamp)\n- created_at (timestamp)\n\n## Security\
    \ Considerations\n- All tokens encrypted at rest using AES-256\n- Session tokens\
    \ rotated every 24 hours\n- Refresh tokens support optional (depends on provider)\n\
    \n## Questions for Human Review\n1. Should we support multiple OAuth accounts\
    \ per user (same provider)?\n2. Do we need audit logging for authentication events?\n\
    3. What's the session timeout policy? (currently 24h)\n\n---\n\n## Starter prompt\
    \ (migrated from schema v1)\n\nDesign a PostgreSQL schema for user authentication\
    \ supporting OAuth2 providers (Google, GitHub, Microsoft).\n---\n\n## Phases (migrated\
    \ from schema v1)\n\n`phases[]` was deleted in v2; sub-tasks via `parent` are\
    \ the one way to\nsubdivide. This is the historical record, preserved verbatim.\n\
    \n- **Schema Design** (`phase-1`, completed)\n  - Completed initial schema design\
    \ based on OAuth2 best practices.\n  - completed 2025-10-25T17:44:03.663057Z\n\
    - **Human Review & Approval** (`phase-2`, waiting_for_human)\n  - Schema ready\
    \ for review. Awaiting feedback on multi-account support and audit logging requirements.\n\
    - **Implementation** (`phase-3`, draft)\n  - Create migration scripts and ORM\
    \ models after approval."
