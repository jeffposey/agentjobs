spec:
  summary: 'Approve rate limiting strategy: 100 req/min for free tier, 1000 req/min
    for paid tier. Decide penalty box duration to unblock engineering.'
  description: "## Objective\nProtect our public API from abuse while ensuring good\
    \ UX for legitimate users.\n\n## Proposed Strategy\n\n### Rate Limits by Tier\n\
    - **Free tier**: 100 requests/minute, 10,000 requests/day\n- **Paid tier**: 1,000\
    \ requests/minute, 100,000 requests/day\n- **Enterprise**: Custom limits (negotiated\
    \ per contract)\n\n### Implementation\n- Use Redis for distributed rate limiting\
    \ (sliding window)\n- Return HTTP 429 with `Retry-After` header when exceeded\n\
    - Include rate limit info in response headers:\n  - `X-RateLimit-Limit`: Maximum\
    \ requests allowed\n  - `X-RateLimit-Remaining`: Requests remaining in window\n\
    \  - `X-RateLimit-Reset`: Unix timestamp when limit resets\n\n### Penalty Box\
    \ (NEEDS DECISION)\nWhen users repeatedly exceed limits:\n- **Option A**: 15-minute\
    \ cooldown (recommended for good UX)\n- **Option B**: 1-hour escalating penalty\
    \ (stronger deterrent)\n- **Option C**: No penalty box, just standard limiting\n\
    \n### Edge Cases\n- Burst allowance: Allow 20% burst above limit for 5 seconds\n\
    - Whitelisted IPs (internal services, monitoring): No limits\n- Rate limit bypass\
    \ for emergencies: Admin override flag\n\n## Questions\n1. Which penalty box strategy?\
    \ (A, B, or C)\n2. Should we log rate limit violations for security monitoring?\n\
    3. Do we need per-endpoint limits (e.g., auth endpoints more strict)?\n\n---\n\
    \n## Starter prompt (migrated from schema v1)\n\nDesign and implement rate limiting\
    \ for our public API to prevent abuse.\n---\n\n## Phases (migrated from schema\
    \ v1)\n\n`phases[]` was deleted in v2; sub-tasks via `parent` are the one way\
    \ to\nsubdivide. This is the historical record, preserved verbatim.\n\n- **Research\
    \ & Design** (`phase-1`, completed)\n  - Researched industry standards (Stripe,\
    \ GitHub, Twilio). Designed sliding window algorithm with Redis.\n  - completed\
    \ 2025-10-25T17:44:03.663057Z\n- **Policy Approval** (`phase-2`, waiting_for_human)\n\
    \  - Need human decision on penalty box strategy and per-endpoint limit strategy."
