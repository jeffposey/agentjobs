spec:
  summary: Fixed memory leak caused by unclosed event listeners in WebSocket connections.
  description: "## Problem\nWebSocket handler was leaking ~50MB/hour due to event\
    \ listeners not being cleaned up on disconnect.\n\n## Solution\n- Added cleanup\
    \ handler for connection close events\n- Implemented WeakMap for connection tracking\n\
    - Added memory usage monitoring\n\n## Results\n- Memory usage stable at ~200MB\
    \ (was growing to 2GB+ daily)\n- No more daily restarts required\n- Performance\
    \ improved by 15%\n\n---\n\n## Starter prompt (migrated from schema v1)\n\nDebug\
    \ and fix memory leak in WebSocket handler.\n---\n\n## Phases (migrated from schema\
